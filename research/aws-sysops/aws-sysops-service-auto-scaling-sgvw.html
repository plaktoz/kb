<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-auto-scaling", "exam": "aws-sysops", "facet": {"key": "service", "value": "auto-scaling"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-74d0b20479f9", "source_question_ids": ["awssysops-p1-q003"], "statement": "An Auto Scaling group only launches instances into the Availability Zones (subnets) it is configured to use.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4454d72198a1", "source_question_ids": ["awssysops-p1-q003"], "statement": "Attaching an ELB to an Auto Scaling group does not change which Availability Zones the group launches instances into.", "status": "supported"}, {"claim_type": "rule", "conditions": ["ELB shows healthy instances concentrated in one AZ and none in another, with zero unhealthy instances"], "confidence": "high", "id": "cl-89c29e54fd36", "source_question_ids": ["awssysops-p1-q003"], "statement": "To balance Auto Scaling instances across Availability Zones when one AZ has zero instances and none are unhealthy, configure the Auto Scaling group with subnets in both AZs.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9a38986587f3", "source_question_ids": ["awssysops-p1-q003"], "statement": "Raising an Auto Scaling group's maximum size does not force new instance launches into an underused Availability Zone.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application needs very high message throughput to/from SQS"], "confidence": "high", "id": "cl-c719bdb2fd5e", "source_question_ids": ["awssysops-p1-q004"], "statement": "Scaling the consumer/producer EC2 fleet (via an Auto Scaling group with triggers watching queue depth, e.g. ApproximateNumberOfMessagesVisible) is the most scalable way to raise aggregate throughput between EC2 and SQS.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ddb93ea39149", "source_question_ids": ["awssysops-p1-q004"], "statement": "An Elastic Load Balancer does not improve throughput between EC2 instances and SQS, because there is no inbound traffic to SQS for an ELB to distribute.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-18e92d1fc8a0", "source_question_ids": ["awssysops-p1-q004"], "statement": "EBS-optimized instances improve EBS disk I/O, not throughput to the SQS API endpoint.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-692ae06ed096", "source_question_ids": ["awssysops-p1-q004"], "statement": "Enabling a public IP address on an instance affects internet reachability, not throughput to the SQS API endpoint.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6492a4c28d0c", "source_question_ids": ["awssysops-p1-q007"], "statement": "AWS guidance reserves ELB pre-warming for sudden flash-traffic spikes, not for a gradual, forecastable ramp in traffic over multiple weeks.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-30888be1e555", "source_question_ids": ["awssysops-p1-q007"], "statement": "Trusted Advisor and Service Quotas show EC2 quotas, which for On-Demand instances are measured in vCPUs per instance family per Region; they may need a quota increase before a planned large scale-out.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["Auto Scaling group's health check type is set to EC2 only"], "confidence": "high", "id": "cl-f3096f50a1b8", "source_question_ids": ["awssysops-p1-q008"], "statement": "An Auto Scaling group can be configured to use simple EC2 status checks only, or combined EC2-plus-ELB health checks; if only EC2 checks are used, the Auto Scaling group ignores ELB 'unhealthy' verdicts entirely.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["Auto Scaling group's health check type includes ELB"], "confidence": "high", "id": "cl-9021c6e1d856", "source_question_ids": ["awssysops-p1-q008"], "statement": "Adding the ELB health check type to an Auto Scaling group's health check configuration is what makes the group terminate and replace instances that the ELB has marked unhealthy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["Auto Scaling group's health check type is set to EC2 only"], "confidence": "medium", "id": "cl-158e9339e5f7", "source_question_ids": ["awssysops-p1-q008"], "statement": "Changing an Auto Scaling group's health check thresholds, changing the ELB health check interval, or switching the ELB's check protocol does not fix an Auto Scaling group ignoring ELB health-check verdicts when its health check type is set to EC2 only.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb168dcb42b2", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Internet Gateway (IGW) is inherently redundant/highly available at the VPC level, so adding a second IGW does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the ELB has a subnet enabled in each Availability Zone"], "confidence": "high", "id": "cl-9e7c6e9ed7b5", "source_question_ids": ["awssysops-p1-q010"], "statement": "An ELB spans only the Availability Zones you enable on it (one subnet per AZ); with a subnet enabled in each of multiple AZs it is already redundant, so adding a second ELB does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b3aa5da8e2c", "source_question_ids": ["awssysops-p1-q010"], "statement": "A multi-AZ RDS instance already fails over automatically to a standby in a second Availability Zone, so it is not itself a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the web tier runs in an Auto Scaling group spanning multiple AZs", "the ELB has a subnet in each AZ"], "confidence": "medium", "id": "cl-0305ade11d31", "source_question_ids": ["awssysops-p1-q010"], "statement": "In an architecture with an IGW, an ELB with a public subnet in each AZ, a web tier in a multi-AZ Auto Scaling group, and a Multi-AZ RDS instance, there is no remaining single point of failure to fix.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances need to call the CloudWatch PutMetricData API"], "confidence": "medium", "id": "cl-3c391f50cc4e", "source_question_ids": ["awssysops-p1-q012"], "statement": "Specifying an IAM role (through an instance profile) in the Auto Scaling group's launch template (formerly a launch configuration, now deprecated) is the AWS-recommended way to let instances authenticate CloudWatch PutMetricData calls, using auto-rotated credentials from the instance metadata service.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6c0e7c9cf67b", "source_question_ids": ["awssysops-p1-q012"], "statement": "Creating an IAM user and injecting its credentials into instance User Data or a private repository means distributing and rotating static long-lived secrets by hand, which is not the recommended authentication approach for instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-81c2f9cee3ef", "source_question_ids": ["awssysops-p1-q012"], "statement": "CloudWatch has no metric-level resource policy that can grant PutMetricData permission to instances from an Auto Scaling group.", "status": "supported"}, {"claim_type": "rule", "conditions": ["bastion host must be highly available without human intervention"], "confidence": "high", "id": "cl-9051dabb6b29", "source_question_ids": ["awssysops-p1-q026"], "statement": "An Auto Scaling group with min-size=1 and max-size=1 spanning multiple Availability Zones gives a bastion host self-healing high availability with zero human intervention, because the ASG's health checks detect failure and automatically launch a replacement in a healthy AZ.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3777323949f7", "source_question_ids": ["awssysops-p1-q026"], "statement": "A standby AMI needs a human to launch it, and two static bastion instances are never automatically replaced when one fails; only an Auto Scaling group (min = max = 1, spanning multiple AZs) self-heals the bastion without human intervention.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-59f08028b5d8", "source_question_ids": ["awssysops-p1-q026"], "statement": "An ELB load-balances traffic across healthy targets but does not itself replace a failed bastion instance.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed continuously, every day"], "confidence": "medium", "id": "cl-ea62d5f72ed0", "source_question_ids": ["awssysops-p1-q029"], "statement": "Baseline capacity needed every day of the year is most cost-effectively covered by Reserved Instances or Savings Plans; the 'heavy utilization' RI type was retired in 2014 in favor of No/Partial/All Upfront payment options.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["capacity is needed frequently but not every single day"], "confidence": "high", "id": "cl-f03278a6db54", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed on most days but not every day is reasonably covered by On-Demand Instances, since it is used too often to leave unreserved but not continuously enough to justify another year-long Reserved Instance commitment.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed only a few days per year", "the workload requires full availability"], "confidence": "medium", "id": "cl-1339448b7da5", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed only a few days per year should not be reserved; when it must be available, cover it with On-Demand Instances, because Spot capacity can be reclaimed with a two-minute notice and is not guaranteed.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c8a1f8029bbf", "source_question_ids": ["awssysops-p1-q029"], "statement": "Using Spot Instances to cover capacity that is needed on most days risks interruption for capacity the application actually needs regularly, which undermines availability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a660fa7e4da0", "source_question_ids": ["awssysops-p1-q036"], "statement": "The instance type an Auto Scaling group launches is normally defined in its launch template (legacy: launch configuration), but a group with a mixed instances policy can override it with instance types set in the group itself.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fe181272f7b8", "source_question_ids": ["awssysops-p1-q036"], "statement": "Scaling policies control when to scale and tags are only metadata, so neither defines instance type; a basic Auto Scaling group takes its instance type from its launch template or configuration, and only a mixed instances policy sets types in the group itself.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["need to change the instance type used by an Auto Scaling group"], "confidence": "medium", "id": "cl-b6c7adb54d6c", "source_question_ids": ["awssysops-p1-q036"], "statement": "To change the instance type an Auto Scaling group launches, create a new launch template version with the new type and update the group to use it (with a deprecated, immutable launch configuration you create a new one and point the group at it); existing instances change only when replaced, for example by an instance refresh.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["sticky sessions enabled on the ELB"], "confidence": "high", "id": "cl-1081779c8879", "source_question_ids": ["awssysops-p1-q053"], "statement": "When sticky sessions are enabled on an ELB, requests from a given user's session are pinned to one specific backend instance for the life of the session, so newly launched Auto Scaling instances receive no traffic from already-connected users.", "status": "supported"}, {"claim_type": "fact", "conditions": ["application uses long-lived connections such as long polling, Comet, or WebSockets"], "confidence": "high", "id": "cl-46b76b34dfff", "source_question_ids": ["awssysops-p1-q053"], "statement": "Long-lived connections such as long polling, Comet, or WebSockets stay pinned to whichever instance accepted them, so existing instances keep serving open connections instead of shedding load to newly launched instances.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-56fc13d41b2b", "source_question_ids": ["awssysops-p1-q053"], "statement": "An ELB's default, non-sticky behavior distributes requests across backend instances without pinning requests from a given user to one specific instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b90af849796b", "source_question_ids": ["awssysops-p1-q053"], "statement": "A browser failing to honor the TTL of an ELB's DNS name is a DNS-level failover issue, not a cause of load imbalance across already-resolved backend instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-519525b65bcf", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can trigger an Auto Scaling policy that scales an Auto Scaling group up or down.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f07f1b1c5929", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can send an SNS notification, including an SMS message.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9871fd8b11de", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can directly stop, terminate, reboot, or recover an EC2 instance as an alarm action.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-b9de0f2dd9eb", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm cannot target an Auto Scaling launch configuration or launch template directly, because a launch configuration is only a blueprint used when a group scales, not an addressable target for an alarm action.", "status": "supported"}, {"claim_type": "rule", "conditions": ["deleting an Auto Scaling group via the CLI"], "confidence": "medium", "id": "cl-39e0da0a0549", "source_question_ids": ["awssysops-p1-q062"], "statement": "To delete an Auto Scaling group from the CLI, either set its minimum size and desired capacity to 0 and wait for the instances to terminate, or run delete-auto-scaling-group with --force-delete; otherwise the delete fails while instances remain.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d05469f44b96", "source_question_ids": ["awssysops-p1-q062"], "statement": "The AWS Management Console automatically sets an Auto Scaling group's minimum size and desired capacity to 0 before deletion, but the CLI delete command does not perform this step automatically.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d6856ec294e6", "source_question_ids": ["awssysops-p1-q062"], "statement": "Manually terminating instances via EC2 or Auto Scaling terminate commands before deleting an Auto Scaling group fights the group's own instance-replacement behavior rather than cleanly draining it.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-73776fc51cc2", "source_question_ids": ["awssysops-p1-q065"], "statement": "Auto Scaling scheduled actions let a group scale up and down automatically at predictable, recurring times without manual effort or a separate batch process.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ac15c6f1195d", "source_question_ids": ["awssysops-p1-q065"], "statement": "Scheduling an Auto Scaling policy to scale up and down every single day wastes capacity on days when traffic is not actually elevated, compared to scheduling only the specific days that need it.", "status": "supported"}, {"claim_type": "rule", "conditions": ["configuring a recurring Auto Scaling scheduled action"], "confidence": "medium", "id": "cl-b363d301375d", "source_question_ids": ["awssysops-p1-q067"], "statement": "A recurring Auto Scaling scheduled action requires specifying the Auto Scaling group name and a recurrence (cron) expression.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["configuring an Auto Scaling scheduled action"], "confidence": "medium", "id": "cl-ac88b48f624b", "source_question_ids": ["awssysops-p1-q067"], "statement": "An Auto Scaling scheduled action requires at least one of MinSize, MaxSize, or DesiredCapacity, so Maximum size alone is not strictly required if Min size or Desired capacity is supplied instead.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["configuring an Auto Scaling scheduled action"], "confidence": "medium", "id": "cl-0f3415e8737a", "source_question_ids": ["awssysops-p1-q067"], "statement": "End time is an explicitly optional parameter for an Auto Scaling scheduled action; it only bounds when a recurring schedule stops.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-75ad36ae1f72", "source_question_ids": ["awssysops-p1-q070"], "statement": "An Auto Scaling launch configuration is only a template/blueprint; AWS never charges for the launch configuration object itself.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-68102fad0835", "source_question_ids": ["awssysops-p1-q070"], "statement": "Deleting or keeping an Auto Scaling launch configuration around after its instances are terminated has no effect on the AWS bill.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-56db4374f2f1", "source_question_ids": ["awssysops-p1-q070"], "statement": "Unattached or unused EBS volumes continue to be billed, so deleting them once no longer needed reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2a406dbcf00e", "source_question_ids": ["awssysops-p1-q070"], "statement": "Since February 2024 every public IPv4 address is billed hourly, including an Elastic IP attached to a running instance, so releasing an Elastic IP you no longer need reduces cost.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ea1886242af2", "source_question_ids": ["awssysops-p1-q070"], "statement": "An idle Elastic Load Balancer with no instances behind it is still billed, so deleting it reduces cost.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-5f86d011edf5", "source_question_ids": ["awssysops-p1-q075"], "statement": "Setting an Auto Scaling group's minimum capacity causes the group's desired capacity to be set to at least that minimum immediately, so Auto Scaling launches that many instances right away without waiting for a scaling trigger.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instances launched via the same Auto Scaling group"], "confidence": "medium", "id": "cl-ef7191e97bf8", "source_question_ids": ["awssysops-p1-q078"], "statement": "CloudWatch can aggregate statistics across every instance in an Auto Scaling group directly through built-in cross-instance statistics, without a separate analysis tool.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f655ae18068f", "source_question_ids": ["awssysops-p1-q078"], "statement": "It is false that average CPU utilization across instances launched from the same AMI cannot be viewed in CloudWatch merely because each instance has a different instance ID.", "status": "needs-review"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-4524974cc547", "source_question_ids": ["awssysops-p1-q080"], "statement": "Auto Scaling group metrics, once enabled, are reported at 1-minute granularity at no additional charge; per-instance EC2 detailed monitoring (set in the launch template or configuration) sends 1-minute metrics at an extra charge, while basic monitoring is 5-minute and free.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3d12dc34fa47", "source_question_ids": ["awssysops-p1-q093"], "statement": "Increasing an Auto Scaling group's desired capacity immediately triggers new instance launches up to that new desired count, and those instances register automatically with an attached ELB.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6727af50fbec", "source_question_ids": ["awssysops-p1-q093"], "statement": "Increasing an Auto Scaling group's maximum size only raises the ceiling the group is allowed to scale to; it does not by itself launch any new instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-becc00624e32", "source_question_ids": ["awssysops-p1-q093"], "statement": "Manually launching an instance and registering it with an ELB outside of Auto Scaling works operationally but is not using Auto Scaling to add the instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c7852471ee79", "source_question_ids": ["awssysops-p1-q093"], "statement": "Decreasing an Auto Scaling group's minimum limit allows the group to shrink rather than provisioning additional instances ahead of anticipated load.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-6f199e65b744", "source_question_ids": ["awssysops-p1-q098"], "statement": "Route 53 DNS failover can provide redundancy for an ELB endpoint by failing over to a second, independent endpoint.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-403da5e71dca", "source_question_ids": ["awssysops-p1-q098"], "statement": "An ELB is already inherently highly available across multiple Availability Zones within a single region without any additional service.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-4084632746a0", "source_question_ids": ["awssysops-p1-q098"], "statement": "Auto Scaling is a plausible but incorrect answer for providing redundancy specifically to an ELB itself, as distinct from providing availability to the instances behind it.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-12ac1c977ad1", "source_question_ids": ["awssysops-p1-q122"], "statement": "A CloudWatch alarm watching the CPU Utilization metric can be configured to notify an Auto Scaling group directly when utilization drops below a threshold, triggering a scale-in policy on that group to remove an instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-83f38ae36e2b", "source_question_ids": ["awssysops-p1-q122"], "statement": "Using an SNS email notification plus manually adjusting Auto Scaling desired capacity can remove an instance on low CPU utilization, but requires a human in the loop rather than automatic scale-in.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a525de4e88f6", "source_question_ids": ["awssysops-p1-q122"], "statement": "Auto Scaling scheduled actions trigger on a fixed schedule, not dynamically in response to a CloudWatch metric like CPU utilization.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-6b027616c185", "source_question_ids": ["awssysops-p1-q122"], "statement": "An Auto Scaling launch configuration is only an instance template; it cannot receive CloudWatch alarm notifications or execute scaling policies, since only the Auto Scaling group itself can.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c41565840f04", "source_question_ids": ["awssysops-p1-q123"], "statement": "The CloudWatch Auto Scaling metric GroupTotalInstances reports the combined count of all instances in the group regardless of state (pending, running, and terminating are all rolled into this single number).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-71eaab3ffcf8", "source_question_ids": ["awssysops-p1-q123"], "statement": "GroupSumInstances is not a real CloudWatch Auto Scaling metric name.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f35aa2f0dd3d", "source_question_ids": ["awssysops-p1-q123"], "statement": "GroupInstancesCount is not a real CloudWatch Auto Scaling metric name.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "c alth check mechanism is an ELB health check rather than an EC2 status check"], "confidence": "medium", "id": "cl-aca8badc08d7", "source_question_ids": ["awssysops-p1-q176"], "statement": "When ELB health checks (rather than EC2 status checks) are in play, the ELB itself stops routing traffic to an unhealthy instance, which is a distinct mechanism from the EC2 status-check 'impaired' state.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6be46031aa97", "source_question_ids": ["awssysops-p1-q178"], "statement": "There is no dedicated 'join' or 'merge' command for Auto Scaling groups.", "status": "supported"}, {"claim_type": "rule", "conditions": ["two separate Auto Scaling groups each configured in a single Availability Zone need to be merged into one multi-zone group"], "confidence": "high", "id": "cl-8c9b5471b4c5", "source_question_ids": ["awssysops-p1-q178"], "statement": "To merge two single-Availability-Zone Auto Scaling groups into one group spanning multiple zones, the documented approach is to update one group's Availability Zones and min/max/desired capacity to span the needed zones, then delete the now-redundant second group.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-af0ecd7278f1", "source_question_ids": ["awssysops-p1-q178"], "statement": "Commands such as as-join-auto-scaling-group, as-copy-auto-scaling-group, and as-merge-auto-scaling-group do not exist in the Auto Scaling API/CLI.", "status": "supported"}, {"claim_type": "default", "conditions": ["Auto Scaling launch configuration created via CLI or SDK"], "confidence": "medium", "id": "cl-c58ecd6a44b8", "source_question_ids": ["awssysops-p1-q193"], "statement": "A legacy Auto Scaling launch configuration created via the CLI or an SDK defaults InstanceMonitoring.Enabled to true (detailed 1-minute monitoring); launch configurations are deprecated, and launch templates, their replacement, default to basic 5-minute monitoring unless detailed monitoring is explicitly enabled.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["Auto Scaling launch configuration created via CLI or SDK"], "confidence": "high", "id": "cl-600d3d55c8c3", "source_question_ids": ["awssysops-p1-q193"], "statement": "For an Auto Scaling launch configuration created via the CLI or an SDK, instances get basic (5-minute) monitoring only if InstanceMonitoring is explicitly disabled; console-created launch configurations and launch templates default to basic monitoring.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AlarmNotification process type is suspended"], "confidence": "high", "id": "cl-693cc12d9a5c", "source_question_ids": ["awssysops-p1-q203"], "statement": "Suspending the Auto Scaling AlarmNotification process type does not stop CloudWatch from sending alarms to Auto Scaling; it only stops Auto Scaling from executing the associated scaling policy in response to those alarms.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9816740f40ef", "source_question_ids": ["awssysops-p1-q203"], "statement": "AlarmNotification is one of the individually suspendable Auto Scaling process types.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-472e6a92f1dd", "source_question_ids": ["awssysops-p1-q221"], "statement": "Auto Scaling lets a user suspend one or more scaling processes on a group, which is the documented way to pause scaling activity temporarily (e.g., while investigating a configuration problem or memory leak) without losing the group's configuration.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f8e4555d4d95", "source_question_ids": ["awssysops-p1-q221"], "statement": "A paused Auto Scaling group can later resume normal scaling operation once the root cause of the issue being investigated is resolved.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Availability Zone rebalancing is occurring", "group is at or near its maximum capacity"], "confidence": "high", "id": "cl-bfeb8c26c1b0", "source_question_ids": ["awssysops-p1-q231", "awssysops-p2-q399"], "statement": "During Availability Zone rebalancing, Auto Scaling can temporarily exceed a group's specified maximum capacity by a margin of 10 percent or 1 instance, whichever is greater, so that new instances can launch before old ones terminate.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Terminate process is suspended", "Launch process remains active"], "confidence": "high", "id": "cl-fbde3f0ec3e3", "source_question_ids": ["awssysops-p1-q231"], "statement": "If a user suspends only the Auto Scaling Terminate process while leaving Launch active, AZRebalance stays active and keeps launching new instances for rebalancing but cannot terminate old instances, which can grow the group up to 10 percent larger than its configured maximum size until Terminate is resumed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-893f9fb5bf2d", "source_question_ids": ["awssysops-p1-q231"], "statement": "Suspending only the Terminate process while keeping Launch active is a supported configuration; it is not true that Launch and Terminate must always be suspended together.", "status": "supported"}, {"claim_type": "rule", "conditions": ["--no-decrement-desired-capacity flag is used"], "confidence": "medium", "id": "cl-179a16285526", "source_question_ids": ["awssysops-p1-q241"], "statement": "Terminating an instance without decrementing desired capacity (current: aws autoscaling terminate-instance-in-auto-scaling-group --no-should-decrement-desired-capacity; legacy: as-terminate-instance-in-auto-scaling-group --no-decrement-desired-capacity) makes Auto Scaling launch a replacement from the group's current launch template or launch configuration.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["--decrement-desired-capacity flag is used", "resulting desired capacity would not fall below the group's configured minimum size"], "confidence": "medium", "id": "cl-e7981e191834", "source_question_ids": ["awssysops-p1-q241", "awssysops-p1-q265"], "statement": "Running aws autoscaling terminate-instance-in-auto-scaling-group --should-decrement-desired-capacity (legacy: as-terminate-instance-in-auto-scaling-group --decrement-desired-capacity) terminates the instance and lowers desired capacity by one without a replacement, provided desired capacity stays at or above the minimum size.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-8e5b52b633e5", "source_question_ids": ["awssysops-p1-q241"], "statement": "as-delete-instance-in-auto-scaling-group is not a real Auto Scaling CLI command name.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e794ed3ab61e", "source_question_ids": ["awssysops-p1-q241"], "statement": "--update-desired-capacity is not a real flag of as-terminate-instance-in-auto-scaling-group.", "status": "supported"}, {"claim_type": "default", "conditions": ["Auto Scaling launch configuration created via CLI or SDK versus via console or launch template"], "confidence": "medium", "id": "cl-e9094a8ae529", "source_question_ids": ["awssysops-p1-q250"], "statement": "A legacy Auto Scaling launch configuration created via the CLI or an SDK defaults to detailed (1-minute) instance monitoring, while console-created launch configurations and all launch templates default to basic monitoring; launch configurations are deprecated in favor of launch templates, where detailed monitoring must be enabled explicitly.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3e598101cf0b", "source_question_ids": ["awssysops-p1-q250"], "statemen uto Scaling Terminate process is suspended while the AZRebalance process remains active, AZRebalance can still launch new instances to rebalance across Availability Zones but cannot terminate the old ones, allowing the group to temporarily exceed its configured maximum size by roughly 10% until Terminate is resumed.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance scale-in protection is enabled", "termination trigger is unrelated to Spot bid price"], "confidence": "medium", "id": "cl-8b2da1a67646", "source_question_ids": ["awssysops-p2-q463"], "statement": "Instance scale-in protection on an Auto Scaling group blocks Auto Scaling from terminating a protected instance during ordinary scale-in activity triggered by something other than Spot bid price.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["Auto Scaling group instances are Spot Instances"], "confidence": "medium", "id": "cl-db4c47197a7c", "source_question_ids": ["awssysops-p2-q463"], "statement": "EC2 termination protection (DisableApiTermination) cannot be enabled for Spot Instances, but Auto Scaling instance scale-in protection is a separate feature that does protect Spot Instances in an Auto Scaling group from scale-in termination, though not from Spot interruption.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["fast time-to-operational is the deployment priority"], "confidence": "high", "id": "cl-fde730baa7cf", "source_question_ids": ["awssysops-p2-q528"], "statement": "When fast instance operational time (boot speed) is the deployment priority, dependencies should be pre-baked into a \"golden image\" AMI rather than installed at launch via user-data scripts, Lambda functions, or configuration-management tooling run on each boot.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-587004bf8193", "source_question_ids": ["awssysops-p2-q528"], "statement": "Pairing golden-image AMIs with a new A loudWatch has no built-in memory-utilization metric for EC2 instances, because the hypervisor cannot see guest-OS memory usage.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-80f8008f2d10", "source_question_ids": ["awssysops-p2-q531"], "statement": "An Auto Scaling group's scaling policy can only react to a metric it can observe; without a memory metric published to CloudWatch, a scaling policy cannot react to memory pressure.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-57776b837f9c", "source_question_ids": ["awssysops-p2-q531"], "statement": "Deploying an Application Load Balancer to redistribute traffic does not create a memory metric for CloudWatch and does not change what an Auto Scaling group's scaling policy can act on, so it does not resolve Auto Scaling group scaling triggered by memory pressure.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa90c5fb2de0", "source_question_ids": ["awssysops-p2-q550"], "statement": "An ELB SpilloverCount metric greater than zero indicates requests have overflowed the load balancer's surge queue and are receiving 5xx errors.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ee932b379dc1", "source_question_ids": ["awssysops-p2-q550"], "statement": "The Classic ELB SurgeQueueLength metric measures how many requests are queued waiting for a healthy backend instance, with a maximum queue size of 1024 requests.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2bd98c3d8ad4", "source_question_ids": ["awssysops-p2-q550"], "statement": "Triggering Auto Scaling actions based on the ELB SurgeQueueLength metric lets new instances come online before the surge queue overflows, preventing SpilloverCount-related 5xx errors.", "status": "supported"}, {"claim_type": "default", ic surge (such as the start of each business day), avoiding the lag inherent in purely reactive, metric-triggered scaling.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-96e1b3870c45", "source_question_ids": ["awssysops-p3-1-q614"], "statement": "Switching an Auto Scaling group to scale on CPU utilization, or using larger EC2 instance types, does not resolve a scaling-lag problem for a queue-depth-driven email-confirmation workload.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-1e10d2a1454b", "source_question_ids": ["awssysops-p3-1-q620", "awssysops-p3-1-q925"], "statement": "High availability behind a load balancer requires a minimum (and desired) capacity of at least 2 instances spread across at least 2 Availability Zones, so losing one instance or AZ still leaves a healthy instance serving traffic; the maximum can be higher.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-715fe867a821", "source_question_ids": ["awssysops-p3-1-q620"], "statement": "An Auto Scaling group configured with minimum = desired = maximum = 1 instance provides fault tolerance (the application recovers after a brief gap) but not true zero-downtime high availability, since there is a service gap until Auto Scaling replaces the single failed instance.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8f805a605025", "source_question_ids": ["awssysops-p3-1-q620", "awssysops-p3-1-q925"], "statement": "An Auto Scaling group is a Regional construct and cannot span multiple AWS Regions.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f6e6f2e50fe5", "source_question_ids": ["awssysops-p3-1-q636"], "statement": "If an Auto Scaling group's maximum size is already at or below its current running instance count, the group cannot launch additional instances no matter how high CPU utilization climbs or how long a scale-out alarm stays in ALARM state.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-14595401f3a5", "source_question_ids": ["awssysops-p3-1-q636"], "statement": "A missing scheduled scaling action is not the cause of failed scale-out when the Auto Scaling group's trigger is a CPU metric alarm rather than a schedule.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0de8392a9821", "source_question_ids": ["awssysops-p3-1-q636"], "statement": "Suspending the ReplaceUnhealthy Auto Scaling process only stops replacement of unhealthy instances; it does not prevent scale-out in response to high CPU utilization.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-99d3f39122e9", "source_question_ids": ["awssysops-p3-1-q636"], "statement": "A Health Check Grace Period shorter than 300 seconds affects how soon a newly launched instance is marked healthy, not whether new instances get launched in response to a scaling alarm.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-326f17080e14", "source_question_ids": ["awssysops-p3-1-q678"], "statement": "Suspending an Auto Scaling group's launch and terminate scaling processes freezes scale-out and scale-in activity, allowing an administrator to troubleshoot instances in place without the group launching new instances or replacing the ones being examined.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3806c77a8fd0", "source_question_ids": ["awssysops-p3-1-q678"], "statement": "Removing impacted instances from an Application Load Balancer stops routing traffic to them but does not stop the Auto Scaling group's own scaling actions driven by CPUUtilization.", "status": "supported"
