idence": "high", "id": "cl-ab72a6be117f", "source_question_ids": ["awssysops-p3-1-q750"], "statement": "Increasing the retention period of an SQS queue only extends how long unprocessed messages are kept before being discarded; it does not increase processing throughput and does not fix a growing message backlog.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3cb2d04162d3", "source_question_ids": ["awssysops-p3-1-q759"], "statement": "An EC2 Auto Scaling lifecycle hook can pause an instance in the Terminating:Wait state after it has been marked unhealthy and removed from service, giving time to analyze the instance before it is actually terminated.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-cb8cf9380981", "source_question_ids": ["awssysops-p3-1-q759"], "statement": "An ALB health check has no capability to restart an unhealthy instance; it only reports health status for the Auto Scaling group to act on.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c13f9fc9d02b", "source_question_ids": ["awssysops-p3-1-q795"], "statement": "RequestCountPerTarget is a built-in, zero-instrumentation Application Load Balancer metric that can be used in a target tracking scaling policy to scale an Auto Scaling group on per-instance request load with the least administrative effort.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8d6984b7e4d2", "source_question_ids": ["awssysops-p3-1-q795"], "statement": "A custom CloudWatch metric that measures average active requests across EC2 instances requires an administrator to build, publish, and maintain their own instrumentation, which is more effort than using an AWS-provided built-in metric.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ccdc72a1f35d", "source_question_ids": ["awssysops-p3-1-q795"], "statement": "The ALB ActiveConnectionCount metric measures raw TCP connection counts rather than request volume.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c6bacb87d7ca", "source_question_ids": ["awssysops-p3-1-q795"], "statement": "The Auto Scaling group GroupDesiredCapacity metric is a state metric describing the group's own target size, not a load signal to scale from.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa9aa216e4a2", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Amazon CloudFront caches content (static assets, images, software patches, articles) at globally distributed edge locations, so repeat requests are served from the cache instead of hitting the origin, reducing origin load and lowering latency for end users during traffic spikes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["only one regional origin/endpoint exists"], "confidence": "medium", "id": "cl-c130c98dd118", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Route 53 latency-based routing only changes anything when multiple regional endpoints/origins exist to route between; with a single origin/endpoint in one region, enabling latency-based routing is a no-op.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["single ALB in a single region"], "confidence": "medium", "id": "cl-6e2168b5d516", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "With only a single ALB in a single region, enabling Route 53 latency-based routing is a no-op — every request already resolves to that same one load balancer regardless of the routing policy, since latency-based routing only has an effect when multiple regional endpoints exist.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-f5e012055e26", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Implementing EC2 Auto Scaling for web servers lets the fleet grow to handle load spikes that would otherwise slow down dynamic content generation.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-04e7cb8c2bb9", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "An ALB listener supports only HTTP and HTTPS, so it cannot be changed to TCP; TCP listeners require a Network Load Balancer (or a Classic Load Balancer).", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4f15257bb6d2", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Moving static content off S3 onto the web servers adds load to the same instances already implicated in the site's slowness, rather than relieving it.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-1c868159145a", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "For improving performance of a slow single-region website, the source's boxed/labeled answer includes Route 53 latency-based routing (paired with Auto Scaling), but community consensus unanimously favors pairing CloudFront caching of static content with Auto Scaling instead, since latency-based routing is a no-op with only one ALB in one region.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-b529f354039f", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "HTTP 5xx errors that correlate with sustained high CPU utilization on backend EC2 instances indicate a capacity shortage, which is resolved by adding instances via an Auto Scaling group.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6da5aeb8d269", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "Configuring more frequent ALB target group health checks only changes how quickly unhealthy instances are pulled from rotation; it does not add capacity or reduce the CPU load causing 5xx errors.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-54c66f5fd5a3", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "Enabling sticky sessions on an ALB only pins a client's requests to the same target for session affinity; it adds no capacity and can make load less even, so it does not fix 5xx errors caused by fleet-wide high CPU.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-236035c03c32", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "Increasing an Application Load Balancer's idle timeout setting affects how long idle client connections are held open and is unrelated to a CPU-driven capacity shortage causing 5xx errors.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9f019281e39d", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "VPC Flow Logs capture network traffic metadata (source/destination IPs, ports, byte and packet counts) and never capture application log file contents.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-9c7235220e45", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "The unified CloudWatch agent can stream application log files continuously to CloudWatch Logs as they are written, so the logs are durably captured well before an unhealthy instance is terminated.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["log transfer attempted after instance has already reached terminated state"], "confidence": "medium", "id": "cl-5db38b31fe9b", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "An EventBridge rule that reacts to an EC2 instance's transition to the terminated state risks a timing gap, because the instance's EBS volume and in-memory log access may no longer be reliably reachable by the time the rule fires.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-47239174e5a5", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "Changing EC2 storage from EBS to instance store makes logs less durable, not more, since instance store data is lost on instance termination.", "status": "supported"}, {"claim_type": "rule", "conditions": ["EC2 instances are managed by an Auto Scaling group created via a CloudFormation template", "the template defines an AutoScalingRollingUpdate policy"], "confidence": "high", "id": "cl-73d68fe0310e", "source_question_ids": ["awssysops-p3-1-q887"], "statement": "An AutoScalingRollingUpdate policy set in a CloudFormation template lets the Auto Scaling group's instances be replaced in controlled batches during a stack update (e.g., to roll out a patched AMI) while enforcing a minimum number of instances in service throughout the update.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a7ef883ff502", "source_question_ids": ["awssysops-p3-1-q887"], "statement": "Updating a CloudFormation template with a new AMI ID and then rebooting the existing EC2 instances does not apply the new AMI to those instances, because rebooting does not re-launch an instance from a different image.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3af0d9d2ea7f", "source_question_ids": ["awssysops-p3-1-q887"], "statement": "The --rollback-configuration option of update-stack sets CloudWatch alarm rollback triggers and a monitoring period, so the update rolls back if a listed alarm goes into ALARM; it does not control how Auto Scaling instances are replaced during the update.", "status": "supported"}, {"claim_type": "rule", "conditions": ["template defines an AutoScalingReplacingUpdate policy on the Auto Scaling group resource"], "confidence": "medium", "id": "cl-9b80ec8afb44", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "A CloudFormation AutoScalingReplacingUpdate policy replaces an Auto Scaling group's instances with an entirely new group during a stack update, and can immediately roll the stack back without failure if the new version has problems, all while keeping the same load balancer and without requiring any DNS change.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-be297650d674", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Auto Scaling group lifecycle hooks let new instances complete custom actions before entering service, but they provide no documented rollback mechanism of their own if the new application version has problems.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-10a7ea728f71", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Pointing an Auto Scaling group at a new AMI through a new launch template or launch configuration (launch configurations are deprecated) has no built-in rollback and, without an update policy or instance refresh, does not replace running instances.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cd831e1c7e00", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Deploying a second CloudFormation stack with a new Application Load Balancer and cutting over to it requires a DNS change to redirect traffic to the new load balancer, which violates a requirement to avoid DNS changes during deployment.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-661e5631875f", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "For the question about deploying a new application release without DNS changes and with rollback support, the source's boxed correct answer is using Auto Scaling lifecycle hooks, but community vote is unanimous for using an AutoScalingReplacingUpdate policy instead, since lifecycle hooks have no documented rollback mechanism; the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-988395e180f0", "source_question_ids": ["awssysops-p3-1-q914"], "statement": "A termination lifecycle hook puts an EC2 instance into a wait state before it is actually terminated, giving a defined window to complete a custom action, such as delivering logs to an external system, before termination proceeds.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b12f014853a0", "source_question_ids": ["awssysops-p3-1-q914"], "statement": "Enabling Auto Scaling scale-in protection and then manually detaching the instance removes it from the Auto Scaling group but provides no wait-state or hook for confirming an action like log delivery before the instance is terminated.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-42092a1a17e2", "source_question_ids": ["awssysops-p3-1-q914"], "statement": "A fixed response configured on an Application Load Balancer only affects how the load balancer answers incoming requests; it has no bearing on log delivery before instance termination.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-auto-scaling--m-1", "title": "The Auto Scaling group as a capacity reconciliation loop", "purpose": "Explain what an Auto Scaling group actually controls, what feeds it, and what it can never do, so you can tell which knob (desired/min/max, health check type, launch template, scaling trigger, suspended process) fixes a given symptom.", "mechanism": "An Auto Scaling group is a Regional, logical group of EC2 instances that keeps reconciling one number: the count of healthy InService instances should equal desired capacity, kept between min and max. When the group has fewer healthy instances than desired, it launches new ones from its launch template (the blueprint for AMI, instance type, monitoring, IAM role) into the AZ subnets configured on the group. When it has more, it terminates instances. It never reboots or edits an existing instance. Desired capacity changes for four reasons: you set it directly, a min is raised above it, a CloudWatch alarm runs a scaling policy, or a scheduled action fires. Max is only a ceiling. Raising it launches nothing, and if max is already at or below the running count, no alarm can scale out. Health is just another input. With the default EC2 health check type the group only sees instance status checks and ignores the load balancer's verdicts. Adding the ELB health check type makes it terminate and replace instances that the load balancer marks unhealthy. Each step of the loop (Launch, Terminate, HealthCheck, ReplaceUnhealthy, AZRebalance, AlarmNotification, ScheduledActions, AddToLoadBalancer) is a process you can suspend on its own, which freezes that one behavior without changing the group's configuration. The load balancer attached to the group only routes requests to whatever instances the group registers. It does not create, replace, or rebalance them.", "predict_prompt": "An ALB shows two targets unhealthy, but the Auto Scaling console shows every instance Healthy and nothing is being replaced. Before reading on, predict which single group setting explains this and what changing it will do.", "invariants": ["The group launches only into the AZs/subnets configured on the group itself. Attaching an ELB or raising max does not change that.", "Instance count moves only through desired capacity. Max and min are bounds, but raising min above desired lifts desired immediately.", "Unhealthy instances are terminated and replaced, never rebooted or repaired in place.", "New launches always come from the group's current launch template version. Existing instances change only when replaced.", "A launch template or launch configuration is a passive blueprint. Alarms and scaling policies target the group, not the template."], "limits": ["The loop can only react to metrics it can observe. With no custom metric for memory, nothing can scale on memory pressure.", "A group cannot span Regions, and it does not make the ELB itself redundant.", "During AZ rebalancing, the group may briefly exceed max by 10% or 1 instance, whichever is greater. This also happens when Terminate is suspended while AZRebalance keeps launching.", "Cooldown blocks new alarm-driven scaling until it expires, so a conflicting trigger that arrives inside the window is ignored."], "cues": ["'ELB says unhealthy but ASG keeps it' -> health check type is EC2. Add the ELB type.", "'Instances only in one AZ, none unhealthy' -> the group is missing a subnet in the other AZ.", "'Add an instance now using Auto Scaling' -> raise desired capacity, not max.", "'Change instance type or monitoring' -> new launch template version or new launch configuration, then point the group at it.", "'Self-healing single instance (bastion)' -> group with min=max=1 spanning multiple AZs.", "'Pause scaling while troubleshooting' -> suspend processes. Do not delete or detach anything."], "claim_ids": ["cl-f8df9e1cf201", "cl-41f2f1f1a637", "cl-74d0b20479f9", "cl-4454d72198a1", "cl-89c29e54fd36", "cl-ee7931c80f1a", "cl-3d12dc34fa47", "cl-6727af50fbec", "cl-5f86d011edf5", "cl-f6e6f2e50fe5", "cl-911cd34160e9", "cl-7dafe088c316", "cl-94533f105047", "cl-f3096f50a1b8", "cl-9021c6e1d856", "cl-ac0d2f92a80c", "cl-d84c94501a2c", "cl-b6c7adb54d6c", "cl-fbde3f0ec3e3", "cl-14ebbcdc4696", "cl-6b027616c185", "cl-b9de0f2dd9eb", "cl-519525b65bcf", "cl-73776fc51cc2", "cl-d33bebe23f93", "cl-472e6a92f1dd", "cl-bfeb8c26c1b0", "cl-1d630cb80679", "cl-80f8008f2d10", "cl-9051dabb6b29", "cl-931028df2af5"]}, "contrastSet": {"id": "aws-sysops-service-auto-scaling--cs-1", "subjects": ["Auto Scaling group", "Elastic Load Balancer", "Launch template / launch configuration"], "dimensions": ["What it changes", "Reaction to an unhealthy instance", "Where AZs and capacity are set", "Can be a CloudWatch alarm target"], "shared_traits": ["All three show up together in every Auto Scaling architecture and are named side by side in answer options.", "None of them changes an already-running instance's type or AMI in place."], "matrix": {"What it changes": {"Auto Scaling group": "How many instances exist (launch/terminate to reach desired capacity)", "Elastic Load Balancer": "Which existing healthy instance receives each request", "Launch template / launch configuration": "What each newly launched instance is built from (AMI, type, IAM role, monitoring)"}, "Reaction to an unhealthy instance": {"Auto Scaling group": "Terminates and replaces it (sees ELB verdicts only with the ELB health check type)", "Elastic Load Balancer": "Stops routing to it. It never restarts or replaces the instance", "Launch template / launch configuration": "None. It is a passive blueprint"}, "Where AZs and capacity are set": {"Auto Scaling group": "Yes: subnets/AZs, min/max/desired, scaling policies, schedules", "Elastic Load Balancer": "Only its own enabled AZs. It does not decide where instances launch", "Launch template / launch configuration": "No: it holds no min/max, schedule, or AZ selection"}, "Can be a CloudWatch alarm target": {"Auto Scaling group": "Yes, through a scaling policy", "Elastic Load Balancer": "No. Its metrics are observed but it takes no scaling action", "Launch template / launch configuration": "No. It cannot receive alarms or run policies"}}, "decision_rule": "Ask what the fix has to change. If it is the number or replacement of instances (add capacity, self-heal, terminate bad instances), pick the Auto Scaling group. If it is where requests go among instances that already exist, pick the ELB. If it is what future instances look like (instance type, AMI, IAM role, monitoring), pick a new launch template version or a new launch configuration.", "boundary_flip": "A bastion host must recover from instance failure with no human involved, so the answer is an Auto Scaling group with min=max=1 across AZs. An ELB would only stop routing to the dead host. Change the requirement so that the instance must now launch as a different instance type, and the answer flips to a new launch template version (or a new launch configuration). The group alone cannot change instance type, and an ELB is irrelevant.", "strongest_distractor_failure": "Picking the ELB because it 'knows' an instance is unhealthy. An ELB or ALB health check only reports status and stops routing. It cannot restart or replace the instance. Replacement happens only when the Auto Scaling group uses the ELB health check type.", "exceptions": ["With a mixed instances policy, instance types can be set on the group itself, overriding the launch template.", "Raising max on the group looks like 'adding capacity' but launches nothing. Only desired capacity, or raising min above it, triggers launches.", "Detailed monitoring is a launch template or launch configuration setting, not a group setting, even though it affects the group's metrics."], "claim_ids": ["cl-59f08028b5d8", "cl-cb8cf9380981", "cl-3806c77a8fd0", "cl-4084632746a0", "cl-4454d72198a1", "cl-ee7931c80f1a", "cl-73f2a2e44e9f", "cl-6b027616c185", "cl-b9de0f2dd9eb", "cl-5f9cc3ab9c43", "cl-9051dabb6b29", "cl-3777323949f7", "cl-a660fa7e4da0", "cl-b6c7adb54d6c", "cl-fe181272f7b8", "cl-6727af50fbec", "cl-f777ebb0182b", "cl-ebdcf8b7e105", "cl-ac0d2f92a80c", "cl-d169a5435f6e"]}, "scenarioFamily": {"id": "aws-sysops-service-auto-scaling--sf-1", "canonical": {"prompt": "Your Auto Scaling group fronts a web tier behind an Application Load Balancer. The ALB target group has started reporting two of the instances as unhealthy, but the Auto Scaling console still shows all instances as Healthy, and the group is not terminating or replacing either instance. The group's health check type is currently set to EC2 only. What should you change, and why does it fix the problem?", "expected_answer": ["Change the Auto Scaling group's health check type to include ELB (EC2 + ELB), so the group starts acting on the ALB's unhealthy verdicts and terminates and replaces the two instances."], "reasoning": "With health check type EC2 only, the Auto Scaling group only looks at EC2 instance status checks and ignores ELB/ALB health verdicts entirely (cl-f3096f50a1b8), which explains the console mismatch where the ASG shows Healthy while the ALB target group shows the same instances unhealthy (cl-ebdcf8b7e105), since the default health check type is EC2 instance status checks, unaware of ALB target-group results (cl-94533f105047). Adding the ELB health check type is what makes the group terminate and replace instances that the load balancer has marked unhealthy (cl-9021c6e1d856), which resolves the Healthy/unhealthy mismatch by making the group defer to the same signal the load balancer uses (cl-ac0d2f92a80c).", "distractor_analysis": "Tuning the ALB target group's health check thresholds, interval, or protocol doesn't help: those settings control how fast the ALB itself detects a bad target, but they don't change whether the Auto Scaling group is listening to the ALB's verdict at all; that is gated by the group's own health check type (cl-158e9339e5f7).", "claim_ids": ["cl-f3096f50a1b8", "cl-94533f105047", "cl-ebdcf8b7e105", "cl-9021c6e1d856", "cl-ac0d2f92a80c", "cl-158e9339e5f7"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The Auto Scaling group's health check type is already set to EC2 + ELB (not EC2 only) when the ALB marks the two instances unhealthy.", "prompt": "Same web tier and ALB, same two instances now reported unhealthy by the ALB target group -- but this time the Auto Scaling group's health check type is already set to EC2 + ELB. What happens to those two instances, and is there any configuration change needed?", "expected_answer": ["No configuration change is needed. Because the health check type already includes ELB, the Auto Scaling group already acts on the ALB's unhealthy verdict and will terminate and launch replacements for both instances on its own."], "reasoning": "With ELB included in the health check type, the ASG is already wired to treat an ALB 'unhealthy' verdict as an instance failure and replace it (cl-9021c6e1d856); the earlier problem in the canonical scenario only existed because the health check type was EC2 only (cl-f3096f50a1b8). Flipping that one condition flips the outcome from 'needs a fix' to 'already self-healing, no fix needed' -- the boundary this mental model turns on.", "claim_ids": ["cl-9021c6e1d856", "cl-f3096f50a1b8"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "irrelevant-detail", "changed_condition": "The Auto Scaling group also spans three Availability Zones and its launch template has detailed (1-minute) monitoring enabled; the health check type is still EC2 only.", "prompt": "Same scenario: the ALB reports two instances unhealthy, the ASG console shows them Healthy and isn't replacing them, and the health check type is EC2 only. The group happens to span three Availability Zones and its launch template has detailed monitoring enabled. What should you change?", "expected_answer": ["Change the Auto Scaling group's health check type to include ELB (EC2 + ELB), so the group starts acting on the ALB's unhealthy verdicts and terminates and replaces the two instances."], "reasoning": "How many Availability Zones the group spans and whether detailed monitoring is enabled on the launch template have no bearing on which health signal the group listens to -- that is governed solely by the health check type setting (cl-f3096f50a1b8). The fix is unchanged from the canonical case: add the ELB health check type so the group reacts to the ALB's verdict and replaces the instances (cl-9021c6e1d856, cl-ac0d2f92a80c).", "claim_ids": ["cl-f3096f50a1b8", "cl-9021c6e1d856", "cl-ac0d2f92a80c"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "Before escalating, the on-call engineer first lowers the ALB target group's healthy/unhealthy threshold counts and shortens its health check interval, expecting that to make the Auto Scaling group start replacing the bad instances.", "prompt": "Same scenario: the ALB marks two instances unhealthy, the ASG shows them Healthy and isn't replacing them, and the health check type is EC2 only. The on-call engineer tightens the ALB target group's health check thresholds and shortens its check interval, expecting the Auto Scaling group to start replacing the instances. Does that fix it, and what should they do instead?", "expected_answer": ["Change the Auto Scaling group's health check type to include ELB (EC2 + ELB), so the group starts acting on the ALB's unhealthy verdicts and terminates and replaces the two instances."], "reasoning": "Tightening the ALB's thresholds and interval only changes how quickly the ALB itself flags a target as unhealthy; it does not change whether the Auto Scaling group is listening to that verdict at all (cl-158e9339e5f7). Under health check type EC2 only, the group only reacts to EC2 status checks (cl-f3096f50a1b8), so the engineer's change has no effect on replacement behavior. The actual fix is still adding ELB to the health check type (cl-9021c6e1d856).", "distractor_analysis": "This is the strongest distractor because it looks like it is addressing 'health checking' directly, but it tunes the wrong system's dial: ALB health check thresholds/interval/protocol control the load balancer's own detection speed, not the Auto Scaling group's health-check-type gate that decides whether the group ever sees that verdict (cl-158e9339e5f7).", "claim_ids": ["cl-158e9339e5f7", "cl-f3096f50a1b8", "cl-9021c6e1d856"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The load balancer in front of the fleet is a Network Load Balancer (NLB) with target health checks, instead of an Application Load Balancer, and it is the NLB marking the two targets unhealthy.", "prompt": "Same underlying problem, different load balancer: the fleet sits behind a Network Load Balancer whose target group reports the same two instances unhealthy. The Auto Scaling console still shows them Healthy and isn't replacing them, and the group's health check type is EC2 only. What should you change?", "expected_answer": ["Change the Auto Scaling group's health check type to include ELB (EC2 + ELB), so the group starts acting on the ALB's unhealthy verdicts and terminates and replaces the two instances."], "reasoning": "The Auto Scaling group's ELB health check type setting governs whether the group reacts to an attached load balancer's health verdict in general, not an Application Load Balancer specifically (cl-9021c6e1d856); with health check type EC2 only, the group ignores the NLB's unhealthy verdict for the same reason it would ignore an ALB's (cl-f3096f50a1b8). The mental model -- the health check type gates which signal the group listens to -- transfers unchanged across the load balancer type, so the fix is the same: add the ELB health check type so the group defers to the load balancer's verdict (cl-ac0d2f92a80c).", "claim_ids": ["cl-9021c6e1d856", "cl-f3096f50a1b8", "cl-ac0d2f92a80c"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "Source question q826 disagrees with itself. Its boxed answer includes Route 53 latency-based routing paired with Auto Scaling, but the community consensus favors CloudFront caching paired with Auto Scaling. cl-c130c98dd118 and cl-6e2168b5d516 settle this on the community's side by calling latency-based routing a no-op. Nothing in the source resolves the dispute, so it should stay flagged and not be treated as settled.", "related_entity_ids": ["cl-1c868159145a", "cl-c130c98dd118", "cl-6e2168b5d516", "cl-aa9aa216e4a2"]}, {"type": "contradiction", "severity": "medium", "description": "Source question q897 is disputed. Its boxed correct answer is Auto Scaling lifecycle hooks, but the community vote favors an AutoScalingReplacingUpdate policy. cl-9b80ec8afb44 and cl-be297650d674 adopt the community answer as fact, which settles the dispute by vote rather than leaving it flagged.", "related_entity_ids": ["cl-661e5631875f", "cl-9b80ec8afb44", "cl-be297650d674", "cl-10a7ea728f71"]}, {"type": "contradiction", "severity": "medium", "description": "Source questions disagree on whether a min=max=1 group is high availability. cl-9051dabb6b29 (q026) calls a min=max=1 multi-AZ group 'self-healing high availability'. cl-715fe867a821 (q620) says the same setup gives only fault tolerance, not true HA, because of the gap before replacement. cl-1e10d2a1454b (q620/q925) says HA requires at least 2 instances across 2 AZs. The mental model's bastion cue and the contrast set's boundary_flip use the min=max=1 answer without noting this tension.", "related_entity_ids": ["cl-9051dabb6b29", "cl-715fe867a821", "cl-1e10d2a1454b", "aws-sysops-service-auto-scaling--m-1", "aws-sysops-service-auto-scaling--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "The claims disagree on how many Auto Scaling group metrics exist. cl-a3661ff1d658 says 8 is no longer the full count because capacity-unit and warm-pool group metrics were added. cl-454978dcc7e9 and cl-a1f086af1ef5 (both high confidence, 'supported') say the group publishes 8 metrics under 1 dimension and call any other count incorrect.", "related_entity_ids": ["cl-a3661ff1d658", "cl-454978dcc7e9", "cl-a1f086af1ef5"]}, {"type": "contradiction", "severity": "medium", "description": "Two claims from q144 contradict each other on whether scheduled actions can be created only up to one month in advance. One says the limit applied historically. The other says it has since been lifted. Both are low confidence and need review, and the exam answer depends on which one is current.", "related_entity_ids": ["cl-24862e599ba7", "cl-902f4c30d792"]}, {"type": "contradiction", "severity": "low", "description": "The claims disagree on which SQS signal to scale on. cl-c719bdb2fd5e and cl-c5666c0c7929 present scaling on raw queue depth (ApproximateNumberOfMessagesVisible) as the right approach. cl-e2d2b16bb931 says AWS recommends target tracking on backlog per instance rather than raw queue depth alone. Nothing reconciles the two.", "related_entity_ids": ["cl-c719bdb2fd5e", "cl-c5666c0c7929", "cl-e2d2b16bb931", "cl-0d0c262cc2c9"]}, {"type": "quality", "severity": "medium", "description": "The mental model states several claims marked 'conflicted' as unconditional facts. Its predict_prompt, first cue, and health-check text rest on cl-f3096f50a1b8 and cl-9021c6e1d856. Its cooldown limit rests on cl-1d630cb80679. Its memory limit rests on cl-80f8008f2d10. Its instance-type and monitoring cues rest on cl-b6c7adb54d6c and cl-931028df2af5. None of these carries a caveat in the synthesis.", "related_entity_ids": ["aws-sysops-service-auto-scaling--m-1", "cl-f3096f50a1b8", "cl-9021c6e1d856", "cl-1d630cb80679", "cl-80f8008f2d10", "cl-b6c7adb54d6c", "cl-931028df2af5"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model's limit says 'Cooldown blocks new alarm-driven scaling until it expires', as if it applied to all scaling. The source claims (cl-1d630cb80679, cl-beb84489a165) cover one simple-scaling scenario and are marked conflicted. Nothing in the slice shows that cooldown blocks step or target-tracking policies the same way.", "related_entity_ids": ["aws-sysops-service-auto-scaling--m-1", "cl-1d630cb80679", "cl-beb84489a165", "cl-ca8b66cfb55b"]}, {"type": "unsupported-generation", "severity": "low", "description": "The mental model says 'Desired capacity changes for four reasons', which presents the list as complete. Claims in the same slice add other paths: terminating an instance with should-decrement-desired-capacity (cl-e7981e191834) and predictive or target-tracking scaling (cl-18b14bf6af8d).", "related_entity_ids": ["aws-sysops-service-auto-scaling--m-1", "cl-e7981e191834", "cl-18b14bf6af8d"]}, {"type": "unsupported-generation", "severity": "low", "description": "The mental model's invariant 'Unhealthy instances are terminated and replaced, never rebooted or repaired in place' leaves out exceptions in the slice. An admin can reset health with SetInstanceHealth to cancel replacement (cl-bd9ced375d31). A termination lifecycle hook can hold the instance in Terminating:Wait (cl-3cb2d04162d3). Suspending ReplaceUnhealthy stops replacement altogether (cl-0de8392a9821).", "related_entity_ids": ["aws-sysops-service-auto-scaling--m-1", "cl-bd9ced375d31", "cl-3cb2d04162d3", "cl-0de8392a9821"]}, {"type": "ambiguity", "severity": "low", "description": "The claims and the model state the over-max margin inconsistently. cl-bfeb8c26c1b0 says '10 percent or 1 instance, whichever is greater'. cl-fbde3f0ec3e3 says 'up to 10 percent'. cl-28a54d0afafe says 'roughly 10%'. The mental model also says the group 'briefly' exceeds max and that 'this also happens' when Terminate is suspended, but cl-fbde3f0ec3e3 says the overage then lasts until Terminate is resumed, not briefly.", "related_entity_ids": ["aws-sysops-service-auto-scaling--m-1", "cl-bfeb8c26c1b0", "cl-fbde3f0ec3e3", "cl-28a54d0afafe", "cl-71c508c64bed"]}, {"type": "ambiguity", "severity": "low", "description": "The contrast set's exception says detailed monitoring is 'not a group setting, even though it affects the group's metrics'. This blurs per-instance EC2 detailed monitoring, which is set in the launch template or configuration, with Auto Scaling group metrics collection, which is enabled on the group itself (cl-4524974cc547). It also makes cl-f777ebb0182b easy to misread as 'the group has no monitoring setting at all'.", "related_entity_ids": ["aws-sysops-service-auto-scaling--cs-1", "cl-4524974cc547", "cl-f777ebb0182b"]}, {"type": "ambiguity", "severity": "low", "description": "The contrast set's strongest_distractor_failure ends with 'Replacement happens only when the Auto Scaling group uses the ELB health check type.' On its own, that sentence contradicts cl-9031af5dded4 and cl-911cd34160e9, under which instances that fail EC2 status checks are replaced with the default EC2 health check type. It should say this applies to instances the ELB marks unhealthy.", "related_entity_ids": ["aws-sysops-service-auto-scaling--cs-1", "cl-9031af5dded4", "cl-911cd34160e9", "cl-94533f105047"]}, {"type": "quality", "severity": "low", "description": "Both synthesis outputs rely on q098 claims that are low confidence and marked needs-review. The contrast set cites cl-4084632746a0, and the mental model's limit 'it does not make the ELB itself redundant' rests on it. The other q098 claims (cl-6f199e65b744 for Route 53 failover, cl-403da5e71dca for an ELB being inherently highly available) leave the intended answer unresolved.", "related_entity_ids": ["aws-sysops-service-auto-scaling--cs-1", "aws-sysops-service-auto-scaling--m-1", "cl-4084632746a0", "cl-6f199e65b744", "cl-403da5e71dca"]}, {"type": "stale-risk", "severity": "low", "description": "The mental model and cl-d33bebe23f93 list 8 suspendable processes as if the list were complete. The current EC2 Auto Scaling list also includes InstanceRefresh, so presenting the 8 as the full set of loop steps may be out of date.", "related_entity_ids": ["aws-sysops-service-auto-scaling--m-1", "cl-d33bebe23f93"]}], "sourceQuestionCount": 83}], "sources": {"kind": "locked", "file": "aws-sysops-service-auto-scaling-sgvw.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>

          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}

        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>

    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>

        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}

        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;

  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
