<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 1, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-cloudformation", "exam": "aws-sysops", "facet": {"key": "service", "value": "cloudformation"}, "schemaVersion": 1}, "sourceQuestions": [{"id": "awssysops-p1-q049", "status": "active", "disputed": false, "stem": "Your team is excited about the use of AWS because now they have access to \"programmable infrastructure.\" You have been asked to manage your AWS infrastructure in a manner similar to the way you might manage application code. You want to be able to deploy exact copies of different versions of your infrastructure, stage changes into different environments, revert back to previous versions, and identify what versions are running at any particular time (development, test, QA, production).\n\nWhich approach addresses this requirement?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use cost allocation reports and AWS OpsWorks to deploy and manage your infrastructure."}, {"letter": "B", "text": "Use AWS CloudWatch metrics and alerts along with resource tagging to deploy and manage your infrastructure."}, {"letter": "C", "text": "Use AWS Beanstalk and a version control system like GIT to deploy and manage your infrastructure."}, {"letter": "D", "text": "Use AWS CloudFormation and a version control system like GIT to deploy and manage your infrastructure."}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D. CloudFormation templates let you version-control your infrastructure definition exactly like application code (store templates in Git, branch/tag/revert them, diff versions), and stack updates/changesets let you deploy that exact same definition to multiple environments and know precisely which version is running where. C (Beanstalk + Git) manages application deployment, not the underlying infrastructure definition -- Beanstalk abstracts infrastructure away rather than making it inspectable/versionable the way a CloudFormation template is. A (cost allocation + OpsWorks) and B (CloudWatch + tagging) address cost visibility and monitoring/labeling, not infrastructure-as-code versioning. Note: the source reference snippet attached to this question discusses OpsWorks-for-Chef-Automate update behavior, which doesn't actually match the boxed answer D or the question's real subject (IaC versioning) -- likely a mismatched reference in the source material, not a signal to reconsider the answer.", "facets": {"service": ["CloudFormation"], "concern": ["infrastructure-as-code", "deployment"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 69, "question_number": 49}, "fingerprint": "837f156836dccac5433babe7c2d2d54844de20f910dcca5929958f24371a6996"}, {"id": "awssysops-p1-q059", "status": "active", "disputed": false, "stem": "A user is planning to use AWS CloudFormation for his automatic deployment requirements. Which of the below mentioned components are required as a part of the template?", "choice_type": "single", "choices": [{"letter": "A", "text": "Parameters"}, {"letter": "B", "text": "Outputs"}, {"letter": "C", "text": "Template version"}, {"letter": "D", "text": "Resources"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D. A CloudFormation template's only mandatory top-level section is Resources, where you declare the AWS resources the stack will create. Parameters, Outputs, and the template format version are all optional fields that add flexibility (input values, exported values, and schema versioning respectively) but a template with nothing but a Resources section is still valid and deployable.", "facets": {"service": ["CloudFormation"], "concern": ["templates"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 80, "question_number": 59}, "fingerprint": "4f06ead3cc6cc061fe998d5475cf0d241702093a469e4d7ed57ce2b6fd500504"}, {"id": "awssysops-p1-q072", "status": "active", "disputed": false, "stem": "An organization is planning to use AWS for their production roll out. The organization wants to implement automation for deployment such that it will automatically create a LAMP stack, download the latest PHP installable from S3 and setup the ELB. Which of the below mentioned AWS services meets the requirement for making an orderly deployment of the software?", "choice_type": "single", "choices": [{"letter": "A", "text": "AWS Elastic Beanstalk"}, {"letter": "B", "text": "AWS CloudFront"}, {"letter": "C", "text": "AWS CloudFormation"}, {"letter": "D", "text": "AWS DevOps"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C. CloudFormation is purpose-built to provision an ordered, dependency-aware collection of AWS resources -- exactly what's needed to stand up a LAMP stack, EC2 instances, and an ELB, while referencing an S3-hosted PHP installable, all from one declarative template. CloudFront (B) is a CDN, unrelated to provisioning infrastructure; 'AWS DevOps' (D) is not an actual AWS service name. Elastic Beanstalk (A) is a strong distractor since it can also provision a full LAMP environment including an ELB, but the question specifically calls out 'orderly deployment' of infrastructure and downloading an installable from an S3 source, which is CloudFormation's core value proposition (and which Beanstalk itself is built on under the hood). Community discussion remains genuinely split between A and C even without a formatted vote tally, so this is one to sanity-check against the exam's actual intended scope (infrastructure automation vs. application platform) if it recurs.", "facets": {"service": ["CloudFormation", "Elastic Beanstalk"], "concern": ["deployment-automation", "infrastructure-as-code"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 95, "question_number": 72}, "fingerprint": "381d0c855d162c68292b4e95ce49e397f9fe3259cf052f6aa3cd49158431115b"}, {"id": "awssysops-p1-q077", "status": "active", "disputed": false, "stem": "A user is planning to use AWS CloudFormation. Which of the below mentioned functionalities does not help him to correctly understand CloudFormation?", "choice_type": "single", "choices": [{"letter": "A", "text": "CloudFormation follows the DevOps model for the creation of Dev & Test"}, {"letter": "B", "text": "AWS CloudFormation does not charge the user for its service but only charges for the AWS resources created with it"}, {"letter": "C", "text": "CloudFormation works with a wide variety of AWS services, such as EC2, EBS, VPC, IAM, S3, RDS, ELB, etc."}, {"letter": "D", "text": "CloudFormation provides a set of application bootstrapping scripts which enables the user to install Software"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A. CloudFormation is explicitly not tied to any particular delivery methodology like DevOps -- it's a general provisioning tool: you define templates and use them to create/update AWS resources in a predictable order, regardless of what process framework your team follows. That makes A the false statement among the choices, which is what the question is looking for ('does not help correctly understand'). B, C, and D are all accurate: CloudFormation itself is free (you only pay for the resources it creates), it supports a broad range of AWS services, and it does support bootstrapping scripts (e.g. cfn-init) for installing software on provisioned instances.", "facets": {"service": ["CloudFormation"], "concern": ["infrastructure-as-code"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 100, "question_number": 77}, "fingerprint": "e7b422f1cf28734c6a137579dc52226e94e779e368a983f164173b1e048e7c05"}, {"id": "awssysops-p1-q102", "status": "active", "disputed": false, "stem": "A customer is using AWS for Dev and Test. The customer wants to setup the Dev environment with Cloudformation. Which of the below mentioned steps are not required while using Cloudformation?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create a stack"}, {"letter": "B", "text": "Configure a service"}, {"letter": "C", "text": "Create and upload the template"}, {"letter": "D", "text": "Provide the parameters configured as part of the template"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B. Standing up a CloudFormation-managed environment only requires writing the template (a JSON/YAML file describing the AWS resources), creating a stack from it, and supplying any parameter values the template defines -- CloudFormation itself provisions the underlying resources as part of stack creation. There's no separate 'configure a service' step, since the template-and-stack mechanics are what create and wire up the actual services; that action doesn't exist as a distinct step in the CloudFormation workflow.", "facets": {"service": ["CloudFormation"], "concern": ["deployment"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 127, "question_number": 102}, "fingerprint": "54914311a1201d61c2dee2b4877f7f2b6c44fcee6e22a1d7598de1c37d4cb4fc"}, {"id": "awssysops-p1-q164", "status": "active", "disputed": false, "stem": "A user has created a Cloudformation stack. The stack creates AWS services, such as EC2 instances, ELB, AutoScaling, and RDS. While creating the stack it created EC2, ELB and AutoScaling but failed to create RDS. What will Cloudformation do in this scenario?", "choice_type": "single", "choices": [{"letter": "A", "text": "Cloudformation can never throw an error after launching a few services since it verifies all the steps before launching"}, {"letter": "B", "text": "It will warn the user about the error and ask the user to manually create RDS"}, {"letter": "C", "text": "Rollback all the changes and terminate all the created services"}, {"letter": "D", "text": "It will wait for the user's input about the error and correct the mistake after the input"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C. CloudFormation's default behavior when any resource in a stack fails to create is to automatically roll back the entire stack -- deleting or terminating every resource it had already successfully created -- rather than leaving a partially-created stack behind. A is wrong since CloudFormation absolutely can fail partway through (it doesn't pre-verify every downstream resource before starting). B and D both describe a manual-intervention model that isn't how CloudFormation's automatic rollback actually works by default.", "facets": {"service": ["CloudFormation"], "concern": ["stack-rollback"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 191, "question_number": 164}, "fingerprint": "e6e6c712d512675d97424773e7074fcdbe89387604081c8e514886e59c5b19cd"}, {"id": "awssysops-p1-q177", "status": "active", "disputed": false, "stem": "A user is using Cloudformation to launch an EC2 instance and then configure an application after the instance is launched. The user wants the stack creation of ELB and AutoScaling to wait until the EC2 instance is launched and configured properly. How can the user configure this?", "choice_type": "single", "choices": [{"letter": "A", "text": "It is not possible that the stack creation will wait until one service is created and launched"}, {"letter": "B", "text": "The user can use the HoldCondition resource to wait for the creation of the other dependent resources"}, {"letter": "C", "text": "The user can use the DependentCondition resource to hold the creation of the other dependent resources"}, {"letter": "D", "text": "The user can use the WaitCondition resource to hold the creation of the other dependent resources"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D (unanimous community vote, 100%). CloudFormation's WaitCondition resource acts as a barrier that blocks creation of dependent resources (like the ELB and Auto Scaling group here) until an explicit completion signal is received from an external source, such as a cfn-signal call run at the end of the EC2 instance's configuration script -- exactly the ordering the user needs. B and C invent resource types ('HoldCondition', 'DependentCondition') that don't exist in CloudFormation. A is wrong since this exact wait-for-signal capability is the WaitCondition resource's purpose.", "facets": {"service": ["CloudFormation"], "concern": ["wait-condition"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 205, "question_number": 177}, "fingerprint": "e2b0ac9837c26f8912896d1e37f152efe1a6995a22083e3a77955b2d89f869d9"}, {"id": "awssysops-p1-q278", "status": "active", "disputed": false, "stem": "A user is creating a Cloudformation stack. Which of the below mentioned limitations does not hold true for Cloudformation?", "choice_type": "single", "choices": [{"letter": "A", "text": "One account by default is limited to 100 templates"}, {"letter": "B", "text": "The user can use 60 parameters and 60 outputs in a single template"}, {"letter": "C", "text": "The template, parameter, output, and resource description fields are limited to 4096 characters"}, {"letter": "D", "text": "One account by default is limited to 20 stacks"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Boxed answer: A, since per the reference passage there is no default cap on the number of templates at all -- CloudFormation limits are actually per-stack (20 stacks by default) and per-template (60 parameters/60 outputs, 4096-character description fields), making A's '100 templates' limit the one that doesn't correspond to any real CloudFormation quota. This carries a real 'documentation/platform changed over time' caveat: a comment (ablazleon) links AWS's October 2020 quota-increase announcement showing the per-template parameter/output limit was raised from 60 to 200, meaning B's '60 parameters and 60 outputs' figure -- while accurate when this question was written -- is now also outdated, and by that same 2020 update several other quoted numbers here may no longer be current. No formatted vote is present to weigh, so A is kept as it best matches the question's original intent (a template-count limit that was never real, versus B/C/D which are all limits that did genuinely exist at some point, only some of which have since changed).", "facets": {"service": ["CloudFormation"], "concern": ["account-and-template-quota-limits"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 307, "question_number": 278}, "fingerprint": "6c72d3cf60464867f2fa1a342e089f05b43dae7eb02ade6d728b8c5cae8721dd"}, {"id": "awssysops-p2-q332", "status": "active", "disputed": false, "stem": "A colleague is attempting to launch several new CloudFormation stacks, and receives the following error response:\nWhat should be done to address the error?\n\n[![image](../assets/p36-q332.png)](../assets/p36-q332.png)\n\n*Diagram description:* An AWS API XML error response: <Error><Type>Sender<\/Type><Code>Throttling<\/Code><Message>Rate exceeded<\/Message><\/Error> -- confirming the colleague is hitting CloudFormation's API rate limit, not a resource or template error.", "choice_type": "single", "choices": [{"letter": "A", "text": "Add a Pause to the CloudFormation templates."}, {"letter": "B", "text": "Add an exponential backoff between CreateStack API calls."}, {"letter": "C", "text": "Run the CloudFormation API calls from a larger Amazon EC2 instance."}, {"letter": "D", "text": "Combine stack templates into one, and retry the CreateStack API call."}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B. No structured vote tally is present, but every comment agrees. The diagram confirms the exact error being received is a Throttling error ('<Code>Throttling<\/Code><Message>Rate exceeded<\/Message>'), AWS's standard signal that API calls are arriving faster than the service's rate limit allows -- launching several stacks at once multiplies the CreateStack (and related) API calls hitting CloudFormation in a short window. AWS's own general guidance for this exact error class is exponential backoff with jitter between retries, which spaces out retries so concurrent callers don't all collide again at the same fixed interval. A (adding a 'Pause' to templates) isn't a real CloudFormation feature for this. C (a larger EC2 instance) wouldn't help -- the bottleneck is API rate limiting on AWS's side, not local compute. D (combining templates) reduces the number of stacks but doesn't address the underlying pattern of bursty, unthrottled retries.", "facets": {"service": ["CloudFormation"], "concern": ["api-throttling-exponential-backoff"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 36, "question_number": 332}, "fingerprint": "8b9826c39ed65507f1ca6a9be09a3bf962bebb6e950b9ad665a3e9a9c9cb81c0"}, {"id": "awssysops-p2-q338", "status": "active", "disputed": false, "stem": "A corporate policy requires all new infrastructure deployments to use scalable and reusable resources to improve resources delivery times. The policy also restricts resource configuration management to the systems operations team. The development team requests the ability to deploy resources on demand in an effort to streamline their software development lifecycle.\nWhat can the systems operations team do to ensure company policy is followed while also meeting the development team's requests?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create an AWS CloudFormation on template with the requested resources, and give it to the development team to adjust as needed."}, {"letter": "B", "text": "Provision the resources using the CLI, and create the necessary IAM permissions to allow the development team to modify them as needed."}, {"letter": "C", "text": "Create the AWS Service Catalog product and share with the development team through the Service Catalog."}, {"letter": "D", "text": "Grant the development team access to the AWS CloudFormation Design Template Editor to specify the needed resources and configurations. Once the templates are complete, the system operations team will launch the resources."}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Boxed answer: D, but this is flagged as a boxed-vs-vote conflict (vote unanimous for C, 100%) where the vote's reasoning is unusually strong: D actually seems to contradict the question's own stated constraint. The policy explicitly restricts resource configuration management to the systems operations team, yet D would hand the development team direct access to author/edit CloudFormation templates themselves -- exactly the kind of configuration-management access the policy says should stay with ops. AWS Service Catalog (C) is the purpose-built mechanism for this scenario: the ops team authors and owns standardized, pre-approved product templates, then shares them for self-service, on-demand deployment by other teams -- delivering scalability/reusability and developer self-service without ever giving the dev team template-editing access. Comments (hou0220, albert_kuo) directly cite AWS's own description of Service Catalog for exactly this governance-plus-self-service pattern.", "facets": {"service": ["CloudFormation", "Service Catalog"], "concern": ["self-service-provisioning-with-governance"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 42, "question_number": 338}, "fingerprint": "634f4d916c0897cd5b6d8845de6f22c11c381c0d5af576a24474f75e77ac77f7"}, {"id": "awssysops-p2-q376", "status": "active", "disputed": false, "stem": "In regard to AWS CloudFormation, to pass values to your template at runtime you should use ____________.", "choice_type": "single", "choices": [{"letter": "A", "text": "parameters"}, {"letter": "B", "text": "conditions"}, {"letter": "C", "text": "resources"}, {"letter": "D", "text": "mapping"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "CloudFormation's optional Parameters section lets you pass values into a template at stack-creation/update time, which can then be referenced (dereferenced) from the Resources and Outputs sections. See https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/concept-template.html.", "facets": {"service": ["CloudFormation"], "concern": ["template-parameters"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 69, "question_number": 376}, "fingerprint": "61b518459b118c234e000b6abb77ae2c9d2ab742828eb26d2b4dcaf245fc0b36"}, {"id": "awssysops-p2-q489", "status": "active", "disputed": false, "stem": "Is it possible to create an S3 bucket accessible only by a certain IAM user using policies in a CloudFormation template?", "choice_type": "single", "choices": [{"letter": "A", "text": "Yes, all these resources can be created using a CloudFormation template"}, {"letter": "B", "text": "S3 is not supported by CloudFormation."}, {"letter": "C", "text": "No, you can only create the S3 bucket but not the IAM user."}, {"letter": "D", "text": "No, in the same template you can only create the S3 bucket and the relative policy."}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "A single CloudFormation template can create the IAM user, the S3 bucket, and the policy binding them together — S3, IAM, and their combined resource-level access controls are all resources CloudFormation supports natively. See https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-iam-template.html. Community vote distribution was unanimous at A (100%).", "facets": {"service": ["CloudFormation", "IAM", "S3"], "concern": ["cloudformation-iam-plus-s3-in-one-template"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 165, "question_number": 489}, "fingerprint": "3f6a6ae65e30880ac1297b107dc088c3bb4292d6b3085a0c6ecae6dbb1ca2c9a"}, {"id": "awssysops-p2-q537", "status": "active", "disputed": true, "stem": "An AWS CloudFormation template creates an Amazon RDS instance. This template is used to build up development environments as needed and then delete the stack when the environment is no longer required. The RDS-persisted data must be retained for further use, even after the CloudFormation stack is deleted.\nHow can this be achieved in a reliable and efficient way?", "choice_type": "single", "choices": [{"letter": "A", "text": "Write a script to continue backing up the RDS instance every five minutes"}, {"letter": "B", "text": "Create an AWS Lambda function to take a snapshot of the RDS instance, and manually execute the function before deleting the stack"}, {"letter": "C", "text": "Use the Snapshot Deletion Policy in the CloudFormation template definition of the RDS instance"}, {"letter": "D", "text": "Create a new CloudFormation template to perform backups of the RDS instance, and run this template before deleting the stack"}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "Setting the DeletionPolicy attribute to Snapshot on the RDS resource in the template makes CloudFormation automatically snapshot the DB instance as part of stack deletion — no manual script, Lambda invocation, or separate backup template is needed. The source's own recorded 'Community vote distribution' is unanimous (100%) for C, directly contradicting the boxed answer D, and is backed by the AWS documentation link embedded in the source's own comments.", "facets": {"service": ["CloudFormation", "RDS"], "concern": ["deletion-policy", "snapshot-retention"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 217, "question_number": 537}, "fingerprint": "5315106136aac01984e39c4b807653c57aaee89e4eb4919ef8147d8387dc8e79"}, {"id": "awssysops-p2-q547", "status": "active", "disputed": true, "stem": "While creating the wait condition resource in AWS CloudFormation, a SysOps Administrator receives the error `received 0 signals out of the 1 expected from the\nEC2 instance`.\nWhat steps should be taken to troubleshoot this issue? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Confirm from the cfn logs that the cfn-signal command was successfully run on the instance."}, {"letter": "B", "text": "Try to re-create the stack with a different IAM user."}, {"letter": "C", "text": "Check that the instance has a route to the Internet through a NAT device."}, {"letter": "D", "text": "Update the AWS CloudFormation stack service role to have iam:PassRole permission."}, {"letter": "E", "text": "Delete the existing stack and attempt to create a new once."}], "correct_answer": ["A", "D"], "source_correct_answer": ["A", "D"], "correct_answer_override": null, "explanation": "The most common causes of a wait-condition signal timeout are the cfn-signal command never actually running or succeeding on the instance (confirmable via cfn logs), and the instance lacking outbound Internet access (via a NAT device, or a PrivateLink endpoint added later) needed to reach the CloudFormation signaling endpoint — both directly covered in AWS's own troubleshooting documentation. IAM's PassRole permission (D) is unrelated to wait-condition signaling. The recorded vote is unanimous (100%) for A & C, diverging from the boxed A & D, backed by direct citations to AWS's troubleshooting guide across nearly every comment.", "facets": {"service": ["CloudFormation", "VPC"], "concern": ["wait-condition-troubleshooting", "nat-gateway-connectivity"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 231, "question_number": 547}, "fingerprint": "a63f5c0c13c999c704366e3a60885d8878963afba9fe6608d0eebefc84bffc53"}, {"id": "awssysops-p2-q564", "status": "active", "disputed": false, "stem": "A developer deploys an application running on Amazon EC2 by using an AWS CloudFormation template. The developer launches the stack from the console logged in as an AWS Identity and Access Management (IAM) user. When a SysOps Administrator attempts to run the same AWS CloudFormation template in the same AWS account from the console, it fails and returns the error: The image id '[ami-2a69aa47]' does not exist. What is the MOST likely cause of the failure?", "choice_type": "single", "choices": [{"letter": "A", "text": "The Administrator does not have the same IAM permissions as the developer."}, {"letter": "B", "text": "The Administrator used a different SSH key from that of the developer."}, {"letter": "C", "text": "The Administrator is running the template in a different region."}, {"letter": "D", "text": "The Administrator's Amazon EC2 service limits have been exceeded"}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "AMI IDs are scoped to a single AWS Region — the same ami-2a69aa47 identifier refers to a different (or nonexistent) image in each Region. If the Administrator runs the identical template from a different Region than the developer used, the hardcoded AMI ID won't resolve there, producing exactly this error. Community vote is unanimous for C.", "facets": {"service": ["CloudFormation", "EC2"], "concern": ["ami-region-scoping"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 256, "question_number": 564}, "fingerprint": "996d7aea82efc83c8f1db9c1fe281852b7522d4914fb13cf20ac1804f55081f7"}, {"id": "awssysops-p2-q580", "status": "active", "disputed": true, "stem": "A SysOps Administrator is using AWS CloudFormation to deploy resources but would like to manually address any issues that the template encounters. What should the Administrator add to the template to support the requirement?", "choice_type": "single", "choices": [{"letter": "A", "text": "Enable Termination Protection on the stack"}, {"letter": "B", "text": "Set the OnFailure parameter to \"DO_NOTHING\""}, {"letter": "C", "text": "Restrict the IAM permissions for CloudFormation to delete resources"}, {"letter": "D", "text": "Set the DeleteStack API action to \"No\""}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "The CreateStack API's OnFailure parameter accepts DO_NOTHING, ROLLBACK, or DELETE — setting it to DO_NOTHING stops CloudFormation from automatically rolling back or deleting the stack on failure, leaving it exactly as-is so the Administrator can manually inspect and address whatever went wrong. Termination Protection (the boxed answer, A) only blocks explicit stack-deletion requests; it has no effect on the automatic rollback CloudFormation performs when a deployment itself fails. 'DeleteStack API action' (D) isn't a real settable stack parameter. Community vote is unanimous (100%) for B, directly contradicting the boxed answer A, backed by direct AWS CLI/troubleshooting documentation citations across multiple comments (including a 12-upvote top comment).", "facets": {"service": ["CloudFormation"], "concern": ["stack-failure-handling", "onfailure-parameter"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 274, "question_number": 580}, "fingerprint": "fef3ad906c164b5dbe689268ea797a307ccd09467281d1e8d8dc8c5b6485b19e"}, {"id": "awssysops-p2-q593", "status": "active", "disputed": true, "stem": "An organization is running multiple applications for their customers. Each application is deployed by running a base AWS CloudFormation template that configures a new VPC. All applications are run in the same AWS account and AWS Region. A SysOps Administrator has noticed that when trying to deploy the same AWS CloudFormation stack, it fails to deploy. What is likely to be the problem?", "choice_type": "single", "choices": [{"letter": "A", "text": "The Amazon Machine image used is not available in that region."}, {"letter": "B", "text": "The AWS CloudFormation template needs to be updated to the latest version."}, {"letter": "C", "text": "The VPC configuration parameters have changed and must be updated in the template."}, {"letter": "D", "text": "The account has reached the default limit for VPCs allowed."}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "Every new deployment of this base template provisions a brand-new VPC, and the default VPC limit is 5 per account per region — since every application is deployed into the same account and region, repeated deployments will eventually exhaust that quota and the stack creation will fail with a VPC-limit error, resolvable by requesting a limit increase or freeing up unused VPCs. 'The template needs to be updated to the latest version' (the boxed answer, B) isn't a real, diagnosable CloudFormation failure mode at all. Community vote is unanimous (100%) for D, directly contradicting the boxed answer B, backed by direct AWS VPC-limits documentation citations across a large number of highly-upvoted comments (18, 9, and several more).", "facets": {"service": ["VPC", "CloudFormation"], "concern": ["vpc-limit", "per-account-per-region-quota"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 295, "question_number": 593}, "fingerprint": "3e99ba33a4333547ff03ee4138a0f0fcd59880d3bbd9597b63bbe85c3a5ccc2d"}, {"id": "awssysops-p2-q596", "status": "active", "disputed": false, "stem": "A company would like to review each change in the infrastructure before deploying updates in its AWS CloudFormation stacks.\nWhich action will allow an Administrator to understand the impact of these changes before implementation?", "choice_type": "single", "choices": [{"letter": "A", "text": "Implement a blue/green strategy using AWS Elastic Beanstalk."}, {"letter": "B", "text": "Perform a canary deployment using Application Load Balancers and target groups."}, {"letter": "C", "text": "Create a change set for the running stack."}, {"letter": "D", "text": "Submit the update using the UpdateStack API call."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "A CloudFormation change set generates a preview of exactly which resources will be added, modified, or replaced before the update is actually applied, letting an administrator review and approve (or reject) the impact ahead of time — the AWS best-practices guide and community both point unanimously to this. Blue/green via Elastic Beanstalk (A) and canary via ALB target groups (B) are deployment-traffic-shifting strategies, not change-preview tools, and calling UpdateStack directly (D) applies the change immediately with no review step at all.", "facets": {"service": ["CloudFormation"], "concern": ["change-sets", "pre-deployment-review"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 301, "question_number": 596}, "fingerprint": "c56442505fb0baf7d969760672fac42d23f1da370906b022a0fdc82545f6a6f1"}, {"id": "awssysops-p3-1-q615", "status": "active", "disputed": true, "stem": "A company creates custom AMI images by launching new Amazon EC2 instances from an AWS CloudFormation template. It installs and\nconfigures necessary software through AWS OpsWorks, and takes images of each EC2 instance. The process of installing and configuring\nsoftware can take between 2 to 3 hours, but at times, the process stalls due to installation errors.\nThe SysOps Administrator must modify the CloudFormation template so if the process stalls, the entire stack will fail and roll back.\nBased on these requirements, what should be added to the template?", "choice_type": "single", "choices": [{"letter": "A", "text": "Conditions with a timeout set to 4 hours."}, {"letter": "B", "text": "CreationPolicy with a timeout set to 4 hours."}, {"letter": "C", "text": "DependsOn with a timeout set to 4 hours."}, {"letter": "D", "text": "Metadata with a timeout set to 4 hours."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "A CreationPolicy attribute tells CloudFormation to wait for an explicit success signal (sent, e.g., via cfn-signal once OpsWorks finishes installing and configuring software) before considering the resource — and therefore the stack — created; if the signal doesn't arrive within the specified timeout (up to 12 hours; here 4), CloudFormation marks the resource CREATE_FAILED and rolls the whole stack back, matching the requirement exactly. 'Conditions' (the boxed answer, A) control whether a resource or property is included at all based on input values, not how long to wait for its own configuration to finish; DependsOn (a minority alternative) only orders resource creation relative to another resource with no wait-for-signal/timeout semantics; and Metadata is inert documentation with no runtime effect on stack creation. Community vote is unanimous (100%) for B, directly contradicting the boxed answer A, backed by direct AWS CreationPolicy documentation and a 16-upvote top comment.", "facets": {"service": ["CloudFormation"], "concern": ["creation-policy", "resource-signal-timeout"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 27, "question_number": 615}, "fingerprint": "87d73311a4c4d386fe1df85f772cd0155c8b3acece288bbc53ccc306d11e6c63"}, {"id": "awssysops-p3-1-q616", "status": "active", "disputed": true, "stem": "A SysOps Administrator must take a team's single existing AWS CloudFormation template and split it into smaller, service-specific templates. All\nof the services in the template reference a single, shared Amazon S3 bucket.\nWhat should the Administrator do to ensure that this S3 bucket can be referenced by all the service templates?", "choice_type": "single", "choices": [{"letter": "A", "text": "Include the S3 bucket as a mapping in each template."}, {"letter": "B", "text": "Add the S3 bucket as a resource in each template."}, {"letter": "C", "text": "Create the S3 bucket in its own template and export it."}, {"letter": "D", "text": "Generate the S3 bucket using StackSets."}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "Provisioning the shared S3 bucket in its own template and exporting its name/ARN via an Output's Export lets every other service-specific template import that single bucket with Fn::ImportValue — the documented AWS best-practice pattern for a resource (a shared bucket, VPC, or security group) that multiple stacks need to reference. Adding the bucket 'as a resource in each template' (the boxed answer, B) would create a separate, independent S3 bucket per template rather than sharing one; a mapping (A) is a static lookup table, not a live resource reference; and StackSets (D) deploys the same stack across multiple accounts/regions, which doesn't solve cross-stack resource sharing within one account/region. Community vote is unanimous (100%) for C, directly contradicting the boxed answer B, backed by direct AWS best-practices documentation and multiple highly-upvoted comments (9, 7).", "facets": {"service": ["CloudFormation"], "concern": ["cross-stack-references", "shared-resource-export"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 30, "question_number": 616}, "fingerprint": "c3fa905c852ec1fb35d3216a4d1976bb9d3746937239413b8eb198086e657119"}, {"id": "awssysops-p3-1-q624", "status": "active", "disputed": false, "stem": "A SysOps Administrator is troubleshooting an AWS CloudFormation template whereby multiple Amazon EC2 instances are being created. The\ntemplate is working in us-east-1, but it is failing in us-west-2 with the error code:\nAMI [ami-12345678] does not exist\nHow should the Administrator ensure that the AWS CloudFormation template is working in every region?", "choice_type": "single", "choices": [{"letter": "A", "text": "Copy the source region's Amazon Machine Image (AMI) to the destination region and assign it the same ID."}, {"letter": "B", "text": "Edit the AWS CloudFormation template to specify the region code as part of the fully qualified AMI ID."}, {"letter": "C", "text": "Edit the AWS CloudFormation template to offer a drop-down list of all AMIs to the user by using the AWS::EC2::AMI::ImageID control."}, {"letter": "D", "text": "Modify the AWS CloudFormation template by including the AMI IDs in the \"Mappings\" section. Refer to the proper mapping within the template for the proper AMI ID."}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "The CloudFormation Mappings section lets a template define a lookup table keyed by region (or another dimension) mapping to the correct AMI ID for each, retrieved at deploy time via Fn::FindInMap — so the same template deploys correctly in any region as long as its mapping table covers that region, without hardcoding a single region's AMI ID. Simply copying the AMI to the new region under the same ID (A) isn't how AMI copies work, since a copy always gets a new, region-specific ID; embedding the region code directly into 'the fully qualified AMI ID' (B) isn't a real AMI ID format; and prompting the deployer to pick from a dropdown of all AMIs (C) pushes a decision onto the user that the template should make automatically. Community vote is unanimous for D.", "facets": {"service": ["CloudFormation"], "concern": ["region-specific-ami-mapping"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 42, "question_number": 624}, "fingerprint": "a0e8705b355e5e58999a5dd5e1ef8af06b9741920739675f16043614f76cdc79"}, {"id": "awssysops-p3-1-q646", "status": "active", "disputed": false, "stem": "A company has 50 AWS accounts and wants to create an identical Amazon VPC in each account. Any changes the company makes to the VPCs in\nthe future must be implemented on every VPC.\nWhat is the SIMPLEST method to deploy and update the VPCs in each account?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create an AWS CloudFormation template that defines the VPC. Log in to the AWS Management Console under each account and create a stack from the template."}, {"letter": "B", "text": "Create a shell script that configures the VPC using the AWS CLI. Provide a list of accounts to the script from a text file, then create the VPC in every account in the list."}, {"letter": "C", "text": "Create an AWS Lambda function that configures the VPC. Store the account information in Amazon DynamoDB, grant Lambda access to the DynamoDB table, then create the VPC in every account in the list."}, {"letter": "D", "text": "Create an AWS CloudFormation template that defines the VPC. Create an AWS CloudFormation StackSet based on the template, then deploy the template to all accounts using the stack set."}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "AWS CloudFormation StackSets let a single template be deployed, updated, or deleted across many accounts (and regions) with one operation from an administrator account, which is exactly the 'deploy once, update everywhere' requirement across 50 accounts. Manually logging into each of 50 accounts to create a stack from the same template (A) or a shell script driving repeated per-account CLI calls (B) both require re-running the deployment process separately per account for every future change; a custom Lambda-plus-DynamoDB account-list pipeline (C) reinvents, with far more moving parts, what StackSets already provides natively. Community vote is unanimous (100%) for D, backed by direct AWS CloudFormation StackSets documentation.", "facets": {"service": ["CloudFormation"], "concern": ["stacksets-multi-account-deployment"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 78, "question_number": 646}, "fingerprint": "52def3236d8c83cf27cac3639863908d9ee080fcb79713b6586eaf03a90db21a"}, {"id": "awssysops-p3-1-q673", "status": "active", "disputed": false, "stem": "A SysOps Administrator has been tasked with deploying a company's infrastructure as code. The Administrator wants to write a single template that can be reused for multiple environments in a safe, repeatable manner.\nWhat is the recommended way to use AWS CloudFormation to meet this requirement?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use parameters to provision the resources."}, {"letter": "B", "text": "Use nested stacks to provision the resources."}, {"letter": "C", "text": "Use Amazon EC2 user data to provision the resources."}, {"letter": "D", "text": "Use stack policies to provision the resources."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "AWS's own CloudFormation best-practices guide recommends using parameters (along with mappings and conditions) to make a single template reusable and safely customizable per environment — e.g. a smaller instance type for development versus production — without duplicating templates. Nested stacks (B) address decomposing a large template into reusable component stacks, not customizing one template's values per environment; EC2 user data (C) configures an instance at boot time and has nothing to do with template reuse; and stack policies (D) protect specific resources from unintended updates, unrelated to parameterizing a template for multiple environments. Community vote is unanimous (100%) for A, backed directly by the AWS CloudFormation best-practices documentation ('Reuse templates to replicate stacks in multiple environments').", "facets": {"service": ["CloudFormation"], "concern": ["template-reuse-across-environments", "parameters-mappings-conditions"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 127, "question_number": 673}, "fingerprint": "056c1b8db460c14bbd2e464ba19e54dc8d0645945e9f6161a2561c5a7e6ecd5f"}, {"id": "awssysops-p3-1-q690", "status": "active", "disputed": false, "stem": "A company with dozens of AWS accounts wants to ensure that governance rules are being applied across all accounts. The CIO has recommended that AWS Config rules be deployed using an AWS CloudFormation template. How should these requirements be met?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create a CloudFormation stack set, then select the CloudFormation template and use it to configure the AWS accounts"}, {"letter": "B", "text": "Write a script that iterates over the company's AWS accounts and executes the CloudFormation template in each account"}, {"letter": "C", "text": "Use AWS Organizations to execute the CloudFormation template in all accounts"}, {"letter": "D", "text": "Create a CloudFormation stack in the master account of AWS Organizations and execute the CloudFormation template to create AWS Config rules in all accounts"}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "AWS CloudFormation StackSets is the purpose-built feature for provisioning the same template — such as one defining AWS Config rules — across many AWS accounts and regions from a single administrative operation, directly matching the CIO's requirement with no additional custom tooling. Writing a custom account-iteration script (B) reinvents what StackSets already provides; a plain CloudFormation stack in the Organizations master account (D) only deploys resources into that one account, not across all member accounts, unless paired with StackSets' organizational deployment feature, which the choice doesn't describe; and 'use AWS Organizations to execute the template' (C) isn't how CloudFormation templates are actually deployed. Community discussion favors A by a strong majority (15, 6 upvotes for A vs. scattered later-dated dissent citing a separate, newer StackSets-via-Organizations feature), matching the boxed answer, backed by the AWS CloudFormation StackSets documentation and blog announcement.", "facets": {"service": ["CloudFormation"], "concern": ["stack-sets-multi-account-deployment"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 155, "question_number": 690}, "fingerprint": "0dbed4e8968888ec284f303fc6307ba8ef1d93c865e94cecc1abb37f752a36d4"}, {"id": "awssysops-p3-1-q703", "status": "active", "disputed": true, "stem": "A company is planning to expand into an additional AWS Region for disaster recovery purposes. The company uses AWS CloudFormation, and its infrastructure is well-defined as code. The company would like to reuse as much of its existing code as possible when deploying resources to additional Regions.\nA SysOps Administrator is reviewing how Amazon Machine Images (AMIs) are selected in AWS CloudFormation, but is having trouble making the same stack work in the new Region.\nWhich action would make it easier to manage multiple Regions?", "choice_type": "single", "choices": [{"letter": "A", "text": "Name each AMI in the new Region exactly the same as the equivalent AMI in the first Region."}, {"letter": "B", "text": "Duplicate the stack so unique AMI names can be coded into the appropriate stack."}, {"letter": "C", "text": "Create an alias for each AMI so that an AMI can be referenced by a common name across Regions."}, {"letter": "D", "text": "Create a Mappings section in the stack, and define the Region to AMI associations."}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "A CloudFormation Mappings section lets a single template encode a Region-to-AMI lookup table (keyed by AWS::Region), so the exact same stack can be deployed unmodified into any Region while automatically picking the correct AMI ID for that Region — directly satisfying the stated goal of maximizing code reuse. The boxed answer (B), duplicating the stack per Region, is the literal opposite of that goal, and reviewers note CloudFormation resolves AMIs by ID rather than name, which also undercuts naming-based approaches (A, C) since AMI IDs are inherently Region-specific and cannot be manually aliased by a customer — only AWS controls AMI sharing/aliasing. Community vote is unanimous (100%) for D, directly contradicting the boxed answer B, backed by the AWS CloudFormation Mappings documentation and corroborating commentary (18, 7 upvotes).", "facets": {"service": ["CloudFormation"], "concern": ["region-to-ami-mappings", "multi-region-template-reuse"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 173, "question_number": 703}, "fingerprint": "24200497c29dfbdb80a47db90b4b2d0ec8680e3e1fbfbd88a32fd609fa2c4105"}, {"id": "awssysops-p3-1-q716", "status": "active", "disputed": false, "stem": "An application running on Amazon EC2 instances in an Auto Scaling group across multiple Availability Zones was deployed using an AWS CloudFormation template. The SysOps team has patched the Amazon Machine Image (AMI) version and must update all the EC2 instances to use the new AMI.\nHow can the SysOps Administrator use CloudFormation to apply the new AMI while maintaining a minimum level of active instances to ensure service continuity?", "choice_type": "single", "choices": [{"letter": "A", "text": "Run the aws cloudformation update-stack command with the --rollback-configuration option"}, {"letter": "B", "text": "Update the CloudFormation template with the new AMI ID, then reboot the EC2 instances"}, {"letter": "C", "text": "Deploy a second CloudFormation stack and use Amazon Route 53 to redirect traffic to the new stack"}, {"letter": "D", "text": "Set an AutoScalingUpdate policy in the CloudFormation template to update the stack."}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "CloudFormation's AutoScalingRollingUpdate update policy lets the template define how the Auto Scaling group replaces instances during a stack update — replacing them in controlled batches while enforcing a minimum number of instances in service — which is exactly the mechanism needed to roll out a new AMI without dropping below a minimum active-instance count. Rebooting existing instances after just updating the template's AMI ID (B) doesn't actually apply a new AMI to already-running instances at all, since rebooting doesn't re-launch from a different image; deploying a parallel second stack with Route 53 cutover (C) works but isn't a CloudFormation-native mechanism for updating the existing stack's instances; and a bare update-stack command with a rollback-configuration option (A) only controls rollback/monitoring behavior on failure, not the instance-replacement strategy itself. Community vote is unanimous (100%) for D, backed directly by the AWS CloudFormation UpdatePolicy attribute documentation.", "facets": {"service": ["CloudFormation"], "concern": ["autoscaling-rolling-update-policy"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 193, "question_number": 716}, "fingerprint": "9957f34f4da5c32dfbf3046e0462bf25f2d9a5f7416527a11f63bdcdb9de316a"}, {"id": "awssysops-p3-1-q719", "status": "active", "disputed": false, "stem": "A company uses AWS CloudFormation to deploy its application infrastructure. Recently, a user accidentally changed a property of a database in a CloudFormation template and performed a stack update that caused an interruption to the application. A SysOps Administrator must determine how to modify the deployment process to allow the DevOps team to continue to deploy the infrastructure, but prevent against accidental modifications to specific resources.\nWhich solution will meet these requirements?", "choice_type": "single", "choices": [{"letter": "A", "text": "Set up an AWS Config rule to alert based on changes to any CloudFormation stack. An AWS Lambda function can then describe the stack to determine if any protected resources were modified and cancel the operation."}, {"letter": "B", "text": "Set up an Amazon CloudWatch Events event with a rule to trigger based on any CloudFormation API call. An AWS Lambda function can then describe the stack to determine if any protected resources were modified and cancel the operation."}, {"letter": "C", "text": "Launch the CloudFormation templates using a stack policy with an explicit allow for all resources and an explicit deny of the protected resources with an action of Update:*."}, {"letter": "D", "text": "Attach an IAM policy to the DevOps team role that prevents a CloudFormation stack from updating, with a condition based on the specific Amazon Resource names (ARNs) of the protected resources."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "A CloudFormation stack policy lets updates proceed for all resources by default while explicitly denying Update:* on the specific protected resources, so the DevOps team's normal deployments still succeed while accidental changes to the sensitive resources (like the database) are blocked outright at the CloudFormation level, directly matching the AWS CloudFormation security best-practices guidance cited in the discussion. Reactive detect-and-cancel approaches using Config or CloudWatch Events plus a Lambda function (A, B) only notice a bad change after the stack update has already started, rather than preventing it upfront. An IAM policy condition on ARNs (D) would need to block the DevOps role from ever updating those resource ARNs, which is both harder to scope correctly against a CloudFormation-orchestrated stack and less targeted than a stack policy purpose-built for exactly this. Community consensus strongly supports C (including two 'Highly Voted' comments and a brief D suggestion that its own author then corrected to C), matching the boxed answer.", "facets": {"service": ["CloudFormation"], "concern": ["stack-policy-protected-resources"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 198, "question_number": 719}, "fingerprint": "b4e4e01774678b000addc2d6cfd47da28aa81cbf61f1056d569ac9a34929ce9a"}, {"id": "awssysops-p3-1-q739", "status": "active", "disputed": true, "stem": "A company is deploying a web service to Amazon EC2 instances behind an Elastic Load Balancer. All resources will be defined and created in a single AWS CloudFormation stack using a template. The creation of each EC2 instance will not be considered complete until an initialization script has been run successfully on the EC2 instance. The Elastic Load Balancer cannot be created until all EC2 instances have been created.\nWhich CloudFormation resource will coordinate the Elastic Load Balancer creation in the CloudFormation stack template?", "choice_type": "single", "choices": [{"letter": "A", "text": "CustomResource"}, {"letter": "B", "text": "DependsOn"}, {"letter": "C", "text": "Init"}, {"letter": "D", "text": "WaitCondition"}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "AWS::CloudFormation::WaitCondition is the CloudFormation resource specifically designed to pause stack creation and wait for an explicit success signal (via a paired WaitConditionHandle and the cfn-signal helper) before letting dependent resources — like the load balancer here — proceed, exactly matching the requirement that instance creation isn't 'complete' until the initialization script finishes, per the referenced AWS CloudFormation WaitCondition documentation. The boxed answer (C), AWS::CloudFormation::Init, is metadata attached to an instance resource that the cfn-init helper script reads to install packages and run configuration — it isn't itself a resource that signals completion to other resources or coordinates their creation order. DependsOn (B) is a template attribute (not a resource) that only controls creation *order*, without waiting for any signal of actual success, so it wouldn't block the load balancer on the init script's outcome. CustomResource (A) is a general extension mechanism for invoking custom logic, not the purpose-built signaling mechanism here. An informal comment vote favors D (WaitCondition) 80% to 20% for the boxed C, backed by extensive, heavily-upvoted technical explanation distinguishing WaitCondition (a resource) from DependsOn (an attribute) and Init (instance metadata). Flagged disputed for triage, while keeping the boxed answer C per the ingestion policy.", "facets": {"service": ["CloudFormation"], "concern": ["waitcondition-signal-based-resource-coordination"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 231, "question_number": 739}, "fingerprint": "c2c9a67a2bb069c586c1b1e8927242371aaa06e71dd1a8b7bf7a74ed39397a8e"}, {"id": "awssysops-p3-1-q743", "status": "active", "disputed": false, "stem": "A SysOps Administrator created an AWS CloudFormation template and launched it for the first time. The stack failed with a status of ROLLBACK_COMPLETE. The Administrator identified and resolved the template issue causing the failure.\nHow should the Administrator continue with the stack deployment?", "choice_type": "single", "choices": [{"letter": "A", "text": "Relaunch the template to create a new stack."}, {"letter": "B", "text": "Execute a change set on the failed stack."}, {"letter": "C", "text": "Perform an update-stack action on the failed stack."}, {"letter": "D", "text": "Run a validate-template command."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "A stack in ROLLBACK_COMPLETE state has already had every partially-created resource fully cleaned up after the initial creation failure, and AWS only permits a delete operation from that state — no update-stack call or change set can be applied to it — so the correct path is to delete it (or simply relaunch, which requires a delete first) and create a fresh stack from the corrected template. Executing a change set (B) or an update-stack action (C) both require an existing, successfully-created stack to update, which ROLLBACK_COMPLETE explicitly is not. Running validate-template (D) only checks template syntax and doesn't advance the deployment at all. Community vote (an informal 83%/17% split) favors A over C, matching the boxed answer, and is backed by clear technical explanation of the ROLLBACK_COMPLETE state's restrictions.", "facets": {"service": ["CloudFormation"], "concern": ["rollback-complete-delete-and-recreate"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 238, "question_number": 743}, "fingerprint": "82be29c3aebd9884ca645a6c36ab639ef4504ccafac4834f1795b7369413fc40"}, {"id": "awssysops-p3-1-q747", "status": "active", "disputed": false, "stem": "A SysOps Administrator is tasked with deploying and managing a single CloudFormation template across multiple AWS accounts.\nWhat feature of AWS CloudFormation will accomplish this?", "choice_type": "single", "choices": [{"letter": "A", "text": "Change sets"}, {"letter": "B", "text": "Nested stacks"}, {"letter": "C", "text": "Stack policies"}, {"letter": "D", "text": "StackSets"}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "CloudFormation StackSets extends a single template into stack instances across multiple accounts and regions from one central operation, including drift detection and centralized create/update/delete management, exactly matching the requirement to deploy and manage one template across multiple accounts, per the referenced AWS StackSets blog post and CloudFormation user guide. Change sets (A) only preview/apply changes to a single existing stack, nested stacks (B) compose multiple templates within one stack in one account, and stack policies (C) restrict which resources can be updated within a stack — none of them span multiple accounts. Community vote is unanimous (100%) for D, matching the boxed answer.", "facets": {"service": ["CloudFormation"], "concern": ["stacksets-multi-account-multi-region-deployment"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 243, "question_number": 747}, "fingerprint": "712f9879e4ecd1c1926ae587c0d2fb1b5f57289b9a7e7946af3ec23499718f56"}, {"id": "awssysops-p3-1-q777", "status": "active", "disputed": true, "stem": "A SysOps Administrator has an AWS CloudFormation template of the company's existing infrastructure in us-west-2. The Administrator attempts to use the template to launch a new stack in eu-west-1, but the stack only partially deploys, receives an error message, and then rolls back.\nWhy would this template fail to deploy? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "The template referenced an IAM user that is not available in eu-west-1"}, {"letter": "B", "text": "The template referenced an Amazon Machine Image (AMI) that is not available in eu-west-1"}, {"letter": "C", "text": "The template did not have the proper level of permissions to deploy the resources"}, {"letter": "D", "text": "The template requested services that do not exist in eu-west-1"}, {"letter": "E", "text": "CloudFormation templates can be used only to update existing services"}], "correct_answer": ["B", "C"], "source_correct_answer": "B,C", "correct_answer_override": null, "explanation": "AMIs are region-specific, so a template that hardcodes an AMI ID from us-west-2 will fail to find that AMI in eu-west-1 (B), and if the template requests a resource type or service that isn't available in eu-west-1 at all, CloudFormation will similarly be unable to create it (D) — both are well-documented, common causes of cross-region CloudFormation portability failures, per the referenced AWS Regional Services List guidance cited in the discussion. The boxed answer's C, insufficient permissions, is flagged by multiple detailed comments as a category error: a CloudFormation template itself holds no IAM permissions — the deploying user's credentials or an attached service role do — and a genuine permissions failure would typically fail immediately at the very first resource rather than allowing a 'partial deployment' before rolling back, which is more consistent with hitting an unavailable AMI or unsupported service partway through stack creation (as the cited CloudFormation FAQ's rollback-on-error description confirms). An IAM user (A) isn't a region-scoped resource in the way this implies, and CloudFormation is not restricted to only updating existing services (E) — it can create new resources from scratch. Community vote is unanimous (100%) for B & D, directly contradicting the boxed answer's C, and is heavily corroborated (12+ upvotes on the top comment) with clear reasoning distinguishing template permissions from deploying-principal permissions. Flagged disputed for triage, while keeping the boxed answer B & C per the ingestion policy.", "facets": {"service": ["CloudFormation"], "concern": ["cross-region-template-portability-failure"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 292, "question_number": 777}, "fingerprint": "425807b0443a3fec46e8e4303bf49a7ed303fb68a98235910e58cd621480192d"}, {"id": "awssysops-p3-1-q796", "status": "active", "disputed": false, "stem": "A SysOps Administrator has created an Amazon EC2 instance using an AWS CloudFormation template in the us-east-1 Region. The Administrator finds that this template has failed to create an EC2 instance in the us-west-2 Region.\nWhat is one cause for this failure?", "choice_type": "single", "choices": [{"letter": "A", "text": "Resource tags defined in the CloudFormation template are specific to the us-east-1 Region."}, {"letter": "B", "text": "The Amazon Machine Image (AMI) ID referenced in the CloudFormation template could not be found in the us-west-2 Region."}, {"letter": "C", "text": "The cfn-init script did not run during resource provisioning in the us-west-2 Region."}, {"letter": "D", "text": "The IAM user was not created in the specified Region."}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "AMI IDs are region-specific, so a template that hardcodes an AMI ID valid in us-east-1 will fail when deployed in us-west-2 because that exact AMI ID doesn't exist there, per the referenced AWS CloudFormation deployment documentation. Resource tags (A) aren't region-scoped in a way that would block instance creation, the cfn-init script (C) runs to configure an already-launched instance rather than gate its initial creation, and IAM users (D) are global, not regional, resources, so 'not created in the specified Region' isn't a coherent failure mode. Community consensus is unanimous for B, matching the boxed answer.", "facets": {"service": ["CloudFormation"], "concern": ["cross-region-ami-portability-failure"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 336, "question_number": 796}, "fingerprint": "31e017a0c6850383072457a1f8b35ebe3fd36145041622a168efe38ddacf43fd"}, {"id": "awssysops-p3-1-q817", "status": "active", "disputed": false, "stem": "A recent AWS CloudFormation stack update has failed and returned the error UPDATE_ROLLBACK_FAILED. A SysOps Administrator is tasked with returning the CloudFormation stack to its previous working state.\nWhat must be done to accomplish this?", "choice_type": "single", "choices": [{"letter": "A", "text": "Fix the error that caused the rollback to fail, then select the Continue Update Rollback action in the console."}, {"letter": "B", "text": "Select the Update Stack action with a working template in the console."}, {"letter": "C", "text": "Update the password of the IAM user, then select the Continue Update Rollback action in the console."}, {"letter": "D", "text": "Use the AWS CLI to manually change the stack status to UPDATE_COMPLETE, then continue updating the stack with a working template."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "When a stack is stuck in UPDATE_ROLLBACK_FAILED, the documented recovery path is to identify and fix whatever resource-level error blocked the rollback, then use the Continue Update Rollback action (console or CLI) to complete the rollback to UPDATE_ROLLBACK_COMPLETE, per the referenced CloudFormation documentation. Attempting a fresh Update Stack action (B) isn't possible while the stack is in a failed rollback state, updating an unrelated IAM password (C) doesn't address whatever actually blocked the rollback, and there's no supported way to manually force the stack status via the CLI (D) — stack status is managed internally by CloudFormation. Community consensus is unanimous for A, matching the boxed answer.", "facets": {"service": ["CloudFormation"], "concern": ["update-rollback-failed-remediation"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 367, "question_number": 817}, "fingerprint": "af4496649d2fddd534d558526c6bf7d79d27684b676e7445c37b31098088792f"}, {"id": "awssysops-p3-1-q829", "status": "active", "disputed": true, "stem": "A company has deployed its infrastructure using AWS CloudFormation. Recently, the company made manual changes to the infrastructure. A SysOps Administrator is tasked with determining what was changed and updating the CloudFormation template.\nWhich solution will ensure all the changes are captured?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create a new CloudFormation stack based on the changes that were made. Delete the old stack and deploy the new stack."}, {"letter": "B", "text": "Update the CloudFormation stack using a change set. Review the changes and update the stack."}, {"letter": "C", "text": "Update the CloudFormation stack by modifying the selected parameters in the template to match what was changed."}, {"letter": "D", "text": "Use drift detection on the CloudFormation stack. Use the output to update the CloudFormation template and redeploy the stack."}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "Drift detection is the feature specifically built to identify which stack resources have been changed outside of CloudFormation's own management, and its output is exactly what's needed to know what to update in the template before redeploying — a change set, by contrast, is a review mechanism for a set of changes you're proposing to make, which presupposes you already know what changed rather than helping you discover it, per the top comment's reasoning (17+ upvotes) and corroborated by direct citations of the drift-detection documentation elsewhere in the discussion. Creating an entirely new stack and deleting the old one (A) risks deleting live resources and is a needlessly destructive way to reconcile a template. Manually adjusting template parameters to match observed changes (C) depends on already knowing exactly what changed and doesn't systematically 'ensure all the changes are captured.' The raw discussion carries an informal embedded vote tally showing an exact 50/50 split between B and D, reflecting a genuine, well-argued disagreement about whether 'capturing changes' means discovering them (drift detection) or reviewing/applying them (change sets) — meeting the mechanical threshold for flagging a question disputed, reinforced by the strong technical case for drift detection as the actual discovery mechanism. Flagged disputed for triage, while keeping the boxed answer B per the ingestion policy.", "facets": {"service": ["CloudFormation"], "concern": ["drift-detection-vs-change-set-discovery"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 383, "question_number": 829}, "fingerprint": "1633156bee1e803f6096caf464aed838005671b9e06abb78c23f443fc86e7483"}, {"id": "awssysops-p3-1-q843", "status": "active", "disputed": true, "stem": "An Application team has asked a SysOps Administrator to provision an additional environment for an application in four additional regions. The application is running on more than 100 instances in us-east-1, using fully baked AMIs. An AWS CloudFormation template has been created to deploy resources in us-east-1.\nWhat must the SysOps Administrator do to provision the application quickly?", "choice_type": "single", "choices": [{"letter": "A", "text": "Copy the AMI to each region using aws ec2 copy-image. Update the CloudFormation mapping to include mappings for the copied AMIs."}, {"letter": "B", "text": "Create a snapshot of the running instance and copy the snapshot to the other regions. Create an AMI from the snapshots. Update the CloudFormation template for each region to use the new AMI."}, {"letter": "C", "text": "Run the existing CloudFormation template in each additional region based on the success of the template used currently in us-east-1."}, {"letter": "D", "text": "Update the CloudFormation template to include the additional regions in the Auto Scaling group. Update the existing stack in us-east-1."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "AMI IDs are unique per region, so the existing us-east-1 CloudFormation template — which hardcodes or maps to a us-east-1-specific AMI ID — cannot simply be run unmodified in the four additional regions; the AMI must first be copied into each region via aws ec2 copy-image, and the template's mapping section updated with the resulting per-region AMI IDs before the template will deploy correctly elsewhere, per the AWS EC2 copy-image documentation cited and corroborated (13+ and 9+ upvotes on the top two comments) throughout the discussion. The boxed answer (C) assumes the existing template can just be run as-is in a new region purely 'based on the success' of the us-east-1 deployment, but it would fail immediately on a region-specific resource reference like the AMI ID. Creating snapshots and copying those instead of the AMI directly (B) is an unnecessary extra step, since AMIs themselves can be copied cross-region directly. Updating the Auto Scaling group configuration and the existing us-east-1 stack (D) doesn't address deploying into new regions at all — Auto Scaling groups and CloudFormation stacks are themselves region-scoped resources. Community vote is unanimous (100%) for A, directly contradicting the boxed answer C, and is corroborated by a direct citation of the AMI cross-region copy documentation. Flagged disputed for triage, while keeping the boxed answer C per the ingestion policy.", "facets": {"service": ["CloudFormation", "EC2"], "concern": ["region-specific-ami-id-mapping-update"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 405, "question_number": 843}, "fingerprint": "8b81c200a2ebf52b8b06e1a29784f1fea256ff1aeee02383e2236f38f7dbf785"}, {"id": "awssysops-p3-1-q846", "status": "active", "disputed": false, "stem": "A company is planning to deploy multiple ecommerce websites across the eu-west-1, ap-east-1, and us-west-1 Regions. The websites consist of Amazon S3 buckets, Amazon EC2 instances, Amazon RDS databases, and Elastic Load Balancers.\nWhich method will accomplish the deployment with the LEAST amount of effort?", "choice_type": "single", "choices": [{"letter": "A", "text": "Configure deployment automation using AWS OpsWorks"}, {"letter": "B", "text": "Configure S3 cross-Region replication"}, {"letter": "C", "text": "Use AWS CloudFormation stack sets to deploy the application"}, {"letter": "D", "text": "Use AWS Elastic Beanstalk to deploy the application"}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "AWS CloudFormation StackSets let a single template describing the full mixed-resource stack (S3, EC2, RDS, ELB) be deployed across multiple regions (and accounts) in one operation, making it the purpose-built mechanism for exactly this multi-region, multi-service rollout, per the referenced StackSets documentation quoted directly and corroborated (9+ upvotes on the top comment) throughout the discussion. Elastic Beanstalk (D) is an application-deployment platform focused on the compute/app layer — it doesn't natively provision or manage RDS, S3, or standalone ELB resources as a single bundled multi-region rollout the way one CloudFormation template can. OpsWorks (A) would require significantly more manual configuration of Chef/Puppet recipes across regions, and S3 cross-Region replication (B) only replicates bucket objects — it has no role in deploying EC2, RDS, or load balancer resources at all. Community consensus favors C by a ll (rebooting doesn't re-launch from a new image) and provides no controlled rollout; deploying a parallel stack with Route 53 redirection (C) would temporarily require running more, not fewer, instances than the minimum, and a plain rollback-configuration option (A) governs stack-update failure handling, not a controlled instance-replacement rollout. Community consensus is unanimous for D, matching the boxed answer.", "facets": {"service": ["CloudFormation", "Auto Scaling"], "concern": ["rolling-update-policy-for-ami-refresh"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 466, "question_number": 887}, "fingerprint": "0017efb1c86091337ba9fac7a0aa9a8be4b754d40a4435779c849383cdd1f1d7"}, {"id": "awssysops-p3-1-q897", "status": "active", "disputed": true, "stem": "A company's application infrastructure was deployed using AWS CloudFormation and is composed of Amazon EC2 instances behind an Application Load Balancer. The instances run in an EC2 Auto Scaling group across multiple Availability Zones. When releasing a new version of the application, the update deployment must avoid DNS changes and allow rollback.\nWhich solution should a SysOps administrator use to meet the deployment requirements for this new release?", "choice_type": "single", "choices": [{"letter": "A", "text": "Configure the Auto Scaling group to use lifecycle hooks. Deploy new instances with the new application version. Complete the lifecycle hook action once healthy."}, {"letter": "B", "text": "Create a new Amazon Machine Image (AMI) containing the updated code. Create a launch configuration with the AMI. Update the Auto Scaling group to use the new launch configuration."}, {"letter": "C", "text": "Deploy a second CloudFormation stack. Wait for the application to be available. Cut over to the new Application Load Balancer."}, {"letter": "D", "text": "Modify the CloudFormation template to use an AutoScalingReplacingUpdate policy. Update the stack. Perform
