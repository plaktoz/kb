dating the template's mapping instead, since the unmodified template would fail on the region-specific AMI reference; the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5a9ca0f18354", "source_question_ids": ["awssysops-p3-1-q846"], "statement": "AWS Elastic Beanstalk is an application-deployment platform focused on the compute/application layer; it does not natively provision or manage RDS databases, S3 buckets, or standalone load balancers as a single bundled multi-region rollout the way one CloudFormation template can.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6fe78c15c9b0", "source_question_ids": ["awssysops-p3-1-q846"], "statement": "Using AWS OpsWorks to deploy the same mixed-resource application across multiple regions would require significantly more manual configuration of Chef or Puppet recipes across each region compared to CloudFormation StackSets.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-70d284d26030", "source_question_ids": ["awssysops-p3-1-q846"], "statement": "Amazon S3 cross-Region replication only replicates bucket objects between regions; it has no role in deploying EC2 instances, RDS databases, or load balancer resources.", "status": "supported"}, {"claim_type": "rule", "conditions": ["template defines an AutoScalingReplacingUpdate policy on the Auto Scaling group resource"], "confidence": "high", "id": "cl-9b80ec8afb44", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "A CloudFormation AutoScalingReplacingUpdate policy replaces an Auto Scaling group's instances with an entirely new group during a stack update, and can immediately roll the stack back without failure if the new version has problems, all while keeping the same load balancer and without requiring any DNS change.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-be297650d674", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Auto Scaling group lifecycle hooks let new instances complete custom actions before entering service, but they provide no documented rollback mechanism of their own if the new application version has problems.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-08c1df183e09", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Manually creating a new AMI and launch configuration and updating the Auto Scaling group to use it has no built-in rollback mechanism if the new version has problems.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cd831e1c7e00", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Deploying a second CloudFormation stack with a new Application Load Balancer and cutting over to it requires a DNS change to redirect traffic to the new load balancer, which violates a requirement to avoid DNS changes during deployment.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-661e5631875f", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "For the question about deploying a new application release without DNS changes and with rollback support, the source's boxed correct answer is using Auto Scaling lifecycle hooks, but community vote is unanimous for using an AutoScalingReplacingUpdate policy instead, since lifecycle hooks have no documented rollback mechanism; the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-f69c65a01288", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "By default, when a CloudFormation stack is deleted, all resources belonging to that stack are also deleted.", "status": "supported"}, {"claim_type": "exception", "conditions": ["resource's DeletionPolicy attribute is explicitly set to Retain"], "confidence": "high", "id": "cl-1333a54f0660", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "Setting a resource's DeletionPolicy attribute to Retain in the CloudFormation template is an exception to the default stack-deletion behavior: it causes CloudFormation to preserve that specific resource (e.g., an RDS instance) when the stack itself is deleted, letting it keep running independently of the stack's lifecycle.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a46daeb826f8", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "Removing a resource from a CloudFormation template and updating the stack orphans that resource from CloudFormation management entirely, rather than making it survive future stack deletions while remaining managed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2a536c0220a6", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "CloudFormation stack termination protection only prevents the stack itself from being deleted at all; it does not allow the stack to be deleted while selectively retaining specific resources.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7b114b250739", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "An RDS instance's own deletion-protection parameter prevents that instance from being deleted directly via the RDS API, but has no effect on what happens to the instance when its owning CloudFormation stack is deleted.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-cloudformation--m-1", "title": "CloudFormation stacks: one template, one all-or-nothing unit, defaults you override per lifecycle event", "purpose": "Lets you predict how a stack behaves on create, update, delete, and failure, pick the CloudFormation feature that changes that behavior, and diagnose why the same template fails somewhere else.", "mechanism": "1) Template to stack. A template is a declarative description of resources. Only the Resources section is required; Parameters, Mappings, Conditions, and Outputs are optional. You create a stack from the template and supply parameter values, and CloudFormation provisions and wires up the actual resources in dependency order. There is no separate 'configure the service' step. The stack lives in one account and one Region. The template holds no permissions of its own: calls run with the deployer's credentials or a service role. 2) The stack acts as a single unit with safe defaults at each lifecycle event. On create, nothing is pre-checked, so creation can fail partway through. By default any resource failure rolls back the whole stack and deletes what was already built. The stack ends in ROLLBACK_COMPLETE, and the only thing you can do then is delete it and relaunch. A resource counts as 'created' once its API call succeeds, not once the software on it has finished configuring. On update, UpdateStack applies changes immediately. On delete, every resource in the stack is deleted. 3) Nearly every CloudFormation feature on the exam changes exactly one of those defaults, at one lifecycle event and one scope. For ordering, DependsOn sets creation order only; WaitCondition or CreationPolicy plus cfn-signal makes CloudFormation wait for a real readiness signal and fail on timeout. For failed creates, OnFailure=DO_NOTHING keeps the resources instead of rolling back. For updates, a change set previews the change first, a stack policy denies updates to specific resources, and AutoScalingRollingUpdate or AutoScalingReplacingUpdate controls how instances are replaced. For deletes, DeletionPolicy Retain or Snapshot handles one resource, and termination protection blocks deleting the whole stack. Drift detection finds changes made outside CloudFormation. 4) Portability comes from indirection. Anything Region-scoped, such as an AMI ID, must be looked up rather than hardcoded: a Mappings table read with Fn::FindInMap, with the AMI copied into each Region first. Parameters and Conditions customize one template per environment. Export with Fn::ImportValue shares one resource across stacks, and StackSets push one template to many accounts and Regions.", "predict_prompt": "A template creates an EC2 instance, then an ELB that waits on a WaitCondition. The instance's cfn-signal never reaches CloudFormation because the private subnet has no NAT. With no extra settings, what happens to the instance, what state does the stack end in, and what is your next move after you fix the network?", "invariants": ["A stack is scoped to one account and one Region. Any cross-account or cross-Region rollout needs StackSets, not a bigger stack or a script.", "With default settings, a failed create never leaves a partial stack behind: it rolls back fully, and ROLLBACK_COMPLETE allows only a delete.", "Creation order (DependsOn) never implies readiness. Only a signal (WaitCondition or CreationPolicy with cfn-signal) makes CloudFormation wait.", "Stack deletion deletes every resource unless that resource's own DeletionPolicy says otherwise.", "CloudFormation itself is free: you pay only for the resources it creates."], "limits": ["CloudFormation does not stop out-of-band console changes. It can only detect them afterward with drift detection.", "A throttling error ('Rate exceeded') is an API rate limit. Fix it with exponential backoff and jitter, not a bigger instance, a template 'Pause', or merging stacks.", "Account quotas still apply to what the stack creates. For example, repeatedly creating a new VPC can hit the default of 5 VPCs per Region and make stack creation fail.", "Quoted template and stack limits (such as 20 stacks, or 60 parameters/outputs later raised to 200) are old exam-era figures and may be out of date."], "cues": ["'Same template fails in another Region' points to a hardcoded AMI ID, or a service not available in that Region. It is not IAM users or tags.", "'Wait until the instance finishes configuring' points to CreationPolicy or WaitCondition with cfn-signal. 'Received 0 signals' means cfn-signal never ran or the instance could not reach the endpoint.", "'Preview before applying' points to a change set. 'Find what someone changed by hand' points to drift detection.", "'Many accounts or Regions in one operation' points to StackSets. 'One shared bucket across stacks' points to Export plus Fn::ImportValue.", "'Keep the database when the stack is deleted' points to DeletionPolicy Retain or Snapshot. 'Keep a failed stack's resources for debugging' points to OnFailure=DO_NOTHING.", "UPDATE_ROLLBACK_FAILED: fix the blocking resource, then run Continue Update Rollback. ROLLBACK_COMPLETE: delete the stack and relaunch."], "claim_ids": ["cl-57682734954d", "cl-37be66ef0a5a", "cl-79eeeedca52d", "cl-bfaaad579030", "cl-816b482b9c7c", "cl-d748ec473663", "cl-22124d03e11e", "cl-912d00277cc3", "cl-4ffca99fabc7", "cl-27b399297fdb", "cl-530906805a00", "cl-7d8bc0a1e4f4", "cl-e7d4c066c704", "cl-e6d54b07600d", "cl-034d63e724d4", "cl-023893050ab9", "cl-0fae4f96d5f7", "cl-2b46eb5955f5", "cl-4070339fccbc", "cl-bd067efbeffc", "cl-d7cd2957fbb8", "cl-c5070940e52b", "cl-096e50b94d38", "cl-791a1c44261a", "cl-c388d14db82a", "cl-73d68fe0310e", "cl-9b80ec8afb44", "cl-f69c65a01288", "cl-1333a54f0660", "cl-a7cbb761c685", "cl-20b0265c76e4", "cl-98b564957b6c", "cl-58b666e2fd52", "cl-29c7e2394e01", "cl-c8c4c783f9d1", "cl-c521c3b30ac5", "cl-87a7c0626d0c", "cl-8fda3117e86c", "cl-76bf6c59a6fa", "cl-d48c3f1abdf3", "cl-66948dfc1be7", "cl-fe4222ed84da", "cl-374b7b83dd0f"]}, "contrastSet": {"id": "aws-sysops-service-cloudformation--cs-1", "subjects": ["DeletionPolicy (Retain/Snapshot)", "Termination Protection", "OnFailure=DO_NOTHING", "Stack policy"], "dimensions": ["Lifecycle event intercepted", "Scope", "Effect", "Where it is set"], "shared_traits": ["Each one overrides a CloudFormation default that is otherwise destructive or automatic.", "All are CloudFormation-native and declared up front. None is a reactive script or Lambda that notices a problem after it happens.", "Each one acts on exactly one lifecycle event, so a correct choice for one event does nothing for the others."], "matrix": {"Lifecycle event intercepted": {"DeletionPolicy (Retain/Snapshot)": "Stack deletion", "Termination Protection": "Explicit request to delete the stack", "OnFailure=DO_NOTHING": "Automatic rollback after a failed create", "Stack policy": "Stack updates"}, "Scope": {"DeletionPolicy (Retain/Snapshot)": "One resource", "Termination Protection": "Whole stack", "OnFailure=DO_NOTHING": "Whole stack, one CreateStack call", "Stack policy": "Specific resources named in the policy"}, "Effect": {"DeletionPolicy (Retain/Snapshot)": "Stack is deleted; this resource is kept running (Retain) or snapshotted (Snapshot)", "Termination Protection": "Delete is refused; the stack and all its resources stay", "OnFailure=DO_NOTHING": "Partially created resources stay in place for inspection", "Stack policy": "Update:* is denied on protected resources; everything else updates normally"}, "Where it is set": {"DeletionPolicy (Retain/Snapshot)": "Resource attribute in the template", "Termination Protection": "Setting on the stack", "OnFailure=DO_NOTHING": "CreateStack API parameter", "Stack policy": "JSON policy attached to the stack at launch"}}, "decision_rule": "The deciding dimension is which lifecycle event must be stopped or changed. Stack deletion taking one specific resource with it: DeletionPolicy. Anyone deleting the stack at all: Termination Protection. The automatic rollback after a failed create: OnFailure=DO_NOTHING. Updates modifying specific resources: stack policy.", "boundary_flip": "Suppose the requirement is 'keep the RDS instance running after the stack is deleted'. That calls for DeletionPolicy: Retain. Change it to 'keep whatever was created when stack creation fails, so we can debug it', and the answer becomes OnFailure=DO_NOTHING. Termination Protection is still wrong in both cases. In the first, it blocks the delete entirely instead of deleting the stack and keeping one resource. In the second, nobody asked to delete the stack.", "strongest_distractor_failure": "Termination Protection sounds like 'protect my resources', but it only blocks explicit delete requests for the whole stack. It has no effect on the automatic rollback after a failed deployment. It also cannot let the stack be deleted while keeping selected resources. The RDS instance's own deletion-protection flag fails the same way: it blocks direct RDS API deletes but does not change what CloudFormation does when the stack is deleted.", "exceptions": ["DeletionPolicy: Snapshot applies only to resources that support snapshots, such as an RDS DB instance. It takes the backup automatically during stack deletion, with no separate backup template or script.", "Once a failed create has rolled back to ROLLBACK_COMPLETE, none of these controls can revive the stack. Only delete is allowed, so fix the template and relaunch.", "A stack update that fails and then also fails to roll back (UPDATE_ROLLBACK_FAILED) is not handled by any of these. Fix the blocking resource and run Continue Update Rollback."], "claim_ids": ["cl-1333a54f0660", "cl-a7cbb761c685", "cl-f69c65a01288", "cl-2a536c0220a6", "cl-58e62088a6fa", "cl-20b0265c76e4", "cl-912d00277cc3", "cl-c388d14db82a", "cl-5c0b2ca56d81", "cl-7b114b250739", "cl-ef2c5715734b", "cl-530906805a00", "cl-7d8bc0a1e4f4", "cl-e7d4c066c704"]}, "scenarioFamily": {"id": "aws-sysops-service-cloudformation--sf-1", "canonical": {"prompt": "Your team's CloudFormation stack for a retiring service includes an RDS DB instance, an EC2 Auto Scaling group, and an S3 bucket for static assets. The whole stack must be torn down, but the RDS instance holds data that must keep running afterward as a standalone database, independent of the stack. What should you do before deleting the stack, and what happens to the rest of the stack's resources?", "expected_answer": ["Set the RDS DB instance resource's DeletionPolicy attribute to Retain in the template (and update the stack with that change) before deleting the stack; CloudFormation will then delete the stack and every other resource in it as usual, but will leave the RDS instance running, no longer managed by the stack."], "reasoning": "By default, deleting a CloudFormation stack deletes every resource that belongs to it. DeletionPolicy: Retain on a specific resource is the documented exception to that default: it tells CloudFormation to preserve that one resource across stack deletion while everything else in the stack is deleted normally.", "distractor_analysis": "Anything that only blocks the delete request itself (rather than selectively sparing one resource) misses the requirement, since the team does need the rest of the stack removed -- only the database should survive.", "claim_ids": ["cl-f69c65a01288", "cl-1333a54f0660"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The requirement is no longer about surviving a stack deletion; it flips to surviving a failed stack creation instead, so partially-created resources can be inspected for debugging instead of being auto-rolled-back.", "prompt": "Same template, same RDS instance -- but now the concern is different: during stack creation, if some later resource fails to create, you want whatever resources already succeeded (possibly including a partially-configured RDS instance) to stay in place for debugging, rather than being automatically rolled back and deleted. What should you set, and where?", "expected_answer": ["Set the CreateStack API's OnFailure parameter to DO_NOTHING (e.g. via the console's stack-creation options or the CLI call); this stops CloudFormation from automatically rolling back and deleting resources that already succeeded when a later resource fails to create."], "reasoning": "This flips the lifecycle event from 'stack deletion' to 'failed stack creation.' DeletionPolicy: Retain only fires during a stack delete, so it does not help here. The default create-failure behavior is a full rollback that deletes everything already created; OnFailure=DO_NOTHING is the documented override for that specific default, at that specific lifecycle event.", "distractor_analysis": "DeletionPolicy: Retain looks reusable because it is also about 'keeping a resource around,' but it is scoped to stack deletion, not to a failed create -- it does nothing to stop the automatic create-failure rollback.", "claim_ids": ["cl-912d00277cc3", "cl-20b0265c76e4"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "Added operational detail about how the team manages the template -- kept in Git with branches/tags, and rolled through dev, test, and production via change sets -- which does not change what's needed to keep the RDS instance running past stack deletion.", "prompt": "The team keeps this CloudFormation template in Git, branching and tagging it so it can be diffed and reverted, and rolls changes through dev, test, and production using change sets so each environment's deployed version is tracked. When it's time to retire the production stack, the RDS instance must still keep running afterward as a standalone database. Does the Git/change-set workflow change what you need to do?", "expected_answer": ["Set the RDS DB instance resource's DeletionPolicy attribute to Retain in the template (and update the stack with that change) before deleting the stack; CloudFormation will then delete the stack and every other resource in it as usual, but will leave the RDS instance running, no longer managed by the stack."], "reasoning": "Version control and change sets describe how the template is authored and rolled out across environments; they have no bearing on what happens to a specific resource at stack-deletion time. The deciding factor is still the DeletionPolicy attribute on the RDS resource itself.", "distractor_analysis": "It's tempting to think a more disciplined pipeline (Git, change sets, tracked per-environment versions) implies a different or more elaborate deletion mechanism is needed; it doesn't -- deletion-time behavior is governed per-resource by DeletionPolicy regardless of how the template got there.", "claim_ids": ["cl-1333a54f0660", "cl-f69c65a01288", "cl-83789fe4b5c6", "cl-a360febc8e47"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "Same requirement as canonical, but a teammate now proposes two plausible-sounding alternatives -- enabling stack Termination Protection, and enabling the RDS instance's own deletion-protection setting -- as the fix.", "prompt": "Same requirement: the RDS instance must keep running after the stack is deleted. A teammate suggests two options instead of touching the template: (1) turn on Termination Protection for the stack, or (2) turn on the RDS instance's own deletion-protection flag in RDS. Will either of these keep the RDS instance running once the stack is deleted? What should you actually do?", "expected_answer": ["Set the RDS DB instance resource's DeletionPolicy attribute to Retain in the template (and update the stack with that change) before deleting the stack; CloudFormation will then delete the stack and every other resource in it as usual, but will leave the RDS instance running, no longer managed by the stack."], "reasoning": "Neither suggestion does what's needed. Termination Protection only refuses an explicit delete-the-whole-stack request outright -- it does not let the stack be deleted while selectively keeping one resource, so turning it on would block the retirement itself. The RDS instance's own deletion-protection parameter blocks direct RDS API deletes, but has no effect on what CloudFormation does to that resource when its owning stack is deleted -- the stack delete still removes it unless DeletionPolicy says otherwise. Only DeletionPolicy: Retain on that resource achieves the actual goal.", "distractor_analysis": "Both alternatives sound like 'protection' but protect against the wrong action: Termination Protection blocks the stack-level delete entirely (over-broad, and blocks the retirement), while RDS's own deletion-protection flag blocks only direct RDS-API deletes (wrong layer -- it never intercepts the CloudFormation-driven stack deletion).", "claim_ids": ["cl-1333a54f0660", "cl-f69c65a01288", "cl-2a536c0220a6", "cl-7b114b250739"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "Same underlying rule, applied to a different resource in a different stack: an S3 bucket holding compliance audit logs must survive when its stack is deleted, instead of an RDS instance.", "prompt": "A different service's CloudFormation stack provisions an S3 bucket that holds compliance audit logs, alongside other resources. When this stack is eventually deleted, the audit-log bucket must keep existing (with its objects) rather than being deleted with the rest of the stack. What should you configure, and would removing the bucket resource from the template instead achieve the same thing?", "expected_answer": ["Set that S3 bucket resource's DeletionPolicy attribute to Retain in the template (and update the stack with that change) before deleting the stack; the bucket will then survive stack deletion while the rest of the stack's resources are deleted as usual. Simply removing the bucket resource from the template is not equivalent."], "reasoning": "The same override applies regardless of resource type: setting DeletionPolicy: Retain on the resource preserves it when the stack is deleted, while every other resource in the stack is removed as usual. Removing the bucket resource from the template and updating the stack is a different action with a different effect: it orphans the bucket from CloudFormation management immediately, rather than keeping it declared and letting it survive a future stack deletion.", "distractor_analysis": "Removing the resource from the template looks similar ('the bucket stops being deleted with the stack') but is not equivalent -- it disconnects the bucket from management right away, whereas DeletionPolicy: Retain keeps it declared and managed until the stack itself is actually deleted.", "claim_ids": ["cl-1333a54f0660", "cl-f69c65a01288", "cl-a46daeb826f8"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "Unresolved source dispute on awssysops-p2-q580. The boxed answer says to enable stack Termination Protection, but the community vote is for OnFailure=DO_NOTHING. Both answer-side claims are marked 'conflicted'. The contrast set still builds its central subject (OnFailure=DO_NOTHING) and its strongest_distractor_failure (Termination Protection) on the community side as settled fact, and the mental model cue 'Keep a failed stack's resources for debugging points to OnFailure=DO_NOTHING' does the same. Neither acknowledges that the source key disagrees. This settles the dispute by community vote instead of flagging it.", "related_entity_ids": ["cl-20b0265c76e4", "cl-58e62088a6fa", "aws-sysops-service-cloudformation--cs-1", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "high", "description": "Unresolved source dispute on awssysops-p3-1-q829. The boxed answer is to update the stack via a change set, and the community vote is an exact 50/50 split against drift detection, so no side has a majority. Even so, cl-791a1c44261a (drift detection) and cl-93e0d485b67f (change set as a distractor) are marked 'supported' with high/medium confidence. The mental model states 'Find what someone changed by hand points to drift detection' and 'It can only detect them afterward with drift detection' as settled. Only the meta-claim cl-7b2bec47ccc7 records the dispute.", "related_entity_ids": ["cl-791a1c44261a", "cl-93e0d485b67f", "cl-7b2bec47ccc7", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p2-q537. The boxed answer is to run a separate backup CloudFormation template before deletion, but the community vote is for DeletionPolicy: Snapshot, and cl-a7cbb761c685 is marked 'conflicted'. The contrast set (Effect row and exceptions: 'with no separate backup template or script') and the mental model present Snapshot as the undisputed answer.", "related_entity_ids": ["cl-a7cbb761c685", "aws-sysops-service-cloudformation--cs-1", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p2-q547. The boxed answer names the IAM PassRole permission as a cause of the wait-condition 'received 0 signals' error, but the community vote is for missing outbound internet/NAT access. cl-d7cd2957fbb8 and cl-380c63dbc203 are both 'conflicted'. The mental model's predict_prompt premise ('no NAT') and the cue ''Received 0 signals' means cfn-signal never ran or the instance could not reach the endpoint' treat the community side as settled. The cue's 'means' also reads as an exhaustive list of causes, which the claims do not support.", "related_entity_ids": ["cl-d7cd2957fbb8", "cl-380c63dbc203", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p2-q593. The boxed answer says the template needs to be updated to the latest version, but the community vote is for the default limit of 5 VPCs per Region. cl-66948dfc1be7 and cl-078a61473505 are 'conflicted'. The mental model limits section presents the VPC-quota explanation as fact.", "related_entity_ids": ["cl-66948dfc1be7", "cl-078a61473505", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p3-1-q615. The boxed answer names a 'Conditions' attribute, but the community vote is for CreationPolicy. cl-0fae4f96d5f7 and cl-0bfcf68c37ca are 'conflicted'. The mental model mechanism, invariant ('Only a signal (WaitCondition or CreationPolicy with cfn-signal) makes CloudFormation wait'), and cue all present CreationPolicy without flagging the dispute.", "related_entity_ids": ["cl-0fae4f96d5f7", "cl-0bfcf68c37ca", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p3-1-q616. The boxed answer is to add the S3 bucket as a resource in each template, but the community vote is for Export plus Fn::ImportValue. cl-87a7c0626d0c and cl-c7aff9e675ba are 'conflicted'. The mental model's portability section and the cue 'One shared bucket across stacks points to Export plus Fn::ImportValue' present the community answer as settled.", "related_entity_ids": ["cl-87a7c0626d0c", "cl-c7aff9e675ba", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p3-1-q739. The boxed answer is AWS::CloudFormation::Init, and the community vote is 80/20 for WaitCondition. Claims taken from this same disputed question (cl-023893050ab9 for WaitCondition, cl-e90d54abebd2 saying Init does not signal) are still marked 'supported' with high confidence, and the mental model cites cl-023893050ab9 as settled. Only the meta-claim cl-21fc08625bef carries the dispute.", "related_entity_ids": ["cl-023893050ab9", "cl-e90d54abebd2", "cl-21fc08625bef", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p3-1-q777. The boxed answers include 'template did not have the proper level of permissions', but the community vote is instead for 'requested services that do not exist in eu-west-1'. Claims from this question that take the community side (cl-d748ec473663: the template holds no IAM permissions; cl-58b666e2fd52: service not in the Region; cl-bf37ad7712ac) are marked 'supported'. The mental model mechanism ('The template holds no permissions of its own') and the cue ('Same template fails in another Region points to a hardcoded AMI ID, or a service not available in that Region') treat the dispute as resolved.", "related_entity_ids": ["cl-d748ec473663", "cl-58b666e2fd52", "cl-bf37ad7712ac", "cl-4bb5cc6a1fb1", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p3-1-q843. The boxed answer is to run the existing us-east-1 template unmodified in the new Regions, but the community vote is for copying the AMI and updating the mapping. cl-c8c4c783f9d1 is marked 'supported'/high even though its source question is disputed. The mental model ('with the AMI copied into each Region first') presents the community side as settled.", "related_entity_ids": ["cl-c8c4c783f9d1", "cl-f2235069c235", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Unresolved source dispute on awssysops-p3-1-q897. The boxed answer is Auto Scaling lifecycle hooks, but the community vote is for AutoScalingReplacingUpdate. cl-9b80ec8afb44 and the lifecycle-hook distractor cl-be297650d674 are marked 'supported'/high despite the dispute. The mental model cites AutoScalingReplacingUpdate as the update-replacement control without flagging it.", "related_entity_ids": ["cl-9b80ec8afb44", "cl-be297650d674", "cl-661e5631875f", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "low", "description": "Unresolved source dispute on awssysops-p1-q072. Community discussion is split between Elastic Beanstalk and CloudFormation (cl-352ac93517a8, needs-review), yet cl-816b482b9c7c from the same question is marked 'supported'/high and cited by the mental model as the plain CloudFormation capability.", "related_entity_ids": ["cl-816b482b9c7c", "cl-352ac93517a8", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "low", "description": "Unresolved source dispute on awssysops-p2-q338. The boxed answer is to grant developers direct template-editing access, but the community vote is unanimous for Service Catalog. Both claims are 'conflicted'. The synthesis does not use them, but the dispute is still open in the slice.", "related_entity_ids": ["cl-f0207a806e25", "cl-cf570c7a26de"]}, {"type": "quality", "severity": "medium", "description": "Dispute status is labeled inconsistently across the slice. For q537, q547, q580, q593, q615, q616 and q338, the claims on the community side are marked 'conflicted'. For q739, q777, q829, q843 and q897, the equivalent claims are marked 'supported' (mostly high confidence), and the dispute is recorded only in a separate low-confidence meta-claim of type 'distractor'. That hides the disagreement from anything that filters on claim status, and it is why the mental model cites these claims as settled.", "related_entity_ids": ["cl-023893050ab9", "cl-d748ec473663", "cl-791a1c44261a", "cl-c8c4c783f9d1", "cl-9b80ec8afb44", "cl-21fc08625bef", "cl-4bb5cc6a1fb1", "cl-7b2bec47ccc7", "cl-f2235069c235", "cl-661e5631875f"]}, {"type": "stale-risk", "severity": "medium", "description": "The q278 limit claims are stale or doubtful. cl-fe4222ed84da ('limited to 20 CloudFormation stacks') is marked 'supported'/high confidence, but it comes from the same source that its sibling claim cl-3e384c0fbf1a says predates the October 2020 quota update, and the current default stack quota is far higher. It should carry the same needs-review/stale flag as cl-374b7b83dd0f. The 4096-character description limit in cl-3e384c0fbf1a also does not match current documented values, and cl-86babc45d6fd rests on a question with no community vote. The mental model cites cl-fe4222ed84da and cl-374b7b83dd0f. It hedges them as 'may be out of date', but the claim-level confidence still conflicts with that hedge.", "related_entity_ids": ["cl-fe4222ed84da", "cl-374b7b83dd0f", "cl-3e384c0fbf1a", "cl-86babc45d6fd", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Two claims disagree about Metadata. cl-2e5aaa00ecc3 says CloudFormation Metadata is 'inert documentation with no runtime effect on stack creation', while cl-e90d54abebd2 says AWS::CloudFormation::Init is metadata that the cfn-init helper reads to install packages and run configuration. Combined with CreationPolicy/cfn-signal, that configuration decides whether a resource creates successfully. Metadata is not inert.", "related_entity_ids": ["cl-2e5aaa00ecc3", "cl-e90d54abebd2"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-a46daeb826f8 claims that removing a resource from the template and updating the stack 'orphans that resource from CloudFormation management'. By default, CloudFormation deletes a resource that has been removed from the template during the stack update. It is kept, unmanaged, only when DeletionPolicy is Retain. For q906 (keep the RDS instance), this distractor would actually delete the database, and the claim's explanation hides that risk.", "related_entity_ids": ["cl-a46daeb826f8", "cl-1333a54f0660"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-bf37ad7712ac says a real IAM permissions failure 'typically fails immediately at the very first resource'. Nothing in the source supports this. A missing permission fails at whichever resource first needs it, which can come after other resources are created. It also conflicts with cl-4ffca99fabc7 (no pre-verification, so stacks can fail partway through). It is being used to rebut the boxed 'permissions' answer in the disputed q777.", "related_entity_ids": ["cl-bf37ad7712ac", "cl-4ffca99fabc7", "cl-4bb5cc6a1fb1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-dc0488507180 says 'only AWS controls AMI sharing and aliasing' and that CloudFormation resolves AMIs only by ID. Customers can share their own AMIs through launch permissions, and they can alias per-Region AMI IDs with SSM parameters that a template resolves by name. The claim is presented as 'supported' even though q703 gives no evident basis for it.", "related_entity_ids": ["cl-dc0488507180"]}, {"type": "contradiction", "severity": "low", "description": "The claims disagree about what Elastic Beanstalk can provision. cl-352ac93517a8 says Beanstalk can provision a full LAMP environment including an ELB. cl-5a9ca0f18354 says it 'does not natively provision or manage RDS databases ... or standalone load balancers', even though Beanstalk environments can include a coupled RDS instance and a load balancer. The 'multi-region rollout' qualifier only partly reconciles the two.", "related_entity_ids": ["cl-352ac93517a8", "cl-5a9ca0f18354", "cl-cf9630a349e9"]}, {"type": "ambiguity", "severity": "medium", "description": "The mental model cue 'Keep the database when the stack is deleted points to DeletionPolicy Retain or Snapshot' treats the two as interchangeable. Snapshot deletes the database after backing it up. Only Retain keeps it running (cl-1333a54f0660, q906). The contrast set's Effect row states the difference correctly, so the two synthesis parts disagree, and the cue could steer a learner to Snapshot on a 'must keep running' question.", "related_entity_ids": ["aws-sysops-service-cloudformation--m-1", "aws-sysops-service-cloudformation--cs-1", "cl-1333a54f0660", "cl-a7cbb761c685"]}, {"type": "unsupported-generation", "severity": "low", "description": "The mental model and contrast set turn hedged claims into absolute statements the claims do not support. 'On create, nothing is pre-checked': cl-4ffca99fabc7 says only that not every downstream resource is pre-verified, and templates are still validated. 'A failed create never leaves a partial stack behind' ignores a rollback that itself fails, and the model's own DeletionPolicy exception. 'A resource counts as created once its API call succeeds' has no supporting claim. The contrast set's 'Each one acts on exactly one lifecycle event' does not hold, because DeletionPolicy also applies when a resource is removed from the template during an update. 'Stack policy: JSON policy attached to the stack at launch' narrows cl-c388d14db82a's condition into the only way to set one.", "related_entity_ids": ["aws-sysops-service-cloudformation--m-1", "aws-sysops-service-cloudformation--cs-1", "cl-4ffca99fabc7", "cl-27b399297fdb", "cl-c388d14db82a"]}, {"type": "stale-risk", "severity": "low", "description": "cl-22124d03e11e and the mental model invariant 'CloudFormation itself is free: you pay only for the resources it creates' are stated as absolute. CloudFormation now bills per handler operation for third-party registry extensions, such as third-party resource types and hooks, so the invariant is only true for native AWS resource types.", "related_entity_ids": ["cl-22124d03e11e", "aws-sysops-service-cloudformation--m-1"]}, {"type": "quality", "severity": "low", "description": "Several claims are near-duplicates and were not merged: cl-bdfd0e7a36b4 / cl-6ecda7d891a9 / cl-98b564957b6c (AMI IDs are region-scoped, so a hardcoded AMI fails elsewhere), cl-034d63e724d4 / cl-023893050ab9 (WaitCondition blocks until cfn-signal), cl-2b46eb5955f5 / cl-4070339fccbc (DependsOn only orders creation), and cl-8fda3117e86c / cl-76bf6c59a6fa (StackSets across accounts and Regions). This inflates the claim count and spreads support across separate entries.", "related_entity_ids": ["cl-bdfd0e7a36b4", "cl-6ecda7d891a9", "cl-98b564957b6c", "cl-034d63e724d4", "cl-023893050ab9", "cl-2b46eb5955f5", "cl-4070339fccbc", "cl-8fda3117e86c", "cl-76bf6c59a6fa"]}]}]}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam: a future fetch-based loader only ever
  // needs to replace these two bodies. ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: (s.sourceQuestions || []).length };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(function (c) {
          var status = c.status || 'status unknown';
          return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span></li>`;
        }).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        ${raw(citationsHtml(cs.claim_ids))}
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
        <div class="item-meta">${raw(metaBadges.join(''))}</div>
        ${raw(changedCondition)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence <span class="muted">(optional)</span></legend>
          <div class="segmented">${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"><span>${c}</span></label>`; }).join(''))}</div>
        </fieldset>
        <div class="actions"><button id="reveal-practice-btn" type="button">Reveal answer</button></div>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------
  function itemLookup(itemId) {
    return practiceItems().find(function (i) { return i.id === itemId; });
  }

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {
          var item = itemLookup(a.itemId);
          var prompt = item ? (item.prompt || item.stem || '') : '(item no longer in scenario family)';
          var predictedText = Array.isArray(a.predicted) ? a.predicted.join(', ') : (a.predicted || '(no answer recorded)');
          var radios = DIAGNOSIS_CATEGORIES.map(function (c) {
            return safe`<label class="diagnosis-option"><input type="radio" name="diagnosis-${a.id}" value="${c.key}"><span><strong>${c.label}</strong><span class="hint">${c.hint}</span></span></label>`;
          }).join('');
          return safe`
            <div class="pending-attempt panel" data-attempt-id="${a.id}">
              <p class="prompt">${prompt}</p>
              <p class="your-answer"><span class="field-label">Your answer</span>${predictedText}</p>
              <fieldset>
                <legend>What went wrong?</legend>
                <div class="diagnosis-grid">${raw(radios)}</div>
              </fieldset>
              <p class="field-error hidden" role="alert">Pick the category that best explains the miss.</p>
              <div class="actions"><button type="button" class="submit-diagnosis">Submit diagnosis</button></div>
            </div>`;
        }).join('')
      : safe`<p class="empty">Nothing to diagnose. Items you mark wrong in Practice show up here.</p>`;

    var historyHtml = history.length
      ? safe`<ul class="diagnosis-history">${raw(history.map(function (a) {
          var cat = DIAGNOSIS_CATEGORIES.find(function (c) { return c.key === a.diagnosis; });
          var label = cat ? cat.label : a.diagnosis;
          var item = itemLookup(a.itemId);
          var excerpt = truncate(item ? (item.prompt || item.stem || '') : a.itemId, 80);
          var when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '';
          return safe`<li><span class="badge">${label}</span><span>${excerpt}</span><time class="muted" datetime="${a.timestamp || ''}">${when}</time></li>`;
        }).join(''))}</ul>`
      : safe`<p class="empty">No diagnosed mistakes yet.</p>`;

    var html = safe`
      <section class="diagnose">
        <h2>Diagnose</h2>
        <p class="back-link"><a href="${sliceHref('learn')}">&larr; Revisit Learn</a></p>
        <h3>Needs diagnosis <span class="tally">${pending.length}</span></h3>
        ${raw(pendingHtml)}
        <h3>History <span class="tally">${history.length}</span></h3>
        ${raw(historyHtml)}
      </section>`;
    var node = fromHTML(html);
    node.querySelectorAll('.pending-attempt').forEach(function (el) {
      var error = el.querySelector('.field-error');
      el.addEventListener('change', function () { error.classList.add('hidden'); });
      el.querySelector('.submit-diagnosis').addEventListener('click', function () {
        var checked = el.querySelector('input[type="radio"]:checked');
        if (!checked) { error.classList.remove('hidden'); return; }
        var attemptId = el.getAttribute('data-attempt-id');
        var attempt = STATE.attempts.find(function (a) { return a.id === attemptId; });
        if (attempt) {
          attempt.diagnosis = checked.value;
          saveState();
          navigate();
        }
      });
    });
    return node;
  }

  // ---------- Explore Sources ----------
  var sourcesSearchTerm = '';
  var expandedSourceId = null;

  function questionMatches(q, term) {
    if (!term) return true;
    var choiceText = (q.choices || []).map(function (c) { return c.text; }).join(' ');
    var haystack = [q.id, q.stem, q.explanation, choiceText].join(' ').toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function citingClaims(questionId) {
    return (CURRENT.claims || []).filter(function (c) { return (c.source_question_ids || []).indexOf(questionId) !== -1; });
  }

  function issuesHtml() {
    var issues = CURRENT.issues || [];
    if (!issues.length) return safe`<p class="muted">No open issues.</p>`;
    return safe`
      <details class="issues-panel">
        <summary>Issues <span class="tally">${issues.length}</span></summary>
        <ul class="issues">${raw(issues.map(function (i) {
          return safe`<li><p class="issue-head"><span class="badge severity-${i.severity || 'unknown'}">${i.severity || 'unknown'}</span><strong>${i.type || 'issue'}</strong></p><p>${i.description || ''}</p></li>`;
        }).join(''))}</ul>
      </details>`;
  }

  function sourceRowHtml(q) {
    var isOpen = q.id === expandedSourceId;
    var detail = '';
    if (isOpen) {
      var citing = citingClaims(q.id);
      var choiceItems = (q.choices || []).map(function (c) {
        var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
        return safe`<li class="${isCorrect ? 'correct-choice' : ''}"><span class="choice-letter">${c.letter}.</span> ${c.text}${raw(isCorrect ? ' <span class="badge tone-ok">correct</span>' : '')}</li>`;
      }).join('');
      var citedList = citing.length
        ? safe`<ul>${raw(citing.map(function (c) { return safe`<li>${c.statement}</li>`; }).join(''))}</ul>`
        : safe`<p class="muted">No claims cite this question yet.</p>`;
      var src = q.source || {};
      detail = safe`
        <tr class="detail-row">
          <td colspan="4">
            <div class="source-detail">
              <p>${q.stem}</p>
              <ul>${raw(choiceItems)}</ul>
              <h4>Explanation</h4>
              <p>${q.explanation || ''}</p>
              <p class="muted source-meta">Source: ${src.file || ''} (p. ${src.page !== undefined ? src.page : '?'}, Q${src.question_number !== undefined ? src.question_number : '?'})</p>
              <h4>Cited by <span class="tally">${citing.length}</span></h4>
              ${raw(citedList)}
            </div>
          </td>
        </tr>`;
    }
    var disputedBadge = q.disputed ? ' <span class="badge tone-warn">disputed</span>' : '';
    return safe`
      <tr class="source-row${raw(isOpen ? ' is-open' : '')}" data-id="${q.id}">
        <td class="cell-id"><button type="button" class="row-toggle" aria-expanded="${isOpen ? 'true' : 'false'}">${q.id}</button></td>
        <td class="cell-status">${q.status || ''}${raw(disputedBadge)}</td>
        <td class="cell-stem">${truncate(q.stem, 90)}</td>
        <td class="cell-answer">${(q.correct_answer || []).join(', ')}</td>
      </tr>${raw(detail)}`;
  }

  function renderSources() {
    var questions = CURRENT.sourceQuestions || [];
    var html = safe`
      <section class="sources">
        <h2>Explore Sources</h2>
        ${raw(issuesHtml())}
        <div class="search-field">
          <label class="field-label" for="sources-search">Search questions</label>
          <input type="search" id="sources-search" placeholder="Stem, choices, or explanation">
          <p class="muted" id="sources-count" aria-live="polite"></p>
        </div>
        <div class="table-wrap" tabindex="0" role="region" aria-label="Source questions">
          <table class="sources-table">
            <thead><tr><th scope="col">ID</th><th scope="col">Status</th><th scope="col">Stem</th><th scope="col">Correct</th></tr></thead>
            <tbody id="sources-tbody"></tbody>
          </table>
        </div>
      </section>`;
    var fragment = fromHTML(html);
    var section = fragment.firstElementChild;
    var input = section.querySelector('#sources-search');
    input.value = sourcesSearchTerm;

    function renderRows() {
      var filtered = questions.filter(function (q) { return questionMatches(q, sourcesSearchTerm); });
      section.querySelector('#sources-count').textContent = filtered.length + ' / ' + questions.length + ' questions';
      var tbody = section.querySelector('#sources-tbody');
      tbody.innerHTML = filtered.length
        ? filtered.map(sourceRowHtml).join('')
        : safe`<tr><td colspan="4" class="empty-cell">No questions match "${sourcesSearchTerm}".</td></tr>`;
      tbody.querySelectorAll('.source-row').forEach(function (row) {
        row.addEventListener('click', function () {
          var id = row.getAttribute('data-id');
          expandedSourceId = expandedSourceId === id ? null : id;
          renderRows();
          var toggle = tbody.querySelector('.source-row[data-id="' + CSS.escape(id) + '"] .row-toggle');
          if (toggle) toggle.focus({ preventScroll: true });
        });
      });
    }

    input.addEventListener('input', function () {
      sourcesSearchTerm = input.value;
      renderRows();
    });
    renderRows();
    return fragment;
  }

  // ---------- slice selection ----------
  var DEFAULT_SLICE_ID = null;

  function populateSliceSelect(manifest) {
    DEFAULT_SLICE_ID = manifest.length ? manifest[0].id : null;
    var select = document.getElementById('slice-select');
    select.innerHTML = manifest.map(function (s) {
      return safe`<option value="${s.id}">${s.facet.key}: ${s.facet.value} (${s.questionCount} q)</option>`;
    }).join('');
    document.getElementById('slice-controls').classList.toggle('hidden', manifest.length <= 1);
    select.addEventListener('change', function () {
      location.hash = '#' + encodeURIComponent(select.value) + '/' + parseHash().mode;
    });
  }

  function activateSlice(sliceId) {
    return loadSlice(sliceId).then(function (slice) {
      CURRENT = slice;
      STORAGE_KEY = 'ekd:' + slice.contentSet.id + ':' + slice.contentSet.schemaVersion;
      STATE = loadState();
      practiceIndex = 0;
      sourcesSearchTerm = '';
      expandedSourceId = null;
      var cs = CURRENT.contentSet;
      document.getElementById('app-title').innerHTML = safe`<span class="title-exam">${cs.exam}</span><span class="title-sep" aria-hidden="true">/</span><span class="title-facet"><span class="visually-hidden">${cs.facet.key}: </span>${cs.facet.value}</span>`;
      document.title = cs.facet.value + ' · ' + cs.exam;
      var select = document.getElementById('slice-select');
      if (select.value !== slice.contentSet.id) select.value = slice.contentSet.id;
      renderStorageWarning();
    });
  }

  // ---------- routing: "#<sliceId>/<mode>", falling back to the active (or
  // first) slice when the hash omits one -- e.g. on first load. ----------
  var ROUTES = { learn: renderLearn, compare: renderCompare, practice: renderPractice, diagnose: renderDiagnose, sources: renderSources };
  var DEFAULT_MODE = 'learn';

  function sliceHref(mode) {
    return '#' + encodeURIComponent(CURRENT.contentSet.id) + '/' + mode;
  }

  function parseHash() {
    var rawHash = (location.hash || '').slice(1);
    var slashIndex = rawHash.indexOf('/');
    var fallbackSliceId = CURRENT ? CURRENT.contentSet.id : DEFAULT_SLICE_ID;
    if (slashIndex === -1) {
      return { sliceId: fallbackSliceId, mode: ROUTES.hasOwnProperty(rawHash) ? rawHash : DEFAULT_MODE };
    }
    var sliceId = decodeURIComponent(rawHash.slice(0, slashIndex)) || fallbackSliceId;
    var mode = rawHash.slice(slashIndex + 1);
    return { sliceId: sliceId, mode: ROUTES.hasOwnProperty(mode) ? mode : DEFAULT_MODE };
  }

  function navigate() {
    var target = parseHash();
    var proceed = (!CURRENT || CURRENT.contentSet.id !== target.sliceId)
      ? activateSlice(target.sliceId)
      : Promise.resolve();
    return proceed.then(function () {
      document.querySelectorAll('#nav a').forEach(function (a) {
        var mode = a.getAttribute('data-route');
        a.setAttribute('href', sliceHref(mode));
        a.classList.toggle('active', mode === target.mode);
        if (mode === target.mode) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(ROUTES[target.mode]());
    });
  }

  // ---------- init ----------
  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('import-input').addEventListener('change', importProgress);
  window.addEventListener('hashchange', navigate);
  getManifest().then(function (manifest) {
    populateSliceSelect(manifest);
    return navigate();
  });
})();
</script>
</body>
</html>
