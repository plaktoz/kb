<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

fidence": "medium", "id": "cl-6715fdd1a014", "source_question_ids": ["awssysops-p1-q041"], "statement": "Provisioned IOPS is a feature of Amazon EBS volumes, not Amazon S3.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-105a48c381a0", "source_question_ids": ["awssysops-p1-q043"], "statement": "When upload throughput is limited despite less than half of available network bandwidth being used, uploading files in parallel (e.g., via S3 multipart upload or concurrent PUT requests) can reduce total upload time by using the idle bandwidth.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab3025eaf487", "source_question_ids": ["awssysops-p1-q043"], "statement": "Increasing network bandwidth does not reduce upload time when the existing bandwidth is already underutilized.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e41bffa1f575", "source_question_ids": ["awssysops-p1-q043"], "statement": "Packing many files into a single archive before uploading does not parallelize the transfer and adds extra pack/unpack overhead.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1f0fc6fd96ab", "source_question_ids": ["awssysops-p1-q043"], "statement": "AWS Import/Export is intended for bulk one-time or infrequent transfers of very large data volumes via physical media, not routine time-constrained nightly uploads.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3f10ca7a2401", "source_question_ids": ["awssysops-p1-q045"], "statement": "Enabling versioning on an S3 bucket lets you recover a previous version of an object after it is overwritten or deleted, because a delete only adds a delete marker rather than destroying the prior version.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "h er-object permission control to each individual uploader the way an object ACL does.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1ed8dd94bb2b", "source_question_ids": ["awssysops-p1-q134"], "statement": "Provisioning individual IAM users for every potential uploader does not scale to arbitrary external uploaders the way an open bucket ACL does.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6f9eb606a849", "source_question_ids": ["awssysops-p1-q145"], "statement": "The bucket ACL's WRITE permission grants other accounts the ability to create, overwrite, and delete objects in the bucket, and s3:DeleteObject is the bucket-policy action that most closely represents that write-level access.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-db74420a547c", "source_question_ids": ["awssysops-p1-q145"], "statement": "s3:GetObjectAcl, s3:GetObjectVersion, and s3:ListBucketVersions are read/metadata/listing actions and do not correspond to write access.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-24cb589e2463", "source_question_ids": ["awssysops-p1-q180"], "statement": "An S3 bucket policy statement granting an object-level action like s3:GetObjectAcl must use an object-scoped resource ARN (e.g., arn:aws:s3:::bucket/*) rather than a bucket-level ARN (arn:aws:s3:::bucket), or AWS rejects the policy with an 'Action does not apply to any resource(s) in statement' error.", "status": "supported"}, {"claim_type": "rule", "conditions": ["bucket versioning enabled", "SSE-C in use"], "confidence": "high", "id": "cl-db224119ff91", "source_question_ids": ["awssysops-p1-q213"], "statement": "With SSE-C on a versioning-enabled S3 bucket, each object version uploaded can carry its own distinct encryption key.", "status": "supported"}, {"claim_type": "fact", "condition tatement": "S3 bucket ACLs can only grant permissions to AWS accounts or predefined S3 groups; they have no mechanism to target an individual IAM user within an account.", "status": "supported"}, {"claim_type": "fact", "conditions": ["SSE-C in use"], "confidence": "high", "id": "cl-122372406e46", "source_question_ids": ["awssysops-p1-q239"], "statement": "SSE-C requires three headers on each API call: x-amz-server-side-encryption-customer-algorithm, x-amz-server-side-encryption-customer-key, and x-amz-server-side-encryption-customer-key-MD5.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-8f7c3600090d", "source_question_ids": ["awssysops-p1-q239"], "statement": "'x-amz-server-side-encryption-customer-key-AES-256' is not a real SSE-C header name; the encryption algorithm is supplied as a value to the customer-algorithm header, not as a separate header of its own.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0b2a5b28599f", "source_question_ids": ["awssysops-p1-q246"], "statement": "An S3 ACL grants access to another AWS account using either its email address or its canonical user ID, and S3 resolves an email address to the canonical user ID and stores that in the ACL.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-9db7f0a01bbf", "source_question_ids": ["awssysops-p1-q246"], "statement": "IAM User ID, 'S3 Secure ID,' and 'Access ID' are not valid ACL grantee identifiers for granting access to another AWS account.", "status": "supported"}, {"claim_type": "rule", "conditions": ["SSE-C in use"], "confidence": "high", "id": "cl-4907a07a8f3d", "source_question_ids": ["awssysops-p1-q261"], "statement": "With SSE-C, S3 never stores the customer-supplied encryption key itself, so the caller must supply the key and the encryption algorithm with every API call that reads or writes the object.", "status": "support ": "conflicted"}, {"claim_type": "exception", "conditions": ["Elastic Beanstalk platform is Windows Server (e.g., running a .NET application)"], "confidence": "medium", "id": "cl-50ae6b4244af", "source_question_ids": ["awssysops-p2-q324"], "statement": "Elastic Beanstalk Windows Server platforms do not support bundle logs, which may limit the automatic log-rotation-to-S3 feature specifically for .NET/Windows environments.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["infrastructure scales up and down via autoscaling"], "confidence": "medium", "id": "cl-6510be27c057", "source_question_ids": ["awssysops-p2-q324"], "statement": "Manually connecting to each Elastic Beanstalk instance to create a scheduled task for log rotation does not survive autoscaling, because newly launched instances will not have that task configured.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-902b68475550", "source_question_ids": ["awssysops-p2-q326"], "statement": "A bucket policy can restrict an S3 bucket so that it is only accessible through a specific VPC endpoint, satisfying a requirement that the bucket be reachable only via that endpoint.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-acfa0b26a1ed", "source_question_ids": ["awssysops-p2-q326"], "statement": "A VPC endpoint policy can restrict the endpoint itself so that the VPC can only reach one specific S3 bucket through it, satisfying a requirement that resources in the VPC be limited to a single bucket.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-dae66592d22b", "source_question_ids": ["awssysops-p2-q326"], "statement": "There is no AWS mechanism called a \"VPC endpoint policy on the bucket\" -- a VPC endpoint policy attaches to the endpoint itself, not to a bucket; a policy attached to the bucket restricting it to endpoint-only access is inst t.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9872f15e0a08", "source_question_ids": ["awssysops-p2-q516"], "statement": "AWS does not encrypt every packet in the AWS network with IPsec by default, even though AWS supports IPsec VPN connections.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8591c9fa9ed4", "source_question_ids": ["awssysops-p2-q516"], "statement": "Amazon S3 provides authentication mechanisms to secure stored data against unauthorized access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-954c0b5b852d", "source_question_ids": ["awssysops-p2-q516"], "statement": "Customers may encrypt their input data client-side before uploading it to Amazon S3.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3f9152ea4f7b", "source_question_ids": ["awssysops-p2-q516"], "statement": "Amazon EMR customers can choose to send data to Amazon S3 using HTTPS for secure transmission.", "status": "supported"}, {"claim_type": "rule", "conditions": ["mobile application users need secure access to their own content in a shared S3 bucket"], "confidence": "high", "id": "cl-ab5724cc3fe6", "source_question_ids": ["awssysops-p2-q527"], "statement": "Amazon Cognito authenticates mobile application end users, directly or via federated identity providers, and vends temporary credentials tied to an IAM role, which scopes exactly what each user can access in a shared S3 bucket, typically via per-user prefixes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0f19e99dea2a", "source_question_ids": ["awssysops-p2-q527"], "statement": "AWS Organizations manages multi-account governance and plays no role in authenticating individual mobile application end users for S3 access.", "status": "supported"}, {"claim_type": "distractor", " : "Retrieving an archived object from S3 Glacier requires a separate retrieval request that can take anywhere from minutes to about 12 hours depending on the retrieval tier chosen.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-36191597a03b", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "A gateway VPC endpoint for Amazon S3 has no hourly charges and no per-GB data processing charges.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-86075b30cd0b", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "Routing S3 traffic through an S3 gateway VPC endpoint instead of a NAT gateway avoids the NAT Gateway's per-GB data-processing charge.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-35cfa5c5c421", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "An S3 bucket policy enforcing encryption in transit controls access, not network routing, so it does not reduce NAT Gateway data-processing charges.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-80f3779f4581", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "The S3 Intelligent-Tiering storage class affects storage-class billing for stored objects, not the cost of data transferred through a NAT gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-38863db9cafa", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "Disabling CORS on an S3 bucket affects cross-origin browser requests and has no effect on NAT gateway data-processing charges.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-s3--m-1", "title": "S3 access is a default-deny evaluation over resource-scoped statements", "purpose": "Predict whether a given S3 request is allowed, and pick which control (bucket policy, IAM policy, ACL) can actually enforce a stated requirement.", "mechanism": "Every S3 request starts denied. S3 collects every statement that applies to the request: IAM policies on the calling principal, the bucket policy on the resource, and the bucket/object ACLs. A statement only applies when its Action, its Resource ARN and its Condition all match. Bucket-level actions such as ListBucket and DeleteBucket match only the bare bucket ARN; object-level actions such as GetObject, DeleteObject and GetObjectAcl match only bucket/*. If any matching statement is an explicit Deny, the request is denied. Otherwise, if any matching statement is an Allow, the request is allowed. If nothing matches, it falls back to the implicit deny. So an Allow whose Condition excludes an address (NotIpAddress) never denies that address: the address simply gets no grant and is left implicitly denied. Each control attaches to a different place. An IAM policy attaches to a principal and can only limit that principal. A bucket policy attaches to the bucket and applies to every requester, anonymous users included, which is why it can enforce IP, VPC-endpoint and encryption-header conditions. An ACL grants only to AWS accounts or predefined groups, is managed by the account that owns the object, and cannot carry conditions.", "predict_prompt": "A bucket policy allows s3:ListBucket on arn:aws:s3:::reports/* for an IP range, and a separate statement denies s3:* when aws:SourceIp is NotIpAddress for that range. A user inside the range runs `aws s3 ls s3://reports`. Is it allowed?", "invariants": ["An explicit Deny in any applicable policy overrides every Allow.", "An Allow statement can only grant access. Whatever it fails to match falls through to the implicit deny.", "A statement takes effect only if its Resource ARN is at the level the action applies to: bucket ARN for bucket actions, bucket/* for object actions.", "IAM policies attach to principals and bucket policies attach to buckets. There is no IAM policy that attaches to a bucket.", "Encryption (SSE-S3, SSE-KMS, SSE-C) protects data at rest. It never decides who may request an object."], "limits": ["A policy grants permission but creates no network path. A private subnet still needs a VPC endpoint or a NAT gateway to reach S3.", "A malformed policy JSON fails to save, so it grants nothing.", "Console folders are only key prefixes. They cannot carry their own ACL or policy.", "A cross-account upload stays owned by the uploading account unless bucket-owner-full-control is applied."], "cues": ["'Only from this IP range' or 'only through this VPC endpoint': a bucket policy with an explicit Deny on aws:SourceIp or the endpoint condition.", "'Objects are public / anonymous users': an IAM policy cannot help, because an anonymous request has no IAM user to restrict.", "'ListBucket is still denied': check whether the Resource ends in /* when it should be the bare bucket ARN.", "'Make every object public with the least effort': one bucket-level policy, not per-object ACLs.", "'Grant another account by email or canonical ID': an ACL grantee."], "claim_ids": ["cl-d67fc94a596f", "cl-f31f2112bc46", "cl-c5552e723f17", "cl-6b01212444b0", "cl-fce6a7069012", "cl-a2501324f971", "cl-270fd100a40b", "cl-ee51b7b729e9", "cl-1f0a938d4413", "cl-de918035cefd", "cl-bebe136a0c96", "cl-3337a47ae979", "cl-24cb589e2463", "cl-1f07ef411609", "cl-fb1946f88deb", "cl-aa98e358cde0", "cl-1405f4f93a0e", "cl-9004a45802c4", "cl-81fab5b343e7", "cl-971ad8832b37", "cl-fad7ade99c77", "cl-0b2a5b28599f", "cl-cb42b31e7bab", "cl-7591a077a80b", "cl-1b05aa0dd82b", "cl-8b4352dca37e", "cl-7ff7f4bb57df", "cl-99d4759387b1", "cl-f4a55dba1508", "cl-2190e73636fb", "cl-c46f75d81632"]}, "contrastSet": {"id": "aws-sysops-service-s3--cs-1", "subjects": ["S3 bucket policy", "IAM user/role policy", "S3 ACL (bucket or object)"], "dimensions": ["Attaches to", "Who it can constrain", "Supports conditions (IP, VPC endpoint, encryption header)", "Can express explicit Deny", "Grantee granularity"], "shared_traits": ["All three are AWS's mechanisms for granting S3 permissions.", "All three are evaluated together under default deny, and an explicit Deny wins."], "matrix": {"Attaches to": {"S3 bucket policy": "The bucket (resource-based)", "IAM user/role policy": "A user, group or role (identity-based)", "S3 ACL (bucket or object)": "A bucket or object subresource"}, "Who it can constrain": {"S3 bucket policy": "Every requester, including anonymous users and other accounts", "IAM user/role policy": "Only the principal it is attached to", "S3 ACL (bucket or object)": "Grants only. Cannot restrict anyone."}, "Supports conditions (IP, VPC endpoint, encryption header)": {"S3 bucket policy": "Yes: aws:SourceIp, VPC endpoint, encryption header, SecureTransport", "IAM user/role policy": "Yes, but only for its own principal", "S3 ACL (bucket or object)": "No. No IP-based or other conditions."}, "Can express explicit Deny": {"S3 bucket policy": "Yes", "IAM user/role policy": "Yes", "S3 ACL (bucket or object)": "No. Allow-style grants only."}, "Grantee granularity": {"S3 bucket policy": "Any principal, account, or * (public)", "IAM user/role policy": "The attached identity", "S3 ACL (bucket or object)": "AWS accounts (email or canonical ID) or predefined groups only. Never an individual IAM user."}}, "decision_rule": "Ask whom the restriction must bind. If it must hold for every requester of the bucket, including anonymous users and principals you don't manage (source IP, VPC endpoint only, required encryption), use a bucket policy with an explicit Deny. If it only limits what your own users or roles can do, use an IAM policy. Use an ACL only for an unconditional grant to a whole AWS account or predefined group, managed by the account that owns the object.", "boundary_flip": "Take a requirement to block one IP range from objects that are already public. Anonymous requests have no IAM identity, so only a bucket policy Deny with NotIpAddress works. If the requests come only from IAM users in your own account, an IAM policy Deny on aws:SourceIp also enforces it. If the requirement is instead to let each external uploader manage permissions on the objects it uploads, neither policy fits and the object ACL becomes the answer.", "strongest_distractor_failure": "The tempting answer is to change IAM user policies, or to 'attach an IAM policy to the bucket'. IAM policies attach only to principals, and they cannot touch anonymous or out-of-scope requesters. So they fail any requirement that has to bind every requester of the bucket.", "exceptions": ["An Allow with a NotIpAddress condition does not restrict access to the range. It grants everyone outside it. A real IP restriction needs Deny plus NotIpAddress.", "Making a bucket ACL public does not make the bucket's objects public.", "S3 has no separate 'S3 Object Access Policy'. Object-level access comes from a bucket policy scoped to bucket/* or from an object ACL.", "Current AWS guidance prefers bucket policies over object ACLs for controlling public access."], "claim_ids": ["cl-fb1946f88deb", "cl-738c47a18b36", "cl-1405f4f93a0e", "cl-fb96ff796433", "cl-aa98e358cde0", "cl-9004a45802c4", "cl-81fab5b343e7", "cl-971ad8832b37", "cl-dae66592d22b", "cl-0b22881f6863", "cl-fad7ade99c77", "cl-0b2a5b28599f", "cl-090ae7330a18", "cl-cb42b31e7bab", "cl-f61a22abc180", "cl-ee51b7b729e9", "cl-1f0a938d4413", "cl-1b05aa0dd82b", "cl-32c96d2c8e29", "cl-2240f15f2235", "cl-898f4c39e66b", "cl-c5552e723f17", "cl-d67fc94a596f"]}, "scenarioFamily": {"id": "aws-sysops-service-s3--sf-1", "canonical": {"prompt": "A company's S3 bucket policy has one statement: Effect Allow, Action s3:GetObject, Resource arn:aws:s3:::reports-bucket/*, Condition { IpAddress: {aws:SourceIp: '203.0.113.0/24'}, NotIpAddress: {aws:SourceIp: '203.0.113.50/32'} }. A laptop at 203.0.113.10 (inside the /24, not the excluded address) sends a GetObject request for reports-bucket/q3.pdf. Is the request allowed or denied, and why?", "expected_answer": ["Allowed"], "reasoning": "The request's source IP, 203.0.113.10, falls inside the allow-listed CIDR 203.0.113.0/24 and is not the excluded address 203.0.113.50, so it satisfies both the IpAddress and NotIpAddress clauses of the Condition. The statement therefore matches and, being Effect Allow, grants s3:GetObject on this object. There is no competing Deny anywhere in the policy, so the Allow stands and the request succeeds.", "distractor_analysis": "A reader might think the mix of IpAddress and NotIpAddress makes the statement behave like a Deny, or that 'excluding an address' from an Allow somehow blocks the rest of the range too -- neither is true. The exclusion only removes the one address from the grant; everyone else in the CIDR keeps the Allow.", "claim_ids": ["cl-270fd100a40b", "cl-fce6a7069012", "cl-1321f382635d"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The requesting host is 203.0.113.50 (the specific address excluded by NotIpAddress) instead of 203.0.113.10.", "prompt": "Same bucket policy. Now the GetObject request for reports-bucket/q3.pdf comes from 203.0.113.50 -- the one address carved out by the NotIpAddress clause. Is this request allowed or denied?", "expected_answer": ["Denied"], "reasoning": "203.0.113.50 fails the NotIpAddress condition, so the statement's Condition no longer matches and the Allow does not apply to this request. Because an Allow can only grant access and never produces an explicit Deny, no statement in the policy grants this request -- it falls through to S3's default implicit deny. The address effectively loses access even though the policy has no Deny statement at all.", "claim_ids": ["cl-a2501324f971", "cl-0cd40aea2497", "cl-fce6a7069012"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The same allowed host, 203.0.113.10, requests a different object key (archive/2019/jan.pdf instead of q3.pdf) via a signed AWS CLI call over HTTPS instead of a plain browser GET.", "prompt": "Same bucket policy. The same host, 203.0.113.10, requests a different object -- reports-bucket/archive/2019/jan.pdf -- using the AWS CLI with a signed HTTPS request instead of a plain browser GET for q3.pdf. Is the request allowed or denied?", "expected_answer": ["Allowed"], "reasoning": "Which object key under reports-bucket/* is requested and which client or transport issues the call make no difference here: the Resource ARN reports-bucket/* covers every object in the bucket, and the Condition only inspects the request's source IP. Since 203.0.113.10 still falls inside the allow-listed CIDR and is still not the excluded address, the same Allow statement matches and grants this request exactly as it did for q3.pdf.", "claim_ids": ["cl-24cb589e2463", "cl-270fd100a40b", "cl-fce6a7069012"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A reviewer insists the statement should be read as 'this policy simply grants the whole 203.0.113.0/24 subnet access,' glossing over the NotIpAddress exclusion, while the requester is still 203.0.113.10 (same host as canonical).", "prompt": "Same policy and same requester, 203.0.113.10. A reviewer says the policy 'just grants the whole subnet access' and that the exclusion clause is a minor technicality that doesn't change the outcome for any host in the range. Is 203.0.113.10's GetObject request allowed, and is the reviewer's framing correct?", "expected_answer": ["Allowed"], "reasoning": "The request is still allowed, but not for the reviewer's reason. 203.0.113.10 is allowed because it specifically satisfies both the IpAddress and NotIpAddress clauses -- it is not the excluded address. The reviewer's framing ('just grants the whole subnet') overstates the policy: it ignores that one address in that same subnet, 203.0.113.50, is excluded and denied by default. The correct outcome for 203.0.113.10 happens to match the oversimplified framing here, but that framing would wrongly predict that 203.0.113.50 is also allowed.", "distractor_analysis": "The trap is to accept the reviewer's 'whole subnet' framing as a reliable rule. It happens to produce the right answer for this particular host, but it would mispredict the excluded address's outcome, so the framing itself must be rejected even though today's verdict matches it.", "claim_ids": ["cl-1037d52897c7", "cl-270fd100a40b", "cl-fce6a7069012"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "Instead of an allow-list Allow+NotIpAddress statement, reports-bucket's objects are already public, and the policy's only other statement is Effect Deny, Action s3:*, Condition IpAddress matching a different, unrelated range 198.51.100.0/24, intended to block a flagged office network.", "prompt": "Reports-bucket's objects are already public to anyone. The bucket policy's only other statement is Effect Deny, Action s3:*, Condition { IpAddress: {aws:SourceIp: '198.51.100.0/24'} }, blocking a flagged office network. The same laptop, still at 203.0.113.10, sends a GetObject request for q3.pdf. Is it allowed or denied?", "expected_answer": ["Allowed"], "reasoning": "203.0.113.10 does not fall inside 198.51.100.0/24, so the Deny statement's Condition does not match this request and the Deny never applies to it. With no matching Deny and the object already public, the default grant for public objects governs and the request succeeds. The underlying principle carries over from the canonical case: a Condition-scoped statement, whether Allow or Deny, only affects requests whose source IP actually matches it -- everything else is governed by whatever would otherwise apply.", "claim_ids": ["cl-fb96ff796433", "cl-0cc9660961e1"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "unsupported-generation", "severity": "high", "description": "The contrast set's boundary_flip says that blocking one IP range from already-public objects works 'only [with] a bucket policy Deny with NotIpAddress'. This inverts the logic. Deny + NotIpAddress on a range denies everyone OUTSIDE that range (the pattern in cl-1f0a938d4413 and cl-ee51b7b729e9). Blocking one specific range takes Deny + IpAddress on that range. The flip's second sentence is also unsupported: it says an IAM-policy Deny on aws:SourceIp 'also enforces it' when requests come only from your own IAM users. No claim supports that, and it conflicts with cl-1405f4f93a0e: the objects are public, so anyone in the range can still send an unsigned anonymous request and bypass the IAM policy. The source claim cl-fb96ff796433 has the same wording problem ('NotIPAddress ... can deny access to a specific IP range').", "related_entity_ids": ["aws-sysops-service-s3--cs-1", "cl-fb96ff796433", "cl-1f0a938d4413", "cl-ee51b7b729e9", "cl-1405f4f93a0e"]}, {"type": "contradiction", "severity": "high", "description": "The source questions disagree on an Allow statement that combines an IpAddress range with a NotIpAddress exclusion. Under q027 the claims are 'supported' (cl-270fd100a40b, cl-a2501324f971: everyone in the range except the excluded address gets access). Under q304 the same rule is marked 'conflicted' (cl-1321f382635d, cl-0cd40aea2497, cl-1037d52897c7), which means q304's source answer disputes it (e.g. 'grants access to the whole subnet'). The mental model builds this rule into its mechanism and cites only the q027 claims, with no mention of the dispute.", "related_entity_ids": ["cl-270fd100a40b", "cl-a2501324f971", "cl-1321f382635d", "cl-0cd40aea2497", "cl-1037d52897c7", "aws-sysops-service-s3--m-1"]}, {"type": "contradiction", "severity": "high", "description": "cl-cb42b31e7bab says object-level S3 permissions can ONLY be managed through the object's ACL, by the account that owns the object. Other claims contradict this: bucket policies can grant object-level permissions by scoping Resource to bucket/* or a key pattern (cl-2caccf723273, cl-2e6f11a4dfd2, cl-738c47a18b36, cl-7591a077a80b, cl-e87f9c21f75c). The contrast set cites both cl-cb42b31e7bab and cl-738c47a18b36. Its exception 'Object-level access comes from a bucket policy scoped to bucket/* or from an object ACL' contradicts the 'only via ACL' claim it also relies on.", "related_entity_ids": ["cl-cb42b31e7bab", "cl-2caccf723273", "cl-738c47a18b36", "cl-7591a077a80b", "aws-sysops-service-s3--cs-1", "aws-sysops-service-s3--m-1"]}, {"type": "ambiguity", "severity": "medium", "description": "The claims disagree on what happens when a statement's action and resource level don't match. cl-24cb589e2463 (q180) says AWS rejects the policy at save time ('Action does not apply to any resource(s) in statement'). cl-de918035cefd and cl-bebe136a0c96 say a ListBucket grant on an object ARN saves but silently grants nothing. The mental model's predict_prompt assumes a policy granting s3:ListBucket on arn:aws:s3:::reports/* was saved and is being evaluated. Its own 'malformed policy fails to save' limit makes the intended answer unclear: the policy is either rejected or silently ineffective. The prompt also never states the user's IAM permissions, which can decide the outcome.", "related_entity_ids": ["aws-sysops-service-s3--m-1", "cl-24cb589e2463", "cl-de918035cefd", "cl-bebe136a0c96", "cl-7ff7f4bb57df"]}, {"type": "ambiguity", "severity": "medium", "description": "The mental model's invariant and mechanism say that whatever an Allow fails to match 'falls through to the implicit deny'. They also say that if any matching statement is an Allow, the request is allowed. Those statements only hold when no other policy grants the request. An address excluded from a bucket-policy Allow (cl-a2501324f971) is still allowed if an IAM policy grants it. That is why cl-1f0a938d4413 says a real IP restriction needs an explicit Deny. The model's framing ('never denies that address ... left implicitly denied') overstates single-statement reasoning. It also ignores the cross-account case, where both the bucket policy and the caller's own account must allow the request (cl-f63fb92b053b).", "related_entity_ids": ["aws-sysops-service-s3--m-1", "cl-a2501324f971", "cl-1f0a938d4413", "cl-fce6a7069012", "cl-f63fb92b053b"]}, {"type": "stale-risk", "severity": "medium", "description": "cl-f4a55dba1508 and cl-2ff7ad88df29 say a cross-account upload stays owned by the uploader unless bucket-owner-full-control is applied, and that this ACL 'transfers effective ownership'. The mental model repeats this as a limit. The bucket-owner-full-control ACL alone only grants the bucket owner full control. Ownership changes only under the Object Ownership setting. Since April 2023, new buckets default to BucketOwnerEnforced, which disables ACLs, so the bucket owner owns every object. That also makes the ACL-centric claims (cl-cb42b31e7bab, cl-f61a22abc180) stale for new buckets.", "related_entity_ids": ["cl-f4a55dba1508", "cl-2ff7ad88df29", "cl-cb42b31e7bab", "cl-f61a22abc180", "aws-sysops-service-s3--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "The source questions disagree on restricting a bucket to a VPC endpoint with a bucket policy. cl-902b68475550 (q326) is marked 'conflicted', but the same rule is 'supported' under q822 (cl-81fab5b343e7). The mental model's cue ('only through this VPC endpoint': bucket policy Deny) relies on cl-81fab5b343e7 without flagging q326's disputed answer.", "related_entity_ids": ["cl-902b68475550", "cl-81fab5b343e7", "aws-sysops-service-s3--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "The source questions disagree on default bucket encryption. q532's claims are 'conflicted' (cl-7f78d3e0c941, cl-c9552c29e80c), while the equivalent default-encryption rule is 'supported' under q606/q668 (cl-db17188c1099, cl-03961ea3ad94). cl-7f78d3e0c941 also overstates: 'regardless of what the uploader specifies' is wrong, because an encryption header in the request overrides the bucket default.", "related_entity_ids": ["cl-7f78d3e0c941", "cl-c9552c29e80c", "cl-db17188c1099", "cl-03961ea3ad94"]}, {"type": "contradiction", "severity": "medium", "description": "In q548, the boxed answer (EBS) and the community vote (S3) disagree on which service can gain at-rest encryption in place. cl-d5c0d736f964 records the dispute, but cl-817f30509d29 is marked 'supported' and adopts the community answer, effectively settling the dispute by vote. cl-a52c8e591c6a, from the same question, says EBS encryption can only be enabled at creation, which itself contradicts the boxed answer.", "related_entity_ids": ["cl-d5c0d736f964", "cl-817f30509d29", "cl-a52c8e591c6a"]}, {"type": "contradiction", "severity": "medium", "description": "In q875, the boxed answer (CloudWatch storage metrics) and the community vote (S3 Inventory) disagree (cl-499577a1d520). cl-ec2208d1a7ae and cl-d758114f10ab are still marked 'supported' in favor of the community answer, which settles the dispute by vote instead of flagging it.", "related_entity_ids": ["cl-499577a1d520", "cl-ec2208d1a7ae", "cl-d758114f10ab"]}, {"type": "contradiction", "severity": "medium", "description": "In q895, the boxed answer (Object Lock governance mode) and the community vote (compliance mode) disagree on WORM that even root cannot bypass (cl-3e8af1b74824). cl-6b730e77b610 and cl-752bdbf8ec08 are marked 'supported' in a way that settles the dispute in favor of the community answer.", "related_entity_ids": ["cl-3e8af1b74824", "cl-6b730e77b610", "cl-752bdbf8ec08"]}, {"type": "contradiction", "severity": "medium", "description": "q555 is disputed: cl-09dd89b5282e and cl-322e2ca682b9 (encryption doesn't stop ransomware; versioning does) are 'conflicted'. Yet cl-2190e73636fb, which cites q555, is 'supported', and the mental model uses it for the invariant 'Encryption ... never decides who may request an object'. A disputed source is backing a model invariant without a flag.", "related_entity_ids": ["cl-09dd89b5282e", "cl-322e2ca682b9", "cl-2190e73636fb", "aws-sysops-service-s3--m-1"]}, {"type": "contradiction", "severity": "low", "description": "q333 is disputed: its specific claims cl-e7acc0fced5f (Deny + StringNotLike on aws:userid) and cl-f2613b08406b are 'conflicted'. Yet q333 is cited as support for the 'supported' explicit-Deny-wins rule cl-f31f2112bc46, which the mental model uses. The rule itself is also backed by q483, q733 and q902, but q333's disputed answer should not count as support.", "related_entity_ids": ["cl-e7acc0fced5f", "cl-f2613b08406b", "cl-f31f2112bc46", "aws-sysops-service-s3--m-1"]}, {"type": "contradiction", "severity": "low", "description": "Every q579 claim is unresolved. cl-bfd135f007b9 (Config rule plus SNS is a purely detective control) and cl-e143f0cd24ab (restricting to IAM roles conflicts with 'don't restrict users') are 'conflicted'. cl-4e0b1b048f58 is 'needs-review'. Nothing from q579 can be relied on.", "related_entity_ids": ["cl-bfd135f007b9", "cl-e143f0cd24ab", "cl-4e0b1b048f58"]}, {"type": "contradiction", "severity": "low", "description": "All three q324 Elastic Beanstalk log-rotation claims are 'conflicted' (cl-b4bea39cfd03, cl-50ae6b4244af, cl-6510be27c057). cl-50ae6b4244af hedges ('may limit') that Windows platforms don't support bundle logs, which undercuts cl-b4bea39cfd03's claim that the feature works automatically for this .NET scenario.", "related_entity_ids": ["cl-b4bea39cfd03", "cl-50ae6b4244af", "cl-6510be27c057"]}, {"type": "contradiction", "severity": "low", "description": "cl-f08d0ad35ab6 (SSE-C can't be used through the Management Console; it requires the CLI, SDK or API) is 'conflicted' with low confidence, so q216's source disagrees. Other claims from q216 (cl-6aa4e5346f85, cl-3bb076f63805) are 'supported' without the dispute being resolved.", "related_entity_ids": ["cl-f08d0ad35ab6", "cl-6aa4e5346f85", "cl-3bb076f63805"]}, {"type": "contradiction", "severity": "low", "description": "cl-d9b00268a7b1 (a lifecycle rule isn't for one-time removal of a delete marker) is 'conflicted', which means q718 and q622 disagree. cl-52e418c25010 (q718), marked 'supported', depends on the same framing.", "related_entity_ids": ["cl-d9b00268a7b1", "cl-52e418c25010"]}, {"type": "stale-risk", "severity": "low", "description": "The RRS-based claims rest on a deprecated storage class. cl-97d400ab2e05 (q090) is 'conflicted' with low confidence. The RRS durability and purpose claims (cl-fe7368030c51, cl-7c57a6ff9998) describe a deprecated class (cl-9ae4cbbde858, cl-fe009f288976), and current exam answers may differ from the source keys.", "related_entity_ids": ["cl-97d400ab2e05", "cl-fe7368030c51", "cl-7c57a6ff9998", "cl-9ae4cbbde858", "cl-fe009f288976"]}, {"type": "stale-risk", "severity": "low", "description": "q271 depends on an obsolete Flash-based 'Enhanced Uploader' (cl-8ac7b0138e56, needs-review). The modern-console claim cl-722415197c5e is 'conflicted' with the source's keyed answer.", "related_entity_ids": ["cl-722415197c5e", "cl-8ac7b0138e56"]}, {"type": "ambiguity", "severity": "low", "description": "Three Glacier-restore claims from q289 are low-confidence 'needs-review' (cl-fd2d6583207f, cl-83f7e7ded98a, cl-6ef0398efde7), yet the same question's cl-88c8b4952f0e is marked high-confidence 'supported'. The source evidently doesn't settle the restore-duration and billing details.", "related_entity_ids": ["cl-fd2d6583207f", "cl-83f7e7ded98a", "cl-6ef0398efde7", "cl-88c8b4952f0e"]}, {"type": "ambiguity", "severity": "low", "description": "cl-6f9eb606a849 says s3:DeleteObject is the bucket-policy action that 'most closely represents' bucket-ACL WRITE access. That only holds within q145's option set: WRITE maps mainly to s3:PutObject (plus DeleteObject). Taken out of context, the claim misleads.", "related_entity_ids": ["cl-6f9eb606a849"]}, {"type": "stale-risk", "severity": "low", "description": "Two claims have aged. cl-fb0a62a25fbf says S3 supports 'exactly three' server-side encryption modes, but DSSE-KMS was added in 2023. The CloudFront OAI claims (cl-62146ffb292d, cl-9b70036d4bde) describe a legacy mechanism that Origin Access Control (OAC) has replaced.", "related_entity_ids": ["cl-fb0a62a25fbf", "cl-62146ffb292d", "cl-9b70036d4bde"]}], "sourceQuestionCount": 94}], "sources": {"kind": "locked", "file": "aws-sysops-service-s3-jg8y.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        ${raw(citationsHtml(cs.claim_ids))}
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
