      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
        <div class="item-meta">${raw(metaBadges.join(''))}</div>
        ${raw(changedCondition)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence <span class="muted">(optional)</span></legend>
          <div class="segmented">${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"><span>${c}</span></label>`; }).join(''))}</div>
        </fieldset>
        <div class="actions"><button id="reveal-practice-btn" type="button">Reveal answer</button></div>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------
  function itemLookup(itemId) {
    return practiceItems().find(function (i) { return i.id === itemId; });
  }

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {
          var item = itemLookup(a.itemId);
          var prompt = item ? (item.prompt || item.stem || '') : '(item no longer in scenario family)';
          var predictedText = Array.isArray(a.predicted) ? a.predicted.join(', ') : (a.predicted || '(no answer recorded)');
          var radios = DIAGNOSIS_CATEGORIES.map(function (c) {
            return safe`<label class="diagnosis-option"><input type="radio" name="diagnosis-${a.id}" value="${c.key}"><span><strong>${c.label}</strong><span class="hint">${c.hint}</span></span></label>`;
          }).join('');
          return safe`
            <div class="pending-attempt panel" data-attempt-id="${a.id}">
              <p class="prompt">${prompt}</p>
              <p class="your-answer"><span class="field-label">Your answer</span>${predictedText}</p>
              <fieldset>
                <legend>What went wrong?</legend>
                <div class="diagnosis-grid">${raw(radios)}</div>
              </fieldset>
              <p class="field-error hidden" role="alert">Pick the category that best explains the miss.</p>
              <div class="actions"><button type="button" class="submit-diagnosis">Submit diagnosis</button></div>
            </div>`;
        }).join('')
      : safe`<p class="empty">Nothing to diagnose. Items you mark wrong in Practice show up here.</p>`;

    var historyHtml = history.length
      ? safe`<ul class="diagnosis-history">${raw(history.map(function (a) {
          var cat = DIAGNOSIS_CATEGORIES.find(function (c) { return c.key === a.diagnosis; });
          var label = cat ? cat.label : a.diagnosis;
          var item = itemLookup(a.itemId);
          var excerpt = truncate(item ? (item.prompt || item.stem || '') : a.itemId, 80);
          var when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '';
          return safe`<li><span class="badge">${label}</span><span>${excerpt}</span><time class="muted" datetime="${a.timestamp || ''}">${when}</time></li>`;
        }).join(''))}</ul>`
      : safe`<p class="empty">No diagnosed mistakes yet.</p>`;

    var html = safe`
      <section class="diagnose">
        <h2>Diagnose</h2>
        <p class="back-link"><a href="${sliceHref('learn')}">&larr; Revisit Learn</a></p>
        <h3>Needs diagnosis <span class="tally">${pending.length}</span></h3>
        ${raw(pendingHtml)}
        <h3>History <span class="tally">${history.length}</span></h3>
        ${raw(historyHtml)}
      </section>`;
    var node = fromHTML(html);
    node.querySelectorAll('.pending-attempt').forEach(function (el) {
      var error = el.querySelector('.field-error');
      el.addEventListener('change', function () { error.classList.add('hidden'); });
      el.querySelector('.submit-diagnosis').addEventListener('click', function () {
        var checked = el.querySelector('input[type="radio"]:checked');
        if (!checked) { error.classList.remove('hidden'); return; }
        var attemptId = el.getAttribute('data-attempt-id');
        var attempt = STATE.attempts.find(function (a) { return a.id === attemptId; });
        if (attempt) {
          attempt.diagnosis = checked.value;
          saveState();
          navigate();
        }
      });
    });
    return node;
  }

  // ---------- Explore Sources ----------
  var sourcesSearchTerm = '';
  var expandedSourceId = null;
  // Page-level: the sibling file covers every slice, so this is NOT reset in
  // activateSlice the way the two per-slice vars above are. One value, the
  // status discriminating which fields exist:
  //   {status:'idle'} | {status:'loading'}
  //   {status:'locked', envelope, notice: null | 'wrong-password' | 'forgotten-key'}
  //   {status:'unlocking', envelope, via: 'cache' | 'password'}
  //   {status:'ready', bySlice, lock: null | {envelope, expiresAt: number | null}}   lock is null on a clear page
  //   {status:'unavailable', reason: 'no-sources' | 'load-failed' | 'bad-envelope'}
  var SOURCES = { status: 'idle' };

  function questionMatches(q, term) {
    if (!term) return true;
    var choiceText = (q.choices || []).map(function (c) { return c.text; }).join(' ');
    var haystack = [q.id, q.stem, q.explanation, choiceText].join(' ').toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function citingClaims(questionId) {
    return (CURRENT.claims || []).filter(function (c) { return (c.source_question_ids || []).indexOf(questionId) !== -1; });
  }

  function issuesHtml() {
    var issues = CURRENT.issues || [];
    if (!issues.length) return safe`<p class="muted">No open issues.</p>`;
    return safe`
      <details class="issues-panel">
        <summary>Issues <span class="tally">${issues.length}</span></summary>
        <ul class="issues">${raw(issues.map(function (i) {
          return safe`<li><p class="issue-head"><span class="badge severity-${i.severity || 'unknown'}">${i.severity || 'unknown'}</span><strong>${i.type || 'issue'}</strong></p><p>${i.description || ''}</p></li>`;
        }).join(''))}</ul>
      </details>`;
  }

  function sourceRowHtml(q) {
    var isOpen = q.id === expandedSourceId;
    var detail = '';
    if (isOpen) {
      var citing = citingClaims(q.id);
      var choiceItems = (q.choices || []).map(function (c) {
        var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
        return safe`<li class="${isCorrect ? 'correct-choice' : ''}"><span class="choice-letter">${c.letter}.</span> ${c.text}${raw(isCorrect ? ' <span class="badge tone-ok">correct</span>' : '')}</li>`;
      }).join('');
      var citedList = citing.length
        ? safe`<ul class="citations">${raw(citing.map(claimListItemHtml).join(''))}</ul>`
        : safe`<p class="muted">No claims cite this question yet.</p>`;
      var src = q.source || {};
      detail = safe`
        <tr class="detail-row">
          <td colspan="5">
            <div class="source-detail">
              <p>${q.stem}</p>
              <ul>${raw(choiceItems)}</ul>
              <h4>Explanation</h4>
              <p>${q.explanation || ''}</p>
              <p class="muted source-meta">Source: ${src.file || ''} (p. ${src.page !== undefined ? src.page : '?'}, Q${src.question_number !== undefined ? src.question_number : '?'})</p>
              <h4>Cited by <span class="tally">${citing.length}</span></h4>
              ${raw(citedList)}
            </div>
          </td>
        </tr>`;
    }
    var disputedBadge = q.disputed ? ' <span class="badge tone-warn">disputed</span>' : '';
    return safe`
      <tr class="source-row${raw(isOpen ? ' is-open' : '')}" data-id="${q.id}">
        <td class="cell-id"><button type="button" class="row-toggle" aria-expanded="${isOpen ? 'true' : 'false'}">${q.id}</button></td>
        <td class="cell-status">${q.status || ''}${raw(disputedBadge)}</td>
        <td class="cell-stem">${truncate(q.stem, 90)}</td>
        <td class="cell-answer">${(q.correct_answer || []).join(', ')}</td>
        <td class="cell-mark">${raw(markControlHtml('question:' + q.id))}</td>
      </tr>${raw(detail)}`;
  }

  // BUNDLE.sources names the one sibling this page may load. A locked page's
  // bundle has no field that could name the clear file.
  var SOURCE_GLOBAL = { clear: '__EKD_SOURCES_CLEAR__', locked: '__EKD_SOURCES_ENC__' };

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement('script');
      el.src = src;
      el.onload = function () { el.remove(); resolve(); };
      el.onerror = function () { el.remove(); reject(new Error('failed to load ' + src)); };
      document.body.appendChild(el);
    });
  }

  function urlSourcesBaseUrl() {
    try { return new URLSearchParams(location.search).get('sourcesBaseUrl'); } catch (e) { return null; }
  }

  function sourcesScriptUrl(name) {
    var base = urlSourcesBaseUrl();
    return base ? new URL(name, base).toString() : name;
  }

  function base64UrlToBytes(text) {
    var padded = text.replace(/-/g, '+').replace(/_/g, '/');
    while (padded.length % 4) padded += '=';
    var bin = atob(padded);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function bytesToBase64Url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // Envelope v2 (scripts/ekd/sources_crypto.py), checked once here so the
  // crypto calls below can trust its fields.
  function parseEnvelope(raw) {
    try {
      var ok = raw && raw.v === 2 && raw.kdf && raw.kdf.name === 'PBKDF2' && raw.kdf.hash === 'SHA-256'
        && Number.isInteger(raw.kdf.iterations) && raw.kdf.iterations > 0
        && raw.cipher && raw.cipher.name === 'AES-GCM' && typeof raw.ciphertext === 'string';
      if (!ok) return null;
      return {
        salt: raw.kdf.salt,
        saltBytes: base64UrlToBytes(raw.kdf.salt),
        iterations: raw.kdf.iterations,
        iv: base64UrlToBytes(raw.cipher.iv),
        ciphertext: base64UrlToBytes(raw.ciphertext),
      };
    } catch (e) {
      return null;
    }
  }

  // The raw AES key bits, never the password, are what a page can remember.
  function deriveKey(envelope, password) {
    var secret = new TextEncoder().encode(password.normalize('NFC'));
    return crypto.subtle.importKey('raw', secret, 'PBKDF2', false, ['deriveBits']).then(function (base) {
      return crypto.subtle.deriveBits(
        { name: 'PBKDF2', hash: 'SHA-256', salt: envelope.saltBytes, iterations: envelope.iterations }, base, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }

  function decryptSources(envelope, rawKey) {
    return crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: envelope.iv }, key, envelope.ciphertext);
    }).then(function (plainBuf) {
      var data = JSON.parse(new TextDecoder().decode(plainBuf));
      if (!data || typeof data !== 'object') throw new Error('decrypted sources are not an object');
      return data;
    });
  }

  // Remembered keys, one localStorage entry per sealing, keyed by its salt.
  // Chrome shares one localStorage across every file:// page, and each
  // reseal draws a fresh salt, so two Workspaces never share an entry and a
  // resealed file never matches a key remembered for its old sealing.
  // Entry: {"v":1, "key":"<b64url 32-byte AES key>", "expiresAt":<ms>}, 7
  // days from when the password was entered, never extended.
  var KEY_PREFIX = 'ekd:sources-key:';
  var KEY_TTL_MS = 7 * 24 * 60 * 60 * 1000;

  function parseKeyRecord(text, now) {
    try {
      var rec = JSON.parse(text);
      if (!rec || rec.v !== 1 || typeof rec.key !== 'string' || !Number.isFinite(rec.expiresAt)) return null;
      if (now >= rec.expiresAt) return null;
      var key = base64UrlToBytes(rec.key);
      return key.length === 32 ? { key: key, expiresAt: rec.expiresAt } : null;
    } catch (e) {
      return null;
    }
  }

  var KeyCache = {
    get: function (salt, now) {
      try {
        var text = localStorage.getItem(KEY_PREFIX + salt);
        if (text === null) return null;
        var rec = parseKeyRecord(text, now);
        if (!rec) localStorage.removeItem(KEY_PREFIX + salt);
        return rec;
      } catch (e) {
        return null;
      }
    },
    // The expiry, or null when storage refuses the write (the page still unlocks).
    put: function (salt, rawKey, now) {
      var expiresAt = now + KEY_TTL_MS;
      try {
        localStorage.setItem(KEY_PREFIX + salt, JSON.stringify({ v: 1, key: bytesToBase64Url(rawKey), expiresAt: expiresAt }));
        return expiresAt;
      } catch (e) {
        return null;
      }
    },
    forget: function (salt) {
      try { localStorage.removeItem(KEY_PREFIX + salt); } catch (e) {}
    },
    // Removes expired or malformed entries, including those of sealings no
    // page will ask for again because their file was resealed.
    sweep: function (now) {
      try {
        var stale = [];
        for (var i = 0; i < localStorage.length; i++) {
          var name = localStorage.key(i);
          if (name && name.indexOf(KEY_PREFIX) === 0 && !parseKeyRecord(localStorage.getItem(name), now)) stale.push(name);
        }
        stale.forEach(function (name) { localStorage.removeItem(name); });
      } catch (e) {}
    },
  };

  // Pure. A (state, event) pair not listed leaves the state unchanged, which
  // is also what drops a late async result that no longer applies.
  function transition(s, e) {
    switch (s.status + ' ' + e.type) {
      case 'idle open':
        return BUNDLE.sources ? { status: 'loading' } : { status: 'unavailable', reason: 'no-sources' };
      case 'loading loaded-clear':
        return { status: 'ready', bySlice: e.bySlice, lock: null };
      case 'loading loaded-envelope':
        return e.cached
          ? { status: 'unlocking', envelope: e.envelope, via: 'cache' }
          : { status: 'locked', envelope: e.envelope, notice: null };
      case 'loading load-failed':
        return { status: 'unavailable', reason: e.reason };
      case 'locked submit':
        return { status: 'unlocking', envelope: s.envelope, via: 'password' };
      case 'unlocking decrypted':
        return { status: 'ready', bySlice: e.bySlice, lock: { envelope: s.envelope, expiresAt: e.expiresAt } };
      case 'unlocking decrypt-failed':
        return { status: 'locked', envelope: s.envelope, notice: s.via === 'cache' ? 'forgotten-key' : 'wrong-password' };
      case 'ready lock':
        return s.lock ? { status: 'locked', envelope: s.lock.envelope, notice: null } : s;
      default:
        return s;
    }
  }

  function dispatch(e) {
    var next = transition(SOURCES, e);
    if (next === SOURCES) return;
    SOURCES = next;
    startEffect(next, e);
    var body = document.getElementById('sources-body');
    if (body) paintSources(body);
  }

  function startEffect(s, e) {
    if (s.status === 'loading') {
      var kind = BUNDLE.sources.kind;
      var globalName = SOURCE_GLOBAL[kind];
      window[globalName] = undefined;
      loadScript(sourcesScriptUrl(BUNDLE.sources.file)).then(function () {
        var loaded = window[globalName];
        window[globalName] = undefined;
        if (kind === 'clear') {
          if (loaded && typeof loaded === 'object') dispatch({ type: 'loaded-clear', bySlice: loaded });
          else dispatch({ type: 'load-failed', reason: 'load-failed' });
          return;
        }
        var envelope = parseEnvelope(loaded);
        if (!envelope) { dispatch({ type: 'load-failed', reason: 'bad-envelope' }); return; }
        dispatch({ type: 'loaded-envelope', envelope: envelope, cached: KeyCache.get(envelope.salt, Date.now()) });
      }, function () {
        dispatch({ type: 'load-failed', reason: 'load-failed' });
      });
      return;
    }
    if (s.status === 'unlocking') {
      var envelope = s.envelope;
      var fromCache = s.via === 'cache';
      var keyReady = fromCache ? Promise.resolve(e.cached.key) : deriveKey(envelope, e.password);
      keyReady.then(function (rawKey) {
        return decryptSources(envelope, rawKey).then(function (bySlice) { return { rawKey: rawKey, bySlice: bySlice }; });
      }).then(function (opened) {
        var expiresAt = fromCache ? e.cached.expiresAt : KeyCache.put(envelope.salt, opened.rawKey, Date.now());
        dispatch({ type: 'decrypted', bySlice: opened.bySlice, expiresAt: expiresAt });
      }, function () {
        if (fromCache) KeyCache.forget(envelope.salt);
        dispatch({ type: 'decrypt-failed' });
      });
    }
  }

  var UNAVAILABLE_TEXT = {
    'no-sources': 'No source data is bundled with this Workspace.',
    'load-failed': 'The sources file could not be loaded.',
    'bad-envelope': 'The encrypted sources file is not in a format this page can read.',
  };
  var LOCKED_NOTICE_TEXT = {
    'wrong-password': 'Incorrect password',
    'forgotten-key': 'The key remembered on this browser no longer opens this file. Enter the current password.',
  };

  function renderSources() {
    var html = safe`
      <section class="sources">
        <h2>Explore Sources</h2>
        ${raw(issuesHtml())}
        <div id="sources-body"></div>
      </section>`;
    var fragment = fromHTML(html);
    if (SOURCES.status === 'idle') dispatch({ type: 'open' });
    paintSources(fragment.querySelector('#sources-body'));
    return fragment;
  }

  function passwordFormHtml(notice, busy) {
    var noticeBlock = notice ? safe`<p><span class="badge severity-high">${LOCKED_NOTICE_TEXT[notice]}</span></p>` : '';
    return safe`
      ${raw(noticeBlock)}
      <p class="muted">These source questions are encrypted. Enter this Workspace's password to unlock them.</p>
      <label class="field-label" for="sources-password">Password</label>
      <input type="password" id="sources-password" autocomplete="off" spellcheck="false"${raw(busy ? ' disabled' : '')}>
      <p><button type="button" id="sources-unlock"${raw(busy ? ' disabled' : '')}>${busy ? 'Unlocking…' : 'Unlock sources'}</button></p>`;
  }

  function paintSources(body) {
    var s = SOURCES;
    if (s.status === 'idle' || s.status === 'loading') {
      body.innerHTML = '<p class="muted">Loading sources&hellip;</p>';
    } else if (s.status === 'unavailable') {
      body.innerHTML = safe`<p class="empty">${UNAVAILABLE_TEXT[s.reason]}</p>`;
    } else if (s.status === 'unlocking') {
      body.innerHTML = s.via === 'cache' ? '<p class="muted">Unlocking sources&hellip;</p>' : passwordFormHtml(null, true);
    } else if (s.status === 'locked') {
      body.innerHTML = passwordFormHtml(s.notice, false);
      var input = body.querySelector('#sources-password');
      var submit = function () {
        if (input.value) dispatch({ type: 'submit', password: input.value });
      };
      body.querySelector('#sources-unlock').addEventListener('click', submit);
      input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });
      if (s.notice === 'wrong-password') input.focus();
    } else if (s.status === 'ready') {
      renderSourcesTable(body);
      if (s.lock) {
        body.insertAdjacentHTML('afterbegin', lockBarHtml(s.lock));
        body.querySelector('#sources-lock').addEventListener('click', function () {
          KeyCache.forget(s.lock.envelope.salt);
          dispatch({ type: 'lock' });
        });
      }
    }
  }

  function lockBarHtml(lock) {
    var remembered = lock.expiresAt === null
      ? 'Not remembered (storage unavailable)'
      : 'Remembered on this browser until '
        + new Date(lock.expiresAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    return safe`<p class="sources-lock"><span class="muted" id="sources-remembered">${remembered}</span><button type="button" class="secondary" id="sources-lock">Lock</button></p>`;
  }

  function renderSourcesTable(body) {
    var questions = SOURCES.bySlice[CURRENT.contentSet.id] || [];
    body.innerHTML = safe`
      <div class="search-field">
        <label class="field-label" for="sources-search">Search questions</label>
        <input type="search" id="sources-search" placeholder="Stem, choices, or explanation">
        <p class="muted" id="sources-count" aria-live="polite"></p>
      </div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Source questions">
        <table class="sources-table">
          <thead><tr><th scope="col">ID</th><th scope="col">Status</th><th scope="col">Stem</th><th scope="col">Correct</th><th scope="col">Mark</th></tr></thead>
          <tbody id="sources-tbody"></tbody>
        </table>
      </div>`;
    var input = body.querySelector('#sources-search');
    input.value = sourcesSearchTerm;

    function renderRows() {
      var filtered = questions.filter(function (q) { return questionMatches(q, sourcesSearchTerm); });
      body.querySelector('#sources-count').textContent = filtered.length + ' / ' + questions.length + ' questions';
      var tbody = body.querySelector('#sources-tbody');
      tbody.innerHTML = filtered.length
        ? filtered.map(sourceRowHtml).join('')
        : safe`<tr><td colspan="5" class="empty-cell">No questions match "${sourcesSearchTerm}".</td></tr>`;
      tbody.querySelectorAll('.source-row').forEach(function (row) {
        row.addEventListener('click', function (event) {
          if (event.target.closest('.mark-control')) return;
          var id = row.getAttribute('data-id');
          expandedSourceId = expandedSourceId === id ? null : id;
          renderRows();
          var toggle = tbody.querySelector('.source-row[data-id="' + CSS.escape(id) + '"] .row-toggle');
          if (toggle) toggle.focus({ preventScroll: true });
        });
      });
    }

    input.addEventListener('input', function () {
      sourcesSearchTerm = input.value;
      renderRows();
    });
    renderRows();
  }

  // ---------- slice selection ----------
  var DEFAULT_SLICE_ID = null;

  function populateSliceSelect(manifest) {
    DEFAULT_SLICE_ID = manifest.length ? manifest[0].id : null;
    var select = document.getElementById('slice-select');
    select.innerHTML = manifest.map(function (s) {
      return safe`<option value="${s.id}">${s.facet.key}: ${s.facet.value} (${s.questionCount} q)</option>`;
    }).join('');
    document.getElementById('slice-controls').classList.toggle('hidden', manifest.length <= 1);
    select.addEventListener('change', function () {
      location.hash = '#' + encodeURIComponent(select.value) + '/' + parseHash().mode;
    });
  }

  function activateSlice(sliceId) {
    return loadSlice(sliceId).then(function (slice) {
      CURRENT = slice;
      STORAGE_KEY = 'ekd:' + slice.contentSet.id + ':' + slice.contentSet.schemaVersion;
      STATE = loadState();
      practiceIndex = 0;
      sourcesSearchTerm = '';
      expandedSourceId = null;
      var cs = CURRENT.contentSet;
      document.getElementById('app-title').innerHTML = safe`<span class="title-exam">${cs.exam}</span><span class="title-sep" aria-hidden="true">/</span><span class="title-facet"><span class="visually-hidden">${cs.facet.key}: </span>${cs.facet.value}</span>`;
      document.title = cs.facet.value + ' · ' + cs.exam;
      var select = document.getElementById('slice-select');
      if (select.value !== slice.contentSet.id) select.value = slice.contentSet.id;
      renderStorageWarning();
    });
  }

  // ---------- routing: "#<sliceId>/<mode>", falling back to the active (or
  // first) slice when the hash omits one -- e.g. on first load. ----------
  var ROUTES = { learn: renderLearn, compare: renderCompare, practice: renderPractice, diagnose: renderDiagnose, sources: renderSources };
  var DEFAULT_MODE = 'learn';

  function sliceHref(mode) {
    return '#' + encodeURIComponent(CURRENT.contentSet.id) + '/' + mode;
  }

  function parseHash() {
    var rawHash = (location.hash || '').slice(1);
    var slashIndex = rawHash.indexOf('/');
    var fallbackSliceId = CURRENT ? CURRENT.contentSet.id : DEFAULT_SLICE_ID;
    if (slashIndex === -1) {
      return { sliceId: fallbackSliceId, mode: ROUTES.hasOwnProperty(rawHash) ? rawHash : DEFAULT_MODE };
    }
    var sliceId = decodeURIComponent(rawHash.slice(0, slashIndex)) || fallbackSliceId;
    var mode = rawHash.slice(slashIndex + 1);
    return { sliceId: sliceId, mode: ROUTES.hasOwnProperty(mode) ? mode : DEFAULT_MODE };
  }

  function navigate() {
    var target = parseHash();
    var proceed = (!CURRENT || CURRENT.contentSet.id !== target.sliceId)
      ? activateSlice(target.sliceId)
      : Promise.resolve();
    return proceed.then(function () {
      document.querySelectorAll('#nav a').forEach(function (a) {
        var mode = a.getAttribute('data-route');
        a.setAttribute('href', sliceHref(mode));
        a.classList.toggle('active', mode === target.mode);
        if (mode === target.mode) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(ROUTES[target.mode]());
    });
  }

  // ---------- init ----------
  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('export-revision-btn').addEventListener('click', exportRevisionNotes);
  document.getElementById('import-input').addEventListener('change', importProgress);
  document.getElementById('app').addEventListener('click', handleMarkClick);
  window.addEventListener('hashchange', navigate);
  KeyCache.sweep(Date.now());
  getManifest().then(function (manifest) {
    populateSliceSelect(manifest);
    return navigate();
  });
})();
</script>
</body>
</html>
