<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-databases-analytics", "exam": "aws-sysops", "facet": {"key": "service", "value": "Databases & analytics", "grouped": true, "group_index": 1, "group_count": 1, "grouped_values": ["ElastiCache", "DynamoDB", "Aurora", "EMR", "Kinesis", "Redshift", "Athena", "OpenSearch/ES"], "group": "databases"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b44c3d4ac551", "source_question_ids": ["awssysops-p1-q009"], "statement": "RDS provides built-in, user-configurable automated backups with a rotation/retention window out of the box, without needing an additional backup service.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6e6ff94b5027", "source_question_ids": ["awssysops-p1-q009"], "statement": "Amazon Redshift provides built-in, user-configurable automated backups with a rotation/retention window out of the box.", "status": "supported"}, {"claim_type": "default", "conditions": ["retention period not explicitly customized by the user"], "confidence": "high", "id": "cl-5cbeca3d481a", "source_question_ids": ["awssysops-p1-q009"], "statement": "RDS's default automated backup retention period is 7 days for a DB instance created in the console and 1 day for one created through the API or CLI; it can be set from 0 (disabled) to 35 days.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-0e012abb8be6", "source_question_ids": ["awssysops-p1-q009"], "statement": "S3 has no built-in automated backup-rotation setting of its own, but since 2022 AWS Backup can schedule, continuously back up, and retain backups of S3 buckets, so building your own versioning- or replication-based backup is no longer required.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["prior to mid-2018 / before Data Lifecycle Manager existed"], "confidence": "medium", "id": "cl-f5149488c779", "source_question_ids": ["awssysops-p1-q009"], "statement": "EBS snapshot rotation only became automatable via AWS Data Lifecycle Manager starting mid-2018, so before DLM existed EBS did not offer an out-of-the-box automated backup rotation option.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-aa9aa216e4a2", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon CloudFront caches content (static assets, images, software patches, articles) at globally distributed edge locations, so repeat requests are served from the cache instead of hitting the origin, reducing origin load and lowering latency for end users during traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-80be965cb35f", "source_question_ids": ["awssysops-p1-q014"], "statement": "Adding Amazon RDS read replicas offloads read-only query traffic from the primary database instance, helping the database tier handle read-heavy traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-e3d33f110338", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon ElastiCache caches the most frequently accessed data in front of a relational database, reducing the number of queries that reach the database and thus its load.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c27b6dee478e", "source_question_ids": ["awssysops-p1-q014"], "statement": "SQS-based request queuing is designed for asynchronous write/processing workloads, not for synchronous, read-heavy page-view traffic such as serving article content.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-0996a48d74fb", "source_question_ids": ["awssysops-p1-q014"], "statement": "Using Route 53 health checks to fail over to a static S3 error page addresses availability optics but does not solve the underlying capacity/scaling pressure on the infrastructure.", "status": "supported"}, {"claim_type": "rule", "conditions": ["resources are deployed across multiple AWS regions", "cross-account/cross-region CloudWatch dashboards are not being used"], "confidence": "medium", "id": "cl-2045f2601c1e", "source_question_ids": ["awssysops-p1-q017"], "statement": "Before cross-region CloudWatch dashboards (2019), combining a metric across regions into one graph required pulling it per region via the CLI/API, aggregating it, and publishing it back as a custom metric; today one dashboard graph can show metrics from multiple regions directly.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c6fc73e9fbc3", "source_question_ids": ["awssysops-p1-q017"], "statement": "Resource tags are not CloudWatch metric dimensions, and a CloudWatch agent or SNMP trap cannot be attached to a managed service such as a DynamoDB table, so neither approach produces cross-region graphs covering both EC2 and DynamoDB.", "status": "supported"}, {"claim_type": "fact", "conditions": ["using a CloudWatch feature set from 2019 or later"], "confidence": "medium", "id": "cl-22e91be279af", "source_question_ids": ["awssysops-p1-q017"], "statement": "AWS cross-account/cross-region CloudWatch dashboards, launched in 2019, can natively combine the same metric from multiple regions into one view, offering a newer alternative to manual aggregation.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9075d6ea71d3", "source_question_ids": ["awssysops-p1-q023"], "statement": "Amazon Elastic MapReduce (EMR) provisions EC2 instances that remain fully accessible to the customer, including SSH/root access to the underlying instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cf03412056a5", "source_question_ids": ["awssysops-p1-q023"], "statement": "AWS Elastic Beanstalk provisions EC2 instances that remain fully accessible to the customer, including SSH/administrator access to the underlying instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0617477fec9c", "source_question_ids": ["awssysops-p1-q023"], "statement": "Elastic Load Balancing, Amazon ElastiCache, and standard Amazon RDS do not expose an underlying instance the customer can log into; Amazon RDS Custom is the exception, giving OS-level access to the database host.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["web tier is stateless and CPU/memory-bound", "data tier is already well-provisioned and consistently fast"], "confidence": "high", "id": "cl-1e0ca1f2007d", "source_question_ids": ["awssysops-p1-q024"], "statement": "When a stateless, CPU/memory-bound web tier is the bottleneck and the data tier is already well-provisioned and fast, the fix is to horizontally scale the web tier (add instances behind an ELB) rather than changing the data tier.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b410fab982c", "source_question_ids": ["awssysops-p1-q024"], "statement": "DynamoDB is a managed, multi-AZ service, so there is no single Availability Zone to co-locate an EC2 instance with for latency benefits.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-73c60b053b9e", "source_question_ids": ["awssysops-p1-q024"], "statement": "Caching database responses or migrating the database engine does not address a compute-bound application bottleneck when the data tier is already fast.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Memcached engine", "Evictions metric high", "GetMisses metric high"], "confidence": "high", "id": "cl-8fcc3ad7e019", "source_question_ids": ["awssysops-p1-q033"], "statement": "When an Amazon ElastiCache for Memcached cluster shows both high Evictions and high GetMisses at the same time, the cache lacks sufficient total memory capacity to hold its working data set.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Memcached engine"], "confidence": "high", "id": "cl-0160c79a10bf", "source_question_ids": ["awssysops-p1-q033"], "statement": "To resolve high Evictions and GetMisses caused by insufficient Memcached cache capacity, either add more nodes to the cluster (scale out) or use larger nodes with more memory (scale up).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-69afc654f258", "source_question_ids": ["awssysops-p1-q033"], "statement": "Shrinking the number of nodes in an ElastiCache Memcached cluster worsens high Evictions and GetMisses rather than fixing them.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e05e69348e62", "source_question_ids": ["awssysops-p1-q033"], "statement": "Tweaking the max_item_size parameter on an ElastiCache Memcached cluster only changes the maximum size of a single cached item and does not relieve the overall cache capacity pressure that causes evictions.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-bf8c5a59c953", "source_question_ids": ["awssysops-p1-q232"], "statement": "Best practice for a mobile application that calls AWS services directly is to avoid embedding any long-lived IAM user or root account credentials in the app, and instead use an IAM role with web identity federation, authenticating end users through an external identity provider (e.g., Google, Amazon, Facebook) to obtain short-lived temporary security credentials.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-84fd71d859c1", "source_question_ids": ["awssysops-p1-q232"], "statement": "Embedding an AWS root account's access key and secret access key directly inside a mobile application is a security anti-pattern.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-4255e3ab33bd", "source_question_ids": ["awssysops-p1-q254"], "statement": "For an application running on an EC2 instance that needs to call another AWS service (e.g. DynamoDB), AWS best practice is to attach an IAM role with the needed permissions to the EC2 instance rather than embedding IAM user credentials in the application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f75bacb9b7a3", "source_question_ids": ["awssysops-p1-q254"], "statement": "An EC2 instance with an attached IAM role automatically receives temporary security credentials for that role, removing the need to embed static credentials in application code.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-37bdb307fb47", "source_question_ids": ["awssysops-p1-q254"], "statement": "Creating an IAM user and distributing its credentials within an application for AWS service access is a less secure practice than attaching an instance IAM role.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-827554316d65", "source_question_ids": ["awssysops-p1-q254"], "statement": "Attaching an IAM role that grants only EC2 access to an instance does not provide the DynamoDB permissions an application needs to call the DynamoDB API; a role's permissions must match the service actually being called.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-090b846933dc", "source_question_ids": ["awssysops-p1-q276"], "statement": "Amazon DynamoDB has no concept of a separate per-user 'database'; it only has tables.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f263c32d9b98", "source_question_ids": ["awssysops-p1-q276"], "statement": "A single IAM group-level policy can grant each member user access to a differently-named DynamoDB table by naming each table after the corresponding IAM username and using the ${aws:username} policy variable in the Resource ARN (e.g., arn:aws:dynamodb:*:*:table/${aws:username}), scoping the one shared policy per-user automatically at request time.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-798336de128b", "source_question_ids": ["awssysops-p2-q305"], "statement": "AWS Elastic Beanstalk provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-49a2a4f2a510", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon EMR provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-94116f9493c5", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon ElastiCache, standard Amazon RDS, and Elastic Load Balancing give customers no OS-level access to the underlying instances; Amazon RDS Custom is the exception, allowing OS and privileged access to the host.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-68490be234e9", "source_question_ids": ["awssysops-p2-q305"], "statement": "A claim that RDS lets customers 'retain administrative privileges' on its underlying EC2 instances is technically unsupported, since RDS is fully managed and customers get only a database endpoint rather than OS-level or root access to the host; this claim appeared in a dissenting minority vote.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b6f76a42065", "source_question_ids": ["awssysops-p2-q314"], "statement": "Directing analytics/reporting queries to an RDS Read Replica isolates that workload from the primary instance so heavy analytical queries no longer contend with transactional queries hitting the primary.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-776a40463715", "source_question_ids": ["awssysops-p2-q314"], "statement": "Enabling Multi-AZ on an RDS DB instance does not separate workloads, because a Multi-AZ DB instance's standby is not readable and only provides failover; Read Replicas (or the readable standbys of a Multi-AZ DB cluster) offload read traffic.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5b89b007dc29", "source_question_ids": ["awssysops-p2-q314"], "statement": "Using ElastiCache is suited for caching frequently-read data, not for large ad-hoc analytics jobs that need to scan and aggregate across the full dataset.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1d6e1158823f", "source_question_ids": ["awssysops-p2-q314"], "statement": "Running an RDS instance at the largest possible size only delays a workload-contention problem rather than solving it structurally, and does not scale as data volume and job durations grow.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d1342b0d0603", "source_question_ids": ["awssysops-p2-q365"], "statement": "Amazon Kinesis is a fully managed service for real-time processing of streaming data at massive scale, able to collect and process hundreds of terabytes per hour from hundreds of thousands of sources.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5fb4ce33b883", " nt access to Amazon DynamoDB resources and API actions by writing an IAM policy listing the permissions and attaching it to a user or role.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-fce8686e6bff", "source_question_ids": ["awssysops-p2-q493"], "statement": "Best practice for an EC2-hosted application calling AWS APIs (e.g., DynamoDB) is to attach an IAM role to the EC2 instance rather than embedding IAM user credentials in the application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8d2d25adfa8d", "source_question_ids": ["awssysops-p2-q493"], "statement": "An IAM role attached to an EC2 instance supplies temporary security credentials automatically, avoiding the credential storage and rotation risk of long-lived IAM user credentials.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9872f15e0a08", "source_question_ids": ["awssysops-p2-q516"], "statement": "AWS does not encrypt every packet in the AWS network with IPsec by default, even though AWS supports IPsec VPN connections.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8591c9fa9ed4", "source_question_ids": ["awssysops-p2-q516"], "statement": "Amazon S3 provides authentication mechanisms to secure stored data against unauthorized access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-954c0b5b852d", "source_question_ids": ["awssysops-p2-q516"], "statement": "Customers may encrypt their input data client-side before uploading it to Amazon S3.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3f9152ea4f7b", "source_question_ids": ["awssysops-p2-q516"], "statement": "Amazon EMR customers can choose to send data to Amazon S3 using HTTPS for secure transmission.", "status": "supported"}, {"claim_type": "fact", "conditions": ["read-heavy workload"], "confidence": "high", "id": "cl-14abe5b82c2f", "source_question_ids": ["awssysops-p2-q529"], "statement": "Creating a read replica of an RDS instance horizontally scales read capacity by offloading read traffic from the primary instance.", "status": "supported"}, {"claim_type": "fact", "conditions": ["read-heavy workload"], "confidence": "high", "id": "cl-79ce82099389", "source_question_ids": ["awssysops-p2-q529"], "statement": "Using Amazon ElastiCache to cache read queries removes repeat read load from an RDS instance for cacheable queries.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-c8dc36002174", "source_question_ids": ["awssysops-p2-q529"], "statement": "In an RDS Multi-AZ DB instance deployment, the synchronously replicated standby is used only for failover and does not serve read traffic; Multi-AZ DB cluster deployments (MySQL and PostgreSQL) instead provide two readable standbys.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-68fa0b18ec39", "source_question_ids": ["awssysops-p2-q529"], "statement": "Scaling an RDS instance up to a larger instance size does not scale read throughput beyond a single instance's ceiling, unlike adding read replicas or a cache.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-55e0b82eda70", "source_question_ids": ["awssysops-p2-q549"], "statement": "AWS CloudTrail logs every API call made against an account, including which IAM identity invoked AllocateAddress to create an Elastic IP address, so an administrator can query those logs (e.g., via Amazon Athena) to retroactively attribute EIP-creation events to their creator.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5ec2be5f8422", "source_question_ids": ["awssysops-p2-q549"], "statement": "The question's m cluster mode disabled, an ElastiCache for Redis cluster has exactly one shard, so 'disable cluster mode and increase shards' is not possible, and adding shards (cluster mode enabled) addresses partitioning and scale rather than availability or automatic failover.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-83daec9b9b4e", "source_question_ids": ["awssysops-p3-1-q874"], "statement": "Switching an ElastiCache deployment from Redis to Memcached removes replication and automatic failover entirely, since Memcached has no equivalent high-availability mechanism.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-databases-analytics--m-1", "title": "Fix the saturated resource in the tier that is actually saturated", "purpose": "Most managed-database and analytics questions in SysOps describe a symptom (high CPU, evictions, slow reads, stale data) and offer fixes aimed at different tiers or resources. To answer reliably, find which tier is the bottleneck and which resource in it is exhausted, then pick the managed service's own scaling lever for that exact resource.", "mechanism": "A request passes through layers: edge cache (CloudFront), web/app tier (EC2 behind an ELB), cache tier (ElastiCache), and data tier (RDS/Aurora primary plus replicas). Each layer has its own capacity and its own scaling control. Read-heavy load on a relational primary is offloaded in one of two ways. Read Replicas or Aurora Replicas, reached through the Reader Endpoint, run queries against a full copy of the data. ElastiCache instead serves repeated hot reads from memory so they never reach the database. Multi-AZ on a DB instance adds a standby that serves no reads and exists only for failover, so it adds availability, not capacity. Scaling the primary up only raises the ceiling of a single instance. Inside ElastiCache, the resources are separate. Memory pressure shows as high Evictions together with GetMisses and is fixed by adding nodes or using larger nodes. TTL, max_item_size, CPU, and the app tier do not fix it. On Redis with cluster mode enabled, you scale out by adding shards through online resharding. Managed services like ElastiCache, RDS, and ELB scale through their own APIs and maintenance windows, not through Auto Scaling groups, load balancers, or OS access. If the web tier is CPU-bound and the data tier is already fast, you scale the web tier and leave the database alone.", "predict_prompt": "An RDS MySQL instance runs at high CPU because a nightly reporting job scans and aggregates the entire orders table while customers place orders. Before reading the options, predict which change separates the two workloads, and why Multi-AZ and ElastiCache would both fail here.", "invariants": ["A Multi-AZ DB instance standby never serves reads. It adds failover, not read capacity.", "Read Replicas and Aurora Replicas only help once reads are actually sent to them, through the replica or Reader Endpoint.", "ElastiCache Evictions plus GetMisses mean the cache is short on memory. Only more nodes or larger nodes fix that.", "Memcached has no read replicas and no replication or failover. Redis is the ElastiCache engine with replicas and Multi-AZ automatic failover.", "ElastiCache, RDS, and ELB scale and patch through their own service controls, not through EC2 Auto Scaling groups or OS logins."], "limits": ["Multi-AZ DB cluster deployments (MySQL/PostgreSQL) do have two readable standbys. The 'Multi-AZ adds no reads' rule applies to the Multi-AZ DB instance deployment.", "Aurora replicas can lag. Reads routed to a lagging replica return stale data, though the application keeps working.", "Memcached on engine 1.5+ with Auto Discovery can now change node type in place with ModifyCacheCluster. Older exam answers expect a new cluster created with CreateCacheCluster.", "If the bottleneck is a stateless, CPU-bound web tier and the data tier is already fast, no database-side fix applies."], "cues": ["'read-heavy', 'reporting/analytics queries contend with transactions' -> Read Replica / Aurora Replica + Reader Endpoint", "'most frequently accessed data', 'repeat reads', 'reduce queries reaching the DB' -> ElastiCache", "'high Evictions' and 'GetMisses' -> add nodes or use larger nodes", "'Redis cluster mode enabled', 'anticipated spike' -> add shards (online resharding)", "'Multi-AZ' offered as a read-scaling fix -> distractor", "'web tier CPU-bound, DB already fast' -> add EC2 instances behind the ELB"], "claim_ids": ["cl-80be965cb35f", "cl-e3d33f110338", "cl-1b6f76a42065", "cl-776a40463715", "cl-14abe5b82c2f", "cl-79ce82099389", "cl-c8dc36002174", "cl-68fa0b18ec39", "cl-ba4ce90dde61", "cl-959747383e6e", "cl-e71b095cb55f", "cl-1e0ca1f2007d", "cl-73c60b053b9e", "cl-8fcc3ad7e019", "cl-0160c79a10bf", "cl-76b77cda167a", "cl-5ad9fc470ba8", "cl-d348363ae34f", "cl-da683bb93059", "cl-d77162208eb0", "cl-83daec9b9b4e", "cl-5f708cbdd163", "cl-c85093722dcf", "cl-1ffd92068bca", "cl-542bdc3333ca"]}, "contrastSet": {"id": "aws-sysops-service-databases-analytics--cs-1", "subjects": ["RDS/Aurora Read Replica", "ElastiCache", "RDS Multi-AZ DB instance", "Scale up the primary"], "dimensions": ["Serves read traffic", "Kind of read it absorbs", "Primary purpose", "Scales past one instance's ceiling"], "shared_traits": ["All four are offered as fixes for a database under read or CPU pressure.", "All are managed AWS options, so none needs OS-level access."], "matrix": {"Serves read traffic": {"RDS/Aurora Read Replica": "Yes, through the replica or Reader Endpoint", "ElastiCache": "Yes, cached keys served from memory", "RDS Multi-AZ DB instance": "No, the standby is not readable", "Scale up the primary": "Yes, but only on the same single instance"}, "Kind of read it absorbs": {"RDS/Aurora Read Replica": "Any SQL query, including full-table analytics/reporting scans", "ElastiCache": "Repeated hot reads of frequently accessed data", "RDS Multi-AZ DB instance": "None", "Scale up the primary": "All, until the bigger box saturates too"}, "Primary purpose": {"RDS/Aurora Read Replica": "Horizontal read scaling and workload isolation", "ElastiCache": "Cut repeat queries that reach the database", "RDS Multi-AZ DB instance": "High availability / failover", "Scale up the primary": "Raise a single instance's capacity"}, "Scales past one instance's ceiling": {"RDS/Aurora Read Replica": "Yes, add more replicas", "ElastiCache": "Yes, add nodes or shards", "RDS Multi-AZ DB instance": "No", "Scale up the primary": "No, it only delays contention"}}, "decision_rule": "The deciding dimension is the kind of read that is overloading the database. If the same hot data is read over and over and can be cached, choose ElastiCache. If the reads are queries that must run against the full, current dataset (reporting, analytics, ad-hoc scans), choose a Read Replica or Aurora Replica through the Reader Endpoint. Multi-AZ never wins because it serves no reads, and scaling up never wins because it stays one instance.", "boundary_flip": "A news site's database is overloaded by readers repeatedly fetching the same popular articles, so ElastiCache in front of RDS is correct. Change the load to a reporting team running large ad-hoc aggregation jobs that scan the whole dataset and contend with transactions. Those results cannot usefully be cached, and the answer flips to sending the reports to an RDS Read Replica.", "strongest_distractor_failure": "Multi-AZ is the most tempting wrong answer because it adds a second, synchronously replicated database copy. On a Multi-AZ DB instance that standby is not readable and only takes over on failover, so it neither isolates analytics from transactions nor adds read throughput.", "exceptions": ["Multi-AZ DB cluster deployments (MySQL/PostgreSQL) provide two readable standbys, so in that deployment type the standbys do offload reads.", "Aurora Auto Scaling adds replicas, but a CPU-saturated primary is only relieved if reads are actually sent to the Reader Endpoint.", "If the slow tier is the stateless, CPU-bound web tier and the database is already fast, none of these apply. Scale the web tier horizontally."], "claim_ids": ["cl-80be965cb35f", "cl-e3d33f110338", "cl-1b6f76a42065", "cl-776a40463715", "cl-5b89b007dc29", "cl-1d6e1158823f", "cl-14abe5b82c2f", "cl-79ce82099389", "cl-c8dc36002174", "cl-68fa0b18ec39", "cl-ba4ce90dde61", "cl-959747383e6e", "cl-e71b095cb55f", "cl-7bfe9c7d3021", "cl-1e0ca1f2007d", "cl-73c60b053b9e"]}, "scenarioFamily": {"id": "aws-sysops-service-databases-analytics--sf-1", "canonical": {"prompt": "An online retailer runs its order-management database on a single Amazon RDS MySQL instance (Multi-AZ not enabled). Every night, the finance team's reporting job joins and aggregates the full orders and order_items tables to build a revenue report -- a 20-minute scan touching millions of rows. While that job runs, customers placing new orders see slow checkout because the reporting queries and the transactional queries are contending for the same instance's CPU and I/O. What should the SysOps team change to stop the reporting job from degrading checkout, without rewriting the application's queries?", "expected_answer": ["Create a read replica of the primary database and route the nightly reporting/analytics queries to the replica, leaving the primary dedicated to the transactional checkout traffic"], "reasoning": "The reporting job performs full-table joins and aggregations over the live dataset, not repeated lookups of a small set of hot keys, so it is the kind of read that must run against a complete, current copy of the data rather than something a cache can absorb. A read replica isolates exactly this: it gives the reporting workload its own copy of the data to query, so its CPU/I/O load no longer contends with the primary that serves checkout.", "distractor_analysis": "ElastiCache would not fit because it is built to cut repeated reads of frequently accessed data from reaching the database, not to serve one-off full-table scans across the whole dataset. Enabling Multi-AZ would not help either, because a Multi-AZ DB instance's standby is not readable and exists only for failover, so it adds no read capacity. Simply scaling the primary up to a bigger instance class only raises one instance's ceiling and would still have the two workloads fighting for the same resources once load grows further.", "claim_ids": ["cl-1b6f76a42065", "cl-14abe5b82c2f", "cl-5b89b007dc29", "cl-1d6e1158823f", "cl-776a40463715"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The nightly full-table reporting scan is replaced by a flash-sale read pattern: thousands of customers repeatedly reload the same 20 best-selling product pages, so every request re-runs the identical product-lookup query against the primary, instead of one job scanning the whole dataset once.", "prompt": "Same retailer, same single RDS MySQL primary (Multi-AZ not enabled). There is no reporting job tonight -- instead, a flash sale has thousands of customers repeatedly reloading the same 20 best-selling product pages, and each page load re-runs the identical product-lookup query against the primary. CPU and read I/O on the primary spike from this repeated traffic. What should the SysOps team add to relieve this specific read pattern?", "expected_answer": ["Deploy Amazon ElastiCache in front of RDS to cache the repeated product-lookup query results, so the same hot reads are served from memory instead of hitting the primary on every request"], "reasoning": "The decisive fact flipped: the load is now the same small set of hot keys read over and over, not a full-table scan that needs a current, complete copy of the data. ElastiCache exists precisely to cut this kind of repeat query from reaching the database by serving the most frequently accessed data from memory, which directly relieves the primary's CPU and I/O without adding a database replica at all.", "distractor_analysis": "A read replica would still technically work, since it can serve any SQL query including repeated lookups, but it is the less direct fix here: it adds a full database copy to absorb traffic that a much cheaper in-memory cache can already satisfy. The signal that should drive the choice is 'the same small set of keys, read repeatedly' -- that specific pattern is what ElastiCache is built for.", "claim_ids": ["cl-e3d33f110338", "cl-79ce82099389", "cl-14abe5b82c2f"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The on-call engineer additionally mentions that the site's product images and static assets are served through Amazon CloudFront, which is already caching them effectively at edge locations and is not experiencing any issues -- a detail about the content-delivery layer, not the database tier.", "prompt": "Same retailer and same nightly full-table reporting job causing checkout slowness on the single RDS MySQL primary (Multi-AZ not enabled) as before. The on-call engineer also notes that the site's product images and static assets are served through Amazon CloudFront, which is already caching them effectively at edge locations and isn't experiencing any issues. What should the SysOps team change to stop the reporting job from degrading checkout performance?", "expected_answer": ["Create a read replica of the primary database and route the nightly reporting/analytics queries to the replica, leaving the primary dedicated to the transactional checkout traffic"], "reasoning": "CloudFront caching static assets at the edge is a separate layer of the request path from the database tier, and it is already working fine, so it has no bearing on the CPU/I/O contention between the reporting job and checkout queries on the RDS primary. The decisive fact is unchanged: the reporting job performs full-table scans that cannot be served from a cache, so a read replica is still the fix.", "distractor_analysis": "Mentioning CloudFront might tempt a learner into thinking the fix is content-delivery-related, but CloudFront caches static assets for end users, not database query results, so it cannot relieve contention between two workloads hitting the same RDS instance.", "claim_ids": ["cl-aa9aa216e4a2", "cl-1b6f76a42065", "cl-5b89b007dc29"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate proposes enabling Multi-AZ on the RDS instance and pointing the reporting job's queries at the new standby, arguing that paying for a second, synchronously replicated copy of the database should let it absorb the extra read load.", "prompt": "Same retailer, same nightly full-table reporting job degrading checkout on the single RDS MySQL primary (Multi-AZ not enabled). A teammate suggests: 'Let's just enable Multi-AZ -- then we'll have a synchronously replicated standby, and we can point the reporting job's queries at that standby instead of the primary.' Is this teammate's proposal a valid fix, and if not, what should the team do instead?", "expected_answer": ["No -- enabling Multi-AZ does not help: an RDS Multi-AZ DB instance's standby is not readable and exists only for failover, so it cannot serve the reporting job's queries. Instead, create a read replica of the primary and route the nightly reporting/analytics queries to it, leaving the primary dedicated to checkout traffic"], "reasoning": "This is the most tempting wrong answer because Multi-AZ really does add a second, synchronously replicated copy of the data -- but on a Multi-AZ DB *instance* deployment that standby is not readable and only takes over on failover, so it offloads none of the read traffic the reporting job generates. The fix that actually isolates the reporting workload from checkout is still a read replica, which is built to serve read queries.", "distractor_analysis": "The proposal conflates 'a second copy of the data exists' with 'that second copy can serve reads' -- for a Multi-AZ DB instance those are not the same thing. (A Multi-AZ DB cluster deployment for MySQL/PostgreSQL does have two readable standbys, but that is a different, more specific configuration than the plain Multi-AZ DB instance described here, so it does not apply.)", "claim_ids": ["cl-776a40463715", "cl-c8dc36002174", "cl-1b6f76a42065"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The database engine changes from RDS MySQL to Amazon Aurora MySQL, so the applicable construct is an Aurora Replica reached through the Aurora Reader Endpoint rather than a standalone RDS read replica, even though the underlying decision -- isolate full-table analytics reads from the transactional primary -- is unchanged.", "prompt": "The same retailer migrates its order-management database from RDS MySQL to Amazon Aurora MySQL. The nightly finance reporting job still performs full-table joins and aggregations across the orders and order_items tables, and this still competes with customer checkout traffic for CPU and I/O on the Aurora primary instance. What should the SysOps team change to stop the reporting job from degrading checkout performance?", "expected_answer": ["Create a read replica of the primary database and route the nightly reporting/analytics queries to the replica, leaving the primary dedicated to the transactional checkout traffic -- on Aurora, this means an Aurora Replica reached through the Aurora Reader Endpoint"], "reasoning": "The decision rule transfers unchanged across engines: Aurora Replicas offload read traffic from the primary instance, and the Aurora Reader Endpoint load-balances new read-only connections across the available replicas. The reporting job's full-table scans still cannot be served from a cache and still need a current, complete copy of the data, so the same logic that pointed to an RDS read replica now points to an Aurora Replica via the Reader Endpoint -- only the specific construct's name changes, not the reasoning.", "distractor_analysis": "Someone might assume Aurora's built-in durability and read-replica-based availability means no extra action is needed, but having replicas available only helps once reporting reads are actually sent to them through the Reader Endpoint -- the primary still contends with checkout traffic until that redirection happens.", "claim_ids": ["cl-ba4ce90dde61", "cl-959747383e6e", "cl-b8998638a207"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "awssysops-p2-q549: the marked correct answer (cost-allocation tag at creation) contradicts the explanation and the unanimous community vote (CloudTrail logs queried via Athena). The claims record the disagreement but do not resolve it. Cost-allocation tags only work going forward, so they cannot attribute EIPs that already exist. The CloudWatch/Inspector distractor claim is also marked conflicted. The learner has no settled answer for this question.", "related_entity_ids": ["cl-55e0b82eda70", "cl-5ec2be5f8422", "cl-5c5c6bba2e4a"]}, {"type": "contradiction", "severity": "high", "description": "awssysops-p2-q594: the marked correct answer makes executing Aurora maintenance and patches the customer's shared-responsibility role. The explanation and the unanimous community vote say AWS executes maintenance and the customer only chooses when it happens. The dispute is unresolved, and the fact claim rests on the side that disagrees with the marked answer.", "related_entity_ids": ["cl-233cb38a34af", "cl-6ed83c1ad963"]}, {"type": "contradiction", "severity": "high", "description": "awssysops-p3-1-q820: the marked correct answer gives AWS Premium Support the job of fixing an overly open Amazon ES domain access policy. The explanation's shared-responsibility reasoning and the unanimous community vote give it to the customer's SysOps Administrator. All three claims are conflicted and the dispute is unresolved.", "related_entity_ids": ["cl-a4b57593ec61", "cl-ea284a49fd45", "cl-f76d50c550d4"]}, {"type": "contradiction", "severity": "high", "description": "awssysops-p3-1-q862: the marked correct answer cites 'multi-threaded processing' as a reason to prefer Redis over Memcached. That contradicts the slice's own fact claim that Memcached is the multi-threaded engine and Redis is single-threaded. The question's second reason (data partitioning vs online resharding) is also an exactly 50/50 community split marked needs-review. The question has no reliable answer key.", "related_entity_ids": ["cl-6009cc20cc1e", "cl-def5beafbd66", "cl-9376a4278ac0"]}, {"type": "stale-risk", "severity": "medium", "description": "Memcached node-type change (awssysops-p3-1-q689, q865): the claims say ModifyCacheCluster can now change node type in place on engine 1.5+ with Auto Discovery. The question's expected answer is CreateCacheCluster with the new node type. All three claims are conflicted, and the mental model's limits repeat the split. The learner must hold two different answers depending on how old the exam item is.", "related_entity_ids": ["cl-542bdc3333ca", "cl-4989a1540489", "cl-566de54c6222", "aws-sysops-service-databases-analytics--m-1"]}, {"type": "stale-risk", "severity": "medium", "description": "Backup-rotation question (awssysops-p1-q009): the S3 claim (conflicted) says AWS Backup has supported S3 since 2022. The EBS claim depends on the pre-2018 period before Data Lifecycle Manager. Both weaken the question's premise that only RDS and Redshift offer out-of-the-box automated backup rotation. The expected answer depends on how old the question is.", "related_entity_ids": ["cl-0e012abb8be6", "cl-f5149488c779", "cl-b44c3d4ac551", "cl-6e6ff94b5027"]}, {"type": "stale-risk", "severity": "medium", "description": "Cross-region CloudWatch graphs (awssysops-p1-q017): the rule claim is conflicted. The question's expected answer (pull per region, aggregate, publish as a custom metric) was replaced in 2019 by native cross-region dashboards, so on current AWS the 'correct' option is no longer the best practice.", "related_entity_ids": ["cl-2045f2601c1e", "cl-22e91be279af"]}, {"type": "stale-risk", "severity": "medium", "description": "Instance-access questions (awssysops-p1-q023, awssysops-p2-q305): the claims that standard RDS, ElastiCache, and ELB expose no OS access are conflicted because RDS Custom now allows OS-level access to the host. Separately, a dissenting minority vote on q305 picked RDS. The exam key (EMR and Elastic Beanstalk only) depends on ignoring RDS Custom.", "related_entity_ids": ["cl-0617477fec9c", "cl-94116f9493c5", "cl-68490be234e9"]}, {"type": "stale-risk", "severity": "low", "description": "Mobile app credentials (awssysops-p1-q232): the rule claim is conflicted. It recommends an IAM role with web identity federation through an external IdP directly, but AWS's current guidance for mobile apps is Amazon Cognito identity pools. The claim may not match the current best practice or the option the exam expects.", "related_entity_ids": ["cl-bf8c5a59c953"]}, {"type": "contradiction", "severity": "medium", "description": "Multi-AZ read capacity: the claims are conflicted on whether a Multi-AZ standby is readable. A Multi-AZ DB instance's standby is not readable, but a Multi-AZ DB cluster's standbys are. Contrast set cs-1 lists the readable DB cluster standbys as an exception, yet its decision_rule says 'Multi-AZ never wins because it serves no reads'. That absolute statement contradicts the contrast set's own exception and should be limited to the Multi-AZ DB instance deployment.", "related_entity_ids": ["aws-sysops-service-databases-analytics--cs-1", "cl-776a40463715", "cl-c8dc36002174", "cl-7bfe9c7d3021"]}, {"type": "contradiction", "severity": "medium", "description": "ElastiCache Memcached high CPU (awssysops-p3-1-q761): both the remediation rule (scale up or scale out) and the EBS-volume distractor are marked conflicted, so the sources disagree about the answer. Neither claim records what the disagreement is, so a learner cannot tell which answer the source supports.", "related_entity_ids": ["cl-023dcad22a31", "cl-0c5275fc615e"]}, {"type": "ambiguity", "severity": "medium", "description": "Eviction remediation (awssysops-p3-1-q788, q839): the rule is conflicted and covers both Memcached and Redis with cluster mode enabled under 'add nodes or larger nodes'. On Redis, adding replica nodes adds no cache memory; only adding shards or scaling up does. The mental model invariant 'Only more nodes or larger nodes fix that' repeats this ambiguity without naming the engine.", "related_entity_ids": ["cl-76b77cda167a", "aws-sysops-service-databases-analytics--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Security groups for EC2 to Aurora (awssysops-p3-1-q851): the claim that security groups are stateful and only need a target inbound rule is conflicted, and so is the distractor about adding an inbound rule on the EC2 security group. The supported rule (inbound 3306 on the Aurora SG from the EC2 SG) does not resolve whichever disagreement caused the conflicted flags.", "related_entity_ids": ["cl-bb387d494158", "cl-3983ee9074b2", "cl-9d43a1145f6d"]}, {"type": "contradiction", "severity": "medium", "description": "Maintenance windows (awssysops-p3-1-q735): a conflicted claim records a dissenting argument that the maintenance window belongs on the EC2 instance rather than the ElastiCache cluster. That contradicts the supported claims that plain EC2 has no configurable maintenance-window property and that EC2 OS patching is scheduled through Systems Manager. The source disagreement is unresolved.", "related_entity_ids": ["cl-92cfac6c1cf1", "cl-0b07bb7e9c22", "cl-8b38aa356b2d", "cl-86318ec3562a"]}, {"type": "contradiction", "severity": "medium", "description": "MySQL migration (awssysops-p3-1-q776): the claim that Aurora MySQL usually needs only a new endpoint and the RDS SQL Server distractor are both conflicted. The claims do not say what the disagreement is, so the answer to the migration question is unsettled.", "related_entity_ids": ["cl-17a7f86d3ab4", "cl-30fa62e4695e"]}, {"type": "ambiguity", "severity": "low", "description": "Aurora Reader Endpoint behavior: one claim says it balances connections, not individual queries, using DNS round-robin. Another says it load-balances reads, so users 'intermittently' see stale data from a lagging replica. With connection-level balancing, a client holding a connection to the lagging replica sees stale data every time until it reconnects, not intermittently. The two claims describe the mechanism inconsistently.", "related_entity_ids": ["cl-959747383e6e", "cl-1ffd92068bca"]}, {"type": "quality", "severity": "low", "description": "Contrast set cs-1 says a Read Replica absorbs 'Any SQL query', but replicas serve read-only queries only. Its decision_rule sends queries that need the 'full, current dataset' to a Read Replica, even though replicas replicate asynchronously and can lag (cl-b60a05eca2aa). The wording overstates how fresh replica data is.", "related_entity_ids": ["aws-sysops-service-databases-analytics--cs-1", "cl-b60a05eca2aa"]}, {"type": "quality", "severity": "low", "description": "The mental model mechanism says managed services 'like ElastiCache, RDS, and ELB scale through their own APIs and maintenance windows'. This suggests ELB has a maintenance window, which contradicts cl-82b7d2cdf98c (an ELB has no maintenance-window setting).", "related_entity_ids": ["aws-sysops-service-databases-analytics--m-1", "cl-82b7d2cdf98c"]}], "sourceQuestionCount": 36}], "sources": {"kind": "locked", "file": "aws-sysops-service-databases-i4w9.sources.enc.js"}}</script>

  const DIAGNOSIS_CATEGORIES = [

  // ---------- safe HTML templating: `safe` escapes every interpolated

  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);

      return acc + str + piece;
