<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-cloudfront", "exam": "aws-sysops", "facet": {"key": "service", "value": "cloudfront"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "fact", "confidence": "high", "id": "cl-aa9aa216e4a2", "source_question_ids": ["awssysops-p1-q014", "awssysops-p2-q524", "awssysops-p3-1-q611", "awssysops-p3-1-q712", "awssysops-p3-1-q826", "awssysops-p3-1-q907"], "statement": "Amazon CloudFront caches content (static assets, images, software patches, articles) at globally distributed edge locations, so repeat requests are served from the cache instead of hitting the origin, reducing origin load and lowering latency for end users during traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-80be965cb35f", "source_question_ids": ["awssysops-p1-q014"], "statement": "Adding Amazon RDS read replicas offloads read-only query traffic from the primary database instance, helping the database tier handle read-heavy traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-e3d33f110338", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon ElastiCache caches the most frequently accessed data in front of a relational database, reducing the number of queries that reach the database and thus its load.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c27b6dee478e", "source_question_ids": ["awssysops-p1-q014"], "statement": "SQS-based request queuing is designed for asynchronous write/processing workloads, not for synchronous, read-heavy page-view traffic such as serving article content.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-0996a48d74fb", "source_question_ids": ["awssysops-p1-q014"], "statement": "Using Route 53 health checks to fail over to a static S3 error page addresses availability optics but does not solve the underlying capacity/scaling pressure on the infrastructure.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-f3d2a62248da", "source_question_ids": ["awssysops-p1-q051"], "statement": "Serving content through CloudFront reduces latency for end users everywhere, including regions far from the origin, because edge locations cache content close to each user regardless of where the origin lives.", "status": "supported"}, {"claim_type": "rule", "conditions": ["only one regional origin/endpoint exists"], "confidence": "high", "id": "cl-c130c98dd118", "source_question_ids": ["awssysops-p1-q051", "awssysops-p3-1-q826", "awssysops-p3-1-q907"], "statement": "Route 53 latency-based routing only changes anything when multiple regional endpoints/origins exist to route between; with a single origin/endpoint in one region, enabling latency-based routing is a no-op.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-0d5a024092b6", "source_question_ids": ["awssysops-p1-q051"], "statement": "Route 53 latency-based routing lets you serve content from multiple regional origins (e.g., US-East-1 and US-West-2) and have DNS route each user to whichever regional endpoint is fastest for them.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-f22591fa9e33", "source_question_ids": ["awssysops-p1-q051"], "statement": "Moving a file to S3 removes load from the web application tier, but does not by itself reduce latency for geographically distant users, because a single S3 bucket is still bound to one region.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-7ff27d8700c0", "source_question_ids": ["awssysops-p1-q051"], "statement": "EBS Provisioned IOPS (PIOPS) improves disk I/O throughput on EC2 instances, which does not help when the bottleneck is network distance/latency rather than disk performance.", "status": "supported"}, {"claim_type": "rule", "conditions": ["subscriptions/credentials are managed by the application, not by IAM"], "confidence": "high", "id": "cl-ab61a65db3c3", "source_question_ids": ["awssysops-p2-q321"], "statement": "When user credentials and subscriptions are managed by the application in a database (e.g. RDS) rather than in IAM, generating per-request, time-limited S3 pre-signed URLs after the application checks the subscription is the correct way to serve private S3 content securely.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-06d2e76d3bc0", "source_question_ids": ["awssysops-p2-q321"], "statement": "Creating an individual IAM user for every application subscriber does not scale and incorrectly conflates application-level subscribers with AWS-account-level IAM principals.", "status": "supported"}, {"claim_type": "fact", "confidence": "medium", "id": "cl-bff5a82c9d10", "source_question_ids": ["awssysops-p2-q321"], "statement": "S3 bucket policies evaluate AWS principals and IAM-style conditions; they cannot key access decisions off arbitrary application-level subscriber credentials stored in an external database like RDS.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-9b70036d4bde", "source_question_ids": ["awssysops-p2-q321"], "statement": "A CloudFront Origin Access Identity (OAI) restricts access from CloudFront to the S3 origin, but by itself does not provide per-user authorization — it must be paired with mechanisms like signed URLs or signed cookies, otherwise content is open to everyone once fronted by CloudFront.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-ebaba23ae26a", "source_question_ids": ["awssysops-p2-q388", "awssysops-p2-q461"], "statement": "Amazon CloudFront is a content delivery network (CDN) service that distributes content to end users with low latency and high transfer speeds via edge locations.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-a24e3a0fd8a3", "source_question_ids": ["awssysops-p2-q490"], "statement": "When access logging is enabled on a CloudFront distribution, the access logs are delivered to an Amazon S3 bucket specified by the distribution owner.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-3d36e4eaf3fc", "source_question_ids": ["awssysops-p2-q508"], "statement": "CloudFront delivers access logs per distribution — each distribution's logs are generated and stored independently in the configured S3 bucket.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-4f12c5eb8955", "source_question_ids": ["awssysops-p2-q524", "awssysops-p3-1-q712"], "statement": "Fronting a website's downloadable software patches with a CloudFront distribution caches those static files at edge locations, absorbing flash-download-spike traffic away from the origin web servers and keeping cost low relative to over-provisioning compute or storage.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-2db5884f6763", "source_question_ids": ["awssysops-p2-q524", "awssysops-p3-1-q712"], "statement": "Increasing NAT instance size improves outbound traffic translation throughput and has no effect on strain caused by external users downloading files (inbound-served content).", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-4730275d7d94", "source_question_ids": ["awssysops-p2-q524", "awssysops-p3-1-q712"], "statement": "Scaling out web servers in advance of a known patch release avoids Auto Scaling lag but means paying for idle capacity outside the release window, making it a costlier option than edge caching.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-fbde0c68a7f2", "source_question_ids": ["awssysops-p2-q524", "awssysops-p3-1-q712"], "statement": "Provisioning additional IOPS (IO1) on the EBS volume holding downloadable content addresses storage I/O performance, not the network/serving bottleneck created by a global download spike.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-f6fb14815106", "source_question_ids": ["awssysops-p2-q552"], "statement": "A network ACL operates at the subnet level and can add a deny rule for a specific IP address or CIDR range, providing precise, surgical blocking of a single malicious IP.", "status": "supported"}, {"claim_type": "exception", "conditions": ["target is a single IP address rather than an entire country"], "confidence": "high", "id": "cl-36e7a96b9ded", "source_question_ids": ["awssysops-p2-q552", "awssysops-p3-1-q736"], "statement": "CloudFront's geo-restriction feature can only allow or block traffic by country, not by an individual IP address; using it to block a single malicious IP would incorrectly block every visitor from that IP's entire country.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-f35b037acf0d", "source_question_ids": ["awssysops-p2-q552"], "statement": "Security groups only apply to the instances they are attached to; they cannot be used to blanket-block traffic at the subnet level the way a NACL can.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-7a2b6e1e3c9f", "source_question_ids": ["awssysops-p2-q552"], "statement": "For blocking malicious traffic from a single IP address, the source's boxed/labeled answer is CloudFront geo-restriction, but community consensus (and the underlying technical reasoning about per-IP vs per-country granularity) unanimously favors a network ACL deny rule instead.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-76efeb2692ab", "source_question_ids": ["awssysops-p2-q569"], "statement": "CloudFront's 4XXErrorRate CloudWatch metric measures the rate of client-error responses (e.g., 404 not found, 403 unauthorized), directly indicating how often users are requesting content that doesn't exist or that they aren't authorized to view.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-054b742dd7a6", "source_question_ids": ["awssysops-p2-q569"], "statement": "The S3 GetRequests CloudWatch metric is a raw count of GET requests with no breakdown by response or error code, so it cannot distinguish successful requests from 404/403 failures.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-7f3304c20584", "source_question_ids": ["awssysops-p2-q569"], "statement": "For diagnosing photos that don't exist or aren't authorized behind a CloudFront distribution, the source's boxed/labeled answer is the S3 GetRequests metric, but unanimous community consensus favors the CloudFront 4XXErrorRate metric instead, since it directly measures the client-error responses in question.", "status": "conflicted"}, {"claim_type": "rule", "confidence": "high", "id": "cl-62146ffb292d", "source_question_ids": ["awssysops-p2-q573"], "statement": "Creating a CloudFront Origin Access Identity (OAI) and granting it read permission in the S3 bucket policy, while removing other public access, ensures users can only access bucket objects through CloudFront URLs.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-7775b7e3d32c", "source_question_ids": ["awssysops-p2-q573"], "statement": "Neither an IAM user nor an IAM role can be 'assigned' to a CloudFront distribution — this is not a real CloudFront construct.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c46f75d81632", "source_question_ids": ["awssysops-p2-q573"], "statement": "Server-Side Encryption with Amazon S3-managed keys (SSE-S3) protects data at rest; it does not control who is allowed to request/access objects.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-cdb68252be75", "source_question_ids": ["awssysops-p3-1-q611"], "statement": "Fronting a high-read-rate S3 bucket with a CloudFront distribution serves repeat reads for the same static objects from the CDN cache rather than the origin bucket, reducing both origin load and latency.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-b01d975aae00", "source_question_ids": ["awssysops-p3-1-q611"], "statement": "Migrating an S3 bucket to a region closer to end users only helps users near that new region and does not reduce overall request volume/load on the bucket.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-77e83b049569", "source_question_ids": ["awssysops-p3-1-q611"], "statement": "S3 cross-region replication duplicates data into another region but does not by itself offload read traffic away from the original bucket unless clients are redirected to the replica.", "status": "supported"}, {"claim_type": "exception", "conditions": ["caching database query results vs. caching object-storage reads"], "confidence": "medium", "id": "cl-f32486a3f82a", "source_question_ids": ["awssysops-p3-1-q611", "awssysops-p3-1-q641"], "statement": "Amazon ElastiCache is designed to cache results in front of a database (like RDS), not to cache object-storage reads from S3.", "status": "supported"}, {"claim_type": "fact", "confidence": "medium", "id": "cl-ab51234cdc01", "source_question_ids": ["awssysops-p3-1-q641"], "statement": "A CloudFront distribution can use an Elastic Load Balancer as a custom origin, caching large dynamically-generated, per-visitor objects at edge locations and directly speeding up their download for geographically distributed visitors.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-ed49249f3eae", "source_question_ids": ["awssysops-p3-1-q641"], "statement": "For slow downloads of large, dynamically-generated, geographically-targeted content, the source's boxed/labeled answer is adding ElastiCache in front of RDS, but community consensus unanimously favors fronting the existing ELB with a CloudFront distribution instead, since ElastiCache only reduces database query load and does nothing to speed the actual transfer of large objects to browsers.", "status": "conflicted"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-86b3a9e7b474", "source_question_ids": ["awssysops-p3-1-q641"], "statement": "Storing content directly in S3 does not fit content that is dynamically generated per visitor (e.g., based on geographic location) and updated daily.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-7bef0284b717", "source_question_ids": ["awssysops-p3-1-q641"], "statement": "Enabling Auto Scaling for EC2 instances addresses compute capacity to handle load, not the per-object download speed experienced by an individual visitor.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-9b4acdfdd747", "source_question_ids": ["awssysops-p3-1-q649"], "statement": "CloudFront's TotalErrorRate CloudWatch metric reports the percentage of all viewer requests that returned any 4xx or 5xx HTTP status code, making it the metric to monitor for elevated error rates spanning both categories.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-769a87f7aece", "source_question_ids": ["awssysops-p3-1-q649"], "statement": "RejectedConnectionCount and HealthyHostCount are Elastic Load Balancing metrics, not CloudFront metrics, and are irrelevant to monitoring CloudFront error rates.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-b4b3dd4adf66", "source_question_ids": ["awssysops-p3-1-q687"], "statement": "Ensuring only the cookies, query strings, and headers actually required by the origin are forwarded in a CloudFront cache behavior eliminates unnecessary cache-key variation, increasing the cache hit ratio.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-dae96b32bc75", "source_question_ids": ["awssysops-p3-1-q687"], "statement": "Increasing the CloudFront TTL settings (default/min/max) in a cache behavior keeps objects cached longer before re-validating against the origin, increasing the cache hit ratio.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-b49f55646ffb", "source_question_ids": ["awssysops-p3-1-q687"], "statement": "Changing a CloudFront distribution's Viewer Protocol Policy to HTTPS-only affects transport security, not caching behavior, and does not change the cache hit ratio.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-42b8dd929a04", "source_question_ids": ["awssysops-p3-1-q687"], "statement": "Configuring a CloudFront distribution to require presigned cookies/URLs controls access restriction, not cache efficiency, and does not affect the cache hit ratio.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c207298afb80", "source_question_ids": ["awssysops-p3-1-q687"], "statement": "Enabling automatic compression of objects in CloudFront cache behavior settings reduces the size of transferred objects but does not change whether a given request is a cache hit or miss.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-ca87f489c75f", "source_question_ids": ["awssysops-p3-1-q736"], "statement": "CloudFront geo-restriction lets a distribution allow-list or block-list specific countries and return a custom error page to requesters from blocked countries.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-82d5e357b41f", "source_question_ids": ["awssysops-p3-1-q736"], "statement": "Amazon Route 53 geolocation routing can route requests originating from specific geographic regions to a different endpoint, such as one serving an error page, providing a second AWS-native way to implement country-based access blocking.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-39d1c0f2d62f", "source_question_ids": ["awssysops-p3-1-q736"], "statement": "Amazon GuardDuty is a threat-detection service; it has no geo-blocking or geo-restriction feature.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c3d9a1465e63", "source_question_ids": ["awssysops-p3-1-q736"], "statement": "AWS Shield is a DDoS-protection service; it has no geo-restriction capability.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-057f27422b78", "source_question_ids": ["awssysops-p3-1-q736"], "statement": "A network ACL filters traffic by IP address/CIDR ranges only and has no concept of country or region, making country-level blocking impractical at the NACL layer.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-baa3dd4cbac4", "source_question_ids": ["awssysops-p3-1-q757"], "statement": "Both ALB access logs and CloudFront access logs operate at the application (Layer 7) level and record each request's HTTP status code.", "status": "supported"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-d64d6bca2f4c", "source_question_ids": ["awssysops-p3-1-q757"], "statement": "AWS CloudTrail logs record AWS API/management-plane activity (who called which AWS API), not end-user HTTP requests to a web application, so they contain no Layer 7 HTTP status codes.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-3cedcc00c1aa", "source_question_ids": ["awssysops-p3-1-q757"], "statement": "VPC Flow Logs operate at Layer 3/4 (IP/port/packet metadata) and have no visibility into HTTP-level (Layer 7) status codes.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-4302ed49102b", "source_question_ids": ["awssysops-p3-1-q757"], "statement": "RDS logs capture database engine activity and are unrelated to HTTP traffic or HTTP status codes.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-15300fcdd6a1", "source_question_ids": ["awssysops-p3-1-q757"], "statement": "For investigating Layer 7 HTTP status codes, the source's boxed/labeled answer pairs CloudTrail logs with CloudFront access logs, but community consensus unanimously favors pairing ALB access logs with CloudFront access logs instead, since CloudTrail contains no HTTP status codes at all.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["single ALB in a single region"], "confidence": "high", "id": "cl-6e2168b5d516", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "With only a single ALB in a single region, enabling Route 53 latency-based routing is a no-op — every request already resolves to that same one load balancer regardless of the routing policy, since latency-based routing only has an effect when multiple regional endpoints exist.", "status": "supported"}, {"claim_type": "fact", "confidence": "medium", "id": "cl-f5e012055e26", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Implementing EC2 Auto Scaling for web servers lets the fleet grow to handle load spikes that would otherwise slow down dynamic content generation.", "status": "supported"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-07b6c66f4ffd", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "An Application Load Balancer's listener cannot be changed to TCP, because ALBs operate only at the application layer (HTTP/HTTPS); TCP listeners are an NLB-only feature.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-4f15257bb6d2", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Moving static content off S3 onto the web servers adds load to the same instances already implicated in the site's slowness, rather than relieving it.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-1c868159145a", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "For improving performance of a slow single-region website, the source's boxed/labeled answer includes Route 53 latency-based routing (paired with Auto Scaling), but community consensus unanimously favors pairing CloudFront caching of static content with Auto Scaling instead, since latency-based routing is a no-op with only one ALB in one region.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["default/min/max TTL set to 0 seconds"], "confidence": "high", "id": "cl-5491414e16da", "source_question_ids": ["awssysops-p3-1-q881"], "statement": "Setting the default, minimum, and maximum Time to Live (TTL) to 0 seconds on a CloudFront distribution effectively disables caching, forwarding every request straight through to the origin.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-ea39c9e3c72c", "source_question_ids": ["awssysops-p3-1-q881"], "statement": "If client DNS still resolves directly to an ALB instead of to the CloudFront distribution's domain name, traffic bypasses CloudFront entirely and the ALB continues to see the full unreduced load.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-b8c90a0b06dd", "source_question_ids": ["awssysops-p3-1-q881"], "statement": "Origin Access Identity is an S3-specific access-control mechanism used to restrict direct public access to an S3 bucket origin; it has no applicable meaning when the CloudFront origin is an ALB.", "status": "supported"}, {"claim_type": "default", "confidence": "low", "id": "cl-c463f0e57c3e", "source_question_ids": ["awssysops-p3-1-q881"], "statement": "Sticky sessions (session affinity) configured on an ALB's target groups can force session affinity that undermines the caching/offload benefit a fronting CloudFront distribution is meant to provide.", "status": "needs-review"}, {"claim_type": "exception", "confidence": "low", "id": "cl-0bc9ae284b17", "source_question_ids": ["awssysops-p3-1-q881"], "statement": "For why a CloudFront-fronted ALB still sees unreduced load, besides DNS bypass, the second cause is disputed within the community itself: TTLs set to 0 seconds (which disables caching) and ALB sticky sessions (which undermines caching) are each cited by roughly half of commenters, with no clear consensus.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["CloudFront distribution using default cache behavior configuration"], "confidence": "high", "id": "cl-c55b6012f7cd", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "With CloudFront's default configuration, cookies are not forwarded to the origin at all, so an origin's session cookie (e.g., set by an ALB for sticky sessions) never reaches the origin on subsequent requests unless CloudFront is explicitly configured to forward it.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-05b907db2ecf", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "For a stateful application behind CloudFront and an ALB, enabling ALB session affinity (sticky sessions) together with configuring CloudFront to forward all cookies to the origin fixes intermittent logout / inconsistent content issues, since it addresses both the ALB-side routing and the CloudFront-side cookie-stripping causes.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-45c888a7515f", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "For fixing intermittent logouts on a CloudFront-fronted stateful ALB application, the source's boxed/labeled answer is switching from duration-based to application-controlled ALB sticky sessions, but this does nothing about CloudFront's default cookie-stripping behavior, which community consensus unanimously identifies as the actual root cause requiring cookie forwarding plus sticky sessions.", "status": "conflicted"}, {"claim_type": "rule", "confidence": "high", "id": "cl-8950881eae4e", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "Geographic access latency for users far from a single-region deployment is best addressed by combining edge caching of static content (CloudFront) with routing users to a second, geographically nearer full production environment (via Route 53 latency-based routing).", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-adfbf103b065", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "An Application Load Balancer is a Regional resource and cannot distribute traffic across two separate AWS Regions; cross-Region routing must be done by Route 53, not the ALB.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-10322374e8ec", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "Tuning the EC2 Auto Scaling group's CPU scaling threshold has no effect on a reported performance issue when CloudWatch shows the actual bottleneck is on a different tier (e.g., the RDS instance at 70% CPU, not the EC2 web tier), and would not address a geography-based latency gap in any case.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-92b82bb3b102", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "For fixing geographic latency for Asia-based users of a single-region production environment, the source's boxed/labeled answer proposes provisioning a second Asia Pacific environment fronted by a single cross-Region ALB, but this is a technical impossibility since ALBs cannot span AWS Regions; community consensus instead favors Route 53 latency-based routing to the second environment plus CloudFront for static content.", "status": "conflicted"}], "mentalModel": {"id": "aws-sysops-service-cloudfront--m-1", "title": "CloudFront as an edge cache that sits in the request path", "purpose": "Predict when putting CloudFront in front of an origin (S3, ALB/ELB) cuts origin load and user latency, when it does nothing, and which CloudFront knobs (cache key, TTL, OAI, geo-restriction, metrics, logs) govern each outcome.", "mechanism": "CloudFront is a CDN: viewers' DNS resolves to the distribution, the request lands at the nearest edge location, and the edge looks up a cache key (path plus whatever cookies, query strings and headers are forwarded). On a hit the edge answers locally, so the origin is never touched and the bytes travel a short distance. On a miss, or once the object's TTL has expired, the edge fetches from the origin (an S3 bucket or a custom origin such as an ALB/ELB) and caches the response for the TTL. So the benefit depends on three things: traffic must actually go through CloudFront (DNS points at the distribution), requests must collapse onto few cache keys (forward only what the origin needs), and objects must stay cached (TTL > 0). Access control is separate from caching. An Origin Access Identity makes S3 serve only CloudFront. Signed URLs/cookies (or app-issued S3 pre-signed URLs) authorize individual users. Geo-restriction allows or blocks whole countries. Observability is also per distribution: access logs go to an S3 bucket, and CloudWatch metrics such as 4XXErrorRate and TotalErrorRate measure error responses at the edge.", "predict_prompt": "A single-region site fronted by CloudFront still shows full load on its ALB. Before reading on, list what could make every request miss the edge cache or skip CloudFront entirely.", "invariants": ["A request that does not resolve to the CloudFront domain is never cached. If DNS still points at the ALB, the origin sees the full load.", "Every extra forwarded cookie, query string or header splits the cache key and lowers the hit ratio. Longer TTLs raise it, and TTL 0 turns caching off.", "Caching cuts load and latency no matter where the origin is, because edges sit near users.", "OAI only proves the request came from CloudFront. It does not authorize individual users.", "Geo-restriction works at the country level, never per IP address."], "limits": ["CloudFront does not speed up database query load. Use ElastiCache or RDS read replicas for that.", "CloudFront cannot block a single IP with geo-restriction. Use a network ACL deny rule for that.", "By default, cookies are not forwarded. A stateful app that relies on ALB sticky-session cookies breaks unless CloudFront forwards cookies.", "OAI applies only to S3 origins. It has no meaning for an ALB origin.", "HTTPS-only viewer policy, signed URLs/cookies and compression do not change the cache hit ratio."], "cues": ["Flash download spike or static assets under read-heavy load: front the origin with CloudFront", "Users far from the only region: CloudFront for cacheable content", "Raise cache hit ratio: forward fewer cookies, query strings and headers, and raise TTLs", "Users may access S3 objects only through CloudFront: OAI plus a bucket policy", "Users hitting missing or unauthorized objects: 4XXErrorRate. All errors: TotalErrorRate", "Find HTTP status codes: CloudFront and ALB access logs, not CloudTrail or VPC Flow Logs", "Block a country: geo-restriction or Route 53 geolocation. Block one IP: network ACL"], "claim_ids": ["cl-aa9aa216e4a2", "cl-ebaba23ae26a", "cl-f3d2a62248da", "cl-4f12c5eb8955", "cl-cdb68252be75", "cl-ab51234cdc01", "cl-b4b3dd4adf66", "cl-dae96b32bc75", "cl-5491414e16da", "cl-ea39c9e3c72c", "cl-c55b6012f7cd", "cl-05b907db2ecf", "cl-62146ffb292d", "cl-9b70036d4bde", "cl-b8c90a0b06dd", "cl-ab61a65db3c3", "cl-ca87f489c75f", "cl-36e7a96b9ded", "cl-f6fb14815106", "cl-76efeb2692ab", "cl-9b4acdfdd747", "cl-a24e3a0fd8a3", "cl-3d36e4eaf3fc", "cl-baa3dd4cbac4", "cl-b49f55646ffb", "cl-42b8dd929a04", "cl-c207298afb80", "cl-f32486a3f82a"]}, "contrastSet": {"id": "aws-sysops-service-cloudfront--cs-1", "subjects": ["CloudFront", "Route 53 latency-based routing", "ElastiCache / RDS read replicas"], "dimensions": ["What it caches or routes", "Precondition to have any effect", "Bottleneck it relieves", "Effect on distant users of a single-region site"], "shared_traits": ["Each is offered as a way to make a slow or overloaded site faster", "None of them adds compute capacity itself. That is Auto Scaling's job."], "matrix": {"What it caches or routes": {"CloudFront": "Caches HTTP objects (S3 or ALB/ELB origin) at edge locations", "Route 53 latency-based routing": "Caches nothing. DNS picks the fastest regional endpoint", "ElastiCache / RDS read replicas": "Caches or replicates database query results inside the region"}, "Precondition to have any effect": {"CloudFront": "DNS points at the distribution, TTL > 0, and a lean cache key", "Route 53 latency-based routing": "At least two regional endpoints or origins", "ElastiCache / RDS read replicas": "The database tier is the bottleneck"}, "Bottleneck it relieves": {"CloudFront": "Origin request load and network distance to the user", "Route 53 latency-based routing": "Distance to a full environment, but only if a second region exists", "ElastiCache / RDS read replicas": "Database read and query load"}, "Effect on distant users of a single-region site": {"CloudFront": "Lower latency, because edges are near users", "Route 53 latency-based routing": "None. It is a no-op with one ALB in one region", "ElastiCache / RDS read replicas": "None on transfer time of large objects"}}, "decision_rule": "Ask how many regional endpoints exist and where the bottleneck sits. With a single-region origin, CloudFront is the answer when the pain is repeated reads of cacheable content (load spikes or distant users). ElastiCache or read replicas are the answer only when the database is the bottleneck. Route 53 latency-based routing applies only once a second full regional environment exists.", "boundary_flip": "Provision a second full production environment in Asia Pacific alongside the original region. Route 53 latency-based routing now becomes correct for sending Asian users to the nearer environment, usually paired with CloudFront for static content. Before that environment existed, latency-based routing was a no-op and CloudFront alone was the fix.", "strongest_distractor_failure": "Route 53 latency-based routing looks like a latency fix. But with a single ALB in a single region, every query resolves to that same endpoint, so nothing changes. An ALB cannot span Regions either, so cross-Region routing needs Route 53 plus a real second environment.", "exceptions": ["If CloudWatch shows the database tier saturated (for example RDS at high CPU), caching objects at the edge does not fix the query load. Add ElastiCache or read replicas.", "ElastiCache caches database results. It does not cache S3 object reads, and it does not speed the download of large dynamic objects. CloudFront in front of the ELB does both."], "claim_ids": ["cl-c130c98dd118", "cl-0d5a024092b6", "cl-6e2168b5d516", "cl-1c868159145a", "cl-8950881eae4e", "cl-adfbf103b065", "cl-92b82bb3b102", "cl-f3d2a62248da", "cl-aa9aa216e4a2", "cl-80be965cb35f", "cl-e3d33f110338", "cl-f32486a3f82a", "cl-ed49249f3eae", "cl-ab51234cdc01", "cl-10322374e8ec", "cl-ea39c9e3c72c", "cl-5491414e16da", "cl-b4b3dd4adf66"]}, "scenarioFamily": {"id": "aws-sysops-service-cloudfront--sf-1", "canonical": {"prompt": "A company runs a single-region production site: one Application Load Balancer, a web server fleet, and static assets stored in an S3 bucket. Users across Asia and Europe report that pages load noticeably slower than they do for users near the AWS Region hosting the deployment. CloudWatch shows the web tier and database tier are both within normal utilization. The company wants to cut latency for these geographically distant users without standing up any new AWS Region. What should they do?", "expected_answer": ["Put a CloudFront distribution in front of the site so static content is cached at edge locations close to the distant users, cutting the network distance they travel"], "reasoning": "CloudFront reduces latency for end users everywhere, including regions far from the origin, because edge locations cache content close to each user regardless of where the origin lives, and this works for a CDN-fronted S3 origin or an ALB custom origin.", "distractor_analysis": "Provisioning additional EBS IOPS on the origin's storage addresses disk I/O throughput, not network distance, so it does nothing for users who are simply far away. Migrating the S3 bucket content directly to the web tier adds load to the already-implicated web tier rather than relieving it, and moving a single file to S3 does not by itself fix latency for users far from that one bucket's Region.", "claim_ids": ["cl-f3d2a62248da", "cl-aa9aa216e4a2", "cl-ebaba23ae26a", "cl-f22591fa9e33", "cl-7ff27d8700c0"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The company has now also stood up a complete second production environment (its own ALB, web servers, and database) in an AWS Region near the Asian users, and both regional environments are fully functional and independently serving traffic.", "prompt": "The company now runs two full production environments in two separate AWS Regions, one near its original users and a second stood up near its Asia-based users, each with its own ALB, web servers, and database. Asian users still complain about latency. What should the company do to route them to the nearer environment, and does enabling this now actually help compared to before the second environment existed?", "expected_answer": ["Enable Route 53 latency-based routing between the two regional endpoints so Asian users resolve to the nearer environment, paired with CloudFront for static content; this now has an effect because a second regional endpoint exists, whereas before it was a no-op"], "reasoning": "Route 53 latency-based routing only changes anything when multiple regional endpoints/origins exist to route between. With only a single ALB in a single region it was a no-op, but now that a second full regional environment exists, Route 53 can route each user's DNS lookup to whichever regional endpoint is fastest for them, and geographic access latency for users far from a single-region deployment is best addressed by combining edge caching of static content (CloudFront) with routing to that second, nearer environment via Route 53 latency-based routing.", "claim_ids": ["cl-8950881eae4e", "cl-0d5a024092b6", "cl-c130c98dd118", "cl-adfbf103b065"], "difficulty": "hard", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The operations team separately upgraded the web tier's EC2 instance type from a smaller to a larger size last week, and switched internal ticketing tools, neither of which is related to the latency complaints.", "prompt": "A company runs a single-region production site: one ALB, a web server fleet, and static assets stored in an S3 bucket. Last week the operations team also upgraded the web tier's EC2 instance type to a larger size and migrated to a new internal ticketing tool, unrelated to any reported issue. Users across Asia and Europe still report pages loading noticeably slower than they do for users near the AWS Region hosting the deployment, and CloudWatch shows both the web tier and database tier within normal utilization. The company wants to cut latency for these distant users without standing up any new AWS Region. What should they do?", "expected_answer": ["Put a CloudFront distribution in front of the site so static content is cached at edge locations close to the distant users, cutting the network distance they travel"], "reasoning": "The EC2 instance type upgrade and the ticketing tool change are unrelated to network distance and do not affect where edge caching helps; the fix remains fronting the site with CloudFront, since edge locations cache content close to each user regardless of where the origin lives, and the web/database tiers already show normal utilization so compute is not the bottleneck.", "claim_ids": ["cl-f3d2a62248da", "cl-aa9aa216e4a2", "cl-ebaba23ae26a", "cl-f22591fa9e33"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "CloudWatch now shows RDS CPU utilization elevated at 70%, prompting a teammate to propose adding ElastiCache in front of the database to fix the reported latency.", "prompt": "A company runs a single-region production site: one ALB, a web server fleet, and static assets stored in an S3 bucket. Users across Asia and Europe report pages loading noticeably slower than they do for users near the AWS Region hosting the deployment. CloudWatch now shows RDS CPU utilization elevated at 70%, and a teammate proposes adding ElastiCache in front of the database to fix the latency complaint. The company wants to cut latency for these geographically distant users without standing up any new AWS Region. What should they do?", "expected_answer": ["Put a CloudFront distribution in front of the site so static content is cached at edge locations close to the distant users, cutting the network distance they travel"], "reasoning": "The elevated RDS CPU is a separate signal about database load, not about geography; tuning or caching that tier would not address a geography-based latency gap in any case, since ElastiCache reduces database query load but does nothing to shorten the network distance between a distant user and the origin. The correct fix for distant-user latency remains fronting the site with CloudFront so edge locations serve content close to each user.", "claim_ids": ["cl-10322374e8ec", "cl-e3d33f110338", "cl-f3d2a62248da"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The slow content is no longer static S3-hosted assets but a large, dynamically-generated, per-visitor report file served through an Elastic Load Balancer custom origin and refreshed daily.", "prompt": "A company serves a large, dynamically-generated, per-visitor report file that is refreshed daily, through an Elastic Load Balancer in a single AWS Region. Users across Asia and Europe report the file takes noticeably longer to download than it does for users near the AWS Region hosting the deployment. CloudWatch shows the web tier and database tier are both within normal utilization. The company wants to cut download latency for these distant users without standing up any new AWS Region. What should they do?", "expected_answer": ["Put a CloudFront distribution in front of the site so static content is cached at edge locations close to the distant users, cutting the network distance they travel"], "reasoning": "A CloudFront distribution can use an Elastic Load Balancer as a custom origin, caching large dynamically-generated, per-visitor objects at edge locations and directly speeding up their download for geographically distributed visitors, the same mechanism that helps when the origin is S3. Storing the content directly in S3 would not fit content that is dynamically generated per visitor and updated daily, and scaling the web tier's Auto Scaling group addresses compute capacity, not the per-object download speed experienced by an individual distant visitor.", "claim_ids": ["cl-ab51234cdc01", "cl-86b3a9e7b474", "cl-7bef0284b717", "cl-ed49249f3eae"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "q881's second cause for an un-offloaded ALB is unresolved even within the community: TTL=0 and ALB sticky sessions are each cited by about half of commenters (cl-0bc9ae284b17). The synthesis quietly picks the TTL side. The invariant 'TTL 0 turns caching off', the predict_prompt, and the contrast-set precondition 'TTL > 0' present it as the settled answer, and the sticky-session alternative (cl-c463f0e57c3e, needs-review, low confidence) is left out without saying the source question is disputed.", "related_entity_ids": ["cl-0bc9ae284b17", "cl-5491414e16da", "cl-c463f0e57c3e", "aws-sysops-service-cloudfront--m-1", "aws-sysops-service-cloudfront--cs-1"]}, {"type": "contradiction", "severity": "high", "description": "For q552 (block one malicious IP), the boxed answer (CloudFront geo-restriction) and the community answer (network ACL deny) disagree (cl-7a2b6e1e3c9f). The synthesis adopts the community answer outright ('Block one IP: network ACL'). That answer is also technically doubtful in a CloudFront-fronted setup: the origin subnet's NACL sees CloudFront edge IPs, not the client IP, so a NACL deny on the client IP would not take effect. The CloudFront-native per-IP control (AWS WAF IP set) is never mentioned. The dispute should be shown, not settled.", "related_entity_ids": ["cl-7a2b6e1e3c9f", "cl-f6fb14815106", "cl-36e7a96b9ded", "aws-sysops-service-cloudfront--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "For q569, the source's boxed answer (S3 GetRequests) and the community answer (CloudFront 4XXErrorRate) disagree (cl-7f3304c20584). The mental-model cue 'Users hitting missing or unauthorized objects: 4XXErrorRate' encodes the community side without flagging that the source answer key disagrees.", "related_entity_ids": ["cl-7f3304c20584", "cl-76efeb2692ab", "cl-054b742dd7a6", "aws-sysops-service-cloudfront--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "For q757, the boxed answer (CloudTrail + CloudFront logs) and the community answer (ALB + CloudFront access logs) disagree (cl-15300fcdd6a1). The cue 'CloudFront and ALB access logs, not CloudTrail' settles this source dispute without saying so.", "related_entity_ids": ["cl-15300fcdd6a1", "cl-baa3dd4cbac4", "cl-d64d6bca2f4c", "aws-sysops-service-cloudfront--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "For q641, the boxed answer (ElastiCache in front of RDS) and the community answer (CloudFront in front of the ELB) disagree (cl-ed49249f3eae). The contrast set's exceptions and matrix ('None on transfer time of large objects') and claim cl-ab51234cdc01 all assume the community answer is correct, with no disclosure that the source answer key says otherwise.", "related_entity_ids": ["cl-ed49249f3eae", "cl-ab51234cdc01", "cl-f32486a3f82a", "aws-sysops-service-cloudfront--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "For q826, the boxed answer includes Route 53 latency-based routing and the community favors CloudFront + Auto Scaling (cl-1c868159145a). The contrast set's strongest_distractor_failure and matrix cell ('None. It is a no-op with one ALB in one region') present the community resolution as fact, and the source dispute is not surfaced.", "related_entity_ids": ["cl-1c868159145a", "cl-6e2168b5d516", "cl-c130c98dd118", "aws-sysops-service-cloudfront--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "For q886, the boxed answer (switch to application-controlled ALB stickiness) and the community answer (forward cookies in CloudFront + sticky sessions) disagree (cl-45c888a7515f). The mental-model limit about cookie forwarding encodes the community side without flagging the dispute.", "related_entity_ids": ["cl-45c888a7515f", "cl-05b907db2ecf", "cl-c55b6012f7cd", "aws-sysops-service-cloudfront--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "For q907, the boxed answer (a second Asia Pacific environment behind one cross-Region ALB) and the community answer (Route 53 latency-based routing + CloudFront) disagree (cl-92b82bb3b102). The contrast set's boundary_flip and strongest_distractor_failure are built on the community resolution without noting that the source answer key disagrees.", "related_entity_ids": ["cl-92b82bb3b102", "cl-8950881eae4e", "cl-adfbf103b065", "aws-sysops-service-cloudfront--cs-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "Contrast-set exception 'If CloudWatch shows the database tier saturated (for example RDS at high CPU) ... Add ElastiCache or read replicas' draws on cl-10322374e8ec (q907). But q907's own resolution in every variant (cl-8950881eae4e, cl-92b82bb3b102) is CloudFront + a second regional environment, not ElastiCache or read replicas, so no source question supports this recommendation for that scenario. cl-10322374e8ec also calls RDS at 70% CPU 'the actual bottleneck' even though neither q907 answer addresses RDS, which is internally inconsistent.", "related_entity_ids": ["cl-10322374e8ec", "cl-8950881eae4e", "aws-sysops-service-cloudfront--cs-1"]}, {"type": "ambiguity", "severity": "medium", "description": "cl-ab51234cdc01 says CloudFront caches 'large dynamically-generated, per-visitor objects' at the edge. Truly per-visitor objects produce almost no cache hits, which conflicts with the mental model's own rule that the benefit depends on requests collapsing onto few cache keys. The source scenario (content generated per geographic location, updated daily) more plausibly works through shared per-region objects or CloudFront's optimized network path, not per-visitor caching. The claim also comes from a conflicted question (q641).", "related_entity_ids": ["cl-ab51234cdc01", "cl-86b3a9e7b474", "cl-ed49249f3eae", "aws-sysops-service-cloudfront--m-1"]}, {"type": "ambiguity", "severity": "low", "description": "cl-05b907db2ecf recommends forwarding all cookies to the origin. The mental-model invariant says every extra forwarded cookie splits the cache key and lowers the hit ratio. The synthesis never states this trade-off (forward only the session cookie, or don't cache those paths), so the two rules read as contradictory guidance for a stateful app.", "related_entity_ids": ["cl-05b907db2ecf", "cl-b4b3dd4adf66", "aws-sysops-service-cloudfront--m-1"]}, {"type": "unsupported-generation", "severity": "low", "description": "The contrast set's boundary_flip says 'Before that environment existed, latency-based routing was a no-op and CloudFront alone was the fix.' The only supporting question (q907) treats CloudFront plus a second environment as the fix (cl-8950881eae4e). No claim supports CloudFront alone being sufficient for that scenario.", "related_entity_ids": ["cl-8950881eae4e", "aws-sysops-service-cloudfront--cs-1"]}, {"type": "quality", "severity": "low", "description": "The contrast set groups RDS read replicas with ElastiCache as something that 'Caches or replicates database query results', and its shared trait says 'None of them adds compute capacity itself.' Read replicas replicate data, not query results, and they are extra DB instances that do add read capacity. Both statements misdescribe read replicas compared with cl-80be965cb35f.", "related_entity_ids": ["cl-80be965cb35f", "aws-sysops-service-cloudfront--cs-1"]}, {"type": "stale-risk", "severity": "low", "description": "The OAI claims and the mental model's OAI invariant and limits describe Origin Access Identity, which AWS now treats as legacy in favor of Origin Access Control (OAC). The cookie-forwarding default (cl-c55b6012f7cd) uses the legacy cache-behavior settings rather than cache and origin-request policies. They are correct for the exam's era but may be stale against current AWS behavior.", "related_entity_ids": ["cl-62146ffb292d", "cl-9b70036d4bde", "cl-b8c90a0b06dd", "cl-c55b6012f7cd", "aws-sysops-service-cloudfront--m-1"]}], "sourceQuestionCount": 22}], "sources": {"kind": "locked", "file": "aws-sysops-service-cloudfront-x2pu.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
