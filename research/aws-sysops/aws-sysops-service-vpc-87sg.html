], "statement": "A Virtual Private Gateway (VGW) is the VPC-side endpoint for a Site-to-Site VPN or Direct Connect connection to an on-premises network.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a19c0d32ed5b", "source_question_ids": ["awssysops-p1-q006"], "statement": "A NAT Gateway provides one-way outbound internet access for private-subnet instances but is not itself the VPC's attachment point to an external network; the Internet Gateway still handles that.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-b6c2131aac4b", "source_question_ids": ["awssysops-p1-q006"], "statement": "Community vote on which two components provide external connectivity for a VPC is split roughly 50/50 between NAT Gateway+Internet Gateway and Internet Gateway+Virtual Private Gateway.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb168dcb42b2", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Internet Gateway (IGW) is inherently redundant/highly available at the VPC level, so adding a second IGW does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the ELB has a subnet enabled in each Availability Zone"], "confidence": "high", "id": "cl-9e7c6e9ed7b5", "source_question_ids": ["awssysops-p1-q010"], "statement": "An ELB spans only the Availability Zones you enable on it (one subnet per AZ); with a subnet enabled in each of multiple AZs it is already redundant, so adding a second ELB does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b3aa5da8e2c", "source_question_ids": ["awssysops-p1-q010"], "statement": "A multi-AZ RDS instance already fails over automatically to a standby in a second Availability Zone, so it is not itself a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the web tier runs in an Auto Scaling group spanning multiple AZs", "the ELB has a subnet in each AZ"], "confidence": "medium", "id": "cl-0305ade11d31", "source_question_ids": ["awssysops-p1-q010"], "statement": "In an architecture with an IGW, an ELB with a public subnet in each AZ, a web tier in a multi-AZ Auto Scaling group, and a Multi-AZ RDS instance, there is no remaining single point of failure to fix.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ecfb2ab6e979", "source_question_ids": ["awssysops-p1-q011"], "statement": "Each VPC subnet maps to exactly one Availability Zone and cannot span multiple Availability Zones.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-efd273866364", "source_question_ids": ["awssysops-p1-q011"], "statement": "By default, every subnet in a VPC can route to every other subnet in that VPC through the non-removable 'local' route present in every route table, main or custom.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa2693b716a9", "source_question_ids": ["awssysops-p1-q011"], "statement": "The smallest CIDR block mask AWS allows for a VPC subnet is /28, not /25.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4c8adff400a2", "source_question_ids": ["awssysops-p1-q011"], "statement": "Private-subnet instances reach the internet via a NAT gateway rather than needing their own Elastic IP.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1fa7a765b651", "source_question_ids": ["awssysops-p1-q016"], "statement": "Subnets cannot span multiple Availability Zones; achieving coverage across N Availability Zones for a resource requires provisioning one subnet per AZ.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-33fbf0096616", "source_question_ids": ["awssysops-p1-q016"], "statement": "An ELB that must be distributed across multiple Availability Zones needs a subnet registered in each of those AZs, so an ELB distributed over 2 AZs requires two public subnets (one per AZ).", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6de4b10a3185", "source_question_ids": ["awssysops-p1-q016"], "statement": "RDS database instances should be placed in private subnets rather than public subnets so the database is not reachable from the internet.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-707b0eca29cb", "source_question_ids": ["awssysops-p1-q016"], "statement": "In a tiered VPC design with a public-facing ELB and a private database tier, the web/application servers should also be placed in private subnets rather than a public subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-639585759f32", "source_question_ids": ["awssysops-p1-q016"], "statement": "A subnet lives in exactly one AZ, so an ELB using a single public subnet serves only that AZ; spanning 2 AZs needs one public subnet per AZ, so 'one public subnet is enough for the ELB' is wrong.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-74b69e00d2e9", "source_question_ids": ["awssysops-p1-q021"], "statement": "Security groups are evaluated independently: the source instance's security group must allow the traffic outbound and the destination's security group must allow it inbound; statefulness then lets the reply traffic back through both without extra rules.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Goal is to allow only ICMP between two specific instances"], "confidence": "high", "id": "cl-97625e7139d8", "source_question_ids": ["awssysops-p1-q021"], "statement": "To allow only ICMP ping between two specific instances and nothing else, the source instance's security group needs an outbound ICMP rule and the destination instance's security group needs an inbound ICMP rule.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-058bfee61439", "source_question_ids": ["awssysops-p1-q021"], "statement": "ICMP traffic works across Availability Zones and subnets within the same VPC; security groups, not subnet or AZ boundaries, are what filter it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-89f78f4e1293", "source_question_ids": ["awssysops-p1-q021"], "statement": "Putting two instances in one shared security group with inbound ICMP allowed would technically permit ICMP between them, but is unnecessarily permissive and not required when a scoped two-sided rule would do.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-d8e6f085345c", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the network ACLs on both subnets must permit the traffic.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-3febcf7bf852", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the security groups on both instances must allow the traffic on the right port/protocol.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-f8cde0449f7b", "source_question_ids": ["awssysops-p1-q022"], "statement": "Route tables route between subnets in the same VPC by default with no NAT instance or Internet Gateway involved, since that traffic never leaves the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab1633b33ef1", "source_question_ids": ["awssysops-p1-q022"], "statement": "Matching instance class or using the same key pair between two EC2 instances has no bearing on network reachability between them.", "status": "supported"}, {"claim_type": "rule", "conditions": ["IGW, EIP, and security group rules already confirmed correct"], "confidence": "high", "id": "cl-9f9d5ffc11d1", "source_question_ids": ["awssysops-p1-q037"], "statement": "After confirming a VPC has an Internet Gateway, the instance has an Elastic IP, and security group rules are correct, the next thing to check for connectivity is whether the subnet's route table has a route sending 0.0.0.0/0 traffic to the Internet Gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-eed5fff8ff51", "source_question_ids": ["awssysops-p1-q037"], "statement": "A NAT instance's configuration is only relevant to outbound-only private-subnet traffic, not to a public instance that already has its own Elastic IP.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-abb75f7baaae", "source_question_ids": ["awssysops-p1-q037"], "statement": "Source/destination (SRC/DST) checking is a NAT/routing-instance concept and is not relevant to a normal EC2 instance's own internet connectivity.", "status": "supported"}, {"claim_type": "rule", "conditions": ["launching an EC2 instance and wanting a predetermined private IP address"], "confidence": "high", "id": "cl-d189624fb381", "source_question_ids": ["awssysops-p1-q052"], "statement": "Only within a VPC can a user define a subnet's CIDR range and assign a specific, predetermined private IP address to an EC2 instance at launch.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-50e63e1ea566", "source_question_ids": ["awssysops-p1-q052"], "statement": "An Elastic IP address is a public IP address, not a private one, so assigning Elastic IPs does not satisfy a requirement for a predetermined private IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-481fbf9ca5c9", "source_question_ids": ["awssysops-p1-q052"], "statement": "A Placement Group affects instance placement and network performance between instances, not IP address assignment.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-07ea3e784810", "source_question_ids": ["awssysops-p1-q052"], "statement": "An instance's private DNS hostname just names whatever private IP address the instance happened to be assigned; it does not let a user predetermine that IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f65d41befcac", "source_question_ids": ["awssysops-p1-q052"], "statement": "Launching an instance from a private AMI controls the image/OS content, not networking or IP address assignment.", "status": "supported"}, {"claim_type": "default", "conditions": ["instance is launched into the default subnet in EC2-VPC"], "confidence": "high", "id": "cl-feb2d6091c7e", "source_question_ids": ["awssysops-p1-q060"], "statement": "An instance launched into a default VPC subnet automatically gets a private IP address, an auto-assigned public IP address, and reachability to/from the internet through the VPC's internet gateway, all provisioned automatically at launch.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-a7a90931cff9", "source_question_ids": ["awssysops-p1-q060", "awssysops-p1-q073"], "statement": "An Elastic IP is never attached to an EC2 instance automatically; it must be explicitly allocated to the account and then associated with the instance as a separate manual step.", "status": "supported"}, {"claim_type": "default", "conditions": ["instance launched into a VPC subnet with only default settings"], "confidence": "high", "id": "cl-50aa3dc9bd8a", "source_question_ids": ["awssysops-p1-q073"], "statement": "An EC2 instance launched into a VPC subnet with only default settings is assigned a private IP address immediately and automatically, with nothing else guaranteed ready to use without an extra step.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-395a5bd32c89", "source_question_ids": ["awssysops-p1-q073"], "statement": "An EC2 instance gets a public IPv4 address at launch if its subnet's auto-assign public IP attribute is enabled (on in default subnets, off in user-created subnets) or if one is explicitly requested on the primary network interface at launch, which overrides the subnet setting.", "status": "supported"}, {"claim_type": "fact", "conditions": ["user-created (non-default) VPC"], "confidence": "high", "id": "cl-1a16efff622f", "source_question_ids": ["awssysops-p1-q073"], "statement": "In a user-created (non-default) VPC, an internet gateway must be created, attached to the VPC, and added to the subnet's route table before instances get internet connectivity; a default VPC comes with these already configured.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3b74017b0664", "source_question_ids": ["awssysops-p1-q091"], "statement": "Splitting a /24 VPC CIDR into two /25 subnets produces two valid, non-overlapping subnets that can both be created.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8172913b2ce8", "source_question_ids": ["awssysops-p1-q091"], "statement": "/25 is a valid VPC subnet CIDR size in AWS.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC created with VPC wizard scenario using public + VPN-only subnets"], "confidence": "medium", "id": "cl-1fbac1e1495a", "source_question_ids": ["awssysops-p1-q111"], "statement": "In the legacy VPC wizard's public + VPN-only subnet scenario, the main route table was associated with the VPN-only subnet (routing to the virtual private gateway) and a custom route table routed the public subnet through the Internet Gateway; the current VPC wizard no longer offers VPN scenarios.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1355475497a0", "source_question_ids": ["awssysops-p1-q111"], "statement": "A valid main route table entry for a VPN-only subnet routes all non-local traffic (0.0.0.0/0) to the virtual private gateway so instances reach the corporate data center over the VPN.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-e89a27559660", "source_question_ids": ["awssysops-p1-q111"], "statement": "Every VPC route table has an implicit 'local' route handling traffic to the VPC's own CIDR range by default, so pointing a destination already inside the VPC's CIDR at the VPN gateway instead is redundant or incorrect.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC has only a private, VPN-connected subnet with no public subnet or IGW"], "confidence": "medium", "id": "cl-bd3493bfbcd5", "source_question_ids": ["awssysops-p1-q117"], "statement": "In a VPN-only private subnet with no IGW, the VPN tunnel is the network path for SSH from the user's own network, though EC2 Instance Connect Endpoint or Session Manager (through VPC endpoints) can also reach the instances without a VPN.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["VPC has only a private, VPN-connected subnet with no public subnet or IGW"], "confidence": "high", "id": "cl-f1e88d1f493d", "source_question_ids": ["awssysops-p1-q117"], "statement": "For SSH access to an instance reachable only via a VPN-only private subnet, the security group should simply allow inbound traffic on port 22 from the user's own network range, since the VPN tunnel itself handles routing that traffic into the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8cf8357edbad", "source_question_ids": ["awssysops-p1-q117"], "statement": "A bastion-host-via-Elastic-IP pattern for reaching private instances is a real pattern over the public internet, but it is unnecessary when a VPN tunnel already provides the network path to a private subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7ab48df8f965", "source_question_ids": ["awssysops-p1-q117"], "statement": "A NAT instance provides outbound internet access from private instances, not inbound SSH access to them.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-46ce26836699", "source_question_ids": ["awssysops-p1-q149"], "statement": "A newly created, non-default security group has no rules allowing intra-group traffic until one is added, unlike the default security group, which allows this out of the box.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9adfed790034", "source_question_ids": ["awssysops-p1-q149"], "statement": "The standard way to allow instances in the same security group to communicate with each other is to add a rule whose source is the security group itself, covering all protocols and ports.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-dfbcc407ebbe", "source_question_ids": ["awssysops-p1-q149"], "statement": "VPC peering solves cross-VPC connectivity, not same-subnet or same-VPC communication, so it is not needed to let instances in the same subnet talk to each other.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC has public and VPN-only subnets with hardware VPN access configured"], "confidence": "medium", "id": "cl-d79501d05e48", "source_question_ids": ["awssysops-p1-q151"], "statement": "To route an organization's on-premises proxy traffic into a public subnet over a hardware VPN connection, set up route table entries and security group rules on the public subnet's instances so they accept traffic arriving over the virtual private gateway from the corporate network.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-28241cf34246", "source_question_ids": ["awssysops-p1-q152"], "statement": "Within any VPC subnet, AWS reserves five IP addresses: the network address, the first three usable addresses (for the VPC router, DNS, and future use), and the last address (the broadcast address) -- none are assignable to an instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e603122b06a8", "source_question_ids": ["awssysops-p1-q152"], "statement": "The last address of a subnet's CIDR range (its broadcast address) can never be assigned to an instance's private IP.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e4ff37b30201", "source_question_ids": ["awssysops-p1-q160"], "statement": "AWS blocks deletion of a subnet that still has active network interfaces in it, such as those attached to a running EC2 instance; the instance must be terminated first.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2a79f06401e3", "source_question_ids": ["awssysops-p1-q160"], "statement": "AWS does not automatically reassign an EC2 instance to a default subnet, nor does it auto-terminate instances, when a subnet deletion is attempted while instances are still present.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC was created via the VPC wizard with public and private subnets"], "confidence": "high", "id": "cl-c33500a1a47c", "source_question_ids": ["awssysops-p1-q166"], "statement": "Deleting a wizard-created public+private VPC fails due to running instances/network interfaces, including the NAT instance (or managed NAT Gateway in current wizards) the wizard provisions automatically to give the private subnet outbound internet access.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a3a5a865e704", "source_question_ids": ["awssysops-p1-q166"], "statement": "Subnets and route tables do not block deleting a VPC from the console, because the console deletes them along with the VPC, so 'it has subnets with route tables' is wrong; with the DeleteVpc API or CLI, subnets and non-main route tables must be deleted first.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-edfb5d64d23b", "source_question_ids": ["awssysops-p1-q166"], "statement": "VPC deletion does not automatically cascade to terminate the instances inside it; deletion is instead blocked while instances remain.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5c6b512f7aec", "source_question_ids": ["awssysops-p1-q170"], "statement": "Historically, EC2-Classic Elastic IPs came from a separate pool and could not be associated with VPC instances unless first migrated to the VPC domain; EC2-Classic was retired in August 2023 and every Elastic IP is now VPC-domain.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0f528dc0eb27", "source_question_ids": ["awssysops-p1-q170"], "statement": "Elastic IPs are regional resources, not scoped to a specific Availability Zone.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5937b48ad9c5", "source_question_ids": ["awssysops-p1-q170"], "statement": "An Elastic IP already being associated with another instance does not hide VPC instances from the association screen (it can be reassociated with the 'Allow reassociation' option), so 'the IP may be attached to one of the instances' does not explain an empty instance list.", "status": "supported"}, {"claim_type": "fact", "conditions": ["legacy VPC wizard Scenario 3 (public + VPN-only subnet with hardware VPN)"], "confidence": "medium", "id": "cl-0b5bc9c69339", "source_question_ids": ["awssysops-p1-q172"], "statement": "In the legacy VPC wizard scenario with a public subnet, a VPN-only subnet, and hardware VPN access, the wizard did not provision a NAT instance for the VPN-only subnet, since that subnet reaches the data center over the VPN; the current 'VPC and more' wizard has no VPN scenario.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["legacy VPC wizard Scenario 3 (public + VPN-only subnet with hardware VPN)"], "confidence": "medium", "id": "cl-543a8045794b", "source_question_ids": ["awssysops-p1-q172"], "statement": "In the legacy VPC wizard's public + VPN-only subnet scenario, the wizard updated the main route table for the VPN-only subnet, created a custom route table for the public subnet, and attached an internet gateway for the public subnet; the current console wizard offers no VPN scenario.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-cbbc57aee320", "source_question_ids": ["awssysops-p1-q173"], "statement": "A newly created security group in a VPC allows all outbound traffic by default while blocking all inbound traffic by default.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-277d4d1b59dd", "source_question_ids": ["awssysops-p1-q173"], "statement": "Connecting to AWS services such as S3 or RDS from within a VPC depends on network reachability and relevant endpoint/route configuration, not something a security group grants by itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-622e159aafc7", "source_question_ids": ["awssysops-p1-q173"], "statement": "A security group has no special-case default rule specifically for the internet gateway; its default allow-all-outbound rule already covers traffic destined there.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4fa656d68f3f", "source_question_ids": ["awssysops-p1-q194"], "statement": "There is no 'routing instance' construct in AWS VPC terminology.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC wizard scenario uses public + private subnets"], "confidence": "medium", "id": "cl-40d47b6e4aad", "source_question_ids": ["awssysops-p1-q194"], "statement": "The legacy public + private VPC wizard created two subnets and one internet gateway attached to the VPC; the current 'VPC and more' wizard creates a configurable number of public and private subnets per AZ (default 2 AZs, so 4 subnets) plus one internet gateway when public subnets are selected.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["VPC wizard scenario uses public + private subnets"], "confidence": "medium", "id": "cl-bea1e129e9a3", "source_question_ids": ["awssysops-p1-q194"], "statement": "The legacy public + private VPC wizard provisioned a NAT instance (later a NAT gateway) with an Elastic IP for the private subnet; the current wizard makes NAT optional, offering no NAT gateway, one in a single AZ, or one per AZ, and has no NAT-instance option.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-d7a96012e1fe", "source_question_ids": ["awssysops-p1-q196"], "statement": "Historically, EC2-Classic and VPC had separate default Elastic IP quotas of 5 per Region each; EC2-Classic was retired in August 2023, and only the VPC Elastic IP quota (default 5 per Region) remains.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "low", "id": "cl-d083b203db1a", "source_question_ids": ["awssysops-p1-q196"], "statement": "Whether exhausting the EC2-Classic Elastic IP limit blocks allocating a new Elastic IP in a VPC in the same account/region is contested in practice -- some read the 5-EIP default as a single combined cap across platforms rather than a per-platform allotment, leading to a genuinely split community view.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-334191c012b5", "source_question_ids": ["awssysops-p1-q197"], "statement": "An Elastic IP cannot be associated with an instance in a VPC that has no attached internet gateway; the association fails with Gateway.NotAttached.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["instance is in a VPC and needs internet connectivity"], "confidence": "medium", "id": "cl-907fbccb96c3", "source_question_ids": ["awssysops-p1-q197"], "statement": "To reach a VPC instance from the internet, the VPC needs an attached internet gateway with a 0.0.0.0/0 route to it in the subnet's route table, and the instance needs a public IP (auto-assigned or Elastic IP); if no public IP was assigned at launch, an Elastic IP must be attached.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["instance has no public IP"], "confidence": "high", "id": "cl-febc51844422", "source_question_ids": ["awssysops-p1-q197"], "statement": "There is no default public DNS name attached to an EC2 instance that has no public IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a9c0d01667ba", "source_question_ids": ["awssysops-p1-q197"], "statement": "An EC2 instance launches successfully even when no public IP is assigned to it (a private IP alone is sufficient for launch).", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0c11ada875af", "source_question_ids": ["awssysops-p1-q201"], "statement": "Creating an internet gateway and attaching a public IP to an instance is not sufficient for internet connectivity; the subnet's route table must also have an explicit 0.0.0.0/0 route pointing to that internet gateway.", "status": "supported"}, {"claim_type": "fact", "conditions": ["IPv4 or dual-stack subnet"], "confidence": "high", "id": "cl-33a270e9e585", "source_question_ids": ["awssysops-p1-q201"], "statement": "In an IPv4 or dual-stack subnet, every EC2 instance is automatically assigned a primary private IPv4 address, so a missing private IP is not why an instance with a public IP is unreachable.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2adc773ac2f4", "source_question_ids": ["awssysops-p1-q201"], "statement": "Internet gateways and security groups are independent, unrelated constructs; an internet gateway is never 'configured with' a security group.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-8d4af0d3df4f", "source_question_ids": ["awssysops-p1-q208"], "statement": "Because security groups are stateful, an inbound rule allowing traffic from a specific source security group is sufficient; return traffic back to that source is automatically permitted without needing a matching outbound rule.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-effe894599cd", "source_question_ids": ["awssysops-p1-q208"], "statement": "The belief that inbound return traffic needs a separately opened ephemeral port range describes how stateless Network ACLs behave, not how security groups behave.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fb5736024326", "source_question_ids": ["awssysops-p1-q208"], "statement": "Allowing inbound access from an entire VPC CIDR block on a database security group is broader than necessary when access can instead be scoped to a specific source security group.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-bf73acabcf15", "source_question_ids": ["awssysops-p1-q208"], "statement": "Community vote on the required DBSecGrp entry for a web/DB tier scenario is split evenly between two answers, reflecting confusion between stateful security group behavior and stateless NACL behavior.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-379c18128cc8", "source_question_ids": ["awssysops-p1-q209"], "statement": "Deleting a VPC that has an attached virtual private gateway requires the gateway to be detached first, whether this detachment happens automatically via the console or must be done manually via the CLI/API.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5854dd30cec3", "source_question_ids": ["awssysops-p1-q209"], "statement": "When a VPC with an attached virtual private gateway is deleted, the gateway is detached, not deleted.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-250d0bccaf9e", "source_question_ids": ["awssysops-p1-q209"], "statement": "This question is flagged as a strong candidate for review: the recorded community vote (100%) and direct hands-on testing evidence conflict with the boxed answer's claim that the console automatically detaches the virtual private gateway during VPC deletion.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e2724eac64e6", "source_question_ids": ["awssysops-p1-q214"], "statement": "AWS rejects creation of a second subnet in a VPC whose CIDR overlaps an existing subnet's CIDR, raising a CIDR-overlap error.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-063c20ed6370", "source_question_ids": ["awssysops-p1-q214"], "statement": "A subnet CIDR matching the VPC's entire CIDR range is allowed to be created on its own, as long as it is the only subnet using that range.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-892b998d4119", "source_question_ids": ["awssysops-p1-q214"], "statement": "AWS VPC does not automatically resize an existing subnet's CIDR to accommodate a new, overlapping subnet request.", "status": "supported"}, {"claim_type": "fact", "conditions": ["Scenario includes public subnet, VPN-only subnet, VPN gateway, and a NAT instance for the VPN subnet"], "confidence": "medium", "id": "cl-b77fa9d12a40", "source_question_ids": ["awssysops-p1-q218"], "statement": "In a VPC with a public subnet, a VPN-only subnet, a VPN gateway, and a NAT instance serving the VPN subnet, valid main route table entries route 0.0.0.0/0 to the NAT instance, the data center's own CIDR to the VPN gateway, and the VPC's own CIDR to 'local'.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-b3f6e470e1d0", "source_question_ids": ["awssysops-p1-q218"], "statement": "Routing the VPN subnet's own CIDR to the NAT instance does not match any of the documented valid route-table purposes (internet egress, data-center access, or local intra-VPC traffic) for this scenario.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-6dc9ea4fee43", "source_question_ids": ["awssysops-p1-q218"], "statement": "No formatted community vote exists for this route-table question, and the comment thread is unresolved, with some arguing the boxed answer is wrong and others defending it.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-a979a3bd15dc", "source_question_ids": ["awssysops-p1-q219"], "statement": "To let a private subnet's instances reach the internet through a NAT instance, the subnet's route table needs a 0.0.0.0/0 route targeting the NAT instance, not a route limited to the subnet's own CIDR.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-36cb3babd86b", "source_question_ids": ["awssysops-p1-q219"], "statement": "Routing only the private subnet's own CIDR (e.g., 20.0.0.0/24) to the NAT instance covers traffic within the subnet, not internet-bound (0.0.0.0/0) traffic, so it would not actually achieve outbound internet access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-cdb651dcc979", "source_question_ids": ["awssysops-p1-q219"], "statement": "This question shows a boxed-answer-vs-community-vote conflict: the recorded vote (100%) favors routing only the subnet's own CIDR to the NAT instance, while the source passage favors routing 0.0.0.0/0 to the NAT instance for internet access.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-203f4ba3afac", "source_question_ids": ["awssysops-p1-q227"], "statement": "When a data center's CIDR range overlaps with the VPC's own CIDR range, traffic from a VPC subnet to that overlapping destination is dropped because the VPC's local route takes precedence.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-79b8e5de9f3a", "source_question_ids": ["awssysops-p1-q227"], "statement": "A data-center CIDR range that falls entirely outside the VPC's own CIDR range remains reachable from a VPC's private subnet.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-176b3aa43adc", "source_question_ids": ["awssysops-p1-q235"], "statement": "Once a subnet's CIDR block is set at creation, it cannot be modified afterward, whether through the console or the AWS CLI.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-c8d44b4165d5", "source_question_ids": ["awssysops-p1-q235"], "statement": "A subnet's CIDR cannot be changed, so no second subnet fits inside a primary VPC CIDR that an existing subnet fully consumes without deleting that subnet; a secondary IPv4 CIDR block can instead be associated with the VPC and the new subnet created there.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0e25459401f5", "source_question_ids": ["awssysops-p1-q235"], "statement": "A VPC does not automatically adjust an existing subnet's CIDR to resolve an overlap when a second subnet is created.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-44845599197f", "source_question_ids": ["awssysops-p2-q318", "awssysops-p1-q236"], "statement": "Security groups allow all outbound traffic by default.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-c332446f5399", "source_question_ids": ["awssysops-p1-q236"], "statement": "Because security groups allow all outbound traffic by default, an explicit outbound rule referencing a destination security group (e.g. a web-tier security group pointing at a database-tier security group on its port) is a best-practice convention rather than something strictly required for connectivity.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-84250b473555", "source_question_ids": ["awssysops-p1-q236"], "statement": "The strictly required inbound rule for a web server security group fronting a public web service is to allow the service's port (e.g. 80) from the internet (0.0.0.0/0); this specific rule was not listed as an answer choice in question awssysops-p1-q236, which several commenters flagged as making every listed choice technically non-required.", "status": "needs-review"}, {"claim_type": "default", "conditions": ["before AWS added secondary CIDR block support (pre-August 2017)"], "confidence": "medium", "id": "cl-c9711917766f", "source_question_ids": ["awssysops-p1-q244"], "statement": "Originally, a VPC's primary CIDR block was fixed at creation time and could not be enlarged without deleting and recreating the entire VPC.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["as of the AWS feature announced in August 2017"], "confidence": "medium", "id": "cl-b059f49c6ab5", "source_question_ids": ["awssysops-p1-q244"], "statement": "AWS later added the ability to expand an existing VPC's address space by attaching additional secondary CIDR blocks, without needing to delete and recreate the VPC.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d5f271af48e3", "source_question_ids": ["awssysops-p1-q244"], "statement": "Shrinking existing subnets down to a /32 CIDR and then using the CLI is not a real, documented technique for increasing the size of a VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c8b2d2940852", "source_question_ids": ["awssysops-p1-q244"], "statement": "Simply adding a new subnet with a higher IP range inside a VPC does not automatically increase the size of the VPC's own CIDR block.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1aaca88c29bb", "source_question_ids": ["awssysops-p1-q251"], "statement": "Terminating an EC2 instance deletes the network interfaces whose DeleteOnTermination attribute is true, by default the primary interface and any created at launch; network interfaces created separately and attached later are detached but not deleted.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e25bf777d06b", "source_question_ids": ["awssysops-p1-q251"], "statement": "A VPC subnet persists and remains usable for launching new instances after all instances within it are terminated; terminating instances does not delete the subnet itself.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-61243774fd8b", "source_question_ids": ["awssysops-p1-q251"], "statement": "Elastic IP addresses are not automatically released when the EC2 instance they were associated with is terminated.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2195e1e5537a", "source_question_ids": ["awssysops-p1-q253"], "statement": "A NAT instance's security group needs an inbound rule allowing traffic from the private subnet's CIDR range on the relevant application ports (e.g. 80 and 443), since the NAT instance exists to relay internet-bound traffic from the private subnet.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-7266a40d48d7", "source_question_ids": ["awssysops-p1-q253"], "statement": "A NAT instance's security group needs outbound rules allowing traffic to 0.0.0.0/0 on the relevant ports (e.g. 80 and 443) so it can relay requests to the internet.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-3798ad0d30f2", "source_question_ids": ["awssysops-p1-q253"], "statement": "A public subnet's instances reach the internet directly through the Internet Gateway, so a NAT instance's security group does not need an inbound rule allowing traffic from the public subnet's CIDR.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-66af523d161b", "source_question_ids": ["awssysops-p1-q274"], "statement": "The legacy public + private VPC wizard left the private subnet on the implicit main route table and gave the public subnet a custom route table with an internet gateway route; the current 'VPC and more' wizard creates explicit custom route tables for both public and private subnets.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-747e5bb4414d", "source_question_ids": ["awssysops-p1-q274"], "statement": "The AWS VPC wizard creates a separate custom route table, containing a route to the internet gateway, and associates it with the public subnet it creates.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c68ead9f0730", "source_question_ids": ["awssysops-p1-q274"], "statement": "Reversing the VPC wizard's route-table pairing -- binding the main route table to the public subnet and a custom route table to the private subnet -- misdescribes the actual wizard behavior.", "status": "supported"}, {"claim_type": "exception", "conditions": ["current VPC wizard behavior, as opposed to older documentation describing NAT instances"], "confidence": "medium", "id": "cl-347584fd0c09", "source_question_ids": ["awssysops-p1-q274"], "statement": "The AWS VPC wizard now provisions a managed NAT Gateway rather than a NAT instance for the public/private subnet pattern, which is a platform change from when NAT instances were the only option.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aca076cc6227", "source_question_ids": ["awssysops-p1-q285"], "statement": "Instances in a private subnet have no direct route to an internet gateway.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3fe10b446c03", "source_question_ids": ["awssysops-p1-q285"], "statement": "Private subnet instances get outbound internet access (for example, to download OS patch updates) by routing through a NAT instance or NAT gateway backed by an Elastic IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-00b6906b640c", "source_question_ids": ["awssysops-p1-q285"], "statement": "Allowing outbound traffic for a port in a security group alone does not grant internet access to a private-subnet instance if the underlying network route to a NAT device is missing.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a88ebeb94de9", "source_question_ids": ["awssysops-p1-q285"], "statement": "A private subnet is not permanently cut off from the internet; a NAT instance or NAT gateway is the standard mechanism that gives private-subnet instances outbound internet access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e0949106fe45", "source_question_ids": ["awssysops-p1-q294"], "statement": "In an AWS VPC route table, \"Local\" is the real target keyword used for routes that cover the VPC's own CIDR range; \"VPC\" and \"ALL\" are not real AWS route-table target values.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-c1bbd2a876be", "source_question_ids": ["awssysops-p1-q294"], "statement": "To let all instances across every subnet in a VPC communicate with each other via the main route table, the route destination should cover the VPC's full CIDR range (e.g. the /16), not just one subnet's narrower CIDR (e.g. a /24) -- a route scoped to only one subnet's CIDR would let instances within that subnet reach each other but would fail to let them reach instances in other subnets of the same VPC.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3266ee51ea49", "source_question_ids": ["awssysops-p2-q318"], "statement": "Behind a Classic or Application Load Balancer, web-server security groups see the load balancer's IP as the source, not the client's; only the application can recover the client IP from the X-Forwarded-For header (a Network Load Balancer preserves the client IP for instance targets).", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-53bf427147f8", "source_question_ids": ["awssysops-p2-q318"], "statement": "Configuring web server security groups to allow only customers' predefined IP addresses, together with configuring the web servers to filter traffic based on the ELB's X-Forwarded-For header, are two valid options for restricting a web application to accept traffic only from predefined customer IPs.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-39e14ec7f962", "source_question_ids": ["awssysops-p2-q318"], "statement": "Security groups are stateful (responses to allowed inbound traffic are permitted regardless of outbound rules) and support only allow rules; removing all outbound rules still blocks new outbound connections, such as a load balancer's connections and health checks to its targets.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-079f0a682262", "source_question_ids": ["awssysops-p2-q318"], "statement": "Because network ACLs are stateless, an explicit \"deny all outbound\" rule on a NACL would actually block legitimate response traffic back to the client, unlike the equivalent rule on a stateful security group.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8fabd468b5d0", "source_question_ids": ["awssysops-p2-q323"], "statement": "An EC2 instance's tenancy attribute (default vs. dedicated) cannot be changed in place on a running instance after launch.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-154d1ff0eef4", "source_question_ids": ["awssysops-p2-q323"], "statement": "To move a single existing EC2 instance to dedicated-tenancy hardware with minimal impact on the rest of an application, the supported process is: stop the instance, create an AMI from it, launch a new instance from that AMI with tenancy=dedicated, then terminate the original instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-220bd1e9a082", "source_question_ids": ["awssysops-p2-q323"], "statement": "Migrating an entire VPC to a new VPC configured with tenancy=dedicated affects every instance in that VPC, which is unnecessary disruption when only a single instance needs to move to dedicated tenancy.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-902b68475550", "source_question_ids": ["awssysops-p2-q326"], "statement": "A bucket policy can restrict an S3 bucket so that it is only accessible through a specific VPC endpoint, satisfying a requirement that the bucket be reachable only via that endpoint.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-acfa0b26a1ed", "source_question_ids": ["awssysops-p2-q326"], "statement": "A VPC endpoint policy can restrict the endpoint itself so that the VPC can only reach one specific S3 bucket through it, satisfying a requirement that resources in the VPC be limited to a single bucket.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-dae66592d22b", "source_question_ids": ["awssysops-p2-q326"], "statement": "There is no AWS mechanism called a \"VPC endpoint policy on the bucket\" -- a VPC endpoint policy attaches to the endpoint itself, not to a bucket; a policy attached to the bucket restricting it to endpoint-only access is instead a bucket policy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-971ad8832b37", "source_question_ids": ["awssysops-p2-q326"], "statement": "S3 bucket access restrictions are configured via bucket policies, not via an \"IAM policy attached to the bucket\" -- IAM policies attach to principals (users, roles), not to resources like buckets.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b76591f45ae5", "source_question_ids": ["awssysops-p2-q326"], "statement": "VPC peering configuration is not a mechanism for restricting access to a specific S3 bucket through a VPC endpoint.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-adb28f5abee4", "source_question_ids": ["awssysops-p2-q330"], "statement": "An egress-only internet gateway is attached to the VPC, and the ::/0 route to it is added to the route table associated with the subnet; each subnet is associated with exactly one route table, which may be shared with other subnets or be the VPC's main route table.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-bcb278d87bce", "source_question_ids": ["awssysops-p2-q330"], "statement": "IPv6 addresses in a VPC are globally unique (public), but they are reachable from the internet only when the subnet's route table sends ::/0 to an internet gateway; routing ::/0 to an egress-only internet gateway allows outbound-only IPv6.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-11b818ed654b", "source_question_ids": ["awssysops-p2-q330"], "statement": "A security group that blocks inbound IPv6 traffic directly prevents unsolicited inbound access to an instance with a public IPv6 address, independent of subnet placement or egress-only gateway configuration.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9d5a90bbda45", "source_question_ids": ["awssysops-p2-q330"], "statement": "Each subnet must be associated with exactly one route table (explicitly, or implicitly with the VPC's main route table), and one route table can be associated with multiple subnets.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9ef7fe3d4927", "source_question_ids": ["awssysops-p2-q349"], "statement": "Amazon VPC stands for Amazon Virtual Private Cloud.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8203b0c2aaa2", "source_question_ids": ["awssysops-p2-q406"], "statement": "Security groups in Amazon VPC control both inbound and outbound traffic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7815235443e3", "source_question_ids": ["awssysops-p2-q407"], "statement": "Security groups in a VPC are stateful: return traffic for an allowed request is automatically permitted without re-evaluating security group rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-32601b768a38", "source_question_ids": ["awssysops-p2-q407", "awssysops-p2-q431"], "statement": "Network ACLs, unlike security groups, are stateless, so return traffic must be explicitly allowed by a rule rather than being automatically permitted.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ef78dafa08d3", "source_question_ids": ["awssysops-p2-q420"], "statement": "A subnet is considered a public subnet if its traffic is routed to an internet gateway.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-956e38161193", "source_question_ids": ["awssysops-p2-q420"], "statement": "A subnet whose traffic is routed to a virtual private gateway instead of an internet gateway is a VPN-only subnet, not a public subnet, and a subnet with no internet-gateway route at all is a private subnet.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0f05e27c6b56", "source_question_ids": ["awssysops-p2-q430"], "statement": "Security groups in a VPC operate at the instance level, controlling traffic for the specific EC2 instances they are associated with.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d7ea6b278f86", "source_question_ids": ["awssysops-p2-q430", "awssysops-p2-q449"], "statement": "Network ACLs operate at the subnet level, controlling traffic flowing in and out of the subnets they're associated with, in contrast to security groups which operate at the instance level.", "status": "supported"}, {"claim_type": "default", "conditions": ["network ACL is custom-created by the user, not the VPC's automatically-provided default ACL"], "confidence": "high", "id": "cl-915afdbce6b8", "source_question_ids": ["awssysops-p2-q439"], "statement": "A custom (self-created) network ACL denies all inbound and outbound traffic by default until rules are explicitly added to it.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-a62828c2d1ea", "source_question_ids": ["awssysops-p2-q439"], "statement": "A custom network ACL is not associated with any subnet until it is explicitly associated with one.", "status": "supported"}, {"claim_type": "default", "conditions": ["network ACL is the automatically-provided default ACL that comes with the VPC, not a user-created custom ACL"], "confidence": "medium", "id": "cl-44ebb81d065b", "source_question_ids": ["awssysops-p2-q450", "awssysops-p2-q439"], "statement": "The default network ACL that automatically comes with a VPC allows all inbound and outbound traffic by default, which is the opposite default behavior of a custom NACL that a user creates themselves.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-c75eee457b12", "source_question_ids": ["awssysops-p2-q443"], "statement": "The default (soft) limit on the number of VPCs allowed per AWS region is 5.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-3fe32bd7abe0", "source_question_ids": ["awssysops-p2-q443"], "statement": "The default limit on the number of VPCs per region is a soft limit that can be raised via a service quota increase request.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6affe70a7d16", "source_question_ids": ["awssysops-p2-q445"], "statement": "A single route table in a VPC can be associated with multiple subnets.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9da85a9c06ec", "source_question_ids": ["awssysops-p2-q445"], "statement": "A given subnet can be associated with only one route table at a time.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-5d48803b999d", "source_question_ids": ["awssysops-p2-q474", "awssysops-p2-q507"], "statement": "Security groups support allow rules only; they cannot express explicit deny rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0d87167b8ae7", "source_question_ids": ["awssysops-p2-q474"], "statement": "Security groups are stateful: return traffic is automatically allowed regardless of inbound/outbound rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cabf0392243a", "source_question_ids": ["awssysops-p2-q474", "awssysops-p2-q511"], "statement": "Security groups can be added to or removed from an EC2 instance at any time.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b7c86a0d17e9", "source_question_ids": ["awssysops-p2-q474"], "statement": "Security groups evaluate all of their rules before deciding whether to allow traffic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-618ef65fb0b6", "source_question_ids": ["awssysops-p2-q474", "awssysops-p2-q507"], "statement": "Network ACLs, unlike security groups, support explicit deny rules in addition to allow rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8998c98afb18", "source_question_ids": ["awssysops-p2-q477"], "statement": "Inline threat protection technologies include third-party firewall devices on EC2, unified threat management gateways, intrusion prevention systems, data loss management gateways, anomaly detection gateways, and advanced persistent threat detection gateways.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-86d50a87e352", "source_question_ids": ["awssysops-p2-q477"], "statement": "Security groups and network ACLs, even combined, are not inline threat protection technologies, since they are basic allow/deny packet filters rather than appliances that intercept and actively analyze traffic in-line.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance has more than one security group attached"], "confidence": "high", "id": "cl-5e7ab5cb1bf3", "source_question_ids": ["awssysops-p2-q488"], "statement": "When multiple security groups are attached to the same EC2 instance, their rules are aggregated using most-permissive-rule-wins logic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b8607f7c097", "source_question_ids": ["awssysops-p2-q488"], "statement": "A broader security group rule (e.g., opening a port to 0.0.0.0/0) is not restricted by a narrower rule for the same port defined in another security group attached to the same instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-874c300f129c", "source_question_ids": ["awssysops-p2-q488"], "statement": "An EC2 instance can have more than one security group attached to it at the same time.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-803fa908d844", "source_question_ids": ["awssysops-p2-q495"], "statement": "The AWS CLI command to add inbound (ingress) rules to a security group is authorize-security-group-ingress.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e564f8f4ad44", "source_question_ids": ["awssysops-p2-q495"], "statement": "The AWS CLI command to add outbound (egress) rules to a security group is authorize-security-group-egress.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d43259c5c060", "source_question_ids": ["awssysops-p2-q511"], "statement": "An EC2 instance's security groups, including those associated with the primary network interface (eth0), can be changed at any time after launch without stopping the instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-89585d7a692d", "source_question_ids": ["awssysops-p2-q514"], "statement": "AWS's VPN customer gateway configuration uses AES 128-bit or AES 256-bit encryption to ensure privacy among IKE and IPsec Security Associations.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-466b3ec22e09", "source_question_ids": ["awssysops-p2-q514"], "statement": "SHA is a hash function, not an encryption cipher, so SHA-based answer choices do not satisfy a requirement for an encryption function used in IKE/IPsec Security Associations.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-32ba0918bd76", "source_question_ids": ["awssysops-p2-q523"], "statement": "A single VPC can span multiple Availability Zones within the same AWS Region, with one subnet created per Availability Zone.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["instances are in private subnets of the same VPC", "no internet access or encryption is required"], "confidence": "high", "id": "cl-207f75a21cbb", "source_question_ids": ["awssysops-p2-q523"], "statement": "Instances in different Availability Zones within the same VPC can communicate over private IP addresses through the VPC's default route table, with no NAT gateway, VPN, cross-VPC routing, or extra appliances required.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab472533105d", "source_question_ids": ["awssysops-p2-q523"], "statement": "Using two separate VPCs with VPN appliances and tunnels between them for cross-AZ private traffic in the same region is unnecessarily costly and complex compared to a single multi-AZ VPC with one private subnet per AZ.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["no shared resources are needed between customer workloads"], "confidence": "medium", "id": "cl-b7914823fb7d", "source_question_ids": ["awssysops-p2-q540"], "statement": "A separate VPC per customer with security groups isolates network traffic but not billing; AWS multi-account best practice uses separate accounts in AWS Organizations as the boundary for billing and security isolation.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-803786ac547e", "source_question_ids": ["awssysops-p2-q540"], "statement": "Rejecting AWS Organizations member accounts (option B) for lacking workload isolation is wrong: separate AWS accounts are isolated by default and are AWS's strongest resource and security boundary, while consolidated billing covers the billing requirement.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bd067efbeffc", "source_question_ids": ["awssysops-p2-q547"], "statement": "A CloudFormation wait-condition \"received 0 signals\" error can be caused by the cfn-signal command never successfully running on the instance, which can be confirmed by checking that instance's cfn logs.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the source question's boxed answer instead names the IAM PassRole permission as a cause, conflicting with a unanimous community vote for the internet-access cause"], "confidence": "medium", "id": "cl-d7cd2957fbb8", "source_question_ids": ["awssysops-p2-q547"], "statement": "A CloudFormation wait-condition \"received 0 signals\" error can be caused by the EC2 instance lacking outbound internet access (e.g. via a NAT device) needed to reach the CloudFormation signaling endpoint.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-380c63dbc203", "source_question_ids": ["awssysops-p2-q547"], "statement": "The IAM PassRole permission is unrelated to troubleshooting a CloudFormation wait-condition signal timeout, despite being named in the source question's boxed answer for this scenario.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-617ac6560911", "source_question_ids": ["awssysops-p2-q577"], "statement": "An EC2 instance's subnet requires both an Internet Gateway attached to the VPC and a route table entry sending internet-bound traffic (0.0.0.0/0) to that gateway before the instance can reach the public internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6bcfffc8b541", "source_question_ids": ["awssysops-p2-q577"], "statement": "A virtual private gateway provides VPN/Direct Connect connectivity, not general internet access, so attaching one to a VPC does not give an EC2 instance's subnet internet access.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-57efff381817", "source_question_ids": ["awssysops-p2-q577"], "statement": "A VPC peering connection only connects two VPCs to each other; it does not by itself grant internet access to the peered VPC, even if the other VPC has its own Internet Gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ccfb5ae67451", "source_question_ids": ["awssysops-p2-q577"], "statement": "Assigning a public IP address to a database instance does not affect the outbound internet connectivity of a separate web/application tier that cannot reach external services.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-062d0b8b1594", "source_question_ids": ["awssysops-p2-q587"], "statement": "A route table entry showing status \"Blackhole\" means the route's target (for example, a NAT gateway that was deleted or a NAT instance that was terminated) is no longer available, even though the route entry itself still exists.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-b42dcd5bc667", "source_question_ids": ["awssysops-p2-q587"], "statement": "If a route table already contains a 0.0.0.0/0 route pointing at a NAT gateway (even one showing Blackhole status), the connectivity problem is not \"no route to the internet gateway\" or \"no route rule with a destination for the internet,\" since a matching route rule clearly exists.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-57d1c79f8d4a", "source_question_ids": ["awssysops-p2-q587"], "statement": "Route propagation status is irrelevant to troubleshooting a locally-created static route (one not learned via a gateway's route propagation).", "status": "supported"}, {"claim_type": "default", "conditions": ["the source question's boxed answer instead attributes the failure to the template needing an update, conflicting with a unanimous community vote for the VPC limit"], "confidence": "medium", "id": "cl-66948dfc1be7", "source_question_ids": ["awssysops-p2-q593"], "statement": "The default limit on the number of VPCs per AWS account per Region is 5; repeatedly deploying a CloudFormation template that provisions a new VPC each time within the same account and Region can eventually exhaust this default limit and cause stack creation to fail.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-078a61473505", "source_question_ids": ["awssysops-p2-q593"], "statement": "\"The CloudFormation template needs to be updated to the latest version\" is not a real, diagnosable CloudFormation stack-creation failure mode.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["VPC uses an IPv6 CIDR block", "outbound internet access required, inbound-initiated access from the internet prohibited"], "confidence": "medium", "id": "cl-f89cfe15038e", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "For an IPv6 VPC that must allow outbound internet access from its instances while prohibiting any inbound connections initiated from the internet, the ::/0 destination should be routed to an egress-only internet gateway.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8b8c3ce09f77", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "An egress-only internet gateway is the IPv6 analog of a NAT gateway: it lets instances initiate outbound traffic to the internet but drops unsolicited inbound connection attempts.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-65e2f8c58ed0", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "Routing an IPv6 VPC's ::/0 traffic to a standard internet gateway would still permit unsolicited inbound traffic, because IPv6 addresses are globally routable and public by default, which would violate a requirement that internet-initiated access be prohibited.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8c526c397167", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "A NAT gateway does not provide outbound-only access to IPv6 internet destinations (that is the egress-only internet gateway's job); its only IPv6 feature is NAT64, which translates IPv6 traffic to IPv4 destinations.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium" g connection alone does not populate route table entries; each peered VPC's route tables must be explicitly updated with a route to the other VPC's CIDR block via the peering connection before traffic can flow between them.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-cfe27a03e24d", "source_question_ids": ["awssysops-p3-1-q626"], "statement": "\"VPC sizing\" (e.g. CIDR block size) is not a documented constraint that blocks communication after a VPC peering connection has already been successfully established.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-dc003c5fe3d6", "source_question_ids": ["awssysops-p3-1-q626"], "statement": "There is no \"peering flag\" setting on a VPC that can be disabled to break an already-established VPC peering connection.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-126480d2a722", "source_question_ids": ["awssysops-p3-1-q626"], "statement": "A missing public subnet in one of the peered VPCs is not a cause of broken connectivity between resources communicating over an established private VPC peering connection.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8c9937be4881", "source_question_ids": ["awssysops-p3-1-q628", "awssysops-p3-1-q806", "awssysops-p3-1-q852", "awssysops-p3-1-q822", "awssysops-p3-1-q860", "awssysops-p3-1-q909"], "statement": "A VPC gateway endpoint for Amazon S3 allows traffic from resources inside the VPC to reach S3 over AWS's internal network, without that traffic traversing the public internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-90381185a3ff", "source_question_ids": ["awssysops-p3-1-q628"], "statement": "Routing S3-bound traffic through a managed NAT gateway still sends that traffic to S3's internet-facing public 4", "source_question_ids": ["awssysops-p3-1-q645"], "statement": "Adding an internet gateway and assigning instances public IPs would make them directly reachable from the internet, which conflicts with a requirement that instances must not be publicly accessible.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ad6cab5ffacc", "source_question_ids": ["awssysops-p3-1-q645"], "statement": "An interface endpoint provides private connectivity only to specific supported AWS services, not general internet access for tasks like OS patching.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3683906e26b4", "source_question_ids": ["awssysops-p3-1-q645"], "statement": "There is no generic \"virtual gateway\" construct for providing general internet access to a VPC; a \"virtual private gateway\" is instead a VPN-related construct.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-34990c3927d9", "source_question_ids": ["awssysops-p3-1-q647", "awssysops-p3-1-q655", "awssysops-p3-1-q783", "awssysops-p3-1-q797", "awssysops-p3-1-q871"], "statement": "VPC Flow Logs record accepted and rejected traffic at the network-interface level and can reveal a security group or network ACL rule blocking a connection, or traffic being misrouted, after a network change.", "status": "supported"}, {"claim_type": "exception", "conditions": ["connection never reaches the database engine"], "confidence": "medium", "id": "cl-3187f2097d1a", "source_question_ids": ["awssysops-p3-1-q647"], "statement": "If a network-level change blocks connectivity before a connection is ever established, the destination database engine's own error logs have nothing recorded about an attempt it never received.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a5ef66a6dcd6", "source_question_ids": ["awssysops-p3-1-q647"], "statement": "Elastic Load Balancing access logs and Amazon CloudFront logs are unrelated to diagnosing a direct application-server-to-RDS network connectivity failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9becb523b2b4", "source_question_ids": ["awssysops-p3-1-q655", "awssysops-p3-1-q783"], "statement": "A VPC Flow Log entry captured on the destination resource's own network interface showing REJECT means the traffic reached that interface and was blocked there by a security group or network ACL rule evaluated at that interface, not that it failed to leave the source instance.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-033ea31283b2", "source_question_ids": ["awssysops-p3-1-q655"], "statement": "When a flow log on the destination's network interface shows a REJECT for traffic from a specific source, the fix is to adjust the security group or network ACL rules on the destination side (e.g. permit the source's traffic and the required port) rather than the source instance's own outbound rules.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-aa9b0f2d154f", "source_question_ids": ["awssysops-p3-1-q655"], "statement": "Installing an application-specific client (e.g. an email client) on the source instance does not address a security-group-level REJECT recorded on the destination's network interface.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1e82cb50e3cf", "source_question_ids": ["awssysops-p3-1-q655"], "statement": "Disabling an OS-level firewall (e.g. iptables) on the destination instance does not address a REJECT caused by an AWS security group or network ACL rule, since those are enforced independently of the instance's own OS firewall.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2476a43d95b6", "source_question_ids": ["awssysops-p3-1-q662"], "statement": "For instances in a private subnet to use an existing NAT gateway for outbound internet access, the subnet's route table needs a default route (0.0.0.0/0) that targets the NAT gateway.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2a70b75038dd", "source_question_ids": ["awssysops-p3-1-q662"], "statement": "Without any default-route (0.0.0.0/0) entry in a subnet's route table, instances in that subnet have no outbound path to the internet at all, regardless of what NAT gateways or internet gateways exist elsewhere in the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c1d684a040e8", "source_question_ids": ["awssysops-p3-1-q662"], "statement": "Pointing a private subnet's default route at an internet gateway instead of a NAT gateway would make the subnet's resources directly internet-accessible, violating a requirement that they remain inaccessible from the internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6dadc2104f36", "source_question_ids": ["awssysops-p3-1-q662"], "statement": "Adding a route for the VPC's own subnet CIDR block (e.g. 10.0.1.0/24) to an internet gateway or NAT gateway targets internal VPC address space and provides no internet connectivity.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-96ffd4b64e4b", "source_question_ids": ["awssysops-p3-1-q672", "awssysops-p3-1-q852"], "statement": "A public NAT gateway that provides internet access must be in a public subnet whose route table points to an internet gateway; placed in the private subnet it serves, it cannot provide internet access.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d5aad83bd3a3", "source_question_ids": ["aws ement": "Enabling enhanced networking on EC2 instances is a network-performance feature and has no bearing on whether those instances can reach the internet.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-73964a584b60", "source_question_ids": ["awssysops-p3-1-q783"], "statement": "When a VPC Flow Log shows an inbound request as ACCEPT but the corresponding reversed-direction reply as REJECT, this pinpoints the outbound leg of the connection as the point of failure.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f6a89504a736", "source_question_ids": ["awssysops-p3-1-q790"], "statement": "Direct internet connectivity for a subnet requires both creating an internet gateway and attaching it to the VPC, and adding a route table entry for the subnet that points internet-bound traffic at that gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-b0c0c0aaa936", "source_question_ids": ["awssysops-p3-1-q790"], "statement": "A NAT gateway only provides outbound-only internet access for a private subnet; it does not provide the direct incoming and outgoing connectivity needed for a public-facing instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-88b7c93ab486", "source_question_ids": ["awssysops-p3-1-q790"], "statement": "An Elastic IP address cannot be attached to an internet gateway; Elastic IPs attach to EC2 instances or elastic network interfaces.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-89c96ffdac07", "source_question_ids": ["awssysops-p3-1-q790"], "statement": "A private IP address is automatically assigned to an instance's elastic network interface and has no bearing on that instance's internet reachability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "hi
