q812"], "statement": "Host-based (OS-level) firewalls would require configuring an IP block individually on every instance's own firewall, which is neither immediate nor VPC-wide.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bae339abeb1b", "source_question_ids": ["awssysops-p3-1-q812"], "statement": "Security groups are stateful and only support allow rules; they have no explicit-deny capability for blocking a specific IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7957c8608f93", "source_question_ids": ["awssysops-p3-1-q812"], "statement": "A NAT Gateway is a traffic-routing component with no IP-filtering or IP-blocking feature.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-81fab5b343e7", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "Pairing an S3 VPC endpoint with an S3 bucket policy that conditionally restricts access to requests originating from that VPC endpoint enforces the access restriction at the bucket itself, regardless of which IAM principal makes the request.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-9004a45802c4", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "An IAM policy attached to users or roles can restrict what a given principal is permitted to do, but cannot by itself restrict access to a bucket from other principals outside that scope, such as enforcing that access must come only through a specific VPC endpoint.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-47726c502acd", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "Granting EC2 instances full S3 access via a service-linked role does not restrict access to only a specific VPC or force traffic over the AWS private network; it only grants permissions to specific instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-743b895df349", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "Routing S3 traffic through a NAT gateway sends it toward S3's public endpoints rather than over a private VPC endpoint.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-bb0c9fd326b4", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "A zonal NAT gateway is created in one public subnet and is redundant only within that subnet's Availability Zone; a regional NAT gateway (regional availability mode) instead spans Availability Zones automatically.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["single NAT gateway shared across multiple AZs"], "confidence": "medium", "id": "cl-467922fe3c44", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "If the Availability Zone containing a VPC's only NAT gateway experiences an outage, private subnets in other, still-healthy Availability Zones lose their route to the internet when their route tables' default route points at that NAT gateway, which can cause applications dependent on outbound internet access to fail.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-dede37de1788", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "A virtual private gateway is a VPN-specific component and is not relevant to a NAT-gateway-related single-AZ outage scenario.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-827cc62b5b05", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "An internet gateway is a VPC-wide resource, not scoped to a single Availability Zone, unlike a NAT gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-13e32ea68e3e", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "The default VPC route table is a VPC-wide construct and is not scoped to or limited by a single Availability Zone.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-74429f586770", "source_question_ids": ["awssysops-p3-1-q832", "awssysops-p3-1-q904"], "statement": "In a multi-tier web architecture with an internet-facing Application Load Balancer, only the ALB needs to sit in a public subnet; both the web-tier servers and the database servers should be placed in private subnets, spread across multiple Availability Zones, to minimize public exposure while retaining high availability.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fc897fab1ff5", "source_question_ids": ["awssysops-p3-1-q832"], "statement": "Placing web-tier servers in a public subnet is unnecessary exposure once an internet-facing Application Load Balancer already provides the entry point, since the web tier gains nothing from also being directly public.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5e79cf1f0687", "source_question_ids": ["awssysops-p3-1-q832", "awssysops-p3-1-q904"], "statement": "Placing database servers in a public subnet is the opposite of minimizing public access and should be avoided.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1b7c13bb2a68", "source_question_ids": ["awssysops-p3-1-q836"], "statement": "A VPN connection terminated on a virtual private gateway attached to a VPC gives a remote network (e.g. a corporate office) a private, routable path into the VPC, such as for SSH administration, without requiring public internet exposure on either end.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ca09b28fd94b", "source_question_ids": ["awssysops-p3-1-q836"], "statement": "A public NAT gateway exists to give private-subnet resources outbound internet access, so adding one violates a requirement that instances have no public internet access, and it provides no inbound SSH path from a corporate office.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-70dffeb443e7", "source_question_ids": ["awssysops-p3-1-q836"], "statement": "An internet gateway exposes the VPC to the public internet, and an ALB is an HTTP/HTTPS load balancer that cannot carry SSH, so neither provides a private SSH path from a corporate network into the VPC.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["EC2 and Aurora are in different subnets/security groups"], "confidence": "high", "id": "cl-9d43a1145f6d", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "To let EC2 instances connect to an Aurora database over MySQL (port 3306), the inbound rule must be added on the Aurora security group, allowing TCP 3306 from the EC2 instances' security group as the traffic source.", "status": "supported"}, {"claim_type": "rule", "conditions": ["the client's security group outbound rules already allow the traffic (e.g., default allow-all outbound)"], "confidence": "medium", "id": "cl-bb387d494158", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Security groups are stateful, so return traffic for an allowed connection is permitted automatically; when the client's security group already allows the outbound traffic (as the default allow-all outbound rule does), only the target needs an inbound rule for the port.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9e68c39f9680", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Adding a new outbound security group rule has no effect on connectivity when an outbound rule for all protocols, all ports, to 0.0.0.0/0 already exists, since that traffic was already fully permitted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3983ee9074b2", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Adding an inbound TCP rule for the MySQL port on the EC2 instances' own security group does not fix EC2-to-Aurora connectivity, because the actual block is on the Aurora side's inbound rules.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-03192675b7d1", "source_question_ids": ["awssysops-p3-1-q852"], "statement": "A customer gateway is used to establish a Site-to-Site VPN connection to an on-premises network, not to reach an AWS service such as S3.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-99d4759387b1", "source_question_ids": ["awssysops-p3-1-q852"], "statement": "An S3 bucket policy alone grants no network path to the bucket; without an actual route such as a VPC endpoint, a private subnet still has no connectivity to S3.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7c5eac765c3c", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "Enabling VPC Flow Logs on a NAT gateway's elastic network interface captures per-connection traffic detail including source IP address.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2c15a0022541", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "CloudWatch Logs Insights can filter and aggregate NAT gateway VPC Flow Logs by source IP to attribute NAT gateway traffic back to individual instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-91c42c699cee", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "An AWS Cost and Usage report breaks costs down by resource, such as the NAT gateway itself, but has no visibility into which instance generated which portion of the traffic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-809cb3afaf43", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "NAT gateway CloudWatch metrics are aggregate, gateway-level statistics with no per-instance breakdown.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d6d54d7bcb15", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "VPC traffic mirroring to Amazon QuickSight is a heavier-weight packet-capture mechanism not designed for source-IP traffic-volume analysis.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance is acting as a NAT instance"], "confidence": "high", "id": "cl-8024a6cb4612", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "A NAT instance must have source/destination checks disabled on its network interface, or it will silently drop traffic it is forwarding on behalf of other instances in the private subnet.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-0d4593509e23", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "EC2 instances have the source/destination check enabled by default, which blocks an instance from forwarding traffic whose source or destination is not itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6da2e2e26727", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "Assigning Elastic IP addresses to private instances and routing them directly to an internet gateway gives those instances direct public internet reachability, which violates a requirement that instances must not be reachable from the public internet.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-92a9a822e8ec", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "AWS WAF is a web application firewall and has no role in fixing NAT instance traffic forwarding.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-731f8dcc0bd3", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "Stopping and starting a NAT instance so it moves to a different host does not fix a source/destination check left enabled (the EC2 default); the check must be disabled on the NAT instance.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5cacb6798dab", "source_question_ids": ["awssysops-p3-1-q860"], "statement": "A private EC2 instance without a public or Elastic IP address can still reach Amazon S3 either through a NAT gateway's outbound path or through a gateway VPC endpoint for S3, without any direct internet exposure on the instance itself.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-edb93e721ec9", "source_question_ids": ["awssysops-p3-1-q860"], "statement": "Network ACLs and security groups can only filter traffic that already has a network path to a destination; configuring them with specific private IP addresses cannot by itself create connectivity to a service such as S3.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3d566ec78895", "source_question_ids": ["awssysops-p3-1-q860"], "statement": "AWS Direct Connect is for connecting on-premises networks to AWS, not for routing an in-VPC EC2 instance's traffic to an AWS service such as S3.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-be46355524c3", "source_question_ids": ["awssysops-p3-1-q871"], "statement": "Enabling VPC Flow Logs once at the VPC level automatically captures traffic across every elastic network interface within that VPC, satisfying an \"all network traffic between servers\" capture requirement with a single configuration.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ccaa95c1a500", "source_question_ids": ["awssysops-p3-1-q871"], "statement": "AWS CloudTrail records API and management-plane activity against AWS services, not network packet-level traffic between servers, so it cannot fulfill a network-traffic-capture requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-bce80df1e2ad", "source_question_ids": ["awssysops-p3-1-q871"], "statement": "Configuring flow logs individually at the elastic-network-interface level for every server requires substantially more setup effort than a single VPC-level flow log configuration.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c20695bbf972", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Moving a database from a private subnet back to a public subnet to restore Lambda connectivity reintroduces the exact security exposure that the original re-architecture (moving the database off a public endpoint) was meant to eliminate.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-156eaaffce2e", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Attaching a Lambda function to the same VPC as a private-subnet database, then connecting via the database's private endpoint, is the standard documented pattern for a VPC-attached Lambda function to reach VPC-internal resources.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d4831f197b79", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "A Lambda interface VPC endpoint (PrivateLink) only lets clients in a VPC call the Lambda API privately; it does not give the function network access into the VPC, so it cannot reach a private-subnet database. The function must be attached to the VPC.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-35740b3ad868", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Attaching an IAM role to a Lambda function only grants permissions to call AWS APIs; it has no bearing on network-level connectivity to a database.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-0c850204c75d", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "When a question's community vote credibly and substantially contradicts or splits from the given boxed answer, the question is flagged as disputed for triage while the boxed answer is nonetheless retained per the ingestion policy.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4688955a77b5", "source_question_ids": ["awssysops-p3-1-q904"], "statement": "Using only a single public subnet (rather than one per Availability Zone) for an Application Load Balancer undermines the ALB's own multi-AZ high availability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fd70aece2a57", "source_question_ids": ["awssysops-p3-1-q909"], "statement": "An S3 VPC gateway endpoint lets a subnet's route table send S3-bound traffic directly to S3 over AWS's private network, with no path through any internet gateway or NAT gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-60c647878267", "source_question_ids": ["awssysops-p3-1-q909"], "statement": "Adding more NAT gateways to a VPC still leaves subnets dependent on routing out through an internet gateway, which contradicts a goal of removing internet access entirely while retaining S3 access.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["IPv6 traffic"], "confidence": "high", "id": "cl-3c89068951f8", "source_question_ids": ["awssysops-p3-1-q909"], "statement": "An egress-only internet gateway is an IPv6-only construct that still routes traffic through the internet, so it does not avoid internet traversal.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6910d2c28cce", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A VPC interface endpoint (AWS PrivateLink) lets a VPC connect privately to a supported AWS service such as AWS KMS entirely within the AWS network, without needing an internet gateway, NAT device, or VPN.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6ffc9c196c39", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A NAT gateway reaches AWS KMS only through KMS's public endpoint via an internet gateway, so it depends on a public internet path rather than the private connectivity an interface VPC endpoint (PrivateLink) provides.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2da5b2eda828", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A bastion host is for interactive SSH/RDP access to instances and is unrelated to private service-to-service API connectivity such as reaching AWS KMS.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-9b4ddf626c6c", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "An S3 gateway VPC endpoint only routes traffic to Amazon S3; it does not provide private connectivity to other AWS services such as AWS KMS.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-36191597a03b", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "A gateway VPC endpoint for Amazon S3 has no hourly charges and no per-GB data processing charges.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-86075b30cd0b", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "Routing S3 traffic through an S3 gateway VPC endpoint instead of a NAT gateway avoids the NAT Gateway's per-GB data-processing charge.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-35cfa5c5c421", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "An S3 bucket policy enforcing encryption in transit controls access, not network routing, so it does not reduce NAT Gateway data-processing charges.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-80f3779f4581", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "The S3 Intelligent-Tiering storage class affects storage-class billing for stored objects, not the cost of data transferred through a NAT gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-38863db9cafa", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "Disabling CORS on an S3 bucket affects cross-origin browser requests and has no effect on NAT gateway data-processing charges.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e250cd4e59bc", "source_question_ids": ["awssysops-p3-1-q927"], "statement": "DHCP options sets cannot be edited in place; creating a new set with the new DNS server and associating it with the VPC propagates the setting to every instance as its DHCP lease renews, without touching each instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-240cbac9bc11", "source_question_ids": ["awssysops-p3-1-q927"], "statement": "AWS OpsWorks was a Chef/Puppet configuration-management service; all OpsWorks offerings reached end of life in 2024, and AWS recommends AWS Systems Manager instead.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-75c709b3f6fb", "source_question_ids": ["awssysops-p3-1-q927"], "statement": "Using AWS Systems Manager or a custom script to update DNS configuration on each instance individually requires iterating over every instance in a fleet, which is more operationally intensive than a single VPC-level DHCP options change.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-vpc--m-1", "title": "Every VPC connection needs a route (the path) and a permit (the filters)", "purpose": "Diagnose or design any VPC connectivity scenario by checking two independent layers in order: does a route table send the traffic to a target that leads where it must go, and do the stateless subnet filter (network ACL) and the stateful instance filter (security group) both let it through.", "mechanism": "A packet leaving an ENI is first matched against its subnet's single route table. The non-removable 'local' route covers the VPC CIDR, so traffic between subnets and AZs of the same VPC needs no gateway, and a destination overlapping the VPC CIDR always stays local. Anything else needs a more specific or default route to a target: 0.0.0.0/0 to an internet gateway makes the subnet public (two-way, but only if the instance also has a public or Elastic IP). 0.0.0.0/0 to a NAT gateway or NAT instance that sits in a public subnet gives outbound-only access. ::/0 to an egress-only internet gateway gives outbound-only IPv6. A route to a virtual private gateway makes the subnet VPN-only (on-premises, not the internet). A gateway endpoint route reaches S3 privately. A peering route reaches another VPC. Creating a gateway, endpoint, or peering connection does nothing until a route points at it, and a route whose target is gone shows Blackhole. Only once a path exists do the filters apply: the network ACL on each subnet the packet crosses evaluates each direction independently (stateless), and the security group on each ENI evaluates the initiating direction only (stateful, so replies return automatically). Filters can only remove connectivity. They can never create a path that the routes don't provide.", "predict_prompt": "A private-subnet instance with no public IP has a security group allowing all outbound traffic, but it still can't download patches. Its route table has only the local route. What single change fixes it without making the instance reachable from the internet, and where must the device that change targets live?", "invariants": ["Each subnet is associated with exactly one route table, and the local route for the VPC CIDR is always present.", "Internet reachability requires all three: an IGW attached to the VPC, a 0.0.0.0/0 route to it in the subnet's route table, and a public IP or Elastic IP on the instance.", "NAT gateways and egress-only internet gateways pass only outbound-initiated traffic. Unsolicited inbound traffic never reaches the instances behind them.", "A security group or NACL rule cannot substitute for a missing route, and a bucket policy cannot substitute for a missing endpoint route.", "A virtual private gateway carries VPN/Direct Connect traffic to on-premises networks, never general internet traffic."], "limits": ["A zonal NAT gateway is redundant only within its own AZ. If every private subnet's default route targets one NAT gateway, an outage in that AZ cuts off internet access for all of them.", "A NAT instance (unlike a NAT gateway) also needs source/destination checks disabled, or it drops the traffic it forwards.", "Gateway endpoints exist only for S3 (and DynamoDB). Other services such as KMS need an interface endpoint (PrivateLink).", "Several wizard-era and EC2-Classic claims in this slice describe legacy behavior and conflict with the current console."], "cues": ["'Can't reach the internet' after IGW, EIP, and security groups were confirmed: check the subnet route table for 0.0.0.0/0 to the IGW.", "'Outbound only' or 'patching but not publicly accessible': NAT gateway in a public subnet plus a 0.0.0.0/0 route from the private subnet (IPv6: egress-only IGW on ::/0).", "'S3 traffic must not traverse the internet' or 'cut NAT data-processing cost': S3 gateway endpoint plus a route table entry.", "Flow log shows inbound ACCEPT but reply REJECT: a stateless NACL is missing the outbound or ephemeral-port rule.", "Peering established but no traffic: add routes to the peer CIDR in both VPCs."], "claim_ids": ["cl-9da85a9c06ec", "cl-efd273866364", "cl-e89a27559660", "cl-f8cde0449f7b", "cl-203f4ba3afac", "cl-0c11ada875af", "cl-617ac6560911", "cl-907fbccb96c3", "cl-ef78dafa08d3", "cl-956e38161193", "cl-472b0f092a56", "cl-9376cd025140", "cl-2476a43d95b6", "cl-2a70b75038dd", "cl-96ffd4b64e4b", "cl-f89cfe15038e", "cl-8b8c3ce09f77", "cl-6bcfffc8b541", "cl-fd70aece2a57", "cl-ac3e08d0cd3c", "cl-86075b30cd0b", "cl-72fe8c04ef87", "cl-062d0b8b1594", "cl-edb93e721ec9", "cl-00b6906b640c", "cl-99d4759387b1", "cl-d8e6f085345c", "cl-3febcf7bf852", "cl-f11a5bf7cb51", "cl-32601b768a38", "cl-73964a584b60", "cl-467922fe3c44", "cl-8024a6cb4612", "cl-6910d2c28cce", "cl-9b4ddf626c6c", "cl-9f9d5ffc11d1"]}, "contrastSet": {"id": "aws-sysops-service-vpc--cs-1", "subjects": ["Security group", "Network ACL"], "dimensions": ["Scope", "Rule types", "State tracking", "Default when newly created", "Multiple attachments", "Typical exam use"], "shared_traits": ["Both filter traffic only after a route already provides a path. Neither one creates connectivity.", "Both control inbound and outbound traffic.", "Both are basic packet filters, not inline threat-protection appliances.", "A REJECT from either one shows up in VPC Flow Logs on the affected network interface."], "matrix": {"Scope": {"Security group": "Instance / ENI level", "Network ACL": "Subnet level, applies to every instance in associated subnets"}, "Rule types": {"Security group": "Allow rules only, so it cannot deny a CIDR", "Network ACL": "Allow and explicit deny rules"}, "State tracking": {"Security group": "Stateful: replies to allowed traffic return automatically", "Network ACL": "Stateless: replies need their own rule, including ephemeral ports 1024-65535"}, "Default when newly created": {"Security group": "No inbound allowed, all outbound allowed", "Network ACL": "Custom NACL denies all in and out (the VPC's default NACL allows all)"}, "Multiple attachments": {"Security group": "Several per instance, combined so the most permissive rule wins", "Network ACL": "One per subnet"}, "Typical exam use": {"Security group": "Scope access to a source SG (e.g. DB allows 3306 from the web SG)", "Network ACL": "Quickly block an IP range across whole subnets"}}, "decision_rule": "Ask whether the requirement needs traffic to be explicitly denied. If it does (block a specific IP or CIDR), only a network ACL deny rule can do it, and it applies to whole subnets at once. If the requirement only grants access, use a security group allow rule scoped to the instance or source security group, and rely on its statefulness for the replies.", "boundary_flip": "\"Let the web tier reach the Aurora database on 3306\" is answered by an inbound rule on the Aurora security group with the web security group as the source. Change it to \"immediately block 203.0.113.0/24 from reaching any instance in those subnets\" and the answer flips to a deny rule on the subnets' network ACLs, because security groups have no deny.", "strongest_distractor_failure": "The tempting answer is to edit every instance's security group (or its host firewall) to block the attacking range. That fails because security groups support only allow rules and so cannot deny a CIDR at all. Host firewalls are per-instance, slow, and not VPC-wide. Only the subnet-level NACL deny rule works.", "exceptions": ["Statelessness cuts both ways. A NACL that allows inbound port 80 but allows outbound only on port 80 still drops the replies, which go to the client's ephemeral port. On a security group, the same 'deny all outbound' setup would not break replies.", "The default NACL that comes with the VPC allows all traffic, while a custom NACL starts by denying everything. Which default applies depends on which kind of NACL is attached.", "A new non-default security group does not allow traffic between its own members until you add a self-referencing rule. The VPC's default security group does allow it."], "claim_ids": ["cl-be86d14279d0", "cl-03b7696ffc02", "cl-b5b5e01070ef", "cl-b10a727c7730", "cl-5d48803b999d", "cl-618ef65fb0b6", "cl-bae339abeb1b", "cl-45bc5f89cdb8", "cl-c66dc66e7288", "cl-0f05e27c6b56", "cl-d7ea6b278f86", "cl-7815235443e3", "cl-0d87167b8ae7", "cl-32601b768a38", "cl-ef70b680e0db", "cl-7322a6e67945", "cl-eb2071b89037", "cl-2601d0f8c1d5", "cl-effe894599cd", "cl-079f0a682262", "cl-cbbc57aee320", "cl-44845599197f", "cl-915afdbce6b8", "cl-44ebb81d065b", "cl-46ce26836699", "cl-9adfed790034", "cl-5e7ab5cb1bf3", "cl-874c300f129c", "cl-9d43a1145f6d", "cl-8203b0c2aaa2", "cl-86d50a87e352", "cl-edb93e721ec9", "cl-34990c3927d9"]}, "scenarioFamily": {"id": "aws-sysops-service-vpc--sf-1", "canonical": {"prompt": "A SysOps engineer launches an EC2 instance into a private subnet of a VPC. The instance has no public IP address and no Elastic IP. Its security group already has an outbound rule allowing all traffic to 0.0.0.0/0. The subnet's route table currently has only the implicit local route for the VPC's CIDR block. The instance needs outbound internet access to download OS security patches, but the requirement is explicit that it must never be reachable from the internet. What should be added, and where, to satisfy this without exposing the instance?", "expected_answer": ["Deploy a NAT gateway in a public subnet of the VPC (a subnet whose own route table sends 0.0.0.0/0 to an attached internet gateway), then add a 0.0.0.0/0 route to the private subnet's route table that targets that NAT gateway."], "reasoning": "Private-subnet instances have no direct route to an internet gateway (cl-aca076cc6227), and a security group's allow-all-outbound rule alone cannot grant internet access if the subnet's route table has no path there (cl-00b6906b640c) -- only the local route exists today, which covers the VPC CIDR, not the internet. Placing a NAT gateway in a public subnet and pointing the private subnet's default route at it gives the instance outbound-initiated internet access, and NAT gateways never let unsolicited inbound connections reach the instances behind them, so the 'never reachable from the internet' requirement is also satisfied (cl-472b0f092a56, cl-9376cd025140).", "distractor_analysis": "Attaching an internet gateway directly and giving the instance a public or Elastic IP would also produce outbound internet access, but it would make the instance directly reachable from the internet in both directions, violating the explicit requirement (cl-f8ac3d75b414). Simply trusting the security group's existing allow-all-outbound rule to be enough is the other common mistake: a security group can only filter traffic that already has somewhere to go, and right now the route table gives it nowhere to go but the VPC itself (cl-00b6906b640c).", "claim_ids": ["cl-aca076cc6227", "cl-00b6906b640c", "cl-472b0f092a56", "cl-9376cd025140", "cl-f8ac3d75b414"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The requirement flips: in addition to outbound patch downloads, the instance must now also accept inbound connections initiated from the internet (for example, to serve a public API on port 443), rather than staying unreachable.", "prompt": "Same starting point: an EC2 instance in a private subnet, no public or Elastic IP, security group already allows all outbound traffic, and the subnet's route table has only the local route. The requirement has changed: the instance must now accept inbound connections initiated from the internet (e.g., to serve a public HTTPS API), in addition to still needing outbound patch access. What should be added or changed now?", "expected_answer": ["Move the instance to (or make) a public subnet: attach an internet gateway to the VPC, add a 0.0.0.0/0 route in that subnet's route table pointing to the internet gateway, and assign the instance a public IP or Elastic IP so it is directly reachable from the internet in both directions. A NAT gateway is no longer sufficient because it only permits outbound-initiated traffic."], "reasoning": "An Internet Gateway is required for a VPC to reach the public internet, and reachability from the internet also requires the subnet's route table to send 0.0.0.0/0 to that IGW (cl-72f23043dbe8, cl-0c11ada875af). A NAT gateway, which was the right tool when the instance only needed to be reachable outbound, specifically does not let unsolicited inbound connections through (cl-9376cd025140), so once inbound-initiated reachability is required, the NAT gateway must be replaced by a direct IGW path with a public or Elastic IP on the instance.", "distractor_analysis": "Keeping the previous NAT-gateway fix and just adding a public IP without rerouting through an IGW doesn't work: a NAT gateway's path is still outbound-only regardless of what IP the instance holds (cl-9376cd025140). The instance's own private IP assignment was never the limiting factor here (cl-aca076cc6227 confirms private-subnet instances simply have no direct IGW route by default) -- the route table target is what has to change.", "claim_ids": ["cl-72f23043dbe8", "cl-0c11ada875af", "cl-9376cd025140", "cl-aca076cc6227"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The VPC also already runs an unrelated internet-facing Application Load Balancer with a multi-AZ Auto Scaling web tier and a Multi-AZ RDS database in separate subnets, all working correctly, and the private instance in question has an extra EBS data volume attached for local log storage. None of this changes what the instance itself needs for outbound patch access.", "prompt": "Same private-subnet instance as before -- no public or Elastic IP, security group already allows all outbound traffic, subnet route table has only the local route, instance needs outbound internet access for OS patches but must never be reachable from the internet. The VPC also happens to host an unrelated internet-facing ALB with a multi-AZ Auto Scaling web tier and a Multi-AZ RDS instance, all already healthy, and this particular instance has an extra EBS volume attached for log storage. What should be added, and where, for this instance's patch access?", "expected_answer": ["Deploy a NAT gateway in a public subnet of the VPC (a subnet whose own route table sends 0.0.0.0/0 to an attached internet gateway), then add a 0.0.0.0/0 route to the private subnet's route table that targets that NAT gateway."], "reasoning": "The ALB spanning multiple AZs, the Auto Scaling web tier, and the Multi-AZ RDS instance are each already redundant on their own and don't interact with this particular private subnet's routing (cl-9e7c6e9ed7b5, cl-5b3aa5da8e2c) -- they are unrelated to whether this one subnet has a path to the internet. An attached EBS volume is a storage detail with no bearing on network routing. The actual fix is unchanged from the base case: a NAT gateway in a public subnet plus a 0.0.0.0/0 route in this private subnet's route table (cl-472b0f092a56), which again only grants outbound access, not inbound (cl-9376cd025140).", "distractor_analysis": "It's tempting to think that because the VPC already has an internet gateway for the ALB's public subnet, this private instance automatically benefits -- it doesn't, because private-subnet instances have no direct route to the IGW regardless of what else exists elsewhere in the VPC (cl-aca076cc6227); the fix must be added to this subnet's own route table.", "claim_ids": ["cl-9e7c6e9ed7b5", "cl-5b3aa5da8e2c", "cl-472b0f092a56", "cl-9376cd025140", "cl-aca076cc6227"], "difficulty": "easy", "importance": "low"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate proposes skipping the NAT gateway entirely, arguing that because the security group already allows all outbound traffic and security groups are stateful, the subnet's existing local route is enough -- the instance should just be left as-is.", "prompt": "Same private-subnet instance and requirement as before. A teammate objects to adding a NAT gateway, arguing: 'The security group already allows all outbound traffic, and security groups are stateful, so return traffic is automatically allowed -- the local route already in the route table should be enough to reach the internet.' Is the teammate right? What, if anything, actually needs to be added?", "expected_answer": ["Deploy a NAT gateway in a public subnet of the VPC (a subnet whose own route table sends 0.0.0.0/0 to an attached internet gateway), then add a 0.0.0.0/0 route to the private subnet's route table that targets that NAT gateway."], "reasoning": "The teammate is wrong. The subnet's local route only covers the VPC's own CIDR range (cl-efd273866364) -- it has no entry at all for internet-bound destinations, so there is literally no outbound path regardless of what the security group permits (cl-2a70b75038dd). A security group's allow-all-outbound rule, and its statefulness for replies, can only act on traffic that already has somewhere to go via the route table (cl-00b6906b640c); it cannot substitute for a missing route. The fix is unchanged: a NAT gateway in a public subnet plus a 0.0.0.0/0 route in this subnet's route table (cl-472b0f092a56), which also keeps the instance unreachable from the internet (cl-9376cd025140).", "distractor_analysis": "The teammate's argument conflates two independent layers: statefulness governs whether reply traffic needs its own rule once a connection is already permitted and routed; it says nothing about whether a route to the destination exists in the first place. Without a default route in the route table, the allow-all-outbound security group rule has nothing to act on.", "claim_ids": ["cl-efd273866364", "cl-2a70b75038dd", "cl-00b6906b640c", "cl-472b0f092a56", "cl-9376cd025140"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The resource needing outbound-only internet access is now an Amazon ECS task running on Fargate in the same private subnet, launched to pull an updated image from a public container registry, rather than a standalone EC2 instance patching its OS; it must likewise stay unreachable from the internet.", "prompt": "A private subnet with only the local route in its route table now also runs an ECS Fargate task (instead of, or alongside, the EC2 instance). The task needs outbound access to pull an image update from a public container registry, and it must not be reachable from the internet. Applying the same reasoning as before, what should be added, and where?", "expected_answer": ["Deploy a NAT gateway in a public subnet of the VPC (a subnet whose own route table sends 0.0.0.0/0 to an attached internet gateway), then add a 0.0.0.0/0 route to the private subnet's route table that targets that NAT gateway."], "reasoning": "The reasoning is independent of what kind of compute sits on the network interface -- EC2 instance or Fargate task -- because routing happens at the subnet/route-table level. The task's network interface is still in a subnet whose only route is the local one for the VPC CIDR, so it has no path to the internet, the same gap private-subnet instances face by default (cl-aca076cc6227). The same NAT gateway plus default-route fix applies: it gives any resource in that subnet outbound-initiated access to the registry while a NAT gateway still never admits unsolicited inbound connections (cl-472b0f092a56, cl-9376cd025140).", "distractor_analysis": "It would be a mistake to assume Fargate tasks need a different networking primitive (such as an interface VPC endpoint) just because they aren't EC2 instances -- a public container registry isn't a private AWS service reachable via PrivateLink, so what's needed is the same general-purpose outbound path a NAT gateway provides, exactly as for the EC2 case.", "claim_ids": ["cl-aca076cc6227", "cl-472b0f092a56", "cl-9376cd025140"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "Two claims from q318 contradict each other. cl-3266ee51ea49 says that behind a Classic or Application Load Balancer, web-server security groups see the load balancer's IP as the source, not the client's. cl-53bf427147f8 says that limiting the web-server security groups to customers' predefined IPs is a valid way to restrict the app to those customers. If the first claim is true, a web-server security group allowlist of customer IPs would block all ELB-forwarded traffic. Both are marked conflicted, and the slice does not resolve which is right.", "related_entity_ids": ["cl-3266ee51ea49", "cl-53bf427147f8"]}, {"type": "contradiction", "severity": "high", "description": "The q219 sources disagree. The recorded community vote (100%) favors routing only the private subnet's own CIDR to the NAT instance (cl-cdb651dcc979). The source passage and the extracted rule say 0.0.0.0/0 must target the NAT instance (cl-a979a3bd15dc). cl-36cb3babd86b is nonetheless marked 'supported' even though it rejects the option the vote chose. This is unresolved and should be triaged, not settled by picking a side.", "related_entity_ids": ["cl-cdb651dcc979", "cl-a979a3bd15dc", "cl-36cb3babd86b"]}, {"type": "contradiction", "severity": "medium", "description": "The q209 sources disagree about deleting a VPC that has an attached virtual private gateway. The boxed answer says the console automatically detaches the VGW. The 100% community vote and the hands-on testing evidence cited in cl-250d0bccaf9e conflict with that. Even so, cl-5854dd30cec3 ('the gateway is detached, not deleted') is marked supported with high confidence, and cl-379c18128cc8 tries to cover both readings at once.", "related_entity_ids": ["cl-379c18128cc8", "cl-5854dd30cec3", "cl-250d0bccaf9e"]}, {"type": "contradiction", "severity": "medium", "description": "The q218 sources disagree: no formatted vote exists, and the comment thread is split on whether the boxed route-table answer is correct (cl-6dc9ea4fee43). Yet cl-b77fa9d12a40, which states the boxed answer's main-route-table entries as valid, is marked 'supported'. That answer routes 0.0.0.0/0 to a NAT instance for a VPN-only subnet.", "related_entity_ids": ["cl-b77fa9d12a40", "cl-b3f6e470e1d0", "cl-6dc9ea4fee43"]}, {"type": "contradiction", "severity": "medium", "description": "The q006 community vote is split roughly 50/50 between NAT Gateway + IGW and IGW + VGW as the two components that give a VPC external connectivity (cl-b6c2131aac4b). The slice states both readings in cl-7e865b64ebfe and cl-a19c0d32ed5b but does not settle which pair the question intends.", "related_entity_ids": ["cl-b6c2131aac4b", "cl-7e865b64ebfe", "cl-a19c0d32ed5b"]}, {"type": "contradiction", "severity": "medium", "description": "The q208 community vote is split evenly on the required DBSecGrp entry (cl-bf73acabcf15). cl-8d4af0d3df4f states without conditions that an inbound rule from the source security group is enough. That clashes with cl-74b69e00d2e9, which says the source security group must also allow the traffic outbound. The two only agree under the default allow-all outbound condition, which cl-bb387d494158 adds but cl-8d4af0d3df4f leaves out.", "related_entity_ids": ["cl-8d4af0d3df4f", "cl-bf73acabcf15", "cl-74b69e00d2e9", "cl-bb387d494158", "cl-effe894599cd"]}, {"type": "contradiction", "severity": "medium", "description": "For q547, the boxed answer names IAM PassRole as a cause of the wait-condition timeout, while the unanimous community vote names missing outbound internet access. cl-380c63dbc203 calls PassRole unrelated, which overrides the boxed answer. The dispute is recorded only inside a claim condition and is not flagged for triage.", "related_entity_ids": ["cl-d7cd2957fbb8", "cl-380c63dbc203", "cl-bd067efbeffc"]}, {"type": "contradiction", "severity": "medium", "description": "For q593, the boxed answer blames the template needing an update, while the unanimous community vote blames the default limit of 5 VPCs per Region. cl-078a61473505 calls the boxed answer 'not a real failure mode'. The dispute appears only as a claim condition on cl-66948dfc1be7 and is unresolved.", "related_entity_ids": ["cl-66948dfc1be7", "cl-078a61473505"]}, {"type": "contradiction", "severity": "medium", "description": "For q540, cl-803786ac547e says that rejecting AWS Organizations member accounts (option B) is wrong, which means the source's keyed answer and the extracted reasoning disagree. cl-b7914823fb7d (one VPC per customer does not isolate billing) is also conflicted. Which answer q540 actually supports is still open.", "related_entity_ids": ["cl-b7914823fb7d", "cl-803786ac547e"]}, {"type": "contradiction", "severity": "medium", "description": "The q196 claims disagree on Elastic IP quotas. cl-d7a96012e1fe says EC2-Classic and VPC had separate quotas of 5 each. cl-d083b203db1a says the community is genuinely split on whether 5 was one combined cap. The premise is also stale, because EC2-Classic was retired in August 2023.", "related_entity_ids": ["cl-d7a96012e1fe", "cl-d083b203db1a", "cl-5c6b512f7aec"]}, {"type": "ambiguity", "severity": "medium", "description": "For q236, commenters flagged that none of the listed choices is strictly required (cl-84250b473555), and cl-c332446f5399 recasts the keyed outbound rule as a best-practice convention. The question's intended answer is unclear, so neither claim should be taught as the exam answer until it is triaged.", "related_entity_ids": ["cl-c332446f5399", "cl-84250b473555", "cl-44845599197f"]}, {"type": "contradiction", "severity": "low", "description": "cl-c1bbd2a876be implies the main route table's VPC-wide route is a user-chosen destination, and that a route scoped to one /24 would allow only intra-subnet traffic. That conflicts with cl-efd273866364 and cl-e89a27559660, which say a non-removable 'local' route for the full VPC CIDR is always present. Traffic within a subnet also does not depend on a route entry.", "related_entity_ids": ["cl-c1bbd2a876be", "cl-efd273866364", "cl-e89a27559660"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model's invariants, limits, and cues, and the contrast set's exceptions and matrix, rely on 14 claims whose status is 'conflicted' and present them as settled fact without noting any dispute. In the mental model these are cl-907fbccb96c3, cl-96ffd4b64e4b, cl-f89cfe15038e, cl-ac3e08d0cd3c, cl-72fe8c04ef87, cl-062d0b8b1594, cl-467922fe3c44, cl-8024a6cb4612 and cl-6910d2c28cce. In the contrast set they are cl-45bc5f89cdb8, cl-c66dc66e7288, cl-7322a6e67945, cl-2601d0f8c1d5 and cl-44ebb81d065b. Examples: the NACL ephemeral-port exception, the default-NACL-allows-all exception, the NAT-instance source/destination-check limit, and the single-NAT-gateway AZ-outage limit.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "aws-sysops-service-vpc--cs-1", "cl-907fbccb96c3", "cl-96ffd4b64e4b", "cl-f89cfe15038e", "cl-ac3e08d0cd3c", "cl-72fe8c04ef87", "cl-062d0b8b1594", "cl-467922fe3c44", "cl-8024a6cb4612", "cl-6910d2c28cce", "cl-45bc5f89cdb8", "cl-c66dc66e7288", "cl-7322a6e67945", "cl-2601d0f8c1d5", "cl-44ebb81d065b"]}, {"type": "stale-risk", "severity": "low", "description": "The mental model says 'a destination overlapping the VPC CIDR always stays local', and cl-e89a27559660 and cl-203f4ba3afac treat the local route as always taking precedence. AWS now allows routes more specific than the local route (subnet CIDRs targeting middlebox ENIs or endpoints), so 'always' is stale-prone. cl-203f4ba3afac also says such traffic is 'dropped', when it is actually delivered within the VPC.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "cl-e89a27559660", "cl-203f4ba3afac"]}, {"type": "stale-risk", "severity": "low", "description": "cl-bb0c9fd326b4 introduces a 'regional NAT gateway (regional availability mode)' that spans AZs. It is conflicted and is a recent, rarely tested feature. The mental model's limit about zonal NAT gateways is correctly scoped, but the existence of a regional mode undercuts the cue that a single NAT gateway is always an AZ single point of failure (cl-467922fe3c44).", "related_entity_ids": ["cl-bb0c9fd326b4", "cl-467922fe3c44", "aws-sysops-service-vpc--m-1"]}, {"type": "unsupported-generation", "severity": "low", "description": "Some synthesis content is not backed by any claim in the slice: the DynamoDB gateway endpoint in the mental-model limits, and 'One per subnet' for NACL multiple attachments in the contrast matrix. Both are accurate AWS facts but are not traceable to the cited source questions.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "aws-sysops-service-vpc--cs-1"]}, {"type": "ambiguity", "severity": "low", "description": "Two claims about what a VPC subnet gives a new instance by default are in tension. cl-feb2d6091c7e (q060) says an instance in a default subnet automatically gets a public IP and internet reachability. cl-50aa3dc9bd8a (q073) says an instance in 'a VPC subnet with only default settings' gets only a private IP, with nothing else guaranteed. The q073 wording does not say whether it covers default subnets, so the two can read as contradictory. cl-395a5bd32c89 reconciles them but is not referenced.", "related_entity_ids": ["cl-feb2d6091c7e", "cl-50aa3dc9bd8a", "cl-395a5bd32c89"]}, {"type": "quality", "severity": "low", "description": "Several 'claims' are metadata about votes or ingestion rather than VPC knowledge. Examples: cl-0c850204c75d (Study Hack's ingestion policy for disputed questions), cl-250d0bccaf9e, cl-6dc9ea4fee43 and cl-cdb651dcc979. The q889 dispute flagged by cl-0c850204c75d also does not say which q889 answer (cl-c20695bbf972, cl-156eaaffce2e, cl-d4831f197b79) the vote contradicts.", "related_entity_ids": ["cl-0c850204c75d", "cl-250d0bccaf9e", "cl-6dc9ea4fee43", "cl-cdb651dcc979", "cl-c20695bbf972", "cl-156eaaffce2e", "cl-d4831f197b79"]}, {"type": "quality", "severity": "low", "description": "The contrast set's first exception compares the wrong setups. It describes a NACL that allows outbound only on port 80, then says 'the same deny all outbound setup' would not break replies on a security group. Those are different configurations, and cl-39e14ec7f962 notes that removing all outbound security group rules still blocks new outbound connections.", "related_entity_ids": ["aws-sysops-service-vpc--cs-1", "cl-2601d0f8c1d5", "cl-079f0a682262", "cl-39e14ec7f962"]}, {"type": "quality", "severity": "low", "description": "Two claims from q016 make the same assertion but carry different statuses: an ELB spanning 2 AZs needs one public subnet per AZ. cl-33fbf0096616 is marked supported and cl-639585759f32 is marked conflicted. One of the two statuses is wrong.", "related_entity_ids": ["cl-33fbf0096616", "cl-639585759f32"]}], "sourceQuestionCount": 101}], "sources": {"kind": "locked", "file": "aws-sysops-service-vpc-87sg.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        ${raw(citationsHtml(cs.claim_ids))}
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
        <div class="item-meta">${raw(metaBadges.join(''))}</div>
        ${raw(changedCondition)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence <span class="muted">(optional)</span></legend>
          <div class="segmented">${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"><span>${c}</span></label>`; }).join(''))}</div>
        </fieldset>
        <div class="actions"><button id="reveal-practice-btn" type="button">Reveal answer</button></div>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
