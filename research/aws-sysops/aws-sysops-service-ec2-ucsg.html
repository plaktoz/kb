isks prematurely killing batch jobs whose runtime legitimately varies and can exceed that fixed cutoff.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0c9765cc3bd2", "source_question_ids": ["awssysops-p1-q293"], "statement": "Converting an instance store-backed AMI to an EBS-backed AMI, by attaching an EBS volume and unbundling the AMI data into it, is a supported procedure for Linux instances.", "status": "supported"}, {"claim_type": "exception", "conditions": ["instance is Windows-based"], "confidence": "high", "id": "cl-b7203e9cbabc", "source_question_ids": ["awssysops-p1-q293"], "statement": "AWS does not support converting a Windows instance store-backed AMI to an EBS-backed AMI, even though the equivalent conversion is supported for Linux instances.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-072396881622", "source_question_ids": ["awssysops-p1-q296"], "statement": "Setting the DisableApiTermination attribute on an EC2 instance blocks instance termination via the console, CLI, and API alike, protecting against accidental termination.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c38cb5d25098", "source_question_ids": ["awssysops-p1-q296"], "statement": "The InstanceInitiatedShutdownBehavior attribute controls what happens when an OS-level shutdown command is issued from within an instance (stop vs. terminate); it does not protect against an explicit terminate action initiated from outside the instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8e226331aca4", "source_question_ids": ["awssysops-p1-q296"], "statement": "There is no EC2 attribute called a 'Deletion termination flag'.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-64a7f15e9725", "source_question_ids": ["awssysops-p1-q299"], "statement": "When creating an instance store-backed AMI from a running instance that has an additional instance store volume attached, the resulting AMI's block device mapping includes that additional volume, not just the root volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-21a836d9dd3a", "source_question_ids": ["awssysops-p1-q299"], "statement": "Instances launched from an instance store-backed AMI whose block device mapping includes an additional volume automatically inherit that same block device mapping.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-c17882120a9e", "source_question_ids": ["awssysops-p2-q301"], "statement": "EC2 termination protection only blocks termination requests made via the console, CLI, or API; it does not override an instance's own InstanceInitiatedShutdownBehavior setting.", "status": "supported"}, {"claim_type": "fact", "conditions": ["InstanceInitiatedShutdownBehavior set to terminate", "termination protection enabled"], "confidence": "high", "id": "cl-d93769deff2a", "source_question_ids": ["awssysops-p2-q301"], "statement": "If InstanceInitiatedShutdownBehavior is set to 'terminate' and the user shuts down the OS from within an instance that also has termination protection enabled, the instance still terminates.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-c41364b32c0d", "source_question_ids": ["awssysops-p2-q301"], "statement": "EC2 termination protection and the InstanceInitiatedShutdownBehavior setting are independent settings that can coexist in any combination; OS-level shutdown always remains possible regardless of whether termination protection is enabled.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3ddda627a681", "source_question_ids": ["awssysops-p2-q302"], "statement": "'EBS-optimized' is the actual EC2 launch configuration/feature name that provisions a dedicated, guaranteed-throughput connection between an instance and its attached EBS volumes, separate from the instance's general network traffic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a94cb0b70bb0", "source_question_ids": ["awssysops-p2-q302"], "statement": "'EBS dedicated' and 'EBS enhanced' are real AWS EC2 launch configuration terms for dedicated EC2-to-EBS throughput.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is Windows-based"], "confidence": "high", "id": "cl-46b07fc131f5", "source_question_ids": ["awssysops-p2-q303"], "statement": "For a Windows EC2 instance, the Instance console output feature in the AWS console displays the last three system event log errors, not the full boot log.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is Linux-based"], "confidence": "medium", "id": "cl-6c21538c801c", "source_question_ids": ["awssysops-p2-q303"], "statement": "Linux EC2 instances' console output shows all event logs since instance boot, a broader scope than the last-three-errors scope shown for Windows instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0931c60a9379", "source_question_ids": ["awssysops-p2-q306"], "statement": "An instance store-backed (S3-based) AMI's root volume is ephemeral instance store, not EBS; when the instance terminates, the root volume's data is permanently lost with no automatic snapshot or preservation.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-390fc04406eb", "source_question_ids": ["awssysops-p2-q306"], "statement": "A terminated EC2 instance cannot be restarted (restart applies to the stop/start operation, which is distinct from terminate), so data on an instance-store root volume cannot become available again after termination.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0b69818049d5", "source_question_ids": ["awssysops-p2-q308"], "statement": "Placement groups cluster EC2 instances physically close together within a single Availability Zone specifically to minimize inter-node network latency and maximize throughput between them.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d879bd7287c7", "source_question_ids": ["awssysops-p2-q308"], "statement": "Spreading EC2 instances across multiple Availability Zones increases inter-node latency rather than reducing it, the opposite of what a low-latency compute cluster requires.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-24f4063e93a4", "source_question_ids": ["awssysops-p2-q308"], "statement": "AWS Direct Connect addresses on-premises-to-AWS connectivity and does not address inter-instance latency within a compute cluster.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b1e4dbacabbd", "source_question_ids": ["awssysops-p2-q319"], "statement": "The EC2 instance metadata service, queried via HTTP from inside the instance (e.g. the public-ipv4 and local-ipv4 paths), is the AWS-native way for software running on an instance to discover its own public and private IP addresses.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-089675e0a600", "source_question_ids": ["awssysops-p2-q319"], "statement": "EC2 instance userdata is static, user-supplied bootstrap script/config passed at launch time, and is not a source of dynamic networking information such as the instance's current IP addresses.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-cf4cd37aaa98", "source_question_ids": ["awssysops-p2-q319"], "statement": "Running ipconfig or ifconfig from within an instance's own OS can reveal only the private IP as seen by that OS-level network interface, not the public IP, which is handled via NAT/mapping outside the instance's OS.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-4607759c0a3f", "source_question_ids": ["awssysops-p2-q320"], "statement": "Route 53 Latency Based Routing optimizes for the lowest-latency region and can route a user to a region outside their jurisdiction whenever that region happens to be faster, which can violate a strict data-residency requirement that data must not leave a specific jurisdiction such as the EU or the US.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-fdd38145e5f8", "source_question_ids": ["awssysops-p2-q320"], "statement": "A third-party geolocation-based redirection mechanism that determines a user's actual jurisdiction and routes them to the matching AWS region is a more deterministic way to satisfy a strict 'data must not leave the jurisdiction' compliance requirement than latency-based routing.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e70c7ddeeb5a", "source_question_ids": ["awssysops-p2-q320"], "statement": "Running EC2 instances only within multiple Availability Zones of a single AWS Region cannot satisfy a requirement to keep EU customer data in the EU and US customer data in the US, because a single Region cannot provide separate EU and US jurisdictions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-85f91e8f66bf", "source_question_ids": ["awssysops-p2-q320"], "statement": "AWS Route 53 Geolocation Routing Policy, distinct from Latency Based Routing, is the AWS-native mechanism for routing users to a region based on their geographic/jurisdictional location.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2bbd19b17318", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, patch management of the guest operating system on an EC2 instance is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-265b902de8ca", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, choosing whether to encrypt EBS volumes is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6cd4c4a80e86", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, lifecycle management of IAM credentials is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d9a4d865fe90", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, configuring Security Group and Network ACL settings is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-a2b3d8260ae9", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, controlling physical access to compute resources and underlying hardware is AWS's responsibility, not the customer's.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d8bb0a066c77", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, decommissioning retired physical storage devices is AWS's responsibility, not the customer's, since customers never have physical or hardware-level access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8fabd468b5d0", "source_question_ids": ["awssysops-p2-q323"], "statement": "An EC2 instance's tenancy attribute (default vs. dedicated) cannot be changed in place on a running instance after launch.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-154d1ff0eef4", "source_question_ids": ["awssysops-p2-q323"], "statement": "To move a single existing EC2 instance to dedicated-tenancy hardware with minimal impact on the rest of an application, the supported process is: stop the instance, create an AMI from it, launch a new instance from that AMI with tenancy=dedicated, then terminate the original instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-220bd1e9a082", "source_question_ids": ["awssysops-p2-q323"], "statement": "Migrating an entire VPC to a new VPC configured with tenancy=dedicated affects every instance in that VPC, which is unnecessary disruption when only a single instance needs to move to dedicated tenancy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2b4193cff89a", "source_question_ids": ["awssysops-p2-q330"], "statement": "An egress-only Internet Gateway is attached at the VPC level, but the route directing IPv6 traffic to that gateway is added to a specific subnet's route table, since every subnet in a VPC has its own associated route table.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0b88c9554d6c", "source_question_ids": ["awssysops-p2-q330"], "statement": "IPv6 addresses are globally unique and therefore inherently public/routable by design, regardless of which subnet an instance is placed in.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-11b818ed654b", "source_question_ids": ["awssysops-p2-q330"], "statement": "A security group that blocks inbound IPv6 traffic directly prevents unsolicited inbound access to an instance with a public IPv6 address, independent of subnet placement or egress-only gateway configuration.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-b0bcae6e1b6d", "source_question_ids": ["awssysops-p2-q330"], "statement": "VPC route tables are associated per-subnet rather than solely at the VPC level, since each subnet in a VPC has its own associated route table.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d0967fc4bf8e", "source_question_ids": ["awssysops-p2-q331"], "statement": "AWS CloudTrail logs showing API calls and Amazon EC2 instance system logs are both generated by and fully within a customer's own control and visibility, making them evidence the customer -- not AWS -- would provide to a compliance auditor.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-13e3d519465d", "source_question_ids": ["awssysops-p2-q331"], "statement": "AWS is responsible for decommissioning and destroying physical storage media, and customers never have physical access to that media, so storage device destruction records are AWS's responsibility to provide to an auditor, not the customer's.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-be7847a337bb", "source_question_ids": ["awssysops-p2-q331"], "statement": "Physical data center access logs and Xen Hypervisor system logs are AWS's responsibility under the Shared Responsibility Model, since customers have no access to the physical facility or the underlying hypervisor.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-61564b0e94ae", "source_question_ids": ["awssysops-p2-q334"], "statement": "EC2 instance operating system updates are the customer's responsibility under the AWS Shared Responsibility Model, since the customer controls the guest OS.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-723c4219b128", "source_question_ids": ["awssysops-p2-q334"], "statement": "IAM user password policy configuration is the customer's responsibility under the AWS Shared Responsibility Model, since the customer controls their own IAM configuration.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-57118cc168c6", "source_question_ids": ["awssysops-p2-q334"], "statement": "AWS API endpoint SSL certificates are AWS's own responsibility to manage and rotate, not the customer's.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-69d423daef1c", "source_question_ids": ["awssysops-p2-q334"], "statement": "EBS encryption-at-rest algorithms and the underlying AWS Hypervisor software are implemented and maintained by AWS itself, even though the customer chooses whether to enable EBS encryption.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-00bc5b927548", "source_question_ids": ["awssysops-p2-q335"], "statement": "EC2 auto-recovery requires that the instance have only EBS volumes; instances with instance store (ephemeral) root volumes are not eligible for auto-recovery.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-a132896519e9", "source_question_ids": ["awssysops-p2-q335"], "statement": "EC2 auto-recovery supports an instance running with either default (shared) tenancy or dedicated tenancy -- the two tenancy states are each individually sufficient, and are mutually exclusive for any single instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c2cd14a10758", "source_question_ids": ["awssysops-p2-q335"], "statement": "EC2 auto-recovery works across a broad range of supported instance types and is not narrowly limited to the d2, i2, or i3 instance families.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9ff7aca5524b", "source_question_ids": ["awssysops-p2-q344"], "statement": "Amazon EC2 supports exactly two types of block devices: instance store volumes and EBS volumes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4053d59de53f", "source_question_ids": ["awssysops-p2-q344"], "statement": "Instance store volumes are storage physically attached to the host, whereas EBS volumes are network-attached remote storage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4be19c2b06c3", "source_question_ids": ["awssysops-p2-q344"], "statement": "The list of EBS volume types (General Purpose SSD, Provisioned IOPS SSD, Throughput Optimized HDD, Cold HDD, Magnetic) is a sub-classification within the single 'EBS volumes' block device type, not itself a count of EC2's block device types.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b8eb29bc97d1", "source_question_ids": ["awssysops-p2-q351"], "statement": "Since the October 2017 EC2 billing change, most instances running Linux are billed per-second, with a one-minute minimum.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-276714677a25", "source_question_ids": ["awssysops-p2-q351"], "statement": "Windows instances and other AMIs with per-hour software billing remain billed hourly even after the October 2017 EC2 billing change.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-860a95b05e99", "source_question_ids": ["awssysops-p2-q351"], "statement": "Whether an EC2 instance is billed per-second or per-hour depends on both the AMI's operating system and the instance type / Dedicated Host exception.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-02fd6c0fbd79", "source_question_ids": ["awssysops-p2-q351"], "statement": "Billing compute capacity by the day with hours billed in proportion describes the old, pre-October-2017 full-hour-rounding EC2 billing model, not the current model.", "status": "supported"}, {"claim_type": "default", "conditions": ["applies to the instance's root EBS volume specifically"], "confidence": "high", "id": "cl-c243306cee99", "source_question_ids": ["awssysops-p2-q352"], "statement": "The 'Delete on Termination' flag is set by default, so unless it is explicitly unset, the volume is deleted along with the instance on termination.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5387764317c1", "source_question_ids": ["awssysops-p2-q352"], "statement": "The DeleteOnTermination attribute is checked per attached EBS volume at instance-termination time to determine whether that volume is preserved or deleted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2d0f4a19f7d5", "source_question_ids": ["awssysops-p2-q352"], "statement": "InstanceInitiatedShutdownBehavior controls whether an OS-level shutdown command stops or terminates the instance; it does not control EBS volume deletion.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c1b73b1bf279", "source_question_ids": ["awssysops-p2-q352"], "statement": "DisableApiTermination is a termination-protection guard that prevents accidental instance termination via the API; it is unrelated to EBS volume deletion handling.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a0585d5e15f6", "source_question_ids": ["awssysops-p2-q356"], "statement": "The AWS Management Console is a web-based graphical user interface for accessing and managing EC2 instances and other AWS services.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3270dc006f60", "source_question_ids": ["awssysops-p2-q360"], "statement": "A security group is a virtual firewall that controls inbound and outbound traffic for one or more EC2 instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-fea576b8b73e", "source_question_ids": ["awssysops-p2-q360"], "statement": "An EC2 instance can have one or more security groups attached, and AWS evaluates the union of all attached groups' rules when deciding whether to permit traffic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-418028d9f30c", "source_question_ids": ["awssysops-p2-q364"], "statement": "The Amazon Linux AMI is a supported and maintained Linux image provided by AWS, updated regularly and bundled with tooling for integration with AWS services such as the AWS CLI, EC2 API/AMI tools, Boto, and Elastic Load Balancing tools.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-07e4a52ce41f", "source_question_ids": ["awssysops-p2-q371"], "statement": "Spot Instances let users take advantage of unused/excess EC2 capacity at prices below standard on-demand rates.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-dacf82662b38", "source_question_ids": ["awssysops-p2-q371"], "statement": "Spot Instances are best suited to time-flexible, interruption-tolerant, short-duration jobs rather than long-duration, highly transactional applications.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7089199ade53", "source_question_ids": ["awssysops-p2-q375"], "statement": "Before/while launching an EC2 instance, a user should plan the region, the instance type, and the AMI's OS.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fa8029d etirement"], "confidence": "high", "id": "cl-e0120dd2e5c9", "source_question_ids": ["awssysops-p3-1-q787", "awssysops-p3-1-q811", "awssysops-p3-1-q833"], "statement": "A stop/start of an EBS-backed EC2 instance can resolve system-check failures or scheduled hardware maintenance/retirement issues caused by an underlying problem on the current host, since it moves the instance to new hardware.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1e8056681969", "source_question_ids": ["awssysops-p3-1-q787", "awssysops-p3-1-q833"], "statement": "A simple reboot of an EC2 instance keeps it on the same physical host, so it does not fix a hardware-level system-check failure or a degraded-host condition.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d426353870ae", "source_question_ids": ["awssysops-p3-1-q787"], "statement": "Terminating and relaunching an EC2 instance is a more drastic, data-loss-risking action than a stop/start, and is not the first remediation step to try for a failing system check.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d5ba2963024b", "source_question_ids": ["awssysops-p3-1-q787"], "statement": "Reviewing AWS CloudTrail logs can help investigate configuration changes but does not address an underlying hardware fault behind a failing EC2 system check.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance is EBS-backed", "scheduled maintenance/retirement notification received"], "confidence": "high", "id": "cl-1aa534cc9f45", "source_question_ids": ["awssysops-p3-1-q811", "awssysops-p3-1-q833"], "statement": "Proactively stopping and starting an EBS-backed EC2 instance outside business hours, before AWS's scheduled hardware maintenance or retirement, avoids a forced outage during business-critical hours by moving the instance to new hardware on the administrator's own schedule.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2aa826da8bbc", "source_question_ids": ["awssysops-p3-1-q811"], "statement": "A Lambda function that only auto-starts an instance after it is found stopped is a reactive measure and does not proactively move an instance off at-risk hardware before scheduled maintenance causes an outage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ad539408bad4", "source_question_ids": ["awssysops-p3-1-q811"], "statement": "Waiting to create an AMI and relaunch an instance only after the original instance is retired is reactive and would itself cause the outage that proactive remediation is meant to avoid.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7d4407ffabcf", "source_question_ids": ["awssysops-p3-1-q811"], "statement": "Termination protection only prevents accidental termination of an EC2 instance; it has no effect on AWS's scheduled hardware maintenance or retirement process.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1a509cb01135", "source_question_ids": ["awssysops-p3-1-q815"], "statement": "Under the AWS shared responsibility model, AWS manages the health of the underlying physical EC2 host infrastructure, while the customer manages everything running on top of it, including the guest operating system.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPN software is self-managed third-party software on an EC2 instance"], "confidence": "high", "id": "cl-7520b910d39e", "source_question_ids": ["awssysops-p3-1-q815"], "statement": "When a deployment uses self-managed third-party VPN software on an EC2 instance rather than a native AWS-managed VPN service, configuring the VPN's IPsec tunnels and ensuring the availability of both the VPN connection and the EC2 instance are the customer's responsibilities, not AWS's.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b7c411ad5682", "source_question_ids": ["awssysops-p3-1-q818"], "statement": "Dedicated Hosts are the most expensive EC2 pricing option among On-Demand, Reserved, Spot, and Dedicated Hosts, and are aimed at licensing/compliance needs rather than cost savings.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b41de37affae", "source_question_ids": ["awssysops-p3-1-q818"], "statement": "Reserved Instances offer savings only in exchange for a committed term, with no benefit tied to a workload's tolerance for interruption.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c8071995b1e2", "source_question_ids": ["awssysops-p3-1-q833"], "statement": "Writing a Lambda function to restore a system only after a scheduled retirement occurs is reactive and does not prevent the resulting disruption.", "status": "supported"}, {"claim_type": "fact", "conditions": ["template hardcodes or maps an AMI ID that was only created/copied in the source region"], "confidence": "high", "id": "cl-98b564957b6c", "source_question_ids": ["awssysops-p3-1-q843"], "statement": "AMI IDs are region-specific, so a CloudFormation template that hardcodes an AMI ID valid in one AWS region will fail to find that AMI and will fail to create the resource when the same template is deployed in a different region.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application AMI is a fully-baked, custom AMI that only exists in the source region"], "confidence": "high", "id": "cl-c8c4c783f9d1", "source_question_ids": ["awssysops-p3-1-q843"], "statement": "To provision an application that uses fully-baked AMIs into additional AWS regions, the AMI must first be copied into each target region (e.g., via aws ec2 copy-image), and the CloudFormation template's mapping section must be updated with the resulting per-region AMI IDs before the template can deploy successfully in those regions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7deca60a763b", "source_question_ids": ["awssysops-p3-1-q843"], "statement": "Creating a snapshot of a running instance and copying that snapshot to other regions to build a new AMI there is an unnecessary extra step, since AMIs themselves can be copied directly cross-region.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6d2b4a59fb3f", "source_question_ids": ["awssysops-p3-1-q843"], "statement": "Updating an Auto Scaling group configuration and the existing CloudFormation stack in one region does not provision resources in additional regions, because Auto Scaling groups and CloudFormation stacks are themselves region-scoped resources.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-f2235069c235", "source_question_ids": ["awssysops-p3-1-q843"], "statement": "For the question about provisioning an application across four additional regions, the source's boxed correct answer is to simply run the existing us-east-1 template unmodified in the new regions based on its prior success, but community vote is unanimous for first copying the AMI to each region and updating the template's mapping instead, since the unmodified template would fail on the region-specific AMI reference; the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["EC2 and Aurora are in different subnets/security groups"], "confidence": "high", "id": "cl-9d43a1145f6d", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "To let EC2 instances connect to an Aurora database over MySQL (port 3306), the inbound rule must be added on the Aurora security group, allowing TCP 3306 from the EC2 instances' security group as the traffic source.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-fa5771e20413", "source_question_ids": ["awssysops-p3-1-q851", "awssysops-p3-1-q880"], "statement": "Security groups are stateful, so only the resource being connected to needs an inbound allow rule for the relevant port; the connecting resource's outbound side and the target's own outbound side need no changes for the connection to succeed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9e68c39f9680", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Adding a new outbound security group rule has no effect on connectivity when an outbound rule for all protocols, all ports, to 0.0.0.0/0 already exists, since that traffic was already fully permitted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3983ee9074b2", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Adding an inbound TCP rule for the MySQL port on the EC2 instances' own security group does not fix EC2-to-Aurora connectivity, because the actual block is on the Aurora side's inbound rules.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["instance is acting as a NAT instance"], "confidence": "high", "id": "cl-8024a6cb4612", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "A NAT instance must have source/destination checks disabled on its network interface, or it will silently drop traffic it is forwarding on behalf of other instances in the private subnet.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-0d4593509e23", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "EC2 instances have the source/destination check enabled by default, which blocks an instance from forwarding traffic whose source or destination is not itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6da2e2e26727", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "Assigning Elastic IP addresses to private instances and routing them directly to an internet gateway gives those instances direct public internet reachability, which violates a requirement that instances must not be reachable from the public internet.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-92a9a822e8ec", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "AWS WAF is a web application firewall and has no role in fixing NAT instance traffic forwarding.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3beedeec6feb", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "Restarting (stop/start) a NAT instance so it launches on a different host does not fix a disabled source/destination check misconfiguration.", "status": "supported"}, {"claim_type": "rule", "conditions": ["continuous/always-on usage"], "confidence": "high", "id": "cl-5c23b92778a0", "source_question_ids": ["awssysops-p3-1-q863"], "statement": "Reserved Instances are the most cost-effective purchasing option for compute nodes that run continuously (e.g., 24 hours a day).", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["intermittent/short-duration daily usage"], "confidence": "high", "id": "cl-89b7891ec63b", "source_question_ids": ["awssysops-p3-1-q863"], "statement": "Spot Instances with an On-Demand fallback are the most cost-effective option for worker nodes with intermittent, short daily usage patterns.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-22556ccfdd57", "source_question_ids": ["awssysops-p3-1-q863"], "statement": "Using Reserved Instances for worker nodes that only run about 4 hours a day means paying for a reservation that goes unused roughly 20 hours a day.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-06cf99d7bff6", "source_question_ids": ["awssysops-p3-1-q863"], "statement": "Using Spot Instances for always-needed control nodes risks the nodes being interrupted or reclaimed, defeating their continuous-availability requirement.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-08c44a883f15", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "EC2 instances automatically publish CPU Utilization to CloudWatch by default, with no monitoring agent installed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c0fc6cf04dc6", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "EC2 instances automatically publish Disk Read Operations to CloudWatch by default, with no monitoring agent installed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b382e090959", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "EC2 instances automatically publish Network Packets In to CloudWatch by default, with no monitoring agent installed.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-1187c51aeb05", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "Memory Utilization is never a default EC2 CloudWatch metric; it requires installing the CloudWatch agent to collect.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2132ecde32d5", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "Network Packets Dropped is not part of EC2's default agentless CloudWatch metric set.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8a1a6dd76114", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "CPU Ready Time is a virtualization-hypervisor-level metric that EC2's default monitoring does not expose at all.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d88500215389", "source_question_ids": ["awssysops-p3-1-q868"], "statement": "On-Demand Capacity Reservations guarantee EC2 capacity in a specific Availability Zone but carry no billing discount; instances are still charged at full On-Demand rates for the entire reservation.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["1-year term", "specific Availability Zone"], "confidence": "high", "id": "cl-7dc3563e9f36", "source_question_ids": ["awssysops-p3-1-q868"], "statement": "Zonal Reserved Instances for a specific instance type in a specific Availability Zone guarantee that capacity while also providing a substantial billing discount (up to 70%+ off On-Demand pricing) for a 1-year commitment.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f16c87a0447a", "source_question_ids": ["awssysops-p3-1-q868"], "statement": "EC2 termination protection only prevents accidental termination of an instance and does nothing to reserve compute capacity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e8e846097304", "source_question_ids": ["awssysops-p3-1-q868"], "statement": "A Spot Fleet offers no capacity guarantee, since Spot capacity can be reclaimed by AWS at any time.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ae973de36c2e", "source_question_ids": ["awssysops-p3-1-q869"], "statement": "EC2 instance limits are enforced per Region (not per Availability Zone), so reaching an account's Regional EC2 limit blocks new instance launches in that Region.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2dceed3ede41", "source_question_ids": ["awssysops-p3-1-q869"], "statement": "Every new EC2 instance requires an available private IP address from its target subnet's IP pool; a subnet with no usable private IP addresses remaining blocks the launch.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5091582552c4", "source_question_ids": ["awssysops-p3-1-q869"], "statement": "An IAM instance profile is attached to an already-running EC2 instance so that instance can call other AWS APIs; it is unrelated to the permissions needed by the caller invoking ec2:RunInstances to launch the instance in the first place.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-18510ed3f3c8", "source_question_ids": ["awssysops-p3-1-q869"], "statement": "An EC2 key pair is only needed to log into an instance after it launches, not for the launch operation itself to succeed.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-098b70bc6fe7", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "A network ACL is stateless and is evaluated independently in each traffic direction, so a misconfigured network ACL rule on a subnet can block traffic like RDP even when the security group is correctly configured.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-976f9b740606", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "A route table missing a route to the internet gateway for a subnet prevents internet-bound reply traffic from leaving that subnet, which can block connections like RDP over the internet.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-71eaac42ac3f", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "Every EC2 instance is automatically assigned a private IP address at launch, so a missing private IP address is never a plausible cause of a connectivity failure.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d90a889728ab", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "Port 22 is used by SSH, not RDP, so a missing inbound rule on port 22 is irrelevant to diagnosing a failed RDP connection to a Windows bastion.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb4e193748c3", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "An EC2 instance's Availability Zone is fixed for the instance's lifetime and cannot be changed, even while the instance is stopped.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-db2f07a45a5d", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "To relocate an EC2 workload to a different Availability Zone, create an Amazon Machine Image (AMI) from the instance, launch a new instance from that AMI in the target Availability Zone, and terminate the original instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-089cbaf7eaed", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "There is no 'copy an instance' operation in EC2; only AMIs and snapshots can be copied.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f2c47d465995", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "There is no AWS CLI command that relocates a running EC2 instance's Availability Zone directly.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-329557271989", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "A cluster placement group packs instances physically close together within a single Availability Zone specifically to minimize inter-instance network latency.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cf4c058d03bb", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "Enhanced networking provides higher packet-per-second performance and lower network jitter/latency at the instance level.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-80cf23c5ba1d", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "Launching instances in different VPCs connected by a VPN tunnel or VPC peering adds network hops between them, working against a lowest-possible-latency goal.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9cf762a8eccc", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "A spread placement group deliberately places instances on distinct underlying hardware to reduce simultaneous failure risk, the opposite of the physical proximity needed for minimizing latency.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3c220afd2a93", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "SSH operates over TCP port 22, so a missing inbound security group rule for port 22 is a common and direct cause of a failed SSH connection to a Linux instance.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-88d73eb16e2d", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 443 (HTTPS) has no bearing on SSH connectivity.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ee10805b491b", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 80 (HTTP) is unrelated to SSH connectivity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-93f4305c1f0a", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 3389 is the Windows remote-desktop (RDP) port and is not applicable to a Linux instance being accessed via SSH.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-ec2--m-1", "title": "EC2 lifecycle actions: what each one keeps and what it resets", "purpose": "Many EC2 questions are really asking which lifecycle action (reboot, stop/start, or terminate) happened, or should happen, and what survives it: the physical host, instance-store data, EBS volumes, IP addresses, Elastic IPs, and billing. Once you know whether the instance kept its host, left it, or stopped existing, you can predict the answer instead of memorizing each case.", "mechanism": "An EC2 instance is a virtual machine on one physical host. Its instance-store disks are physically attached to that host, while EBS volumes are network-attached storage that lives apart from it. A REBOOT only restarts the guest OS. The instance stays in the Running state on the same host, so instance-store data, EBS volumes, private/public IPs, and Elastic IP associations all survive. No new billing period starts, and a host-level hardware fault is still there afterwards. A STOP/START gives the host back to AWS. The instance leaves Running and, on start, is placed on new (possibly different) hardware in the same Availability Zone. That clears an impaired system status check or a host scheduled for retirement, but it wipes instance-store data. EBS volumes survive. A new billing period starts on each start. The instance may also fail to start with InsufficientInstanceCapacity if its AZ has run short of that type. Only EBS-backed instances can be stopped at all. TERMINATE ends the instance permanently. It can never be restarted. Instance-store data and the instance's ENIs are deleted, EBS volumes are deleted when DeleteOnTermination is set (the default), and allocated Elastic IPs stay in the account until you release them.", "predict_prompt": "An EBS-backed instance fails its system status check, and someone suggests rebooting it. Before reading on, predict whether the reboot will fix it, and what a stop/start would do to (a) its instance-store scratch data and (b) its billing.", "invariants": ["A reboot never changes the physical host and never leaves the Running state.", "Instance-store data lasts exactly as long as the instance stays on its current host: it survives a reboot and is lost on stop or terminate.", "EBS volumes survive both reboot and stop/start; on terminate, only the DeleteOnTermination flag decides whether a volume survives.", "An instance's Availability Zone never changes through any lifecycle action. Moving to another AZ means building an AMI and launching a new instance."], "limits": ["Instance-store-backed instances cannot be stopped. Their shutdown behavior cannot be set to Stop, and they are not eligible for auto-recovery.", "On EC2-Classic, a stop/start also released the Elastic IP and assigned new private/public IPs. In a VPC, the Elastic IP stays associated through a stop/start.", "Billing is now per-second with a one-minute minimum rather than per-hour, but the rule that a reboot is free and each start begins a new billing period still holds."], "cues": ["'impaired system status check', 'underlying hardware', 'scheduled retirement/maintenance': the instance must leave its host, so stop/start (EBS-backed).", "'instance-store / ephemeral data must be kept': only a reboot is safe; stop/terminate lose it.", "'is an extra hour billed?': reboot no, stop-then-start yes.", "'restart a terminated instance' or 'change the AZ in place': not possible."], "claim_ids": ["cl-15262084d4bb", "cl-2cce1c0f81c2", "cl-42e08f5754a4", "cl-a639966b7056", "cl-70c53fe7cd89", "cl-5c2181cc1b7a", "cl-0396b1143ba5", "cl-331058959ce8", "cl-315f9959d84c", "cl-d74f92425118", "cl-c1ce14f4584f", "cl-d0a70964a54b", "cl-feb4e5db72dd", "cl-428311650158", "cl-e0120dd2e5c9", "cl-1aa534cc9f45", "cl-f539c6405c7e", "cl-cfaf2be26905", "cl-57201b8b797b", "cl-07f653f62e9e", "cl-1b532f23648f", "cl-189d2329cfe3", "cl-ec096a69646c", "cl-31ffa368c8ec", "cl-c392fcfe9ace", "cl-bb4e193748c3", "cl-4a1c2875f7c8", "cl-e54ce4b5f6d1", "cl-00bc5b927548", "cl-0952f10c9935", "cl-390fc04406eb", "cl-d54e02d33429", "cl-61243774fd8b", "cl-c243306cee99", "cl-5387764317c1"]}, "contrastSet": {"id": "aws-sysops-service-ec2--cs-1", "subjects": ["Reboot", "Stop/Start (EBS-backed)", "Terminate"], "dimensions": ["Physical host", "Instance-store data", "EBS volumes", "IP / Elastic IP", "Billing", "Fixes host-level hardware fault"], "shared_traits": ["None of them changes the instance's Availability Zone.", "None of them releases an allocated Elastic IP from the account."], "matrix": {"Physical host": {"Reboot": "Same host", "Stop/Start (EBS-backed)": "May move to new hardware", "Terminate": "Released; instance is gone"}, "Instance-store data": {"Reboot": "Preserved", "Stop/Start (EBS-backed)": "Lost", "Terminate": "Lost permanently"}, "EBS volumes": {"Reboot": "Untouched", "Stop/Start (EBS-backed)": "Preserved", "Terminate": "Deleted if DeleteOnTermination (default)"}, "IP / Elastic IP": {"Reboot": "IPs and EIP kept", "Stop/Start (EBS-backed)": "VPC: EIP kept; Classic: EIP dropped, new IPs", "Terminate": "ENIs deleted; EIP stays allocated, still billed"}, "Billing": {"Reboot": "No new billing period", "Stop/Start (EBS-backed)": "Each start begins a new period", "Terminate": "Instance charges end"}, "Fixes host-level hardware fault": {"Reboot": "No, same impaired host", "Stop/Start (EBS-backed)": "Yes, standard fix", "Terminate": "Only by replacing the instance; drastic"}}, "decision_rule": "The deciding question is whether the instance has to leave its current physical host. If the problem lives on the host (impaired system status check, degraded hardware, scheduled retirement), choose stop/start. If something must stay tied to the host (instance-store data, staying in Running so no new billing period starts), choose reboot. Choose terminate only when the instance itself should cease to exist.", "boundary_flip": "Take an EBS-backed instance that is unresponsive because of a guest OS hang: a reboot is enough. Change the symptom to an 'impaired' system status check, meaning the host hardware is at fault, and the answer flips to stop/start, because a reboot just restarts on the same broken host. Change the instance to instance-store-backed and stop/start is no longer available at all.", "strongest_distractor_failure": "'Reboot the instance' sounds like the least disruptive fix for a failed system status check. But a reboot keeps the instance on the same impaired host, so the hardware fault is still there. Likewise, a reboot is wrongly assumed to start a new billing hour or wipe instance-store data, when it does neither because the instance never leaves Running or its host.", "exceptions": ["Instance-store-backed instances cannot be stopped, so stop/start is not an option for them. A reboot is still supported and keeps their ephemeral data.", "Terminating and relaunching is a more drastic step that risks data loss, not the first remediation for a failing system check.", "A stop/start can fail with InsufficientInstanceCapacity if the AZ has run short of that instance type."], "claim_ids": ["cl-15262084d4bb", "cl-243ce7da701e", "cl-1e8056681969", "cl-2c34fa92942b", "cl-0396b1143ba5", "cl-331058959ce8", "cl-70c53fe7cd89", "cl-5c2181cc1b7a", "cl-2cce1c0f81c2", "cl-42e08f5754a4", "cl-a639966b7056", "cl-c1ce14f4584f", "cl-428311650158", "cl-e0120dd2e5c9", "cl-d0a70964a54b", "cl-f539c6405c7e", "cl-cfaf2be26905", "cl-07f653f62e9e", "cl-1b532f23648f", "cl-189d2329cfe3", "cl-ec096a69646c", "cl-31ffa368c8ec", "cl-40c2e82c80f8", "cl-c392fcfe9ace", "cl-e54ce4b5f6d1", "cl-787109596c18", "cl-d426353870ae", "cl-0952f10c9935", "cl-390fc04406eb", "cl-d54e02d33429", "cl-61243774fd8b", "cl-6b92c595ea49", "cl-c243306cee99", "cl-bb4e193748c3", "cl-4a1c2875f7c8"]}, "scenarioFamily": {"id": "aws-sysops-service-ec2--sf-1", "canonical": {"prompt": "Your team's EC2 fleet includes a production web server, i-0abc123, that is EBS-backed and was launched normally weeks ago. The AWS EC2 console now shows a failed system status check (status: 'impaired') for this instance, while its instance status check still passes. A teammate proposes simply rebooting the instance to clear the failure. What should you actually do to resolve the impaired system status check, and why would the teammate's reboot suggestion fail?", "expected_answer": ["Stop the instance and then start it again"], "reasoning": "An 'impaired' system status check means AWS has detected an underlying hardware/host problem, distinct from an 'unreachable' instance status check that would point to a guest-OS-level issue. Rebooting only restarts the guest OS on the exact same physical host, so the host-level fault is still present afterward. Because this instance is EBS-backed, stopping it and starting it again gives the host back to AWS and causes AWS to relaunch the instance on different, healthy underlying hardware -- the standard fix for a failed system status check.", "distractor_analysis": "Rebooting looks like the lowest-risk, fastest fix, but a reboot never changes the physical host -- it just restarts the OS in place, so an impaired (hardware-level) status check is still failing afterward. Rebooting is the right fix for a guest-OS hang, not for a host hardware fault.", "claim_ids": ["cl-d74f92425118", "cl-c1ce14f4584f", "cl-243ce7da701e", "cl-428311650158", "cl-e0120dd2e5c9", "cl-1e8056681969"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The instance is instance-store-backed (launched from an S3-based instance-store AMI) instead of EBS-backed, but still shows the same impaired system status check.", "prompt": "Same impaired system status check, but now the production web server i-0abc123 was launched from an instance-store-backed (S3-based) AMI rather than an EBS-backed one, so stopping and starting is not an available shutdown-behavior option for it. What should you do to resolve the impaired system status check, and why doesn't a plain reboot work either?", "expected_answer": ["Terminate the instance and launch a new instance from the AMI"], "reasoning": "AWS does not support setting an instance-store-backed instance's shutdown behavior to Stop, because it has no persistent EBS root volume to preserve -- so the stop/start fix used for EBS-backed instances is simply not an option here. A reboot still only restarts the OS on the same impaired host, so it leaves the hardware fault in place regardless of root-volume type. The only remaining way to move this instance off the bad host is the more drastic step of terminating it and launching a new instance from the AMI, accepting that any ephemeral instance-store data is lost in the process.", "distractor_analysis": "Rebooting is still tempting as the least disruptive action, but it keeps the instance on the exact same impaired host no matter what the root volume type is, so it cannot be the fix here either.", "claim_ids": ["cl-e54ce4b5f6d1", "cl-1e8056681969", "cl-d426353870ae", "cl-0952f10c9935"], "difficulty": "hard", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The instance additionally has a second private IP address mapped on its network interface, and its CPUUtilization metric has been sitting at a comfortable 12% all day; nothing about the remediation changes.", "prompt": "Same EBS-backed production web server with the same impaired system status check. You also notice it has a secondary private IP address configured on its network interface, and its CPUUtilization has been sitting at a comfortable 12% all day. Does either of these facts change what you should do to resolve the impaired system status check?", "expected_answer": ["Stop the instance and then start it again"], "reasoning": "Neither detail bears on a host-level hardware fault. A secondary private IP address only changes network paths on the host and has no effect on the underlying hardware; healthy CPU utilization just confirms the guest OS isn't the bottleneck, but it says nothing about the host hardware the system status check is flagging. The fix is unchanged: stop and start the EBS-backed instance so AWS relaunches it on different, healthy hardware.", "distractor_analysis": "It's tempting to treat the secondary IP as something that needs special handling as part of the fix, but adding or re-mapping IP addresses only changes network paths on a host -- it does not address the host-level hardware problem that caused the impaired status.", "claim_ids": ["cl-807e88bbb526", "cl-c1ce14f4584f", "cl-d74f92425118", "cl-428311650158"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate argues more forcefully that rebooting is correct because 'a reboot resets everything, including whatever triggered the hardware check,' and proposes skipping stop/start entirely.", "prompt": "Same EBS-backed production web server with the impaired system status check. A teammate insists: 'Just reboot it -- a reboot resets everything on the instance, including whatever triggered the hardware check, and it's much less disruptive than a stop/start.' Is the teammate right? What should you do instead?", "expected_answer": ["Stop the instance and then start it again"], "reasoning": "The teammate's claim is wrong: a reboot only restarts the guest operating system -- it never changes which physical host the instance runs on. An impaired system status check specifically flags an underlying hardware/host problem, which a same-host restart cannot clear. Stopping and starting the EBS-backed instance is still the correct fix, because starting it places the instance on a new, healthy host.", "distractor_analysis": "The teammate's argument sounds plausible ('reboot resets everything'), but it conflates an OS-level reset with a hardware-level relocation. Rebooting an instance restarts the OS on the same, still-impaired host, so it does not resolve a failed system status check -- only moving to new hardware via stop/start does.", "claim_ids": ["cl-243ce7da701e", "cl-1e8056681969", "cl-d74f92425118", "cl-c1ce14f4584f", "cl-428311650158"], "difficulty": "medium", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "Instead of a current failed system status check, AWS has sent a scheduled hardware maintenance/retirement notification for the same EBS-backed instance, with the maintenance window falling during next week's business hours.", "prompt": "The same EBS-backed production web server hasn't failed its system status check yet, but AWS has emailed a scheduled hardware maintenance/retirement notification for it, with the maintenance window falling during next week's business hours. What should you do, and when?", "expected_answer": ["Stop the instance and then start it again"], "reasoning": "A scheduled hardware maintenance/retirement notice means the current host is going to be reclaimed or serviced by AWS at a known time. The same mechanism that fixes an impaired status check after the fact -- stopping and starting an EBS-backed instance so it relaunches on different hardware -- can be applied proactively here too: stopping and starting the instance before the maintenance window, on a schedule the team controls (e.g. outside business hours), moves it off the affected host and avoids a forced outage during business-critical hours.", "distractor_analysis": null, "claim_ids": ["cl-1aa534cc9f45", "cl-e0120dd2e5c9", "cl-428311650158"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "unsupported-generation", "severity": "medium", "description": "The mental model mechanism ('EBS volumes are deleted when DeleteOnTermination is set (the default)') and the contrast-set Terminate/EBS cell ('Deleted if DeleteOnTermination (default)') present delete-by-default as true for all EBS volumes. The only supporting claim, cl-c243306cee99, is explicitly conditioned to the root EBS volume. Additional attached volumes default to DeleteOnTermination=false, so a learner would wrongly predict that data volumes are deleted on terminate.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1", "cl-c243306cee99", "cl-5387764317c1"]}, {"type": "contradiction", "severity": "medium", "description": "cl-d54e02d33429 says terminating an instance deletes 'the network interface(s) that were attached to it, because a network interface's lifecycle is tied to that of its instance'. This contradicts cl-d335c794c4a4, whose failover pattern depends on a secondary ENI being detachable and reattachable to another instance (an independent lifecycle). Only ENIs created with the instance and flagged delete-on-termination are deleted. The synthesis repeats the overgeneralization in the mechanism ('the instance's ENIs are deleted') and in the contrast-set Terminate IP cell ('ENIs deleted').", "related_entity_ids": ["cl-d54e02d33429", "cl-d335c794c4a4", "aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model limits say 'Billing is now per-second with a one-minute minimum rather than per-hour' with no qualification. That matches cl-57201b8b797b, but in the same slice cl-276714677a25, cl-d57a18d11c90 and cl-860a95b05e99 say Windows, per-hour-software AMIs and Dedicated instances stay billed hourly, and that the billing granularity depends on OS and instance type. The synthesis drops that condition.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "cl-57201b8b797b", "cl-276714677a25", "cl-d57a18d11c90", "cl-860a95b05e99", "cl-b8eb29bc97d1"]}, {"type": "contradiction", "severity": "low", "description": "The claims disagree on whether a stop/start always moves the instance to new hardware. cl-feb4e5db72dd ('may move it to a new host') and cl-d0a70964a54b ('can happen') say it might. cl-428311650158 ('causes the instance to be relaunched on different underlying host hardware') and cl-c1ce14f4584f ('forces AWS to redeploy it onto a different, healthy physical host') say it always does. The synthesis mixes both: the matrix says 'May move to new hardware', while the decision rule and the cues treat a stop/start as guaranteed to leave the host.", "related_entity_ids": ["cl-feb4e5db72dd", "cl-d0a70964a54b", "cl-428311650158", "cl-c1ce14f4584f", "aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "The source questions disagree on whether instance-store data survives a reboot. cl-70c53fe7cd89 and cl-5c2181cc1b7a (q242) are 'supported', but the same proposition from q389 (cl-75338cc34534, cl-9961d7dcb7d4, cl-28a131d35a45) is marked 'conflicted'. The mental model states 'it survives a reboot' as an unqualified invariant and cites only the q242 claims, so the q389 dispute is unresolved and never surfaced.", "related_entity_ids": ["cl-75338cc34534", "cl-9961d7dcb7d4", "cl-28a131d35a45", "cl-70c53fe7cd89", "cl-5c2181cc1b7a", "aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "cl-3febcf7bf852 (q022) says the security groups on both instances must allow the traffic for two instances in different subnets to communicate. cl-fa5771e20413 (q851, q880) says security groups are stateful, so only the resource being connected to needs an inbound allow rule and neither side's outbound rules need changes. These are inconsistent. cl-fa5771e20413 is also overgeneralized: it holds only when the default allow-all outbound rule is in place, which is the assumption cl-9e68c39f9680 depends on.", "related_entity_ids": ["cl-3febcf7bf852", "cl-fa5771e20413", "cl-9e68c39f9680"]}, {"type": "contradiction", "severity": "medium", "description": "Default-VPC behavior conflicts across questions. cl-feb2d6091c7e (q060) says an instance launched into a default VPC subnet automatically gets a public IP and internet reachability through the VPC's internet gateway. cl-9789b0baf0b9 (q073) says without conditions that an internet gateway must be created, attached and routed, and that 'none of that happens automatically'. cl-50aa3dc9bd8a and cl-9374252be9d3 say nothing beyond a private IP is guaranteed. The q073 claims are missing the 'non-default VPC' condition that would reconcile them.", "related_entity_ids": ["cl-feb2d6091c7e", "cl-9789b0baf0b9", "cl-50aa3dc9bd8a", "cl-9374252be9d3"]}, {"type": "contradiction", "severity": "medium", "description": "SSH timeout causes are inconsistent. cl-2e3d0f5c98e5 says using the wrong private key is a real cause of an SSH connection timeout. cl-b0aba19137ab and cl-cf923834660d say key and authentication problems produce an authentication rejection after the connection succeeds, not a timeout. The same question (q127) also has the disputed CPU-load claim cl-e2c526f5f0da, where the boxed answer and the community vote disagree.", "related_entity_ids": ["cl-2e3d0f5c98e5", "cl-e090e92f96d3", "cl-e2c526f5f0da", "cl-b0aba19137ab", "cl-cf923834660d"]}, {"type": "contradiction", "severity": "medium", "description": "The Elastic IP limit claims disagree within and across questions. cl-3e703a66b1c1 (q196, supported) says EC2-Classic and VPC each get an independent allotment of 5 EIPs. cl-d083b203db1a (q196, conflicted) says the community reads 5 as a single combined cap. cl-f6a8194311cd (q401) says 5 per region per account with no per-platform split. This is unresolved. It is also stale, because EC2-Classic has been retired.", "related_entity_ids": ["cl-3e703a66b1c1", "cl-d083b203db1a", "cl-f6a8194311cd"]}, {"type": "quality", "severity": "medium", "description": "Distractor statements use inconsistent polarity. Most distractors state the correction (for example cl-ddb93ea39149 'An ELB does not improve throughput'). Several instead state the false belief as a plain assertion with no marker: cl-a94cb0b70bb0 ''EBS dedicated' and 'EBS enhanced' are real AWS EC2 launch configuration terms', cl-d05511987549 ('is a coherent, complete fix'), cl-c6c27b0357fa ('cc2.8xlarge ... is the best fit'), cl-7a6f09bf4e08 and cl-2c34fa92942b. Read on their own, these read as true facts. The contrast set cites cl-2c34fa92942b.", "related_entity_ids": ["cl-a94cb0b70bb0", "cl-d05511987549", "cl-c6c27b0357fa", "cl-7a6f09bf4e08", "cl-2c34fa92942b", "aws-sysops-service-ec2--cs-1"]}, {"type": "contradiction", "severity": "low", "description": "cl-0b69818049d5 ('Placement groups cluster EC2 instances physically close together within a single Availability Zone') and cl-c98168ce0880 (all placement groups are for low latency and high throughput) are stated for placement groups in general. cl-4aa56b0ac133 and cl-9cf762a8eccc say spread placement groups span AZs and deliberately separate hardware. The unconditioned claims should be limited to cluster placement groups.", "related_entity_ids": ["cl-0b69818049d5", "cl-c98168ce0880", "cl-4aa56b0ac133", "cl-9cf762a8eccc", "cl-fb7fbc507a5c"]}, {"type": "ambiguity", "severity": "low", "description": "The memory-metric claims disagree on the required tooling. cl-d1ab32cc2995 says memory 'always requires the CloudWatch agent', and cl-1187c51aeb05 says the same. cl-8c950ad90060 accepts the CloudWatch agent or the legacy Perl monitoring scripts, and cl-dcf0fba3cc52 says 'or equivalent tooling'.", "related_entity_ids": ["cl-d1ab32cc2995", "cl-1187c51aeb05", "cl-8c950ad90060", "cl-dcf0fba3cc52"]}, {"type": "parse", "severity": "low", "description": "Eight claims have no 'conditions' field at all, where every other claim in the slice has one (even an empty array): cl-ecd138648e72, cl-9ca0fd33a41d, cl-e5ff853f85f3, cl-0d4b5c37c295, cl-1b82f17f2117, cl-d3a9a2257212, cl-a14ac8c042bc, cl-ccf8d7523a75.", "related_entity_ids": ["cl-ecd138648e72", "cl-9ca0fd33a41d", "cl-e5ff853f85f3", "cl-0d4b5c37c295", "cl-1b82f17f2117", "cl-d3a9a2257212", "cl-a14ac8c042bc", "cl-ccf8d7523a75"]}, {"type": "stale-risk", "severity": "low", "description": "Several claims describe retired or legacy AWS behavior as if it were current. Launch configurations are deprecated in favor of launch templates (cl-75ab3e8821db, cl-bbd91e393133). EC2-Classic behavior is retired (cl-ec096a69646c, cl-31ffa368c8ec, cl-40c2e82c80f8). Legacy instance types appear (cl-0c981a2af156 hi1.4xlarge, cl-87455b3c0f5f m1.small). Alarm EC2 actions failing silently without the user's EC2 permissions predates service-linked roles (cl-2ce09a2de24f, cl-783561b8b04f, cl-ef09eb226222). Hour-boundary billing is superseded by per-second billing (cl-cfaf2be26905).", "related_entity_ids": ["cl-75ab3e8821db", "cl-bbd91e393133", "cl-ec096a69646c", "cl-31ffa368c8ec", "cl-40c2e82c80f8", "cl-0c981a2af156", "cl-87455b3c0f5f", "cl-2ce09a2de24f", "cl-783561b8b04f", "cl-ef09eb226222", "cl-cfaf2be26905"]}, {"type": "stale-risk", "severity": "low", "description": "The claims that Windows and Dedicated instances bill per hour (cl-276714677a25, cl-d57a18d11c90) reflect the October 2017 announcement and may no longer be accurate. They also clash with cl-b2c17c7e0f85, which says Linux On-Demand, Reserved and Spot instances bill per second without exempting Dedicated tenancy.", "related_entity_ids": ["cl-276714677a25", "cl-d57a18d11c90", "cl-b2c17c7e0f85"]}, {"type": "contradiction", "severity": "medium", "description": "q025: the source vote splits 50/50 on whether ELB or Route 53 health-check failover satisfies a hard-coded-IP, no-reconfiguration constraint. This is unresolved.", "related_entity_ids": ["cl-8bdf336a7ef2", "cl-dcb519a1add8", "cl-d335c794c4a4"]}, {"type": "contradiction", "severity": "medium", "description": "q140: the community splits between OK, Alarm and Insufficient Data for an alarm after an instance was stopped partway through the evaluation window. This is unresolved.", "related_entity_ids": ["cl-a2e5ecbc6606", "cl-e0b93267c34f"]}, {"type": "contradiction", "severity": "medium", "description": "q320: whether latency-based routing or a third-party geolocation redirect meets the data-residency requirement is marked conflicted. The claim that Route 53 Geolocation Routing is the native mechanism is still 'needs-review'.", "related_entity_ids": ["cl-4607759c0a3f", "cl-fdd38145e5f8", "cl-85f91e8f66bf"]}, {"type": "contradiction", "severity": "medium", "description": "q330: the IPv6 and egress-only internet gateway claims are all conflicted, and the per-subnet route table claim is 'needs-review'. cl-0b88c9554d6c ('IPv6 addresses are ... inherently public/routable ... regardless of which subnet') also overstates the case.", "related_entity_ids": ["cl-2b4193cff89a", "cl-0b88c9554d6c", "cl-11b818ed654b", "cl-b0bcae6e1b6d"]}, {"type": "contradiction", "severity": "medium", "description": "q331 and q334: the shared-responsibility audit-evidence claim (CloudTrail and EC2 system logs) and the IAM password policy claim are marked conflicted, so the source answers disagree.", "related_entity_ids": ["cl-d0967fc4bf8e", "cl-723c4219b128"]}, {"type": "contradiction", "severity": "medium", "description": "q463: it is disputed whether instance scale-in protection applies to an Auto Scaling group of Spot Instances. Both claims are conflicted.", "related_entity_ids": ["cl-8b2da1a67646", "cl-ab6543e2d344"]}, {"type": "contradiction", "severity": "medium", "description": "q523: all three claims about one multi-AZ VPC communicating across AZs over the default route table are marked conflicted. This is despite their agreeing with the supported cl-f8cde0449f7b (q022), so the dispute is unresolved.", "related_entity_ids": ["cl-32ba0918bd76", "cl-207f75a21cbb", "cl-ab472533105d", "cl-f8cde0449f7b"]}, {"type": "contradiction", "severity": "medium", "description": "q525 and q531: whether AWS Config has a memory-monitoring option, and whether an ALB resolves memory-pressure scaling, are marked conflicted. The source answers disagree.", "related_entity_ids": ["cl-db8c48a23c0e", "cl-57776b837f9c"]}, {"type": "contradiction", "severity": "medium", "description": "q535: the right fix for repeated T-series CPU credit exhaustion (resize, change instance family, buy credits or add an alarm) is disputed. The boxed answer and the community vote disagree, and all four claims are conflicted.", "related_entity_ids": ["cl-b019e4d216f5", "cl-4dbf7312cbb9", "cl-e7d69a12d5cc", "cl-671e607cdd2d"]}, {"type": "contradiction", "severity": "medium", "description": "q558: tag-based exclusion of instances from automated nightly stops is marked conflicted.", "related_entity_ids": ["cl-ecd138648e72"]}, {"type": "contradiction", "severity": "medium", "description": "q561: the boxed answer (On-Demand instances in an Auto Scaling group) conflicts with the community view that Spot is cheaper for an interruption-tolerant nightly batch job. That view is consistent with cl-7c8a85dc181a and cl-9036bea4eb99.", "related_entity_ids": ["cl-211ea4e83154", "cl-7c8a85dc181a", "cl-9036bea4eb99"]}, {"type": "contradiction", "severity": "medium", "description": "q565: the boxed answer uses AssumeRole semantics, but the community vote unanimously supports PassRole semantics for ec2:* plus iam:PassRole scoped to a role-name prefix.", "related_entity_ids": ["cl-deab9a53d3fe", "cl-259136ebf6fe", "cl-0094447aef70"]}, {"type": "contradiction", "severity": "medium", "description": "q599: the boxed answer (reactive search with Tag Editor) contradicts the supported claim cl-bccbdd36f629 that reactive tools cannot enforce tagging in real time. The community vote does not reach the 60% threshold.", "related_entity_ids": ["cl-0b0666c8c445", "cl-bccbdd36f629", "cl-7b988c689f0e"]}, {"type": "contradiction", "severity": "medium", "description": "q621: the boxed answer (AMI not available in the region) contradicts the supported cl-06e628e5f8aa, which rules that cause out after a partial launch. The community instead points to a per-instance-type service limit.", "related_entity_ids": ["cl-eec26ea7fcab", "cl-051e1f3f4c6f", "cl-06e628e5f8aa"]}, {"type": "contradiction", "severity": "medium", "description": "q627: it is disputed whether legacy m2 instance types can still be bought as Reserved Instances.", "related_entity_ids": ["cl-702b0192ea18", "cl-05dc8f528170"]}, {"type": "contradiction", "severity": "medium", "description": "q717: the vertical-scaling remediation (compute-optimized instance type versus adding instances) is marked conflicted.", "related_entity_ids": ["cl-04c3a4c49e71", "cl-6e32e374c882"]}, {"type": "contradiction", "severity": "medium", "description": "q755: the boxed answer blames VPC peering for SSH working while ping fails. This conflicts with the unanimous community vote for a missing ICMP security-group rule, and the ICMP claims are marked conflicted.", "related_entity_ids": ["cl-858c2050fed4", "cl-00a5f7098142", "cl-afd1f8a10f67"]}, {"type": "contradiction", "severity": "medium", "description": "q766: the claim that AWS Support does not offer OS patching inside customer EC2 instances is marked conflicted.", "related_entity_ids": ["cl-2cf1008c03d9", "cl-f5583ef80224"]}, {"type": "contradiction", "severity": "medium", "description": "q843: the boxed answer (run the unmodified template in new regions) contradicts the supported cl-98b564957b6c and cl-c8c4c783f9d1 on region-scoped AMI IDs. The community vote unanimously disagrees with the boxed answer.", "related_entity_ids": ["cl-f2235069c235", "cl-98b564957b6c", "cl-c8c4c783f9d1"]}, {"type": "contradiction", "severity": "medium", "description": "q851: which security group needs the inbound 3306 rule for EC2-to-Aurora access is marked conflicted. cl-fa5771e20413 is nonetheless 'supported' while citing q851 and q880, both of which carry conflicted claims.", "related_entity_ids": ["cl-9d43a1145f6d", "cl-3983ee9074b2", "cl-fa5771e20413"]}, {"type": "contradiction", "severity": "medium", "description": "q857: the NAT instance source/destination-check fix and the Elastic IP distractor are marked conflicted. The supported cl-3beedeec6feb also says 'does not fix a disabled source/destination check misconfiguration'. The fault is the check being enabled, so that wording inverts the misconfiguration.", "related_entity_ids": ["cl-8024a6cb4612", "cl-6da2e2e26727", "cl-3beedeec6feb", "cl-0d4593509e23"]}, {"type": "contradiction", "severity": "medium", "description": "q863: all four Reserved-versus-Spot purchasing claims for control and worker nodes are conflicted, even though they match the supported q029 and q563 claims (cl-0507e975b571, cl-d3a9a2257212). The dispute is unresolved.", "related_entity_ids": ["cl-5c23b92778a0", "cl-89b7891ec63b", "cl-22556ccfdd57", "cl-06cf99d7bff6", "cl-0507e975b571", "cl-d3a9a2257212"]}, {"type": "contradiction", "severity": "medium", "description": "q868: On-Demand Capacity Reservations versus zonal Reserved Instances for guaranteed AZ capacity is marked conflicted.", "related_entity_ids": ["cl-d88500215389", "cl-7dc3563e9f36"]}, {"type": "contradiction", "severity": "medium", "description": "q869: the launch-failure causes (regional instance limit, exhausted subnet IPs, instance profile permissions) are marked conflicted. cl-5091582552c4 is also inaccurate: launching with an instance profile requires iam:PassRole, so it is not 'unrelated' to the RunInstances caller's permissions.", "related_entity_ids": ["cl-ae973de36c2e", "cl-2dceed3ede41", "cl-5091582552c4"]}, {"type": "contradiction", "severity": "medium", "description": "q880: the RDP-failure causes (a stateless NACL rule, a missing internet gateway route) are marked conflicted.", "related_entity_ids": ["cl-098b70bc6fe7", "cl-976f9b740606"]}, {"type": "contradiction", "severity": "medium", "description": "q920: the SSH port-22 cause and the port-443 distractor are marked conflicted, even though both are basic, well-established facts.", "related_entity_ids": ["cl-3c220afd2a93", "cl-88d73eb16e2d"]}, {"t
