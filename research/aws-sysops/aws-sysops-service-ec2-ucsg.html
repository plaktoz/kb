<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

e way to raise aggregate throughput between EC2 and SQS.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ddb93ea39149", "source_question_ids": ["awssysops-p1-q004"], "statement": "An Elastic Load Balancer does not improve throughput between EC2 instances and SQS, because there is no inbound traffic to SQS for an ELB to distribute.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-18e92d1fc8a0", "source_question_ids": ["awssysops-p1-q004"], "statement": "EBS-optimized instances improve EBS disk I/O, not throughput to the SQS API endpoint.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-692ae06ed096", "source_question_ids": ["awssysops-p1-q004"], "statement": "Enabling a public IP address on an instance affects internet reachability, not throughput to the SQS API endpoint.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ced77ff6d28d", "source_question_ids": ["awssysops-p1-q005"], "statement": "EC2 network throughput is capped by the instance type/size, not by storage or connectivity add-ons.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-87455b3c0f5f", "source_question_ids": ["awssysops-p1-q005"], "statement": "Changing to a larger, current-generation EC2 instance type unlocks Enhanced Networking (ENA) and materially more network bandwidth than an older small instance type like m1.small.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1f3920c79423", "source_question_ids": ["awssysops-p1-q005"], "statement": "Adding an additional Elastic Network Interface (ENI) to an EC2 instance does not add aggregate network bandwidth.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2ba2c7a3481e", "source_question_ids": ["awssysops-p1-q005"], "statement": "AWS Direct Connect is for connecting on-premises networks to AWS, not for improving traffic that stays entirely within AWS (e.g. EC2 to S3 in the same region).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-577abc2ad334", "source_question_ids": ["awssysops-p1-q005"], "statement": "EBS Provisioned IOPS (PIOPS) improves EBS disk I/O, which is a different bottleneck than network throughput to S3.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances need to call the CloudWatch PutMetricData API"], "confidence": "high", "id": "cl-75ab3e8821db", "source_question_ids": ["awssysops-p1-q012"], "statement": "Attaching an IAM role to an Auto Scaling launch configuration is the AWS-recommended way to let instances authenticate CloudWatch PutMetricData calls, because credentials are automatically rotated and delivered via the instance metadata service.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6c0e7c9cf67b", "source_question_ids": ["awssysops-p1-q012"], "statement": "Creating an IAM user and injecting its credentials into instance User Data or a private repository means distributing and rotating static long-lived secrets by hand, which is not the recommended authentication approach for instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-81c2f9cee3ef", "source_question_ids": ["awssysops-p1-q012"], "statement": "CloudWatch has no metric-level resource policy that can grant PutMetricData permission to instances from an Auto Scaling group.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is backed by an instance-store (S3-based) AMI, not EBS"], "confidence": "high", "id": "cl-0952f10c9935", "source_question_ids": ["awssysops-p1-q013"], "statement": "When an EC2 instance backed by an S3-based (instance-store) AMI is terminated, the data on its ephemeral root volume is automatically deleted.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-5a6c8755de30", "source_question_ids": ["awssysops-p1-q013"], "statement": "AWS recommends EBS-backed AMIs over instance-store AMIs for persistent, faster-launching root volumes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["resources are deployed across multiple AWS regions", "cross-account/cross-region CloudWatch dashboards are not being used"], "confidence": "high", "id": "cl-d82ea34b0f15", "source_question_ids": ["awssysops-p1-q017"], "statement": "To combine the same CloudWatch metric across multiple AWS regions into a single graph, you must pull the raw metric data per region via the CloudWatch CLI/API, aggregate it yourself, and push the combined series back into CloudWatch for graphing.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0bbb1a9d7cb5", "source_question_ids": ["awssysops-p1-q017"], "statement": "CloudWatch's console tag-dimension view and per-resource monitoring agents only surface metrics within the region/account they run in, and do not natively merge metrics across regions.", "status": "supported"}, {"claim_type": "exception", "conditions": ["using a CloudWatch feature set from 2019 or later"], "confidence": "low", "id": "cl-24e52688e038", "source_question_ids": ["awssysops-p1-q017"], "statement": "AWS cross-account/cross-region CloudWatch dashboards, launched in 2019, can natively combine the same metric from multiple regions into one view, offering a newer alternative to manual aggregation.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d74f92425118", "source_question_ids": ["awssysops-p1-q019"], "statement": "An EC2 'impaired' system status check indicates an underlying hardware/host problem, distinct from an 'unreachable' instance status check, and cannot be fixed by the guest OS or network configuration.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance is EBS-backed", "system status check shows impaired"], "confidence": "high", "id": "cl-c1ce14f4584f", "source_question_ids": ["awssysops-p1-q019"], "statement": "Stopping and starting an EBS-backed EC2 instance forces AWS to redeploy it onto a different, healthy physical host, which is the standard fix for a failed system status check.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-243ce7da701e", "source_question_ids": ["awssysops-p1-q019"], "statement": "Rebooting an instance restarts the OS on the same, still-impaired host, so it often does not resolve a failed system status check.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-807e88bbb526", "source_question_ids": ["awssysops-p1-q019"], "statement": "Adding a second private IP address, adding a second ENI, or re-mapping the Elastic IP only changes network paths on a host, and does not fix a host-level hardware problem causing an impaired system status check.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0798c4ac804d", "source_question_ids": ["awssysops-p1-q020"], "statement": "A placement group is an EC2 feature that controls how instances are placed on underlying hardware, enabling high-bandwidth, low-latency connections between instances (e.g. a cluster placement group), useful for tightly-coupled workloads like HPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1c17d110cea0", "source_question_ids": ["awssysops-p1-q020"], "statement": "A placement group is unrelated to Auto Scaling groups, Elastic Load Balancers, or CloudFront edge locations.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-d8e6f085345c", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the network ACLs on both subnets must permit the traffic.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-3febcf7bf852", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the security groups on both instances must allow the traffic on the right port/protocol.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-f8cde0449f7b", "source_question_ids": ["awssysops-p1-q022"], "statement": "Route tables route between subnets in the same VPC by default with no NAT instance or Internet Gateway involved, since that traffic never leaves the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab1633b33ef1", "source_question_ids": ["awssysops-p1-q022"], "statement": "Matching instance class or using the same key pair between two EC2 instances has no bearing on network reachability between them.", "status": "supported"}, {"claim_type": "rule", "conditions": ["web tier is stateless and CPU/memory-bound", "data tier is already well-provisioned and consistently fast"], "confidence": "high", "id": "cl-1e0ca1f2007d", "source_question_ids": ["awssysops-p1-q024"], "statement": "When a stateless, CPU/memory-bound web tier is the bottleneck and the data tier is already well-provisioned and fast, the fix is to horizontally scale the web tier (add instances behind an ELB) rather than changing the data tier.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b410fab982c", "source_question_ids": ["awssysops-p1-q024"], "statement": "DynamoDB is a managed, multi-AZ service, so there is no single Availability Zone to co-locate an EC2 instance with for latency benefits.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-73c60b053b9e", "source_question_ids": ["awssysops-p1-q024"], "statement": "Caching database responses or migrating the database engine does not address a compute-bound application bottleneck when the data tier is already fast.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application has IP addresses hard-coded, with no DNS resolution or load-balancer indirection"], "confidence": "high", "id": "cl-dcb519a1add8", "source_question_ids": ["awssysops-p1-q025"], "statement": "For a legacy application with IP addresses hard-coded into its own configuration, failover must preserve the exact IP address the application already expects, rather than relying on DNS or load-balancer indirection.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application requires preservation of a specific hard-coded IP address on failover"], "confidence": "high", "id": "cl-d335c794c4a4", "source_question_ids": ["awssysops-p1-q025"], "statement": "Attaching a secondary ENI to a failover instance, or moving a secondary private IP address on the primary ENI to a failover instance, lets the new instance take on the exact same IP address with no application-side reconfiguration.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["application has IP addresses hard-coded with no reconfiguration allowed"], "confidence": "low", "id": "cl-8bdf336a7ef2", "source_question_ids": ["awssysops-p1-q025"], "statement": "An ELB or Route53 health-check failover are generically valid failover mechanisms, but community vote on whether they (rather than ENI/secondary-IP movement) satisfy a hard-coded-IP, no-reconfiguration constraint was an even 50/50 split, so this is flagged disputed.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["bastion host must be highly available without human intervention"], "confidence": "high", "id": "cl-9051dabb6b29", "source_question_ids": ["awssysops-p1-q026"], "statement": "An Auto Scaling group with min-size=1 and max-size=1 spanning multiple Availability Zones gives a bastion host self-healing high availability with zero human intervention, because the ASG's health checks detect failure and automatically launch a replacement in a healthy AZ.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6665232bed16", "source_question_ids": ["awssysops-p1-q026"], "statement": "Running two static bastion instances, or keeping a pre-built standby AMI ready, both still require a human to notice the failure and act, so neither achieves high availability without human intervention.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-59f08028b5d8", "source_question_ids": ["awssysops-p1-q026"], "statement": "An ELB load-balances traffic across healthy targets but does not itself replace a failed bastion instance.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-5bc987e7159b", "source_question_ids": ["awssysops-p1-q028"], "statement": "CPU utilization, disk I/O, data transfer, and status checks are default EC2 metrics that CloudWatch collects automatically at the hypervisor level with no agent required.", "status": "supported"}, {"claim_type": "exception", "conditions": ["monitoring memory utilization of an EC2 instance"], "confidence": "high", "id": "cl-d1ab32cc2995", "source_question_ids": ["awssysops-p1-q028"], "statement": "Memory utilization of an EC2 instance is invisible to the hypervisor and is only knowable from inside the guest OS, so it always requires the CloudWatch agent publishing a custom metric, regardless of instance type or OS.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed continuously, every day"], "confidence": "high", "id": "cl-0507e975b571", "source_question_ids": ["awssysops-p1-q029"], "statement": "Baseline server capacity needed every day of the year is most cost-effectively covered by Reserved Instances (heavy utilization).", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed frequently but not every single day"], "confidence": "high", "id": "cl-f03278a6db54", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed on most days but not every day is reasonably covered by On-Demand Instances, since it is used too often to leave unreserved but not continuously enough to justify another year-long Reserved Instance commitment.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed only a few days per year"], "confidence": "high", "id": "cl-2263c52153ff", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed only a handful of days per year is best covered by Spot Instances, since reserving it would commit to a year of cost for rarely-used capacity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c8a1f8029bbf", "source_question_ids": ["awssysops-p1-q029"], "statement": "Using Spot Instances to cover capacity that is needed on most days risks interruption for capacity the application actually needs regularly, which undermines availability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-07f653f62e9e", "source_question_ids": ["awssysops-p1-q034"], "statement": "Instance store (ephemeral) storage loses all its data when the EC2 instance is stopped or terminated, making it unsuitable when durable persistence of the data must be maintained.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-70be56bdb992", "source_question_ids": ["awssysops-p1-q034"], "statement": "An EBS-optimized EC2 instance provides a dedicated, non-shared throughput channel between the instance and its EBS volumes, so other instance network traffic doesn't contend with disk I/O.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d7bcc27f0212", "source_question_ids": ["awssysops-p1-q034"], "statement": "Provisioned IOPS (PIOPS) EBS volumes deliver a guaranteed, consistent number of IOPS, suited to I/O-intensive workloads such as databases showing high disk wait time.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d05511987549", "source_question_ids": ["awssysops-p1-q034"], "statement": "Simply moving a database to a generic 'SSD-backed instance' is a coherent, complete fix for EBS disk-I/O wait-time problems on its own.", "status": "supported"}, {"claim_type": "rule", "conditions": ["need to detect failure of the monitoring instance itself, simply"], "confidence": "high", "id": "cl-6a1043eae393", "source_question_ids": ["awssysops-p1-q035"], "statement": "The simplest way to monitor the health of a monitoring instance itself ('who watches the watcher') is a CloudWatch alarm on its EC2 system/instance status checks, which catches hardware-level failures with no extra moving parts and can notify operations the same way an existing alarm does.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2ee540b97370", "source_question_ids": ["awssysops-p1-q035"], "statement": "Using a second monitoring instance to watch the first monitoring instance just recreates the same 'who watches the watcher' problem one level up.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0e2d933c8ed9", "source_question_ids": ["awssysops-p1-q035"], "statement": "A CPU-utilization alarm combined with having the monitoring application deliberately enter a CPU-bound loop on problem detection, or an active SQS-based failover/handoff scheme between instances, are both far more complex than needed to detect whether a monitoring instance itself is healthy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-654beee23c3c", "source_question_ids": ["awssysops-p1-q036"], "statement": "The instance type an Auto Scaling group launches is defined in its launch configuration (or launch template), not in the Auto Scaling group itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a6f1fb95acf8", "source_question_ids": ["awssysops-p1-q036"], "statement": "The Auto Scaling group itself only references a launch configuration and manages capacity/AZ distribution; scaling policies control when to scale; tags are just metadata -- none of these define instance type.", "status": "supported"}, {"claim_type": "rule", "conditions": ["need to change the instance type used by an Auto Scaling group"], "confidence": "high", "id": "cl-bbd91e393133", "source_question_ids": ["awssysops-p1-q036"], "statement": "To change the instance type an Auto Scaling group launches, you create a new launch configuration with the new instance type and point the ASG at it.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-39ae6e55149a", "source_question_ids": ["awssysops-p1-q044"], "statement": "Under the AWS shared responsibility model, AWS is responsible for protecting against IP spoofing and packet sniffing, via its host-based firewall (which prevents instances from sending traffic with a spoofed source IP/MAC) and its virtualized network (which prevents one tenant's instance from sniffing another tenant's traffic).", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-7c66774178ab", "source_question_ids": ["awssysops-p1-q044"], "statement": "Under the AWS shared responsibility model, enforcing least-privilege access on EC2 instances, encrypting traffic between EC2 and ELB, and patching the guest OS and application stack on EC2 instances are all the customer's responsibility.", "status": "supported"}, {"claim_type": "exception", "conditions": ["using Relational Database Service (RDS) rather than self-managed EC2 database instances"], "confidence": "medium", "id": "cl-ad1b666ed384", "source_question_ids": ["awssysops-p1-q044"], "statement": "RDS database engine patching is AWS-managed under the shared responsibility model, distinct from EC2 guest-OS patching which is the customer's responsibility.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0c981a2af156", "source_question_ids": ["awssysops-p1-q047"], "statement": "The hi1.4xlarge 'High I/O' EC2 instance type provides local SSD instance storage delivering up to roughly 120,000 random read IOPS at 4KB block size.", "status": "supported"}, {"claim_type": "default", "conditions": ["at question authoring time"], "confidence": "medium", "id": "cl-b6bdd683c240", "source_question_ids": ["awssysops-p1-q047"], "statement": "At the time this question was written, EC2 instances relying on network-attached EBS (including Provisioned IOPS EBS) had throughput far below what instance-local SSD storage could deliver.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c6c27b0357fa", "source_question_ids": ["awssysops-p1-q047"], "statement": "The cc2.8xlarge 'Cluster Compute' instance type is the best fit for a workload requiring very high random read IOPS.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-ea3f1bff7d59", "source_question_ids": ["awssysops-p1-q047"], "statement": "Using ephemeral instance storage for a database's data introduces a data-loss risk if st requires an AMI to exist in that region.", "status": "supported"}, {"claim_type": "rule", "conditions": ["need to achieve disaster recovery for an EC2 instance in a different AWS region"], "confidence": "high", "id": "cl-57facaa305c7", "source_question_ids": ["awssysops-p1-q109"], "statement": "The standard path for disaster recovery into a new region is to create an AMI from the running instance in the source region, copy that AMI to the target region, then launch a new instance from the copied AMI.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-b3d6d01f84f9", "source_question_ids": ["awssysops-p1-q109"], "statement": "EC2 does not offer an operation to directly copy a running instance across regions; only AMIs (or snapshots) can be copied between regions, not a live running instance.", "status": "supported"}, {"claim_type": "default", "conditions": ["initial launch of EC2 instances"], "confidence": "high", "id": "cl-e257631bcd76", "source_question_ids": ["awssysops-p1-q116"], "statement": "AWS recommends accepting the default Availability Zone when first launching EC2 instances, letting AWS pick the AZ with the best current system health and available capacity.", "status": "supported"}, {"claim_type": "exception", "conditions": ["launching additional instances relative to existing ones"], "confidence": "medium", "id": "cl-56cbebb2c088", "source_question_ids": ["awssysops-p1-q116"], "statement": "Users should specify an Availability Zone explicitly only when launching additional instances that need to be placed near or apart from already-running instances; pinning initial launches to one specific AZ undermines the redundancy AZ diversity provides.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC has only a private, VPN-connected subnet with no public subnet or IGW"], "confidence": "high", "id": "cl-14107cfb308e", "source_question_ids": ["awssysops-p1-q117"], "statement": "In a VPC with he EC2 key pair are both documented, real possible causes of an SSH connection timeout.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-e2c526f5f0da", "source_question_ids": ["awssysops-p1-q127"], "statement": "Whether heavy CPU load on the target instance counts as a possible cause of an SSH connection timeout is disputed: the question's boxed answer treats CPU load as a valid cause (making 'wrong access key' the one that is not a cause), while the recorded community vote and some troubleshooting references instead treat CPU overload as the one item not actually documented as a cause.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0e30a2d6d69e", "source_question_ids": ["awssysops-p1-q129"], "statement": "The disk-related EC2 CloudWatch metrics (DiskReadOps, DiskWriteOps, DiskReadBytes, DiskWriteBytes) only report non-zero values when the instance has ephemeral (instance store) storage attached, since they measure I/O against that ephemeral device specifically.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance has no ephemeral/instance-store device attached"], "confidence": "high", "id": "cl-bf744509cd39", "source_question_ids": ["awssysops-p1-q129"], "statement": "An EBS-backed EC2 instance with no additional ephemeral device attached will always report 0 for DiskReadBytes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c9fe7ff717c8", "source_question_ids": ["awssysops-p1-q129"], "statement": "The CloudWatch metrics NetworkIn, NetworkOut, and CPUUtilization are populated regardless of storage type, since they measure network traffic and processor usage rather than ephemeral-disk I/O.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-331058959ce8", "source_question_ids": ["awssysops-p1-q130"], "statement": "Rebooting (restarting) an EC2 instance keeps it in the running state throughout and does not start a new billing period.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-cfaf2be26905", "source_question_ids": ["awssysops-p1-q130"], "statement": "Stopping and starting an EC2 instance ends one billing period and begins a new one on start, even if the stop/start cycle happens more than once within the same clock hour.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-57201b8b797b", "source_question_ids": ["awssysops-p1-q130"], "statement": "AWS has since moved to per-second billing (with a one-minute minimum) for a stop-to-start transition rather than charging a full hour, though the underlying restart-vs-stop/start billing distinction still holds.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-4a1c2875f7c8", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "An EC2 instance's Availability Zone is fixed at launch and cannot be changed in place -- there is no stop/start toggle, CLI command, or console action that moves a running instance to a different AZ.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-128c117be4e9", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "The only way to relocate an EC2 instance to a different Availability Zone is to create an AMI from the running instance and launch a new instance from that AMI, explicitly choosing the target AZ at launch time.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d66a7d7fbbf5", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "Stopping an EC2 instance and then 'changing the availability zone' directly on it is not a real capability -- an instance always restarts in the same AZ it was launched in.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-25c337bb3f19", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "There is no AWS CLI-only restriction for changing an instance's AZ, and there is no console 'Actions -> Change zones' action -- neither capability exists.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "high", "id": "cl-6ab1f6c8020f", "source_question_ids": ["awssysops-p1-q138"], "statement": "Under AWS consolidated billing, the hourly cost benefit of a Reserved Instance purchased by one linked account is shared across all accounts on the consolidated bill, not locked to the purchasing account.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "high", "id": "cl-428e07582517", "source_question_ids": ["awssysops-p1-q138"], "statement": "A shared Reserved Instance discount under consolidated billing applies automatically to whichever single running instance in the account group matches the RI's instance size and Availability Zone, regardless of which specific linked account that instance is running in.", "status": "supported"}, {"claim_type": "fact", "conditions": ["only a single matching RI has been purchased"], "confidence": "high", "id": "cl-d9b6d386059f", "source_question_ids": ["awssysops-p1-q138"], "statement": "If only one Reserved Instance was purchased for a given size/AZ, only one matching running instance across the consolidated-billing account group gets the discounted rate at any given time; the rest are billed at the standard on-demand/blended rate.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e0b93267c34f", "source_question_ids": ["awssysops-p1-q140"], "statement": "A CloudWatch alarm configured for 5 evaluation periods of 5 minutes each has ncing action appears in the policy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8f2a11ab7c45", "source_question_ids": ["awssysops-p1-q190"], "statement": "EBS volumes are covered by the ec2:Describe* IAM action, since EBS is part of the EC2 API namespace, rather than being excluded from it.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-3e703a66b1c1", "source_question_ids": ["awssysops-p1-q196"], "statement": "The default Elastic IP limit of 5 per region is tracked separately per platform, so EC2-Classic and VPC each get their own independent allotment of 5 Elastic IPs.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "low", "id": "cl-d083b203db1a", "source_question_ids": ["awssysops-p1-q196"], "statement": "Whether exhausting the EC2-Classic Elastic IP limit blocks allocating a new Elastic IP in a VPC in the same account/region is contested in practice -- some read the 5-EIP default as a single combined cap across platforms rather than a per-platform allotment, leading to a genuinely split community view.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0c54212b47ee", "source_question_ids": ["awssysops-p1-q197"], "statement": "An Elastic IP can be directly attached to an EC2 instance in a VPC without an Internet Gateway being a hard prerequisite for that association step itself.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance is in a VPC and needs internet connectivity"], "confidence": "medium", "id": "cl-f4c36ff48c82", "source_question_ids": ["awssysops-p1-q197"], "statement": "To actually reach an EC2 instance from the internet, both an Internet Gateway attached to the VPC and an Elastic IP attached to the instance are needed together -- an Elastic IP alone is not sufficient for internet connectivity without an IGW.", "status": "supported"}, g the AWS account's maximum EC2 instance limit prevents an instance from launching at all, so it is not a possible cause of an instance terminating immediately after it was already launched.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5a4059d252b1", "source_question_ids": ["awssysops-p1-q223"], "statement": "A corrupted EBS snapshot can cause an EC2 instance to terminate immediately after launch.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance was launched from an instance-store-backed AMI"], "confidence": "high", "id": "cl-a09a12606e16", "source_question_ids": ["awssysops-p1-q223"], "statement": "A missing required part of an instance-store-backed AMI can cause an EC2 instance to terminate immediately after launch.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6c6ad4d545b7", "source_question_ids": ["awssysops-p1-q223"], "statement": "Reaching the account's maximum EBS volume limit can cause an EC2 instance to terminate immediately after launch.", "status": "supported"}, {"claim_type": "rule", "conditions": ["IAM user has CloudWatch permissions but not EC2 permissions"], "confidence": "high", "id": "cl-ef09eb226222", "source_question_ids": ["awssysops-p1-q230"], "statement": "An IAM user with only CloudWatch permissions can still create a CloudWatch alarm and configure an EC2 stop/terminate action on it, since CloudWatch permissions are sufficient for the configuration step.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2ce09a2de24f", "source_question_ids": ["awssysops-p1-q230"], "statement": "When a CloudWatch alarm fires, executing a configured EC2 action (such as stopping an instance) requires the triggering IAM user/role to have the relevant EC2 permissions.", "status": "supported"}, {"claim_type": "fact", "conditions": ["IAM user has CloudWatch permissions but not EC2 permissio atically released when the EC2 instance they were associated with is terminated.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-4255e3ab33bd", "source_question_ids": ["awssysops-p1-q254"], "statement": "For an application running on an EC2 instance that needs to call another AWS service (e.g. DynamoDB), AWS best practice is to attach an IAM role with the needed permissions to the EC2 instance rather than embedding IAM user credentials in the application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f75bacb9b7a3", "source_question_ids": ["awssysops-p1-q254"], "statement": "An EC2 instance with an attached IAM role automatically receives temporary security credentials for that role, removing the need to embed static credentials in application code.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-37bdb307fb47", "source_question_ids": ["awssysops-p1-q254"], "statement": "Creating an IAM user and distributing its credentials within an application for AWS service access is a less secure practice than attaching an instance IAM role.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-827554316d65", "source_question_ids": ["awssysops-p1-q254"], "statement": "Attaching an IAM role that grants only EC2 access to an instance does not provide the DynamoDB permissions an application needs to call the DynamoDB API; a role's permissions must match the service actually being called.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8e5f965664f3", "source_question_ids": ["awssysops-p1-q259"], "statement": "SSH raises an 'Unprotected Private Key File' error as a safeguard when a private key file (.pem) on the client machine has overly permissive file permissions.", "status": "supported"}, {"claim_type": "rule", "conditions":
