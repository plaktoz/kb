n ALB's target groups can force session affinity that undermines the caching/offload benefit a fronting CloudFront distribution is meant to provide.", "status": "needs-review"}, {"claim_type": "exception", "confidence": "low", "id": "cl-0-65", "source_question_ids": ["awssysops-p3-1-q881"], "statement": "For why a CloudFront-fronted ALB still sees unreduced load, besides DNS bypass, the second cause is disputed within the community itself: TTLs set to 0 seconds (which disables caching) and ALB sticky sessions (which undermines caching) are each cited by roughly half of commenters, with no clear consensus.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["CloudFront distribution using default cache behavior configuration"], "confidence": "high", "id": "cl-0-66", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "With CloudFront's default configuration, cookies are not forwarded to the origin at all, so an origin's session cookie (e.g., set by an ALB for sticky sessions) never reaches the origin on subsequent requests unless CloudFront is explicitly configured to forward it.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-0-67", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "For a stateful application behind CloudFront and an ALB, enabling ALB session affinity (sticky sessions) together with configuring CloudFront to forward all cookies to the origin fixes intermittent logout / inconsistent content issues, since it addresses both the ALB-side routing and the CloudFront-side cookie-stripping causes.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-0-68", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "For fixing intermittent logouts on a CloudFront-fronted stateful ALB application, the source's boxed/labeled answer is switching from duration-based to application-controlled ALB sticky sessions, but this does nothing about CloudFront's default cookie-stripping behavior, which community consensus unanimously identifies as the actual root cause requiring cookie forwarding plus sticky sessions.", "status": "conflicted"}, {"claim_type": "rule", "confidence": "high", "id": "cl-0-69", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "Geographic access latency for users far from a single-region deployment is best addressed by combining edge caching of static content (CloudFront) with routing users to a second, geographically nearer full production environment (via Route 53 latency-based routing).", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-0-70", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "An Application Load Balancer is a Regional resource and cannot distribute traffic across two separate AWS Regions; cross-Region routing must be done by Route 53, not the ALB.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-0-71", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "Tuning the EC2 Auto Scaling group's CPU scaling threshold has no effect on a reported performance issue when CloudWatch shows the actual bottleneck is on a different tier (e.g., the RDS instance at 70% CPU, not the EC2 web tier), and would not address a geography-based latency gap in any case.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-0-72", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "For fixing geographic latency for Asia-based users of a single-region production environment, the source's boxed/labeled answer proposes provisioning a second Asia Pacific environment fronted by a single cross-Region ALB, but this is a technical impossibility since ALBs cannot span AWS Regions; community consensus instead favors Route 53 latency-based routing to the second environment plus CloudFront for static content.", "status": "conflicted"}], "mentalModel": {"id": "aws-sysops-service-cloudfront--mm-cloudfront-edge-cache", "title": "CloudFront is an in-path edge cache that serves cacheable content from a location near each user", "purpose": "Reach for CloudFront when the problem is (a) latency for users geographically far from a single origin/region, and/or (b) origin load from repeated reads of the same content during a traffic or download spike. It solves both at once by caching content at globally distributed edge locations so repeat requests never reach the origin and are answered close to the user, regardless of where the origin lives.", "mechanism": "A viewer request resolves to the nearest CloudFront edge location. If the requested object is present in that edge's cache and its TTL has not expired, CloudFront returns it directly -- no origin round-trip, low latency, and the origin sees no load. On a cache miss (or expired TTL), the edge fetches the object from the configured origin (an S3 bucket, or a custom origin such as an ELB/ALB), stores it under a cache key, and serves it; subsequent identical requests are hits. The cache key is built from the request path plus whichever cookies, query strings, and headers the cache behavior is configured to forward -- so every forwarded element that varies splits the cache into more entries and lowers the hit ratio. Two levers govern hit ratio: TTL (default/min/max -- higher means objects stay cached longer before re-validating; setting all three to 0 disables caching and forwards every request to the origin) and cache-key minimization (forward only what the origin truly needs). Critically, CloudFront only does anything if traffic actually flows through it: client DNS must resolve to the CloudFront distribution's domain name, or requests bypass it and hit the origin (e.g. the ALB) at full unreduced load.", "invariants": ["Edge caching reduces latency for distant users AND offloads repeat reads from the origin at the same time, independent of the origin's region (cl-0-0, cl-0-5, cl-0-31).", "Only cacheable content benefits; whether a given request is a hit or a miss is decided entirely by the cache key (path + forwarded cookies/headers/query strings) (cl-0-41).", "Cache hit ratio rises when TTL is longer and when fewer cache-key elements are forwarded (cl-0-41, cl-0-42).", "CloudFront can only offload/accelerate traffic that is actually routed through it -- DNS must point at the distribution's domain (cl-0-62)."], "limits": ["TTL of 0 (default/min/max) effectively disables caching -- every request goes straight to the origin (cl-0-61).", "By default CloudFront forwards no cookies to the origin, so origin-set session/sticky cookies never return unless forwarding is explicitly configured (cl-0-66); a stateful app needs cookie forwarding plus ALB session affinity (cl-0-67).", "It does not reduce database read load -- that is ElastiCache or RDS read replicas, which act on the DB tier, not on object transfer (cl-0-2, cl-0-34).", "OAI only restricts the S3 origin to CloudFront; it provides no per-user authorization (that needs signed URLs/cookies) and is meaningless when the origin is an ALB (cl-0-13, cl-0-28, cl-0-63).", "Geo-restriction is country-granular only -- it cannot allow/deny an individual IP (cl-0-22, cl-0-46)."], "cues": ["\"reduce latency for users far from the origin/region\" or \"users worldwide\"", "\"absorb a flash download / traffic spike\" or \"patch release hammering the web servers\"", "\"reduce load on the origin / S3 bucket / web tier from repeat reads of the same static objects\"", "\"increase the cache hit ratio\" or tuning TTL / forwarded headers/cookies/query strings", "\"serve static assets, images, patches, or articles globally at low cost\""], "limits_note": null, "predict_prompt": "A single-region web app serves the same images from an S3 origin and is slow for users in Asia; during spikes the origin is hammered by repeat reads. The team adds a CloudFront distribution, but latency for distant users is unchanged and the origin still sees the full load. Give two distinct configuration reasons this can happen, and for each say what CloudFront was supposed to do if configured correctly.", "claim_ids": ["cl-0-0", "cl-0-5", "cl-0-14", "cl-0-17", "cl-0-31", "cl-0-35", "cl-0-41", "cl-0-42", "cl-0-61", "cl-0-62", "cl-0-66"]}, "contrastSet": {"id": "aws-sysops-service-cloudfront--cs-cloudfront-vs-elasticache-vs-route53-latency", "subjects": ["Amazon CloudFront (edge caching)", "Amazon ElastiCache", "Route 53 latency-based routing"], "dimensions": ["What it caches / acts on", "Which bottleneck it relieves", "Effect on latency for far-away users", "Precondition to have any effect"], "matrix": {"What it caches / acts on": {"Amazon CloudFront (edge caching)": "Cacheable HTTP objects (static assets, images, patches, articles; or a custom ELB/ALB origin) held at edge locations worldwide (cl-0-0, cl-0-17, cl-0-31, cl-0-35)", "Amazon ElastiCache": "Frequently-accessed database query results, in memory, in one region, in front of a relational DB such as RDS (cl-0-2, cl-0-34)", "Route 53 latency-based routing": "Nothing -- it is DNS routing that picks the fastest among existing regional endpoints, it caches no content (cl-0-6, cl-0-7)"}, "Which bottleneck it relieves": {"Amazon CloudFront (edge caching)": "Origin load from repeat reads AND network distance to users -- both at once (cl-0-0, cl-0-31)", "Amazon ElastiCache": "Database read query load hitting the RDS primary (cl-0-2, cl-0-34)", "Route 53 latency-based routing": "Steers each user to whichever regional deployment is nearest/fastest (cl-0-7, cl-0-69)"}, "Effect on latency for far-away users": {"Amazon CloudFront (edge caching)": "Directly reduces it -- content is served from a nearby edge regardless of origin region (cl-0-5)", "Amazon ElastiCache": "None -- still one region; it only shortens DB query time, not object transfer to distant browsers (cl-0-34, cl-0-36)", "Route 53 latency-based routing": "Reduces it only if a second, nearer full regional deployment actually exists to route to (cl-0-7, cl-0-69)"}, "Precondition to have any effect": {"Amazon CloudFront (edge caching)": "Content must be cacheable, TTL > 0, and DNS must resolve to the CloudFront domain (cl-0-61, cl-0-62)", "Amazon ElastiCache": "There must be a relational DB whose read queries repeat (cl-0-2, cl-0-34)", "Route 53 latency-based routing": "Two or more regional origins/endpoints must exist -- it is a no-op with a single origin in one region (cl-0-6, cl-0-56)"}}, "decision_rule": "Flip on WHAT is actually slow or overloaded and WHERE. If the thing to speed up is delivering cacheable content over network distance and/or offloading repeat reads from the origin -> CloudFront. If it is the database read-query load on RDS -> ElastiCache (or read replicas). If it is steering users among multiple already-existing regional deployments -> Route 53 latency-based routing. CloudFront is correct precisely when the bottleneck is content transfer/repeat reads, not DB load and not multi-region endpoint selection.", "boundary_flip": "Start: single-region site, slow static-content downloads for distant users and repeat reads hammering the origin -> CloudFront. Change the stated bottleneck to 'RDS is at high read load under a read-heavy spike' (content transfer is fine) -> the correct choice flips to ElastiCache / RDS read replicas. Alternatively, add a second full production deployment in a nearer region and ask how to send users to the closest one -> the correct choice flips to Route 53 latency-based routing, which was a pure no-op while only one regional origin existed.", "shared_traits": ["All three are pitched as latency/performance improvements and are commonly offered together as answer choices.", "All aim to keep users from waiting on a distant or overloaded backend."], "exceptions": ["With only a single ALB/origin in one region, enabling Route 53 latency-based routing changes nothing -- every request already resolves to that one endpoint (cl-0-56, cl-0-60).", "ElastiCache caches DB query results, not object-storage/S3 reads, so it cannot offload an S3 read spike or speed large object downloads (cl-0-34, cl-0-36)."], "strongest_distractor_failure": "Route 53 latency-based routing is the strongest distractor: it sounds like it 'reduces latency,' so it gets paired with Auto Scaling as a fix for a slow single-region site -- but with only one ALB in one region it routes to the same endpoint no matter what and does nothing. The community-favored fix is CloudFront caching of static content plus Auto Scaling instead (cl-0-6, cl-0-56, cl-0-60, cl-0-72).", "claim_ids": ["cl-0-0", "cl-0-2", "cl-0-5", "cl-0-6", "cl-0-7", "cl-0-31", "cl-0-34", "cl-0-35", "cl-0-36", "cl-0-56", "cl-0-60", "cl-0-69", "cl-0-72"]}, "scenarioFamily": {"id": "aws-sysops-service-cloudfront--aws-sysops-service-cloudfront--sf-cloudfront-ttl-dns-misconfig", "canonical": {"variant_type": "canonical", "prompt": "A retailer runs a single-region web app behind an ALB, with product images stored in one S3 bucket. Asia-based users report slow image loads, and every flash sale drives a wave of repeat requests for the same handful of images that hammers the S3 origin. The team creates a CloudFront distribution using that S3 bucket as its origin, but (1) leaves the distribution's default, minimum, and maximum TTL all at 0 seconds, and (2) never updates the app's DNS record, which still resolves directly to the S3 bucket's endpoint rather than to the CloudFront distribution's domain name. After the change ships, Asia-based users see no latency improvement and the origin is hammered just as hard during the next flash sale. Name the two distinct misconfigurations at fault, and for each say what CloudFront would have done for the corresponding bottleneck (distant-user latency vs. origin load) if it had been configured correctly.", "expected_answer": ["TTL 0 across default/min/max disables caching outright, so even though CloudFront is in front of S3, every single request -- from any user, from any region -- is forwarded straight through to the origin instead of being served from cache; with a nonzero TTL, edge locations would serve repeat image requests from cache during the flash sale, keeping load off the S3 origin.", "DNS still resolves to the S3 bucket's own endpoint, not the CloudFront distribution's domain name, so traffic never enters CloudFront's edge network at all; pointing DNS at the distribution's domain would let the nearest edge location answer Asia-based users' requests locally, cutting their latency regardless of the origin's region."], "reasoning": "The mechanism only helps if the object is actually cached (TTL>0) and the request actually reaches an edge location (DNS resolves to the distribution). cl-0-61 states TTL=0 on default/min/max disables caching and forwards every request to the origin. cl-0-62 states that if DNS still resolves to the origin (here, S3) rather than the distribution domain, traffic bypasses CloudFront and the origin sees full unreduced load. cl-0-0/cl-0-31 establish that correctly functioning edge caching offloads repeat reads from the origin, and cl-0-5 establishes it independently cuts latency for geographically distant users. Both failures are necessary and independent: fixing only one leaves the other bottleneck (either the latency symptom or the origin-load symptom) unresolved.", "claim_ids": ["cl-0-0", "cl-0-5", "cl-0-31", "cl-0-61", "cl-0-62"], "difficulty": "medium", "importance": "high", "distractor_analysis": "The natural error is to treat this as one bug with one fix -- e.g. 'just point DNS at CloudFront' -- and stop there, missing that TTL=0 would still send every request past the (now correctly reached) edge straight to the origin, so the flash-sale origin-load symptom would persist even after the DNS fix. Symmetrically, fixing only the TTL leaves DNS resolving straight to S3, so nothing ever reaches an edge location and Asia latency is untouched. Also a plausible misdiagnosis blames CloudFront itself as 'not caching S3 content correctly' rather than two independent, ordinary configuration knobs."}, "variants": [{"variant_type": "boundary", "changed_condition": "Both original misconfigurations are fixed -- TTL is set to a nonzero value and DNS now correctly resolves to the CloudFront distribution's domain -- but the cache behavior is left configured to forward every cookie, header, and query string to the origin.", "prompt": "Same setup as before, except the team has since fixed both problems: TTL is now set to a sensible nonzero value, and DNS correctly points at the CloudFront distribution's domain name. However, the cache behavior for the image path is still configured to forward all cookies, all headers, and all query strings to the origin. Asia-based users now see somewhat better latency, but the origin is still hit far more often than expected during flash sales, and the hit ratio in the CloudFront reports stays low. What's the remaining misconfiguration, and what's the fix?", "expected_answer": ["The cache key is built from the request path plus every forwarded cookie/header/query string; forwarding all of them means near-identical image requests get treated as distinct cache keys, so most requests miss and are re-fetched from the origin even though the underlying object is the same. This is a different failure mode than TTL=0 or DNS bypass -- caching is active and traffic is reaching CloudFront, but the cache key is needlessly fragmented.", "The fix is cache-key minimization: reconfigure the cache behavior to forward only the cookies, headers, and query strings the origin actually needs for this path (ideally none, for static images), which collapses requests for the same object back onto the same cache key and raises the hit ratio."], "reasoning": "This flips the diagnosis relative to the canonical scenario: once TTL and DNS are no longer the problem, the invariant that cache hit ratio rises when fewer cache-key elements are forwarded (cl-0-41) becomes the operative one, since cl-0-41 also states the cache key is built from path plus whatever cookies/headers/query strings are forwarded, and every forwarded element that varies splits the cache into more entries. This is a genuine boundary: right at the edge between 'broken because caching/routing is off' and 'working but inefficient,' the root cause and remedy change even though the surface symptom (origin still overloaded) looks similar.", "claim_ids": ["cl-0-41"], "difficulty": "hard", "importance": "medium", "distractor_analysis": "A test-taker who over-anchors on the canonical scenario may keep hunting for a TTL or DNS problem and miss that both are already fixed here; the actual lever is cache-key composition, not TTL or reachability."}, {"variant_type": "irrelevant-detail", "changed_condition": "The team also switches the distribution's Viewer Protocol Policy to HTTPS-only and enables automatic compression of objects, on top of the original TTL=0 and DNS-bypass misconfigurations.", "prompt": "Same setup as the canonical scenario (TTL 0 on default/min/max, DNS still pointing at the S3 endpoint instead of the CloudFront domain). While making the change, the team also flips the distribution's Viewer Protocol Policy to HTTPS-only and enables automatic compression of served objects. After deployment, Asia-based users still see no latency improvement and the origin is still hammered during flash sales. What explains the unchanged behavior, and do the HTTPS-only and compression changes play any role?", "expected_answer": ["TTL 0 across default/min/max still disables caching entirely, so every request is forwarded straight to the S3 origin instead of being served from cache -- unrelated to the protocol or compression settings.", "DNS still resolving to the S3 endpoint instead of the CloudFront distribution's domain still means traffic never reaches an edge location -- also unrelated to those settings.", "The Viewer Protocol Policy (HTTPS-only) and automatic compression play no role in the problem: HTTPS-only affects transport security, not caching, and compression affects transferred object size, not whether a request is a cache hit or miss -- neither changes the hit ratio, so neither explains or fixes the symptoms."], "reasoning": "cl-0-43 states that changing Viewer Protocol Policy to HTTPS-only affects transport security, not caching behavior, and does not change the cache hit ratio; cl-0-45 states enabling compression changes object size, not whether a request is a hit or miss. Neither claim bears on the actual causes, which remain cl-0-61 (TTL 0 disables caching) and cl-0-62 (DNS bypass). The expected answer is unchanged from canonical because these two added settings are causally inert with respect to the observed symptoms.", "claim_ids": ["cl-0-43", "cl-0-45", "cl-0-61", "cl-0-62"], "difficulty": "easy", "importance": "medium", "distractor_analysis": "A test-taker might assume any protocol/security-adjacent CloudFront setting could plausibly be 'the missing piece' and spend effort investigating HTTPS or compression settings, when both are explicitly orthogonal to caching and unrelated to the reported symptoms."}, {"variant_type": "adversarial-distractor", "changed_condition": "Instead of fixing the CloudFront TTL/DNS misconfiguration, a teammate proposes adding ElastiCache in front of the S3 origin and enabling Route 53 latency-based routing as the fix.", "prompt": "Same canonical setup (TTL 0 on default/min/max, DNS still pointing at the S3 endpoint instead of the CloudFront distribution). A teammate proposes leaving the CloudFront configuration as-is and instead: (a) adding an ElastiCache cluster in front of the S3 bucket to cut origin load, and (b) enabling Route 53 latency-based routing to fix the Asia-based latency complaint. Would either of these actually fix the reported problems? Why or why not, and what's still actually broken?", "expected_answer": ["Neither proposal fixes anything: ElastiCache is designed to cache database query results in front of a relational database like RDS, not object-storage reads from S3, so it cannot offload the repeat S3 image reads at all.", "Route 53 latency-based routing only changes behavior when multiple regional endpoints/origins exist to route between; with a single-region deployment (one S3 origin, one region), it is a no-op -- there is nothing else to route Asia-based users to.", "The actual causes are unchanged and untouched by either proposal: TTL 0 on the CloudFront distribution still disables caching (forwarding every request to the S3 origin), and DNS still resolving to the S3 endpoint instead of the CloudFront domain still means traffic never reaches an edge location. Both must still be fixed."], "reasoning": "This tests whether the model correctly rejects two plausible-sounding but inapplicable AWS services. cl-0-34 establishes ElastiCache fronts a relational database's query results, not S3 object reads -- so it can't touch this bottleneck. cl-0-6 and cl-0-56 establish Route 53 latency-based routing requires multiple regional endpoints to have any effect at all; with only one region it is a no-op. Because the underlying causes are untouched, the expected answer necessarily still includes the same two root causes as canonical (cl-0-61, cl-0-62), now with the added burden of explaining why the distractor fixes fail.", "claim_ids": ["cl-0-34", "cl-0-6", "cl-0-56", "cl-0-61", "cl-0-62"], "difficulty": "hard", "importance": "high", "distractor_analysis": "Both proposed fixes are the classic distractor pattern from this claim set: ElastiCache and Route 53 latency-based routing are both real, legitimate AWS latency/load tools, which makes them tempting even though neither applies here -- ElastiCache targets DB reads, and single-region deployments make latency-based routing vacuous. The strongest failure mode is accepting either as sufficient without checking its precondition (a DB workload for ElastiCache; multiple regions for Route 53 LBR)."}, {"variant_type": "transfer", "changed_condition": "The origin is now the company's own web-server fleet behind an ALB (a custom origin, not S3), and the cached content is downloadable software patches rather than images, with the same underlying spike-plus-distance failure mode; DNS still points at the ALB instead of the CloudFront domain, and TTL is still 0.", "prompt": "A software vendor distributes installer patches from its own web servers behind an ALB (no S3 involved). Whenever a patch ships, download traffic spikes and hammers the ALB/web tier, and users far from the deployment region see slow downloads. The team fronts the ALB with a CloudFront distribution, configured with the ALB as a custom origin, but leaves TTL at 0 on default/min/max and never updates the download links, which still point at the ALB's own DNS name rather than the CloudFront distribution's domain. After the next patch release, distant users still see the same slow downloads and the ALB is hammered just as hard. What's wrong, and does it matter that the origin here is an ALB rather than S3?", "expected_answer": ["It doesn't matter that the origin is an ALB rather than S3 -- CloudFront can use a custom origin such as an ELB/ALB just as it can use S3, and the same two failure modes apply: TTL 0 on default/min/max still disables caching, forwarding every download request straight to the ALB instead of serving repeat requests for the same patch file from an edge cache.", "The download links still pointing at the ALB's own DNS name rather than the CloudFront distribution's domain means requests never enter CloudFront's edge network at all, so distant users get no latency benefit and the ALB continues to absorb the full, unreduced spike."], "reasoning": "This transfers the canonical mechanism to a different but structurally identical setting. cl-0-35 establishes CloudFront can front a custom origin like an ELB/ALB, not just S3. cl-0-17 establishes that fronting downloadable software patches with CloudFront absorbs flash-download-spike traffic by caching those static files at the edge. The same two root causes from canonical -- TTL 0 disabling caching (cl-0-61) and DNS not resolving to the CloudFront domain, so traffic bypasses it and the origin sees full load (cl-0-62) -- apply unchanged, since neither depends on origin type (S3 vs. ALB) or content type (images vs. patches).", "claim_ids": ["cl-0-17", "cl-0-35", "cl-0-61", "cl-0-62"], "difficulty": "medium", "importance": "medium", "distractor_analysis": "A test-taker might think the fix differs because the origin is now an ALB instead of S3 (e.g., reaching for Origin Access Identity, which is S3-specific per cl-0-63, or assuming CloudFront can't front a load balancer at all), when in fact the origin type is irrelevant to these two particular misconfigurations and the same TTL/DNS fixes apply."}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "cl-0-35 claims CloudFront (with an ELB custom origin) 'caches large dynamically-generated, per-visitor objects at edge locations and directly speeds up their download' — and this claim is carried into both the mental model (listed in its claim_ids; the mechanism cites 'a custom origin such as an ELB/ALB') and the contrast set matrix ('What it caches / acts on' for CloudFront). This contradicts the mental model's own invariant that 'Only cacheable content benefits; whether a given request is a hit or a miss is decided entirely by the cache key (path + forwarded cookies/headers/query strings)' and cl-0-41 (per-request cache-key variation lowers the hit ratio). cl-0-37 (from the same q641) describes the content as 'dynamically generated per visitor ... and updated daily.' If content genuinely varies per visitor, edge caching produces near-zero hits, so it cannot 'directly speed up download' via caching; CloudFront's real benefit for such dynamic content is connection/AWS-backbone optimization, a mechanism the material never states and instead misattributes to 'caching.' The result is an internally inconsistent and technically dubious generation that could teach a wrong model of when CloudFront caching helps.", "related_entity_ids": ["cl-0-35", "cl-0-37", "cl-0-41", "aws-sysops-service-cloudfront--mm-cloudfront-edge-cache", "aws-sysops-service-cloudfront--cs-cloudfront-vs-elasticache-vs-route53-latency"]}, {"type": "quality", "severity": "low", "description": "cl-0-25 gives '403 unauthorized' as an example of a client-error response. HTTP 403 is 'Forbidden'; 401 is 'Unauthorized.' The 401-vs-403 distinction is a real, testable point for a SysOps exam, so labeling 403 as 'unauthorized' is an imprecision in the study material, even though the surrounding claim (4xxErrorRate measures client-error responses) is correct.", "related_entity_ids": ["cl-0-25"]}]}]}</script>

  // ---------- safe HTML templating: `safe` escapes every interpolated

  function listBlock(title, items) {

  function citationsHtml(claimIds) {

    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`<ul class="citations">${raw(claims.map(function (c) {
      return safe`<li>${c.statement} <span class="muted">(${c.status || 'status unknown'})</span></li>`;
    }).join(''))}</ul>`;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private/incognito mode?) '
        + '-- progress will NOT be saved after this tab closes. Export your progress before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose">${model.purpose || ''}</p>
        <div class="predict-block">
          <label for="predict-input"><strong>Predict first</strong></label>
          <p class="prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="2" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<button id="reveal-model-btn" type="button">Reveal mechanism</button>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          <h3>Supporting claims</h3>
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <table class="contrast-table">
          <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
          <tbody>${raw(rows)}</tbody>
        </table>
        <h3>Decision rule</h3>
        <p>${cs.decision_rule || ''}</p>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        <h3>Supporting claims</h3>
        ${raw(citationsHtml(cs.claim_ids))}
        <p><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <p class="summary">Session complete: ${correctCount}/${attempted.length} correct.</p>
          <button id="practice-restart" type="button">Restart queue</button>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices">${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"> ${c.letter}. ${c.text}</label>`;
        }).join(''))}</fieldset>`
      : safe`<textarea id="predict-freeform" rows="2" placeholder="Type your prediction..."></textarea>`;
    var metaLine = (item.difficulty || item.importance)
      ? safe`<p class="muted">Difficulty: ${item.difficulty || 'n/a'} &middot; Importance: ${item.importance || 'n/a'}</p>`
      : '';
    var changedCondition = item.changed_condition
      ? safe`<p class="changed-condition"><strong>Changed condition:</strong> ${item.changed_condition}</p>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice (${practiceIndex + 1} / ${items.length}) &mdash; ${item.variant_type || 'item'}</h2>
        ${raw(changedCondition)}
        ${raw(metaLine)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence (optional)</legend>
          ${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"> ${c}</label>`; }).join(''))}
        </fieldset>
        <button id="reveal-practice-btn" type="button">Reveal</button>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedAnswerText = Array.isArray(item.expected_answer) ? item.expected_answer.join(', ') : (item.expected_answer || '');
    var distractors = item.distractor_analysis
      ? safe`<p class="distractors"><strong>Why other options fail:</strong> ${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <p><strong>Expected answer:</strong> ${expectedAnswerText}</p>
      <p>${item.reasoning || ''}</p>
      ${raw(distractors)}
      <h4>Supporting claims</h4>
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="${raw(isMulti ? 'hidden' : '')}">
        <p>Self-assess:</p>
        <button type="button" id="self-correct">I got it right</button>
        <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
      </div>
      <button id="practice-next-btn" type="button" disabled>Next</button>`;

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      revealBox.querySelector('#practice-next-btn').removeAttribute('disabled');
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------
  function itemLookup(itemId) {
    return practiceItems().find(function (i) { return i.id === itemId; });
  }

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {
          var item = itemLookup(a.itemId);
          var prompt = item ? (item.prompt || item.stem || '') : '(item no longer in scenario family)';
          var predictedText = Array.isArray(a.predicted) ? a.predicted.join(', ') : (a.predicted || '(no answer recorded)');
          var radios = DIAGNOSIS_CATEGORIES.map(function (c) {
            return safe`<label class="diagnosis-option"><input type="radio" name="diagnosis-${a.id}" value="${c.key}"> <strong>${c.label}</strong> &mdash; ${c.hint}</label>`;
          }).join('');
          return safe`
            <div class="pending-attempt" data-attempt-id="${a.id}">
              <p class="prompt">${prompt}</p>
              <p class="muted">Your answer: ${predictedText}</p>
              <fieldset>${raw(radios)}</fieldset>
              <button type="button" class="submit-diagnosis">Submit diagnosis</button>
            </div>`;
        }).join('')
      : safe`<p class="empty">No pending diagnoses &mdash; nice work.</p>`;

    var historyHtml = history.length
      ? safe`<ul class="diagnosis-history">${raw(history.map(function (a) {
          var cat = DIAGNOSIS_CATEGORIES.find(function (c) { return c.key === a.diagnosis; });
          var label = cat ? cat.label : a.diagnosis;
          var item = itemLookup(a.itemId);
          var excerpt = (item ? (item.prompt || item.stem || '') : a.itemId).slice(0, 80);
          var when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '';
          return safe`<li><span class="muted">${when}</span> &mdash; <strong>${label}</strong> &mdash; ${excerpt}</li>`;
        }).join(''))}</ul>`
      : safe`<p class="empty">No diagnosed mistakes yet.</p>`;

    var html = safe`
      <section class="diagnose">
        <h2>Diagnose</h2>
        <p><a href="${sliceHref('learn')}">&larr; Revisit Learn</a></p>
        <h3>Needs diagnosis (${pending.length})</h3>
        ${raw(pendingHtml)}
        <h3>History (${history.length})</h3>
        ${raw(historyHtml)}
      </section>`;
    var node = fromHTML(html);
    node.querySelectorAll('.pending-attempt').forEach(function (el) {
      el.querySelector('.submit-diagnosis').addEventListener('click', function () {
        var checked = el.querySelector('input[type="radio"]:checked');
        if (!checked) return;
        var attemptId = el.getAttribute('data-attempt-id');
        var attempt = STATE.attempts.find(function (a) { return a.id === attemptId; });
        if (attempt) {
          attempt.diagnosis = checked.value;
          saveState();
          navigate();
        }
      });
    });
    return node;
  }

  // ---------- Explore Sources ----------
  var sourcesSearchTerm = '';
  var expandedSourceId = null;

  function questionMatches(q, term) {
    if (!term) return true;
    var choiceText = (q.choices || []).map(function (c) { return c.text; }).join(' ');
    var haystack = [q.id, q.stem, q.explanation, choiceText].join(' ').toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function citingClaims(questionId) {
    return (CURRENT.claims || []).filter(function (c) { return (c.source_question_ids || []).indexOf(questionId) !== -1; });
  }

  function issuesHtml() {
    var issues = CURRENT.issues || [];
    if (!issues.length) return safe`<p class="muted">No open issues.</p>`;
    return safe`<ul class="issues">${raw(issues.map(function (i) {
      return safe`<li><span class="badge severity-${i.severity || 'unknown'}">${i.severity || 'unknown'}</span> <strong>${i.type || 'issue'}</strong>: ${i.description || ''}</li>`;
    }).join(''))}</ul>`;
  }

  function sourceRowHtml(q) {
    var isOpen = q.id === expandedSourceId;
    var detail = '';
    if (isOpen) {
      var citing = citingClaims(q.id);
      var choiceItems = (q.choices || []).map(function (c) {
        var cls = (q.correct_answer || []).indexOf(c.letter) !== -1 ? 'correct-choice' : '';
        return safe`<li class="${cls}">${c.letter}. ${c.text}</li>`;
      }).join('');
      var citedList = citing.length
        ? safe`<ul>${raw(citing.map(function (c) { return safe`<li>${c.statement}</li>`; }).join(''))}</ul>`
        : safe`<p class="muted">No claims cite this question yet.</p>`;
      var src = q.source || {};
      detail = safe`
        <tr class="detail-row">
          <td colspan="4">
            <p>${q.stem}</p>
            <ul>${raw(choiceItems)}</ul>
            <p><strong>Explanation:</strong> ${q.explanation || ''}</p>
            <p class="muted">Source: ${src.file || ''} (p. ${src.page !== undefined ? src.page : '?'}, Q${src.question_number !== undefined ? src.question_number : '?'})</p>
            <h4>Cited by (${citing.length})</h4>
            ${raw(citedList)}
          </td>
        </tr>`;
    }
    var disputedBadge = q.disputed ? ' <span class="badge">disputed</span>' : '';
    return safe`
      <tr class="source-row" data-id="${q.id}">
        <td>${q.id}</td>
        <td>${q.status || ''}${raw(disputedBadge)}</td>
        <td>${(q.stem || '').slice(0, 90)}</td>
        <td>${(q.correct_answer || []).join(', ')}</td>
      </tr>${raw(detail)}`;
  }

  function renderSources() {
    var questions = CURRENT.sourceQuestions || [];
    var html = safe`
      <section class="sources">
        <h2>Explore Sources</h2>
        <h3>Issues (${(CURRENT.issues || []).length})</h3>
        ${raw(issuesHtml())}
        <input type="search" id="sources-search" placeholder="Search stem, choices, explanation...">
        <p class="muted" id="sources-count"></p>
        <table class="sources-table">
          <thead><tr><th>ID</th><th>Status</th><th>Stem</th><th>Correct</th></tr></thead>
          <tbody id="sources-tbody"></tbody>
        </table>
      </section>`;
    var fragment = fromHTML(html);
    var section = fragment.firstElementChild;
    var input = section.querySelector('#sources-search');
    input.value = sourcesSearchTerm;

    function renderRows() {
      var filtered = questions.filter(function (q) { return questionMatches(q, sourcesSearchTerm); });
      section.querySelector('#sources-count').textContent = filtered.length + ' / ' + questions.length + ' questions';
      var tbody = section.querySelector('#sources-tbody');
      tbody.innerHTML = filtered.map(sourceRowHtml).join('');
      tbody.querySelectorAll('.source-row').forEach(function (row) {
        row.addEventListener('click', function () {
          var id = row.getAttribute('data-id');
          expandedSourceId = expandedSourceId === id ? null : id;
          renderRows();
        });
      });
    }

    input.addEventListener('input', function () {
      sourcesSearchTerm = input.value;
      renderRows();
    });
    renderRows();
    return fragment;
  }

  // ---------- slice selection ----------
  var DEFAULT_SLICE_ID = null;

  function populateSliceSelect(manifest) {
    DEFAULT_SLICE_ID = manifest.length ? manifest[0].id : null;
    var select = document.getElementById('slice-select');
    select.innerHTML = manifest.map(function (s) {
      return safe`<option value="${s.id}">${s.facet.key}: ${s.facet.value} (${s.questionCount} q)</option>`;
    }).join('');
    document.getElementById('slice-controls').classList.toggle('hidden', manifest.length <= 1);
    select.addEventListener('change', function () {
      location.hash = '#' + encodeURIComponent(select.value) + '/' + parseHash().mode;
    });
  }

  function activateSlice(sliceId) {
    return loadSlice(sliceId).then(function (slice) {
      CURRENT = slice;
      STORAGE_KEY = 'ekd:' + slice.contentSet.id + ':' + slice.contentSet.schemaVersion;
      STATE = loadState();
      practiceIndex = 0;
      sourcesSearchTerm = '';
      expandedSourceId = null;
      document.getElementById('app-title').textContent =
        CURRENT.contentSet.exam + ' — ' + CURRENT.contentSet.facet.key + ': ' + CURRENT.contentSet.facet.value;
      var select = document.getElementById('slice-select');
      if (select.value !== slice.contentSet.id) select.value = slice.contentSet.id;
      renderStorageWarning();
    });
  }

  // ---------- routing: "#<sliceId>/<mode>", falling back to the active (or
  // first) slice when the hash omits one -- e.g. on first load. ----------
  var ROUTES = { learn: renderLearn, compare: renderCompare, practice: renderPractice, diagnose: renderDiagnose, sources: renderSources };
  var DEFAULT_MODE = 'learn';

  function sliceHref(mode) {
    return '#' + encodeURIComponent(CURRENT.contentSet.id) + '/' + mode;
  }

  function parseHash() {
    var rawHash = (location.hash || '').slice(1);
    var slashIndex = rawHash.indexOf('/');
    var fallbackSliceId = CURRENT ? CURRENT.contentSet.id : DEFAULT_SLICE_ID;
    if (slashIndex === -1) {
      return { sliceId: fallbackSliceId, mode: ROUTES.hasOwnProperty(rawHash) ? rawHash : DEFAULT_MODE };
    }
    var sliceId = decodeURIComponent(rawHash.slice(0, slashIndex)) || fallbackSliceId;
    var mode = rawHash.slice(slashIndex + 1);
    return { sliceId: sliceId, mode: ROUTES.hasOwnProperty(mode) ? mode : DEFAULT_MODE };
  }

  function navigate() {
    var target = parseHash();
    var proceed = (!CURRENT || CURRENT.contentSet.id !== target.sliceId)
      ? activateSlice(target.sliceId)
      : Promise.resolve();
    return proceed.then(function () {
      document.querySelectorAll('#nav a').forEach(function (a) {
        var mode = a.getAttribute('data-route');
        a.setAttribute('href', sliceHref(mode));
        a.classList.toggle('active', mode === target.mode);
      });
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(ROUTES[target.mode]());
    });
  }

  // ---------- init ----------
  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('import-input').addEventListener('change', importProgress);
  window.addEventListener('hashchange', navigate);
  getManifest().then(function (manifest) {
    populateSliceSelect(manifest);
    return navigate();
  });
})();
</script>
</body>
</html>
