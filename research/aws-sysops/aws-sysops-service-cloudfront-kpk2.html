<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  :root {
    --ink: #1b1f24;
    --muted: #5b6572;
    --line: #d9dee3;
    --bg: #ffffff;
    --bg-alt: #f5f7f9;
    --accent: #2f5fb3;
    --ok: #1a7f4e;
    --bad: #b3261e;
    --warn: #8a5a00;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    margin: 0;
  }
  header {
    border-bottom: 1px solid var(--line);
    background: var(--bg-alt);
    padding: 0.75rem 1rem;
    position: sticky;
    top: 0;
  }
  header h1 {
    font-size: 1.05rem;
    margin: 0 0 0.5rem;
    font-weight: 600;
  }
  nav#nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
  }
  nav#nav a {
    padding: 0.4rem 0.7rem;
    border-radius: 6px 6px 0 0;
    text-decoration: none;
    color: var(--muted);
    font-size: 0.9rem;
    border: 1px solid transparent;
  }
  nav#nav a.active {
    color: var(--accent);
    border-color: var(--line);
    background: var(--bg);
    font-weight: 600;
  }
  #io-controls {
    margin-top: 0.6rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  #io-controls button, #io-controls .file-label {
    font-size: 0.82rem;
    padding: 0.35rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    cursor: pointer;
  }
  .file-label input[type="file"] { display: none; }
  #slice-controls {
    margin-top: 0.6rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    font-size: 0.85rem;
  }
  #slice-controls select {
    font: inherit;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
  }
  #storage-warning {
    margin-top: 0.6rem;
    padding: 0.5rem 0.7rem;
    border-radius: 6px;
    background: #fff3e0;
    border: 1px solid #e0a95c;
    color: var(--warn);
    font-size: 0.85rem;
  }
  main#app {
    max-width: 860px;
    margin: 0 auto;
    padding: 1.25rem 1rem 4rem;
  }
  h2 { margin-top: 0; }
  .empty, .muted { color: var(--muted); }
  .hidden { display: none !important; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: var(--bg);
    color: var(--accent);
  }
  textarea, input[type="search"] {
    font: inherit;
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  fieldset {
    border: 1px solid var(--line);
    border-radius: 6px;
    margin: 0.75rem 0;
  }
  label { display: block; margin: 0.3rem 0; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.75rem 0;
  }
  th, td {
    border: 1px solid var(--line);
    padding: 0.45rem 0.6rem;
    text-align: left;
    font-size: 0.9rem;
    vertical-align: top;
  }
  thead th { background: var(--bg-alt); }
  tr.source-row { cursor: pointer; }
  tr.source-row:hover { background: var(--bg-alt); }
  tr.detail-row td { background: var(--bg-alt); }
  .correct-choice { color: var(--ok); font-weight: 600; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    background: #eee;
    color: #444;
  }
  .badge.severity-high, .badge.severity-critical { background: #fdecea; color: var(--bad); }
  .badge.severity-medium { background: #fff3e0; color: var(--warn); }
  .citations { padding-left: 1.1rem; }
  .diagnosis-option {
    border-bottom: 1px solid var(--line);
    padding: 0.3rem 0;
  }
  .pending-attempt {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.75rem;
    margin-bottom: 1rem;
  }
  ul.diagnosis-history { padding-left: 1.1rem; }
  .changed-condition { color: var(--accent); }
  .reveal { border-top: 1px dashed var(--line); margin-top: 0.75rem; padding-top: 0.75rem; }
</style>
</head>
<body>
<header>
  <h1 id="app-title"></h1>
  <div id="slice-controls" class="hidden">
    <label for="slice-select">Slice</label>
    <select id="slice-select"></select>
  </div>
  <nav id="nav">
    <a href="#learn" data-route="learn">Learn</a>
    <a href="#compare" data-route="compare">Compare</a>
    <a href="#practice" data-route="practice">Practice</a>
    <a href="#diagnose" data-route="diagnose">Diagnose</a>
    <a href="#sources" data-route="sources">Explore Sources</a>
  </nav>
  <div id="io-controls">
    <button id="export-btn" type="button">Export progress</button>
    <label class="file-label">Import progress
      <input type="file" id="import-input" accept="application/json">
    </label>
  </div>
  <div id="storage-warning" class="hidden" role="alert"></div>
</header>

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 1, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-cloudfront", "exam": "aws-sysops", "facet": {"key": "service", "value": "cloudfront"}, "schemaVersion": 1}, "sourceQuestions": [{"id": "awssysops-p1-q014", "status": "active", "disputed": false, "stem": "You have a web application leveraging an Elastic Load Balancer (ELB) in front of the web servers deployed using an Auto Scaling Group. Your database is running on Relational Database Service (RDS). The application serves out technical articles and responses to them; in general there are more views of an article than there are responses to the article. On occasion, an article on the site becomes extremely popular resulting in significant traffic increases that causes the site to go down.\n\nWhat could you do to help alleviate the pressure on the infrastructure while maintaining availability during these events? (Choose three.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Leverage CloudFront for the delivery of the articles."}, {"letter": "B", "text": "Add RDS read-replicas for the read traffic going to your relational database"}, {"letter": "C", "text": "Leverage ElastiCache for caching the most frequently used data."}, {"letter": "D", "text": "Use SQS to queue up the requests for the technical posts and deliver them out of the queue."}, {"letter": "E", "text": "Use Route53 health checks to fail over to an S3 bucket for an error page."}], "correct_answer": ["A", "B", "C"], "source_correct_answer": ["A", "B", "C"], "correct_answer_override": null, "explanation": "This is a classic flash-traffic-on-read-heavy-content scaling pattern: CloudFront caches and serves the article content at the edge so a traffic spike doesn't hit your origin at all (A), RDS read replicas absorb the read traffic when it does reach the database tier (B), and ElastiCache caches the hottest data in front of RDS to cut database load further (C). Queuing requests through SQS (D) doesn't fit a read-heavy 'serve an article' workload -- that pattern suits asynchronous write/processing workloads, not synchronous page reads -- and failing over to a static S3 error page (E) sidesteps the availability problem rather than solving the underlying capacity pressure.", "facets": {"service": ["CloudFront", "RDS", "ElastiCache"], "concern": ["scaling", "performance", "availability"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 21, "question_number": 14}, "fingerprint": "3f218ddacfdf4e82e4b2c8e14bc611cde105e45811f32ec340557eb97fe93810"}, {"id": "awssysops-p1-q051", "status": "active", "disputed": false, "stem": "Your company is moving towards tracking web page users with a small tracking image loaded on each page. Currently you are serving this image out of US-East, but are starting to get concerned about the time it takes to load the image for users on the west coast.\n\nWhat are the two best ways to speed up serving this image? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Use Route 53's Latency Based Routing and serve the image out of US-West-2 as well as US-East-1"}, {"letter": "B", "text": "Serve the image out through CloudFront"}, {"letter": "C", "text": "Serve the image out of S3 so that it isn't being served off of your web application tier"}, {"letter": "D", "text": "Use EBS PIOPS to serve the image faster out of your EC2 instances"}], "correct_answer": ["A", "B"], "source_correct_answer": ["A", "B"], "correct_answer_override": null, "explanation": "Correct answers: A and B. CloudFront caches the tracking image at edge locations close to end users everywhere, including the west coast, directly addressing the latency problem regardless of where the origin lives. Route 53 latency-based routing lets you additionally serve the image from a second origin in US-West-2 and have DNS route each user to whichever regional endpoint is fastest for them. C (moving the image to S3) removes load from the web app tier but doesn't by itself reduce latency for west-coast users, since a single S3 bucket is still region-bound. D (EBS PIOPS) speeds up disk I/O on the EC2 instances, which isn't the bottleneck here -- the issue is network distance, not disk throughput.", "facets": {"service": ["CloudFront", "Route 53"], "concern": ["performance", "cdn"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 71, "question_number": 51}, "fingerprint": "4b48001528db4c247a2ae83e1960fb1fe026d10cf9c6ffb0db125dd15f7aec63"}, {"id": "awssysops-p2-q321", "status": "active", "disputed": false, "stem": "You have private video content in S3 that you want to serve to subscribed users on the Internet. User IDs, credentials, and subscriptions are stored in an Amazon RDS database. Which configuration will allow you to securely serve private content to your users?", "choice_type": "single", "choices": [{"letter": "A", "text": "Generate pre-signed URLs for each user as they request access to protected S3 content"}, {"letter": "B", "text": "Create an IAM user for each subscribed user and assign the GetObject permission to each IAM user"}, {"letter": "C", "text": "Create an S3 bucket policy that limits access to your private content to only your subscribed users' credentials"}, {"letter": "D", "text": "Create a CloudFront Origin Identity user for your subscribed users and assign the GetObject permission to this user"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A. No formatted community vote is present, but every comment agrees. Since subscriptions and credentials already live in an app-managed RDS database (not IAM), generating a time-limited pre-signed S3 URL per authenticated request is the natural fit -- the application itself checks the subscription in RDS, then hands out a temporary signed URL scoped to that content. B is impractical and doesn't scale -- creating a real IAM user per subscriber conflates application-level subscribers with AWS-account-level IAM principals. C invents a bucket-policy mechanism that can't actually key off of app-level subscriber credentials stored in RDS (bucket policies evaluate AWS principals/conditions, not arbitrary app credentials). D (CloudFront Origin Access Identity) controls access from CloudFront to the S3 origin, but doesn't by itself solve per-user authorization -- one comment (karmaah) notes D says nothing about pairing it with signed URLs/cookies, so on its own it would leave the content open to everyone once fronted by CloudFront.", "facets": {"service": ["S3", "CloudFront"], "concern": ["pre-signed-url-private-content"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 23, "question_number": 321}, "fingerprint": "5fa4f351e8a2c485a2b4ae6857b539bbb42249f195d13b6014f11fcad6151230"}, {"id": "awssysops-p2-q388", "status": "active", "disputed": false, "stem": "Amazon CloudFront is a ________.", "choice_type": "single", "choices": [{"letter": "A", "text": "persistent block level storage volume"}, {"letter": "B", "text": "content delivery network service"}, {"letter": "C", "text": "fully managed desktop computing service in the cloud"}, {"letter": "D", "text": "task coordination and state management service for cloud applications"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "CloudFront is a content delivery network (CDN) service that integrates with other AWS services to distribute content to end users with low latency, high transfer speeds, and no minimum usage commitments. See http://aws.amazon.com/cloudfront/.", "facets": {"service": ["CloudFront"], "concern": ["cloudfront-service-description"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 77, "question_number": 388}, "fingerprint": "3827e1eebafee34efa09e09b321e4f1c32ab5d52e98b7d8d21405af00aa78cc5"}, {"id": "awssysops-p2-q461", "status": "active", "disputed": false, "stem": "What is Amazon CloudFront?", "choice_type": "single", "choices": [{"letter": "A", "text": "A global Content Delivery Network"}, {"letter": "B", "text": "An encrypted endpoint to upload files to the Cloud"}, {"letter": "C", "text": "A web service to schedule regular data movement"}, {"letter": "D", "text": "A development front-end to Amazon Web Services"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "CloudFront is AWS's global content delivery network (CDN) service, accelerating delivery of websites, APIs, video, and other web assets via edge caching. See https://aws.amazon.com/cloudfront/.", "facets": {"service": ["CloudFront"], "concern": ["cloudfront-service-description"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 141, "question_number": 461}, "fingerprint": "2a31d1072acd7de2c16c9e20097b1ab00e943045271be0d3370c99b3053f3401"}, {"id": "awssysops-p2-q490", "status": "active", "disputed": false, "stem": "In Amazon CloudFront, if you have chosen On for Logging, the access logs are stored in _______________.", "choice_type": "single", "choices": [{"letter": "A", "text": "Amazon S3 bucket."}, {"letter": "B", "text": "Amazon EBS."}, {"letter": "C", "text": "Amazon Edge locations."}, {"letter": "D", "text": "Amazon EC2 instance."}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "When CloudFront logging is enabled, access logs recording per-request information are delivered to the Amazon S3 bucket you specify. See https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/distribution-web-values-specify.html#DownloadDistValuesLoggingOnOff.", "facets": {"service": ["CloudFront", "S3"], "concern": ["cloudfront-access-log-storage-location"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 166, "question_number": 490}, "fingerprint": "fb996125d4daa40bd365cc7e2ab6d02e3d6bd303203a17f27288fd1a65afba9c"}, {"id": "awssysops-p2-q508", "status": "active", "disputed": false, "stem": "You can configure Amazon CloudFront to deliver access logs per ________ to an Amazon S3 bucket of your choice.", "choice_type": "single", "choices": [{"letter": "A", "text": "Edge location"}, {"letter": "B", "text": "Distribution"}, {"letter": "C", "text": "Geo restriction"}, {"letter": "D", "text": "Request"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "CloudFront delivers access logs per distribution to an S3 bucket of your choice — each distribution's logs are generated and stored independently. See https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/AccessLogs.html. Community vote distribution was unanimous at B (100%).", "facets": {"service": ["CloudFront", "S3"], "concern": ["cloudfront-access-log-granularity"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 182, "question_number": 508}, "fingerprint": "a1f48ed7a6efa655c5de6f3406e4f9b9073719696d7930fc2ed0b2b5d4a9608e"}, {"id": "awssysops-p2-q524", "status": "active", "disputed": false, "stem": "A company website hosts patches for software that is sold globally. The website runs in AWS and performs well until a large software patch is released. The flood of downloads puts a strain on the web servers and leads to a poor customer experience.\nWhat can the SysOps Administrator propose to enhance customer experience, create a more available web platform, and keep costs low?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use an Amazon CloudFront distribution to cache static content, including software patches"}, {"letter": "B", "text": "Increase the size of the NAT instance to improve throughput"}, {"letter": "C", "text": "Scale out of web servers in advance of patch releases to reduce Auto Scaling delays"}, {"letter": "D", "text": "Move the content to IO1 and provision additional IOPS to the volume that contains the software patches"}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "CloudFront caches the static patch files at edge locations globally, absorbing the download spike away from the origin web servers entirely. This directly improves customer experience (lower latency, higher throughput at the edge), improves availability (origin load drops), and keeps cost low relative to over-provisioning EC2/EBS or NAT capacity for a bursty, predictable event. Community vote is unanimous for A.", "facets": {"service": ["CloudFront"], "concern": ["static-content-caching", "traffic-spike-mitigation"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 198, "question_number": 524}, "fingerprint": "c3de61141dfeaed6d4bc242efbc197eed77941c6c32a13843e7fb1e6cbee12ea"}, {"id": "awssysops-p2-q552", "status": "active", "disputed": true, "stem": "Malicious traffic is reaching company web servers from a single IP address located in another country. The SysOps Administrator is tasked with blocking this IP address.\nHow should the Administrator implement the restriction?", "choice_type": "single", "choices": [{"letter": "A", "text": "Edit the security group for the web servers and add a deny entry for the IP address"}, {"letter": "B", "text": "Edit the network access control list for the web server subnet and add a deny entry for the IP address"}, {"letter": "C", "text": "Edit the VPC route table to route the malicious IP address to a black hole"}, {"letter": "D", "text": "Use Amazon CloudFront's geo restriction feature to block traffic from the IP address"}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "Network ACLs operate at the subnet level and can deny traffic from a specific IP address (or CIDR) directly — the precise, surgical block this scenario calls for. CloudFront's geo-restriction feature (the boxed answer) can only block or allow traffic by country, not by a single IP, so using it here would block every visitor from that country to stop just one address. The recorded vote is unanimous (100%) for B, directly contradicting the boxed answer D, backed by clear reasoning that geo-restriction operates at the wrong granularity for a single-IP block. Security groups (A) only apply to the instances they're attached to and can't blanket the whole subnet the way this restriction implies.", "facets": {"service": ["VPC Network ACLs", "CloudFront"], "concern": ["ip-blocking", "geo-restriction-limitation"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 238, "question_number": 552}, "fingerprint": "1b59ff32fa68f6e02317b0428229886b1fad3ca3792414804c4c927054b14a3e"}, {"id": "awssysops-p2-q569", "status": "active", "disputed": true, "stem": "A photo-sharing site delivers content worldwide from a library on Amazon S3 using Amazon CloudFront. Users are trying to access photos that either do not exist or they are not authorized to view. What should be monitored to better understand the extent of this issue?", "choice_type": "single", "choices": [{"letter": "A", "text": "GetRequests S3 metric on Amazon CloudWatch"}, {"letter": "B", "text": "4XXErrorRate CloudFront metric on CloudWatch"}, {"letter": "C", "text": "5XXErrorRate CloudFront metric on CloudWatch"}, {"letter": "D", "text": "PostRequests S3 metric on CloudWatch"}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "Requests for photos that 'do not exist' (404) or aren't authorized (403) are both client-error responses in the 4xx range, and since CloudFront is the edge layer users actually hit, its 4XXErrorRate metric directly measures the rate of exactly these failures. The boxed answer's GetRequests S3 metric (A) is a raw request count with no breakdown by response/error code at all, so it can't distinguish successful requests from the failures in question. Community vote is unanimous (100%) for B, directly contradicting the boxed answer A, backed by extensive, heavily-upvoted commentary.", "facets": {"service": ["CloudFront", "CloudWatch"], "concern": ["4xx-error-monitoring", "access-and-existence-errors"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 261, "question_number": 569}, "fingerprint": "5cefb82e9fc9697b62d2086697a5bc54a035dcd33bcc41b272dbbda34a5eac86"}, {"id": "awssysops-p2-q573", "status": "active", "disputed": false, "stem": "A SysOps Administrator is reviewing AWS Trusted Advisor warnings and encounters a warning for an S3 bucket policy that has open access permissions. While discussing the issue the bucket owner, the Administrator realizes the S3 bucket is an origin for an Amazon CloudFront web distribution. Which action should the Administrator take to ensure that users access objects in Amazon S3 by using only CloudFront URLs?", "choice_type": "single", "choices": [{"letter": "A", "text": "Encrypt the S3 bucket content with Server-Side Encryption with Amazon S3-Managed Keys (SSE-S3)"}, {"letter": "B", "text": "Create an origin access identity and grant it permissions to read objects in the S3 bucket"}, {"letter": "C", "text": "Assign an IAM user to the CloudFront distribution and whitelist the IAM user in the S3 bucket policy"}, {"letter": "D", "text": "Assign an IAM role to the CloudFront distribution and whitelist the IAM role in the S3 bucket policy"}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "An Origin Access Identity (OAI) is a special CloudFront principal that can be granted read access in the S3 bucket policy while all other (public) access is removed, forcing users to go through CloudFront URLs to reach the content. Neither an IAM user nor an IAM role can be 'assigned to a CloudFront distribution' (C, D aren't real CloudFront constructs), and SSE-S3 encryption (A) controls data-at-rest protection, not who can request objects. Community vote is unanimous for B, matching the AWS documentation cited directly in the source.", "facets": {"service": ["CloudFront", "S3"], "concern": ["origin-access-identity", "restricting-direct-s3-access"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 266, "question_number": 573}, "fingerprint": "abd9aac30b19e1a0bca71d16dabb68963fc3dc3a0d8c96b38ff7496018f4ef49"}, {"id": "awssysops-p3-1-q611", "status": "active", "disputed": false, "stem": "A company's customers are reporting increased latency while accessing static web content from Amazon S3. A SysOps Administrator observed a\nvery high rate of read operations on a particular S3 bucket.\nWhat will minimize latency by reducing load on the S3 bucket?", "choice_type": "single", "choices": [{"letter": "A", "text": "Migrate the S3 bucket to a region that is closer to end users' geographic locations."}, {"letter": "B", "text": "Use cross-region replication to replicate all of the data to another region."}, {"letter": "C", "text": "Create an Amazon CloudFront distribution with the S3 bucket as the origin."}, {"letter": "D", "text": "Use Amazon ElastiCache to cache data being served from Amazon S3."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "Amazon CloudFront caches static content at edge locations, so repeat reads for the same objects are served from the CDN cache instead of hitting the origin S3 bucket directly, reducing both load on the bucket and latency for end users. Migrating the bucket to a closer region (A) only helps users near that one new region and doesn't reduce request volume; cross-region replication (B) duplicates the data but doesn't offload read traffic away from S3 itself; and ElastiCache (D) is designed to cache results in front of a database like RDS, not object-storage reads — a dissenting comment explores D but a rebuttal clarifies ElastiCache targets RDS-style workloads, not S3. Community discussion converges on C.", "facets": {"service": ["CloudFront", "S3"], "concern": ["read-heavy-caching", "static-content-latency"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 19, "question_number": 611}, "fingerprint": "2a10d29ecd908047b4615926f3ca7066f2f3ec97a7980ca88cb0bfc7ee9dc16d"}, {"id": "awssysops-p3-1-q641", "status": "active", "disputed": true, "stem": "A website uses Elastic Load Balancing (ELB) in front of several Amazon EC2 instances backed by an Amazon RDS database. The content is\ndynamically generated for visitors of a webpage based on their geographic location. and is updated daily. Some of the generated objects are large\nin size and are taking longer to download than they should, resulting in a poor user experience.\nWhich approach will improve the user experience?", "choice_type": "single", "choices": [{"letter": "A", "text": "Implement Amazon ElastiCache to cache the content and reduce the load on the database."}, {"letter": "B", "text": "Enable an Amazon CloudFront distribution with Elastic Load Balancing as a custom origin."}, {"letter": "C", "text": "Use Amazon S3 to store and deliver the content."}, {"letter": "D", "text": "Enable Auto Scaling for the EC2 instances so that they can scale automatically."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "The core complaint is that large, dynamically-generated objects are slow to download — a latency/throughput problem best solved by caching those objects at edge locations physically closer to visitors worldwide, which is exactly what fronting the existing ELB with a CloudFront distribution (using the ELB as a custom origin) provides, directly addressing both the geographic-distribution angle and the large-object download-speed complaint. The boxed answer (A), adding ElastiCache in front of the RDS database, only reduces database read latency and query load — it does nothing to speed up the actual transfer of large generated objects to end users' browsers, which was the stated problem. Storing content directly in S3 (C) doesn't fit dynamically-generated, per-visitor content, and Auto Scaling the EC2 instances (D) addresses compute capacity, not per-object download speed. Community vote is unanimous (100%) for B, directly contradicting the boxed answer A, with several comments explicitly making the same ElastiCache-vs-CloudFront distinction.", "facets": {"service": ["CloudFront"], "concern": ["large-object-download-latency", "geo-distributed-caching"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 70, "question_number": 641}, "fingerprint": "ef6bc6d33aae157560d110f720da73d004ea0b0f3601de293bbc55a96d2f97ee"}, {"id": "awssysops-p3-1-q649", "status": "active", "disputed": false, "stem": "A SysOps Administrator is receiving multiple reports from customers that they are unable to connect to the company's website. which is being\nserved through\nAmazon CloudFront. Customers are receiving HTTP response codes for both 4XX and 5XX errors.\nWhich metric can the Administrator use to monitor the elevated error rates in CloudFront?", "choice_type": "single", "choices": [{"letter": "A", "text": "TotalErrorRate"}, {"letter": "B", "text": "RejectedConnectionCount"}, {"letter": "C", "text": "NetworkTransmitThroughput"}, {"letter": "D", "text": "HealthyHostCount"}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "CloudFront's TotalErrorRate metric reports the percentage of all viewer requests that returned a 4xx or 5xx HTTP status code, directly matching what the Administrator needs to monitor. RejectedConnectionCount and HealthyHostCount are Elastic Load Balancing metrics, not CloudFront metrics, and NetworkTransmitThroughput is unrelated to error rates. Community vote is unanimous (100%) for A, backed by direct AWS CloudFront CloudWatch metrics documentation.", "facets": {"service": ["CloudFront"], "concern": ["total-error-rate-metric"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 84, "question_number": 649}, "fingerprint": "0504d46a8a9d5d0a885093695ea829a3132bb3ee4297a445940fdf5a7e284b0d"}, {"id": "awssysops-p3-1-q687", "status": "active", "disputed": false, "stem": "A SysOps Administrator noticed that the cache hit ratio for an Amazon CloudFront distribution is less than 10%.\nWhich collection of configuration changes will increase the cache hit ratio for the distribution? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Ensure that only required cookies, query strings, and headers are forwarded in the Cache Behavior Settings"}, {"letter": "B", "text": "Change the Viewer Protocol Policy to use HTTPS only"}, {"letter": "C", "text": "Configure the distribution to use presigned cookies and URLs to restrict access to the distribution"}, {"letter": "D", "text": "Enable automatic compression of objects in the Cache Behavior Settings"}, {"letter": "E", "text": "Increase the CloudFront time to live (TTL) settings in the Cache Behavior Settings"}], "correct_answer": ["A", "E"], "source_correct_answer": "A,E", "correct_answer_override": null, "explanation": "Forwarding only the cookies, query strings, and headers actually required by the origin eliminates unnecessary request variation that would otherwise be treated as cache-key differences, and increasing the cache behavior's TTL keeps objects cached longer before re-validating against the origin — both directly increase the proportion of requests served from cache. Switching the Viewer Protocol Policy to HTTPS-only (B) affects transport security, not caching behavior; presigned cookies/URLs (C) control access restriction, not cache efficiency; and enabling automatic compression (D) reduces transferred object size but doesn't change whether a request is a cache hit or miss. Community vote is unanimous (100%) for A & E, backed directly by the AWS CloudFront cache-hit-ratio and object-expiration documentation.", "facets": {"service": ["CloudFront"], "concern": ["cache-hit-ratio-optimization", "ttl-and-forwarded-parameters"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 150, "question_number": 687}, "fingerprint": "5f848aa98259947dab2dca839753de2960f2f6ef5bfc0ec55000355565bebca7"}, {"id": "awssysops-p3-1-q712", "status": "active", "disputed": false, "stem": "A company website hosts patches for software that is sold globally. The website runs in AWS and performs well until a large software patch is released. The flood of downloads puts a strain on the web servers and leads to a poor customer experience.\nWhat can the Sysops Administrator propose to enhance customer experience, create a more available web platform, and keep costs low?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use an Amazon CloudFront distribution to cache static content, including software patches."}, {"letter": "B", "text": "Increase the size of the NAT instance to improve throughput."}, {"letter": "C", "text": "Scale out the web servers in advance of patch releases to reduce Auto Scaling delays."}, {"letter": "D", "text": "Move the content to IO1 and provision additional IOPS to the volume that contains the software patches."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "Caching the software patch files at CloudFront edge locations offloads the repeated download traffic away from the origin web servers entirely, directly relieving the strain during a release spike while keeping costs low relative to over-provisioning compute or storage. A NAT instance (B) handles outbound traffic translation and has nothing to do with serving downloads to external users; pre-emptively scaling out web servers (C) means paying for capacity that sits idle outside of patch-release windows; and provisioning additional IOPS on the underlying volume (D) addresses storage I/O, not the network/serving bottleneck a global download spike creates. Community consensus supports A, matching the boxed answer, as the standard CDN-caching fix for this exact pattern.", "facets": {"service": ["CloudFront"], "concern": ["static-content-caching-for-download-spikes"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 187, "question_number": 712}, "fingerprint": "deb94908c8334149ec62a706be90c7bcb20a535ea2a0c9bb08eba93ded6cafca"}, {"id": "awssysops-p3-1-q736", "status": "active", "disputed": false, "stem": "A SysOps Administrator is deploying a website with dynamic content. Company policy requires that users from certain countries or regions cannot access the web content and should receive an error page.\nWhich of the following can be used to implement this policy? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Amazon CloudFront geo-restriction"}, {"letter": "B", "text": "Amazon GuardDuty geo-blocking"}, {"letter": "C", "text": "Amazon Route 53 geolocation routing"}, {"letter": "D", "text": "AWS Shield geo-restriction"}, {"letter": "E", "text": "Network access control list (NACL) restriction"}], "correct_answer": ["A", "C"], "source_correct_answer": "A,C", "correct_answer_override": null, "explanation": "CloudFront geo-restriction lets a distribution allow-list or block-list specific countries and return a custom error page to blocked requesters, and Route 53 geolocation routing can route requests from restricted regions to a different endpoint (such as an error page), giving two distinct AWS-native ways to implement country-based blocking, as the referenced CloudFront FAQ and Route 53 routing-policy documentation confirm. GuardDuty (B) is a threat-detection service with no geo-blocking feature, and AWS Shield (D) is a DDoS-protection service with no geo-restriction capability — both are fabricated capabilities for these services. A NACL (E) filters by IP address/CIDR ranges only, with no concept of country/region, making country-level blocking impractical at that layer. Community consensus, including a directly-cited AWS geo-restriction doc, supports A & C, matching the boxed answer.", "facets": {"service": ["CloudFront", "Route 53"], "concern": ["country-based-access-restriction"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 229, "question_number": 736}, "fingerprint": "569b28fa48fd4852d52710f899c563a71178e590d49b9b407f93a4633c2a2ad0"}, {"id": "awssysops-p3-1-q757", "status": "active", "disputed": true, "stem": "A SysOps Administrator is maintaining a web application using an Amazon CloudFront web distribution, an Application Load Balancer (ALB), Amazon RDS, and Amazon EC2 in a VPC. All services have logging enabled. The Administrator needs to investigate HTTP Layer 7 status codes from the web application.\nWhich log sources contain the status codes? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "VPC Flow Logs"}, {"letter": "B", "text": "AWS CloudTrail logs"}, {"letter": "C", "text": "ALB access logs"}, {"letter": "D", "text": "CloudFront access logs"}, {"letter": "E", "text": "RDS logs"}], "correct_answer": ["B", "D"], "source_correct_answer": "B,D", "correct_answer_override": null, "explanation": "ALB access logs and CloudFront access logs both operate at the application (Layer 7) level and record each request's HTTP status code directly, exactly matching what's needed to investigate Layer 7 status codes, per the referenced CloudFront access-logs format documentation (which explicitly lists a status-code column) and unanimous community consensus. CloudTrail logs (the boxed answer, B) record AWS API/management-plane activity (who called which AWS API), not end-user HTTP requests to the web application, so they contain no Layer 7 status codes at all. VPC Flow Logs (A) operate at Layer 3/4 (IP/port/packet metadata) with no visibility into HTTP-level status codes, and RDS logs (E) capture database engine activity, unrelated to HTTP traffic. Community vote is unanimous (100%) for C & D, directly contradicting the boxed answer's B, and is heavily corroborated (22+ upvotes on the top comment) with a direct citation of the AWS CloudFront log-format documentation. Flagged disputed for triage, while keeping the boxed answer B & D per the ingestion policy.", "facets": {"service": ["ALB", "CloudFront"], "concern": ["http-layer7-status-code-log-sources"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 258, "question_number": 757}, "fingerprint": "db290a82c16afcdf66ee73daa639130172102158dd91bdc7b0d9aeff6001baf7"}, {"id": "awssysops-p3-1-q826", "status": "active", "disputed": true, "stem": "A company has an existing web application that runs on two Amazon EC2 instances behind an Application Load Balancer (ALB) across two Availability Zones.\nThe application uses an Amazon RDS Multi-AZ DB Instance. Amazon Route 53 record sets route requests for dynamic content to the load balancer and requests for static content to an Amazon S3 bucket. Site visitors are reporting extremely long loading times.\nWhich actions should be taken to improve the performance of the website? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Add Amazon CloudFront caching for static content."}, {"letter": "B", "text": "Change the load balancer listener from HTTPS to TCP."}, {"letter": "C", "text": "Enable Amazon Route 53 latency-based routing."}, {"letter": "D", "text": "Implement Amazon EC2 Auto Scaling for the web servers."}, {"letter": "E", "text": "Move the static content from Amazon S3 to the web servers."}], "correct_answer": ["C", "D"], "source_correct_answer": "C,D", "correct_answer_override": null, "explanation": "CloudFront caches static content at edge locations closer to visitors, directly cutting load time for the static assets served from S3 (A), and EC2 Auto Scaling lets the web-server fleet grow to handle load spikes that would otherwise slow down dynamic-content generation (D) — both concretely address the reported slowness, per the detailed reasoning corroborated heavily (31+ upvotes on the top comment) throughout the discussion. The boxed answer's C, Route 53 latency-based routing, is a no-op here: with only a single ALB in a single region, every request already resolves to that same one load balancer regardless of any latency-based routing policy, so enabling it changes nothing about where traffic goes or how fast it's served — latency-based routing only has an effect when multiple regional endpoints exist to route between. An ALB listener also can't be changed to TCP (B) since ALBs operate at the application layer (HTTP/HTTPS) and TCP listeners are an NLB-only feature, and moving static content onto the web servers (E) would add load to the same instances already implicated in the slowness rather than relieving it. Community vote is unanimous (100%) for A & D, directly contradicting the boxed answer's C, and is heavily corroborated with detailed reasoning about the single-ALB/single-region routing no-op. Flagged disputed for triage, while keeping the boxed answer C & D per the ingestion policy.", "facets": {"service": ["CloudFront", "Route 53", "Auto Scaling"], "concern": ["single-region-latency-routing-no-op"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 378, "question_number": 826}, "fingerprint": "28bb64dedc4a2885b7f7663d290f17f68e674b1027ddde879c8ac4614948a1c2"}, {"id": "awssysops-p3-1-q881", "status": "active", "disputed": true, "stem": "A company is managing a website with a global user base hosted on Amazon EC2 with an Application Load Balancer (ALB). To reduce the load on the web servers, a SysOps administrator configures an Amazon CloudFront distribution with the ALB as the origin. After a week of monitoring the solution, the administrator notices that requests are still being served by the ALB and there is no change in the web server load.\nWhat are possible causes for this problem? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "CloudFront does not have the ALB configured as the origin access identity."}, {"letter": "B", "text": "The DNS is still pointing to the ALB instead of the CloudFront distribution."}, {"letter": "C", "text": "The ALB security group is not permitting inbound traffic from CloudFront."}, {"letter": "D", "text": "The default, minimum, and maximum Time to Live (TTL) are set to 0 seconds on the CloudFront distribution."}, {"letter": "E", "text": "The target groups associated with the ALB are configured for sticky sessions."}], "correct_answer": ["A", "B"], "source_correct_answer": "A,B", "correct_answer_override": null, "explanation": "If client DNS still resolves directly to the ALB instead of the CloudFront distribution's domain (B, shared with the boxed answer), traffic bypasses CloudFront entirely and the ALB continues to see the full unreduced load — this cause is undisputed across every comment. The raw discussion carries an informal embedded vote tally split evenly between BD and BE for the second cause: TTLs set to 0 seconds (D) effectively disable CloudFront caching, forwarding every request straight through to the ALB, while sticky sessions on the ALB's target groups (E) can force session affinity that undermines the caching/offload benefit CloudFront is meant to provide. The boxed answer's A is a further category error: 'origin access identity' is an S3-specific access-control mechanism used to restrict direct public access to an S3 bucket so only CloudFront can reach it — it has no applicable meaning for an ALB origin at all, and no comment anywhere in the discussion votes for A. Given the boxed answer's A receives zero community support and is technically inapplicable to this origin type, and the second cause remains a genuine 50/50 split between D and E, this question is flagged disputed for triage, while keeping the boxed answer A & B per the ingestion policy.", "facets": {"service": ["CloudFront"], "concern": ["origin-access-identity-not-applicable-to-alb-origin"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 458, "question_number": 881}, "fingerprint": "fe9aa5bbe55a2e300285246c7e5fd250d5f8557ef51a86da7610fddf2c3ab8b3"}, {"id": "awssysops-p3-1-q886", "status": "active", "disputed": true, "stem": "A company has a three-tier stateful web application. The application is served through an Amazon CloudFront distribution with default configuration options and an Application Load Balancer (ALB) as the origin. Logged-in users get intermittently logged out and see inconsistent content.\nWhich action should the company take to ensure a stable user experience during a session?", "choice_type": "single", "choices": [{"letter": "A", "text": "Enable session affinity (sticky sessions) on the ALB. Configure CloudFront to forward all cookies to the origin."}, {"letter": "B", "text": "Restrict viewer access to signed cookies in CloudFront. Enable session affinity (sticky sessions) on the ALB."}, {"letter": "C", "text": "Switch from duration-based session affinity (sticky sessions) to application-controlled session affinity (sticky sessions) on the ALB."}, {"letter": "D", "text": "Configure the CloudFront TTL to be equal to or less than the ALB session duration."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "With CloudFront's default configuration, cookies are not forwarded to the origin at all, so even if the ALB's session cookie is set, CloudFront strips it from subsequent requests — meaning the ALB never sees the returning session cookie and can't route the user back to the same target, producing exactly the symptoms described (intermittent logouts, inconsistent content). Enabling ALB sticky sessions together with configuring CloudFront to forward all cookies to the origin (the community's answer, A) fixes both halves of the actual root cause, per the ALB listener-authentication documentation quoted directly and corroborated (majority of comments). The boxed answer's C only changes which of two ALB-side sticky-session mechanisms is used — it does nothing about CloudFront's default cookie-stripping behavior, which is the layer actually responsible for the session cookie never reaching the ALB in the first place. Community vote is unanimous (100%) for A, directly contradicting the boxed answer C. Flagged disputed for triage, while keeping the boxed answer C per the ingestion policy.", "facets": {"service": ["CloudFront", "ALB"], "concern": ["cookie-forwarding-for-sticky-session-cookie"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 465, "question_number": 886}, "fingerprint": "3b95378db632ae2ef067a8248aa715fcdb26c4fe385c3dea1ebb36c47f4f3ac7"}, {"id": "awssysops-p3-1-q907", "status": "active", "disputed": true, "stem": "A streaming company is using AWS resources in the us-east-1 Region for its production environment. The web tier of the streaming site runs on Amazon EC2 instances behind an Application Load Balancer (ALB). The instances run in an EC2 Auto Scaling group across multiple Availability Zones. The Auto Scaling group is configured to scale when the CPU utilization of the instances is greater than 75%. The user database is hosted on an Amazon RDS MySQL cluster, and video content is stored within an Amazon S3 bucket. Amazon CloudWatch metrics show that the RDS MySQL Multi-AZ DB instance has around 16 GB of memory free and an average CPU utilization of 70%. It is taking users in Asia several seconds longer to access the streaming website.\nWhich combination of actions will improve the access load times? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Configure RDS MySQL Multi-AZ to reduce RDS CPU and RAM utilization and distribute queries to multiple Availability Zones."}, {"letter": "B", "text": "Modify the EC2 Auto Scaling group so it will scale horizontally when CPU utilization is 50%."}, {"letter": "C", "text": "Provision a second production environment in the Asia Pacific Region and use an ALB to distribute cross-Region access."}, {"letter": "D", "text": "Provision a second production environment in the Asia Pacific Region and use Amazon Route 53 latency-based routing."}, {"letter": "E", "text": "Set up an Amazon CloudFront distribution to handle static content for users accessing it from different geographic locations."}], "correct_answer": ["B", "C"], "source_correct_answer": "B,C", "correct_answer_override": null, "explanation": "The reported symptom is geographic latency for Asia-based users, which is best addressed by a combination of moving content closer to users (Amazon CloudFront caching static content at edge locations near them) and routing users to the geographically nearest full production environment (Route 53 latency-based routing to a second environment in the Asia Pacific Region) — matching the community's D, E, corroborated across the discussion. The boxed answer's C is a technical impossibility: an Application Load Balancer is a Regional resource and cannot distribute traffic across two separate AWS Regions at all, a point raised directly and repeatedly ('eliminated because ALB cannot span cross region', 'when did the ALB support cross-region', 'ELB cannot do Cross region... for anything cross region you need R53') — cross-Region routing is Route 53's job, not the ALB's. The boxed answer's B also targets the wrong metric entirely: CloudWatch shows the bottleneck (70% CPU) is on the RDS instance, not the EC2 web tier, so tuning the EC2 Auto Scaling group's scaling threshold has no bearing on the described symptom, and even if it did, it wouldn't address a geography-based latency gap. Since the boxed answer's own C rests on a capability ALB doesn't have, this question is flagged disputed for triage, while keeping the boxed answer B, C per the ingestion policy.", "facets": {"service": ["Route 53", "CloudFront"], "concern": ["cross-region-latency-reduction-alb-cannot-span-regions"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 489, "question_number": 907}, "fingerprint": "923d2870b75b0d039f2c847b95045eadc79a43ffdc223b165432df3dd8f555b7"}], "claims": [{"claim_type": "fact", "confidence": "high", "id": "cl-0-0", "source_question_ids": ["awssysops-p1-q014", "awssysops-p2-q524", "awssysops-p3-1-q611", "awssysops-p3-1-q712", "awssysops-p3-1-q826", "awssysops-p3-1-q907"], "statement": "Amazon CloudFront caches content (static assets, images, software patches, articles) at globally distributed edge locations, so repeat requests are served from the cache instead of hitting the origin, reducing origin load and lowering latency for end users during traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-0-1", "source_question_ids": ["awssysops-p1-q014"], "statement": "Adding Amazon RDS read replicas offloads read-only query traffic from the primary database instance, helping the database tier handle read-heavy traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-0-2", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon ElastiCache caches the most frequently accessed data in front of a relational database, reducing t
