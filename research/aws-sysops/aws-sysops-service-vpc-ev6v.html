-p3-1-q812"], "statement": "Host-based (OS-level) firewalls would require configuring an IP block individually on every instance's own firewall, which is neither immediate nor VPC-wide.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bae339abeb1b", "source_question_ids": ["awssysops-p3-1-q812"], "statement": "Security groups are stateful and only support allow rules; they have no explicit-deny capability for blocking a specific IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7957c8608f93", "source_question_ids": ["awssysops-p3-1-q812"], "statement": "A NAT Gateway is a traffic-routing component with no IP-filtering or IP-blocking feature.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-81fab5b343e7", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "Pairing an S3 VPC endpoint with an S3 bucket policy that conditionally restricts access to requests originating from that VPC endpoint enforces the access restriction at the bucket itself, regardless of which IAM principal makes the request.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-9004a45802c4", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "An IAM policy attached to users or roles can restrict what a given principal is permitted to do, but cannot by itself restrict access to a bucket from other principals outside that scope, such as enforcing that access must come only through a specific VPC endpoint.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-47726c502acd", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "Granting EC2 instances full S3 access via a service-linked role does not restrict access to only a specific VPC or force traffic over the AWS private network; it only grants permissions to specific instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-743b895df349", "source_question_ids": ["awssysops-p3-1-q822"], "statement": "Routing S3 traffic through a NAT gateway sends it toward S3's public endpoints rather than over a private VPC endpoint.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-66d9ca0f363f", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "A NAT gateway is created inside one specific public subnet and is tied to that subnet's single Availability Zone, with no built-in cross-AZ redundancy.", "status": "supported"}, {"claim_type": "rule", "conditions": ["single NAT gateway shared across multiple AZs"], "confidence": "high", "id": "cl-467922fe3c44", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "If the Availability Zone containing a VPC's only NAT gateway experiences an outage, private subnets in other, still-healthy Availability Zones lose their route to the internet when their route tables' default route points at that NAT gateway, which can cause applications dependent on outbound internet access to fail.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-dede37de1788", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "A virtual private gateway is a VPN-specific component and is not relevant to a NAT-gateway-related single-AZ outage scenario.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-827cc62b5b05", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "An internet gateway is a VPC-wide resource, not scoped to a single Availability Zone, unlike a NAT gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-13e32ea68e3e", "source_question_ids": ["awssysops-p3-1-q824"], "statement": "The default VPC route table is a VPC-wide construct and is not scoped to or limited by a single Availability Zone.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-74429f586770", "source_question_ids": ["awssysops-p3-1-q832", "awssysops-p3-1-q904"], "statement": "In a multi-tier web architecture with an internet-facing Application Load Balancer, only the ALB needs to sit in a public subnet; both the web-tier servers and the database servers should be placed in private subnets, spread across multiple Availability Zones, to minimize public exposure while retaining high availability.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-fc897fab1ff5", "source_question_ids": ["awssysops-p3-1-q832"], "statement": "Placing web-tier servers in a public subnet is unnecessary exposure once an internet-facing Application Load Balancer already provides the entry point, since the web tier gains nothing from also being directly public.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5e79cf1f0687", "source_question_ids": ["awssysops-p3-1-q832", "awssysops-p3-1-q904"], "statement": "Placing database servers in a public subnet is the opposite of minimizing public access and should be avoided.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1b7c13bb2a68", "source_question_ids": ["awssysops-p3-1-q836"], "statement": "A VPN connection terminated on a virtual private gateway attached to a VPC gives a remote network (e.g. a corporate office) a private, routable path into the VPC, such as for SSH administration, without requiring public internet exposure on either end.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2782fe5f5fc4", "source_question_ids": ["awssysops-p3-1-q836"], "statement": "A NAT gateway's entire purpose is to let VPC resources reach the EC2 instances' own security group does not fix EC2-to-Aurora connectivity, because the actual block is on the Aurora side's inbound rules.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-03192675b7d1", "source_question_ids": ["awssysops-p3-1-q852"], "statement": "A customer gateway is used to establish a Site-to-Site VPN connection to an on-premises network, not to reach an AWS service such as S3.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-99d4759387b1", "source_question_ids": ["awssysops-p3-1-q852"], "statement": "An S3 bucket policy alone grants no network path to the bucket; without an actual route such as a VPC endpoint, a private subnet still has no connectivity to S3.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7c5eac765c3c", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "Enabling VPC Flow Logs on a NAT gateway's elastic network interface captures per-connection traffic detail including source IP address.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2c15a0022541", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "CloudWatch Logs Insights can filter and aggregate NAT gateway VPC Flow Logs by source IP to attribute NAT gateway traffic back to individual instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-91c42c699cee", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "An AWS Cost and Usage report breaks costs down by resource, such as the NAT gateway itself, but has no visibility into which instance generated which portion of the traffic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-809cb3afaf43", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "NAT gateway CloudWatch metrics are aggregate, gateway-level statistics with no per-instance breakdown.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d6d54d7bcb15", "source_question_ids": ["awssysops-p3-1-q853"], "statement": "VPC traffic mirroring to Amazon QuickSight is a heavier-weight packet-capture mechanism not designed for source-IP traffic-volume analysis.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance is acting as a NAT instance"], "confidence": "high", "id": "cl-8024a6cb4612", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "A NAT instance must have source/destination checks disabled on its network interface, or it will silently drop traffic it is forwarding on behalf of other instances in the private subnet.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-0d4593509e23", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "EC2 instances have the source/destination check enabled by default, which blocks an instance from forwarding traffic whose source or destination is not itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6da2e2e26727", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "Assigning Elastic IP addresses to private instances and routing them directly to an internet gateway gives those instances direct public internet reachability, which violates a requirement that instances must not be reachable from the public internet.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-92a9a822e8ec", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "AWS WAF is a web application firewall and has no role in fixing NAT instance traffic forwarding.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3beedeec6feb", "source_question_ids": ["awssysops-p3-1-q857"], "statement": "Restarting (stop/start) a NAT instance so it launches on a different host does not fix a disabled source/destination check misconfiguration.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5cacb6798dab", "source_question_ids": ["awssysops-p3-1-q860"], "statement": "A private EC2 instance without a public or Elastic IP address can still reach Amazon S3 either through a NAT gateway's outbound path or through a gateway VPC endpoint for S3, without any direct internet exposure on the instance itself.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-edb93e721ec9", "source_question_ids": ["awssysops-p3-1-q860"], "statement": "Network ACLs and security groups can only filter traffic that already has a network path to a destination; configuring them with specific private IP addresses cannot by itself create connectivity to a service such as S3.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3d566ec78895", "source_question_ids": ["awssysops-p3-1-q860"], "statement": "AWS Direct Connect is for connecting on-premises networks to AWS, not for routing an in-VPC EC2 instance's traffic to an AWS service such as S3.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-be46355524c3", "source_question_ids": ["awssysops-p3-1-q871"], "statement": "Enabling VPC Flow Logs once at the VPC level automatically captures traffic across every elastic network interface within that VPC, satisfying an \"all network traffic between servers\" capture requirement with a single configuration.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ccaa95c1a500", "source_question_ids": ["awssysops-p3-1-q871"], "statement": "AWS CloudTrail records API and management-plane activity against AWS services, not network packet-level traffic between servers, so it cannot fulfill a network-traffic-capture requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-bce80df1e2ad", "source_question_ids": ["awssysops-p3-1-q871"], "statement": "Configuring flow logs individually at the elastic-network-interface level for every server requires substantially more setup effort than a single VPC-level flow log configuration.", "status": "supported"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-c20695bbf972", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Moving a database from a private subnet back to a public subnet to restore Lambda connectivity reintroduces the exact security exposure that the original re-architecture (moving the database off a public endpoint) was meant to eliminate.", "status": "conflicted"}, {"claim_type": "rule", "confidence": "high", "id": "cl-156eaaffce2e", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Attaching a Lambda function to the same VPC as a private-subnet database, then connecting via the database's private endpoint, is the standard documented pattern for a VPC-attached Lambda function to reach VPC-internal resources.", "status": "conflicted"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-595d53f35953", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "An AWS PrivateLink interface endpoint lets other callers invoke a Lambda function privately, or lets a Lambda function reach AWS-service endpoints (such as S3 or DynamoDB) privately, but it is not a mechanism for a Lambda function to reach an arbitrary private database that is not itself an AWS-service endpoint.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-35740b3ad868", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Attaching an IAM role to a Lambda function only grants permissions to call AWS APIs; it has no bearing on network-level connectivity to a database.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-0c850204c75d", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "When a question's community vote credibly and substantially contradicts or splits from the given boxed answer, the question is flagged as disputed for triage while the boxed answer is nonetheless retained per the ingestion policy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4688955a77b5", "source_question_ids": ["awssysops-p3-1-q904"], "statement": "Using only a single public subnet (rather than one per Availability Zone) for an Application Load Balancer undermines the ALB's own multi-AZ high availability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fd70aece2a57", "source_question_ids": ["awssysops-p3-1-q909"], "statement": "An S3 VPC gateway endpoint lets a subnet's route table send S3-bound traffic directly to S3 over AWS's private network, with no path through any internet gateway or NAT gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-60c647878267", "source_question_ids": ["awssysops-p3-1-q909"], "statement": "Adding more NAT gateways to a VPC still leaves subnets dependent on routing out through an internet gateway, which contradicts a goal of removing internet access entirely while retaining S3 access.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["IPv6 traffic"], "confidence": "high", "id": "cl-3c89068951f8", "source_question_ids": ["awssysops-p3-1-q909"], "statement": "An egress-only internet gateway is an IPv6-only construct that still routes traffic through the internet, so it does not avoid internet traversal.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6910d2c28cce", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A VPC interface endpoint (AWS PrivateLink) lets a VPC connect privately to a supported AWS service such as AWS KMS entirely within the AWS network, without needing an internet gateway, NAT device, or VPN.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-af29fd9b5ca1", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "Routing calls to a service such as AWS KMS through a NAT gateway means those calls traverse the internet via that service's public endpoint, which is the opposite of a requirement that connections must not traverse the internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2da5b2eda828", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A bastion host is for interactive SSH/RDP access to instances and is unrelated to private service-to-service API connectivity such as reaching AWS KMS.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-9b4ddf626c6c", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "An S3 gateway VPC endpoint only routes traffic to Amazon S3; it does not provide private connectivity to other AWS services such as AWS KMS.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-36191597a03b", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "A gateway VPC endpoint for Amazon S3 has no hourly charges and no per-GB data processing charges.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-86075b30cd0b", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "Routing S3 traffic through an S3 gateway VPC endpoint instead of a NAT gateway avoids the NAT Gateway's per-GB data-processing charge.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-35cfa5c5c421", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "An S3 bucket policy enforcing encryption in transit controls access, not network routing, so it does not reduce NAT Gateway data-processing charges.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-80f3779f4581", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "The S3 Intelligent-Tiering storage class affects storage-class billing for stored objects, not the cost of data transferred through a NAT gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-38863db9cafa", "source_question_ids": ["awssysops-p3-1-q926"], "statement": "Disabling CORS on an S3 bucket affects cross-origin browser requests and has no effect on NAT gateway data-processing charges.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ed74e019fccf", "source_question_ids": ["awssysops-p3-1-q927"], "statement": "Updating a VPC's DHCP options set propagates a new DNS server setting to every instance in the VPC as their DHCP leases renew, without needing to individually touch each instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-05deb8386583", "source_question_ids": ["awssysops-p3-1-q927"], "statement": "AWS OpsWorks is a configuration-management service for Chef/Puppet stacks.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-75c709b3f6fb", "source_question_ids": ["awssysops-p3-1-q927"], "statement": "Using AWS Systems Manager or a custom script to update DNS configuration on each instance individually requires iterating over every instance in a fleet, which is more operationally intensive than a single VPC-level DHCP options change.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-vpc--m-1", "title": "A VPC packet needs a route first, then has to pass two filters", "purpose": "Diagnose and design VPC connectivity by checking, in order, whether a route exists to the right target and whether the subnet-level NACL and the instance-level security group both let the packet through, in both directions.", "mechanism": "Each subnet sits in exactly one AZ and is associated with exactly one route table. That table always has an implicit 'local' route for the VPC CIDR, so subnets inside the VPC can reach each other without an IGW or NAT. Traffic leaving the VPC follows the most specific matching route, and the route's target decides what kind of path you get. 0.0.0.0/0 to an attached internet gateway gives two-way internet access, but only for instances with a public or Elastic IP; this is what makes a subnet 'public'. 0.0.0.0/0 to a NAT gateway (which must sit in a public subnet, in one AZ) gives outbound-only IPv4. ::/0 to an egress-only IGW is the IPv6 version of that. A data-center CIDR to a virtual private gateway gives private VPN/Direct Connect access. A gateway endpoint route keeps S3 traffic on the AWS network. With no route, there is no path, whatever IPs, gateways or policies exist. Once a path exists, two filters run. The network ACL works at the subnet level: it is stateless, its rules are numbered and support explicit DENY, and inbound and outbound are checked separately, so return traffic to ephemeral ports (1024-65535) needs its own allow rule. The security group works at the instance/ENI level: it is stateful, allow-only, and every attached group's rules combine with the most permissive winning. One inbound allow on the target is enough, because replies are let back automatically.", "predict_prompt": "An instance in a subnet has an Elastic IP, the VPC has an attached IGW, and its security group allows inbound 443 from 0.0.0.0/0, yet nobody can reach it from the internet. Before reading on, predict the next thing to check, and what changes if the subnet's NACL is a newly created custom ACL.", "invariants": ["No matching route means no connectivity. Security groups, NACLs, Elastic IPs and bucket policies only filter or label traffic; they never create a path.", "Security groups are stateful and allow-only. NACLs are stateless and support explicit deny.", "A subnet is in exactly one AZ and has exactly one route table at a time. One route table can serve many subnets.", "The implicit local route covers the whole VPC CIDR and takes precedence, so a destination that overlaps it can never be sent to a VPN or NAT.", "A NAT gateway or NAT instance only allows connections started from inside. It never accepts unsolicited inbound traffic."], "limits": ["A NAT gateway is tied to one AZ and handles IPv4 only. If its AZ fails, private subnets in other AZs that route through it lose internet access.", "A NAT instance also needs source/destination check disabled, plus security group rules that allow traffic in from the private CIDR and out to 0.0.0.0/0.", "The default NACL allows all traffic, but a custom NACL denies all traffic until you add rules. The default security group allows traffic within the group, but a new security group allows only outbound.", "Gateway endpoints exist only for S3 (and DynamoDB). Other services, such as KMS, need an interface endpoint (PrivateLink)."], "cues": ["'Block this IP/CIDR across the subnets quickly' points to an explicit DENY in the NACL.", "'IGW, EIP and security group are all correct but still unreachable' points to a missing 0.0.0.0/0 to IGW route in the subnet's route table.", "'Private instances need patches but must not be reachable' points to a NAT gateway in a public subnet, with a 0.0.0.0/0 to NAT route.", "'Reach S3 without traversing the internet' or 'cut NAT data charges for S3' points to a gateway endpoint plus a route table entry.", "'Inbound ACCEPT but the reply is REJECT in the flow logs' points to a stateless NACL missing its outbound ephemeral-port rule."], "claim_ids": ["cl-ecfb2ab6e979", "cl-9da85a9c06ec", "cl-6affe70a7d16", "cl-f8cde0449f7b", "cl-e89a27559660", "cl-203f4ba3afac", "cl-ef78dafa08d3", "cl-956e38161193", "cl-0c11ada875af", "cl-9f9d5ffc11d1", "cl-f4c36ff48c82", "cl-472b0f092a56", "cl-9376cd025140", "cl-181450d15c37", "cl-66d9ca0f363f", "cl-467922fe3c44", "cl-dc6cc0630973", "cl-8b8c3ce09f77", "cl-f89cfe15038e", "cl-1b7c13bb2a68", "cl-ac3e08d0cd3c", "cl-fd70aece2a57", "cl-86075b30cd0b", "cl-9b4ddf626c6c", "cl-6910d2c28cce", "cl-2a70b75038dd", "cl-edb93e721ec9", "cl-99d4759387b1", "cl-d7ea6b278f86", "cl-0f05e27c6b56", "cl-7322a6e67945", "cl-ef70b680e0db", "cl-eb2071b89037", "cl-f11a5bf7cb51", "cl-5d48803b999d", "cl-5e7ab5cb1bf3", "cl-915afdbce6b8", "cl-44ebb81d065b", "cl-cbbc57aee320", "cl-46ce26836699", "cl-8024a6cb4612", "cl-2195e1e5537a", "cl-7266a40d48d7", "cl-73964a584b60"]}, "contrastSet": {"id": "aws-sysops-service-vpc--cs-1", "subjects": ["Security group", "Network ACL"], "dimensions": ["Scope", "State tracking", "Rule types", "Return traffic", "Default behavior", "Rule evaluation"], "shared_traits": ["Both are VPC packet filters that control inbound and outbound traffic.", "Neither creates a network path. Both only filter traffic that already has a route.", "Neither is an inline threat-protection appliance."], "matrix": {"Scope": {"Security group": "Instance / ENI level; applies only to the instances it is attached to", "Network ACL": "Subnet level; applies to every instance in the associated subnets"}, "State tracking": {"Security group": "Stateful: replies to allowed traffic are allowed automatically", "Network ACL": "Stateless: inbound and outbound are checked separately"}, "Rule types": {"Security group": "Allow rules only; cannot deny an IP", "Network ACL": "Allow and explicit DENY rules"}, "Return traffic": {"Security group": "No outbound rule needed for responses", "Network ACL": "Needs an outbound allow for ephemeral ports 1024-65535"}, "Default behavior": {"Security group": "New group: all outbound allowed, no inbound. Default group also allows traffic within the group", "Network ACL": "Default NACL allows everything. Custom NACL denies everything until rules are added"}, "Rule evaluation": {"Security group": "All rules from all attached groups combined; most permissive wins", "Network ACL": "Numbered rules evaluated in order"}}, "decision_rule": "Ask whether the requirement needs traffic to be explicitly denied. If you must block a specific IP or CIDR (for example across every instance in a subnet), use the Network ACL, because security groups cannot express a deny. If you only need to allow specific traffic to specific instances, use the security group. Its stateful replies mean a single inbound rule on the target is enough.", "boundary_flip": "Start with 'allow MySQL 3306 from the web tier to the Aurora instances'. The answer is the security group: add an inbound rule on the Aurora SG with the web tier's SG as the source, and no outbound or return rule is needed. Change it to 'immediately block traffic from 198.51.100.0/24 to every instance in these subnets' and the answer becomes the Network ACL: add an explicit DENY on the subnets' NACLs. Security groups have no deny, and editing each one would be slow and incomplete.", "strongest_distractor_failure": "Learners carry NACL behavior over to security groups, so they add outbound or ephemeral-port return rules to a security group, or think 'deny all outbound' on a security group breaks responses. Security groups are stateful, so replies are allowed regardless. The reverse mistake breaks things: on a stateless NACL, allowing outbound only on port 80, or adding 'deny all outbound', blocks the server's reply to the client's ephemeral port.", "exceptions": ["When an ELB sits in front of the web servers, their security groups see the load balancer's IP as the source, not the client's. Filtering on the real client IP then needs the X-Forwarded-For header.", "A custom NACL starts with deny-all and is not associated with any subnet until you associate it. The VPC's default NACL starts with allow-all."], "claim_ids": ["cl-be86d14279d0", "cl-03b7696ffc02", "cl-d6cc2bbc9a6e", "cl-45bc5f89cdb8", "cl-bae339abeb1b", "cl-5d48803b999d", "cl-9ee269b12154", "cl-0f05e27c6b56", "cl-d7ea6b278f86", "cl-7815235443e3", "cl-32601b768a38", "cl-f11a5bf7cb51", "cl-ef70b680e0db", "cl-7322a6e67945", "cl-2601d0f8c1d5", "cl-eb2071b89037", "cl-8d4af0d3df4f", "cl-effe894599cd", "cl-fa5771e20413", "cl-9d43a1145f6d", "cl-6d1856a4f4aa", "cl-079f0a682262", "cl-cbbc57aee320", "cl-46ce26836699", "cl-915afdbce6b8", "cl-a62828c2d1ea", "cl-44ebb81d065b", "cl-5e7ab5cb1bf3", "cl-8203b0c2aaa2", "cl-edb93e721ec9", "cl-86d50a87e352", "cl-e61769123b58", "cl-c66dc66e7288"]}, "scenarioFamily": {"id": "aws-sysops-service-vpc--sf-1", "canonical": {"prompt": "A sysops engineer launches an EC2 instance into a subnet. The subnet's route table currently has only the implicit local route for the VPC's CIDR. The VPC has an Internet Gateway attached, the instance has an Elastic IP, and its security group allows inbound TCP 443 from 0.0.0.0/0. External users still cannot reach the instance over HTTPS. What is the most likely cause, and what should the engineer check next?", "expected_answer": ["The subnet's route table is missing a 0.0.0.0/0 route pointing to the Internet Gateway; add that route, since an attached IGW and an Elastic IP are not themselves enough -- the subnet's route table must also send internet-bound traffic to the IGW."], "reasoning": "An Internet Gateway is required for any VPC-to-internet path, but attaching one and giving the instance an Elastic IP only make a path possible, not actual: the subnet's own route table has to carry a 0.0.0.0/0 entry targeting that IGW before traffic can leave. With IGW, EIP, and the security group's inbound 443 rule all already confirmed correct, the next thing to check is exactly this route table entry, not the IP assignment, which is already automatic and therefore never the cause of a connectivity failure.", "distractor_analysis": "A learner might suspect the security group needs an outbound rule too, or that the private IP assignment is somehow missing -- but a private IP is always auto-assigned and is never the cause of connectivity failure, and the security group's correctness was already stipulated. An internet gateway is also never 'configured with' a security group; the two are independent constructs, so there is no IGW-to-SG wiring to inspect. The one thing left unverified is the subnet's route table.", "claim_ids": ["cl-9f9d5ffc11d1", "cl-0c11ada875af", "cl-f4c36ff48c82", "cl-f6a89504a736", "cl-72f23043dbe8", "cl-2adc773ac2f4", "cl-1b7368e75d2f"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The route table is now already correct (0.0.0.0/0 points to the IGW), but the subnet has instead just been associated with a brand-new custom network ACL that has no rules added yet, replacing the default NACL.", "prompt": "Same instance and security group as before, and this time the engineer confirms the subnet's route table already has a correct 0.0.0.0/0 route to the Internet Gateway. The subnet was also just associated with a brand-new, self-created network ACL, which has not had any rules added to it yet. External users still cannot reach the instance over HTTPS. What is the most likely cause now?", "expected_answer": ["The subnet is now governed by a custom network ACL, which denies all inbound and outbound traffic by default until rules are explicitly added; the engineer must add an inbound rule allowing 443 and an outbound rule allowing the ephemeral port range (1024-65535) on that NACL, since NACLs are stateless and evaluate inbound and outbound independently."], "reasoning": "This flips the root cause from the canonical scenario: once the route table is fixed, a custom NACL becomes the new blocker, because -- unlike the VPC's default NACL, which allows everything -- a self-created custom NACL denies all inbound and outbound traffic until rules are explicitly added. Because NACLs are stateless, simply allowing inbound 443 is not enough; the return traffic to the client's ephemeral port (1024-65535) must also be explicitly allowed outbound, since NACLs check each direction independently.", "claim_ids": ["cl-915afdbce6b8", "cl-ef70b680e0db", "cl-eb2071b89037", "cl-7322a6e67945"], "difficulty": "hard", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The instance is a larger instance type with enhanced networking enabled, and the VPC separately has a NAT gateway in another Availability Zone serving unrelated private subnets; the route table, IGW, EIP, and security group are exactly as in the canonical scenario.", "prompt": "Same scenario as the canonical one, except the instance has been resized to a larger type with enhanced networking enabled, and the VPC also happens to have a NAT gateway in a different Availability Zone that serves some unrelated private subnets. External users still cannot reach the instance over HTTPS. What is the most likely cause?", "expected_answer": ["The subnet's route table is missing a 0.0.0.0/0 route pointing to the Internet Gateway; add that route, since an attached IGW and an Elastic IP are not themselves enough -- the subnet's route table must also send internet-bound traffic to the IGW."], "reasoning": "Instance size and enhanced networking are performance features with no bearing on whether an instance can reach the internet, and a NAT gateway serving other, unrelated private subnets has no effect on this public instance's own route table. None of these details change the underlying cause: the subnet's route table still needs its own 0.0.0.0/0 route to the IGW.", "distractor_analysis": "A learner might be tempted to investigate the NAT gateway or networking performance settings as the cause, but a NAT gateway only matters to the private subnets routed through it, and enhanced networking is explicitly a performance feature unrelated to internet reachability.", "claim_ids": ["cl-9f9d5ffc11d1", "cl-0c11ada875af", "cl-f4c36ff48c82", "cl-39007cbc91e2"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate proposes attaching a second Internet Gateway to the VPC for redundancy, reasoning that the existing IGW might be a single point of failure causing the outage; everything else is unchanged from the canonical scenario.", "prompt": "Same scenario as the canonical one. A teammate proposes attaching a second Internet Gateway to the VPC, arguing that the current IGW could be a single point of failure and that adding a redundant one might restore connectivity. Is this the correct fix, and what should actually be checked?", "expected_answer": ["The subnet's route table is missing a 0.0.0.0/0 route pointing to the Internet Gateway; add that route, since an attached IGW and an Elastic IP are not themselves enough -- the subnet's route table must also send internet-bound traffic to the IGW."], "reasoning": "The teammate's suggestion is a dead end: an Internet Gateway is inherently redundant and highly available at the VPC level, so attaching a second one does not remove any single point of failure and would not change connectivity at all. The actual cause is unchanged from the canonical scenario -- the subnet's route table is still missing its 0.0.0.0/0 route to the (single, already-sufficient) IGW.", "distractor_analysis": "Adding a second IGW sounds plausible because it echoes general high-availability thinking, but it directly contradicts the fact that an IGW is already redundant/highly available by design at the VPC level; the fix the teammate proposes would consume effort without resolving the real route-table gap.", "claim_ids": ["cl-9f9d5ffc11d1", "cl-0c11ada875af", "cl-f4c36ff48c82", "cl-bb168dcb42b2"], "difficulty": "medium", "importance": "high"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "The contrast set's boundary_flip is built on cl-9d43a1145f6d (add an inbound 3306 rule on the Aurora SG, sourced from the EC2 SG), but that claim is marked 'conflicted' because its source question awssysops-p3-1-q851 is disputed. Its sibling distractor cl-3983ee9074b2 is conflicted too. The synthesis presents the answer as settled and never mentions the dispute.", "related_entity_ids": ["aws-sysops-service-vpc--cs-1", "cl-9d43a1145f6d", "cl-3983ee9074b2", "cl-fa5771e20413"]}, {"type": "contradiction", "severity": "medium", "description": "The mental model's limits state as fact that a NAT instance needs source/destination check disabled, and it cites cl-8024a6cb4612. That claim is 'conflicted' (source awssysops-p3-1-q857 is disputed, and so is the sibling distractor cl-6da2e2e26727). The synthesis does not show the dispute.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "cl-8024a6cb4612", "cl-6da2e2e26727"]}, {"type": "contradiction", "severity": "medium", "description": "The mental model's mechanism states '::/0 to an egress-only IGW is the IPv6 version of that' and cites cl-f89cfe15038e. That claim is 'conflicted' because source awssysops-p3-1-q604 is disputed. The synthesis states the routing rule with no caveat.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "cl-f89cfe15038e", "cl-8b8c3ce09f77"]}, {"type": "contradiction", "severity": "medium", "description": "The contrast set cites cl-8d4af0d3df4f (one inbound SG rule is sufficient because SGs are stateful), marked 'supported'. But the same source question awssysops-p1-q208 has community votes split evenly between two answers (cl-4ab680d20b8a, conflicted). One claim from a split question was promoted to settled fact without flagging the split.", "related_entity_ids": ["aws-sysops-service-vpc--cs-1", "cl-8d4af0d3df4f", "cl-4ab680d20b8a", "cl-effe894599cd"]}, {"type": "contradiction", "severity": "medium", "description": "The source questions disagree on whether the connecting side's security group needs an outbound rule. awssysops-p1-q021 (cl-97625e7139d8, cl-d60114921536) requires an outbound ICMP rule on the source SG plus an inbound rule on the destination SG. awssysops-p3-1-q851 (cl-fa5771e20413) says the connecting resource's outbound side needs no changes. That only holds while the default allow-all outbound rule is in place, which is not stated. The mental model ('One inbound allow on the target is enough') and the contrast set decision_rule ('a single inbound rule on the target is enough') adopt the unconditional version.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "aws-sysops-service-vpc--cs-1", "cl-fa5771e20413", "cl-97625e7139d8", "cl-d60114921536", "cl-44845599197f"]}, {"type": "contradiction", "severity": "medium", "description": "cl-6d1856a4f4aa calls a security-group 'deny all outbound' rule harmless to responses. But security groups cannot express deny rules at all (cl-5d48803b999d, cl-bae339abeb1b, which the same contrast set cites). The contrast set cites cl-6d1856a4f4aa, and its strongest_distractor_failure repeats the idea of a 'deny all outbound' rule on a security group. That frames an impossible configuration as a real misconception.", "related_entity_ids": ["aws-sysops-service-vpc--cs-1", "cl-6d1856a4f4aa", "cl-5d48803b999d", "cl-bae339abeb1b"]}, {"type": "stale-risk", "severity": "medium", "description": "Mental model invariant: the local route 'takes precedence, so a destination that overlaps it can never be sent to a VPN or NAT' (from cl-203f4ba3afac, medium confidence). Since 2021, AWS allows routes more specific than the local route that target an ENI, NAT gateway, or Gateway Load Balancer/firewall endpoint, so 'can never' is stale. It also sits awkwardly next to the mechanism's own 'follows the most specific matching route', which no claim states.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "cl-203f4ba3afac", "cl-e89a27559660"]}, {"type": "unsupported-generation", "severity": "low", "description": "Several synthesis statements are backed by no claim in the slice. The mental model says NACL rules are 'numbered' and the contrast set's Rule evaluation cell says NACLs use 'Numbered rules evaluated in order'. The limits mention DynamoDB gateway endpoints. The mechanism asserts longest-prefix ('most specific') route matching. These may be accurate, but no cited claim supports them.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "aws-sysops-service-vpc--cs-1"]}, {"type": "stale-risk", "severity": "low", "description": "The mental model says a NAT gateway 'must sit in a public subnet' (cl-181450d15c37). That is true for public NAT gateways only. Private NAT gateways (connectivity type 'private', available since 2021) sit in private subnets and need no IGW. Stating it unconditionally risks being stale.", "related_entity_ids": ["aws-sysops-service-vpc--m-1", "cl-181450d15c37"]}, {"type": "contradiction", "severity": "medium", "description": "Two claims from the same question, awssysops-p1-q196, assert opposite readings of the Elastic IP limit. cl-3e703a66b1c1 (separate allotment of 5 per platform) is marked 'supported', while cl-d083b203db1a says the split is genuinely contested and is 'conflicted'. The per-platform reading should not be 'supported' while its own source is disputed.", "related_entity_ids": ["cl-3e703a66b1c1", "cl-d083b203db1a"]}, {"type": "contradiction", "severity": "medium", "description": "cl-33fbf0096616 (an ELB across 2 AZs needs two public subnets) is marked 'supported' with medium confidence, but cl-89952f0a9ba0 from the same source question awssysops-p1-q016 records that exact point as disputed among commenters. awssysops-p3-1-q904 (cl-4688955a77b5) sides with one subnet per AZ, but the q016 dispute should be flagged, not settled.", "related_entity_ids": ["cl-33fbf0096616", "cl-89952f0a9ba0", "cl-4688955a77b5"]}, {"type": "contradiction", "severity": "medium", "description": "Many claims in this slice have boxed answers that disagree with community votes or comment threads, and the claims are marked conflicted or needs-review. They need triage before use. Affected: q006 IGW+NAT vs IGW+VGW split 50/50 (cl-b6c2131aac4b); q209 console auto-detach of the VGW vs 100% vote and testing (cl-f32b8f3bf6f3, cl-379c18128cc8, cl-5854dd30cec3); q218 route-table entries unresolved (cl-b3f6e470e1d0, cl-335ef68078ec); q219 100% vote for routing the subnet's own CIDR to NAT vs 0.0.0.0/0 (cl-36c4004ab4a5); q236 no listed choice strictly required (cl-98deec70111a, cl-84250b473555); q244 secondary CIDR (cl-c9711917766f, cl-b059f49c6ab5); q326 bucket-policy endpoint restriction (cl-902b68475550); q330 IPv6 egress-only routing (cl-2b4193cff89a, cl-0b88c9554d6c, cl-11b818ed654b, cl-b0bcae6e1b6d); q523 multi-AZ VPC (cl-32ba0918bd76, cl-207f75a21cbb, cl-ab472533105d); q547 PassRole vs internet access (cl-d7cd2957fbb8, cl-380c63dbc203); q587 Blackhole route (cl-062d0b8b1594, cl-b42dcd5bc667); q593 VPC limit vs template update (cl-66948dfc1be7, cl-078a61473505); q618 flow logs to CloudTrail (cl-39a5534c788d); q889 Lambda in VPC (cl-c20695bbf972, cl-156eaaffce2e, cl-595d53f35953).", "related_entity_ids": ["cl-b6c2131aac4b", "cl-f32b8f3bf6f3", "cl-379c18128cc8", "cl-5854dd30cec3", "cl-b3f6e470e1d0", "cl-335ef68078ec", "cl-36c4004ab4a5", "cl-98deec70111a", "cl-84250b473555", "cl-c9711917766f", "cl-b059f49c6ab5", "cl-902b68475550", "cl-2b4193cff89a", "cl-0b88c9554d6c", "cl-11b818ed654b", "cl-b0bcae6e1b6d", "cl-32ba0918bd76", "cl-207f75a21cbb", "cl-ab472533105d", "cl-d7cd2957fbb8", "cl-380c63dbc203", "cl-062d0b8b1594", "cl-b42dcd5bc667", "cl-66948dfc1be7", "cl-078a61473505", "cl-39a5534c788d", "cl-c20695bbf972", "cl-156eaaffce2e", "cl-595d53f35953"]}, {"type": "quality", "severity": "medium", "description": "cl-0c54212b47ee says an Elastic IP can be associated with a VPC instance without an Internet Gateway attached. AWS rejects that association with a Gateway.NotAttached error when the VPC has no attached IGW. The claim is likely wrong, and it is in tension with cl-f4c36ff48c82 from the same question, awssysops-p1-q197.", "related_entity_ids": ["cl-0c54212b47ee", "cl-f4c36ff48c82"]}, {"type": "ambiguity", "severity": "low", "description": "cl-9789b0baf0b9 (unconditional: an IGW must be created, attached and routed, and none of that happens automatically) conflicts with cl-feb2d6091c7e (an instance in a default VPC subnet automatically gets a public IP and internet reachability through the VPC's IGW). cl-9789b0baf0b9 needs a 'non-default VPC' condition.", "related_entity_ids": ["cl-9789b0baf0b9", "cl-feb2d6091c7e", "cl-50aa3dc9bd8a"]}, {"type": "ambiguity", "severity": "low", "description": "cl-ab4ef7703f23 (needs-review) says the main route table destination should be widened to the VPC's full CIDR so that subnets can talk to each other. That conflicts with cl-e89a27559660 and cl-f8cde0449f7b: every route table already has an implicit, non-editable local route for the whole VPC CIDR.", "related_entity_ids": ["cl-ab4ef7703f23", "cl-e89a27559660", "cl-f8cde0449f7b"]}, {"type": "quality", "severity": "low", "description": "cl-d54e02d33429 overgeneralizes: terminating an instance deletes only ENIs whose DeleteOnTermination flag is set, typically the primary ENI created at launch. Secondary ENIs attached later persist by default.", "related_entity_ids": ["cl-d54e02d33429"]}, {"type": "parse", "severity": "low", "description": "The five claims from awssysops-p3-1-q889 have no 'conditions' field, unlike every other claim. Separately, cl-0c850204c75d is a statement about ingestion policy, not VPC knowledge, and should not be in the slice's claims.", "related_entity_ids": ["cl-c20695bbf972", "cl-156eaaffce2e", "cl-595d53f35953", "cl-35740b3ad868", "cl-0c850204c75d"]}], "sourceQuestionCount": 101}], "sources": {"kind": "locked", "file": "aws-sysops-service-vpc-ev6v.sources.enc.js"}}</script>
<script>

  const DIAGNOSIS_CATEGORIES = [

    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to

  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
