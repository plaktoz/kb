<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

ops-p1-q006"], "statement": "A Virtual Private Gateway (VGW) is the VPC-side endpoint for a Site-to-Site VPN or Direct Connect connection to an on-premises network.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a19c0d32ed5b", "source_question_ids": ["awssysops-p1-q006"], "statement": "A NAT Gateway provides one-way outbound internet access for private-subnet instances but is not itself the VPC's attachment point to an external network; the Internet Gateway still handles that.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-b6c2131aac4b", "source_question_ids": ["awssysops-p1-q006"], "statement": "Community vote on which two components provide external connectivity for a VPC is split roughly 50/50 between NAT Gateway+Internet Gateway and Internet Gateway+Virtual Private Gateway.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb168dcb42b2", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Internet Gateway (IGW) is inherently redundant/highly available at the VPC level, so adding a second IGW does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-364df7c366b0", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Elastic Load Balancer automatically spans multiple Availability Zones, so adding a second ELB does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b3aa5da8e2c", "source_question_ids": ["awssysops-p1-q010"], "statement": "A multi-AZ RDS instance already fails over automatically to a standby in a second Availability Zone, so it is not itself a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1360dcf4efc7", "source_question_ids": ["awssysops-p1-q010"], "statement": "In an architecture that already uses an IGW, an ELB spanning multiple AZs, and a multi-AZ RDS instance, there is no remaining single point of failure that needs to be fixed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ecfb2ab6e979", "source_question_ids": ["awssysops-p1-q011"], "statement": "Each VPC subnet maps to exactly one Availability Zone and cannot span multiple Availability Zones.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-94f3700241f8", "source_question_ids": ["awssysops-p1-q011"], "statement": "By default, every subnet in a VPC, whether public or private, can route to every other subnet in that VPC via the main route table.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa2693b716a9", "source_question_ids": ["awssysops-p1-q011"], "statement": "The smallest CIDR block mask AWS allows for a VPC subnet is /28, not /25.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4c8adff400a2", "source_question_ids": ["awssysops-p1-q011"], "statement": "Private-subnet instances reach the internet via a NAT gateway rather than needing their own Elastic IP.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1fa7a765b651", "source_question_ids": ["awssysops-p1-q016"], "statement": "Subnets cannot span multiple Availability Zones; achieving coverage across N Availability Zones for a resource requires provisioning one subnet per AZ.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-33fbf0096616", "source_question_ids": ["awssysops-p1-q016"], "statement": "An ELB that must be distributed across multiple Availability Zones needs a subnet registered in each of those AZs, so an ELB distributed over 2 AZs requires two public subnets (one per AZ).", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6de4b10a3185", "source_question_ids": ["awssysops-p1-q016"], "statement": "RDS database instances should be placed in private subnets rather than public subnets so the database is not reachable from the internet.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-707b0eca29cb", "source_question_ids": ["awssysops-p1-q016"], "statement": "In a tiered VPC design with a public-facing ELB and a private database tier, the web/application servers should also be placed in private subnets rather than a public subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-89952f0a9ba0", "source_question_ids": ["awssysops-p1-q016"], "statement": "Whether a single public subnet is sufficient for an ELB distributed over 2 Availability Zones (versus requiring one public subnet per AZ) is disputed among exam commenters, since some argue a single ELB can already span multiple AZs from one subnet.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d60114921536", "source_question_ids": ["awssysops-p1-q021"], "statement": "Security group statefulness only applies to a connection already permitted by at least one side's rules; it does not make both sides' rules symmetric by default.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Goal is to allow only ICMP between two specific instances"], "confidence": "high", "id": "cl-97625e7139d8", "source_question_ids": ["awssysops-p1-q021"], "statement": "To allow only ICMP ping between two specific instances and nothing else, the source instance's security group needs an outbound ICMP rule and the destination instance's security group needs an inbound ICMP rule.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-058bfee61439", "source_question_ids": ["awssysops-p1-q021"], "statement": "ICMP traffic works across Availability Zones and subnets within the same VPC; security groups, not subnet or AZ boundaries, are what filter it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-89f78f4e1293", "source_question_ids": ["awssysops-p1-q021"], "statement": "Putting two instances in one shared security group with inbound ICMP allowed would technically permit ICMP between them, but is unnecessarily permissive and not required when a scoped two-sided rule would do.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-d8e6f085345c", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the network ACLs on both subnets must permit the traffic.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-3febcf7bf852", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the security groups on both instances must allow the traffic on the right port/protocol.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-f8cde0449f7b", "source_question_ids": ["awssysops-p1-q022"], "statement": "Route tables route between subnets in the same VPC by default with no NAT instance or Internet Gateway involved, since that traffic never leaves the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab1633b33ef1", "source_question_ids": ["awssysops-p1-q022"], "statement": "Matching instance class or using the same key pair between two EC2 instances has no bearing on network reachability between them.", "status": "supported"}, {"claim_type": "rule", "conditions": ["IGW, EIP, and security group rules already confirmed correct"], "confidence": "high", "id": "cl-9f9d5ffc11d1", "source_question_ids": ["awssysops-p1-q037"], "statement": "After confirming a VPC has an Internet Gateway, the instance has an Elastic IP, and security group rules are correct, the next thing to check for connectivity is whether the subnet's route table has a route sending 0.0.0.0/0 traffic to the Internet Gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-eed5fff8ff51", "source_question_ids": ["awssysops-p1-q037"], "statement": "A NAT instance's configuration is only relevant to outbound-only private-subnet traffic, not to a public instance that already has its own Elastic IP.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-abb75f7baaae", "source_question_ids": ["awssysops-p1-q037"], "statement": "Source/destination (SRC/DST) checking is a NAT/routing-instance concept and is not relevant to a normal EC2 instance's own internet connectivity.", "status": "supported"}, {"claim_type": "rule", "conditions": ["launching an EC2 instance and wanting a predetermined private IP address"], "confidence": "high", "id": "cl-d189624fb381", "source_question_ids": ["awssysops-p1-q052"], "statement": "Only within a VPC can a user define a subnet's CIDR range and assign a specific, predetermined private IP address to an EC2 instance at launch.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-50e63e1ea566", "source_question_ids": ["awssysops-p1-q052"], "statement": "An Elastic IP address is a public IP address, not a private one, so assigning Elastic IPs does not satisfy a requirement for a predetermined private IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-481fbf9ca5c9", "source_question_ids": ["awssysops-p1-q052"], "statement": "A Placement Group affects instance placement and network performance between instances, not IP address assignment.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-07ea3e784810", "source_question_ids": ["awssysops-p1-q052"], "statement": "An instance's private DNS hostname just names whatever private IP address the instance happened to be assigned; it does not let a user predetermine that IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f65d41befcac", "source_question_ids": ["awssysops-p1-q052"], "statement": "Launching an instance from a private AMI controls the image/OS content, not networking or IP address assignment.", "status": "supported"}, {"claim_type": "default", "conditions": ["instance is launched into the default subnet in EC2-VPC"], "confidence": "high", "id": "cl-feb2d6091c7e", "source_question_ids": ["awssysops-p1-q060"], "statement": "An instance launched into a default VPC subnet automatically gets a private IP address, an auto-assigned public IP address, and reachability to/from the internet through the VPC's internet gateway, all provisioned automatically at launch.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-a7a90931cff9", "source_question_ids": ["awssysops-p1-q060", "awssysops-p1-q073"], "statement": "An Elastic IP is never attached to an EC2 instance automatically; it must be explicitly allocated to the account and then associated with the instance as a separate manual step.", "status": "supported"}, {"claim_type": "default", "conditions": ["instance launched into a VPC subnet with only default settings"], "confidence": "high", "id": "cl-50aa3dc9bd8a", "source_question_ids": ["awssysops-p1-q073"], "statement": "An EC2 instance launched into a VPC subnet with only default settings is assigned a private I stion_ids": ["awssysops-p1-q111"], "statement": "A valid main route table entry for a VPN-only subnet routes all non-local traffic (0.0.0.0/0) to the virtual private gateway so instances reach the corporate data center over the VPN.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-e89a27559660", "source_question_ids": ["awssysops-p1-q111"], "statement": "Every VPC route table has an implicit 'local' route handling traffic to the VPC's own CIDR range by default, so pointing a destination already inside the VPC's CIDR at the VPN gateway instead is redundant or incorrect.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC has only a private, VPN-connected subnet with no public subnet or IGW"], "confidence": "high", "id": "cl-14107cfb308e", "source_question_ids": ["awssysops-p1-q117"], "statement": "In a VPC with only a private subnet connected via VPN and no public subnet or Internet Gateway, the only network path to an instance in that subnet is through the VPN tunnel back to the user's own network.", "status": "supported"}, {"claim_type": "rule", "conditions": ["VPC has only a private, VPN-connected subnet with no public subnet or IGW"], "confidence": "high", "id": "cl-f1e88d1f493d", "source_question_ids": ["awssysops-p1-q117"], "statement": "For SSH access to an instance reachable only via a VPN-only private subnet, the security group should simply allow inbound traffic on port 22 from the user's own network range, since the VPN tunnel itself handles routing that traffic into the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8cf8357edbad", "source_question_ids": ["awssysops-p1-q117"], "statement": "A bastion-host-via-Elastic-IP pattern for reaching private instances is a real pattern over the public internet, but it is unnecessary when a VPN tunnel already provides the network path to a private subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7ab48df8f965", "source_question_ids": ["awssysops-p1-q117"], "statement": "A NAT instance provides outbound internet access from private instances, not inbound SSH access to them.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-46ce26836699", "source_question_ids": ["awssysops-p1-q149"], "statement": "A newly created, non-default security group has no rules allowing intra-group traffic until one is added, unlike the default security group, which allows this out of the box.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9adfed790034", "source_question_ids": ["awssysops-p1-q149"], "statement": "The standard way to allow instances in the same security group to communicate with each other is to add a rule whose source is the security group itself, covering all protocols and ports.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-dfbcc407ebbe", "source_question_ids": ["awssysops-p1-q149"], "statement": "VPC peering solves cross-VPC connectivity, not same-subnet or same-VPC communication, so it is not needed to let instances in the same subnet talk to each other.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC has public and VPN-only subnets with hardware VPN access configured"], "confidence": "medium", "id": "cl-d79501d05e48", "source_question_ids": ["awssysops-p1-q151"], "statement": "To route an organization's on-premises proxy traffic into a public subnet over a hardware VPN connection, set up route table entries and security group rules on the public subnet's instances so they accept traffic arriving over the virtual private gateway from the corporate network.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-28241cf34246", "source_question_ids": ["awssysops-p1-q d"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fe3635be8766", "source_question_ids": ["awssysops-p1-q274"], "statement": "The AWS VPC wizard associates the implicit main (default) route table with the private subnet it creates.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-747e5bb4414d", "source_question_ids": ["awssysops-p1-q274"], "statement": "The AWS VPC wizard creates a separate custom route table, containing a route to the internet gateway, and associates it with the public subnet it creates.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c68ead9f0730", "source_question_ids": ["awssysops-p1-q274"], "statement": "Reversing the VPC wizard's route-table pairing -- binding the main route table to the public subnet and a custom route table to the private subnet -- misdescribes the actual wizard behavior.", "status": "supported"}, {"claim_type": "exception", "conditions": ["current VPC wizard behavior, as opposed to older documentation describing NAT instances"], "confidence": "medium", "id": "cl-347584fd0c09", "source_question_ids": ["awssysops-p1-q274"], "statement": "The AWS VPC wizard now provisions a managed NAT Gateway rather than a NAT instance for the public/private subnet pattern, which is a platform change from when NAT instances were the only option.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aca076cc6227", "source_question_ids": ["awssysops-p1-q285"], "statement": "Instances in a private subnet have no direct route to an internet gateway.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3fe10b446c03", "source_question_ids": ["awssysops-p1-q285"], "statement": "Private subnet instances get outbound internet access (for example, to download OS patch updates) by routing through a NAT instance or NAT gateway backed ad balancer's IP address as the traffic source, not the original client's IP address, unless the X-Forwarded-For header is used to recover and filter on the real client IP.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-53bf427147f8", "source_question_ids": ["awssysops-p2-q318"], "statement": "Configuring web server security groups to allow only customers' predefined IP addresses, together with configuring the web servers to filter traffic based on the ELB's X-Forwarded-For header, are two valid options for restricting a web application to accept traffic only from predefined customer IPs.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6d1856a4f4aa", "source_question_ids": ["awssysops-p2-q318"], "statement": "Because security groups are stateful, return traffic is automatically permitted regardless of outbound rules, making a security-group rule like \"deny all outbound\" effectively harmless to legitimate response traffic.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-079f0a682262", "source_question_ids": ["awssysops-p2-q318"], "statement": "Because network ACLs are stateless, an explicit \"deny all outbound\" rule on a NACL would actually block legitimate response traffic back to the client, unlike the equivalent rule on a stateful security group.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8fabd468b5d0", "source_question_ids": ["awssysops-p2-q323"], "statement": "An EC2 instance's tenancy attribute (default vs. dedicated) cannot be changed in place on a running instance after launch.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-154d1ff0eef4", "source_question_ids": ["awssysops-p2-q323"], "statement": "To move a single existing EC2 instance to dedicated-tenancy hardware with minimal impact on the rest of an application, the supported process is: stop the instance, create an AMI from it, launch a new instance from that AMI with tenancy=dedicated, then terminate the original instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-220bd1e9a082", "source_question_ids": ["awssysops-p2-q323"], "statement": "Migrating an entire VPC to a new VPC configured with tenancy=dedicated affects every instance in that VPC, which is unnecessary disruption when only a single instance needs to move to dedicated tenancy.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-902b68475550", "source_question_ids": ["awssysops-p2-q326"], "statement": "A bucket policy can restrict an S3 bucket so that it is only accessible through a specific VPC endpoint, satisfying a requirement that the bucket be reachable only via that endpoint.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-acfa0b26a1ed", "source_question_ids": ["awssysops-p2-q326"], "statement": "A VPC endpoint policy can restrict the endpoint itself so that the VPC can only reach one specific S3 bucket through it, satisfying a requirement that resources in the VPC be limited to a single bucket.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-dae66592d22b", "source_question_ids": ["awssysops-p2-q326"], "statement": "There is no AWS mechanism called a \"VPC endpoint policy on the bucket\" -- a VPC endpoint policy attaches to the endpoint itself, not to a bucket; a policy attached to the bucket restricting it to endpoint-only access is instead a bucket policy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-971ad8832b37", "source_question_ids": ["awssysops-p2-q326"], "statement": "S3 bucket access restrictions are configured via bucket policies, not via an \"IAM policy attached to the bucket\" -- IAM policies attach to principals (users, roles), not to resources like buckets.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b76591f45ae5", "source_question_ids": ["awssysops-p2-q326"], "statement": "VPC peering configuration is not a mechanism for restricting access to a specific S3 bucket through a VPC endpoint.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2b4193cff89a", "source_question_ids": ["awssysops-p2-q330"], "statement": "An egress-only Internet Gateway is attached at the VPC level, but the route directing IPv6 traffic to that gateway is added to a specific subnet's route table, since every subnet in a VPC has its own associated route table.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0b88c9554d6c", "source_question_ids": ["awssysops-p2-q330"], "statement": "IPv6 addresses are globally unique and therefore inherently public/routable by design, regardless of which subnet an instance is placed in.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-11b818ed654b", "source_question_ids": ["awssysops-p2-q330"], "statement": "A security group that blocks inbound IPv6 traffic directly prevents unsolicited inbound access to an instance with a public IPv6 address, independent of subnet placement or egress-only gateway configuration.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-b0bcae6e1b6d", "source_question_ids": ["awssysops-p2-q330"], "statement": "VPC route tables are associated per-subnet rather than solely at the VPC level, since each subnet in a VPC has its own associated route table.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9ef7fe3d4927", "source_question_ids": ["awssysops-p2-q349"], "statement": "Amazon VPC stands for Amazon Virtual Private Cloud.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8203b0c2aaa2", "source_question_ids": ["awssysops-p2-q406"], "statement": "Security groups in Amazon VPC control both inbound and outbound traffic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7815235443e3", "source_question_ids": ["awssysops-p2-q407"], "statement": "Security groups in a VPC are stateful: return traffic for an allowed request is automatically permitted without re-evaluating security group rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-32601b768a38", "source_question_ids": ["awssysops-p2-q407", "awssysops-p2-q431"], "statement": "Network ACLs, unlike security groups, are stateless, so return traffic must be explicitly allowed by a rule rather than being automatically permitted.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ef78dafa08d3", "source_question_ids": ["awssysops-p2-q420"], "statement": "A subnet is considered a public subnet if its traffic is routed to an internet gateway.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-956e38161193", "source_question_ids": ["awssysops-p2-q420"], "statement": "A subnet whose traffic is routed to a virtual private gateway instead of an internet gateway is a VPN-only subnet, not a public subnet, and a subnet with no internet-gateway route at all is a private subnet.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0f05e27c6b56", "source_question_ids": ["awssysops-p2-q430"], "statement": "Security groups in a VPC operate at the instance level, controlling traffic for the specific EC2 instances they are associated with.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d7ea6b278f86", "source_question_ids": ["awssysops-p2-q430", "awssysops-p2-q449"], "statement": "Network ACLs operate at the subnet level, controlling traffic flowing in and out of the subnets they're associated with, in contrast to security groups which operate at the instance level.", "status": "supported"}, {"claim_type": "default", "conditions": ["network ACL is custom-created by the user, not the VPC's automatically-provided default ACL"], "confidence": "high", "id": "cl-915afdbce6b8", "source_question_ids": ["awssysops-p2-q439"], "statement": "A custom (self-created) network ACL denies all inbound and outbound traffic by default until rules are explicitly added to it.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-a62828c2d1ea", "source_question_ids": ["awssysops-p2-q439"], "statement": "A custom network ACL is not associated with any subnet until it is explicitly associated with one.", "status": "supported"}, {"claim_type": "default", "conditions": ["network ACL is the automatically-provided default ACL that comes with the VPC, not a user-created custom ACL"], "confidence": "high", "id": "cl-44ebb81d065b", "source_question_ids": ["awssysops-p2-q450", "awssysops-p2-q439"], "statement": "The default network ACL that automatically comes with a VPC allows all inbound and outbound traffic by default, which is the opposite default behavior of a custom NACL that a user creates themselves.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-c75eee457b12", "source_question_ids": ["awssysops-p2-q443"], "statement": "The default (soft) limit on the number of VPCs allowed per AWS region is 5.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-3fe32bd7abe0", "source_question_ids": ["awssysops-p2-q443"], "statement": "The default limit on the number of VPCs per region is a soft limit that can be raised via a service quota increase request.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6affe70a7d16", "source_question_ids": ["awssysops-p2-q445"], "statement": "A single route table in a VPC can be associated with multiple subnets.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9da85a9c06ec", "source_question_ids": ["awssysops-p2-q445"], "statement": "A given subnet can be associated with only one route table at a time.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-5d48803b999d", "source_question_ids": ["awssysops-p2-q474", "awssysops-p2-q507"], "statement": "Security groups support allow rules only; they cannot express explicit deny rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0d87167b8ae7", "source_question_ids": ["awssysops-p2-q474"], "statement": "Security groups are stateful: return traffic is automatically allowed regardless of inbound/outbound rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cabf0392243a", "source_question_ids": ["awssysops-p2-q474", "awssysops-p2-q511"], "statement": "Security groups can be added to or removed from an EC2 instance at any time.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b7c86a0d17e9", "source_question_ids": ["awssysops-p2-q474"], "statement": "Security groups evaluate all of their rules before deciding whether to allow traffic.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-9ee269b12154", "source_question_ids": ["awssysops-p2-q474", "awssysops-p2-q507"], "statement": "Network ACLs, unlike security groups, support explicit deny rules in addition to allow rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8998c98afb18", "source_question_ids": ["awssysops-p2-q477"], "statement": "Inline threat protection technologies include third-party firewall devices on EC2, unified threat management gateways, intrusion prevention systems, data loss management gateways, anomaly detection gateways, and advanced persistent threat detection gateways.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-86d50a87e352", "source_question_ids": ["awssysops-p2-q477"], "statement": "Security groups and network ACLs, even combined, are not inline threat protection technologies, since they are basic allow/deny packet filters rather than appliances that intercept and actively analyze traffic in-line.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance has more than one security group attached"], "confidence": "high", "id": "cl-5e7ab5cb1bf3", "source_question_ids": ["awssysops-p2-q488"], "statement": "When multiple security groups are attached to the same EC2 instance, their rules are aggregated using most-permissive-rule-wins logic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b8607f7c097", "source_question_ids": ["awssysops-p2-q488"], "statement": "A broader security group rule (e.g., opening a port to 0.0.0.0/0) is not restricted by a narrower rule for the same port defined in another security group attached to the same instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-874c300f129c", "source_question_ids": ["awssysops-p2-q488"], "statement": "An EC2 instance can have more than one security group attached to it at the same time.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-803fa908d844", "source_question_ids": ["awssysops-p2-q495"], "statement": "The AWS CLI command to add inbound (ingress) rules to a security group is authorize-security-group-ingress.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e564f8f4ad44", "source_question_ids": ["awssysops-p2-q495"], "statement": "The AWS CLI command to add outbound (egress) rules to a security group is authorize-security-group-egress.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d43259c5c060", "source_question_ids": ["awssysops-p2-q511"], "statement": "An EC2 instance's security groups, including those associated with the primary network interface (eth0), can be changed at any time after launch without stopping the instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-89585d7a692d", "source_question_ids": ["awssysops-p2-q514"], "statement": "AWS's VPN customer gateway configuration uses AES 128-bit or AES 256-bit encryption to ensure privacy among IKE and IPsec Security Associations.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-466b3ec22e09", "source_question_ids": ["awssysops-p2-q514"], "statement": "SHA is a hash function, not an encryption cipher, so SHA-based answer choices do not satisfy a requirement for an encryption function used in IKE/IPsec Security Associations.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-32ba0918bd76", "source_question_ids": ["awssysops-p2-q523"], "statement": "A single VPC can span multiple Availability Zones within the same AWS Region, with one subnet created per Availability Zone.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["instances are in private subnets of the same VPC", "no internet access or encryption is required"], "confidence": "high", "id": "cl-207f75a21cbb", "source_question_ids": ["awssysops-p2-q523"], "statement": "Instances in different Availability Zones within the same VPC can communicate over private IP addresses through the VPC's default route table, with no NAT gateway, VPN, cross-VPC routing, or extra appliances required.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab472533105d", "source_question_ids": ["awssysops-p2-q523"], "statement": "Using two separate VPCs with VPN appliances and tunnels between them for cross-AZ private traffic in the same region is unnecessarily costly and complex compared to a single multi-AZ VPC with one private subnet per AZ.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["no shared resources are needed between customer workloads"], "confidence": "high", "id": "cl-bae243ea82e0", "source_question_ids": ["awssysops-p2-q540"], "statement": "Creating a dedicated VPC per customer and using security groups to scope traffic within it achieves workload isolation with no shared resources, which best practice recommends when customers' workloads must be separated for billing and security reasons with no shared resources needed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-89afa98ec56e", "source_question_ids": ["awssysops-p2-q540"], "statement": "AWS Organizations' consolidated billing feature addresses centralizing billing across customer accounts but does not by itself provide network-level workload isolation.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bd067efbeffc", "source_question_ids": ["awssysops-p2-q547"], "statement": "A CloudFormation wait-condition \"received 0 signals\" error can be caused by the cfn-signal command never successfully running on the instance, which can be confirmed by checking that instance's cfn logs.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the source question's boxed answer instead names the IAM PassRole permission as a cause, conflicting with a unanimous community vote for the internet-access cause"], "confidence": "medium", "id": "cl-d7cd2957fbb8", "source_question_ids": ["awssysops-p2-q547"], "statement": "A CloudFormation wait-condition \"received 0 signals\" error can be caused by the EC2 instance lacking outbound internet access (e.g. via a NAT device) needed to reach the CloudFormation signaling endpoint.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-380c63dbc203", "source_question_ids": ["awssysops-p2-q547"], "statement": "The IAM PassRole permission is unrelated to troubleshooting a CloudFormation wait-condition signal timeout, despite being named in the source question's boxed answer for this scenario.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-617ac6560911", "source_question_ids": ["awssysops-p2-q577"], "statement": "An EC2 instance's subnet requires both an Internet Gateway attached to the VPC and a route table entry sending internet-bound traffic (0.0.0.0/0) to that gateway before the instance can reach the public internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6bcfffc8b541", "source_question_ids": ["awssysops-p2-q577"], "statement": "A virtual private gateway provides VPN/Direct Connect connectivity, not general internet access, so attaching one to a VPC does not give an EC2 instance's subnet internet access.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-57efff381817", "source_question_ids": ["awssysops-p2-q577"], "statement": "A VPC peering connection only connects two VPCs to each other; it does not by itself grant internet access to the peered VPC, even if the other VPC has its own Internet Gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ccfb5ae67451", "source_question_ids": ["awssysops-p2-q577"], "statement": "Assigning a public IP address to a database instance does not affect the outbound internet connectivity of a separate web/application tier that cannot reach external services.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-062d0b8b1594", "source_question_ids": ["awssysops-p2-q587"], "statement": "A route table entry showing status \"Blackhole\" means the route's target (for example, a NAT gateway that was deleted or a NAT instance that was terminated) is no longer available, even though the route entry itself still exists.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-b42dcd5bc667", "source_question_ids": ["awssysops-p2-q587"], "statement": "If a route table already contains a 0.0.0.0/0 route pointing at a NAT gateway (even one showing Blackhole status), the connectivity problem is not \"no route to the internet gateway\" or \"no route rule with a destination for the internet,\" since a matching route rule clearly exists.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-57d1c79f8d4a", "source_question_ids": ["awssysops-p2-q587"], "statement": "Route propagation status is irrelevant to troubleshooting a locally-created static route (one not learned via a gateway's route propagation).", "status": "supported"}, {"claim_type": "default", "conditions": ["the source question's boxed answer instead attributes the failure to the template needing an update, conflicting with a unanimous community vote for the VPC limit"], "confidence": "medium", "id": "cl-66948dfc1be7", "source_question_ids": ["awssysops-p2-q593"], "statement": "The default limit on the number of VPCs per AWS account per Region is 5; repeatedly deploying a CloudFormation template that provisions a new VPC each time within the same account and Region can eventually exhaust this default limit and cause stack creation to fail.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-078a61473505", "source_question_ids": ["awssysops-p2-q593"], "statement": "\"The CloudFormation template needs to be updated to the latest version\" is not a real, diagnosable CloudFormation stack-creation failure mode.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["VPC uses an IPv6 CIDR block", "outbound internet access required, inbound-initiated access from the internet prohibited"], "confidence": "high", "id": "cl-f89cfe15038e", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "For an IPv6 VPC that must allow outbound internet access from its instances while prohibiting any inbound connections initiated from the internet, the ::/0 destination should be routed to an egress-only internet gateway.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8b8c3ce09f77", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "An egress-only internet gateway is the IPv6 analog of a NAT gateway: it lets instances initiate outbound traffic to the internet but drops unsolicited inbound connection attempts.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-65e2f8c58ed0", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "Routing an IPv6 VPC's ::/0 traffic to a standard internet gateway would still permit unsolicited inbound traffic, because IPv6 addresses are globally routable and public by default, which would violate a requirement that internet-initiated access be prohibited.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-dc6cc0630973", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "A NAT gateway only handles IPv4 traffic, so it cannot be used to provide outbound internet access for IPv6 traffic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c3c52a5063f4", "source_question_ids": ["awssysops-p3-1-q604"], "statement": "Routing the IPv4 default range (0.0.0.0/0) to an egress-only internet gateway pairs the wrong protocol's traffic with a device meant for IPv6 traffic, so it does not solve an IPv6 outbound-only internet access requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-39a5534c788d", "source_question_ids": ["awssysops-p3-1-q618"], "statement": "VPC Flow Logs publish their data to Amazon CloudWatch Logs or to Amazon S3, not to AWS CloudTrail; there is no configuration step for sending VPC Flow Logs to CloudTrail.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-995c3bf3a4bf", "source_question_ids": ["awssysops-p3-1-q618"], "statement": "After a VPC Flow Log is created, it can take several minutes before its CloudWatch Logs log group actually appears and begins receiving data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ef660fcf56c3", "source_question_ids": ["awssysops-p3-1-q618"], "statement": "If no relevant network traffic has traversed the monitored network interfaces since a VPC Flow Log was created, there is nothing yet to publish, so the expected log group may not yet contain data.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b273f84a4a7c", "source_question_ids": ["awssysops-p3-1-q618"], "statement": "An account-level service control policy disabling VPC Flow Logs, or Amazon GuardDuty being enabled, are not themselves reasons that an already-active flow log's CloudWatch log group would fail to appear.", "status": "supported"}, {"claim_type": "rule", "conditions": ["network ACL (stateless)"], "confidence": "high", "id": "cl-ef70b680e0db", "source_question_ids": ["awssysops-p3-1-q619"], "statement": "Network ACLs are stateless, so an explicit outbound rule is required to allow response traffic for an allowed inbound request; the response is not automatically permitted the way it is with security groups.", "status": "supported"}, {"claim_type": "fact", "conditions": ["security group (stateful)"], "confidence": "high", "id": "cl-f11a5bf7cb51", "source_question_ids": ["awssysops-p3-1-q619", "awssysops-p3-1-q783", "awssysops-p3-1-q655"], "statement": "Security groups are stateful, so an allowed inbound request automatically permits the matching outbound response without a separate outbound rule.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-eb2071b89037", "source_question_ids": ["awssysops-p3-1-q619"], "statement": "When a client initiates an HTTP/HTTPS request to a server, the server's response is addressed to the client's ephemeral source port, which commonly falls in the 1024-65535 range.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["network ACL (stateless)"], "confidence": "high", "id": "cl-2601d0f8c1d5", "source_question_ids": ["awssysops-p3-1-q619"], "statement": "Allowing outbound traffic only on port 80 (the server's listening port) on a stateless network ACL does not allow the server's response back to the client, because that response is addressed to the client's ephemeral port, not port 80.", "status": "supported"}, {"claim_type": "rule", "conditions": ["network ACL (stateless)"], "confidence": "high", "id": "cl-7322a6e67945", "source_question_ids": ["awssysops-p3-1-q783", "awssysops-p3-1-q619"], "statement": "Because network ACLs are stateless, they evaluate inbound and outbound traffic independently; an ACL that allows inbound traffic (e.g. ICMP) but lacks a matching outbound allow rule will reject the corresponding return traffic.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-72fe8c04ef87", "source_question_ids": ["awssysops-p3-1-q626"], "statement": "A VPC peering connection alone does not populate route table entries; each peered VPC's route tables must be explicitly updated with a route to the other VPC's CIDR block via the peering connection before traffic can flow between them.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-cfe27a03e24d", "source_question_ids": ["awssysops-p3-1-q626"], "statement": "\"VPC sizing\" (e.g. CIDR block size) is not a documented constraint that blocks communication after a VPC peering connection has already been successfully established.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-dc003c5fe3d6", "source_question_ids": ["awssysops-p3-1-q626"], "statement": "There is no \"peering flag\" setting on a VPC that can be disabled to break an already-established VPC peering connection.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-126480d2a722", "source_question_ids": ["awssysops-p3-1-q626"], "statement": "A missing public subnet in one of the peered VPCs is not a cause of broken connectivity between resources communicating over an established private VPC peering connection.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8c9937be4881", "source_question_ids": ["awssysops-p3-1-q628", "awssysops-p3-1-q806", "awssysops-p3-1-q852", "awssysops-p3-1-q822", "awssysops-p3-1-q860", "awssysops-p3-1-q909"], "statement": "A VPC gateway endpoint for Amazon S3 allows traffic from resources inside the VPC to reach S3 over AWS's internal network, without that traffic traversing the public internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-90381185a3ff", "source_question_ids": ["awssysops-p3-1-q628"], "statement": "Routing S3-bound traffic through a managed NAT gateway still sends that traffic to S3's internet-facing public endpoint, so it does not satisfy a requirement that traffic to S3 must not traverse the internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-73d16aeb8f5a", "source_question_ids": ["awssysops-p3-1-q628"], "statement": "Routing S3-bound traffic through an internet gateway sends that traffic over the public internet, so it does not satisfy a requirement that traffic to S3 must not traverse the internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-08de423b6d0c", "source_question_ids": ["awssysops-p3-1-q628", "awssysops-p3-1-q806"], "statement": "AWS Direct Connect with a public virtual interface is designed to connect on-premises networks to AWS; it is not a mechanism for securing traffic that already originates inside a VPC when accessing a service like S3.", "status": "supported"}, {"claim_type": "rule", "conditions": ["NAT gateway in public subnet", "private subnet default route targets the NAT gateway"], "confidence": "high", "id": "cl-472b0f092a56", "source_question_ids": ["awssysops-p3-1-q645", "awssysops-p3-1-q662"], "statement": "A NAT gateway deployed in a public subnet, combined with a private subnet's route table pointing its default route (0.0.0.0/0) at that NAT gateway, lets instances in the private subnet initiate outbound internet connections (e.g. for patching) while remaining unreachable from the internet.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9376cd025140", "source_question_ids": ["awssysops-p3-1-q645", "awssysops-p3-1-q751", "awssysops-p3-1-q824", "awssysops-p3-1-q860"], "statement": "A NAT gateway only allows outbound-initiated traffic to pass through; it does not allow unsolicited inbound connections from the internet to reach the instances behind it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f8ac3d75b414", "source_question_ids": ["awssysops-p3-1-q645"], "statement": "Adding an internet gateway and assigning instances public IPs would make them directly reachable from the internet, which conflicts with a requirement that instances must not be publicly accessible.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ad6cab5ffacc", "source_question_ids": ["awssysops-p3-1-q645"], "statement": "An interface endpoint provides private connectivity only to specific supported AWS services, not general internet access for tasks like OS patching.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3683906e26b4", "source_question_ids": ["awssysops-p3-1-q645"], "statement": "There is no generic \"virtual gateway\" construct for providing general internet access to a VPC; a \"virtual private gateway\" is instead a VPN-related construct.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-34990c3927d9", "source_question_ids": ["awssysops-p3-1-q647", "awssysops-p3-1-q655", "awssysops-p3-1-q783", "awssysops-p3-1-q797", "awssysops-p3-1-q871"], "statement": "VPC Flow Logs record accepted and rejected traffic at the network-interface level and can reveal a security group or network ACL rule blocking a connection, or traffic being misrouted, after a network change.", "status": "supported"}, {"claim_type": "exception", "conditions": ["connection never reaches the database engine"], "confidence": "high", "id": "cl-3187f2097d1a", "source_question_ids": ["awssysops-p3-1-q647"], "statement": "If a network-level change blocks connectivity before a connection is ever established, the destination database engine's own error logs have nothing recorded about an attempt it never received.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a5ef66a6dcd6", "source_question_ids": ["awssysops-p3-1-q647"], "statement": "Elastic Load Balancing access logs and Amazon CloudFront logs are unrelated to diagnosing a direct application-server-to-RDS network connectivity failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9becb523b2b4", "source_question_ids": ["awssysops-p3-1-q655", "awssysops-p3-1-q783"], "statement": "A VPC Flow Log entry captured on the destination resource's own network interface showing REJECT means the traffic reached that interface and was blocked there by a security group or network ACL rule evaluated at that interface, not that it failed to leave the source instance.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-033ea31283b2", "source_question_ids": ["awssysops-p3-1-q655"], "statement": "When a flow log on the destination's network interface shows a REJECT for traffic from a specific source, the fix is to adjust the security group or network ACL rules on the destination side (e.g. permit the source's traffic and the required port) rather than the source instance's own outbound rules.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-aa9b0f2d154f", "source_question_ids": ["awssysops-p3-1-q655"], "statement": "Installing an application-specific client (e.g. an email client) on the source instance does not address a security-group-level REJECT recorded on the destination's network interface.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1e82cb50e3cf", "source_question_ids": ["awssysops-p3-1-q655"], "statement": "Disabling an OS-level firewall (e.g. iptables) on the destination instance does not address a REJECT caused by an AWS security group or network ACL rule, since those are enforced independently of the instance's own OS firewall.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl ment": "A bastion host used to administer instances in a private subnet must itself be placed in a public subnet, reachable by SSH, with a configured route or path into the private subnet; placing it inside the private subnet it serves defeats its purpose.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e391d44d07eb", "source_question_ids": ["awssysops-p3-1-q672"], "statement": "A load balancer distributes application traffic and plays no role in restoring outbound patch-update traffic or SSH administrative access for private-subnet instances.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ecdec990c07a", "source_question_ids": ["awssysops-p3-1-q751"], "statement": "The only way to guarantee that a VPC's instances have no outbound internet access at all is to remove every route in the subnet's route table that leads to the internet, whether via an internet gateway or any NAT device.", "status": "supported"}, {"claim_type": "exception", "conditions": ["private subnet still routes to a NAT gateway or NAT instance"], "confidence": "high", "id": "cl-e53d80ecfd55", "source_question_ids": ["awssysops-p3-1-q751"], "statement": "Removing Elastic IP addresses and placing instances in a private subnet is not sufficient by itself to block all outbound internet access, because a private subnet that still has a route to a NAT gateway or NAT instance allows outbound internet connectivity even without any public or Elastic IP on the instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-089e9fbd5fe6", "source_question_ids": ["awssysops-p3-1-q751"], "statement": "Adding a route to an internet gateway does the opposite of blocking a VPC's outbound internet traffic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-39007cbc91e2", "source_question_ids": ["awssysop
