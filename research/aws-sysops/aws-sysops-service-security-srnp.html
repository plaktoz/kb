<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

, "confidence": "medium", "id": "cl-57b4c8b0e960", "source_question_ids": ["awssysops-p2-q339"], "statement": "The AWS Security whitepaper is general informational/marketing content describing AWS's security posture at a high level and is not a formal audit artifact.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4eec2d0a8f28", "source_question_ids": ["awssysops-p2-q339"], "statement": "An AWS Direct Connect facility's address is unrelated to proving the physical security controls of the facility that hosts an application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b903b2d16098", "source_question_ids": ["awssysops-p2-q464"], "statement": "Transparent Data Encryption (TDE) encrypts data at rest so that, if stolen, the data is unusable without the encryption key, reducing the risk of confidential data theft.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-08bbaed78ec6", "source_question_ids": ["awssysops-p2-q464"], "statement": "Transparent Data Encryption (TDE) does not decrease latency, store SSL certificates, or provide backup functionality.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fb0a62a25fbf", "source_question_ids": ["awssysops-p2-q467"], "statement": "Amazon S3 supports exactly three server-side encryption modes: SSE-S3 (S3-managed keys), SSE-C (customer-provided keys), and SSE-KMS (KMS-managed keys).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d2a7579f594e", "source_question_ids": ["awssysops-p2-q467"], "statement": "'SSE-K' is not a real Amazon S3 server-side encryption mode.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-30f2cf8101ff", "source_question_ids": ["awssysops-p2-q468"], "statement": "AWS CloudHSM appliances are designed to securely store cryptographic key material and perform cryptographic operations with that material without exposing it outside the appliance's cryptographic boundary.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6dc2df8c20dd", "source_question_ids": ["awssysops-p2-q468"], "statement": "AWS CloudHSM does not allow AWS to audit a customer's infrastructure; that is not an accurate description of what an HSM does.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2632f870aa8b", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CodeCommit uses the repository ID as the AWS KMS encryption context for its encrypt/decrypt operations.", "status": "supported"}, {"claim_type": "rule", "conditions": ["determining which KMS key operations applied to a specific AWS CodeCommit repository"], "confidence": "high", "id": "cl-90d700484d79", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CloudTrail logs record KMS API calls tagged with their encryption context, so searching CloudTrail for an AWS CodeCommit repository ID surfaces which key operations (encrypt/decrypt) were performed for that repository.", "status": "supported"}, {"claim_type": "default", "conditions": ["prior to the late-2019 asymmetric CMK launch"], "confidence": "medium", "id": "cl-3ad0ee96f3bf", "source_question_ids": ["awssysops-p2-q480"], "statement": "As originally launched, AWS KMS supported only symmetric key cryptography.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["as of the late-2019 asymmetric CMK launch onward"], "confidence": "medium", "id": "cl-0983b635e6c1", "source_question_ids": ["awssysops-p2-q480"], "statement": "AWS KMS added support for asymmetric customer master keys (CMKs) in late 2019, so AWS KMS currently supports both symmetric and asymmetric key cryptography.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d9b54f30a8cb", "source_question_ids": ["awssysops-p2-q481"], "statement": "AWS decommissions storage media using techniques detailed in NIST 800-88; older AWS documentation also cited DoD 5220.22-M.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e9bca5bd5bff", "source_question_ids": ["awssysops-p2-q481"], "statement": "Decommissioned magnetic storage media at AWS is degaussed and physically destroyed per industry-standard practices.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cda34a88836f", "source_question_ids": ["awssysops-p2-q481"], "statement": "AWS does not simply reformat and reuse old storage disks as its data-protection approach for decommissioned devices.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0830dafb6b89", "source_question_ids": ["awssysops-p2-q482"], "statement": "AWS Security Token Service (STS) APIs are used within IAM to grant users temporary access to AWS resources via time-limited credentials.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-99abeff57f96", "source_question_ids": ["awssysops-p2-q482"], "statement": "\"AWS Security Transport Service\", \"AWS Security Tree Service\", and \"AWS Security Task Service\" are not real AWS service names; they are plausible-but-wrong expansions of the STS acronym, distinct from the real \"AWS Security Token Service\".", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ce550255ed71", "source_question_ids": ["awssysops-p2-q492"], "statement": "Amazon Cognito supports web identity federation through Facebook, Google, and Amazon as external identity providers.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-990af17f4fbc", "source_question_ids": ["awssysops-p2-q497"], "statement": "In symmetric key cryptography terminology used by AWS KMS, unencrypted data is called plaintext and its encrypted form is called ciphertext.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-64312597641e", "source_question_ids": ["awssysops-p2-q522"], "statement": "AWS CloudHSM provides dedicated hardware security modules that support asymmetric key operations and can exchange keys with commercial on-premises HSMs via supported RSA key-wrap methods, making it the appropriate service for integrating an existing on-premises asymmetric key management system with AWS.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e56e8ca3799d", "source_question_ids": ["awssysops-p2-q522"], "statement": "Deploying a generic Amazon EC2 instance from an AWS Marketplace AMI does not inherently provide any key-management integration capability.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["mobile application users need secure access to their own content in a shared S3 bucket"], "confidence": "high", "id": "cl-ab5724cc3fe6", "source_question_ids": ["awssysops-p2-q527"], "statement": "Amazon Cognito authenticates mobile application end users, directly or via federated identity providers, and vends temporary credentials tied to an IAM role, which scopes exactly what each user can access in a shared S3 bucket, typically via per-user prefixes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0f19e99dea2a", "source_question_ids": ["awssysops-p2-q527"], "statement": "AWS Organizations manages multi-account governance and plays no role in authenticating individual mobile application end users for S3 access.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-36d5b6924a97", "source_question_ids": ["awssysops-p2-q536"], "statement": "A security group inbound rule scoped to a security group ID (rather than a CIDR) allows any instance that is itself a member of that referenced security group to connect, regardless of that instance's own source IP address.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-c0919852dba1", "source_question_ids": ["awssysops-p2-q536"], "statement": "Multiple inbound security group rules on the same port are additive: traffic is permitted if it matches any one of the rules, even if a different rule on the same port is more restrictive.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa1713222db9", "source_question_ids": ["awssysops-p2-q536"], "statement": "A security group rule opening a specific port (e.g., 389) to 0.0.0.0/0 does not grant access on a different port (e.g., 22); each rule only applies to its own specified port.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-31615cfa6e51", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the AWS shared responsibility model, the customer is responsible for patching the guest OS on Amazon EC2 instances.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-a30e923fbef7", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the AWS shared responsibility model, the customer is responsible for configuring resource-level protections such as S3 server-side encryption with S3-managed keys (SSE-S3).", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-2cc3b8bbc80b", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the AWS shared responsibility model, patching the underlying OS and database engine on Amazon RDS instances is typically framed as AWS  "distractor", "conditions": [], "confidence": "high", "id": "cl-6fe21fd482dc", "source_question_ids": ["awssysops-p2-q578"], "statement": "AWS Artifact is a compliance-report repository, not a vulnerability-scanning tool.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bc0833d25c84", "source_question_ids": ["awssysops-p2-q582"], "statement": "Security groups are stateful, so a missing egress rule on a resource's own security group rarely blocks a client-initiated connection, because return traffic for an already-allowed inbound request is automatically permitted.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-65dc2abdd3e0", "source_question_ids": ["awssysops-p2-q582"], "statement": "A missing ingress rule from the web server to the database's security group is a plausible cause of 'Error Establishing a Database Connection' failures.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa68a511c1b3", "source_question_ids": ["awssysops-p2-q582"], "statement": "If a database is reachable from a bastion host, that rules out the database still being in the process of creation as the cause of connectivity failures reported by the web application.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-462e79ba6c40", "source_question_ids": ["awssysops-p2-q582"], "statement": "An untrusted SSL/TLS certificate used by the web server, in the context of the 2020 RDS CA certificate rotation, is a contested alternative cause of 'Error Establishing a Database Connection' failures, with a highly-upvoted community argument favoring it over a missing security-group egress rule that a source's boxed answer includes instead.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b0265694b153", "source_question_ids": ["awssysops-p2-q588"], "statement": "AWS WAF rate-based rules automatically track request rates per client IP address and can block (blacklist) any source that exceeds a defined threshold.", "status": "supported"}, {"claim_type": "rule", "conditions": ["attack traffic is distributed over many, not-pre-known IP addresses"], "confidence": "medium", "id": "cl-3d77ad46d08b", "source_question_ids": ["awssysops-p2-q588"], "statement": "A security group or network ACL deny list is impractical for blocking a large-scale distributed attack because the offending source IP addresses are not known or fixed in advance.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-c9800c358d64", "source_question_ids": ["awssysops-p2-q588", "awssysops-p2-q600", "awssysops-p3-1-q600", "awssysops-p3-1-q681"], "statement": "AWS WAF must be placed in front of a supported entry point, such as an Application Load Balancer, Amazon CloudFront distribution, or API Gateway; it cannot filter traffic for the origin on its own.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-29ad750e2f77", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "AWS WAF can inspect and filter HTTP(S) requests, including malformed headers, before they reach the origin, when attached in front of an ALB, CloudFront distribution, or API Gateway.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9aef3e1b25c9", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "An Application Load Balancer automatically rejects malformed HTTP requests on its own, returning an HTTP 400 error, which can keep malformed-header attack traffic from reaching backend EC2 instances without provisioning AWS WAF.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-efc838bc7fe6", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "Security groups filter traffic by IP address and port, not by HTTP content, so they cannot block an attack based on malformed HTTP headers.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-29915e366cc2", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "Amazon Inspector is a vulnerability-assessment tool, not an inline traffic filter, so it cannot prevent malformed-header traffic from reaching EC2 instances.", "status": "supported"}, {"claim_type": "fact", "conditions": ["IAM policy denies API calls lacking MFA authentication"], "confidence": "high", "id": "cl-3a01fea028c7", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "An IAM policy that denies API calls not authenticated with MFA relies on the aws:MultiFactorAuthPresent condition key.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fab912fba1f5", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "API calls signed with a user's long-term IAM access keys carry no MFA information, so they never satisfy an aws:MultiFactorAuthPresent condition.", "status": "supported"}, {"claim_type": "rule", "conditions": ["temporary credentials obtained via sts:get-session-token with a valid MFA code"], "confidence": "high", "id": "cl-fdf721679d4d", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "Temporary credentials obtained via sts:get-session-token while supplying a valid MFA code carry the aws:MultiFactorAuthPresent condition key, satisfying MFA-required policies for CLI/API calls.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f5656d78603b", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "Logging into the AWS Management Console with MFA has no effect on whether separately-signed CLI API calls are considered MFA-authenticated.", "status": "supported"}, {"claim_type": "exception", "conditions": ["using temporary session credentials from sts:get-session-token"], "confidence": "high", "id": "cl-548f1439988e", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "MFA is supported for AWS CLI use via temporary session credentials obtained with sts:get-session-token.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1dfae58cc0a6", "source_question_ids": ["awssysops-p3-1-q630"], "statement": "ACM returns a 'Domain Not Allowed' error when a requested name is an Amazon-owned domain such as *.elb.amazonaws.com or is flagged as unsafe (e.g., by VirusTotal), so you cannot get an ACM certificate for an ALB's own DNS name.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-8e9522e8578d", "source_question_ids": ["awssysops-p3-1-q630"], "statement": "The fix for an ACM \"Domain Not Allowed\" error is to submit a new certificate request for the actual domain name owned by the requester, then point that domain at the load balancer with a Route 53 alias record.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-9b4703d0dab9", "source_question_ids": ["awssysops-p3-1-q630"], "statement": "A failed ACM certificate request cannot be resubmitted or revalidated by resending the validation email; a new request must be submitted once the underlying problem is fixed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-69f0c85a7a0d", "source_question_ids": ["awssysops-p3-1-q653"], "statement": "Sharing a bastion host's original launch-time SSH private key directly with an administrator grants root/owner-level access that cannot be selectively revoked without re-keying the instance for everyone.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-8f03edc2d20d", "source_q nt": "AWS's own background vulnerability patching of underlying infrastructure is a separate, AWS-managed process and is not a substitute for a customer's own mandated third-party vulnerability testing of their workload.", "status": "supported"}, {"claim_type": "exception", "conditions": ["the CMK uses imported key material"], "confidence": "high", "id": "cl-cd70daf8c52d", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "AWS KMS does not support automatic key rotation for a customer master key (CMK) that has imported key material.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["KMS key is a symmetric encryption key with KMS-generated (AWS_KMS origin) key material"], "confidence": "medium", "id": "cl-761da075915e", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "Automatic rotation of a customer managed KMS key defaults to every 365 days but can be set to a custom period of 90 to 2560 days, such as about 6 months.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["CMK uses imported key material and is referenced by alias"], "confidence": "medium", "id": "cl-83eae14bd7da", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "A KMS key with imported key material can be rotated by creating a new KMS key with new imported material and repointing the alias the application uses, or, on current KMS, by importing new key material into the existing key and performing on-demand rotation.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c00d71a2b13c", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "Deleting a KMS key's current imported key material is not a valid rotation step: it makes the key unusable and leaves existing ciphertext undecryptable until that same material is reimported.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-2611fab25799", "source_question_ids": ["awssysop aining the physical network infrastructure underlying EC2, as part of 'security of the cloud'.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e110cee3d64d", "source_question_ids": ["awssysops-p3-1-q683"], "statement": "Under the AWS shared responsibility model, the customer is responsible for patching the guest operating system, monitoring memory utilization, and configuring network ACLs for their own EC2 resources, as part of 'security in the cloud'.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d35d4dfe387e", "source_question_ids": ["awssysops-p3-1-q691"], "statement": "AWS Artifact provides on-demand access to AWS compliance reports, including the PCI DSS Attestation of Compliance (AOC) and Responsibility Summary, which specify which PCI DSS requirements are AWS's responsibility versus the customer's.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-534dc24921b4", "source_question_ids": ["awssysops-p3-1-q691"], "statement": "AWS Macie discovers and classifies sensitive data in Amazon S3 and does not surface compliance-responsibility documentation.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-394adac6bdc2", "source_question_ids": ["awssysops-p3-1-q691"], "statement": "AWS OpsWorks is a configuration-management service and AWS Organizations manages multi-account structure; neither surfaces compliance-responsibility documentation like PCI DSS requirement ownership.", "status": "supported"}, {"claim_type": "rule", "conditions": ["setting up AWS SSO for the first time with Directory Service and Organizations already configured"], "confidence": "high", "id": "cl-80afb31e44c4", "source_question_ids": ["awssysops-p3-1-q741"], "statement": "After a directory is configured in AWS Directory Service and full access is enabled in AWS Organizations, the next AWS SSO setup step is to create permission sets in AWS SSO and associate them with Directory Service users or groups.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-839221a8542a", "source_question_ids": ["awssysops-p3-1-q741"], "statement": "Manually creating IAM roles in every member account, or IAM users in the master account, duplicates the identity/access management work that AWS SSO permission sets already handle centrally.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f4da2ca22cda", "source_question_ids": ["awssysops-p3-1-q741"], "statement": "Service control policies (SCPs) in AWS Organizations restrict what actions are possible account-wide as a guardrail, and are not an access-granting mechanism tied to individual users the way AWS SSO permission sets are.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5f9c687e1198", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "Amazon Inspector consolidates vulnerability findings for all scanned EC2 instances in one central view, covering more instances with less effort than checking each instance manually.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c65b709a4867", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "Manually SSHing into each EC2 instance to check its software version does not scale and is the highest-operational-overhead way to check many instances for a vulnerable software version.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-eb8498ac3c16", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "AWS CloudTrail records API activity, not installed software versions, so it cannot by itself detect a vulnerable software version on EC2 instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-64d25f9ce242", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "Writing and maintaining a custom script deployed via AWS CodeDeploy to check EC2 instances for a vulnerable software version requires more operational overhead than using Amazon Inspector's built-in scanning.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-de7307902cc7", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "Automatic key rotation in AWS KMS is a supported, optional feature of a customer managed CMK.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3084659501fa", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "AWS managed KMS keys rotate automatically every year (about 365 days; every 3 years before May 2022), and that schedule cannot be enabled, disabled, or changed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d176438fb33e", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "AWS KMS retains all prior key material indefinitely after automatic rotation, so ciphertext encrypted under an earlier key rotation remains decryptable.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7a1ee7d7622e", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "Neither alternative replaces enabling automatic rotation: an encrypted EBS volume's KMS key cannot be changed in place (it needs a snapshot copy with the new key and a new volume), and new key material cannot be imported into a KMS key whose material AWS KMS generated.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-858c2050fed4", "source_question_ids": ["awssysops-p3-1-q755"], "statement": "SSH succeeding while ping fails to the same EC2 instance is the typical sig g web requests.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a01ed057824d", "source_question_ids": ["awssysops-p3-1-q767", "awssysops-p3-1-q773", "awssysops-p3-1-q890"], "statement": "AWS Shield Standard protects against network- and transport-layer DDoS attacks and has no content-inspection capability to detect application-layer attacks such as cross-site scripting, SQL injection, or bot scraping.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9bc43470167a", "source_question_ids": ["awssysops-p3-1-q767"], "statement": "Elastic Load Balancing distributes traffic but has no content-inspection capability for detecting application-layer attacks.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7415acfffc54", "source_question_ids": ["awssysops-p3-1-q767"], "statement": "Amazon Cognito handles user authentication and identity, and is unrelated to filtering malicious request content.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d3f8afdb00fc", "source_question_ids": ["awssysops-p3-1-q768"], "statement": "A site-to-site VPN tunnel encrypts data in transit between an on-premises data center and AWS resources across the hybrid network link.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-79329355256d", "source_question_ids": ["awssysops-p3-1-q768"], "statement": "AWS KMS can manage the encryption keys that protect data at rest in AWS storage.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-20877beba345", "source_question_ids": ["awssysops-p3-1-q768"], "statement": "AWS Certificate Manager can be used to create TLS/SSL certificates that protect traffic terminating at an AWS-integrated endpoint such as an ELB or CloudFront.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d598af51b15a", "source_question_ids": ["awssysops-p3-1-q768"], "statement": "AWS KMS cannot be used to create TLS/SSL certificates; that is not a real KMS capability.", "status": "supported"}, {"claim_type": "rule", "conditions": ["hybrid deployment with data passing between on-premises data center and AWS"], "confidence": "low", "id": "cl-27d4eefc8dd5", "source_question_ids": ["awssysops-p3-1-q768"], "statement": "Whether a VPN tunnel alone (versus ACM-issued TLS certificates on an AWS-integrated endpoint) sufficiently secures the in-transit leg of a hybrid on-premises-to-AWS deployment is debated, since a VPN only secures traffic across the tunnel itself rather than end-to-end.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1a944f610e10", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "AWS WAF rate-based rules automatically track request rates per originating IP address and can block or rate-limit any IP that exceeds a defined threshold.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8e88d32a397e", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "Amazon GuardDuty does not provide application-layer protection against bots or scrapers; it is a threat-detection service for AWS account and network activity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8421effc096f", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "Amazon CloudFront caching can reduce origin load for cacheable content but does not itself detect or block malicious requesters.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-038dee2bc2ca", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "A Lambda pipeline cannot block bot IP addresses through security groups, because secu ironment.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-745831f851d7", "source_question_ids": ["awssysops-p3-1-q771"], "statement": "Amazon Connect is a contact-center service unrelated to cryptographic key management.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1adc3ceae39a", "source_question_ids": ["awssysops-p3-1-q773"], "statement": "AWS WAF web ACL rules (rate-based or pattern-matching) can detect a single IP address repeatedly requesting non-existent pages and block that IP, stopping scraping-bot activity.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8f3954ef1a12", "source_question_ids": ["awssysops-p3-1-q773"], "statement": "AWS CloudTrail only logs AWS API and management-plane activity, not end-user web traffic, so it has no capability to block malicious web requests.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3eb586515bcc", "source_question_ids": ["awssysops-p3-1-q773", "awssysops-p3-1-q890", "awssysops-p3-1-q922"], "statement": "Amazon Inspector assesses EC2 instance and container image vulnerabilities and network configuration/reachability; it does not inspect, block, or analyze live web traffic or database content.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b9c4686c8580", "source_question_ids": ["awssysops-p3-1-q789"], "statement": "AWS CloudHSM supports generating, storing, importing, and exporting both symmetric and asymmetric key pairs.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2a3a63ed3b83", "source_question_ids": ["awssysops-p3-1-q789"], "statement": "AWS KMS supports importing external key material for symmetric encryption, HMAC, and asymmetric KMS keys, not only symmetric keys.", "status": "conflicted"}, {"claim_type achable from that security group.", "status": "supported"}, {"claim_type": "rule", "conditions": ["the client tier initiates the connection to the server tier and the required outbound rule is missing"], "confidence": "medium", "id": "cl-f3a12b523424", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Because the web tier is the one initiating the connection to the database, the fix for a blocked web-to-database connection is to add an outbound rule on the web security group allowing the database security group on the database port, not an inbound rule on the web security group.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-83a6323f662c", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Adding an inbound rule to a security group only permits connections initiated from the referenced source toward that security group; it has no effect on an outbound connection attempt that is being blocked by missing outbound rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a2fd233188e6", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Opening all outbound traffic (0.0.0.0/0, all ports) to fix a specific connectivity issue is broader than necessary and compromises security compared to a scoped outbound rule to the specific destination and port needed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-641258c1ae2d", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Changing an existing outbound security group rule to point at a different security group or port removes the connectivity the original rule provided, rather than adding new connectivity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-03999c5dde72", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRoleWithSAML is the STS API call that exchanges a SAML 2.0 assertion for temporary AWS credentials, enabling federated programmatic access such as AWS CLI usage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-711dbcf67d37", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRole requires the caller to already hold valid AWS credentials for another IAM principal; it cannot accept a SAML assertion directly.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3d92f251a4fe", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRoleWithWebIdentity is for OIDC/web-identity providers such as Google, Facebook, or Amazon Cognito, not for SAML assertions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9aea187cf794", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:GetFederationToken is a legacy, less-capable federation mechanism unrelated to SAML assertions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3c220afd2a93", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "SSH operates over TCP port 22, so a missing inbound security group rule for port 22 is a common and direct cause of a failed SSH connection to a Linux instance.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-88d73eb16e2d", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 443 (HTTPS) has no bearing on SSH connectivity.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ee10805b491b", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 80 (HTTP) is unrelated to SSH connectivity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-93f4305c1f0a", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 3389 is the Windows remote-desktop (RDP) port and is not applicable to a Linux instance being accessed via SSH.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6c70cd94ea83", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "Amazon Macie uses machine learning and pattern matching to discover sensitive data, but it only scans data stored in Amazon S3.", "status": "supported"}, {"claim_type": "rule", "conditions": ["sensitive data resides in a database rather than directly in S3"], "confidence": "high", "id": "cl-913c8a363bf2", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "To use Amazon Macie to detect sensitive data stored in a database such as Aurora MySQL, the data must first be exported to Amazon S3 (for example via an AWS Lambda function) before Macie can examine it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-bd882e81eea8", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "There is no 'GuardDuty plugin for Aurora'; Amazon GuardDuty is a threat-detection service (its RDS Protection analyzes only Aurora login activity) and does not scan database content for sensitive data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-580457efa7f5", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "VPC Flow Logs combined with Amazon Detective analyze network traffic patterns and security findings, not the actual content of data being stored.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6910d2c28cce", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A VPC interface endpoint (AWS PrivateLink) lets a VPC connect privately to a supported AWS service such as AWS KMS entirely within the AWS network, without needing an internet gateway, NAT device, or VPN.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-af29fd9b5ca1", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "Routing calls to a service such as AWS KMS through a NAT gateway means those calls traverse the internet via that service's public endpoint, which is the opposite of a requirement that connections must not traverse the internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2da5b2eda828", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A bastion host is for interactive SSH/RDP access to instances and is unrelated to private service-to-service API connectivity such as reaching AWS KMS.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-9b4ddf626c6c", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "An S3 gateway VPC endpoint only routes traffic to Amazon S3; it does not provide private connectivity to other AWS services such as AWS KMS.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-security-identity-compliance--m-1", "title": "Pick the security control by what it can see: packet header, HTTP content, or neither", "purpose": "Most security-control questions in this slice reduce to one move: work out what the control can actually inspect and where it sits in the traffic path, then throw out every option that cannot see the thing the attack or failure depends on.", "mechanism": "AWS traffic controls work at different layers. Security groups are stateful allow-lists attached to instances or ENIs. They match only protocol, port, and source (a CIDR or another security group). Each rule covers its own port/protocol, rules add together, and return traffic for an allowed connection is let back in automatically, so only the side that initiates needs a matching rule (inbound on the target, or outbound if the default allow-all egress was removed). Network ACLs work on the same header fields but are stateless and can deny, so they can block traffic even when the security group is correct. Neither can read HTTP content, and neither can keep up with attacker IPs that are spread out and not known in advance. AWS WAF runs at layer 7 on a supported entry point (ALB, CloudFront, API Gateway; not a Classic Load Balancer). It reads each HTTP request and matches headers, strings, SQL-injection and XSS patterns, geography, or per-IP request rates, then blocks the request before it reaches the origin. Shield Standard absorbs network- and transport-layer DDoS and does no content inspection. Inspector and GuardDuty are out-of-band: Inspector scans for vulnerabilities and network exposure, GuardDuty detects threats from account, network, and DNS activity. Neither sits inline, so neither can block a request.", "predict_prompt": "An instance accepts SSH but ping times out, and separately the app behind its ALB is hit with SQL-injection payloads from changing IPs. For each problem, which control fixes it and why can't the other control fix it?", "invariants": ["Security groups only allow, are stateful, and judge traffic by protocol/port/source alone.", "Each security group rule applies only to its own port/protocol; rules on the same port add together, so one permissive rule is enough.", "Only the side that initiates the connection needs a rule; return traffic is automatic.", "Network ACLs are stateless and can deny, so they are checked separately in each direction.", "Only a control that reads the HTTP request (AWS WAF) can block SQLi, XSS, malformed headers, header-value matches, or per-IP request floods.", "WAF filters only when attached to a supported entry point in front of the origin."], "limits": ["An ALB rejects some malformed HTTP requests on its own with a 400, so 'WAF is the only answer' to header attacks is contested.", "Security group statefulness means a missing egress rule rarely causes a client-initiated failure, but it does matter once the default allow-all outbound rule has been removed.", "A few source boxed answers (Inspector for RDS, VPC peering for ping failures) contradict this model and the community vote; trust the mechanism."], "cues": ["'malformed headers', 'SQL injection', 'cross-site scripting', 'header contains division name' -> layer-7 inspection -> AWS WAF", "'many IPs not known in advance', 'bots', 'scrapers', 'requests per IP' -> WAF rate-based rule, not a security group or NACL deny list", "'SSH works but ping fails', 'connection refused on port X' -> the security group rule for that protocol/port is missing", "'outbound rules were customized' -> check the initiator's egress rule", "'DDoS' with no content signature -> Shield; 'find vulnerabilities/CVEs' -> Inspector; 'detect suspicious activity' -> GuardDuty"], "claim_ids": ["cl-36d5b6924a97", "cl-c0919852dba1", "cl-aa1713222db9", "cl-bc0833d25c84", "cl-fa5771e20413", "cl-098b70bc6fe7", "cl-4306bc517f10", "cl-014b7bf6e53e", "cl-dc22455f4e22", "cl-f3a12b523424", "cl-83a6323f662c", "cl-858c2050fed4", "cl-00a5f7098142", "cl-3c220afd2a93", "cl-65dc2abdd3e0", "cl-3d77ad46d08b", "cl-efc838bc7fe6", "cl-038dee2bc2ca", "cl-b0265694b153", "cl-1a944f610e10", "cl-c9800c358d64", "cl-29ad750e2f77", "cl-9aef3e1b25c9", "cl-afab811a4355", "cl-6aab1e646bef", "cl-696cbf9141da", "cl-b9c6288caf32", "cl-2611fab25799", "cl-b95c0283618e", "cl-a01ed057824d", "cl-d74d28ef5c34", "cl-29915e366cc2", "cl-3eb586515bcc", "cl-03b40014f553", "cl-b95cf30a89c8", "cl-8e88d32a397e", "cl-a62cca529149", "cl-afd1f8a10f67"]}, "contrastSet": {"id": "aws-sysops-service-security-identity-compliance--cs-1", "subjects": ["AWS WAF", "Security groups / network ACLs", "AWS Shield Standard", "Amazon Inspector / GuardDuty"], "dimensions": ["What it inspects", "Inline blocking?", "Where it attaches", "Typical correct use", "Cannot do"], "shared_traits": ["All are AWS-native security controls that show up as answer options for 'protect the application/instance' questions.", "None needs changes to application code."], "matrix": {"What it inspects": {"AWS WAF": "HTTP request content: headers, strings, SQLi/XSS patterns, geo, per-IP rate", "Security groups / network ACLs": "Protocol, port, source/destination IP or SG only", "AWS Shield Standard": "Network/transport-layer DDoS traffic volume", "Amazon Inspector / GuardDuty": "Software CVEs and exposure (Inspector); account/network/DNS activity (GuardDuty)"}, "Inline blocking?": {"AWS WAF": "Yes, blocks matching requests before the origin", "Security groups / network ACLs": "Yes, but by header fields only; SG allow-only, NACL can deny", "AWS Shield Standard": "Yes, for L3/L4 floods, automatically", "Amazon Inspector / GuardDuty": "No, they report findings and never block"}, "Where it attaches": {"AWS WAF": "ALB, CloudFront, API Gateway (not Classic LB)", "Security groups / network ACLs": "Instance ENI (SG); subnet (NACL)", "AWS Shield Standard": "Every account, on by default, free", "Amazon Inspector / GuardDuty": "Out-of-band scanning/analysis of the account"}, "Typical correct use": {"AWS WAF": "Block SQLi, XSS, malformed headers, scraping bots, IP floods", "Security groups / network ACLs": "Open/close a port or protocol (SSH 22, ICMP, DB port)", "AWS Shield Standard": "Baseline DDoS protection", "Amazon Inspector / GuardDuty": "Find vulnerable EC2 software; detect suspicious activity"}, "Cannot do": {"AWS WAF": "Filter traffic with no supported entry point in front of the origin", "Security groups / network ACLs": "See HTTP payloads; track many unknown, changing attacker IPs", "AWS Shield Standard": "Detect XSS, SQLi, or bot scraping", "Amazon Inspector / GuardDuty": "Stop malicious requests from reaching instances"}}, "decision_rule": "Ask whether the bad traffic can be identified from the packet header (protocol, port, a known fixed source) or only from the HTTP request content and behavior. Header-identifiable means security group / NACL. Content- or rate-identifiable means AWS WAF on a supported entry point. A tool that cannot block inline (Inspector, GuardDuty) is never the answer to 'prevent'.", "boundary_flip": "If an instance needs only ICMP or a specific port opened (SSH works but ping fails), the answer is a security group rule. If the same traffic is HTTP requests carrying SQL-injection or malformed-header payloads from many IPs not known in advance, a security group cannot match them, and the answer flips to an AWS WAF web ACL on the ALB or CloudFront.", "strongest_distractor_failure": "A security group or NACL deny list looks like it blocks attackers, but it cannot read HTTP content, and it cannot list distributed source IPs that are unknown ahead of time. Security groups cannot express deny rules at all, so a 'Lambda adds bad IPs to the security group' pipeline fails.", "exceptions": ["An ALB on its own rejects some malformed HTTP requests with a 400, so a malformed-header question may accept an ALB-only answer.", "WAF cannot attach to a Classic Load Balancer; the fix is to migrate to an ALB first, then attach the web ACL.", "Shield Advanced (with Business/Enterprise Support) adds SRT access for sophisticated DDoS, but still is not a content filter."], "claim_ids": ["cl-efc838bc7fe6", "cl-3d77ad46d08b", "cl-038dee2bc2ca", "cl-696cbf9141da", "cl-6aab1e646bef", "cl-29ad750e2f77", "cl-9aef3e1b25c9", "cl-b0265694b153", "cl-1a944f610e10", "cl-afab811a4355", "cl-b9c6288caf32", "cl-c9800c358d64", "cl-2611fab25799", "cl-b95c0283618e", "cl-a01ed057824d", "cl-d74d28ef5c34", "cl-a7cd4145001c", "cl-6bcd0bd55664", "cl-29915e366cc2", "cl-3eb586515bcc", "cl-03b40014f553", "cl-b95cf30a89c8", "cl-8e88d32a397e", "cl-858c2050fed4", "cl-00a5f7098142", "cl-098b70bc6fe7", "cl-3c220afd2a93"]}, "scenarioFamily": {"id": "aws-sysops-service-security-identity-compliance--sf-1", "canonical": {"prompt": "Your web application sits behind an Application Load Balancer. Over the past hour, attackers from thousands of different, constantly changing IP addresses have been submitting HTTP POST requests whose body fields contain SQL injection payloads (e.g., ' OR 1=1--). You need to block this traffic before it reaches your application servers, without modifying any application code. What should you do?", "expected_answer": ["Configure an AWS WAF web ACL rule matching the attack and attach it to the supported entry point in front of the origin"], "reasoning": "The attack signature (a SQL injection payload inside the HTTP request body) can only be seen by something that reads HTTP content, and the attacker IPs are too numerous and too changeable to enumerate in a security group or network ACL deny list. AWS WAF runs at layer 7, can be configured with a SQL injection match rule in a web ACL, and blocks matching requests before they reach the ALB-fronted origin.", "distractor_analysis": "A security group or network ACL deny list cannot work: it filters only on protocol/port/source IP, cannot read the request body, and the offending IPs are not known or fixed in advance. Shield Standard protects only against network/transport-layer volumetric DDoS and has no content-inspection capability, so it would not notice a SQLi payload at all.", "claim_ids": ["cl-b9c6288caf32", "cl-3d77ad46d08b", "cl-efc838bc7fe6", "cl-c9800c358d64", "cl-2611fab25799"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The problem is no longer at the HTTP layer at all: instead of SQL injection traffic hitting a load balancer, an administrator can SSH into an EC2 instance successfully but pinging that same instance times out, with no load balancer, no HTTP traffic, and no distributed attacker IPs involved.", "prompt": "An administrator can SSH into an EC2 instance successfully, but pinging the same instance times out. There is no load balancer or HTTP service involved, no SQL injection, and no distributed attacker IPs. What is the most likely cause and fix?", "expected_answer": ["Add an inbound security group rule allowing ICMP traffic to the instance"], "reasoning": "SSH succeeding while ping fails is the classic signature of a security group that allows inbound TCP/22 but has no rule for ICMP: each security group rule applies only to its own protocol/port, so the two checks are filtered independently. Because there is no HTTP content and no changing-IP attacker population here, the content-layer control (AWS WAF) is irrelevant; the fix is purely at the protocol/port layer, so the answer flips from a WAF rule to a security group rule.", "distractor_analysis": "There is nothing for AWS WAF, Shield, Inspector, or GuardDuty to act on here since none of them inspect or filter raw ICMP/TCP connectivity between an administrator and an instance; only the security group's own protocol/port matching explains and fixes an SSH-succeeds/ping-fails symptom.", "claim_ids": ["cl-858c2050fed4", "cl-00a5f7098142", "cl-36d5b6924a97", "cl-aa1713222db9"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "irrelevant-detail", "changed_condition": "Two extra, true-but-non-decisive facts are added: AWS Shield Standard is already enabled on the account (as it is by default on every account) and AWS CloudTrail is logging all API calls. The underlying SQL-injection-from-changing-IPs attack and the ALB are otherwise identical to the canonical scenario.", "prompt": "Same as the canonical scenario: an ALB-fronted application is receiving SQL injection payloads from thousands of constantly changing IP addresses. The account already has AWS Shield Standard enabled by default, and AWS CloudTrail is logging all API calls account-wide. Given this, what should you do to block the SQL injection traffic before it reaches your application servers?", "expected_answer": ["Configure an AWS WAF web ACL rule matching the attack and attach it to the supported entry point in front of the origin"], "reasoning": "Neither added fact changes the diagnosis: Shield Standard only protects against network- and transport-layer DDoS floods and has no content-inspection capability, so it does nothing against an application-layer SQL injection payload, and CloudTrail only logs AWS API and management-plane activity, not end-user web traffic, so it cannot see or block the requests either. The fix remains an AWS WAF web ACL with a SQL injection rule attached to the entry point in front of the origin.", "distractor_analysis": "Shield Standard being 'already on' might tempt a reader into thinking DDoS protection already covers this attack, but Shield Standard has no content-inspection capability for SQLi, XSS, or bot scraping; CloudTrail being 'already logging everything' might tempt a reader into thinking the attack is already visible/blockable from logs, but CloudTrail records API calls, not end-user HTTP requests.", "claim_ids": ["cl-b9c6288caf32", "cl-a01ed057824d", "cl-8f3954ef1a12", "cl-c9800c358d64"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "Instead of simply asking what to do, the on-call engineer proposes a concrete alternative fix: since 50 of the attacking IP addresses have already been identified, add explicit deny entries for those 50 IPs directly in the ALB's security group instead of configuring AWS WAF.", "prompt": "Same canonical scenario, except the on-call engineer proposes adding the 50 already-identified attacker IPs as explicit deny entries in the ALB's security group instead of configuring AWS WAF, arguing 'we already have the list, so we don't need WAF.' Is this a sound fix, and what should you actually do?", "expected_answer": ["Configure an AWS WAF web ACL rule matching the attack and attach it to the supported entry point in front of the origin"], "reasoning": "The proposal fails for two independent reasons: security groups support only allow rules, so there is no way to write a 'deny' entry for an IP in a security group at all, and even if denies were possible, the attack is coming from thousands of changing IPs, so the 50 currently-known addresses are a small, quickly-stale subset. The correct fix is still an AWS WAF web ACL with a SQL injection rule attached to the entry point in front of the origin, which filters by request content regardless of source IP.", "distractor_analysis": "The security-group-deny-list idea is attractive because the team already has concrete IPs in hand, but it cannot be implemented (security groups are allow-only) and would not scale against a distributed, IP-rotating attacker even if it could be.", "claim_ids": ["cl-038dee2bc2ca", "cl-3d77ad46d08b", "cl-b9c6288caf32", "cl-c9800c358d64"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The attack type and entry point both change: instead of SQL injection on an ALB, a scraping bot is repeatedly requesting non-existent pages from a single, fixed IP address against an Amazon CloudFront distribution, and the goal is automatic rate-based blocking rather than payload matching.", "prompt": "A CloudFront distribution in front of your site is being hit by a scraping bot that repeatedly requests non-existent pages from a single IP address. You want to automatically detect and block this behavior without changing any application code. What should you configure?", "expected_answer": ["Configure an AWS WAF web ACL rule matching the attack and attach it to the supported entry point in front of the origin"], "reasoning": "The decision rule transfers directly: the bad behavior (repeated requests for non-existent pages from one IP) is identifiable only from request content and per-IP rate, not from packet headers, and CloudFront is one of AWS WAF's supported entry points just like an ALB. A WAF web ACL rate-based or pattern-matching rule can detect the single IP's repeated behavior and block it, exactly as in the canonical SQL-injection case but applied to a different attack signature and a different supported entry point.", "distractor_analysis": "A security group or network ACL cannot distinguish 'repeatedly requesting non-existent pages' from any other traffic on the same port from that IP, since it has no visibility into the request path or history; it can at best block the IP's protocol/port wholesale, which is a cruder and less targeted control than a WAF rule built for this exact pattern.", "claim_ids": ["cl-1adc3ceae39a", "cl-1a944f610e10", "cl-c9800c358d64", "cl-2611fab25799"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "Claims about load balancer content handling contradict each other, and the mental model states both sides. cl-9aef3e1b25c9 says an ALB rejects malformed HTTP requests by itself (HTTP 400), so WAF is not needed. cl-9bc43470167a says Elastic Load Balancing has no content-inspection capability at all. cl-29ad750e2f77 says WAF is the control for malformed headers. Both cl-9aef3e1b25c9 and cl-29ad750e2f77 come from the same disputed source questions (q600 in p2 and p3-1) and both are 'conflicted'. Even so, the mental model invariant says 'Only a control that reads the HTTP request (AWS WAF) can block ... malformed headers', while its own limits and the contrast-set exceptions say an ALB-only answer may be accepted. The q600 dispute is still open, and the invariant is stated as absolute.", "related_entity_ids": ["cl-9aef3e1b25c9", "cl-29ad750e2f77", "cl-9bc43470167a", "aws-sysops-service-security-identity-compliance--m-1", "aws-sysops-service-security-identity-compliance--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "The synthesis settles source disputes by community vote when it should flag them. In q539 the boxed answer (Inspector for RDS) conflicts with the community vote (cl-a62cca529149). In q755 the boxed answer (VPC peering) conflicts with the community vote (cl-afd1f8a10f67). The mental model's limits tell the learner to s
