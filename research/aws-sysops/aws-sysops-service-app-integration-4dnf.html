<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

onditions": [], "confidence": "high", "id": "cl-9075d6ea71d3", "source_question_ids": ["awssysops-p1-q023"], "statement": "Amazon Elastic MapReduce (EMR) provisions EC2 instances that remain fully accessible to the customer, including SSH/root access to the underlying instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cf03412056a5", "source_question_ids": ["awssysops-p1-q023"], "statement": "AWS Elastic Beanstalk provisions EC2 instances that remain fully accessible to the customer, including SSH/administrator access to the underlying instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0617477fec9c", "source_question_ids": ["awssysops-p1-q023"], "statement": "Elastic Load Balancing, Amazon ElastiCache, and standard Amazon RDS do not expose an underlying instance the customer can log into; Amazon RDS Custom is the exception, giving OS-level access to the database host.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-344468ff8290", "source_question_ids": ["awssysops-p1-q057", "awssysops-p1-q089"], "statement": "Amazon SQS lets a producer enqueue a message and immediately continue processing without waiting for the downstream consumer (e.g. a database write) to acknowledge it, decoupling producer and consumer.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-93d10e9decf0", "source_question_ids": ["awssysops-p1-q057", "awssysops-p1-q089"], "statement": "Amazon SNS is a pub/sub fan-out notification service, not a durable work queue, so it does not hold messages for a consumer to pull and delete on completion the way SQS does.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3d10642b4bd6", "source_question_ids": ["awssysops-p1-q057"], "statement": "Amazon Simple Workflow (SWF) orchestrates multi-step, stateful workflows rather than providing simple fire-and-forget decoupling of a producer from a consumer.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ee923d943805", "source_question_ids": ["awssysops-p1-q057"], "statement": "\"AWS Simple Query Service\" is not a real AWS service.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a9916619370b", "source_question_ids": ["awssysops-p1-q064"], "statement": "Amazon SNS is reachable over its public Publish API from any caller, including an on-premises or private-cloud monitoring tool, regardless of whether the monitored workload itself runs on AWS.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d3b5040eefd1", "source_question_ids": ["awssysops-p1-q064"], "statement": "Amazon SNS can deliver a notification as an SMS text message to a subscriber.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6a380afe2659", "source_question_ids": ["awssysops-p1-q064"], "statement": "Amazon SES sends and receives email, not SMS text messages.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab56ca17ba8c", "source_question_ids": ["awssysops-p1-q064"], "statement": "\"AWS SMS\" is not the name of an AWS notification service; the acronym belonged to the now-discontinued AWS Server Migration Service, so it is the wrong choice for sending SMS alerts, which Amazon SNS handles.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-816b482b9c7c", "source_question_ids": ["awssysops-p1-q072"], "statement": "AWS CloudFormation can provision an ordered, dependency-aware collection of AWS resources (e.g. EC2 instances, an ELB) referencing a software installable hosted in S3, all from one declarative template.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-533b9ea8c9d6", "source_question_ids": ["awssysops-p1-q072"], "statement": "AWS CloudFront is a content delivery network (CDN) and is not used for provisioning infrastructure such as a LAMP stack.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a6d85cf3bdd9", "source_question_ids": ["awssysops-p1-q072"], "statement": "\"AWS DevOps\" is not an actual AWS service name.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["community discussion on the source question remains split between Elastic Beanstalk and CloudFormation as the intended answer"], "confidence": "low", "id": "cl-352ac93517a8", "source_question_ids": ["awssysops-p1-q072"], "statement": "AWS Elastic Beanstalk can also provision a full LAMP environment including an ELB, and is itself built on CloudFormation under the hood, making it a plausible alternative answer to CloudFormation for a question about orderly deployment of infrastructure that downloads an installable from S3.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-fb020a2db02e", "source_question_ids": ["awssysops-p1-q079"], "statement": "Amazon SNS can deliver to HTTP/HTTPS, Email, Email-JSON, Amazon SQS, SMS, AWS Lambda, mobile push (platform application) endpoints, and Amazon Data Firehose; Amazon SES is not a subscription endpoint.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-69111824da16", "source_question_ids": ["awssysops-p1-q079"], "statement": "Amazon SES is not a supported Amazon SNS subscription endpoint type; SNS cannot push a notification directly to SES as a subscriber.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a02416f3f953", "source_question_ids": ["awssysops-p1-q079"], "statement": "Amazon SES can publish into Amazon SNS, for example to deliver bounce/complaint notifications, which is the reverse direction of SES subscribing to SNS.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-958bcecd774d", "source_question_ids": ["awssysops-p1-q081", "awssysops-p1-q142"], "statement": "RDS event notifications are delivered through Amazon SNS: RDS publishes to an SNS topic when a supported event occurs, and users subscribe endpoints such as email, SMS, HTTP, or an SQS queue to that topic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6764aa9c27d9", "source_question_ids": ["awssysops-p1-q081"], "statement": "Amazon CloudWatch monitors metrics and logs and can alarm on thresholds, but it is not RDS's native event-notification transport mechanism.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d1e3f1c5aee9", "source_question_ids": ["awssysops-p1-q081"], "statement": "AWS CloudTrail records API calls and management events rather than RDS operational events, so it is not used for RDS event notifications.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-557ec82bd0f0", "source_question_ids": ["awssysops-p1-q081"], "statement": "AWS SES only sends email and is not RDS's event notification transport.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-9068100aee08", "source_question_ids": ["awssysops-p1-q082"], "statement": "Amazon SQS standard queues make a best effort to preserve message order but do not guarantee it; messages can be delivered out of order by default.", "status": "supported"}, {"claim_type": "rule", "conditions": ["strict in-order processing is required", "an SQS FIFO queue is not offered as an option"], "confidence": "high", "id": "cl-42a5fa322bc7", "source_question_ids": ["awssysops-p1-q082"], "statement": "When strict in-order message processing is required and an SQS FIFO queue is not available as an option, placing sequencing information on each message lets the consumer reorder messages on receipt.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6ab63d0d4462", "source_question_ids": ["awssysops-p1-q082"], "statement": "AWS Simple Workflow (SWF) is not required to enforce in-order message delivery when using Amazon SQS.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-730dff57344f", "source_question_ids": ["awssysops-p1-q089"], "statement": "Amazon SQS decouples a frontend application tier from a backend processing tier, letting the two tiers scale independently because the frontend enqueues a message instead of blocking on backend processing latency.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4fb75a3f9eda", "source_question_ids": ["awssysops-p1-q089"], "statement": "Amazon Glacier is archival cold storage and is unrelated to decoupling or scaling request-handling workloads.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ff69cbb99907", "source_question_ids": ["awssysops-p1-q089"], "statement": "Amazon Elastic Transcoder (discontinued November 13, 2025; successor AWS Elemental MediaConvert) was built for video and audio transcoding, not image editing, so it does not decouple a photo-processing workload.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-26a496b56151", "source_question_ids": ["awssysops-p1-q108"], "statement": "An Amazon SQS queue can be deleted at any time regardless of whether it still holds undelivered messages; there is no requirement to drain or empty the queue first.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d427abb02930", "source_question_ids": ["awssysops-p1-q131"], "statement": "An Amazon SQS queue URL follows the pattern http(s)://sqs.<region>.amazonaws.com/<account-id>/<queue-name>, with the region immediately after the service name and the account ID and queue name forming the path.", "status": "supported"}, {"claim_type": "rule", "conditions": ["an HTTP-reachable physical device/endpoint exists to receive the SNS notification"], "confidence": "low", "id": "cl-ace019c49d97", "source_question_ids": ["awssysops-p1-q137"], "statement": "A CloudWatch alarm on EC2 CPU utilization can publish to an SNS topic, which can deliver to an HTTP endpoint that a home-automation/IoT device could use to physically switch on a light.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6bc13202bbf9", "source_question_ids": ["awssysops-p1-q142"], "statement": "RDS event notification subscriptions can be scoped to a source category such as 'DB security group,' and subscribing to its Configuration Change category delivers a notification whenever that security group is modified.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c0a1c4cac06a", "source_question_ids": ["awssysops-p1-q142"], "statement": "Manually configuring SNS to monitor DB security group changes works but is less direct than using RDS's built-in event notification subscription for the DB security group source category.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1aaea230f356", "source_question_ids": ["awssysops-p1-q142"], "statement": "A CloudWatch alarm on an RDS DB instance does not observe DB security group configuration changes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["target resource is outside AWS, e.g. an on-premises/private data center"], "confidence": "high", "id": "cl-8075cf682ebf", "source_question_ids": ["awssysops-p1-q186"], "statement": "A CloudWatch alarm on the StatusCheckFailed metric can publish to an SNS topic that delivers to an HTTP endpoint running in an on-premises data center, which can trigger launching a new instance there.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-02415a0c52c2", "source_question_ids": ["awssysops-p1-q186"], "statement": "AWS Auto Scaling, ELB, VPC, and CloudFormation are AWS-native mechanisms that only operate on AWS-hosted resources and cannot reach into an on-premises/private data center environment.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-2a2a261ab538", "source_question_ids": ["awssysops-p1-q188"], "statement": "Amazon SQS retains messages for 4 days by default, configurable up to 14 days.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-b97c7e688747", "source_question_ids": ["awssysops-p1-q188"], "statement": "An Amazon SQS message stays in the queue until a consumer retrieves and deletes it, or until it ages out past the configured retention period.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-16b452b6a690", "source_question_ids": ["awssysops-p1-q188"], "statement": "Any consumer that polls an Amazon SQS queue while a message is still present can receive that message; messages are not targeted at only whichever consumer happened to be available at send time.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7bf5ff1f5df2", "source_question_ids": ["awssysops-p1-q188"], "statement": "A standard Amazon SQS queue delivers each message to, in practice, one consumer rather than broadcasting it to every consumer, so a message is not retained until it has been delivered to all consumers.", "status": "supported"}, {"claim_type": "fact", "conditions": ["as originally documented, before January 2021"], "confidence": "medium", "id": "cl-d13dab4cfb76", "source_question_ids": ["awssysops-p1-q226"], "statement": "Historically, per the original reference passage, AWS SNS only sent CloudWatch data every 5 minutes (basic monitoring only), with no detailed-monitoring option available.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["current AWS behavior, since the January 2021 change"], "confidence": "medium", "id": "cl-697df4971aec", "source_question_ids": ["awssysops-p1-q226"], "statement": "As of January 2021, AWS made 1-minute CloudWatch metrics the default for SNS, so SNS now provides every-minute granularity automatically with no separate 'enable detailed monitoring' step required.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2d531b559aaf", "source_question_ids": ["awssysops-p1-q226"], "statement": "CloudWatch has always supported at least basic monitoring for SNS, regardless of era, so a claim that CloudWatch does not support monitoring for SNS at all is wrong.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e77c926066a5", "source_question_ids": ["awssysops-p1-q234"], "statement": "RDS event notifications can be temporarily turned off without deleting the underlying subscription by setting the 'Enabled' toggle to No in the console, or the Enabled parameter to false via CLI/API.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e708da264a12", "source_question_ids": ["awssysops-p1-q234"], "statement": "The RDS console does not have a 'Disable' button set to 'Yes' for notifications; the actual control is an 'Enabled' toggle that is set to No to disable.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c81f2a55d27e", "source_question_ids": ["awssysops-p1-q234"], "statement": "There is no 'send mail flag' parameter for RDS DB event notifications.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-48f46ffef047", "source_question_ids": ["awssysops-p1-q234"], "statement": "Deleting the notification subscription is not the only way to stop receiving RDS event notifications, since disabling the subscription is also supported.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cae9889f6e42", "source_question_ids": ["awssysops-p1-q240"], "statement": "Amazon SQS's documented operation set includes CreateQueue, ListQueues, DeleteQueue, SendMessage, SendMessageBatch, ReceiveMessage, DeleteMessage, DeleteMessageBatch, ChangeMessageVisibility, ChangeMessageVisibilityBatch, SetQueueAttributes, GetQueueAttributes, GetQueueUrl, AddPermission, and RemovePermission.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ca90605961d1", "source_question_ids": ["awssysops-p1-q240"], "statement": "\"DeleteMessageQueue\" is not a real Amazon SQS API operation; the actual operation for removing a queue is DeleteQueue.", "status": "supported"}, {"claim_type": "rule", "conditions": ["30 consecutive days with none of the core operations called on the queue"], "confidence": "high", "id": "cl-44708e37f20d", "source_question_ids": ["awssysops-p1-q280"], "statement": "Amazon SQS reserves the right to delete a queue silently, without any notification, after 30 consecutive days during which none of its core operations (SendMessage, ReceiveMessage, DeleteMessage, GetQueueAttributes, SetQueueAttributes, AddPermission, RemovePermission) have been called on it.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-a0539ed14472", "source_question_ids": ["awssysops-p1-q280"], "statement": "Amazon SQS does not send a notification before deleting a queue left inactive for 30 consecutive days, and it does not first mark the queue with an intermediate 'inactive' state.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-798336de128b", "source_question_ids": ["awssysops-p2-q305"], "statement": "AWS Elastic Beanstalk provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-49a2a4f2a510", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon EMR provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-21cd90768c4c", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon ElastiCache, Amazon RDS, and Elastic Load Balancing are fully managed services that give customers no direct access to the underlying compute instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-68490be234e9", "source_question_ids": ["awssysops-p2-q305"], "statement": "A claim that RDS lets customers 'retain administrative privileges' on its underlying EC2 instances is technically unsupported, since RDS is fully managed and customers get only a database endpoint rather than OS-level or root access to the host; this claim appeared in a dissenting minority vote.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-b4bea39cfd03", "source_question_ids": ["awssysops-p2-q324"], "statement": "Elastic Beanstalk's log file rotation to S3 is a native configuration feature that works automatically across autoscaling events, unlike a manually configured per-instance scheduled task.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["Elastic Beans ding and receiving email using your own addresses and domains, covering marketing, transactional, and newsletter use cases as well as inbound mail automation such as auto-responders and support-ticket generation.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f52136bce440", "source_question_ids": ["awssysops-p2-q384"], "statement": "Amazon SES stands for Simple Email Service.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-094545b083f9", "source_question_ids": ["awssysops-p2-q387"], "statement": "AWS Elastic Beanstalk provides platforms for Java SE, Tomcat, PHP, .NET (Windows and Linux), Node.js, Python, Ruby, Go, and Docker; Perl has no native platform and runs only in a custom Docker container.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-f85ea37322dc", "source_question_ids": ["awssysops-p2-q387"], "statement": "Perl is not one of the programming languages/platforms supported by AWS Elastic Beanstalk.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e3baf4f327b5", "source_question_ids": ["awssysops-p2-q402"], "statement": "Elasticity, as a benefit of Elastic Beanstalk, is the streamlining of resource acquisition and release so that infrastructure can rapidly scale in and scale out as demand fluctuates.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2632f870aa8b", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CodeCommit uses the repository ID as the AWS KMS encryption context for its encrypt/decrypt operations.", "status": "supported"}, {"claim_type": "rule", "conditions": ["determining which KMS key operations applied to a specific AWS CodeCommit repository"], "confidence": "high", "id": "cl-90d700484d79", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CloudTrail logs r", "conditions": [], "confidence": "medium", "id": "cl-605d2ac83c50", "source_question_ids": ["awssysops-p3-1-q667"], "statement": "Making an AMI or an EBS snapshot public exposes it to any AWS account rather than only an intended recipient account, undermining a requirement to maintain the security of the application being moved.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-37f0b348f8c1", "source_question_ids": ["awssysops-p3-1-q667"], "statement": "The question's community vote (and AWS's AMI-sharing documentation, which states AMIs are regional and must be copied to a Region before being shared there) conflicts with this question's boxed answer, which skips the copy-to-new-region step.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0db90d658973", "source_question_ids": ["awssysops-p3-1-q685"], "statement": "EC2Rescue (for Windows) is purpose-built to collect operating-system-level logs for diagnosing RDP/connectivity failures and boot problems on an EC2 instance.", "status": "supported"}, {"claim_type": "rule", "conditions": ["the target EC2 instance is unreachable via RDP"], "confidence": "medium", "id": "cl-5c709ed16e42", "source_question_ids": ["awssysops-p3-1-q685"], "statement": "When an EC2 instance is unreachable via RDP so EC2Rescue cannot be run directly on it, EC2Rescue can still be used by detaching the affected EBS volume and attaching it to a working instance, or by running it offline via an SSM document.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5813db96bc00", "source_question_ids": ["awssysops-p3-1-q685"], "statement": "VPC Flow Logs record only network-interface accept/reject traffic metadata, not operating-system log content, so they cannot be used to gather OS log files for analysis.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "med ssed messages are kept before being discarded; it does not increase processing throughput and does not fix a growing message backlog.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-036c4f066762", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "Amazon SQS is reached over its public API endpoint, so a Lambda function running in a VPC with no internet access needs an SQS VPC interface endpoint to reach a queue at all.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-eabfc6c47e91", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "An RDS instance's security group must explicitly allow inbound connections from the Lambda function's security group or elastic network interface, or writes from Lambda to RDS will silently fail.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-59ac86f401fe", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When a Lambda function and an RDS instance are located in the same VPC, no VPC endpoint is needed for the RDS traffic between them.", "status": "supported"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-f34aafa5d9c0", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A NAT gateway's presence or absence has no bearing on intra-VPC connectivity between a Lambda function and an RDS instance in the same VPC.", "status": "conflicted"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-b273a9a19c4b", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A missing internet gateway on a Lambda function's subnet has no bearing on data reaching RDS when the Lambda-to-RDS workflow occurs entirely within the VPC and requires no outbound internet access.", "status": "conflicted"}, {"claim_type": "rule", "confidence": "high", "id": "cl-0c850204c75d", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When a question's community vote credibly and substantially contradicts or splits from the given boxed answer, the question is flagged as disputed for triage while the boxed answer is nonetheless retained per the ingestion policy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6f7913cd4d98", "source_question_ids": ["awssysops-p3-1-q877"], "statement": "Spot blocks, retired after December 31, 2022, carried a price premium over regular Spot pricing in exchange for a guaranteed uninterrupted run of 1-6 hours.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a2333e51d02a", "source_question_ids": ["awssysops-p3-1-q877"], "statement": "A one-time Spot Instance request was priced lower than the now-retired Spot block because it offered no fixed-duration guarantee.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["job can be completed at any time", "job can be restarted from the beginning if it fails or is interrupted"], "confidence": "medium", "id": "cl-7affb7d1cb02", "source_question_ids": ["awssysops-p3-1-q877"], "statement": "A job that can run at any time and can be restarted from the beginning if interrupted is well suited to regular Spot Instances rather than a Spot block.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a594dc1f98e4", "source_question_ids": ["awssysops-p3-1-q877"], "statement": "Reserved Instances require a long-term commitment, making them ill-suited for intermittent, short-duration job runs.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["workload tolerates interruption entirely"], "confidence": "medium", "id": "cl-078622d12978", "source_question_ids": ["awssysops-p3-1-q877"], "statement": "Mixing On-Demand and Spot Instances for a flexible, interruption-tolerant workload pays full price for the On-Demand portion unnecessarily.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-89d7943d0fa5", "source_question_ids": ["awssysops-p3-1-q877"], "statement": "Spot blocks (defined-duration Spot Instances) stopped accepting new customers on July 1, 2021 and were retired for all customers after December 31, 2022.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-329557271989", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "A cluster placement group packs instances physically close together within a single Availability Zone specifically to minimize inter-instance network latency.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cf4c058d03bb", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "Enhanced networking provides higher packet-per-second performance and lower network jitter/latency at the instance level.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-80cf23c5ba1d", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "Launching instances in different VPCs connected by a VPN tunnel or VPC peering adds network hops between them, working against a lowest-possible-latency goal.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9cf762a8eccc", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "A spread placement group deliberately places instances on distinct underlying hardware to reduce simultaneous failure risk, the opposite of the physical proximity needed for minimizing latency.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-143136e6a8eb", "source_question_ids": ["awssysops-p3-1-q929"], "statement": "AWS now marks the lowestPrice Spot Fleet allocation strategy as not recommended because it has the highest interruption risk and recommends priceCapacityOptimized for cost savings and capacity availability; older documentation recommended lowestPrice with InstancePoolsToUseCount for cost optimization.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-18cecd65745c", "source_question_ids": ["awssysops-p3-1-q929"], "statement": "Specifying a Spot Fleet target capacity and how much of it must be On-Demand guarantees a minimum baseline of capacity for availability and reliability, not for cost optimization.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1b370fc84525", "source_question_ids": ["awssysops-p3-1-q929"], "statement": "The capacityOptimized Spot Fleet allocation strategy prioritizes pools with the most stable spare capacity to minimize interruptions, which is a reliability optimization rather than a cost optimization.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2d6f485b8b80", "source_question_ids": ["awssysops-p3-1-q929"], "statement": "Launching instances up to the Spot Fleet target capacity or maximum acceptable price is basic Spot Fleet behavior, not itself a cost-optimization lever.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-app-integration-deployment--m-1", "title": "Who holds the message, and who moves it: SQS pull-queue vs SNS push-fan-out (with SES and SWF at the edges)", "purpose": "Pick the right AWS application-integration service (and its correct operational behavior) by asking where a message lives after it is sent and whether the receiver pulls it or has it pushed to them.", "mechanism": "Amazon SQS is a durable buffer: a producer calls SendMessage and immediately continues, and the message sits in the queue (4 days by default, up to 14) until some consumer polls ReceiveMessage, processes it, and calls DeleteMessage. Because the queue absorbs the gap, the frontend and backend tiers scale independently, and any polling consumer can take a message (in practice one consumer per message, not a broadcast). Throughput and backlog are therefore fixed by adding consumers: an Auto Scaling group driven by a CloudWatch alarm on ApproximateNumberOfMessagesVisible, not by CPU, an ELB, DLQ depth, or longer retention. Amazon SNS is the opposite shape: nothing waits in a queue; a publisher (any caller of the public Publish API, even on-premises, or an AWS service such as RDS event notifications or a CloudWatch alarm) pushes to a topic and SNS immediately fans the message out to every subscribed endpoint (HTTP/S, email, SMS, SQS, Lambda, mobile push). Amazon SES is only email sending/receiving: it is not an SMS service and not an SNS subscription endpoint (it can publish into SNS, not subscribe to it). Amazon SWF is neither a buffer nor a notifier: it tracks state and ordering across multi-step distributed tasks.", "predict_prompt": "An RDS DB security group is modified and the ops team must get a text message. Which service carries the notification, and why would SQS or SES be wrong?", "invariants": ["An SQS message persists until a consumer deletes it or the retention period expires; SNS does not hold messages for a later pull.", "SQS is pull-based (consumers poll); SNS is push-based (fan-out to all subscribers).", "Scale SQS workers on queue depth (ApproximateNumberOfMessagesVisible) via an Auto Scaling group, since the policy attaches to the group, not the queue.", "RDS event notifications and CloudWatch alarm actions are delivered through SNS topics.", "SES handles email only and cannot be an SNS subscriber."], "limits": ["SQS standard queues do not guarantee ordering; without a FIFO queue, put sequencing data in each message and reorder in the consumer (SWF is not needed for this).", "SQS can silently delete a queue after 30 consecutive days with no core operations, with no warning or intermediate inactive state.", "A queue can be deleted with DeleteQueue (not 'DeleteMessageQueue') even while it still holds messages.", "A VPC-bound caller with no internet path needs an SQS interface VPC endpoint to reach the public SQS API."], "cues": ["'decouple', 'continue without waiting', 'backend processes at its own pace', 'retain until processed' -> SQS", "'notify', 'SMS', 'fan out', 'push to HTTP endpoint', 'RDS event notification', 'on-premises tool sends alerts' -> SNS", "'send/receive email', 'bounce/complaint handling' -> SES", "'coordinate tasks', 'track task state and execution order' -> SWF", "'queue backlog growing' -> scale the ASG on ApproximateNumberOfMessagesVisible"], "claim_ids": ["cl-344468ff8290", "cl-730dff57344f", "cl-912a35def657", "cl-2a2a261ab538", "cl-b97c7e688747", "cl-16b452b6a690", "cl-7bf5ff1f5df2", "cl-bd3b5156cd07", "cl-c719bdb2fd5e", "cl-d3017bf37441", "cl-14ebbcdc4696", "cl-97f63fb0dc91", "cl-ab72a6be117f", "cl-0d0c262cc2c9", "cl-839a312f5ad2", "cl-93d10e9decf0", "cl-a9916619370b", "cl-d3b5040eefd1", "cl-fb020a2db02e", "cl-958bcecd774d", "cl-8075cf682ebf", "cl-6a380afe2659", "cl-69111824da16", "cl-a02416f3f953", "cl-64da50920151", "cl-233eeb8f8587", "cl-db6222b182f1", "cl-9068100aee08", "cl-42a5fa322bc7", "cl-6ab63d0d4462", "cl-44708e37f20d", "cl-a0539ed14472", "cl-26a496b56151", "cl-ca90605961d1", "cl-036c4f066762"]}, "contrastSet": {"id": "aws-sysops-service-app-integration-deployment--cs-1", "subjects": ["Amazon SQS", "Amazon SNS", "Amazon SES", "Amazon SWF"], "dimensions": ["delivery model", "message persistence", "recipients", "typical exam cue"], "shared_traits": ["Fully managed AWS application-integration services reached over public AWS APIs", "All appear as 'Simple ... Service' acronyms, which is why they are swapped as distractors"], "matrix": {"delivery model": {"Amazon SQS": "Pull: consumers poll ReceiveMessage", "Amazon SNS": "Push: topic fans out to subscribers", "Amazon SES": "Sends/receives email", "Amazon SWF": "Coordinates task execution order"}, "message persistence": {"Amazon SQS": "Held until deleted or retention expires (4 days default, max 14)", "Amazon SNS": "Not held for later pull; delivered on publish", "Amazon SES": "Email delivery, not a work queue", "Amazon SWF": "Tracks workflow/task state, not messages"}, "recipients": {"Amazon SQS": "Effectively one consumer per message", "Amazon SNS": "Every subscriber: HTTP/S, email, SMS, SQS, Lambda, mobile push", "Amazon SES": "Email addresses only; not an SNS subscriber", "Amazon SWF": "Workers/deciders in a multi-step workflow"}, "typical exam cue": {"Amazon SQS": "Decouple tiers, buffer work, scale on queue depth", "Amazon SNS": "Notify/alert, SMS, RDS event notifications, CloudWatch alarm action", "Amazon SES": "Marketing/transactional email, inbound mail", "Amazon SWF": "Stateful multi-step task coordination"}}, "decision_rule": "Ask whether the message must wait durably for a receiver to pull it when ready (SQS) or be pushed immediately to every interested endpoint (SNS); only if the channel is specifically email (SES) or the need is tracking state across ordered multi-step tasks (SWF) does the answer leave that SQS/SNS axis.", "boundary_flip": "A web tier must hand photo-processing jobs to a backend fleet that works at its own pace -> SQS. Change the requirement to 'text the on-call engineer the moment an RDS security group changes or a CPU alarm fires' -> the answer flips to SNS (an RDS event subscription or CloudWatch alarm publishing to an SNS topic with an SMS subscriber).", "strongest_distractor_failure": "Choosing SNS for decoupling fails because SNS is a pub/sub push service that does not hold a message for a consumer to pull and delete on completion; if the backend is busy or down, nothing buffers the work the way an SQS queue does.", "exceptions": ["SNS can deliver into an SQS queue, so a fan-out-then-buffer design uses both; the question's requirement decides which one is the answer.", "SES can publish into SNS (e.g. bounce/complaint notifications) even though it cannot subscribe to an SNS topic.", "Strict ordering without a FIFO queue is handled by per-message sequence numbers in SQS, not by switching to SWF."], "claim_ids": ["cl-344468ff8290", "cl-730dff57344f", "cl-912a35def657", "cl-2a2a261ab538", "cl-b97c7e688747", "cl-7bf5ff1f5df2", "cl-bd3b5156cd07", "cl-839a312f5ad2", "cl-93d10e9decf0", "cl-d3b5040eefd1", "cl-fb020a2db02e", "cl-958bcecd774d", "cl-6bc13202bbf9", "cl-ace019c49d97", "cl-6a380afe2659", "cl-557ec82bd0f0", "cl-69111824da16", "cl-a02416f3f953", "cl-64da50920151", "cl-3d10642b4bd6", "cl-233eeb8f8587", "cl-db6222b182f1", "cl-6ab63d0d4462", "cl-42a5fa322bc7"]}, "scenarioFamily": {"id": "aws-sysops-service-app-integration-deployment--sf-1", "canonical": {"prompt": "A photo-sharing web application's frontend tier accepts user uploads and must respond to the user immediately, without waiting for a backend image-processing fleet to finish each job. The backend fleet's workload is variable and bursty, and the team wants the backend to add or remove capacity automatically to match the amount of pending work, while keeping the frontend and backend tiers able to scale independently of each other. Which AWS service should sit between the two tiers, and how should the backend fleet's capacity be scaled?", "expected_answer": ["Put Amazon SQS between the frontend and backend tiers so the frontend can enqueue a job and continue immediately; scale the backend Auto Scaling group with a CloudWatch alarm on the queue's ApproximateNumberOfMessagesVisible metric."], "reasoning": "SQS lets a producer enqueue a message and continue without waiting for the consumer to acknowledge it (cl-344468ff8290), and this decouples the frontend tier from the backend tier so each can scale independently (cl-730dff57344f). To track aggregate throughput/backlog automatically, the documented pattern is an Auto Scaling group whose policy watches ApproximateNumberOfMessagesVisible (cl-c719bdb2fd5e, cl-d3017bf37441); the scaling policy attaches to the Auto Scaling group itself, not directly to the SQS queue (cl-14ebbcdc4696).", "distractor_analysis": "Amazon SNS is a pub/sub push service, not a durable queue, so it would not hold jobs for the backend to pull and delete on completion if the backend falls behind (cl-93d10e9decf0). Amazon Glacier is archival cold storage and unrelated to decoupling a live processing workload (cl-4fb75a3f9eda). Amazon Elastic Transcoder/its successor is for audio/video transcoding, not a general decoupling or image-editing mechanism (cl-ff69cbb99907). Watching the dead-letter queue's depth would not reflect current processing backlog, since a DLQ only receives messages that exceeded the max-receive threshold (cl-97f63fb0dc91). Scaling on CPU utilization alone is unreliable because a CPU-light workload can still leave the queue growing unbounded (cl-0d0c262cc2c9).", "claim_ids": ["cl-344468ff8290", "cl-730dff57344f", "cl-c719bdb2fd5e", "cl-d3017bf37441", "cl-14ebbcdc4696", "cl-93d10e9decf0", "cl-4fb75a3f9eda", "cl-ff69cbb99907", "cl-97f63fb0dc91", "cl-0d0c262cc2c9"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The requirement is no longer to autoscale the backend fleet's capacity — instead, the business now requires that the on-call engineer receive an SMS text message the moment the pending backlog exceeds a threshold, with no infrastructure scaling implied.", "prompt": "The team still has the frontend enqueueing jobs for the backend to process at its own pace, but the new requirement is: when the pending backlog crosses a threshold, the on-call engineer must get a text message alert. There is no requirement to add backend capacity automatically. Which AWS service delivers the alert, and how?", "expected_answer": ["Put a CloudWatch alarm on the queue's backlog metric and have it publish to an Amazon SNS topic with an SMS subscription for the on-call engineer; SQS itself is still used to hold the jobs, but SNS is the service that pushes the actual text alert."], "reasoning": "Because the ask changed from 'scale capacity to backlog' to 'notify a person when backlog crosses a threshold,' the answer moves off the SQS-scaling axis and onto the notification axis: a CloudWatch alarm can publish to an SNS topic that delivers to a subscriber (cl-ace019c49d97 shows this alarm-to-SNS-to-endpoint pattern), and SNS can deliver that notification as an SMS text message (cl-d3b5040eefd1). This is a boundary flip from the canonical scenario because the underlying goal (what should happen when backlog grows) changed from 'scale workers' to 'alert a human.'", "distractor_analysis": "SNS could not be the answer to the canonical scaling question because it does not hold jobs for a consumer to pull (cl-93d10e9decf0), but here that is irrelevant since SNS is not being asked to buffer work — only to push an alert. Amazon SES only sends/receives email, not SMS text messages, so it is the wrong channel for this alert (cl-6a380afe2659).", "claim_ids": ["cl-ace019c49d97", "cl-d3b5040eefd1", "cl-93d10e9decf0", "cl-6a380afe2659"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The backend fleet instances are EBS-optimized and have public IP addresses enabled, and uploads from users are served through an Elastic Load Balancer in front of the frontend tier.", "prompt": "Same decoupling and autoscaling need as before: the frontend must respond immediately and the backend's capacity must track pending work. This time, the backend instances are EBS-optimized and have public IPs assigned, and the frontend sits behind an Elastic Load Balancer. Does any of that change which service connects the tiers or how the backend should be scaled?", "expected_answer": ["No — still use Amazon SQS between the tiers and scale the backend Auto Scaling group on a CloudWatch alarm watching ApproximateNumberOfMessagesVisible; the EBS optimization, public IPs, and the frontend's ELB are irrelevant to that choice."], "reasoning": "EBS-optimized instances improve EBS disk I/O, not throughput to the SQS API endpoint, so it has no bearing on the queue/scaling design (cl-18e92d1fc8a0). A public IP address affects general internet reachability of an instance, not throughput to the SQS API endpoint (cl-692ae06ed096). An ELB in front of the frontend tier distributes inbound HTTP traffic to the frontend; it does not improve throughput between EC2 and SQS, because there is no inbound traffic to SQS for an ELB to distribute (cl-ddb93ea39149). None of these details touch the mechanism that actually matters: SQS decoupling plus ASG scaling on queue depth, exactly as in the canonical scenario.", "claim_ids": ["cl-18e92d1fc8a0", "cl-692ae06ed096", "cl-ddb93ea39149", "cl-c719bdb2fd5e", "cl-d3017bf37441"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "Before implementing, the team debates just scaling the backend Auto Scaling group on CPU utilization instead, reasoning that CPU usage already seems to trend with how much photo-processing work is happening.", "prompt": "A teammate proposes skipping the queue-depth metric entirely and instead scaling the backend Auto Scaling group purely on average CPU utilization, since CPU appears to rise and fall with processing load in their informal testing. Is this an acceptable substitute for the canonical approach, and why or why not?", "expected_answer": ["No — still scale the backend Auto Scaling group on a CloudWatch alarm watching the queue's ApproximateNumberOfMessagesVisible metric, not on CPU utilization alone."], "reasoning": "Scaling on CPU utilization alone does not reliably track the SQS queue's actual backlog, because the workload can be CPU-light yet slow to process, letting the queue grow unbounded even while CPU looks fine (cl-0d0c262cc2c9). The documented, cost-effective pattern remains an Auto Scaling group whose policy is driven by ApproximateNumberOfMessagesVisible (cl-d3017bf37441), with the scaling policy attached to the group, not the queue (cl-14ebbcdc4696).", "distractor_analysis": "CPU-based scaling is the adversarial distractor here: it sounds plausible because CPU often does correlate with load, which is exactly why it tempts teams away from the correct backlog-based metric, but it fails whenever processing time and CPU usage decouple (cl-0d0c262cc2c9).", "claim_ids": ["cl-0d0c262cc2c9", "cl-d3017bf37441", "cl-14ebbcdc4696"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The pipeline now moves video-encoding jobs instead of photo-editing jobs between the same frontend and backend tiers; everything else about the decoupling and autoscaling need stays the same.", "prompt": "The same frontend/backend split is now needed for a video-encoding farm instead of a photo-editing service: the frontend must respond immediately, and the backend's capacity must track pending work. A teammate suggests Amazon Elastic Transcoder's successor service might be the piece that connects the tiers, since the workload is now video. Does switching the workload to video change which service connects the tiers or how backend capacity should be scaled?", "expected_answer": ["No — still use Amazon SQS between the tiers and scale the backend Auto Scaling group on a CloudWatch alarm watching ApproximateNumberOfMessagesVisible; a transcoding service does the encoding work itself, not the decoupling or scaling."], "reasoning": "The decoupling mechanism (SQS, with the producer continuing immediately after SendMessage) and the independent-scaling benefit it gives the two tiers (cl-730dff57344f) do not depend on what the backend fleet actually computes; the same ApproximateNumberOfMessagesVisible-driven Auto Scaling pattern (cl-c719bdb2fd5e, cl-d3017bf37441) carries over unchanged from photo processing to video encoding.", "distractor_analysis": "Amazon Elastic Transcoder (now succeeded by AWS Elemental MediaConvert) is a transcoding engine, not a queueing or scaling mechanism, so renaming the workload to video does not make it the answer to how the tiers are connected or scaled (cl-ff69cbb99907).", "claim_ids": ["cl-730dff57344f", "cl-c719bdb2fd5e", "cl-d3017bf37441", "cl-ff69cbb99907"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "Source questions disagree on Spot suitability for restart-from-scratch jobs. q666 claims a one-time Spot request is 'unacceptable for a job that must restart from the beginning on any interruption' (cl-9cf30a9dc54e), while q877 claims a job that 'can be restarted from the beginning if interrupted' is well suited to regular Spot (cl-7affb7d1cb02). The run-at-any-time condition only partly separates the two scenarios, and the dispute is left unresolved.", "related_entity_ids": ["cl-9cf30a9dc54e", "cl-7affb7d1cb02", "cl-eefa87629c91", "cl-6f7913cd4d98", "cl-a2333e51d02a"]}, {"type": "contradiction", "severity": "high", "description": "q666's boxed answer (Reserved Instances) conflicts with the slice's own claims. Those claims say RIs need a 1- or 3-year commitment and are ill-suited to short time-bounded jobs (cl-2bc000277e81, cl-a594dc1f98e4), and that the community vote and AWS sample exam key point to a Spot block (cl-97fb5c495e0b). The correct answer for this question is unresolved.", "related_entity_ids": ["cl-97fb5c495e0b", "cl-2bc000277e81", "cl-a594dc1f98e4", "cl-eefa87629c91"]}, {"type": "stale-risk", "severity": "medium", "description": "q666 and q877 hinge on EC2 Spot blocks (defined-duration Spot), which stopped accepting new customers in July 2021 and were retired after December 31, 2022. Answers keyed on Spot blocks no longer reflect a purchasable option.", "related_entity_ids": ["cl-eefa87629c91", "cl-6f7913cd4d98", "cl-a2333e51d02a", "cl-89d7943d0fa5", "cl-97fb5c495e0b"]}, {"type": "contradiction", "severity": "high", "description": "q667's boxed answer skips the copy-the-AMI-to-the-new-Region step. The community vote and AWS AMI documentation (AMIs are Regional and must be copied before they can be used in another Region) contradict it, and the dispute is unresolved.", "related_entity_ids": ["cl-37f0b348f8c1", "cl-e18c96aaefe4", "cl-08bafd72520c"]}, {"type": "contradiction", "severity": "medium", "description": "Two sources disagree on RDS host access. q023 says RDS Custom is an exception that gives OS-level access to the database host (cl-0617477fec9c). q305 says categorically that RDS gives customers no direct access to the underlying instances (cl-21cd90768c4c) and calls administrative privileges on RDS hosts unsupported (cl-68490be234e9). Neither is qualified to reconcile the RDS Custom case.", "related_entity_ids": ["cl-0617477fec9c", "cl-21cd90768c4c", "cl-68490be234e9"]}, {"type": "ambiguity", "severity": "medium", "description": "q072's intended answer is split between CloudFormation and Elastic Beanstalk (cl-352ac93517a8, needs-review). The slice also states CloudFormation as the answer with high confidence (cl-816b482b9c7c), with no acknowledgment that this answer is disputed.", "related_entity_ids": ["cl-352ac93517a8", "cl-816b482b9c7c"]}, {"type": "ambiguity", "severity": "medium", "description": "q324's Elastic Beanstalk log-rotation answer (cl-b4bea39cfd03) is conflicted. The exception cl-50ae6b4244af notes that Windows Server platforms do not support bundle logs, which may undercut the automatic rotate-to-S3 answer for the question's .NET application. This is unresolved.", "related_entity_ids": ["cl-b4bea39cfd03", "cl-50ae6b4244af", "cl-6510be27c057"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model states some claims with status 'conflicted' as settled fact. The mechanism's 'not by CPU ... or longer retention' rests on cl-0d0c262cc2c9 and cl-ab72a6be117f (q750, conflicted). The limit that a queue can be deleted while it still holds messages rests on cl-26a496b56151 (conflicted). The limit that a VPC-bound caller needs an SQS interface endpoint rests on cl-036c4f066762 (conflicted). None of these carry a caveat.", "related_entity_ids": ["aws-sysops-service-app-integration-deployment--m-1", "cl-0d0c262cc2c9", "cl-ab72a6be117f", "cl-c5666c0c7929", "cl-26a496b56151", "cl-036c4f066762"]}, {"type": "unsupported-generation", "severity": "medium", "description": "Mental model invariant 'RDS event notifications and CloudWatch alarm actions are delivered through SNS topics' overgeneralizes. CloudWatch alarm actions also include Auto Scaling policy and EC2 actions that bypass SNS, which the same model relies on when it scales an ASG from an ApproximateNumberOfMessagesVisible alarm (cl-d3017bf37441). The source claims (cl-958bcecd774d, cl-8075cf682ebf) support SNS as one alarm action, not as the only delivery path.", "related_entity_ids": ["aws-sysops-service-app-integration-deployment--m-1", "cl-958bcecd774d", "cl-8075cf682ebf", "cl-d3017bf37441"]}, {"type": "unsupported-generation", "severity": "low", "description": "The contrast set cites cl-ace019c49d97 (low confidence, conflicted) for its CPU-alarm boundary flip. The SNS endpoint list in both the mental model and the contrast set rests on cl-fb020a2db02e (conflicted), and the contrast set's list also leaves out Data Firehose, which that claim includes.", "related_entity_ids": ["aws-sysops-service-app-integration-deployment--cs-1", "aws-sysops-service-app-integration-deployment--m-1", "cl-ace019c49d97", "cl-fb020a2db02e"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-02415a0c52c2 claims with high confidence that ELB and CloudFormation cannot reach on-premises resources. This overgeneralizes: ALB and NLB can register on-premises IP targets over VPN or Direct Connect, and CloudFormation custom resources can act outside AWS. The q186 source only supports these not being the right answer in that scenario.", "related_entity_ids": ["cl-02415a0c52c2"]}, {"type": "stale-risk", "severity": "medium", "description": "q226 has era-dependent answers. One claim says SNS sent CloudWatch metrics only every 5 minutes (cl-d13dab4cfb76). Another says 1-minute metrics became the default in January 2021 (cl-697df4971aec). Both are conflicted, so the correct exam answer depends on which era is assumed and is unresolved.", "related_entity_ids": ["cl-d13dab4cfb76", "cl-697df4971aec", "cl-2d531b559aaf"]}, {"type": "stale-risk", "severity": "medium", "description": "q929's Spot Fleet allocation claims are conflicted. Older documentation recommended lowestPrice with InstancePoolsToUseCount for cost; AWS now marks lowestPrice as not recommended and recommends priceCapacityOptimized. The cost-optimization answer depends on the documentation era.", "related_entity_ids": ["cl-143136e6a8eb", "cl-18cecd65745c", "cl-1b370fc84525"]}, {"type": "stale-risk", "severity": "low", "description": "q142 and the mental model's predict prompt rely on RDS 'DB security groups'. These were an EC2-Classic construct, and EC2-Classic has been retired; current RDS uses VPC security groups.", "related_entity_ids": ["cl-6bc13202bbf9", "aws-sysops-service-app-integration-deployment--m-1"]}, {"type": "quality", "severity": "low", "description": "cl-0c850204c75d is an ingestion-policy meta-statement about how disputed questions are triaged, not exam knowledge about Lambda, SQS, or RDS. It should not be a claim. Its presence also signals that q840's boxed answer is disputed, which leaves the other q840 claims (cl-036c4f066762, cl-eabfc6c47e91, cl-f34aafa5d9c0, cl-b273a9a19c4b) unresolved.", "related_entity_ids": ["cl-0c850204c75d", "cl-036c4f066762", "cl-eabfc6c47e91", "cl-f34aafa5d9c0", "cl-b273a9a19c4b"]}, {"type": "stale-risk", "severity": "low", "description": "Several claims depend on product-lifecycle facts that are conflicted or time-sensitive: Elastic Transcoder discontinuation (cl-ff69cbb99907), AWS Server Migration Service retirement (cl-ab56ca17ba8c), the WorkSpaces bundle list (cl-b0c2889bde8e) and the Elastic Beanstalk platform list (cl-094545b083f9).", "related_entity_ids": ["cl-ff69cbb99907", "cl-ab56ca17ba8c", "cl-b0c2889bde8e", "cl-094545b083f9"]}], "sourceQuestionCount": 43}], "sources": {"kind": "locked", "file": "aws-sysops-service-app-integration-4dnf.sources.enc.js"}}</script>
