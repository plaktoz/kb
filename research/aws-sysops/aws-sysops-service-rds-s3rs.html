<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }
    ul.citations li { grid-template-columns: 1fr; gap: 0.3rem; }
    ul.diagnosis-history li { grid-template-columns: 1fr; gap: 0.3rem; }
    ul.diagnosis-history .badge { justify-self: start; }
    .segmented { display: flex; }
    .segmented label { flex: 1; text-align: center; }
    .sources-table { min-width: 0; }
    .sources-table thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    .sources-table tr.source-row {
      display: grid;
      grid-template-areas: "id answer" "stem stem" "status status";
      grid-template-columns: 1fr auto;
      gap: 0.35rem 0.75rem;
      padding: 0.85rem 0.9rem;
      border-bottom: 1px solid var(--line);
    }
    .sources-table tr.source-row > td { padding: 0; border: 0; }
    .sources-table .cell-id { grid-area: id; }
    .sources-table .cell-answer { grid-area: answer; }
    .sources-table .cell-stem { grid-area: stem; }
    .sources-table .cell-status { grid-area: status; color: var(--muted); font-size: 0.86rem; }
    .sources-table tr.detail-row, .sources-table tr.detail-row > td { display: block; }
    .sources-table tbody tr:last-child { border-bottom: 0; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 1, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-rds", "exam": "aws-sysops", "facet": {"key": "service", "value": "rds"}, "schemaVersion": 1}, "sourceQuestions": [{"id": "awssysops-p1-q009", "status": "active", "disputed": false, "stem": "Which two AWS services provide out-of-the-box user configurable automatic backup-as-a-service and backup rotation options? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Amazon S3"}, {"letter": "B", "text": "Amazon RDS"}, {"letter": "C", "text": "Amazon EBS"}, {"letter": "D", "text": "Amazon Redshift"}], "correct_answer": ["B", "D"], "source_correct_answer": ["B", "D"], "correct_answer_override": null, "explanation": "RDS and Redshift both include built-in, user-configurable automated backups with a rotation/retention window out of the box (RDS defaults to 1-day retention, Redshift similarly) -- no extra service needed. S3 requires you to build replication/versioning-based backup yourself, and EBS snapshots were only automatable via Data Lifecycle Manager starting mid-2018 -- likely after this question was written, so at the time EBS didn't yet offer this out-of-the-box.", "facets": {"service": ["RDS", "Redshift"], "concern": ["backup", "disaster-recovery"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 14, "question_number": 9}, "fingerprint": "536df682a6255c2a8e4af4abf3f1dae9e32decf2663df48cd76a14cefe3c336d"}, {"id": "awssysops-p1-q010", "status": "active", "disputed": false, "stem": "An organization has configured a VPC with an Internet Gateway (IGW), pairs of public and private subnets (each with one subnet per Availability Zone), and an Elastic Load Balancer (ELB) configured to use the public subnets. The application's web tier leverages the ELB, Auto Scaling, and a multi-AZ RDS database instance. The organization would like to eliminate any potential single points of failure in this design.\n\nWhat step should you take to achieve this organization's objective?", "choice_type": "single", "choices": [{"letter": "A", "text": "Nothing, there are no single points of failure in this architecture."}, {"letter": "B", "text": "Create and attach a second IGW to provide redundant internet connectivity."}, {"letter": "C", "text": "Create and configure a second Elastic Load Balancer to provide a redundant load balancer."}, {"letter": "D", "text": "Create a second multi-AZ RDS instance in another Availability Zone and configure replication to provide a redundant database."}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "IGWs, ELBs, and multi-AZ RDS instances are all AWS-managed and already highly available by design -- an IGW is inherently redundant at the VPC level, an ELB spans multiple AZs automatically, and a multi-AZ RDS instance already fails over to a standby in a second AZ. Since the architecture as described already uses multi-AZ RDS, there's no remaining single point of failure to fix -- adding a second IGW, a second ELB, or a second multi-AZ RDS instance would be redundant work solving a problem that doesn't exist.", "facets": {"service": ["VPC", "ELB", "Auto Scaling", "RDS"], "concern": ["availability", "high-availability"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 15, "question_number": 10}, "fingerprint": "0fdc2df37883c333c11a901eaae865f1eee384fd570f21af73366dcccf5ad810"}, {"id": "awssysops-p1-q014", "status": "active", "disputed": false, "stem": "You have a web application leveraging an Elastic Load Balancer (ELB) in front of the web servers deployed using an Auto Scaling Group. Your database is running on Relational Database Service (RDS). The application serves out technical articles and responses to them; in general there are more views of an article than there are responses to the article. On occasion, an article on the site becomes extremely popular resulting in significant traffic increases that causes the site to go down.\n\nWhat could you do to help alleviate the pressure on the infrastructure while maintaining availability during these events? (Choose three.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Leverage CloudFront for the delivery of the articles."}, {"letter": "B", "text": "Add RDS read-replicas for the read traffic going to your relational database"}, {"letter": "C", "text": "Leverage ElastiCache for caching the most frequently used data."}, {"letter": "D", "text": "Use SQS to queue up the requests for the technical posts and deliver them out of the queue."}, {"letter": "E", "text": "Use Route53 health checks to fail over to an S3 bucket for an error page."}], "correct_answer": ["A", "B", "C"], "source_correct_answer": ["A", "B", "C"], "correct_answer_override": null, "explanation": "This is a classic flash-traffic-on-read-heavy-content scaling pattern: CloudFront caches and serves the article content at the edge so a traffic spike doesn't hit your origin at all (A), RDS read replicas absorb the read traffic when it does reach the database tier (B), and ElastiCache caches the hottest data in front of RDS to cut database load further (C). Queuing requests through SQS (D) doesn't fit a read-heavy 'serve an article' workload -- that pattern suits asynchronous write/processing workloads, not synchronous page reads -- and failing over to a static S3 error page (E) sidesteps the availability problem rather than solving the underlying capacity pressure.", "facets": {"service": ["CloudFront", "RDS", "ElastiCache"], "concern": ["scaling", "performance", "availability"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 21, "question_number": 14}, "fingerprint": "3f218ddacfdf4e82e4b2c8e14bc611cde105e45811f32ec340557eb97fe93810"}, {"id": "awssysops-p1-q016", "status": "active", "disputed": false, "stem": "You need to design a VPC for a web-application consisting of an Elastic Load Balancer (ELB), a fleet of web/application servers, and an RDS database. The entire infrastructure must be distributed over 2 availability zones.\n\nWhich VPC configuration works while assuring the database is not available from the internet?", "choice_type": "single", "choices": [{"letter": "A", "text": "One public subnet for ELB, one public subnet for the web-servers, and one private subnet for the database"}, {"letter": "B", "text": "One public subnet for ELB, two private subnets for the web-servers, two private subnets for RDS"}, {"letter": "C", "text": "Two public subnets for ELB, two private subnets for the web-servers, and two private subnets for RDS"}, {"letter": "D", "text": "Two public subnets for ELB, two public subnets for the web-servers, and two public subnets for RDS"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Because the infrastructure must span 2 AZs and subnets can't cross AZ boundaries, achieving 2-AZ coverage for the ELB itself requires two public subnets (one per AZ) in addition to two private subnets for the app tier and two more for RDS -- which is what the boxed answer (C) reflects. The community is fairly split here: several argue a single public subnet is enough since one ELB can already span multiple AZs on its own, wanting only the app/DB tiers duplicated (favoring B) -- but ELB still needs a subnet registered in each AZ it operates in, so C better satisfies the literal 'distributed over 2 AZs' requirement. Either way, keeping RDS out of any public subnet (ruling out D) and giving the DB tier its own private subnets (ruling out A, which puts web servers in a public subnet) are the two constraints everyone agrees on.", "facets": {"service": ["VPC", "ELB", "RDS"], "concern": ["networking", "availability"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 23, "question_number": 16}, "fingerprint": "1d14253983035ffec59cf62352663e1a9d47f21b78e343b5d2403f5ad1ad8845"}, {"id": "awssysops-p1-q039", "status": "active", "disputed": true, "stem": "You have been asked to automate many routine systems administrator backup and recovery activities. Your current plan is to leverage AWS-managed solutions as much as possible and automate the rest with the AWS CLI and scripts.\n\nWhich task would be best accomplished with a script?", "choice_type": "single", "choices": [{"letter": "A", "text": "Creating daily EBS snapshots with a monthly rotation of snapshots"}, {"letter": "B", "text": "Creating daily RDS snapshots with a monthly rotation of snapshots"}, {"letter": "C", "text": "Automatically detect and stop unused or underutilized EC2 instances"}, {"letter": "D", "text": "Automatically add Auto Scaled EC2 instances to an Amazon Elastic Load Balancer"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "The source's boxed answer is A (scripting daily EBS snapshot creation with monthly rotation), but the community is split evenly with C (a script to detect and stop underutilized EC2 instances). There's a real case for both, plus a strong argument that this question is simply outdated: Amazon Data Lifecycle Manager, launched in 2018, now automates exactly the EBS snapshot/rotation lifecycle in A without any scripting, and RDS already automates its own backup/retention out of the box (ruling out B either way). If the question predates DLM, A was the correct 'needs a script' gap at the time; read against AWS's current managed-service surface, C is arguably the better fit today, since there's still no built-in AWS service that detects and stops idle/underutilized instances -- that genuinely still requires custom scripting, unlike D which Auto Scaling + ELB already handle natively. Recorded here as the source's boxed A; flagged disputed given the even split and likely question staleness.", "facets": {"service": ["EBS", "RDS"], "concern": ["backup", "automation"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 52, "question_number": 39}, "fingerprint": "21604856d0609b3cf4dd6262684dd0bcfe79994c885c985c86393f23ccddd71a"}, {"id": "awssysops-p1-q042", "status": "active", "disputed": false, "stem": "You receive a frantic call from a new DBA who accidentally dropped a table containing all your customers.\n\nWhich Amazon RDS feature will allow you to reliably restore your database to within 5 minutes of when the mistake was made?", "choice_type": "single", "choices": [{"letter": "A", "text": "Multi-AZ RDS"}, {"letter": "B", "text": "RDS snapshots"}, {"letter": "C", "text": "RDS read replicas"}, {"letter": "D", "text": "RDS automated backup"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "RDS automated backups enable point-in-time recovery: RDS continuously backs up transaction logs in addition to the daily snapshot, letting you restore to any second within your retention window, typically as recent as 5 minutes ago (D). A manual RDS snapshot (B) only captures whatever moment the last snapshot was taken, not necessarily right before the mistake. Multi-AZ (A) protects against infrastructure failure, not application-level mistakes like a dropped table -- the standby is a synchronous replica, so it would have the dropped table too. Read replicas (C) also just mirror the primary, including the accidental drop. Reference: docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIT.html", "facets": {"service": ["RDS"], "concern": ["backup", "disaster-recovery"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 58, "question_number": 42}, "fingerprint": "86f2ddcfa77806d65c24fa4946c7a3730b7b5615b2a6362d9722543da84143ef"}, {"id": "awssysops-p1-q081", "status": "active", "disputed": false, "stem": "A system admin is planning to setup event notifications on RDS. Which of the below mentioned services will help the admin setup notifications?", "choice_type": "single", "choices": [{"letter": "A", "text": "AWS SES"}, {"letter": "B", "text": "AWS CloudTrail"}, {"letter": "C", "text": "AWS CloudWatch"}, {"letter": "D", "text": "AWS SNS"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D (unanimous community vote, 100%). RDS event notifications are delivered through SNS: you subscribe an endpoint (email, SMS, HTTP, or an SQS queue) to an SNS topic, and RDS publishes to that topic whenever a supported event occurs (e.g. failover, backup completion, storage change). CloudWatch (C) monitors metrics/logs and can alarm on thresholds, but RDS's native event-notification mechanism specifically is SNS-based; CloudTrail (B) records API calls/management events, not RDS operational events; SES (A) only sends email and isn't RDS's notification transport at all.", "facets": {"service": ["RDS", "SNS"], "concern": ["notifications", "events"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 105, "question_number": 81}, "fingerprint": "51ccfa5ae2a0f1863dc2876cb15bd752ea5da0dce4c26e15f90b5dfc30ee99cb"}, {"id": "awssysops-p1-q101", "status": "active", "disputed": false, "stem": "A user is planning to setup notifications on the RDS DB for a snapshot. Which of the below mentioned event categories is not supported by RDS for this snapshot source type?", "choice_type": "single", "choices": [{"letter": "A", "text": "Backup"}, {"letter": "B", "text": "Creation"}, {"letter": "C", "text": "Deletion"}, {"letter": "D", "text": "Restoration"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A. RDS event notifications for the db-snapshot source type cover Creation, Deletion, and Restoration -- Backup is not one of the categories tracked for snapshots, because 'Backup' is instead an event category belonging to the db-instance source type (automated backups are a DB-instance-level operation, distinct from a snapshot). The community discussion (karmaah's 'snapshot and backup are different' hint, and the CLI's describe-event-categories output for db-snapshot) confirms creation/deletion/restoration/notification are the real snapshot categories, with no backup category listed there.", "facets": {"service": ["RDS"], "concern": ["event-notifications"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 126, "question_number": 101}, "fingerprint": "f1ea067d1e495d9790bc87922a877535cc69c4055adf7272c6aa4167c0ea34e5"}, {"id": "awssysops-p1-q104", "status": "active", "disputed": false, "stem": "A user is accessing RDS from an application. The user has enabled the Multi AZ feature with the MS SQL RDS DB. During a planned outage how will AWS ensure that a switch from DB to a standby replica will not affect access to the application?", "choice_type": "single", "choices": [{"letter": "A", "text": "RDS will have an internal IP which will redirect all requests to the new DB"}, {"letter": "B", "text": "RDS uses DNS to switch over to stand by replica for seamless transition"}, {"letter": "C", "text": "The switch over changes Hardware so RDS does not need to worry about access"}, {"letter": "D", "text": "RDS will have both the DBs running independently and the user has to manually switch over"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B (unanimous community vote, 100%). Multi-AZ RDS failover works by flipping the DB instance's DNS record to point at the standby replica in another Availability Zone -- the application keeps using the same endpoint hostname throughout, so once the DNS change propagates, traffic seamlessly reaches the new primary without any application-side reconfiguration (aside from re-establishing any already-open connections). A is wrong because there's no special internal-IP redirect mechanism -- it's DNS-based. C is wrong because failover doesn't literally swap hardware transparently; the DNS switch is what does the work. D is wrong because failover is automatic, not something the user manually triggers.", "facets": {"service": ["RDS"], "concern": ["multi-az", "failover"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 129, "question_number": 104}, "fingerprint": "e175a8f31e4ce1e486481f2cf00af90ba1329061e3d3eaf8922fc16b0275d3b2"}, {"id": "awssysops-p1-q113", "status": "active", "disputed": true, "stem": "A user has enabled the Multi AZ feature with the MS SQL RDS database server. Which of the below mentioned statements will help the user understand the Multi AZ feature better?", "choice_type": "single", "choices": [{"letter": "A", "text": "In a Multi AZ, AWS runs two DBs in parallel and copies the data asynchronously to the replica copy"}, {"letter": "B", "text": "In a Multi AZ, AWS runs two DBs in parallel and copies the data synchronously to the replica copy"}, {"letter": "C", "text": "In a Multi AZ, AWS runs just one DB but copies the data synchronously to the standby replica"}, {"letter": "D", "text": "AWS MS SQL does not support the Multi AZ feature"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Boxed answer: C. The community vote is fragmented 50/50 between B and C. Per AWS documentation, Multi-AZ RDS provisions a standby replica in a different AZ and keeps it current via synchronous replication -- the primary is the only instance actively serving traffic (the standby cannot serve read traffic), which matches C's framing of 'one DB, copied synchronously to a standby.' B's framing of 'two DBs running in parallel' is a looser description of the same underlying mechanism that some read as implying both instances are equally active, which they are not -- only the primary handles the workload. Given the 50/50 vote, this is marked disputed even though the documentation (linked directly by two commenters, including one who switched their own vote from B to C after re-checking the docs) leans toward C.", "facets": {"service": ["RDS"], "concern": ["multi-az", "replication"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 139, "question_number": 113}, "fingerprint": "c60bdc135aba2ff5eeba0d83cb30b8c480abbd4dd226056788a4ee8df5c86331"}, {"id": "awssysops-p1-q142", "status": "active", "disputed": false, "stem": "A user has setup an RDS DB with Oracle. The user wants to get notifications when someone modifies the security group of that DB. How can the user configure that?", "choice_type": "single", "choices": [{"letter": "A", "text": "It is not possible to get the notifications on a change in the security group"}, {"letter": "B", "text": "Configure SNS to monitor security group changes"}, {"letter": "C", "text": "Configure event notification on the DB security group"}, {"letter": "D", "text": "Configure the CloudWatch alarm on the DB for a change in the security group"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous community vote, 100%). RDS has a built-in event notification subscription system (backed by SNS under the hood) that can be scoped to a source category like 'DB security group' -- subscribing to its Configuration Change category delivers a notification whenever that security group is modified. This is the purpose-built mechanism for exactly this scenario, so it's more direct than manually wiring up SNS monitoring yourself (B) or trying to route this through a CloudWatch alarm (D), which doesn't observe security-group configuration changes at all. A is simply wrong since RDS event notifications support this out of the box.", "facets": {"service": ["RDS", "SNS"], "concern": ["event-notifications", "security-groups"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 171, "question_number": 142}, "fingerprint": "191c2e242aa34fd837a66c1237e76838df97ebc49de165cb0ac6924e285d97e4"}, {"id": "awssysops-p1-q155", "status": "active", "disputed": false, "stem": "An AWS root account owner is trying to create a policy to access RDS. Which of the below mentioned statements is true with respect to the above information?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create a policy which allows the users to access RDS and apply it to the RDS instances"}, {"letter": "B", "text": "The user cannot access the RDS database if he is not assigned the correct IAM policy"}, {"letter": "C", "text": "The root account owner should create a policy for the IAM user and give him access to the RDS services"}, {"letter": "D", "text": "The policy should be created for the user and provide access for RDS"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C. IAM policies are attached to IAM identities (users, groups, roles) to grant them permissions on AWS services -- they cannot be attached directly to an RDS instance the way A implies, and RDS database-level access (authenticating to the actual database engine) is a separate concern from IAM permissions to manage RDS via the AWS API, which is what makes B misleading (it conflates the two). C correctly frames the action as the root account owner creating an IAM user and attaching a policy that grants that user access to RDS management actions. D is vaguer than C and doesn't specify whether 'the user' means an IAM user or a database user, which is the ambiguity C avoids by being explicit.", "facets": {"service": ["IAM", "RDS"], "concern": ["policy-attachment"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 184, "question_number": 155}, "fingerprint": "557129959f1c68b13d3ee31b4bfe1b8d25725dee216dc4d64528bbd3dcdf9d2b"}, {"id": "awssysops-p1-q156", "status": "active", "disputed": true, "stem": "A user is using a small MySQL RDS DB. The user is experiencing high latency due to the Multi AZ feature. Which of the below mentioned options may not help the user in this situation?", "choice_type": "single", "choices": [{"letter": "A", "text": "Schedule the automated back up in non-working hours"}, {"letter": "B", "text": "Use a large or higher size instance"}, {"letter": "C", "text": "Use PIOPS"}, {"letter": "D", "text": "Take a snapshot from standby Replica"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Boxed answer: D. Community vote is a genuine three-way split -- A, B, and D each at 33% -- with no option reaching a majority, let alone 60%. The underlying cause of the latency is synchronous replication to the standby in a Multi-AZ deployment; AWS's own guidance for mitigating this recommends using provisioned IOPS and larger instance classes (both optimized for consistent, low-latency I/O under sync replication) and scheduling automated backups outside peak hours (since backups on a Multi-AZ instance are taken from the standby and can otherwise coincide with other load). That leaves D -- taking a snapshot from the standby replica -- as arguably orthogonal to the write-latency problem (it's a read-only operation against the replica, not a write-path change), which is the reasoning behind the boxed answer. But several commenters push back that D wouldn't meaningfully change latency either way, and others argue B or A are the true 'won't help' options since the instance is already 'small' and may not be the bottleneck, or since backup timing doesn't address the root sync-replication cause at all. Given the fragmented vote, this is marked disputed.", "facets": {"service": ["RDS"], "concern": ["multi-az", "latency"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 185, "question_number": 156}, "fingerprint": "fb8900e6f2f2140d2a1f530f6f0c3d3b30d8242dcb3637d4490eceb9fbbeb578"}, {"id": "awssysops-p1-q169", "status": "active", "disputed": false, "stem": "A user has launched an RDS postgreSQL DB with AWS. The user did not specify the maintenance window during creation. The user has configured RDS to update the DB instance type from micro to large. If the user wants to have it during the maintenance window, what will AWS do?", "choice_type": "single", "choices": [{"letter": "A", "text": "AWS will not allow to update the DB until the maintenance window is configured"}, {"letter": "B", "text": "AWS will select the default maintenance window if the user has not provided it"}, {"letter": "C", "text": "AWS will ask the user to specify the maintenance window during the update"}, {"letter": "D", "text": "It is not possible to change the DB size from micro to large with RDS"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B. Every RDS instance always has a maintenance window -- if the user never explicitly sets one, AWS randomly assigns a 30-minute window from an 8-hour regional block on a random day of the week, rather than leaving it unset or blocking changes. A and D both wrongly assume a missing maintenance window blocks or prevents the requested DB instance-class change. C is wrong since AWS doesn't prompt the user for a window at update time -- it simply uses whatever window is already in effect (default or custom).", "facets": {"service": ["RDS"], "concern": ["maintenance-window"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 197, "question_number": 169}, "fingerprint": "a1a64cc40a8058937b1ce38f0a4efca88dbc3c29f8342e1f395558cada45c819"}, {"id": "awssysops-p1-q175", "status": "active", "disputed": false, "stem": "A user is planning to set up the Multi AZ feature of RDS. Which of the below mentioned conditions won't take advantage of the Multi AZ feature?", "choice_type": "single", "choices": [{"letter": "A", "text": "Availability zone outage"}, {"letter": "B", "text": "A manual failover of the DB instance using Reboot with failover option"}, {"letter": "C", "text": "Region outage"}, {"letter": "D", "text": "When the user changes the DB instance's server type"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C. RDS Multi-AZ automatically fails the primary over to its standby within the same region for an AZ outage, a primary DB instance failure, server-type changes, software patching, or a manual reboot-with-failover -- but the standby is always provisioned in a different AZ of the same region, not a different region entirely, so a region-wide outage would take down both the primary and the standby together, giving Multi-AZ no protection against it. A, B, and D are all explicitly listed triggers that Multi-AZ does handle via automatic failover.", "facets": {"service": ["RDS"], "concern": ["multi-az", "failover-triggers"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 203, "question_number": 175}, "fingerprint": "8916d54128b10fdf8c642c758b2c9d78c4bb5f43cb5597dcbeb43cb7e26e6145"}, {"id": "awssysops-p1-q199", "status": "active", "disputed": false, "stem": "A user is configuring a CloudWatch alarm on RDS to receive a notification when the CPU utilization of RDS is higher than 50%. The user has setup an alarm when there is some inactivity on RDS, such as RDS unavailability. How can the user configure this?", "choice_type": "single", "choices": [{"letter": "A", "text": "Setup the notification when the CPU is more than 75% on RDS"}, {"letter": "B", "text": "Setup the notification when the state is Insufficient Data"}, {"letter": "C", "text": "Setup the notification when the CPU utilization is less than 10%"}, {"letter": "D", "text": "It is not possible to setup the alarm on RDS"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B, though several commenters flagged the question itself as confusingly worded: the opening sentence about a 50%-CPU alarm is a distractor and unrelated to what's actually being asked -- the real question is how to detect RDS 'inactivity/unavailability' specifically, not high or low CPU. An alarm moves to the Insufficient Data state when its underlying metric stops reporting data at all, which is exactly the signature of RDS being unavailable -- so alerting on that state (B) is the correct way to catch it. A and C both describe CPU-threshold conditions, which reflect utilization levels, not unavailability. D is wrong since RDS alarms are fully supported.", "facets": {"service": ["CloudWatch", "RDS"], "concern": ["insufficient-data-state"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 227, "question_number": 199}, "fingerprint": "3142a653d63832abee96daa3381e55adf48c73fb22e22b0c65b46a244dafd571"}, {"id": "awssysops-p1-q215", "status": "active", "disputed": false, "stem": "A user has launched an RDS MySQL DB with the Multi AZ feature. The user has scheduled the scaling of instance storage during maintenance window. What is the correct order of events during maintenance window?\n1. Perform maintenance on standby\n2. Promote standby to primary\n3. Perform maintenance on original primary\n4. Promote original master back as primary", "choice_type": "single", "choices": [{"letter": "A", "text": "1, 2, 3, 4"}, {"letter": "B", "text": "1, 2, 3"}, {"letter": "C", "text": "2, 3, 1, 4"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B, confirmed by AWS documentation linked in a comment. For a Multi-AZ RDS deployment, AWS performs maintenance first on the standby, then promotes that now-patched standby to primary, then performs maintenance on the original primary -- which simply becomes the new standby at that point. There is no step 4: since the standby was already promoted to primary in step 2, the original primary does not get promoted back: it settles into the standby role instead, which is exactly why option A (which tacks on step 4) is wrong, as one commenter explicitly notes. C reorders the steps incorrectly, starting with the promotion before any maintenance has occurred.", "facets": {"service": ["RDS"], "concern": ["multi-az-maintenance"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 243, "question_number": 215}, "fingerprint": "1e1aec4cbf326e5dd677174ef5be058f69f0cfd424e5c2db2eb5e543b502a171"}, {"id": "awssysops-p1-q222", "status": "active", "disputed": false, "stem": "A sys admin is planning to subscribe to the RDS event notifications. For which of the below mentioned source categories the subscription cannot be configured?", "choice_type": "single", "choices": [{"letter": "A", "text": "DB security group"}, {"letter": "B", "text": "DB snapshot"}, {"letter": "C", "text": "DB options group"}, {"letter": "D", "text": "DB parameter group"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous formatted community vote, 100%), confirmed by AWS documentation linked in two comments. RDS event notification source categories include DB instance, DB security group, DB snapshot, and DB parameter group -- 'DB options group' is not one of the documented source categories subscriptions can target. A, B, and D are all explicitly supported source categories.", "facets": {"service": ["RDS"], "concern": ["event-notification-categories"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 250, "question_number": 222}, "fingerprint": "6f963df88029dfa2a275eb2629bb32c62600cc889138cda0807529afc5ba58d3"}, {"id": "awssysops-p1-q228", "status": "active", "disputed": false, "stem": "A user wants to find the particular error that occurred on a certain date in the AWS MySQL RDS DB. Which of the below mentioned activities may help the user to get the data easily?", "choice_type": "single", "choices": [{"letter": "A", "text": "It is not possible to get the log files for MySQL RDS"}, {"letter": "B", "text": "Find all the transaction logs and query on those records"}, {"letter": "C", "text": "Direct the logs to the DB table and then query that table"}, {"letter": "D", "text": "Download the log file to DynamoDB and search for the record"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous formatted community vote, 100%). RDS MySQL logs (error, slow query, general) can be viewed via the console, CLI, or API, and one convenient technique for searching by date or other criteria is directing the logs to a database table within the main database and querying that table with normal SQL. A is wrong since MySQL RDS log files are directly accessible. B describes transaction logs, which aren't the mechanism used for error-log searching here. D invents routing logs to DynamoDB, which isn't how RDS log export/querying actually works.", "facets": {"service": ["RDS"], "concern": ["mysql-log-querying"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 256, "question_number": 228}, "fingerprint": "d8fc9cbe0cbb1b8995bbc2ae3dffdf608ec290982f5c2534766db69bce053db8"}, {"id": "awssysops-p1-q233", "status": "active", "disputed": false, "stem": "A user is configuring the Multi AZ feature of an RDS DB. The user came to know that this RDS DB does not use the AWS technology, but uses server mirroring to achieve HA. Which DB is the user using right now?", "choice_type": "single", "choices": [{"letter": "A", "text": "MySQL"}, {"letter": "B", "text": "Oracle"}, {"letter": "C", "text": "MS SQL"}, {"letter": "D", "text": "PostgreSQL"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C, confirmed by the reference passage: Multi-AZ deployments for Oracle, PostgreSQL, and MySQL DB instances use Amazon's own synchronous-replica technology, while SQL Server (MS SQL) Multi-AZ deployments instead use SQL Server's own native Mirroring feature for HA -- exactly matching the question's description of a DB engine that 'does not use the AWS technology.' A, B, and D are the three engines explicitly listed in the passage as using AWS's own Multi-AZ technology, not third-party mirroring.", "facets": {"service": ["RDS"], "concern": ["multi-az-ha-mechanism"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 261, "question_number": 233}, "fingerprint": "58d0bb3d51aeafc9f427d4f26e60c015a7d0e4ff3eeefe498ca19fc89ecdfa9a"}, {"id": "awssysops-p1-q234", "status": "active", "disputed": false, "stem": "A user is receiving a notification from the RDS DB whenever there is a change in the DB security group. The user does not want to receive these notifications for only a month. Thus, he does not want to delete the notification. How can the user configure this?", "choice_type": "single", "choices": [{"letter": "A", "text": "Change the Disable button for notification to \"Yes\" in the RDS console"}, {"letter": "B", "text": "Set the send mail flag to false in the DB event notification console"}, {"letter": "C", "text": "The only option is to delete the notification from the console"}, {"letter": "D", "text": "Change the Enable button for notification to \"No\" in the RDS console"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D (unanimous formatted community vote, 100%). RDS event notifications can be turned off temporarily without deleting the underlying subscription by setting the Enabled toggle to No in the console (or the Enabled parameter to false via CLI/API) -- exactly D. A describes the same underlying toggle but mislabels it as a 'Disable' button set to 'Yes', which doesn't match the actual console control (an 'Enabled' toggle set to No). B invents a 'send mail flag' that isn't the real parameter name. C wrongly claims deletion is the only option, when disabling is explicitly supported.", "facets": {"service": ["RDS", "SNS"], "concern": ["event-subscription-toggle"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 262, "question_number": 234}, "fingerprint": "44042ecfa9a645b92021f1b3df5953368a16e9f2b5b6f68b5488196073f57b3c"}, {"id": "awssysops-p1-q263", "status": "active", "disputed": false, "stem": "A user has scheduled the maintenance window of an RDS DB on Monday at 3 AM. Which of the below mentioned events may force to take the DB instance offline during the maintenance window?", "choice_type": "single", "choices": [{"letter": "A", "text": "Enabling Read Replica"}, {"letter": "B", "text": "Making the DB Multi AZ"}, {"letter": "C", "text": "DB password change"}, {"letter": "D", "text": "Security patching"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D. No formatted community vote is present, but both comments agree without contention. Per the reference passage, only scaling-compute operations and required security/durability software patching can force an RDS instance offline during its maintenance window -- and patching occurs infrequently, using only a fraction of the window. A (enabling a read replica), B (converting to Multi-AZ), and C (a password change) are all routine configuration actions that don't require taking the primary instance offline.", "facets": {"service": ["RDS"], "concern": ["maintenance-window-offline-events"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 292, "question_number": 263}, "fingerprint": "5a8dfcbd47320f3539320c972b71b55f19718618f47557baeeb8c4dd1d935b7a"}, {"id": "awssysops-p1-q272", "status": "active", "disputed": false, "stem": "Which of the below mentioned AWS RDS logs cannot be viewed from the console for MySQL?", "choice_type": "single", "choices": [{"letter": "A", "text": "Error Log"}, {"letter": "B", "text": "Slow Query Log"}, {"letter": "C", "text": "Transaction Log"}, {"letter": "D", "text": "General Log"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C. No formatted community vote is present, but both comments agree without contention. For MySQL RDS, the console (as well as CLI/API) exposes the error log, slow query log, and general log -- but not the raw transaction log, which RDS does not surface for viewing. A, B, and D are all logs that RDS does make visible.", "facets": {"service": ["RDS"], "concern": ["mysql-log-console-visibility"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 301, "question_number": 272}, "fingerprint": "19706a5c62355e287df8dea950aa1dd70721037a4f6269131f0ad67f352c1b99"}, {"id": "awssysops-p2-q305", "status": "active", "disputed": false, "stem": "Which services allow the customer to retain administrative privileges on the underlying EC2 instances? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "AWS Elastic Beanstalk"}, {"letter": "B", "text": "Amazon Elastic Map Reduce"}, {"letter": "C", "text": "Elastic Load Balancing"}, {"letter": "D", "text": "Amazon Relational Database Service"}, {"letter": "E", "text": "Amazon Elastic Cache"}], "correct_answer": ["A", "B"], "source_correct_answer": ["A", "B"], "correct_answer_override": null, "explanation": "Boxed answer: A, B. Both Elastic Beanstalk and EMR provision EC2 instances the customer can still directly administer (SSH in, install software, root access), unlike ElastiCache, RDS, and ELB, which are fully managed with no customer access to the underlying compute. This matches the authoritative list quoted in a comment (darkness0710): 'AWS Services with Root Privileges: EC2, EMR, Elastic BeanStalk, OpsWorks.' This is flagged as a boxed-vs-vote conflict, though a thin one: the only comment with an explicit formatted 'Selected Answer' tally picks A, D (100% -- but from what appears to be a single voter), reasoning that RDS also lets customers 'retain administrative privileges.' That doesn't hold up technically, though -- RDS is a fully managed service specifically because AWS controls the underlying instance; customers get a database endpoint, not OS-level or root access to the host. The other two informal comments split further still (A+B matching boxed, and A+C), so there's no real consensus against the boxed answer here, just one technically shaky dissenting vote.", "facets": {"service": ["Elastic Beanstalk", "EMR", "ELB", "RDS", "ElastiCache"], "concern": ["services-retaining-instance-admin-access"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 6, "question_number": 305}, "fingerprint": "f5792d39c59e0a881e37501b28df2970ed99c4dc023e828f299a12b958d58fc6"}, {"id": "awssysops-p2-q311", "status": "active", "disputed": false, "stem": "You run a web application with the following components: Elastic Load Balancer (ELB), 3 Web/Application servers, 1 MySQL RDS database with read replicas, and Amazon Simple Storage Service (Amazon S3) for static content. Average response time for users is increasing slowly. What three CloudWatch RDS metrics will allow you to identify if the database is the bottleneck? (Choose three.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "The number of outstanding IOs waiting to access the disk."}, {"letter": "B", "text": "The amount of write latency."}, {"letter": "C", "text": "The amount of disk space occupied by binary logs on the master."}, {"letter": "D", "text": "The amount of time a Read Replica DB Instance lags behind the source DB Instance"}, {"letter": "E", "text": "The average number of disk I/O operations per second."}], "correct_answer": ["A", "B", "D"], "source_correct_answer": ["A", "B", "D"], "correct_answer_override": null, "explanation": "Boxed answer: A, B, D, but this is one of the most contentious questions encountered in this exam so far, with a genuinely three-way split. The first comment opens with a bare tally-like string, 'BDE (67%) ABE (33%),' but it lacks the standard 'Community vote distribution' header seen elsewhere in this exam, so it's treated here as informal narrative signal rather than a mechanically confirmed vote tally (hence not triggering disputed on its own). Separately, several distinctly-named commenters (antthomas, TroyMcLure, dennismp, awscertified) each independently select A, B, E instead of the boxed A, B, D -- a different combination from both the boxed answer and the bare BDE/ABE string above. Technically, A (outstanding IOs), B (write latency), and E (IOPS) are all direct load/performance metrics on the primary instance itself, making bottleneck detection straightforward; D (replica lag) instead measures replication freshness -- a comment (aksliveswithaws) makes the case that stale replica data doesn't by itself explain increasing average response time the way primary-instance load metrics do. C (binary log disk usage) is excluded by every commenter as a storage-usage metric unrelated to performance bottlenecks. Given the strength and independence of the ABE-favoring comments and the technical reasoning behind excluding D, A/B/E is arguably the better-supported answer, though the boxed A/B/D is kept as the source's stated answer and this conflict is flagged here rather than resolved by editing that field.", "facets": {"service": ["RDS", "CloudWatch"], "concern": ["rds-bottleneck-identification-metrics"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 13, "question_number": 311}, "fingerprint": "44aaf19ea7b1fb366bbfe7a003b82506ce9f99d91e4f9ca39e902e269e983e7a"}, {"id": "awssysops-p2-q314", "status": "active", "disputed": false, "stem": "Your business is building a new application that will store its entire customer database on a RDS MySQL database, and will have various applications and users that will query that data for different purposes. Large analytics jobs on the database are likely to cause other applications to not be able to get the query results they need to, before time out. Also, as your data grows, these analytics jobs will start to take more time, increasing the negative effect on the other applications. How do you solve the contention issues between these different workloads on the same data?", "choice_type": "single", "choices": [{"letter": "A", "text": "Enable Multi-AZ mode on the RDS instance"}, {"letter": "B", "text": "Use ElastiCache to offload the analytics job data"}, {"letter": "C", "text": "Create RDS Read-Replicas for the analytics work"}, {"letter": "D", "text": "Run the RDS instance on the largest size possible"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous formatted community vote, 100%), confirmed by the AWS RDS Read Replicas documentation linked in a comment. Directing analytics/reporting queries to a Read Replica isolates that workload from the primary instance, so heavy analytical queries no longer contend with (and risk timing out) the transactional queries hitting the primary. A (Multi-AZ) is for failover/availability, not workload separation -- the standby isn't query-accessible for offloading reads. B (ElastiCache) is a caching layer for frequently-read data, not a fit for large ad-hoc analytics jobs that need to scan/aggregate across the dataset. D (bigger instance) just delays the contention problem rather than solving it structurally, and doesn't scale as the data and job durations keep growing.", "facets": {"service": ["RDS", "ElastiCache"], "concern": ["read-replica-workload-isolation"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 16, "question_number": 314}, "fingerprint": "448f7766e3d761a7981c0611e86cd70eeee952a2cf12146696c6f93232df03fb"}, {"id": "awssysops-p2-q315", "status": "active", "disputed": false, "stem": "What would happen to an RDS (Relational Database Service) multi-Availability Zone deployment if the primary DB instance fails?", "choice_type": "single", "choices": [{"letter": "A", "text": "The IP of the primary DB Instance is switched to the standby DB Instance."}, {"letter": "B", "text": "A new DB instance is created in the standby availability zone."}, {"letter": "C", "text": "The canonical name record (CNAME) is changed from primary to standby."}, {"letter": "D", "text": "The RDS (Relational Database Service) DB instance reboots."}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous formatted community vote, 100%), confirmed by the AWS documentation linked in multiple comments. Multi-AZ failover works by updating the DNS CNAME record for the DB instance's endpoint to point at the standby (which is promoted to primary), rather than by moving an IP address or spinning up a brand-new instance. A wrongly describes an IP-switch mechanism (RDS uses DNS, not IP reassignment). B wrongly implies the standby doesn't already exist ahead of time -- it's already running and ready before failover. D is wrong since this is a failover to a distinct standby instance, not a reboot of the same instance.", "facets": {"service": ["RDS"], "concern": ["multi-az-failover-mechanism"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 17, "question_number": 315}, "fingerprint": "9d24ee845d1fb651c4047c7b2fd8121b582fbc3d7fc90bbdf581cfc2e2426b5c"}, {"id": "awssysops-p2-q325", "status": "active", "disputed": false, "stem": "Your mission is to create a lights-out datacenter environment, and you plan to use AWS OpsWorks to accomplish this. First you created a stack and added an App Server layer with an instance running in it. Next you added an application to the instance, and now you need to deploy a MySQL RDS database instance. Which of the following answers accurately describe how to add a backend database server to an OpsWorks stack? (Choose three.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Add a new database layer and then add recipes to the deploy actions of the database and App Server layers."}, {"letter": "B", "text": "Use OpsWorks' \"Clone Stack\" feature to create a second RDS stack in another Availability Zone for redundancy in the event of a failure in the Primary AZ. To switch to the secondary RDS instance, set the [:database] attributes to values that are appropriate for your server which you can do by using custom JSON."}, {"letter": "C", "text": "The variables that characterize the RDS database connection -- host, user, and so on -- are set using the corresponding values from the deploy JSON's [:deploy][:app_name][:database] attributes."}, {"letter": "D", "text": "Cookbook attributes are stored in a repository, so OpsWorks requires that the \"password\": \"your_password\" attribute for the RDS instance must be encrypted using at least a 256-bit key."}, {"letter": "E", "text": "Set up the connection between the app server and the RDS layer by using a custom recipe. The recipe configures the app server as required, typically by creating a configuration file. The recipe gets the connection data such as the host and database name from a set of attributes in the stack configuration and deployment JSON that AWS OpsWorks installs on every instance."}], "correct_answer": ["A", "C", "E"], "source_correct_answer": ["A", "C", "E"], "correct_answer_override": null, "explanation": "Correct answer: A, C, E. No formatted community vote is present -- the comment section is mostly off-topic (about course access), with a single dissenting informal comment (Monty85) picking A, B, E instead of the boxed A, C, E. A (adding a proper database layer with deploy recipes on both layers) and E (a custom recipe reading OpsWorks' own stack/deployment JSON attributes to configure the app server's connection) both describe real, standard OpsWorks database-integration patterns. C correctly describes how OpsWorks' deploy JSON structure exposes database connection variables to recipes. B is wrong because 'Clone Stack' duplicates an entire stack for a new environment (e.g., staging) -- it's not an RDS failover mechanism, and RDS Multi-AZ already handles AZ-level failover natively without needing a cloned OpsWorks stack. D invents a specific mandatory 256-bit encryption requirement for the password attribute that isn't an actual OpsWorks constraint (cookbook attribute encryption is a general good practice, not a hard requirement enforced by OpsWorks itself).", "facets": {"service": ["OpsWorks", "RDS"], "concern": ["opsworks-database-layer-recipe-attributes"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 28, "question_number": 325}, "fingerprint": "5efe5f76cc8d93938e53ab95ae78197abddb1151f618e58fe5a82930c4d692b1"}, {"id": "awssysops-p2-q353", "status": "active", "disputed": false, "stem": "What does Amazon RDS perform?", "choice_type": "single", "choices": [{"letter": "A", "text": "It tests the functionalities in websites."}, {"letter": "B", "text": "It blocks users from creating DB instances."}, {"letter": "C", "text": "It manages the work involved in setting up a relational database."}, {"letter": "D", "text": "It provides sensory feedback."}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C, confirmed by the AWS RDS FAQ linked in the passage. RDS manages the operational work of standing up a relational database, from provisioning infrastructure to installing the database engine software. A, B, and D don't describe any real RDS capability.", "facets": {"service": ["RDS"], "concern": ["rds-managed-service-definition"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 56, "question_number": 353}, "fingerprint": "920af04f61ae1334f96c05745ceb54800d5337733febaaf9fc8d279bba3acbc6"}, {"id": "awssysops-p2-q363", "status": "active", "disputed": false, "stem": "In Amazon RDS, which of the following provides enhanced availability and durability for Database (DB) Instances, making them to be a natural fit for production database workloads?", "choice_type": "single", "choices": [{"letter": "A", "text": "Placement Groups"}, {"letter": "B", "text": "Multi-Option Group deployment"}, {"letter": "C", "text": "Multi-AZ deployment"}, {"letter": "D", "text": "Multi-VPC deployment"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "RDS Multi-AZ deployments provision a primary DB instance and synchronously replicate data to a standby in a different Availability Zone, giving enhanced availability and durability suited to production workloads. See https://aws.amazon.com/rds/multi-az/.", "facets": {"service": ["RDS"], "concern": ["multi-az-availability"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 63, "question_number": 363}, "fingerprint": "05beb9b1fdb3ca941f6e9ef711a3b7d0f0e06c4d046f3a83501c4dbd14116f50"}, {"id": "awssysops-p2-q381", "status": "active", "disputed": false, "stem": "What does Amazon RDS stand for?", "choice_type": "single", "choices": [{"letter": "A", "text": "Amazon Regional Data Server"}, {"letter": "B", "text": "Amazon Regional Database Service"}, {"letter": "C", "text": "Amazon Relative Data Service"}, {"letter": "D", "text": "Amazon Relational Database Service"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "RDS stands for Amazon Relational Database Service — a managed, easy-to-scale relational database offering across six engines (Aurora, PostgreSQL, MySQL, MariaDB, Oracle, SQL Server) that offloads time-consuming database administration. See http://aws.amazon.com/rds/.", "facets": {"service": ["RDS"], "concern": ["rds-acronym"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 73, "question_number": 381}, "fingerprint": "48097d22f0441165ffc2ead04063264dd1ecceeb04dba78676fdb37307d275c1"}, {"id": "awssysops-p2-q438", "status": "active", "disputed": false, "stem": "Amazon RDS provides Amazon CloudWatch metrics for your DB Instance deployments at no additional charge. You can use the AWS Management Console to view key operational metrics for your DB Instance deployments, including ____.", "choice_type": "single", "choices": [{"letter": "A", "text": "I/O activity, DB Instance connections, and number of users"}, {"letter": "B", "text": "DB Engine Version Management"}, {"letter": "C", "text": "username, I/O activity, and DB Instance connections"}, {"letter": "D", "text": "compute/memory/storage capacity utilization, I/O activity, and DB Instance connections"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "RDS surfaces key operational CloudWatch metrics in the console at no extra charge, including compute/memory/storage capacity utilization, I/O activity, and DB instance connections — not user counts or engine version management, which aren't monitoring metrics. See https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MonitoringOverview.html. Community vote distribution was unanimous at D (100%).", "facets": {"service": ["RDS", "CloudWatch"], "concern": ["rds-cloudwatch-metric-categories"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 119, "question_number": 438}, "fingerprint": "f46572f9db196810ab993ccb400ad650d72f9a0ec837b6af538c4fe02ea5d5a6"}, {"id": "awssysops-p2-q476", "status": "active", "disputed": false, "stem": "Can you use the AWS Identity and Access Management (IAM) to assign permissions determining who can manage or modify RDS resources?", "choice_type": "single", "choices": [{"letter": "A", "text": "No, AWS IAM is used only to assign IDs to AWS users."}, {"letter": "B", "text": "No, this permission cannot be assigned by AWS IAM."}, {"letter": "C", "text": "Yes, you can."}, {"letter": "D", "text": "No, AWS IAM is used only to assign activities."}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "IAM policies can determine exactly who is allowed to create, describe, modify, delete, or tag RDS DB instances and security groups — RDS resource management is a normal IAM policy target, not something IAM is restricted from controlling. See https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html.", "facets": {"service": ["IAM", "RDS"], "concern": ["iam-controls-rds-management-permissions"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 153, "question_number": 476}, "fingerprint": "a0c64
