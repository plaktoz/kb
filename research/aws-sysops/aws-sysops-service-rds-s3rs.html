8a413cd58d7f2493aa90dc7ddea473f7238635192998b0677ce403d13e1"}, {"id": "awssysops-p2-q478", "status": "active", "disputed": false, "stem": "Is it possible to protect the connections between your application servers and your MySQL instances using SSL encryption?", "choice_type": "single", "choices": [{"letter": "A", "text": "Yes, it is possible but only in certain regions."}, {"letter": "B", "text": "Yes"}, {"letter": "C", "text": "No"}, {"letter": "D", "text": "Yes, it is possible but only in VPC."}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "RDS generates an SSL certificate for each DB instance, so you can SSL-encrypt the connection between application servers and MySQL instances — this isn't limited to specific regions or to VPC deployments. See http://aws.amazon.com/rds/faqs/#53. Community vote distribution was unanimous at B (100%).", "facets": {"service": ["RDS"], "concern": ["rds-mysql-ssl-encryption-in-transit"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 155, "question_number": 478}, "fingerprint": "c3c6f05152f2fd63ad41ef7b34ea1ef3c1de248ac68afc15b67fd58509274caf"}, {"id": "awssysops-p2-q491", "status": "active", "disputed": false, "stem": "Does Amazon RDS support SSL encryption for SQL Server DB Instances?", "choice_type": "single", "choices": [{"letter": "A", "text": "Yes, for all supported SQL Server editions"}, {"letter": "B", "text": "No"}, {"letter": "C", "text": "Yes, but only when the instances are in a single region"}, {"letter": "D", "text": "No, encryption using SSL is supported only in the GovCloud."}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "RDS supports SSL encryption for connections to SQL Server DB instances across all supported SQL Server editions and in all AWS regions, not restricted to a single region or to GovCloud. See https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/SQLServer.Concepts.General.SSL.Using.html.", "facets": {"service": ["RDS"], "concern": ["rds-sql-server-ssl-support-scope"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 166, "question_number": 491}, "fingerprint": "cc69b34af26d7f4bc32a4370c44eb4e56e6db967694e95d97e39858a84d0e2d8"}, {"id": "awssysops-p2-q501", "status": "active", "disputed": false, "stem": "In the context of AWS Security Best Practices for RDS, if you require encryption or data integrity authentication of data at rest for compliance or other purposes, you can add protection at the _____ using SQL cryptographic functions.", "choice_type": "single", "choices": [{"letter": "A", "text": "physical layer"}, {"letter": "B", "text": "security layer"}, {"letter": "C", "text": "application layer"}, {"letter": "D", "text": "data-link layer"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "AWS's RDS security best practices note that, beyond the secure infrastructure RDS inherits from EC2, you can add compliance-driven encryption or integrity authentication at the application layer using SQL cryptographic functions. See https://d0.awsstatic.com/whitepapers/aws-security-best-practices.pdf. Community vote distribution was unanimous at C (100%).", "facets": {"service": ["RDS"], "concern": ["rds-at-rest-encryption-application-layer-option"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 176, "question_number": 501}, "fingerprint": "d74b6edf855829248a0297a3046401ff5cca68eb21ed8fc72357b8d4a3305646"}, {"id": "awssysops-p2-q512", "status": "active", "disputed": false, "stem": "Amazon Relational Database Service integrates with _____, a service that lets your organization create users and groups under your organization's AWS account and assign unique security credentials to each user.", "choice_type": "single", "choices": [{"letter": "A", "text": "Amazon RDS tags"}, {"letter": "B", "text": "AWS IAM"}, {"letter": "C", "text": "AWS Lambda"}, {"letter": "D", "text": "Amazon EMR"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "RDS integrates with AWS IAM, which lets an organization create users/groups under its AWS account and assign each one unique security credentials. See http://awsdocs.s3.amazonaws.com/RDS/2011-04-01/rds-ug-2011-04-01.pdf.", "facets": {"service": ["RDS", "IAM"], "concern": ["rds-iam-integration-for-user-management"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 185, "question_number": 512}, "fingerprint": "cf51b8be1a36d2ec6202987c654df3165db693bfc174ef6b8074b1b89a7e66e4"}, {"id": "awssysops-p2-q529", "status": "active", "disputed": false, "stem": "A web-based application is running in AWS. The application is using a MySQL Amazon RDS database instance for persistence. The application stores transactional data and is read-heavy. The RDS instance gets busy during the peak usage, which shows the overall application response times.\nThe SysOps Administrator is asked to improve the read queries performance using a scalable solution.\nWhich options will meet these requirements? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Scale up the RDS instance to a larger instance size"}, {"letter": "B", "text": "Enable the RDS database Multi-AZ option"}, {"letter": "C", "text": "Create a read replica of the RDS instance"}, {"letter": "D", "text": "Use Amazon DynamoDB instead of RDS"}, {"letter": "E", "text": "Use Amazon ElastiCache to cache read queries"}], "correct_answer": ["C", "E"], "source_correct_answer": ["C", "E"], "correct_answer_override": null, "explanation": "Read replicas (C) horizontally scale read capacity by offloading read traffic from the primary instance, and ElastiCache (E) removes repeat read load entirely for cacheable queries — both scale independently of vertical instance size. Multi-AZ (B) is a high-availability/failover feature with a synchronously-replicated standby that isn't used for serving reads, and simply resizing (A) doesn't scale beyond a single instance's ceiling. Comments unanimously agree on C & E, matching the boxed answer.", "facets": {"service": ["RDS", "ElastiCache"], "concern": ["read-scaling", "read-replica", "caching"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 206, "question_number": 529}, "fingerprint": "302fc3c2dbb994072efc54527366ed9073cf1b1a6cb5983125b8551451d489e5"}, {"id": "awssysops-p2-q537", "status": "active", "disputed": true, "stem": "An AWS CloudFormation template creates an Amazon RDS instance. This template is used to build up development environments as needed and then delete the stack when the environment is no longer required. The RDS-persisted data must be retained for further use, even after the CloudFormation stack is deleted.\nHow can this be achieved in a reliable and efficient way?", "choice_type": "single", "choices": [{"letter": "A", "text": "Write a script to continue backing up the RDS instance every five minutes"}, {"letter": "B", "text": "Create an AWS Lambda function to take a snapshot of the RDS instance, and manually execute the function before deleting the stack"}, {"letter": "C", "text": "Use the Snapshot Deletion Policy in the CloudFormation template definition of the RDS instance"}, {"letter": "D", "text": "Create a new CloudFormation template to perform backups of the RDS instance, and run this template before deleting the stack"}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "Setting the DeletionPolicy attribute to Snapshot on the RDS resource in the template makes CloudFormation automatically snapshot the DB instance as part of stack deletion — no manual script, Lambda invocation, or separate backup template is needed. The source's own recorded 'Community vote distribution' is unanimous (100%) for C, directly contradicting the boxed answer D, and is backed by the AWS documentation link embedded in the source's own comments.", "facets": {"service": ["CloudFormation", "RDS"], "concern": ["deletion-policy", "snapshot-retention"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 217, "question_number": 537}, "fingerprint": "5315106136aac01984e39c4b807653c57aaee89e4eb4919ef8147d8387dc8e79"}, {"id": "awssysops-p2-q538", "status": "active", "disputed": true, "stem": "A company's IT Security team is performing an audit of the AWS environment to determine which servers need to be patched and where additional security controls need to be added.\nThe company is responsible for which of the following? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Patching the OS on Amazon RDS instances"}, {"letter": "B", "text": "Patching the OS on Amazon EC2 instances"}, {"letter": "C", "text": "Enabling server-side encryption with Amazon S3-Managed Keys (SSE-S3) on S3 objects"}, {"letter": "D", "text": "Patching the database engine on RDS instances"}, {"letter": "E", "text": "Patching PHP in an AWS Elastic Beanstalk managed EC2 application"}], "correct_answer": ["B", "C"], "source_correct_answer": ["B", "C"], "correct_answer_override": null, "explanation": "Under the standard shared responsibility framing, the customer patches the guest OS on EC2 (B) and configures resource-level protections like S3 server-side encryption (C); RDS's underlying OS/engine (A, D) and the runtime inside an AWS-managed Elastic Beanstalk platform (E) are typically framed as AWS/platform-managed. The source's own recorded vote is split exactly 50/50 between BD and AE, reflecting genuine reader disagreement over whether the question asks what the company IS responsible for versus what it is NOT (a reading flagged directly by commenters FHU and Finger41 given the ambiguous 'business' wording). Flagged disputed for triage given the even split.", "facets": {"service": ["Shared Responsibility Model", "EC2", "RDS", "S3"], "concern": ["patch-responsibility", "shared-responsibility-model"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 218, "question_number": 538}, "fingerprint": "1ced64c2a8e7ea57a53a6b85c021524b59ef079a880faa0b89c7ad13f28c0525"}, {"id": "awssysops-p2-q539", "status": "active", "disputed": true, "stem": "The InfoSec team has asked the SysOps Administrator to perform some hardening on the company Amazon RDS database instances.\nBased on this requirement, what actions should be recommended for the start of the security review? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Use Amazon Inspector to present a detailed report of security vulnerabilities across the RDS database fleet"}, {"letter": "B", "text": "Review the security group's inbound access rules for least privilege"}, {"letter": "C", "text": "Export AWS CloudTrail entries detailing all SSH activity on the RDS instances"}, {"letter": "D", "text": "Use the cat command to enumerate the allowed SSH keys in ~/.ssh on each RDS instance"}, {"letter": "E", "text": "Report on the Parameter Group settings and ensure that encrypted connections are enforced"}], "correct_answer": ["A", "E"], "source_correct_answer": ["A", "E"], "correct_answer_override": null, "explanation": "Amazon Inspector's agent-based assessments only run against EC2 instances — it has no ability to scan a managed RDS fleet, which undermines the boxed answer's inclusion of A. Reviewing security group inbound rules for least privilege (B) and checking Parameter Group settings for enforced encrypted connections (E) are both directly actionable against RDS. The source's recorded 'Community vote distribution' is unanimous (100%) for B & E, diverging from the boxed A & E on one letter, backed by consistent, detailed reasoning across the top comments about Inspector's EC2-only scope (there is no SSH access to enumerate on a managed RDS instance either, ruling out C and D).", "facets": {"service": ["RDS", "Security Groups"], "concern": ["rds-hardening", "inspector-scope-limitation", "encrypted-connections"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 220, "question_number": 539}, "fingerprint": "559b58bebe6946b407faf00edb0d88e027d30d4ec9d0f51b1108ad0e6ed6a8b6"}, {"id": "awssysops-p2-q543", "status": "active", "disputed": false, "stem": "Website users report that an application's pages are loading slowly at the beginning of the workday. The application runs on Amazon EC2 instances, and data is stored in an Amazon RDS database. The SysOps Administrator suspects the issue is related to high CPU usage on a component of this application.\nHow can the Administrator find out which component is causing the performance bottleneck?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use AWS CloudTrail to review the resource usage history for each component."}, {"letter": "B", "text": "Use Amazon CloudWatch metrics to examine the resource usage of each component."}, {"letter": "C", "text": "Use Amazon Inspector to view the resource usage details for each component."}, {"letter": "D", "text": "Use Amazon CloudWatch Events to examine the high usage events for each component."}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "CloudWatch metrics (CPUUtilization for EC2, RDS's own CPU-related metrics, optionally paired with Enhanced Monitoring for finer granularity) let the Administrator directly compare resource usage across every component of the stack to isolate which one is actually saturated. CloudTrail only records API activity rather than resource usage, Inspector doesn't cover RDS, and CloudWatch Events reports on triggered events rather than ongoing usage trends. Community vote is unanimous for B.", "facets": {"service": ["CloudWatch", "RDS", "EC2"], "concern": ["performance-troubleshooting", "resource-usage-metrics"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 225, "question_number": 543}, "fingerprint": "2cd26cd4e91a0370cd66fe0ff11d5fcf7d429057e9e39a60c93c26b27fa80371"}, {"id": "awssysops-p2-q548", "status": "active", "disputed": true, "stem": "An existing, deployed solution uses Amazon EC2 instances with Amazon EBS General Purpose SSD volumes, an Amazon RDS PostgreSQL database, an\nAmazon EFS file system, and static objects stored in an Amazon S3 bucket. The Security team now mandates that at-rest encryption be turned on immediately for all aspects of the application, without creating new resources and without any downtime.\nTo satisfy the requirements, which one of these services can the SysOps Administrator enable at-rest encryption on?", "choice_type": "single", "choices": [{"letter": "A", "text": "EBS General Purpose SSD volumes"}, {"letter": "B", "text": "RDS PostgreSQL database"}, {"letter": "C", "text": "Amazon EFS file systems"}, {"letter": "D", "text": "S3 objects within a bucket"}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "EBS, RDS, and EFS encryption can only be enabled at resource-creation time — none of the three can be turned on in place on an already-running volume, database, or file system without provisioning a new encrypted replacement, which the requirement explicitly rules out. S3 is the exception: default bucket encryption can be enabled immediately for all new objects, and existing objects can be re-encrypted in place with zero downtime via an S3 Batch Operations copy job. The recorded vote is unanimous (100%) for D, directly contradicting the boxed answer A, backed by detailed commentary walking through why each other option fails the 'no new resources, no downtime' constraint.", "facets": {"service": ["S3", "EBS", "RDS", "EFS"], "concern": ["at-rest-encryption", "existing-resource-encryption"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 233, "question_number": 548}, "fingerprint": "6db465e9175d8efe8692377035a0edfa857ba81a161be1b7cac8e57f7b2a9c98"}, {"id": "awssysops-p2-q560", "status": "active", "disputed": false, "stem": "A SysOps Administrator is managing an application that runs on Amazon EC2 instances behind an Application Load Balancer. The instances run in an Auto Scaling group across multiple Availability Zones. The application stores data in an Amazon RDS MySQL DB instance. The Administrator must ensure that the application stays available if the database becomes unresponsive. How can these requirements be met?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create read replicas for the RDS database and use them in case of a database failure"}, {"letter": "B", "text": "Create a new RDS instance from the snapshot of the original RDS instance if a failure occurs"}, {"letter": "C", "text": "Keep a separate RDS database running and switch the endpoint in the web application if a failure occurs"}, {"letter": "D", "text": "Modify the RDS instance to be a Multi-AZ deployment"}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "RDS Multi-AZ maintains a synchronously-replicated standby in a different Availability Zone and automatically fails over to it — including the DNS endpoint switch — if the primary becomes unresponsive, with no manual intervention needed. Read replicas (A) are asynchronous and not built for automatic failover; restoring from a snapshot (B) or manually running and cutting over to a separate standby database (C) both require manual steps and incur downtime. Community vote is unanimous for D.", "facets": {"service": ["RDS"], "concern": ["multi-az-failover", "high-availability"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 250, "question_number": 560}, "fingerprint": "4d490e6fe798447161c1fd1254bfc116f230efb065eabe2bbc1d3bbaeb7e4f40"}, {"id": "awssysops-p2-q571", "status": "active", "disputed": false, "stem": "An administrator is responding to an alarm that reports increased application latency. Upon review, the Administrator notices that the Amazon RDS Aurora database frequently runs at 100% CPU utilization. The application is read heavy and does frequent lookups of a product table. What should the Administrator do to reduce the application latency?", "choice_type": "single", "choices": [{"letter": "A", "text": "Move the product table to Amazon Redshift and use an interleaved sort key"}, {"letter": "B", "text": "Add Aurora Replicas and use a Reader Endpoint for product table lookups"}, {"letter": "C", "text": "Move the product table to Amazon CloudFront and set the cache-control headers to public"}, {"letter": "D", "text": "Use Auto Scaling to add extra Aurora nodes and set a trigger based on CPU utilization"}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "Aurora Replicas offload read traffic from the primary instance, and the Reader Endpoint automatically load-balances read queries across all available replicas — a direct fix for a read-heavy workload saturating the primary's CPU. Redshift (A) is a data-warehouse migration, not a scaling fix for an OLTP table; CloudFront (C) caches static HTTP content, not database query results; Aurora has no CPU-triggered Auto Scaling node mechanism (D) in the way described. Community vote is unanimous for B.", "facets": {"service": ["Aurora", "RDS"], "concern": ["read-replica-scaling", "reader-endpoint"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 264, "question_number": 571}, "fingerprint": "e9279c3d30f30f6b7786f46e77d2fcc041cc15e59cde67c04d16be7ab77880de"}, {"id": "awssysops-p2-q582", "status": "active", "disputed": true, "stem": "A new application runs on Amazon EC2 instances and accesses data in an Amazon RDS database instance. When fully deployed in production, the application fails. The database can be queried from a console on a bastion host. When looking at the web server logs, the following error is repeated multiple times: *** Error Establishing a Database Connection. Which of the following may be causes of the connectivity problems? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "The security group for the database does not have the appropriate egress rule from the database to the web server."}, {"letter": "B", "text": "The certificate used by the web server is not trusted by the RDS instance."}, {"letter": "C", "text": "The security group for the database does not have the appropriate ingress rule from the web server to the database."}, {"letter": "D", "text": "The database is still being created and is not available for connectivity."}], "correct_answer": ["A", "C"], "source_correct_answer": ["A", "C"], "correct_answer_override": null, "explanation": "Security groups are stateful, so a missing egress rule on the database's own security group (the boxed A) rarely blocks a client-initiated connection, since return traffic for an already-allowed inbound request is automatically permitted — several commenters flag this directly. The database being reachable from the bastion host already rules out D. That leaves the ingress rule from the web server to the database (C) as a near-certain cause, with the second cause genuinely contested: the highest-upvoted comment (10 upvotes) and others favor B (the web server's SSL/TLS certificate not being trusted by RDS, backed by a cited AWS blog post on the 2020 RDS CA certificate rotation), while a smaller but non-trivial group insists on the boxed A despite the statefulness objection. The source's own embedded vote tally itself shows a fragmented, sub-60% split between combo options that doesn't clearly back the boxed A & C either. Flagged disputed given this genuine, unresolved community split, while leaning toward B & C as the better-argued combination.", "facets": {"service": ["RDS", "Security Groups"], "concern": ["security-group-direction", "ssl-tls-certificate-validation"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 277, "question_number": 582}, "fingerprint": "1d16620ea4ecfeb9d7fe87e711c9124f40559f98b2958f72fd522c39d637381e"}, {"id": "awssysops-p2-q592", "status": "active", "disputed": false, "stem": "An organization is concerned that its Amazon RDS databases are not protected. The solution to address this issue must be low cost, protect against table corruption that could be overlooked for several days, and must offer a 30-day window of protection. How can these requirements be met?", "choice_type": "single", "choices": [{"letter": "A", "text": "Enable Multi-AZ on the RDS instance to maintain the data in a second Availability Zone."}, {"letter": "B", "text": "Create a read replica of the RDS instance to maintain the data in a second region."}, {"letter": "C", "text": "Ensure that automated backups are enabled and set the appropriate retention period."}, {"letter": "D", "text": "Enable versioning in RDS to recover altered table data when needed."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "RDS automated backups (with point-in-time recovery) let the retention period be set up to 35 days, and cost only the underlying S3 backup storage — a low-cost way to roll back table corruption discovered days later, well within a 30-day window. Multi-AZ (A) and read replicas (B) both replicate corruption to the standby/replica in near real time, so they don't protect against corruption at all; 'versioning in RDS' (D) isn't a real RDS feature. Community vote is unanimous for C.", "facets": {"service": ["RDS"], "concern": ["automated-backups", "point-in-time-recovery"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 293, "question_number": 592}, "fingerprint": "abdca396c75abb732ec9123787a9e16cdfa88912aa5bbfc21a0d65dc1e30efe0"}, {"id": "awssysops-p3-1-q605", "status": "active", "disputed": false, "stem": "A recent organizational audit uncovered an existing Amazon RDS database that is not currently configured for high availability. Given the critical\nnature of this database, it must be configured for high availability as soon as possible.\nHow can this requirement be met?", "choice_type": "single", "choices": [{"letter": "A", "text": "Switch to an active/passive database pair using the create-db-instance-read-replica with the --availability-zone flag."}, {"letter": "B", "text": "Specify high availability when creating a new RDS instance, and live-migrate the data."}, {"letter": "C", "text": "Modify the RDS instance using the console to include the Multi-AZ option."}, {"letter": "D", "text": "Use the modify-db-instance command with the --ha flag."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "Multi-AZ can be turned on for an already-running RDS instance simply by modifying it (via console, CLI, or API) to enable the Multi-AZ option — RDS then provisions a synchronous standby in a second AZ and handles failover automatically, with no new instance or data migration required. A read replica (A) is an asynchronous, separate database for read scaling, not an HA failover pair; specifying high availability only at creation time (B) doesn't apply to an existing instance and would require a disruptive migration; and `modify-db-instance` has no `--ha` flag (D) — the real flag is `--multi-az`. Community vote is unanimous for C.", "facets": {"service": ["RDS"], "concern": ["multi-az-high-availability"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 12, "question_number": 605}, "fingerprint": "876983c0f4c6446ecd52caacc9b6064c104dcbd4f60e894c6728ce2d91fc4d9f"}, {"id": "awssysops-p3-1-q635", "status": "active", "disputed": false, "stem": "The Database Administration team is interested in performing manual backups of an Amazon RDS Oracle DB instance.\nWhat steps should be taken to perform the backups?", "choice_type": "single", "choices": [{"letter": "A", "text": "Attach an Amazon EBS volume with Oracle RMAN installed to the RDS instance."}, {"letter": "B", "text": "Take a snapshot of the EBS volume that is attached to the DB instance."}, {"letter": "C", "text": "Install Oracle Secure Backup on the RDS instance and back up the Oracle database to Amazon S3."}, {"letter": "D", "text": "Take a snapshot of the DB instance."}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "Taking a manual DB snapshot is the AWS-native way to perform on-demand backups of an Amazon RDS Oracle instance, since RDS is a managed service where the administrator has no OS-level or filesystem access to the underlying host. Attaching an EBS volume with Oracle RMAN (A), snapshotting an EBS volume directly (B), or installing Oracle Secure Backup on the instance (C) all assume shell/OS access to the RDS instance's underlying infrastructure, which AWS does not expose. Community vote is unanimous (100%) for D, backed by the AWS RDS FAQ.", "facets": {"service": ["RDS"], "concern": ["manual-backup-snapshot"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 62, "question_number": 635}, "fingerprint": "008f89a2c1fe151f855dd155dae5c7a1d6e4a4fb3c48e45a1d61540f42de3706"}, {"id": "awssysops-p3-1-q654", "status": "active", "disputed": true, "stem": "A database is running on an Amazon RDS Multi-AZ DB instance. A recent security audit found the database to be out of compliance because it\nwas not encrypted.\nWhich approach will resolve the encryption requirement?", "choice_type": "single", "choices": [{"letter": "A", "text": "Log in to the RDS console and select the encryption box to encrypt the database."}, {"letter": "B", "text": "Create a new encrypted Amazon EBS volume and attach it to the instance."}, {"letter": "C", "text": "Encrypt the standby replica in the secondary Availability Zone and promote it to the primary instance."}, {"letter": "D", "text": "Take a snapshot of the RDS instance, copy and encrypt the snapshot, and then restore to the new RDS instance."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "Amazon RDS encryption-at-rest can only be enabled at DB-instance creation time and cannot be toggled on afterward, so the documented workaround is to take a snapshot of the existing unencrypted instance, create an encrypted copy of that snapshot, and restore a brand-new DB instance from the encrypted copy — effectively producing an encrypted replacement for the original. The boxed answer (A) assumes there's a console checkbox to encrypt an already-running instance, but no such option exists post-creation; attaching an encrypted EBS volume (B) doesn't apply to RDS, which doesn't expose its underlying storage as attachable EBS volumes; and encrypting the standby replica directly (C) isn't possible either, since Multi-AZ standbys inherit the primary's encryption setting and can't be independently re-encrypted. Community vote is unanimous (100%) for D, directly contradicting the boxed answer A, backed directly by the AWS RDS encryption documentation.", "facets": {"service": ["RDS"], "concern": ["encryption-at-rest-retrofit", "snapshot-copy-encrypt-restore"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 95, "question_number": 654}, "fingerprint": "572595e3ca8a481a6211399a46fdaf0b6cb8a1c2d310e9cea990a10699efa343"}, {"id": "awssysops-p3-1-q734", "status": "active", "disputed": true, "stem": "A SysOps Administrator is notified that a security vulnerability affects a version of MySQL that is being used with Amazon RDS MySQL.\nWho is responsible for ensuring that the patch is applied to the MySQL cluster?", "choice_type": "single", "choices": [{"letter": "A", "text": "The database vendor"}, {"letter": "B", "text": "The Security department of the SysOps Administrator's company"}, {"letter": "C", "text": "AWS"}, {"letter": "D", "text": "The SysOps Administrator"}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "Under the AWS shared responsibility model, AWS manages the underlying infrastructure and engine patching for a fully-managed service like RDS MySQL — that's the core value of a managed database engine, and AWS actively monitors for security vulnerabilities, works with database vendors to obtain patches, and applies them to the managed infrastructure, per the referenced AWS RDS maintenance documentation. The boxed answer (A), the database vendor, is who produces the patch, but isn't who applies it to a customer's RDS cluster — that responsibility sits with AWS, not the upstream open-source/vendor project. Community vote is unanimous (100%) for C, directly contradicting the boxed answer A, heavily corroborated (8+ upvotes) and framed by multiple comments as a direct test of shared-responsibility-model knowledge for managed database services. Flagged disputed for triage, while keeping the boxed answer A per the ingestion policy.", "facets": {"service": ["RDS"], "concern": ["shared-responsibility-model-managed-db-patching"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 225, "question_number": 734}, "fingerprint": "3765fbc619c1a351dcd7e9dbac73e13de5e71a28662eeaabbf3a68d095ab4814"}, {"id": "awssysops-p3-1-q735", "status": "active", "disputed": true, "stem": "A company's web application runs on Amazon EC2 instances behind an ELB Application Load Balancer. The EC2 instances run in an EC2 Auto Scaling group across multiple Availability Zones. Data is stored in an Amazon ElastiCache for Redis cluster and an Amazon RDS DB instance.\nCompany policy requires all system patching to take place at midnight on Tuesday.\nWhich resources will need to have a maintenance window configured for midnight on Tuesday? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Elastic Load Balancer"}, {"letter": "B", "text": "EC2 instances"}, {"letter": "C", "text": "RDS instance"}, {"letter": "D", "text": "ElastiCache cluster"}, {"letter": "E", "text": "Auto Scaling group"}], "correct_answer": ["C", "D"], "source_correct_answer": "C,D", "correct_answer_override": null, "explanation": "RDS and ElastiCache are fully-managed services that expose their own configurable maintenance window setting, during which AWS performs patching/upkeep on the customer's behalf — since the company wants that patching pinned to midnight Tuesday, those are the two resources where a maintenance window actually needs to be set, as the referenced ElastiCache maintenance-window documentation confirms. A well-represented minority of comments (including a 10-upvote 'Highly Voted' entry) argues for EC2 instead of ElastiCache, reasoning that EC2's own OS still needs patching and ElastiCache is entirely AWS-managed with no user-facing patching action required — but 'maintenance window' as an AWS-configurable option doesn't exist as a property of a plain EC2 instance or its Auto Scaling group; OS-level patching there is scheduled through a separate Systems Manager Patch Manager maintenance window construct, not through the EC2 instance resource itself. The Elastic Load Balancer (A) and Auto Scaling group (E) are AWS-managed constructs with no OS to patch and no maintenance-window setting of their own. Flagged disputed for triage given the real, credible debate over whether EC2 belongs in the answer, while keeping the boxed answer C & D per the ingestion policy.", "facets": {"service": ["RDS", "ElastiCache"], "concern": ["maintenance-window-managed-service-scope"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 227, "question_number": 735}, "fingerprint": "c58355af87b6b988c80515a65c9215878a9176b8c3bd580970c0ee9d8c5ac2c0"}, {"id": "awssysops-p3-1-q744", "status": "active", "disputed": false, "stem": "A SysOps Administrator is building a process for sharing Amazon RDS database snapshots between different accounts associated with different business units within the same company. All data must be encrypted at rest.\nHow should the Administrator implement this process?", "choice_type": "single", "choices": [{"letter": "A", "text": "Write a script to download the encrypted snapshot, decrypt it using the AWS KMS encryption key used to encrypt the snapshot, then create a new volume in each account."}, {"letter": "B", "text": "Update the key policy to grant permission to the AWS KMS encryption key used to encrypt the snapshot with all relevant accounts, then share the snapshot with those accounts."}, {"letter": "C", "text": "Create an Amazon EC2 instance based on the snapshot, then save the instance's Amazon EBS volume as a snapshot and share it with the other accounts. Require each account owner to create a new volume from that snapshot and encrypt it."}, {"letter": "D", "text": "Create a new unencrypted RDS instance from the encrypted snapshot, connect to the instance using SSH/RDP, export the database contents into a file, then share this file with the other accounts."}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "Sharing an encrypted RDS snapshot across accounts requires granting the target accounts permission to use the same AWS KMS key that encrypted it — done by updating that key's policy — and then sharing the snapshot itself, which keeps the data encrypted at rest throughout, exactly as the referenced AWS RDS 'sharing a DB snapshot' guide describes step by step. Decrypting the snapshot in a script before recreating volumes (A) breaks the encrypted-at-rest requirement during that process; recreating it as an unencrypted EBS snapshot via an EC2 instance (C) and exporting to an unencrypted file (D) both explicitly produce unencrypted data at rest, directly violating the stated requirement. Community vote is unanimous (100%) for B, matching the boxed answer, and directly quotes the official AWS documentation.", "facets": {"service": ["RDS"], "concern": ["kms-key-policy-cross-account-snapshot-sharing"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 239, "question_number": 744}, "fingerprint": "e1c1c111c7997e4bb062db0dbefbd7e9974341981514f99228dc2e8170a11ca8"}, {"id": "awssysops-p3-1-q748", "status": "active", "disputed": false, "stem": "A company runs an application that uses Amazon RDS for MySQL. During load testing of equivalent production volumes, the Development team noticed a significant increase in query latency. A SysOps Administrator concludes from investigating Amazon CloudWatch Logs that the CPU utilization on the RDS MySQL instance was at 100%.\nWhich action will resolve this issue?", "choice_type": "single", "choices": [{"letter": "A", "text": "Configure AWS Database Migration Service (AWS DMS) to allow Amazon RDS for MySQL to scale and accept more requests."}, {"letter": "B", "text": "Configure RDS for MySQL to scale horizontally by adding additional nodes to offload write requests."}, {"letter": "C", "text": "Enable the Multi-AZ feature for the RDS instance."}, {"letter": "D", "text": "Modify the RDS MySQL instance so it is a larger instance type."}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "A CPU-utilization bottleneck at 100% means the instance's compute capacity itself is the constraint, and moving to a larger instance type directly increases available CPU, which is the fix that addresses the root cause regardless of whether the load is read- or write-heavy. RDS for MySQL has no true horizontal write-scaling mechanism (B) — 'scaling horizontally' in the RDS context means adding read replicas, which offload only read traffic and wouldn't help if writes (or a general CPU-bound workload) are driving the 100% utilization, as several comments note while ruling this option out. DMS (A) is a data-migration/replication service with no role in scaling an existing instance's compute capacity, and Multi-AZ (C) provides failover/availability, not additional compute headroom. Community vote is unanimous (100%) for D, matching the boxed answer.", "facets": {"service": ["RDS"], "concern": ["cpu-bound-vertical-scaling"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 244, "question_number": 748}, "fingerprint": "7ff5d2666809fb409ec513a9ae7f8782870317eaa14136d8baa104b9aa7779a7"}, {"id": "awssysops-p3-1-q762", "status": "active", "disputed": true, "stem": "A SysOps Administrator manages an Amazon RDS MySQL DB instance in production. The database is accessed by several applications. The Administrator needs to ensure minimal downtime of the applications in the event the database suffers a failure. This change must not impact customer use during regular business hours.\nWhich action will make the database MORE highly available?", "choice_type": "single", "choices": [{"letter": "A", "text": "Contact AWS Support to pre-warm the database to ensure that it can handle any unexpected spikes in traffic"}, {"letter": "B", "text": "Create a new Multi-AZ RDS DB instance. Migrate the data to the new DB instance and delete the old one"}, {"letter": "C", "text": "Create a read replica from the existing database outside of business hours"}, {"letter": "D", "text": "Modify the DB instance to outside of business hours to be a Multi-AZ deployment"}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "RDS supports converting an existing instance to a Multi-AZ deployment in place via a simple modify action, which can be scheduled to apply outside business hours, giving automatic-failover high availability without ever needing to create a separate instance or migrate any data, exactly matching both the high-availability goal and the no-business-hours-impact constraint. The boxed answer (B), creating an entirely new Multi-AZ instance and migrating data over before deleting the old one, is a far heavier and riskier approach than simply modifying the existing instance, and several comments note this wording is also just poorly phrased for what's actually a straightforward native RDS operation. A read replica (C) doesn't provide the same synchronous, automatic-failover high availability that Multi-AZ does, and contacting AWS Support to 'pre-warm' the database (A) isn't a real, documented RDS high-availability mechanism. Community vote is unanimous (100%) for D, directly contradicting the boxed answer B, and is heavily corroborated (14+ upvotes on the top comment) with clear reasoning tied to the 'must not impact business hours' requirement. Flagged disputed for triage, while keeping the boxed answer B per the ingestion policy.", "facets": {"service": ["RDS"], "concern": ["multi-az-in-place-modification"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 266, "question_number": 762}, "fingerprint": "6b1f12e68d158ab5fe0a406537b46bde4143f141a5a4cd120eaf943e2dd8bbc3"}, {"id": "awssysops-p3-1-q775", "status": "active", "disputed": false, "stem": "A company has an application database on Amazon RDS that runs a resource-intensive reporting job. This is causing other applications using the database to run slowly.\nWhat should the SysOps Administrator do to resolve this issue?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create Amazon RDS backups"}, {"letter": "B", "text": "Create Amazon RDS read replicas to run the report"}, {"letter": "C", "text": "Enable Multi-AZ mode on Amazon RDS"}, {"letter": "D", "text": "Use Amazon RDS automatic host replacement"}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "Offloading the resource-intensive reporting job to an RDS read replica moves that read-heavy workload off the primary instance entirely, freeing it to serve the other applications at normal speed, per the referenced RDS read-replica feature documentation. RDS backups (A) don't run queries and have no effect on live read load, Multi-AZ mode (C) exists for failover/availability rather than query load distribution (the standby isn't used to serve read traffic), and automatic host replacement (D) addresses hardware failure recovery, not workload contention. Community consensus is unanimous for B, matching the boxed answer.", "facets": {"service": ["RDS"], "concern": ["read-replica-workload-offload"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 289, "question_number": 775}, "fingerprint": "cc00dcc852a51416470172f4e9adb4075e0d204320922df49a99af2de4ae28d8"}, {"id": "awssysops-p3-1-q776", "status": "active", "disputed": true, "stem": "A company wants to increase the availability and durability of a critical business application. The application currently uses a MySQL database running on an Amazon EC2 instance. The company wants to minimize application changes.\nHow should the company meet these requirements?", "choice_type": "single", "choices": [{"letter": "A", "text": "Shut down the EC2 instance. Enable multi-AZ replication within the EC2 instance, then restart the instance."}, {"letter": "B", "text": "Launch a secondary EC2 instance running MySQL. Configure a cron job that backs up the database on the primary EC2 instance and copies it to the secondary instance every 30 minutes."}, {"letter": "C", "text": "Migrate the database to an Amazon RDS Aurora DB instance and create a Read Replica in another Availability Zone."}, {"letter": "D", "text": "Create an Amazon RDS Microsoft SQL DB instance and enable multi-AZ replication. Back up the existing data and import it into the new database."}], "correct_answer": ["D"], "source_correct_answer": "D", "correct_answer_override": null, "explanation": "Amazon Aurora is wire-compatible with MySQL, so migrating the existing MySQL database to Aurora and adding a cross-AZ read replica requires little more than repointing the application's connection endpoint, while gaining Aurora's built-in multi-AZ durability and read-replica-based availability — precisely satisfying both the availability/durability goal and the 'minimize application changes' constraint, per multiple detailed comments and the referenced RDS MySQL-to-Aurora migration announcement. The boxed answer (D), migrating instead to an RDS Microsoft SQL Server instance, moves to an entirely different database engine with a different SQL dialect, drivers, and feature set than MySQL — as one comment notes, 'Microsoft SQL DB does not support RDS Aurora,' and switching engines is a far larger application change than switching to a MySQL-compatible service. Self-managing multi-AZ replication inside a single EC2 instance (A) isn't a real supported configuration, and a manual cron-based backup-and-copy scheme (B) can lose up to 30 minutes of data and requires manual failover steps, providing neither true high availability nor durability. Community vote is unanimous (100%) for C, directly contradicting the boxed answer D, and is heavily corroborated across many comments emphasizing the minimal-change, MySQL-compatibility angle. Flagged disputed for triage, while keeping the boxed answer D per the ingestion policy.", "facets": {"service": ["RDS", "Aurora"], "concern": ["minimal-change-mysql-to-aurora-migration"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 290, "question_number": 776}, "fingerprint": "118828b3212a4efcd4ca3c481a9135f41acc70a3c3ee6208ac6f71efe53edbca"}, {"id": "awssysops-p3-1-q781", "status": "active", "disputed": true, "stem": "A company runs an Amazon RDS MySQL DB instance. Corporate policy requires that a daily backup of the database must be copied to a separate security account.\nWhat is the MOST cost-effective way to meet this requirement?", "choice_type": "single", "choices": [{"letter": "A", "text": "Copy an automated RDS snapshot to the security account using the copy-db-snapshot command with the AWS CLI."}, {"letter": "B", "text": "Create an RDS MySQL Read Replica for the critical database in the security account, then enable automatic backups for the Read Replica."}, {"letter": "C", "text": "Create an RDS snapshot with the AWS CLI create-db-snapshot command, share it with the security account, then create a copy of the shared snapshot in the security account."}, {"letter": "D", "text": "Use AWS DMS to replicate data from the critical database to another RDS MySQL instance in the security account, then use an automated backup for the RDS instance."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "Automated RDS snapshots cannot be shared or copied directly to another AWS account — they must first be converted into a manual snapshot (via create-db-snapshot), which can then be shared with the security account and copied there, exactly matching option C and the referenced RDS snapshot-sharing knowledge-center article cited repeatedly in the discussion. The boxed answer's premise in A, using copy-db-snapshot directly on an automated snapshot to move it cross-account, doesn't work the way described since copy-db-snapshot's cross-account behavior applies to manual (or already-shared) snapshots, not automated ones. A cross-account Read Replica (B) and a DMS-based replication pipeline into a second live RDS instance (D) both require running and paying for an additional continuously-on database instance, which is far less cost-effective than a periodic snapshot copy. However, the community's own formal vote tally is an exact 50/50 split between C and A, meeting the mechanical threshold for flagging a question disputed (top vote share below 60%) regardless of which side the technical documentation favors. Flagged disputed for triage, while keeping the boxed answer C per the ingestion policy.", "facets": {"service": ["RDS"], "concern": ["cross-account-snapshot-sharing"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 304, "question_number": 781}, "fingerprint": "b594bb73cb79505512f41227efbcd808b474a1b7235fe3b43e1b22a7ec2f0739"}, {"id": "awssysops-p3-1-q816", "status": "active", "disputed": true, "stem": "A SysOps Administrator is notified that an automated failover of an Amazon RDS database has occurred.\nWhat are possible causes for this? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "A read contention on the database."}, {"letter": "B", "text": "A storage failure on the primary database."}, {"letter": "C", "text": "A write contention on the database."}, {"letter": "D", "text": "Database corruption errors."}, {"letter": "E", "text": "The database instance type was changed."}], "correct_answer": ["B", "D"], "source_correct_answer": "B,D", "correct_answer_override": null, "explanation": "AWS's own RDS Multi-AZ documentation explicitly lists a storage failure on the primary (B) and a change to the DB instance's server/instance type (E) among the conditions that trigger an automatic failover to the standby, per the referenced documentation and FAQ quoted directly and repeatedly (20+ upvotes on the top comment) in the discussion. The boxed answer's D, database corruption errors, is explicitly and directly contradicted by the same AWS RDS FAQ, which states in so many words that Multi-AZ deployments do 'not fail over automatically in response to database operations such as long running queries, deadlocks, or database corruption errors' — corruption is something Multi-AZ replicates rather than something that triggers a failover. Read or write contention (A, C) are performance/locking conditions, not documented failover triggers. Community discussion carries an informal embedded vote tally showing BE (instance-type change) at 67% versus BD (database corruption) at 33%, and the majority position is directly backed by verbatim AWS documentation explicitly ruling out database corruption as a failover cause. Flagged disputed for triage, while keeping the boxed answer B & D per the ingestion policy.", "facets": {"service": ["RDS"], "concern": ["multi-az-automatic-failover-triggers"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 365, "question_number": 816}, "fingerprint": "a44f93d28877c4d7cd4b4d2e6aaad73b6f5fa95ac2d3bb39e9501fe3862be4fa"}, {"id": "awssysops-p3-1-q840", "status": "active", "disputed": true, "stem": "A sysops administrator created an AWS Lambda function within a VPC with no access to the Internet. The Lambda function pulls messages from an Amazon SQS queue and stores them in an Amazon RDS instance in the same VPC. After executing the Lambda function, the data is not showing up on the RDS instance.\nWhich of the following are possible causes for this? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "A VPC endpoint has not been created for Amazon RDS"}, {"letter": "B", "text": "A VPC endpoint has not been created for Amazon SQS"}, {"letter": "C", "text": "The RDS security group is not allowing connections from the Lambda function"}, {"letter": "D", "text": "The subnet associated with the Lambda function does not have an internet gateway attached"}, {"letter": "E", "text": "The subnet associated with the Lambda function has a NAT gateway"}], "correct_answer": ["B", "E"], "source_correct_answer": "B,E", "correct_answer_override": null, "explanation": "SQS is reached over its public API endpoint, so a Lambda function in a VPC with no internet access needs an SQS VPC interface endpoint to reach the queue at all (B), and even once the messages are pulled, the RDS instance's own security group must explicitly allow inbound connections from the Lambda function's security group/ENI, or the write to RDS will silently fail (C) — both are genuine, independently sufficient causes, per the detailed reasoning corroborated heavily (11+ and 5+ upvotes on the top two comments) throughout the discussion. Lambda and RDS being in the same VPC (as stated in the scenario) means no VPC endpoint is needed for RDS traffic in the first place, ruling out A. Since Lambda and RDS communicate entirely within the VPC and Lambda never needs outbound internet access for this workflow, neither a missing internet gateway (D) nor the mere presence of a NAT gateway (the boxed answer's E) has any bearing on whether data reaches RDS — a NAT gateway's presence or absence doesn't affect intra-VPC connectivity to RDS at all, making E a non-cause on its face. Community vote is unanimous (100%) for B & C, directly contradicting the boxed answer's E, and is heavily corroborated with detailed reasoning distinguishing the SQS-endpoint and RDS-security-group causes from the irrelevant NAT/internet-gateway options. Flagged disputed for triage, while keeping the boxed answer B & E per the ingestion policy.", "facets": {"service": ["Lambda", "SQS", "RDS"], "concern": ["vpc-endpoint-and-security-group-connectivity-failure"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 399, "question_number": 840}, "fingerprint": "8e520c99d58ecbb61f20a30493969ebe3dcc2bfdc8bd8fe0642a65b05d51289a"}, {"id": "awssysops-p3-1-q903", "status": "active", "disputed": true, "stem": "A SysOps administrator wants to encrypt an existing Amazon RDS DB instance with AWS Key Management Service (AWS KMS).\nHow should the SysOps administrator accomplish this goal?", "choice_type": "single", "choices": [{"letter": "A", "text": "Copy the data volumes of the unencrypted instance. Apply the KMS key to the copied data volumes. Start the instance with the encrypted volumes."}, {"letter": "B", "text": "Create a read replica of the unencrypted instance. Encrypt the read replica with the KMS key. Promote the read replica to become the primary instance."}, {"letter": "C", "text": "Take a snapshot of the unencrypted instance. Apply the KMS key to the existing instance using the modify-db-instance command. Restart the instance."}, {"letter": "D", "text": "Take a snapshot of the unencrypted instance. Create an encrypted copy of the snapshot with the KMS key. Restore the instance from the encrypted snapshot."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "RDS abstracts away direct volume management entirely — there is no user-facing operation to 'copy the data volumes' of an instance the way one would with raw EBS volumes, and an existing unencrypted RDS instance can never be encrypted in place. The AWS-documented method is to take a snapshot of the unencrypted instance, create an encrypted copy of that snapshot using the KMS key, and restore a new instance from the encrypted snapshot copy, matching the community's answer and corroborated heavily (6+ upvotes on the top comment). A read replica (B) inherits the encryption status of its source and cannot itself be selectively encrypted, and modify-db-instance (C) has no capability to add encryption to an already-existing, already-unencrypted instance — encryption can only be set at creation/restore time, not toggled on afterward. Community vote is unanimous (100%) for D, directly contradicting the boxed answer A, and is corroborated by the well-established RDS encryption knowledge-center guidance. Flagged disputed for triage, while keeping the boxed answer A per the ingestion policy.", "face oads read-only query traffic from the primary database instance, helping the database tier handle read-heavy traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-e3d33f110338", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon ElastiCache caches the most frequently accessed data in front of a relational database, reducing the number of queries that reach the database and thus its load.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c27b6dee478e", "source_question_ids": ["awssysops-p1-q014"], "statement": "SQS-based request queuing is designed for asynchronous write/processing workloads, not for synchronous, read-heavy page-view traffic such as serving article content.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-0996a48d74fb", "source_question_ids": ["awssysops-p1-q014"], "statement": "Using Route 53 health checks to fail over to a static S3 error page addresses availability optics but does not solve the underlying capacity/scaling pressure on the infrastructure.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1fa7a765b651", "source_question_ids": ["awssysops-p1-q016"], "statement": "Subnets cannot span multiple Availability Zones; achieving coverage across N Availability Zones for a resource requires provisioning one subnet per AZ.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-33fbf0096616", "source_question_ids": ["awssysops-p1-q016"], "statement": "An ELB that must be distributed across multiple Availability Zones needs a subnet registered in each of those AZs, so an ELB distributed over 2 AZs requires two public subnets (one per AZ).", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6de4b10a3185", "source_question_ids": ["awssysops-p1-q016"], "statement": "RDS database instances should be placed in private subnets rather than public subnets so the database is not reachable from the internet.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-707b0eca29cb", "source_question_ids": ["awssysops-p1-q016"], "statement": "In a tiered VPC design with a public-facing ELB and a private database tier, the web/application servers should also be placed in private subnets rather than a public subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-89952f0a9ba0", "source_question_ids": ["awssysops-p1-q016"], "statement": "Whether a single public subnet is sufficient for an ELB distributed over 2 Availability Zones (versus requiring one public subnet per AZ) is disputed among exam commenters, since some argue a single ELB can already span multiple AZs from one subnet.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e36c863e72e9", "source_question_ids": ["awssysops-p1-q039"], "statement": "AWS Data Lifecycle Manager (DLM), launched in 2018, automates EBS snapshot creation and rotation without requiring custom scripting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d40c06dc8414", "source_question_ids": ["awssysops-p1-q039"], "statement": "There is no built-in AWS managed service that automatically detects and stops idle or underutilized EC2 instances; accomplishing this requires custom scripting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9965bc4710ed", "source_question_ids": ["awssysops-p1-q039"], "statement": "Auto Scaling combined with an Elastic Load Balancer natively handles adding newly scaled EC2 instances to the load balancer, without needing custom scripts.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-a67d8153019
