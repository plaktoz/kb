receives every mistake, and the extra hop can add write latency. 2) Read replica: RDS copies data asynchronously to a separate instance that can serve reads. That makes it the way to scale reads horizontally or move reporting and analytics off the primary. It has no automatic failover, and it also copies mistakes. 3) Automated backups plus transaction logs: RDS takes a daily snapshot and keeps transaction logs for a retention window of up to 35 days, so you can restore to almost any point in that window, often about 5 minutes before a mistake. The restore creates a new instance. A manual snapshot captures only the moment it was taken. Rule of thumb: live copies (standby, replica) protect against losing hardware. Copies from an earlier point in time (backups, PITR) protect against bad data.", "predict_prompt": "A developer accidentally drops a production table on a Multi-AZ RDS primary that also has two read replicas. Which copy still has the table, and what do you do to recover it?", "invariants": ["The Multi-AZ standby is synchronous and serves no traffic. It exists only to take over after a failover.", "Read replicas are asynchronous and readable. They scale reads but do not fail over automatically.", "Both live copies replicate application mistakes such as dropped tables or corruption. Only a restore to an earlier point in time undoes them.", "Multi-AZ failover changes the DNS CNAME, not an IP address. The endpoint hostname stays the same.", "The standby and read replicas inherit the source instance's encryption setting and cannot be encrypted on their own."], "limits": ["Multi-AZ keeps the standby in the same region, so it does not protect against a region-wide outage.", "Read contention, write contention, and other database-level conditions do not trigger Multi-AZ failover.", "Neither Multi-AZ nor read replicas add compute for a CPU-bound or write-heavy workload. At 100% CPU, scale up the instance class instead.", "On SQL Server, RDS Multi-AZ uses SQL Server's native Mirroring instead of AWS's own replication. Aurora replicas serve reads through a reader endpoint and also provide Aurora's built-in availability."], "cues": ["'automatic failover', 'AZ outage', 'primary unresponsive', 'same endpoint' -> Multi-AZ", "'read-heavy', 'reporting job slows the primary', 'analytics queries' -> read replica (or ElastiCache for repeated reads of the same data)", "'dropped table', 'corruption discovered days later', 'restore to 5 minutes before' -> automated backups / point-in-time restore", "'CPU at 100%' on a write-heavy or general workload -> larger instance class, not Multi-AZ"], "claim_ids": ["cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-a3ed621071d0", "cl-99b86df2d309", "cl-b68b0709215a", "cl-b25f6d83421f", "cl-79f4620f1978", "cl-234453d5bad4", "cl-3138383b806a", "cl-c0bd9d7fa8ed", "cl-a11479b3b188", "cl-422bbae16846", "cl-599b8aa5bcad", "cl-6da208c05063", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-e8c14270e271", "cl-42831a96fc0d", "cl-d03357538127", "cl-ae1b8ae9fb7e", "cl-14abe5b82c2f", "cl-1b6f76a42065", "cl-6280ce70cdbf", "cl-dc0236c1db20", "cl-f78cd916c0de", "cl-fb4fecbfe056", "cl-a9a4687a7bc9", "cl-539dbad1d1cc", "cl-8cdcf9f2e8e0", "cl-528b288839e7", "cl-1a5ca635ddbd", "cl-60619375fc51", "cl-6f26c20dd5bc", "cl-3f99f3f464fc", "cl-30a7bc0355b9", "cl-79ce82099389"]}, "contrastSet": {"id": "aws-sysops-service-rds--cs-1", "subjects": ["Multi-AZ standby", "Read replica", "Automated backups / point-in-time restore"], "dimensions": ["Replication timing", "Serves read traffic?", "Failover behavior", "Protects against", "Carries mistakes such as a dropped table or corruption?", "Typical stem trigger"], "shared_traits": ["All three are RDS-managed copies of the same database, configured through the console, CLI, or API. None needs OS access.", "Each copy inherits the source instance's encryption setting. None of them is a way to encrypt an unencrypted instance in place."], "matrix": {"Replication timing": {"Multi-AZ standby": "Synchronous, on every write", "Read replica": "Asynchronous, may lag", "Automated backups / point-in-time restore": "Daily snapshot plus transaction logs, kept up to 35 days"}, "Serves read traffic?": {"Multi-AZ standby": "No, idle until failover", "Read replica": "Yes, that is its job", "Automated backups / point-in-time restore": "No, you must restore a new instance first"}, "Failover behavior": {"Multi-AZ standby": "Automatic, DNS CNAME flip, same endpoint", "Read replica": "None automatic, manual promotion only", "Automated backups / point-in-time restore": "Manual restore to a new instance, with downtime"}, "Protects against": {"Multi-AZ standby": "AZ, instance, or storage failure, and patching", "Read replica": "Read overload on the primary", "Automated backups / point-in-time restore": "Logical mistakes and corruption"}, "Carries mistakes such as a dropped table or corruption?": {"Multi-AZ standby": "Yes, immediately", "Read replica": "Yes, shortly after", "Automated backups / point-in-time restore": "No, you can restore to before the mistake"}, "Typical stem trigger": {"Multi-AZ standby": "'automatic failover', 'AZ outage'", "Read replica": "'read-heavy', 'reporting job slows primary'", "Automated backups / point-in-time restore": "'dropped table', 'corruption found days later'"}}, "decision_rule": "Find what the copy has to survive or absorb. If the primary itself is lost (AZ, instance, or storage failure), choose the Multi-AZ standby. If the primary is healthy but overloaded with reads, choose a read replica. If bad data has already been written, choose point-in-time restore from automated backups, because both live copies have already copied the mistake.", "boundary_flip": "Take the stem 'the production database became unusable; recover with minimal data loss.' If the cause is an AZ outage or a failed primary instance, the answer is Multi-AZ automatic failover. Change the cause to 'a developer dropped a table 10 minutes ago' and the answer becomes point-in-time restore from automated backups, because the synchronous standby already has the drop.", "strongest_distractor_failure": "Picking a read replica for high availability fails because the replica is asynchronous and has no automatic failover, so it needs manual promotion. The reverse mistake, picking Multi-AZ for read scaling or for a CPU bottleneck, also fails because the standby serves no traffic and adds no compute.", "exceptions": ["When CPU is at 100% on a write-heavy or general workload, neither a replica nor Multi-AZ helps. Scale up to a larger instance class.", "Multi-AZ keeps the standby in the same region, so a region-wide outage needs a different mechanism.", "Aurora blurs the line: Aurora Replicas serve reads through the reader endpoint and also provide Aurora's built-in availability.", "On SQL Server, Multi-AZ uses SQL Server's native Mirroring instead of AWS's own synchronous replication."], "claim_ids": ["cl-be3e4343aa0d", "cl-79f4620f1978", "cl-234453d5bad4", "cl-86c20012b2da", "cl-cbb0150c4e7f", "cl-a3ed621071d0", "cl-b25f6d83421f", "cl-c0bd9d7fa8ed", "cl-dc0236c1db20", "cl-f78cd916c0de", "cl-fb4fecbfe056", "cl-14abe5b82c2f", "cl-1b6f76a42065", "cl-6280ce70cdbf", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-e8c14270e271", "cl-42831a96fc0d", "cl-d03357538127", "cl-0e30b32d12fa", "cl-a9a4687a7bc9", "cl-8cdcf9f2e8e0", "cl-539dbad1d1cc", "cl-3138383b806a", "cl-b8998638a207", "cl-30a7bc0355b9", "cl-3f99f3f464fc", "cl-60619375fc51", "cl-6f26c20dd5bc"]}, "scenarioFamily": {"id": "aws-sysops-service-rds--sf-1", "canonical": {"prompt": "Orders-Prod is an Amazon RDS for MySQL instance configured for Multi-AZ, with two read replicas handling reporting queries. At 2 a.m., a power failure takes down the entire Availability Zone hosting the primary instance, and the primary stops responding. The on-call engineer needs to know: will the database recover automatically, and will the application need any changes to keep working?", "expected_answer": ["RDS automatically fails over to the Multi-AZ standby that is already running (synchronously replicated) in the other Availability Zone.", "Failover happens by updating the DB instance endpoint's DNS CNAME to point at the (now-promoted) standby, not by reassigning an IP address.", "The application keeps using the same endpoint hostname; the only required action is re-establishing any already-open database connections, with no manual failover step or endpoint reconfiguration needed."], "reasoning": "An AZ-level power outage is exactly the class of infrastructure failure Multi-AZ exists for: the standby is already running and synchronously up to date, so RDS can promote it and flip the endpoint's DNS CNAME without waiting for a restore or for someone to intervene. The two read replicas are irrelevant to this recovery path since they have no automatic-failover role.", "distractor_analysis": "Promoting one of the read replicas instead would be slower and manual (replicas require explicit promotion and are only asynchronously caught up), and restoring from a backup/snapshot would be unnecessary and far slower since no data was lost or corrupted -- the standby already has a fully synchronous, up-to-date copy.", "claim_ids": ["cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-99b86df2d309", "cl-b68b0709215a", "cl-a3ed621071d0", "cl-b25f6d83421f", "cl-dc0236c1db20", "cl-f78cd916c0de"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "Instead of an AZ power outage, the cause is a developer accidentally running DROP TABLE orders on the primary 10 minutes ago -- the primary instance itself is healthy and still responding.", "prompt": "Orders-Prod is the same Multi-AZ RDS for MySQL instance with two read replicas. This time there is no infrastructure failure: a developer just ran DROP TABLE orders directly against the primary 10 minutes ago, and the primary is otherwise healthy. How should the team recover the table, and can they rely on the Multi-AZ standby or the read replicas to do it?", "expected_answer": ["No -- the synchronous Multi-AZ standby and the asynchronous read replicas have all already received and applied the same DROP TABLE, so none of them still has the table.", "Recovery requires a point-in-time restore from RDS's automated backups (daily snapshot plus transaction logs) to a timestamp just before the drop, which creates a new DB instance at that recovered point in time.", "This is a different remedy from the canonical infrastructure-failure scenario: there, the existing standby was promoted with no data movement; here, a new instance must be restored from backups."], "reasoning": "The mistake was replicated everywhere live data flows: the standby's synchronous copy and both replicas' asynchronous copies all now reflect the dropped table. Only a restore to a point in time before the DROP -- available because RDS backs up daily snapshots plus continuous transaction logs -- can bring the table back, and that restore lands in a brand-new instance rather than fixing the existing primary in place.", "distractor_analysis": "Waiting for or forcing a Multi-AZ failover would be pointless: the promoted standby is missing the table too, since it is a synchronous mirror of every write including the mistaken one. A manual snapshot only helps if one happened to be taken before the drop; the standing automated-backup/point-in-time-recovery mechanism is the reliable route because it retains continuous transaction logs, not just point snapshots.", "claim_ids": ["cl-7adea0f8aff0", "cl-4f88c255be37", "cl-42831a96fc0d", "cl-ae1b8ae9fb7e", "cl-d03357538127"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The account additionally has IAM policies configured that restrict which IAM users may manage/modify the RDS instance, and CloudWatch is providing its standard (free) monitoring metrics for the instance -- neither of these was mentioned in the canonical scenario.", "prompt": "Orders-Prod is the same Multi-AZ RDS for MySQL instance with two read replicas. The account also has IAM policies in place that control which IAM users can create, modify, delete, or tag this RDS instance, and CloudWatch is providing its standard capacity/IOPS/connection metrics for the instance at no extra charge. The same AZ power outage takes down the primary. Does either of these details change how the database recovers or what the application must do?", "expected_answer": ["No -- neither IAM management permissions nor CloudWatch's monitoring metrics affect the failover mechanism itself.", "RDS still automatically fails over to the already-running, synchronously-replicated Multi-AZ standby by flipping the endpoint's DNS CNAME.", "The application still just reconnects using the same endpoint hostname; no manual failover, endpoint change, or IAM/CloudWatch action is required for the failover to happen."], "reasoning": "IAM policies govern who is allowed to call RDS management APIs, and CloudWatch metrics are an observability feature -- both are orthogonal to the automatic, infrastructure-level Multi-AZ failover mechanism, which is triggered by RDS itself detecting the primary's unavailability, not by any IAM permission or by whether metrics are being viewed.", "distractor_analysis": "It is tempting to treat 'IAM policies configured' or 'CloudWatch enabled' as a hint that some manual, permission-gated, or monitoring-triggered action is needed to fail over, but Multi-AZ failover is automatic and infrastructure-driven regardless of these account-management or observability details.", "claim_ids": ["cl-5352c9d24aa5", "cl-8332d168d006", "cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-99b86df2d309"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A junior engineer, alarmed by the outage, proposes immediately promoting one of the two existing read replicas to be the new primary instead of waiting for RDS's Multi-AZ failover.", "prompt": "During the same AZ power outage on Orders-Prod, a junior engineer argues: 'We already have two read replicas running -- let's promote one of them to primary right now instead of waiting on Multi-AZ.' Is this the right move, and what should the team do instead?", "expected_answer": ["No -- manually promoting a read replica is unnecessary and riskier here: read replicas are asynchronous and may be lagging behind the primary, and promoting one requires manual, deliberate action rather than being automatic.", "The correct action is to let RDS's Multi-AZ mechanism do its job: it already automatically fails over to the synchronously-replicated standby by flipping the endpoint's DNS CNAME, with no manual promotion needed.", "The read replicas should be left alone serving their normal reporting-query role; they are not designed as the high-availability failover path."], "reasoning": "The proposal is tempting because the replicas are already running and visible, but Multi-AZ failover is specifically built for this: automatic, synchronous, and already in progress. Read replica promotion is a manual, asynchronous alternative meant for planned read-scaling changes or scenarios where Multi-AZ itself is unavailable, not a faster path here -- and using it risks losing whatever writes had not yet replicated to that replica.", "distractor_analysis": "The read-replica-promotion suggestion is the classic mix-up between the two live copies: replicas are asynchronous and built for read scaling, not automatic failover, while the Multi-AZ standby is synchronous and built exactly for this failure, so reaching for the replica instead of trusting Multi-AZ is the wrong call and adds risk without benefit.", "claim_ids": ["cl-dc0236c1db20", "cl-f78cd916c0de", "cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-b68b0709215a"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The database engine is Amazon RDS for SQL Server (MS SQL) instead of MySQL, still configured Multi-AZ with two read replicas, hit by the same AZ power outage.", "prompt": "Now suppose Orders-Prod is an Amazon RDS for SQL Server (MS SQL) instance, not MySQL, still configured for Multi-AZ with two read replicas, and it suffers the same AZ power outage on the primary. Does Multi-AZ still recover it the same way, and does anything about the underlying mechanism differ from the MySQL case?", "expected_answer": ["Yes -- RDS for SQL Server does support the Multi-AZ feature, so the same outcome applies: the standby takes over and the endpoint's DNS CNAME is updated so the application keeps using the same hostname.", "One thing differs under the hood: SQL Server Multi-AZ deployments achieve high availability using SQL Server's own native Mirroring feature, rather than the AWS-proprietary synchronous replication technology used for engines like MySQL, Oracle, and PostgreSQL.", "That implementation difference does not change what the on-call engineer needs to do: no manual intervention or endpoint change is required either way."], "reasoning": "The mental model transfers: any Multi-AZ-enabled engine keeps a synchronous standby ready to take over an unresponsive primary via the same DNS-based endpoint switch. SQL Server is a documented exception only in how the synchronous replication is implemented (native Mirroring versus AWS's own technology), not in whether Multi-AZ is supported or in the automatic, transparent-to-the-application nature of the failover.", "distractor_analysis": "It would be a mistake to assume SQL Server either lacks Multi-AZ support or requires a different recovery procedure from the application's point of view; the only documented difference is the internal replication technology, not the failover trigger or the DNS-based endpoint mechanism.", "claim_ids": ["cl-055d0e002bd1", "cl-3f99f3f464fc", "cl-cbb0150c4e7f", "cl-99b86df2d309", "cl-a3ed621071d0"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "Two claims make the same assertion but carry different statuses. cl-c0bd9d7fa8ed (q175, supported) lists a 'DB instance server-type/class change' as an automatic Multi-AZ failover trigger. cl-7942b4e12654 (q816) says the same thing and is marked conflicted. The mental model mechanism ('instance-class change') and the contrast set rely only on the supported version, so the q816 dispute never reaches the learner.", "related_entity_ids": ["cl-c0bd9d7fa8ed", "cl-7942b4e12654", "aws-sysops-service-rds--m-1", "aws-sysops-service-rds--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "The contrast set cites cl-be3e4343aa0d as support for 'the Multi-AZ standby serves no read traffic', but that claim is marked conflicted. Its source question q113 also yields cl-67b2c94ab257 (conflicted, the 'two DBs in parallel' reading). The dispute inside q113 is left unresolved, yet the synthesis treats the point as settled.", "related_entity_ids": ["cl-be3e4343aa0d", "cl-67b2c94ab257", "aws-sysops-service-rds--cs-1"]}, {"type": "stale-risk", "severity": "medium", "description": "The mental model invariant 'The Multi-AZ standby is synchronous and serves no traffic' and the contrast-set cell 'No, idle until failover' are stated without scope. They hold only for Multi-AZ DB instance deployments. Newer RDS Multi-AZ DB cluster deployments have readable standbys. No claim restricts the statement to the DB-instance form, and the only exception given is for Aurora.", "related_entity_ids": ["aws-sysops-service-rds--m-1", "aws-sysops-service-rds--cs-1", "cl-79f4620f1978", "cl-234453d5bad4", "cl-86c20012b2da"]}, {"type": "contradiction", "severity": "medium", "description": "The source questions disagree on whether scaling up fixes read-driven load. cl-8cdcf9f2e8e0 (q748) says a larger instance class resolves a CPU bottleneck 'regardless of whether the workload is read-heavy or write-heavy'. cl-68fa0b18ec39 (q529) and cl-1d6e1158823f (q314) treat scaling up as a distractor for read-heavy load. The m-1 limit 'Neither Multi-AZ nor read replicas add compute for a CPU-bound or write-heavy workload' also conflicts with cl-ba4ce90dde61 (q571: replicas relieve high read CPU utilization) and cl-14abe5b82c2f. The cue and exception text narrow the rule to 'write-heavy or general', but the limit does not.", "related_entity_ids": ["cl-8cdcf9f2e8e0", "cl-68fa0b18ec39", "cl-1d6e1158823f", "cl-539dbad1d1cc", "cl-ba4ce90dde61", "cl-14abe5b82c2f", "aws-sysops-service-rds--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Claims from q016 disagree. cl-33fbf0096616 states as a supported rule that an ELB spread over 2 AZs needs two public subnets. cl-89952f0a9ba0, from the same question, marks exactly that point as disputed (conflicted). The dispute is unresolved, but the rule is presented as settled.", "related_entity_ids": ["cl-33fbf0096616", "cl-89952f0a9ba0"]}, {"type": "contradiction", "severity": "medium", "description": "cl-f87645bb51c4 and cl-c905f9112db5 cite q654 as supported evidence that RDS encryption must be applied at creation, via snapshot-copy-restore. According to cl-e8cde3e27165, however, q654's boxed answer is an in-place console checkbox. The claims side with the community vote over the source's answer and are marked supported instead of flagged.", "related_entity_ids": ["cl-f87645bb51c4", "cl-c905f9112db5", "cl-e8cde3e27165"]}, {"type": "contradiction", "severity": "medium", "description": "The snapshot, encrypted-copy, restore method for encrypting an existing RDS instance has two statuses. It is supported in cl-c905f9112db5 (q654) and conflicted in cl-25bcd09edee2 (q903). Nothing explains what is disputed in q903, so the status of the documented encryption path is inconsistent.", "related_entity_ids": ["cl-c905f9112db5", "cl-25bcd09edee2", "cl-9f7e281823fd", "cl-12900d9c0cb0"]}, {"type": "contradiction", "severity": "medium", "description": "q548's boxed answer names EBS as the service whose existing data can be encrypted without creating a new resource (cl-d5c0d736f964, conflicted). Claims from the same question contradict that answer and are marked supported: cl-a52c8e591c6a (EBS encryption is creation-time only) and cl-817f30509d29 (S3 is the exception). The dispute is settled by community vote rather than flagged.", "related_entity_ids": ["cl-a52c8e591c6a", "cl-817f30509d29", "cl-d5c0d736f964", "cl-f87645bb51c4", "cl-805ca19ff617"]}, {"type": "contradiction", "severity": "medium", "description": "q539's boxed answer recommends Amazon Inspector for RDS hardening (cl-a62cca529149, conflicted). cl-fd3b01839cdc cites q539 as supported evidence that Inspector cannot scan RDS. The source question disagrees with the claim that cites it.", "related_entity_ids": ["cl-fd3b01839cdc", "cl-a62cca529149", "cl-fdafe4a46755", "cl-87426a8980df"]}, {"type": "contradiction", "severity": "medium", "description": "q734's boxed answer says the database vendor applies the engine security patch (cl-6912cbdbb449, conflicted). cl-570fee310120 and cl-89f311a2034c cite q734 as supported evidence that AWS applies it. The source question and the claim built on it disagree.", "related_entity_ids": ["cl-570fee310120", "cl-89f311a2034c", "cl-6912cbdbb449"]}, {"type": "contradiction", "severity": "medium", "description": "q537's boxed answer recommends running a separate backup CloudFormation template (cl-4b492e4ed0fd, conflicted). cl-1f61228b9df4 and cl-406ca2c0b5c0 cite q537 as supported evidence that the Snapshot DeletionPolicy is the answer and needs no separate template.", "related_entity_ids": ["cl-1f61228b9df4", "cl-406ca2c0b5c0", "cl-4b492e4ed0fd"]}, {"type": "contradiction", "severity": "medium", "description": "The q582 claims disagree. According to cl-462e79ba6c40, q582's boxed answer includes a missing security-group egress rule as a cause. cl-bc0833d25c84 (supported) argues that a missing egress rule rarely blocks the connection, and cl-462e79ba6c40 offers an SSL/TLS certificate cause instead. cl-bc0833d25c84 is also unclear about whose security group it means: for a connection the web server initiates, the web server's own egress rule does matter.", "related_entity_ids": ["cl-bc0833d25c84", "cl-462e79ba6c40", "cl-65dc2abdd3e0"]}, {"type": "ambiguity", "severity": "medium", "description": "q311's correct metric set is unresolved. The boxed answer includes read-replica lag (cl-bb7f0c6c8a95, conflicted), while commenters prefer IOPS (cl-0b56db7e0a5e, conflicted). Even so, cl-2b7c7db63a43 and cl-7aec0be4944a from the same question are marked supported without caveat.", "related_entity_ids": ["cl-2b7c7db63a43", "cl-7aec0be4944a", "cl-bb7f0c6c8a95", "cl-0b56db7e0a5e", "cl-454dd96586cd"]}, {"type": "ambiguity", "severity": "medium", "description": "According to cl-765c5e6f5f51, q156's community vote split three ways with no majority. Its other claims are still marked supported: cl-422bbae16846, cl-cd89953a9ada, cl-9072ab971620, and cl-92cab3cccf50. The mental model uses cl-422bbae16846 for 'the extra hop can add write latency'. Which mitigations are correct is unresolved at the source.", "related_entity_ids": ["cl-765c5e6f5f51", "cl-422bbae16846", "cl-cd89953a9ada", "cl-9072ab971620", "cl-92cab3cccf50", "aws-sysops-service-rds--m-1"]}, {"type": "contradiction", "severity": "low", "description": "cl-92cab3cccf50 (q156) says moving automated backups off-peak reduces latency. Its own rationale undercuts this: on Multi-AZ, backups are taken from the standby. The claim also conflicts with cl-00e6aac8c274 (q775), which says RDS backups have no effect on live load.", "related_entity_ids": ["cl-92cab3cccf50", "cl-00e6aac8c274"]}, {"type": "contradiction", "severity": "medium", "description": "Most of q840 is conflicted: cl-036c4f066762, cl-eabfc6c47e91, cl-f34aafa5d9c0, and cl-b273a9a19c4b. Nothing resolves which cause is correct. cl-036c4f066762 also overstates its case: it says an SQS interface endpoint is needed 'to reach a queue at all', but a NAT gateway is an alternative way to reach SQS. cl-eabfc6c47e91's 'silently fail' is imprecise, since a blocked connection times out or errors.", "related_entity_ids": ["cl-036c4f066762", "cl-eabfc6c47e91", "cl-f34aafa5d9c0", "cl-b273a9a19c4b", "cl-59ac86f401fe"]}, {"type": "quality", "severity": "medium", "description": "cl-0c850204c75d is not exam knowledge. It restates the ingestion pipeline's policy (flag disputed questions, keep the boxed answer), which leaked into the claim set as a 'rule' about the q840 content.", "related_entity_ids": ["cl-0c850204c75d"]}, {"type": "stale-risk", "severity": "medium", "description": "cl-5907b7a95499 says Aurora has no CPU-triggered Auto Scaling for adding nodes. Aurora Auto Scaling does add Aurora Replicas using target tracking on average CPU utilization or connections, so this is likely outdated or wrong.", "related_entity_ids": ["cl-5907b7a95499"]}, {"type": "stale-risk", "severity": "low", "description": "cl-d40c06dc8414 says no built-in AWS mechanism stops idle or underutilized EC2 instances without custom scripting. CloudWatch alarm actions can stop an instance on a low-CPU alarm, so the claim is likely outdated.", "related_entity_ids": ["cl-d40c06dc8414"]}, {"type": "stale-risk", "severity": "low", "description": "The premises of q009 and q039 (EBS lacks native rotated backups, so it needs a script) are outdated now that Data Lifecycle Manager and AWS Backup exist. cl-f5149488c779, cl-e36c863e72e9, and cl-a67d8153019a acknowledge this only partly. cl-b44c3d4ac551's 'without needing an additional backup service' framing depends on that old exam context.", "related_entity_ids": ["cl-f5149488c779", "cl-e36c863e72e9", "cl-a67d8153019a", "cl-b44c3d4ac551"]}, {"type": "ambiguity", "severity": "low", "description": "cl-d62160b685b9 gives the default automated backup retention as 1 day. That is the CLI/API default. The console default is 7 days, and the claim does not say which interface it means.", "related_entity_ids": ["cl-d62160b685b9"]}, {"type": "unsupported-generation", "severity": "low", "description": "The m-1 limit 'Read contention, write contention, and other database-level conditions do not trigger Multi-AZ failover' generalizes beyond its cited claims (cl-528b288839e7, cl-1a5ca635ddbd). The broader 'other database-level conditions' part rests on cl-5fbfc8f16102 (long-running queries, deadlocks, corruption), which is conflicted and not cited in m-1.", "related_entity_ids": ["aws-sysops-service-rds--m-1", "cl-5fbfc8f16102", "cl-528b288839e7", "cl-1a5ca635ddbd"]}, {"type": "unsupported-generation", "severity": "low", "description": "The cs-1 shared trait 'Each copy inherits the source instance's encryption setting' is backed only for the standby (cl-6f26c20dd5bc) and read replicas (cl-60619375fc51). No claim covers automated backups or PITR. The trait also blurs the fact that an encrypted copy of a snapshot is the documented route to encryption (cl-c905f9112db5).", "related_entity_ids": ["aws-sysops-service-rds--cs-1", "cl-6f26c20dd5bc", "cl-60619375fc51", "cl-c905f9112db5"]}, {"type": "unsupported-generation", "severity": "low", "description": "The cs-1 matrix cell 'manual promotion only' and strongest_distractor_failure's 'needs manual promotion' mention read-replica promotion, but no claim does. The cited claims (cl-dc0236c1db20, cl-f78cd916c0de, cl-fb4fecbfe056) only say replicas give no automatic failover.", "related_entity_ids": ["aws-sysops-service-rds--cs-1", "cl-dc0236c1db20", "cl-f78cd916c0de", "cl-fb4fecbfe056"]}, {"type": "stale-risk", "severity": "low", "description": "cl-6bc13202bbf9 and cl-2f5ddc9a997d present 'DB security group' as a current RDS event source category. DB security groups were an EC2-Classic feature, and EC2-Classic has since been retired.", "related_entity_ids": ["cl-6bc13202bbf9", "cl-2f5ddc9a997d", "cl-c0a1c4cac06a"]}, {"type": "ambiguity", "severity": "low", "description": "Several claims are marked conflicted without saying what is disputed: cl-92cfac6c1cf1 (q735), cl-158a50840442 (q762), cl-30fa62e4695e (q776), and cl-68490be234e9 (q305). cl-68490be234e9 also settles its minority-vote dispute inside the statement ('technically unsupported') instead of leaving it flagged.", "related_entity_ids": ["cl-92cfac6c1cf1", "cl-158a50840442", "cl-30fa62e4695e", "cl-68490be234e9"]}, {"type": "quality", "severity": "low", "description": "Two q776 claims are poorly worded. cl-9f6cc10938ab ('RDS for Microsoft SQL Server does not support the Aurora engine') conflates engine choice with a feature. cl-10b83747fe90 overstates a MySQL-to-Aurora migration as 'little more than repointing the endpoint' and leaves out the data migration.", "related_entity_ids": ["cl-9f6cc10938ab", "cl-10b83747fe90"]}, {"type": "parse", "severity": "low", "description": "The claims from q014 and q840 have no 'conditions' field at all, while every other claim has one (usually an empty array). The claim schema is inconsistent.", "related_entity_ids": ["cl-aa9aa216e4a2", "cl-80be965cb35f", "cl-e3d33f110338", "cl-c27b6dee478e", "cl-0996a48d74fb", "cl-036c4f066762", "cl-eabfc6c47e91", "cl-59ac86f401fe", "cl-f34aafa5d9c0", "cl-b273a9a19c4b", "cl-0c850204c75d"]}]}]}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam: a future fetch-based loader only ever
  // needs to replace these two bodies. ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: (s.sourceQuestions || []).length };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(function (c) {
          var status = c.status || 'status unknown';
          return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span></li>`;
        }).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        ${raw(citationsHtml(cs.claim_ids))}
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
        <div class="item-meta">${raw(metaBadges.join(''))}</div>
        ${raw(changedCondition)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence <span class="muted">(optional)</span></legend>
          <div class="segmented">${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"><span>${c}</span></label>`; }).join(''))}</div>
        </fieldset>
        <div class="actions"><button id="reveal-practice-btn" type="button">Reveal answer</button></div>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------
  function itemLookup(itemId) {
    return practiceItems().find(function (i) { return i.id === itemId; });
  }

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {
          var item = itemLookup(a.itemId);
          var prompt = item ? (item.prompt || item.stem || '') : '(item no longer in scenario family)';
          var predictedText = Array.isArray(a.predicted) ? a.predicted.join(', ') : (a.predicted || '(no answer recorded)');
          var radios = DIAGNOSIS_CATEGORIES.map(function (c) {
            return safe`<label class="diagnosis-option"><input type="radio" name="diagnosis-${a.id}" value="${c.key}"><span><strong>${c.label}</strong><span class="hint">${c.hint}</span></span></label>`;
          }).join('');
          return safe`
            <div class="pending-attempt panel" data-attempt-id="${a.id}">
              <p class="prompt">${prompt}</p>
              <p class="your-answer"><span class="field-label">Your answer</span>${predictedText}</p>
              <fieldset>
                <legend>What went wrong?</legend>
                <div class="diagnosis-grid">${raw(radios)}</div>
              </fieldset>
              <p class="field-error hidden" role="alert">Pick the category that best explains the miss.</p>
              <div class="actions"><button type="button" class="submit-diagnosis">Submit diagnosis</button></div>
            </div>`;
        }).join('')
      : safe`<p class="empty">Nothing to diagnose. Items you mark wrong in Practice show up here.</p>`;

    var historyHtml = history.length
      ? safe`<ul class="diagnosis-history">${raw(history.map(function (a) {
          var cat = DIAGNOSIS_CATEGORIES.find(function (c) { return c.key === a.diagnosis; });
          var label = cat ? cat.label : a.diagnosis;
          var item = itemLookup(a.itemId);
          var excerpt = truncate(item ? (item.prompt || item.stem || '') : a.itemId, 80);
          var when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '';
          return safe`<li><span class="badge">${label}</span><span>${excerpt}</span><time class="muted" datetime="${a.timestamp || ''}">${when}</time></li>`;
        }).join(''))}</ul>`
      : safe`<p class="empty">No diagnosed mistakes yet.</p>`;

    var html = safe`
      <section class="diagnose">
        <h2>Diagnose</h2>
        <p class="back-link"><a href="${sliceHref('learn')}">&larr; Revisit Learn</a></p>
        <h3>Needs diagnosis <span class="tally">${pending.length}</span></h3>
        ${raw(pendingHtml)}
        <h3>History <span class="tally">${history.length}</span></h3>
        ${raw(historyHtml)}
      </section>`;
    var node = fromHTML(html);
    node.querySelectorAll('.pending-attempt').forEach(function (el) {
      var error = el.querySelector('.field-error');
      el.addEventListener('change', function () { error.classList.add('hidden'); });
      el.querySelector('.submit-diagnosis').addEventListener('click', function () {
        var checked = el.querySelector('input[type="radio"]:checked');
        if (!checked) { error.classList.remove('hidden'); return; }
        var attemptId = el.getAttribute('data-attempt-id');
        var attempt = STATE.attempts.find(function (a) { return a.id === attemptId; });
        if (attempt) {
          attempt.diagnosis = checked.value;
          saveState();
          navigate();
        }
      });
    });
    return node;
  }

  // ---------- Explore Sources ----------
  var sourcesSearchTerm = '';
  var expandedSourceId = null;

  function questionMatches(q, term) {
    if (!term) return true;
    var choiceText = (q.choices || []).map(function (c) { return c.text; }).join(' ');
    var haystack = [q.id, q.stem, q.explanation, choiceText].join(' ').toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function citingClaims(questionId) {
    return (CURRENT.claims || []).filter(function (c) { return (c.source_question_ids || []).indexOf(questionId) !== -1; });
  }

  function issuesHtml() {
    var issues = CURRENT.issues || [];
    if (!issues.length) return safe`<p class="muted">No open issues.</p>`;
    return safe`
      <details class="issues-panel">
        <summary>Issues <span class="tally">${issues.length}</span></summary>
        <ul class="issues">${raw(issues.map(function (i) {
          return safe`<li><p class="issue-head"><span class="badge severity-${i.severity || 'unknown'}">${i.severity || 'unknown'}</span><strong>${i.type || 'issue'}</strong></p><p>${i.description || ''}</p></li>`;
        }).join(''))}</ul>
      </details>`;
  }

  function sourceRowHtml(q) {
    var isOpen = q.id === expandedSourceId;
    var detail = '';
    if (isOpen) {
      var citing = citingClaims(q.id);
      var choiceItems = (q.choices || []).map(function (c) {
        var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
        return safe`<li class="${isCorrect ? 'correct-choice' : ''}"><span class="choice-letter">${c.letter}.</span> ${c.text}${raw(isCorrect ? ' <span class="badge tone-ok">correct</span>' : '')}</li>`;
      }).join('');
      var citedList = citing.length
        ? safe`<ul>${raw(citing.map(function (c) { return safe`<li>${c.statement}</li>`; }).join(''))}</ul>`
        : safe`<p class="muted">No claims cite this question yet.</p>`;
      var src = q.source || {};
      detail = safe`
        <tr class="detail-row">
          <td colspan="4">
            <div class="source-detail">
              <p>${q.stem}</p>
              <ul>${raw(choiceItems)}</ul>
              <h4>Explanation</h4>
              <p>${q.explanation || ''}</p>
              <p class="muted source-meta">Source: ${src.file || ''} (p. ${src.page !== undefined ? src.page : '?'}, Q${src.question_number !== undefined ? src.question_number : '?'})</p>
              <h4>Cited by <span class="tally">${citing.length}</span></h4>
              ${raw(citedList)}
            </div>
          </td>
        </tr>`;
    }
    var disputedBadge = q.disputed ? ' <span class="badge tone-warn">disputed</span>' : '';
    return safe`
      <tr class="source-row${raw(isOpen ? ' is-open' : '')}" data-id="${q.id}">
        <td class="cell-id"><button type="button" class="row-toggle" aria-expanded="${isOpen ? 'true' : 'false'}">${q.id}</button></td>
        <td class="cell-status">${q.status || ''}${raw(disputedBadge)}</td>
        <td class="cell-stem">${truncate(q.stem, 90)}</td>
        <td class="cell-answer">${(q.correct_answer || []).join(', ')}</td>
      </tr>${raw(detail)}`;
  }

  function renderSources() {
    var questions = CURRENT.sourceQuestions || [];
    var html = safe`
      <section class="sources">
        <h2>Explore Sources</h2>
        ${raw(issuesHtml())}
        <div class="search-field">
          <label class="field-label" for="sources-search">Search questions</label>
          <input type="search" id="sources-search" placeholder="Stem, choices, or explanation">
          <p class="muted" id="sources-count" aria-live="polite"></p>
        </div>
        <div class="table-wrap" tabindex="0" role="region" aria-label="Source questions">
          <table class="sources-table">
            <thead><tr><th scope="col">ID</th><th scope="col">Status</th><th scope="col">Stem</th><th scope="col">Correct</th></tr></thead>
            <tbody id="sources-tbody"></tbody>
          </table>
        </div>
      </section>`;
    var fragment = fromHTML(html);
    var section = fragment.firstElementChild;
    var input = section.querySelector('#sources-search');
    input.value = sourcesSearchTerm;

    function renderRows() {
      var filtered = questions.filter(function (q) { return questionMatches(q, sourcesSearchTerm); });
      section.querySelector('#sources-count').textContent = filtered.length + ' / ' + questions.length + ' questions';
      var tbody = section.querySelector('#sources-tbody');
      tbody.innerHTML = filtered.length
        ? filtered.map(sourceRowHtml).join('')
        : safe`<tr><td colspan="4" class="empty-cell">No questions match "${sourcesSearchTerm}".</td></tr>`;
      tbody.querySelectorAll('.source-row').forEach(function (row) {
        row.addEventListener('click', function () {
          var id = row.getAttribute('data-id');
          expandedSourceId = expandedSourceId === id ? null : id;
          renderRows();
          var toggle = tbody.querySelector('.source-row[data-id="' + CSS.escape(id) + '"] .row-toggle');
          if (toggle) toggle.focus({ preventScroll: true });
        });
      });
    }

    input.addEventListener('input', function () {
      sourcesSearchTerm = input.value;
      renderRows();
    });
    renderRows();
    return fragment;
  }

  // ---------- slice selection ----------
  var DEFAULT_SLICE_ID = null;

  function populateSliceSelect(manifest) {
    DEFAULT_SLICE_ID = manifest.length ? manifest[0].id : null;
    var select = document.getElementById('slice-select');
    select.innerHTML = manifest.map(function (s) {
      return safe`<option value="${s.id}">${s.facet.key}: ${s.facet.value} (${s.questionCount} q)</option>`;
    }).join('');
    document.getElementById('slice-controls').classList.toggle('hidden', manifest.length <= 1);
    select.addEventListener('change', function () {
      location.hash = '#' + encodeURIComponent(select.value) + '/' + parseHash().mode;
    });
  }

  function activateSlice(sliceId) {
    return loadSlice(sliceId).then(function (slice) {
      CURRENT = slice;
      STORAGE_KEY = 'ekd:' + slice.contentSet.id + ':' + slice.contentSet.schemaVersion;
      STATE = loadState();
      practiceIndex = 0;
      sourcesSearchTerm = '';
      expandedSourceId = null;
      var cs = CURRENT.contentSet;
      document.getElementById('app-title').innerHTML = safe`<span class="title-exam">${cs.exam}</span><span class="title-sep" aria-hidden="true">/</span><span class="title-facet"><span class="visually-hidden">${cs.facet.key}: </span>${cs.facet.value}</span>`;
      document.title = cs.facet.value + ' · ' + cs.exam;
      var select = document.getElementById('slice-select');
      if (select.value !== slice.contentSet.id) select.value = slice.contentSet.id;
      renderStorageWarning();
    });
  }

  // ---------- routing: "#<sliceId>/<mode>", falling back to the active (or
  // first) slice when the hash omits one -- e.g. on first load. ----------
  var ROUTES = { learn: renderLearn, compare: renderCompare, practice: renderPractice, diagnose: renderDiagnose, sources: renderSources };
  var DEFAULT_MODE = 'learn';

  function sliceHref(mode) {
    return '#' + encodeURIComponent(CURRENT.contentSet.id) + '/' + mode;
  }

  function parseHash() {
    var rawHash = (location.hash || '').slice(1);
    var slashIndex = rawHash.indexOf('/');
    var fallbackSliceId = CURRENT ? CURRENT.contentSet.id : DEFAULT_SLICE_ID;
    if (slashIndex === -1) {
      return { sliceId: fallbackSliceId, mode: ROUTES.hasOwnProperty(rawHash) ? rawHash : DEFAULT_MODE };
    }
    var sliceId = decodeURIComponent(rawHash.slice(0, slashIndex)) || fallbackSliceId;
    var mode = rawHash.slice(slashIndex + 1);
    return { sliceId: sliceId, mode: ROUTES.hasOwnProperty(mode) ? mode : DEFAULT_MODE };
  }

  function navigate() {
    var target = parseHash();
    var proceed = (!CURRENT || CURRENT.contentSet.id !== target.sliceId)
      ? activateSlice(target.sliceId)
      : Promise.resolve();
    return proceed.then(function () {
      document.querySelectorAll('#nav a').forEach(function (a) {
        var mode = a.getAttribute('data-route');
        a.setAttribute('href', sliceHref(mode));
        a.classList.toggle('active', mode === target.mode);
        if (mode === target.mode) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(ROUTES[target.mode]());
    });
  }

  // ---------- init ----------
  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('import-input').addEventListener('change', importProgress);
  window.addEventListener('hashchange', navigate);
  getManifest().then(function (manifest) {
    populateSliceSelect(manifest);
    return navigate();
  });
})();
</script>
</body>
</html>
