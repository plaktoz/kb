<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-storage-data-transfer", "exam": "aws-sysops", "facet": {"key": "service", "value": "Storage & data transfer", "grouped": true, "group_index": 1, "group_count": 1, "grouped_values": ["Storage Gateway", "Glacier", "EFS", "Snowball", "AWS Import/Export", "Data Lifecycle Manager"], "group": "storage"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-01818a117b99", "source_question_ids": ["awssysops-p1-q105"], "statement": "Amazon S3 Glacier storage classes are designed for rarely accessed archival or compliance data: S3 Glacier Flexible Retrieval returns data in minutes to hours, S3 Glacier Deep Archive is the lowest-cost S3 class with retrieval within 12-48 hours, and S3 Glacier Instant Retrieval gives millisecond access at a higher storage price.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c53c89510d56", "source_question_ids": ["awssysops-p1-q105"], "statement": "AWS RRS and Amazon S3 Standard are both more expensive per GB than Glacier for an archival access pattern, because they are optimized for readily-accessible storage rather than archival.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-05eda522d81f", "source_question_ids": ["awssysops-p1-q105"], "statement": "Amazon RDS is a relational database service, not a file or object storage option, so it is not a candidate for storing archival files.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-88c8b4952f0e", "source_question_ids": ["awssysops-p1-q289"], "statement": "When a Glacier archive is restored, the restored object's storage class remains Glacier (or S3 Glacier Deep Archive); it does not change to Reduced Redundancy Storage (RRS).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-fd2d6583207f", "source_question_ids": ["awssysops-p1-q289"], "statement": "A restored Glacier archive remains available as an object for the duration the user specified in the restore request.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-83f7e7ded98a", "source_question_ids": ["awssysops-p1-q289"], "statement": "The duration of a Glacier restoration can only be modified by issuing a new restore request with an updated period.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-6ef0398efde7", "source_question_ids": ["awssysops-p1-q289"], "statement": "While a Glacier object remains restored, the user is billed storage for both the restored copy and the retained Glacier archive.", "status": "needs-review"}, {"claim_type": "rule", "conditions": ["SLA requires retrieval of recent backups within hours"], "confidence": "high", "id": "cl-ab960d03897d", "source_question_ids": ["awssysops-p2-q310"], "statement": "Landing newly generated backup files in S3 first (rather than Glacier) is needed to satisfy an SLA requiring recent files to be retrieved within a few hours, because S3 offers fast object retrieval while Glacier retrieval takes substantially longer.", "status": "supported"}, {"claim_type": "rule", "conditions": ["requirement is indefinite retention of backup data"], "confidence": "high", "id": "cl-fd7c42f8b936", "source_question_ids": ["awssysops-p2-q310"], "statement": "An S3 lifecycle policy that transitions older backup objects to Glacier is a cost-effective way to satisfy an indefinite-retention requirement, since Glacier storage costs much less than S3 Standard.", "status": "supported"}, {"claim_type": "exception", "conditions": ["SLA requires retrieval within a couple of hours for recent backups"], "confidence": "high", "id": "cl-f9e18251ab2f", "source_question_ids": ["awssysops-p2-q310"], "statement": "Sending daily backup files directly to Glacier immediately after generation violates an SLA requiring retrieval of recent (e.g., past-week) files within a couple of hours, since Glacier retrieval takes hours.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-19e1cc7bd482", "source_question_ids": ["awssysops-p2-q310"], "statement": "Using an EBS volume with daily snapshots, or a Storage Gateway with Gateway-Cached Volumes plus daily snapshots, is needlessly expensive compared to S3 with lifecycle transitions to Glacier for simple file-dump backups that don't require block-storage semantics.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9b11d4a6b414", "source_question_ids": ["awssysops-p2-q385"], "statement": "In the legacy standalone Amazon Glacier service (closed to new customers), a vault is a container that groups archives; the current S3 Glacier storage classes store objects in S3 buckets instead of vaults.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-91a5f66812d1", "source_question_ids": ["awssysops-p2-q385"], "statement": "In Amazon Glacier, an archive is a single file or a bundle of files uploaded as one unit, and each archive is assigned a unique archive ID when it is uploaded into a vault.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-75a56a5eb30f", "source_question_ids": ["awssysops-p2-q385"], "statement": "A Glacier vault is not a unique ID that maps a region plus an S3 bucket, not a container for storing S3 buckets, and not a free-tier offering.", "status": "supported"}, {"claim_type": "fact", "conditions": ["dataset size on the order of hundreds of terabytes", "connection speed on the order of 100 Mbps"], "confidence": "high", "id": "cl-a22dbfd91f07", "source_question_ids": ["awssysops-p2-q395"], "statement": "Transferring very large datasets (hundreds of terabytes) over a typical network connection, such as a dedicated 100 Mbps link, can take well over 100 days, making pure network transfer impractical for very large one-time migrations.", "status": "supported"}, {"claim_type": "rule", "conditions": ["one-time bulk migration of a very large dataset"], "confidence": "medium", "id": "cl-39f93f3f822d", "source_question_ids": ["awssysops-p2-q395"], "statement": "Shipping data on AWS Snowball devices (several loaded in parallel for 300 TB) is faster than uploading over a 100 Mbps link, which takes over 100 days per 100 TB, and faster than VM Import/Export or zip-and-upload for a one-time multi-hundred-terabyte load.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3ffd3924a796", "source_question_ids": ["awssysops-p2-q400"], "statement": "AWS Storage Gateway connects an on-premises software appliance with cloud-based storage, providing seamless hybrid-cloud integration -- including data-security features -- between an on-premises IT environment and the AWS storage infrastructure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7f41b28e05f6", "source_question_ids": ["awssysops-p2-q416"], "statement": "AWS Import/Export (Disk), now retired and superseded by AWS Snowball, moved large datasets into and out of AWS by having customers ship their own portable storage devices, which AWS loaded or unloaded over its internal network rather than the public internet.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f655420e5275", "source_question_ids": ["awssysops-p2-q428"], "statement": "AWS Storage Gateway's Gateway-Virtual Tape Library (Gateway-VTL) provides a virtual tape infrastructure that scales with demand, letting an organization cost-effectively and durably archive long-term backup data in Amazon Glacier without managing physical tape hardware.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2f300053a610", "source_question_ids": ["awssysops-p2-q441"], "statement": "AWS Storage Gateway's Gateway-cached volumes keep the primary dataset in Amazon S3 while retaining a local cache of frequently-accessed data, giving low-latency access to that hot data subset.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f4bc21231330", "source_question_ids": ["awssysops-p2-q441"], "statement": "AWS Storage Gateway's Gateway-stored volumes keep the primary data locally and asynchronously back up point-in-time snapshots of that data to Amazon S3 -- the opposite storage-tier model from Gateway-cached volumes, and a common source of confusion between the two gateway volume types.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-116e0d23d249", "source_question_ids": ["awssysops-p2-q487"], "statement": "All data stored in Glacier (S3 Glacier) is automatically protected with AES-256 server-side encryption using AWS-managed keys by default, with no user-set flag required.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-6150e8aa575a", "source_question_ids": ["awssysops-p2-q521"], "statement": "AWS Storage Gateway's Virtual Tape Library (VTL), presented over iSCSI, lets an existing legacy backup application write to it directly as a one-time setup with no recurring per-job transfer fee, while data is tiered to S3/Glacier behind the scenes.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["recurring/periodic use rather than a one-time bulk transfer"], "confidence": "medium", "id": "cl-58db0b0a54ea", "source_question_ids": ["awssysops-p2-q521"], "statement": "AWS Snowball charges a per-job fee (commonly cited around $200-300+ per transfer) and is designed for bulk one-off or periodic data transfer, so using it repeatedly (e.g. on a weekly basis) as a substitute for ongoing backup storage compounds that fee on every cycle rather than being cost-effective.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-a52c8e591c6a", "source_question_ids": ["awssysops-p2-q548"], "statement": "Encryption at rest for EBS General Purpose SSD volumes can only be enabled at volume-creation time and cannot be turned on in place on an already-running volume.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f87645bb51c4", "source_question_ids": ["awssysops-p2-q548"], "statement": "Encryption at rest for RDS databases can only be enabled at DB-instance-creation time and cannot be turned on in place on an already-running instance.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-805ca19ff617", "source_question_ids": ["awssysops-p2-q548"], "statement": "Encryption at rest for Amazon EFS file systems can only be enabled at file-system-creation time and cannot be turned on in place on an already-existing file system.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-817f30509d29", "source_question_ids": ["awssysops-p2-q548"], "statement": "Amazon S3 default bucket encryption can be enabled immediately for new objects without creating a new bucket, and existing S3 objects can be re-encrypted in place with zero downtime via an S3 Batch Operations copy job.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-d5c0d736f964", "source_question_ids": ["awssysops-p2-q548"], "statement": "Among EBS, RDS, EFS, and S3, S3 is the exception where existing data can gain at-rest encryption without creating a new resource and without downtime; a source's boxed answer instead named EBS, which conflicts with this documented behavior and the source's own unanimous community vote favoring S3.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-36e977464a94", "source_question_ids": ["awssysops-p2-q581"], "statement": "AWS Storage Gateway's Tape Gateway provides an iSCSI virtual tape library (VTL) interface -- including a virtual media changer, virtual tape drives, and virtual tapes -- that existing backup software can use as a drop-in replacement for a physical tape system, with the underlying data stored durably in S3 or archived to Glacier.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5f49dea8cf5d", "source_question_ids": ["awssysops-p2-q581"], "statement": "AWS Server Migration Service (SMS), discontinued and replaced by AWS Application Migration Service, was a server-migration tool, not a tape-interface or storage-gateway service, so it cannot replace a physical tape system.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2458960113ae", "source_question_ids": ["awssysops-p2-q581"], "statement": "Amazon Glacier by itself is only the underlying cold-storage tier that a Tape Gateway can archive data to; it is not itself a tape interface.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-66e6efca6e64", "source_question_ids": ["awssysops-p2-q581"], "statement": "AWS Snowball is a physical data-transfer device, not a virtual tape interface for replacing an on-premises tape archival system.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d1a3d646cb17", "source_question_ids": ["awssysops-p2-q589", "awssysops-p3-1-q603"], "statement": "Amazon EFS is a managed NFS file system with POSIX-compliant permissions that can be mounted concurrently from multiple EC2 instances and on-premises servers connected over a VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c7201c39d072", "source_question_ids": ["awssysops-p2-q589"], "statement": "Amazon S3 is object storage with no POSIX or NFS semantics, so it cannot serve as a drop-in replacement for POSIX/NFS-based shared-drive infrastructure.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-124a3e749411", "source_question_ids": ["awssysops-p2-q589", "awssysops-p3-1-q603", "awssysops-p3-1-q674"], "statement": "A standard Amazon EBS volume attaches to one EC2 instance, and io1/io2 Multi-Attach allows up to 16 Nitro instances only within one Availability Zone and needs a cluster-aware file system, so EBS cannot provide shared NFS file-system access across instances, AZs, and on-premises servers the way EFS does.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e44aae1df83e", "source_question_ids": ["awssysops-p2-q589"], "statement": "Amazon SQS is a message-queueing service, not a storage service, so it cannot serve as shared-drive storage.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1d97eb3a7220", "source_question_ids": ["awssysops-p3-1-q603"], "statement": "Amazon EFS provides strong consistency and file-locking semantics, allowing multiple EC2 instances to make conflict-free partial, in-place edits to the same shared files.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9a5c0a8e5991", "source_question_ids": ["awssysops-p3-1-q603"], "statement": "Amazon EFS lifecycle management only transitions files between storage classes based on time since last access and never deletes them, so expiring files by age and extension requires a separate scheduled cleanup process.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-229faf08a54d", "source_question_ids": ["awssysops-p3-1-q603"], "statement": "Amazon S3 lacks the POSIX file-locking semantics needed for conflict-free partial updates to the same object by multiple concurrent clients.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-218223880f0c", "source_question_ids": ["awssysops-p3-1-q603"], "statement": "Syncing data to an EC2 instance store from a central EBS-backed instance does not create a shared or durably persistent data store.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-7864a5ff40e1", "source_question_ids": ["awssysops-p3-1-q634", "awssysops-p3-1-q664"], "statement": "Amazon EFS encryption-at-rest can only be enabled at file-system creation time and cannot be toggled on for an already-existing, unencrypted EFS file system.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-50b7b1e85526", "source_question_ids": ["awssysops-p3-1-q634", "awssysops-p3-1-q664"], "statement": "To bring an existing unencrypted Amazon EFS file system's data under at-rest encryption, the documented remediation is to create a new encrypted EFS file system, copy the existing data onto it, and reconnect clients to the new file system (retiring the old unencrypted one).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-19eecf8b6e7d", "source_question_ids": ["awssysops-p3-1-q634"], "statement": "Using AWS CloudHSM to encrypt files directly before storing them on EFS reinvents, with far more operational overhead, functionality that native EFS at-rest encryption already provides.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-56e6907bba4e", "source_question_ids": ["awssysops-p3-1-q634"], "statement": "Enabling TLS on EFS mount options protects data in transit between an EC2 instance and EFS, not data at rest on disk, so it does not satisfy an at-rest encryption requirement.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d10b6c07e8a8", "source_question_ids": ["awssysops-p3-1-q664"], "statement": "There is no AWS CLI command to enable encryption in place on an existing EFS file system, since EFS has no in-place encrypt toggle.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4e93c5bb70d2", "source_question_ids": ["awssysops-p3-1-q664"], "statement": "Encrypting each client host's own local drive does nothing to encrypt data stored on a shared network file system like EFS, since the data physically resides on the EFS service, not on the local disk.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-8ce0834b20e1", "source_question_ids": ["awssysops-p3-1-q664"], "statement": "\"Enabling encryption on the connection\" to a file system conflates encryption-in-transit with encryption-at-rest, and does not by itself satisfy an at-rest encryption requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-30bc65683457", "source_question_ids": ["awssysops-p3-1-q674"], "statement": "Amazon EFS is a regional, fully-managed NFS file system that supports mount targets in multiple subnets and Availability Zones, giving shared, concurrent file-system access to the same data from EC2 instances across AZs, and it scales automatically to petabytes as data grows.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3d3f48742060", "source_question_ids": ["awssysops-p3-1-q674"], "statement": "An AWS Storage Gateway cached volume is block storage, attached via iSCSI, intended to extend on-premises storage into AWS -- it is not a shared file-system interface accessible concurrently from multiple EC2 instances.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8a19eb3d9984", "source_question_ids": ["awssysops-p3-1-q674"], "statement": "Manually sharing a single EC2 instance's disk over SMB/CIFS or NFS does not scale to growing data volumes and provides no Availability-Zone-level resilience.", "status": "supported"}, {"claim_type": "rule", "conditions": ["tape gateway or volume gateway (not file gateway)"], "confidence": "high", "id": "cl-b31b47a285a4", "source_question_ids": ["awssysops-p3-1-q679"], "statement": "For an AWS Storage Gateway tape (or volume) gateway, the correct maintenance order to protect data integrity when rebooting the underlying virtual machine is to stop the gateway service first, then reboot the VM, and only afterward restart the gateway service -- ensuring any in-flight uploads or writes are flushed before the VM restarts.", "status": "supported"}, {"claim_type": "exception", "conditions": ["file gateway type of Storage Gateway"], "confidence": "medium", "id": "cl-9fb29887037b", "source_question_ids": ["awssysops-p3-1-q679"], "statement": "File gateways are an exception to the stop-reboot-restart maintenance sequence required for tape and volume gateways: a plain virtual-machine reboot suffices for a file gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["tape gateway or volume gateway (not file gateway)"], "confidence": "high", "id": "cl-cc19bf391e2a", "source_question_ids": ["awssysops-p3-1-q679"], "statement": "Rebooting a Storage Gateway virtual machine without first stopping the gateway service risks interrupting an in-progress upload or write for a tape or volume gateway.", "status": "supported"}, {"claim_type": "fact", "conditions": ["one-time bulk migration", "limited or shared network bandwidth"], "confidence": "medium", "id": "cl-616cea9e4053", "source_question_ids": ["awssysops-p3-1-q680"], "statement": "AWS Snowball is a physical appliance (available in capacities such as 50 TB and 80 TB) that can transfer tens of terabytes of data to AWS in about a week including shipping, sidestepping network bandwidth limits entirely for one-time bulk migrations over a constrained or shared connection.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d0e1e4f2c804", "source_question_ids": ["awssysops-p3-1-q680"], "statement": "Amazon S3 Transfer Acceleration only optimizes the network path to S3 over an existing connection via CloudFront edge locations; it does not remove the underlying bandwidth ceiling of that connection.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-676da17d4f05", "source_question_ids": ["awssysops-p3-1-q680"], "statement": "AWS Direct Connect is a dedicated-line solution that is generally overkill and too costly to provision for a single one-time bulk data transfer.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3486e64b1e57", "source_question_ids": ["awssysops-p3-1-q680"], "statement": "AWS Storage Gateway is meant for ongoing or hybrid storage integration, not for executing a one-time bulk data migration.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-20fb3131dbf0", "source_question_ids": ["awssysops-p3-1-q688", "awssysops-p3-1-q827"], "statement": "Amazon Glacier Vault Lock lets an administrator deploy a vault lock policy (for example, denying archive deletion until a retention period has passed) that becomes immutable once locked, enforcing WORM retention controls on the vault's archives.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fdea494dc6e7", "source_question_ids": ["awssysops-p3-1-q688"], "statement": "An S3 lifecycle policy that transitions objects to the Glacier storage class only governs storage-class transitions; it does not provide deletion or modification protection, so it does not by itself prevent someone from deleting or overwriting the underlying object.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["uploading via the AWS Management Console (not CLI/API/multipart tooling)"], "confidence": "medium", "id": "cl-8557bf3b132c", "source_question_ids": ["awssysops-p3-1-q688"], "statement": "The Amazon S3 Management Console has an object upload size ceiling of roughly 160 GB, which cannot accommodate uploading a single multi-terabyte archive directly through the console.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f9685154fe11", "source_question_ids": ["awssysops-p3-1-q688"], "statement": "Storing data on a local EC2 instance with an encrypted Amazon EBS volume provides no legal or compliance immutability guarantee against deletion or modification of that data.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-48c333ee7933", "source_question_ids": ["awssysops-p3-1-q688"], "statement": "A file gateway backed by an S3 bucket using the S3 Infrequent Access storage class does not provide write-once-read-many (WORM) protection against deletion or modification.", "status": "supported"}, {"claim_type": "rule", "conditions": ["CacheHitPercent below roughly 60% and CachePercentUsed above roughly 90%"], "confidence": "high", "id": "cl-f552b65143a2", "source_question_ids": ["awssysops-p3-1-q769"], "statement": "For AWS Storage Gateway, a low CacheHitPercent combined with a near-full CachePercentUsed indicates the local cache disk is too small to hold the working data set for the current workload, so most requests miss the cache and fall through to slower retrieval.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d0b3cf17a9d2", "source_question_ids": ["awssysops-p3-1-q769"], "statement": "Enlarging the cached-volume disk on an AWS Storage Gateway gives the gateway more room to retain frequently-accessed data locally, directly raising the CacheHitPercent and improving iSCSI performance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-37a207f473da", "source_question_ids": ["awssysops-p3-1-q769"], "statement": "Changing the default block size on an AWS Storage Gateway affects I/O granularity, not the underlying cache-capacity shortfall that causes a low cache-hit rate.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c17f199dc9da", "source_question_ids": ["awssysops-p3-1-q769"], "statement": "Configuring an AWS Storage Gateway's physical disks in a RAID 1 array improves redundancy and throughput of the underlying disks but does not increase the amount of data that can be cached.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e3e14637468f", "source_question_ids": ["awssysops-p3-1-q769"], "statement": "Taking snapshots of Storage Gateway volumes, flushing the cache completely, and restoring from the clean snapshots just empties an already-undersized cache, hitting the same capacity bottleneck again almost immediately.", "status": "supported"}, {"claim_type": "rule", "conditions": ["volume gateway configured in stored-volume mode"], "confidence": "medium", "id": "cl-ed5b0eff2557", "source_question_ids": ["awssysops-p3-1-q792"], "statement": "An AWS Storage Gateway volume gateway configured as a \"stored volume\" keeps the entire dataset locally for low-latency, real-time access while asynchronously backing up point-in-time snapshots of that data to Amazon S3, providing a durable, inexpensive offsite disaster-recovery copy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-850bb1f5abf9", "source_question_ids": ["awssysops-p3-1-q792"], "statement": "Amazon S3 Transfer Acceleration only speeds up long-distance uploads and downloads to S3 over the internet via CloudFront edge locations; it does not create or maintain any kind of local cache of frequently used files.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d73de92a04d1", "source_question_ids": ["awssysops-p3-1-q792"], "statement": "Mounting an Amazon EFS volume on a local server and sharing it does not inherently maintain a seamless offsite disaster-recovery copy of the data.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-adfeab07ce36", "source_question_ids": ["awssysops-p3-1-q792"], "statement": "AWS Data Pipeline is an ETL and workflow-orchestration service and has no feature for locally caching S3 objects on workstations.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aaeeaa6d5755", "source_question_ids": ["awssysops-p3-1-q801"], "statement": "AWS Storage Gateway, in cached-volume or file-gateway mode, keeps the most recently or frequently accessed data cached locally for low-latency access while transparently storing the full dataset durably in the cloud.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d3a0cba574c4", "source_question_ids": ["awssysops-p3-1-q801"], "statement": "Amazon EBS is block storage attached to a single EC2 instance with no local, on-premises caching component, so it does not fit a requirement for local low-latency access combined with cloud backup.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-44a112bdedf1", "source_question_ids": ["awssysops-p3-1-q801"], "statement": "Amazon EFS is a cloud-native NFS file system and is not designed to provide local, on-premises caching of frequently used assets.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b5f4a7f6b263", "source_question_ids": ["awssysops-p3-1-q801"], "statement": "Plain Amazon S3, used alone, has no built-in local-caching mechanism for on-premises assets.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-729e164347bf", "source_question_ids": ["awssysops-p3-1-q807"], "statement": "AWS Storage Gateway activation failing from the console can be caused by the gateway's virtual machine having an incorrect system time.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3e863638119a", "source_question_ids": ["awssysops-p3-1-q807"], "statement": "AWS Storage Gateway activation failing from the console can be caused by the activating client lacking network access to the gateway over port 80, which is required for the activation handshake.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c934a544fdc1", "source_question_ids": ["awssysops-p3-1-q807"], "statement": "A missing upload buffer, backing S3 bucket, or cache volume are configuration steps that occur only after a Storage Gateway has already been successfully activated, so they are not causes of the activation handshake itself failing.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-44e33846c9b1", "source_question_ids": ["awssysops-p3-1-q810"], "statement": "Amazon S3 provides restore-event notifications for Glacier objects: s3:ObjectRestore:Post fires when a restore is initiated, and s3:ObjectRestore:Completed fires when the restored object becomes available for access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b2a4ec4afe97", "source_question_ids": ["awssysops-p3-1-q810"], "statement": "The GlacierJobDescription API can only be used to poll or describe a restore job's status; it cannot be used to push a notification on its own.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1f5e1038928a", "source_question_ids": ["awssysops-p3-1-q810"], "statement": "A Lambda function that polls an object's storage class to detect a Glacier restore completion works, but is a more roundabout, custom-built solution than a native S3 restore event notification.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-9fe0ee883076", "source_question_ids": ["awssysops-p3-1-q810"], "statement": "The S3 event type s3:ObjectCreated:Post is triggered by new object creation via an HTTP POST upload and is unrelated to a Glacier restore completing.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1a6adbd4291b", "source_question_ids": ["awssysops-p3-1-q827"], "statement": "A Glacier vault lock policy, once locked, cannot be edited and enforces multi-year retention such as 7 years on a legacy Glacier vault; for data in the S3 Glacier storage classes the equivalent control is S3 Object Lock in compliance mode with a retention period.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5d07da822f2a", "source_question_ids": ["awssysops-p3-1-q827"], "statement": "A Glacier data retrieval policy governs retrieval request rates and costs, not data retention duration or immutability.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-871d28191d58", "source_question_ids": ["awssysops-p3-1-q827"], "statement": "A Glacier vault access policy is a mutable, ordinary IAM-style access-control policy, not an immutable or lockable retention control.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-00b19a44ff00", "source_question_ids": ["awssysops-p3-1-q827"], "statement": "A Glacier vault notification only configures SNS alerts for vault events and does not enforce any data-retention guarantee.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-29db4fb4b51d", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "A scheduled process (such as an AWS Lambda function triggered by CloudWatch Events/EventBridge, or Amazon Data Lifecycle Manager) that runs on a schedule to delete EBS snapshots older than a retention threshold is a valid pattern for enforcing an EBS snapshot data-retention policy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8ba7aaa97daf", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Amazon Data Lifecycle Manager (DLM) is a purpose-built, fully managed policy engine for EBS snapshots that natively handles scheduled creation, a defined retention count/period, and automatic deletion of aged-out snapshots within a single policy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-bdab4209e81c", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "An EventBridge/CloudWatch Events scheduled rule can trigger EBS snapshot creation on a schedule, but on its own provides no built-in retention or deletion mechanism, requiring separate custom logic to enforce a retention window.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4b3c9adc44f2", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Copying data to Amazon S3 Glacier via a Lambda function is an archival pattern, not a snapshot-based backup, and does not match how EBS backups are normally retained.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-12e3d9c4451b", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "For the backup-retention exam question, this dataset's boxed answer (an EventBridge scheduled rule) is contradicted by unanimous community vote favoring Amazon Data Lifecycle Manager, since the EventBridge rule alone has no built-in retention/deletion mechanism.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3e7376b39a67", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon Data Lifecycle Manager (Amazon DLM) selects which EBS volumes to snapshot based on tags applied to those volumes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["policy targets volumes by tag, e.g. Production and Compliance tags"], "confidence": "high", "id": "cl-17f7cd2b9aaf", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Tagging the target EBS volumes is a prerequisite for an Amazon DLM snapshot lifecycle policy to target them.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e1a69db3b663", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon DLM requires an IAM role that grants it permission to create and manage snapshots on the users' behalf.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6277be53c755", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "The IAM role used by Amazon DLM must be separate from the IAM role(s)/permissions held by the users who own the EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-68455bad40a5", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum storage requirement of 5 GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2a4eddab46dc", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum baseline performance of 3 IOPS/GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7be424124afd", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Encryption of the EBS volumes is an optional volume property that is unrelated to whether Amazon DLM can manage the volume's snapshot lifecycle.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-storage-data-transfer--m-1", "title": "Storage follows the read-back clock: hot copy close, cold copy cheap", "purpose": "Pick the right AWS storage or transfer option by asking where the authoritative copy lives and how fast it must be read back, so that Glacier, S3, Storage Gateway modes, EFS and Snowball each land in the question they actually solve.", "mechanism": "Data sits in tiers ordered by read-back speed and cost per GB. A local cache (Storage Gateway cached volume or file gateway) gives low-latency access to the hot working set while the full dataset lives durably in S3. S3 Standard returns objects immediately. S3 Glacier Flexible Retrieval takes minutes to hours and Deep Archive 12-48 hours, but costs far less per GB. Data moves down the tiers on a schedule: an S3 lifecycle rule transitions aging backups to Glacier, and Data Lifecycle Manager creates and ages out EBS snapshots by tag. Data moves up only temporarily: a Glacier restore makes a readable copy for the number of days you request, the object's storage class stays Glacier, you pay for both copies while it lasts, and S3 can emit s3:ObjectRestore:Completed when it is ready. So the read-back deadline in the question decides the tier. Anything that must come back within hours has to stay above Glacier, and anything kept indefinitely belongs in Glacier once it is past that window. Getting data into AWS follows the same clock, measured in transfer days: hundreds of TB over a 100 Mbps link takes 100+ days, so a one-time bulk load ships on Snowball, while ongoing hybrid access runs through Storage Gateway.", "predict_prompt": "Daily backups must be kept forever, but anything from the past week must be retrievable within two hours. Where does a new backup file land on day 1, and where is it on day 30?", "invariants": ["Glacier tiers trade read-back time for lower cost per GB; a retrieval SLA of hours rules out landing fresh data directly in Glacier.", "A restored Glacier object keeps its Glacier storage class; the readable copy is temporary and is billed alongside the archive.", "Cached volumes keep the primary data in S3 with a local hot cache; stored volumes keep the primary data locally with asynchronous snapshots to S3.", "Lifecycle transitions change storage class only; they never provide immutability (that is Vault Lock / S3 Object Lock)."], "limits": ["The tier model does not cover encryption-at-rest rules: EBS, RDS and EFS can only be encrypted at creation (migrate to a new encrypted resource), while S3 can gain encryption in place.", "Storage shape still gates the choice: shared POSIX/NFS access with file locking needs EFS, not S3 or a single-instance EBS volume, regardless of tier.", "Some claims (e.g. Glacier restore billing, restore-duration changes) are marked needs-review in the source."], "cues": ["\"retrieve within a few hours\" or \"recent files\" -> keep in S3 first, then lifecycle to Glacier", "\"lowest cost\", \"rarely accessed\", \"archive\", \"indefinite retention\" -> Glacier / Deep Archive", "\"low-latency local access to frequently used data\" + cloud copy -> Storage Gateway cached volume or file gateway", "\"entire dataset local\" + offsite DR snapshots -> Storage Gateway stored volume", "\"replace physical tape\" with existing backup software -> Tape Gateway (VTL)", "\"hundreds of TB, one-time, limited bandwidth\" -> Snowball", "\"low CacheHitPercent, high CachePercentUsed\" -> enlarge the gateway cache disk"], "claim_ids": ["cl-01818a117b99", "cl-c53c89510d56", "cl-88c8b4952f0e", "cl-fd2d6583207f", "cl-6ef0398efde7", "cl-ab960d03897d", "cl-fd7c42f8b936", "cl-f9e18251ab2f", "cl-2f300053a610", "cl-f4bc21231330", "cl-ed5b0eff2557", "cl-aaeeaa6d5755", "cl-f552b65143a2", "cl-d0b3cf17a9d2", "cl-36e977464a94", "cl-f655420e5275", "cl-a22dbfd91f07", "cl-39f93f3f822d", "cl-3486e64b1e57", "cl-44e33846c9b1", "cl-fdea494dc6e7", "cl-8ba7aaa97daf", "cl-805ca19ff617", "cl-817f30509d29", "cl-d1a3d646cb17", "cl-c7201c39d072"]}, "contrastSet": {"id": "aws-sysops-service-storage-data-transfer--cs-1", "subjects": ["S3 Standard", "S3 Glacier (Flexible Retrieval / Deep Archive)"], "dimensions": ["Retrieval time", "Storage cost per GB", "Fit for backups", "How data gets there", "Reading the data back"], "shared_traits": ["Both are durable S3 object storage, addressed as objects in buckets", "Both are encrypted at rest (Glacier automatically with AES-256)", "Neither prevents deletion by itself; immutability needs Vault Lock / S3 Object Lock"], "matrix": {"Retrieval time": {"S3 Standard": "Immediate", "S3 Glacier (Flexible Retrieval / Deep Archive)": "Minutes-hours (Flexible) or 12-48 h (Deep Archive)"}, "Storage cost per GB": {"S3 Standard": "Higher; priced for readily accessible data", "S3 Glacier (Flexible Retrieval / Deep Archive)": "Much lower; Deep Archive is the cheapest S3 class"}, "Fit for backups": {"S3 Standard": "Recent backups under a retrieval SLA of hours", "S3 Glacier (Flexible Retrieval / Deep Archive)": "Older backups kept indefinitely or for compliance"}, "How data gets there": {"S3 Standard": "Direct upload of newly generated files", "S3 Glacier (Flexible Retrieval / Deep Archive)": "Lifecycle transition from S3 after the hot window"}, "Reading the data back": {"S3 Standard": "GET the object directly", "S3 Glacier (Flexible Retrieval / Deep Archive)": "Restore request first; temporary copy, class stays Glacier"}}, "decision_rule": "Retrieval deadline decides it: if the data must be readable within the stated SLA (hours or less), it belongs in S3 Standard; if it can wait for a restore of hours to days, the cheaper Glacier tier wins.", "boundary_flip": "A daily backup file from this week, under a two-hour retrieval SLA, must sit in S3 Standard. Once it is older than the one-week SLA window and only needs to be kept indefinitely, the correct place flips to Glacier through an S3 lifecycle transition.", "strongest_distractor_failure": "Sending each daily backup straight to Glacier looks cheapest but breaks the SLA, because recent files would need a restore that takes hours before they can be read.", "exceptions": ["S3 Glacier Instant Retrieval gives millisecond access at a higher storage price, so a latency requirement alone does not rule out every Glacier class.", "Moving data to Glacier does not make it immutable; WORM retention needs a Glacier Vault Lock policy or S3 Object Lock in compliance mode."], "claim_ids": ["cl-01818a117b99", "cl-c53c89510d56", "cl-ab960d03897d", "cl-fd7c42f8b936", "cl-f9e18251ab2f", "cl-88c8b4952f0e", "cl-fd2d6583207f", "cl-116e0d23d249", "cl-fdea494dc6e7", "cl-20fb3131dbf0", "cl-1a6adbd4291b"]}, "scenarioFamily": {"id": "aws-sysops-service-storage-data-transfer--sf-1", "canonical": {"prompt": "A company's nightly job writes a new backup file to AWS every day. The operations SLA requires that any backup from the past week be retrievable within a couple of hours, and compliance requires every backup be retained indefinitely. Where should a brand-new backup file be placed when it is first created, and what should happen to it once it ages past the one-week window?", "expected_answer": ["Land the new backup in Amazon S3 (e.g., S3 Standard) first, so it can be retrieved within hours while it is still inside the one-week SLA window.", "Apply an S3 lifecycle policy that transitions the backup to Glacier once it ages past the one-week window, giving cost-effective indefinite retention."], "reasoning": "Landing fresh backups in S3 satisfies the hours-level retrieval SLA for the past week's files (cl-ab960d03897d) and avoids the SLA violation that sending them straight to Glacier would cause (cl-f9e18251ab2f). Once a file is past that fast-retrieval window, an S3 lifecycle transition to Glacier is a cost-effective way to meet the indefinite-retention requirement (cl-fd7c42f8b936).", "distractor_analysis": "Writing new backups directly to Glacier looks cheaper from day one but breaks the hours-level SLA for recent files because Glacier retrieval takes substantially longer than S3 (cl-f9e18251ab2f). Using an EBS volume with daily snapshots, or a Storage Gateway stored volume with daily snapshots, is needlessly expensive for this simple file-dump backup pattern compared to S3 with lifecycle transitions to Glacier (cl-19e1cc7bd482).", "claim_ids": ["cl-ab960d03897d", "cl-fd7c42f8b936", "cl-f9e18251ab2f", "cl-19e1cc7bd482"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The backup file in question was created 10 days ago, so it is now past the one-week SLA retrieval window; only the indefinite-retention requirement still applies to it, and the hours-level retrieval requirement no longer does.", "prompt": "Same pipeline and requirements as before, but now consider a specific backup file that was created 10 days ago -- it is already outside the one-week fast-retrieval SLA window, and only the indefinite low-cost retention requirement still applies to it. Where should this particular file be sitting right now?", "expected_answer": ["By now the file should already have transitioned to Glacier via the S3 lifecycle policy, since it has aged past the one-week fast-retrieval window and only the indefinite low-cost retention requirement still applies to it."], "reasoning": "The hours-level SLA only covers backups from the past week (cl-ab960d03897d, cl-f9e18251ab2f); once a file ages past that window, the lifecycle transition to Glacier for indefinite, cost-effective retention is what applies, so the file's correct location flips from S3 to Glacier (cl-fd7c42f8b936).", "claim_ids": ["cl-fd7c42f8b936", "cl-ab960d03897d", "cl-f9e18251ab2f"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The security team adds a requirement that all backup data must be encrypted at rest with AES-256.", "prompt": "Same pipeline, same one-week retrieval SLA, and same indefinite-retention requirement as before -- but the security team also mandates that every backup be encrypted at rest with AES-256. Does this change where a brand-new backup file should land on day 1, or how it should age into Glacier?", "expected_answer": ["Land the new backup in Amazon S3 (e.g., S3 Standard) first, so it can be retrieved within hours while it is still inside the one-week SLA window.", "Apply an S3 lifecycle policy that transitions the backup to Glacier once it ages past the one-week window, giving cost-effective indefinite retention."], "reasoning": "The placement decision is unchanged: all data stored in Glacier is already automatically protected with AES-256 server-side encryption by default, with no user-set flag required (cl-116e0d23d249), so the added encryption requirement is already satisfied by the existing S3-then-lifecycle-to-Glacier plan and introduces no new storage-placement decision.", "claim_ids": ["cl-ab960d03897d", "cl-fd7c42f8b936", "cl-116e0d23d249"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate proposes replacing the S3-plus-lifecycle-to-Glacier plan with an EBS volume that takes daily snapshots (or a Storage Gateway stored volume with daily snapshots), arguing that snapshots are also a durable backup mechanism.", "prompt": "A teammate suggests scrapping the S3-plus-lifecycle-to-Glacier plan in favor of an EBS volume with daily snapshots (or a Storage Gateway stored volume with daily snapshots), reasoning that snapshots are durable backups too and would meet the same requirements. Should the team adopt this instead?", "expected_answer": ["No -- keep landing the new backup in Amazon S3 first for the hours-level SLA, and keep using an S3 lifecycle policy to transition it to Glacier for indefinite retention once it ages past the one-week window."], "reasoning": "Using an EBS volume with daily snapshots, or a Storage Gateway stored volume with daily snapshots, is needlessly expensive compared to S3 with lifecycle transitions to Glacier for a simple file-dump backup pattern that doesn't require block-storage semantics (cl-19e1cc7bd482). The original plan already satisfies the retrieval SLA via S3 (cl-ab960d03897d) and the indefinite-retention requirement via lifecycle transition to Glacier (cl-fd7c42f8b936), so switching adds cost without fixing anything.", "distractor_analysis": "The EBS/Storage-Gateway-snapshot proposal sounds reasonable because snapshots are indeed durable, but it adds block-storage cost and operational overhead that this plain file-dump workload doesn't need (cl-19e1cc7bd482).", "claim_ids": ["cl-19e1cc7bd482", "cl-ab960d03897d", "cl-fd7c42f8b936"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "transfer", "changed_condition": "Instead of an ongoing nightly backup pipeline, the team now needs a one-time migration of 300 TB of historical backup archives into AWS over a dedicated 100 Mbps link.", "prompt": "Separately, the same team needs to move a one-time batch of 300 TB of historical backup archives into AWS, and the only network path available is a dedicated 100 Mbps link. Applying the same read-back-clock thinking (how fast data must come back vs. how fast it can get there), what should they use to get the data into AWS, and why not simply upload it over that link?", "expected_answer": ["Use AWS Snowball (several devices loaded and shipped in parallel) to physically transport the 300 TB, because uploading hundreds of terabytes over a 100 Mbps link would take well over 100 days, making pure network transfer impractical for a one-time bulk migration of this size."], "reasoning": "Transferring a dataset on the order of hundreds of terabytes over a connection on the order of 100 Mbps can take well over 100 days, making pure network transfer impractical for a very large one-time migration (cl-a22dbfd91f07). Shipping data on Snowball devices loaded in parallel is faster than that upload path for a one-time bulk migration of this size (cl-39f93f3f822d).", "claim_ids": ["cl-a22dbfd91f07", "cl-39f93f3f822d"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "Source awssysops-p2-q548 disagrees with itself: its boxed answer names EBS as the resource that can gain at-rest encryption in place, while its community vote and the extracted rules (cl-a52c8e591c6a says EBS can only be encrypted at creation; cl-817f30509d29 says S3 can be encrypted in place) favor S3. cl-d5c0d736f964 settles this by following the community vote, and the mental model's limits repeat the S3 answer as settled ('S3 can gain encryption in place') without noting that the source's official answer says otherwise. This needs manual verification, not a majority-vote resolution.", "related_entity_ids": ["cl-d5c0d736f964", "cl-a52c8e591c6a", "cl-817f30509d29", "aws-sysops-service-storage-data-transfer--m-1"]}, {"type": "contradiction", "severity": "high", "description": "Source awssysops-p3-1-q888 disagrees with itself: its boxed answer is an EventBridge scheduled rule, but its community vote favors Amazon Data Lifecycle Manager. cl-12e3d9c4451b settles this in favor of DLM by community vote, and the mental model mechanism presents DLM as the answer without mentioning the dispute. Also, cl-29db4fb4b51d calls an EventBridge-triggered scheduled process a 'valid pattern' for snapshot retention, while cl-bdab4209e81c says an EventBridge rule has no retention mechanism. So the claims themselves do not agree on whether the boxed answer could be defended.", "related_entity_ids": ["cl-12e3d9c4451b", "cl-29db4fb4b51d", "cl-bdab4209e81c", "cl-8ba7aaa97daf", "aws-sysops-service-storage-data-transfer--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "The sources disagree on which Storage Gateway volume mode fits 'local cache of frequently used files'. For awssysops-p3-1-q792, the distractor claims show the requirement was locally caching frequently used files (cl-850bb1f5abf9: Transfer Acceleration 'does not create ... any kind of local cache of frequently used files'; cl-adfeab07ce36: no feature for 'locally caching S3 objects'). Yet its answer claim cl-ed5b0eff2557 (status conflicted) picks a stored volume, which keeps the whole dataset locally. awssysops-p2-q441 and awssysops-p3-1-q801 map the same need to cached volumes or file gateway (cl-2f300053a610, cl-aaeeaa6d5755). The mental model's invariant and cues treat the two modes as cleanly separated and do not flag that q792 crosses the line.", "related_entity_ids": ["cl-ed5b0eff2557", "cl-850bb1f5abf9", "cl-adfeab07ce36", "cl-2f300053a610", "cl-aaeeaa6d5755", "aws-sysops-service-storage-data-transfer--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "The mental model's invariant ('a retrieval SLA of hours rules out landing fresh data directly in Glacier') and mechanism ('Anything that must come back within hours has to stay above Glacier') are absolute. They are contradicted by the contrast set's own exception (S3 Glacier Instant Retrieval gives millisecond access) and by cl-01818a117b99, which says Flexible Retrieval returns data in 'minutes to hours'. Expedited retrieval can therefore meet an SLA of a couple of hours. The rule only holds for the older Glacier retrieval times assumed by awssysops-p2-q310. Also, cl-01818a117b99, a core basis for both artifacts, has status conflicted.", "related_entity_ids": ["aws-sysops-service-storage-data-transfer--m-1", "aws-sysops-service-storage-data-transfer--cs-1", "cl-01818a117b99", "cl-f9e18251ab2f", "cl-ab960d03897d"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model states Glacier restore behavior as invariant fact: the readable copy lasts 'for the number of days you request' and is 'billed alongside the archive', and 'you pay for both copies while it lasts'. The supporting claims cl-fd2d6583207f and cl-6ef0398efde7 are low-confidence and needs-review. The limits section mentions needs-review in general terms, but the invariant itself presents these as settled.", "related_entity_ids": ["aws-sysops-service-storage-data-transfer--m-1", "cl-fd2d6583207f", "cl-6ef0398efde7", "cl-83f7e7ded98a"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The contrast set's shared trait 'Both are encrypted at rest' is backed only by a Glacier claim (cl-116e0d23d249). No claim says S3 Standard objects are encrypted by default. In fact cl-817f30509d29, cl-d5c0d736f964 and the mental model's limits ('S3 can gain encryption in place') assume S3 data may start out unencrypted and need default bucket encryption turned on. So the shared trait is unsupported, and it is in tension with the rest of the slice.", "related_entity_ids": ["aws-sysops-service-storage-data-transfer--cs-1", "cl-116e0d23d249", "cl-817f30509d29", "cl-d5c0d736f964"]}, {"type": "stale-risk", "severity": "medium", "description": "The synthesis mixes the legacy standalone Glacier vault model with the current S3 Glacier storage classes. The contrast set's subject is S3 Glacier storage classes, which store objects in buckets. But its exception, its shared traits, and the mental model invariant cite 'Glacier Vault Lock' as the immutability control, and Vault Lock applies only to legacy vaults (cl-9b11d4a6b414, cl-1a6adbd4291b). The source questions (awssysops-p2-q385, awssysops-p3-1-q688, awssysops-p3-1-q8
