<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

ecks; if only EC2 checks are used, the Auto Scaling group ignores ELB 'unhealthy' verdicts entirely.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["Auto Scaling group's health check type includes ELB"], "confidence": "high", "id": "cl-9021c6e1d856", "source_question_ids": ["awssysops-p1-q008"], "statement": "Adding the ELB health check type to an Auto Scaling group's health check configuration is what makes the group terminate and replace instances that the ELB has marked unhealthy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["Auto Scaling group's health check type is set to EC2 only"], "confidence": "medium", "id": "cl-158e9339e5f7", "source_question_ids": ["awssysops-p1-q008"], "statement": "Changing an Auto Scaling group's health check thresholds, changing the ELB health check interval, or switching the ELB's check protocol does not fix an Auto Scaling group ignoring ELB health-check verdicts when its health check type is set to EC2 only.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb168dcb42b2", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Internet Gateway (IGW) is inherently redundant/highly available at the VPC level, so adding a second IGW does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-364df7c366b0", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Elastic Load Balancer automatically spans multiple Availability Zones, so adding a second ELB does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b3aa5da8e2c", "source_question_ids": ["awssysops-p1-q010"], "statement": "A multi-AZ RDS instance already fails over automatically to a standby in a second Availability Zone, so it is not itself a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1360dcf4efc7", "source_question_ids": ["awssysops-p1-q010"], "statement": "In an architecture that already uses an IGW, an ELB spanning multiple AZs, and a multi-AZ RDS instance, there is no remaining single point of failure that needs to be fixed.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances need to call the CloudWatch PutMetricData API"], "confidence": "high", "id": "cl-75ab3e8821db", "source_question_ids": ["awssysops-p1-q012"], "statement": "Attaching an IAM role to an Auto Scaling launch configuration is the AWS-recommended way to let instances authenticate CloudWatch PutMetricData calls, because credentials are automatically rotated and delivered via the instance metadata service.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6c0e7c9cf67b", "source_question_ids": ["awssysops-p1-q012"], "statement": "Creating an IAM user and injecting its credentials into instance User Data or a private repository means distributing and rotating static long-lived secrets by hand, which is not the recommended authentication approach for instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-81c2f9cee3ef", "source_question_ids": ["awssysops-p1-q012"], "statement": "CloudWatch has no metric-level resource policy that can grant PutMetricData permission to instances from an Auto Scaling group.", "status": "supported"}, {"claim_type": "rule", "conditions": ["bastion host must be highly available without human intervention"], "confidence": "high", "id": "cl-9051dabb6b29", "source_question_ids": ["awssysops-p1-q026"], "statement": "An Auto Scaling group with min-size=1 and max-size=1 spanning multiple Availability Zones gives a bastion host self-healing high availability with zero human intervention, because the ASG's health checks detect failure and automatically launch a replacement in a healthy AZ.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6665232bed16", "source_question_ids": ["awssysops-p1-q026"], "statement": "Running two static bastion instances, or keeping a pre-built standby AMI ready, both still require a human to notice the failure and act, so neither achieves high availability without human intervention.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-59f08028b5d8", "source_question_ids": ["awssysops-p1-q026"], "statement": "An ELB load-balances traffic across healthy targets but does not itself replace a failed bastion instance.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed continuously, every day"], "confidence": "high", "id": "cl-0507e975b571", "source_question_ids": ["awssysops-p1-q029"], "statement": "Baseline server capacity needed every day of the year is most cost-effectively covered by Reserved Instances (heavy utilization).", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed frequently but not every single day"], "confidence": "high", "id": "cl-f03278a6db54", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed on most days but not every day is reasonably covered by On-Demand Instances, since it is used too often to leave unreserved but not continuously enough to justify another year-long Reserved Instance commitment.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed only a few days per year"], "confidence": "high", "id": "cl-2263c52153ff", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed only a handful of days per year is best covered by Spot Instances, since reserving it would commit to a year of cost for rarely-used capacity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c8a1f8029bbf", "source_question_ids": ["awssysops-p1-q029"], "statement": "Using Spot Instances to cover capacity that is needed on most days risks interruption for capacity the application actually needs regularly, which undermines availability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-654beee23c3c", "source_question_ids": ["awssysops-p1-q036"], "statement": "The instance type an Auto Scaling group launches is defined in its launch configuration (or launch template), not in the Auto Scaling group itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a6f1fb95acf8", "source_question_ids": ["awssysops-p1-q036"], "statement": "The Auto Scaling group itself only references a launch configuration and manages capacity/AZ distribution; scaling policies control when to scale; tags are just metadata -- none of these define instance type.", "status": "supported"}, {"claim_type": "rule", "conditions": ["need to change the instance type used by an Auto Scaling group"], "confidence": "high", "id": "cl-bbd91e393133", "source_question_ids": ["awssysops-p1-q036"], "statement": "To change the instance type an Auto Scaling group launches, you create a new launch configuration with the new instance type and point the ASG at it.", "status": "supported"}, {"claim_type": "rule", "conditions": ["sticky sessions enabled on the ELB"], "confidence": "high", "id": "cl-1081779c8879", "source_question_ids": ["awssysops-p1-q053"], "statement": "When sticky sessions are enabled on an ELB, requests from a given user's session are pinned to one specific backend instance for the life of the session, so newly launched Auto Scaling instances receive no traffic from already-connected users.", "status": "supported"}, {"claim_type": "fact", "conditions": ["application uses long-lived connections such as long polling, Comet, or WebSockets"], "confidence": "high", "id": "cl-46b76b34dfff", "source_question_ids": ["awssysops-p1-q053"], "statement": "Long-lived connections such as long polling, Comet, or WebSockets stay pinned to whichever instance accepted them, so existing instances keep serving open connections instead of shedding load to newly launched instances.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-56fc13d41b2b", "source_question_ids": ["awssysops-p1-q053"], "statement": "An ELB's default, non-sticky behavior distributes requests across backend instances without pinning requests from a given user to one specific instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b90af849796b", "source_question_ids": ["awssysops-p1-q053"], "statement": "A browser failing to honor the TTL of an ELB's DNS name is a DNS-level failover issue, not a cause of load imbalance across already-resolved backend instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-519525b65bcf", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can trigger an Auto Scaling policy that scales an Auto Scaling group up or down.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f07f1b1c5929", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can send an SNS notification, including an SMS message.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9871fd8b11de", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can directly stop, terminate, reboot, or recover an EC2 instance as an alarm action.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-b9de0f2dd9eb", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm cannot target an Auto Scaling launch configuration or launch template directly, because a launch configuration is only a blueprint used when a group scales, not an addressable target for an alarm action.", "status": "supported"}, {"claim_type": "rule", "conditions": ["deleting an Auto Scaling group via the CLI"], "confidence": "high", "id": "cl-e0c6f229fec3", "source_question_ids": ["awssysops-p1-q062"], "statement": "Deleting an Auto Scaling group via the CLI requires first setting the group's minimum size and desired capacity to 0, since Auto Scaling refuses to delete a group otherwise.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d05469f44b96", "source_question_ids": ["awssysops-p1-q062"], "statement": "The AWS Management Console automatically sets an Auto Scaling group's minimum size and desired capacity to 0 before deletion, but the CLI delete command does not perform this step automatically.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d6856ec294e6", "source_question_ids": ["awssysops-p1-q062"], "statement": "Manually terminating instances via EC2 or Auto Scaling terminate commands before deleting an Auto Scaling group fights the group's own instance-replacement behavior rather than cleanly draining it.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-73776fc51cc2", "source_question_ids": ["awssysops-p1-q065"], "statement": "Auto Scaling scheduled actions let a group scale up and down automatically at predictable, recurring times without manual effort or a separate batch process.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ac15c6f1195d", "source_question_ids": ["awssysops-p1-q065"], "statement": "Scheduling an Auto Scaling policy to scale up and down every single day wastes capacity on days when traffic is not actually elevated, compared to scheduling only the specific days that need it.", "status": "supported"}, {"claim_type": "rule", "conditions": ["configuring a recurring Auto Scaling scheduled action"], "confidence": "medium", "id": "cl-b363d301375d", "source_question_ids": ["awssysops-p1-q067"], "statement": "A recurring Auto Scaling scheduled action requires specifying the Auto Scaling group name and a recurrence (cron) expression.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["configuring an Auto Scaling scheduled action"], "confidence": "medium", "id": "cl-ac88b48f624b", "source_question_ids": ["awssysops-p1-q067"], "statement": "An Auto Scaling scheduled action requires at least one of MinSize, MaxSize, or DesiredCapacity, so Maximum size alone is not strictly required if Min size or Desired capacity is supplied instead.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["configuring an Auto Scaling scheduled action"], "confidence": "medium", "id": "cl-0f3415e8737a", "source_question_ids": ["awssysops-p1-q067"], "statement": "End time is an explicitly optional parameter for an Auto Scaling scheduled action; it only bounds when a recurring schedule stops.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-75ad36ae1f72", "source_question_ids": ["awssysops-p1-q070"], "statement": "An Auto Scaling launch configuration is only a template/blueprint; AWS never charges for the launch configuration object itself.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-68102fad0835", "source_question_ids": ["awssysops-p1-q070"], "statement": "Deleting or keeping an Auto Scaling launch configuration around after its instances are terminated has no effect on the AWS bill.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-56db4374f2f1", "source_question_ids": ["awssysops-p1-q070"], "statement": "Unattached or unused EBS volumes continue to be billed, so deleting them once no longer needed reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6b92c595ea49", "source_question_ids": ["awssysops-p1-q070"], "statement": "An Elastic IP address that is allocated but not attached to a running instance is billed, so releasing it when not required reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ea1886242af2", "source_question_ids": ["awssysops-p1-q070"], "statement": "An idle Elastic Load Balancer with no instances behind it is still billed, so deleting it reduces cost.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-5f86d011edf5", "source_question_ids": ["awssysops-p1-q075"], "statement": "Setting an Auto Scaling group's minimum capacity causes the group's desired capacity to be set to at least that minimum immediately, so Auto Scaling launches that many instances right away without waiting for a scaling trigger.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instances launched via the same Auto Scaling group"], "confidence": "medium", "id": "cl-ef7191e97bf8", "source_question_ids": ["awssysops-p1-q078"], "statement": "CloudWatch can aggregate statistics across every instance in an Auto Scaling group directly through built-in cross-instance statistics, without a separate analysis tool.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f655ae18068f", "source_question_ids": ["awssysops-p1-q078"], "statement": "It is false that average CPU utilization across instances launched from the same AMI cannot be viewed in CloudWatch merely because each instance has a different instance ID.", "status": "needs-review"}, {"claim_type": "default", "conditions": [], "confidence": "low", "id": "cl-8f9722483bb1", "source_question_ids": ["awssysops-p1-q080"], "statement": "Auto Scaling group-level metrics default to 5-minute ( ently highly available across multiple Availability Zones within a single region without any additional service.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-4084632746a0", "source_question_ids": ["awssysops-p1-q098"], "statement": "Auto Scaling is a plausible but incorrect answer for providing redundancy specifically to an ELB itself, as distinct from providing availability to the instances behind it.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-12ac1c977ad1", "source_question_ids": ["awssysops-p1-q122"], "statement": "A CloudWatch alarm watching the CPU Utilization metric can be configured to notify an Auto Scaling group directly when utilization drops below a threshold, triggering a scale-in policy on that group to remove an instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-83f38ae36e2b", "source_question_ids": ["awssysops-p1-q122"], "statement": "Using an SNS email notification plus manually adjusting Auto Scaling desired capacity can remove an instance on low CPU utilization, but requires a human in the loop rather than automatic scale-in.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a525de4e88f6", "source_question_ids": ["awssysops-p1-q122"], "statement": "Auto Scaling scheduled actions trigger on a fixed schedule, not dynamically in response to a CloudWatch metric like CPU utilization.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-6b027616c185", "source_question_ids": ["awssysops-p1-q122"], "statement": "An Auto Scaling launch configuration is only an instance template; it cannot receive CloudWatch alarm notifications or execute scaling policies, since only the Auto Scaling group itself can.", "status": "supported"}, {"claim_type": "fact", "conditions": [], " tus": "supported"}, {"claim_type": "rule", "conditions": ["new scheduled action's time coincides with an existing scheduled action"], "confidence": "high", "id": "cl-9a286596181c", "source_question_ids": ["awssysops-p1-q143"], "statement": "If a new scheduled Auto Scaling action is submitted for a start time that coincides with an already-scheduled action, the API call is rejected outright with a conflict error rather than being queued, merged, or run alongside the existing one.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "low", "id": "cl-24862e599ba7", "source_question_ids": ["awssysops-p1-q144"], "statement": "Auto Scaling scheduled actions historically could only be created up to one month in advance, which was the reasoning for waiting until late November to schedule a Christmas scale-up.", "status": "needs-review"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-902f4c30d792", "source_question_ids": ["awssysops-p1-q144"], "statement": "Some practitioners report that the one-month-ahead limit on scheduling Auto Scaling actions has since been lifted, allowing scheduled actions to be created more than a month in advance.", "status": "needs-review"}, {"claim_type": "rule", "conditions": ["group has no running instances", "fails to launch an instance for more than 24 hours"], "confidence": "high", "id": "cl-58ce9d3b3af3", "source_question_ids": ["awssysops-p1-q174"], "statement": "When an Auto Scaling group has no running instances and repeatedly fails to launch an instance for more than 24 hours, AWS automatically applies an administrative suspension that pauses the group's scaling processes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ef2e9c2dae7a", "source_question_ids": ["awssysops-p1-q174"], "statement": "Auto Scaling does not retry launching a failed instance for a fixed 72-hour window; that is not how the launch-failure handling ilability Zones and min/max/desired capacity to span the needed zones, then delete the now-redundant second group.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-af0ecd7278f1", "source_question_ids": ["awssysops-p1-q178"], "statement": "Commands such as as-join-auto-scaling-group, as-copy-auto-scaling-group, and as-merge-auto-scaling-group do not exist in the Auto Scaling API/CLI.", "status": "supported"}, {"claim_type": "default", "conditions": ["Auto Scaling launch configuration created via CLI or SDK"], "confidence": "high", "id": "cl-dd08dfc6260c", "source_question_ids": ["awssysops-p1-q193"], "statement": "When an Auto Scaling launch configuration is created via the CLI or an SDK, its InstanceMonitoring.Enabled flag defaults to true, meaning detailed (1-minute) CloudWatch monitoring is already enabled for every instance the group launches.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-94014e3c41fc", "source_question_ids": ["awssysops-p1-q193"], "statement": "Basic (5-minute) EC2 monitoring would only be in effect for an Auto Scaling group's instances if detailed monitoring had been explicitly disabled.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AlarmNotification process type is suspended"], "confidence": "high", "id": "cl-693cc12d9a5c", "source_question_ids": ["awssysops-p1-q203"], "statement": "Suspending the Auto Scaling AlarmNotification process type does not stop CloudWatch from sending alarms to Auto Scaling; it only stops Auto Scaling from executing the associated scaling policy in response to those alarms.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9816740f40ef", "source_question_ids": ["awssysops-p1-q203"], "statement": "AlarmNotification is one of the individually suspendable Auto Scaling process types.", "status": "supported"}, {"claim_type": "rule", "conditi mpute capacity up or down, not storage, ECS capacity, or elastic IP addresses.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e6f0423c9548", "source_question_ids": ["awssysops-p2-q405"], "statement": "Auto Scaling supports three types of scaling: manual scaling, scaling based on a condition such as CPU utilization, and scaling based on a schedule/time.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-5e2f8334d6d2", "source_question_ids": ["awssysops-p2-q405"], "statement": "Whether manual scaling counts as truly 'supported' by Auto Scaling, versus just being the user directly setting capacity rather than Auto Scaling automating anything, is a disputed semantic point among practitioners.", "status": "needs-review"}, {"claim_type": "rule", "conditions": ["instance is found unhealthy"], "confidence": "high", "id": "cl-911cd34160e9", "source_question_ids": ["awssysops-p2-q408"], "statement": "When an instance launched by Auto Scaling becomes unhealthy, Auto Scaling terminates that instance and launches a replacement, keeping the group at its configured desired capacity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-41f2f1f1a637", "source_question_ids": ["awssysops-p2-q413"], "statement": "An Auto Scaling group can span multiple Availability Zones within a single region but cannot span multiple regions; each group is region-specific.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c7184a29d40f", "source_question_ids": ["awssysops-p2-q414"], "statement": "Auto Scaling policies adjust instance count (scaling up/out and down/in) and maintain the desired instance level via health checks and replacement, but they never change an existing instance's type; changing instance type requires a separate manual action.", "status": "supported"}, {"claim_type": "fact", "condit nding Auto Scaling processes prevents the Auto Scaling group from reacting to scaling triggers during the suspension window.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1d630cb80679", "source_question_ids": ["awssysops-p2-q434"], "statement": "An Auto Scaling cooldown period blocks additional scaling activities triggered by CloudWatch alarms until the cooldown period from the prior scaling activity has elapsed.", "status": "supported"}, {"claim_type": "fact", "conditions": ["cooldown period = 5 minutes", "second trigger arrives 2 minutes after the first", "desired capacity starts at 5"], "confidence": "medium", "id": "cl-beb84489a165", "source_question_ids": ["awssysops-p2-q434"], "statement": "Given a 5-minute cooldown period, if an Auto Scaling group at desired capacity 5 receives a trigger to increase capacity by 1 (bringing it to 6 and starting the cooldown), and a second trigger to decrease capacity by 1 arrives 2 minutes later (still inside the cooldown window), the second trigger is ignored and the instance count remains 6 at the 4-minute mark.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ca8b66cfb55b", "source_question_ids": ["awssysops-p2-q434"], "statement": "A claim that no scaling activity occurs at all when a conflicting trigger arrives inside the cooldown window (so the instance count stays at the original desired capacity) is incorrect; it overlooks that the first trigger's scale-out had already started and completed before cooldown blocked the second trigger.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c22ef7c2ef11", "source_question_ids": ["awssysops-p2-q436"], "statement": "A launch configuration is a template that an Auto Scaling group uses to launch EC2 instances, specifying the AMI, instance type, key pair, security groups, and block device mapping.", "status": "supported"}, { lance can still launch new instances to rebalance across Availability Zones but cannot terminate the old ones, allowing the group to temporarily exceed its configured maximum size by roughly 10% until Terminate is resumed.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance scale-in protection is enabled", "termination trigger is unrelated to Spot bid price"], "confidence": "medium", "id": "cl-8b2da1a67646", "source_question_ids": ["awssysops-p2-q463"], "statement": "Instance scale-in protection on an Auto Scaling group blocks Auto Scaling from terminating a protected instance during ordinary scale-in activity triggered by something other than Spot bid price.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["Auto Scaling group instances are Spot Instances"], "confidence": "low", "id": "cl-ab6543e2d344", "source_question_ids": ["awssysops-p2-q463"], "statement": "AWS documentation states that termination protection cannot be enabled for Spot Instances, which creates ambiguity about whether group-level scale-in protection still applies when the Auto Scaling group consists of Spot Instances.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["fast time-to-operational is the deployment priority"], "confidence": "high", "id": "cl-fde730baa7cf", "source_question_ids": ["awssysops-p2-q528"], "statement": "When fast instance operational time (boot speed) is the deployment priority, dependencies should be pre-baked into a \"golden image\" AMI rather than installed at launch via user-data scripts, Lambda functions, or configuration-management tooling run on each boot.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-587004bf8193", "source_question_ids": ["awssysops-p2-q528"], "statement": "Pairing golden-image AMIs with a new Auto Scaling group and a blue/green deployment enables a fast, safely rollback-able application rollout.", "status": "supported"}, {"claim_type": ractor", "conditions": [], "confidence": "medium", "id": "cl-c6bacb87d7ca", "source_question_ids": ["awssysops-p3-1-q795"], "statement": "The Auto Scaling group GroupDesiredCapacity metric is a state metric describing the group's own target size, not a load signal to scale from.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-aa9aa216e4a2", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Amazon CloudFront caches content (static assets, images, software patches, articles) at globally distributed edge locations, so repeat requests are served from the cache instead of hitting the origin, reducing origin load and lowering latency for end users during traffic spikes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["only one regional origin/endpoint exists"], "confidence": "high", "id": "cl-c130c98dd118", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Route 53 latency-based routing only changes anything when multiple regional endpoints/origins exist to route between; with a single origin/endpoint in one region, enabling latency-based routing is a no-op.", "status": "supported"}, {"claim_type": "exception", "conditions": ["single ALB in a single region"], "confidence": "high", "id": "cl-6e2168b5d516", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "With only a single ALB in a single region, enabling Route 53 latency-based routing is a no-op — every request already resolves to that same one load balancer regardless of the routing policy, since latency-based routing only has an effect when multiple regional endpoints exist.", "status": "supported"}, {"claim_type": "fact", "confidence": "medium", "id": "cl-f5e012055e26", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Implementing EC2 Auto Scaling for web servers lets the fleet grow to handle load spikes that would otherwise slow down dynamic content generation.", "status": "supported"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-07b6c66f4ffd", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "An Application Load Balancer's listener cannot be changed to TCP, because ALBs operate only at the application layer (HTTP/HTTPS); TCP listeners are an NLB-only feature.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-4f15257bb6d2", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "Moving static content off S3 onto the web servers adds load to the same instances already implicated in the site's slowness, rather than relieving it.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-1c868159145a", "source_question_ids": ["awssysops-p3-1-q826"], "statement": "For improving performance of a slow single-region website, the source's boxed/labeled answer includes Route 53 latency-based routing (paired with Auto Scaling), but community consensus unanimously favors pairing CloudFront caching of static content with Auto Scaling instead, since latency-based routing is a no-op with only one ALB in one region.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-b529f354039f", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "HTTP 5xx errors that correlate with sustained high CPU utilization on backend EC2 instances indicate a capacity shortage, which is resolved by adding instances via an Auto Scaling group.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6da5aeb8d269", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "Configuring more frequent ALB target group health checks only changes how quickly unhealthy instances are pulled from rotation; it does not add capacity or reduce the CPU load causing 5xx errors.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-18e6da85b6d3", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "Enabling sticky sessions on an Application Load Balancer only helps when load is unevenly distributed across instances, not when overall CPU demand across the fleet is too high.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-236035c03c32", "source_question_ids": ["awssysops-p3-1-q834"], "statement": "Increasing an Application Load Balancer's idle timeout setting affects how long idle client connections are held open and is unrelated to a CPU-driven capacity shortage causing 5xx errors.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9f019281e39d", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "VPC Flow Logs capture network traffic metadata (source/destination IPs, ports, byte and packet counts) and never capture application log file contents.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9c7235220e45", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "The unified CloudWatch agent can stream application log files continuously to CloudWatch Logs as they are written, so the logs are durably captured well before an unhealthy instance is terminated.", "status": "supported"}, {"claim_type": "exception", "conditions": ["log transfer attempted after instance has already reached terminated state"], "confidence": "medium", "id": "cl-5db38b31fe9b", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "An EventBridge rule that reacts to an EC2 instance's transition to the terminated state risks a timing gap, because the instance's EBS volume and in-memory log access may no longer be reliably reachable by the time the rule fires.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-47239174e5a5", "source_question_ids": ["awssysops-p3-1-q859"], "statement": "Changing EC2 storage from EBS to instance store makes logs less durable, not more, since instance store data is lost on instance termination.", "status": "supported"}, {"claim_type": "rule", "conditions": ["EC2 instances are managed by an Auto Scaling group created via a CloudFormation template", "the template defines an AutoScalingRollingUpdate policy"], "confidence": "high", "id": "cl-73d68fe0310e", "source_question_ids": ["awssysops-p3-1-q887"], "statement": "An AutoScalingRollingUpdate policy set in a CloudFormation template lets the Auto Scaling group's instances be replaced in controlled batches during a stack update (e.g., to roll out a patched AMI) while enforcing a minimum number of instances in service throughout the update.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a7ef883ff502", "source_question_ids": ["awssysops-p3-1-q887"], "statement": "Updating a CloudFormation template with a new AMI ID and then rebooting the existing EC2 instances does not apply the new AMI to those instances, because rebooting does not re-launch an instance from a different image.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7edd9bef5fa7", "source_question_ids": ["awssysops-p3-1-q887"], "statement": "Running aws cloudformation update-stack with the --rollback-configuration option only controls rollback and monitoring behavior if the stack update fails; it does not control the instance-replacement strategy used during the update.", "status": "supported"}, {"claim_type": "rule", "conditions": ["template defines an AutoScalingReplacingUpdate policy on the Auto Scaling group resource"], "confidence": "high", "id": "cl-9b80ec8afb44", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "A CloudFormation AutoScalingReplacingUpdate policy replaces an Auto Scaling group's instances with an entirely new group during a stack update, and can immediately roll the stack back without failure if the new version has problems, all while keeping the same load balancer and without requiring any DNS change.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-be297650d674", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Auto Scaling group lifecycle hooks let new instances complete custom actions before entering service, but they provide no documented rollback mechanism of their own if the new application version has problems.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-08c1df183e09", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Manually creating a new AMI and launch configuration and updating the Auto Scaling group to use it has no built-in rollback mechanism if the new version has problems.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cd831e1c7e00", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Deploying a second CloudFormation stack with a new Application Load Balancer and cutting over to it requires a DNS change to redirect traffic to the new load balancer, which violates a requirement to avoid DNS changes during deployment.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-661e5631875f", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "For the question about deploying a new application release without DNS changes and with rollback support, the source's boxed correct answer is using Auto Scaling lifecycle hooks, but community vote is unanimous for using an AutoScalingReplacingUpdate policy instead, since lifecycle hooks have no documented rollback mechanism; the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-988395e180f0", "source_question_ids": ["awssysops-p3-1-q914"], "statement": "A termination lifecycle hook puts an EC2 instance into a wait state before it is actually terminated, giving a defined window to complete a custom action, such as delivering logs to an external system, before termination proceeds.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b12f014853a0", "source_question_ids": ["awssysops-p3-1-q914"], "statement": "Enabling Auto Scaling scale-in protection and then manually detaching the instance removes it from the Auto Scaling group but provides no wait-state or hook for confirming an action like log delivery before the instance is terminated.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-42092a1a17e2", "source_question_ids": ["awssysops-p3-1-q914"], "statement": "A fixed response configured on an Application Load Balancer only affects how the load balancer answers incoming requests; it has no bearing on log delivery before instance termination.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-auto-scaling--m-1", "title": "Auto Scaling as a desired-capacity control loop", "purpose": "Predict what an Auto Scaling group will do (launch, terminate, replace, or nothing) and which object you must change to alter that behavior.", "mechanism": "An Auto Scaling group is a Regional control loop that keeps the number of in-service EC2 instances equal to its desired capacity, bounded by min and max, inside only the AZs/subnets configured on the group. The group itself owns the 'where and how many' (AZs, min/max/desired, health check type, attached load balancers, tags). The launch configuration/template owns the 'what' (AMI, instance type, key pair, security groups, detailed monitoring); it is an immutable, free blueprint, so changing it means creating a new one and pointing the group at it, and only newly launched instances pick it up. Inputs change desired capacity: manual edits, CloudWatch alarms executing scaling policies on the group (never on the launch configuration), and scheduled actions. Raising desired (or min) launches instances immediately; raising max only lifts the ceiling. Health checks (EC2 status by default, ELB only if added) mark instances unhealthy, and the loop terminates and replaces them rather than rebooting. Every action runs through a named, individually suspendable process (Launch, Terminate, HealthCheck, ReplaceUnhealthy, AZRebalance, AlarmNotification, ScheduledActions, AddToLoadBalancer), and cooldowns, warm-up, and lifecycle hooks gate or pause these actions. A load balancer only routes traffic to whatever the loop has registered; it never launches, places, or replaces instances.", "predict_prompt": "An ASG has min=2, desired=2, max=2 in subnets in us-east-1a only, health check type EC2. The ALB marks one instance unhealthy and you raise max to 6. How many instances run, in which AZs, and is the unhealthy one replaced?", "invariants": ["Instances launch only into the AZs/subnets configured on the group; attaching an ELB does not change placement.", "Raising desired capacity (or min above current) launches instances immediately; raising max alone launches nothing.", "Launch configurations are immutable; to change instance type, AMI, or monitoring, create a new one and update the group.", "Alarms and scaling policies target the Auto Scaling group, never the launch configuration.", "Unhealthy instances are terminated and replaced, not rebooted, and do not recover on their own unless health is manually set back.", "With health check type EC2 only, the group ignores ELB 'unhealthy' verdicts.", "A group can span multiple AZs but never multiple Regions."], "limits": ["During AZ rebalancing (or with Terminate suspended while AZRebalance runs) the group can temporarily exceed max by 10% or 1 instance, whichever is greater.", "A scaling policy can only react to a metric CloudWatch can observe; there is no built-in memory metric.", "After more than 24 hours of failed launches with no running instances, AWS administratively suspends the group's processes instead of deleting it.", "Some sourced claims (health-check type behavior, scheduled-action parameters, monitoring defaults) are marked conflicted or needs-review."], "cues": ["'instances only in one AZ, none unhealthy' -> add subnets in the other AZ to the group", "'change instance type / enable detailed monitoring' -> new launch configuration", "'ALB says unhealthy but ASG says healthy' -> set health check type to ELB", "'scale out never happens despite alarm' -> check max size", "'pause scaling to troubleshoot' -> suspend processes", "'analyze or ship logs before termination' -> lifecycle hook"], "claim_ids": ["cl-74d0b20479f9", "cl-4454d72198a1", "cl-89c29e54fd36", "cl-654beee23c3c", "cl-bbd91e393133", "cl-d2868a6f609f", "cl-35061a2ee1ca", "cl-c22ef7c2ef11", "cl-73f2a2e44e9f", "cl-ee7931c80f1a", "cl-75ad36ae1f72", "cl-6b027616c185", "cl-b9de0f2dd9eb", "cl-12ac1c977ad1", "cl-5f86d011edf5", "cl-3d12dc34fa47", "cl-6727af50fbec", "cl-f6e6f2e50fe5", "cl-94533f105047", "cl-f3096f50a1b8", "cl-9021c6e1d856", "cl-ac0d2f92a80c", "cl-911cd34160e9", "cl-7dafe088c316", "cl-aba2774b345d", "cl-bd9ced375d31", "cl-d33bebe23f93", "cl-472e6a92f1dd", "cl-326f17080e14", "cl-1d630cb80679", "cl-325242cc31fe", "cl-3cb2d04162d3", "cl-a7ef883ff502", "cl-bfeb8c26c1b0", "cl-28a54d0afafe", "cl-80f8008f2d10", "cl-58ce9d3b3af3", "cl-41f2f1f1a637", "cl-73776fc51cc2"]}, "contrastSet": {"id": "aws-sysops-service-auto-scaling--cs-1", "subjects": ["Auto Scaling group", "Elastic Load Balancer", "Launch configuration"], "dimensions": ["What it controls", "Replaces failed instances", "Decides AZ placement", "Can be an alarm/scaling-policy target", "How to change it", "Billed"], "shared_traits": ["All three appear together in a standard scalable web tier.", "New ASG instances register automatically with an attached load balancer and are built from the launch configuration."], "matrix": {"What it controls": {"Auto Scaling group": "How many instances and where (min/max/desired, AZs, health type)", "Elastic Load Balancer": "Where incoming requests go among registered healthy targets", "Launch configuration": "What each instance is (AMI, type, SGs, key, monitoring)"}, "Replaces failed instances": {"Auto Scaling group": "Yes: terminates and launches a replacement", "Elastic Load Balancer": "No: only stops routing to it", "Launch configuration": "No: passive blueprint"}, "Decides AZ placement": {"Auto Scaling group": "Yes: only its configured subnets", "Elastic Load Balancer": "No: attaching it does not change placement", "Launch configuration": "No: AZs are chosen on the group"}, "Can be an alarm/scaling-policy target": {"Auto Scaling group": "Yes", "Elastic Load Balancer": "No: it is observed, its metrics feed alarms", "Launch configuration": "No"}, "How to change it": {"Auto Scaling group": "Update group settings in place", "Elastic Load Balancer": "Update listeners, health checks, stickiness", "Launch configuration": "Immutable: create new one, repoint group"}, "Billed": {"Auto Scaling group": "Instances it runs are billed", "Elastic Load Balancer": "Yes, even when idle", "Launch configuration": "Never"}}, "decision_rule": "Ask what the fix must change: instance count, placement, or lifecycle (launch, replace, terminate, AZ spread) -> Auto Scaling group; distribution of incoming requests across already-running instances -> load balancer; properties of each instance (type, AMI, monitoring) -> a new launch configuration.", "boundary_flip": "With healthy instances all in one AZ and zero unhealthy, the fix is the Auto Scaling group (add a subnet in the second AZ), not the ELB. Change the problem to 'the new instances should be a larger instance type' and the answer flips to creating a new launch configuration. Change it to 'one already-running instance gets all the traffic because of sticky sessions' and it flips to the load balancer setting.", "strongest_distractor_failure": "Adding or reconfiguring an ELB looks like a high-availability or throughput fix, but an ELB never launches, places, or replaces instances. It does not fix one-AZ placement, does not replace a failed bastion, does not stop the group's scaling when you deregister instances, does not raise EC2-to-SQS throughput, and it cannot restart an unhealthy instance.", "exceptions": ["The load balancer's verdict does drive replacement once the group's health check type includes ELB; with EC2-only checks it is ignored.", "Sticky sessions and long-lived connections on the load balancer can keep new Auto Scaling instances idle even though the group launched them correctly.", "Suspending AddToLoadBalancer keeps launches going but stops registration; instances launched during the suspension must be registered manually."], "claim_ids": ["cl-74d0b20479f9", "cl-4454d72198a1", "cl-89c29e54fd36", "cl-59f08028b5d8", "cl-ddb93ea39149", "cl-3806c77a8fd0", "cl-cb8cf9380981", "cl-9051dabb6b29", "cl-911cd34160e9", "cl-654beee23c3c", "cl-bbd91e393133", "cl-d2868a6f609f", "cl-c22ef7c2ef11", "cl-ee7931c80f1a", "cl-6b027616c185", "cl-b9de0f2dd9eb", "cl-5f9cc3ab9c43", "cl-75ad36ae1f72", "cl-ea1886242af2", "cl-d169a5435f6e", "cl-1081779c8879", "cl-46b76b34dfff", "cl-f3096f50a1b8", "cl-ac0d2f92a80c", "cl-5e5941c8e2a4", "cl-a24664b6506a"]}, "scenarioFamily": {"id": "aws-sysops-service-auto-scaling--sf-1", "canonical": {"prompt": "An Auto Scaling group is configured with min=2, desired=2, max=2, using subnets only in us-east-1a, and its health check type is set to EC2 only (not ELB). The attached ALB marks one of the two running instances unhealthy because its application stopped responding, even though the EC2 status check still reports the instance as running. An administrator then raises the group's maximum size to 6, hoping this fixes the imbalance. What happens to the group's instance count, its Availability Zone distribution, and the ALB-flagged unhealthy instance?", "expected_answer": ["Desired capacity stays at 2, so the group still runs exactly 2 instances; raising max alone does not by itself launch any new instances.", "Both instances remain in us-east-1a only, since the group was never configured with subnets in another AZ, and raising max does not change where it launches instances.", "The ALB-flagged unhealthy instance is not terminated or replaced, because the group's health check type is EC2 only, so it ignores the ALB's unhealthy verdict entirely."], "reasoning": "Raising a group's maximum size only lifts the ceiling it is allowed to scale to -- it does not itself launch instances or force launches into an underused AZ, since desired capacity (not max) is what drives launches, and an Auto Scaling group only launches instances into the AZs/subnets it is configured to use. Because the health check type is set to EC2 only, the group ignores ELB 'unhealthy' verdicts entirely, so the ALB flagging an instance unhealthy has no effect on that instance's fate while this health check type is in force.", "distractor_analysis": "A tempting but wrong read is that raising max to 6 triggers scale-out to balance the AZs, confusing the ceiling (max) with the trigger for launching (desired capacity). An equally tempting wrong read is that the ALB's unhealthy verdict gets the instance replaced, which ignores that EC2-only health check type makes the group deaf to ELB verdicts.", "claim_ids": ["cl-6727af50fbec", "cl-74d0b20479f9", "cl-f3096f50a1b8"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The Auto Scaling group's health check type now includes ELB (instead of EC2 only); everything else in the canonical scenario is unchanged.", "prompt": "Same setup as before -- min=2, desired=2, max=2, subnets only in us-east-1a -- but now the group's health check type includes ELB, not just EC2 status checks. The ALB marks one of the two instances unhealthy. The administrator again raises max to 6. What happens to the instance count, AZ distribution, and the unhealthy instance?", "expected_answer": ["The group still ends up running 2 instances once replacement completes; raising max to 6 still does not by itself add extra instances beyond desired capacity.", "Instances remain in us-east-1a only; the health check type change does not affect AZ placement.", "The ALB-flagged unhealthy instance IS now terminated and replaced with a new instance, because adding ELB to the health check type is what makes the group act on, rather than ignore, the ALB's unhealthy verdict."], "reasoning": "Adding the ELB health check type is exactly what makes the Auto Scaling group terminate and replace instances the ELB has marked unhealthy; when it is removed from service it is terminated and a fresh instance is launched rather than rebooted in place. This flips only the fate of the unhealthy instance relative to the canonical scenario -- the instance-count and AZ-placement conclusions are unchanged because those are governed by desired capacity and configured subnets, not by health check type.", "claim_ids": ["cl-9021c6e1d856", "cl-7dafe088c316", "cl-74d0b20479f9", "cl-6727af50fbec"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The scenario now explicitly states the group's launch configuration specifies t2.micro instances with detailed monitoring enabled; health check type is still EC2 only.", "prompt": "Same setup as the canonical scenario -- min=2, desired=2, max=2, subnets only in us-east-1a, health check type EC2 only, ALB marks one instance unhealthy, administrator raises max to 6 -- except now you're also told the group's launch configuration specifies t2.micro instances with detailed monitoring enabled. Does this change the instance count, AZ distribution, or the fate of the unhealthy instance?", "expected_answer": ["Desired capacity stays at 2, so the group still runs exactly 2 instances; raising max alone does not by itself launch any new instances.", "Both instances remain in us-east-1a only, since the group was never configured with subnets in another AZ, and raising max does not change where it launches instances.", "The ALB-flagged unhealthy instance is not terminated or replaced, because the group's health check type is EC2 only, so it ignores the ALB's unhealthy verdict entirely."], "reasoning": "The instance type an Auto Scaling group launches is defined on its launch configuration, not the group itself, and the launch configuration has no bearing on desired capacity, AZ placement, or health check behavior. Stating the launch configuration's instance type and monitoring setting is extra detail that doesn't change any of the three conclusions reached in the canonical scenario.", "claim_ids": ["cl-654beee23c3c", "cl-6727af50fbec", "cl-74d0b20479f9", "cl-f3096f50a1b8"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "Instead of raising max size, the administrator attaches a second ELB to the group, believing this will spread the instances into us-east-1b and get the unhealthy instance replaced.", "prompt": "Same canonical setup -- min=2, desired=2, max=2, subnets only in us-east-1a, health check type EC2 only, one instance flagged unhealthy by the ALB -- but instead of raising max size, the administrator attaches a second ELB to the group, believing this will spread instances into us-east-1b and get the unhealthy instance replaced. What actually happens?", "expected_answer": ["The group still runs exactly 2 instances in us-east-1a only; attaching another ELB does not change which Availability Zones the group launches instances into.", "The ALB-flagged unhealthy instance is still not replaced, because the group's health check type remains EC2 only and ignores ELB unhealthy verdicts; attaching a second ELB doesn't change the health check type.", "Attaching a second ELB does not remove a single point of failure or force rebalancing by itself, since an ELB already spans multiple Availability Zones on its own; it never decides where the Auto Scaling group places instances."], "reasoning": "This is the group's strongest distractor pattern: adding or reconfiguring a load balancer looks like it should fix availability or placement problems, but a load balancer only routes traffic to whatever the Auto Scaling group has already launched -- it never launches, places, or replaces instances. Attaching an ELB does not change which AZs the group uses, and a second ELB does not remove a single point of failure since an ELB is already highly available across AZs on its own.", "distractor_analysis": "The administrator's belief that attaching an ELB will rebalance AZs or replace the unhealthy instance is the exact failure mode the mental model warns about: load balancers never control instance count, placement, or replacement.", "claim_ids": ["cl-4454d72198a1", "cl-364df7c366b0", "cl-f3096f50a1b8"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The domain shifts from instance-count/AZ/health-check control for a web tier to scaling an EC2 fleet's throughput against an SQS queue; the question asks which knob actually raises throughput, applying the same 'the Auto Scaling group is what you scale' principle.", "prompt": "A team runs an EC2 fleet in an Auto Scaling group that produces and consumes messages from an SQS queue, and they need to raise the aggregate message throughput between the fleet and SQS. One engineer proposes attaching an ELB in front of the fleet, another proposes switching to EBS-optimized instances, and a third proposes assigning each instance a public IP address. Applying the same principle that it is the Auto Scaling group -- not a load balancer or an instance-level setting -- that controls scaling, what is actually the most scalable way to raise throughput, and are any of the three proposals correct?", "expected_answer": ["Scale the Auto Scaling group itself: configure a CloudWatch alarm/scaling policy watching a queue-depth metric such as ApproximateNumberOfMessagesVisible so the group launches more producer/consumer instances as the backlog grows, raising aggregate throughput.", "None of the three proposals help: an ELB does not improve throughput between EC2 and SQS, because there is no inbound traffic to SQS for an ELB to distribute.", "EBS-optimized instances improve EBS disk I/O, not throughput to the SQS API endpoint, so that proposal doesn't help either.", "Enabling a public IP address affects internet reachability, not throughput to the SQS API endpoint, so that proposal doesn't help either."], "reasoning": "The same core idea from the canonical scenario -- that the Auto Scaling group, not a load balancer or an instance-level setting, is the thing that actually controls scaling -- transfers directly to this SQS throughput problem: the scalable fix is an Auto Scaling group with triggers watching queue depth, while the ELB, EBS-optimization, and public-IP proposals each target something unrelated to the EC2-to-SQS throughput bottleneck.", "claim_ids": ["cl-c719bdb2fd5e", "cl-ddb93ea39149", "cl-18e92d1fc8a0", "cl-692ae06ed096"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "The bastion claim (q026) says an ASG with min=max=1 across multiple AZs gives 'self-healing high availability with zero human intervention'. The q620 claims say a min=desired=max=1 group gives only fault tolerance, not true high availability, and that HA needs at least two running instances. Both sources treat the same configuration as the right or wrong answer to a high-availability requirement. The q620/q925 claims are marked conflicted. The disagreement is unresolved, and the contrast set uses cl-9051dabb6b29 as if it were settled.", "related_entity_ids": ["cl-9051dabb6b29", "cl-715fe867a821", "cl-c8d528b33cea", "aws-sysops-serv
