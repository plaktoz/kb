unch, so changing user data does not run anything on an instance that is already running.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-3aae85179828", "source_question_ids": ["awssysops-p3-1-q894"], "statement": "Running ad hoc commands remotely on an EC2 instance via the AWS CLI is not a managed, repeatable patching mechanism compared to Systems Manager Patch Manager.", "status": "supported"}, {"claim_type": "fact", "conditions": ["SCPs do not apply to the management account or service-linked roles"], "confidence": "medium", "id": "cl-1462348514bd", "source_question_ids": ["awssysops-p3-1-q899"], "statement": "A service control policy (SCP) applied once to an organizational unit (OU) centrally restricts every account and user within that OU to only approved services, and automatically covers any new users or accounts added to the OU later with no extra administrative work.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9e5749bd6010", "source_question_ids": ["awssysops-p3-1-q899"], "statement": "A customer managed IAM policy restricting approved services must be attached individually to every user within an account and re-attached to every new user created afterward, which is more ongoing administrative effort than a single OU-level SCP.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-21c8e51ec0c5", "source_question_ids": ["awssysops-p3-1-q899"], "statement": "IAM policies cannot be applied directly to an organizational unit (OU); they can only be attached to IAM identities within an account.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-93e3b9afd310", "source_question_ids": ["awssysops-p3-1-q899"], "statement": "Amazon API Gateway has no relevance to restricting which AWS services an account's users are permitted to use.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-bf8705223b60", "source_question_ids": ["awssysops-p3-1-q899"], "statement": "For restricting developers in a production account/OU to only approved AWS services with the most operational efficiency, applying a service control policy (SCP) to the production OU is the solution community consensus favors, directly contradicting this question's recorded answer of a customer managed IAM policy.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["internal code paths appear only if the function adds X-Ray SDK subsegments"], "confidence": "medium", "id": "cl-449cc5b4d573", "source_question_ids": ["awssysops-p3-1-q900"], "statement": "AWS X-Ray's service map and traces break a single Lambda invocation down into individual segments and sub-segments, showing exactly which downstream API calls or internal code paths are taking anomalously long.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-691eb2ce9797", "source_question_ids": ["awssysops-p3-1-q900"], "statement": "The CloudWatch Duration metric for a Lambda function only reports the total end-to-end time for the whole invocation and cannot break that total down into its constituent parts.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9a3747f23dc9", "source_question_ids": ["awssysops-p3-1-q900"], "statement": "Manually correlating CloudWatch Logs timestamps or CloudTrail call timing around a Lambda invocation is a cruder, more effort-intensive approximation of the structured trace data that AWS X-Ray already provides natively.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-dfe264924fef", "source_question_ids": ["awssysops-p3-1-q900"], "statement": "For identifying which part of a Lambda function is experiencing higher-than-normal response times, enabling AWS X-Ray is the solution community consensus favors, directly contradicting this question's recorded answer of monitoring the CloudWatch Duration metric.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["access key age exceeds 90 days"], "confidence": "high", "id": "cl-78c60f4f5b23", "source_question_ids": ["awssysops-p3-1-q901"], "statement": "An AWS Config rule can continuously evaluate IAM access key age against a 90-day threshold and trigger a custom AWS Systems Manager Automation document to automatically disable any noncompliant key.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c72b87837d67", "source_question_ids": ["awssysops-p3-1-q901"], "statement": "AWS Trusted Advisor can surface findings about aged IAM access keys but has no automated disable or remediation action of its own.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-112adeabffeb", "source_question_ids": ["awssysops-p3-1-q901"], "statement": "An IAM password policy governs console passwords only and does not apply to IAM access keys.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-048cbdeb29be", "source_question_ids": ["awssysops-p3-1-q901"], "statement": "A custom CloudWatch-alarm-triggered Lambda function to disable aged access keys would need to be built entirely from scratch, unlike the documented, supported AWS Config plus Systems Manager Automation pairing.", "status": "supported"}, {"claim_type": "fact", "conditions": ["member accounts only; SCPs do not apply to the management account"], "confidence": "medium", "id": "cl-78ba52494899", "source_question_ids": ["awssysops-p3-1-q908"], "statement": "Service control policies (SCPs) can restrict actions by the AWS account root user because SCPs act as guardrails on the account itself rather than as identity-attached permissions.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-1db3051c56c8", "source_question_ids": ["awssysops-p3-1-q908"], "statement": "IAM groups and AWS IAM Identity Center (formerly AWS SSO) permission sets are identity-based permissions that do not restrict the AWS account root user; only organization policies such as SCPs can restrict a member account's root user.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-db8ecccc0cb7", "source_question_ids": ["awssysops-p3-1-q908"], "statement": "AWS Directory Service Group Policy Objects (GPOs) are a Windows Active Directory concept for managing domain-joined Windows machines and users, and have no capability to restrict which AWS services an AWS account or its root user can call.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-236f383fb59b", "source_question_ids": ["awssysops-p3-1-q908"], "statement": "For restricting even the AWS account root user to only essential AWS services across multiple accounts, using AWS Organizations with service control policies is the solution community consensus favors, directly contradicting this question's recorded answer of AWS Directory Service Group Policy Objects.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["required cost allocation tags are missing from the EC2 launch request"], "confidence": "high", "id": "cl-d48835040e21", "source_question_ids": ["awssysops-p3-1-q918"], "statement": "An SCP attached to the organization root can deny ec2:RunInstances when required tags are missing from the request (for example, with a Null condition on aws:RequestTag/<key>), blocking noncompliant launches in every member account but not in the management account.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-9deb4356e274", "source_question_ids": ["awssysops-p3-1-q918", "awssysops-p3-1-q932"], "statement": "AWS Config rules in detective mode find and report noncompliant resources only after they exist, and Config cannot block a direct EC2 launch API call; preventing noncompliant launches needs an SCP or IAM conditions.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7cfeb52fd6e6", "source_question_ids": ["awssysops-p3-1-q918"], "statement": "A Lambda function triggered by an EC2 launch event runs only after the instance exists, so it can react (for example, by terminating the instance) but cannot prevent the launch the way an SCP can, and it adds custom code to maintain.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6b353f161f5b", "source_question_ids": ["awssysops-p3-1-q918"], "statement": "A CloudWatch alarm can only react to an EC2 instance after it is already running and lacks the required tags; it cannot prevent the instance from being launched in the first place.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7cd311d9f3fe", "source_question_ids": ["awssysops-p3-1-q924"], "statement": "AWS Service Catalog lets an administrator publish a curated product, together with a launch constraint role, representing the only approved EC2 instance configurations, and then restrict business units to provisioning EC2 instances solely through the Service Catalog interface.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-115787f0d9b5", "source_question_ids": ["awssysops-p3-1-q924"], "statement": "An Auto Scaling launch configuration, a legacy feature replaced by launch templates, only serves Auto Scaling groups and gives no way to restrict business units to approved EC2 configurations; AWS Service Catalog does.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2a976937d313", "source_question_ids": ["awssysops-p3-1-q924"], "statement": "An IAM policy limiting the ec2:RunInstances action combined with a shared AWS CloudFormation template can restrict which action is allowed, but has no built-in concept of an approved catalog of EC2 configurations, unlike AWS Service Catalog's launch constraints.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-806a1ce64f95", "source_question_ids": ["awssysops-p3-1-q930"], "statement": "AWS Systems Manager Run Command can execute a script on managed EC2 instances on demand, with no SSH, bastion host, or remote interactive session of any kind required.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-643ca3dc04ef", "source_question_ids": ["awssysops-p3-1-q930"], "statement": "A cron job or scheduled task on an EC2 instance only runs on a recurring schedule rather than on demand, and setting one up in the first place would typically still require some form of access to the instance to configure it.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-dd3f189b4340", "source_question_ids": ["awssysops-p3-1-q930"], "statement": "Sharing Amazon EC2 key pairs to gain access to production servers is exactly the kind of remote interactive access that a policy blocking all remote interactive access to production servers forbids.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ed60c9ba84ae", "source_question_ids": ["awssysops-p3-1-q930"], "statement": "For running a script on production servers under a policy that blocks all remote interactive access, using AWS Systems Manager (Run Command) is the solution community consensus favors, directly contradicting this question's recorded answer of a cron job or scheduled task.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2ccb200acfee", "source_question_ids": ["awssysops-p3-1-q932"], "statement": "An AWS Config rule can continuously and automatically evaluate EC2 instances against a required-tags check and report noncompliant resources, and can be aggregated across an organization via Config's multi-account, multi-Region data aggregation, with minimal ongoing operational overhead once deployed.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-63983a0285c0", "source_question_ids": ["awssysops-p3-1-q932"], "statement": "Service control policies (SCPs) are a permission-boundary enforcement mechanism, not a detection or reporting tool, so they cannot inspect existing resources and report on their tag state.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-842fee369fb8", "source_question_ids": ["awssysops-p3-1-q932"], "statement": "Amazon Inspector assesses EC2 instances for security vulnerabilities and network exposure, not for tag compliance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-084c636fe0cf", "source_question_ids": ["awssysops-p3-1-q932"], "statement": "The AWS Well-Architected Tool is a manual workload-review framework, not an automated per-resource tag-detection mechanism.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-533638d6d270", "source_question_ids": ["awssysops-p3-1-q932"], "statement": "For automatically detecting EC2 instances with changed or missing cost-related tags with the least operational overhead, using an AWS Config rule is the solution community consensus favors, directly contradicting this question's recorded answer of a service control policy.", "status": "conflicted"}], "mentalModel": {"id": "aws-sysops-service-governance-monitoring-operations--m-1", "title": "Governance tools sort by verb: record, evaluate, prevent, act, advise, inform", "purpose": "Almost every question in this slice describes a governance or operations requirement and offers several AWS management services that all sound plausible. Each service does exactly one job. If you can name the verb the requirement asks for, you can pick the right service and rule out the distractors that do a different job.", "mechanism": "Each governance service does one job at one point in a resource's life. (1) RECORD who did what: CloudTrail logs every API call with the caller's identity, time, and source. That covers management (control-plane) events by default, and data events such as S3 GetObject/PutObject or SQS SendMessage once you enable them. CloudTrail blocks nothing. For anything older than the 90-day console history, query the S3-stored logs with Athena. Integrity validation (SHA-256 hashes plus a signed digest) proves the logs were not tampered with, and an organization trail covers every member account in one step. (2) EVALUATE whether resources are compliant now: AWS Config records configuration state and checks it against managed or custom rules (encrypted-volumes, restricted-common-ports, approved AMIs, required tags, S3 logging). A rule on its own only detects and reports. It changes something only when you attach a remediation action, usually an SSM Automation document. (3) PREVENT the action before it happens: an SCP in AWS Organizations sits above IAM on an OU or account. It caps what every principal can do, including a member account's root user, and nothing inside the account can override it. It grants no permissions and provisions nothing. Proactive provisioning tools (Service Catalog, CloudFormation) control what gets created at creation time. (4) ACT on instances: Systems Manager does the work. Run Command executes ad hoc scripts across a fleet without SSH, Patch Manager installs patches in place under rate controls, Session Manager gives shell access through the agent's outbound channel, and Parameter Store holds secrets. (5) ADVISE: Trusted Advisor runs best-practice and service-limit checks. It reports but does not fix anything. (6) INFORM about AWS-side events: the AWS Health Dashboard account view shows AWS events and scheduled maintenance that affect your own resources. The public service health view shows only general AWS status. Distractors are nearly always a real service doing a different verb, for example CloudTrail offered to block something, Config offered to prevent something, Trusted Advisor or Inspector offered to remediate, or an SCP offered to report.", "predict_prompt": "A requirement says 'ensure no one in the production accounts can ever launch an EC2 instance without a CostCenter tag.' Before you look at the options: which verb is this, and which service would an exam writer put next to the right answer as the most tempting distractor?", "invariants": ["CloudTrail records API activity and the caller's identity. It never blocks an action.", "An AWS Config rule detects and reports after the resource exists. It changes something only when a remediation action (such as SSM Automation) is attached.", "An SCP is preventive and cannot be overridden from inside the member account, including by the root user or by IAM editors. It does not apply to the management account or to service-linked roles.", "SCPs and IAM policies only restrict or grant actions. They never detect existing misconfigurations or report on resource state.", "Trusted Advisor and Inspector assess and report. Neither applies a fix.", "Systems Manager is the service that changes running instances (commands, patches, sessions). Changing an AMI or user data does not reach instances that are already running."], "limits": ["OpsWorks reached end of life in 2024. Questions that expect OpsWorks or Chef answers are legacy items.", "Several source questions have a recorded answer that the community vote contradicts (for example Tag Editor, cost-allocation tags, or a CloudWatch Duration metric chosen over the purpose-built tool). In those cases, trust the verb-to-service mapping over the recorded answer.", "The model covers which service to choose. It does not cover detailed configuration syntax such as SCP condition keys or OpsWorks deploy JSON attributes."], "cues": ["'who', 'which user', 'audit', 'API call', 'attribute' -> CloudTrail (with Athena for long time ranges)", "'continuously evaluate', 'compliant', 'report non-compliant', 'desired state' -> AWS Config rule", "'prevent', 'ensure no one can', 'even the root user', 'cannot be overridden' -> SCP", "'run a script on 1,000 instances', 'patch', 'no SSH', 'store credentials' -> Systems Manager", "'service limits', 'best-practice check', 'root MFA check' -> Trusted Advisor", "'scheduled maintenance affecting our resources' -> AWS Health Dashboard account view or Health API", "'self-service approved products without template access' -> Service Catalog"], "claim_ids": ["cl-c85cba2dc710", "cl-a30320d35f30", "cl-ce8830aec408", "cl-3681ae0b56d0", "cl-bbf96a4e1c8f", "cl-c9dc2e35cfcf", "cl-e45f82e95995", "cl-d47bcefac7cf", "cl-cab333881f3f", "cl-a62a7ea62141", "cl-f7c162c729b8", "cl-a311186bf77d", "cl-26c6f4c0cc0c", "cl-04b179164e7f", "cl-c4eed9d0b113", "cl-f6e647b6e04f", "cl-06e44bd55a90", "cl-506cb4a6155e", "cl-ca52937afaf5", "cl-dad25f9b8aea", "cl-63983a0285c0", "cl-9deb4356e274", "cl-7b988c689f0e", "cl-bccbdd36f629", "cl-707db80d8711", "cl-d411579a6689", "cl-dabd67b68ec0", "cl-9a6a1f886d77", "cl-520c0d8ae6f8", "cl-5bca7a1d0274", "cl-393ef005f5b3", "cl-16232ccb55f6", "cl-d163916cfa80", "cl-ff201c8c9504", "cl-0506972f7f13", "cl-37ee6dccb157", "cl-4521d946e715", "cl-d1d2ea3df8ef", "cl-f0207a806e25", "cl-ccd3a43bbf68", "cl-870bb5174e14", "cl-14dc03ce987a", "cl-dfe264924fef", "cl-533638d6d270"]}, "contrastSet": {"id": "aws-sysops-service-governance-monitoring-operations--cs-1", "subjects": ["Service control policy (SCP)", "AWS Config rule", "AWS CloudTrail"], "dimensions": ["When it acts relative to the action", "What it produces", "Can it stop the action?", "Scope across accounts", "Typical requirement wording"], "shared_traits": ["All three are native, low-overhead governance controls that can span multiple accounts in an organization.", "Each is preferred over a hand-built Lambda, cron, or polling solution that does the same job."], "matrix": {"When it acts relative to the action": {"Service control policy (SCP)": "Before: the API call is evaluated and denied up front", "AWS Config rule": "After: evaluates the resource once it exists or changes", "AWS CloudTrail": "During/after: logs the call as it happens"}, "What it produces": {"Service control policy (SCP)": "An allow/deny ceiling on permissions (grants nothing)", "AWS Config rule": "A compliant/non-compliant status per resource, plus optional remediation", "AWS CloudTrail": "Event records: who, what API, when, source IP"}, "Can it stop the action?": {"Service control policy (SCP)": "Yes, even for a member account's root user", "AWS Config rule": "No. It detects only, or remediates afterward via SSM Automation", "AWS CloudTrail": "No. It only records"}, "Scope across accounts": {"Service control policy (SCP)": "Attached at root/OU/account; covers new accounts automatically; not the management account", "AWS Config rule": "Per account/Region; multi-account aggregation for reporting", "AWS CloudTrail": "Organization trail covers all member accounts; logs can go to a central S3 bucket"}, "Typical requirement wording": {"Service control policy (SCP)": "'prevent', 'ensure no one can', 'only approved services'", "AWS Config rule": "'detect', 'continuously evaluate', 'report non-compliant'", "AWS CloudTrail": "'who did it', 'audit API activity', 'attribute the change'"}}, "decision_rule": "The single dimension that decides the answer is timing relative to the action. If the action must be stopped before it happens, choose an SCP. If you need the compliance state of resources that already exist, choose an AWS Config rule. If you need a record of who made which API call, choose CloudTrail. None of the three can do another's job. CloudTrail cannot block or judge compliance, Config cannot block an API call, and an SCP cannot report on existing resources.", "boundary_flip": "Start with 'automatically detect EC2 instances whose cost-allocation tags are missing or changed, with the least operational overhead.' The answer is an AWS Config required-tags rule, aggregated across the organization. Change the requirement to 'block any EC2 launch that lacks the required cost-allocation tags in every member account' and the answer flips to an SCP that denies ec2:RunInstances using a Null condition on aws:RequestTag/<key>. Change it again to 'find out which IAM user created these untagged Elastic IPs last month' and the answer becomes CloudTrail queried with Athena.", "strongest_distractor_failure": "Choosing an AWS Config rule (or Config plus a Lambda that terminates the resource) when the requirement says 'prevent'. Config evaluates only after the resource exists, so the non-compliant service or instance actually runs in production before it is detected and shut down. That is a reactive control with a window of exposure, which an SCP denial avoids. The mirror-image failure is choosing an SCP when the requirement is to detect or report on existing resources, because an SCP cannot inspect resource state.", "exceptions": ["SCPs do not restrict the management account or service-linked roles. A 'prevent' requirement in the management account needs IAM-level controls instead.", "A Config rule plus SSM Automation remediation can enforce a fix after the fact (for example disabling access keys older than 90 days, or closing an open security group port). That is still detective-then-corrective, not preventive.", "For the event stream of KMS key deletion and rotation, use CloudTrail, not a Config rule. A Config rule is a point-in-time state check, and EventBridge delivers rotation events only on a best-effort basis."], "claim_ids": ["cl-f6e647b6e04f", "cl-596e59683c2f", "cl-dd1943cef242", "cl-d48835040e21", "cl-9deb4356e274", "cl-7cfeb52fd6e6", "cl-2ccb200acfee", "cl-63983a0285c0", "cl-533638d6d270", "cl-ce8830aec408", "cl-ccd3a43bbf68", "cl-55e0b82eda70", "cl-5ec2be5f8422", "cl-f7c162c729b8", "cl-a311186bf77d", "cl-1e768c8dba9f", "cl-b822ebe3a81f", "cl-26c6f4c0cc0c", "cl-78c60f4f5b23", "cl-ca52937afaf5", "cl-06e44bd55a90", "cl-1462348514bd", "cl-c85cba2dc710", "cl-a62a7ea62141", "cl-54b8c2f32632", "cl-ede5c5c84e3e", "cl-9829f873bfb9"]}, "scenarioFamily": {"id": "aws-sysops-service-governance-monitoring-operations--sf-1", "canonical": {"prompt": "Your company runs AWS Organizations with member accounts across several teams. Finance wants an automated way to continuously find any EC2 instance whose cost-allocation tags are missing or have been changed after launch, with findings aggregated across every account in the organization, and with the least possible ongoing operational overhead. What should you set up?", "expected_answer": ["An AWS Config rule (e.g. a required-tags rule) that continuously evaluates EC2 instances for the correct cost-allocation tags, with its findings aggregated across all member accounts via AWS Config's multi-account, multi-Region data aggregation."], "reasoning": "The requirement is to detect and report tag drift on resources that already exist, not to stop anything before it happens. AWS Config is the detective verb for 'evaluate whether resources are compliant now': an AWS Config rule records configuration state and checks it against a desired state (here, the required tags), and Config's built-in multi-account, multi-Region aggregation covers every account in the organization without any custom polling or scanning. This is the solution the exam's own community consensus favors for this exact requirement, directly contradicting the source question's recorded answer of a service control policy.", "distractor_analysis": "A service control policy (SCP) looks tempting because it is also an org-wide, centrally applied control, but SCPs are a permission-boundary (allow/deny) mechanism: they restrict actions and cannot inspect an already-existing resource's current tag state, so they cannot detect or report non-compliance. CloudTrail is also tempting since it already logs the RunInstances call, but CloudTrail only records API activity, not the resource's current configuration, so it cannot by itself show tag compliance.", "claim_ids": ["cl-2ccb200acfee", "cl-533638d6d270", "cl-f7c162c729b8", "cl-63983a0285c0", "cl-ccd3a43bbf68"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The requirement flips from detecting already-missing or already-changed tags after the fact to blocking the EC2 launch itself whenever the required cost-allocation tags are absent from the request, in every member account.", "prompt": "Same organization, same tagging policy -- but now the requirement is to make sure no EC2 instance can ever actually launch in any member account unless the required cost-allocation tags are present in the launch request itself. What should you set up?", "expected_answer": ["A service control policy (SCP) attached at the organization root or the relevant OU that denies ec2:RunInstances whenever the required tag keys are missing from the request, for example using a Null condition on aws:RequestTag/<key>. This blocks noncompliant launches in every member account (but not in the management account)."], "reasoning": "Because the verb flipped from 'detect/report after the fact' to 'prevent before it happens,' the answer flips too: AWS Config only evaluates resources once they already exist and cannot block an API call, so it cannot satisfy a hard block. An SCP sits above IAM and can deny the RunInstances call itself based on the request's tags, stopping the launch before any untagged instance ever runs.", "distractor_analysis": "A Lambda function triggered after instance launch, or a CloudWatch alarm reacting to an already-running untagged instance, are both reactive: the noncompliant instance exists and runs in production for some window before anything terminates it. Only a preventive SCP denial avoids that window entirely.", "claim_ids": ["cl-d48835040e21", "cl-9deb4356e274", "cl-63983a0285c0", "cl-7cfeb52fd6e6", "cl-6b353f161f5b"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "Added operationally-flavored but non-decisive details -- the organization now spans 12 member accounts across 3 regions, different teams provision instances with a mix of Terraform, the AWS CLI, and the console, and some required tags carry optional free-text notes -- while the underlying requirement (detect missing/changed cost-allocation tags after the fact, org-wide, least overhead) is unchanged.", "prompt": "The same finance requirement applies, but now spans 12 member accounts across 3 AWS regions. Different engineering teams provision EC2 instances using a mix of Terraform, the AWS CLI, and the console, and some of the required tags carry optional free-text notes appended by whoever launched the instance. Finance still just wants automated, continuous detection of any EC2 instance missing or diverging from the required cost-allocation tags, aggregated across the whole organization, with minimal ongoing operational overhead. What should you set up?", "expected_answer": ["An AWS Config rule (e.g. a required-tags rule) that continuously evaluates EC2 instances for the correct cost-allocation tags, with its findings aggregated across all member accounts via AWS Config's multi-account, multi-Region data aggregation."], "reasoning": "None of the added details change which verb the requirement is asking for -- it is still 'evaluate whether resources that already exist are compliant,' which is AWS Config's job regardless of how many accounts or regions are involved, which provisioning tool created the instance, or whether tags carry extra free-text content. AWS Config's rule evaluation and multi-account, multi-Region aggregation are built to span exactly this kind of fleet without any change to the underlying control.", "claim_ids": ["cl-2ccb200acfee", "cl-f7c162c729b8"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "The scenario now points out that an AWS CloudTrail organization trail is already enabled and already logs every RunInstances call together with the tags passed at launch, making CloudTrail look like it could satisfy the same detection requirement -- the underlying requirement itself (detect tag drift) is unchanged.", "prompt": "You already have an AWS CloudTrail organization trail running, and it faithfully logs every RunInstances call, including the exact tags that were passed in at launch time. A teammate suggests just querying those CloudTrail logs with Athena to find every EC2 instance that is missing or has diverging cost-allocation tags, instead of standing up anything new. Finance still wants this detection continuous and org-wide with minimal overhead. Is the teammate's CloudTrail/Athena approach sufficient, or what should you set up instead?", "expected_answer": ["An AWS Config rule (e.g. a required-tags rule) that continuously evaluates EC2 instances for the correct cost-allocation tags, with its findings aggregated across all member accounts via AWS Config's multi-account, multi-Region data aggregation."], "reasoning": "CloudTrail is a strong-looking distractor here because it does capture the tags present at the moment of the RunInstances call, but that is a one-time snapshot of the launch request, not the instance's current configuration. If a tag is removed or changed later through the console or another API call, CloudTrail's RunInstances record never updates to reflect that, and nothing re-evaluates the instance's live state going forward. AWS Config is still required because it is purpose-built to re-check the resource's actual, current configuration continuously, not just the historical request that created it.", "distractor_analysis": "Querying CloudTrail with Athena only reconstructs what tags were requested at creation time; it cannot see tag changes made afterward and provides no ongoing, continuously-refreshed compliance status the way an AWS Config rule does, because CloudTrail logs API activity rather than the configuration state of a resource.", "claim_ids": ["cl-ccd3a43bbf68", "cl-2f582a034417", "cl-a30320d35f30", "cl-f7c162c729b8"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The resource and compliance dimension change from EC2 instance cost-allocation tags to S3 bucket server-access logging, while the underlying requirement shape -- continuously detect existing resources that drift out of a desired configuration state, org-wide, with minimal overhead -- is the same.", "prompt": "A different team now has a parallel requirement: continuously find any S3 bucket in the organization that does not have server access logging enabled, so the security team can follow up, with minimal ongoing operational overhead. What should you set up?", "expected_answer": ["An AWS Config rule (specifically the S3_BUCKET_LOGGING_ENABLED managed rule) that continuously evaluates every S3 bucket for server access logging and flags any bucket without it as non-compliant -- the same detective, continuously-evaluating pattern as an AWS Config required-tags rule."], "reasoning": "This is the same verb as the canonical scenario -- detect drift on resources that already exist -- just applied to a different resource type. The managed AWS Config rule S3_BUCKET_LOGGING_ENABLED does exactly that for buckets, continuously flagging any bucket without logging enabled, the same way a required-tags rule flags EC2 instances without the right tags.", "distractor_analysis": "AWS CloudTrail logging and S3 server access logging are easy to conflate by name, but CloudTrail records account API activity while S3 server access logging is a per-bucket setting about who accessed objects in that bucket; enabling one says nothing about whether the other is on.", "claim_ids": ["cl-50f60ef38d37", "cl-2f582a034417"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "awssysops-p3-1-q932: the recorded answer is a service control policy, but the community-favored answer is an AWS Config required-tags rule (cl-533638d6d270). The source question disagrees with itself. The contrast set's boundary_flip and decision_rule still present 'AWS Config required-tags rule' as the settled answer for the detect-missing-tags scenario, and cite the conflicted claims cl-2ccb200acfee and cl-63983a0285c0 as if they were established. The dispute is resolved by siding with the community instead of being flagged.", "related_entity_ids": ["cl-533638d6d270", "cl-2ccb200acfee", "cl-63983a0285c0", "cl-9deb4356e274", "aws-sysops-service-governance-monitoring-operations--cs-1"]}, {"type": "contradiction", "severity": "high", "description": "Several source questions have a recorded (boxed) answer that the community vote contradicts: q338 (direct CloudFormation template access vs Service Catalog), q549 (cost-allocation tag vs CloudTrail/Athena), q899 (customer managed IAM policy vs SCP), q900 (CloudWatch Duration metric vs X-Ray), q908 (Directory Service GPOs vs SCP), and q930 (cron job vs Systems Manager Run Command). The mental model's limits tell the learner to 'trust the verb-to-service mapping over the recorded answer'. That settles each dispute in the community's favor, which is effectively a majority-vote resolution. These disputes should stay flagged as unresolved. The limits section names only three of these cases.", "related_entity_ids": ["cl-f0207a806e25", "cl-cf570c7a26de", "cl-55e0b82eda70", "cl-5ec2be5f8422", "cl-bf8705223b60", "cl-9e5749bd6010", "cl-dfe264924fef", "cl-691eb2ce9797", "cl-236f383fb59b", "cl-ed60c9ba84ae", "cl-643ca3dc04ef", "aws-sysops-service-governance-monitoring-operations--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "awssysops-p2-q599 is flagged disputed. The boxed answer is manual Tag Editor search, and the community vote splits between two proactive options without reaching the 60% threshold (cl-0b0666c8c445). The mental model groups this with cases where 'the community vote contradicts' the recorded answer and says to trust the verb mapping. The vote has no majority, and the PREVENT verb does not pick between CloudFormation and Service Catalog, so the correct answer is still undetermined. Citing cl-7b988c689f0e and cl-bccbdd36f629 as settled overstates the source.", "related_entity_ids": ["cl-0b0666c8c445", "cl-7b988c689f0e", "cl-bccbdd36f629", "cl-9ea5af9b4057", "aws-sysops-service-governance-monitoring-operations--m-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model's limits say to resolve the q900 dispute (CloudWatch Duration vs X-Ray) with the verb-to-service mapping, and its claim_ids include cl-dfe264924fef. The six-verb taxonomy (record, evaluate, prevent, act, advise, inform) has no slot for distributed tracing or X-Ray, so the model cannot produce the answer it says it supports.", "related_entity_ids": ["cl-dfe264924fef", "cl-449cc5b4d573", "cl-691eb2ce9797", "aws-sysops-service-governance-monitoring-operations--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "The contrast set's exceptions state as fact that KMS key deletion and rotation should be tracked with CloudTrail delivered to a central bucket, because 'EventBridge delivers rotation events only on a best-effort basis.' Every claim behind this from awssysops-p3-1-q657 (cl-60f3c8470839, cl-54b8c2f32632, cl-9829f873bfb9) is marked conflicted. The source disagreement over the delivery guarantees and the correct answer is presented as settled.", "related_entity_ids": ["cl-60f3c8470839", "cl-54b8c2f32632", "cl-9829f873bfb9", "cl-ede5c5c84e3e", "aws-sysops-service-governance-monitoring-operations--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "Several SCP claims the synthesis relies on are conflicted in their source questions. q639 (cl-419ba23b1c0e, cl-c4964157b1ec), q908 (cl-78ba52494899, cl-1db3051c56c8; the recorded answer is GPOs), q899 (cl-1462348514bd), and q575 (cl-dad25f9b8aea; it is disputed whether Organizations/SCPs or StackSets meets the 'same IAM roles in every account' requirement). The mental model invariant ('An SCP ... cannot be overridden from inside the member account, including by the root user') and the contrast set rows treat these as uncontested. Also, cl-b38e637392dc's 'condition' field holds a caveat that points to StackSets instead of describing when the rule applies, which hides the q575 dispute.", "related_entity_ids": ["cl-419ba23b1c0e", "cl-c4964157b1ec", "cl-78ba52494899", "cl-1db3051c56c8", "cl-1462348514bd", "cl-dad25f9b8aea", "cl-b38e637392dc", "aws-sysops-service-governance-monitoring-operations--m-1", "aws-sysops-service-governance-monitoring-operations--cs-1"]}, {"type": "contradiction", "severity": "low", "description": "awssysops-p3-1-q794 (cl-91f9f840849c, cl-e2f919aa30b2, both conflicted) prefers adding targeted deny statements to the default FullAWSAccess SCP over a comprehensive allow-only SCP. awssysops-p3-1-q650 (cl-f6e647b6e04f, supported, cited in both m-1 and cs-1) prefers a whitelist-style allow-list SCP. The scenarios differ, but nothing in the slice explains when to choose a deny-list over an allow-list SCP, and q794's own answer is disputed.", "related_entity_ids": ["cl-91f9f840849c", "cl-e2f919aa30b2", "cl-f6e647b6e04f"]}, {"type": "contradiction", "severity": "medium", "description": "awssysops-p3-1-q711 produced two opposing rules, both conflicted. cl-9ac235e3df26 recommends splitting the centralized log group into per-team log groups to remove pattern ambiguity. cl-bb9233cc7c2f recommends keeping the centralized log group with per-team metric filters to avoid redesign cost. The source question does not settle which approach is correct.", "related_entity_ids": ["cl-9ac235e3df26", "cl-bb9233cc7c2f", "cl-fc6219a16160"]}, {"type": "contradiction", "severity": "medium", "description": "The Trusted Advisor 'advise' claims behind the mental model cues ('service limits', 'root MFA check' -> Trusted Advisor) are conflicted in their sources. q613: cl-d163916cfa80, cl-632d11be9d18, cl-e7fe91ceef8c. q706: Trusted Advisor (cl-03186cccb007) and CloudTrail RunInstances error responses (cl-63ab9e605693) are both conflicted candidate answers. q625: cl-1efd25d4badc, cl-ae13616f77a9. The cue presents Trusted Advisor as the uncontested answer. Separately, cl-e7fe91ceef8c says CloudTrail has 'no mechanism for surfacing service-limit warnings', while cl-63ab9e605693 says CloudTrail RunInstances responses directly diagnose limit-exceeded failures. These two are in tension.", "related_entity_ids": ["cl-d163916cfa80", "cl-632d11be9d18", "cl-e7fe91ceef8c", "cl-03186cccb007", "cl-63ab9e605693", "cl-1efd25d4badc", "cl-ae13616f77a9", "aws-sysops-service-governance-monitoring-operations--m-1"]}, {"type": "ambiguity", "severity": "medium", "description": "The AWS Health / Personal Health Dashboard claims are conflicted across q607 (cl-4521d946e715, cl-d1d2ea3df8ef), q663 (cl-020ad706d653, cl-900c25416860), q702 (cl-73ca82512b48), and q721 (cl-557de50c6a2a, cl-13fd09b20fde). cl-acbad04f22cb (q721) records that 'maintenance events performed by AWS' can be read as pointing to the public Service Health Dashboard rather than the account-specific Health API, so the question wording is ambiguous. The mental model cue ('scheduled maintenance affecting our resources' -> Health Dashboard account view or Health API) and the INFORM verb treat the mapping as unambiguous.", "related_entity_ids": ["cl-4521d946e715", "cl-d1d2ea3df8ef", "cl-020ad706d653", "cl-900c25416860", "cl-73ca82512b48", "cl-557de50c6a2a", "cl-13fd09b20fde", "cl-acbad04f22cb", "aws-sysops-service-governance-monitoring-operations--m-1"]}, {"type": "ambiguity", "severity": "medium", "description": "awssysops-p3-1-q778 is unresolved. cl-b3b922a55d0b records open community disagreement over whether cost allocation tags must first be created with Tag Editor in the resource-owning account, or can be created directly in the payer account's Cost Allocation Tags manager. cl-a88d8999b79d (only the payer account can access the Cost Allocation Tags manager) is marked needs-review with no supporting resolution.", "related_entity_ids": ["cl-b3b922a55d0b", "cl-a88d8999b79d"]}, {"type": "stale-risk", "severity": "medium", "description": "The awssysops-p2-q325 OpsWorks claims (cl-30ac478fa761, cl-d84ee787387c, cl-09d4ce7c3321, cl-263074c7bf39, cl-b53084777cca) are marked supported and give no end-of-life caveat. Other OpsWorks claims in the same slice (cl-e84ea9421046, cl-14dc03ce987a, cl-3870793759c6) state that all OpsWorks offerings reached end of life in 2024. These claims teach configuration details for a retired service as if they were current.", "related_entity_ids": ["cl-30ac478fa761", "cl-d84ee787387c", "cl-09d4ce7c3321", "cl-263074c7bf39", "cl-b53084777cca", "cl-3870793759c6"]}, {"type": "stale-risk", "severity": "low", "description": "The synthesis says flatly that an AWS Config rule 'detects and reports after the resource exists' (invariant) and acts 'After' (contrast matrix). The source claim cl-9deb4356e274 explicitly limits this to 'detective mode'. AWS Config also has a proactive evaluation mode that checks resource configurations before provisioning. Dropping that qualifier overstates the claim.", "related_entity_ids": ["cl-9deb4356e274", "aws-sysops-service-governance-monitoring-operations--m-1", "aws-sysops-service-governance-monitoring-operations--cs-1"]}, {"type": "quality", "severity": "low", "description": "cl-04b179164e7f (high confidence, cited by m-1) says the encrypted-volumes rule 'continuously evaluate[s] whether EBS volumes are encrypted'. The conflicted sibling claim cl-a117dbabd900 from the same question limits it to attached volumes, evaluated on configuration change. The cited claim overstates the rule's scope.", "related_entity_ids": ["cl-04b179164e7f", "cl-a117dbabd900", "aws-sysops-service-governance-monitoring-operations--m-1"]}, {"type": "quality", "severity": "low", "description": "cl-7b988c689f0e (cited by m-1) lists IAM as a proactive tagging tool that 'appl[ies] tags automatically at the moment a resource is created.' IAM can require tags on create through conditions, but it never applies tags itself.", "related_entity_ids": ["cl-7b988c689f0e", "aws-sysops-service-governance-monitoring-operations--m-1"]}, {"type": "quality", "severity": "low", "description": "cl-d0967fc4bf8e (conflicted, q331) says CloudTrail logs are 'generated by and fully within a customer's own control'. CloudTrail records are generated by AWS on the customer's behalf. The customer controls where they are stored and who can access them.", "related_entity_ids": ["cl-d0967fc4bf8e"]}, {"type": "contradiction", "severity": "low", "description": "Other claims marked conflicted in their source questions are not addressed by the synthesis and have no recorded resolution. q579 (cl-bfd135f007b9, cl-e143f0cd24ab; cl-4e0b1b048f58 needs-review), q670 (cl-384c96ff8527, cl-2348ff49ebc6, cl-ac7808999646), q729 (cl-b2b6736e6213), q742 (cl-83ecc205c3be), q774 (cl-6bcfe5ea9671), q785 (cl-4e34ba5cd81c, cl-b5fc3febfeac), q793 (cl-7746cf0efb4e), q802/q884 (cl-6fafd2c6e073, cl-a04c0a638681, cl-077285de0a69), q841 (cl-3682f73ebd39, cl-9e9a70f302f3, cl-5db2c1a664e8, cl-0ebe1240695d, cl-38d22ed73fdd), q845 (cl-bd808fa45485, cl-e613b67ee3dc), q872 (cl-5dc877d4fcb9, cl-e7321c0ef200), q894 (cl-cad1acbc10b7), q924 (cl-115787f0d9b5), q549 (cl-5c5c6bba2e4a).", "related_entity_ids": ["cl-bfd135f007b9", "cl-e143f0cd24ab", "cl-4e0b1b048f58", "cl-384c96ff8527", "cl-2348ff49ebc6", "cl-ac7808999646", "cl-b2b6736e6213", "cl-83ecc205c3be", "cl-6bcfe5ea9671", "cl-4e34ba5cd81c", "cl-b5fc3febfeac", "cl-7746cf0efb4e", "cl-6fafd2c6e073", "cl-a04c0a638681", "cl-077285de0a69", "cl-3682f73ebd39", "cl-9e9a70f302f3", "cl-5db2c1a664e8", "cl-0ebe1240695d", "cl-38d22ed73fdd", "cl-bd808fa45485", "cl-e613b67ee3dc", "cl-5dc877d4fcb9", "cl-e7321c0ef200", "cl-cad1acbc10b7", "cl-115787f0d9b5", "cl-5c5c6bba2e4a"]}, {"type": "parse", "severity": "low", "description": "The six claims from awssysops-p3-1-q850 have no 'conditions' field, while every other claim in the slice has one (even if it is an empty array). cl-664d7e9ea9dc and cl-ce77bed09b9c also say nearly the same thing.", "related_entity_ids": ["cl-664d7e9ea9dc", "cl-55261824367b", "cl-971df35b7513", "cl-ce77bed09b9c", "cl-5e69be053fb2", "cl-8efc43b126e0"]}], "sourceQuestionCount": 75}], "sources": {"kind": "locked", "file": "aws-sysops-service-governance-zmjb.sources.enc.js"}}</script>
