<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-governance-monitoring-operations", "exam": "aws-sysops", "facet": {"key": "service", "value": "Governance, monitoring & operations", "grouped": true, "group_index": 1, "group_count": 1, "grouped_values": ["Organizations", "CloudTrail", "Systems Manager", "AWS Config", "Service Catalog", "Personal Health Dashboard", "Trusted Advisor", "OpsWorks", "Control Tower", "CloudFormation StackSets", "CloudWatch Logs", "X-Ray", "EventBridge", "CLI"], "group": "governance"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e84ea9421046", "source_question_ids": ["awssysops-p1-q038"], "statement": "Until its May 2024 end of life, AWS OpsWorks Stacks natively ran Chef recipes on application lifecycle events (setup, configure, deploy, undeploy, shutdown); the service is now retired.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["legacy exam context; OpsWorks Stacks retired May 2024"], "confidence": "medium", "id": "cl-14dc03ce987a", "source_question_ids": ["awssysops-p1-q038"], "statement": "Creating an OpsWorks Stacks stack, adding the appropriate layers, and deploying the application gave Chef-based configuration and lifecycle hooks with minimal setup; this is a legacy exam answer, as OpsWorks Stacks was retired in May 2024.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-13491b796577", "source_question_ids": ["awssysops-p1-q038"], "statement": "AWS Elastic Beanstalk does not natively run arbitrary Chef recipes the way AWS OpsWorks does.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c4973509c5d0", "source_question_ids": ["awssysops-p1-q038"], "statement": "Manually launching an EC2 instance from a community AMI and deploying an application by hand does not satisfy a requirement to use Chef recipes for configuration.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-19dbb06e487d", "source_question_ids": ["awssysops-p1-q038"], "statement": "Standing up a self-managed Chef Server on an EC2 instance and using the AWS CLI to launch and configure application servers works technically but creates more administrative overhead than using AWS OpsWorks.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-98bd42dd341a", "source_question_ids": ["awssysops-p1-q076"], "statement": "ELB access logs, CloudWatch metrics, and CloudTrail API-call logging all capture observability information about load balancer activity, such as traffic patterns, request counts/latency, and configuration API calls.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cc4f5ee6c1a7", "source_question_ids": ["awssysops-p1-q076"], "statement": "ELB health checks are an internal mechanism the load balancer uses to decide which registered targets are healthy; they are an input to ELB's routing behavior, not an observability output for monitoring overall ELB activity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c85cba2dc710", "source_question_ids": ["awssysops-p1-q107"], "statement": "AWS CloudTrail is purpose-built for recording API-level activity, logging every call made against the CloudWatch API via CLI, SDK, or console, including who made the call and when.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2da0a8c615ca", "source_question_ids": ["awssysops-p1-q107"], "statement": "CloudWatch's own logging does not natively audit API calls made against the CloudWatch service itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ff5335605cd3", "source_question_ids": ["awssysops-p1-q107"], "statement": "Enabling detailed monitoring on CloudWatch increases metric granularity/frequency and is unrelated to auditing which API calls were made.", "status": "supported"}, {"claim_type": "rule", "conditions": ["using AWS OpsWorks stacks"], "confidence": "medium", "id": "cl-30ac478fa761", "source_question_ids": ["awssysops-p2-q325"], "statement": "To add a backend database server to an OpsWorks stack, you add a new database layer and add recipes to the deploy actions of both the database layer and the App Server layer.", "status": "supported"}, {"claim_type": "fact", "conditions": ["using AWS OpsWorks stacks"], "confidence": "medium", "id": "cl-d84ee787387c", "source_question_ids": ["awssysops-p2-q325"], "statement": "In OpsWorks, database connection variables such as host and user are set from the deploy JSON's [:deploy][:app_name][:database] attributes.", "status": "supported"}, {"claim_type": "fact", "conditions": ["using AWS OpsWorks stacks"], "confidence": "medium", "id": "cl-09d4ce7c3321", "source_question_ids": ["awssysops-p2-q325"], "statement": "In OpsWorks, an app server can be connected to an RDS layer via a custom recipe that reads connection data such as host and database name from stack configuration and deployment JSON attributes that OpsWorks installs on every instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-263074c7bf39", "source_question_ids": ["awssysops-p2-q325"], "statement": "OpsWorks' 'Clone Stack' feature duplicates an entire stack, such as for creating a staging environment, and is not a mechanism for RDS failover.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8dd202d8f797", "source_question_ids": ["awssysops-p2-q325"], "statement": "RDS Multi-AZ already handles Availability-Zone-level failover natively, so cloning an OpsWorks stack is not needed to achieve RDS failover redundancy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b53084777cca", "source_question_ids": ["awssysops-p2-q325"], "statement": "OpsWorks does not enforce a mandatory requirement that the RDS 'password' cookbook attribute be encrypted using at least a 256-bit key; encrypting cookbook attributes is a general good practice rather than an OpsWorks-enforced constraint.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-74192a8d2069", "source_question_ids": ["awssysops-p2-q329"], "statement": "Running `aws configure` sets the default output format (e.g., JSON, text, or table) used for subsequent AWS CLI command responses.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ed220856d5b2", "source_question_ids": ["awssysops-p2-q329"], "statement": "Running `aws configure` sets the default AWS region used for subsequent AWS CLI commands so the region does not need to be specified on every command.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4eb990551437", "source_question_ids": ["awssysops-p2-q329"], "statement": "The `aws configure` command does not control which VPC EC2 instances are created in.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7c56ecedd789", "source_question_ids": ["awssysops-p2-q329"], "statement": "There is no 'default EC2 instance' setting configured by the `aws configure` command; it is not a real AWS concept.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-723af0f5dcbb", "source_question_ids": ["awssysops-p2-q329"], "statement": "The `aws configure` command does not encrypt AWS CLI commands; CLI traffic is already encrypted transparently via HTTPS/SigV4 regardless of configure settings.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d0967fc4bf8e", "source_question_ids": ["awssysops-p2-q331"], "statement": "AWS CloudTrail logs showing API calls and Amazon EC2 instance system logs are both generated by and fully within a customer's own control and visibility, making them evidence the customer -- not AWS -- would provide to a compliance auditor.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-13e3d519465d", "source_question_ids": ["awssysops-p2-q331"], "statement": "AWS is responsible for decommissioning and destroying physical storage media, and customers never have physical access to that media, so storage device destruction records are AWS's responsibility to provide to an auditor, not the customer's.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-be7847a337bb", "source_question_ids": ["awssysops-p2-q331"], "statement": "Physical data center access logs and Xen Hypervisor system logs are AWS's responsibility under the Shared Responsibility Model, since customers have no access to the physical facility or the underlying hypervisor.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-707db80d8711", "source_question_ids": ["awssysops-p2-q337"], "statement": "AWS Systems Manager Run Command allows an administrator to remotely and securely execute scripts and ad hoc administrative commands across a fleet of managed EC2 instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-db63874f754c", "source_question_ids": ["awssysops-p2-q337"], "statement": "AWS Systems Manager Automation runs predefined multi-step workflows/runbooks rather than arbitrary ad hoc scripts.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3d4ab6b871d7", "source_question_ids": ["awssysops-p2-q337"], "statement": "AWS Systems Manager Parameter Store is a configuration and secrets store, not a mechanism for executing commands on instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d781c277bab0", "source_question_ids": ["awssysops-p2-q337"], "statement": "AWS Systems Manager Inventory collects metadata about installed software and configuration on instances but does not execute commands or scripts.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the source question's boxed answer instead recommends granting developers direct CloudFormation template-editing access, conflicting with a unanimous community vote for Service Catalog"], "confidence": "medium", "id": "cl-f0207a806e25", "source_question_ids": ["awssysops-p2-q338"], "statement": "AWS Service Catalog lets an operations team author and own standardized, pre-approved CloudFormation-based product templates and share them so other teams can self-service, on-demand deploy resources without being granted template-editing access.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-cf570c7a26de", "source_question_ids": ["awssysops-p2-q338"], "statement": "Granting a development team direct access to author or edit CloudFormation templates gives them resource configuration-management capability, which can conflict with a policy that restricts configuration management to the operations team.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f7c162c729b8", "source_question_ids": ["awssysops-p2-q340"], "statement": "AWS Config Rules continuously evaluate AWS resource configurations against predefined or custom desired-state rules, making AWS Config the purpose-built service for ongoing compliance monitoring of instance configuration and installed applications.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a344e66d19bc", "source_question_ids": ["awssysops-p2-q340"], "statement": "EC2 instance metadata only exposes instance-level attributes and is not a compliance evaluation mechanism.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ccd3a43bbf68", "source_question_ids": ["awssysops-p2-q340"], "statement": "AWS CloudTrail logs API activity rather than the software or configuration present on an instance, so it cannot by itself show policy compliance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4c80000b4e91", "source_question_ids": ["awssysops-p2-q340"], "statement": "Amazon CloudWatch alarms cannot natively detect an arbitrary software change on an instance without additional tooling such as AWS Config or a custom agent.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1ee9b0c87845", "source_question_ids": ["awssysops-p2-q429"], "statement": "CloudTrail integration with CloudWatch Logs delivers the API activity captured by CloudTrail to a CloudWatch Logs log stream in a log group the user specifies.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-69e1b3e2a0ec", "source_question_ids": ["awssysops-p2-q429"], "statement": "CloudTrail's delivery of event logs to an S3 bucket is a separate mechanism from its CloudWatch Logs integration.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1dac22dd9617", "source_question_ids": ["awssysops-p2-q429"], "statement": "A claim that CloudTrail-to-CloudWatch-Logs integration delivers SDK activity (rather than API activity) is incorrect.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ac4d847f6ecd", "source_question_ids": ["awssysops-p2-q429"], "statement": "A claim that no integration exists between CloudTrail and CloudWatch Logs is incorrect.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2632f870aa8b", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CodeCommit uses the repository ID as the AWS KMS encryption context for its encrypt/decrypt operations.", "status": "supported"}, {"claim_type": "rule", "conditions": ["determining which KMS key operations applied to a specific AWS CodeCommit repository"], "confidence": "high", "id": "cl-90d700484d79", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CloudTrail logs record KMS API calls tagged with their encryption context, so searching CloudTrail for an AWS CodeCommit repository ID surfaces which key operations (encrypt/decrypt) were performed for that repository.", "status": "supported"}, {"claim_type": "rule", "conditions": ["no shared resources are needed between customer workloads"], "confidence": "high", "id": "cl-bae243ea82e0", "source_question_ids": ["awssysops-p2-q540"], "statement": "Creating a dedicated VPC per customer and using security groups to scope traffic within it achieves workload isolation with no shared resources, which best practice recommends when customers' workloads must be separated for billing and security reasons with no shared resources needed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-89afa98ec56e", "source_question_ids": ["awssysops-p2-q540"], "statement": "AWS Organizations' consolidated billing feature addresses centralizing billing across customer accounts but does not by itself provide network-level workload isolation.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-55e0b82eda70", "source_question_ids": ["awssysops-p2-q549"], "statement": "AWS CloudTrail logs every API call made against an account, including which IAM identity invoked AllocateAddress to create an Elastic IP address, so an administrator can query those logs (e.g., via Amazon Athena) to retroactively attribute EIP-creation events to their creator.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5ec2be5f8422", "source_question_ids": ["awssysops-p2-q549"], "statement": "The question's marked correct answer is that a cost-allocation tag attached at creation time identifies who creates Elastic IP addresses, but a cost-allocation tag only works prospectively and cannot retroactively identify who created already-existing, untagged Elastic IP addresses -- the question's recorded community vote is unanimous for a CloudTrail/Athena-based answer instead, directly contradicting the marked answer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5c5c6bba2e4a", "source_question_ids": ["awssysops-p2-q549"], "statement": "CloudWatch has no EIPCreated metric, and Amazon Inspector assesses vulnerabilities rather than reporting who created an Elastic IP address, so neither identifies the creator of an EIP.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c43c3b4509f5", "source_question_ids": ["awssysops-p2-q554"], "statement": "AWS Config continuously records configuration changes to AWS resources and supports tracking AWS CloudFormation stack configuration history, including SNS notifications on stack changes, making it suited for governance-oriented change tracking of CloudFormation deployments.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a30320d35f30", "source_question_ids": ["awssysops-p2-q567"], "statement": "AWS CloudTrail records API activity across an AWS account, including changes made to resources.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-62648cb17958", "source_question_ids": ["awssysops-p2-q567"], "statement": "CloudTrail logs delivered to an S3 bucket can be shared with an external auditor via a scoped IAM policy granting read access, without granting broader account access such as Administrator permissions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f977a0a6e76c", "source_question_ids": ["awssysops-p2-q567"], "statement": "AWS Artifact provides access to compliance reports, not a history of account changes, so it is not suited to auditing unauthorized changes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a87cb9ef7395", "source_question_ids": ["awssysops-p2-q567"], "statement": "Amazon Inspector surfaces vulnerability findings, not a change history, so it is not suited to auditing unauthorized changes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3870793759c6", "source_question_ids": ["awssysops-p2-q568"], "statement": "AWS OpsWorks (Stacks, for Chef Automate, and for Puppet Enterprise) provided managed Chef and Puppet for automating configuration of EC2 instances and on-premises servers until all OpsWorks offerings reached end of life in 2024.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["SCPs only restrict permissions; to deploy identical IAM roles and policies into every account, use CloudFormation StackSets"], "confidence": "medium", "id": "cl-b38e637392dc", "source_question_ids": ["awssysops-p2-q575"], "statement": "AWS Organizations lets a company group multiple AWS accounts into organizational units (OUs) and apply service control policies (SCPs) centrally, providing a single, centrally-managed governance layer that scales as new accounts are added.", "status": "supported"}, {"claim_type": "exception", "conditions": ["evaluating a multi-account requirement that each account have the same IAM roles and policies"], "confidence": "medium", "id": "cl-dad25f9b8aea", "source_question_ids": ["awssysops-p2-q575"], "statement": "Service control policies (SCPs) restrict what actions can be performed in an account; they do not create or provision matching IAM roles and policies in each target account the way AWS CloudFormation StackSets can.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-bfd135f007b9", "source_question_ids": ["awssysops-p2-q579"], "statement": "An AWS Config rule that detects publicly accessible S3 buckets and sends an SNS alert is a purely detective control that does not touch or restrict any user's existing permissions.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e143f0cd24ab", "source_question_ids": ["awssysops-p2-q579"], "statement": "Restricting S3 bucket access to specific IAM roles places a direct restriction on users' access, which conflicts with a requirement to address a security concern without restricting users.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-4e0b1b048f58", "source_question_ids": ["awssysops-p2-q579"], "statement": "Emailing AWS Personal Health Dashboard findings to InfoSec daily does not address a concern about an employee exposing sensitive data in an S3 bucket, since Personal Health Dashboard reports on service health events, not bucket exposure.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-dabd67b68ec0", "source_question_ids": ["awssysops-p2-q583"], "statement": "AWS Systems Manager Patch Manager defines patch baselines, scans instances for missing patches, and can automatically install them to remediate instances back into patch compliance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-870bb5174e14", "source_question_ids": ["awssysops-p2-q583"], "statement": "AWS Config tracks configuration state over time but does not push patches to remediate non-compliant instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-26f298ef12dc", "source_question_ids": ["awssysops-p2-q583"], "statement": "Amazon Inspector assesses and reports vulnerabilities but does not remediate them.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ff201c8c9504", "source_question_ids": ["awssysops-p2-q583"], "statement": "AWS Trusted Advisor provides advisory checks only and does not perform remediation actions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-50f60ef38d37", "source_question_ids": ["awssysops-p2-q591"], "statement": "The S3_BUCKET_LOGGING_ENABLED AWS Config managed rule continuously evaluates every bucket in an account and flags any bucket without server access logging enabled as non-compliant.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2f582a034417", "source_question_ids": ["awssysops-p2-q591"], "statement": "AWS CloudTrail logging records account API activity, which is distinct from S3 server access logging.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-a311186bf77d", "source_question_ids": ["awssysops-p2-q591"], "statement": "An AWS Config managed rule by itself only detects non-compliance; it does not actively enable the required setting unless paired with AWS Config auto-remediation.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ac8d4d92449c", "source_question_ids": ["awssysops-p2-q591"], "statement": "Using a Lambda function to delete S3 buckets that don't have logging enabled is a destructive overreaction compared to a monitoring-based compliance control.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bccbdd36f629", "source_question_ids": ["awssysops-p2-q599"], "statement": "Reactive tagging tools (e.g., AWS Tag Editor, the resource-tagging GetResources API, AWS Config rules) can only find already-untagged resources after the fact; they do not enforce tagging in real time when a resource is created.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-7b988c689f0e", "source_question_ids": ["awssysops-p2-q599"], "statement": "Proactive tagging tools (e.g., AWS CloudFormation, AWS Service Catalog, IAM) apply tags automatically at the moment a resource is created, satisfying a real-time tagging-enforcement requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9ea5af9b4057", "source_question_ids": ["awssysops-p2-q599"], "statement": "AWS Service Catalog's TagOptions Library can enforce a tagging taxonomy proactively when EC2 instances and EBS volumes are launched.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-0b0666c8c445", "source_question_ids": ["awssysops-p2-q599"], "statement": "For the real-time tagging-enforcement exam question, this dataset's boxed answer (manually searching for untagged resources with Tag Editor) is a reactive, manual process that no cited commenter endorses; the source's own embedded community vote splits only between two other proactive options and does not reach the 60% threshold, so the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-4521d946e715", "source_question_ids": ["awssysops-p3-1-q607"], "statement": "The AWS Health Dashboard (formerly the Personal Health Dashboard) account view shows which of your account's or organization's resources are affected by an AWS event.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d1d2ea3df8ef", "source_question_ids": ["awssysops-p3-1-q607"], "statement": "The AWS Health Dashboard's public service health view (formerly the Service Health Dashboard) shows only general AWS service status, not which of an organization's own resources an event affects.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0566e1928938", "source_question_ids": ["awssysops-p3-1-q607"], "statement": "AWS Trusted Advisor checks cost, security, and performance best practices rather than reporting live AWS event impact on resources.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fe6b61b80320", "source_question_ids": ["awssysops-p3-1-q607"], "statement": "AWS Systems Manager is an operations and management tool, not an event-status dashboard.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d163916cfa80", "source_question_ids": ["awssysops-p3-1-q613"], "statement": "AWS Trusted Advisor includes service-limit checks that track resource usage against account service quotas.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-632d11be9d18", "source_question_ids": ["awssysops-p3-1-q613"], "statement": "Pairing AWS Trusted Advisor service-limit checks with Amazon CloudWatch Events, per the published 'AWS Limit Monitor' reference solution, refreshes those checks on a schedule and fires an alert when resource utilization crosses a threshold, allowing alerts when EC2 service limits are close to being reached.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e7fe91ceef8c", "source_question_ids": ["awssysops-p3-1-q613"], "statement": "AWS CloudTrail records API call activity, not resource usage against account service limits, so it has no mechanism for surfacing service-limit warnings.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ee3c802bc792", "source_question_ids": ["awssysops-p3-1-q613"], "statement": "Amazon Inspector is a vulnerability and configuration assessment tool, not a service-limit monitoring tool.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-632636ec947f", "source_question_ids": ["awssysops-p3-1-q613"], "statement": "The AWS Personal Health Dashboard surfaces AWS operational events, not account-level service quota usage.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1efd25d4badc", "source_question_ids": ["awssysops-p3-1-q625"], "statement": "AWS Trusted Advisor includes a security check that specifically reviews the AWS account root user's configuration, including whether MFA is enabled, and flags deviations from AWS security best practices.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-ae13616f77a9", "source_question_ids": ["awssysops-p3-1-q625"], "statement": "AWS guidance recommends that the root user should not have long-term access keys at all wherever avoidable, so routinely rotating root user access keys runs counter to that guidance and does not itself confirm the account's broader security posture.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c6a7dae19a4e", "source_question_ids": ["awssysops-p3-1-q625"], "statement": "Routinely changing the root user password via the AWS CLI is an action, not a verification step, and does not confirm whether security best practices are being followed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c1c08808f760", "source_question_ids": ["awssysops-p3-1-q625"], "statement": "Periodically redistributing an AWS Artifact compliance document does not check an account's actual root user configuration.", "status": "supported"}, {"claim_type": "rule", "conditions": ["member accounts only; SCPs do not affect the management account"], "confidence": "medium", "id": "cl-419ba23b1c0e", "source_question_ids": ["awssysops-p3-1-q639"], "statement": "A service control policy (SCP) applied at the AWS Organizations level sits outside a member account's own IAM and acts as a guardrail that even account administrators or users with IAM-editing permissions cannot override from within the account.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["developers in the account have permission to manipulate IAM policies and roles"], "confidence": "medium", "id": "cl-c4964157b1ec", "source_question_ids": ["awssysops-p3-1-q639"], "statement": "If developers in an account already have permission to manipulate IAM policies and roles, a restriction implemented purely as an ordinary IAM policy, including a job function policy, can be edited or removed by those same developers, defeating the intended restriction.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8af4da51af80", "source_question_ids": ["awssysops-p3-1-q639"], "statement": "Applying an IAM policy inside API Gateway does not control account-wide service access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c38ea66b2e74", "source_question_ids": ["awssysops-p3-1-q640"], "statement": "AWS Organizations Consolidated Billing lets multiple AWS accounts share a single bill and share Reserved Instance discounts across accounts, while each account's resources, permissions, and management remain fully separate.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b8aa1cad3281", "source_question_ids": ["awssysops-p3-1-q640"], "statement": "A service control policy (SCP) does not define a billing relationship between accounts; SCPs govern permitted actions, not billing consolidation.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a00d28f1c9e0", "source_question_ids": ["awssysops-p3-1-q640"], "statement": "Building a custom pipeline that sends Cost and Usage Report files to S3, loads them into Redshift, and visualizes them with QuickSight reinvents, with much more operational overhead, what AWS Organizations Consolidated Billing already provides natively.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a98be8e312f7", "source_question_ids": ["awssysops-p3-1-q640"], "statement": "Using Amazon Redshift Spectrum to query Detailed Billing Report data across accounts does not directly address sharing Reserved Instance benefits the way native consolidated billing does.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-15c4c66965d0", "source_question_ids": ["awssysops-p3-1-q648"], "statement": "Satisfying both a requirement for isolated per-department environments and a requirement to restrict usage to pre-approved services requires combining separate AWS accounts per department, for isolation, with service control policies restricting which services each account or OU can use, for the service whitelist.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-69abc68ad416", "source_question_ids": ["awssysops-p3-1-q648"], "statement": "AWS Service Catalog can restrict which pre-approved services or products a department can launch, but it operates within a shared account and does not by itself provide isolated environments per department.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-542c31f62012", "source_question_ids": ["awssysops-p3-1-q648"], "statement": "IAM roles with department-scoped policies still leave all departments sharing the same AWS account, so they do not provide isolated environments.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c52c74b7f92e", "source_question_ids": ["awssysops-p3-1-q648"], "statement": "Letting each department self-manage its own AWS account with no central governance does not enforce a pre-approved-services list.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f6e647b6e04f", "source_question_ids": ["awssysops-p3-1-q650"], "statement": "Applying a whitelist-style service control policy (SCP) to the AWS Organizational Unit (OU) containing production accounts, and a separate, more permissive SCP to the OU containing development accounts, is a preventive control that blocks use of uncertified services in production with no ongoing monitoring or cleanup required.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-596e59683c2f", "source_question_ids": ["awssysops-p3-1-q650"], "statement": "Using AWS Config to periodically find and shut down non-compliant services running in production accounts is a detective, reactive control: it lets the service run first and then shuts it down afterward, leaving a window where the service actually executes in production.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-dd1943cef242", "source_question_ids": ["awssysops-p3-1-q650"], "statement": "Using Amazon CloudWatch plus an AWS Lambda function to detect and terminate non-certified services in production is likewise reactive and has higher administrative overhead than a preventive service control policy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a2e833f4aaa3", "source_question_ids": ["awssysops-p3-1-q650"], "statement": "Scoping IAM policies per combination of user and account to block specific services requires managing that logic per user and does not scale as cleanly as applying service control policies centrally at the OU level.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-60f3c8470839", "source_question_ids": ["awssysops-p3-1-q657"], "statement": "AWS KMS customer master key (CMK) deletion and rotation events are logged to AWS CloudTrail.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-54b8c2f32632", "source_question_ids": ["awssysops-p3-1-q657"], "statement": "AWS CloudTrail can be configured in each production AWS account to deliver its logs to a centralized Amazon S3 bucket owned by a security team, giving durable, complete, cross-account visibility into KMS CMK deletion and rotation events.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["relying on Amazon EventBridge/CloudWatch Events to capture KMS CMK rotation events"], "confidence": "medium", "id": "cl-9829f873bfb9", "source_question_ids": ["awssysops-p3-1-q657"], "statement": "AWS only guarantees delivery of the KMS CMK deletion event to Amazon EventBridge (CloudWatch Events); the KMS CMK rotation event is delivered to EventBridge on a best-effort basis only, making a custom CloudWatch Events rule and cross-account event bus an unreliable channel for capturing CMK rotation events.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9b9a848e8adb", "source_question_ids": ["awssysops-p3-1-q657"], "statement": "Polling KMS logs on a schedule with an AWS Lambda function in each production account is unnecessarily complex and lag-prone compared to native CloudTrail log delivery.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ede5c5c84e3e", "source_question_ids": ["awssysops-p3-1-q657"], "statement": "An AWS Config rule checking whether KMS keys are in a pending-deletion or rotated state is a point-in-time compliance check, not a continuous event stream of deletion/rotation events.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-020ad706d653", "source_question_ids": ["awssysops-p3-1-q663"], "statement": "The AWS Personal Health Dashboard proactively surfaces scheduled or upcoming maintenance events for specific resources with zero setup beyond reading the dashboard.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-900c25416860", "source_question_ids": ["awssysops-p3-1-q663"], "statement": "Listing EC2 instances with failed system status checks is a reactive, point-in-time view of current instance health, not a forward-looking indicator of upcoming scheduled hardware maintenance, since a status check does not fail in advance of maintenance that has not yet happened.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-59599b004c0c", "source_question_ids": ["awssysops-p3-1-q663"], "statement": "Monitoring AWS CloudTrail for StopInstances API calls does not announce upcoming hardware maintenance ahead of time.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-42b8d2964760", "source_question_ids": ["awssysops-p3-1-q663"], "statement": "Deploying a third-party monitoring solution for real-time EC2 instance monitoring adds administrative overhead rather than minimizing it.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-384c96ff8527", "source_question_ids": ["awssysops-p3-1-q670"], "statement": "The AWS Config managed rule 'restricted-common-ports' can be configured with a specific port, such as port 80, as a blocked parameter, and continuously evaluates every security group against that rule in near real time, flagging non-compliant security groups automatically.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2348ff49ebc6", "source_question_ids": ["awssysops-p3-1-q670"], "statement": "Amazon Inspector produces vulnerability and network-reachability findings, not rule-based security group compliance evaluation, so it is not the tool for reporting security groups that allow public port 80; AWS Config managed rules are.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ac7808999646", "source_question_ids": ["awssysops-p3-1-q670"], "statement": "AWS Trusted Advisor's security group unrestricted-access check is not continuous rule-based compliance evaluation and its email notifications are weekly, so it is not the near-real-time compliance reporting choice; AWS Config rules are.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4af43098cdc7", "source_question_ids": ["awssysops-p3-1-q670"], "statement": "A custom AWS Lambda function scheduled hourly to scan and evaluate all security groups reinvents, with more operational overhead, what the AWS Config restricted-common-ports rule already provides natively.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cab333881f3f", "source_question_ids": ["awssysops-p3-1-q684"], "statement": "AWS CloudTrail's log file integrity validation feature generates a cryptographic hash for every delivered log file plus an hourly signed digest file referencing those hashes, letting an administrator verify after the fact whether any CloudTrail log file was modified, deleted, or left unchanged since delivery.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8bf1973aac98", "source_que bled.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-216a1ae9b18a", "source_question_ids": ["awssysops-p3-1-q702"], "statement": "Amazon SNS has no inherent restriction that would block it from being triggered by AWS Health-triggered CloudWatch Events.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-03186cccb007", "source_question_ids": ["awssysops-p3-1-q706"], "statement": "AWS Trusted Advisor's service-limits check surfaces when an account is approaching or has hit an EC2-related service limit, such as a per-instance-type or per-Region limit, that would silently block new instance launches even while an Auto Scaling group itself still has capacity room to scale.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-63ab9e605693", "source_question_ids": ["awssysops-p3-1-q706"], "statement": "Checking the responses to RunInstances API calls in AWS CloudTrail logs reveals the specific error AWS returned when an EC2 instance launch was attempted, such as a limit-exceeded error, directly diagnosing why new instances failed to launch.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b0d7add3fc15", "source_question_ids": ["awssysops-p3-1-q706"], "statement": "AWS Systems Manager has no documented service-limit-monitoring capability.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ce8c513937c4", "source_question_ids": ["awssysops-p3-1-q706"], "statement": "Amazon Inspector performs vulnerability and security assessments, not launch-failure or service-limit diagnostics.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4c264f4a949e", "source_question_ids": ["awssysops-p3-1-q706"], "statement": "VPC Flow Logs capture network traffic metadata n or versioning-state change on a bucket.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-87879b241ce1", "source_question_ids": ["awssysops-p3-1-q729"], "statement": "Enabling both CloudTrail log file integrity validation and S3 MFA Delete together detects tampering with CloudTrail logs and adds a hard barrier against their deletion.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1fe6c0767ba2", "source_question_ids": ["awssysops-p3-1-q729"], "statement": "A DENY ALL bucket policy on the CloudTrail bucket would block CloudTrail's own service principal from delivering new log files to the bucket, breaking logging entirely.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e1ec14e8de20", "source_question_ids": ["awssysops-p3-1-q729"], "statement": "AWS Config's managed rule cloudtrail-log-file-validation-enabled only checks whether log file validation is turned on for a trail; it does not validate or protect the log files themselves, which is what CloudTrail log file integrity validation does.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b2b6736e6213", "source_question_ids": ["awssysops-p3-1-q729"], "statement": "Amazon EventBridge (formerly CloudWatch Events) has no built-in capability to scan log file contents on a schedule; it can only route events and invoke targets, including on a schedule.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ca52937afaf5", "source_question_ids": ["awssysops-p3-1-q731"], "statement": "A service control policy (SCP) can deny s3:DeleteBucket for every IAM user and role, including the root user, in a member account; SCPs do not affect the management account or service-linked roles.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "hig
