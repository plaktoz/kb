is required is a disruptive, manual substitute for a password policy's built-in expiration setting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ce8c9952278f", "source_question_ids": ["awssysops-p3-1-q760"], "statement": "An IAM policy is a permissions document that must be attached to a principal such as a user, group, or role; it is not itself a principal that an application can be independently granted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-023a3696ef2d", "source_question_ids": ["awssysops-p3-1-q760"], "statement": "An IAM group is intended for organizing human IAM users, not for granting permissions to a compute resource such as an application running on EC2.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a054eb08e121", "source_question_ids": ["awssysops-p3-1-q760"], "statement": "Creating a long-lived IAM user for an application reintroduces static, rotation-prone credential management that role-based EC2 access is designed to avoid.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-a95cd11a1f71", "source_question_ids": ["awssysops-p3-1-q763"], "statement": "In AWS SAML federation to the Management Console, the role attribute in the SAML assertion is mapped to an IAM role, and that role's attached IAM policies determine the federated user's access to AWS resources.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-50182e640d3e", "source_question_ids": ["awssysops-p3-1-q763"], "statement": "AWS has no native mechanism to map a SAML assertion attribute directly to an IAM group, an IAM policy, or an individual IAM user for console federation purposes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5e411c6cd24e", "source_question_ids": ["awssysops-p3-1-q800"], "statement": "An S3 bucket policy that grants access to all EC2 instances in general is too broad and not scoped to a specific application's needs.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9f550bb37420", "source_question_ids": ["awssysops-p3-1-q804"], "statement": "Under the AWS shared responsibility model, the customer is responsible for creating IAM policies and attaching them to IAM roles ('security in the cloud'), while AWS is responsible for the underlying IAM service infrastructure ('security of the cloud').", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4c2b20ac136c", "source_question_ids": ["awssysops-p3-1-q821"], "statement": "The s3:GetObject permission allows downloading an object, and the s3:DeleteObject permission allows deleting an object; both are object-level actions scoped to a bucket's object ARN.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d30f1aa53360", "source_question_ids": ["awssysops-p3-1-q821"], "statement": "Getting an S3 bucket's region requires the s3:GetBucketLocation permission, which is distinct from the object-level actions s3:GetObject, s3:GetObjectVersion, s3:PutObject, and s3:DeleteObject.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1f07ef411609", "source_question_ids": ["awssysops-p3-1-q821"], "statement": "Deleting an S3 bucket itself requires the s3:DeleteBucket permission scoped to the bucket-level ARN (without the /* object suffix), which is distinct from and not implied by having s3:DeleteObject on the bucket's objects.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bf176dbf0506", "source_question_ids": ["awssysops-p3-1-q821"], "statement": "Listing all S3 buckets in an account requires the account-wide s3:ListAllMyBuckets permission, which is distinct from object-level or single-bucket permissions.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances already have specific tags applied"], "confidence": "medium", "id": "cl-bd808fa45485", "source_question_ids": ["awssysops-p3-1-q845"], "statement": "An IAM policy with a Condition element keyed on an EC2 instance tag, attached to the relevant IAM users or groups, implements tag-scoped control over which users can access which tagged instances via AWS Systems Manager Session Manager.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e613b67ee3dc", "source_question_ids": ["awssysops-p3-1-q845"], "statement": "An IAM role attached to EC2 instances is an operational prerequisite that grants the SSM agent its baseline permissions, required for AWS Systems Manager Session Manager to function at all, but by itself does not implement tag-scoped control over which users can access which instances.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-29ed46b3aff1", "source_question_ids": ["awssysops-p3-1-q878"], "statement": "The standard pattern for cross-account role assumption places the trust policy on the IAM role being assumed, in the target account, naming the source account's principal (such as a group) as a trusted entity.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-3bfd43aaaa8b", "source_question_ids": ["awssysops-p3-1-q878"], "statement": "The standard pattern for cross-account role assumption grants the sts:AssumeRole permission via a permission policy attached to the calling principal in the source account, not on the role being assumed in the target account.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-aa717ae6e171", "source_question_ids": ["awssysops-p3-1-q878"], "statement": "sts:PassRole is not the permission used to grant a principal the ability to assume a role in another account.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-03999c5dde72", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRoleWithSAML is the STS API call that exchanges a SAML 2.0 assertion for temporary AWS credentials, enabling federated programmatic access such as AWS CLI usage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-711dbcf67d37", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRole requires the caller to already hold valid AWS credentials for another IAM principal; it cannot accept a SAML assertion directly.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3d92f251a4fe", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRoleWithWebIdentity is for OIDC/web-identity providers such as Google, Facebook, or Amazon Cognito, not for SAML assertions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9aea187cf794", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:GetFederationToken is a legacy, less-capable federation mechanism unrelated to SAML assertions.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9c3eb028c430", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "An EC2 instance profile can only be associated with an IAM role, never directly with an IAM user.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4b6dfe03ddd5", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "To let the CloudWatch Logs agent on an EC2 instance deliver logs, create an IAM role with the needed CloudWatch Logs permissions, wrap it in an instance profile, and associate that instance profile with the EC2 instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-32359e49c3dd", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "Security group or network ACL rules allowing inbound traffic on port 80 affect inbound web traffic to an instance, not the CloudWatch Logs agent's own outbound API calls to the CloudWatch Logs service.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-iam--m-1", "title": "Every AWS API call is a signed request from a principal, evaluated against policies, default-deny", "purpose": "Answer IAM questions by asking two things in order: (1) who is the caller and how did it get credentials (long-lived IAM user secrets vs temporary role credentials from STS), and (2) given those credentials, do the attached policies produce an Allow without any matching explicit Deny?", "mechanism": "Authentication: a caller presents credentials. IAM users hold long-lived secrets (console password, access keys) that an administrator must explicitly create and that must be rotated by hand. Roles hold no secrets of their own; a principal obtains short-lived, automatically rotated credentials from STS by assuming the role: an EC2 instance through its instance profile (delivered via instance metadata), a mobile app user through web identity / Cognito, a corporate user through SAML (AssumeRoleWithSAML), or another account's user through sts:AssumeRole against the role's trust policy. Authorization: the request starts at implicit deny; an Allow in an identity-based policy (attached to a user, group, or role; groups pass their policies down to every member) or a resource-based policy (bucket policy etc., naming a Principal) can grant it, but any matching explicit Deny overrides every Allow. Each statement only matches when its Action applies to the Resource ARN type (bucket-level vs object-level for S3) and all of its Conditions are true (AND across keys/operators, OR across values of one key).", "predict_prompt": "An application on an EC2 instance needs to write to DynamoDB, and a teammate proposes creating an IAM user and putting its access keys in the AMI. Before reading on: what should you do instead, and which two separate things must be true for the DynamoDB write to succeed?", "invariants": ["Workloads (EC2 apps, Auto Scaling instances, mobile apps, federated or cross-account users) get permissions through a role and temporary STS credentials, never through embedded IAM user or root keys.", "An instance profile can only wrap an IAM role, never an IAM user.", "A role's permissions must cover the service actually being called; an EC2-only role gives no DynamoDB access.", "Explicit Deny beats any Allow; anything not explicitly allowed is implicitly denied.", "A group is a container for IAM users only; it cannot be assumed and cannot be attached to a compute resource.", "A new IAM user has no password and no access keys until an administrator creates them."], "limits": ["This model does not cover database-engine authentication inside RDS, which is separate from IAM permissions to manage RDS.", "S3 bucket ACLs can only grant to AWS accounts or predefined groups, not to individual IAM users.", "Some source questions here are disputed (the ${aws:username} credential-scope questions and the PassRole vs AssumeRole question); answer from the mechanism, not the boxed key."], "cues": ["'application on EC2', 'instances in an Auto Scaling group', 'without storing credentials' -> IAM role via instance profile", "'mobile app users', 'Google/Facebook/Amazon login' -> web identity federation / Cognito with a role", "'existing corporate directory', 'LDAP/AD', 'SAML' -> federation into a role, no per-user IAM users", "'another AWS account' -> role in the target account with a trust policy, caller uses sts:AssumeRole", "'many employees by department' -> IAM users organized in IAM groups", "'one Allow and one Deny' -> explicit Deny wins"], "claim_ids": ["cl-75ab3e8821db", "cl-6c0e7c9cf67b", "cl-4255e3ab33bd", "cl-f75bacb9b7a3", "cl-827554316d65", "cl-242e412f3db9", "cl-9c3eb028c430", "cl-4b6dfe03ddd5", "cl-bf8c5a59c953", "cl-ab5724cc3fe6", "cl-bffa660d8950", "cl-03999c5dde72", "cl-d6d0954978ea", "cl-0830dafb6b89", "cl-b125f0f80fa3", "cl-f966e77068b5", "cl-de5f8deb26a0", "cl-033da3105a54", "cl-f7c6f92d6a4d", "cl-f31f2112bc46", "cl-454834273b49", "cl-3bd9df2b8fbe", "cl-d67fc94a596f", "cl-6b01212444b0", "cl-0a3afce89cdc", "cl-40a7e3f22b15", "cl-de918035cefd", "cl-24cb589e2463", "cl-0294b798e14c", "cl-fad7ade99c77", "cl-9b4cadd86acf", "cl-deab9a53d3fe"]}, "contrastSet": {"id": "aws-sysops-service-iam--cs-1", "subjects": ["IAM role (temporary STS credentials)", "IAM user with access keys", "IAM group"], "dimensions": ["Who it represents", "Credentials it carries", "Rotation", "Can be attached to an EC2 instance", "Typical correct use"], "shared_traits": ["All three can carry identity-based IAM policies.", "All are evaluated with the same default-deny and explicit-Deny-wins logic."], "matrix": {"Who it represents": {"IAM role (temporary STS credentials)": "Whoever assumes it: EC2 instance, federated, web-identity, or cross-account user", "IAM user with access keys": "One specific person or app identity in this account", "IAM group": "A set of IAM users; not a principal itself"}, "Credentials it carries": {"IAM role (temporary STS credentials)": "None stored; short-lived credentials issued by STS on assume", "IAM user with access keys": "Long-lived password and/or access keys, created by an admin", "IAM group": "None; members use their own user credentials"}, "Rotation": {"IAM role (temporary STS credentials)": "Automatic", "IAM user with access keys": "Manual; keys leak if embedded in code, AMIs, or User Data", "IAM group": "Not applicable"}, "Can be attached to an EC2 instance": {"IAM role (temporary STS credentials)": "Yes, via an instance profile", "IAM user with access keys": "No; only its keys can be copied onto the instance", "IAM group": "No"}, "Typical correct use": {"IAM role (temporary STS credentials)": "Apps on EC2/ASG, mobile apps, SAML/LDAP federation, cross-account access", "IAM user with access keys": "Individual humans signing in to this account", "IAM group": "Grant one policy to many users, e.g. by department"}}, "decision_rule": "Ask whether the caller is a named human who signs in directly to this account, or anything else (a workload on AWS compute, an app's end users, a corporate or web identity, or another account). Named humans in this account: IAM user, with permissions managed through an IAM group. Anything else: IAM role with temporary STS credentials.", "boundary_flip": "If 'grant 50 developers in the Engineering department the same S3 permissions' becomes 'grant the application those 50 developers deploy to EC2 the same S3 permissions', the answer flips from IAM group to IAM role attached through an instance profile. If those same developers already sign in through the company's SAML/LDAP directory, it flips to a federated role and no IAM users are needed.", "strongest_distractor_failure": "Create an IAM user and put its access keys in the application, AMI, or User Data. It does work, but it plants long-lived static secrets that have to be rotated by hand and can leak. A role gives the same permissions with temporary, automatically rotated credentials and nothing stored on the instance.", "exceptions": ["An instance role is still needed for SSM Session Manager to work, but tag-scoped control over which users can open sessions comes from IAM user/group policies with tag conditions.", "iam:PassRole lets a user attach a role to a resource they launch; it does not let the user assume the role (that is sts:AssumeRole)."], "claim_ids": ["cl-4255e3ab33bd", "cl-fce8686e6bff", "cl-8d2d25adfa8d", "cl-242e412f3db9", "cl-81fe9b62c21a", "cl-37bdb307fb47", "cl-a054eb08e121", "cl-6c0e7c9cf67b", "cl-9c3eb028c430", "cl-994c952cc69d", "cl-023a3696ef2d", "cl-48a0a8b957ca", "cl-ab947da4766c", "cl-f7c6f92d6a4d", "cl-39d8ca271fc8", "cl-b3443c7d7873", "cl-a2eb0f7372fc", "cl-d6d0954978ea", "cl-bf8c5a59c953", "cl-b125f0f80fa3", "cl-e613b67ee3dc", "cl-bd808fa45485", "cl-259136ebf6fe", "cl-c23f2e24f3fe"]}, "scenarioFamily": {"id": "aws-sysops-service-iam--sf-1", "canonical": {"prompt": "An application running on an EC2 instance needs to write records to a DynamoDB table. The instance currently has no IAM role attached, and a teammate suggests creating an IAM user, generating an access key, and baking that access key into the AMI the instances launch from. What should you do instead, and why?", "expected_answer": ["Create an IAM role that grants the DynamoDB permissions the application needs, and attach that role to the EC2 instance (via an instance profile) instead of embedding IAM user credentials."], "reasoning": "Workloads on EC2 should get permissions through a role rather than through embedded IAM user credentials. Attaching a role to the instance gives the application temporary, automatically-rotated credentials delivered via the instance metadata service, with no long-lived secret stored on the instance, and that role's permissions must actually cover DynamoDB for the write to succeed.", "distractor_analysis": "Creating an IAM user and baking its access key into the AMI does work mechanically -- the app can authenticate -- but it plants a long-lived static secret that must be rotated by hand and can leak if the AMI or code is exposed, which is exactly the anti-pattern the role-based approach avoids.", "claim_ids": ["cl-4255e3ab33bd", "cl-f75bacb9b7a3", "cl-37bdb307fb47", "cl-9c3eb028c430"], "difficulty": "easy", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The EC2 instance already has an IAM role attached via an instance profile, but that role's policy only grants ec2:* actions -- it has no DynamoDB permissions at all.", "prompt": "The same EC2-hosted application already has an IAM role attached through an instance profile, and that role's only policy grants ec2:* actions. The application still fails every time it tries to write to DynamoDB. What is wrong, and what must change?", "expected_answer": ["The write still fails: an EC2-only role gives no DynamoDB access, so the role's policy must be updated to also grant the needed DynamoDB permissions (e.g. dynamodb:PutItem) before the write will succeed."], "reasoning": "Having a role attached is necessary but not sufficient -- the role's permissions must cover the service actually being called. An ec2:*-only policy grants nothing on DynamoDB, so the write keeps failing until DynamoDB permissions are added to that same role; no new role or user is needed.", "claim_ids": ["cl-827554316d65", "cl-4255e3ab33bd"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The instance also sits in a public subnet with a public IP address and belongs to a security group that allows outbound HTTPS to 0.0.0.0/0; the DynamoDB-write requirement is otherwise unchanged.", "prompt": "Same EC2-hosted application needing to write to DynamoDB, still with no IAM role attached and the teammate's AMI-embedded-access-key suggestion on the table. The instance happens to live in a public subnet with a public IP and a security group permitting outbound HTTPS to anywhere. Does that change what you should do?", "expected_answer": ["Create an IAM role that grants the DynamoDB permissions the application needs, and attach that role to the EC2 instance (via an instance profile) instead of embedding IAM user credentials."], "reasoning": "Public IP, subnet placement, and outbound security group rules only affect network reachability; they say nothing about how the instance authenticates to the DynamoDB API. The authentication choice is unchanged: a role attached via an instance profile, not an embedded IAM user access key.", "claim_ids": ["cl-4255e3ab33bd", "cl-f75bacb9b7a3", "cl-37bdb307fb47"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "The teammate pushes back, pointing out that the IAM-user-with-embedded-access-key approach is already implemented and does successfully let the application write to DynamoDB today, and asks why that isn't good enough to just ship.", "prompt": "The teammate has already wired up an IAM user and embedded its access key in the AMI, and confirms the application is successfully writing to DynamoDB right now with that setup. They argue it works, so there's no need to change it. How do you respond?", "expected_answer": ["Create an IAM role that grants the DynamoDB permissions the application needs, and attach that role to the EC2 instance (via an instance profile) instead of embedding IAM user credentials."], "reasoning": "That it currently works is not the deciding factor: embedding a static IAM user access key in the AMI is a long-lived secret that must be rotated by hand and can leak, which is a strictly less secure practice than attaching a role. The recommendation to move to an instance role is unchanged regardless of whether the insecure approach happens to function today.", "distractor_analysis": "\"It already works\" is a strong-sounding but irrelevant justification -- functioning today says nothing about rotation risk or leak exposure, which is the actual axis the role-based recommendation is evaluated on.", "claim_ids": ["cl-37bdb307fb47", "cl-4255e3ab33bd", "cl-f75bacb9b7a3"], "difficulty": "medium", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The compute is now a fleet of instances in an Auto Scaling group (not a single EC2 instance), and the service being called is CloudWatch's PutMetricData API instead of DynamoDB.", "prompt": "Instances launched by an Auto Scaling group need to call the CloudWatch PutMetricData API to publish custom metrics. A teammate again proposes creating an IAM user and distributing its access key to each instance via User Data. What is the AWS-recommended approach here?", "expected_answer": ["Attach an IAM role (with the needed CloudWatch PutMetricData permission) to the Auto Scaling group's launch configuration, instead of distributing IAM user credentials to the instances."], "reasoning": "The same role-over-embedded-credentials pattern transfers from a single EC2 instance calling DynamoDB to a whole Auto Scaling group calling CloudWatch: attaching an IAM role to the launch configuration lets every instance in the group authenticate with credentials that are automatically rotated and delivered via the instance metadata service, instead of distributing and manually rotating a shared IAM user's static secret.", "claim_ids": ["cl-75ab3e8821db", "cl-6c0e7c9cf67b", "cl-81c2f9cee3ef"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "unsupported-generation", "severity": "high", "description": "The contrast set's first exception states as settled fact that an instance role is a prerequisite for SSM Session Manager while tag-scoped control comes from IAM user/group policies with tag conditions. Both claims it rests on (cl-e613b67ee3dc, cl-bd808fa45485, from awssysops-p3-1-q845) are marked 'conflicted', so the source disagrees on which mechanism is the answer. The synthesis settles the dispute silently and does not flag it.", "related_entity_ids": ["aws-sysops-service-iam--cs-1", "cl-bd808fa45485", "cl-e613b67ee3dc"]}, {"type": "contradiction", "severity": "high", "description": "PassRole vs AssumeRole (awssysops-p2-q565): cl-deab9a53d3fe records that the boxed answer (restricted role-switching, i.e. AssumeRole semantics) conflicts with a unanimous community vote. Yet cl-259136ebf6fe, cl-c23f2e24f3fe and cl-0094447aef70 from the same question are marked 'supported', and they assert the community reading. The contrast set's second exception then presents 'iam:PassRole ... does not let the user assume the role' as settled, with no dispute flag. The same source question supports opposite answers, and the dispute should be flagged rather than settled.", "related_entity_ids": ["aws-sysops-service-iam--cs-1", "cl-deab9a53d3fe", "cl-259136ebf6fe", "cl-c23f2e24f3fe", "cl-0094447aef70"]}, {"type": "contradiction", "severity": "high", "description": "${aws:username} scoping (awssysops-p1-q126, awssysops-p1-q255): cl-c19fe632dec5 is marked 'supported' and cites both questions for the self-scoping reading. But cl-9b4cadd86acf (conflicted) records that q126's boxed answer says the policy grants rights over all IAM users' credentials. cl-8c00c68ae6a5 (needs-review) records that every answer choice in q255 assumes the 'all IAM users' reading. So the source questions disagree with the claim cited as supported by them.", "related_entity_ids": ["cl-c19fe632dec5", "cl-9b4cadd86acf", "cl-8c00c68ae6a5", "aws-sysops-service-iam--m-1"]}, {"type": "ambiguity", "severity": "medium", "description": "The mental model's limits tell the learner to 'answer from the mechanism, not the boxed key' for the disputed ${aws:username} and PassRole/AssumeRole questions. That resolves the source disputes by fiat instead of leaving them flagged as unresolved, so the learner cannot tell which answer the exam key expects.", "related_entity_ids": ["aws-sysops-service-iam--m-1", "cl-9b4cadd86acf", "cl-deab9a53d3fe"]}, {"type": "contradiction", "severity": "medium", "description": "Cross-account role assumption (awssysops-p3-1-q878): cl-29ed46b3aff1 (trust policy on the target-account role), cl-3bfd43aaaa8b (sts:AssumeRole permission on the source-account principal) and cl-aa717ae6e171 are all 'conflicted'. The mental model's mechanism and its cue \"'another AWS account' -> role in the target account with a trust policy, caller uses sts:AssumeRole\" state this pattern as settled, using only q609 (cl-d6d0954978ea). Neither mentions the q878 dispute in limits.", "related_entity_ids": ["aws-sysops-service-iam--m-1", "cl-29ed46b3aff1", "cl-3bfd43aaaa8b", "cl-aa717ae6e171", "cl-d6d0954978ea"]}, {"type": "contradiction", "severity": "medium", "description": "NotAction Deny evaluation (awssysops-p3-1-q696): cl-1615c290d580 (rds:DescribeDBInstances denied by the NotAction Deny) and cl-6630e640095d (ec2:DescribeInstances allowed in us-east-1) are 'conflicted', so the source answer disagrees with the explicit-Deny-wins reading. Meanwhile cl-454834273b49, cl-6c19aed0fc30 and cl-3bd9df2b8fbe from the same question are 'supported', and the mental model's 'Explicit Deny beats any Allow' invariant leaves this dispute unflagged.", "related_entity_ids": ["cl-1615c290d580", "cl-6630e640095d", "cl-454834273b49", "cl-6c19aed0fc30", "aws-sysops-service-iam--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Deny-with-condition troubleshooting (awssysops-p2-q333): cl-e7acc0fced5f (Deny with StringNotLike on aws:userID) and cl-f2613b08406b (narrowing the Allow does not fix the block) are 'conflicted'. But cl-f31f2112bc46 cites q333 alongside q483 as 'supported'. The source question disagrees on its answer, and that dispute is not reflected on the supported claim it feeds.", "related_entity_ids": ["cl-e7acc0fced5f", "cl-f2613b08406b", "cl-f31f2112bc46"]}, {"type": "contradiction", "severity": "medium", "description": "Shared responsibility (awssysops-p2-q334): cl-723c4219b128 (IAM password policy configuration is the customer's responsibility) is 'conflicted', which means the source answer for q334 disagrees. Other claims from the same question (cl-61564b0e94ae, cl-57118cc168c6, cl-69d423daef1c) and related claims from q322/q804 (cl-6cd4c4a80e86, cl-9f550bb37420) are 'supported' and imply the same customer-side reading. The dispute is unresolved.", "related_entity_ids": ["cl-723c4219b128", "cl-6cd4c4a80e86", "cl-9f550bb37420"]}, {"type": "contradiction", "severity": "medium", "description": "'AWS Account' entity analogy (awssysops-p2-q496): cl-ef6d410f3c45 records that a unanimous community vote contradicts the boxed answer (Unix root/superuser). cl-71ce85890328 then asserts the community reading (primary billing entity) as a fact. Both are 'conflicted', and the question is unresolved. Separately, cl-ef6d410f3c45 is typed 'distractor' but is a meta-statement about vote shares, not a distractor.", "related_entity_ids": ["cl-71ce85890328", "cl-ef6d410f3c45"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-93f211582fe3 says the 10-groups-per-IAM-user quota 'can be raised via a service quota increase request'. AWS documents groups-per-user (10) as a fixed, non-adjustable IAM quota, and nothing in the claim set supports the increase part.", "related_entity_ids": ["cl-93f211582fe3"]}, {"type": "stale-risk", "severity": "medium", "description": "cl-33aaba1b1261 states the IAM limits as of when the question was written: 100 groups per account and 250 roles per account. Current AWS defaults are higher (e.g., 300 groups and 1,000 roles per account, both adjustable), so the figures are stale. The claim is already marked needs-review.", "related_entity_ids": ["cl-33aaba1b1261"]}, {"type": "ambiguity", "severity": "low", "description": "cl-821b7e1a059f says self-service password change 'must be explicitly enabled in the account's password policy', which implies that is the only route. cl-7cfbf7df16fa says it can be granted via the password policy or an IAM policy statement (iam:ChangePassword). The two defaults disagree on whether the password policy is the only mechanism.", "related_entity_ids": ["cl-821b7e1a059f", "cl-7cfbf7df16fa", "cl-22bc6e89d2d8"]}, {"type": "stale-risk", "severity": "low", "description": "cl-c89deaf62bbf says the console's IAM user creation wizard forces the administrator to pick at least one credential type. The current console lets you create a user with no console access and no access keys, so this UI behavior may be out of date.", "related_entity_ids": ["cl-c89deaf62bbf"]}], "sourceQuestionCount":
