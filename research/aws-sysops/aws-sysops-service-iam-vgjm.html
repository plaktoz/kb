<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-iam", "exam": "aws-sysops", "facet": {"key": "service", "value": "iam"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "rule", "conditions": ["instances need to call the CloudWatch PutMetricData API"], "confidence": "high", "id": "cl-75ab3e8821db", "source_question_ids": ["awssysops-p1-q012"], "statement": "Attaching an IAM role to an Auto Scaling launch configuration is the AWS-recommended way to let instances authenticate CloudWatch PutMetricData calls, because credentials are automatically rotated and delivered via the instance metadata service.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6c0e7c9cf67b", "source_question_ids": ["awssysops-p1-q012"], "statement": "Creating an IAM user and injecting its credentials into instance User Data or a private repository means distributing and rotating static long-lived secrets by hand, which is not the recommended authentication approach for instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-81c2f9cee3ef", "source_question_ids": ["awssysops-p1-q012"], "statement": "CloudWatch has no metric-level resource policy that can grant PutMetricData permission to instances from an Auto Scaling group.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c6dbb9badd60", "source_question_ids": ["awssysops-p1-q018"], "statement": "AWS API access credentials evaluated in a security audit include console passwords, access keys, and X.509 signing certificates.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-223c96228fca", "source_question_ids": ["awssysops-p1-q018"], "statement": "EC2 key pairs authenticate SSH/RDP logins into EC2 instances, not calls to the AWS API itself, so they are not considered an AWS API access credential.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0228115032b0", "source_question_ids": ["awssysops-p1-q018"], "statement": "Security group membership is a network access control construct, not a type of AWS credential.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-270fd100a40b", "source_question_ids": ["awssysops-p1-q027"], "statement": "In an S3 bucket policy statement with Effect Allow, a Condition combining IpAddress for a CIDR range with NotIpAddress excluding one specific address within that range grants access to every address in the range except the excluded one.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fce6a7069012", "source_question_ids": ["awssysops-p1-q027"], "statement": "A policy statement with Effect Allow only ever grants access; it never produces an explicit deny.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-a2501324f971", "source_question_ids": ["awssysops-p1-q027"], "statement": "Because S3 access is default-deny, an address excluded from an Allow condition via NotIpAddress ends up with no matching grant and effectively loses access, even though no explicit Deny statement exists.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-803ba56bc4c0", "source_question_ids": ["awssysops-p1-q040"], "statement": "Enabling multi-factor authentication (MFA) for privileged IAM users supplies a one-time code alongside the standard password on every login, satisfying a 'one-time credential in addition to username/password' security requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-83ff1f3dc92f", "source_question_ids": ["awssysops-p1-q040"], "statement": "Federating an organization's identity provider with AWS via the IAM Security Token Service (STS) issues temporary, automatically-rotating credentials, which can satisfy a 'frequently rotated or one-time credentials' security policy requirement.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6556d9d4cf8d", "source_question_ids": ["awssysops-p1-q040"], "statement": "Simply creating IAM users for privileged accounts does not, by itself, enforce any password rotation or one-time-credential requirement.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-27b344c4428c", "source_question_ids": ["awssysops-p1-q055"], "statement": "Every IAM user within a single AWS account must have a unique login/user name; AWS does not support giving multiple IAM users the same shared login ID with different passwords.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-48a0a8b957ca", "source_question_ids": ["awssysops-p1-q058"], "statement": "IAM groups let an administrator attach a policy once to the group so that every member user inherits it, meaning a policy change made at the group level automatically applies to all member users without touching individual user policy attachments.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-994c952cc69d", "source_question_ids": ["awssysops-p1-q058"], "statement": "IAM roles are assumed by AWS services or federated identities to obtain temporary credentials; they are not a mechanism for organizing or granting policies to a set of IAM users the way IAM groups are.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-de918035cefd", "source_question_ids": ["awssysops-p1-q069"], "statement": "The s3:ListBucket action is a bucket-level action and requires a bucket-level resource ARN (e.g., arn:aws:s3:::bucketname) to take effect, not an object-level resource ARN.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2e6f11a4dfd2", "source_question_ids": ["awssysops-p1-q069"], "statement": "An S3 bucket policy whose Resource ARN is scoped to a pattern like arn:aws:s3:::bucket/*.jpg only covers objects matching that pattern, not the bucket itself or other objects.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-22bc6e89d2d8", "source_question_ids": ["awssysops-p1-q088"], "statement": "The account-wide IAM password policy (set under IAM account settings) is where an administrator enables the option allowing IAM users to change their own password; once enabled account-wide, no separate per-user password policy is needed to grant that permission.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aebb76f8a890", "source_question_ids": ["awssysops-p1-q088"], "statement": "An IAM user's ability to change their own password is governed independently from their access keys, so enabling self-service password changes in the account password policy does not grant or affect the ability to change access keys.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-821b7e1a059f", "source_question_ids": ["awssysops-p1-q088"], "statement": "By default, IAM users cannot change their own password; self-service password change must be explicitly enabled in the account's password policy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2e0fb4ab644f", "source_question_ids": ["awssysops-p1-q094"], "statement": "Every IAM user within a given AWS account signs in to the AWS Management Console using the same fixed URL based on the 12-digit account ID (https://<account-id>.signin.aws.amazon.com/console/) or the account alias if one is set; this sign-in URL does not vary by which IAM group a user belongs to.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-c19fe632dec5", "source_question_ids": ["awssysops-p1-q126", "awssysops-p1-q255"], "statement": "In an IAM policy, the ${aws:username} policy variable used in a Resource ARN resolves at request time to the identity of whichever user is making the request, scoping the grant to that requesting user's own IAM resource rather than to all IAM users in the account.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9b4cadd86acf", "source_question_ids": ["awssysops-p1-q126"], "statement": "For a policy whose Resource ARN uses ${aws:username}, the source's boxed answer and the community's reasoning directly conflict over whether the policy grants rights over 'all IAM users'' credentials (boxed) or only the requesting user's own credentials (community), given the self-scoping Resource ARN.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6baee04a4093", "source_question_ids": ["awssysops-p1-q139"], "statement": "AWS Consolidated Billing lets multiple separate AWS accounts be billed together from one paying account while still producing a detailed, itemized cost report for each individual account, enabling cost separation by account.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f4bc36e8ede4", "source_question_ids": ["awssysops-p1-q139"], "statement": "IAM cross-account roles are a mechanism for delegating access between AWS accounts, not a billing or cost-separation mechanism.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ab947da4766c", "source_question_ids": ["awssysops-p1-q148"], "statement": "Organizing a large number of IAM users into IAM groups mapped to organizational departments, with policies defined once per group, is a standard best practice for managing access at scale (e.g., 1000+ employees).", "status": "supported"}, {"claim_type": "rule", "conditions": ["organization already has an existing corporate directory or SSO system"], "confidence": "medium", "id": "cl-39d8ca271fc8", "source_question_ids": ["awssysops-p1-q148"], "statement": "Attaching an IAM role to an organization's own identity/authentication service (identity federation) to authorize users for AWS services is an AWS-recommended pattern specifically when the organization already has an existing corporate directory or SSO system to reuse.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-b17544cc3a16", "source_question_ids": ["awssysops-p1-q155"], "statement": "IAM policies are attached to IAM identities (users, groups, or roles) to grant permissions on AWS services; they cannot be attached directly to an RDS instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0294b798e14c", "source_question_ids": ["awssysops-p1-q155"], "statement": "RDS database-level access (authenticating to the database engine itself) is a separate concern from IAM permissions to manage RDS through the AWS API.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-833e36233d41", "source_question_ids": ["awssysops-p1-q155"], "statement": "To grant a user access to RDS, the root account owner should create an IAM user and attach a policy granting that IAM user access to RDS management actions.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-24cb589e2463", "source_question_ids": ["awssysops-p1-q180"], "statement": "An S3 bucket policy statement granting an object-level action like s3:GetObjectAcl must use an object-scoped resource ARN (e.g., arn:aws:s3:::bucket/*) rather than a bucket-level ARN (arn:aws:s3:::bucket), or AWS rejects the policy with an 'Action does not apply to any resource(s) in statement' error.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3b60daa7fccc", "source_question_ids": ["awssysops-p1-q182"], "statement": "An IAM policy statement granting only the iam:AddUserToGroup, iam:RemoveUserFromGroup, and iam:GetGroup actions scoped to a specific IAM group's ARN allows a user to add/remove members and view membership of that one named group, but does not allow deleting the group or joining arbitrary groups.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-76ba80e97899", "source_question_ids": ["awssysops-p1-q189"], "statement": "An IAM/bucket policy statement with Effect Deny, Action \"*\", Resource \"*\", and a NotIpAddress condition on aws:SourceIp against a set of CIDR ranges denies all actions for any request originating outside those IP ranges, which is a way to restrict IAM/AWS console access to a specific corporate network.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a1f64ac3f046", "source_question_ids": ["awssysops-p1-q189"], "statement": "Security groups control network traffic to EC2 instances; they do not control or restrict access to the IAM/AWS Management Console itself.", "status": "supported"}, {"claim_type": "fact", "conditions": ["policy contains exactly these three Allow statements with no elasticloadbalancing action"], "confidence": "high", "id": "cl-0f0d7c0cf397", "source_question_ids": ["awssysops-p1-q190"], "statement": "An IAM policy granting only ec2:Describe*, a set of CloudWatch read actions (ListMetrics, GetMetricStatistics, Describe*), and autoscaling:Describe* grants read-only access across EC2, CloudWatch, and Auto Scaling, but grants no access to Elastic Load Balancing since no elasticloadbalancing action appears in the policy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8f2a11ab7c45", "source_question_ids": ["awssysops-p1-q190"], "statement": "EBS volumes are covered by the ec2:Describe* IAM action, since EBS is part of the EC2 API namespace, rather than being excluded from it.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0d69ea04c5de", "source_question_ids": ["awssysops-p1-q198"], "statement": "An IAM policy statement with Effect \"Allow\", Action \"*\", and Resource \"*\" grants unrestricted full access to every action on every AWS resource/service.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-033da3105a54", "source_question_ids": ["awssysops-p1-q198"], "statement": "IAM users automatically inherit the permissions granted by every IAM group they are a member of.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-fad7ade99c77", "source_question_ids": ["awssysops-p1-q220"], "statement": "S3 bucket ACLs can only grant permissions to AWS accounts or predefined S3 groups; they have no mechanism to target an individual IAM user within an account.", "status": "supported"}, {"claim_type": "rule", "conditions": ["IAM user has CloudWatch permissions but not EC2 permissions"], "confidence": "high", "id": "cl-ef09eb226222", "source_question_ids": ["awssysops-p1-q230"], "statement": "An IAM user with only CloudWatch permissions can still create a CloudWatch alarm and configure an EC2 stop/terminate action on it, since CloudWatch permissions are sufficient for the configuration step.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2ce09a2de24f", "source_question_ids": ["awssysops-p1-q230"], "statement": "When a CloudWatch alarm fires, executing a configured EC2 action (such as stopping an instance) requires the triggering IAM user/role to have the relevant EC2 permissions.", "status": "supported"}, {"claim_type": "fact", "conditions": ["IAM user has CloudWatch permissions but not EC2 permissions"], "confidence": "high", "id": "cl-783561b8b04f", "source_question_ids": ["awssysops-p1-q230"], "statement": "If the IAM user lacks EC2 permissions, a CloudWatch alarm's configured EC2 action silently fails to execute when the alarm fires, even though the alarm and action were successfully configured beforehand.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bf8c5a59c953", "source_question_ids": ["awssysops-p1-q232"], "statement": "Best practice for a mobile application that calls AWS services directly is to avoid embedding any long-lived IAM user or root account credentials in the app, and instead use an IAM role with web identity federation, authenticating end users through an external identity provider (e.g., Google, Amazon, Facebook) to obtain short-lived temporary security credentials.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-84fd71d859c1", "source_question_ids": ["awssysops-p1-q232"], "statement": "Embedding an AWS root account's access key and secret access key directly inside a mobile application is a security anti-pattern.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-4255e3ab33bd", "source_question_ids": ["awssysops-p1-q254"], "statement": "For an application running on an EC2 instance that needs to call another AWS service (e.g. DynamoDB), AWS best practice is to attach an IAM role with the needed permissions to the EC2 instance rather than embedding IAM user credentials in the application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f75bacb9b7a3", "source_question_ids": ["awssysops-p1-q254"], "statement": "An EC2 instance with an attached IAM role automatically receives temporary security credentials for that role, removing the need to embed static credentials in application code.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-37bdb307fb47", "source_question_ids": ["awssysops-p1-q254"], "statement": "Creating an IAM user and distributing its credentials within an application for AWS service access is a less secure practice than attaching an instance IAM role.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-827554316d65", "source_question_ids": ["awssysops-p1-q254"], "statement": "Attaching an IAM role that grants only EC2 access to an instance does not provide the DynamoDB permissions an application needs to call the DynamoDB API; a role's permissions must match the service actually being called.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8c00c68ae6a5", "source_question_ids": ["awssysops-p1-q255"], "statement": "In this question, every listed answer choice assumes the policy grants access to 'all IAM users'' credentials, but the policy's Resource ARN containing ${aws:username} actually scopes the grant to only the calling user's own credentials, which multiple community comments flag as invalidating every listed choice.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1800b72eac65", "source_question_ids": ["awssysops-p1-q264"], "statement": "An IAM policy can scope ec2:* actions to only resources matching a given tag by using a Condition block with StringEquals on an ec2:ResourceTag/<TagKey> condition key, e.g. ec2:ResourceTag/InstanceType.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e252aaefdb8b", "source_question_ids": ["awssysops-p1-q264"], "statement": "Tagging EC2 instances (e.g. as Test vs. Production) and referencing that tag in an IAM policy condition lets an organization restrict a group of IAM users to only the tagged subset of instances, without hardcoding instance IDs or regions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-14bc9c223b5f", "source_question_ids": ["awssysops-p1-q264"], "statement": "Restricting IAM access by launching instances in separate regions, or by hardcoding instance IDs in a policy, both require ongoing manual upkeep as instances are added or removed, unlike tag-based conditions.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-851d4a2ca538", "source_question_ids": ["awssysops-p1-q268"], "statement": "Valid IAM user, group, role, and instance-profile names may contain only letters, digits, and the characters plus (+), equal (=), comma (,), period (.), at sign (@), underscore (_), and hyphen (-); the character '#' is not permitted in IAM names.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1dd9b346dc53", "source_question_ids": ["awssysops-p1-q275"], "statement": "The IAM policy action aws-portal:ViewUsage, granted with Resource \"*\", specifically allows a user to view the AWS usage report page.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c08ecb9a3312", "source_question_ids": ["awssysops-p1-q275"], "statement": "The IAM policy action aws-portal:ViewBilling controls access to the billing page, which is distinct from the AWS usage report page.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-090b846933dc", "source_question_ids": ["awssysops-p1-q276"], "statement": "Amazon DynamoDB has no concept of a separate per-user 'database'; it only has tables.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f263c32d9b98", "source_question_ids": ["awssysops-p1-q276"], "statement": "A single IAM group-level policy can grant each member user access to a differently-named DynamoDB table by naming each table after the corresponding IAM username and using the ${aws:username} policy variable in the Resource ARN (e.g., arn:aws:dynamodb:*:*:table/${aws:username}), scoping the one shared policy per-user automatically at request time.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "low", "id": "cl-33aaba1b1261", "source_question_ids": ["awssysops-p1-q283"], "statement": "At the time this question was authored, the stated default IAM limits were up to 100 groups per AWS account, up to 5000 IAM users per account, up to 250 roles per account, and up to 10 groups per IAM user.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-effd8ced9cb8", "source_question_ids": ["awssysops-p2-q313"], "statement": "Configuring MFA on the root account and on privileged IAM users, together with assigning IAM users/groups least-privilege policies, are IAM best practices specifically aimed at hardening an AWS account's security posture ahead of a security assessment.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e7be4e7d74a9", "source_question_ids": ["awssysops-p2-q313"], "statement": "Creating individual IAM users for everyone in an organization is a general IAM user-management practice, and is not strictly necessary when an organization federates identity through an external directory such as LDAP/AD.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2bbd19b17318", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, patch management of the guest operating system on an EC2 instance is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-265b902de8ca", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, choosing whether to encrypt EBS volumes is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6cd4c4a80e86", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, lifecycle management of IAM credentials is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d9a4d865fe90", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, configuring Security Group and Network ACL settings is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-a2b3d8260ae9", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, controlling physical access to compute resources and underlying hardware is AWS's responsibility, not the customer's.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d8bb0a066c77", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, decommissioning retired physical storage devices is AWS's responsibility, not the customer's, since customers never have physical or hardware-level access.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f31f2112bc46", "source_question_ids": ["awssysops-p2-q333", "awssysops-p2-q483"], "statement": "In IAM and S3 bucket policy evaluation, an explicit Deny statement always overrides a matching Allow statement, even when another attached policy or statement grants the same action.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e7acc0fced5f", "source_question_ids": ["awssysops-p2-q333"], "statement": "A Deny atus": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-babeb3d26661", "source_question_ids": ["awssysops-p2-q341"], "statement": "Under the AWS Shared Responsibility Model, guest operating system, network, and firewall configuration are the customer's responsibility.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-25859de42ea8", "source_question_ids": ["awssysops-p2-q341"], "statement": "Under the AWS Shared Responsibility Model, client-side data encryption and data integrity authentication are the customer's responsibility.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fc6c30f69db6", "source_question_ids": ["awssysops-p2-q341"], "statement": "Under the AWS Shared Responsibility Model, AWS data center access logs, hypervisor updates/configuration, and physical media destruction are AWS's responsibility, not the customer's, because the customer never has physical or hypervisor-level access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fdbbd5266274", "source_question_ids": ["awssysops-p2-q465"], "statement": "In an IAM resource-based policy, the entity specifying who is allowed to access the resource (an IAM user, role, AWS account, or federated user) is called the principal.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9f80090d8111", "source_question_ids": ["awssysops-p2-q465"], "statement": "\"Permission\", \"role\", and \"license\" are distractor terms for the IAM concept that names who is allowed to access a resource; the correct term is \"principal\".", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c7a39f5a2edc", "source_question_ids": ["awssysops-p2-q469"], "statement": "When configuring a virtual MFA device on a smartphone for an IAM user, physical access to that smartphone is required during the setup wizard itself, to scan the QR code or enter the secret key into the authenticator app.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-7b65cddf5f08", "source_question_ids": ["awssysops-p2-q469"], "statement": "Virtual MFA setup for an IAM user cannot be completed on one device and have the smartphone used later for authentication; the smartphone must be present during the wizard.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-526673e4cd12", "source_question_ids": ["awssysops-p2-q470"], "statement": "IAM can be used to grant access to Amazon DynamoDB resources and API actions by writing an IAM policy listing the permissions and attaching it to a user or role.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ab6974a49f7b", "source_question_ids": ["awssysops-p2-q473"], "statement": "Each individual statement inside the Statement array of an AWS IAM policy is a JSON block enclosed in braces.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f23d17c69bbb", "source_question_ids": ["awssysops-p2-q475", "awssysops-p2-q504"], "statement": "IAM stands for Identity and Access Management, where \"identity\" covers authentication (who is the user) and \"access\" covers authorization (what they are allowed to do).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3e0dacfa0a59", "source_question_ids": ["awssysops-p2-q475"], "statement": "\"Amazon Identity and Authentication Mechanism\" and \"Amazon Integrated Access Management\" are plausible-but-wrong expansions of the IAM acronym.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5352c9d24aa5", "source_question_ids": ["awssysops-p2-q476"], "statement": "AWS IAM can be used to assign permissions determining who can manage or modify RDS resources, such as creating, describing, modifying, deleting, or tagging RDS DB instances and security groups.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0830dafb6b89", "source_question_ids": ["awssysops-p2-q482"], "statement": "AWS Security Token Service (STS) APIs are used within IAM to grant users temporary access to AWS resources via time-limited credentials.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-99abeff57f96", "source_question_ids": ["awssysops-p2-q482"], "statement": "\"AWS Security Transport Service\", \"AWS Security Tree Service\", and \"AWS Security Task Service\" are not real AWS service names; they are plausible-but-wrong expansions of the STS acronym, distinct from the real \"AWS Security Token Service\".", "status": "supported"}, {"claim_type": "rule", "conditions": ["user has two attached policies, one allowing and one explicitly denying the same action"], "confidence": "high", "id": "cl-6b01212444b0", "source_question_ids": ["awssysops-p2-q483"], "statement": "When an IAM user has one attached policy that allows an action and another attached policy that explicitly denies the same action, the explicit deny wins and the request is denied, regardless of which group the user accesses through.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-d67fc94a596f", "source_question_ids": ["awssysops-p2-q483"], "statement": "IAM policy evaluation logic denies by default, and an explicit Allow statement overrides that default (unless overridden in turn by an explicit Deny).", "status": "supported"}, {"claim_type": "rule", "conditions": ["resource churn is frequent", "group membership is stable"], "confidence": "high", "id": "cl-0faade9dc8f7", "source_question_ids": ["awssysops-p2-q484"], "statement": "When IAM group membership is stable but the underlying resources churn, the efficient IAM policy design tags resources and users by role and conditions the policy on that tag, rather than on instance ID or instance size.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7228a9267a5e", "source_question_ids": ["awssysops-p2-q484"], "statement": "Conditioning an IAM policy on instance size or on instance ID requires constant policy updates as instances are deleted and replaced, making it inefficient for a frequently-churning fleet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-19a5c6160efc", "source_question_ids": ["awssysops-p2-q484"], "statement": "Launching production and test instances in separate regions does not by itself address group-based IAM access control.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e2033cb0b988", "source_question_ids": ["awssysops-p2-q485"], "statement": "A virtual MFA device for an IAM user generates six-digit authentication codes compatible with the time-based one-time password (TOTP) standard.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-05fd47f6d5df", "source_question_ids": ["awssysops-p2-q486", "awssysops-p2-q518"], "statement": "The Action element of an IAM policy statement (or its complement NotAction) describes the specific action or actions that the statement allows or denies.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b03dc47f1be4", "source_question_ids": ["awssysops-p2-q489"], "statement": "A single CloudFormation template can create an IAM user, an S3 bucket, and the IAM policy binding them together so that the bucket is accessible only by that specific IAM user.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-fce8686e6bff", "source_question_ids": ["awssysops-p2-q493"], "statement": "Best practice for an EC2-hosted application calling AWS APIs (e.g., DynamoDB) is to attach an IAM role to the EC2 instance rather than embedding IAM user credentials in the application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8d2d25adfa8d", "source_question_ids": ["awssysops-p2-q493"], "statement": "An IAM role attached to an EC2 instance supplies temporary security credentials automatically, avoiding the credential storage and rotation risk of long-lived IAM user credentials.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-b125f0f80fa3", "source_question_ids": ["awssysops-p2-q494"], "statement": "A newly created IAM user has no password and no access key enabled by default; no credential type is auto-enabled for a new user.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f966e77068b5", "source_question_ids": ["awssysops-p2-q494"], "statement": "An administrator must explicitly create a console password and/or an access key for an IAM user before that user has any usable credentials.", "status": "supported"}, {"claim_type": "exception", "conditions": ["creating an IAM user via the AWS console wizard"], "confidence": "medium", "id": "cl-c89deaf62bbf", "source_question_ids": ["awssysops-p2-q494"], "statement": "The AWS console's IAM user creation wizard forces an administrator to pick at least one credential type during the creation flow, but this UX requirement does not mean AWS auto-enables a credential type by default.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-71ce85890328", "source_question_ids": ["awssysops-p2-q496"], "statement": "The AWS Account IAM entity is the primary billing/ownership entity under which everything, including the root user, exists; the Unix \"root/superuser\" analogy applies to the root user, a distinct IAM concept from the account itself.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-ef6d410f3c45", "source_question_ids": ["awssysops-p2-q496"], "statement": "For the question of what the IAM \"AWS Account\" entity is similar to, community vote was unanimous for the option describing it as the primary billing entity, directly contradicting the sourced boxed answer that it is like a Unix root/superuser; this question is marked disputed.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-7cfbf7df16fa", "source_question_ids": ["awssysops-p2-q498"], "statement": "An IAM user cannot change their own password by default; an administrator must grant that permission via the password policy or an IAM policy statement.", "status": "supported"}, {"claim_type": "fact", "conditions": ["IAM user has been granted password-change permission"], "confidence": "high", "id": "cl-59643cebb1b3", "source_question_ids": ["awssysops-p2-q498"], "statement": "Once an IAM user has been granted permission to change their own password, they can do so from either the AWS console or the CLI/API, not just one of those interfaces.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-26ae446d3e61", "source_question_ids": ["awssysops-p2-q499"], "statement": "An AWS account alias must be globally unique and maps to exactly one AWS account ID, so the same alias (and therefore the same IAM sign-in URL) cannot be shared across multiple separate AWS accounts.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-cd822ba06a7c", "source_question_ids": ["awssysops-p2-q499"], "statement": "Consolidated billing does not merge AWS account IDs or IAM sign-in URLs across accounts, so it cannot be used to give multiple AWS accounts the same IAM login URL.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d8b422462288", "source_question_ids": ["awssysops-p2-q500"], "statement": "Among AWS Direct Connect's IAM policy condition keys, aws:CurrentTime is used for date/time conditions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-49c88855c20f", "source_question_ids": ["awssysops-p2-q500"], "statement": "Among AWS Direct Connect's IAM policy condition keys, aws:SecureTransport is used for SSL-boolean conditions, aws:SourceIp is used for IP-address conditions, and aws:UserAgent is used for client-string conditions.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-01d13d166c33", "source_question_ids": ["awssysops-p2-q502"], "statement": "Password management permissions in IAM can be delegated by adding a user to a group whose attached policy grants permission to modify other users' IAM passwords, letting that user change another user's password without being an administrator.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a5adf66adce7", "source_question_ids": ["awssysops-p2-q503"], "statement": "IAM-based access control for AWS Billing and Cost Management can restrict access to invoices, detailed information about charges and account activity, budgets, payment methods, and credits — a broader set of controllable items than payment methods alone, invoices alone, or charge/activity information alone.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-63216c7fbbdf", "source_question_ids": ["awssysops-p2-q504"], "statement": "IAM's core purpose is to provide a mechanism to authenticate users and authorize what they can do when accessing AWS resources, not to integrate on-premises authentication protocols with the cloud.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": urce, and Condition.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3812e5485c4b", "source_question_ids": ["awssysops-p2-q515"], "statement": "You can attach more than one inline policy to a single IAM user, role, or group; there is no one-policy cap and no region or VPC/GovCloud restriction on doing so.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-4eac6cb57db9", "source_question_ids": ["awssysops-p2-q515"], "statement": "The only constraint on attaching multiple inline policies to an IAM entity is a total aggregate character-size limit per entity: 2,048 characters for users, 10,240 for roles, and 5,120 for groups.", "status": "supported"}, {"claim_type": "rule", "conditions": ["policy has multiple condition operators, or multiple keys on one condition operator"], "confidence": "high", "id": "cl-0a3afce89cdc", "source_question_ids": ["awssysops-p2-q517"], "statement": "When an IAM policy has multiple condition operators, or multiple keys attached to a single condition operator, the conditions are evaluated with a logical AND — all must resolve to true to trigger the policy's Allow/Deny effect.", "status": "supported"}, {"claim_type": "exception", "conditions": ["single condition operator has multiple values for one key"], "confidence": "medium", "id": "cl-40a7e3f22b15", "source_question_ids": ["awssysops-p2-q517"], "statement": "A single IAM condition operator with multiple values for one key is evaluated with a logical OR, which is a different scenario from multiple condition operators or multiple keys (which use AND).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3ebe914fa656", "source_question_ids": ["awssysops-p2-q518"], "statement": "A policy statement in an IAM policy document is built from the Effect, Action, Resource, and optionally Condition elements; \"Key\" is not itself a statement-level element but a nested field inside a Condition block.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bffa660d8950", "source_question_ids": ["awssysops-p2-q519"], "statement": "IAM roles can be assumed by external users authenticated via an identity provider compatible with SAML 2.0, enabling federated single sign-on into AWS.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-cb88f9355f7d", "source_question_ids": ["awssysops-p2-q520"], "statement": "AWS best practice is to avoid creating or using access keys for the root account.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f52e9d43a12f", "source_question_ids": ["awssysops-p2-q520"], "statement": "AWS best practice is to rotate IAM security credentials at regular intervals.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4aa643eaa4c1", "source_question_ids": ["awssysops-p2-q520"], "statement": "AWS best practice is to create individual IAM users rather than sharing credentials.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-52e3b55c2264", "source_question_ids": ["awssysops-p2-q520"], "statement": "AWS best practice is to enable MFA for privileged IAM users.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ac49172a2cc9", "source_question_ids": ["awssysops-p2-q520"], "statement": "Creating an access key and secret access key attached to the root account is not a secure credential-management practice.", "status": "supported"}, {"claim_type": "rule", "conditions": ["mobile application users need secure access to their own content in a shared S3 bucket"], "confidence": "high", "id": "cl-ab5724cc3fe6", "source_question_ids": ["awssysops-p2-q527"], "statement": "Amazon Cognito authenticates mobile application end users, directly or via federated identity providers, and vends temporary credentials tied to an IAM role, which scopes exactly what each user can access in a shared S3 bucket, typically via per-user prefixes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0f19e99dea2a", "source_question_ids": ["awssysops-p2-q527"], "statement": "AWS Organizations manages multi-account governance and plays no role in authenticating individual mobile application end users for S3 access.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-259136ebf6fe", "source_question_ids": ["awssysops-p2-q565"], "statement": "The iam:PassRole permission allows a user to attach a specified IAM role to a resource they create (such as an EC2 instance), letting that resource run with the role's permissions; it does not let the user themselves assume or switch into that role.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-c23f2e24f3fe", "source_question_ids": ["awssysops-p2-q565"], "statement": "AssumeRole is a distinct IAM mechanism from PassRole: AssumeRole lets a principal temporarily switch to and operate as a role, which is a different capability than what an iam:PassRole permission grants.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0094447aef70", "source_question_ids": ["awssysops-p2-q565"], "statement": "An IAM policy combining ec2:* (full EC2 access) with iam:PassRole scoped to a role-name prefix (e.g., arn:aws:iam::ACCOUNT:role/InfraTeam*) lets a user launch an EC2 instance and attach any role matching that prefix to it.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-deab9a53d3fe", "source_question_ids": ["awssysops-p2-q565"], "statement": "For a policy granting ec2:* plus iam:PassRole scoped to a role-name prefix, the question's boxed answer (describing restricted role-switching, i.e., AssumeRole semantics) conflicts with a unanimous community vote favoring a different answer, reflecting a documented PassRole/AssumeRole confusion in the source discussion.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bebe136a0c96", "source_question_ids": ["awssysops-p2-q566"], "statement": "The s3:ListBucket action applies to the S3 bucket resource itself, not to individual objects, so granting it on an object-level ARN (ending in /*) does not actually grant permission to list the bucket's contents.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3337a47ae979", "source_question_ids": ["awssysops-p2-q566"], "statement": "An S3 bucket policy statement must scope its Resource to the bucket-level ARN (without a trailing /*) in order to grant list-bucket permissions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-79c6229c3086", "source_question_ids": ["awssysops-p2-q566"], "statement": "A bucket policy that grants read access only to the bucket resource itself, rather than to its objects, allows listing bucket contents but does not grant permission to read the actual object bytes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a30320d35f30", "source_question_ids": ["awssysops-p2-q567"], "statement": "AWS CloudTrail records API activity across an AWS account, including changes made to resources.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-62648cb17958", "source_question_ids": ["awssysops-p2-q567"], "statement": "CloudTrail logs delivered to an S3 bucket can be shared with an external auditor via a scoped IAM policy granting read access, without granting broader account access such as Administrator permissions.", "status": "supported"}, {"claim_type": "dis cret stored on the instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-81fe9b62c21a", "source_question_ids": ["awssysops-p3-1-q637", "awssysops-p3-1-q800"], "statement": "Embedding a static IAM user access key directly in application code or in an AMI creates a long-lived credential that can leak and does not rotate automatically.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-95924dcc0c03", "source_question_ids": ["awssysops-p3-1-q637"], "statement": "AWS Shield is a DDoS-protection service and has no bearing on securing file transfers between EC2 and S3.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2039d4f60b98", "source_question_ids": ["awssysops-p3-1-q661"], "statement": "Configuring SAML 2.0 federated access to AWS requires creating an IAM role whose trust policy lists the SAML provider as the principal.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e2bd523539b5", "source_question_ids": ["awssysops-p3-1-q661"], "statement": "Configuring SAML 2.0 federated access to AWS requires defining, in the identity provider, assertions that map IdP users/groups to IAM roles.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b3443c7d7873", "source_question_ids": ["awssysops-p3-1-q661"], "statement": "SAML federation to AWS does not require creating individual IAM users for each federated identity provider user, since federation issues temporary role credentials instead.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-454834273b49", "source_question_ids": ["awssysops-p3-1-q696"], "statement": "In IAM policy evaluation, an explicit Deny always overrides an Allow for the same action and resource.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Deny statement uses a NotAction element"], "confidence": "high", "id": "cl-6c19aed0fc30", "source_question_ids": ["awssysops-p3-1-q696"], "statement": "A Deny statement that uses NotAction with a list of actions denies every action except the ones listed in that NotAction element.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3bd9df2b8fbe", "source_question_ids": ["awssysops-p3-1-q696"], "statement": "An action not granted by any applicable Allow statement is denied by default via implicit deny.", "status": "supported"}, {"claim_type": "fact", "conditions": ["policy includes Allow rds:Describe*, Allow ec2:* conditioned on region, and Deny NotAction[ec2:*, s3:GetObject]"], "confidence": "medium", "id": "cl-1615c290d580", "source_question_ids": ["awssysops-p3-1-q696"], "statement": "In a policy containing Allow rds:Describe*, Allow ec2:* conditioned on region, and an unconditional Deny with NotAction[ec2:*, s3:GetObject], the rds:DescribeDBInstances action is actually denied overall because it falls within that NotAction Deny, which overrides the earlier Allow.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["policy includes Allow rds:Describe*, Allow ec2:* conditioned on region, and Deny NotAction[ec2:*, s3:GetObject]"], "confidence": "medium", "id": "cl-6630e640095d", "source_question_ids": ["awssysops-p3-1-q696"], "statement": "In a policy containing Allow rds:Describe*, Allow ec2:* conditioned on region us-east-1, and an unconditional Deny with NotAction[ec2:*, s3:GetObject], the ec2:DescribeInstances action in us-east-1 is allowed because it is granted by the region-conditioned ec2:* Allow and is exempt from the NotAction Deny since it is an ec2:* action.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a2eb0f7372fc", "source_question_ids": ["awssysops-p3-1-q704"], "statement": "Federating an on-premises LDAP directory with IAM via SAML
