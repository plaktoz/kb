<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

e store (ephemeral) storage loses all its data when the EC2 instance is stopped or terminated, making it unsuitable when durable persistence of the data must be maintained.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-70be56bdb992", "source_question_ids": ["awssysops-p1-q034"], "statement": "An EBS-optimized EC2 instance provides a dedicated, non-shared throughput channel between the instance and its EBS volumes, so other instance network traffic doesn't contend with disk I/O.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d7bcc27f0212", "source_question_ids": ["awssysops-p1-q034"], "statement": "Provisioned IOPS (PIOPS) EBS volumes deliver a guaranteed, consistent number of IOPS, suited to I/O-intensive workloads such as databases showing high disk wait time.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-391b931f4f8a", "source_question_ids": ["awssysops-p1-q034"], "statement": "Moving to a generic 'SSD-backed instance' does not by itself fix EBS disk I/O wait while keeping data persistent; the fix is an EBS-optimized instance with Provisioned IOPS EBS volumes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b44c3d4ac551", "source_question_ids": ["awssysops-p1-q039"], "statement": "RDS provides built-in, user-configurable automated backups with a rotation/retention window out of the box, without needing an additional backup service.", "status": "supported"}, {"claim_type": "exception", "conditions": ["prior to mid-2018 / before Data Lifecycle Manager existed"], "confidence": "medium", "id": "cl-f5149488c779", "source_question_ids": ["awssysops-p1-q039"], "statement": "EBS snapshot rotation only became automatable via AWS Data Lifecycle Manager starting mid-2018, so before DLM existed EBS did not offer an out-of-the-box automated backup rotation option.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e36c863e72e9", "source_question_ids": ["awssysops-p1-q039"], "statement": "AWS Data Lifecycle Manager (DLM), launched in 2018, automates EBS snapshot creation and rotation without requiring custom scripting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3ae4fdc47859", "source_question_ids": ["awssysops-p1-q039"], "statement": "A CloudWatch alarm on low CPUUtilization with the built-in EC2 stop alarm action stops idle or underutilized EC2 instances without custom scripting, and Trusted Advisor and Compute Optimizer identify such instances.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9965bc4710ed", "source_question_ids": ["awssysops-p1-q039"], "statement": "Auto Scaling combined with an Elastic Load Balancer natively handles adding newly scaled EC2 instances to the load balancer, without needing custom scripts.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-2a51081cd872", "source_question_ids": ["awssysops-p1-q039"], "statement": "Whether scripting daily EBS snapshot creation with monthly rotation is still the best 'needs a script' admin task is disputed, since AWS Data Lifecycle Manager may have removed the need for scripting that specific task after the question was originally written.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["at question authoring time (2012-era instance types)"], "confidence": "medium", "id": "cl-060d8095cd1a", "source_question_ids": ["awssysops-p1-q047"], "statement": "When this question was written, the hi1.4xlarge 'High I/O' instance type offered local SSD instance storage delivering up to roughly 120,000 random read IOPS at 4KB; it is now a retired previous-generation type, replaced by storage-optimized I-family instances such as i4i.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["at question authoring time"], "confidence": "medium", "id": "cl-b6bdd683c240", "source_question_ids": ["awssysops-p1-q047"], "statement": "At the time this question was written, EC2 instances relying on network-attached EBS (including Provisioned IOPS EBS) had throughput far below what instance-local SSD storage could deliver.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5fc9705643fe", "source_question_ids": ["awssysops-p1-q047"], "statement": "The cc2.8xlarge is compute-optimized, not I/O-optimized, so it is not the best fit for very high random read IOPS; the hi1.4xlarge with local SSD instance storage is.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-ea3f1bff7d59", "source_question_ids": ["awssysops-p1-q047"], "statement": "Using ephemeral instance storage for a database's data introduces a data-loss risk if the instance is stopped or terminated, even when that storage type wins on raw IOPS performance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b532f23648f", "source_question_ids": ["awssysops-p1-q048"], "statement": "Data on an EC2 instance's ephemeral/instance-store volumes is always lost when the instance stops, terminates, or the underlying disk fails.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-76604b7f37b0", "source_question_ids": ["awssysops-p1-q048"], "statement": "Whether the root volume is EBS-backed does not affect instance-store data, which is lost when the instance stops either way, so 'an EBS-backed root preserves ephemeral data' is wrong.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3fc9619416cd", "source_question_ids": ["awssysops-p1-q050"], "statement": "An EBS snapshot can be used to create a new EBS volume directly in a different Availability Zone than the original volume.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-407d4d064f78", "source_question_ids": ["awssysops-p1-q050"], "statement": "An EBS volume can only be attached to an EC2 instance that resides in the same Availability Zone as the volume.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ca52ca92bff9", "source_question_ids": ["awssysops-p1-q050"], "statement": "An instance can attach only EBS volumes in its own Availability Zone, so OS-level disk mirroring cannot mirror an EBS volume with a second volume in a different AZ.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d202501cd203", "source_question_ids": ["awssysops-p1-q050"], "statement": "Taking periodic native EBS snapshots and restoring from them is faster for both backup and restore than a custom pipeline such as third-party incremental backup to Glacier, or a manual compressed-archive multipart upload to S3.", "status": "supported"}, {"claim_type": "fact", "conditions": ["at question authoring time"], "confidence": "high", "id": "cl-c4930e48322c", "source_question_ids": ["awssysops-p1-q056"], "statement": "At the time this question was written, the AWS Free Tier included 750 hours per month of a micro EC2 instance.", "status": "supported"}, {"claim_type": "fact", "conditions": ["at question authoring time"], "confidence": "medium", "id": "cl-6b9124405cc4", "source_question_ids": ["awssysops-p1-q056"], "statement": "At the time this question was written, the AWS Free Tier included 750 hours per month of Elastic Load Balancer usage, though a commenter argues ELB is no longer free-tier-eligible under current AWS terms.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["at question authoring time"], "confidence": "high", "id": "cl-30875c43704b", "source_question_ids": ["awssysops-p1-q056"], "statement": "At the time this question was written, the AWS Free Tier included several GB of S3 storage.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-60cfc466348a", "source_question_ids": ["awssysops-p1-q056"], "statement": "Provisioned IOPS (PIOPS) EBS volumes were never included in the AWS Free Tier at any size, so they incur charges as soon as they are created.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-75ad36ae1f72", "source_question_ids": ["awssysops-p1-q070"], "statement": "An Auto Scaling launch configuration is only a template/blueprint; AWS never charges for the launch configuration object itself.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-68102fad0835", "source_question_ids": ["awssysops-p1-q070"], "statement": "Deleting or keeping an Auto Scaling launch configuration around after its instances are terminated has no effect on the AWS bill.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-56db4374f2f1", "source_question_ids": ["awssysops-p1-q070"], "statement": "Unattached or unused EBS volumes continue to be billed, so deleting them once no longer needed reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2a406dbcf00e", "source_question_ids": ["awssysops-p1-q070"], "statement": "Since February 2024 every public IPv4 address is billed hourly, including an Elastic IP attached to a running instance, so releasing an Elastic IP you no longer need reduces cost.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ea1886242af2", "source_question_ids": ["awssysops-p1-q070"], "statement": "An idle Elastic Load Balancer with no instances behind it is still billed, so deleting it reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-639a8a65c731", "source_question_ids": ["awssysops-p1-q083"], "statement": "EBS volume encryption uses AES-256, is transparent to the EC2 instance, and covers data at rest, the I/O in transit between the instance and the volume, and any snapshots taken of the volume.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-b695e24f868f", "source_question_ids": ["awssysops-p1-q083"], "statement": "MFA is an IAM authentication control and does not encrypt EBS volumes or any data, so 'AWS MFA with EBS' is not an encrypted-storage option.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1d84f1867b01", "source_question_ids": ["awssysops-p1-q083"], "statement": "'Multi-tier encryption with Redshift' is not a way to encrypt a database's storage; Redshift's own at-rest encryption protects only Redshift clusters, so EBS encryption is the answer for encrypted database block storage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-9cba0a9bc71b", "source_question_ids": ["awssysops-p1-q083"], "statement": "S3 server-side encryption protects objects stored in S3; it does not encrypt the EBS block storage under an EC2-hosted database.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-5676c74e67ca", "source_question_ids": ["awssysops-p1-q106"], "statement": "Most EC2 instances are billed per second with a 60-second minimum each time the instance enters the Running state; a reboot does not start a new billing period.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0396b1143ba5", "source_question_ids": ["awssysops-p1-q106"], "statement": "Rebooting a running EC2 instance never leaves the Running state, so a reboot adds no additional billed instance-hour.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-90f02929ff95", "source_question_ids": ["awssysops-p1-q106"], "statement": "Each time a stopped instance returns to Running, a new 60-second minimum charge applies under per-second billing; a full new billed hour applies only to hourly-billed instances (and applied to all instances before October 2017).", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6444791008fc", "source_question_ids": ["awssysops-p1-q106"], "statement": "A reboot keeps the instance in the Running state, so it is not a separate chargeable event and does not start a new billing period; counting it as one is wrong.", "status": "supported"}, {"claim_type": "fact", "conditions": ["default account limits"], "confidence": "medium", "id": "cl-e0411f64ced3", "source_question_ids": ["awssysops-p1-q110"], "statement": "EBS once had a default limit of 5,000 volumes per account; today EBS quotas cap total provisioned storage per volume type per Region (in TiB), not the number of volumes.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-e01350556fc7", "source_question_ids": ["awssysops-p1-q110"], "statement": "EBS storage quotas (TiB per volume type per Region) and IOPS quotas are adjustable through Service Quotas; there is no longer a volume-count quota to raise.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-aafa5e1fecae", "source_question_ids": ["awssysops-p1-q112"], "statement": "It is not possible to directly share an encrypted EBS volume, or its raw underlying data, with another AWS account.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-5f1cc7cc0539", "source_question_ids": ["awssysops-p1-q112"], "statement": "To share an encrypted EBS volume's data with another account, share a snapshot encrypted with a customer managed KMS key and grant that account use of the key; snapshots encrypted with the default aws/ebs key cannot be shared.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ff26d2465140", "source_question_ids": ["awssysops-p1-q112"], "statement": "Copying the data to an unencrypted volume does not enable sharing, because no EBS volume can be shared directly with another account (only snapshots and AMIs can), and decrypting the data defeats the purpose of encryption.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-bbd998dd8de2", "source_question_ids": ["awssysops-p1-q112"], "statement": "This question's boxed answer (copy to an unencrypted volume) conflicts with a unanimous community vote and cited AWS documentation favoring sharing an encrypted snapshot instead, so it is flagged as a strong candidate for manual correct_answer_override review.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b315390c5e0e", "source_question_ids": ["awssysops-p1-q133"], "statement": "EBS snapshots are asynchronous: the point-in-time snapshot is captured immediately, but the data transfer to S3 continues in the background afterward.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-135cd8555499", "source_question_ids": ["awssysops-p1-q133"], "statement": "An EBS snapshot in progress does not block the source volume from ongoing reads and writes.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-1f94416d3cdb", "source_question_ids": ["awssysops-p1-q133"], "statement": "Stopping the EC2 instance before taking an EBS snapshot is recommended in order to get fully consistent snapshot data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c01d3e34ed22", "source_ tion_ids": ["awssysops-p1-q249"], "statement": "Running `dd if=/dev/zero of=<device> bs=1M` on a raw block device does not create a filesystem, mount the device, or format the volume; it only writes zeros to every block, so those options are wrong.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-79b406a66560", "source_question_ids": ["awssysops-p1-q292", "awssysops-p1-q249"], "statement": "Reading every block of an EBS volume restored from a snapshot (e.g. dd or fio into /dev/null) initializes it; new empty EBS volumes deliver full performance immediately, so pre-warming a blank volume by writing /dev/zero is no longer needed.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-609271b6eec4", "source_question_ids": ["awssysops-p1-q260"], "statement": "The actual IOPS an application realizes from a Provisioned-IOPS EBS volume can be capped by the application not generating enough I/O demand.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-007d46e5de2b", "source_question_ids": ["awssysops-p1-q260"], "statement": "The actual IOPS an application realizes from a Provisioned-IOPS EBS volume can be capped by running on a non-EBS-optimized EC2 instance.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0afecde6a39f", "source_question_ids": ["awssysops-p1-q260"], "statement": "The actual IOPS an application realizes from a Provisioned-IOPS EBS volume can be capped by insufficient EC2-instance network bandwidth.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-dc312c2f6275", "source_question_ids": ["awssysops-p1-q260"], "statement": "An EBS volume being larger than needed does not reduce the IOPS an application realizes, although size does bound IOPS: io1/io2 provisioned IOPS are capped by an IOPS-to-GiB ratio and gp2 baseline dium", "id": "cl-affa0f02d771", "source_question_ids": ["awssysops-p2-q345"], "statement": "An EBS volume's persistence beyond instance termination does not require the volume to be detached from the instance first.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5387764317c1", "source_question_ids": ["awssysops-p2-q352"], "statement": "The DeleteOnTermination attribute is checked per attached EBS volume at instance-termination time to determine whether that volume is preserved or deleted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2d0f4a19f7d5", "source_question_ids": ["awssysops-p2-q352"], "statement": "InstanceInitiatedShutdownBehavior controls whether an OS-level shutdown command stops or terminates the instance; it does not control EBS volume deletion.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c1b73b1bf279", "source_question_ids": ["awssysops-p2-q352"], "statement": "DisableApiTermination is a termination-protection guard that prevents accidental instance termination via the API; it is unrelated to EBS volume deletion handling.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e3438bbb8c20", "source_question_ids": ["awssysops-p2-q358"], "statement": "Backups of an Amazon EBS volume are called snapshots, and a snapshot can later be used to create a new EBS volume.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-10672f37bc8e", "source_question_ids": ["awssysops-p2-q358"], "statement": "An 'image' (AMI) is a distinct EC2-level concept, not the term AWS uses for an EBS volume backup.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0aad584f5f21", "source_question_ids": ["awssysops-p2-q361"], "statement": "Amazon EBS stands for 'Elastic Block Store': persistent block storage for EC2 instances that is automatically replicated within its Availability Zone.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b0b3ecd3af3", "source_question_ids": ["awssysops-p2-q362"], "statement": "EBS is best described as persistent block storage, which distinguishes it from EC2's ephemeral (transient) instance store.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8767831df75c", "source_question_ids": ["awssysops-p2-q370"], "statement": "A new EBS volume created from a snapshot can be attached to any instance in the same Availability Zone; it must be at least as large as the snapshot, but no other size threshold (such as >2TB) applies.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-33fb190c6acb", "source_question_ids": ["awssysops-p2-q370"], "statement": "Requiring a volume larger than 2TB is wrong: no such threshold applies to attaching a volume created from a snapshot, and the only size floor is that the new volume must be at least as large as the snapshot.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-388213c0041a", "source_question_ids": ["awssysops-p2-q425"], "statement": "All current EBS volume types, including Provisioned IOPS (io1/io2), automatically send 1-minute metrics to Amazon CloudWatch while attached to an instance; no detailed monitoring has to be enabled.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4e5256db5a0b", "source_question_ids": ["awssysops-p2-q471"], "statement": "A snapshot taken from an already-encrypted EBS volume is automatically encrypted (using AES-256) as a consequence of the source volume's encryption, not as a separate option chosen at snapshot-creation time.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-adcbe36ca060", "source_question_ids": ["awssysops-p2-q471"], "statement": "A snapshot taken from an unencrypted EBS volume is not encrypted by default by AWS.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9e3f8f663a3d", "source_question_ids": ["awssysops-p2-q471"], "statement": "Enabling S3 server-side encryption does not encrypt an EBS snapshot.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-b407f577b545", "source_question_ids": ["awssysops-p2-q471"], "statement": "For the snapshot-encryption exam question, the boxed answer's literal phrasing ('encrypt the existing volume so the snapshot will be encrypted') is imprecise, since an already-existing unencrypted EBS volume's encryption state cannot actually be changed after the fact; several commenters note no listed choice perfectly describes the real procedure.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5a7cff3a4ae3", "source_question_ids": ["awssysops-p2-q545"], "statement": "gp2 baseline IOPS scale linearly at 3 IOPS per GiB (minimum 100) up to a maximum of 16,000 IOPS, reached at about 5,334 GiB; beyond that size a larger gp2 volume adds no IOPS.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-23633c35a025", "source_question_ids": ["awssysops-p2-q545"], "statement": "'Max I/O' is an Amazon EFS performance mode (now legacy), not a feature of gp2 or any EBS volume type, so it cannot be enabled on a gp2 volume.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-754284496ea6", "source_question_ids": ["awssysops-p2-q545"], "statement": "Striping I/O across multiple EBS volumes using RAID 0 increases the aggregate IOPS available to an EC2 instance.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-287695601fab", "source_question_ids": ["awssysops-p2-q545"], "statement": "Migrating to a Provisioned IOPS SSD (io1/io2) volume lets you provision IOPS independently of gp2's 3 IOPS/GiB baseline (up to 50 IOPS/GiB for io1, max 64,000 IOPS), exceeding gp2's 16,000 IOPS cap.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-f4163fbf8caf", "source_question_ids": ["awssysops-p2-q545"], "statement": "For the 'additional EBS IOPS' exam question, this dataset's boxed answer (resize gp2, enable Max I/O) is contradicted by unanimous community vote and documentation favoring RAID 0 striping and/or migrating to Provisioned IOPS instead.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-a52c8e591c6a", "source_question_ids": ["awssysops-p2-q548"], "statement": "Encryption at rest for EBS General Purpose SSD volumes can only be enabled at volume-creation time and cannot be turned on in place on an already-running volume.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f87645bb51c4", "source_question_ids": ["awssysops-p2-q548"], "statement": "Encryption at rest for RDS databases can only be enabled at DB-instance-creation time and cannot be turned on in place on an already-running instance.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-805ca19ff617", "source_question_ids": ["awssysops-p2-q548"], "statement": "Encryption at rest for Amazon EFS file systems can only be enabled at file-system-creation time and cannot be turned on in place on an already-existing file system.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-f3a11b53c926", "source_question_ids": ["awssysops-p2-q548"], "statement": "S3 encrypts all new objects with SSE-S3 by default (since January 2023), the bucket default can be changed to SSE-KMS in place without creating a new bucket, and existing objects can be re-encrypted in place without downtime using an S3 Batch Operations copy job.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-d5c0d736f964", "source_question_ids": ["awssysops-p2-q548"], "statement": "Among EBS, RDS, EFS, and S3, S3 is the exception where existing data can gain at-rest encryption without creating a new resource and without downtime; a source's boxed answer instead named EBS, which conflicts with this documented behavior and the source's own unanimous community vote favoring S3.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-e5a31ddabe11", "source_question_ids": ["awssysops-p2-q585"], "statement": "Increasing an EBS volume's storage capacity has no practical effect on usable storage until the volume's file system is separately extended (e.g., with growpart/resize2fs, or xfs_growfs for XFS).", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c1adcf3567d2", "source_question_ids": ["awssysops-p2-q585"], "statement": "Restarting the instance is not the documented step for using added EBS capacity; you must extend the partition and file system (cloud-init on some AMIs does this for the root volume at boot).", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3d43facfbfa2", "source_question_ids": ["awssysops-p2-q598"], "statement": "EBS snapshots are stored on S3 infrastructure owned and managed by AWS itself, not inside any bucket in the customer's own account, so a customer-configured S3 lifecycle policy cannot be attached to them.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-29db4fb4b51d", "source_question_ids": ["awssysops-p2-q598", "awssysops-p3-1-q888"], "statement": "A scheduled process (such as an AWS Lambda function triggered by CloudWatch Events/EventBridge, or Amazon Data Lifecycle Manager) that runs on a schedule to delete EBS snapshots older than a retention threshold is a valid pattern for enforcing an EBS snapshot data-retention policy.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-ee25dab09965", "source_question_ids": ["awssysops-p2-q598"], "statement": "For the EBS snapshot retention-policy exam question, this dataset's boxed answer (an S3 lifecycle policy) is contradicted by unanimous community vote, since EBS snapshots are not accessible within any customer-owned S3 bucket.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-050e70975e51", "source_question_ids": ["awssysops-p2-q599"], "statement": "Tag Editor, the GetResources API, and AWS Config rules in detective mode find untagged resources only after creation and do not block untagged launches; some Config rules (such as required-tags) can now also run in proactive mode before provisioning.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-cbf98df57a0a", "source_question_ids": ["awssysops-p2-q599"], "statement": "Proactive tagging controls act at creation time: CloudFormation and Service Catalog (TagOptions) apply tags as resources are provisioned, while IAM policy conditions (aws:RequestTag, aws:TagKeys) deny creation requests that lack the required tags.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["resources are provisioned through AWS Service Catalog products"], "confidence": "medium", "id": "cl-d6761c17cb10", "source_question_ids": ["awssysops-p2-q599"], "statement": "AWS Service Catalog's TagOptions Library can enforce a tagging taxonomy proactively when EC2 instances and EBS volumes are launched.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-0b0666c8c445", "source_question_ids": ["awssysops-p2-q599"], "statement": "For the real-time tagging-enforcement exam question, this dataset's boxed answer (manually searching for untagged resources with Tag Editor) is a reactive, manual process that no cited commenter endorses; the source's own embedded community vote splits only between two other proactive options and does not reach the 60% threshold, so the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1c11deaa2436", "source_question_ids": ["awssysops-p3-1-q665"], "statement": "The Elastic Volumes feature of EBS lets a volume's size be increased in place and live, without detaching the volume, taking a snapshot, or reconnecting the instance.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0619f83394d6", "source_question_ids": ["awssysops-p3-1-q665"], "statement": "Increasing EBS capacity via Elastic Volumes is less disruptive and requires less effort than snapshotting-and-restoring to a larger volume, scripting a manual data migration, or adding a second volume in a RAID 0 array.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3dcf5777f7f7", "source_question_ids": ["awssysops-p3-1-q665"], "statement": "Adding a second EBS volume in a RAID 0 configuration to gain capacity adds operational complexity and introduces an additional single point of failure, rather than simply growing the existing volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f11b3f493754", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Cold HDD (sc1) is AWS's lowest-cost-per-GB EBS volume type, purpose-built for large, sequential, infrequently-accessed ('cold') data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fa82bad12928", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Throughput Optimized HDD (st1) is tuned for frequently-accessed sequential big-data workloads (e.g., EMR, data warehouses) and offers a higher baseline throughput than Cold HDD (sc1).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b7e6f3cead47", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Throughput Optimized HDD (st1) costs more per GB than Cold HDD (sc1), making sc1 the more cost-effective choice for infrequently-accessed sequential data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e39286dd0da4", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Provisioned IOPS SSD and General Purpose SSD are priced for random-access, latency-sensitive workloads, making them more expensive than HDD-based EBS volume types for infrequent, sequential access patterns.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2527d8469949", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "A snapshot is not directly attachable to an instance or browsable for individual files; it must first be used to create a new EBS volume before any file can be recovered from it.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-871aab4c76d9", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "To restore a deleted file from an EBS snapshot, create a new volume from the snapshot, attach that volume to a running EC2 instance, and copy the file out of it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e2c383b2d322", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "There is no EC2 console feature that restores an individual file directly from a snapshot without first creating a volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8ba7aaa97daf", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Amazon Data Lifecycle Manager (DLM) is a purpose-built, fully managed policy engine for EBS snapshots that natively handles scheduled creation, a defined retention count/period, and automatic deletion of aged-out snapshots within a single policy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-bdab4209e81c", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "An EventBridge/CloudWatch Events scheduled rule can trigger EBS snapshot creation on a schedule, but on its own provides no built-in retention or deletion mechanism, requiring separate custom logic to enforce a retention window.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4b3c9adc44f2", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Copying data to Amazon S3 Glacier via a Lambda function is an archival pattern, not a snapshot-based backup, and does not match how EBS backups are normally retained.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-12e3d9c4451b", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "For the backup-retention exam question, this dataset's boxed answer (an EventBridge scheduled rule) is contradicted by unanimous community vote favoring Amazon Data Lifecycle Manager, since the EventBridge rule alone has no built-in retention/deletion mechanism.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0d5e4f274541", "source_question_ids": ["awssysops-p3-1-q892"], "statement": "An existing EBS volume cannot be encrypted in place; encrypting it requires snapshotting the volume, creating a new volume from that snapshot with encryption enabled, and swapping the new encrypted volume in
