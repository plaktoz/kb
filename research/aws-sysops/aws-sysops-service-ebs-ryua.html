 an sc1 volume changes it away from the volume type the workload needs rather than fixing performance consistency.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-80c0943506db", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "For the I/O-consistency exam question, this dataset's boxed answer (fast snapshot restore plus cold HDD) is contradicted by unanimous community vote favoring fast snapshot restore plus manual pre-warming instead, since cold HDD (sc1) is incompatible with the stem's Provisioned IOPS requirement.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3e7376b39a67", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon Data Lifecycle Manager (Amazon DLM) selects which EBS volumes to snapshot based on tags applied to those volumes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["policy targets volumes by tag, e.g. Production and Compliance tags"], "confidence": "high", "id": "cl-17f7cd2b9aaf", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Tagging the target EBS volumes is a prerequisite for an Amazon DLM snapshot lifecycle policy to target them.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e1a69db3b663", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon DLM requires an IAM role that grants it permission to create and manage snapshots on the users' behalf.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6277be53c755", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "The IAM role used by Amazon DLM must be separate from the IAM role(s)/permissions held by the users who own the EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-68455bad40a5", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum storage requirement of 5 GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2a4eddab46dc", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum baseline performance of 3 IOPS/GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7be424124afd", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Encryption of the EBS volumes is an optional volume property that is unrelated to whether Amazon DLM can manage the volume's snapshot lifecycle.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-ebs--m-1", "title": "EBS: a network-attached, AZ-locked persistent disk whose snapshots are region-wide, incremental S3 copies", "purpose": "Predict what you can and cannot do with an EBS volume (attach, move, encrypt, back up, speed up, pay for) by reasoning from where its data physically lives at each stage.", "mechanism": "An EBS volume is block storage reached over the network, replicated only inside one Availability Zone, and independent of any instance. Because it is remote and zonal, it keeps its data when the instance stops or terminates (unless DeleteOnTermination removes it), and it attaches only to instances in its own AZ. Instance store is the other EC2 block device: physically on the host, fast, and wiped on stop, terminate, or disk failure. A snapshot marks a point in time at once and then copies changed blocks (incrementally) into AWS-managed S3 in the background, so the volume stays readable and writable throughout. Because S3 is regional, a snapshot is how a volume leaves its AZ: you create a new volume from the snapshot in any AZ, at least as large as the source. A restored volume loads blocks lazily from S3, so the first read of each block is slow until it is initialized (read every block, or use fast snapshot restore). Encryption is fixed when a volume is created. Snapshots of encrypted volumes are encrypted, and the only way to encrypt existing data is snapshot, then copy or restore with encryption, then swap the volume. Performance depends on the volume type (gp2 at 3 IOPS/GiB, io1/io2 provisioned up to a ratio cap, st1/sc1 for sequential throughput) and on the instance path (EBS-optimized bandwidth).", "predict_prompt": "You need to move a running database's EBS volume to another AZ and encrypt it along the way. Which steps are required, and what happens to I/O latency on the new volume right after you attach it?", "invariants": ["A volume attaches only to an instance in its own AZ; detaching and reattaching never changes the AZ.", "A snapshot does not lock the volume: it stays attached and readable/writable while the snapshot finishes asynchronously.", "A snapshot captures only data already written when it starts; flush or pause writes (or stop the instance) to get a consistent copy.", "Instance store data is lost on stop or terminate, whatever the root device type.", "A volume's encryption state cannot be changed in place; snapshots inherit encryption from the source volume.", "Unattached volumes are still billed; launch configurations are free."], "limits": ["Older questions assume past limits: a 30:1 PIOPS ratio cap, mandatory pre-warming of blank volumes, no DLM before 2018, no encryption on micro instances. Today the ratios are 50:1 for io1 and 1,000:1 for io2, blank volumes run at full speed immediately, and DLM automates snapshot rotation.", "Several boxed answers in this slice conflict with community votes and AWS documentation (snapshot sharing, IAM for data at rest, S3 lifecycle for snapshots); check each one before trusting it."], "cues": ["'Move to another AZ' or 'mirror across AZs': think snapshot, then create a volume in the target AZ.", "'Data must survive stop/terminate': think EBS, not instance store.", "'Slow first reads after restore': the volume needs initialization or fast snapshot restore.", "'Encrypt an existing volume': snapshot, encrypted copy or restore, then swap.", "'Automate snapshot retention': think Data Lifecycle Manager with tag-targeted policies."], "claim_ids": ["cl-14ebdf09d120", "cl-407d4d064f78", "cl-17388d98de77", "cl-c243306cee99", "cl-5387764317c1", "cl-4053d59de53f", "cl-1b532f23648f", "cl-9ff7aca5524b", "cl-0aad584f5f21", "cl-7ca10a103c58", "cl-135cd8555499", "cl-b315390c5e0e", "cl-6410152c8397", "cl-1f94416d3cdb", "cl-c01d3e34ed22", "cl-a1d85789e691", "cl-e62ca15455de", "cl-569ab53f702a", "cl-3fc9619416cd", "cl-8767831df75c", "cl-2527d8469949", "cl-33bc92ee33a9", "cl-f86ea2d8c939", "cl-669c8a90a3d6", "cl-930f9e69c215", "cl-4e5256db5a0b", "cl-ab10a276a79b", "cl-0d5e4f274541", "cl-639a8a65c731", "cl-56db4374f2f1", "cl-75ad36ae1f72", "cl-70be56bdb992", "cl-6666a7665d67", "cl-dc312c2f6275", "cl-fca80a326165", "cl-8ba7aaa97daf", "cl-3e7376b39a67"]}, "contrastSet": {"id": "aws-sysops-service-ebs--cs-1", "subjects": ["EBS volume", "Instance store (ephemeral) volume"], "dimensions": ["Data survives instance stop/terminate", "Physical location", "Scope / mobility", "Raw random-I/O performance", "Backup mechanism"], "shared_traits": ["Both are the only two EC2 block-device types", "Both present as raw block devices that the guest OS formats and mounts"], "matrix": {"Data survives instance stop/terminate": {"EBS volume": "Yes; persists independently (unless DeleteOnTermination deletes it at termination)", "Instance store (ephemeral) volume": "No; lost on stop, terminate, or host disk failure"}, "Physical location": {"EBS volume": "Network-attached, replicated within one AZ", "Instance store (ephemeral) volume": "Disks physically on the host"}, "Scope / mobility": {"EBS volume": "Attaches to any instance in the same AZ; moves to other AZs via snapshot", "Instance store (ephemeral) volume": "Tied to the one host/instance; cannot be detached or moved"}, "Raw random-I/O performance": {"EBS volume": "Bounded by volume type, provisioned IOPS, and EBS-optimized bandwidth", "Instance store (ephemeral) volume": "Highest local IOPS (e.g. hi1/I-family local SSD)"}, "Backup mechanism": {"EBS volume": "Incremental snapshots to AWS-managed S3", "Instance store (ephemeral) volume": "No native snapshots; copy the data elsewhere yourself"}}, "decision_rule": "Ask whether the data must survive the instance stopping or terminating. If it must, choose EBS, using Provisioned IOPS and an EBS-optimized instance when it needs speed. If the data is disposable scratch or cache and raw local IOPS matter most, choose instance store.", "boundary_flip": "A database needing very high random-read IOPS is best on hi1.4xlarge local SSD instance store while losing the data on stop is acceptable (for example, it is replicated elsewhere). Once the requirement says data must persist across stop/terminate, the answer flips to an EBS-optimized instance with Provisioned IOPS EBS volumes.", "strongest_distractor_failure": "Choosing an EBS-backed root, or simply an 'SSD-backed instance', in the belief that it keeps ephemeral data or fixes disk wait. An EBS root does not protect instance-store data, which is lost on stop either way. Durable, fast storage comes from EBS-optimized plus Provisioned IOPS EBS.", "exceptions": ["An EBS root volume is deleted at termination by default (DeleteOnTermination), so EBS persistence through termination is not automatic for the root volume."], "claim_ids": ["cl-9ff7aca5524b", "cl-4053d59de53f", "cl-07f653f62e9e", "cl-1b532f23648f", "cl-76604b7f37b0", "cl-5b0b3ecd3af3", "cl-17388d98de77", "cl-c243306cee99", "cl-14ebdf09d120", "cl-e62ca15455de", "cl-060d8095cd1a", "cl-b6bdd683c240", "cl-ea3f1bff7d59", "cl-5fc9705643fe", "cl-70be56bdb992", "cl-d7bcc27f0212", "cl-391b931f4f8a", "cl-a1d85789e691"]}, "scenarioFamily": {"id": "aws-sysops-service-ebs--sf-1", "canonical": {"prompt": "Your production MySQL database runs on an EC2 instance in Availability Zone us-east-1a, backed by an unencrypted gp2 EBS volume. The team needs to (a) move the database onto a new EC2 instance in us-east-1b and (b) have the volume encrypted at rest once it lands there, with as little downtime as possible. What sequence of actions accomplishes both goals, and what should the team expect about I/O latency on the new volume right after it's attached and the database starts running?", "expected_answer": ["Take a snapshot of the source EBS volume; the volume stays attached, readable, and writable the whole time, so the instance keeps running (briefly pause writes or flush the filesystem first if full write-consistency matters).", "Because the source volume's own encryption state can't be changed in place, copy or restore that snapshot into a new volume with encryption enabled rather than trying to toggle encryption on the existing volume.", "Create the new encrypted volume from the snapshot directly in us-east-1b (snapshots live in S3, which is region-wide, so this works across AZs), then attach it to the new EC2 instance there, since a volume can only attach to an instance in its own AZ.", "Expect slower first-touch reads immediately after attaching: a volume restored from a snapshot lazily loads blocks from S3 in the background, so the first access to each block is slower until it's pulled down; initializing the volume (reading every block) or enabling fast snapshot restore avoids that sporadic latency."], "reasoning": "EBS is network-attached and AZ-locked, so crossing from us-east-1a to us-east-1b requires the snapshot-to-S3-to-new-volume path rather than any direct move. A snapshot never locks the source volume, so the database keeps serving traffic during the snapshot. Encryption is fixed at volume creation, so the only way to add it is to create the new (destination) volume from the snapshot with encryption turned on. Finally, because a snapshot-restored volume loads its data lazily from S3, the team should expect transient first-read latency unless they initialize the volume or use fast snapshot restore.", "distractor_analysis": "Wrong moves this scenario is designed to catch: assuming the snapshot blocks the running database (it doesn't - reads/writes continue); assuming you can flip an 'Encrypted' property on the existing volume in place (encryption state can't be changed after creation); assuming OS-level disk mirroring or any direct copy can land data on a volume outside its AZ (a volume only attaches within its own AZ); and assuming the new volume performs at full speed the instant it's attached (first-touch reads are slower until initialization or fast snapshot restore completes).", "claim_ids": ["cl-407d4d064f78", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-0d5e4f274541", "cl-4e5256db5a0b", "cl-33bc92ee33a9", "cl-f86ea2d8c939", "cl-7ca10a103c58", "cl-6410152c8397", "cl-135cd8555499"], "difficulty": "hard", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "Compliance drops the encryption requirement, and the new instance that will host the database is launched in the same Availability Zone (us-east-1a) as the current instance, not a different AZ.", "prompt": "Same production MySQL database on EC2 in us-east-1a, backed by a gp2 EBS volume. The new destination instance is also in us-east-1a, and compliance no longer requires encryption. What's the right way to move the volume to the new instance, and does the team still need the snapshot-and-new-volume pattern or any AZ workaround?", "expected_answer": ["No snapshot or new volume is needed: since the destination instance is in the same AZ as the volume, the team can simply detach the volume from the old instance and attach it directly to the new instance in us-east-1a.", "No encryption step is needed either, since that requirement was dropped, and the snapshot-to-new-volume migration pattern is reserved specifically for crossing an AZ boundary, which doesn't apply here."], "reasoning": "The snapshot-based migration path in the canonical scenario exists only to get the data across an AZ boundary. Once source and destination are in the same AZ, a volume can be detached and reattached directly (detaching and reattaching never changes which AZ a volume lives in, but it also never needs to, since no AZ boundary is being crossed here), so the whole snapshot/encrypt/recreate sequence collapses to a simple detach-and-reattach. This is the boundary flip: the same facts (AZ-locked attachment) that forced the multi-step snapshot path in the canonical scenario now justify skipping it entirely.", "claim_ids": ["cl-407d4d064f78", "cl-14ebdf09d120", "cl-d21e0d7768b7"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "irrelevant-detail", "changed_condition": "The database engine is PostgreSQL instead of MySQL, and the team is also tracking the migration's cost in a shared billing spreadsheet.", "prompt": "Same scenario: a production PostgreSQL database runs on an EC2 instance in us-east-1a backed by an unencrypted gp2 EBS volume, and the team is logging the migration's cost in a shared billing spreadsheet. They still need to move the database to a new EC2 instance in us-east-1b and have the volume encrypted at rest with minimal downtime. What sequence of actions accomplishes both goals, and what should they expect about I/O latency on the new volume right after it's attached?", "expected_answer": ["Take a snapshot of the source EBS volume; the volume stays attached, readable, and writable the whole time, so the instance keeps running (briefly pause writes or flush the filesystem first if full write-consistency matters).", "Because the source volume's own encryption state can't be changed in place, copy or restore that snapshot into a new volume with encryption enabled rather than trying to toggle encryption on the existing volume.", "Create the new encrypted volume from the snapshot directly in us-east-1b (snapshots live in S3, which is region-wide, so this works across AZs), then attach it to the new EC2 instance there, since a volume can only attach to an instance in its own AZ.", "Expect slower first-touch reads immediately after attaching: a volume restored from a snapshot lazily loads blocks from S3 in the background, so the first access to each block is slower until it's pulled down; initializing the volume (reading every block) or enabling fast snapshot restore avoids that sporadic latency."], "reasoning": "Neither the database engine running on top of the volume nor how the team tracks migration cost changes anything about EBS mechanics: AZ-locked attachment, snapshot behavior, fixed-at-creation encryption, and lazy-loading on restore all apply the same way regardless of what application or bookkeeping sits above the block device. The correct procedure and its reasoning are identical to the canonical scenario.", "claim_ids": ["cl-407d4d064f78", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-0d5e4f274541", "cl-33bc92ee33a9", "cl-f86ea2d8c939"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate proposes a specific shortcut instead of the snapshot path: flip the existing volume's 'Encrypted' property directly in the console, then set up OS-level disk mirroring to a second EBS volume pre-created in us-east-1b.", "prompt": "Same migration goal: a production database on EC2 in us-east-1a with an unencrypted gp2 volume needs to move to a new instance in us-east-1b with encryption at rest. A teammate proposes: 'Let's just flip the volume's Encrypted property to true in the console, then set up OS-level disk mirroring to a second EBS volume we pre-create in us-east-1b, so the database stays in sync as we cut over.' Will this proposal work? What should happen instead?", "expected_answer": ["No - there is no 'Encrypted' property that can be toggled on an existing volume; a volume's encryption state is fixed at creation and can't be changed in place.", "No - OS-level disk mirroring can't mirror the volume to a second volume in us-east-1b either, because an instance can only attach to EBS volumes in its own AZ, so the us-east-1a instance could never attach to a mirror target sitting in us-east-1b.", "Instead: take a snapshot of the source volume (it stays attached and usable throughout), restore/copy that snapshot into a new encrypted volume created directly in us-east-1b, attach it to the new instance there, and expect slower first-touch reads until the restored volume is initialized or fast snapshot restore is enabled."], "reasoning": "The proposal fails on two independent grounds that both trace back to the same mental model: encryption is immutable once a volume is created, so there is no in-place 'Encrypted' switch to flip; and EBS attachment is strictly AZ-scoped, so no mirroring technique - OS-level or otherwise - can keep a us-east-1a volume synced to a target volume in us-east-1b. The only way to get both encryption and a different AZ is the snapshot-based path from the canonical scenario.", "claim_ids": ["cl-0d5e4f274541", "cl-ca52ca92bff9", "cl-407d4d064f78", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-f86ea2d8c939", "cl-33bc92ee33a9"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The task shifts from migrating a whole database volume to recovering a single accidentally-deleted file from an existing snapshot of a still-running web server's volume, in the same AZ (no AZ move, no encryption change).", "prompt": "A web server's log directory lives on an EBS volume in us-east-1a. Last week's automated snapshot captured a log file that was later accidentally deleted from the live volume. The on-call engineer wants to recover just that one file, and asks whether they can browse or mount the snapshot directly to grab it. What steps actually let them get the file back?", "expected_answer": ["No - a snapshot cannot be attached to an instance or browsed for individual files directly; it must first be used to create a new EBS volume before any file can be recovered from it.", "Create a new volume from last week's snapshot (this can be done in us-east-1a or, since the snapshot lives in region-wide S3, any other AZ in the region), attach that new volume to a running EC2 instance, and copy the needed log file out of it.", "There is no EC2 console feature that restores an individual file directly from a snapshot without first creating a volume, so this create-volume-then-attach-then-copy sequence is required regardless of how small the recovery is."], "reasoning": "This applies the same underlying fact used in the canonical scenario - that a snapshot is inert S3 data, not something you can attach or browse - to a different surface problem: single-file recovery instead of a full-volume AZ migration. Because the snapshot lives in S3 rather than on any one volume, the same create-a-new-volume-from-the-snapshot step is required whether the goal is recovering one file or migrating an entire database.", "claim_ids": ["cl-2527d8469949", "cl-871aab4c76d9", "cl-e2c383b2d322", "cl-e62ca15455de"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "Snapshot encryption: q159's recorded community vote (100%, though resting on one unsupported comment) favors 'select encryption when creating the snapshot'. Its boxed answer and q471 say a snapshot of an encrypted volume is encrypted automatically, not through an option chosen when the snapshot is created. The mental model invariant 'snapshots inherit encryption from the source volume' takes one side of this dispute, which is still unresolved and needs manual review.", "related_entity_ids": ["cl-a094965a3163", "cl-2e2fe001578e", "cl-4e5256db5a0b", "aws-sysops-service-ebs--m-1"]}, {"type": "ambiguity", "severity": "medium", "description": "q471's boxed answer ('encrypt the existing volume so the snapshot will be encrypted') implies an existing volume can be encrypted in place. That contradicts the slice's rule that an existing EBS volume cannot be encrypted in place (q892, q548), and commenters note that no listed choice describes the real procedure.", "related_entity_ids": ["cl-b407f577b545", "cl-0d5e4f274541", "cl-a52c8e591c6a"]}, {"type": "contradiction", "severity": "medium", "description": "q548 (which of EBS, RDS, EFS, S3 can gain at-rest encryption in place): the boxed answer names EBS, but the unanimous community vote and documented behavior favor S3. The EBS 'creation-time only' rule claim is marked conflicted as a result. This is unresolved and is not mentioned in the mental model's limits.", "related_entity_ids": ["cl-d5c0d736f964", "cl-a52c8e591c6a", "cl-f3a11b53c926", "cl-0d5e4f274541"]}, {"type": "contradiction", "severity": "medium", "description": "q112 (sharing encrypted EBS data across accounts): the boxed answer (copy the data to an unencrypted volume) conflicts with a unanimous community vote and AWS docs favoring sharing a snapshot encrypted with a customer managed key. This is unresolved and needs a correct_answer_override review.", "related_entity_ids": ["cl-bbd998dd8de2", "cl-5f1cc7cc0539", "cl-ff26d2465140", "cl-aafa5e1fecae"]}, {"type": "contradiction", "severity": "medium", "description": "q307 (securing EBS data at rest): the boxed answer (an IAM access-control policy) conflicts with the unanimous community vote for encrypting the volume. The supporting claim's example (layering an encrypted file system) also skips native EBS encryption, which the slice documents elsewhere (q083).", "related_entity_ids": ["cl-35bc25b6b3ec", "cl-dacfc17c13bc", "cl-43b139d00c7b", "cl-639a8a65c731"]}, {"type": "contradiction", "severity": "medium", "description": "q598 (EBS snapshot retention policy): the boxed answer (an S3 lifecycle policy) is contradicted by the unanimous community vote, because snapshots do not live in any customer-owned bucket. This is unresolved.", "related_entity_ids": ["cl-ee25dab09965", "cl-3d43facfbfa2", "cl-29db4fb4b51d"]}, {"type": "contradiction", "severity": "medium", "description": "q888 (backup retention): the boxed answer (an EventBridge scheduled rule) is contradicted by the unanimous community vote for Data Lifecycle Manager. The mental model cue 'Automate snapshot retention: think DLM' follows the community side of a dispute that has not been resolved in the source.", "related_entity_ids": ["cl-12e3d9c4451b", "cl-bdab4209e81c", "cl-8ba7aaa97daf", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "q913 (I/O consistency after restore): the boxed answer (fast snapshot restore plus Cold HDD) is contradicted by the unanimous community vote (fast snapshot restore plus manual pre-warming). The claim that manual pre-warming gives the same effect as FSR is itself marked conflicted.", "related_entity_ids": ["cl-80c0943506db", "cl-76d26e905213", "cl-f14038746d42", "cl-f86ea2d8c939"]}, {"type": "contradiction", "severity": "medium", "description": "q545 (getting more EBS IOPS): the boxed answer (resize gp2 and enable 'Max I/O') is contradicted by the unanimous community vote for RAID 0 striping and/or Provisioned IOPS. 'Max I/O' is an EFS mode, not an EBS one. This is unresolved.", "related_entity_ids": ["cl-f4163fbf8caf", "cl-23633c35a025", "cl-754284496ea6", "cl-287695601fab", "cl-5a7cff3a4ae3"]}, {"type": "ambiguity", "severity": "low", "description": "RAID 0 is the recommended answer for more IOPS in q545 but a distractor for adding capacity in q665 (extra complexity, an added single point of failure). Neither claim states the condition (IOPS vs capacity goal), so read in isolation they look contradictory.", "related_entity_ids": ["cl-754284496ea6", "cl-3dcf5777f7f7", "cl-0619f83394d6"]}, {"type": "contradiction", "severity": "medium", "description": "q599 (real-time tagging enforcement): the boxed answer (manually search with Tag Editor) has no endorsement. The embedded community vote splits between two proactive options below the 60% threshold, so the question is disputed with no settled correct answer.", "related_entity_ids": ["cl-0b0666c8c445", "cl-050e70975e51", "cl-cbf98df57a0a", "cl-d6761c17cb10"]}, {"type": "contradiction", "severity": "medium", "description": "q585 (using added EBS capacity): the claims that the file system must be extended, and that a restart is not the documented step, are both marked conflicted. That means the source's answer or votes disagree with documentation on whether a restart suffices.", "related_entity_ids": ["cl-e5a31ddabe11", "cl-c1adcf3567d2"]}, {"type": "contradiction", "severity": "low", "description": "q292: the distractor claim that 'initiating the device to mount' is wrong is marked conflicted, which suggests the source's answer or votes disagree about this description of the dd read-to-/dev/null initialization command.", "related_entity_ids": ["cl-457ee29fd4ca", "cl-669c8a90a3d6"]}, {"type": "stale-risk", "severity": "medium", "description": "Pre-warming questions (q249, q298, q300) describe the old idea that blank volumes must be pre-warmed or lose IOPS on first access. Current docs say empty volumes run at full performance immediately. Answers keyed to the original passages may now be wrong. The mental model notes this in its limits, but the question answers themselves are unresolved.", "related_entity_ids": ["cl-632cd8acbfe6", "cl-79b406a66560", "cl-ef04f867bc02", "cl-87fbd07f4759", "cl-d531a323b903", "cl-e9f3249080be"]}, {"type": "stale-risk", "severity": "medium", "description": "The contrast set's boundary_flip and performance row name hi1.4xlarge, a retired instance type, as the current best choice for high random-read IOPS. They rely on the authoring-era claim that EBS throughput was far below local SSD (cl-b6bdd683c240) without saying it is dated, even though cl-060d8095cd1a is marked conflicted.", "related_entity_ids": ["aws-sysops-service-ebs--cs-1", "cl-060d8095cd1a", "cl-b6bdd683c240", "cl-5fc9705643fe"]}, {"type": "stale-risk", "severity": "low", "description": "PIOPS ratio and size limits changed over time: 30:1 then 50:1 for io1, 1,000:1 for io2. In q262 the boxed answer and the community vote agree on the outcome but give different reasons (ratio vs minimums), and the minimum-requirements claim is conflicted. q267's 4,000-IOPS/134 GB answer is also authoring-era only.", "related_entity_ids": ["cl-3a15c924eb67", "cl-c7f32f177152", "cl-49ef21d8516a", "cl-5c8fb05ebbaf", "cl-fca80a326165", "cl-3d535e681972"]}, {"type": "stale-risk", "severity": "medium", "description": "q165: EBS encryption on micro/free-tier instances was unsupported when the question was written but is supported now, and the recorded community vote has also changed. The question needs a correct_answer_override review. The 'Encrypt this volume' checkbox claim is low-confidence and needs review.", "related_entity_ids": ["cl-ce8c121f1bad", "cl-32755082527e", "cl-d0dae1dda71e", "cl-7116c9161ec1"]}, {"type": "stale-risk", "severity": "low", "description": "Billing and quota questions rely on terms that have changed. q106 assumed hourly billing (per-second billing since 2017). q070 assumed an attached Elastic IP was free (all public IPv4 is billed since Feb 2024). q056's ELB free-tier eligibility is contested. q110's 5,000-volume default limit has been replaced by TiB-based quotas.", "related_entity_ids": ["cl-5676c74e67ca", "cl-90f02929ff95", "cl-2a406dbcf00e", "cl-6b9124405cc4", "cl-e0411f64ced3", "cl-e01350556fc7"]}, {"type": "stale-risk", "severity": "low", "description": "q039 (which admin task still needs a script): DLM (2018) may have removed the need to script EBS snapshot rotation, and the alternative about stopping idle instances is also conflicted. The keyed answer is disputed.", "related_entity_ids": ["cl-2a51081cd872", "cl-3ae4fdc47859", "cl-f5149488c779", "cl-e36c863e72e9"]}, {"type": "stale-risk", "severity": "low", "description": "q425 and q328: the claims that all current volume types send 1-minute CloudWatch metrics automatically, and the gp2-vs-gp3 baseline behavior, are marked conflicted. These questions likely assumed older behavior (for example, only PIOPS volumes reporting 1-minute metrics, and no gp3).", "related_entity_ids": ["cl-388213c0041a", "cl-4737296d535b"]}, {"type": "quality", "severity": "low", "description": "Two near-duplicate q161 claims about TreatMissingData (default 'missing' leads to INSUFFICIENT_DATA) state essentially the same rule but have different statuses: one conflicted, one supported. The conflicted one gives no reason.", "related_entity_ids": ["cl-96f43aa48e5f", "cl-7fb8af26da91"]}, {"type": "ambiguity", "severity": "low", "description": "cl-17388d98de77 says without qualification that by default an EBS volume outlives the instance. cl-c243306cee99 says DeleteOnTermination is set by default, so the volume is deleted. The root-volume scope appears only in cl-c243306cee99's conditions, not in either statement. The contrast set's exception handles this, but the claims read as contradictory on their own.", "related_entity_ids": ["cl-17388d98de77", "cl-c243306cee99", "aws-sysops-service-ebs--cs-1"]}, {"type": "unsupported-generation", "severity": "low", "description": "Several contrast set cells have no backing claim. 'Instance store cannot be detached or moved', 'No native snapshots; copy the data elsewhere yourself', and the shared trait that both volumes present as raw block devices the guest OS formats and mounts are not stated by any cited claim.", "related_entity_ids": ["aws-sysops-service-ebs--cs-1"]}], "sourceQuestionCount": 51}], "sources": {"kind": "locked", "file": "aws-sysops-service-ebs-ryua.sources.enc.js"}}</script>
