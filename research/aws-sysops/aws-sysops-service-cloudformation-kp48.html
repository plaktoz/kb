<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

g an entirely new CloudFormation stack based on manually-observed infrastructure changes and then deleting the old stack is a needlessly destructive way to reconcile a template with actual changes, since it risks deleting live resources.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f5105c1f5991", "source_question_ids": ["awssysops-p3-1-q829"], "statement": "Manually modifying a CloudFormation template's parameters to match observed infrastructure changes depends on already knowing exactly what changed and does not systematically ensure all manual changes are captured.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-7b2bec47ccc7", "source_question_ids": ["awssysops-p3-1-q829"], "statement": "For the question about capturing manual infrastructure changes into a CloudFormation template, the source's boxed correct answer is updating the stack via a change set, but the discussion shows an exact 50/50 community vote split against using drift detection instead, with strong technical reasoning that drift detection is the actual discovery mechanism; the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["application AMI is a fully-baked, custom AMI that only exists in the source region"], "confidence": "high", "id": "cl-c8c4c783f9d1", "source_question_ids": ["awssysops-p3-1-q843"], "statement": "To provision an application that uses fully-baked AMIs into additional AWS regions, the AMI must first be copied into each target region (e.g., via aws ec2 copy-image), and the CloudFormation template's mapping section must be updated with the resulting per-region AMI IDs before the template can deploy successfully in those regions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7deca60a763b", "source_question_ids": ["awssysops-p3-1-q843"], "statement": "Creating a significantly more manual configuration of Chef or Puppet recipes across each region compared to CloudFormation StackSets.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-70d284d26030", "source_question_ids": ["awssysops-p3-1-q846"], "statement": "Amazon S3 cross-Region replication only replicates bucket objects between regions; it has no role in deploying EC2 instances, RDS databases, or load balancer resources.", "status": "supported"}, {"claim_type": "rule", "conditions": ["template defines an AutoScalingReplacingUpdate policy on the Auto Scaling group resource"], "confidence": "high", "id": "cl-9b80ec8afb44", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "A CloudFormation AutoScalingReplacingUpdate policy replaces an Auto Scaling group's instances with an entirely new group during a stack update, and can immediately roll the stack back without failure if the new version has problems, all while keeping the same load balancer and without requiring any DNS change.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-be297650d674", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Auto Scaling group lifecycle hooks let new instances complete custom actions before entering service, but they provide no documented rollback mechanism of their own if the new application version has problems.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-08c1df183e09", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Manually creating a new AMI and launch configuration and updating the Auto Scaling group to use it has no built-in rollback mechanism if the new version has problems.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cd831e1c7e00", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "Deploying a second CloudFormation stack with a new Application Load Balancer and cutting over to it requires a DNS change to redirect traffic to the new load balancer, which violates a requirement to avoid DNS changes during deployment.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-661e5631875f", "source_question_ids": ["awssysops-p3-1-q897"], "statement": "For the question about deploying a new application release without DNS changes and with rollback support, the source's boxed correct answer is using Auto Scaling lifecycle hooks, but community vote is unanimous for using an AutoScalingReplacingUpdate policy instead, since lifecycle hooks have no documented rollback mechanism; the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-f69c65a01288", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "By default, when a CloudFormation stack is deleted, all resources belonging to that stack are also deleted.", "status": "supported"}, {"claim_type": "exception", "conditions": ["resource's DeletionPolicy attribute is explicitly set to Retain"], "confidence": "high", "id": "cl-1333a54f0660", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "Setting a resource's DeletionPolicy attribute to Retain in the CloudFormation template is an exception to the default stack-deletion behavior: it causes CloudFormation to preserve that specific resource (e.g., an RDS instance) when the stack itself is deleted, letting it keep running independently of the stack's lifecycle.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a46daeb826f8", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "Removing a resource from a CloudFormation template and updating the stack orphans that resource from CloudFormation management entirely, rather than making it survive future stack deletions while remaining managed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2a536c0220a6", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "CloudFormation stack termination protection only prevents the stack itself from being deleted at all; it does not allow the stack to be deleted while selectively retaining specific resources.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7b114b250739", "source_question_ids": ["awssysops-p3-1-q906"], "statement": "An RDS instance's own deletion-protection parameter prevents that instance from being deleted directly via the RDS API, but has no effect on what happens to the instance when its owning CloudFormation stack is deleted.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-cloudformation--m-1", "title": "A CloudFormation stack is an all-or-nothing lifecycle unit with explicit override knobs", "purpose": "Predict what CloudFormation does to a group of resources on create, update, failure, and delete, and which template feature or stack setting changes that default, so you can pick the native mechanism over scripts, manual steps, or made-up features.", "mechanism": "A declarative template (only Resources is mandatory; Parameters, Mappings, Conditions, and Outputs are optional) describes resources. Creating a stack from it provisions them in dependency order as one unit, and the unit is atomic. By default, if any resource fails to create, CloudFormation rolls back the whole stack and deletes what it already built, without asking you. Deleting the stack deletes every resource in it. A resource counts as done when its API call returns, unless a CreationPolicy or WaitCondition makes CloudFormation wait for a cfn-signal (DependsOn only sets order). Every exam scenario changes one of these defaults with a knob scoped to one lifecycle event. DeletionPolicy Retain/Snapshot covers stack deletion for one resource. Termination protection covers stack deletion for the whole stack. A stack policy blocks updates to listed resources. OnFailure=DO_NOTHING keeps resources after a create failure. Update policies (rolling or replacing) control how Auto Scaling instances are swapped during an update. Change sets preview a planned update, and drift detection finds out-of-band edits. Reuse goes through Parameters, Mappings (for example, per-Region AMI IDs), and Export/ImportValue within one account and Region. StackSets reach across accounts and Regions.", "predict_prompt": "A stack creates an EC2 instance and an RDS database. The RDS resource has DeletionPolicy: Retain and the stack has termination protection on. Someone tries to delete the stack, and later a new stack's creation fails halfway. What happens to the resources each time, and which setting caused it?", "invariants": ["Default create failure means a full automatic rollback that deletes already-created resources, with no manual prompt.", "Default stack deletion deletes every resource in the stack unless that resource's DeletionPolicy says Retain or Snapshot.", "Each protection knob covers exactly one lifecycle event: DeletionPolicy for deleting a resource with its stack, termination protection for stack deletion, a stack policy for updates, OnFailure for create failure.", "A ROLLBACK_COMPLETE stack can only be deleted and recreated. An UPDATE_ROLLBACK_FAILED stack is recovered by fixing the blocking resource and then running Continue Update Rollback.", "AMI IDs are region-scoped, so a template that hardcodes one breaks in other Regions. Use a Region-keyed Mapping, and copy the AMI to each Region first."], "limits": ["Some service-limit numbers in the sources (20 stacks, 60 parameters/outputs, 4096-character fields) predate AWS quota updates and may be stale.", "Several source questions have boxed answers that conflict with community votes (for example Termination Protection vs OnFailure=DO_NOTHING, Init vs WaitCondition, change set vs drift detection). This model follows the documented behavior."], "cues": ["'Keep the database after the stack is deleted' points to DeletionPolicy Retain or Snapshot.", "'Keep the failed resources around to debug' points to OnFailure=DO_NOTHING, not termination protection.", "'Prevent accidental updates to specific resources' points to a stack policy.", "'Wait until the instance finishes configuring' points to CreationPolicy or WaitCondition with cfn-signal, not DependsOn.", "'Preview the update' points to a change set. 'Find manual changes' points to drift detection.", "'Many accounts or Regions in one operation' points to StackSets."], "claim_ids": ["cl-57682734954d", "cl-37be66ef0a5a", "cl-816b482b9c7c", "cl-912d00277cc3", "cl-752ba27253ea", "cl-f69c65a01288", "cl-1333a54f0660", "cl-1f61228b9df4", "cl-0fae4f96d5f7", "cl-023893050ab9", "cl-4070339fccbc", "cl-c388d14db82a", "cl-20b0265c76e4", "cl-73d68fe0310e", "cl-9b80ec8afb44", "cl-c5070940e52b", "cl-791a1c44261a", "cl-29c7e2394e01", "cl-98b564957b6c", "cl-c8c4c783f9d1", "cl-87a7c0626d0c", "cl-8fda3117e86c", "cl-27b399297fdb", "cl-530906805a00", "cl-7d8bc0a1e4f4", "cl-e7d4c066c704", "cl-374b7b83dd0f", "cl-fe4222ed84da"]}, "contrastSet": {"id": "aws-sysops-service-cloudformation--cs-1", "subjects": ["DeletionPolicy (Retain/Snapshot)", "Stack termination protection", "Stack policy", "OnFailure=DO_NOTHING"], "dimensions": ["Lifecycle event it intercepts", "Scope", "Effect on resources", "Where it is set"], "shared_traits": ["All are native CloudFormation controls that override a default stack lifecycle behavior.", "None of them needs a custom script, Lambda function, or manual step."], "matrix": {"Lifecycle event it intercepts": {"DeletionPolicy (Retain/Snapshot)": "Stack deletion", "Stack termination protection": "Stack deletion request", "Stack policy": "Stack update", "OnFailure=DO_NOTHING": "Stack creation failure"}, "Scope": {"DeletionPolicy (Retain/Snapshot)": "One resource", "Stack termination protection": "Whole stack", "Stack policy": "Listed resources in the stack", "OnFailure=DO_NOTHING": "Whole stack"}, "Effect on resources": {"DeletionPolicy (Retain/Snapshot)": "Stack is deleted; the resource is kept or snapshotted", "Stack termination protection": "Deletion is refused outright; nothing is removed", "Stack policy": "Updates to protected resources are denied; others proceed", "OnFailure=DO_NOTHING": "No automatic rollback; resources stay for inspection"}, "Where it is set": {"DeletionPolicy (Retain/Snapshot)": "Resource attribute in the template", "Stack termination protection": "Stack setting", "Stack policy": "Policy document attached to the stack", "OnFailure=DO_NOTHING": "CreateStack API parameter"}}, "decision_rule": "Pick by the one lifecycle event the scenario must intercept. Deleting the stack while keeping a resource or its data: DeletionPolicy. Refusing deletion of the stack entirely: termination protection. Blocking updates to specific resources: stack policy. Keeping resources after a failed create: OnFailure=DO_NOTHING.", "boundary_flip": "Take 'keep the RDS database when the stack is deleted' (DeletionPolicy Retain/Snapshot). Change it to 'the stack must not be deletable at all' and the answer becomes termination protection. Change it to 'stack creation failed and the engineer must inspect the half-built resources' and the answer becomes OnFailure=DO_NOTHING, because termination protection does not stop the automatic rollback.", "strongest_distractor_failure": "Termination protection sounds like 'keep my resources', but it only blocks an explicit stack-deletion request. It cannot delete the stack while keeping one resource, and it has no effect on the automatic rollback after a failed create or update.", "exceptions": ["An RDS instance's own deletion-protection flag blocks direct RDS API deletes but does not control what happens when its CloudFormation stack is deleted.", "Removing a resource from the template and updating the stack orphans it from CloudFormation management; that is not the same as DeletionPolicy Retain.", "Reactive Config or CloudWatch Events plus Lambda guards only notice a bad change after the update has started, so the stack policy is the preventive choice."], "claim_ids": ["cl-1333a54f0660", "cl-1f61228b9df4", "cl-406ca2c0b5c0", "cl-f69c65a01288", "cl-2a536c0220a6", "cl-58e62088a6fa", "cl-20b0265c76e4", "cl-912d00277cc3", "cl-c388d14db82a", "cl-e7e3dcab1525", "cl-84d280d47cab", "cl-7b114b250739", "cl-a46daeb826f8", "cl-5c0b2ca56d81", "cl-ef2c5715734b"]}, "scenarioFamily": {"id": "aws-sysops-service-cloudformation--sf-1", "canonical": {"prompt": "A CloudFormation stack provisions two resources: an EC2 web server and an RDS database that serves it. The team wants to decommission the EC2 instance and the stack as a whole, but keep the RDS database (with a final snapshot) running independently of the stack afterward, with no separate backup template or manual script. What should the template specify on the RDS resource, and what happens to the EC2 instance and the RDS database when the stack is deleted?", "expected_answer": ["Set the RDS resource's DeletionPolicy attribute to Snapshot (or Retain) in the template.", "On stack deletion, the EC2 instance is deleted along with the rest of the stack's default-managed resources.", "The RDS database is not deleted: CloudFormation takes a final snapshot and leaves the database instance running independently of the stack, with no manual script or separate backup template needed."], "reasoning": "By default, deleting a CloudFormation stack deletes every resource it owns (cl-f69c65a01288). DeletionPolicy is the resource-scoped override for exactly that lifecycle event: setting it to Snapshot on an RDS resource makes CloudFormation automatically snapshot the DB instance as part of stack deletion (cl-1f61228b9df4), and this (like Retain generally) requires no manual script, Lambda invocation, or separate backup template (cl-406ca2c0b5c0, cl-1333a54f0660). The EC2 instance has no DeletionPolicy override, so it falls back to the default and is deleted with the rest of the stack (cl-f69c65a01288).", "claim_ids": ["cl-f69c65a01288", "cl-1f61228b9df4", "cl-406ca2c0b5c0", "cl-1333a54f0660"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The requirement changes from 'keep the RDS database and its data after deletion' to 'the stack itself must never be deletable at all, by anyone, under any circumstance' -- there is no longer any requirement to specifically preserve the RDS data if the stack is removed some other way.", "prompt": "Same stack (EC2 instance plus RDS database). Now the requirement is that nobody should be able to delete this stack at all, by accident or otherwise -- there is no longer a specific requirement to preserve the RDS database's data. What should be configured, and does it change what DeletionPolicy would have done?", "expected_answer": ["Enable stack termination protection on the whole stack.", "This blocks any explicit delete-stack request outright; no resources are removed because the stack cannot be deleted while protection is enabled.", "This is a different mechanism from DeletionPolicy: DeletionPolicy only decides what happens to one resource once a stack deletion is already proceeding, whereas termination protection prevents the deletion from proceeding at all."], "reasoning": "Termination protection is the lifecycle knob scoped to the whole stack's deletion request rather than to one resource's fate during an already-permitted deletion: it prevents the stack itself from being deleted at all (cl-2a536c0220a6). This differs from DeletionPolicy, which only governs what happens to a specific resource during a deletion that is already occurring (cl-f69c65a01288, cl-1333a54f0660) -- so the changed condition (protecting the whole stack vs. one resource's data) flips the correct control from DeletionPolicy to termination protection.", "distractor_analysis": "DeletionPolicy Retain/Snapshot would still let the stack be deleted and would only protect the RDS resource specifically -- it does not stop the EC2 instance or the stack record itself from being removed, so it does not satisfy a 'never deletable' requirement.", "claim_ids": ["cl-2a536c0220a6", "cl-f69c65a01288", "cl-1333a54f0660"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The EC2 instance is moved to a different Availability Zone within the same Region, and the RDS instance is additionally tagged with a cost-center label used for billing reports.", "prompt": "Same requirement as the canonical scenario (keep the RDS database with a final snapshot when the stack is deleted, no manual script), except the EC2 instance now runs in a different Availability Zone than before, and the RDS instance also carries a cost-center tag used for billing reports. Does either change what should be set on the RDS resource, or what happens on stack deletion?", "expected_answer": ["Set the RDS resource's DeletionPolicy attribute to Snapshot (or Retain) in the template.", "On stack deletion, the EC2 instance is deleted along with the rest of the stack's default-managed resources.", "The RDS database is not deleted: CloudFormation takes a final snapshot and leaves the database instance running independently of the stack, with no manual script or separate backup template needed."], "reasoning": "Availability Zone placement and a billing tag are unrelated to the stack-deletion lifecycle event that DeletionPolicy governs. The default behavior -- deleting all resources on stack deletion (cl-f69c65a01288) unless a resource's DeletionPolicy overrides it (cl-1f61228b9df4, cl-1333a54f0660) -- is unaffected by where the EC2 instance runs or what tags are attached, so the answer is identical to the canonical scenario.", "claim_ids": ["cl-f69c65a01288", "cl-1f61228b9df4", "cl-1333a54f0660"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "Before touching the CloudFormation template, someone already enabled the RDS instance's own deletion-protection flag directly via the RDS console/API, and argues that this alone will keep the database when the CloudFormation stack is deleted.", "prompt": "Same stack and requirement as canonical. An engineer points out that the RDS instance already has its own deletion-protection flag turned on via the RDS API, and claims that's enough to guarantee the database survives when the CloudFormation stack is deleted -- so no template change is needed. Is the engineer correct? What should actually be set, and why?", "expected_answer": ["The engineer is incorrect: RDS's own deletion-protection flag only blocks direct deletion of that instance through the RDS API; it has no effect on what CloudFormation does to the instance when its owning stack is deleted.", "Set the RDS resource's DeletionPolicy attribute to Snapshot (or Retain) in the template.", "On stack deletion, the EC2 instance is still deleted with the rest of the stack, and the RDS database is preserved (snapshotted or retained) only because of the template-level DeletionPolicy, not the RDS API flag."], "reasoning": "RDS's native deletion-protection parameter is a separate control that only prevents direct RDS API deletes; it has no effect on what happens to the instance when its owning CloudFormation stack is deleted (cl-7b114b250739). The lifecycle control that actually governs stack-deletion behavior for a resource is DeletionPolicy (cl-1f61228b9df4, cl-f69c65a01288), which is template-level and distinct from the RDS flag.", "distractor_analysis": "The RDS deletion-protection flag is a tempting but wrong answer because it sounds like it addresses 'protect the database from deletion' -- but it only covers direct RDS-API deletes, not deletion cascaded from the owning stack, which is the actual mechanism at play here.", "claim_ids": ["cl-7b114b250739", "cl-1f61228b9df4", "cl-f69c65a01288"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The resource that must survive stack deletion is now an S3 bucket holding critical audit logs instead of an RDS database, and the required policy is Retain rather than Snapshot.", "prompt": "A different CloudFormation stack provisions an EC2 instance and an S3 bucket holding critical audit logs. The team wants to delete the stack but keep the S3 bucket (and its logs) intact afterward, with no manual script or separate template. What should be set on the S3 bucket resource, and what happens to each resource when the stack is deleted?", "expected_answer": ["Set the S3 bucket resource's DeletionPolicy attribute to Retain in the template.", "On stack deletion, the EC2 instance is deleted along with the rest of the stack's default-managed resources.", "The S3 bucket is not deleted: CloudFormation leaves it (and its logs) in place, running independently of the stack, with no manual script or separate backup template needed."], "reasoning": "The same DeletionPolicy mechanism that protects one resource from the default stack-deletion sweep (cl-f69c65a01288) applies regardless of resource type: it is a per-resource template attribute, demonstrated for RDS with Retain/Snapshot (cl-1333a54f0660, cl-1f61228b9df4), that preserves that specific resource when the stack is deleted. Applied to an S3 bucket, Retain keeps the bucket and its contents in place while the rest of the stack, including the EC2 instance, is still removed by default.", "claim_ids": ["cl-f69c65a01288", "cl-1333a54f0660", "cl-1f61228b9df4"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "The synthesis settles disputed source questions instead of flagging them. The mental model's limits say several boxed answers conflict with community votes and that 'this model follows the documented behavior'. Its cues ('OnFailure=DO_NOTHING, not termination protection'; 'Find manual changes points to drift detection'; 'CreationPolicy or WaitCondition'), its Export/ImportValue reuse path, and the whole contrast set (OnFailure=DO_NOTHING column, strongest_distractor_failure, boundary_flip) are all built on claims whose own source questions disagree with them (status conflicted, or in dispute against the boxed answer). Those claims are presented to the learner as settled rules.", "related_entity_ids": ["aws-sysops-service-cloudformation--m-1", "aws-sysops-service-cloudformation--cs-1", "cl-20b0265c76e4", "cl-58e62088a6fa", "cl-0fae4f96d5f7", "cl-87a7c0626d0c", "cl-791a1c44261a", "cl-1f61228b9df4"]}, {"type": "contradiction", "severity": "high", "description": "awssysops-p3-1-q829: the boxed answer is 'update the stack via a change set', and the community vote is an exact 50/50 split against drift detection (cl-7b2bec47ccc7, conflicted). Even so, cl-791a1c44261a (drift detection is the right mechanism) is marked supported with high confidence, and cl-93e0d485b67f (change set as distractor) is marked supported. The dispute is resolved by reasoning on a split vote and is not flagged. The mental model cue 'Find manual changes points to drift detection' passes it on as settled.", "related_entity_ids": ["cl-791a1c44261a", "cl-93e0d485b67f", "cl-7b2bec47ccc7", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "awssysops-p3-1-q739: the boxed answer is AWS::CloudFormation::Init, with an 80/20 community vote for WaitCondition (cl-21fc08625bef, conflicted). The claims from the same question that contradict the boxed answer (WaitCondition is the signaling resource; Init does not signal; DependsOn has no wait; CustomResource is not purpose-built) are all marked supported instead of conflicted. The mental model then cites cl-023893050ab9 as settled.", "related_entity_ids": ["cl-023893050ab9", "cl-e90d54abebd2", "cl-4070339fccbc", "cl-d27c102d40ea", "cl-21fc08625bef", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "awssysops-p3-1-q777: the boxed answers are 'AMI not available' plus 'template lacked the proper permissions', and the community vote is for 'AMI not available' plus 'requested services do not exist in eu-west-1' (cl-4bb5cc6a1fb1, conflicted). The claims that take the community side (cl-58b666e2fd52 on missing services, and cl-d748ec473663 and cl-bf37ad7712ac rejecting permissions) are nonetheless marked supported with no conflict condition.", "related_entity_ids": ["cl-58b666e2fd52", "cl-d748ec473663", "cl-bf37ad7712ac", "cl-4bb5cc6a1fb1"]}, {"type": "contradiction", "severity": "medium", "description": "awssysops-p3-1-q843: the boxed answer is 'run the existing template unmodified in the new regions', which the community disputes (cl-f2235069c235, conflicted). Yet cl-c8c4c783f9d1 (copy the AMI and update the mapping) is marked supported with high confidence, and cl-98b564957b6c cites q843 as support. The mental model invariant 'copy the AMI to each Region first' relies on this disputed resolution.", "related_entity_ids": ["cl-c8c4c783f9d1", "cl-98b564957b6c", "cl-f2235069c235", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "awssysops-p3-1-q897: the boxed answer is Auto Scaling lifecycle hooks, and the community vote favours AutoScalingReplacingUpdate (cl-661e5631875f, conflicted). cl-9b80ec8afb44 (ReplacingUpdate) and cl-be297650d674 (lifecycle hooks have no rollback) contradict the boxed answer but are marked supported with high confidence. The mental model cites cl-9b80ec8afb44 as settled.", "related_entity_ids": ["cl-9b80ec8afb44", "cl-be297650d674", "cl-661e5631875f", "aws-sysops-service-cloudformation--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "awssysops-p2-q537: cl-4b492e4ed0fd records that the boxed answer recommends a separate backup template rather than DeletionPolicy Snapshot (conflicted). cl-1f61228b9df4 (high confidence) and cl-406ca2c0b5c0, from the same question, assert the Snapshot approach as supported with no conflict condition. The mental model and contrast set treat it as settled.", "related_entity_ids": ["cl-1f61228b9df4", "cl-406ca2c0b5c0", "cl-4b492e4ed0fd", "aws-sysops-service-cloudformation--m-1", "aws-sysops-service-cloudformation--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "Several more source questions have a boxed answer that conflicts with the community vote, and these remain unresolved: q338 (Service Catalog vs direct template-editing access), q547 (internet/NAT access vs IAM PassRole as the cause of the wait-condition timeout), q593 (VPC limit vs 'template needs updating'), q615 (CreationPolicy vs Conditions), and q616 (Export/ImportValue vs a bucket per template). The paired distractor claims assert the boxed answers are wrong, e.g. cl-380c63dbc203 calls PassRole 'unrelated' and cl-078a61473505 calls the boxed option 'not a real failure mode'. Learners should not treat these as settled.", "related_entity_ids": ["cl-f0207a806e25", "cl-cf570c7a26de", "cl-d7cd2957fbb8", "cl-380c63dbc203", "cl-66948dfc1be7", "cl-078a61473505", "cl-0fae4f96d5f7", "cl-0bfcf68c37ca", "cl-87a7c0626d0c", "cl-c7aff9e675ba"]}, {"type": "unsupported-generation", "severity": "high", "description": "cl-a46daeb826f8 says removing a resource from the template and updating the stack 'orphans that resource from CloudFormation management'. That is wrong. By default CloudFormation deletes a resource that has been removed from the template. It is kept only if its DeletionPolicy is Retain. The contrast set repeats the error in its exceptions ('orphans it from CloudFormation management').", "related_entity_ids": ["cl-a46daeb826f8", "aws-sysops-service-cloudformation--cs-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-7b114b250739 says an RDS instance's own deletion-protection flag 'has no effect on what happens to the instance when its owning CloudFormation stack is deleted'. In practice, an RDS instance with DeletionProtection enabled makes CloudFormation's delete of that resource fail, so the stack deletion ends in DELETE_FAILED. The flag does have an effect: it blocks deletion rather than keeping the resource cleanly. The contrast set repeats the claim in its exceptions.", "related_entity_ids": ["cl-7b114b250739", "aws-sysops-service-cloudformation--cs-1"]}, {"type": "quality", "severity": "medium", "description": "The mental model invariant 'Default stack deletion deletes every resource in the stack unless that resource's DeletionPolicy says Retain or Snapshot' implies that Snapshot keeps the resource. It does not. With Snapshot, CloudFormation takes a final snapshot and then deletes the resource. Only Retain keeps the resource itself (see cl-1f61228b9df4 compared with cl-1333a54f0660).", "related_entity_ids": ["aws-sysops-service-cloudformation--m-1", "cl-1f61228b9df4", "cl-1333a54f0660"]}, {"type": "ambiguity", "severity": "low", "description": "The mental model invariant 'Each protection knob covers exactly one lifecycle event', together with the contrast-set row that ties DeletionPolicy only to 'Stack deletion', overstates the separation. DeletionPolicy also applies when a resource is removed from the template during a stack update. The model does not mention UpdateReplacePolicy, which governs replacement during updates. No claim supports the word 'exactly'.", "related_entity_ids": ["aws-sysops-service-cloudformation--m-1", "aws-sysops-service-cloudformation--cs-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-dc0488507180 says customers cannot alias AMIs by name across regions, that 'only AWS controls AMI sharing and aliasing', and that CloudFormation resolves AMIs only by ID. These are unsupported and inaccurate. Customers can share their own AMIs. CloudFormation templates can resolve AMI IDs by name through SSM Parameter Store parameter types or dynamic references, including customer-created parameters.", "related_entity_ids": ["cl-dc0488507180"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-bf37ad7712ac says a genuine IAM permissions failure 'typically fails immediately at the very first resource' rather than partway through. This generalization is not supported. If the deploying principal lacks permission for only one resource type, creation can fail partway, after other resources have been created.", "related_entity_ids": ["cl-bf37ad7712ac"]}, {"type": "stale-risk", "severity": "medium", "description": "cl-fe4222ed84da ('limited to 20 CloudFormation stacks') is marked supported with high confidence, but this default quota has long since been raised (to 2000 stacks per Region). Only the synthesis limits note mentions the staleness. The mental model also lists the claim in claim_ids. cl-3e384c0fbf1a's uniform 4096-character figure for template, parameter, output, and resource descriptions also doesn't match current per-field limits (for example, the template description is limited to 1024 bytes).", "related_entity_ids": ["cl-fe4222ed84da", "cl-3e384c0fbf1a", "cl-86babc45d6fd", "aws-sysops-service-cloudformation--m-1"]}, {"type": "ambiguity", "severity": "low", "description": "The Elastic Beanstalk claims pull against each other. cl-5a9ca0f18354 says Beanstalk 'does not natively provision or manage RDS databases ... or standalone load balancers'. cl-352ac93517a8 (needs-review; awssysops-p1-q072 split between Beanstalk and CloudFormation) says Beanstalk can provision a full LAMP environment including an ELB, and Beanstalk can also attach an RDS instance to an environment. The q072 split also leaves cl-816b482b9c7c's CloudFormation answer only partly settled.", "related_entity_ids": ["cl-5a9ca0f18354", "cl-352ac93517a8", "cl-cf9630a349e9", "cl-816b482b9c7c"]}], "sourceQuestionCount": 39}], "sources": {"kind": "locked", "file": "aws-sysops-service-cloudformation-kp48.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        ${raw(citationsHtml(cs.claim_ids))}
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
        <div class="item-meta">${raw(metaBadges.join(''))}</div>
        ${raw(changedCondition)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence <span class="muted">(optional)</span></legend>
          <div class="segmented">${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"><span>${c}</span></label>`; }).join(''))}</div>
        </fieldset>
        <div class="actions"><button id="reveal-practice-btn" type="button">Reveal answer</button></div>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
