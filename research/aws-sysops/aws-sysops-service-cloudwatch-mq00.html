ric over time and cannot itself trigger a notification.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-08c44a883f15", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "EC2 instances automatically publish CPU Utilization to CloudWatch by default, with no monitoring agent installed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d99a1860646a", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "EC2 publishes disk read metrics to CloudWatch without an agent: DiskReadOps covers instance store volumes, and on Nitro-based instances EBS reads are reported as EBSReadOps (AWS/EC2) and VolumeReadOps (AWS/EBS).", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b382e090959", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "EC2 instances automatically publish Network Packets In to CloudWatch by default, with no monitoring agent installed.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-1187c51aeb05", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "Memory Utilization is never a default EC2 CloudWatch metric; it requires installing the CloudWatch agent to collect.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2132ecde32d5", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "Network Packets Dropped is not part of EC2's default agentless CloudWatch metric set.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8a1a6dd76114", "source_question_ids": ["awssysops-p3-1-q864"], "statement": "CPU Ready Time is a virtualization-hypervisor-level metric that EC2's default monitoring does not expose at all.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ded34df1f1c1", "source_question_ids": ["awssysops-p3-1-q873"], "statement": "The CloudWatch agent's procstat plugin collects per-process CPU and memory metrics, including the process ID (PID), automatically and continuously.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c7ed6451fe05", "source_question_ids": ["awssysops-p3-1-q873"], "statement": "The default CloudWatch CPU utilization metric is instance-level only and has no per-process or PID breakdown.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-16253f9b4f1b", "source_question_ids": ["awssysops-p3-1-q873"], "statement": "Manually logging into an EC2 instance nightly to run the top command is labor-intensive and unreliable for catching CPU spikes that last only a few minutes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2ab96af8c9a1", "source_question_ids": ["awssysops-p3-1-q911"], "statement": "AWS has deprecated the original EC2 CloudWatch monitoring scripts and recommends using the CloudWatch agent instead for collecting custom OS-level metrics such as memory utilization.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-4012f4a41bb7", "source_question_ids": ["awssysops-p3-1-q911"], "statement": "EC2 does not publish memory utilization as a built-in metric regardless of instance family, including memory-optimized instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2ff15cf9093e", "source_question_ids": ["awssysops-p3-1-q911"], "statement": "A custom Lambda function scheduled via EventBridge to capture EC2 memory utilization requires building and maintaining a bespoke solution that the CloudWatch agent already provides natively.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-f1253ac04da0", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "CloudWatch detailed monitoring delivers EC2 instance metrics (such as CPU and network utilization) at 1-minute intervals.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ca9aa8808bd9", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "CloudWatch basic monitoring publishes most EC2 instance metrics, such as CPUUtilization and NetworkIn/Out, at 5-minute intervals; only status check metrics are published every minute.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1af583583860", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "AWS CloudTrail with a QuickSight dashboard records API call activity, not resource utilization metrics like CPU or network usage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b6ed827544f8", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "The AWS Health Dashboard (formerly the Personal Health Dashboard) surfaces AWS service-health and account-specific events, not per-instance performance metrics.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-d9fac6d164be", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "This question's labeled correct answer (basic monitoring) conflicts with the unanimous community vote and AWS documentation, both of which favor detailed monitoring for a stated 1-minute interval requirement.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-9c3eb028c430", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "An EC2 instance profile can only be associated with an IAM role, never directly with an IAM user.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-4b6dfe03ddd5", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "To let the CloudWatch Logs agent on an EC2 instance deliver logs, create an IAM role with the needed CloudWatch Logs permissions, wrap it in an instance profile, and associate that instance profile with the EC2 instance.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-32359e49c3dd", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "Security group or network ACL rules allowing inbound traffic on port 80 affect inbound web traffic to an instance, not the CloudWatch Logs agent's own outbound API calls to the CloudWatch Logs service.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-cloudwatch--m-1", "title": "CloudWatch is a publish-then-evaluate pipeline: a metric exists only if something can see it and publishes it", "purpose": "Lets you answer most CloudWatch questions by tracing one data point through four stages: who publishes it, how it is identified, how often and when it lands, and what an alarm on it can do.", "mechanism": "1) Publisher and vantage point. AWS services publish their own metrics from outside the workload. For EC2 that means the hypervisor, which can see CPU, network, instance-store disk I/O and status checks, but not anything inside the guest OS. Memory, free disk space and per-process data only exist once something inside the OS publishes them: the unified CloudWatch agent (the old monitoring scripts are deprecated), or your own put-metric-data calls for any non-AWS value. 2) Identity. A metric is the tuple namespace + metric name + dimensions. Data from any number of sources sharing that tuple merges into one metric and is aggregated (Sum/Min/Max/SampleCount/Average). Change any dimension and you get a separate metric. Region of origin is not tracked. You can publish raw values or a pre-aggregated statistic set, which is how high-frequency data is sent. 3) Time and resolution. Every data point is stamped in UTC and accepted from up to two weeks in the past to two hours in the future. Basic monitoring publishes every 5 minutes. Detailed monitoring publishes the same hypervisor metrics every 1 minute. Custom metrics are standard (1-minute) or high resolution (1-second). An alarm period shorter than the publish interval mostly sees empty periods. 4) Evaluation and action. An alarm watches one metric (or a math expression), never a dashboard. It is always in one of three states: OK, ALARM or INSUFFICIENT_DATA. With the default missing-data treatment, a metric that stops reporting puts the alarm in INSUFFICIENT_DATA. Alarm actions can publish to SNS (email, SMS, HTTP endpoints, including on-premises ones), run an Auto Scaling group's policy, or stop, terminate, reboot or recover an EC2 instance. A launch configuration or launch template is only a blueprint and can never be an alarm target.", "predict_prompt": "An Auto Scaling group must scale out on memory pressure. Someone enables detailed monitoring on the instances. Before reading on, predict whether a memory-based scaling policy now works, and what is missing if it does not.", "invariants": ["If the hypervisor cannot see a value (memory, free disk space, per-process CPU), it is never a default EC2 metric at any monitoring level. Something inside the guest must publish it.", "Same namespace + name + dimensions means one aggregated metric. Different dimensions mean a different metric. Nothing is overwritten or rejected.", "An alarm is always in exactly one of OK, ALARM or INSUFFICIENT_DATA.", "Alarm actions target an SNS topic, an Auto Scaling group policy or an EC2 instance action, never a launch configuration or template."], "limits": ["Default EC2 disk metrics (DiskReadBytes and so on) cover instance-store volumes only. An EBS-only instance reports 0 there, and EBS I/O appears under EBS metrics.", "Several 'detailed monitoring is free and 1-minute' service lists (SNS, Route 53, EMR, Auto Scaling) changed over time, so answers depend on which era the question was written in.", "Behaviour when data is missing depends on TreatMissingData. Questions that assume a gap still settles to OK or ALARM are disputed."], "cues": ["'memory', 'free disk space', 'per-process' or 'PID': think CloudWatch agent publishing a custom metric, not detailed monitoring.", "'every minute' or 'within 2 minutes' for CPU/network: think detailed monitoring (1-minute) instead of basic (5-minute).", "'instance unavailable' or 'metric stopped reporting': think INSUFFICIENT_DATA.", "'test the alarm's notification': think set-alarm-state. 'pause actions without deleting': think disable-alarm-actions.", "'temperature', 'non-AWS value' or 'thousands of points per second': think put-metric-data with a namespace, ideally a statistic set."], "claim_ids": ["cl-5bc987e7159b", "cl-911fc23dc4c8", "cl-d8ac5ffc766a", "cl-13bf2a547876", "cl-1187c51aeb05", "cl-ded34df1f1c1", "cl-c7ed6451fe05", "cl-f71aec823fae", "cl-ab3acc83cf5e", "cl-376ca6076994", "cl-adbee9d584b4", "cl-93d7cb02a747", "cl-92a0f3172668", "cl-516326837455", "cl-3a5b5821984c", "cl-91812d8191cb", "cl-a0e7267da34e", "cl-d242e069a1e1", "cl-b97b78a6f529", "cl-6f68066ee5fa", "cl-121feb0a38a8", "cl-f974f4009c60", "cl-7fb8af26da91", "cl-91709d8d0c5e", "cl-209b80979e10", "cl-519525b65bcf", "cl-f07f1b1c5929", "cl-9871fd8b11de", "cl-b9de0f2dd9eb", "cl-6b027616c185", "cl-8075cf682ebf", "cl-9aa30c8aedba", "cl-da0e066a6a3e", "cl-0e30a2d6d69e", "cl-bf744509cd39", "cl-80f8008f2d10"]}, "contrastSet": {"id": "aws-sysops-service-cloudwatch--cs-1", "subjects": ["CloudWatch agent (in-guest custom metrics)", "EC2 detailed monitoring", "EC2 basic monitoring (default)"], "dimensions": ["Where the data is collected", "Metrics provided", "Publish frequency", "Cost and setup", "Fixes 'no memory or free-disk metric'?"], "shared_traits": ["All three publish into CloudWatch metrics, so the same alarms, SNS notifications, dashboards and Auto Scaling policies can use any of them.", "None of them audit API calls. That is CloudTrail."], "matrix": {"Where the data is collected": {"CloudWatch agent (in-guest custom metrics)": "Inside the guest OS (EC2 or on-premises)", "EC2 detailed monitoring": "Hypervisor, outside the guest", "EC2 basic monitoring (default)": "Hypervisor, outside the guest"}, "Metrics provided": {"CloudWatch agent (in-guest custom metrics)": "Memory, disk space, per-process (procstat), log files", "EC2 detailed monitoring": "Same hypervisor set: CPU, network, instance-store disk I/O", "EC2 basic monitoring (default)": "CPU, network, instance-store disk I/O, status checks"}, "Publish frequency": {"CloudWatch agent (in-guest custom metrics)": "Configurable (metrics_collection_interval, default 60s)", "EC2 detailed monitoring": "1 minute", "EC2 basic monitoring (default)": "5 minutes (status checks 1 minute)"}, "Cost and setup": {"CloudWatch agent (in-guest custom metrics)": "Install agent and an IAM role; custom-metric charges", "EC2 detailed monitoring": "Toggle per instance or launch template; extra charge", "EC2 basic monitoring (default)": "Automatic, free"}, "Fixes 'no memory or free-disk metric'?": {"CloudWatch agent (in-guest custom metrics)": "Yes", "EC2 detailed monitoring": "No, only faster data", "EC2 basic monitoring (default)": "No"}}, "decision_rule": "Ask where the value is visible. If only the guest OS can see it (memory, free disk space, per-process CPU), the answer is the CloudWatch agent publishing a custom metric. If the hypervisor can see it, it is already a default metric, and the only remaining question is frequency: basic (5 minutes) or detailed (1 minute).", "boundary_flip": "Take 'alarm when CPU stays above 80% for 2 minutes'. The correct answer is detailed monitoring, because CPU is hypervisor-visible and only the 5-minute interval is too coarse. Change the metric to 'memory utilization above 80% for 2 minutes' and the answer flips to installing the CloudWatch agent. Detailed monitoring adds no in-guest metrics.", "strongest_distractor_failure": "Choosing 'enable detailed monitoring' to get memory or disk-space metrics. Detailed monitoring only speeds up the existing hypervisor metrics from 5 minutes to 1 minute. It collects nothing from inside the guest, so the memory metric still does not exist and a memory-based scaling policy still has nothing to react to.", "exceptions": ["Default EC2 disk I/O metrics (DiskReadBytes and so on) cover only instance-store volumes. An EBS-only instance shows 0 there even under detailed monitoring, while EBS I/O appears under EBS metrics.", "One source question's labelled answer picks basic monitoring for a stated 1-minute requirement. Community votes and AWS documentation both favour detailed monitoring."], "claim_ids": ["cl-911fc23dc4c8", "cl-d8ac5ffc766a", "cl-ef3ced18f947", "cl-2cc0c25f4d11", "cl-dcf0fba3cc52", "cl-da3e68cfb49b", "cl-ded34df1f1c1", "cl-3755fffcec2d", "cl-211de737c9b2", "cl-1187c51aeb05", "cl-5bc987e7159b", "cl-d242e069a1e1", "cl-b97b78a6f529", "cl-87f813c79491", "cl-3514e3e33dcb", "cl-ca9aa8808bd9", "cl-80f8008f2d10", "cl-0e30a2d6d69e", "cl-bf744509cd39", "cl-d9fac6d164be", "cl-b25d87214eec", "cl-2ab96af8c9a1"]}, "scenarioFamily": {"id": "aws-sysops-service-cloudwatch--sf-1", "canonical": {"prompt": "An EC2 fleet behind an Auto Scaling group currently uses only basic (default) CloudWatch monitoring. Ops wants a CloudWatch alarm that fires as soon as CPU utilization has stayed above 80% for a sustained 2-minute window. What change is needed to make this alarm possible, and how should the alarm itself be configured?", "expected_answer": ["Enable detailed monitoring on the instances (via the launch template), which raises the hypervisor-level metric publish frequency from 5 minutes to 1 minute.", "Build the alarm on the CPUUtilization metric with a 1-minute period and 2 consecutive evaluation periods above the 80% threshold.", "Basic monitoring's fixed 5-minute publish frequency is too coarse to ever observe a 2-minute sustained condition, so detailed monitoring is required."], "reasoning": "CPU utilization is a hypervisor-visible metric already collected under basic monitoring, but basic monitoring only publishes every 5 minutes (cl-d242e069a1e1), which cannot resolve a 2-minute sustained condition (cl-87f813c79491). Enabling detailed monitoring raises the publish frequency to 1 minute (cl-b97b78a6f529), which is fine-grained enough to build a 2-evaluation-period, 1-minute-period alarm (cl-3514e3e33dcb). An alarm period shorter than the metric's actual publish interval would mostly see empty data points (cl-121feb0a38a8), which is why basic monitoring itself can't simply be given a shorter alarm period.", "distractor_analysis": "A tempting but wrong fix is to leave basic monitoring in place and just set the alarm's period to 60 or 120 seconds. CloudWatch's API will accept that period, but since the metric itself only gets a new data point every 5 minutes, most of those 1-minute periods contain no data at all, so the alarm cannot reliably detect 2 minutes of sustained high CPU.", "claim_ids": ["cl-d242e069a1e1", "cl-87f813c79491", "cl-b97b78a6f529", "cl-3514e3e33dcb", "cl-121feb0a38a8"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The metric to monitor changes from CPU utilization (hypervisor-visible) to memory utilization, with the same 2-minute sustained-threshold requirement.", "prompt": "Same fleet, same requirement style, but now ops wants an alarm that fires as soon as memory utilization has stayed above 80% for a sustained 2-minute window. Does enabling detailed monitoring, as before, solve this?", "expected_answer": ["No. Detailed monitoring only speeds up the hypervisor's existing metrics (like CPU) from 5 minutes to 1 minute; it does not create a memory metric, because the hypervisor cannot see guest-OS memory usage.", "Memory utilization must instead be published from inside the guest OS as a custom metric, typically via the CloudWatch agent.", "Once the agent publishes a MemoryUtilization custom metric (commonly at 1-minute resolution), the same alarm pattern (1-minute period, 2 evaluation periods) can be used against that custom metric."], "reasoning": "This flips the boundary identified in the mental model: whether a value is hypervisor-visible (cl-5bc987e7159b, default EC2 metrics) determines whether detailed monitoring helps at all. Memory is explicitly called out as not hypervisor-visible (cl-911fc23dc4c8), so the fix for CPU (detailed monitoring) does nothing for memory; the only path is an in-guest publisher.", "distractor_analysis": "Reapplying the canonical fix -- 'just enable detailed monitoring' -- is the strongest distractor here, because it worked for CPU in the canonical scenario. It fails for memory specifically because detailed monitoring only changes publish frequency of metrics the hypervisor already collects; it adds no new metrics.", "claim_ids": ["cl-911fc23dc4c8", "cl-5bc987e7159b"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "An extra fact is added about the fleet's storage configuration (EBS-only, no instance-store volumes attached, so DiskReadBytes/DiskWriteBytes report 0) that has no bearing on the CPU-alarm requirement.", "prompt": "Same fleet and same 2-minute sustained-CPU-above-80% alarm requirement as the canonical scenario. You also notice the instances are EBS-backed with no instance-store volumes attached, so their DiskReadBytes and DiskWriteBytes metrics report 0. Does this storage detail change what you need to do to satisfy the CPU alarm requirement?", "expected_answer": ["Enable detailed monitoring on the instances (via the launch template), which raises the hypervisor-level metric publish frequency from 5 minutes to 1 minute.", "Build the alarm on the CPUUtilization metric with a 1-minute period and 2 consecutive evaluation periods above the 80% threshold.", "The storage detail is unrelated: disk I/O metrics reporting 0 on an EBS-only instance is expected and has nothing to do with CPU monitoring frequency."], "reasoning": "The disk metric behavior (cl-bf744509cd39) is a separate, independent fact about CloudWatch's default EC2 metrics -- it only concerns the DiskReadBytes/DiskWriteBytes family, not CPUUtilization or alarm evaluation. The underlying fix for the CPU alarm is unchanged from the canonical scenario (cl-d242e069a1e1, cl-87f813c79491, cl-b97b78a6f529, cl-3514e3e33dcb).", "distractor_analysis": "A learner might assume the storage detail is a hint that something about monitoring setup is broken or that detailed monitoring behaves differently for EBS-only fleets. It doesn't: DiskReadBytes being 0 is simply how EBS-only instances always report that specific metric family, independent of the CPU alarm's own monitoring interval.", "claim_ids": ["cl-d242e069a1e1", "cl-87f813c79491", "cl-b97b78a6f529", "cl-3514e3e33dcb", "cl-bf744509cd39"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A specific wrong fix is proposed in the question itself (keep basic monitoring, just shorten the alarm's period to 60 seconds) and the learner must evaluate whether it works, instead of designing the fix from scratch.", "prompt": "A teammate proposes a shortcut for the same 2-minute sustained-CPU-above-80% requirement: 'Let's skip enabling detailed monitoring -- just leave basic monitoring on and set the CloudWatch alarm's period to 60 seconds with 2 evaluation periods. CloudWatch lets you set any period you want.' Will this work?", "expected_answer": ["No. CloudWatch will accept a 60-second period, but basic monitoring still only publishes a new CPUUtilization data point every 5 minutes.", "Most of those 60-second periods will contain no data point at all, so the alarm cannot reliably observe 2 consecutive minutes of sustained high CPU.", "Detailed monitoring (1-minute publish frequency) is still required; only after enabling it does a 1-minute-period, 2-evaluation-period alarm actually see enough data to work."], "reasoning": "This directly exercises the limit noted alongside the canonical fix: an alarm period shorter than the metric's actual publish interval mostly sees empty periods (cl-121feb0a38a8). The teammate's claim that 'CloudWatch lets you set any period you want' is true but irrelevant -- accepting the configuration is not the same as the alarm having data to evaluate, since the publish frequency (cl-d242e069a1e1) is unchanged by the alarm's period setting.", "distractor_analysis": "The proposal is attractive because it looks like a free simplification (skip a monitoring-level change, just adjust the alarm). It fails because alarm period and metric publish frequency are independent knobs: shortening the former cannot manufacture data points that the latter never publishes.", "claim_ids": ["cl-121feb0a38a8", "cl-d242e069a1e1", "cl-87f813c79491", "cl-b97b78a6f529"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The context moves entirely off EC2 hypervisor-based monitoring to an on-premises server, which has no detailed-monitoring toggle at all, while keeping the same underlying 'something must publish it' principle applied to memory.", "prompt": "Instead of an EC2 fleet, the team now needs to monitor memory utilization on an on-premises data-center server and alert via the same CloudWatch alarm pattern used for AWS resources. There is no EC2 hypervisor and no 'detailed monitoring' toggle available for this server. How do they get a memory metric into CloudWatch at all?", "expected_answer": ["Install and configure the CloudWatch agent on the on-premises server to collect memory utilization and publish it to CloudWatch as a custom metric, the same mechanism used for EC2 memory monitoring.", "Once published under a chosen namespace, the same CloudWatch alarm and SNS-based alerting pattern can be applied to this custom metric regardless of where the server physically runs.", "There is no 'detailed monitoring' equivalent to enable here, since detailed monitoring only applies to AWS-hypervisor-collected EC2 metrics; the agent-publishing path is the only option both on EC2 and on-premises for memory."], "reasoning": "This transfers the mental model's core lesson -- a metric only exists if something publishes it, and in-guest-only values like memory need an in-guest publisher -- from EC2 to a non-EC2 context. The CloudWatch agent explicitly supports both EC2 instances and on-premises servers, publishing a consistent custom metric into the same namespace either way (cl-da3e68cfb49b), and EC2's own default metrics already exclude memory for the same underlying reason (cl-dcf0fba3cc52, cl-911fc23dc4c8).", "distractor_analysis": "A learner anchored on the canonical scenario might look for an on-premises equivalent of 'enable detailed monitoring.' No such toggle exists off AWS hypervisors; detailed monitoring is specifically an EC2 hypervisor-metric frequency setting, not a general mechanism for getting new metric types into CloudWatch.", "claim_ids": ["cl-da3e68cfb49b", "cl-dcf0fba3cc52", "cl-911fc23dc4c8"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "The claims disagree about what goes in a PutMetricData statistic set. cl-516326837455, cl-a511a894931d and cl-9d4a47c92cfb list exactly Min, Max, Sum and SampleCount, which matches the real StatisticSet structure. cl-92a0f3172668 and cl-75bcf7a44984 add Average as a field you supply. StatisticSet has no Average field; CloudWatch derives Average from Sum/SampleCount. A learner relying on the latter two would pick a wrong option on a --statistic-values question.", "related_entity_ids": ["cl-92a0f3172668", "cl-75bcf7a44984", "cl-516326837455", "cl-a511a894931d", "cl-9d4a47c92cfb"]}, {"type": "contradiction", "severity": "medium", "description": "Source question awssysops-p3-1-q919 is labelled with basic monitoring as the answer for a stated 1-minute requirement. Its own extracted claims (cl-f1253ac04da0, cl-ca9aa8808bd9) and the community vote favour detailed monitoring. The contrast set's exceptions mention this, but it settles the question in favour of detailed monitoring rather than leaving the answer-key disagreement open. The source answer key needs manual verification.", "related_entity_ids": ["cl-d9fac6d164be", "cl-f1253ac04da0", "cl-ca9aa8808bd9", "aws-sysops-service-cloudwatch--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "On awssysops-p2-q569, the boxed answer (S3 GetRequests) disagrees with the community consensus (CloudFront 4XXErrorRate). cl-76efeb2692ab, cl-054b742dd7a6 and cl-7f3304c20584 are all marked conflicted, and the dispute is unresolved.", "related_entity_ids": ["cl-7f3304c20584", "cl-76efeb2692ab", "cl-054b742dd7a6"]}, {"type": "contradiction", "severity": "medium", "description": "On awssysops-p2-q311, the boxed answer includes read-replica lag as a bottleneck metric. Several commenters argue that average IOPS is the right third metric instead. cl-bb7f0c6c8a95 and cl-9b1997242644 are conflicted and the correct set of metrics is undecided.", "related_entity_ids": ["cl-bb7f0c6c8a95", "cl-9b1997242644", "cl-2b7c7db63a43", "cl-7aec0be4944a"]}, {"type": "contradiction", "severity": "medium", "description": "On awssysops-p2-q535 (repeated CPU-credit exhaustion), the boxed answer and the community vote disagree on the remediation: change instance family, resize, buy credits, or alarm on the credit balance. cl-1b2c7c44636a, cl-4dbf7312cbb9, cl-e7d69a12d5cc and cl-671e607cdd2d are all conflicted, so there is no settled answer.", "related_entity_ids": ["cl-671e607cdd2d", "cl-1b2c7c44636a", "cl-4dbf7312cbb9", "cl-e7d69a12d5cc"]}, {"type": "contradiction", "severity": "medium", "description": "On awssysops-p1-q140, the alarm state after an instance was stopped for part of the evaluation window is split roughly evenly between OK and ALARM, with a minority for INSUFFICIENT_DATA. The question does not state the TreatMissingData setting, so cl-a2e5ecbc6606 cannot be resolved from the source.", "related_entity_ids": ["cl-a2e5ecbc6606", "cl-7fb8af26da91", "cl-96f43aa48e5f"]}, {"type": "contradiction", "severity": "medium", "description": "On awssysops-p3-1-q764, the alarm condition meaning 'all targets unhealthy' (HealthyHostCount <= 0 versus an UnhealthyHostCount threshold) is marked conflicted for both the rule and its distractor. The source disagreement is unresolved.", "related_entity_ids": ["cl-c27d89702200", "cl-bad694b1a242"]}, {"type": "contradiction", "severity": "medium", "description": "On awssysops-p2-q434, the cooldown outcome is conflicted for the rule, the worked scenario (count stays at 6) and the distractor. Whether a scale-in trigger that arrives during a scale-out cooldown is ignored depends on the policy type (simple scaling versus step scaling or target tracking), and the question does not specify it.", "related_entity_ids": ["cl-1d630cb80679", "cl-beb84489a165", "cl-ca8b66cfb55b"]}, {"type": "quality", "severity": "medium", "description": "Both the mental model and the contrast set lean on claims that are marked conflicted without saying so. Examples: cl-ef3ced18f947 (memory is not a default metric, from 4 source questions), cl-2cc0c25f4d11 (detailed monitoring adds no in-guest metrics), cl-80f8008f2d10, cl-209b80979e10, cl-3755fffcec2d and cl-ca9aa8808bd9. These back invariants stated as absolute, such as 'never a default EC2 metric at any monitoring level'. The underlying source disagreement is not surfaced anywhere except the q919 exception.", "related_entity_ids": ["aws-sysops-service-cloudwatch--m-1", "aws-sysops-service-cloudwatch--cs-1", "cl-ef3ced18f947", "cl-2cc0c25f4d11", "cl-80f8008f2d10", "cl-209b80979e10", "cl-3755fffcec2d", "cl-ca9aa8808bd9", "cl-2235856eee83", "cl-8c950ad90060"]}, {"type": "unsupported-generation", "severity": "low", "description": "The mental model's limits say the 'detailed monitoring is free and 1-minute' lists for SNS, Route 53, EMR and Auto Scaling 'changed over time'. The claims support a change only for SNS (cl-697df4971aec, January 2021), plus an unverified comment about Auto Scaling (cl-b38a56836185). cl-a7b3715b0225 says EMR has never had a 1-minute option, and cl-40b6d591b715 says Route 53 is already 1-minute. Listing EMR and Route 53 as changed is not backed by the claims.", "related_entity_ids": ["aws-sysops-service-cloudwatch--m-1", "cl-a7b3715b0225", "cl-40b6d591b715", "cl-697df4971aec", "cl-b38a56836185", "cl-e95e196dc67d", "cl-cbe2d675edac"]}, {"type": "stale-risk", "severity": "medium", "description": "Several detailed-monitoring answers depend on when the question was written, and their claims are conflicted. On q224, q226 and q237, the list of services offering free 1-minute monitoring differs between the original reference and current AWS behaviour (SNS since 2021, Auto Scaling per an unverified comment). The exam's expected answer may not match current AWS.", "related_entity_ids": ["cl-e95e196dc67d", "cl-d13dab4cfb76", "cl-697df4971aec", "cl-cbe2d675edac", "cl-679682b767c3", "cl-b38a56836185", "cl-4524974cc547"]}, {"type": "stale-risk", "severity": "medium", "description": "On awssysops-p1-q238, the expected answer treats AWS/CloudTrail as an invalid namespace. cl-aa1e7408af70 notes that CloudTrail now publishes CloudTrail Lake metrics under AWS/CloudTrail, so the question's premise is outdated. cl-5779cfb9d55b records further disagreement among commenters.", "related_entity_ids": ["cl-aa1e7408af70", "cl-5779cfb9d55b"]}, {"type": "stale-risk", "severity": "low", "description": "On awssysops-p1-q211, cl-7c85ede2f66b says the old 10^126 truncation rule no longer applies (values are now -2^360 to 2^360, and out-of-range values are rejected). The question's expected answer probably encodes the old truncation behaviour, so the claim and the answer key may disagree.", "related_entity_ids": ["cl-7c85ede2f66b"]}, {"type": "contradiction", "severity": "low", "description": "Two PutMetricData limits from different eras cannot both hold. cl-e0c0459d596a gives an 8KB GET / 40KB POST request-size limit (q229, documented in the original era), while cl-dcdd827d246e (q266) allows up to 1,000 datums with up to 150 values each in one request, which cannot fit in 40KB. The q229 limit is stale.", "related_entity_ids": ["cl-e0c0459d596a", "cl-dcdd827d246e"]}, {"type": "contradiction", "severity": "low", "description": "The multi-region dashboard claims are inconsistent. cl-2045f2601c1e (q017, conflicted) says combining regions needed manual aggregation before the 2019 cross-account/cross-region dashboards. cl-22e91be279af describes that 2019 feature as the native way to combine regions. But cl-05578b99fe26 (q526) says the same feature is 'about aggregating across AWS accounts', not regions, and cl-cce8abf028eb says per-widget regions already work. The cross-region role of the feature is described in opposite ways, and q017's expected answer is stale.", "related_entity_ids": ["cl-2045f2601c1e", "cl-22e91be279af", "cl-05578b99fe26", "cl-cce8abf028eb", "cl-ac1b5040d54f"]}, {"type": "unsupported-generation", "severity": "low", "description": "The mental model invariant lists the alarm action targets as an SNS topic, an Auto Scaling policy or an EC2 instance action, and reads as an exhaustive list. No cited claim establishes that the list is complete. Current CloudWatch also supports Lambda, Systems Manager OpsItem and Incident Manager actions. The mechanism also says an alarm watches 'one metric (or a math expression)', which leaves out composite alarms and Metrics Insights queries, both named in the cited cl-209b80979e10.", "related_entity_ids": ["aws-sysops-service-cloudwatch--m-1", "cl-209b80979e10", "cl-519525b65bcf", "cl-f07f1b1c5929", "cl-9871fd8b11de"]}, {"type": "quality", "severity": "low", "description": "The contrast set's 'Metrics provided' row describes detailed monitoring as the 'Same hypervisor set' as basic but leaves out status checks, which the basic column lists. That implies detailed monitoring drops status checks. cl-2cc0c25f4d11 says status checks are already 1-minute and unaffected.", "related_entity_ids": ["aws-sysops-service-cloudwatch--cs-1", "cl-2cc0c25f4d11", "cl-ca9aa8808bd9"]}, {"type": "ambiguity", "severity": "low", "description": "On awssysops-p1-q078, cl-f655ae18068f is a hard-to-parse double negative ('It is false that ... cannot be viewed ... merely because ...'), and both it and cl-ef7191e97bf8 are needs-review. cl-ef7191e97bf8 does not say whether aggregating across instances requires detailed monitoring.", "related_entity_ids": ["cl-f655ae18068f", "cl-ef7191e97bf8"]}, {"type": "stale-risk", "severity": "low", "description": "On awssysops-p2-q423, cl-a1f086af1ef5 and cl-454978dcc7e9 state as fact that Auto Scaling publishes exactly 8 metrics. cl-a3661ff1d658 (conflicted) says capacity-unit and warm pool metrics mean 8 is no longer the full count.", "related_entity_ids": ["cl-a3661ff1d658", "cl-454978dcc7e9", "cl-a1f086af1ef5"]}, {"type": "stale-risk", "severity": "low", "description": "On awssysops-p1-q230, cl-ef09eb226222, cl-2ce09a2de24f and cl-783561b8b04f are marked supported with high confidence. They encode the older model in which EC2 alarm actions depend on the configuring IAM user's EC2 permissions and silently fail without them. Current CloudWatch runs EC2 alarm actions through a service-linked role, so the claims may be outdated.", "related_entity_ids": ["cl-ef09eb226222", "cl-2ce09a2de24f", "cl-783561b8b04f"]}], "sourceQuestionCount": 115}], "sources": {"kind": "locked", "file": "aws-sysops-service-cloudwatch-mq00.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------

    var html = safe`

        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>

          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>

  // ---------- Compare ----------

    }).join('');

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">

            </div>
          </div>

      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });

    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {

        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------
  function itemLookup(itemId) {
    return practiceItems().find(function (i) { return i.id === itemId; });
  }

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {
          var item = itemLookup(a.itemId);
          var prompt = item ? (item.prompt || item.stem || '') : '(item no longer in scenario family)';
          var predictedText = Array.isArray(a.predicted) ? a.predicted.join(', ') : (a.predicted || '(no answer recorded)');
          var radios = DIAGNOSIS_CATEGORIES.map(function (c) {

          }).join('');

            <div class="pending-attempt panel" data-attempt-id="${a.id}">
