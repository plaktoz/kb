<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-cloudwatch", "exam": "aws-sysops", "facet": {"key": "service", "value": "cloudwatch"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "rule", "conditions": ["instances need to call the CloudWatch PutMetricData API"], "confidence": "medium", "id": "cl-3c391f50cc4e", "source_question_ids": ["awssysops-p1-q012"], "statement": "Specifying an IAM role (through an instance profile) in the Auto Scaling group's launch template (formerly a launch configuration, now deprecated) is the AWS-recommended way to let instances authenticate CloudWatch PutMetricData calls, using auto-rotated credentials from the instance metadata service.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6c0e7c9cf67b", "source_question_ids": ["awssysops-p1-q012"], "statement": "Creating an IAM user and injecting its credentials into instance User Data or a private repository means distributing and rotating static long-lived secrets by hand, which is not the recommended authentication approach for instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-81c2f9cee3ef", "source_question_ids": ["awssysops-p1-q012"], "statement": "CloudWatch has no metric-level resource policy that can grant PutMetricData permission to instances from an Auto Scaling group.", "status": "supported"}, {"claim_type": "rule", "conditions": ["resources are deployed across multiple AWS regions", "cross-account/cross-region CloudWatch dashboards are not being used"], "confidence": "medium", "id": "cl-2045f2601c1e", "source_question_ids": ["awssysops-p1-q017"], "statement": "Before cross-region CloudWatch dashboards (2019), combining a metric across regions into one graph required pulling it per region via the CLI/API, aggregating it, and publishing it back as a custom metric; today one dashboard graph can show metrics from multiple regions directly.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c6fc73e9fbc3", "source_question_ids": ["awssysops-p1-q017"], "statement": "Resource tags are not CloudWatch metric dimensions, and a CloudWatch agent or SNMP trap cannot be attached to a managed service such as a DynamoDB table, so neither approach produces cross-region graphs covering both EC2 and DynamoDB.", "status": "supported"}, {"claim_type": "fact", "conditions": ["using a CloudWatch feature set from 2019 or later"], "confidence": "medium", "id": "cl-22e91be279af", "source_question_ids": ["awssysops-p1-q017"], "statement": "AWS cross-account/cross-region CloudWatch dashboards, launched in 2019, can natively combine the same metric from multiple regions into one view, offering a newer alternative to manual aggregation.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-5bc987e7159b", "source_question_ids": ["awssysops-p1-q028"], "statement": "CPU utilization, disk I/O, data transfer, and status checks are default EC2 metrics that CloudWatch collects automatically at the hypervisor level with no agent required.", "status": "supported"}, {"claim_type": "exception", "conditions": ["monitoring memory utilization of an EC2 instance"], "confidence": "high", "id": "cl-911fc23dc4c8", "source_question_ids": ["awssysops-p1-q028"], "statement": "EC2 memory utilization is not a default CloudWatch metric because the hypervisor cannot see it; it must be published from inside the guest OS as a custom metric, typically with the CloudWatch agent.", "status": "supported"}, {"claim_type": "fact", "conditions": ["each project has its own dedicated AWS account"], "confidence": "medium", "id": "cl-0ef04755ba70", "source_question_ids": ["awssysops-p1-q031"], "statement": "When each project already has its own dedicated AWS account, per-account CloudWatch billing alerts already provide per-project cost granularity without needing resource tagging.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-69c5ba0eae92", "source_question_ids": ["awssysops-p1-q031"], "statement": "Tiered billing alert thresholds (e.g., notifications at 50%, 80%, and 90% of budgeted spend) give advance warning before a budget is exceeded, unlike a single alert threshold set exactly at the budget amount, which only fires once the limit has already been reached.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9f1983113df2", "source_question_ids": ["awssysops-p1-q031"], "statement": "Consolidating accounts into a single bill does not alert on or prevent overspending against per-project budgets (the bill still breaks costs down by linked account), so on its own it cannot ensure budgets are not exceeded.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2e8ac056c0f6", "source_question_ids": ["awssysops-p1-q031"], "statement": "Auto Scaling CloudWatch alarms based on running instance count do not map reliably to actual cost.", "status": "supported"}, {"claim_type": "rule", "conditions": ["need to detect failure of the monitoring instance itself, simply"], "confidence": "high", "id": "cl-6a1043eae393", "source_question_ids": ["awssysops-p1-q035"], "statement": "The simplest way to monitor the health of a monitoring instance itself ('who watches the watcher') is a CloudWatch alarm on its EC2 system/instance status checks, which catches hardware-level failures with no extra moving parts and can notify operations the same way an existing alarm does.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2ee540b97370", "source_question_ids": ["awssysops-p1-q035"], "statement": "Using a second monitoring instance to watch the first monitoring instance just recreates the same 'who watches the watcher' problem one level up.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0e2d933c8ed9", "source_question_ids": ["awssysops-p1-q035"], "statement": "A CPU-utilization alarm combined with having the monitoring application deliberately enter a CPU-bound loop on problem detection, or an active SQS-based failover/handoff scheme between instances, are both far more complex than needed to detect whether a monitoring instance itself is healthy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-519525b65bcf", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can trigger an Auto Scaling policy that scales an Auto Scaling group up or down.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f07f1b1c5929", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can send an SNS notification, including an SMS message.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9871fd8b11de", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm can directly stop, terminate, reboot, or recover an EC2 instance as an alarm action.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-b9de0f2dd9eb", "source_question_ids": ["awssysops-p1-q061"], "statement": "A CloudWatch alarm cannot target an Auto Scaling launch configuration or launch template directly, because a launch configuration is only a blueprint used when a group scales, not an addressable target for an alarm action.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9aa30c8aedba", "source_question_ids": ["awssysops-p1-q066"], "statement": "CloudWatch's SetAlarmState API, exposed via the CLI's set-alarm-state command, lets a user force an alarm into any state (OK, INSUFFICIENT_DATA, or ALARM) specifically to test that its configured actions fire correctly.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-70d695200fee", "source_question_ids": ["awssysops-p1-q066"], "statement": "A CloudWatch alarm state forced via SetAlarmState persists only until the next real metric evaluation overwrites it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1db6076385f9", "source_question_ids": ["awssysops-p1-q066"], "statement": "The AWS Management Console does not expose a button to directly force a CloudWatch alarm into a given state; that capability is only available via the CLI or API.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-16263c701f6a", "source_question_ids": ["awssysops-p1-q066"], "statement": "Manually running the SNS action associated with a CloudWatch alarm bypasses the alarm itself rather than testing whether the alarm triggers its action.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3c18099ca711", "source_question_ids": ["awssysops-p1-q068"], "statement": "A CloudWatch alarm's threshold is just an editable property of the alarm and can be changed at any time, including after the alarm has already tripped.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7e1316ebc21a", "source_question_ids": ["awssysops-p1-q071"], "statement": "CloudWatch's supported statistics for metric data aggregation include Sum, Minimum, Maximum, Sample Count, and Average.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3d6efaf96415", "source_question_ids": ["awssysops-p1-q071"], "statement": "'Aggregate' is not a real CloudWatch statistic name.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-98bd42dd341a", "source_question_ids": ["awssysops-p1-q076"], "statement": "ELB access logs, CloudWatch metrics, and CloudTrail API-call logging all capture observability information about load balancer activity, such as traffic patterns, request counts/latency, and configuration API calls.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cc4f5ee6c1a7", "source_question_ids": ["awssysops-p1-q076"], "statement": "ELB health checks are an internal mechanism the load balancer uses to decide which registered targets are healthy; they are an input to ELB's routing behavior, not an observability output for monitoring overall ELB activity.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instances launched via the same Auto Scaling group"], "confidence": "medium", "id": "cl-ef7191e97bf8", "source_question_ids": ["awssysops-p1-q078"], "statement": "CloudWatch can aggregate statistics across every instance in an Auto Scaling group directly through built-in cross-instance statistics, without a separate analysis tool.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f655ae18068f", "source_question_ids": ["awssysops-p1-q078"], "statement": "It is false that average CPU utilization across instances launched from the same AMI cannot be viewed in CloudWatch merely because each instance has a different instance ID.", "status": "needs-review"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-4524974cc547", "source_question_ids": ["awssysops-p1-q080"], "statement": "Auto Scaling group metrics, once enabled, are reported at 1-minute granularity at no additional charge; per-instance EC2 detailed monitoring (set in the launch template or configuration) sends 1-minute metrics at an extra charge, while basic monitoring is 5-minute and free.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f71aec823fae", "source_question_ids": ["awssysops-p1-q085"], "statement": "CloudWatch only natively tracks AWS service metrics; non-AWS data, such as a custom temperature reading, must be pushed in as a custom metric via the CLI (e.g., put-metric-data) or the underlying API, specifying the metric name, namespace, and timestamp.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-df28faa5b5b2", "source_question_ids": ["awssysops-p1-q085"], "statement": "AWS Import/Export (now superseded by the AWS Snow Family) was for offline bulk data transfer into AWS storage such as S3, EBS, or Glacier; it cannot import CloudWatch metrics, which must be published with the CLI or API.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-420d917c29ea", "source_question_ids": ["awssysops-p1-q085"], "statement": "The AWS Management Console has no bulk custom-metric upload path for CloudWatch.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-acc9e567b953", "source_question_ids": ["awssysops-p1-q103"], "statement": "CloudWatch billing metric data is always stored in the US East (N. Virginia) Region, but represents worldwide charges across every AWS region the account uses.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a9c69fc825e2", "source_question_ids": ["awssysops-p1-q103"], "statement": "A billing alarm's estimated-charges metric does not show data specific to only one region, since billing metrics behave globally regardless of which region's console is used to view them.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7d3d2a4b2b86", "source_question_ids": ["awssysops-p1-q107"], "statement": "CloudTrail records CloudWatch API calls with who made them and when; control-plane calls are logged by default as management events, but metric data calls such as PutMetricData are logged only after you enable CloudWatch data events on a trail or event data store.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2da0a8c615ca", "source_question_ids": ["awssysops-p1-q107"], "statement": "CloudWatch's own logging does not natively audit API calls made against the CloudWatch service itself.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ff5335605cd3", "source_question_ids": ["awssysops-p1-q107"], "statement": "Enabling detailed monitoring on CloudWatch increases metric granularity/frequency and is unrelated to auditing which API calls were made.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ac737c601982", "source_question_ids": ["awssysops-p1-q115"], "statement": "Publishing a custom metric to CloudWatch via put-metric-data requires supplying the namespace as part of the command.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6ac29611c310", "source_question_ids": ["awssysops-p1-q115"], "statement": "A newly published custom CloudWatch metric can take around 15 minutes before it first appears when listing metrics in the console.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e452f2f837e1", "source_question_ids": ["awssysops-p1-q119"], "statement": "Elastic Load Balancing sends its full set of pre-selected metrics to CloudWatch at one-minute frequency for no additional charge, unlike EC2 instances, where the same one-minute frequency is called Detailed Monitoring and costs extra.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0d2447e3c168", "source_question_ids": ["awssysops-p1-q121"], "statement": "The CloudWatch console's Absolute tab lets a user enter an exact start and end date-time to locate metric data for a known past time window.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-df95b8bedfb9", "source_question_ids": ["awssysops-p1-q121"], "statement": "The CloudWatch console's Relative time range always shows a rolling window ending now (e.g., last 1 week), so viewing a specific past window such as one hour a week ago requires the Absolute range with exact start and end times.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-12ac1c977ad1", "source_question_ids": ["awssysops-p1-q122"], "statement": "A CloudWatch alarm watching the CPU Utilization metric can be configured to notify an Auto Scaling group directly when utilization drops below a threshold, triggering a scale-in policy on that group to remove an instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-83f38ae36e2b", "source_question_ids": ["awssysops-p1-q122"], "statement": "Using an SNS email notification plus manually adjusting Auto Scaling desired capacity can remove an instance on low CPU utilization, but requires a human in the loop rather than automatic scale-in.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a525de4e88f6", "source_question_ids": ["awssysops-p1-q122"], "statement": "Auto Scaling scheduled actions trigger on a fixed schedule, not dynamically in response to a CloudWatch metric like CPU utilization.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-6b027616c185", "source_question_ids": ["awssysops-p1-q122"], "statement": "An Auto Scaling launch configuration is only an instance template; it cannot receive CloudWatch alarm notifications or execute scaling policies, since only the Auto Scaling group itself can.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c41565840f04", "source_question_ids": ["awssysops-p1-q123"], "statement": "The CloudWatch Auto Scaling metric GroupTotalInstances reports the combined count of all instances in the group regardless of state (pending, running, and terminating are all rolled into this single number).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-71eaab3ffcf8", "source_question_ids": ["awssysops-p1-q123"], "statement": "GroupSumInstances is not a real CloudWatch Auto Scaling metric name.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f35aa2f0dd3d", "source_question_ids": ["awssysops-p1-q123"], "statement": "GroupInstancesCount is not a real CloudWatch Auto Scaling metric name.", "status": "supported"}, {"claim_type": "rule", "conditions": ["creating a CloudWatch billing alarm for the first time"], "confidence": "high", "id": "cl-05ea19318b37", "source_question_ids": ["awssysops-p1-q124"], "statement": "Before a CloudWatch billing alarm can be created for the first time, the account owner must explicitly enable 'Receiving Billing Alerts' in the account's Billing preferences.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-dc5f9be76c01", "source_question_ids": ["awssysops-p1-q124"], "statement": "After enabling 'Receiving Billing Alerts', the underlying billing metric data takes about 15 minutes to first appear.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ffa96d173e75", "source_question_ids": ["awssysops-p1-q124"], "statement": "'Receiving Billing Reports' is a different, separate feature from 'Receiving Billing Alerts' -- it provides scheduled cost reports and is not what unlocks the CloudWatch billing metric.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-04f5c40b1d69", "source_question_ids": ["awssysops-p1-q124"], "statement": "'AWS billing utility' and 'CloudWatch Billing Threshold' are not real AWS account billing settings.", "status": "supported"}, {"claim_type": "fact", "conditions": ["viewing a CloudWatch metrics graph"], "confidence": "low", "id": "cl-921b94b2138a", "source_question_ids": ["awssysops-p1-q125"], "statement": "The CloudWatch console's Time Range control on the metrics graph view lets a user select a local timezone for that specific view.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ec0bc7012f3e", "source_question_ids": ["awssysops-p1-q125"], "statement": "Both CloudWatch metric graphs and dashboards switch between UTC and local time zone from the time-range control (Custom > UTC or Local time zone), not from a separate dashboard settings toggle.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0e30a2d6d69e", "source_question_ids": ["awssysops-p1-q129"], "statement": "The disk-related EC2 CloudWatch metrics (DiskReadOps, DiskWriteOps, DiskReadBytes, DiskWriteBytes) only report non-zero values when the instance has ephemeral (instance store) storage attached, since they measure I/O against that ephemeral device specifically.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance has no ephemeral/instance-store device attached"], "confidence": "high", "id": "cl-bf744509cd39", "source_question_ids": ["awssysops-p1-q129"], "statement": "An EBS-backed EC2 instance with no additional ephemeral device attached will always report 0 for DiskReadBytes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c9fe7ff717c8", "source_question_ids": ["awssysops-p1-q129"], "statement": "The CloudWatch metrics NetworkIn, NetworkOut, and CPUUtilization are populated regardless of storage type, since they measure network traffic and processor usage rather than ephemeral-disk I/O.", "status": "supported"}, {"claim_type": "rule", "conditions": ["an HTTP-reachable physical device/endpoint exists to receive the SNS notification"], "confidence": "low", "id": "cl-ace019c49d97", "source_question_ids": ["awssysops-p1-q137"], "statement": "A CloudWatch alarm on EC2 CPU utilization can publish to an SNS topic, which can deliver to an HTTP endpoint that a home-automation/IoT device could use to physically switch on a light.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e0b93267c34f", "source_question_ids": ["awssysops-p1-q140"], "statement": "A CloudWatch alarm configured for 5 evaluation periods of 5 minutes each has a 25-minute total evaluation window.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance was stopped for part of the alarm's evaluation window, then restarted"], "confidence": "low", "id": "cl-a2e5ecbc6606", "source_question_ids": ["awssysops-p1-q140"], "statement": "Whether a CloudWatch alarm reports OK, Alarm, or Insufficient Data after an instance was briefly stopped mid-evaluation-window (leaving a gap in reported data points shorter than the full window) depends on CloudWatch's specific handling of missing data points, and community consensus on this exact scenario is split roughly 50/50 between OK and Alarm, with a substantial minority arguing for Insufficient Data.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-516326837455", "source_question_ids": ["awssysops-p1-q154"], "statement": "CloudWatch's PutMetricData API accepts a pre-aggregated statistic set (Min, Max, Sum, and SampleCount) for a given timestamp/period instead of requiring every individual raw data point.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3ba021d98bf5", "source_question_ids": ["awssysops-p1-q154"], "statement": "CloudWatch does not 'map timezones' between sent data and received data; this is not how CloudWatch's custom metric aggregation works.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-4699b5cb830f", "source_question_ids": ["awssysops-p1-q154"], "statement": "Sending only the average of one minute's data to CloudWatch works, but it throws away the min/max/count detail that a statistic set (Min, Max, Sum, SampleCount) would preserve.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-337164b72bf9", "source_question_ids": ["awssysops-p1-q157"], "statement": "The CloudWatch console lets a user reassign which Y-axis a given metric plots against via a per-metric 'Switch' option in the graph legend.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-839aa1b3dc98", "source_question_ids": ["awssysops-p1-q157"], "statement": "CloudWatch natively supports showing multiple metrics with different units on the same graph using dual Y-axes.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-58b5b1342750", "source_question_ids": ["awssysops-p1-q157"], "statement": "CloudWatch console graphs support at most two Y-axes; adding a third Y-axis is not a real CloudWatch console feature.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-831aa13cc3f9", "source_question_ids": ["awssysops-p1-q157"], "statement": "CPU utilization (a percentage) cannot be unit-converted to match network byte counts, so changing its units to match Network metrics is not a valid way to fix a shared-axis scaling problem.", "status": "supported"}, {"claim_type": "rule", "conditions": ["monitored resource detached or inactive", "default TreatMissingData = missing"], "confidence": "medium", "id": "cl-96f43aa48e5f", "source_question_ids": ["awssysops-p1-q161"], "statement": "With the default missing-data treatment (TreatMissingData = missing), a CloudWatch alarm moves to INSUFFICIENT_DATA when its metric stops reporting data points, such as after the monitored EBS volume is detached; breaching, notBreaching, or ignore would instead put it in ALARM, OK, or keep its current state.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-7fb8af26da91", "source_question_ids": ["awssysops-p1-q161"], "statement": "Under the default missing-data treatment, a CloudWatch alarm with no data points cannot evaluate to OK or ALARM and moves to INSUFFICIENT_DATA; setting TreatMissingData to breaching, notBreaching, or ignore lets it sit in ALARM, OK, or its current state without data.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1a7ec6a6ff8a", "source_question_ids": ["awssysops-p1-q161"], "statement": "CloudWatch alarms on an EBS volume do not block detaching it; the alarms remain and move to INSUFFICIENT_DATA once the volume stops reporting metrics, so 'the volume cannot be detached until its alarms are removed' is wrong.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-33e2db9f90e3", "source_question_ids": ["awssysops-p1-q167"], "statement": "The AWS CLI's put-metric-data command accepts a --metric-data file://metric.json parameter, letting a user supply a JSON file directly as input rather than manually parsing it into individual values first.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-37503418ca50", "source_question_ids": ["awssysops-p1-q167"], "statement": "There is no 'CloudWatch Import command' in the AWS CLI.", "status": "needs-review"}, {"claim_type": "rule", "conditions": ["target resource is outside AWS, e.g. an on-premises/private data center"], "confidence": "high", "id": "cl-8075cf682ebf", "source_question_ids": ["awssysops-p1-q186"], "statement": "A CloudWatch alarm on the StatusCheckFailed metric can publish to an SNS topic that delivers to an HTTP endpoint running in an on-premises data center, which can trigger launching a new instance there.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d4f0c575b47f", "source_question_ids": ["awssysops-p1-q186"], "statement": "Auto Scaling, ELB, VPC, and CloudFormation cannot natively launch a replacement server in an on-premises private cloud; triggering that needs something like a CloudWatch alarm publishing to SNS, which delivers to an HTTP endpoint in the data center.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2541b1b2f365", "source_question_ids": ["awssysops-p1-q192"], "statement": "On a CloudWatch graph, selecting a time period with the mouse and then releasing it zooms the graph into that selected window.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-306e86ecb84d", "source_question_ids": ["awssysops-p1-q192"], "statement": "Double-clicking on a period in a CloudWatch graph does not correspond to any real CloudWatch console zoom interaction.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-bd939b186d78", "source_question_ids": ["awssysops-p1-q192"], "statement": "Editing the CloudWatch Time Range control lets a user narrow the overall graph's time window manually, but this is distinct from the direct click-and-drag zoom interaction on the graph itself.", "status": "supported"}, {"claim_type": "default", "conditions": ["Auto Scaling launch configuration created via CLI or SDK"], "confidence": "medium", "id": "cl-c58ecd6a44b8", "source_question_ids": ["awssysops-p1-q193"], "statement": "A legacy Auto Scaling launch configuration created via the CLI or an SDK defaults InstanceMonitoring.Enabled to true (detailed 1-minute monitoring); launch configurations are deprecated, and launch templates, their replacement, default to basic 5-minute monitoring unless detailed monitoring is explicitly enabled.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["Auto Scaling launch configuration created via CLI or SDK"], "confidence": "high", "id": "cl-600d3d55c8c3", "source_question_ids": ["awssysops-p1-q193"], "statement": "For an Auto Scaling launch configuration created via the CLI or an SDK, instances get basic (5-minute) monitoring only if InstanceMonitoring is explicitly disabled; console-created launch configurations and launch templates default to basic monitoring.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-91709d8d0c5e", "source_question_ids": ["awssysops-p1-q199"], "statement": "A CloudWatch alarm enters the 'Insufficient Data' state when its underlying metric stops reporting data altogether.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-37d3230901f8", "source_question_ids": ["awssysops-p1-q199"], "statement": "Alerting on the CloudWatch alarm 'Insufficient Data' state is the way to detect that an RDS instance has become unavailable/inactive, as distinct from CPU-utilization-threshold alarms.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-fbd4b04d16f2", "source_question_ids": ["awssysops-p1-q199"], "statement": "High or low CPU-utilization threshold alarms on RDS reflect utilization levels, not whether the instance itself is unavailable or inactive.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AlarmNotification process type is suspended"], "confidence": "high", "id": "cl-693cc12d9a5c", "source_question_ids": ["awssysops-p1-q203"], "statement": "Suspending omatically timestamps every data point in Coordinated Universal Time (UTC); a user never needs to supply a time zone with a data point.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-dce87149f0b3", "source_question_ids": ["awssysops-p1-q211"], "statement": "CloudWatch supports getting the aggregate of numbers generated over a minute and sending that aggregate as a custom metric data point.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7c85ede2f66b", "source_question_ids": ["awssysops-p1-q211"], "statement": "CloudWatch accepts metric values between -2^360 and 2^360 and rejects values outside that range, as well as NaN and Infinity, rather than truncating them; the older 10^126 truncation rule no longer applies.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4729783050c7", "source_question_ids": ["awssysops-p1-q211"], "statement": "A user can create a file in JSON format containing a metric name and value and supply it directly to CloudWatch via the put-metric-data CLI command.", "status": "supported"}, {"claim_type": "fact", "conditions": ["as originally documented"], "confidence": "medium", "id": "cl-e95e196dc67d", "source_question_ids": ["awssysops-p1-q224"], "statement": "Per the original reference documentation, AWS RDS, EC2, Auto Scaling, ELB, and Route 53 are able to provide detailed (every-minute) CloudWatch monitoring, while AWS EMR was not listed among them.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a7b3715b0225", "source_question_ids": ["awssysops-p1-q224"], "statement": "Amazon EMR sends cluster metrics to CloudWatch every 5 minutes; the interval is not configurable and EMR has no detailed (1-minute) monitoring option.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-40b6d591b715", "source_question_ids": ["awssysops-p1-q224"], "statement": "Route 53 health-check metrics are published to CloudWatch at 1-minute granularity at no extra charge, so Route 53 does provide detailed (1-minute) monitoring.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a511a894931d", "source_question_ids": ["awssysops-p1-q225"], "statement": "The AWS CLI's put-metric-data --statistic-values parameter accepts Sum, Minimum, Maximum, and SampleCount for submitting a pre-aggregated custom metric data point.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-feb0b896ba4b", "source_question_ids": ["awssysops-p1-q225"], "statement": "The put-metric-data CLI command does not have 'aggregate-values', 'aggregate-data', or 'average-values' parameters -- these are invented, nonexistent parameter names.", "status": "supported"}, {"claim_type": "fact", "conditions": ["as originally documented, before January 2021"], "confidence": "medium", "id": "cl-d13dab4cfb76", "source_question_ids": ["awssysops-p1-q226"], "statement": "Historically, per the original reference passage, AWS SNS only sent CloudWatch data every 5 minutes (basic monitoring only), with no detailed-monitoring option available.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["current AWS behavior, since the January 2021 change"], "confidence": "medium", "id": "cl-697df4971aec", "source_question_ids": ["awssysops-p1-q226"], "statement": "As of January 2021, AWS made 1-minute CloudWatch metrics the default for SNS, so SNS now provides every-minute granularity automatically with no separate 'enable detailed monitoring' step required.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2d531b559aaf", "source_question_ids": ["awssysops-p1-q226"], "statement": "CloudWatch has always supported at least basic monitoring for SNS, regardless of era, so a claim that CloudWatch does not support monitoring for SNS at all is wrong.", "status": "supported"}, {"claim_type": "fact", "conditions": ["as originally documented; may be outdated"], "confidence": "medium", "id": "cl-e0c0459d596a", "source_question_ids": ["awssysops-p1-q229"], "statement": "At the time this question was documented, the PutMetricData API request size was limited to 8KB for HTTP GET requests and 40KB for HTTP POST requests; current AWS API reference documentation may list different, generally larger limits.", "status": "needs-review"}, {"claim_type": "rule", "conditions": ["IAM user has CloudWatch permissions but not EC2 permissions"], "confidence": "high", "id": "cl-ef09eb226222", "source_question_ids": ["awssysops-p1-q230"], "statement": "An IAM user with only CloudWatch permissions can still create a CloudWatch alarm and configure an EC2 stop/terminate action on it, since CloudWatch permissions are sufficient for the configuration step.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2ce09a2de24f", "source_question_ids": ["awssysops-p1-q230"], "statement": "When a CloudWatch alarm fires, executing a configured EC2 action (such as stopping an instance) requires the triggering IAM user/role to have the relevant EC2 permissions.", "status": "supported"}, {"claim_type": "fact", "conditions": ["IAM user has CloudWatch permissions but not EC2 permissions"], "confidence": "high", "id": "cl-783561b8b04f", "source_question_ids": ["awssysops-p1-q230"], "statement": "If the IAM user lacks EC2 permissions, a CloudWatch alarm's configured EC2 action silently fails to execute when the alarm fires, even though the alarm and action were successfully configured beforehand.", "status": "supported"}, {"claim_type": "fact", "conditions": ["as originally documented"], "confidence": "medium", "id": "cl-cbe2d675edac", "source_question_ids": ["awssysops-p1-q237"], "statement": "Per the original reference passage, AWS RDS, ELB, OpsWorks, and Route 53 provide free detailed (every-minute) CloudWatch monitoring at the time it was written, with no extra charge.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["current AWS behavior, since January 29, 2021"], "confidence": "low", "id": "cl-679682b767c3", "source_question_ids": ["awssysops-p1-q237"], "statement": "As of January 29, 2021, SNS 1-minute CloudWatch monitoring became free and default, making SNS also a valid free-detailed-monitoring answer under current AWS behavior.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["current AWS behavior, per an unverified comment"], "confidence": "low", "id": "cl-b38a56836185", "source_question_ids": ["awssysops-p1-q237"], "statement": "EC2 Auto Scaling has reportedly also come to provide free 1-minute CloudWatch metrics under current AWS behavior, per a community comment.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["in the narrow sense of CloudTrail publishing its own CloudWatch metrics"], "confidence": "medium", "id": "cl-aa1e7408af70", "source_question_ids": ["awssysops-p1-q238"], "statement": "The reference passage treats AWS/CloudTrail as an invalid CloudWatch namespace because CloudTrail then published no service metrics of its own and integrated with CloudWatch by delivering events to CloudWatch Logs; CloudTrail now publishes CloudTrail Lake metrics under the AWS/CloudTrail namespace.", "status": "needs-review"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-5779cfb9d55b", "source_question_ids": ["awssysops-p1-q238"], "statement": "CloudTrail integrates with CloudWatch Logs by sending log events for monitoring, which some commenters argue gives CloudTrail a CloudWatch association that challenges the premise that 'AWS/CloudTrail' is categorically an invalid namespace.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5587be38e876", "source_question_ids": ["awssysops-p1-q238"], "statement": "AWS/StorageGateway, AWS/ElastiCache, and AWS/SWF are valid AWS CloudWatch metric namespaces.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ee312743d473", "source_question_ids": ["awssysops-p1-q247"], "statement": "On a Classic Load Balancer, the HTTPCode_Backend_5XX metric counts 5XX responses returned by registered instances; on an Application Load Balancer the equivalent is HTTPCode_Target_5XX_Count, while HTTPCode_ELB_5XX_Count counts errors generated by the load balancer itself.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-addbdabd122c", "source_question_ids": ["awssysops-p1-q247"], "statement": "The ELB CloudWatch metrics HTTPCode_Backend_2XX, HTTPCode_Backend_3XX, and HTTPCode_Backend_4XX represent successful, redirect/user-agent-action-required, and client-error responses respectively -- none reflect a back-end server-side problem.", "status": "supported"}, {"claim_type": "default", "conditions": ["Auto Scaling launch configuration created via CLI or SDK versus via console or launch template"], "confidence": "medium", "id": "cl-e9094a8ae529", "source_question_ids": ["awssysops-p1-q250"], "statement": "A legacy Auto Scaling launch configuration created via the CLI or an SDK defaults to detailed (1-minute) instance monitoring, while console-created launch configurations and all launch templates default to basic monitoring; launch configurations are deprecated in favor of launch templates, where detailed monitoring must be enabled explicitly.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3e598101cf0b", "source_question_ids": ["awssysops-p1-q250"], "statement": "Setting a CloudWatch alarm on an Auto Scaling group does not automatically enable detailed monitoring for that group.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4a2dd224053a", "source_question_ids": ["awssysops-p1-q250"], "statement": "Auto Scaling does support detailed monitoring; the claim that it does not is incorrect.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ab3acc83cf5e", "source_question_ids": ["awssysops-p1-q257"], "statement": "Every custom metric published to CloudWatch via PutMetricData must specify a Namespace to logically group it; namespace is a mandatory field.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-74ce3ad3b31f", "source_question_ids": ["awssysops-p1-q257"], "statement": "Every CloudWatch data point requires a MetricName; with the CLI, the --metric-name flag can be omitted only because the name can be supplied inside a --metric-data JSON file instead.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aad05b7c1897", "source_question_ids": ["awssysops-p1-q257"], "statement": "Timestamp is optional when publishing a CloudWatch data point; if omitted, CloudWatch uses the time it receives the data, and there is no time-zone parameter because timestamps are UTC.", "status": "supported"}, {"claim_type": "rule", "conditions": ["high-frequency custom metric data, e.g. many records per second"], "confidence": "high", "id": "cl-92a0f3172668", "source_question_ids": ["awssysops-p1-q266"], "statement": "When publishing a high-frequency custom metric (e.g. 1000 records per second) to CloudWatch, the recommended approach is to aggregate the data into a single statistic set (Min, Max, Average, Sum, SampleCount) per put-metric-data call rather than sending one call per raw data point.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-dcdd827d246e", "source_question_ids": ["awssysops-p1-q266"], "statement": "Each MetricDatum in put-metric-data can carry up to 150 distinct values with matching Counts, and one request can include up to 1,000 metric datums, so raw values can be batched without computing a statistic set.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-529541496d5c", "source_question_ids": ["awssysops-p1-q266"], "statement": "put-metric-data does not parse a comma-separated value string or an uploaded CSV file, so those options are wrong; 'send one by one' is wrong because data can be batched in one call (statistic sets, Values/Counts arrays, multiple datums), not because CloudWatch fails to aggregate individually sent points, which it does per period.", "status": "supported"}, {"claim_type": "rule", "conditions": ["data generation is sporadic/random and may have gaps"], "confidence": "medium", "id": "cl-8399ca5b2b54", "source_question_ids": ["awssysops-p1-q269"], "statement": "For sporadic data with gaps, CloudWatch lets you publish either zero or no value for empty periods; publishing zero is preferred when periodic PutMetricData calls monitor application health, so an alarm can tell 'no activity' apart from 'publisher stopped'.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-91812d8191cb", "source_question_ids": ["awssysops-p1-q270"], "statement": "CloudWatch accepts custom metric data points with timestamps up to two hours in the future.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a0e7267da34e", "source_question_ids": ["awssysops-p1-q270"], "statement": "CloudWatch accepts custom metric data points with timestamps up to two weeks in the past.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-89319f1cbe71", "source_question_ids": ["awssysops-p1-q270"], "statement": "A claim that CloudWatch rejects any custom metric data point with a future timestamp outright is incorrect, since timestamps up to two hours ahead are accepted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d86e93a3c68b", "source_question_ids": ["awssysops-p1-q270"], "statement": "A claim that it is not possible to manually send custom metric data to CloudWatch is incorrect, since data can be submitted via the CloudWatch API.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-9eaa2089a7e0", "source_question_ids": ["awssysops-p1-q270"], "statement": "A claim that CloudWatch limits future-dated custom metric timestamps to 60 minutes is incorrect; the actual allowance is two hours.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-93d7cb02a747", "source_question_ids": ["awssysops-p1-q279"], "statement": "CloudWatch does not track which AWS region a custom metric data point originated from.", "status": "supported"}, {"claim_type": "rule", "conditions": ["same namespace", "same metric name", "same dimensions"], "confidence": "high", "id": "cl-376ca6076994", "source_question_ids": ["awssysops-p1-q279"], "statement": "When multiple sources publish custom metric data under the same namespace, metric name, and dimensions, CloudWatch treats them as one metric and aggregates the values (e.g. min/max/average/sum).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-038a03bd2c82", "source_question_ids": ["awssysops-p1-q279"], "statement": "A claim that CloudWatch cannot receive custom metric data published from sources in different AWS regions is incorrect.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0956c934c889", "source_question_ids": ["awssysops-p1-q279"], "statement": "A claim that CloudWatch errors out when two sources publish data to the same namespace/metric/dimensions is incorrect; it aggregates the values instead of raising a conflict error.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6cd980ff1bff", "source_question_ids": ["awssysops-p1-q279"], "statement": "A claim that CloudWatch keeps only the data from whichever source published first (a \"first write wins\" outcome) for a shared metric is incorrect; it aggregates all values instead.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-bfa88fd18597", "source_question_ids": ["awssysops-p1-q286"], "statement": "CloudWatch API/CLI endpoint URLs are specified at the region level only (e.g. monitoring.us-east-1.amazonaws.com), dropping any availability-zone letter suffix even when the monitored instance lives in a specific zone such as us-east-1a.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-96fe689cbb81", "source_question_ids": ["awssysops-p1-q286"], "statement": "A claim that a CloudWatch endpoint URL must include an availability-zone letter suffix (e.g. us-east-1a) is incorrect; endpoints are region-only.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3907b0069218", "source_question_ids": ["awssysops-p1-q290"], "statement": "A CloudWatch alarm that monitors CPU utilization and triggers a terminate action once utilization drops below a low threshold (e.g. 5%) can detect job completion and automatically terminate an EC2 instance running a variable-duration batch job, without hardcoding a fixed runtime.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d14686b021a8", "source_question_ids": ["awssysops-p1-q290"], "statement": "CloudWatch alarms can trigger automatic EC2 instance termination as an alarm action.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-839dedb29630", "source_question_ids": ["awssysops-p1-q290"], "statement": "Hardcoding lled and configured, and it supports the major Linux, Windows Server, and macOS versions, so an unsupported operating system is not a likely cause of missing logs.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-03d9ceb28a81", "source_question_ids": ["awssysops-p3-1-q660"], "statement": "A CloudWatch alarm action can publish directly to an Amazon SNS topic, which fans out to email-subscribed endpoints, to notify developers when a threshold is crossed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c5071635544b", "source_question_ids": ["awssysops-p3-1-q660"], "statement": "Amazon SES is not a valid target that a CloudWatch alarm action can invoke directly.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-76fa8c7fe4b2", "source_question_ids": ["awssysops-p3-1-q660"], "statement": "Amazon Inspector is a vulnerability-assessment service, not a mechanism for CloudWatch alarm email notifications.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4c5820a1abb6", "source_question_ids": ["awssysops-p3-1-q660"], "statement": "Amazon Cognito handles user identity and authentication, not alarm notification delivery.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-9b1c8e68f6d1", "source_question_ids": ["awssysops-p3-1-q671"], "statement": "To display custom metrics on a CloudWatch dashboard, add a metric-type widget (such as a graph or number widget) and select the metric from its custom namespace.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-52c23c115974", "source_question_ids": ["awssysops-p3-1-q671"], "statement": "A CloudWatch dashboard text widget holds only static Markdown text or labels and cannot be bound to a metric.", "status": "supported"}, rving its instance ID, IP, and other attributes) when the underlying hardware becomes impaired.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c92084c27494", "source_question_ids": ["awssysops-p3-1-q699"], "statement": "AWS Systems Manager automates operational tasks but has no built-in hardware-failure recovery action for EC2 instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0b9377b13251", "source_question_ids": ["awssysops-p3-1-q699"], "statement": "Amazon Inspector performs vulnerability assessment, not EC2 instance recovery.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9c28d52b7c6a", "source_question_ids": ["awssysops-p3-1-q699"], "statement": "AWS CloudFormation manages infrastructure as code, not runtime health monitoring or recovery of EC2 instances.", "status": "supported"}, {"claim_type": "rule", "conditions": ["ALB target group with variable fleet size behind an Auto Scaling group"], "confidence": "medium", "id": "cl-c27d89702200", "source_question_ids": ["awssysops-p3-1-q764"], "statement": "For an ALB target group behind an Auto Scaling group whose fleet size varies, HealthyHostCount <= 0 is the condition that reliably means all target instances are unhealthy, regardless of fleet size.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-bad694b1a242", "source_question_ids": ["awssysops-p3-1-q764"], "statement": "AWS/ApplicationELB UnhealthyHostCount >= 1 triggers as soon as a single instance becomes unhealthy, not when all instances in the fleet are unhealthy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f27154409aaf", "source_question_ids": ["awssysops-p3-1-q764"], "statement": "EC2 StatusCheckFailed metrics reflect individual instance-level status checks, not the ALB's aggregate view of target health across the whole fleet.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-ef3ced18f947", "source_question_ids": ["awssysops-p3-1-q779", "awssysops-p3-1-q842", "awssysops-p3-1-q861", "awssysops-p3-1-q911"], "statement": "Memory utilization is not a default EC2 metric; it must be collected from inside the OS and published as a custom metric, and the CloudWatch agent is the AWS-recommended way to do so (the older monitoring scripts are deprecated).", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-3755fffcec2d", "source_question_ids": ["awssysops-p3-1-q779"], "statement": "The CloudWatch agent's metrics_collection_interval sets how often metrics are collected (default 60 seconds; 60 or less gives one-minute granularity), while force_flush_interval controls how often they are sent to CloudWatch.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2cc0c25f4d11", "source_question_ids": ["awssysops-p3-1-q779", "awssysops-p3-1-q809", "awssysops-p3-1-q842"], "statement": "Detailed monitoring only changes EC2's built-in hypervisor metrics (CPU, network, disk I/O) from 5-minute to 1-minute periods (status check metrics are already 1-minute); it collects no in-guest metrics, so enabling it does not provide memory or disk-space metrics.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c900c5864519", "source_question_ids": ["awssysops-p3-1-q779", "awssysops-p3-1-q842"], "statement": "Publishing data to CloudWatch Events (EventBridge) is not a mechanism for publishing metric data to CloudWatch.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c14ffcc81221", "source_question_ids": ["awssysops-p3-1-q779"], "statement": "CloudWatch Logs is not the standard way to publish OS memory metrics; the CloudWatch agent collects and publishes them as custom metrics (Logs yields metrics only indirectly, through metric filters or the Embedded Metric Format).", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS Organizations with Consolidated Billing enabled"], "confidence": "medium", "id": "cl-18025364a83a", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "For consolidated billing under AWS Organizations, billing alerts need to be enabled only once, in the payer (master) account's Billing and Cost Management console.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS Organizations with Consolidated Billing enabled"], "confidence": "medium", "id": "cl-56ddf081abd7", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "A CloudWatch billing alarm on the EstimatedCharges metric (us-east-1, management account) can publish to an SNS topic when consolidated charges exceed a threshold; AWS Budgets is the Billing-console alternative.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-162e1a375f0b", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "Setting up billing alerts and alarms separately per member account is unnecessary under consolidated billing and defeats its purpose.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b67bc515a0f4", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "CloudWatch billing alarms are created in CloudWatch, but the Billing and Cost Management console has its own alerting through AWS Budgets (and Cost Anomaly Detection), which can notify via email or SNS.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0b3928c2f93b", "source_question_ids": ["awssysops-p3-1-q809"], "statement": "AWS Health events report on AWS-side service issues, not an individual EC2 instance
