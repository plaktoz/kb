<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

 "medium", "id": "cl-96ecd2c3b395", "source_question_ids": ["awssysops-p1-q007"], "statement": "AWS Trusted Advisor can check service limits, such as the number of EC2 instances allowed per region, which may need to be raised ahead of a planned large increase in required capacity.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["Auto Scaling group's health check type is set to EC2 only"], "confidence": "high", "id": "cl-f3096f50a1b8", "source_question_ids": ["awssysops-p1-q008"], "statement": "An Auto Scaling group can be configured to use simple EC2 status checks only, or combined EC2-plus-ELB health checks; if only EC2 checks are used, the Auto Scaling group ignores ELB 'unhealthy' verdicts entirely.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["Auto Scaling group's health check type includes ELB"], "confidence": "high", "id": "cl-9021c6e1d856", "source_question_ids": ["awssysops-p1-q008"], "statement": "Adding the ELB health check type to an Auto Scaling group's health check configuration is what makes the group terminate and replace instances that the ELB has marked unhealthy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["Auto Scaling group's health check type is set to EC2 only"], "confidence": "medium", "id": "cl-158e9339e5f7", "source_question_ids": ["awssysops-p1-q008"], "statement": "Changing an Auto Scaling group's health check thresholds, changing the ELB health check interval, or switching the ELB's check protocol does not fix an Auto Scaling group ignoring ELB health-check verdicts when its health check type is set to EC2 only.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb168dcb42b2", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Internet Gateway (IGW) is inherently redundant/highly available at the VPC level, so adding a second IGW does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-364df7c366b0", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Elastic Load Balancer automatically spans multiple Availability Zones, so adding a second ELB does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b3aa5da8e2c", "source_question_ids": ["awssysops-p1-q010"], "statement": "A multi-AZ RDS instance already fails over automatically to a standby in a second Availability Zone, so it is not itself a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1360dcf4efc7", "source_question_ids": ["awssysops-p1-q010"], "statement": "In an architecture that already uses an IGW, an ELB spanning multiple AZs, and a multi-AZ RDS instance, there is no remaining single point of failure that needs to be fixed.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1fa7a765b651", "source_question_ids": ["awssysops-p1-q016"], "statement": "Subnets cannot span multiple Availability Zones; achieving coverage across N Availability Zones for a resource requires provisioning one subnet per AZ.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-33fbf0096616", "source_question_ids": ["awssysops-p1-q016"], "statement": "An ELB that must be distributed across multiple Availability Zones needs a subnet registered in each of those AZs, so an ELB distributed over 2 AZs requires two public subnets (one per AZ).", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6de4b10a3185", "source_question_ids": ["awssysops-p1-q016"], "statement": "RDS database instances should be placed in private subnets rather than public subnets so the database is not reachable from the internet.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-707b0eca29cb", "source_question_ids": ["awssysops-p1-q016"], "statement": "In a tiered VPC design with a public-facing ELB and a private database tier, the web/application servers should also be placed in private subnets rather than a public subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-89952f0a9ba0", "source_question_ids": ["awssysops-p1-q016"], "statement": "Whether a single public subnet is sufficient for an ELB distributed over 2 Availability Zones (versus requiring one public subnet per AZ) is disputed among exam commenters, since some argue a single ELB can already span multiple AZs from one subnet.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["web tier is stateless and CPU/memory-bound", "data tier is already well-provisioned and consistently fast"], "confidence": "high", "id": "cl-1e0ca1f2007d", "source_question_ids": ["awssysops-p1-q024"], "statement": "When a stateless, CPU/memory-bound web tier is the bottleneck and the data tier is already well-provisioned and fast, the fix is to horizontally scale the web tier (add instances behind an ELB) rather than changing the data tier.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b410fab982c", "source_question_ids": ["awssysops-p1-q024"], "statement": "DynamoDB is a managed, multi-AZ service, so there is no single Availability Zone to co-locate an EC2 instance with for latency benefits.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-73c60b053b9e", "source_question_ids": ["awssysops-p1-q024"], "statement": "Caching database responses or migrating the database engine does not address a compute-bound application bottleneck when the data tier is already fast.", "status": "supported"}, {"claim_type": "rule", "conditions": ["sticky sessions enabled on the ELB"], "confidence": "high", "id": "cl-1081779c8879", "source_question_ids": ["awssysops-p1-q053"], "statement": "When sticky sessions are enabled on an ELB, requests from a given user's session are pinned to one specific backend instance for the life of the session, so newly launched Auto Scaling instances receive no traffic from already-connected users.", "status": "supported"}, {"claim_type": "fact", "conditions": ["application uses long-lived connections such as long polling, Comet, or WebSockets"], "confidence": "high", "id": "cl-46b76b34dfff", "source_question_ids": ["awssysops-p1-q053"], "statement": "Long-lived connections such as long polling, Comet, or WebSockets stay pinned to whichever instance accepted them, so existing instances keep serving open connections instead of shedding load to newly launched instances.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-56fc13d41b2b", "source_question_ids": ["awssysops-p1-q053"], "statement": "An ELB's default, non-sticky behavior distributes requests across backend instances without pinning requests from a given user to one specific instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b90af849796b", "source_question_ids": ["awssysops-p1-q053"], "statement": "A browser failing to honor the TTL of an ELB's DNS name is a DNS-level failover issue, not a cause of load imbalance across already-resolved backend instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4bb8b4b60a62", "source_question_ids": ["awssysops-p1-q054"], "statement": "A zone apex (bare/root domain, e.g. example.com with no subdomain) cannot use a standard CNAME record, per the DNS specification, which permits only record types such as A, AAAA, NS, MX, and SOA at the zone apex.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-15ab26080946", "source_question_ids": ["awssysops-p1-q054"], "statement": "A plain A record is not a viable way to point a zone apex at an Elastic Load Balancer because the ELB's underlying IP addresses are not static.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2c5699aa5be8", "source_question_ids": ["awssysops-p1-q054"], "statement": "A Route 53 Alias record behaves like a CNAME, pointing to another DNS name such as an ELB's DNS name, while remaining legal at the zone apex and resolving to the ELB's current underlying IP addresses at query time, at no extra cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-75ad36ae1f72", "source_question_ids": ["awssysops-p1-q070"], "statement": "An Auto Scaling launch configuration is only a template/blueprint; AWS never charges for the launch configuration object itself.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-68102fad0835", "source_question_ids": ["awssysops-p1-q070"], "statement": "Deleting or keeping an Auto Scaling launch configuration around after its instances are terminated has no effect on the AWS bill.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-56db4374f2f1", "source_question_ids": ["awssysops-p1-q070"], "statement": "Unattached or unused EBS volumes continue to be billed, so deleting them once no longer needed reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6b92c595ea49", "source_question_ids": ["awssysops-p1-q070"], "statement": "An Elastic IP address that is allocated but not attached to a running instance is billed, so releasing it when not required reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ea1886242af2", "source_question_ids": ["awssysops-p1-q070"], "statement": "An idle Elastic Load Balancer with no instances behind it is still billed, so deleting it reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-98bd42dd341a", "source_question_ids": ["awssysops-p1-q076"], "statement": "ELB access logs, CloudWatch metrics, and CloudTrail API-call logging all capture observability information about load balancer activity, such as traffic patterns, request counts/latency, and configuration API calls.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cc4f5ee6c1a7", "source_question_ids": ["awssysops-p1-q076"], "statement": "ELB health checks are an internal mechanism the load balancer uses to decide which registered targets are healthy; they are an input to ELB's routing behavior, not an observability output for monitoring overall ELB activity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-18dbf6e5f388", "source_question_ids": ["awssysops-p1-q084"], "statement": "ELB connection draining can be toggled on or off at any time via either the EC2/ELB console or the CLI/API.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9d0d56d04579", "source_question_ids": ["awssysops-p1-q084"], "statement": "Disabling ELB connection draining does not require stopping any instances first.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fac4cf181f0f", "source_question_ids": ["awssysops-p1-q087"], "statement": "The source material's boxed answer states that creating an ELB with instances results in 2 default security groups being created, though community consensus and AWS documentation instead describe exactly one default security group per account (e.g. default_elb_id) that is reused by subsequent load balancers in the default VPC.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3d12dc34fa47", "source_question_ids": ["awssysops-p1-q093"], "statement": "Increasing an Auto Scaling group's desired capacity immediately triggers new instance launches up to that new desired count, and those instances register automatically with an attached ELB.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6727af50fbec", "source_question_ids": ["awssysops-p1-q093"], "statement": "Increasing an Auto Scaling group's maximum size only raises the ceiling the group is allowed to scale to; it does not by itself launch any new instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-becc00624e32", "source_question_ids": ["awssysops-p1-q093"], "statement": "Manually launching an instance and registering it with an ELB outside of Auto Scaling works operationally but is not using Auto Scaling to add the instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c7852471ee79", "source_question_ids": ["awssysops-p1-q093"], "statement": "Decreasing an Auto Scaling group's minimum limit allows the group to shrink rather than provisioning additional instances ahead of anticipated load.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-c908ed5db479", "source_question_ids": ["awssysops-p1-q095"], "statement": "When no custom connection draining timeout is configured on an ELB, connection draining defaults to allowing in-flight requests to continue for 300 seconds before forcibly closing connections to the deregistering instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8b89068e84e8", "source_question_ids": ["awssysops-p1-q095"], "statement": "3600 seconds is only the maximum connection draining timeout a user can configure for an ELB, not the default value.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-872a2168447d", "source_question_ids": ["awssysops-p1-q097", "awssysops-p2-q412", "awssysops-p1-q256"], "statement": "ELB sticky session (session affinity) pins a user's subsequent requests to the same backend EC2 instance where their session was first created; the first request is routed by the normal load-balancing algorithm and every later request from that user goes to the same instance for the life of the session.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-90f3ad800360", "source_question_ids": ["awssysops-p1-q097"], "statement": "ELB cross-zone load balancing only affects how traffic is distributed across Availability Zones; it does not provide per-user session affinity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3ad2063477cb", "source_question_ids": ["awssysops-p1-q097"], "statement": "'Cookie setup' describes an implementation detail that sticky sessions rely on (an application- or ELB-generated cookie), not the name of the sticky-session feature's enablement toggle itself.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-40d4cee63788", "source_question_ids": ["awssysops-p1-q097", "awssysops-p1-q146"], "statement": "ELB connection draining governs graceful instance deregistration behavior and is unrelated to session affinity (sticky sessions).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-6f199e65b744", "source_question_ids": ["awssysops-p1-q098"], "statement": "Route 53 DNS failover can provide redundancy for an ELB endpoint by failing over to a second, independent endpoint.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-403da5e71dca", "source_question_ids": ["awssysops-p1-q098"], "statement": "An ELB is already inherently highly available across multiple Availability Zones within a single region without any additional service.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-4084632746a0", "source_question_ids": ["awssysops-p1-q098"], "statement": "Auto Scaling is a plausible but incorrect answer for providing redundancy specifically to an ELB itself, as distinct from providing availability to the instances behind it.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-19b4553d03c7", "source_question_ids": ["awssysops-p1-q100"], "statement": "Deleting an ELB only deregisters its target instances and has no effect on the instances themselves; they keep running (and continue to incur their own EC2 charges) until separately stopped or terminated.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8c5c683aea9b", "source_question_ids": ["awssysops-p1-q100"], "statement": "Deleting a load balancer does not block on, prompt about, or terminate the instances registered with it.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-4a5569ec42ea", "source_question_ids": ["awssysops-p1-q118"], "statement": "A user can enable or disable Availability Zones/subnets for an existing load balancer at any time directly from the AWS console, 'on the fly', without needing to pre-create instances in the new zone or take the ELB offline.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-06a05311aa44", "source_question_ids": ["awssysops-p1-q118"], "statement": "For the question 'how can a user add more zones to an existing ELB', the source-boxed answer is 'launch instances in different zones and add to ELB', even though the recorded community vote and AWS's own ELB documentation point to the AZ-enablement console action ('add zones on the fly') as the more technically direct answer.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e452f2f837e1", "source_question_ids": ["awssysops-p1-q119"], "statement": "Elastic Load Balancing sends its full set of pre-selected metrics to CloudWatch at one-minute frequency for no additional charge, unlike EC2 instances, where the same one-minute frequency is called Detailed Monitoring and costs extra.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3a09fbad56e5", "source_question_ids": ["awssysops-p1-q120"], "statement": "ELB's DNS supports clients connecting over both IPv4 and IPv6 via a dualstack-prefixed DNS name.", "status": "needs-review"}, {"claim_type": "fact", "conditions": ["classic/application load balancer generation, pre-2020 NLB IPv6-backend feature"], "confidence": "low", "id": "cl-b02a54a81243", "source_question_ids": ["awssysops-p1-q120"], "statement": "For the classic/application load balancer generation, communication between the load balancer and back-end instances is always over IPv4; this changed with a 2020 Network Load Balancer feature that added IPv6 support for backend communication.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f9ea9a110fcb", "source_question_ids": ["awssysops-p1-q128", "awssysops-p1-q252"], "statement": "An ELB Security Policy is made up of exactly three components: the set of allowed SSL Protocols, the set of allowed SSL Ciphers, and the Server Order Preference option.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-93960ae077f4", "source_question_ids": ["awssysops-p1-q128"], "statement": "'Client Order Preference' is not a real, independently configurable component of an ELB security policy; it is simply the default behavior that occurs when Server Order Preference is left disabled.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3ca7a80a7347", "source_question_ids": ["awssysops-p1-q146", "awssysops-p1-q185"], "statement": "ELB connection draining stops sending new request traffic to an EC2 instance that is being deregistered (or has failed a health check) while allowing in-flight requests already sent to that instance to complete normally, up to a configurable timeout.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2b6e04601ccf", "source_question_ids": ["awssysops-p1-q146"], "statement": "'Deregistration check' and 'auto registration Off' are not real ELB features.", "status": "supported"}, {"claim_type": "default", "conditions": ["SSL/TCP listener configured end-to-end"], "confidence": "high", "id": "cl-9fa83e4827d5", "source_question_ids": ["awssysops-p1-q163"], "statement": "When an SSL/TCP listener is configured on both the ELB front end and the back-end instances, ELB passes the request through to the back-end instance without modifying its headers, unless Proxy Protocol is explicitly enabled.", "status": "supported"}, {"claim_type": "exception", "conditions": ["SSL/TCP listener (not HTTP/HTTPS)"], "confidence": "high", "id": "cl-b1b3befeb64f", "source_question_ids": ["awssysops-p1-q163"], "statement": "SSL/TCP listeners on ELB do not support ELB-managed sticky sessions, because sticky sessions are an HTTP/HTTPS-listener feature.", "status": "supported"}, {"claim_type": "rule", "conditions": ["EC2 status check reports 'impaired' or a status other than 'running'"], "confidence": "medium", "id": "cl-9031af5dded4", "source_question_ids": ["awssysops-p1-q176"], "statement": "When an Auto Scaling group's EC2 status check reports a status other than 'running' or reports 'impaired,' Auto Scaling marks the instance unhealthy and replaces it by terminating it and launching a new one.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["health check mechanism is an ELB health check rather than an EC2 status check"], "confidence": "medium", "id": "cl-aca8badc08d7", "source_question_ids": ["awssysops-p1-q176"], "statement": "When ELB health checks (rather than EC2 status checks) are in play, the ELB itself stops routing traffic to an unhealthy instance, which is a distinct mechanism from the EC2 status-check 'impaired' state.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2fdf7cd060d4", "source_question_ids": ["awssysops-p1-q183"], "statement": "AWS Classic Load Balancer (ELB) automatically re-registers EC2 back-end instances when they are stopped and later restarted, with no manual re-registration step needed, resuming routing once the instance is healthy again.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-022cae5152b2", "source_question_ids": ["awssysops-p1-q183"], "statement": "ELB tracks registered back-end instances by instance ID, not by IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-96a0dc47a67a", "source_question_ids": ["awssysops-p1-q183"], "statement": "There is no Elastic-IP-matching mechanism for ELB registration -- an instance getting the same Elastic IP back after a reboot is not what causes it to be registered with ELB.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-8f003cefa5a4", "source_question_ids": ["awssysops-p1-q185"], "statement": "The maximum configurable timeout for ELB connection draining is 3,600 seconds (1 hour); there is no way to configure a longer draining period, even if the application's own session timeout is longer.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b507ec3f30c", "source_question_ids": ["awssysops-p1-q187"], "statement": "ELB access log filenames follow the pattern {Bucket}/{Prefix}/AWSLogs/{AccountID}/elasticloadbalancing/{Region}/{Year}/{Month}/{Day}/{AccountID}_elasticloadbalancing_{Region}_{LoadBalancerName}_{EndTime}_{LoadBalancerIP}_{RandomString}.log, which includes the load balancer's IP, the S3 bucket name as path prefix, and a random string, but never the IP of any individual back-end EC2 instance.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application-controlled (not ELB-managed) cookie stickiness"], "confidence": "high", "id": "cl-0a2349c1623b", "source_question_ids": ["awssysops-p1-q191"], "statement": "When application-managed (not ELB-managed) cookie stickiness is used and the bound instance crashes or becomes unhealthy, ELB stops routing to it and the session stops being sticky until the application issues a fresh cookie on a subsequent response, at which point ELB begins tracking stickiness to the new instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["application-controlled (not ELB-managed) cookie stickiness"], "confidence": "medium", "id": "cl-4cb29a8fa34d", "source_question_ids": ["awssysops-p1-q191"], "statement": "ELB does not throw an error when a sticky-session cookie's bound instance is unavailable, and ELB never replicates application-generated cookies across instances -- with app-controlled stickiness the cookie's lifetime is entirely the application's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": ["end-user request already passes through a Proxy-Protocol-enabled upstream proxy"], "confidence": "high", "id": "cl-9106111f2bf9", "source_question_ids": ["awssysops-p1-q195"], "statement": "If an end user's request already comes through a Proxy-Protocol-enabled upstream proxy server, enabling Proxy Protocol on ELB as well causes ELB to append a second header on top of the one the upstream proxy already added, which can cause errors; the ELB admin should leave Proxy Protocol disabled on ELB in that case.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e3613dd92662", "source_question_ids": ["awssysops-p1-q195"], "statement": "ELB does support Proxy Protocol on TCP/SSL listeners configured on both the load balancer and the back-end instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-31674d9f3bc7", "source_question_ids": ["awssysops-p1-q195"], "statement": "Proxy Protocol on ELB is enabled via a real ELB policy (ProxyProtocolPolicyType), not via a config flag named 'isproxy'.", "status": "supported"}, {"claim_type": "fact", "conditions": ["as documented at time of writing; superseded by later predefined policy versions"], "confidence": "low", "id": "cl-2015d4e04c59", "source_question_ids": ["awssysops-p1-q202"], "statement": "ELBSecurityPolicy-2014-01 was, at the time this content was written, the named predefined ELB security policy documented as supporting Server Order Preference; AWS's predefined policies have since moved on to newer versions (e.g. ELBSecurityPolicy-2016-08 and later), so the specific policy name that currently supports Server Order Preference has shifted since this question was written.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-a37a18a1d610", "source_question_ids": ["awssysops-p1-q202"], "statement": "ELBSecurityPolicy-2011-08, ELBDefaultNegotiationPolicy, and ELBSample-OpenSSLDefaultCipherPolicy are real predefined ELB security policies, but none of them are documented as supporting Server Order Preference.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Server Order Preference enabled"], "confidence": "high", "id": "cl-6dcd077d047b", "source_question_ids": ["awssysops-p1-q202", "awssysops-p1-q252"], "statement": "When Server Order Preference is enabled on an ELB security policy, the load balancer selects the first cipher in its own list that also appears in the client's list, meaning the load balancer's cipher ordering (not the client's) determines the cipher used for the SSL connection.", "status": "supported"}, {"claim_type": "fact", "conditions": ["Classic Load Balancer security policies"], "confidence": "high", "id": "cl-b95a3d8046b9", "source_question_ids": ["awssysops-p1-q207"], "statement": "ELB's (Classic Load Balancer) documented security policies support TLS 1.2, TLS 1.1, TLS 1.0, SSL 3.0, and SSL 2.0, but do not support TLS 1.3.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-472e6a92f1dd", "source_question_ids": ["awssysops-p1-q221"], "statement": "Auto Scaling lets a user suspend one or more scaling processes on a group, which is the documented way to pause scaling activity temporarily (e.g., while investigating a configuration problem or memory leak) without losing the group's configuration.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f8e4555d4d95", "source_question_ids": ["awssysops-p1-q221"], "statement": "A paused Auto Scaling group can later resume normal scaling operation once the root cause of the issue being investigated is resolved.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Availability Zone rebalancing is occurring", "group is at or near its maximum capacity"], "confidence": "high", "id": "cl-bfeb8c26c1b0", "source_question_ids": ["awssysops-p1-q231"], "statement": "During Availability Zone rebalancing, Auto Scaling can temporarily exceed a group's specified maximum capacity by a margin of 10 percent or 1 instance, whichever is greater, so that new instances can launch before old ones terminate.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Terminate process is suspended", "Launch process remains active"], "confidence": "high", "id": "cl-fbde3f0ec3e3", "source_question_ids": ["awssysops-p1-q231"], "statement": "If a user suspends only the Auto Scaling Terminate process while leaving Launch active, AZRebalance stays active and keeps launching new instances for rebalancing but cannot terminate old instances, which can grow the group up to 10 percent larger than its configured maximum size until Terminate is resumed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-893f9fb5bf2d", "source_question_ids": ["awssysops-p1-q231"], "statement": "Suspending only the Terminate process while keeping Launch active is a supported configuration; it is not true that Launch and Terminate must always be suspended together.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-acd1d19a2043", "source_question_ids": ["awssysops-p1-q245"], "statement": "ELB supports exactly two SSL security policy types: Predefined Security Policy (a ready-made bundle of ciphers/protocols) and Custom Security Policy (user-configured).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-743b60ed14d6", "source_question_ids": ["awssysops-p1-q245"], "statement": "'Dynamic Security Policy' and 'Default Security Policy' are not real ELB security policy type names.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-912a746556dd", "source_question_ids": ["awssysops-p1-q247"], "statement": "The ELB CloudWatch metric HTTPCode_Backend_5XX reflects HTTP responses indicating back-end server-side errors from the registered instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-addbdabd122c", "source_question_ids": ["awssysops-p1-q247"], "statement": "The ELB CloudWatch metrics HTTPCode_Backend_2XX, HTTPCode_Backend_3XX, and HTTPCode_Backend_4XX represent successful, redirect/user-agent-action-required, and client-error responses respectively -- none reflect a back-end server-side problem.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3ed6c4bc3822", "source_question_ids": ["awssysops-p1-q252"], "statement": "'Cipher Protocol', 'Client Configuration Preference', and 'Load Balancer Preference' are not real ELB security policy settings.", "status": "supported"}, {"claim_type": "rule", "conditions": ["cookie not present in request"], "confidence": "high", "id": "cl-8a6f536a34a5", "source_question_ids": ["awssysops-p1-q256"], "statement": "The ELB sticky-session algorithm checks for a cookie in the incoming request first; if no cookie is found, ELB chooses an instance via its load-balancing algorithm and then inserts a new cookie in the response (sequence: check, not-found, choose-instance, insert-cookie).", "status": "supported"}, {"claim_type": "rule", "conditions": ["cookie present in request"], "confidence": "high", "id": "cl-8e209f60d20a", "source_question_ids": ["awssysops-p1-q256"], "statement": "The ELB sticky-session algorithm checks for a cookie in the incoming request first; if a cookie is found, ELB routes the request straight to the instance named in the cookie, with no new cookie insertion needed (sequence: check, found, route-to-instance).", "status": "supported"}, {"claim_type": "default", "conditions": ["HTTPS/SSL listener created without an explicit security policy"], "confidence": "high", "id": "cl-7e99c0bc349c", "source_question_ids": ["awssysops-p1-q277"], "statement": "When an HTTPS/SSL listener is created on ELB without an explicitly associated security policy, ELB automatically associates the latest version of the ELBSecurityPolicy-YYYY-MM policy, not the earliest version, and ELB creation does not fail nor skip having a policy altogether.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7b0848a332c3", "source_question_ids": ["awssysops-p1-q282"], "statement": "The CLI command to add/enable new Availability Zones for an existing ELB is elb-enable-zones-for-lb (classic CLI naming) / enable-availability-zones-for-load-balancer (modern AWS CLI); 'elb-add-zones-for-lb' and 'elb-configure-zones-for-lb' are not real commands.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AddToLoadBalancer process is suspended"], "confidence": "high", "id": "cl-5e5941c8e2a4", "source_question_ids": ["awssysops-p1-q287"], "statement": "Suspending the Auto Scaling AddToLoadBalancer process does not stop Auto Scaling from launching instances; it only stops newly-launched instances from being automatically registered with the attached ELB.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AddToLoadBalancer process was suspended when the instance launched"], "confidence": "high", "id": "cl-a24664b6506a", "source_question_ids": ["awssysops-p1-q287"], "statement": "Resuming the AddToLoadBalancer process only affects instances launched afterward; instances launched during the suspension period must be registered with the ELB manually.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-aa7c6919770a", "source_question_ids": ["awssysops-p1-q288"], "statement": "ELB access logs capture three timing fields: request processing time, backend processing time, and response processing time; 'front end processing time' is not one of the documented fields captured by ELB access logs.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-798336de128b", "source_question_ids": ["awssysops-p2-q305"], "statement": "AWS Elastic Beanstalk provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-49a2a4f2a510", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon EMR provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-21cd90768c4c", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon ElastiCache, Amazon RDS, and Elastic Load Balancing are fully managed services that give customers no direct access to the underlying compute instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-68490be234e9", "source_question_ids": ["awssysops-p2-q305"], "statement": "A claim that RDS lets customers 'retain administrative privileges' on its underlying EC2 instances is technically unsupported, since RDS is fully managed and customers get only a database endpoint rather than OS-level or root access to the host; this claim appeared in a dissenting minority vote.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-44845599197f", "source_question_ids": ["awssysops-p2-q318"], "statement": "Security groups allow all outbound traffic by default.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e61769123b58", "source_question_ids": ["awssysops-p2-q318"], "statement": "When a load balancer such as an ELB sits in front of web servers, security groups attached directly to the web servers see the load balancer's IP address as the traffic source, not the original client's IP address, unless the X-Forwarded-For header is used to recover and filter on the real client IP.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-53bf427147f8", "source_question_ids": ["awssysops-p2-q318"], "statement": "Configuring web server security groups to allow only customers' predefined IP addresses, together with configuring the web servers to filter traffic based on the ELB's X-Forwarded-For header, are two valid options for restricting a web application to accept traffic only from predefined customer IPs.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6d1856a4f4aa", "source_question_ids": ["awssysops-p2-q318"], "statement": "Because security groups are stateful, return traffic is automatically permitted regardless of outbound rules, making a security-group rule like \"deny all outbound\" effectively harmless to legitimate response traffic.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-079f0a682262", "source_question_ids": ["awssysops-p2-q318"], "statement": "Because network ACLs are stateless, an explicit \"deny all outbound\" rule on a NACL would actually block legitimate response traffic back to the client, unlike the equivalent rule on a stateful security group.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Evaluate Target Health set to true on a latency-based alias record"], "confidence": "low", "id": "cl-ab93efc4f10b", "source_question_ids": ["awssysops-p2-q327"], "statement": "On a Route 53 Latency Based Routing Record Set, setting the Evaluate Target Health flag to true makes Route 53 check for healthy resources in a region before routing traffic there, falling back to another region's healthy resources if the preferred region's resources are not healthy; per-ELB health checks alone, without this flag, do not wire that health signal into the latency routing decision.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d8342fd91257", "source_question_ids": ["awssysops-p2-q342", "awssysops-p2-q419", "awssysops-p2-q440", "awssysops-p2-q386"], "statement": "Elastic Load Balancing (ELB) distributes incoming traffic across multiple EC2 instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-41158e95ca0a", "source_question_ids": ["awssysops-p2-q342"], "statement": "RDS, an EC2 instance family name (e.g. M3), and a generic 'DB' target are not what Elastic Load Balancing distributes traffic across; ELB load-balances specifically across EC2 instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ceadae644519", "source_question_ids": ["awssysops-p2-q386", "awssysops-p2-q342"], "statement": "ELB acts as a single point of contact for clients and lets EC2 instances be added to or removed from it without disrupting the flow of requests.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4ac1cc0d40be", "source_question_ids": ["awssysops-p2-q386"], "statement": "EC2 instances can be added to or removed from an existing ELB at any time via the API, CLI, or AWS Management Console, without stopping the load balancer or editing any configuration file; there is no fixed maximum number of instances (such as five) that an ELB can hold.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2562eb8c6d6c", "source_question_ids": ["awssysops-p2-q397"], "statement": "A single Auto Scaling group can have multiple load balancers attached to it.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d169a5435f6e", "source_question_ids": ["awssysops-p2-q397"], "statement": "When a load balancer is attached to an Auto Scaling group, it automatically registers the group's instances and distributes traffic across them, without requiring Amazon AppStream or Amazon Redshift configuration.", "status": "supported"}, {"claim_type": "default", "conditions": ["sticky sessions not enabled"], "confidence": "high", "id": "cl-2cccfbd8e1b3", "source_question_ids": ["awssysops-p2-q412"], "statement": "By default, without sticky sessions enabled, ELB routes each request to whichever registered instance has the smallest load, rather than binding a user's requests to one specific instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cbfeadf69a2e", "source_question_ids": ["awssysops-p2-q412"], "statement": "Enabling a sticky session with ELB binds a user's session to one specific backend instance; it does not send that user's requests to multiple instances and does not route all requests to a single DNS name or provide one ELB DNS per IP address.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3a9186dec647", "source_question_ids": ["awssysops-p2-q419"], "statement": "ELB distributes incoming traffic across EC2 instances that may be registered across multiple Availability Zones; it is not restricted to distributing traffic exclusively within a single Availability Zone or exclusively across different Availability Zones.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-18956fa43f24", "source_question_ids": ["awssysops-p2-q440"], "statement": "'ELB' stands for 'Elastic Load Balancing', not 'Elastic Linux Box', 'Encrypted Load Balancing', or 'Encrypted Linux Box'.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-05fd47f6d5df", "source_question_ids": ["awssysops-p2-q518"], "statement": "The Action element of an IAM policy statement (or its complement NotAction) describes the specific action or actions that the statement allows or denies.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3ebe914fa656", "source_question_ids": ["awssysops-p2-q518"], "statement": "A policy statement in an IAM policy document is built from the Effect, Action, Resource, and optionally Condition elements; \"Key\" is not itself a statement-level element but a nested field inside a Condition block.", "status": "supported"}, {"claim_type": "fact", "conditions": ["clients must whitelist fixed public IP addresses"], "confidence": "medium", "id": "cl-6075e8bb1cc6", "source_question_ids": ["awssysops-p2-q546"], "statement": "Only a Network Load Balancer can be assigned static (Elastic) IP addresses per Availability Zone that never change; an Application Load Balancer's DNS name resolves to a rotating set of IPs and cannot be pinned to a static address, which matters when external clients need to whitelist fixed IPs in their firewalls.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa90c5fb2de0", "source_question_ids": ["awssysops-p2-q550"], "statement": "An ELB SpilloverCount metric greater than zero indicates requests have overflowed the load balancer's surge queue and are receiving 5xx errors.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ee932b379dc1", "source_question_ids": ["awssysops-p2-q550"], "statement": "The Classic ELB SurgeQueueLength metric measures how many requests are queued waiting for a healthy backend instance, with a maximum queue size of 1024 requests.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2bd98c3d8ad4", "source_question_ids": ["awssysops-p2-q550"], "statement": "Triggering Auto Scaling actions based on the ELB SurgeQueueLength metric lets new instances come online before the surge queue overflows, preventing SpilloverCount-related 5xx errors.", "status": "supported"}, {"claim_type": "fact", "conditions": ["ELB access logging is enabled"], "confidence": "high", "id": "cl-2c46ab1bb655", "source_question_ids": ["awssysops-p2-q559"], "statement": "Elastic Load Balancing access logs, once enabled, are delivered to a specified S3 bucket and record per-request details including client IP address, timestamp, and HTTP status code.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d8958da8c367", "source_question_ids": ["awssysops-p2-q559"], "statement": "Amazon S3 does not automatically keep a backup of application logs generated by EC2 instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-899eb03633ae", "source_question_ids": ["awssysops-p2-q559"], "statement": "AWS Trusted Advisor cannot be used to retrieve ELB access logs.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3617e2297249", "source_question_ids": ["awssysops-p2-q559"], "statement": "AWS Support cannot recover application logs from EC2 instances that have already been deleted.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bfd46963cb61", "source_question_ids": ["awssysops-p2-q562"], "statement": "A CNAME record cannot be set at a DNS zone apex (a bare domain like company.com) because the apex must also hold SOA/NS records, which cannot coexist with a CNAME record at the same name.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cbd3c67fad4a", "source_question_ids": ["awssysops-p2-q562"], "statement": "Route 53's ALIAS record is an AWS-proprietary record type that resolves like a CNAME but, unlike CNAME, is legal to use at a zone apex.", "status": "supported"}, {"claim_type": "rule", "conditions": ["target domain is a zone apex", "target is an AWS resource like an ALB"], "confidence": "high", "id": "cl-f865178e979a", "source_question_ids": ["awssysops-p2-q562"], "statement": "To point an apex domain (e.g., company.com) at an Application Load Balancer in Route 53, an ALIAS record should be used instead of a CNAME record.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8cd4b525f441", "source_question_ids": ["awssysops-p2-q562"], "statement": "SOA and TXT record types are not valid ways to point a domain name at an Application Load Balancer.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["application is memory-heavy"], "confidence": "medium", "id": "cl-d3f78161c259", "source_question_ids": ["awssysops-p2-q572"], "statement": "CPUUtilization is a poor metric to scale on when an application's actual bottleneck is memory rather than CPU.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7121b04afdc1", "source_question_ids": ["awssysops-p2-q572"], "statement": "MemoryUtilization is not a CloudWatch built-in metric for EC2 instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7672c65f43ed", "source_question_ids": ["awssysops-p2-q572"], "statement": "RequestCountPerTarget is a built-in Application Load Balancer target-tracking metric that measures load per instance regardless of whether CPU or memory is the actual constrained resource.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["load balancer is a Classic Load Balancer"], "confidence": "high", "id": "cl-b81edd8f16f8", "source_question_ids": ["awssysops-p2-q584"], "statement": "The AWS CLI command `aws elb set-load-balancer-listener-ssl-certificate` attaches or updates the SSL certificate on a Classic Load Balancer's HTTPS listener.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-21b7a2b73517", "source_question_ids": ["awssysops-p2-q584"], "statement": "AWS KMS has no 'modify-listener' API action, so it cannot be used to deploy a certificate to a load balancer listener.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d1fab8b959a5", "source_question_ids": ["awssysops-p2-q584"], "statement": "The EC2 API has no 'put-ssl-certificate' action, so it cannot be used to deploy a certificate to a load balancer listener.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-49080638cb96", "source_question_ids": ["awssysops-p2-q584"], "statement": "AWS Certificate Manager (ACM) manages certificates themselves but has no 'put-ssl-certificate' action for configuring a load balancer listener.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application authenticates users at the individual instance level"], "confidence": "high", "id": "cl-80d2e3edcd2d", "source_question_ids": ["awssysops-p3-1-q701"], "statement": "ELB sticky sessions (session affinity) bind a user's session to a specific backend instance so that all subsequent requests from that authenticated user are routed to the same instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-27c2c2ce7197", "source_question_ids": ["awssysops-p3-1-q701"], "statement": "ELB sticky sessions maintain affinity using either the load balancer's own AWSELB cookie or an application-generated session cookie.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9548b5e624e5", "source_question_ids": ["awssysops-p3-1-q701"], "statement": "ELB TCP listeners operate at the connection level and provide no session-aware routing, so they cannot pin a user to the same backend instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9a5dcc5f1e8f", "source_question_ids": ["awssysops-p3-1-q701"], "statement": "ELB connection draining only manages in-flight requests during instance deregistration; it does not provide session affinity for new requests.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-185d3c5999ee", "source_question_ids": ["awssysops-p3-1-q701"], "statement": "ELB cross-zone load balancing evenly distributes traffic across Availability Zones but does not pin a user's requests to a specific instance.", "status": "supported"}, {"claim_type": "rule", "conditions": ["enabling ELB access logging to an S3 bucket"], "confidence": "high", "id": "cl-533cfe4116d2", "source_question_ids": ["awssysops-p3-1-q799"], "statement": "An S3 bucket used to store Elastic Load Balancing access logs must be located in the same AWS Region as the load balancer.", "status": "supported"}, {"claim_type": "rule", "conditions": ["enabling ELB access logging to an S3 bucket"], "confidence": "high", "id": "cl-4262741e8fb2", "source_question_ids": ["awssysops-p3-1-q799"], "statement": "An S3 bucket used to store Elastic Load Balancing access logs must have a bucket policy granting the Elastic Load Balancing service principal permission to write the log objects to the bucket.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7e52bfb0b6dd", "source_question_ids": ["awssysops-p3-1-q799"], "statement": "Elastic Load Balancing access log objects are automatically encrypted with SSE-S3 regardless of the destination bucket's own encryption configuration.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-cfa1103ebb15", "source_question_ids": ["awssysops-p3-1-q799"], "statement": "Enabling encryption on the destination S3 bucket itself is not a mandatory requirement for ELB access logging to function, since the log objects are already automatically SSE-S3 encrypted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-591ed27c8c0c", "source_question_ids": ["awssysops-p3-1-q799"], "statement": "Lifecycle policies on the S3 bucket used for ELB access logs are good hygiene but are not a documented mandatory prerequisite for access logging to function.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5f61ac61e6c4", "source_question_ids": ["awssysops-p3-1-q799"], "statement": "Disabling public access on the S3 bucket used for ELB access logs is good hygiene but is not a documented mandatory prerequisite for access logging to function.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ea2901c2e382", "source_question_ids": ["awssysops-p3-1-q799", "awssysops-p3-1-q805"], "statement": "Application Load Balancers and Network Load Balancers are both load balancer types belonging to the single Elastic Load Balancing (ELB) service, so ELB-wide bucket-policy and access-log requirements apply to both.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2af9d4754f30", "source_question_ids": ["awssysops-p3-1-q805"], "statement": "Elastic Load Balancing access logs record each request's client IP address and the specific target (e.g., EC2 instance) that processed it, along with timing and response details.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-aa88ca3607d2", "source_question_ids": ["awssysops-p3-1-q805"], "statement": "Amazon CloudWatch provides aggregate metrics and does not record per-request client IP and target instance detail.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-accb812c0a40", "source_question_ids": ["awssysops-p3-1-q805"], "statement": "AWS CloudTrail logs AWS management-plane API activity, not application-layer HTTP request details.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-531139300dc1", "source_question_ids": ["awssysops-p3-1-q805"], "statement": "VPC Flow Logs capture network-layer IP/port metadata but do not record which specific instance's application code handled a given request behind a load balancer.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3e2686b448f6", "source_question_ids": ["awssysops-p3-1-q915"], "statement": "Exposing a Network Load Balancer as a VPC endpoint service (for PrivateLink) is an optional feature unrelated to the prerequisites for registering targets by IP address.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["registering targets by IP address"], "confidence": "medium", "id": "cl-54f5cb2ab20b", "source_question_ids": ["awssysops-p3-1-q915"], "statement": "To register a target by IP address with a load balancer's target group, the IP address must fall within the target group's VPC subnets or one of the private CIDR ranges 10.0.0.0/8, 100.64.0.0/10, 172.16.0.0/12, or 192.168.0.0/16.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-db6b369dc35a", "source_question_ids": ["awssysops-p3-1-q915"], "statement": "Listener security policies (e.g., ELBSecurityPolicy-TLS-1-2-Ext-2018-06) govern TLS negotiation on HTTPS/TLS listeners and have no bearing on whether an IP address is eligible for target registration.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-614e9788a648", "source_question_ids": ["awssysops-p3-1-q915"], "statement": "The health check Matcher setting defines which HTTP response codes count as healthy and has no bearing on whether an IP address is eligible for target registration.", "status": "supported"}, {"claim_type": "rule", "conditions": ["ALB health check uses a custom ping path", "ping path is missing on one backend server"], "confidence": "medium", "id": "cl-defc82c2ce20", "source_question_ids": ["awssysops-p3-1-q917"], "statement": "If an Application Load Balancer's health check uses a custom ping path that does not exist on one of its backend servers, the ALB marks that server unhealthy and stops routing traffic to it, which can make traffic appear to go to only one server.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-834eea6c1196", "source_question_ids": ["awssysops-p3-1-q917"], "statement": "A serve
