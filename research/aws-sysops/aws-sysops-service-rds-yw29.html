<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-rds", "exam": "aws-sysops", "facet": {"key": "service", "value": "rds"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b44c3d4ac551", "source_question_ids": ["awssysops-p1-q009", "awssysops-p1-q039"], "statement": "RDS provides built-in, user-configurable automated backups with a rotation/retention window out of the box, without needing an additional backup service.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6e6ff94b5027", "source_question_ids": ["awssysops-p1-q009"], "statement": "Amazon Redshift provides built-in, user-configurable automated backups with a rotation/retention window out of the box.", "status": "supported"}, {"claim_type": "default", "conditions": ["retention period not explicitly customized by the user"], "confidence": "high", "id": "cl-5cbeca3d481a", "source_question_ids": ["awssysops-p1-q009"], "statement": "RDS's default automated backup retention period is 7 days for a DB instance created in the console and 1 day for one created through the API or CLI; it can be set from 0 (disabled) to 35 days.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-0e012abb8be6", "source_question_ids": ["awssysops-p1-q009"], "statement": "S3 has no built-in automated backup-rotation setting of its own, but since 2022 AWS Backup can schedule, continuously back up, and retain backups of S3 buckets, so building your own versioning- or replication-based backup is no longer required.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["prior to mid-2018 / before Data Lifecycle Manager existed"], "confidence": "medium", "id": "cl-f5149488c779", "source_question_ids": ["awssysops-p1-q009", "awssysops-p1-q039"], "statement": "EBS snapshot rotation only became automatable via AWS Data Lifecycle Manager starting mid-2018, so before DLM existed EBS did not offer an out-of-the-box automated backup rotation option.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb168dcb42b2", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Internet Gateway (IGW) is inherently redundant/highly available at the VPC level, so adding a second IGW does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the ELB has a subnet enabled in each Availability Zone"], "confidence": "high", "id": "cl-9e7c6e9ed7b5", "source_question_ids": ["awssysops-p1-q010"], "statement": "An ELB spans only the Availability Zones you enable on it (one subnet per AZ); with a subnet enabled in each of multiple AZs it is already redundant, so adding a second ELB does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b3aa5da8e2c", "source_question_ids": ["awssysops-p1-q010"], "statement": "A multi-AZ RDS instance already fails over automatically to a standby in a second Availability Zone, so it is not itself a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": ["the web tier runs in an Auto Scaling group spanning multiple AZs", "the ELB has a subnet in each AZ"], "confidence": "medium", "id": "cl-0305ade11d31", "source_question_ids": ["awssysops-p1-q010"], "statement": "In an architecture with an IGW, an ELB with a public subnet in each AZ, a web tier in a multi-AZ Auto Scaling group, and a Multi-AZ RDS instance, there is no remaining single point of failure to fix.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-aa9aa216e4a2", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon CloudFront caches content (static assets, images, software patches, articles) at globally distributed edge locations, so repeat requests are served from the cache instead of hitting the origin, reducing origin load and lowering latency for end users during traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-80be965cb35f", "source_question_ids": ["awssysops-p1-q014"], "statement": "Adding Amazon RDS read replicas offloads read-only query traffic from the primary database instance, helping the database tier handle read-heavy traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-e3d33f110338", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon ElastiCache caches the most frequently accessed data in front of a relational database, reducing the number of queries that reach the database and thus its load.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c27b6dee478e", "source_question_ids": ["awssysops-p1-q014"], "statement": "SQS-based request queuing is designed for asynchronous write/processing workloads, not for synchronous, read-heavy page-view traffic such as serving article content.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-0996a48d74fb", "source_question_ids": ["awssysops-p1-q014"], "statement": "Using Route 53 health checks to fail over to a static S3 error page addresses availability optics but does not solve the underlying capacity/scaling pressure on the infrastructure.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1fa7a765b651", "source_question_ids": ["awssysops-p1-q016"], "statement": "Subnets cannot span multiple Availability Zones; achieving coverage across N Availability Zones for a resource requires provisioning one subnet per AZ.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-33fbf0096616", "source_question_ids": ["awssysops-p1-q016"], "statement": "An ELB that must be distributed across multiple Availability Zones needs a subnet registered in each of those AZs, so an ELB distributed over 2 AZs requires two public subnets (one per AZ).", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6de4b10a3185", "source_question_ids": ["awssysops-p1-q016"], "statement": "RDS database instances should be placed in private subnets rather than public subnets so the database is not reachable from the internet.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-707b0eca29cb", "source_question_ids": ["awssysops-p1-q016"], "statement": "In a tiered VPC design with a public-facing ELB and a private database tier, the web/application servers should also be placed in private subnets rather than a public subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-639585759f32", "source_question_ids": ["awssysops-p1-q016"], "statement": "A subnet lives in exactly one AZ, so an ELB using a single public subnet serves only that AZ; spanning 2 AZs needs one public subnet per AZ, so 'one public subnet is enough for the ELB' is wrong.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e36c863e72e9", "source_question_ids": ["awssysops-p1-q039"], "statement": "AWS Data Lifecycle Manager (DLM), launched in 2018, automates EBS snapshot creation and rotation without requiring custom scripting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3ae4fdc47859", "source_question_ids": ["awssysops-p1-q039"], "statement": "A CloudWatch alarm on low CPUUtilization with the built-in EC2 stop alarm action stops idle or underutilized EC2 instances without custom scripting, and Trusted Advisor and Compute Optimizer identify such instances.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9965bc4710ed", "source_question_ids": ["awssysops-p1-q039"], "statement": "Auto Scaling combined with an Elastic Load Balancer natively handles adding newly scaled EC2 instances to the load balancer, without needing custom scripts.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-2a51081cd872", "source_question_ids": ["awssysops-p1-q039"], "statement": "Whether scripting daily EBS snapshot creation with monthly rotation is still the best 'needs a script' admin task is disputed, since AWS Data Lifecycle Manager may have removed the need for scripting that specific task after the question was originally written.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-42831a96fc0d", "source_question_ids": ["awssysops-p1-q042"], "statement": "RDS automated backups enable point-in-time recovery by continuously backing up transaction logs in addition to the daily snapshot, allowing restoration to nearly any point within the retention window, often as recent as about 5 minutes before a mistake occurred.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ae1b8ae9fb7e", "source_question_ids": ["awssysops-p1-q042"], "statement": "A manual RDS snapshot only captures the database state at the moment the snapshot was taken, not necessarily a point closer to a later mistake.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-7adea0f8aff0", "source_question_ids": ["awssysops-p1-q042"], "statement": "Multi-AZ RDS protects against infrastructure failure, not application-level mistakes like a dropped table, because the synchronous standby replica also receives and contains the mistake.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4f88c255be37", "source_question_ids": ["awssysops-p1-q042"], "statement": "RDS read replicas mirror the primary database, including any accidental data-modifying mistakes made on the primary.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-958bcecd774d", "source_question_ids": ["awssysops-p1-q081", "awssysops-p1-q142"], "statement": "RDS event notifications are delivered through Amazon SNS: RDS publishes to an SNS topic when a supported event occurs, and users subscribe endpoints such as email, SMS, HTTP, or an SQS queue to that topic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6764aa9c27d9", "source_question_ids": ["awssysops-p1-q081"], "statement": "Amazon CloudWatch monitors metrics and logs and can alarm on thresholds, but it is not RDS's native event-notification transport mechanism.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d1e3f1c5aee9", "source_question_ids": ["awssysops-p1-q081"], "statement": "AWS CloudTrail records API calls and management events rather than RDS operational events, so it is not used for RDS event notifications.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-557ec82bd0f0", "source_question_ids": ["awssysops-p1-q081"], "statement": "AWS SES only sends email and is not RDS's event notification transport.", "status": "supported"}, {"claim_type": "fact", "conditions": ["event notification source type = db-snapshot"], "confidence": "high", "id": "cl-7f557708948c", "source_question_ids": ["awssysops-p1-q101"], "statement": "RDS event notifications for the db-snapshot source type cover the Creation, Deletion, and Restoration event categories.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-6cd9279f0f36", "source_question_ids": ["awssysops-p1-q101"], "statement": "'Backup' is an RDS event category that belongs to the db-instance source type, not the db-snapshot source type.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cbb0150c4e7f", "source_question_ids": ["awssysops-p1-q104"], "statement": "Multi-AZ RDS failover works by updating the DB instance's DNS record to point at the standby replica in another Availability Zone, while the application keeps using the same endpoint hostname throughout.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-99b86df2d309", "source_question_ids": ["awssysops-p1-q104"], "statement": "After a Multi-AZ RDS failover, the application requires no reconfiguration beyond re-establishing any already-open database connections.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e9e48b4ca231", "source_question_ids": ["awssysops-p1-q104"], "statement": "Multi-AZ RDS failover has no special internal-IP redirect mechanism; the switch to the standby is DNS-based, not IP-based.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3314781a1a60", "source_question_ids": ["awssysops-p1-q104"], "statement": "Multi-AZ RDS failover is automatic and does not require the user to manually trigger the switch to the standby.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b8f8e8427a6", "source_question_ids": ["awssysops-p1-q113"], "statement": "In a Multi-AZ DB instance deployment, one primary serves traffic and synchronously replicates to a standby that cannot serve reads; Multi-AZ DB cluster deployments (MySQL and PostgreSQL) instead have two readable standbys.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-67b2c94ab257", "source_question_ids": ["awssysops-p1-q113"], "statement": "Describing Multi-AZ RDS as running 'two DBs in parallel' with synchronous copying is a looser characterization that some read as implying both instances are equally active, though in practice only the primary serves the workload.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-055d0e002bd1", "source_question_ids": ["awssysops-p1-q113"], "statement": "Amazon RDS for SQL Server (MS SQL) does support the Multi-AZ feature.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-4bcb6bd7fc00", "source_question_ids": ["awssysops-p1-q142"], "statement": "RDS event subscriptions could once target the 'DB security group' source type, which applied only to EC2-Classic (retired in 2023); for today's VPC security groups, use an EventBridge rule on CloudTrail security-group API calls (or AWS Config) with SNS to be notified of changes.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1bd1adfcf039", "source_question_ids": ["awssysops-p1-q142"], "statement": "SNS cannot monitor security group changes by itself; it only delivers messages that another service, such as an RDS event subscription or EventBridge, publishes to it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1aaea230f356", "source_question_ids": ["awssysops-p1-q142"], "statement": "A CloudWatch alarm on an RDS DB instance does not observe DB security group configuration changes.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-b17544cc3a16", "source_question_ids": ["awssysops-p1-q155"], "statement": "IAM policies are attached to IAM identities (users, groups, or roles) to grant permissions on AWS services; they cannot be attached directly to an RDS instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b1e7ef3cb04d", "source_question_ids": ["awssysops-p1-q155"], "statement": "By default, IAM permissions to manage RDS through the AWS API are separate from database-engine logins; the exception is IAM database authentication (MySQL, MariaDB, PostgreSQL), where an IAM policy granting rds-db:connect controls the DB login.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-833e36233d41", "source_question_ids": ["awssysops-p1-q155"], "statement": "To grant a user access to RDS, the root account owner should create an IAM user and attach a policy granting that IAM user access to RDS management actions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-422bbae16846", "source_question_ids": ["awssysops-p1-q156"], "statement": "Synchronous replication to the standby in a Multi-AZ RDS deployment can be an underlying cause of elevated latency.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-cd89953a9ada", "source_question_ids": ["awssysops-p1-q156"], "statement": "Using Provisioned IOPS (PIOPS) can help mitigate latency issues in a Multi-AZ RDS deployment by providing consistent, low-latency I/O under synchronous replication.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-9072ab971620", "source_question_ids": ["awssysops-p1-q156"], "statement": "Using a larger DB instance class can help mitigate latency issues in a Multi-AZ RDS deployment.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-92cab3cccf50", "source_question_ids": ["awssysops-p1-q156"], "statement": "Scheduling automated backups outside peak/non-working hours can help mitigate latency in a Multi-AZ RDS deployment, since backups on a Multi-AZ instance are taken from the standby and can otherwise coincide with other load.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-251e9db16edc", "source_question_ids": ["awssysops-p1-q156"], "statement": "Whether taking a snapshot from the standby replica helps with Multi-AZ write-latency issues is disputed: the source's boxed answer treats it as not helping since it is a read-only operation against the replica rather than a write-path change, but the community vote was split three ways with no majority.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["user has not explicitly configured a maintenance window"], "confidence": "high", "id": "cl-eeaea36526dc", "source_question_ids": ["awssysops-p1-q169"], "statement": "Every RDS instance always has a maintenance window; if the user never explicitly sets one, AWS randomly assigns a 30-minute window from an 8-hour regional block on a random day of the week.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c5e716df1e42", "source_question_ids": ["awssysops-p1-q169"], "statement": "An unset/default RDS maintenance window does not block or prevent a requested DB instance-class change.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d7bc41964095", "source_question_ids": ["awssysops-p1-q169"], "statement": "AWS does not prompt the user to specify a maintenance window at update time; it simply uses whatever window (default or custom) is already in effect.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c0bd9d7fa8ed", "source_question_ids": ["awssysops-p1-q175"], "statement": "RDS Multi-AZ provides automatic failover for an Availability Zone outage, a primary DB instance failure, a DB instance server-type/class change, software patching, and a manual reboot-with-failover.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-3138383b806a", "source_question_ids": ["awssysops-p1-q175"], "statement": "The Multi-AZ standby is provisioned in ures reported by the web application.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-df3ba2185915", "source_question_ids": ["awssysops-p2-q582"], "statement": "A TLS trust failure can cause 'Error Establishing a Database Connection' when the application's trust store lacks the RDS CA certificate that signed the DB instance's server certificate, as happened during the 2020 RDS CA rotation (rds-ca-2019).", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d03357538127", "source_question_ids": ["awssysops-p2-q592"], "statement": "RDS automated backups with point-in-time recovery can have a retention period configured up to 35 days.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-f0be531e0622", "source_question_ids": ["awssysops-p2-q592"], "statement": "RDS automated backups cost only the underlying S3 backup storage, making them a low-cost data-protection option.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-e8c14270e271", "source_question_ids": ["awssysops-p2-q592"], "statement": "RDS Multi-AZ and read replicas replicate data, including table corruption, to the standby or replica in near real time, so neither protects against corruption discovered days later.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-fdebb5df1248", "source_question_ids": ["awssysops-p2-q592"], "statement": "'Versioning' is not a real feature of Amazon RDS.", "status": "supported"}, {"claim_type": "rule", "conditions": ["existing RDS instance not currently Multi-AZ"], "confidence": "high", "id": "cl-6da208c05063", "source_question_ids": ["awssysops-p3-1-q605"], "statement": "Multi-AZ can be enabled on an already-running RDS instance by modifying the instance, via console, CLI, or API, to include the Multi-AZ option, without creat nce": "high", "id": "cl-9cc9fe4ecfce", "source_question_ids": ["awssysops-p3-1-q748"], "statement": "AWS Database Migration Service (AWS DMS) is a data-migration and replication service and has no role in scaling an existing RDS instance's compute capacity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a9a4687a7bc9", "source_question_ids": ["awssysops-p3-1-q748"], "statement": "Enabling Multi-AZ on an RDS instance provides failover and availability, not additional compute headroom, so it does not resolve a CPU-utilization bottleneck.", "status": "supported"}, {"claim_type": "fact", "conditions": ["applying the Multi-AZ conversion outside of business hours"], "confidence": "medium", "id": "cl-402cbf27afbd", "source_question_ids": ["awssysops-p3-1-q762"], "statement": "Amazon RDS supports converting an existing DB instance to a Multi-AZ deployment in place via a modify action, which can be scheduled to apply outside business hours.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b29dd958b89b", "source_question_ids": ["awssysops-p3-1-q762"], "statement": "Converting an existing RDS instance to Multi-AZ in place provides automatic-failover high availability without creating a separate instance or migrating any data.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-158a50840442", "source_question_ids": ["awssysops-p3-1-q762"], "statement": "Creating an entirely new Multi-AZ RDS instance, migrating data to it, and deleting the old instance is a heavier and riskier approach to achieving high availability than simply modifying the existing instance to Multi-AZ.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fb4fecbfe056", "source_question_ids": ["awssysops-p3-1-q762"], "statement": "An RDS read replica does not provide the same synchronous, automatic-failover high availability that a Multi-AZ deployment provides.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ea57fb2f178a", "source_question_ids": ["awssysops-p3-1-q762"], "statement": "Contacting AWS Support to \"pre-warm\" a database is not a real, documented Amazon RDS high-availability mechanism.", "status": "supported"}, {"claim_type": "rule", "conditions": ["a resource-intensive reporting job is causing contention on the primary RDS instance"], "confidence": "high", "id": "cl-6280ce70cdbf", "source_question_ids": ["awssysops-p3-1-q775"], "statement": "Offloading a resource-intensive reporting job to an Amazon RDS read replica moves that read workload off the primary instance, freeing the primary to serve other applications at normal speed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-00e6aac8c274", "source_question_ids": ["awssysops-p3-1-q775"], "statement": "Amazon RDS backups do not run queries and have no effect on live read load.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-cd7de61d6c58", "source_question_ids": ["awssysops-p3-1-q775"], "statement": "In a Multi-AZ DB instance deployment the standby does not serve reads, so it provides failover rather than read scaling; Multi-AZ DB clusters, by contrast, have two readable standbys.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4a3483b099fc", "source_question_ids": ["awssysops-p3-1-q775"], "statement": "Amazon RDS automatic host replacement addresses hardware failure recovery, not workload contention.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-17a7f86d3ab4", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "Aurora MySQL is wire-compatible with MySQL, so after the data is migrated (dump/restore, DMS, or binlog replication) the application usually needs only a new connection endpoint.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b8998638a207", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "Amazon Aurora provides built-in multi-AZ durability and read-replica-based availability.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-30fa62e4695e", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "Migrating a MySQL database to an Amazon RDS Microsoft SQL Server instance moves to a different database engine with a different SQL dialect, drivers, and feature set, representing a larger application change than migrating to a MySQL-compatible service.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9f6cc10938ab", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "Amazon RDS for Microsoft SQL Server does not support the Aurora engine.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7b7666db7e34", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "Self-managing multi-AZ replication inside a single EC2 instance is not a real supported configuration.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["backups are copied on a fixed interval such as every 30 minutes"], "confidence": "high", "id": "cl-3055bfca6b54", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "A manual cron-based backup-and-copy scheme between EC2 instances can lose up to 30 minutes of data and requires manual failover steps, providing neither true high availability nor durability.", "status": "supported"}, {"claim_type": "rule", "conditions": ["the snapshot is an automated RDS snapshot"], "confidence": "medium", "id": "cl-ce9dd33f363b", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "Automated Amazon RDS snapshots cannot be shared or copied directly to another AWS account.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["sharing an automated RDS snapshot with another AWS account"], "confidence": "medium", "id": "cl-ff1c4053464e", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "To share an automated RDS snapshot with another account, first copy it to a manual snapshot (copy-db-snapshot), or take a new manual snapshot with create-db-snapshot, then share the manual snapshot.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["the source snapshot is still an automated snapshot that has not been converted to a manual snapshot"], "confidence": "medium", "id": "cl-feb81ca4dc23", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "The copy-db-snapshot command's cross-account copy capability applies to manual (or already-shared) snapshots, not to automated snapshots directly.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e6e3b1465e14", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "RDS for MySQL read replicas cannot be created in a different AWS account, so a cross-account read replica is not an option; even a same-account replica is a continuously running instance that costs more than a periodic snapshot copy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5518f22ec54e", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "Using AWS DMS to replicate data to a second live RDS instance in another account requires running and paying for an additional continuously-on database instance, making it less cost-effective than a periodic snapshot copy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a11479b3b188", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "A storage failure on the primary Amazon RDS database instance is a documented trigger for automatic Multi-AZ failover.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7942b4e12654", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "A change to the DB instance's server or instance type is a documented trigger for automatic Multi-AZ failover, per the AWS RDS FAQ.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["long-running queries", "deadlocks", "database corruption errors"], "confidence": "medium", "id": "cl-5fbfc8f16102", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "AWS RDS Multi-AZ deployments do not fail over automatically in response to database operations such as long-running queries, deadlocks, or database corruption errors, per the AWS RDS FAQ.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-528b288839e7", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "Read contention on a database is a performance/locking condition, not a documented Multi-AZ automatic-failover trigger.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1a5ca635ddbd", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "Write contention on a database is a performance/locking condition, not a documented Multi-AZ automatic-failover trigger.", "status": "supported"}, {"claim_type": "fact", "conditions": ["function code calls the SQS API directly (not via an SQS event source mapping)", "VPC has no internet or NAT path"], "confidence": "medium", "id": "cl-1b859849db5b", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When Lambda function code in a VPC with no internet access calls the SQS API itself, it needs an SQS interface VPC endpoint to reach the queue; an SQS event source mapping does not, because the Lambda service polls the queue outside the function's VPC.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-eabfc6c47e91", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "An RDS instance's security group must explicitly allow inbound connections from the Lambda function's security group or elastic network interface, or writes from Lambda to RDS will silently fail.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-59ac86f401fe", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When a Lambda function and an RDS instance are located in the same VPC, no VPC endpoint is needed for the RDS traffic between them.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f34aafa5d9c0", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A NAT gateway's presence or absence has no bearing on intra-VPC connectivity between a Lambda function and an RDS instance in the same VPC.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b273a9a19c4b", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A missing internet gateway on a Lambda function's subnet has no bearing on data reaching RDS when the Lambda-to-RDS workflow occurs entirely within the VPC and requires no outbound internet access.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-0c850204c75d", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When a question's community vote credibly and substantially contradicts or splits from the given boxed answer, the question is flagged as disputed for triage while the boxed answer is nonetheless retained per the ingestion policy.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6431bf9553cd", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "Amazon RDS abstracts away direct volume management, so there is no user-facing operation to copy the data volumes of an RDS instance the way one would copy raw EBS volumes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9f7e281823fd", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "An existing unencrypted Amazon RDS instance cannot be encrypted in place.", "status": "supported"}, {"claim_type": "rule", "conditions": ["encrypting an existing unencrypted RDS instance"], "confidence": "medium", "id": "cl-25bcd09edee2", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "The documented method to encrypt an existing unencrypted RDS instance is to take a snapshot of it, create an encrypted copy of that snapshot using a KMS key, and restore a new instance from the encrypted snapshot copy.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-60619375fc51", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "An RDS read replica inherits the encryption status of its source instance and cannot itself be selectively encrypted.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-12900d9c0cb0", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "The modify-db-instance command cannot add encryption to an already-existing, unencrypted RDS instance, because encryption can only be set at creation or restore time, not toggled on afterward.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-rds--m-1", "title": "RDS keeps three kinds of copy, and each one fixes a different problem", "purpose": "Most RDS questions describe a problem and ask which mechanism fixes it. The problem might be an AZ or host failure, read-heavy load, an accidental data mistake, or an encryption or sharing need. Working out which copy (or which managed control) acts on that problem lets you pick the right answer and rule out the look-alikes.", "mechanism": "RDS is a managed database. AWS provisions the host, installs and patches the engine, and runs it during a maintenance window. You never get OS access, an attachable EBS volume, or a console checkbox for host-level tasks. Instead, RDS gives you three copy mechanisms, and each covers a different threat. (1) Multi-AZ keeps a standby in a second AZ of the same region. Every write is replicated to it synchronously, and the standby serves no reads. When the primary fails (AZ outage, instance or storage failure, instance-class change, patching, reboot with failover), RDS moves the endpoint's DNS CNAME to the standby automatically. The app keeps the same hostname and only reconnects. No IP moves and nothing is rebooted in place. (2) Read replicas are separate copies, replicated asynchronously, that you read from. They offload reads such as reporting and analytics. They do not fail over automatically, and they do not relieve CPU load caused by writes. (3) Automated backups take a daily snapshot and also keep transaction logs. That allows point-in-time restore to any moment in a retention window of 0-35 days. A manual snapshot only captures the moment it was taken. Multi-AZ and replicas copy everything, including a dropped table or corrupt rows, so only backups and PITR undo a logical mistake. Encryption follows the same 'you can't reach in' rule: you set it at creation or restore time. To encrypt an existing instance you snapshot it, copy the snapshot with encryption, and restore. Replicas and the standby inherit the source's encryption setting.", "predict_prompt": "A developer drops a production table at 14:02 on a Multi-AZ RDS instance that also has two read replicas. Which copy can get the table back, and to what time?", "invariants": ["Multi-AZ is synchronous, keeps the standby in the same region, serves no reads, fails over automatically by flipping the DNS CNAME, and keeps the endpoint name unchanged.", "Read replicas are asynchronous and readable. They scale reads, but they are not an automatic-failover HA pair.", "Anything replicated, whether to the standby or to a replica, also carries the mistake or the corruption. Only backups and PITR rewind time.", "Standard RDS gives no OS, SSH, or EBS-volume access, so any answer that requires installing something on the host or touching its volumes is wrong.", "You can't turn on encryption at rest in place. Use snapshot, encrypted copy, then restore."], "limits": ["Multi-AZ does not protect against a region-wide outage.", "Multi-AZ DB cluster deployments (MySQL and PostgreSQL) have two readable standbys. That differs from the classic Multi-AZ DB instance, whose standby can't be read.", "RDS for SQL Server implements Multi-AZ with native Mirroring or Always On, not Amazon's replication technology.", "Multi-AZ does not fail over on long-running queries, deadlocks, or read/write contention.", "RDS Custom is the exception that allows OS-level access."], "cues": ["'Automatic failover', 'AZ outage', 'same endpoint after failure' -> Multi-AZ.", "'Read-heavy', 'reporting job slows the primary', 'offload analytics' -> read replica (or ElastiCache for repeated cacheable reads).", "'Dropped table', 'corruption found days later', 'restore to 5 minutes before' -> automated backups / PITR.", "'CPU at 100% from writes' -> scale up the instance class, not replicas or Multi-AZ.", "'Encrypt an existing DB' -> snapshot, copy with KMS, restore."], "claim_ids": ["cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-99b86df2d309", "cl-a3ed621071d0", "cl-b68b0709215a", "cl-c0bd9d7fa8ed", "cl-a11479b3b188", "cl-3138383b806a", "cl-5b8f8e8427a6", "cl-c8dc36002174", "cl-b25f6d83421f", "cl-14abe5b82c2f", "cl-1b6f76a42065", "cl-6280ce70cdbf", "cl-64f43484fb60", "cl-8cdcf9f2e8e0", "cl-42831a96fc0d", "cl-ae1b8ae9fb7e", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-e8c14270e271", "cl-d03357538127", "cl-5cbeca3d481a", "cl-dbbe35cba981", "cl-59dc6d6003c5", "cl-6431bf9553cd", "cl-f87645bb51c4", "cl-25bcd09edee2", "cl-60619375fc51", "cl-6f26c20dd5bc", "cl-9a5722387c1f", "cl-5fbfc8f16102", "cl-4d612d8478c3"]}, "contrastSet": {"id": "aws-sysops-service-rds--cs-1", "subjects": ["Multi-AZ deployment", "Read replica", "Automated backups / point-in-time restore"], "dimensions": ["Primary threat addressed", "Replication timing", "Serves reads?", "Failover behavior", "Carries a logical mistake / corruption?", "Scope"], "shared_traits": ["All three are RDS-managed and need no OS access or custom scripting.", "All three hold a copy of the primary's data.", "Replicas and the standby inherit the source instance's encryption setting."], "matrix": {"Primary threat addressed": {"Multi-AZ deployment": "AZ, host, or storage failure; patching downtime", "Read replica": "Read load / workload contention on the primary", "Automated backups / point-in-time restore": "Accidental data change, dropped table, corruption"}, "Replication timing": {"Multi-AZ deployment": "Synchronous", "Read replica": "Asynchronous", "Automated backups / point-in-time restore": "Daily snapshot + continuous transaction logs"}, "Serves reads?": {"Multi-AZ deployment": "No (DB instance standby is not readable)", "Read replica": "Yes", "Automated backups / point-in-time restore": "No; only after restore to a new instance"}, "Failover behavior": {"Multi-AZ deployment": "Automatic DNS CNAME flip, same endpoint", "Read replica": "No automatic failover", "Automated backups / point-in-time restore": "Manual restore with downtime"}, "Carries a logical mistake / corruption?": {"Multi-AZ deployment": "Yes, replicated immediately", "Read replica": "Yes, mirrored", "Automated backups / point-in-time restore": "No; can restore to just before it (retention up to 35 days)"}, "Scope": {"Multi-AZ deployment": "Second AZ in the same region only", "Read replica": "Separate instance with its own endpoint", "Automated backups / point-in-time restore": "Within the retention window"}}, "decision_rule": "Ask which threat the question is guarding against. Infrastructure failure that needs automatic recovery on the same endpoint calls for Multi-AZ. Too much read load on the primary calls for a read replica. Bad data that has to be rewound to an earlier moment calls for automated backups / PITR.", "boundary_flip": "Take a scenario where the primary DB instance became unresponsive after an AZ outage. Multi-AZ is the answer. Now change the cause: an operator ran DROP TABLE, and the standby and replicas received the drop instantly. The answer flips to point-in-time restore from automated backups. If you change it instead to 'a nightly reporting job slows the primary', the answer flips to a read replica.", "strongest_distractor_failure": "Picking a read replica when the question needs high availability. Replicas are asynchronous and don't fail over automatically. Picking Multi-AZ when the question needs read offloading. The Multi-AZ DB instance standby serves no reads and adds no compute headroom.", "exceptions": ["Multi-AZ DB cluster deployments (MySQL and PostgreSQL) have two readable standbys, so 'the standby serves no reads' applies only to Multi-AZ DB instances.", "If CPU is saturated by writes, neither replicas nor Multi-AZ help. Scale up the instance class.", "Multi-AZ does not cover a region-wide outage."], "claim_ids": ["cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-a3ed621071d0", "cl-b25f6d83421f", "cl-dc0236c1db20", "cl-f78cd916c0de", "cl-fb4fecbfe056", "cl-776a40463715", "cl-cd7de61d6c58", "cl-c8dc36002174", "cl-14abe5b82c2f", "cl-1b6f76a42065", "cl-6280ce70cdbf", "cl-42831a96fc0d", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-e8c14270e271", "cl-d03357538127", "cl-0e30b32d12fa", "cl-a9a4687a7bc9", "cl-64f43484fb60", "cl-8cdcf9f2e8e0", "cl-3138383b806a", "cl-60619375fc51", "cl-6f26c20dd5bc"]}, "scenarioFamily": {"id": "aws-sysops-service-rds--sf-1", "canonical": {"prompt": "A production Amazon RDS MySQL DB instance runs as a Multi-AZ deployment and also has two read replicas used for reporting. At 14:02 an operator accidentally runs DROP TABLE on a critical orders table. The DBA needs to recover the table's data from just before the mistake. Which RDS capability should the DBA use to recover, and why don't the Multi-AZ standby or the read replicas help here?", "expected_answer": ["Use RDS automated backups with point-in-time recovery (PITR) to restore a new DB instance to a moment just before 14:02 (e.g., 14:01), then recover the orders table's data from it."], "reasoning": "RDS automated backups combine a daily snapshot with continuous transaction logs, which allows restoring to nearly any point in the retention window (up to 35 days), including a moment right before the DROP TABLE. The Multi-AZ standby is a synchronous replica of every write, so it received and applied the DROP TABLE just like the primary; it protects against infrastructure failure, not logical mistakes. The two read replicas are asynchronous mirrors of the primary and likewise reproduce the dropped table almost immediately. A manual snapshot would only help if one happened to exist from before 14:02; it is not a general PITR mechanism. So only automated backups / PITR can rewind to a point in time before the mistake.", "distractor_analysis": "A DBA might reach for 'fail over to the Multi-AZ standby' because that is the usual RDS high-availability move, but failover only addresses the primary becoming unreachable, not bad data that was already replicated. Promoting a read replica is similarly tempting since replicas are separate, queryable instances, but they mirror the primary's writes (including the DROP TABLE) and so would also show the table missing. Both are 'copy' mechanisms built for infrastructure failure, not for undoing a logical mistake, which only automated backups with PITR can do.", "claim_ids": ["cl-42831a96fc0d", "cl-ae1b8ae9fb7e", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-d03357538127", "cl-5b3aa5da8e2c", "cl-1b6f76a42065"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The cause of the outage changes from an operator's accidental DROP TABLE (a logical data mistake) to an Availability Zone outage that takes down the network path to the primary instance, with no data corruption or data loss involved.", "prompt": "The same production Amazon RDS MySQL DB instance runs as a Multi-AZ deployment with two read replicas. This time there is no accidental DROP TABLE. Instead, the Availability Zone hosting the primary instance suffers an outage and the primary becomes unreachable, with the data itself intact. What should happen to restore service, and how is that different from recovering a dropped table?", "expected_answer": ["RDS automatically fails over the Multi-AZ deployment: it updates the DB instance's DNS endpoint (CNAME) to point at the standby in the other Availability Zone, and the application keeps using the same hostname with no manual intervention or restore needed."], "reasoning": "An Availability Zone outage is exactly the kind of infrastructure failure Multi-AZ is built for: the synchronous standby in a second AZ is unaffected by the outage and already holds a current copy of the data (nothing was corrupted), so RDS can flip the DNS CNAME to it automatically. This is a boundary flip from the canonical scenario: because the problem changed from 'bad data was replicated everywhere' to 'the primary host is unreachable but the data is fine,' the correct mechanism flips from automated backups/PITR (which would be slow and unnecessary here) to Multi-AZ automatic failover (which would have been useless for the dropped-table case).", "distractor_analysis": "Reaching for point-in-time restore here would be the wrong move: PITR solves bad data, not an unreachable host, and would involve restoring to a new instance and reconnecting the application, far slower than an automatic DNS failover that already exists for this exact trigger.", "claim_ids": ["cl-c0bd9d7fa8ed", "cl-cbb0150c4e7f", "cl-5b3aa5da8e2c", "cl-42831a96fc0d"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "Two irrelevant details are added: the DB instance is encrypted at rest with a customer managed KMS key, and one of the two read replicas is a cross-region replica rather than same-region. Nothing about the DROP TABLE or the recovery goal changes.", "prompt": "A production Amazon RDS MySQL DB instance runs as a Multi-AZ deployment, is encrypted at rest with a customer managed KMS key, and has two read replicas for reporting, one of which is a cross-region replica. At 14:02 an operator accidentally runs DROP TABLE on a critical orders table. The DBA needs to recover the table's data from just before the mistake. Which RDS capability should the DBA use, and do the encryption setting or the replica's region change the answer?", "expected_answer": ["Use RDS automated backups with point-in-time recovery (PITR) to restore a new DB instance to a moment just before 14:02 (e.g., 14:01), then recover the orders table's data from it."], "reasoning": "Encryption at rest and the geographic location of a read replica are orthogonal to the recovery mechanism: both the local and the cross-region read replica are still asynchronous mirrors of the primary's writes, so both received the DROP TABLE regardless of region. Likewise, encryption governs how the data is stored, not how writes propagate, so an encrypted instance still needs PITR to rewind a logical mistake just like an unencrypted one would. The restored instance from the PITR snapshot inherits the same encryption setting as the source.", "distractor_analysis": "A test-taker might think the cross-region replica changes the answer (e.g., 'promote the distant replica since it's isolated from the AZ'), but replication topology, not geography, determines whether a mistake was mirrored; an asynchronous replica in any region still receives the same stream of writes and would show the table as dropped too.", "claim_ids": ["cl-42831a96fc0d", "cl-ae1b8ae9fb7e", "cl-4f88c255be37", "cl-d03357538127", "cl-7adea0f8aff0", "cl-60619375fc51"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "The scenario and the mistake are unchanged, but the DBA now proposes a specific alternative fix: promote one of the two read replicas to be a standalone instance and treat it as the recovered database, instead of using point-in-time restore.", "prompt": "Same scenario: a Multi-AZ RDS MySQL instance with two read replicas, and an operator's DROP TABLE at 14:02. The on-call DBA suggests simply promoting one of the read replicas to a standalone primary and using it as the recovered database, reasoning that it is 'a separate copy of the data.' Will this recover the dropped table? What should the DBA do instead?", "expected_answer": ["Use RDS automated backups with point-in-time recovery (PITR) to restore a new DB instance to a moment just before 14:02 (e.g., 14:01), then recover the orders table's data from it."], "reasoning": "Promoting a read replica will not recover the table: read replicas are asynchronous mirrors of the primary's writes, so the DROP TABLE statement was replicated to them almost immediately after it ran on the primary. Promoting one simply yields another standalone instance that is also missing the table. The DBA still needs automated backups with point-in-time recovery, which can roll the database state back to a moment before the DROP TABLE occurred, something no live replica (synchronous or asynchronous) can do because every live replica mirrors the mistake.", "distractor_analysis": "The DBA's proposal is the strongest distractor in this family: a read replica genuinely is 'a separate copy of the data,' which makes it sound like a viable recovery point, but being a copy of current (post-mistake) state is exactly the problem, not a solution. Only a backup from before the mistake, combined with PITR, provides a state that predates the DROP TABLE.", "claim_ids": ["cl-4f88c255be37", "cl-42831a96fc0d", "cl-ae1b8ae9fb7e", "cl-d03357538127"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "Instead of recovering from a logical data mistake, the team now has a different goal entirely: this same already-running, unencrypted RDS instance must be made to encrypt its data at rest. The underlying principle being tested shifts from 'which copy survives a mistake' to 'you cannot reach into a running managed instance, so changes like this require working through a snapshot.'", "prompt": "The same production RDS MySQL DB instance (Multi-AZ, with two read replicas) turns out to have been created without encryption at rest, and a compliance requirement now mandates it. The team wants to simply flip an 'encryption' checkbox or run modify-db-instance on the live instance to turn encryption on. Will that work, and if not, what is the correct approach, and what happens to the Multi-AZ standby and the read replicas as a result?", "expected_answer": ["No, encryption cannot be enabled in place on an already-running RDS instance. The correct approach is to take a snapshot of the existing unencrypted instance, create an encrypted copy of that snapshot using a KMS key, and restore a new DB instance from the encrypted snapshot copy; the application is then pointed at the new, encrypted instance. The Multi-AZ standby and the read replicas must be recreated against the new encrypted instance, since a replica or standby inherits its source's encryption setting and cannot be independently encrypted and then promoted."], "reasoning": "This transfers the same mental-model boundary from the canonical scenario -- RDS is managed, so you cannot reach into it directly -- to a different kind of change. Just as you cannot recover a dropped table by reaching into a replica (because a replica only mirrors existing state), you cannot add encryption to a running instance by reaching into it directly, because encryption can only be set at creation or restore time. The fix in both cases routes through a snapshot: PITR restores from a backup snapshot/log stream to undo a mistake, while encrypting an existing instance restores from an encrypted copy of a snapshot to add a property the live instance can't gain in place. In both cases, replicas and standbys mechanically inherit whatever state (data or encryption setting) their source has, rather than being independently fixed.", "distractor_analysis": "It's tempting to think a console toggle or a simple modify-db-instance call can turn on encryption the way you might change an instance class, but RDS explicitly blocks that: modify-db-instance cannot add encryption to an existing unencrypted instance. It's equally tempting to think encrypting a replica and promoting it would work, but a replica inherits the source instance's encryption setting and cannot be selectively encrypted on its own.", "claim_ids": ["cl-9f7e281823fd", "cl-25bcd09edee2", "cl-12900d9c0cb0", "cl-60619375fc51", "cl-6f26c20dd5bc", "cl-f87645bb51c4"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "The contrast set's 'Primary threat addressed' cell for Multi-AZ lists 'patching downtime', and the mental model mechanism lists 'patching' as a failover trigger with no qualification. cl-5b00aee4b9e0 says only OS/hardware maintenance uses the patch-standby-then-fail-over sequence. DB engine version upgrades upgrade the primary and standby at the same time and cause downtime. cl-4159c6183557, which lists engine upgrades as offline events, is itself marked conflicted. So 'Multi-AZ removes patching downtime' overgeneralizes the supporting claims and contradicts cl-5b00aee4b9e0 for engine upgrades.", "related_entity_ids": ["aws-sysops-service-rds--cs-1", "aws-sysops-service-rds--m-1", "cl-5b00aee4b9e0", "cl-c0bd9d7fa8ed", "cl-4159c6183557"]}, {"type": "contradiction", "severity": "medium", "description": "The mental model mechanism says AWS 'installs and patches the engine' as settled fact. Every claim on engine patching responsibility is marked conflicted (cl-570fee310120, cl-89f311a2034c, cl-2cc3b8bbc80b). The source question awssysops-p3-1-q734 has a boxed answer naming the database vendor as responsible, which disagrees with its community vote (cl-6912cbdbb449). The synthesis also leaves out the customer's role: the customer controls engine version upgrades (auto minor version upgrade, scheduling). The model settles a dispute among the source questions without flagging it.", "related_entity_ids": ["aws-sysops-service-rds--m-1", "cl-570fee310120", "cl-89f311a2034c", "cl-6912cbdbb449", "cl-2cc3b8bbc80b", "cl-4d612d8478c3"]}, {"type": "contradiction", "severity": "medium", "description": "The source questions disagree on how to encrypt an existing RDS instance. awssysops-p3-1-q654 has a boxed answer saying a console checkbox enables encryption in place (cl-e8cde3e27165). The snapshot, encrypted copy, restore claims (cl-c905f9112db5, cl-25bcd09edee2) are marked conflicted. The mental model invariant 'Use snapshot, encrypted copy, then restore' and the cue 'Encrypt an existing DB' present this as uncontested and don't flag the q654 boxed-answer dispute.", "related_entity_ids": ["aws-sysops-service-rds--m-1", "cl-e8cde3e27165", "cl-c905f9112db5", "cl-25bcd09edee2", "cl-f87645bb51c4", "cl-9f7e281823fd", "cl-12900d9c0cb0"]}, {"type": "contradiction", "severity": "medium", "description": "Two claims disagree on Amazon Inspector's scope. cl-a62cca529149 calls it 'EC2-only'. cl-773e08d6e33b says Inspector scans EC2 instances, ECR container images, and Lambda functions. Separately, the awssysops-p2-q539 boxed answer (use Inspector for RDS vulnerabilities) disagrees with its unanimous community vote, and the related hardening claim cl-fdafe4a46755 is conflicted.", "related_entity_ids": ["cl-a62cca529149", "cl-773e08d6e33b", "cl-fdafe4a46755"]}, {"type":
