<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

tatus": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a88ebeb94de9", "source_question_ids": ["awssysops-p1-q285"], "statement": "A private subnet is not permanently cut off from the internet; a NAT instance or NAT gateway is the standard mechanism that gives private-subnet instances outbound internet access.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-4607759c0a3f", "source_question_ids": ["awssysops-p2-q320"], "statement": "Route 53 Latency Based Routing optimizes for the lowest-latency region and can route a user to a region outside their jurisdiction whenever that region happens to be faster, which can violate a strict data-residency requirement that data must not leave a specific jurisdiction such as the EU or the US.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-fdd38145e5f8", "source_question_ids": ["awssysops-p2-q320"], "statement": "A third-party geolocation-based redirection mechanism that determines a user's actual jurisdiction and routes them to the matching AWS region is a more deterministic way to satisfy a strict 'data must not leave the jurisdiction' compliance requirement than latency-based routing.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e70c7ddeeb5a", "source_question_ids": ["awssysops-p2-q320"], "statement": "Running EC2 instances only within multiple Availability Zones of a single AWS Region cannot satisfy a requirement to keep EU customer data in the EU and US customer data in the US, because a single Region cannot provide separate EU and US jurisdictions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-85f91e8f66bf", "source_question_ids": ["awssysops-p2-q320"], "statement": "AWS Route 53 Geolocation Routing Policy, distinct from Latency Based Routing, is the AWS-native mechanism  ["CloudFront distribution using default cache behavior configuration"], "confidence": "high", "id": "cl-c55b6012f7cd", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "With CloudFront's default configuration, cookies are not forwarded to the origin at all, so an origin's session cookie (e.g., set by an ALB for sticky sessions) never reaches the origin on subsequent requests unless CloudFront is explicitly configured to forward it.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-05b907db2ecf", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "For a stateful application behind CloudFront and an ALB, enabling ALB session affinity (sticky sessions) together with configuring CloudFront to forward all cookies to the origin fixes intermittent logout / inconsistent content issues, since it addresses both the ALB-side routing and the CloudFront-side cookie-stripping causes.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-45c888a7515f", "source_question_ids": ["awssysops-p3-1-q886"], "statement": "For fixing intermittent logouts on a CloudFront-fronted stateful ALB application, the source's boxed/labeled answer is switching from duration-based to application-controlled ALB sticky sessions, but this does nothing about CloudFront's default cookie-stripping behavior, which community consensus unanimously identifies as the actual root cause requiring cookie forwarding plus sticky sessions.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-61cfd39eec7e", "source_question_ids": ["awssysops-p3-1-q891"], "statement": "Network ACLs are stateless, so an accepted inbound connection's return traffic still requires its own explicit outbound rule to be allowed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-adad31fe4af6", "source_question_ids": ["awssysops-p3-1-q891"], "statement": "Security 7271d23", "source_question_ids": ["awssysops-p3-1-q905"], "statement": "An internet gateway has no fixed IP address of its own; instances behind it present their individual public or Elastic IP addresses directly.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-dbb2c7104c69", "source_question_ids": ["awssysops-p3-1-q905"], "statement": "VPC peering connects VPCs to each other but does not provide any single shared outbound IP address for a fleet's traffic.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-8950881eae4e", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "Geographic access latency for users far from a single-region deployment is best addressed by combining edge caching of static content (CloudFront) with routing users to a second, geographically nearer full production environment (via Route 53 latency-based routing).", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-adfbf103b065", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "An Application Load Balancer is a Regional resource and cannot distribute traffic across two separate AWS Regions; cross-Region routing must be done by Route 53, not the ALB.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-10322374e8ec", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "Tuning the EC2 Auto Scaling group's CPU scaling threshold has no effect on a reported performance issue when CloudWatch shows the actual bottleneck is on a different tier (e.g., the RDS instance at 70% CPU, not the EC2 web tier), and would not address a geography-based latency gap in any case.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-92b82bb3b102", "source_question_ids": ["awssysops-p3-1-q907"], "statement": "For fixing geographic latency for Asia-based users of a single-region production environment, the source's boxed/labeled answer proposes provisioning a second Asia Pacific environment fronted by a single cross-Region ALB, but this is a technical impossibility since ALBs cannot span AWS Regions; community consensus instead favors Route 53 latency-based routing to the second environment plus CloudFront for static content.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c844b9888b0a", "source_question_ids": ["awssysops-p3-1-q916"], "statement": "AWS Network Firewall is a stateful, managed firewall and intrusion-detection/prevention service that performs deep packet inspection on traffic passing through a VPC.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e08ace5aca6b", "source_question_ids": ["awssysops-p3-1-q916"], "statement": "AWS Network Firewall is created for a VPC but deploys a firewall endpoint in a dedicated firewall subnet in each Availability Zone, and subnet route tables send traffic through those endpoints.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6c320052b444", "source_question_ids": ["awssysops-p3-1-q916"], "statement": "AWS Traffic Mirroring only copies traffic to a separate monitoring destination for out-of-band analysis; it performs no packet inspection of its own.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c70890a7586c", "source_question_ids": ["awssysops-p3-1-q916"], "statement": "AWS Shield protects specific resources against DDoS attacks and does not perform deep packet inspection to detect intrusion attempts in VPC traffic.", "status": "conflicted"}], "mentalModel": {"id": "aws-sysops-service-networking-connectivity--m-1", "title": "Follow the request: name, then path, then filter, then target", "purpose": "Most networking questions are answered by finding which of four layers a request passes through actually owns the symptom or requirement, and picking the service that operates at that layer instead of one at a neighbouring layer.", "mechanism": "A request to an AWS workload passes through four independent decisions, in order. (1) Name: Route 53 turns a domain name into an endpoint. The record type decides what it can point at (an alias record is legal at the zone apex and follows an AWS resource's changing IPs; a CNAME is not allowed at the apex; a plain A record needs a static IP). The routing policy decides which of several endpoints is returned (weighted means a fixed percentage, latency-based means whichever Region is fastest, geolocation means the requester's location, failover means health). (2) Path: once there is an IP, a route table entry has to send the packet somewhere that can carry it: an internet gateway for public subnets, a NAT gateway or NAT instance for outbound-only access from private subnets, a gateway endpoint for private S3 access, a peering connection with explicit routes on both sides, or a VPN or Direct Connect link to on-premises. Nothing at this layer happens automatically, and a route whose target is gone shows as a Blackhole. (3) Filter: security groups (stateful, attached to instances) and network ACLs (stateless, per subnet, can deny a single IP) only allow or drop traffic that already has a path. They never create one. (4) Target: inside a Region, an ALB sends each request to a healthy registered target, routing by HTTP path or host and optionally pinning a client with sticky sessions. It takes unhealthy targets out of rotation but never replaces them. An ALB cannot span Regions, so anything cross-Region happens at layer 1. Observability follows the same layers: Flow Logs show layers 2 and 3 (IP, port, accept or reject), ALB and CloudFront access logs show layer 4 (HTTP path, query string, status code), and CloudTrail shows only API calls.", "predict_prompt": "Private-subnet instances have a security group allowing outbound 443 and a NACL allowing all traffic, but patch downloads still time out. The route table has no 0.0.0.0/0 entry. Which layer is broken, and will editing any filter fix it?", "invariants": ["A filter (security group or NACL) can only block traffic. Connectivity always needs a route to a capable target first.", "Routes are never added automatically, not even after a peering connection becomes Active or a NAT gateway exists.", "Choosing between Regions is a DNS (Route 53) decision. Choosing between instances in a Region is a load balancer decision.", "Security groups are stateful, so return traffic is allowed automatically. NACLs are stateless, so return traffic needs its own outbound rule.", "An ALB health check failure removes a target from rotation. Only Auto Scaling terminates or replaces it."], "limits": ["Latency-based routing does nothing when only one regional endpoint exists. Caching static content at CloudFront edge locations is what cuts latency for distant users of a single-Region site.", "An alias record can point only at supported AWS resources. An on-premises server needs a plain A record.", "VPC peering is not transitive and does not support edge-to-edge routing, so on-premises traffic arriving over VPN or Direct Connect cannot cross a peering connection.", "A NACL matches only IPs and CIDRs, so blocking a country belongs to CloudFront geo-restriction or Route 53 geolocation. CloudFront geo-restriction works only per country, so blocking one IP belongs to a NACL."], "cues": ["'zone apex' or 'bare domain' pointing at an ELB, ALB, or CloudFront: alias record", "'percentage of traffic', 'canary', or 'gradually shift': weighted routing", "'users only from country X' or 'data must stay in the EU': geolocation routing", "'private subnet needs outbound internet': route 0.0.0.0/0 to a NAT gateway", "'S3 traffic must not traverse the internet': gateway VPC endpoint", "'peering is Active but ping fails': add routes to the peer CIDR in both VPCs", "'inbound accepted, reply rejected' in a flow log: stateless NACL is missing an outbound rule", "'HTTP status codes' or 'query string': ALB or CloudFront access logs, not Flow Logs or CloudTrail"], "claim_ids": ["cl-2c5699aa5be8", "cl-4bb8b4b60a62", "cl-15ab26080946", "cl-f865178e979a", "cl-1455afe1d57c", "cl-4f566e83abcd", "cl-b616d5d8b0b4", "cl-0d5a024092b6", "cl-752068bfc6be", "cl-c130c98dd118", "cl-aa9aa216e4a2", "cl-aca076cc6227", "cl-3fe10b446c03", "cl-00b6906b640c", "cl-f9b548e0111b", "cl-140a613f7485", "cl-513f1d1ed9ed", "cl-387740227ec4", "cl-062d0b8b1594", "cl-1b7c13bb2a68", "cl-edb93e721ec9", "cl-61cfd39eec7e", "cl-adad31fe4af6", "cl-f6fb14815106", "cl-36e7a96b9ded", "cl-057f27422b78", "cl-02ed98ef6042", "cl-1f8d1268e9d1", "cl-e56d9946847e", "cl-6c249f797c4d", "cl-adfbf103b065", "cl-34990c3927d9", "cl-3cedcc00c1aa", "cl-baa3dd4cbac4", "cl-d64d6bca2f4c", "cl-fb81c8eae10b"]}, "contrastSet": {"id": "aws-sysops-service-networking-connectivity--cs-1", "subjects": ["Route 53 weighted routing", "Route 53 latency-based routing", "Route 53 geolocation routing"], "dimensions": ["What decides which endpoint is returned", "Typical requirement wording", "Needs multiple regional endpoints to matter", "Guarantees a user stays in a specific jurisdiction"], "shared_traits": ["All are Route 53 DNS routing policies that choose among multiple records for the same name", "All act at DNS resolution time, before any traffic reaches an ALB, which cannot route across Regions anyway"], "matrix": {"What decides which endpoint is returned": {"Route 53 weighted routing": "Fixed percentage you assign to each record", "Route 53 latency-based routing": "Lowest measured latency from the client to each Region", "Route 53 geolocation routing": "Geographic origin (country or continent) of the requester"}, "Typical requirement wording": {"Route 53 weighted routing": "Send 10% of traffic to the new stack, canary, blue-green cutover", "Route 53 latency-based routing": "Give each user the fastest response across Regions", "Route 53 geolocation routing": "Show content only to visitors from country X, keep EU data in the EU"}, "Needs multiple regional endpoints to matter": {"Route 53 weighted routing": "Needs at least two records (any environments)", "Route 53 latency-based routing": "Yes. With one Region it does nothing.", "Route 53 geolocation routing": "Needs an endpoint (or error page) per location group"}, "Guarantees a user stays in a specific jurisdiction": {"Route 53 weighted routing": "No. The split ignores location.", "Route 53 latency-based routing": "No. It can send a user to a faster Region abroad.", "Route 53 geolocation routing": "Yes. Routing follows where the requester is."}}, "decision_rule": "Ask what the requirement says traffic should be split by. A deliberate proportion means weighted, speed means latency-based, and the requester's location means geolocation.", "boundary_flip": "Take an app in us-east-1 and eu-west-1 with latency-based routing that gives users the fastest Region. Add a requirement that EU customers' data must never leave the EU, and the answer flips to geolocation, because latency routing would send an EU user to us-east-1 whenever that Region measured faster. Replace that requirement with 'move 5% of traffic to the new Region first', and the answer flips to weighted.", "strongest_distractor_failure": "Latency-based routing is the most common wrong pick because it sounds geographic. It optimizes for measured speed, not location, so it cannot restrict content to a country, cannot guarantee data residency, cannot set a fixed traffic percentage, and does nothing when there is only one regional endpoint.", "exceptions": ["For a single-Region site that is slow for distant users, none of these policies is the answer. CloudFront edge caching is, because latency-based routing has nothing to choose between.", "Country-level blocking can also be done with CloudFront geo-restriction. Route 53 geolocation is the DNS-level way to send blocked countries to an error-page endpoint."], "claim_ids": ["cl-b616d5d8b0b4", "cl-909420f64903", "cl-a67463b7fb9d", "cl-0d5a024092b6", "cl-c130c98dd118", "cl-6e2168b5d516", "cl-4607759c0a3f", "cl-752068bfc6be", "cl-945ec08ffd66", "cl-85f91e8f66bf", "cl-82d5e357b41f", "cl-ca87f489c75f", "cl-adfbf103b065", "cl-aa9aa216e4a2", "cl-1c868159145a"]}, "scenarioFamily": {"id": "aws-sysops-service-networking-connectivity--sf-1", "canonical": {"prompt": "A company runs its production web app behind an Application Load Balancer (ALB) in us-east-1. It has just finished deploying a new version of the app behind a second, separate ALB, also in us-east-1. The team wants to send exactly 10% of incoming requests to the new ALB endpoint and keep the remaining 90% on the current ALB endpoint, so they can monitor the new version under real traffic before fully cutting over. Both endpoints are registered under the same public domain name in Route 53. Which Route 53 routing policy should be configured on the two ALB endpoints' record sets to achieve this fixed 10/90 split?", "expected_answer": ["Configure a Route 53 weighted routing policy, creating a weighted record for each ALB endpoint (e.g., weight 90 for the current stack, weight 10 for the new stack) so Route 53 resolves roughly that fixed percentage of DNS queries to each endpoint."], "reasoning": "The stated goal is a deliberate, fixed traffic proportion (10%/90%) between two known endpoints, which is exactly what Route 53 weighted routing is built for: it lets an administrator send a specified percentage of traffic to each of several endpoints (cl-b616d5d8b0b4), and is the standard mechanism for a slow canary or blue/green traffic cutover via separate weighted records (cl-a67463b7fb9d). Latency-based routing is the wrong tool here because it routes each individual request to whichever endpoint currently has the lowest latency for that client, not to a fixed proportion (cl-909420f64903) -- it would not reliably give 10%/90% at all. Auto Scaling scheduled scaling changes capacity on a calendar schedule, not traffic distribution between two existing endpoints (cl-7673468a3245), and ELB health checks only affect failover to healthy targets, not deliberate traffic splitting (cl-1890e71ca059).", "distractor_analysis": "Latency-based routing is the strongest distractor because it also operates at the Route 53 record level and sounds like it could be used to 'send some traffic to the new stack,' but it optimizes for measured speed per client rather than a chosen percentage, so it cannot guarantee a 10/90 split.", "claim_ids": ["cl-b616d5d8b0b4", "cl-a67463b7fb9d", "cl-909420f64903", "cl-7673468a3245", "cl-1890e71ca059"], "difficulty": "easy", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The stated goal changes from 'send a fixed 10% canary to the new stack' to a hard compliance requirement: EU-based customers' requests must always be served from the eu-west-1 endpoint only, and must never be routed to the us-east-1 endpoint, regardless of which endpoint is faster or how traffic happens to be split. The decision is no longer about a chosen traffic proportion but about guaranteeing which jurisdiction serves each user.", "prompt": "The same company now has its new app version live behind an ALB in eu-west-1 instead of us-east-1, alongside the original ALB in us-east-1. Compliance now requires that EU-based customers' requests are always served from the eu-west-1 endpoint only, and are never routed to the us-east-1 endpoint, regardless of which endpoint happens to be faster for a given user. Which Route 53 routing policy should be configured on the two ALB endpoints' record sets to satisfy this requirement?", "expected_answer": ["Configure a Route 53 geolocation routing policy so that requests whose geographic origin is in the EU are routed only to the eu-west-1 endpoint, and other requests are routed to the us-east-1 endpoint."], "reasoning": "Once the requirement is 'EU users must always land on the EU endpoint,' a fixed-proportion policy no longer fits: a weighted split and a latency-based split both ignore the requester's actual location and could still send an EU user to us-east-1 (whether by the chosen weight or because us-east-1 happened to measure faster), which is exactly the data-residency violation latency-based routing is called out for (cl-4607759c0a3f). Route 53 geolocation routing policy routes DNS queries based on the geographic origin of the requester (cl-752068bfc6be) and is the AWS-native mechanism, distinct from latency-based routing, for routing users to a region based on their geographic/jurisdictional location (cl-85f91e8f66bf). This is a boundary flip from the canonical scenario: the canonical's correct answer (weighted routing) would fail this new requirement, so the expected answer changes to geolocation routing.", "distractor_analysis": "Weighted routing (the canonical answer) and latency-based routing both remain plausible-sounding because they are the 'other' Route 53 policies seen in this slice, but neither one keys off requester location, so neither can guarantee EU traffic never leaves the EU endpoint.", "claim_ids": ["cl-752068bfc6be", "cl-4607759c0a3f", "cl-85f91e8f66bf"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The new stack's EC2 instances use a larger instance type (m5.xlarge instead of m5.large) and have detailed CloudWatch monitoring enabled on them. These are operational details about the instances behind the new ALB and have no bearing on which Route 53 routing policy is needed to achieve the traffic split.", "prompt": "A company runs its production web app behind an ALB in us-east-1. It has deployed a new version of the app behind a second, separate ALB, also in us-east-1; the new stack's instances are a larger m5.xlarge type (versus m5.large on the old stack) and have detailed CloudWatch monitoring turned on so the team can watch the new version closely. The team wants to send exactly 10% of incoming requests to the new ALB endpoint and keep 90% on the current ALB endpoint while they monitor it. Both endpoints are registered under the same public domain in Route 53. Which Route 53 routing policy should be configured on the two ALB endpoints' record sets to achieve this fixed 10/90 split?", "expected_answer": ["Configure a Route 53 weighted routing policy, creating a weighted record for each ALB endpoint (e.g., weight 90 for the current stack, weight 10 for the new stack) so Route 53 resolves roughly that fixed percentage of DNS queries to each endpoint."], "reasoning": "The instance type and the use of detailed CloudWatch monitoring describe the compute and observability setup behind each ALB, not how DNS chooses between the two ALB endpoints. The stated routing goal is unchanged -- a fixed 10%/90% split -- so the same reasoning applies: weighted routing lets an administrator send a specified percentage of traffic to each endpoint (cl-b616d5d8b0b4) and is the standard mechanism for this kind of canary/blue-green cutover via separate weighted records (cl-a67463b7fb9d). Neither instance sizing nor monitoring configuration changes which Route 53 policy is required.", "claim_ids": ["cl-b616d5d8b0b4", "cl-a67463b7fb9d"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A team member points out that the new ALB's placement happens to measure lower network latency to most of the company's clients than the old ALB does. However, the stated business goal has not changed: the team still wants exactly 10% of traffic sent to the new stack as a canary, not for each client to be automatically routed to whichever endpoint is currently fastest.", "prompt": "A company runs its production web app behind an ALB in us-east-1 and has deployed a new version behind a second ALB, also in us-east-1. A teammate mentions that, based on recent CloudWatch data, the new ALB's endpoint happens to measure lower latency to most of the company's clients than the old one does. Despite this observation, the team's actual goal is unchanged: send exactly 10% of incoming requests to the new ALB endpoint and keep 90% on the current one, as a controlled canary, regardless of which endpoint measures faster for any given client. Which Route 53 routing policy should be configured on the two ALB endpoints' record sets to achieve this?", "expected_answer": ["Configure a Route 53 weighted routing policy, creating a weighted record for each ALB endpoint (e.g., weight 90 for the current stack, weight 10 for the new stack) so Route 53 resolves roughly that fixed percentage of DNS queries to each endpoint."], "reasoning": "The latency observation is a tempting distractor because Route 53 latency-based routing also looks like a way to 'favor' the new endpoint, but latency-based routing sends each request to whichever endpoint has the lowest latency for that client, not a fixed traffic proportion (cl-909420f64903) -- so even though the new endpoint happens to be faster for most clients today, that measurement could shift, and it still would not produce a controlled, predictable 10%/90% split. The team's stated requirement is still a deliberate fixed percentage, which is exactly what weighted routing provides (cl-b616d5d8b0b4) and is the standard mechanism for this kind of canary cutover (cl-a67463b7fb9d).", "distractor_analysis": "Latency-based routing is the adversarial distractor: the newly introduced latency detail makes it sound relevant or even sufficient, but it answers a different question (which endpoint is fastest right now) than the one actually being asked (what fixed percentage goes to each endpoint).", "claim_ids": ["cl-909420f64903", "cl-b616d5d8b0b4", "cl-a67463b7fb9d"], "difficulty": "medium", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "Instead of a one-time 10% canary for a single new app version, the team now wants to run a multi-stage blue/green migration: moving traffic from an old backend to a brand-new backend, both fronted by separate ALB endpoints in us-east-1, in stages (25%, then 50%, then 100%) over several days.", "prompt": "A company is retiring an old backend (fronted by an ALB in us-east-1) in favor of a brand-new backend (fronted by a separate ALB, also in us-east-1), both registered under the same public domain in Route 53. Rather than a single canary step, they want to migrate traffic in stages over several days: first send 25% of requests to the new backend, then increase to 50%, and finally fully cut over to 100%, adjusting the split at each stage. Which Route 53 routing policy supports this kind of staged, percentage-based traffic migration between the two ALB endpoints?", "expected_answer": ["Configure a Route 53 weighted routing policy, assigning a weighted record to each ALB endpoint and adjusting the weights at each migration stage (e.g., 75/25, then 50/50, then 0/100) to move the desired percentage of traffic to the new backend over time."], "reasoning": "This is the same underlying decision as the canonical scenario -- splitting traffic between two known endpoints by a chosen, administrator-set percentage -- just applied across several sequential stages instead of one fixed split. Weighted routing lets an administrator send a specified percentage of traffic to each of several endpoints (cl-b616d5d8b0b4) and is explicitly the standard mechanism for a slow canary or blue-green traffic cutover, where separate weighted records gradually shift the percentage of DNS resolutions between an old and a new environment (cl-a67463b7fb9d). Updating the weights at each stage (75/25, 50/50, 0/100) is simply reapplying the same weighted-record mechanism repeatedly, so the routing policy choice does not change.", "claim_ids": ["cl-a67463b7fb9d", "cl-b616d5d8b0b4"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "unsupported-generation", "severity": "high", "description": "The contrast set matrix says Route 53 geolocation routing 'Guarantees a user stays in a specific jurisdiction: Yes', and both the cue list and the boundary_flip make geolocation the answer to 'data must stay in the EU'. The claims for that data-residency question (awssysops-p2-q320) do not support this. The latency-routing rule (cl-4607759c0a3f) is conflicted. The geolocation-as-AWS-native-answer claim (cl-85f91e8f66bf) is low-confidence and needs-review. The source's own mechanism (cl-fdd38145e5f8, conflicted) was a third-party geolocation redirection, not Route 53 geolocation. Only q574 supports geolocation, and it is about country-restricted content, not residency. DNS geolocation also works from the resolver or client-subnet location, so it cannot strictly 'guarantee' residency. The absolute 'Yes' is unsupported and the q320 dispute is unresolved.", "related_entity_ids": ["aws-sysops-service-networking-connectivity--cs-1", "aws-sysops-service-networking-connectivity--m-1", "cl-4607759c0a3f", "cl-fdd38145e5f8", "cl-85f91e8f66bf", "cl-752068bfc6be"]}, {"type": "contradiction", "severity": "medium", "description": "Source question awssysops-p3-1-q826 disagrees with itself. Its boxed answer includes Route 53 latency-based routing plus Auto Scaling, but the explanation and community favor CloudFront plus Auto Scaling (cl-1c868159145a, conflicted). The synthesis settles this in the community's favor without saying so: contrast-set exception 1 ('none of these policies is the answer. CloudFront edge caching is') and mental-model limit 1. The dispute should be flagged, not settled by consensus.", "related_entity_ids": ["cl-1c868159145a", "cl-6e2168b5d516", "cl-c130c98dd118", "aws-sysops-service-networking-connectivity--cs-1", "aws-sysops-service-networking-connectivity--m-1"]}, {"type": "ambiguity", "severity": "medium", "description": "Contrast-set exception 1 and mental-model limit 1 say that for a single-Region site that is slow for distant users, CloudFront is the fix and no routing policy is. But awssysops-p3-1-q907 (cl-8950881eae4e) has the same setup, a single-Region production environment slow for Asia-based users, and its answer is CloudFront plus a second Regional environment reached through Route 53 latency-based routing. The synthesis does not separate 'keep a single Region' from 'add a Region', so q907's latency-routing answer reads as contradicting the stated exception.", "related_entity_ids": ["aws-sysops-service-networking-connectivity--cs-1", "aws-sysops-service-networking-connectivity--m-1", "cl-8950881eae4e", "cl-aa9aa216e4a2", "cl-6e2168b5d516"]}, {"type": "contradiction", "severity": "medium", "description": "Source question awssysops-p3-1-q907 disagrees with itself. Its boxed answer is a second Asia Pacific environment behind a single cross-Region ALB, but the explanation and community say ALBs cannot span Regions and favor Route 53 latency routing plus CloudFront (cl-92b82bb3b102, conflicted). The mental model states 'An ALB cannot span Regions' and the contrast set's shared trait relies on it (cl-adfbf103b065), which quietly settles the dispute against the source's answer key.", "related_entity_ids": ["cl-92b82bb3b102", "cl-adfbf103b065", "aws-sysops-service-networking-connectivity--m-1", "aws-sysops-service-networking-connectivity--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source question awssysops-p2-q552 disagrees with itself. Its boxed answer for blocking one malicious IP is CloudFront geo-restriction, but the community favors a NACL deny rule (cl-7a2b6e1e3c9f, conflicted). Mental-model limit 4 ('blocking one IP belongs to a NACL') and the mechanism text take the community side without flagging the disagreement.", "related_entity_ids": ["cl-7a2b6e1e3c9f", "cl-f6fb14815106", "cl-36e7a96b9ded", "aws-sysops-service-networking-connectivity--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source question awssysops-p3-1-q757 disagrees with itself. Its boxed answer pairs CloudTrail with CloudFront access logs for HTTP status codes, but the community favors ALB access logs with CloudFront access logs (cl-15300fcdd6a1, conflicted). The mental model ('CloudTrail shows only API calls') and the cue 'HTTP status codes ... not Flow Logs or CloudTrail' take the community side without flagging the disagreement.", "related_entity_ids": ["cl-15300fcdd6a1", "cl-baa3dd4cbac4", "cl-d64d6bca2f4c", "aws-sysops-service-networking-connectivity--m-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The invariant 'Routes are never added automatically' and the mechanism text 'Nothing at this layer happens automatically' go further than any claim. The claims only show that peering does not add routes (cl-140a613f7485, cl-513f1d1ed9ed) and that a private subnet needs a NAT route. Other route sources do add routes automatically: creating a gateway VPC endpoint adds a prefix-list route to the selected route tables, every VPC gets an automatic local route, and virtual private gateway route propagation adds routes (cl-57d1c79f8d4a mentions propagation). The mechanism also lists 'a gateway endpoint for private S3 access' as a route target under this 'never automatic' rule.", "related_entity_ids": ["aws-sysops-service-networking-connectivity--m-1", "cl-140a613f7485", "cl-513f1d1ed9ed", "cl-57d1c79f8d4a", "cl-f9b548e0111b"]}, {"type": "quality", "severity": "medium", "description": "The mental model numbers its own layers 1-4 (name, path, filter, target), then says 'Flow Logs show layers 2 and 3' and 'ALB and CloudFront access logs show layer 4'. The claims and cues use OSI numbering: Flow Logs are Layer 3/4 (cl-3cedcc00c1aa) and access logs are Layer 7 (cl-baa3dd4cbac4). Under OSI, 'layer 4' is transport, which is exactly what Flow Logs show. The two numbering schemes collide and can mislead a learner.", "related_entity_ids": ["aws-sysops-service-networking-connectivity--m-1", "cl-3cedcc00c1aa", "cl-baa3dd4cbac4"]}, {"type": "ambiguity", "severity": "medium", "description": "The mental model relies on conflicted claims without caveat. Limit 2 ('An alias record can point only at supported AWS resources. An on-premises server needs a plain A record') rests on cl-1455afe1d57c and cl-4f566e83abcd, both conflicted. cl-4f566e83abcd also overstates by saying only an A record is valid, when a non-apex CNAME or AAAA record would also work. The mechanism's 'a route whose target is gone shows as a Blackhole' rests on cl-062d0b8b1594, also conflicted, and the related q587 claim cl-b42dcd5bc667 is needs-review.", "related_entity_ids": ["aws-sysops-service-networking-connectivity--m-1", "cl-1455afe1d57c", "cl-4f566e83abcd", "cl-062d0b8b1594", "cl-b42dcd5bc667"]}, {"type": "ambiguity", "severity": "low", "description": "The contrast set's weighted-routing wording ('canary, blue-green cutover') and the cue 'gradually shift' rest on cl-a67463b7fb9d (awssysops-p3-1-q784), which is conflicted, as is that question's distractor cl-fd225bc29358. Only q030 (cl-b616d5d8b0b4) cleanly supports weighted routing as a percentage split.", "related_entity_ids": ["aws-sysops-service-networking-connectivity--cs-1", "aws-sysops-service-networking-connectivity--m-1", "cl-a67463b7fb9d", "cl-fd225bc29358", "cl-b616d5d8b0b4"]}, {"type": "contradiction", "severity": "low", "description": "Source question awssysops-p3-1-q886 disagrees with itself. Its boxed answer is switching to application-controlled ALB stickiness, but the community says CloudFront cookie forwarding plus sticky sessions is the fix (cl-45c888a7515f, conflicted). cl-05b907db2ecf is marked supported for the community answer, which settles the dispute at the claim level.", "related_entity_ids": ["cl-45c888a7515f", "cl-05b907db2ecf", "cl-c55b6012f7cd"]}, {"type": "ambiguity", "severity": "low", "description": "The awssysops-p1-q098 claims (Route 53 failover as ELB redundancy, ELB being inherently multi-AZ, Auto Scaling as the distractor) are all needs-review and mostly low-confidence, so the question's correct answer is unclear. The mental model's 'failover means health' routing policy has no supported claim behind it.", "related_entity_ids": ["cl-6f199e65b744", "cl-403da5e71dca", "cl-4084632746a0", "aws-sysops-service-networking-connectivity--m-1"]}, {"type": "ambiguity", "severity": "low", "description": "Every claim from the Direct Connect resiliency question (awssysops-p3-1-q883) is conflicted: Maximum vs High Resiliency definitions, the active/active multi-location rule, Direct Connect gateway adding no resiliency, and single-location single point of failure. That question's correct answer is unresolved.", "related_entity_ids": ["cl-5a4dbd13ff12", "cl-ea9b7a3cc9e5", "cl-8ccc19922c31", "cl-9565b58c98ef"]}, {"type": "quality", "severity": "low", "description": "cl-d8b422462288 and cl-49c88855c20f call aws:CurrentTime, aws:SecureTransport, aws:SourceIp and aws:UserAgent 'AWS Direct Connect's IAM policy condition keys'. These are global IAM condition keys, not Direct Connect-specific ones, so the framing is misleading.", "related_entity_ids": ["cl-d8b422462288", "cl-49c88855c20f"]}, {"type": "stale-risk", "severity": "low", "description": "cl-b446dadb3086 gives specific NAT gateway bandwidth figures (5 Gbps, scaling to 100 Gbps) and is marked conflicted. AWS has raised this limit over time (10, then 45, then 100 Gbps), so the figure may not match the source question or current documentation.", "related_entity_ids": ["cl-b446dadb3086"]}], "sourceQuestionCount": 57}], "sources": {"kind": "locked", "file": "aws-sysops-service-networking-kqfm.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------

    var html = safe`

          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
