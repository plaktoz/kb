<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }
    ul.citations li { grid-template-columns: 1fr; gap: 0.3rem; }
    ul.diagnosis-history li { grid-template-columns: 1fr; gap: 0.3rem; }
    ul.diagnosis-history .badge { justify-self: start; }
    .segmented { display: flex; }
    .segmented label { flex: 1; text-align: center; }
    .sources-table { min-width: 0; }
    .sources-table thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    .sources-table tr.source-row {
      display: grid;
      grid-template-areas: "id answer" "stem stem" "status status";
      grid-template-columns: 1fr auto;
      gap: 0.35rem 0.75rem;
      padding: 0.85rem 0.9rem;
      border-bottom: 1px solid var(--line);
    }
    .sources-table tr.source-row > td { padding: 0; border: 0; }
    .sources-table .cell-id { grid-area: id; }
    .sources-table .cell-answer { grid-area: answer; }
    .sources-table .cell-stem { grid-area: stem; }
    .sources-table .cell-status { grid-area: status; color: var(--muted); font-size: 0.86rem; }
    .sources-table tr.detail-row, .sources-table tr.detail-row > td { display: block; }
    .sources-table tbody tr:last-child { border-bottom: 0; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 1, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-ebs", "exam": "aws-sysops", "facet": {"key": "service", "value": "ebs"}, "schemaVersion": 1}, "sourceQuestions": [{"id": "awssysops-p1-q032", "status": "active", "disputed": false, "stem": "When creation of an EBS snapshot is initiated but not completed, the EBS volume:", "choice_type": "single", "choices": [{"letter": "A", "text": "Cannot be detached or attached to an EC2 instance until the snapshot completes"}, {"letter": "B", "text": "Can be used in read-only mode while the snapshot is in progress"}, {"letter": "C", "text": "Can be used while the snapshot is in progress"}, {"letter": "D", "text": "Cannot be used until the snapshot completes"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "EBS snapshots capture a point-in-time copy of the volume's data as of when the snapshot command was issued, but the volume itself remains fully attached and usable -- for both reads and writes -- for the entire time the snapshot is being created in the background (C). There's no read-only lock (B) and no detach/usage restriction (A, D); the main caveat is that any writes made after the snapshot starts aren't guaranteed to be captured unless you pause writes or unmount first for a fully consistent point-in-time image. Reference: docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-creating-snapshot.html", "facets": {"service": ["EBS"], "concern": ["storage", "backup"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 44, "question_number": 32}, "fingerprint": "78c9179854e6437f9a061d79a2d03928855b934d73e217f479563af930efb47d"}, {"id": "awssysops-p1-q034", "status": "active", "disputed": false, "stem": "You are running a database on an EC2 instance, with the data stored on Elastic Block Store (EBS) for persistence. At times throughout the day, you are seeing large variance in the response times of the database queries. Looking into the instance with the iostat command you see a lot of wait time on the disk volume that the database's data is stored on.\n\nWhat two ways can you improve the performance of the database's storage while maintaining the current persistence of the data? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Move to an SSD backed instance"}, {"letter": "B", "text": "Move the database to an EBS-Optimized instance"}, {"letter": "C", "text": "Use Provisioned IOPS EBS"}, {"letter": "D", "text": "Use the ephemeral storage on an m2.4xlarge instance instead"}], "correct_answer": ["B", "C"], "source_correct_answer": ["B", "C"], "correct_answer_override": null, "explanation": "The disk itself is showing high wait time, meaning it's I/O constrained, while the requirement is to keep the same durable persistence (ruling out D's ephemeral storage, which loses data on stop/terminate). An EBS-optimized instance provides dedicated, non-shared throughput between the instance and EBS so other traffic on the instance doesn't contend with disk I/O (B), and Provisioned IOPS EBS volumes deliver a guaranteed, consistent number of IOPS designed for exactly this kind of I/O-intensive database workload (C). Simply moving to an 'SSD-backed instance' (A) isn't a coherent fix on its own -- EBS-optimized plus Provisioned IOPS already gets you SSD-backed, guaranteed-throughput storage, which is the more precise and complete answer.", "facets": {"service": ["EBS", "EC2"], "concern": ["performance", "storage"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 47, "question_number": 34}, "fingerprint": "64cb9ac4477221061331737e34ede837f2c051d9f8e7db0c7a51109c60c1edc4"}, {"id": "awssysops-p1-q039", "status": "active", "disputed": true, "stem": "You have been asked to automate many routine systems administrator backup and recovery activities. Your current plan is to leverage AWS-managed solutions as much as possible and automate the rest with the AWS CLI and scripts.\n\nWhich task would be best accomplished with a script?", "choice_type": "single", "choices": [{"letter": "A", "text": "Creating daily EBS snapshots with a monthly rotation of snapshots"}, {"letter": "B", "text": "Creating daily RDS snapshots with a monthly rotation of snapshots"}, {"letter": "C", "text": "Automatically detect and stop unused or underutilized EC2 instances"}, {"letter": "D", "text": "Automatically add Auto Scaled EC2 instances to an Amazon Elastic Load Balancer"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "The source's boxed answer is A (scripting daily EBS snapshot creation with monthly rotation), but the community is split evenly with C (a script to detect and stop underutilized EC2 instances). There's a real case for both, plus a strong argument that this question is simply outdated: Amazon Data Lifecycle Manager, launched in 2018, now automates exactly the EBS snapshot/rotation lifecycle in A without any scripting, and RDS already automates its own backup/retention out of the box (ruling out B either way). If the question predates DLM, A was the correct 'needs a script' gap at the time; read against AWS's current managed-service surface, C is arguably the better fit today, since there's still no built-in AWS service that detects and stops idle/underutilized instances -- that genuinely still requires custom scripting, unlike D which Auto Scaling + ELB already handle natively. Recorded here as the source's boxed A; flagged disputed given the even split and likely question staleness.", "facets": {"service": ["EBS", "RDS"], "concern": ["backup", "automation"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 52, "question_number": 39}, "fingerprint": "21604856d0609b3cf4dd6262684dd0bcfe79994c885c985c86393f23ccddd71a"}, {"id": "awssysops-p1-q047", "status": "active", "disputed": false, "stem": "You are tasked with setting up a cluster of EC2 instances for a NoSQL database. The database requires random read I/O disk performance up to 100,000 IOPS at 4KB block size per node.\n\nWhich of the following EC2 instances will perform the best for this workload?", "choice_type": "single", "choices": [{"letter": "A", "text": "A High-Memory Quadruple Extra Large (m2.4xlarge) with EBS-Optimized set to true and a PIOPS EBS volume"}, {"letter": "B", "text": "A Cluster Compute Eight Extra Large (cc2.8xlarge) using instance storage"}, {"letter": "C", "text": "High I/O Quadruple Extra Large (hi1.4xlarge) using instance storage"}, {"letter": "D", "text": "A Cluster GPU Quadruple Extra Large (cg1.4xlarge) using four separate 4000 PIOPS EBS volumes in a RAID 0 configuration"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C. The hi1.4xlarge 'High I/O' instance type provides local SSD instance storage purpose-built for random-I/O-heavy workloads like NoSQL databases, delivering up to roughly 120,000 random read IOPS at 4KB block size -- comfortably clearing the 100,000 IOPS/node requirement. A (m2.4xlarge with PIOPS EBS) and D (cg1.4xlarge with RAID-0 PIOPS EBS) rely on network-attached EBS, which topped out far below instance-local SSD throughput at the time this question was written, and B (cc2.8xlarge) is compute-optimized rather than I/O-optimized. The tradeoff of using ephemeral instance storage for a database (data loss on stop/terminate) is a real operational concern raised in the community discussion, but the question is scoped strictly to raw I/O performance.", "facets": {"service": ["EC2", "EBS"], "concern": ["performance", "storage"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 65, "question_number": 47}, "fingerprint": "1781741ff65066d5fd44557250c4a3088316683694c81a66ea93b5ccee4f700b"}, {"id": "awssysops-p1-q048", "status": "active", "disputed": false, "stem": "When an EC2 EBS-backed (EBS root) instance is stopped, what happens to the data on any ephemeral store volumes?", "choice_type": "single", "choices": [{"letter": "A", "text": "Data will be deleted and will no longer be accessible"}, {"letter": "B", "text": "Data is automatically saved in an EBS volume."}, {"letter": "C", "text": "Data is automatically saved as an EBS snapshot"}, {"letter": "D", "text": "Data is unavailable until the instance is restarted"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A (unanimous community vote, 100%). The question asks specifically about ephemeral/instance-store volumes, not the EBS root volume -- and instance-store data is always lost when the instance stops (or terminates, or its underlying disk fails), regardless of whether the instance's root volume happens to be EBS-backed. The 'EBS-backed (EBS root)' framing in the stem is a distractor describing the root volume, not the ephemeral store the question actually asks about.", "facets": {"service": ["EC2", "EBS"], "concern": ["instance-store", "ephemeral-storage"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 67, "question_number": 48}, "fingerprint": "223413dbc73eb24a02815b0f3876f6c0662a44a86937acb1fea9b4b5f57b18d7"}, {"id": "awssysops-p1-q050", "status": "active", "disputed": false, "stem": "You have a server with a 500GB Amazon EBS data volume. The volume is 80% full. You need to back up the volume at regular intervals and be able to re-create the volume in a new Availability Zone in the shortest time possible. All applications using the volume can be paused for a period of a few minutes with no discernible user impact.\n\nWhich of the following backup methods will best fulfill your requirements?", "choice_type": "single", "choices": [{"letter": "A", "text": "Take periodic snapshots of the EBS volume"}, {"letter": "B", "text": "Use a third party incremental backup application to back up to Amazon Glacier"}, {"letter": "C", "text": "Periodically back up all data to a single compressed archive and archive to Amazon S3 using a parallelized multi-part upload"}, {"letter": "D", "text": "Create another EBS volume in the second Availability Zone, attach it to the Amazon EC2 instance, and use a disk manager to mirror the two disks"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A. EBS snapshots are the standard mechanism for point-in-time backup of an EBS volume, and a snapshot can be used to create a new volume directly in a different Availability Zone -- satisfying both the 'shortest time possible' and 'new AZ' requirements in one native, low-effort operation compatible with a brief application pause. B and C involve building and maintaining a custom backup pipeline (third-party incremental tooling, or manual archive-and-multipart-upload to S3), which is slower for both backup and restore than a native snapshot-to-new-volume flow. D (cross-AZ disk mirroring) doesn't work as described: EBS volumes attach only to EC2 instances within the same Availability Zone, so you cannot mirror directly across AZs using an OS-level disk manager.", "facets": {"service": ["EBS"], "concern": ["backup", "disaster-recovery"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 70, "question_number": 50}, "fingerprint": "bc63f8ddf1544d8cab998dd9ba160b5ac9b913f23aca864cf0569eb3110ba13d"}, {"id": "awssysops-p1-q056", "status": "active", "disputed": false, "stem": "A user is planning to evaluate AWS for their internal use. The user does not want to incur any charge on his account during the evaluation. Which of the below mentioned AWS services would incur a charge if used?", "choice_type": "single", "choices": [{"letter": "A", "text": "AWS S3 with 1 GB of storage"}, {"letter": "B", "text": "AWS micro instance running 24 hours daily"}, {"letter": "C", "text": "AWS ELB running 24 hours a day"}, {"letter": "D", "text": "AWS PIOPS volume of 10 GB size"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D. At the time this question was written, the AWS Free Tier covered 750 hours/month of a micro instance (B), 750 hours/month of ELB (C), and several GB of S3 storage (A) -- all comfortably inside free-tier limits for the usage described. Provisioned IOPS (PIOPS) EBS volumes were never part of the Free Tier at any size, so a 10 GB PIOPS volume (D) would incur charges from the moment it's created. Note: a later commenter argues ELB (C) is also no longer free-tier-eligible under current AWS terms -- Free Tier inclusions have changed since this question was authored, but D remains correct either way since PIOPS was never included.", "facets": {"service": ["Billing", "EBS"], "concern": ["free-tier", "cost-management"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 77, "question_number": 56}, "fingerprint": "9c8d65c4ab9cdbf90af85ac2aade17bca46eeef8fc5d16687f444cbb518f6994"}, {"id": "awssysops-p1-q070", "status": "active", "disputed": false, "stem": "A user is trying to save some cost on the AWS services. Which of the below mentioned options will not help him save cost?", "choice_type": "single", "choices": [{"letter": "A", "text": "Delete the unutilized EBS volumes once the instance is terminated"}, {"letter": "B", "text": "Delete the AutoScaling launch configuration after the instances are terminated"}, {"letter": "C", "text": "Release the elastic IP if not required once the instance is terminated"}, {"letter": "D", "text": "Delete the AWS ELB after the instances are terminated"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B. An Auto Scaling launch configuration is just a template/blueprint -- AWS never charges for the configuration object itself, only for the resources it's used to create (the EC2 instances). Deleting or keeping a launch configuration around after its instances are terminated makes zero difference to the bill. Deleting unused EBS volumes (A), releasing unattached Elastic IPs (C), and deleting an idle ELB (D) all remove resources that are actively billed, so each of those genuinely reduces cost.", "facets": {"service": ["Auto Scaling", "EBS", "EC2", "ELB"], "concern": ["cost-management"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 93, "question_number": 70}, "fingerprint": "aa9c48bd11e1be9fb87e39c7ef406357bf4056d352d359f6970145a6f02e21f9"}, {"id": "awssysops-p1-q083", "status": "active", "disputed": false, "stem": "An organization wants to move to Cloud. They are looking for a secure encrypted database storage option. Which of the below mentioned AWS functionalities helps them to achieve this?", "choice_type": "single", "choices": [{"letter": "A", "text": "AWS MFA with EBS"}, {"letter": "B", "text": "AWS EBS encryption"}, {"letter": "C", "text": "Multi-tier encryption with Redshift"}, {"letter": "D", "text": "AWS S3 server side storage"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B (unanimous community vote, 100%). EBS volume encryption (AES-256, transparent to the instance, covering data at rest, the I/O in transit between the instance and the volume, and snapshots) is AWS's built-in mechanism for encrypted block storage -- a natural fit for a database's underlying disk. A conflates an unrelated IAM control (MFA) with encryption. C describes a 'multi-tier encryption' capability for Redshift that doesn't exist. D (S3 server-side encryption) protects object storage, not the block storage a database sits on.", "facets": {"service": ["EBS"], "concern": ["encryption", "security"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 107, "question_number": 83}, "fingerprint": "e4a5c3593e51f6cece1d3b936f6f5375dd612f1101c6d2b6f7a72679b67f8a22"}, {"id": "awssysops-p1-q106", "status": "active", "disputed": false, "stem": "A user has launched an EBS backed instance. The user started the instance at 9 AM in the morning. Between 9 AM to 10 AM, the user is testing some script.\nThus, he stopped the instance twice and restarted it. In the same hour the user rebooted the instance once. For how many instance hours will AWS charge the user?", "choice_type": "single", "choices": [{"letter": "A", "text": "3 hours"}, {"letter": "B", "text": "4 hours"}, {"letter": "C", "text": "2 hours"}, {"letter": "D", "text": "1 hour"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A (3 hours), matching the community's eventual consensus after some initial confusion in the comments. EC2 instance-hour billing is driven by transitions into the 'Running' state, not by reboots specifically: the instance's first Running period (starting 9 AM) is one billing hour; each subsequent Stopped -> Running transition (the two stop/restart cycles described) starts a new billing hour, contributing two more; a reboot, by contrast, never leaves the Running state at all, so it adds no additional charge. That totals 1 (initial start) + 2 (two restart cycles) = 3 instance-hours. Some early comments miscounted -- treating the reboot itself as a fourth chargeable event, or assuming a reboot also starts a fresh billing hour -- which the later, documentation-linked explanation (citing AWS's own instance-hour-billing knowledge-center article) corrects.", "facets": {"service": ["EC2", "EBS"], "concern": ["billing"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 131, "question_number": 106}, "fingerprint": "e16c4ec45c80bb19c1736b2b4e7cb6c56e12125d08bce35487814b5a4017ec0f"}, {"id": "awssysops-p1-q110", "status": "active", "disputed": false, "stem": "A user has created numerous EBS volumes. What is the general limit for each AWS account for the maximum number of EBS volumes that can be created?", "choice_type": "single", "choices": [{"letter": "A", "text": "10000"}, {"letter": "B", "text": "5000"}, {"letter": "C", "text": "100"}, {"letter": "D", "text": "1000"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B. The default per-account limit on the total number of EBS volumes that can be created is 5000 (a soft limit that can be raised via a support request, but 5000 is the standard starting cap). A (10000), C (100), and D (1000) don't match the documented default.", "facets": {"service": ["EBS"], "concern": ["service-limits"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 135, "question_number": 110}, "fingerprint": "9c4b979684c9e1a2f461ce239f45c5456908df5adca9e440fbbe21ff41f2737d"}, {"id": "awssysops-p1-q112", "status": "active", "disputed": false, "stem": "A user has stored data on an encrypted EBS volume. The user wants to share the data with his friend's AWS account. How can user achieve this?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create an AMI from the volume and share the AMI"}, {"letter": "B", "text": "Copy the data to an unencrypted volume and then share"}, {"letter": "C", "text": "Take a snapshot and share the snapshot with a friend"}, {"letter": "D", "text": "If both the accounts are using the same encryption key then the user can share the volume directly"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Boxed answer: B. However, the recorded community vote is C at 100%, directly backed by the AWS documentation several commenters cite: it is not possible to directly share an encrypted EBS volume (or its raw data) with another account at all -- the only supported path is to share an encrypted snapshot of the volume with the destination account, which that account then uses to create its own new volume. B's 'copy data to an unencrypted volume and share' isn't how EBS sharing actually works (there's no unencrypted-volume-sharing workflow, and it would also defeat the point of encrypting the data in the first place). A couple of commenters (jadoxo, gretch) defend B anyway on the reading that 'friends' (plural) rules out a single shared key, but their reasoning doesn't address the actual sharing mechanism described in AWS's own knowledge-center article. This question is flagged as a strong candidate for manual `correct_answer_override` review -- left untouched here since ingestion never overrides the source-boxed value.", "facets": {"service": ["EBS"], "concern": ["encryption", "sharing"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 137, "question_number": 112}, "fingerprint": "cfd41e85f5ec331fa8f59146264fa602ce45ea83f558b566c62bd4d3fa27ddec"}, {"id": "awssysops-p1-q133", "status": "active", "disputed": false, "stem": "A sys admin is trying to understand EBS snapshots. Which of the below mentioned statements will not be useful to the admin to understand the concepts about a snapshot?", "choice_type": "single", "choices": [{"letter": "A", "text": "The snapshot is synchronous"}, {"letter": "B", "text": "It is recommended to stop the instance before taking a snapshot for consistent data"}, {"letter": "C", "text": "The snapshot is incremental"}, {"letter": "D", "text": "The snapshot captures the data that has been written to the hard disk when the snapshot command was executed"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A (unanimous community vote, 100%). EBS snapshots are asynchronous, not synchronous: the point-in-time snapshot is captured immediately, but the actual data transfer to S3 continues in the background afterward, without blocking the volume from ongoing reads and writes. Since the question asks which statement will NOT help the admin understand snapshots correctly, and A states the opposite of how snapshots actually behave, A is the statement to avoid -- while B, C, and D are all accurate and genuinely useful descriptions (stopping the instance for consistency, incremental storage, and point-in-time capture semantics, respectively).", "facets": {"service": ["EBS"], "concern": ["snapshots"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 162, "question_number": 133}, "fingerprint": "9ef7ac5271395d4d8c48fd1d78a2d95568099296538d085e5e4d6e6c1c12052c"}, {"id": "awssysops-p1-q159", "status": "active", "disputed": false, "stem": "A user is planning to schedule a backup for an EBS volume. The user wants security of the snapshot data. How can the user achieve data encryption with a snapshot?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use encrypted EBS volumes so that the snapshot will be encrypted by AWS"}, {"letter": "B", "text": "While creating a snapshot select the snapshot with encryption"}, {"letter": "C", "text": "By default, the snapshot is encrypted by AWS"}, {"letter": "D", "text": "Enable server side encryption for the snapshot using S3"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Boxed answer: A, which matches the reference passage's own explanation directly: an EBS snapshot's encryption is inherited from its source volume -- snapshotting an already-encrypted volume automatically produces an encrypted snapshot, with no separate encryption step needed at snapshot time. The recorded vote is B at 100%, based on a single comment with no supporting reasoning; B would only be accurate for the specific 'copy snapshot with encryption' console flow (which can add encryption to a copy of an unencrypted snapshot), not for the general case of scheduling an ongoing backup of an existing volume, which is what this question describes. C is wrong since encryption is never automatic for an unencrypted source volume, and D describes a different, S3-specific encryption mechanism that doesn't apply to EBS snapshots. This question is flagged as a candidate for review given the vote, but the passage itself is more consistent with the boxed A.", "facets": {"service": ["EBS"], "concern": ["encryption", "snapshots"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 187, "question_number": 159}, "fingerprint": "aae424360bdf44e4219cbabe53968de4cd750b2288603a81450d2dee9dfc223d"}, {"id": "awssysops-p1-q161", "status": "active", "disputed": false, "stem": "A user has setup an EBS backed instance and attached 2 EBS volumes to it. The user has setup a CloudWatch alarm on each volume for the disk data. The user has stopped the EC2 instance and detached the EBS volumes. What will be the status of the alarms on the EBS volume?", "choice_type": "single", "choices": [{"letter": "A", "text": "OK"}, {"letter": "B", "text": "Insufficient Data"}, {"letter": "C", "text": "Alarm"}, {"letter": "D", "text": "The EBS cannot be detached until all the alarms are removed"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B. With the volumes detached and inactive, CloudWatch has no fresh metric data points to evaluate against the alarm's threshold -- an alarm moves to the Insufficient Data state specifically when the metric it watches stops reporting data, which is exactly what happens once the volume is detached. A (OK) and C (Alarm) both require actual data points to evaluate against the threshold, which no longer exist. D is wrong since detaching a volume isn't blocked by having CloudWatch alarms configured on it.", "facets": {"service": ["CloudWatch", "EBS"], "concern": ["alarms"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 188, "question_number": 161}, "fingerprint": "5df4e3c12e8b04abbe3b2c3e3c066ad80a754a0179b46ec7170d39cb276b2d09"}, {"id": "awssysops-p1-q165", "status": "active", "disputed": false, "stem": "A user is trying to launch an EBS backed EC2 instance under free usage. The user wants to achieve encryption of the EBS volume. How can the user encrypt the data at rest?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use AWS EBS encryption to encrypt the data at rest"}, {"letter": "B", "text": "The user cannot use EBS encryption and has to encrypt the data manually or using a third party tool"}, {"letter": "C", "text": "The user has to select the encryption enabled flag while launching the EC2 instance"}, {"letter": "D", "text": "Encryption of volume is not available as a part of the free usage tier"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Boxed answer: B, which matched the reference passage's own claim that EBS encryption wasn't supported on micro instances (the free-tier-eligible instance type at the time this question was written) -- under that constraint, a free-tier user genuinely had no native EBS-encryption option and would have needed a manual or third-party approach, matching B. The recorded vote is A at 100%, and several commenters (JGD, BATSIE, albert_kuo) confirm this has since changed: AWS expanded EBS encryption support to essentially all current instance types, including the free-tier-eligible T2/T3 family, so native EBS encryption (A) is achievable today regardless of instance type. A separate minority of comments argue for C instead, pointing to the actual console mechanic (an 'Encrypt this volume' checkbox shown during launch) as the literal answer to 'how' the user enables it, rather than A's more general 'use AWS EBS encryption' framing. This question is flagged as a strong candidate for manual `correct_answer_override` review given both the vote and the platform capability having changed since the question was written -- left untouched here since ingestion never overrides the source-boxed value.", "facets": {"service": ["EBS"], "concern": ["encryption", "free-tier"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 192, "question_number": 165}, "fingerprint": "b06273b08787410f811d6f3c27f7d5685b3cdcc3d9196986a2c6aebb90c19231"}, {"id": "awssysops-p1-q210", "status": "active", "disputed": false, "stem": "A user is trying to create a PIOPS EBS volume with 4000 IOPS and 100 GB size. AWS does not allow the user to create this volume. What is the possible root cause for this?", "choice_type": "single", "choices": [{"letter": "A", "text": "The ratio between IOPS and the EBS volume is higher than 30"}, {"letter": "B", "text": "The maximum IOPS supported by EBS is 3000"}, {"letter": "C", "text": "The ratio between IOPS and the EBS volume is lower than 50"}, {"letter": "D", "text": "PIOPS is supported for EBS higher than 500 GB size"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Boxed answer: A, matching the reference passage's claim that the max IOPS-to-GB ratio for a provisioned-IOPS (PIOPS) volume was 30:1 at the time this question was written -- under that limit, a 100 GB volume could support at most 3,000 IOPS, so requesting 4,000 IOPS would indeed be rejected, matching A's reasoning. However, this is flagged as a strong 'documentation changed over time' case: a heavily-upvoted comment (8 upvotes) and a detailed follow-up both confirm AWS has since raised this ratio to 50:1 -- under the current limit, a 100 GB volume can support up to 5,000 IOPS, meaning the exact 4,000 IOPS/100 GB request in this question would be perfectly valid today and wouldn't be rejected at all. So while A correctly explains why the request failed under the ratio limit that applied when this question was authored, the underlying premise no longer holds under current AWS limits. B invents a flat 3,000 IOPS cap that isn't accurate at either the old or new ratio. D invents a 500 GB size threshold that isn't how PIOPS eligibility works.", "facets": {"service": ["EBS"], "concern": ["piops-ratio-limit"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 238, "question_number": 210}, "fingerprint": "3902e44a0694082a65fcf85380e8c9e529f4428dc55c517bc4af291c473d97f1"}, {"id": "awssysops-p1-q249", "status": "active", "disputed": false, "stem": "A user runs the command `dd if=/dev/zero of=/dev/xvdf bs=1M` on a fresh blank EBS volume attached to a Linux instance. Which of the below mentioned activities is the user performing with the command given above?", "choice_type": "single", "choices": [{"letter": "A", "text": "Creating a file system on the EBS volume"}, {"letter": "B", "text": "Mounting the device to the instance"}, {"letter": "C", "text": "Pre warming the EBS volume"}, {"letter": "D", "text": "Formatting the EBS volume"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous formatted community vote, 100%), confirmed by an AWS documentation quote in a comment. Writing zeros across every block of a fresh volume with dd (using /dev/zero as input, the target device as output, and a 1MB block size for efficiency) is the classic pre-warming technique used to avoid a first-access IOPS penalty from the storage layer's lazy initialization. One comment (tetural) notes that newer EBS volumes no longer need this step at all, achieving full performance immediately without pre-warming -- a 'documentation changed over time' caveat worth keeping in mind, though it doesn't change what activity this specific command performs. A, B, and D all describe higher-level filesystem/mount/format operations, none of which is what a raw dd-with-zeros pass onto a raw block device actually does.", "facets": {"service": ["EBS"], "concern": ["volume-pre-warming"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 278, "question_number": 249}, "fingerprint": "be855aa55fe8f621953cc2de620289e2a343537d8d350cc68b6bde8a39b04674"}, {"id": "awssysops-p1-q260", "status": "active", "disputed": false, "stem": "A user has provisioned 2000 IOPS to the EBS volume. The application hosted on that EBS is experiencing less IOPS than provisioned. Which of the below mentioned options does not affect the IOPS of the volume?", "choice_type": "single", "choices": [{"letter": "A", "text": "The application does not have enough IO for the volume"}, {"letter": "B", "text": "The instance is EBS optimized"}, {"letter": "C", "text": "The EC2 instance has 10 Gigabit Network connectivity"}, {"letter": "D", "text": "The volume size is too large"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D (unanimous formatted community vote, 100%). Actual PIOPS throughput can be capped by insufficient application I/O demand (A), a non-EBS-optimized instance (B), or insufficient network bandwidth (C) -- but the volume's size itself doesn't determine or limit its IOPS ceiling (that's governed by the provisioned IOPS value and volume type). One comment initially second-guessed this before reverting to confirm D, noting the first three options share a clear cause-and-effect relationship with IOPS that D lacks.", "facets": {"service": ["EBS"], "concern": ["piops-throughput-limiting-factors"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 289, "question_number": 260}, "fingerprint": "784da22c3991b782b9a0ccf7b976339d805226d9e6a4cee24e91f8cee7508f84"}, {"id": "awssysops-p1-q262", "status": "active", "disputed": false, "stem": "A user is trying to create a PIOPS EBS volume with 8 GB size and 200 IOPS. Will AWS create the volume?", "choice_type": "single", "choices": [{"letter": "A", "text": "Yes, since the ratio between EBS and IOPS is less than 30"}, {"letter": "B", "text": "No, since the PIOPS and EBS size ratio is less than 30"}, {"letter": "C", "text": "No, the EBS size is less than 10 GB"}, {"letter": "D", "text": "Yes, since PIOPS is higher than 100"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Boxed answer: A, and this is flagged as a boxed-vs-vote conflict with a 'documentation/platform changed over time' angle. The recorded vote is unanimous but for the opposite letter, D (100%): several commenters (allsitesmember, bajwa360, Tony101) confirm having tried this directly in the console and gotten a successful 8 GB / 200 IOPS volume, with Tony101 explaining the real gating factors are the minimum volume size (4 GB) and minimum IOPS (100), both of which this request satisfies -- matching D's stated reasoning. A comment (CuLeBrO) adds important context: the IOPS-to-size ratio cap was 30:1 when this question was written but was raised to 50:1 in August 2016, meaning A's ratio-based justification (25:1, under the old 30:1 cap) was the technically correct rationale at creation time, even though both A and D actually agree the volume gets created ('Yes') -- they just cite different reasons. Given the unanimous vote and the detailed minimums-based explanation for D, and the acknowledged ratio change over time, A is kept as the boxed answer but D's practical reasoning (raw IOPS/size minimums) reflects the community's stronger and more current technical grounding.", "facets": {"service": ["EBS"], "concern": ["piops-ratio-and-minimums"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 291, "question_number": 262}, "fingerprint": "ede4895a9874c6ccc790b88dbef48d6c9f84c61ae9afa646888b90734ab8a4a6"}, {"id": "awssysops-p1-q267", "status": "active", "disputed": false, "stem": "A user is trying to create an EBS volume with the highest PIOPS supported by EBS. What is the minimum size of EBS required to have the maximum IOPS?", "choice_type": "single", "choices": [{"letter": "A", "text": "124"}, {"letter": "B", "text": "150"}, {"letter": "C", "text": "134"}, {"letter": "D", "text": "128"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Boxed answer: C (134 GB, from the old ceiling of 4000 max IOPS / a 30:1 ratio = ~134 GB), matching the reference passage's math at the time this question was written. This is a strong 'documentation/platform changed over time' case: the recorded community vote is unanimous but for a different letter, D (100%), and a highly-upvoted comment (Saaho, 10 upvotes) flags it outright as an '#old question,' explaining the current maximums are 64,000 IOPS at a 50:1 ratio = 1,280 GB. Two more comments (kenkct, YH2021) add that under today's io1/io2 volume types, an io2 volume needs only 128 GB to hit the 64,000 IOPS ceiling (500:1 ratio) -- which happens to line up almost exactly with choice D (128). Given the unanimous vote and detailed, doc-linked explanation of how far PIOPS ceilings have grown since this question was authored, C is kept as the boxed answer reflecting the original 4000-IOPS/30:1-ratio assumptions, but D is by far the community's preferred and best-evidenced answer under current EBS specs.", "facets": {"service": ["EBS"], "concern": ["piops-max-ratio-minimum-size"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 296, "question_number": 267}, "fingerprint": "d06e3e93f50458d3cd5d1c1b777ca9e97639a453bd42ce68b1b0878db75cea71"}, {"id": "awssysops-p1-q292", "status": "active", "disputed": false, "stem": "A user runs the command `dd if=/dev/xvdf of=/dev/null bs=1M` on an EBS volume created from a snapshot and attached to a Linux instance. Which of the below mentioned activities is the user performing with the step given above?", "choice_type": "single", "choices": [{"letter": "A", "text": "Pre warming the EBS volume"}, {"letter": "B", "text": "Initiating the device to mount on the EBS volume"}, {"letter": "C", "text": "Formatting the volume"}, {"letter": "D", "text": "Copying the data from a snapshot to the device"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Boxed answer: A ('Pre warming'), and this is flagged as a boxed-vs-majority-vote conflict (75% -- above the 60% disputed threshold, so not marked disputed, but still a real split worth noting): the recorded vote favors B (75%) over A (25%). Multiple comments (dexdinh91, Finger41, Drey, Phil31) link the same AWS EBS-initialization doc page, which describes this exact command (reading from the volume to /dev/null) as the procedure for initializing a volume restored from a snapshot -- AWS's current terminology calls this 'initialization' (formerly known as 'pre-warming'), which is the same underlying operation both terms describe, just named differently over time. One comment (4007) makes a precise counter-argument for A: B's specific wording, 'Initiating the device to mount,' conflates initializing with mounting, which is a different, unrelated operation -- so even though 'initialization' is the technically correct modern term for what this command does, B's actual phrasing doesn't correctly describe it either. A comment (Phil31) also distinguishes this command from the different dd command in Q249 (`dd if=/dev/zero of=/dev/xvdf bs=1M`, which pre-warms a blank volume by writing zeros) -- the direction of the command here (reading from the volume, not writing to it) is specifically the snapshot-restore initialization pattern, not the blank-volume pre-warming pattern. Given this, A is kept as the boxed answer, best matching 'pre warming' as the (older but still commonly used) name for this operation, while acknowledging B's majority vote is not really about a different correct answer but about which choice's wording is less wrong. C (formatting) and D (copying snapshot data, which already happened when the volume was created) don't describe what a read-to-null dd pass does.", "facets": {"service": ["EBS"], "concern": ["snapshot-volume-initialization-command"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 319, "question_number": 292}, "fingerprint": "e3ce4251fbffcbb67fdd7d7aa162f07d7ffd73ef484a2750698b5553ce991c74"}, {"id": "awssysops-p1-q298", "status": "active", "disputed": false, "stem": "A user is trying to pre-warm a blank EBS volume attached to a Linux instance. Which of the below mentioned steps should be performed by the user?", "choice_type": "single", "choices": [{"letter": "A", "text": "There is no need to pre-warm an EBS volume"}, {"letter": "B", "text": "Contact AWS support to pre-warm"}, {"letter": "C", "text": "Unmount the volume before pre-warming"}, {"letter": "D", "text": "Format the device"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Boxed answer: C, matching this question's original passage, which describes unmounting the blank device and then writing all its blocks with a dd command as the pre-warming procedure. This is flagged very prominently as a 'documentation/platform changed over time' case, and closes out a recurring narrative thread that runs through several EBS questions in this exam (Q249, Q292): the recorded vote is unanimous but for the opposite letter, A (100%), and a heavily-upvoted comment (milan24_2000, 10 upvotes) states plainly, quoting AWS's current docs verbatim: 'New EBS volumes receive their maximum performance the moment that they are available and do not require initialization (formerly known as pre-warming).' Two more comments (AMohanty, Saaho) link the same doc page, and even the exam's own answer-key commenter (awscertified) concedes 'outdated question' while still selecting C. One comment (karmaah) explicitly cross-references Q249, asking whether that question's answer is also now stale -- underscoring that this is a systemic, exam-wide artifact of AWS having since eliminated the need for EBS pre-warming entirely, not an isolated one-off. C is kept as the boxed answer reflecting the question's original (now-obsolete) procedure, but A is the community's unanimous and well-documented current answer: pre-warming an EBS volume is no longer necessary at all.", "facets": {"service": ["EBS"], "concern": ["pre-warming-obsolete"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 325, "question_number": 298}, "fingerprint": "5b100e23c4f5e37fa48e563bdcf4dd9c1184e81d6fa0f330e51b83c17dfc5ebb"}, {"id": "awssysops-p1-q300", "status": "active", "disputed": false, "stem": "A user has created an EBS volume of 10 GB and attached it to a running instance. The user is trying to access EBS for first time. Which of the below mentioned options is the correct statement with respect to a first time EBS access?", "choice_type": "single", "choices": [{"letter": "A", "text": "The volume will show a size of 8 GB"}, {"letter": "B", "text": "The volume will show a loss of the IOPS performance the first time"}, {"letter": "C", "text": "The volume will be blank"}, {"letter": "D", "text": "If the EBS is mounted it will ask the user to create a file system"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Boxed answer: B, matching this question's own passage, which claims first-time access to an EBS volume wipes/instantiates the underlying block storage and causes a temporary IOPS loss, recommending pre-warming to avoid it. This is the culminating question in this exam's recurring EBS pre-warming narrative arc (see Q249, Q292, Q298), and it's flagged extremely prominently: a heavily-upvoted comment (Bukowski, 15 upvotes) directly and pointedly refutes B, quoting AWS's current documentation verbatim -- 'Empty EBS volumes receive their maximum performance the moment that they are created and do not require initialization (formerly known as pre-warming)' -- and explicitly criticizes the exam's own answer-key commenter for copy-pasting outdated answers without adding real value. TroyMcLure independently confirms this is 'an outdated question... At that time answer B was correct,' and a third comment (gretch) links a third-party summary saying the same thing. No formatted vote is present, but the pushback is unanimous and unusually forceful for an informally-voted question. B is kept as the boxed answer reflecting the question's original (now fully obsolete) premise, but per current, unambiguous AWS documentation, an EBS volume's first access no longer causes any IOPS loss at all -- none of A, C, or D describe the actual current behavior either, but B in particular is the one most directly and repeatedly refuted by name in the comments.", "facets": {"service": ["EBS"], "concern": ["first-access-iops-loss-obsolete"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P1.pdf", "page": 327, "question_number": 300}, "fingerprint": "c1274b0dc07289c6b2eca2de55e6f3963e0381727b7612e1801efb6c63a28f0f"}, {"id": "awssysops-p2-q302", "status": "active", "disputed": false, "stem": "A user has deployed an application on an EBS backed EC2 instance. For a better performance of application, it requires dedicated EC2 to EBS traffic. How can the user achieve this?", "choice_type": "single", "choices": [{"letter": "A", "text": "Launch the EC2 instance as EBS dedicated with PIOPS EBS"}, {"letter": "B", "text": "Launch the EC2 instance as EBS enhanced with PIOPS EBS"}, {"letter": "C", "text": "Launch the EC2 instance as EBS dedicated with PIOPS EBS"}, {"letter": "D", "text": "Launch the EC2 instance as EBS optimized with PIOPS EBS"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D. No formatted community vote is present. 'EBS optimized' is the real EC2 launch configuration that provisions a dedicated, guaranteed-throughput connection between the instance and its attached EBS volumes, separate from the instance's general network traffic -- exactly what's needed to eliminate contention for EC2-to-EBS bandwidth. 'EBS dedicated' (A and C) and 'EBS enhanced' (B) are not real AWS terms for this feature; the actual option is specifically named 'EBS-optimized'. One comment (albert_kuo) muses that C and D 'could both be correct,' but C uses the same invented 'dedicated' terminology as A rather than the real 'optimized' term, so it doesn't hold up as a genuine alternative.", "facets": {"service": ["EC2", "EBS"], "concern": ["ebs-optimized-dedicated-throughput"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 2, "question_number": 302}, "fingerprint": "56d2f5e24c6eec69cab9646be38759b27efcea883d31d39c7c86988c152cc040"}, {"id": "awssysops-p2-q307", "status": "active", "disputed": false, "stem": "How can you secure data at rest on an EBS volume?", "choice_type": "single", "choices": [{"letter": "A", "text": "Encrypt the volume using the S3 server-side encryption service."}, {"letter": "B", "text": "Attach the volume to an instance using EC2's SSL interface."}, {"letter": "C", "text": "Create an IAM policy that restricts read and write access to the volume."}, {"letter": "D", "text": "Write the data randomly instead of sequentially."}, {"letter": "E", "text": "Use an encrypted file system on top of the EBS volume."}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Boxed answer: C, but this is a well-evidenced boxed-vs-vote conflict: the recorded vote is unanimous for E (100%), backed by a heavily-upvoted comment (saumenP, 10 upvotes) linking a detailed writeup on securing AWS data at rest. The question specifically asks about protecting data 'at rest' -- i.e. the data itself while stored -- which calls for encryption (E: stacking an encrypted file system on top of the EBS volume). C (an IAM policy restricting read/write access) instead controls who can access the volume, which is an access-control measure, not an encryption-at-rest measure -- as one comment (dennismp) puts it, IAM 'could control data access but the data residing there' remains unencrypted and thus not actually secured 'at rest' if the volume or its snapshot were ever exposed by other means. One comment (kteng) pushes back slightly, noting E-style filesystem encryption is more naturally scoped to a specific directory rather than the whole volume, and voices some sympathy for C, but ultimately still leans toward E fitting the question's specific 'at rest' framing better. A and B both misapply S3-specific or connection-level (SSL) mechanisms that don't address at-rest protection of the volume's own data. D is nonsensical as a security measure.", "facets": {"service": ["EBS"], "concern": ["data-at-rest-encryption-method"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 8, "question_number": 307}, "fingerprint": "b2d726377ef4a8713801df9f2a08a694829724cb536203f4d1eec91c4677d93d"}, {"id": "awssysops-p2-q309", "status": "active", "disputed": false, "stem": "Amazon EBS snapshots have which of the following two characteristics? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "EBS snapshots only save incremental changes from snapshot to snapshot"}, {"letter": "B", "text": "EBS snapshots can be created in real-time without stopping an EC2 instance"}, {"letter": "C", "text": "EBS snapshots can only be restored to an EBS volume of the same size or smaller"}, {"letter": "D", "text": "EBS snapshots can only be restored and mounted to an instance in the same Availability Zone as the original EBS volume"}], "correct_answer": ["A", "B"], "source_correct_answer": ["A", "B"], "correct_answer_override": null, "explanation": "Correct answer: A, B (unanimous formatted community vote, 100%), confirmed by the AWS documentation linked in two comments. EBS snapshots are incremental -- only modified blocks since the last snapshot are saved (the first snapshot alone captures the full volume) -- and they can be taken while the volume is attached and in use, without stopping the instance. C is wrong since a snapshot can actually be restored to a larger volume than the original (just not smaller). D is wrong since a snapshot (stored in S3 under the hood) can be restored into a new volume in any Availability Zone within the same region, not only the original one -- one comment (karmaah) notes this is in fact how you move an EBS volume's data across AZs.", "facets": {"service": ["EBS"], "concern": ["snapshot-incremental-and-live-creation"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 11, "question_number": 309}, "fingerprint": "205e7d1a65f1793bd214aeaa73b3507e94f211a454b2b9ff08a107173474ac92"}, {"id": "awssysops-p2-q317", "status": "active", "disputed": false, "stem": "How can an EBS volume that is currently attached to an EC2 instance be migrated from one Availability Zone to another?", "choice_type": "single", "choices": [{"letter": "A", "text": "Simply create a new volume in the other AZ and specify the original volume as the source."}, {"letter": "B", "text": "Detach the volume, then use the ec2-migrate-volume command to move it to another AZ."}, {"letter": "C", "text": "Create a snapshot of the volume, and create a new volume from the snapshot in the other AZ."}, {"letter": "D", "text": "Detach the volume and attach it to another EC2 instance in the other AZ."}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous formatted community vote, 100%), confirmed by the AWS documentation linked in the passage. EBS volumes are zone-locked -- they can only attach to instances in their own AZ -- so moving one across AZs requires snapshotting it (snapshots are stored in S3, which is region-wide, not zone-locked) and then creating a new volume from that snapshot in the target AZ. A invents a direct volume-to-volume copy across AZs, which isn't how EBS works. B invents a nonexistent 'ec2-migrate-volume' command. D just moves the instance attachment within the original AZ -- an EBS volume can't attach to an instance in a different AZ at all, regardless of detach/reattach.", "facets": {"service": ["EBS"], "concern": ["cross-az-volume-migration-via-snapshot"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 19, "question_number": 317}, "fingerprint": "6dbb240ad4c770b1f2a126593c93ae5b22a8e49d02f7e5622a7a7370e0c95f9e"}, {"id": "awssysops-p2-q322", "status": "active", "disputed": false, "stem": "In AWS, which security aspects are the customer's responsibility? (Choose four.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Controlling physical access to compute resources"}, {"letter": "B", "text": "Patch management on the EC2 instance's operating system"}, {"letter": "C", "text": "Encryption of EBS (Elastic Block Storage) volumes"}, {"letter": "D", "text": "Life-cycle management of IAM credentials"}, {"letter": "E", "text": "Decommissioning storage devices"}, {"letter": "F", "text": "Security Group and ACL (Access Control List) settings"}], "correct_answer": ["B", "C", "D", "F"], "source_correct_answer": ["B", "C", "D", "F"], "correct_answer_override": null, "explanation": "Correct answer: B, C, D, F -- recovered directly from the source's own leaked 'Correct Answer:BCDF' text (see conversion_notes for how this was reconstructed from a column-merge extraction failure), and unanimously confirmed by three independent named commenters. This maps cleanly onto the AWS Shared Responsibility Model: the customer owns everything 'in' the cloud -- guest OS patching (B), choosing to encrypt their own volumes (C), managing the lifecycle of their own IAM credentials (D), and configuring their own network-level Security Group/NACL rules (F). AWS itself owns everything 'of' the cloud infrastructure -- physical access control to the underlying hardware (A) and decommissioning the physical storage devices once retired (E) are both AWS's responsibility, not the customer's, since the customer never has physical or hardware-level access to begin with.", "facets": {"service": ["IAM", "EC2", "EBS"], "concern": ["shared-responsibility-model-customer-side"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 24, "question_number": 322}, "fingerprint": "dbe4b988238a2e55888f291886ec9c542e8fca5110a2f64becefa1c4dec5abc9"}, {"id": "awssysops-p2-q328", "status": "active", "disputed": false, "stem": "A database running on Amazon EC2 requires sustained IOPS performance.\nWhich kind of Amazon EBS volume should an Administrator choose for this solution?", "choice_type": "single", "choices": [{"letter": "A", "text": "Cloud HDD"}, {"letter": "B", "text": "General Purpose SSD"}, {"letter": "C", "text": "Provisioned IOPS SSD"}, {"letter": "D", "text": "Throughput Optimized HDD"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "Correct answer: C (unanimous formatted community vote, 100%), confirmed by the AWS EBS volume types documentation linked in the passage. Provisioned IOPS SSD is the volume type designed specifically for sustained, predictable, high-IOPS workloads like databases -- the customer specifies a target IOPS level and EBS guarantees it. A (Cloud HDD) isn't an actual EBS volume type. B (General Purpose SSD) offers good baseline performance with burstable credits, but doesn't guarantee sustained IOPS the way Provisioned IOPS SSD does. D (Throughput Optimized HDD) is optimized for large, sequential throughput-heavy workloads (e.g. big data, log processing), not the small, random, IOPS-heavy access pattern typical of a database.", "facets": {"service": ["EBS"], "concern": ["sustained-iops-volume-selection"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 31, "question_number": 328}, "fingerprint": "b4c7e900b9ba74fbc0a28ec2b7a9f109c682476952e2e69fb1c4b9c790af7565"}, {"id": "awssysops-p2-q344", "status": "active", "disputed": false, "stem": "A block device is a storage device that moves data in sequences. How many types of block devices does Amazon EC2 support?", "choice_type": "single", "choices": [{"letter": "A", "text": "2 -instance store volumes and EBS volumes"}, {"letter": "B", "text": "5 -General Purpose SSD, Provisioned IOPS SSD, Throughput Optimized HDD, Cold HDD, and Magnetic"}, {"letter": "C", "text": "3 -SSD, HDD, and Magnetic"}, {"letter": "D", "text": "1 -instance store volumes"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A (unanimous formatted community vote, 100%, including a self-correction from AMohanty after initially picking B), confirmed by the AWS documentation linked in the passage. EC2 supports exactly two block device types: instance store volumes (physically attache
