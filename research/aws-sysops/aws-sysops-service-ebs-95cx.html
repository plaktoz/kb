d to the host) and EBS volumes (network-attached remote storage). B's list (General Purpose SSD, Provisioned IOPS SSD, etc.) describes EBS *volume types*, a sub-classification within just one of the two block device types, not block devices themselves. C and D undercount or mischaracterize the same distinction.", "facets": {"service": ["EC2", "EBS"], "concern": ["block-device-types-count"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 48, "question_number": 344}, "fingerprint": "2244556dc6c3e31a6801778c1c6ebf09ee5d86aef9e7f3f9bae3fbc3111f628f"}, {"id": "awssysops-p2-q345", "status": "active", "disputed": false, "stem": "Do Amazon EBS volumes persist independently from the running life of an Amazon EC2 instance?", "choice_type": "single", "choices": [{"letter": "A", "text": "No, they are dependent."}, {"letter": "B", "text": "No, you cannot attach EBS volumes to an instance."}, {"letter": "C", "text": "Yes, they do but only if they are detached from the instance."}, {"letter": "D", "text": "Yes, they do, if the Delete on termination flag is unset."}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "Correct answer: D (unanimous formatted community vote, 100%), confirmed by the AWS EBS documentation linked in the passage. EBS volumes are independent, persistent storage that outlives the instance's lifecycle by default -- the exception is the root volume's Delete on Termination flag, which if left set (the default for root volumes) causes that volume to be deleted along with the instance on termination; unsetting it preserves the volume. A and B mischaracterize EBS as inherently tied to the instance. C wrongly claims detachment is a precondition for persistence -- persistence doesn't require detaching first.", "facets": {"service": ["EBS"], "concern": ["volume-persistence-delete-on-termination"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 49, "question_number": 345}, "fingerprint": "afb29b381aed9c18d62da2a4efa3a40cfc6e5544a29d9563cbd066e753804154"}, {"id": "awssysops-p2-q352", "status": "active", "disputed": false, "stem": "When an instance terminates, Amazon EC2 uses the value of the _____ attribute for each attached Amazon EBS volume to determine whether to preserve or delete the volume.", "choice_type": "single", "choices": [{"letter": "A", "text": "InstanceInitiatedShutdownBehavior"}, {"letter": "B", "text": "DeleteOnTermination"}, {"letter": "C", "text": "EC2ModifyInstance"}, {"letter": "D", "text": "DisableApiTermination"}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "Correct answer: B, confirmed by the AWS EC2 termination documentation linked in the passage, and directly related to Q345's DeleteOnTermination discussion. This is the exact attribute checked per-volume at termination time. A (InstanceInitiatedShutdownBehavior) controls whether an OS-level shutdown stops or terminates the instance, not volume deletion. C isn't a real attribute name. D (DisableApiTermination) is a termination-protection guard, unrelated to volume handling.", "facets": {"service": ["EBS", "EC2"], "concern": ["deleteontermination-attribute"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 56, "question_number": 352}, "fingerprint": "54477ae7ba992ad6aa11bb73beb2112a5bbb13599868ea75dc50f48994d785ce"}, {"id": "awssysops-p2-q358", "status": "active", "disputed": false, "stem": "Amazon EBS provides the ability to create backups of any Amazon EC2 volume into what is known as _____.", "choice_type": "single", "choices": [{"letter": "A", "text": "snapshots"}, {"letter": "B", "text": "mirrors"}, {"letter": "C", "text": "instance backups"}, {"letter": "D", "text": "images"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "Correct answer: A, confirmed by the AWS EBS documentation linked in the passage. EBS backups are called snapshots, and can later be used to create new EBS volumes. B, C, and D use terminology EBS doesn't actually use for this feature ('images' specifically refers to AMIs, a distinct EC2-level concept, not an EBS volume backup).", "facets": {"service": ["EBS"], "concern": ["snapshot-backup-terminology"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 59, "question_number": 358}, "fingerprint": "b76c76fef08f5bdaa8481863841e4c344d5f6344912695fb8ae007c2e38547a1"}, {"id": "awssysops-p2-q361", "status": "active", "disputed": false, "stem": "What does Amazon EBS stand for?", "choice_type": "single", "choices": [{"letter": "A", "text": "Elastic Business Server"}, {"letter": "B", "text": "Elastic Basic Storage"}, {"letter": "C", "text": "Elastic Blade Server"}, {"letter": "D", "text": "Elastic Block Store"}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "EBS stands for Elastic Block Store: persistent block storage for EC2 instances, automatically replicated within its Availability Zone, with the ability to scale capacity and IOPS as needed. See https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEBS.html.", "facets": {"service": ["EBS"], "concern": ["ebs-acronym"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 62, "question_number": 361}, "fingerprint": "c8fe954b0e397eea101c3e5781192faa4ad69a6a1d0a8d829846510c9fa46103"}, {"id": "awssysops-p2-q362", "status": "active", "disputed": false, "stem": "EBS (Elastic Block Store) can be best described as:", "choice_type": "single", "choices": [{"letter": "A", "text": "persistent internet storage."}, {"letter": "B", "text": "persistent block storage."}, {"letter": "C", "text": "transient instance storage."}, {"letter": "D", "text": "transient block storage."}], "correct_answer": ["B"], "source_correct_answer": ["B"], "correct_answer_override": null, "explanation": "EBS provides block-level storage volumes that persist independently of the life of the attaching instance, distinguishing it from EC2's ephemeral instance store. Volumes are highly available within their Availability Zone and can attach to any running instance there. See https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEBS.html.", "facets": {"service": ["EBS"], "concern": ["ebs-storage-characteristics"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 62, "question_number": 362}, "fingerprint": "179fa6b5b50cfcd095be7b68c16af4dea465b23b17469594e4974122c56102f9"}, {"id": "awssysops-p2-q370", "status": "active", "disputed": false, "stem": "In Amazon EC2, can you create an EBS volume from a snapshot and attach it to another instance?", "choice_type": "single", "choices": [{"letter": "A", "text": "No, you cannot attach EBS volumes to an instance."}, {"letter": "B", "text": "Yes, you can but only if the volume is larger than 2TB."}, {"letter": "C", "text": "No, you can't create an EBS volume from a snapshot."}, {"letter": "D", "text": "Yes, you can."}], "correct_answer": ["D"], "source_correct_answer": ["D"], "correct_answer_override": null, "explanation": "You can create a new EBS volume from an existing snapshot (itself stored in S3) and attach that new volume to any instance in the same Availability Zone as the volume — no size restriction applies. See http://docs.amazonwebservices.com/AWSEC2/latest/UserGuide/Storage.html.", "facets": {"service": ["EBS"], "concern": ["snapshot-to-volume-restore"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 66, "question_number": 370}, "fingerprint": "dfd370f8e34f5b23222296db05895ac65dac6fa02fdf931949c52f5c62c94e95"}, {"id": "awssysops-p2-q425", "status": "active", "disputed": false, "stem": "In the 'Detailed' monitoring data available for your Amazon EBS volumes, Provisioned IOPS volumes automatically send _____ minute metrics to Amazon CloudWatch.", "choice_type": "single", "choices": [{"letter": "A", "text": "4"}, {"letter": "B", "text": "2"}, {"letter": "C", "text": "1"}, {"letter": "D", "text": "5"}], "correct_answer": ["C"], "source_correct_answer": ["C"], "correct_answer_override": null, "explanation": "With detailed monitoring enabled, Provisioned IOPS (io1/io2) EBS volumes automatically send 1-minute metrics to CloudWatch. See https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using_cloudwatch_ebs.html. Community vote distribution was unanimous at C (100%).", "facets": {"service": ["EBS", "CloudWatch"], "concern": ["piops-detailed-monitoring-interval"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 108, "question_number": 425}, "fingerprint": "9b0f8d2510925f5768128850e59f39462d06486c9ca1c60423a1df74319591b7"}, {"id": "awssysops-p2-q471", "status": "active", "disputed": true, "stem": "A user is planning to schedule a backup for an existing EBS volume. The user wants the backup to be created through snapshot, and for it to be encrypted. How can the user achieve data encryption with a snapshot?", "choice_type": "single", "choices": [{"letter": "A", "text": "Encrypt the existing EBS volumes so that the snapshot will be encrypted by AWS when it is created"}, {"letter": "B", "text": "By default the snapshot is encrypted by AWS"}, {"letter": "C", "text": "While creating a snapshot select the snapshot with encryption"}, {"letter": "D", "text": "Enable server side encryption for the snapshot using S3"}], "correct_answer": ["A"], "source_correct_answer": ["A"], "correct_answer_override": null, "explanation": "A snapshot taken from an encrypted EBS volume is automatically encrypted, using AES-256 — encryption isn't something you toggle at snapshot-creation time (as C implies) or handled via S3 server-side encryption (D), and it isn't on by default (B). See https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html. Community vote distribution was unanimous at A (100%), but this is a substantially disputed question: multiple highly-upvoted commenters (CuLeBrO, sen12, karmaah) point out that an *existing, already-unencrypted* EBS volume's encryption state cannot actually be changed after the fact — the real-world procedure requires snapshotting the unencrypted volume, then copying that snapshot with encryption enabled, rather than simply \"encrypting the existing volume\" as A literally states. CuLeBrO explicitly concludes there's no cleanly correct option among the choices and picks A only because a selection is mandatory.", "facets": {"service": ["EBS"], "concern": ["snapshot-encryption-inheritance"]}, "source": {"file": "papers/aws-sysops/AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 150, "question_number": 471}, "fingerprint": "dffd61aaf607093d75d401b0325757690e2e6d718b047c466d6ef5cffaf9ed31"}, {"id": "awssysops-p2-q545", "status": "active", "disputed": true, "stem": "A new application is being tested for deployment on an Amazon EC2 instance that requires greater IOPS than currently provided by the single 4TB General Purpose SSD (gp2) volume.\nWhich actions should be taken to provide additional Amazon EBS IOPS for the application? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Increase the size of the General Purpose (gp2) volume"}, {"letter": "B", "text": "Use RAID 0 to distribute I/O across multiple volumes"}, {"letter": "C", "text": "Migrate to a Provisioned IOPS SSD (io1) volume"}, {"letter": "D", "text": "Enable MAX I/O performance mode on the General Purpose (gp2) volume"}, {"letter": "E", "text": "Use RAID 1 to distribute I/O across multiple volumes"}], "correct_answer": ["A", "D"], "source_correct_answer": ["A", "D"], "correct_answer_override": null, "explanation": "A gp2 volume's IOPS scale with its provisioned size only up to a ceiling (diminishing gains well before 4TB, effectively flat past ~5.3TB), so resizing further (A) yields little benefit. 'Max I/O' performance mode (D) is actually an Amazon EFS throughput mode, not a gp2/EBS feature at all — a factual error in the boxed answer. The community's unanimous (100%) vote instead favors B & C: striping I/O across multiple volumes with RAID 0, and/or migrating to Provisioned IOPS (io1), which decouples IOPS from volume size entirely. Flagged disputed given the unanimous, well-documented reversal of both boxed letters.", "facets": {"service": ["EBS"], "concern": ["iops-scaling", "volume-type-migration", "raid-0"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 227, "question_number": 545}, "fingerprint": "b78048e8b2c8f6729fd000296f1d7690a37dac727a6b30f25ea56cd52db493ee"}, {"id": "awssysops-p2-q548", "status": "active", "disputed": true, "stem": "An existing, deployed solution uses Amazon EC2 instances with Amazon EBS General Purpose SSD volumes, an Amazon RDS PostgreSQL database, an\nAmazon EFS file system, and static objects stored in an Amazon S3 bucket. The Security team now mandates that at-rest encryption be turned on immediately for all aspects of the application, without creating new resources and without any downtime.\nTo satisfy the requirements, which one of these services can the SysOps Administrator enable at-rest encryption on?", "choice_type": "single", "choices": [{"letter": "A", "text": "EBS General Purpose SSD volumes"}, {"letter": "B", "text": "RDS PostgreSQL database"}, {"letter": "C", "text": "Amazon EFS file systems"}, {"letter": "D", "text": "S3 objects within a bucket"}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "EBS, RDS, and EFS encryption can only be enabled at resource-creation time — none of the three can be turned on in place on an already-running volume, database, or file system without provisioning a new encrypted replacement, which the requirement explicitly rules out. S3 is the exception: default bucket encryption can be enabled immediately for all new objects, and existing objects can be re-encrypted in place with zero downtime via an S3 Batch Operations copy job. The recorded vote is unanimous (100%) for D, directly contradicting the boxed answer A, backed by detailed commentary walking through why each other option fails the 'no new resources, no downtime' constraint.", "facets": {"service": ["S3", "EBS", "RDS", "EFS"], "concern": ["at-rest-encryption", "existing-resource-encryption"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 233, "question_number": 548}, "fingerprint": "6db465e9175d8efe8692377035a0edfa857ba81a161be1b7cac8e57f7b2a9c98"}, {"id": "awssysops-p2-q585", "status": "active", "disputed": true, "stem": "An Amazon EBS volume attached to an EC2 instance was recently modified. Part of the modification included increasing the storage capacity. The SysOps Administrator notices that the increased storage capacity is not reflected in the file system. Which step should the Administrator complete to use the increased storage capacity?", "choice_type": "single", "choices": [{"letter": "A", "text": "Restart the EC2 instance."}, {"letter": "B", "text": "Extend the volume's file system."}, {"letter": "C", "text": "Detach the EBS volume, resize it, and attach it."}, {"letter": "D", "text": "Take an EBS snapshot and restore it to the bigger volume."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "Per AWS's own Elastic Volumes documentation (cited directly by multiple commenters): 'Modifying volume size has no practical effect until you also extend the volume's file system to make use of the new storage capacity' — resizing the underlying EBS volume is only step one; the file system itself must then be extended with filesystem-specific commands (e.g. growpart/resize2fs, or xfs_growfs). Restarting the instance (the boxed answer, A) has no effect on the file system's own size tracking. Community vote is unanimous (100%) for B, directly contradicting the boxed answer A, backed by direct AWS documentation citations across nearly every comment — one commenter even explicitly flags this specific answer-key error as a known, recurring mismatch on this exam dump.", "facets": {"service": ["EBS"], "concern": ["elastic-volume-resize", "extend-file-system"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 281, "question_number": 585}, "fingerprint": "9839b709189de92f38c5514a5b674230ddbd4018604ff71590770a2c4ab9ea1b"}, {"id": "awssysops-p2-q598", "status": "active", "disputed": true, "stem": "A company's data retention policy dictates that backups be stored for exactly two years. After that time, the data must be deleted.\nHow can Amazon EBS snapshots be managed to conform to this data retention policy?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use an Amazon S3 lifecycle policy to delete snapshots older than two years."}, {"letter": "B", "text": "Configure Amazon Inspector to find and delete old EBS snapshots."}, {"letter": "C", "text": "Schedule an AWS Lambda function using Amazon CloudWatch Events to periodically run a script to delete old snapshots."}, {"letter": "D", "text": "Configure an Amazon CloudWatch alarm to trigger the launch of an AWS CloudFormation template that will clean the older snapshots."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "EBS snapshots are stored on S3 infrastructure that AWS itself owns and manages — not inside any bucket in the customer's own account — so an S3 lifecycle policy (the boxed answer, A) has no bucket to attach to and can't actually be configured against them at all, as several heavily-upvoted comments explain directly ('you are not going to find your snapshots in any of your S3 buckets... you cannot access them while they reside in S3'). The community's alternative — a scheduled Lambda function (via CloudWatch Events) that runs a script to delete snapshots older than two years — is a real, documented pattern (Amazon Data Lifecycle Manager or a bespoke boto3 script), and votes are unanimous (100%) for C, directly contradicting boxed answer A.", "facets": {"service": ["EBS"], "concern": ["snapshot-lifecycle-automation", "retention-policy"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 304, "question_number": 598}, "fingerprint": "f100df11677d8e5bb7c6fd4f4876902a411a68479b27179e9ca2a81207100c30"}, {"id": "awssysops-p2-q599", "status": "active", "disputed": true, "stem": "A SysOps Administrator must devise a strategy for enforcing tagging of all EC2 instances and Amazon Elastic Block Store (Amazon EBS) volumes.\nWhat action can the Administrator take to implement this for real-time enforcement?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use the AWS Tag Editor to manually search for untagged resources and then tag them properly in the editor."}, {"letter": "B", "text": "Set up AWS Service Catalog with the TagOptions Library rule that enforces a tagging taxonomy proactively when instances and volumes are launched."}, {"letter": "C", "text": "In a PowerShell or shell script, check for untagged items by using the resource tagging GetResources API action, and then manually tag the reported items."}, {"letter": "D", "text": "Launch items by using the AWS API. Use the TagResources API action to apply the required tags when the instances and volumes are launched."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "The top comment (27 upvotes) quotes an AWS tagging-strategy whitepaper drawing a specific line between reactive tools — Tag Editor, the resource-tagging GetResources API, AWS Config rules — which only find already-untagged resources after the fact, and proactive tools — CloudFormation, Service Catalog, IAM — which apply tags automatically the moment a resource is created. Since the question specifically asks for real-time enforcement, AWS Service Catalog's TagOptions library (B) is the purpose-built proactive mechanism, which the majority of top comments and AWS's own Service Catalog documentation both support; a minority argue for D (tagging at launch via the TagResources API) as similarly real-time. The boxed answer A (manually searching for untagged resources with Tag Editor) is a reactive, manual process that no commenter argues for at all, and the source's own embedded vote tally — D at 50%, B at 50% — doesn't include A and sits below the 60% mechanical disputed threshold, so this is flagged disputed regardless of which of D or B is ultimately correct.", "facets": {"service": ["Service Catalog", "EC2", "EBS"], "concern": ["tagging-enforcement", "proactive-governance"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopics P2.pdf", "page": 306, "question_number": 599}, "fingerprint": "704c287b1e5fef6a511d60fd71623ac4aa05ee68da0bddc44063b428e199b5a1"}, {"id": "awssysops-p3-1-q665", "status": "active", "disputed": false, "stem": "An organization finds that a high number of gp2 Amazon EBS volumes are running out of space.\nWhich solution will provide the LEAST disruption with MINIMAL effort?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create a snapshot and restore it to a larger gp2 volume."}, {"letter": "B", "text": "Create a RAID 0 with another new gp2 volume to increase capacity."}, {"letter": "C", "text": "Leverage the Elastic Volumes feature of EBS to increase gp2 volume size."}, {"letter": "D", "text": "Write a script to migrate data to a larger gp2 volume."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "The Elastic Volumes feature lets an EBS volume's size be increased in place, live, without detaching it, taking a snapshot, or reconnecting the instance — the least disruptive and lowest-effort option by a wide margin. Snapshotting and restoring to a larger volume (A) or scripting a manual data migration (D) both require creating a new volume and moving data over, with associated downtime; adding a second volume in a RAID 0 (B) adds operational complexity and a second single point of failure rather than simply growing the existing volume. Community vote is unanimous (100%) for C, backed directly by the AWS EBS Elastic Volumes feature page.", "facets": {"service": ["EBS"], "concern": ["elastic-volumes-resize", "gp2-capacity-expansion"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 112, "question_number": 665}, "fingerprint": "7ea4a23ad1913f1863829508b4c5d3bc7cde90d943fb2bfc7598d38d1f65e38b"}, {"id": "awssysops-p3-1-q727", "status": "active", "disputed": false, "stem": "A SysOps Administrator needs an Amazon EBS volume type for a big data application. The application data is accessed infrequently and stored sequentially.\nWhat EBS volume type will be the MOST cost-effective solution?", "choice_type": "single", "choices": [{"letter": "A", "text": "Provisioned IOPS SSD (io1)"}, {"letter": "B", "text": "Cold HDD (sc1)"}, {"letter": "C", "text": "Throughput Optimized HDD (st1)"}, {"letter": "D", "text": "General Purpose SSD (gp2)"}], "correct_answer": ["B"], "source_correct_answer": "B", "correct_answer_override": null, "explanation": "Cold HDD (sc1) is AWS's lowest-cost-per-GB EBS volume type, purpose-built for large, sequential, infrequently-accessed ('cold') data, directly matching both requirements in the stem and the referenced AWS EBS features page. A brief thread of comments favors Throughput Optimized HDD (st1, choice C) instead, since st1 is tuned for frequently-accessed sequential big-data workloads like EMR or data warehouses — but the stem specifically calls out infrequent access and asks for the MOST cost-effective option, and st1's higher baseline throughput comes at a higher price point than sc1, which the discussion resolves in sc1/B's favor once the cost-vs-throughput distinction is pointed out. Provisioned IOPS SSD (A) and General Purpose SSD (D) are priced for random-access, latency-sensitive workloads, far more expensive than either HDD type for this infrequent, sequential access pattern. Community vote is unanimous (100%) for B, matching the boxed answer.", "facets": {"service": ["EBS"], "concern": ["cold-hdd-infrequent-sequential-cost"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 214, "question_number": 727}, "fingerprint": "deff02f61ac60eafc32c8b4ab5353d534613a1deac47d94e56adb6e9e4c2c84e"}, {"id": "awssysops-p3-1-q830", "status": "active", "disputed": false, "stem": "A user accidentally deleted a file from an Amazon EBS volume. The SysOps Administrator identified a recent snapshot for the volume.\nWhat should the Administrator do to restore the user's file from the snapshot?", "choice_type": "single", "choices": [{"letter": "A", "text": "Attach the snapshot to a new Amazon EC2 instance in the same Availability Zone, and copy the deleted file."}, {"letter": "B", "text": "Browse to the snapshot and copy the file to the EBS volume within an Amazon EC2 instance."}, {"letter": "C", "text": "Create a volume from the snapshot, attach the volume to an Amazon EC2 instance, and copy the deleted file."}, {"letter": "D", "text": "Restore the file from the snapshot onto an EC2 instance using the Amazon EC2 console."}], "correct_answer": ["C"], "source_correct_answer": "C", "correct_answer_override": null, "explanation": "A snapshot itself isn't directly attachable or browsable — it must first be materialized as a new EBS volume, which can then be attached to a running EC2 instance so the deleted file can be copied out of it, per the referenced AWS Compute blog on recovering files from an EBS volume backup. Snapshots cannot be attached directly to an instance (ruling out A) or browsed for individual files without first creating a volume (ruling out B), and there's no EC2-console feature for restoring an individual file directly from a snapshot (ruling out D) — a snapshot can only be used to create either an image or a volume, the latter being exactly option C. Community consensus is unanimous for C, matching the boxed answer.", "facets": {"service": ["EBS"], "concern": ["snapshot-to-volume-file-recovery"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 385, "question_number": 830}, "fingerprint": "716348af2ceb4a929367a191c9d04c49e9452ef1fff4d46feddbc393a03e0fef"}, {"id": "awssysops-p3-1-q888", "status": "active", "disputed": true, "stem": "A company has an application that is hosted on two Amazon EC2 instances in different Availability Zones. Both instances contain data that is critical for the company's business. Backups need to be retained for 7 days and need to be updated every 12 hours.\nWhich solution will meet these requirements with the LEAST amount of effort?", "choice_type": "single", "choices": [{"letter": "A", "text": "Use an Amazon EventBridge (Amazon CloudWatch Events) scheduled rule to create snapshots of the Amazon Elastic Block Store (Amazon EBS) volumes."}, {"letter": "B", "text": "Use Amazon Data Lifecycle Manager (Amazon DLM) to create a snapshot lifecycle policy for both instances."}, {"letter": "C", "text": "Create a batch job to generate automated snapshots of the Amazon Elastic Block Store (Amazon EBS) volumes."}, {"letter": "D", "text": "Create an AWS Lambda function to copy the data to Amazon S3 Glacier."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "Amazon Data Lifecycle Manager is a purpose-built, fully managed policy for EBS snapshots that natively handles scheduled creation, a defined retention count/period, and automatic deletion of aged-out snapshots in a single policy — needing no custom scheduling logic or cleanup code at all, per the EBS snapshot-lifecycle documentation quoted directly in the discussion. The boxed answer's EventBridge scheduled rule (A) only triggers snapshot creation on a schedule; it provides no built-in retention/deletion mechanism, so the administrator would still need to build separate logic to enforce the 7-day retention window, making it strictly more effort than DLM's all-in-one policy. A custom batch job (C) requires building and hosting the scheduling logic from scratch, and copying data to S3 Glacier via Lambda (D) is an archival pattern, not a snapshot-based backup, and doesn't match how EBS backups are normally retained. Community vote is unanimous (100%) for B, directly contradicting the boxed answer A. Flagged disputed for triage, while keeping the boxed answer A per the ingestion policy.", "facets": {"service": ["EBS", "Data Lifecycle Manager"], "concern": ["automated-snapshot-lifecycle-least-effort"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 468, "question_number": 888}, "fingerprint": "826139459b10b3386038f351cecb50f28d6f2448c2903f0e5e9f085b7a0cc428"}, {"id": "awssysops-p3-1-q892", "status": "active", "disputed": false, "stem": "An Amazon EC2 instance has a secondary Amazon Elastic Block Store (EBS) volume attached that contains sensitive data. A new company policy requires the secondary volume to be encrypted at rest.\nWhich solution will meet this requirement?", "choice_type": "single", "choices": [{"letter": "A", "text": "Create a snapshot of the volume. Create a new volume from the snapshot with the Encrypted parameter set to true. Detach the original volume and attach the new volume to the instance."}, {"letter": "B", "text": "Create an encrypted Amazon Machine Image (AMI) of the EC2 instance. Launch a new instance with the encrypted AMI. Terminate the original instance."}, {"letter": "C", "text": "Stop the EC2 instance. Encrypt the volume with AWS CloudHSM. Start the instance and verify encryption."}, {"letter": "D", "text": "Stop the EC2 instance. Modify the instance properties and set the Encrypted parameter to true. Start the instance and verify encryption."}], "correct_answer": ["A"], "source_correct_answer": "A", "correct_answer_override": null, "explanation": "An existing EBS volume cannot be encrypted in place — the only way to encrypt it is to snapshot it, create a new volume from that snapshot with encryption enabled, and swap it in for the original, per the reasoning corroborated heavily (4+ upvotes on the top comment) and directly cited: 'Existing EBS volumes cannot be encrypted on the fly. A new volume must be created from the original volume's snapshot with encryption enabled.' Rebuilding the whole instance from an encrypted AMI (B) is a much heavier operation than needed for just a secondary data volume and still relies on the same underlying snapshot-based encryption mechanism. There is no 'Encrypted' instance property to modify directly (D, not a real EC2 instance attribute), and AWS CloudHSM (C) manages cryptographic keys — it isn't itself a mechanism for encrypting an existing EBS volume. Community consensus is unanimous for A, matching the boxed answer.", "facets": {"service": ["EBS"], "concern": ["snapshot-recreate-required-to-encrypt-existing-volume"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 473, "question_number": 892}, "fingerprint": "3b4874c496ff8a289583109d05fab33d310b74b88ff750a9131434a538fadc49"}, {"id": "awssysops-p3-1-q913", "status": "active", "disputed": true, "stem": "A SysOps administrator is implementing automated I/O load performance testing as part of the continuous integration/continuous delivery (CI/CD) process for an application. The application uses an Amazon Elastic Block Store (Amazon EBS) Provisioned IOPS volume for each instance that is restored from a snapshot and requires consistent I/O performance. During the initial tests, the I/O performance results are sporadic. The SysOps administrator must ensure that the tests yield more consistent results.\nWhich actions could the SysOps administrator take to accomplish this goal? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "Restore the EBS volume from the snapshot with fast snapshot restore enabled."}, {"letter": "B", "text": "Restore the EBS volume from the snapshot using the cold HDD volume type."}, {"letter": "C", "text": "Restore the EBS volume from the snapshot and pre-warm the volume by reading all of the blocks."}, {"letter": "D", "text": "Restore the EBS volume from the snapshot and configure encryption."}, {"letter": "E", "text": "Restore the EBS volume from the snapshot and configure I/O block size at random."}], "correct_answer": ["A", "B"], "source_correct_answer": "A,B", "correct_answer_override": null, "explanation": "A volume restored from a snapshot lazily loads its data from Amazon S3 in the background, so the very first access to any given block incurs extra latency until that block is pulled down — enabling fast snapshot restore (A) eliminates this by fully initializing the volume at creation time, and reading every block up front to pre-warm the volume (C) accomplishes the same initialization manually, per the EC2 volume-initialization documentation cited directly and corroborated across the discussion; either avoids the sporadic first-touch latency that's causing inconsistent I/O results. The boxed answer's cold HDD (sc1) volume type (B) is a fundamentally wrong-category substitution: sc1 is a low-cost, throughput-oriented volume type that does not support Provisioned IOPS at all, directly contradicting the stem's own requirement that the workload uses a Provisioned IOPS volume — switching to it would change the volume type away from what the workload needs rather than fixing its consistency. Community vote is unanimous (100%) for A, C, directly contradicting the boxed answer's B. Flagged disputed for triage, while keeping the boxed answer A, B per the ingestion policy.", "facets": {"service": ["EBS"], "concern": ["fast-snapshot-restore-and-prewarming-for-consistent-io-performance"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 495, "question_number": 913}, "fingerprint": "6a7096bfe46b1b68ce26c90a3f2b79b2455ea77ee835a4677063d8bd3bcc1161"}, {"id": "awssysops-p3-1-q921", "status": "active", "disputed": false, "stem": "A company uses many Amazon Elastic Block Store (Amazon EBS) volumes. The company wants to use Amazon Data Lifecycle Manager (Amazon DLM) to manage the lifecycle of EBS snapshots that have tags of `Production` and `Compliance`.\nWhich combination of the following are needed to turn on this feature? (Choose two.)", "choice_type": "multi", "choices": [{"letter": "A", "text": "A minimum storage requirement of 5 GB"}, {"letter": "B", "text": "One IAM role for Amazon DLM and another IAM role for the users"}, {"letter": "C", "text": "Encryption of the EBS volumes"}, {"letter": "D", "text": "A minimum baseline performance of 3 IOPS/GB"}, {"letter": "E", "text": "Tagging of the EBS volumes"}], "correct_answer": ["B", "E"], "source_correct_answer": "B,E", "correct_answer_override": null, "explanation": "Amazon DLM selects which EBS volumes to snapshot based on tags applied to those volumes, so tagging the volumes (E) is a prerequisite for policy targeting, and DLM needs an IAM role granting it permission to create/manage snapshots on the users' behalf, separate from the IAM roles/permissions the users themselves hold (B), per the snapshot-lifecycle documentation cited directly. A minimum storage size (A) and a minimum baseline IOPS/GB performance (D) are not DLM prerequisites at all, and encryption (C) is an optional volume property unrelated to whether DLM can manage a volume's snapshot lifecycle. Community consensus is unanimous for B, E, matching the boxed answer.", "facets": {"service": ["Data Lifecycle Manager", "EBS"], "concern": ["dlm-iam-roles-and-tagging-prerequisites"]}, "source": {"file": "AWS-SysOps Exam - Free Exam Q&As, Page 1 _ ExamTopicsP3-1.pdf", "page": 504, "question_number": 921}, "fingerprint": "b990418c1722d6075a99ef009f0a743372c0ff3041db1fa6573a939a4a5bbc4e"}], "claims": [{"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7ca10a103c58", "source_question_ids": ["awssysops-p1-q032"], "statement": "An EBS volume remains fully attached to its EC2 instance and usable for both reads and writes while a snapshot of it is being created in the background.", "status": "supported"}, {"claim_type": "exception", "conditions": ["snapshot creation in progress"], "confidence": "high", "id": "cl-ecd5bad184d9", "source_question_ids": ["awssysops-p1-q032"], "statement": "Writes made to an EBS volume after a snapshot has started are not guaranteed to be included in that snapshot unless the application pauses writes or the volume is unmounted first.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["snapshot creation in progress"], "confidence": "medium", "id": "cl-3a61cdef855a", "source_question_ids": ["awssysops-p1-q032"], "statement": "An EBS volume cannot be detached from or attached to an EC2 instance while a snapshot of it is in progress.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["snapshot creation in progress"], "confidence": "medium", "id": "cl-ba739ad5bc15", "source_question_ids": ["awssysops-p1-q032"], "statement": "An EBS volume is locked into read-only mode while a snapshot of it is being created.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-07f653f62e9e", "source_question_ids": ["awssysops-p1-q034"], "statement": "Instance store (ephemeral) sto
