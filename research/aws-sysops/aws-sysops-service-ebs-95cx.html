t": "Reactive tagging tools (e.g., AWS Tag Editor, the resource-tagging GetResources API, AWS Config rules) can only find already-untagged resources after the fact; they do not enforce tagging in real time when a resource is created.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-7b988c689f0e", "source_question_ids": ["awssysops-p2-q599"], "statement": "Proactive tagging tools (e.g., AWS CloudFormation, AWS Service Catalog, IAM) apply tags automatically at the moment a resource is created, satisfying a real-time tagging-enforcement requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9ea5af9b4057", "source_question_ids": ["awssysops-p2-q599"], "statement": "AWS Service Catalog's TagOptions Library can enforce a tagging taxonomy proactively when EC2 instances and EBS volumes are launched.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-0b0666c8c445", "source_question_ids": ["awssysops-p2-q599"], "statement": "For the real-time tagging-enforcement exam question, this dataset's boxed answer (manually searching for untagged resources with Tag Editor) is a reactive, manual process that no cited commenter endorses; the source's own embedded community vote splits only between two other proactive options and does not reach the 60% threshold, so the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1c11deaa2436", "source_question_ids": ["awssysops-p3-1-q665"], "statement": "The Elastic Volumes feature of EBS lets a volume's size be increased in place and live, without detaching the volume, taking a snapshot, or reconnecting the instance.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0619f83394d6", "source_question_ids": ["awssysops-p3-1-q665"], "statement": "Increasing EBS capacity via Elastic Volumes is less disruptive and requires less effort than snapshotting-and-restoring to a larger volume, scripting a manual data migration, or adding a second volume in a RAID 0 array.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3dcf5777f7f7", "source_question_ids": ["awssysops-p3-1-q665"], "statement": "Adding a second EBS volume in a RAID 0 configuration to gain capacity adds operational complexity and introduces an additional single point of failure, rather than simply growing the existing volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f11b3f493754", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Cold HDD (sc1) is AWS's lowest-cost-per-GB EBS volume type, purpose-built for large, sequential, infrequently-accessed ('cold') data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fa82bad12928", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Throughput Optimized HDD (st1) is tuned for frequently-accessed sequential big-data workloads (e.g., EMR, data warehouses) and offers a higher baseline throughput than Cold HDD (sc1).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b7e6f3cead47", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Throughput Optimized HDD (st1) costs more per GB than Cold HDD (sc1), making sc1 the more cost-effective choice for infrequently-accessed sequential data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e39286dd0da4", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Provisioned IOPS SSD and General Purpose SSD are priced for random-access, latency-sensitive workloads, making them more expensive than HDD-based EBS volume types for infrequent, sequential access patterns.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2527d8469949", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "A snapshot is not directly attachable to an instance or browsable for individual files; it must first be used to create a new EBS volume before any file can be recovered from it.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-871aab4c76d9", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "To restore a deleted file from an EBS snapshot, create a new volume from the snapshot, attach that volume to a running EC2 instance, and copy the file out of it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e2c383b2d322", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "There is no EC2 console feature that restores an individual file directly from a snapshot without first creating a volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8ba7aaa97daf", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Amazon Data Lifecycle Manager (DLM) is a purpose-built, fully managed policy engine for EBS snapshots that natively handles scheduled creation, a defined retention count/period, and automatic deletion of aged-out snapshots within a single policy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-bdab4209e81c", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "An EventBridge/CloudWatch Events scheduled rule can trigger EBS snapshot creation on a schedule, but on its own provides no built-in retention or deletion mechanism, requiring separate custom logic to enforce a retention window.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4b3c9adc44f2", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Copying data to Amazon S3 Glacier via a Lambda function is an archival pattern, not a snapshot-based backup, and does not match how EBS backups are normally retained.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-12e3d9c4451b", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "For the backup-retention exam question, this dataset's boxed answer (an EventBridge scheduled rule) is contradicted by unanimous community vote favoring Amazon Data Lifecycle Manager, since the EventBridge rule alone has no built-in retention/deletion mechanism.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0d5e4f274541", "source_question_ids": ["awssysops-p3-1-q892"], "statement": "An existing EBS volume cannot be encrypted in place; encrypting it requires snapshotting the volume, creating a new volume from that snapshot with encryption enabled, and swapping the new encrypted volume in for the original.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-31782f4fd862", "source_question_ids": ["awssysops-p3-1-q892"], "statement": "There is no 'Encrypted' EC2 instance property that can be modified directly to encrypt an attached EBS volume.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-74c74d8f5fc4", "source_question_ids": ["awssysops-p3-1-q892"], "statement": "AWS CloudHSM manages cryptographic keys; it is not itself a mechanism for encrypting an existing EBS volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-33bc92ee33a9", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "A volume restored from an EBS snapshot lazily loads its data from Amazon S3 in the background, so the first access to any given block incurs extra latency until that block is pulled down.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f86ea2d8c939", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "Enabling fast snapshot restore fully initializes a volume at creation time, eliminating the lazy-loading first-touch latency that would otherwise occur on a snapshot-restored volume.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-76d26e905213", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "Pre-warming a snapshot-restored volume by reading all of its blocks up front manually achieves the same initialization effect as fast snapshot restore, avoiding sporadic first-touch I/O latency.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f14038746d42", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "Cold HDD (sc1) does not support Provisioned IOPS at all, so restoring a workload that requires Provisioned IOPS onto an sc1 volume changes it away from the volume type the workload needs rather than fixing performance consistency.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-80c0943506db", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "For the I/O-consistency exam question, this dataset's boxed answer (fast snapshot restore plus cold HDD) is contradicted by unanimous community vote favoring fast snapshot restore plus manual pre-warming instead, since cold HDD (sc1) is incompatible with the stem's Provisioned IOPS requirement.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3e7376b39a67", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon Data Lifecycle Manager (Amazon DLM) selects which EBS volumes to snapshot based on tags applied to those volumes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["policy targets volumes by tag, e.g. Production and Compliance tags"], "confidence": "high", "id": "cl-17f7cd2b9aaf", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Tagging the target EBS volumes is a prerequisite for an Amazon DLM snapshot lifecycle policy to target them.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e1a69db3b663", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon DLM requires an IAM role that grants it permission to create and manage snapshots on the users' behalf.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6277be53c755", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "The IAM role used by Amazon DLM must be separate from the IAM role(s)/permissions held by the users who own the EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-68455bad40a5", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum storage requirement of 5 GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2a4eddab46dc", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum baseline performance of 3 IOPS/GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7be424124afd", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Encryption of the EBS volumes is an optional volume property that is unrelated to whether Amazon DLM can manage the volume's snapshot lifecycle.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-ebs--m-1", "title": "EBS as three nested scopes: host-local instance store, AZ-locked volume, region-wide snapshot", "purpose": "Lets a learner predict which EBS object (or which alternative) can do a job by asking which boundary the data has to survive or cross. That covers AZ moves, cross-account sharing, encrypting existing data, restoring files, snapshot consistency, and what happens when an instance stops or terminates.", "mechanism": "EC2 has exactly two kinds of block device, and they sit in different places. Instance store is a disk physically attached to the host, so its data is lost whenever the instance leaves that host: stop, terminate, or disk failure. An EBS root volume does not change that. An EBS volume is network-attached block storage that is replicated inside one Availability Zone. It is independent of the instance's lifecycle, so it survives stops and, unless DeleteOnTermination is set, terminations. But it can only attach to instances in its own AZ, and its encryption state is fixed when it is created. An EBS snapshot is a point-in-time, incremental copy of a volume's blocks, stored in AWS-managed S3 (region-wide, not in any customer bucket). Because a snapshot lives at region scope, it is the only object that can carry a volume's data across a boundary the volume cannot cross: create a new volume in another AZ, share an encrypted snapshot with another account, or create a new encrypted volume from an unencrypted source. A snapshot is not a disk. It cannot be attached or browsed, so every restore goes snapshot -> new volume -> attach. Taking a snapshot is asynchronous. The point in time is fixed when the command runs, the source volume stays attached and read/write, and blocks copy to S3 in the background, so writes made after the start are not guaranteed to be in the snapshot. A volume restored from a snapshot lazy-loads each block from S3 the first time it is touched, which is why fast snapshot restore or a full dd read (initialization) removes the first-touch latency. Changes that stay inside the volume's own scope, such as growing it with Elastic Volumes, happen live on the volume, but the filesystem still has to be extended separately.", "predict_prompt": "An unencrypted EBS volume in us-east-1a has to be (1) used by an instance in us-east-1b, (2) encrypted, and (3) handed to a partner AWS account. Before reading further, predict the minimum sequence of objects and steps, which step crosses which boundary, and why detaching and reattaching the volume cannot do any of it.", "invariants": ["An EBS volume attaches only to instances in its own AZ. Detaching and reattaching never moves it to another AZ, and OS-level mirroring cannot span AZs.", "Changing a volume's AZ, owning account, or encryption state always goes volume -> snapshot -> new volume. None of these can be changed in place.", "A snapshot inherits encryption from its source. An encrypted volume gives an encrypted snapshot automatically. An unencrypted volume's snapshot is not encrypted automatically; encryption is applied when a new volume is created from it.", "A snapshot captures the data as of the moment the command runs. The source volume stays read/write throughout, and writes made after the start are not guaranteed to be included, so pause writes, unmount, or stop the instance if you need full consistency.", "Snapshots are incremental: the first one copies the full volume, and later ones store only the blocks that changed.", "Instance-store data is always lost on stop, terminate, or disk failure, whatever the root volume type is.", "A snapshot must be turned into a new volume before any file can be read from it.", "Snapshots live in AWS-managed S3, so customer S3 lifecycle rules and S3 server-side encryption do not apply to them. Retention is handled with DLM or a scheduled deletion job."], "limits": ["The model does not pick a volume type or IOPS level. Provisioned IOPS (io1/io2) separates IOPS from size, gp2 bursts and scales with size up to a ceiling, and st1/sc1 are for sequential throughput or cold data. Those choices are a separate decision.", "Pre-warming questions depend on when they were written. Older questions tell you to pre-warm blank volumes, but current AWS documentation says new blank volumes get full performance immediately. Only volumes restored from snapshots lazy-load.", "'Persistent' has a default exception: a root EBS volume is deleted on termination because DeleteOnTermination is set by default, and the attribute is checked per volume.", "Several of this dataset's recorded answers in this area conflict with the community vote or with documentation (for example, sharing encrypted data, S3 lifecycle for snapshots, retention through EventBridge alone). Trust the mechanism over a stale recorded answer."], "cues": ["'Move the volume to another AZ' / 'use it in a different AZ' -> snapshot, then create a new volume in the target AZ.", "'Share encrypted volume data with another account' -> share the encrypted snapshot; the other account creates its own volume from it.", "'Encrypt an existing unencrypted volume' -> snapshot, create a new volume with encryption enabled, swap it in.", "'Recover a deleted file from a snapshot' -> create a volume from the snapshot, attach it to an instance, copy the file out.", "'Data must survive stop/terminate' -> not instance store, even when instance store has the best IOPS.", "'Sporadic first-access latency after a restore' -> lazy loading; use fast snapshot restore or dd if=<device> of=/dev/null.", "'Automate snapshot creation plus retention with no scripts' -> Amazon DLM, which targets volumes by tag and uses its own IAM role.", "'Grew the volume but the disk still shows the old size' -> extend the filesystem; restarting the instance will not fix it."], "claim_ids": ["cl-9ff7aca5524b", "cl-4053d59de53f", "cl-0aad584f5f21", "cl-5b0b3ecd3af3", "cl-17388d98de77", "cl-1b532f23648f", "cl-07f653f62e9e", "cl-7a6f09bf4e08", "cl-14ebdf09d120", "cl-407d4d064f78", "cl-d21e0d7768b7", "cl-a6e7dfd40a03", "cl-e62ca15455de", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-7311c93a8b1c", "cl-aafa5e1fecae", "cl-22596c74643d", "cl-0d5e4f274541", "cl-c8d750260bdd", "cl-a094965a3163", "cl-4e5256db5a0b", "cl-ab10a276a79b", "cl-b315390c5e0e", "cl-135cd8555499", "cl-7ca10a103c58", "cl-ecd5bad184d9", "cl-8447306f89ac", "cl-1f94416d3cdb", "cl-c01d3e34ed22", "cl-a1d85789e691", "cl-2527d8469949", "cl-871aab4c76d9", "cl-3d43facfbfa2", "cl-8ba7aaa97daf", "cl-29db4fb4b51d", "cl-3e7376b39a67", "cl-33bc92ee33a9", "cl-f86ea2d8c939", "cl-669c8a90a3d6", "cl-87fbd07f4759", "cl-e9f3249080be", "cl-1c11deaa2436", "cl-e5a31ddabe11", "cl-c243306cee99", "cl-5387764317c1", "cl-522cc7dc584c", "cl-6666a7665d67"]}, "contrastSet": {"id": "aws-sysops-service-ebs--cs-1", "subjects": ["Instance store volume", "EBS volume", "EBS snapshot"], "dimensions": ["Where the data physically lives", "Survives instance stop/terminate", "Directly attachable to an instance", "Can cross AZ, account, or encryption state", "How it is changed or maintained", "First-access performance"], "shared_traits": ["All three hold block-level data for EC2 workloads. EC2's only two block device types are instance store and EBS, and snapshots are the backup form of EBS volumes.", "None of them is an AMI and none is an S3 object you manage yourself, so S3 server-side encryption and S3 lifecycle rules do not apply to any of them."], "matrix": {"Where the data physically lives": {"Instance store volume": "Disk physically attached to the host", "EBS volume": "Network-attached, replicated within one AZ", "EBS snapshot": "AWS-managed S3, region-wide (not in your bucket)"}, "Survives instance stop/terminate": {"Instance store volume": "No: always lost on stop, terminate, or disk failure", "EBS volume": "Yes, independent of the instance (root volume deleted on terminate by default)", "EBS snapshot": "Yes, independent of both instance and volume"}, "Directly attachable to an instance": {"Instance store volume": "Only to the instance on that host", "EBS volume": "Yes, but only to instances in the same AZ", "EBS snapshot": "No: create a new volume from it first"}, "Can cross AZ, account, or encryption state": {"Instance store volume": "Never", "EBS volume": "No: detach/reattach stays in the AZ; encryption is fixed at creation", "EBS snapshot": "Yes: restore in any AZ, share encrypted cross-account, create an encrypted volume from it"}, "How it is changed or maintained": {"Instance store volume": "Fixed by the instance type", "EBS volume": "Elastic Volumes resize live, then extend the filesystem", "EBS snapshot": "Incremental, point-in-time, async; retention via DLM, not S3 lifecycle"}, "First-access performance": {"Instance store volume": "Very high local IOPS (e.g. hi1.4xlarge, ~120k random read IOPS)", "EBS volume": "New blank volume: full performance immediately (current docs)", "EBS snapshot": "Restored volume lazy-loads blocks; fast snapshot restore or a dd read initializes it"}}, "decision_rule": "The one dimension that decides is the widest boundary the data must survive or cross. If the data only needs to last while the instance stays on its host, instance store is acceptable. If it must survive instance stop/terminate but stays in one AZ, one account, and one encryption state, act on the EBS volume directly. If it must cross an AZ, an account, or an encryption-state change, or be recovered after deletion or loss, the answer goes through an EBS snapshot and then a new volume.", "boundary_flip": "Suppose a volume attached in us-east-1a needs more capacity. The answer is to modify the EBS volume in place with Elastic Volumes and then extend the filesystem. Now change one condition: the data must serve an instance in us-east-1b. The answer becomes: snapshot the volume and create a new volume from that snapshot in us-east-1b, because detach/reattach cannot leave the AZ. A second flip: a workload that needs ~120k random-read IOPS on disposable data fits instance store, but once the data must survive an instance stop, it must go on EBS (for example, Provisioned IOPS).", "strongest_distractor_failure": "'Detach the volume and reattach it to an instance in the other AZ' (or mirror it across AZs at the OS level) fails because EBS attachment is AZ-locked no matter how often the volume is detached. Only the region-scoped snapshot can carry the data across. The cross-account version of this mistake, 'copy the encrypted volume to an unencrypted volume and share that', fails the same way: the supported path is to share an encrypted snapshot.", "exceptions": ["A root EBS volume has DeleteOnTermination set by default, so it does not outlive termination unless the flag is cleared. The attribute is evaluated per attached volume.", "An EBS-backed root volume does not make instance-store data survive a stop.", "Snapshotting an unencrypted volume does not encrypt anything. Encryption is applied when the new volume is created from the snapshot with encryption enabled.", "A snapshot taken while writes continue may miss them. Pause writes, unmount, or stop the instance for a fully consistent snapshot.", "Older questions that require pre-warming blank volumes are stale. Only volumes restored from snapshots still show first-touch latency."], "claim_ids": ["cl-9ff7aca5524b", "cl-4053d59de53f", "cl-1b532f23648f", "cl-07f653f62e9e", "cl-7a6f09bf4e08", "cl-0c981a2af156", "cl-ea3f1bff7d59", "cl-17388d98de77", "cl-c243306cee99", "cl-5387764317c1", "cl-14ebdf09d120", "cl-d21e0d7768b7", "cl-a6e7dfd40a03", "cl-e62ca15455de", "cl-569ab53f702a", "cl-22596c74643d", "cl-6b4898f85621", "cl-0d5e4f274541", "cl-ab10a276a79b", "cl-2527d8469949", "cl-10672f37bc8e", "cl-1c11deaa2436", "cl-e5a31ddabe11", "cl-c01d3e34ed22", "cl-b315390c5e0e", "cl-ecd5bad184d9", "cl-1f94416d3cdb", "cl-3d43facfbfa2", "cl-7fc01d5201fb", "cl-8ba7aaa97daf", "cl-33bc92ee33a9", "cl-f86ea2d8c939", "cl-87fbd07f4759", "cl-e9f3249080be"]}, "scenarioFamily": {"id": "aws-sysops-service-ebs--sf-1", "canonical": {"prompt": "A SysOps engineer has an EBS volume currently attached to an EC2 instance running in Availability Zone us-east-1a. The application now needs to run on a new EC2 instance that will launch in us-east-1b, and the data on the volume must be available to that new instance. What is the correct sequence of steps to make this happen?", "expected_answer": ["Create a snapshot of the EBS volume, then create a new EBS volume from that snapshot in the target Availability Zone (us-east-1b), and attach the new volume to the instance there."], "reasoning": "An EBS volume can only attach to an instance in its own Availability Zone (cl-407d4d064f78, cl-14ebdf09d120), so the volume itself cannot simply move to us-east-1b. A snapshot is stored in region-wide S3, not tied to any single AZ, so it is the only object here that can cross the AZ boundary: restoring it creates a new volume directly in the target AZ (cl-3fc9619416cd, cl-e62ca15455de). This is exactly the documented AZ-migration procedure: snapshot the volume, then create a new volume from that snapshot in the destination AZ (cl-569ab53f702a).", "distractor_analysis": "Detaching the volume from the us-east-1a instance and reattaching it to the us-east-1b instance does not work: a volume cannot attach outside its own AZ no matter how many times it is detached and reattached (cl-d21e0d7768b7). Mirroring the volume at the OS level to a second volume in us-east-1b is also not a real option, since that second volume could never be attached in the first place for the same AZ-lock reason (cl-a6e7dfd40a03). There is likewise no 'migrate volume between AZs' command that bypasses the snapshot step (cl-2a30ae8e7707).", "claim_ids": ["cl-407d4d064f78", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-14ebdf09d120", "cl-e62ca15455de", "cl-d21e0d7768b7", "cl-a6e7dfd40a03", "cl-2a30ae8e7707"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The new instance will launch in us-east-1a (the same Availability Zone as the existing volume) instead of us-east-1b.", "prompt": "A SysOps engineer has an EBS volume currently attached to an EC2 instance running in Availability Zone us-east-1a. The application now needs to run on a new EC2 instance that will also launch in us-east-1a, and the data on the volume must be available to that new instance. What is the correct sequence of steps?", "expected_answer": ["Detach the EBS volume from the original instance and attach it directly to the new instance in us-east-1a; no snapshot or new volume is needed because both instances are in the same Availability Zone as the volume."], "reasoning": "The only requirement for attaching an EBS volume is that the instance sit in the same AZ as the volume (cl-407d4d064f78, cl-14ebdf09d120). Since the new instance is also in us-east-1a, that requirement is already met, so a plain detach-and-reattach moves the data with no snapshot step. This flips the canonical answer precisely because the AZ boundary that forced the snapshot route is no longer being crossed: when the destination AZ differs, a snapshot and a new volume in that AZ are required (cl-569ab53f702a, cl-3fc9619416cd); when it does not, they are not.", "distractor_analysis": "Taking a snapshot and restoring it to a new volume in us-east-1a would still technically work, but it is unnecessary extra steps -- the exam-relevant distinction is that the snapshot route is required only when the destination AZ differs from the volume's own AZ.", "claim_ids": ["cl-407d4d064f78", "cl-14ebdf09d120", "cl-569ab53f702a", "cl-3fc9619416cd"], "difficulty": "easy", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The original EBS volume has a CloudWatch alarm configured on one of its metrics (e.g., VolumeReadOps).", "prompt": "A SysOps engineer has an EBS volume, with a CloudWatch alarm configured on its VolumeReadOps metric, currently attached to an EC2 instance in Availability Zone us-east-1a. The application now needs to run on a new EC2 instance that will launch in us-east-1b, and the data on the volume must be available to that new instance. What is the correct sequence of steps?", "expected_answer": ["Create a snapshot of the EBS volume, then create a new EBS volume from that snapshot in the target Availability Zone (us-east-1b), and attach the new volume to the instance there."], "reasoning": "The CloudWatch alarm is a side detail, not a planning input: once the old volume is detached as part of the migration, its alarm will transition to Insufficient Data because the metric stops reporting data points (cl-749e99be7c8e), but that has no bearing on how the data gets to us-east-1b. The procedure is unchanged: create a snapshot, create a new volume from it in us-east-1b, and attach it there (cl-569ab53f702a, cl-3fc9619416cd, cl-407d4d064f78).", "claim_ids": ["cl-749e99be7c8e", "cl-569ab53f702a", "cl-3fc9619416cd", "cl-407d4d064f78"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A colleague proposes a specific tempting-but-wrong shortcut -- OS-level disk mirroring directly between the two Availability Zones -- as the solution, instead of the procedure being asked for directly.", "prompt": "A SysOps engineer has an EBS volume attached to an EC2 instance in us-east-1a and needs its data available to a new instance in us-east-1b. A colleague suggests skipping snapshots entirely: set up OS-level disk mirroring (e.g., Linux software RAID1) between the existing volume and a new volume created in us-east-1b, and let the mirror sync the data across. Will this work, and if not, what should the engineer do instead?", "expected_answer": ["Create a snapshot of the EBS volume, then create a new EBS volume from that snapshot in the target Availability Zone (us-east-1b), and attach the new volume to the instance there."], "reasoning": "OS-level mirroring cannot bridge an Availability Zone boundary any more than a plain reattachment can -- this exact approach is a known wrong answer (cl-a6e7dfd40a03). EBS volumes are AZ-locked no matter what software is layered on top of them (cl-407d4d064f78, cl-14ebdf09d120). The snapshot is the only object here that lives above the AZ boundary, so the procedure is still: snapshot the volume, create a new volume from the snapshot in us-east-1b, attach it there (cl-569ab53f702a, cl-3fc9619416cd, cl-e62ca15455de).", "distractor_analysis": "OS-level RAID/mirroring operates at the block-device layer the OS sees, but both mirror members must still be attached EBS volumes, and an EBS volume cannot attach to an instance outside its own AZ -- so there is no way to even attach the us-east-1b leg of the mirror (cl-a6e7dfd40a03, cl-407d4d064f78). It would not solve the problem even if it could run, since mirroring only syncs ongoing writes rather than moving the data that already exists.", "claim_ids": ["cl-a6e7dfd40a03", "cl-407d4d064f78", "cl-14ebdf09d120", "cl-569ab53f702a", "cl-3fc9619416cd", "cl-e62ca15455de"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The business reason for moving the data changes from 'running the app on a new instance' to 'standing up a disaster-recovery replica of the running environment,' but the technical requirement -- getting this volume's data onto an instance in us-east-1b -- is unchanged.", "prompt": "As part of a disaster-recovery drill, a SysOps engineer must stand up a replica of a production EC2 instance's EBS volume (currently attached to an instance in us-east-1a) on a standby instance in us-east-1b, using the exact data currently on the volume. What is the correct sequence of steps?", "expected_answer": ["Create a snapshot of the EBS volume, then create a new EBS volume from that snapshot in the target Availability Zone (us-east-1b), and attach the new volume to the instance there."], "reasoning": "Whatever the business motivation -- running a new app instance, or a DR drill -- the technical constraint is identical: this EBS volume is attached only in us-east-1a and cannot itself attach in us-east-1b (cl-407d4d064f78, cl-14ebdf09d120). The snapshot is the only object that lives at region scope and can be restored into a new volume in us-east-1b (cl-3fc9619416cd, cl-e62ca15455de, cl-569ab53f702a), so the same procedure transfers unchanged to this new context.", "distractor_analysis": "Framing this as a 'DR' problem does not unlock any different mechanism -- there is no AZ-spanning replication feature for EBS -- so the same snapshot-then-new-volume path applies as in the original scenario.", "claim_ids": ["cl-407d4d064f78", "cl-14ebdf09d120", "cl-3fc9619416cd", "cl-e62ca15455de", "cl-569ab53f702a"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "cl-2bb7e1468769 (q260, status supported, confidence high) says an EBS volume's size does not determine or cap its IOPS ceiling. Other supported claims say size does cap it: the PIOPS IOPS-to-size ratio cap (cl-b94fa31b4de7: a 100 GB volume tops out at 3,000 IOPS under 30:1; cl-3d535e681972 / cl-7bb5a42e761f / cl-49ef21d8516a / cl-7b83c1da3699: you need about 134 GB or 1,280 GB to reach the maximum), and gp2 IOPS growing with size (cl-2e3857b9f755). The source questions disagree and nothing resolves it. The synthesis's limits text says 'Provisioned IOPS (io1/io2) separates IOPS from size' (see also cl-522cc7dc584c), which is only partly true because the ratio cap still ties maximum IOPS to size.", "related_entity_ids": ["cl-2bb7e1468769", "cl-b94fa31b4de7", "cl-3d535e681972", "cl-7bb5a42e761f", "cl-49ef21d8516a", "cl-7b83c1da3699", "cl-2e3857b9f755", "cl-522cc7dc584c", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "The mental model's invariant and the contrast set both state snapshot encryption inheritance as settled (cl-a094965a3163, cl-4e5256db5a0b, cl-ab10a276a79b). The source questions behind it are disputed: q159's recorded community vote (100%) supports 'select encryption when creating the snapshot' over the boxed answer (cl-2e2fe001578e, needs-review), and q471's boxed answer says to 'encrypt the existing volume' (cl-b407f577b545, needs-review), which contradicts cl-0d5e4f274541 (no in-place encryption). The model's limits list several recorded-answer conflicts but leaves out these two, which bear directly on the encryption invariant. They should be flagged, not presented as consensus.", "related_entity_ids": ["cl-a094965a3163", "cl-4e5256db5a0b", "cl-ab10a276a79b", "cl-2e2fe001578e", "cl-b407f577b545", "cl-0d5e4f274541", "aws-sysops-service-ebs--m-1", "aws-sysops-service-ebs--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "Several source questions have a boxed answer that conflicts with the community vote or documentation. These are still unresolved and need correct_answer_override triage: q112 (copy to unencrypted volume, cl-1bec0c8dd3b3), q307 (IAM policy for at-rest security, cl-8362d9d4f4f2), q545 (resize gp2 + Max I/O, cl-f4163fbf8caf), q598 (S3 lifecycle for snapshots, cl-ee25dab09965), q888 (EventBridge rule alone, cl-12e3d9c4451b), q913 (fast snapshot restore + cold HDD, cl-80c0943506db), q599 (Tag Editor, disputed below 60%, cl-0b0666c8c445), and q039 (split vote, cl-3dd8a81d0e04). The synthesis treats the community/documentation side as correct for several of them (for example, strongest_distractor_failure treats the q112 boxed answer as wrong). That may be right, but the underlying source disagreement is still open.", "related_entity_ids": ["cl-1bec0c8dd3b3", "cl-8362d9d4f4f2", "cl-f4163fbf8caf", "cl-ee25dab09965", "cl-12e3d9c4451b", "cl-80c0943506db", "cl-0b0666c8c445", "cl-3dd8a81d0e04", "cl-6b4898f85621", "aws-sysops-service-ebs--cs-1"]}, {"type": "stale-risk", "severity": "medium", "description": "Blank-volume pre-warming claims are marked 'supported' with no 'at question authoring time' condition: cl-44864b4fc82c (dd from /dev/zero pre-warms a fresh volume to avoid a first-access penalty) and cl-19277c6e76f3 (the dd direction rule, which says writing zeros pre-warms a blank volume). They directly contradict the current-platform claims cl-87fbd07f4759, cl-e9f3249080be, and cl-0e502b45e56c (new volumes get full performance immediately). The synthesis calls blank pre-warming stale, but the claim records still state it as current fact.", "related_entity_ids": ["cl-44864b4fc82c", "cl-19277c6e76f3", "cl-ef04f867bc02", "cl-d531a323b903", "cl-87fbd07f4759", "cl-e9f3249080be", "cl-0e502b45e56c"]}, {"type": "stale-risk", "severity": "medium", "description": "cl-b94fa31b4de7 (100 GB gives at most 3,000 IOPS) and cl-3d02add8d37a (8 GB / 200 IOPS fits a 30:1 cap) are 'supported' rules built on the 30:1 PIOPS ratio, which claims cl-7bb5a42e761f and cl-3a15c924eb67 say was raised to 50:1 (500:1 for io2 per cl-7b83c1da3699). They are conditioned on the '30:1 ratio cap' but not marked as historical, so the numbers could be learned as current limits.", "related_entity_ids": ["cl-b94fa31b4de7", "cl-3d02add8d37a", "cl-3d535e681972", "cl-7bb5a42e761f", "cl-3a15c924eb67", "cl-7b83c1da3699"]}, {"type": "stale-risk", "severity": "medium", "description": "cl-df0f2da2c64f (status supported) says no built-in AWS managed capability detects and stops idle or underutilized EC2 instances without custom scripting. Its only source, q039, is flagged as likely stale with an evenly split vote (cl-3dd8a81d0e04), so 'supported' overstates confidence in a claim whose source question is disputed and dated.", "related_entity_ids": ["cl-df0f2da2c64f", "cl-3dd8a81d0e04"]}, {"type": "ambiguity", "severity": "medium", "description": "Distractor claims use inconsistent polarity. Some state the false proposition (cl-3a61cdef855a, cl-ba739ad5bc15, cl-081d4c5cf9cd, cl-6b4898f85621, cl-7a6f09bf4e08, cl-a6e7dfd40a03, cl-6d59b05bb36c, cl-9557a88e2d53, cl-7fc01d5201fb, cl-a94cb0b70bb0). Others state the true rebuttal of it (cl-affa0f02d771, cl-8373bdeda3bc, cl-46e9a0f536b9, cl-2a30ae8e7707, cl-d21e0d7768b7, cl-cb017c95f885, cl-9e3f8f663a3d, cl-adcbe36ca060, cl-a0f9838f646f, cl-e2c383b2d322, cl-68455bad40a5, cl-2a4eddab46dc, cl-10672f37bc8e, cl-31782f4fd862). Since claim_type 'distractor' with status 'supported' does not say whether the statement itself is true or false, anything using these claims (including the mental model and contrast set, which cite both kinds) could flip their meaning.", "related_entity_ids": ["cl-affa0f02d771", "cl-8373bdeda3bc", "cl-46e9a0f536b9", "cl-d21e0d7768b7", "cl-adcbe36ca060", "cl-6b4898f85621", "cl-a6e7dfd40a03", "cl-7a6f09bf4e08", "cl-10672f37bc8e", "cl-7fc01d5201fb"]}, {"type": "stale-risk", "severity": "low", "description": "Stale-conditioned claims about free-tier eligibility and micro-instance encryption (cl-6b9124405cc4, cl-ce8c121f1bad, cl-32755082527e, cl-d0dae1dda71e, cl-7116c9161ec1) are flagged conflicted or needs-review and are still unresolved. q056 and q165 need manual override review before their answers are trusted.", "related_entity_ids": ["cl-6b9124405cc4", "cl-ce8c121f1bad", "cl-32755082527e", "cl-d0dae1dda71e", "cl-7116c9161ec1"]}, {"type": "quality", "severity": "low", "description": "In the contrast set's 'First-access performance' row, the 'EBS snapshot' cell actually describes a volume restored from a snapshot, not the snapshot itself (a snapshot cannot be accessed directly). The 'Instance store volume' cell uses the previous-generation hi1.4xlarge figure (cl-0c981a2af156) from an old question as the example, and the same figure reappears in boundary_flip. That figure is dated (see cl-b6bdd683c240).", "related_entity_ids": ["aws-sysops-service-ebs--cs-1", "cl-0c981a2af156", "cl-b6bdd683c240", "cl-33bc92ee33a9"]}]}]}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam: a future fetch-based loader only ever
  // needs to replace these two bodies. ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: (s.sourceQuestions || []).length };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(function (c) {
          var status = c.status || 'status unknown';
          return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span></li>`;
        }).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        ${raw(citationsHtml(cs.claim_ids))}
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
        <div class="item-meta">${raw(metaBadges.join(''))}</div>
        ${raw(changedCondition)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence <span class="muted">(optional)</span></legend>
          <div class="segmented">${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"><span>${c}</span></label>`; }).join(''))}</div>
        </fieldset>
        <div class="actions"><button id="reveal-practice-btn" type="button">Reveal answer</button></div>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------
  function itemLookup(itemId) {
    return practiceItems().find(function (i) { return i.id === itemId; });
  }

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {
          var item = itemLookup(a.itemId);
          var prompt = item ? (item.prompt || item.stem || '') : '(item no longer in scenario family)';
          var predictedText = Array.isArray(a.predicted) ? a.predicted.join(', ') : (a.predicted || '(no answer recorded)');
          var radios = DIAGNOSIS_CATEGORIES.map(function (c) {
            return safe`<label class="diagnosis-option"><input type="radio" name="diagnosis-${a.id}" value="${c.key}"><span><strong>${c.label}</strong><span class="hint">${c.hint}</span></span></label>`;
          }).join('');
          return safe`
            <div class="pending-attempt panel" data-attempt-id="${a.id}">
              <p class="prompt">${prompt}</p>
              <p class="your-answer"><span class="field-label">Your answer</span>${predictedText}</p>
              <fieldset>
                <legend>What went wrong?</legend>
                <div class="diagnosis-grid">${raw(radios)}</div>
              </fieldset>
              <p class="field-error hidden" role="alert">Pick the category that best explains the miss.</p>
              <div class="actions"><button type="button" class="submit-diagnosis">Submit diagnosis</button></div>
            </div>`;
        }).join('')
      : safe`<p class="empty">Nothing to diagnose. Items you mark wrong in Practice show up here.</p>`;

    var historyHtml = history.length
      ? safe`<ul class="diagnosis-history">${raw(history.map(function (a) {
          var cat = DIAGNOSIS_CATEGORIES.find(function (c) { return c.key === a.diagnosis; });
          var label = cat ? cat.label : a.diagnosis;
          var item = itemLookup(a.itemId);
          var excerpt = truncate(item ? (item.prompt || item.stem || '') : a.itemId, 80);
          var when = a.timestamp ? new Date(a.timestamp).toLocaleString() : '';
          return safe`<li><span class="badge">${label}</span><span>${excerpt}</span><time class="muted" datetime="${a.timestamp || ''}">${when}</time></li>`;
        }).join(''))}</ul>`
      : safe`<p class="empty">No diagnosed mistakes yet.</p>`;

    var html = safe`
      <section class="diagnose">
        <h2>Diagnose</h2>
        <p class="back-link"><a href="${sliceHref('learn')}">&larr; Revisit Learn</a></p>
        <h3>Needs diagnosis <span class="tally">${pending.length}</span></h3>
        ${raw(pendingHtml)}
        <h3>History <span class="tally">${history.length}</span></h3>
        ${raw(historyHtml)}
      </section>`;
    var node = fromHTML(html);
    node.querySelectorAll('.pending-attempt').forEach(function (el) {
      var error = el.querySelector('.field-error');
      el.addEventListener('change', function () { error.classList.add('hidden'); });
      el.querySelector('.submit-diagnosis').addEventListener('click', function () {
        var checked = el.querySelector('input[type="radio"]:checked');
        if (!checked) { error.classList.remove('hidden'); return; }
        var attemptId = el.getAttribute('data-attempt-id');
        var attempt = STATE.attempts.find(function (a) { return a.id === attemptId; });
        if (attempt) {
          attempt.diagnosis = checked.value;
          saveState();
          navigate();
        }
      });
    });
    return node;
  }

  // ---------- Explore Sources ----------
  var sourcesSearchTerm = '';
  var expandedSourceId = null;

  function questionMatches(q, term) {
    if (!term) return true;
    var choiceText = (q.choices || []).map(function (c) { return c.text; }).join(' ');
    var haystack = [q.id, q.stem, q.explanation, choiceText].join(' ').toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function citingClaims(questionId) {
    return (CURRENT.claims || []).filter(function (c) { return (c.source_question_ids || []).indexOf(questionId) !== -1; });
  }

  function issuesHtml() {
    var issues = CURRENT.issues || [];
    if (!issues.length) return safe`<p class="muted">No open issues.</p>`;
    return safe`
      <details class="issues-panel">
        <summary>Issues <span class="tally">${issues.length}</span></summary>
        <ul class="issues">${raw(issues.map(function (i) {
          return safe`<li><p class="issue-head"><span class="badge severity-${i.severity || 'unknown'}">${i.severity || 'unknown'}</span><strong>${i.type || 'issue'}</strong></p><p>${i.description || ''}</p></li>`;
        }).join(''))}</ul>
      </details>`;
  }

  function sourceRowHtml(q) {
    var isOpen = q.id === expandedSourceId;
    var detail = '';
    if (isOpen) {
      var citing = citingClaims(q.id);
      var choiceItems = (q.choices || []).map(function (c) {
        var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
        return safe`<li class="${isCorrect ? 'correct-choice' : ''}"><span class="choice-letter">${c.letter}.</span> ${c.text}${raw(isCorrect ? ' <span class="badge tone-ok">correct</span>' : '')}</li>`;
      }).join('');
      var citedList = citing.length
        ? safe`<ul>${raw(citing.map(function (c) { return safe`<li>${c.statement}</li>`; }).join(''))}</ul>`
        : safe`<p class="muted">No claims cite this question yet.</p>`;
      var src = q.source || {};
      detail = safe`
        <tr class="detail-row">
          <td colspan="4">
            <div class="source-detail">
              <p>${q.stem}</p>
              <ul>${raw(choiceItems)}</ul>
              <h4>Explanation</h4>
              <p>${q.explanation || ''}</p>
              <p class="muted source-meta">Source: ${src.file || ''} (p. ${src.page !== undefined ? src.page : '?'}, Q${src.question_number !== undefined ? src.question_number : '?'})</p>
              <h4>Cited by <span class="tally">${citing.length}</span></h4>
              ${raw(citedList)}
            </div>
          </td>
        </tr>`;
    }
    var disputedBadge = q.disputed ? ' <span class="badge tone-warn">disputed</span>' : '';
    return safe`
      <tr class="source-row${raw(isOpen ? ' is-open' : '')}" data-id="${q.id}">
        <td class="cell-id"><button type="button" class="row-toggle" aria-expanded="${isOpen ? 'true' : 'false'}">${q.id}</button></td>
        <td class="cell-status">${q.status || ''}${raw(disputedBadge)}</td>
        <td class="cell-stem">${truncate(q.stem, 90)}</td>
        <td class="cell-answer">${(q.correct_answer || []).join(', ')}</td>
      </tr>${raw(detail)}`;
  }

  function renderSources() {
    var questions = CURRENT.sourceQuestions || [];
    var html = safe`
      <section class="sources">
        <h2>Explore Sources</h2>
        ${raw(issuesHtml())}
        <div class="search-field">
          <label class="field-label" for="sources-search">Search questions</label>
          <input type="search" id="sources-search" placeholder="Stem, choices, or explanation">
          <p class="muted" id="sources-count" aria-live="polite"></p>
        </div>
        <div class="table-wrap" tabindex="0" role="region" aria-label="Source questions">
          <table class="sources-table">
            <thead><tr><th scope="col">ID</th><th scope="col">Status</th><th scope="col">Stem</th><th scope="col">Correct</th></tr></thead>
            <tbody id="sources-tbody"></tbody>
          </table>
        </div>
      </section>`;
    var fragment = fromHTML(html);
    var section = fragment.firstElementChild;
    var input = section.querySelector('#sources-search');
    input.value = sourcesSearchTerm;

    function renderRows() {
      var filtered = questions.filter(function (q) { return questionMatches(q, sourcesSearchTerm); });
      section.querySelector('#sources-count').textContent = filtered.length + ' / ' + questions.length + ' questions';
      var tbody = section.querySelector('#sources-tbody');
      tbody.innerHTML = filtered.length
        ? filtered.map(sourceRowHtml).join('')
        : safe`<tr><td colspan="4" class="empty-cell">No questions match "${sourcesSearchTerm}".</td></tr>`;
      tbody.querySelectorAll('.source-row').forEach(function (row) {
        row.addEventListener('click', function () {
          var id = row.getAttribute('data-id');
          expandedSourceId = expandedSourceId === id ? null : id;
          renderRows();
          var toggle = tbody.querySelector('.source-row[data-id="' + CSS.escape(id) + '"] .row-toggle');
          if (toggle) toggle.focus({ preventScroll: true });
        });
      });
    }

    input.addEventListener('input', function () {
      sourcesSearchTerm = input.value;
      renderRows();
    });
    renderRows();
    return fragment;
  }

  // ---------- slice selection ----------
  var DEFAULT_SLICE_ID = null;

  function populateSliceSelect(manifest) {
    DEFAULT_SLICE_ID = manifest.length ? manifest[0].id : null;
    var select = document.getElementById('slice-select');
    select.innerHTML = manifest.map(function (s) {
      return safe`<option value="${s.id}">${s.facet.key}: ${s.facet.value} (${s.questionCount} q)</option>`;
    }).join('');
    document.getElementById('slice-controls').classList.toggle('hidden', manifest.length <= 1);
    select.addEventListener('change', function () {
      location.hash = '#' + encodeURIComponent(select.value) + '/' + parseHash().mode;
    });
  }

  function activateSlice(sliceId) {
    return loadSlice(sliceId).then(function (slice) {
      CURRENT = slice;
      STORAGE_KEY = 'ekd:' + slice.contentSet.id + ':' + slice.contentSet.schemaVersion;
      STATE = loadState();
      practiceIndex = 0;
      sourcesSearchTerm = '';
      expandedSourceId = null;
      var cs = CURRENT.contentSet;
      document.getElementById('app-title').innerHTML = safe`<span class="title-exam">${cs.exam}</span><span class="title-sep" aria-hidden="true">/</span><span class="title-facet"><span class="visually-hidden">${cs.facet.key}: </span>${cs.facet.value}</span>`;
      document.title = cs.facet.value + ' · ' + cs.exam;
      var select = document.getElementById('slice-select');
      if (select.value !== slice.contentSet.id) select.value = slice.contentSet.id;
      renderStorageWarning();
    });
  }

  // ---------- routing: "#<sliceId>/<mode>", falling back to the active (or
  // first) slice when the hash omits one -- e.g. on first load. ----------
  var ROUTES = { learn: renderLearn, compare: renderCompare, practice: renderPractice, diagnose: renderDiagnose, sources: renderSources };
  var DEFAULT_MODE = 'learn';

  function sliceHref(mode) {
    return '#' + encodeURIComponent(CURRENT.contentSet.id) + '/' + mode;
  }

  function parseHash() {
    var rawHash = (location.hash || '').slice(1);
    var slashIndex = rawHash.indexOf('/');
    var fallbackSliceId = CURRENT ? CURRENT.contentSet.id : DEFAULT_SLICE_ID;
    if (slashIndex === -1) {
      return { sliceId: fallbackSliceId, mode: ROUTES.hasOwnProperty(rawHash) ? rawHash : DEFAULT_MODE };
    }
    var sliceId = decodeURIComponent(rawHash.slice(0, slashIndex)) || fallbackSliceId;
    var mode = rawHash.slice(slashIndex + 1);
    return { sliceId: sliceId, mode: ROUTES.hasOwnProperty(mode) ? mode : DEFAULT_MODE };
  }

  function navigate() {
    var target = parseHash();
    var proceed = (!CURRENT || CURRENT.contentSet.id !== target.sliceId)
      ? activateSlice(target.sliceId)
      : Promise.resolve();
    return proceed.then(function () {
      document.querySelectorAll('#nav a').forEach(function (a) {
        var mode = a.getAttribute('data-route');
        a.setAttribute('href', sliceHref(mode));
        a.classList.toggle('active', mode === target.mode);
        if (mode === target.mode) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(ROUTES[target.mode]());
    });
  }

  // ---------- init ----------
  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('import-input').addEventListener('change', importProgress);
  window.addEventListener('hashchange', navigate);
  getManifest().then(function (manifest) {
    populateSliceSelect(manifest);
    return navigate();
  });
})();
</script>
