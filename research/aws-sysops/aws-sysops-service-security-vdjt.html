<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

s": [], "confidence": "medium", "id": "cl-4c31621530e5", "source_question_ids": ["awssysops-p1-q002"], "statement": "Scheduling meetings with AWS's own third-party auditors is not how AWS compliance evidence is gathered; the audited compliance reports obtained via AWS Artifact already serve as that evidence.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b47bda8f2da", "source_question_ids": ["awssysops-p1-q015"], "statement": "An LDAP replica hosted on AWS and reached over a VPN can serve authentication requests with lower latency than routing every authentication request over a VPN to on-premises LDAP servers.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["community interpretation favoring literal reading of 'minimal changes' requirement"], "confidence": "medium", "id": "cl-28c2d6b1f8cc", "source_question_ids": ["awssysops-p1-q015"], "statement": "Establishing a direct VPN connection to authenticate against existing on-premises LDAP servers, without creating an AWS-side LDAP replica, keeps changes to existing application user management processes more minimal than deploying a replica.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-71e5e0f72761", "source_question_ids": ["awssysops-p2-q339", "awssysops-p3-1-q691"], "statement": "AWS Artifact is AWS's self-service portal for obtaining audit-grade compliance reports (e.g., SOC 1/2, ISO 27001) that document AWS's physical and environmental security controls.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-50c2edd3d0d0", "source_question_ids": ["awssysops-p2-q339"], "statement": "An AWS Artifact compliance report, rather than the general AWS Security whitepaper, is the correct way to furnish an external auditor with proof of a hosting facility's physical security controls.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-57b4c8b0e960", "source_question_ids": ["awssysops-p2-q339"], "statement": "The AWS Security whitepaper is general informational/marketing content describing AWS's security posture at a high level and is not a formal audit artifact.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4eec2d0a8f28", "source_question_ids": ["awssysops-p2-q339"], "statement": "An AWS Direct Connect facility's address is unrelated to proving the physical security controls of the facility that hosts an application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b903b2d16098", "source_question_ids": ["awssysops-p2-q464"], "statement": "Transparent Data Encryption (TDE) encrypts data at rest so that, if stolen, the data is unusable without the encryption key, reducing the risk of confidential data theft.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-08bbaed78ec6", "source_question_ids": ["awssysops-p2-q464"], "statement": "Transparent Data Encryption (TDE) does not decrease latency, store SSL certificates, or provide backup functionality.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-c28f841d029e", "source_question_ids": ["awssysops-p2-q467"], "statement": "Amazon S3 supports four server-side encryption modes: SSE-S3 (S3-managed keys, applied by default to new objects since January 2023), SSE-KMS (KMS keys), DSSE-KMS (dual-layer encryption with KMS keys), and SSE-C (customer-provided keys).", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d2a7579f594e", "source_question_ids": ["awssysops-p2-q467"], "statement": "'SSE-K' is not a real Amazon S3 server-side encryption mode.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-30f2cf8101ff", "source_question_ids": ["awssysops-p2-q468"], "statement": "AWS CloudHSM appliances are designed to securely store cryptographic key material and perform cryptographic operations with that material without exposing it outside the appliance's cryptographic boundary.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6dc2df8c20dd", "source_question_ids": ["awssysops-p2-q468"], "statement": "AWS CloudHSM does not allow AWS to audit a customer's infrastructure; that is not an accurate description of what an HSM does.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2632f870aa8b", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CodeCommit uses the repository ID as the AWS KMS encryption context for its encrypt/decrypt operations.", "status": "supported"}, {"claim_type": "rule", "conditions": ["determining which KMS key operations applied to a specific AWS CodeCommit repository"], "confidence": "high", "id": "cl-90d700484d79", "source_question_ids": ["awssysops-p2-q479"], "statement": "AWS CloudTrail logs record KMS API calls tagged with their encryption context, so searching CloudTrail for an AWS CodeCommit repository ID surfaces which key operations (encrypt/decrypt) were performed for that repository.", "status": "supported"}, {"claim_type": "default", "conditions": ["prior to the late-2019 asymmetric CMK launch"], "confidence": "medium", "id": "cl-3ad0ee96f3bf", "source_question_ids": ["awssysops-p2-q480"], "statement": "As originally launched, AWS KMS supported only symmetric key cryptography.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["as of the late-2019 asymmetric CMK launch onward"], "confidence": "medium", "id": "cl-0983b635e6c1", "source_question_ids": ["awssysops-p2-q480"], "statement": "AWS KMS added support for asymmetric customer master keys (CMKs) in late 2019, so AWS KMS currently supports both symmetric and asymmetric key cryptography.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d9b54f30a8cb", "source_question_ids": ["awssysops-p2-q481"], "statement": "AWS decommissions storage media using techniques detailed in NIST 800-88; older AWS documentation also cited DoD 5220.22-M.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e9bca5bd5bff", "source_question_ids": ["awssysops-p2-q481"], "statement": "Decommissioned magnetic storage media at AWS is degaussed and physically destroyed per industry-standard practices.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-cda34a88836f", "source_question_ids": ["awssysops-p2-q481"], "statement": "AWS does not simply reformat and reuse old storage disks as its data-protection approach for decommissioned devices.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0830dafb6b89", "source_question_ids": ["awssysops-p2-q482"], "statement": "AWS Security Token Service (STS) APIs are used within IAM to grant users temporary access to AWS resources via time-limited credentials.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-99abeff57f96", "source_question_ids": ["awssysops-p2-q482"], "statement": "\"AWS Security Transport Service\", \"AWS Security Tree Service\", and \"AWS Security Task Service\" are not real AWS service names; they are plausible-but-wrong expansions of the STS acronym, distinct from the real \"AWS Security Token Service\".", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ce550255ed71", "source_question_ids": ["awssysops-p2-q492"], "statement": "Amazon Cognito supports web identity federation through Facebook, Google, and Amazon as external identity providers.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-990af17f4fbc", "source_question_ids": ["awssysops-p2-q497"], "statement": "In symmetric key cryptography terminology used by AWS KMS, unencrypted data is called plaintext and its encrypted form is called ciphertext.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-64312597641e", "source_question_ids": ["awssysops-p2-q522"], "statement": "AWS CloudHSM provides dedicated hardware security modules that support asymmetric key operations and can exchange keys with commercial on-premises HSMs via supported RSA key-wrap methods, making it the appropriate service for integrating an existing on-premises asymmetric key management system with AWS.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e56e8ca3799d", "source_question_ids": ["awssysops-p2-q522"], "statement": "Deploying a generic Amazon EC2 instance from an AWS Marketplace AMI does not inherently provide any key-management integration capability.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["mobile application users need secure access to their own content in a shared S3 bucket"], "confidence": "medium", "id": "cl-ab5724cc3fe6", "source_question_ids": ["awssysops-p2-q527"], "statement": "Amazon Cognito authenticates mobile application end users, directly or via federated identity providers, and vends temporary credentials tied to an IAM role, which scopes exactly what each user can access in a shared S3 bucket, typically via per-user prefixes.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0f19e99dea2a", "source_question_ids": ["awssysops-p2-q527"], "statement": "AWS Organizations manages multi-account governance and plays no role in authenticating individual mobile application end users for S3 access.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-36d5b6924a97", "source_question_ids": ["awssysops-p2-q536"], "statement": "A security group inbound rule scoped to a security group ID (rather than a CIDR) allows any instance that is itself a member of that referenced security group to connect, regardless of that instance's own source IP address.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-c0919852dba1", "source_question_ids": ["awssysops-p2-q536"], "statement": "Multiple inbound security group rules on the same port are additive: traffic is permitted if it matches any one of the rules, even if a different rule on the same port is more restrictive.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa1713222db9", "source_question_ids": ["awssysops-p2-q536"], "statement": "A security group rule opening a specific port (e.g., 389) to 0.0.0.0/0 does not grant access on a different port (e.g., 22); each rule only applies to its own specified port.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-31615cfa6e51", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the AWS shared responsibility model, the customer is responsible for patching the guest OS on Amazon EC2 instances.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "medium", "id": "cl-f338ea79ab7e", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the shared responsibility model, the customer is responsible for choosing and configuring S3 encryption settings (such as SSE-KMS keys and bucket policies); since January 2023, S3 applies SSE-S3 to all new objects by default.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "medium", "id": "cl-2cc3b8bbc80b", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the AWS shared responsibility model, patching the underlying OS and database engine on Amazon RDS instances is typically framed as AWS/platform-managed, not the customer's responsibility.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model", "AWS Elastic Beanstalk managed platform"], "confidence": "medium", "id": "cl-16c7c514ca27", "source_question_ids": ["awssysops-p2-q538"], "statement": "In AWS Elastic Beanstalk, AWS releases platform updates (OS and runtimes such as PHP), but the customer is responsible for applying them, either manually or by enabling managed platform updates.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-773e08d6e33b", "source_question_ids": ["awssysops-p2-q539"], "statement": "Amazon Inspector scans EC2 instances, Amazon ECR container images, and Lambda functions for vulnerabilities; it does not scan managed Amazon RDS databases.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-fdafe4a46755", "source_question_ids": ["awssysops-p2-q539"], "statement": "Reviewing a security group's inbound access rules for least privilege is a recommended, directly actionable RDS security-hardening step.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-87426a8980df", "source_question_ids": ["awssysops-p2-q539"], "statement": "Reviewing RDS Parameter Group settings to ensure encrypted connections are enforced is a recommended, directly actionable RDS security-hardening step.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-59dc6d6003c5", "source_question_ids": ["awssysops-p2-q539"], "statement": "Standard (non-Custom) Amazon RDS gives no OS-level or SSH access to the DB host; only RDS Custom allows host access.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-a62cca529149", "source_question_ids": ["awssysops-p2-q539"], "statement": "A source's boxed answer for RDS hardening recommended using Amazon Inspector to report on RDS database security vulnerabilities, which conflicts with Amazon Inspector's actual EC2-only scope and with the source's own unanimous community vote favoring a different option instead.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-a7cd4145001c", "source_question_ids": ["awssysops-p2-q551"], "statement": "AWS Shield Standard is free and automatically enabled on every AWS account, providing baseline DDoS protection.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6bcd0bd55664", "source_question_ids": ["awssysops-p2-q551"], "statement": "AWS Shield Advanced adds enhanced DDoS protection for larger, more sophisticated attacks and, with a Business or Enterprise Support plan, 24/7 access to the Shield Response Team (SRT, formerly the DDoS Response Team).", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3d04f1af5996", "source_question_ids": ["awssysops-p2-q578", "awssysops-p3-1-q745"], "statement": "Amazon Inspector automatically and continuously scans EC2 instances, Lambda functions, and ECR container images for known CVEs and network exposure, with no assessment schedule to configure.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-ea464a0e284a", "source_question_ids": ["awssysops-p2-q578"], "statement": "AWS Trusted Advisor checks account-level best practices such as cost optimization, fault tolerance, and service limits, but does not perform CVE-depth vulnerability scanning.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-733868a1a789", "source_question_ids": ["awssysops-p2-q578"], "statement": "The AWS idence": "high", "id": "cl-b0265694b153", "source_question_ids": ["awssysops-p2-q588"], "statement": "AWS WAF rate-based rules automatically track request rates per client IP address and can block (blacklist) any source that exceeds a defined threshold.", "status": "supported"}, {"claim_type": "rule", "conditions": ["attack traffic is distributed over many, not-pre-known IP addresses"], "confidence": "medium", "id": "cl-3d77ad46d08b", "source_question_ids": ["awssysops-p2-q588"], "statement": "A security group or network ACL deny list is impractical for blocking a large-scale distributed attack because the offending source IP addresses are not known or fixed in advance.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-c9800c358d64", "source_question_ids": ["awssysops-p2-q588", "awssysops-p2-q600", "awssysops-p3-1-q600", "awssysops-p3-1-q681"], "statement": "AWS WAF must be placed in front of a supported entry point, such as an Application Load Balancer, Amazon CloudFront distribution, or API Gateway; it cannot filter traffic for the origin on its own.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-29ad750e2f77", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "AWS WAF can inspect and filter HTTP(S) requests, including malformed headers, before they reach the origin, when attached in front of an ALB, CloudFront distribution, or API Gateway.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9aef3e1b25c9", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "An Application Load Balancer automatically rejects malformed HTTP requests on its own, returning an HTTP 400 error, which can keep malformed-header attack traffic from reaching backend EC2 instances without provisioning AWS WAF.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-efc838bc7fe6", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "Security groups filter traffic by IP address and port, not by HTTP content, so they cannot block an attack based on malformed HTTP headers.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-29915e366cc2", "source_question_ids": ["awssysops-p2-q600", "awssysops-p3-1-q600"], "statement": "Amazon Inspector is a vulnerability-assessment tool, not an inline traffic filter, so it cannot prevent malformed-header traffic from reaching EC2 instances.", "status": "supported"}, {"claim_type": "fact", "conditions": ["IAM policy denies API calls lacking MFA authentication"], "confidence": "high", "id": "cl-3a01fea028c7", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "An IAM policy that denies API calls not authenticated with MFA relies on the aws:MultiFactorAuthPresent condition key.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fab912fba1f5", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "API calls signed with a user's long-term IAM access keys carry no MFA information, so they never satisfy an aws:MultiFactorAuthPresent condition.", "status": "supported"}, {"claim_type": "rule", "conditions": ["temporary credentials obtained via sts:get-session-token with a valid MFA code"], "confidence": "high", "id": "cl-fdf721679d4d", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "Temporary credentials obtained via sts:get-session-token while supplying a valid MFA code carry the aws:MultiFactorAuthPresent condition key, satisfying MFA-required policies for CLI/API calls.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f5656d78603b", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "Logging into the AWS Management Console with MFA has no effect on whether separately-signed CLI API calls are considered MFA-authenticated.", "status": "supported"}, {"claim_type": "exception", "conditions": ["using temporary session credentials from sts:get-session-token"], "confidence": "high", "id": "cl-548f1439988e", "source_question_ids": ["awssysops-p3-1-q602"], "statement": "MFA is supported for AWS CLI use via temporary session credentials obtained with sts:get-session-token.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1dfae58cc0a6", "source_question_ids": ["awssysops-p3-1-q630"], "statement": "ACM returns a 'Domain Not Allowed' error when a requested name is an Amazon-owned domain such as *.elb.amazonaws.com or is flagged as unsafe (e.g., by VirusTotal), so you cannot get an ACM certificate for an ALB's own DNS name.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-8e9522e8578d", "source_question_ids": ["awssysops-p3-1-q630"], "statement": "The fix for an ACM \"Domain Not Allowed\" error is to submit a new certificate request for the actual domain name owned by the requester, then point that domain at the load balancer with a Route 53 alias record.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-9b4703d0dab9", "source_question_ids": ["awssysops-p3-1-q630"], "statement": "A failed ACM certificate request cannot be resubmitted or revalidated by resending the validation email; a new request must be submitted once the underlying problem is fixed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-69f0c85a7a0d", "source_question_ids": ["awssysops-p3-1-q653"], "statement": "Sharing a bastion host's original launch-time SSH private key directly with an administrator grants root/owner-level access that cannot be selectively revoked without re-keying the instance for everyone.", "status": "conflicted"}, { ce": "medium", "id": "cl-3ac2aa46cd6a", "source_question_ids": ["awssysops-p3-1-q658"], "statement": "AWS's own background vulnerability patching of underlying infrastructure is a separate, AWS-managed process and is not a substitute for a customer's own mandated third-party vulnerability testing of their workload.", "status": "supported"}, {"claim_type": "exception", "conditions": ["the CMK uses imported key material"], "confidence": "high", "id": "cl-cd70daf8c52d", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "AWS KMS does not support automatic key rotation for a customer master key (CMK) that has imported key material.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["KMS key is a symmetric encryption key with KMS-generated (AWS_KMS origin) key material"], "confidence": "medium", "id": "cl-761da075915e", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "Automatic rotation of a customer managed KMS key defaults to every 365 days but can be set to a custom period of 90 to 2560 days, such as about 6 months.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["CMK uses imported key material and is referenced by alias"], "confidence": "medium", "id": "cl-83eae14bd7da", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "A KMS key with imported key material can be rotated by creating a new KMS key with new imported material and repointing the alias the application uses, or, on current KMS, by importing new key material into the existing key and performing on-demand rotation.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c00d71a2b13c", "source_question_ids": ["awssysops-p3-1-q669"], "statement": "Deleting a KMS key's current imported key material is not a valid rotation step: it makes the key unusable and leaves existing ciphertext undecryptable until that same material is reimported.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-2611fab25799", "source_question_ids": ["awssysops-p3-1-q681"], "statement": "AWS WAF cannot be attached to a Classic Load Balancer; it protects resources such as CloudFront distributions, Application Load Balancers, API Gateway REST APIs, AppSync GraphQL APIs, Cognito user pools, App Runner services, and Verified Access instances.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["application code is unavailable to patch directly"], "confidence": "medium", "id": "cl-b95c0283618e", "source_question_ids": ["awssysops-p3-1-q681"], "statement": "Migrating a load balancer tier from Classic Load Balancer to Application Load Balancer and then attaching an AWS WAF web ACL with SQL-injection rules is a cost-effective way to mitigate SQL injection risk in a legacy application whose source code cannot be modified.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-03b40014f553", "source_question_ids": ["awssysops-p3-1-q681"], "statement": "Amazon GuardDuty is a threat-detection service that surfaces suspicious findings but does not itself block SQL injection traffic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d74d28ef5c34", "source_question_ids": ["awssysops-p3-1-q681"], "statement": "Fronting a load balancer with Amazon CloudFront and subscribing to AWS Shield Standard protects against DDoS attacks, not against SQL injection payloads.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ebd6aaa2869b", "source_question_ids": ["awssysops-p3-1-q683"], "statement": "Under the AWS shared responsibility model, AWS is responsible for patching the underlying hypervisor for EC2, as part of 'security of the cloud'.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f8ee2d6492f1", "source_question_ids": ["awssysops-p3-1-q683"], "statement": "Under the AWS shared responsibility model, AWS is responsible for maintaining the physical network infrastructure underlying EC2, as part of 'security of the cloud'.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e110cee3d64d", "source_question_ids": ["awssysops-p3-1-q683"], "statement": "Under the AWS shared responsibility model, the customer is responsible for patching the guest operating system, monitoring memory utilization, and configuring network ACLs for their own EC2 resources, as part of 'security in the cloud'.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d35d4dfe387e", "source_question_ids": ["awssysops-p3-1-q691"], "statement": "AWS Artifact provides on-demand access to AWS compliance reports, including the PCI DSS Attestation of Compliance (AOC) and Responsibility Summary, which specify which PCI DSS requirements are AWS's responsibility versus the customer's.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-534dc24921b4", "source_question_ids": ["awssysops-p3-1-q691"], "statement": "AWS Macie discovers and classifies sensitive data in Amazon S3 and does not surface compliance-responsibility documentation.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-394adac6bdc2", "source_question_ids": ["awssysops-p3-1-q691"], "statement": "AWS OpsWorks is a configuration-management service and AWS Organizations manages multi-account structure; neither surfaces compliance-responsibility documentation like PCI DSS requirement ownership.", "status": "supported"}, {"claim_type": "rule", "conditions": ["setting up AWS SSO for the first time with Directory Service and Organizations already configured"], "confidence": "high", "id": "cl-80afb31e44c4", "source_question_ids": ["awssysops-p3-1-q741"], "statement": "After a directory is configured in AWS Directory Service and full access is enabled in AWS Organizations, the next AWS SSO setup step is to create permission sets in AWS SSO and associate them with Directory Service users or groups.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-839221a8542a", "source_question_ids": ["awssysops-p3-1-q741"], "statement": "Manually creating IAM roles in every member account, or IAM users in the master account, duplicates the identity/access management work that AWS SSO permission sets already handle centrally.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f4da2ca22cda", "source_question_ids": ["awssysops-p3-1-q741"], "statement": "Service control policies (SCPs) in AWS Organizations restrict what actions are possible account-wide as a guardrail, and are not an access-granting mechanism tied to individual users the way AWS SSO permission sets are.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5f9c687e1198", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "Amazon Inspector consolidates vulnerability findings for all scanned EC2 instances in one central view, covering more instances with less effort than checking each instance manually.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c65b709a4867", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "Manually SSHing into each EC2 instance to check its software version does not scale and is the highest-operational-overhead way to check many instances for a vulnerable software version.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-eb8498ac3c16", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "AWS CloudTrail records API activity, not installed software versions, so it cannot by itself detect a vulnerable software version on EC2 instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-64d25f9ce242", "source_question_ids": ["awssysops-p3-1-q745"], "statement": "Writing and maintaining a custom script deployed via AWS CodeDeploy to check EC2 instances for a vulnerable software version requires more operational overhead than using Amazon Inspector's built-in scanning.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-de7307902cc7", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "Automatic key rotation in AWS KMS is a supported, optional feature of a customer managed CMK.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3084659501fa", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "AWS managed KMS keys rotate automatically every year (about 365 days; every 3 years before May 2022), and that schedule cannot be enabled, disabled, or changed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d176438fb33e", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "AWS KMS retains all prior key material indefinitely after automatic rotation, so ciphertext encrypted under an earlier key rotation remains decryptable.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7a1ee7d7622e", "source_question_ids": ["awssysops-p3-1-q749"], "statement": "Neither alternative replaces enabling automatic rotation: an encrypted EBS volume's KMS key cannot be changed in place (it needs a snapshot copy with the new key and a new volume), and new key material cannot be imported into a KMS key whose material AWS KMS generated.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-858c2050fed4", "source_question_ids": ["awssysops-p3-1-q755"], "statement": "SSH succeeding while ping fails to the same EC2 instance is the typical signature of a security group that allows inbound TCP on port 22 but has no rule allowing ICMP traffic, since each protocol/port is filtered independently.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-00a5f7098142", "source_question_ids": ["awssysops-p3-1-q755"], "statement": "Adding an inbound security group rule allowing ICMP traffic resolves a ping timeout without affecting SSH connectivity.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-06583d7a4354", "source_question_ids": ["awssysops-p3-1-q755"], "statement": "IP addressing (Elastic IP or not) affects reachability for all protocols equally, so it cannot cause ping to fail while SSH to the same address succeeds.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-deed2da566a4", "source_question_ids": ["awssysops-p3-1-q755"], "statement": "AWS Direct Connect is unrelated to whether a basic connectivity check such as ping succeeds against an instance that is already reachable via SSH.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-4cca649c5b94", "source_question_ids": ["awssysops-p3-1-q755"], "statement": "VPC peering has no bearing on whether direct SSH or ping to an instance succeeds, so it cannot explain SSH working while ping times out.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-afab811a4355", "source_question_ids": ["awssysops-p3-1-q767"], "statement": "AWS WAF supports XSS-match rule conditions/statements specifically designed to detect and block cross-site scripting attack patterns in incoming web requests.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a01ed057824d", "source_questio WS KMS cannot be used to create TLS/SSL certificates; that is not a real KMS capability.", "status": "supported"}, {"claim_type": "rule", "conditions": ["hybrid deployment with data passing between on-premises data center and AWS"], "confidence": "low", "id": "cl-27d4eefc8dd5", "source_question_ids": ["awssysops-p3-1-q768"], "statement": "Whether a VPN tunnel alone (versus ACM-issued TLS certificates on an AWS-integrated endpoint) sufficiently secures the in-transit leg of a hybrid on-premises-to-AWS deployment is debated, since a VPN only secures traffic across the tunnel itself rather than end-to-end.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1a944f610e10", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "AWS WAF rate-based rules automatically track request rates per originating IP address and can block or rate-limit any IP that exceeds a defined threshold.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8e88d32a397e", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "Amazon GuardDuty does not provide application-layer protection against bots or scrapers; it is a threat-detection service for AWS account and network activity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8421effc096f", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "Amazon CloudFront caching can reduce origin load for cacheable content but does not itself detect or block malicious requesters.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-038dee2bc2ca", "source_question_ids": ["awssysops-p3-1-q770"], "statement": "A Lambda pipeline cannot block bot IP addresses through security groups, because security groups support only allow rules; denying specific IPs needs network ACL deny rules or AWS WAF, whose rate-based rules do this automatically.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0df08ee4937a", "source_question_ids": ["awssysops-p3-1-q771"], "statement": "AWS CloudHSM is a dedicated hardware security module for securely generating, storing, importing, and using private keys for cryptographic signing operations within a customer-controlled, tamper-resistant environment.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0cb98844a244", "source_question_ids": ["awssysops-p3-1-q771"], "statement": "AWS CloudHSM supports importing existing SSL/TLS private keys.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9dba93515cc4", "source_question_ids": ["awssysops-p3-1-q771"], "statement": "AWS Certificate Manager manages its own private keys internally via KMS for certificates it issues for AWS-integrated services, but does not expose general-purpose private-key storage and signing operations as a standalone secure-environment service.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-6cee44b07bf1", "source_question_ids": ["awssysops-p3-1-q771"], "statement": "AWS Certificate Manager can import certificates and their private keys from external CAs for use with ACM-integrated services, but it does not let customers perform their own signing operations with those private keys.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9384dfc65dd0", "source_question_ids": ["awssysops-p3-1-q771"], "statement": "Plain AWS KMS manages encryption keys but is not the documented service for storing and performing signing operations on externally issued SSL certificate private keys in a dedicated secure hardware environment.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-745831f851d7", "source_question_ids": ["awssysops-p3-1-q771"], "statement": "Amazon Connect is a contact-center service unrelated to cryptographic key management.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1adc3ceae39a", "source_question_ids": ["awssysops-p3-1-q773"], "statement": "AWS WAF web ACL rules (rate-based or pattern-matching) can detect a single IP address repeatedly requesting non-existent pages and block that IP, stopping scraping-bot activity.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8f3954ef1a12", "source_question_ids": ["awssysops-p3-1-q773"], "statement": "AWS CloudTrail only logs AWS API and management-plane activity, not end-user web traffic, so it has no capability to block malicious web requests.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3eb586515bcc", "source_question_ids": ["awssysops-p3-1-q773", "awssysops-p3-1-q890", "awssysops-p3-1-q922"], "statement": "Amazon Inspector assesses EC2 instance and container image vulnerabilities and network configuration/reachability; it does not inspect, block, or analyze live web traffic or database content.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b9c4686c8580", "source_question_ids": ["awssysops-p3-1-q789"], "statement": "AWS CloudHSM supports generating, storing, importing, and exporting both symmetric and asymmetric key pairs.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2a3a63ed3b83", "source_question_ids": ["awssysops-p3-1-q789"], "statement": "AWS KMS supports importing external key material for symmetric encryption, HMAC, and asymmetric KMS keys, not only symmetric keys.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d10dd3b92703", "source_question_ids": ["awssysops-p3-1-q789"], "statement": "AWS KMS added asymmetric key creation in November 2019 and later (2023) added importing external asymmetric key material.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d267e2871eec", "source_question_ids": ["awssysops-p3-1-q789"], "statement": "AWS Certificate Manager issues and manages certificates for AWS-integrated services rather than serving as a general-purpose target for importing externally managed key material.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a834cc6e2cf7", "source_question_ids": ["awssysops-p3-1-q789"], "statement": "AWS Secrets Manager stores secrets and credentials, not cryptographic key material for signing or encryption operations.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6aab1e646bef", "source_question_ids": ["awssysops-p3-1-q814"], "statement": "An AWS WAF String match condition can inspect the content of a specific request header and match it against a given value, such as a division name.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-696cbf9141da", "source_question_ids": ["awssysops-p3-1-q814"], "statement": "An AWS WAF IP match condition filters purely on network-layer source IP address and cannot inspect application-layer header content.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-57fd3657835e", "source_question_ids": ["awssysops-p3-1-q814"], "statement": "An AWS WAF Cross-site scripting condition is a payload-detection rule for a specific attack pattern, not a general header-content matching mechanism.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ca39558bf8dc", "source_question_ids": ["awssysops-p3-1-q814"], "statement": "An AWS WAF Geo match condition filters requests by their geographic origin, not by header content.", "status": "supported"}, {"claim_type": "rule", "conditions": ["console access must use on-premises Active Directory accounts"], "confidence": "medium", "id": "cl-dd9dd25e237c", "source_question_ids": ["awssysops-p3-1-q831"], "statement": "Federating AWS Management Console access to an on-premises Active Directory requires both network connectivity back to the on-premises directory (via VPN or AWS Direct Connect) and an AD Connector to proxy authentication requests to AWS Directory Service.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-c3dd37f2b786", "source_question_ids": ["awssysops-p3-1-q831"], "statement": "Configuring AWS Direct Connect alone establishes only network-layer connectivity between on-premises and AWS and does nothing by itself to federate identity or enable Active-Directory-based console authentication.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3e0597728c9f", "source_question_ids": ["awssysops-p3-1-q831"], "statement": "Amazon Route 53 is a DNS service with no Active Directory federation capability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-85fa00ba41ad", "source_question_ids": ["awssysops-p3-1-q831"], "statement": "Multi-factor authentication is an orthogonal security control that does not by itself enable Active-Directory-based console login.", "status": "supported"}, {"claim_type": "rule", "conditions": ["providing multi-account AWS access from an existing on-premises Active Directory", "minimizing setup effort"], "confidence": "medium", "id": "cl-ead0a91ff408", "source_question_ids": ["awssysops-p3-1-q847"], "statement": "Pairing an AD Connector (AWS Directory Service) with AWS Single Sign-On provides centralized, low-effort access management across multiple AWS accounts directly from an existing on-premises Active Directory.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ec3de5122fa6", "source_question_ids": ["awssysops-p3-1-q847"], "statement": "AWS IAM Identity Center (formerly AWS Single Sign-On) supports an existing Active Directory, connected through AD Connector, as an identity source.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-969c66a37d3d", "source_question_ids": ["awssysops-p3-1-q847"], "statement": "IAM trust policies are attached to IAM roles, not IAM users.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b6f6fec8ad42", "source_question_ids": ["awssysops-p3-1-q847"], "statement": "Amazon Cognito federated identity pools are designed for consumer-facing application identity federation, not centralized enterprise multi-account AWS access.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-50e5fb39eb7f", "source_question_ids": ["awssysops-p3-1-q847"], "statement": "Manually creating a custom IAM identity provider plus per-account IAM roles requires considerably more manual setup than the built-in AD Connector-to-AWS-SSO integration.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-cb524ed67b87", "source_question_ids": ["awssysops-p3-1-q858"], "statement": "AWS KMS automatic rotation of customer managed symmetric encryption keys uses a configurable period of 90 to 2560 days (default 365), so a weekly period cannot be set; on-demand rotation is also available.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["required rotation period is shorter than 90 days"], "confidence": "medium", "id": "cl-5093510d697f", "source_question_ids": ["awssysops-p3-1-q858"], "statement": "To rotate a KMS key more often than the 90-day minimum automatic rotation period, such as weekly, create a new KMS key on that schedule and repoint aliases and applications to it.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4c60ecbe2ec0", "source_question_ids": ["awssysops-p3-1-q858"], "statement": "AWS KMS does support key rotation, so the claim that KMS lacks key rotation support entirely is incorrect.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6740bdae36ab", "source_question_ids": ["awssysops-p3-1-q858"], "statement": "Using data keys for each encryption task does not eliminate the need to rotate the CMK that ultimately protects those data keys.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-c80d5c3b8aa6", "source_question_ids": ["awssysops-p3-1-q867"], "statement": "Amazon Inspector network reachability findings for EC2 come from analyzing VPC network configuration and need no agent on the instance; Inspector Classic rules packages are retired.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["security findings are missing for only a subset of EC2 instances"], "confidence": "medium", "id": "cl-0bd9047e85b8", "source_question_ids": ["awssysops-p3-1-q867"], "statement": "Amazon Inspector scans an EC2 instance for software vulnerabilities only if it is SSM-managed (SSM Agent running, instance profile attached) or agentless scanning is enabled, so findings missing for only some instances usually mean those instances are not SSM-managed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6d1a945d024f", "source_question_ids": ["awssysops-p3-1-q867"], "statement": "Amazon Inspector findings cannot be manually generated by logging into instances and running CLI commands; that is not how Inspector produces findings.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-08f3535eeaa7", "source_question_ids": ["awssysops-p3-1-q867"], "statement": "Amazon Inspector scans EC2 instances through the SSM Agent or agentless snapshot scanning, not through a separate Inspector agent obtained from AWS Marketplace.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["the client's security group outbound rules already allow the traffic (e.g., default allow-all outbound)"], "confidence": "medium", "id": "cl-bb387d494158", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "Security groups are stateful, so return traffic for an allowed connection is permitted automatically; when the client's security group already allows the outbound traffic (as the default allow-all outbound rule does), only the target needs an inbound rule for the port.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-098b70bc6fe7", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "A network ACL is stateless and is evaluated independently in each traffic direction, so a misconfigured network ACL rule on a subnet can block traffic like RDP even when the security group is correctly configured.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-976f9b740606", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "A route table missing a route to the internet gateway for a subnet prevents internet-bound reply traffic from leaving that subnet, which can block connections like RDP over the internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-251aa21452cb", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "Every EC2 instance in an IPv4 or dual-stack subnet is automatically assigned a primary private IPv4 address at launch, so a missing private IP is not a realistic cause of an RDP failure; only instances in IPv6-only subnets have none.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d90a889728ab", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "Port 22 is used by SSH, not RDP, so a missing inbound rule on port 22 is irrelevant to diagnosing a failed RDP connection to a Windows bastion.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b9c6288caf32", "source_question_ids": ["awssysops-p3-1-q890"], "statement": "AWS WAF can be configured with a SQL injection rule in a web ACL to inspect web requests and block matching requests before they reach the Application Load Balancer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b95cf30a89c8", "source_question_ids": ["awssysops-p3-1-q890"], "statement": "Amazon GuardDuty analyzes account, network, and DNS activity but does not inspect HTTP request payloads, so it cannot detect or block SQL injection; AWS WAF does that.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4306bc517f10", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Security groups are stateful, so response traffic for a connection initiated outbound is automatically permitted back in without needing a separate inbound rule.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-014b7bf6e53e", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "A newly created security group includes a default allow-all outbound rule, which must be explicitly removed before outbound traffic becomes restricted to only the explicitly listed rules.", "status": "supported"}, {"claim_type": "rule", "conditions": ["default allow-all outbound rule has been removed from the security group"], "confidence": "high", "id": "cl-dc22455f4e22", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "When a security group's default allow-all outbound rule has been removed and replaced with specific outbound rules, any destination not covered by those specific rules becomes unreachable from that security group.", "status": "supported"}, {"claim_type": "rule", "conditions": ["the client tier initiates the connection to the server tier and the required outbound rule is missing"], "confidence": "medium", "id": "cl-f3a12b523424", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Because the web tier is the one initiating the connection to the database, the fix for a blocked web-to-database connection is to add an outbound rule on the web security group allowing the database security group on the database port, not an inbound rule on the web security group.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-83a6323f662c", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Adding an inbound rule to a security group only permits connections initiated from the referenced source toward that security group; it has no effect on an outbound connection attempt that is being blocked by missing outbound rules.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a2fd233188e6", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Opening all outbound traffic (0.0.0.0/0, all ports) to fix a specific connectivity issue is broader than necessary and compromises security compared to a scoped outbound rule to the specific destination and port needed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-641258c1ae2d", "source_question_ids": ["awssysops-p3-1-q893"], "statement": "Changing an existing outbound security group rule to point at a different security group or port removes the connectivity the original rule provided, rather than adding new connectivity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-03999c5dde72", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRoleWithSAML is the STS API call that exchanges a SAML 2.0 assertion for temporary AWS credentials, enabling federated programmatic access such as AWS CLI usage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-711dbcf67d37", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRole requires the caller to already hold valid AWS credentials for another IAM principal; it cannot accept a SAML assertion directly.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3d92f251a4fe", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:AssumeRoleWithWebIdentity is for OIDC/web-identity providers such as Google, Facebook, or Amazon Cognito, not for SAML assertions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e2472f6481a2", "source_question_ids": ["awssysops-p3-1-q912"], "statement": "sts:GetFederationToken is called with long-term IAM user credentials (typically by a custom identity broker) and does not accept a SAML assertion, so it is not the API for SAML-based federation; that is sts:AssumeRoleWithSAML.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3c220afd2a93", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "SSH operates over TCP port 22, so a missing inbound security group rule for port 22 is a common and direct cause of a failed SSH connection to a Linux instance.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-88d73eb16e2d", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 443 (HTTPS) has no bearing on SSH connectivity.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ee10805b491b", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 80 (HTTP) is unrelated to SSH connectivity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-93f4305c1f0a", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 3389 is the Windows remote-desktop (RDP) port and is not applicable to a Linux instance being accessed via SSH.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6c70cd94ea83", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "Amazon Macie uses machine learning and pattern matching to discover sensitive data, but it only scans data stored in Amazon S3.", "status": "supported"}, {"claim_type": "rule", "conditions": ["sensitive data resides in a database rather than directly in S3"], "confidence": "high", "id": "cl-913c8a363bf2", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "To use Amazon Macie to detect sensitive data stored in a database such as Aurora MySQL, the data must first be exported to Amazon S3 (for example via an AWS Lambda function) before Macie can examine it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-bd882e81eea8", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "There is no 'GuardDuty plugin for Aurora'; Amazon GuardDuty is a threat-detection service (its RDS Protection analyzes only Aurora login activity) and does not scan database content for sensitive data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-580457efa7f5", "source_question_ids": ["awssysops-p3-1-q922"], "statement": "VPC Flow Logs combined with Amazon Detective analyze network traffic patterns and security findings, not the actual content of data being stored.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6910d2c28cce", "source_question_ids": ["awssysops-p3-1-q923"], "statement": "A VPC interface
