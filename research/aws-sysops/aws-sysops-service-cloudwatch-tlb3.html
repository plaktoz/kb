stance family, including memory-optimized instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2ff15cf9093e", "source_question_ids": ["awssysops-p3-1-q911"], "statement": "A custom Lambda function scheduled via EventBridge to capture EC2 memory utilization requires building and maintaining a bespoke solution that the CloudWatch agent already provides natively.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f1253ac04da0", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "CloudWatch detailed monitoring delivers EC2 instance metrics (such as CPU and network utilization) at 1-minute intervals.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e8be7e0e6b5b", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "CloudWatch basic monitoring only delivers EC2 instance metrics at 5-minute intervals.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1af583583860", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "AWS CloudTrail with a QuickSight dashboard records API call activity, not resource utilization metrics like CPU or network usage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-874535fc317b", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "The AWS Personal Health Dashboard surfaces service-health events and alerts, not per-instance performance metrics.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-d9fac6d164be", "source_question_ids": ["awssysops-p3-1-q919"], "statement": "This question's labeled correct answer (basic monitoring) conflicts with the unanimous community vote and AWS documentation, both of which favor detailed monitoring for a stated 1-minute interval requirement.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-9c3eb028c430", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "An EC2 instance profile can only be associated with an IAM role, never directly with an IAM user.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4b6dfe03ddd5", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "To let the CloudWatch Logs agent on an EC2 instance deliver logs, create an IAM role with the needed CloudWatch Logs permissions, wrap it in an instance profile, and associate that instance profile with the EC2 instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-32359e49c3dd", "source_question_ids": ["awssysops-p3-1-q931"], "statement": "Security group or network ACL rules allowing inbound traffic on port 80 affect inbound web traffic to an instance, not the CloudWatch Logs agent's own outbound API calls to the CloudWatch Logs service.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-cloudwatch--m-1", "title": "CloudWatch only knows what is pushed into it: hypervisor-visible default metrics vs. in-guest custom metrics, then alarms act on data points", "purpose": "Predict, for any CloudWatch scenario, whether the data already exists (and at what resolution), whether something must publish it as a custom metric, and what an alarm on it will do -- the three questions behind most CloudWatch exam items.", "mechanism": "CloudWatch is a passive, regional time-series store. A metric is identified by namespace + metric name + dimensions; data points that share all three are aggregated as one metric, and a different dimension set is a different metric. Data arrives two ways. (1) AWS services publish their own metrics automatically: for EC2 that is only what the hypervisor can see from outside the guest -- CPUUtilization, network, instance-store disk I/O, and status checks -- sent every 5 minutes (basic) or every 1 minute if detailed monitoring is enabled. (2) Anything only knowable inside the guest OS (memory, free disk space, per-process stats) or outside AWS (on-premises servers, a temperature sensor) has to be pushed as a custom metric through PutMetricData, normally by the CloudWatch agent, with a mandatory namespace, using credentials from an IAM role on the instance and a network path to the endpoint. High-frequency data should be pre-aggregated into a statistic set (Min/Max/Sum/SampleCount) per call. An alarm watches exactly one metric. It compares data points to a threshold over N periods and sits in one of three states: OK, ALARM, or INSUFFICIENT_DATA (when data stops arriving). On a state change it can notify SNS (email/SMS/HTTP), run an Auto Scaling policy on a group, or stop/terminate/reboot/recover an EC2 instance.", "predict_prompt": "An ops team wants an email whenever an EC2 instance's memory utilization stays above 90% for 1 minute. They enable detailed monitoring and create an alarm on the AWS/EC2 namespace. Before reading on, predict whether the alarm can ever fire, and what is missing.", "invariants": ["Memory and free disk space are never default EC2 metrics, whatever the instance family or OS; they require the CloudWatch agent (or the legacy scripts) publishing a custom metric.", "Detailed monitoring only changes the frequency of EC2's own default metrics from 5 minutes to 1 minute; it never adds new metrics.", "An alarm period cannot usefully be shorter than the metric's data resolution: at least 300 seconds for basic monitoring, 60 seconds for detailed monitoring.", "A metric's identity is namespace + name + dimensions: the same identity aggregates values from many sources, while a different dimension set is a separate metric.", "An alarm has only three states -- OK, ALARM, INSUFFICIENT_DATA -- and without data points it falls to INSUFFICIENT_DATA.", "Alarm actions target an SNS topic, an Auto Scaling group's policy, or an EC2 instance action -- never a launch configuration or a dashboard."], "limits": ["Billing metrics are global but stored only in us-east-1, and require 'Receive Billing Alerts' to be enabled first.", "Data point timestamps are accepted only from two weeks in the past to two hours in the future.", "Which services provide free 1-minute metrics (SNS, Auto Scaling, EMR) changed over time, so the source answers on this are conflicted.", "How a gap in data points from a briefly stopped instance resolves (OK vs ALARM vs INSUFFICIENT_DATA) depends on missing-data handling and is disputed."], "cues": ["'memory', 'free disk space', 'per-process', or 'on-premises server' -> CloudWatch agent + custom metric", "'every 1 minute' / 'within 2 minutes' on CPU or network -> detailed monitoring", "'thousands of data points per second' -> statistic set via put-metric-data", "'instance or volume stopped reporting' / 'RDS became unavailable' -> INSUFFICIENT_DATA state", "'test the alarm's notification' -> set-alarm-state; 'pause actions temporarily' -> DisableAlarmActions", "'who called the CloudWatch API' -> CloudTrail, not CloudWatch"], "claim_ids": ["cl-5bc987e7159b", "cl-d1ab32cc2995", "cl-2235856eee83", "cl-8c950ad90060", "cl-055f826ffaec", "cl-1187c51aeb05", "cl-13bf2a547876", "cl-211de737c9b2", "cl-1d6bb9a52d61", "cl-f71aec823fae", "cl-ab3acc83cf5e", "cl-376ca6076994", "cl-adbee9d584b4", "cl-92a0f3172668", "cl-75ab3e8821db", "cl-b25d87214eec", "cl-3ae5a9c81486", "cl-d242e069a1e1", "cl-d686dd566702", "cl-b8b24b85f734", "cl-b97b78a6f529", "cl-f974f4009c60", "cl-749e99be7c8e", "cl-cce8613c6b8f", "cl-37d3230901f8", "cl-519525b65bcf", "cl-f07f1b1c5929", "cl-9871fd8b11de", "cl-b9de0f2dd9eb", "cl-f6770319a03e", "cl-45157954464a", "cl-da0e066a6a3e", "cl-acc9e567b953", "cl-05ea19318b37", "cl-91812d8191cb", "cl-a0e7267da34e", "cl-c85cba2dc710", "cl-da3e68cfb49b", "cl-a2e5ecbc6606", "cl-679682b767c3"]}, "contrastSet": {"id": "aws-sysops-service-cloudwatch--cs-1", "subjects": ["CloudWatch agent publishing a custom metric", "EC2 detailed monitoring", "CloudWatch Logs / EventBridge / scheduled Lambda"], "dimensions": ["Where the data originates", "Metrics it can supply", "Data resolution", "What it produces in CloudWatch", "Operational effort"], "shared_traits": ["All three appear as answers to 'get more or better EC2 monitoring into CloudWatch'.", "All three feed or sit next to CloudWatch alarms and SNS notifications."], "matrix": {"Where the data originates": {"CloudWatch agent publishing a custom metric": "Inside the guest OS (or an on-prem server)", "EC2 detailed monitoring": "Hypervisor, outside the guest", "CloudWatch Logs / EventBridge / scheduled Lambda": "Log files, events, or bespoke code"}, "Metrics it can supply": {"CloudWatch agent publishing a custom metric": "Memory, free disk space, per-process (procstat)", "EC2 detailed monitoring": "Only default metrics: CPU, network, disk I/O, status checks", "CloudWatch Logs / EventBridge / scheduled Lambda": "No numeric metric publishing on its own"}, "Data resolution": {"CloudWatch agent publishing a custom metric": "Set by metrics_collection_interval (e.g. 60 s)", "EC2 detailed monitoring": "1 minute (basic is 5 minutes)", "CloudWatch Logs / EventBridge / scheduled Lambda": "Whatever the schedule or event fires"}, "What it produces in CloudWatch": {"CloudWatch agent publishing a custom metric": "Custom-namespace metric you can alarm on", "EC2 detailed monitoring": "Finer data points on existing AWS/EC2 metrics", "CloudWatch Logs / EventBridge / scheduled Lambda": "Log events or event triggers, not metrics"}, "Operational effort": {"CloudWatch agent publishing a custom metric": "Install agent plus IAM role with an instance profile", "EC2 detailed monitoring": "Toggle; extra charge", "CloudWatch Logs / EventBridge / scheduled Lambda": "Build and maintain a bespoke solution"}}, "decision_rule": "Ask whether the hypervisor can see the data. If it is a default EC2 metric (CPU, network, disk I/O, status checks) and the problem is only how often it arrives, choose detailed monitoring. If it lives only inside the guest OS (memory, free disk space, per-process) or off AWS, choose the CloudWatch agent publishing a custom metric -- detailed monitoring never adds it, and Logs/EventBridge/Lambda don't publish metrics.", "boundary_flip": "Requirement: 'alarm when CPUUtilization stays high for 2 minutes' -> enable detailed monitoring, since basic 5-minute data is too coarse. Change one word, 'CPUUtilization' to 'memory utilization', and the answer flips to installing the CloudWatch agent with metrics_collection_interval = 60. Detailed monitoring alone now yields no memory data at all.", "strongest_distractor_failure": "Detailed monitoring is the most tempting wrong answer for memory and disk-space questions, because the scenario usually also mentions a 1-minute need. But it only speeds up EC2's existing hypervisor metrics, so the memory metric the alarm needs never exists.", "exceptions": ["For CPU-credit exhaustion on T-series instances, CPUCreditBalance is a default metric, yet the right remediation is disputed.", "Legacy CloudWatch monitoring scripts (Linux/Perl) also published memory and disk as custom metrics, but they are deprecated in favor of the unified agent.", "Detailed monitoring for Auto Scaling instances is set in the launch configuration (defaulting to on when created via CLI/SDK) and cannot be edited in place -- you create a new launch configuration."], "claim_ids": ["cl-d1ab32cc2995", "cl-2235856eee83", "cl-8c950ad90060", "cl-055f826ffaec", "cl-1187c51aeb05", "cl-4012f4a41bb7", "cl-13bf2a547876", "cl-211de737c9b2", "cl-d8ac5ffc766a", "cl-dcf0fba3cc52", "cl-da3e68cfb49b", "cl-ded34df1f1c1", "cl-c7ed6451fe05", "cl-961b14223396", "cl-1d6bb9a52d61", "cl-5bc987e7159b", "cl-08c44a883f15", "cl-87f813c79491", "cl-3514e3e33dcb", "cl-f1253ac04da0", "cl-e8be7e0e6b5b", "cl-b97b78a6f529", "cl-c900c5864519", "cl-efe76b1e64f1", "cl-38019bc60bf4", "cl-2ff15cf9093e", "cl-7840fb641a3f", "cl-b25d87214eec", "cl-4b6dfe03ddd5", "cl-9c3eb028c430", "cl-2ab96af8c9a1", "cl-d86ecb16581d", "cl-3633cf42e6c2", "cl-671e607cdd2d", "cl-dd08dfc6260c", "cl-d2868a6f609f", "cl-35061a2ee1ca"]}, "scenarioFamily": {"id": "aws-sysops-service-cloudwatch--sf-1", "canonical": {"prompt": "An ops team enables detailed monitoring on an EC2 instance and creates a CloudWatch alarm against the AWS/EC2 namespace's MemoryUtilization metric, configured to email the team via SNS whenever memory utilization stays above 90% for 1 minute. A week later the alarm has never once left the INSUFFICIENT_DATA state. What is missing, and what has to change to make the alarm work?", "expected_answer": ["Memory utilization is not a default, hypervisor-visible EC2 metric, so neither detailed monitoring nor an alarm on the AWS/EC2 namespace will ever produce data for it.", "Install and configure the CloudWatch agent on the host to collect memory utilization and publish it as a custom metric via PutMetricData.", "Give the agent CloudWatch credentials appropriate to where it runs -- an IAM role on the instance, not a static IAM user's access keys -- so it can authenticate PutMetricData calls.", "Point the alarm at the custom-namespace MemoryUtilization metric instead of AWS/EC2; only then can it leave INSUFFICIENT_DATA and trigger the SNS email action."], "reasoning": "CloudWatch's AWS/EC2 metrics are everything the hypervisor can see from outside the guest -- CPU, network, instance-store disk I/O, status checks -- never memory, because memory usage is only knowable inside the guest OS. Detailed monitoring is purely a frequency dial on those existing hypervisor metrics (5 min -> 1 min); it adds no new metric. So an alarm on AWS/EC2 MemoryUtilization has no metric to evaluate at all, which is exactly why it sits in INSUFFICIENT_DATA (an alarm falls there whenever its underlying metric stops, or never starts, reporting data points). The fix is to collect memory from inside the guest via the CloudWatch agent, publish it as a custom metric (authenticated by an instance IAM role, the AWS-recommended way to let instances call PutMetricData, rather than long-lived IAM user credentials), and re-point the alarm at that custom metric. Once real data points arrive, the alarm can evaluate them against the threshold and fire its existing SNS email action, which does not need to change.", "distractor_analysis": "Detailed monitoring is the most tempting wrong fix here, because the scenario also mentions a tight 1-minute requirement that detailed monitoring is correctly associated with elsewhere. But detailed monitoring only speeds up polling of metrics EC2 already publishes on its own; it is orthogonal to which metrics exist. A second tempting but wrong fix is to assume the alarm configuration itself (threshold, SNS action) is broken -- it is not: once a real MemoryUtilization data point exists under a custom namespace, the same alarm mechanics (threshold evaluation, OK/ALARM/INSUFFICIENT_DATA states, SNS notification) work unchanged.", "claim_ids": ["cl-2235856eee83", "cl-8c950ad90060", "cl-d1ab32cc2995", "cl-1d6bb9a52d61", "cl-055f826ffaec", "cl-b97b78a6f529", "cl-75ab3e8821db", "cl-f07f1b1c5929", "cl-f974f4009c60"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The alarm's target metric changes from MemoryUtilization to CPUUtilization; detailed monitoring, the AWS/EC2 namespace, and the SNS email action all stay the same.", "prompt": "An ops team enables detailed monitoring on an EC2 instance and creates a CloudWatch alarm against the AWS/EC2 namespace's CPUUtilization metric, configured to email the team via SNS whenever CPU utilization stays above 90% for 1 minute. Will this alarm work as intended, and if so, why does it differ from the memory-utilization version of this setup?", "expected_answer": ["Yes -- CPUUtilization is one of the default EC2 metrics the hypervisor collects and reports automatically, with no agent required.", "Enabling detailed monitoring is both necessary and sufficient here: it raises the data-point frequency for this already-existing metric from 5 minutes to 1 minute, which is exactly what a 1-minute evaluation period needs.", "No CloudWatch agent, custom metric, or IAM role for PutMetricData is needed, because the data already exists at the hypervisor level.", "The alarm will correctly move out of INSUFFICIENT_DATA once data points arrive and will fire its SNS email action the same way it would for any other metric."], "reasoning": "The single word changed -- memory to CPU -- flips the answer because it crosses the hypervisor-visibility line that the mental model turns on. CPUUtilization is hypervisor-visible and default; memory is guest-OS-only and never default. For a default metric, the only gap that detailed monitoring addresses (data resolution) is the only gap that exists, so toggling it is the complete fix, unlike the memory case where no amount of toggling adds the missing metric.", "claim_ids": ["cl-5bc987e7159b", "cl-b97b78a6f529", "cl-1d6bb9a52d61", "cl-f07f1b1c5929", "cl-f974f4009c60"], "difficulty": "easy", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The EC2 instance is now specified as a memory-optimized r5.4xlarge, running as one of 10 instances in an Auto Scaling group in us-east-1, instead of being described generically.", "prompt": "An ops team enables detailed monitoring on each instance of a 10-instance Auto Scaling group of r5.4xlarge (memory-optimized) EC2 instances in us-east-1, and creates a CloudWatch alarm against the AWS/EC2 namespace's MemoryUtilization metric, configured to email the team via SNS whenever memory utilization stays above 90% for 1 minute. A week later the alarm has never once left the INSUFFICIENT_DATA state. What is missing, and what has to change to make the alarm work?", "expected_answer": ["Memory utilization is not a default, hypervisor-visible EC2 metric, so neither detailed monitoring nor an alarm on the AWS/EC2 namespace will ever produce data for it.", "Install and configure the CloudWatch agent on the host to collect memory utilization and publish it as a custom metric via PutMetricData.", "Give the agent CloudWatch credentials appropriate to where it runs -- an IAM role on the instance, not a static IAM user's access keys -- so it can authenticate PutMetricData calls.", "Point the alarm at the custom-namespace MemoryUtilization metric instead of AWS/EC2; only then can it leave INSUFFICIENT_DATA and trigger the SNS email action."], "reasoning": "Memory-optimized instance family, region, Auto Scaling membership, and fleet size are all irrelevant to whether memory utilization is a built-in metric: EC2 never publishes memory utilization as a built-in metric regardless of instance family, so an r5.4xlarge is in exactly the same position as any other instance type. The fix is unchanged from the canonical scenario -- a CloudWatch agent publishing a custom metric is still required, per instance.", "distractor_analysis": "A solver might assume a memory-optimized family or Auto Scaling group membership somehow unlocks built-in memory metrics or group-level aggregation of them -- it does not; the hypervisor-visibility gap for memory is identical across every instance family and fleet configuration.", "claim_ids": ["cl-2235856eee83", "cl-8c950ad90060", "cl-d1ab32cc2995", "cl-1d6bb9a52d61", "cl-055f826ffaec", "cl-b97b78a6f529", "cl-75ab3e8821db", "cl-f07f1b1c5929", "cl-f974f4009c60", "cl-4012f4a41bb7"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "Instead of an IAM role, the team proposes creating a dedicated IAM user and embedding its access key and secret key in the instance's user data so the CloudWatch agent can authenticate its PutMetricData calls.", "prompt": "An ops team enables detailed monitoring on an EC2 instance and creates a CloudWatch alarm against the AWS/EC2 namespace's MemoryUtilization metric, configured to email the team via SNS whenever memory utilization stays above 90% for 1 minute. The alarm never leaves INSUFFICIENT_DATA. A teammate proposes fixing the authentication side by creating a dedicated IAM user and hardcoding its access key and secret key into the instance's user data for the CloudWatch agent to use. Is that the right fix, and what, if anything, still needs to happen?", "expected_answer": ["Memory utilization is not a default, hypervisor-visible EC2 metric, so neither detailed monitoring nor an alarm on the AWS/EC2 namespace will ever produce data for it.", "Install and configure the CloudWatch agent on the host to collect memory utilization and publish it as a custom metric via PutMetricData.", "Give the agent CloudWatch credentials appropriate to where it runs -- an IAM role on the instance, not a static IAM user's access keys -- so it can authenticate PutMetricData calls.", "Point the alarm at the custom-namespace MemoryUtilization metric instead of AWS/EC2; only then can it leave INSUFFICIENT_DATA and trigger the SNS email action."], "reasoning": "The teammate's proposal addresses a real part of the mechanism -- the agent does need credentials to call PutMetricData -- but picks the wrong mechanism. Creating an IAM user and distributing its static long-lived keys via user data means hand-managing secrets that AWS explicitly does not recommend for instance authentication, versus attaching an IAM role, where credentials are automatically rotated and delivered via the instance metadata service. The underlying gap (no custom metric exists yet because nothing is installed and configured to publish memory as a custom metric, and the alarm still points at the wrong namespace) is completely untouched by this proposal, so the fix is identical to the canonical scenario, just with the credential step corrected from IAM user to IAM role.", "distractor_analysis": "This is the IAM-user-in-user-data distractor: it feels like progress because it does solve 'how does the agent authenticate,' and might appear sufficient on its own, but static credentials are explicitly the non-recommended approach, and even if they worked, the core missing piece -- an agent actually publishing MemoryUtilization as a custom metric, with the alarm pointed at that metric -- is still absent.", "claim_ids": ["cl-2235856eee83", "cl-8c950ad90060", "cl-d1ab32cc2995", "cl-1d6bb9a52d61", "cl-055f826ffaec", "cl-b97b78a6f529", "cl-75ab3e8821db", "cl-6c0e7c9cf67b", "cl-f07f1b1c5929", "cl-f974f4009c60"], "difficulty": "hard", "importance": "medium"}, {"variant_type": "transfer", "changed_condition": "The target host changes from an EC2 instance to a server in an on-premises data center (no AWS compute infrastructure involved at all), while the metric of interest stays MemoryUtilization and the alerting goal stays the same.", "prompt": "An ops team wants an SNS email alert whenever memory utilization on an on-premises server stays above 90% for 1 minute, and wants that alert to live in the same CloudWatch alarm system they already use for their EC2 fleet. There is no EC2 instance, no detailed-monitoring setting, and no AWS/EC2 namespace to attach anything to for this server. Can CloudWatch still do this, and how does it compare to the EC2 memory-monitoring case?", "expected_answer": ["Memory utilization is not a default, hypervisor-visible EC2 metric, so neither detailed monitoring nor an alarm on the AWS/EC2 namespace will ever produce data for it.", "Install and configure the CloudWatch agent on the host to collect memory utilization and publish it as a custom metric via PutMetricData.", "Give the agent CloudWatch credentials appropriate to where it runs -- an IAM role on the instance, not a static IAM user's access keys -- so it can authenticate PutMetricData calls.", "Point the alarm at the custom-namespace MemoryUtilization metric instead of AWS/EC2; only then can it leave INSUFFICIENT_DATA and trigger the SNS email action."], "reasoning": "The same mechanism transfers directly: the CloudWatch agent is not EC2-specific -- it can run on an on-premises server exactly as it runs on an EC2 instance, publishing the same MemoryUtilization custom metric into the same CloudWatch namespace and giving one unified monitoring and alarming view regardless of where the server physically lives. There is no AWS/EC2 namespace to begin with here, which only makes explicit what was already true for memory on EC2: the built-in per-service namespace was never going to carry this metric either way, so the agent-plus-custom-metric path is the answer in both the EC2 and on-premises cases, and the alarm and SNS action work identically once the metric exists.", "distractor_analysis": "A solver might think an on-premises server is categorically unreachable by CloudWatch and conclude the only option is a bespoke non-CloudWatch monitoring system; that overstates the limitation -- the CloudWatch agent is explicitly supported on non-EC2 hosts for custom metrics, so the same agent-publishes-custom-metric answer still applies.", "claim_ids": ["cl-da3e68cfb49b", "cl-2235856eee83", "cl-8c950ad90060", "cl-dcf0fba3cc52", "cl-f07f1b1c5929", "cl-f974f4009c60"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "Claims about which services offer detailed (1-minute) CloudWatch monitoring contradict each other, even within one source question. cl-e95e196dc67d (q224) lists Route 53 among the services that provide detailed monitoring, and cl-cbe2d675edac (q237) lists Route 53 as giving free detailed monitoring. cl-6d87e6c2ceb7, from the same q224, says Route 53 'only ever offers basic, 5-minute' monitoring and 'never detailed'. The EMR claims (cl-e95e196dc67d vs cl-f0b23db63ecd) and the SNS claims (cl-d13dab4cfb76 vs cl-697df4971aec vs cl-679682b767c3) also split by era. None of this is resolved.", "related_entity_ids": ["cl-e95e196dc67d", "cl-6d87e6c2ceb7", "cl-cbe2d675edac", "cl-f0b23db63ecd", "cl-d13dab4cfb76", "cl-697df4971aec", "cl-679682b767c3", "cl-b38a56836185"]}, {"type": "contradiction", "severity": "medium", "description": "Claims about Auto Scaling group metric granularity and cost disagree. cl-8f9722483bb1 (q080, needs-review) says group-level metrics default to 5-minute granularity and that enabling detailed monitoring makes them 1-minute at extra charge. cl-b38a56836185 (q237) says Auto Scaling provides free 1-minute metrics, and cl-e95e196dc67d / cl-4a2dd224053a say Auto Scaling supports detailed monitoring. cl-8f9722483bb1 also conflates group metrics with the instance detailed-monitoring flag.", "related_entity_ids": ["cl-8f9722483bb1", "cl-b38a56836185", "cl-e95e196dc67d", "cl-4a2dd224053a"]}, {"type": "contradiction", "severity": "medium", "description": "Claims about the default monitoring setting for a launch configuration disagree. cl-94014e3c41fc (q193) says basic monitoring would apply to an Auto Scaling group's instances only if detailed monitoring had been explicitly disabled. cl-97e717875fc1 (q250, conflicted) says basic monitoring is the default when the launch configuration is created via the console or a launch template. Contrast-set exception cs-1 repeats the CLI/SDK default from cl-dd08dfc6260c but does not mention the console/launch-template case or that the source disputes it.", "related_entity_ids": ["cl-94014e3c41fc", "cl-97e717875fc1", "cl-dd08dfc6260c", "aws-sysops-service-cloudwatch--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "Claims about graphing one metric across regions disagree. cl-d82ea34b0f15 (q017) says you must pull each region's data, aggregate it yourself and push it back, and cl-0bbb1a9d7cb5 says the console does not merge regions. cl-cce8abf028eb and cl-ac1b5040d54f (q526) say one dashboard can hold widgets from any region within a single account, and cl-05578b99fe26 says the cross-account/cross-region feature is not needed for that. cl-24e52688e038 (needs-review) says the 2019 cross-region dashboards replace manual aggregation. The q017 answer looks stale, and nothing reconciles the 'single graph' and 'single dashboard' framings.", "related_entity_ids": ["cl-d82ea34b0f15", "cl-0bbb1a9d7cb5", "cl-24e52688e038", "cl-cce8abf028eb", "cl-ac1b5040d54f", "cl-05578b99fe26"]}, {"type": "contradiction", "severity": "medium", "description": "Mental model m-1 states as an invariant that an alarm without data points 'falls to INSUFFICIENT_DATA', and cl-cce8613c6b8f says an alarm cannot remain OK or ALARM without data points. Yet m-1's own limits and cl-a2e5ecbc6606 (q140, conflicted) say the result depends on how missing data is handled, and the community is split between OK, ALARM and INSUFFICIENT_DATA. Missing-data treatment (breaching / notBreaching / ignore) can keep an alarm in OK or ALARM, so the invariant is overstated and contradicts the model's own stated limit.", "related_entity_ids": ["aws-sysops-service-cloudwatch--m-1", "cl-cce8613c6b8f", "cl-749e99be7c8e", "cl-91709d8d0c5e", "cl-a2e5ecbc6606"]}, {"type": "contradiction", "severity": "low", "description": "Claims list different fields for a statistic set. cl-516326837455 and cl-a511a894931d give Min, Max, Sum, SampleCount (the actual StatisticSet fields). cl-92a0f3172668 and cl-75bcf7a44984 add Average. m-1 cites cl-92a0f3172668 but writes the four-field version, so it silently resolves the disagreement.", "related_entity_ids": ["cl-516326837455", "cl-a511a894931d", "cl-92a0f3172668", "cl-75bcf7a44984", "aws-sysops-service-cloudwatch--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "q919's labeled correct answer is basic monitoring, but the unanimous community vote and AWS documentation favor detailed monitoring (cl-d9fac6d164be, conflicted). cs-1 cites the q919 claims cl-f1253ac04da0 and cl-e8be7e0e6b5b, which follow the community answer, and treats the 1-minute = detailed-monitoring mapping as settled without noting that the source's labeled answer disagrees.", "related_entity_ids": ["cl-d9fac6d164be", "cl-f1253ac04da0", "cl-e8be7e0e6b5b", "aws-sysops-service-cloudwatch--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "q569's boxed answer is the S3 GetRequests metric, but unanimous community consensus favors CloudFront 4XXErrorRate (cl-7f3304c20584, conflicted). cl-76efeb2692ab and cl-054b742dd7a6 are marked supported and side with the community answer, so the claim set effectively settles a source dispute instead of flagging it.", "related_entity_ids": ["cl-7f3304c20584", "cl-76efeb2692ab", "cl-054b742dd7a6"]}, {"type": "contradiction", "severity": "medium", "description": "The source disputes the right remediation for repeated CPU-credit exhaustion on T-series instances: new instance family vs. resize vs. buy credits vs. alarm. The boxed answer and the community vote differ by one letter. cl-b019e4d216f5, cl-4dbf7312cbb9, cl-e7d69a12d5cc and cl-671e607cdd2d are all conflicted. cs-1 mentions the dispute but does not resolve it.", "related_entity_ids": ["cl-b019e4d216f5", "cl-4dbf7312cbb9", "cl-e7d69a12d5cc", "cl-671e607cdd2d", "aws-sysops-service-cloudwatch--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "The source disputes which RDS metrics best detect a bottleneck on the primary. Commenters favor IOPS over read-replica lag, against the boxed answer (cl-bb7f0c6c8a95 and cl-0b56db7e0a5e, conflicted).", "related_entity_ids": ["cl-bb7f0c6c8a95", "cl-0b56db7e0a5e", "cl-2b7c7db63a43"]}, {"type": "contradiction", "severity": "low", "description": "The source disputes how to track per-project budgets: whether separate accounts make tagging unnecessary, and whether tiered alert thresholds beat a single one at the budget amount (cl-0ef04755ba70 and cl-69c5ba0eae92, conflicted).", "related_entity_ids": ["cl-0ef04755ba70", "cl-69c5ba0eae92"]}, {"type": "contradiction", "severity": "low", "description": "The source disputes whether ELB sends all of its metrics at 1-minute frequency for free, in contrast to paid EC2 detailed monitoring (cl-e452f2f837e1, conflicted).", "related_entity_ids": ["cl-e452f2f837e1"]}, {"type": "contradiction", "severity": "low", "description": "The source disputes how the CloudWatch console time controls behave. The Absolute and Relative tab claims (cl-0d2447e3c168, cl-73a164172360; q121) and the timezone selection claims for the metrics graph and custom dashboards (cl-921b94b2138a, cl-eaeb1d4fd65f; q125) are all conflicted, and the q125 claims are low-confidence.", "related_entity_ids": ["cl-0d2447e3c168", "cl-73a164172360", "cl-921b94b2138a", "cl-eaeb1d4fd65f"]}, {"type": "contradiction", "severity": "low", "description": "The source disputes the SNS-to-HTTP-endpoint home-automation scenario (cl-ace019c49d97, conflicted, low confidence).", "related_entity_ids": ["cl-ace019c49d97"]}, {"type": "contradiction", "severity": "low", "description": "Three distractor claims are marked conflicted, so the source disputes whether those options are really wrong: the AWS Config 'Memory Monitoring option' (cl-db8c48a23c0e, q525), an ALB as a fix for memory-pressure scaling (cl-57776b837f9c, q531), and a Lambda 'Repeat Time variable' (cl-866b07ab4945, q590).", "related_entity_ids": ["cl-db8c48a23c0e", "cl-57776b837f9c", "cl-866b07ab4945"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cs-1 puts 'scheduled Lambda' in the same subject as CloudWatch Logs and EventBridge and says it produces 'log events or event triggers, not metrics' and has 'no numeric metric publishing'. No claim supports this for Lambda. cl-2ff15cf9093e treats a scheduled Lambda that captures memory as a working but bespoke solution, and a Lambda can call PutMetricData. The cited claims cl-efe76b1e64f1 and cl-c900c5864519 cover only Logs and EventBridge.", "related_entity_ids": ["aws-sysops-service-cloudwatch--cs-1", "cl-2ff15cf9093e", "cl-efe76b1e64f1", "cl-c900c5864519"]}, {"type": "unsupported-generation", "severity": "low", "description": "m-1's mechanism says 'An alarm watches exactly one metric'. No claim supports this, and it ignores metric-math and composite alarms.", "related_entity_ids": ["aws-sysops-service-cloudwatch--m-1"]}, {"type": "quality", "severity": "low", "description": "cs-1's matrix lists unqualified 'disk I/O' as a default EC2 metric under detailed monitoring, and cl-5bc987e7159b and cl-c0fc6cf04dc6 also call disk I/O a default metric. cl-0e30a2d6d69e and cl-bf744509cd39 say the Disk* metrics report non-zero values only for instance-store volumes, and are always 0 on an EBS-only instance. m-1 qualifies this as 'instance-store disk I/O' but cs-1 does not.", "related_entity_ids": ["aws-sysops-service-cloudwatch--cs-1", "cl-5bc987e7159b", "cl-c0fc6cf04dc6", "cl-0e30a2d6d69e", "cl-bf744509cd39"]}, {"type": "quality", "severity": "low", "description": "Two distractor claims state the wrong option as if it were true rather than explaining why it is wrong. cl-cf94490beaf1 says 'Detaching an EBS volume is blocked while it has CloudWatch alarms configured on it', and cl-b2a3b7e4696a says lack of OS support 'is a possible cause' of logs not arriving. Read on their own, both look like assertions of the false answer.", "related_entity_ids": ["cl-cf94490beaf1", "cl-b2a3b7e4696a"]}, {"type": "ambiguity", "severity": "low", "description": "Claims about timezones and timestamps conflate two different things. cl-3a5b5821984c says CloudWatch timestamps every data point in UTC, so no time zone is needed. cl-3e1e07998da6 says an omitted 'time zone' 'defaults to the current time', which describes the timestamp, not a time zone.", "related_entity_ids": ["cl-3a5b5821984c", "cl-3e1e07998da6"]}, {"type": "ambiguity", "severity": "low", "description": "m-1's limits state that billing metrics are stored only in us-east-1 and are global, as a settled fact. The supporting claims cl-acc9e567b953 and cl-a9c69fc825e2 are needs-review.", "related_entity_ids": ["aws-sysops-service-cloudwatch--m-1", "cl-acc9e567b953", "cl-a9c69fc825e2"]}, {"type": "stale-risk", "severity": "low", "description": "Several claims rest on older AWS documentation and may be out of date. cl-e0c0459d596a gives 8KB GET / 40KB POST PutMetricData limits, and flags itself as possibly outdated. cl-cbe5d6ce4755 and cl-a1f086af1ef5 say Auto Scaling publishes exactly 8 group metrics, but newer capacity and warm-pool metrics exist. cl-eb3fe1dae427 and cl-1db6076385f9 say the console cannot disable alarm actions or set alarm state. cl-783561b8b04f says EC2 alarm actions silently fail without the user's EC2 permissions, which predates alarm actions using service-linked roles.", "related_entity_ids": ["cl-e0c0459d596a", "cl-cbe5d6ce4755", "cl-a1f086af1ef5", "cl-eb3fe1dae427", "cl-1db6076385f9", "cl-783561b8b04f"]}], "sourceQuestionCount": 115}], "sources": {"kind": "locked", "file": "aws-sysops-service-cloudwatch-tlb3.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;

      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });

  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------

    var node = fromHTML(html);
    node.querySelectorAll('.pending-attempt').forEach(function (el) {
      var error = el.querySelector('.field-error');
      el.addEventListener('change', function () { error.classList.add('hidden'); });
      el.querySelector('.submit-diagnosis').addEventListener('click', function () {
        var checked = el.querySelector('input[type="radio"]:checked');

        var attemptId = el.getAttribute('data-attempt-id');

        if (attempt) {
          attempt.diagnosis = checked.value;
          saveState();
          navigate();
        }
      });
    });
    return node;
  }

  // ---------- Explore Sources ----------
  var sourcesSearchTerm = '';
  var expandedSourceId = null;
  // Page-level: the sibling file covers every slice, so this is NOT reset in
  // activateSlice the way the two per-slice vars above are. One value, the
  // status discriminating which fields exist:
  //   {status:'idle'} | {status:'loading'}
  //   {status:'locked', envelope, notice: null | 'wrong-password' | 'forgotten-key'}
  //   {status:'unlocking', envelope, via: 'cache' | 'password'}
  //   {status:'ready', bySlice, lock: null | {envelope, expiresAt: number | null}}   lock is null on a clear page
  //   {status:'unavailable', reason: 'no-sources' | 'load-failed' | 'bad-envelope'}
  var SOURCES = { status: 'idle' };

  function questionMatches(q, term) {
    if (!term) return true;
    var choiceText = (q.choices || []).map(function (c) { return c.text; }).join(' ');
    var haystack = [q.id, q.stem, q.explanation, choiceText].join(' ').toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function citingClaims(questionId) {
    return (CURRENT.claims || []).filter(function (c) { return (c.source_question_ids || []).indexOf(questionId) !== -1; });
  }

  function issuesHtml() {
    var issues = CURRENT.issues || [];
    if (!issues.length) return safe`<p class="muted">No open issues.</p>`;

        }).join(''))}</ul>
      </details>`;
  }

  function sourceRowHtml(q) {
    var isOpen = q.id === expandedSourceId;
    var detail = '';
    if (isOpen) {
      var citing = citingClaims(q.id);
      var choiceItems = (q.choices || []).map(function (c) {
        var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
        return safe`<li class="${isCorrect ? 'correct-choice' : ''}"><span class="choice-letter">${c.letter}.</span> ${c.text}${raw(isCorrect ? ' <span class="badge tone-ok">correct</span>' : '')}</li>`;
      }).join('');
      var citedList = citing.length
        ? safe`<ul class="citations">${raw(citing.map(claimListItemHtml).join(''))}</ul>`
        : safe`<p class="muted">No claims cite this question yet.</p>`;
      var src = q.source || {};
      detail = safe`
        <tr class="detail-row">
          <td colspan="5">
            <div class="source-detail">
              <p>${q.stem}</p>
              <ul>${raw(choiceItems)}</ul>
              <h4>Explanation</h4>
              <p>${q.explanation || ''}</p>
              <p class="muted source-meta">Source: ${src.file || ''} (p. ${src.page !== undefined ? src.page : '?'}, Q${src.question_number !== undefined ? src.question_number : '?'})</p>
              <h4>Cited by <span class="tally">${citing.length}</span></h4>
              ${raw(citedList)}
            </div>
          </td>
        </tr>`;
    }
    var disputedBadge = q.disputed ? ' <span class="badge tone-warn">disputed</span>' : '';
    return safe`
      <tr class="source-row${raw(isOpen ? ' is-open' : '')}" data-id="${q.id}">
        <td class="cell-id"><button type="button" class="row-toggle" aria-expanded="${isOpen ? 'true' : 'false'}">${q.id}</button></td>
        <td class="cell-status">${q.status || ''}${raw(disputedBadge)}</td>
        <td class="cell-stem">${truncate(q.stem, 90)}</td>
        <td class="cell-answer">${(q.correct_answer || []).join(', ')}</td>
        <td class="cell-mark">${raw(markControlHtml('question:' + q.id))}</td>
      </tr>${raw(detail)}`;
  }

  // BUNDLE.sources names the one sibling this page may load. A locked page's
  // bundle has no field that could name the clear file.
  var SOURCE_GLOBAL = { clear: '__EKD_SOURCES_CLEAR__', locked: '__EKD_SOURCES_ENC__' };

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement('script');
      el.src = src;
      el.onload = function () { el.remove(); resolve(); };
      el.onerror = function () { el.remove(); reject(new Error('failed to load ' + src)); };
      document.body.appendChild(el);
    });
  }

  function urlSourcesBaseUrl() {
    try { return new URLSearchParams(location.search).get('sourcesBaseUrl'); } catch (e) { return null; }
  }

  function sourcesScriptUrl(name) {
    var base = urlSourcesBaseUrl();
    return base ? new URL(name, base).toString() : name;
  }

  function base64UrlToBytes(text) {
    var padded = text.replace(/-/g, '+').replace(/_/g, '/');
    while (padded.length % 4) padded += '=';
    var bin = atob(padded);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function bytesToBase64Url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // Envelope v2 (scripts/ekd/sources_crypto.py), checked once here so the
  // crypto calls below can trust its fields.
  function parseEnvelope(raw) {
    try {
      var ok = raw && raw.v === 2 && raw.kdf && raw.kdf.name === 'PBKDF2' && raw.kdf.hash === 'SHA-256'
        && Number.isInteger(raw.kdf.iterations) && raw.kdf.iterations > 0
        && raw.cipher && raw.cipher.name === 'AES-GCM' && typeof raw.ciphertext === 'string';
      if (!ok) return null;
      return {
        salt: raw.kdf.salt,
        saltBytes: base64UrlToBytes(raw.kdf.salt),
        iterations: raw.kdf.iterations,
        iv: base64UrlToBytes(raw.cipher.iv),
        ciphertext: base64UrlToBytes(raw.ciphertext),
      };
    } catch (e) {
      return null;
    }
  }

  // The raw AES key bits, never the password, are what a page can remember.
  function deriveKey(envelope, password) {
    var secret = new TextEncoder().encode(password.normalize('NFC'));
    return crypto.subtle.importKey('raw', secret, 'PBKDF2', false, ['deriveBits']).then(function (base) {
      return crypto.subtle.deriveBits(
        { name: 'PBKDF2', hash: 'SHA-256', salt: envelope.saltBytes, iterations: envelope.iterations }, base, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }

  function decryptSources(envelope, rawKey) {
    return crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: envelope.iv }, key, envelope.ciphertext);
    }).then(function (plainBuf) {
      var data = JSON.parse(new TextDecoder().decode(plainBuf));
      if (!data || typeof data !== 'object') throw new Error('decrypted sources are not an object');
      return data;
    });
  }

  // Remembered keys, one localStorage entry per sealing, keyed by its salt.
  // Chrome shares one localStorage across every file:// page, and each
  // reseal draws a fresh salt, so two Workspaces never share an entry and a
  // resealed file never matches a key remembered for its old sealing.
  // Entry: {"v":1, "key":"<b64url 32-byte AES key>", "expiresAt":<ms>}, 7
  // days from when the password was entered, never extended.
  var KEY_PREFIX = 'ekd:sources-key:';
  var KEY_TTL_MS = 7 * 24 * 60 * 60 * 1000;

  function parseKeyRecord(text, now) {
    try {
      var rec = JSON.parse(text);
      if (!rec || rec.v !== 1 || typeof rec.key !== 'string' || !Number.isFinite(rec.expiresAt)) return null;
      if (now >= rec.expiresAt) return null;
      var key = base64UrlToBytes(rec.key);
      return key.length === 32 ? { key: key, expiresAt: rec.expiresAt } : null;
    } catch (e) {
      return null;
    }
  }

  var KeyCache = {
    get: function (salt, now) {
      try {
        var text = localStorage.getItem(KEY_PREFIX + salt);
        if (text === null) return null;
        var rec = parseKeyRecord(text, now);
        if (!rec) localStorage.removeItem(KEY_PREFIX + salt);
        return rec;
      } catch (e) {
        return null;
      }
    },
    // The expiry, or null when storage refuses the write (the page still unlocks).
    put: function (salt, rawKey, now) {
      var expiresAt = now + KEY_TTL_MS;
      try {
        localStorage.setItem(KEY_PREFIX + salt, JSON.stringify({ v: 1, key: bytesToBase64Url(rawKey), expiresAt: expiresAt }));
        return expiresAt;
      } catch (e) {
        return null;
      }
    },
    forget: function (salt) {
      try { localStorage.removeItem(KEY_PREFIX + salt); } catch (e) {}
    },
    // Removes expired or malformed entries, including those of sealings no
    // page will ask for again because their file was resealed.
    sweep: function (now) {
      try {
        var stale = [];
        for (var i = 0; i < localStorage.length; i++) {
          var name = localStorage.key(i);
          if (name && name.indexOf(KEY_PREFIX) === 0 && !parseKeyRecord(localStorage.getItem(name), now)) stale.push(name);
        }
        stale.forEach(function (name) { localStorage.removeItem(name); });
      } catch (e) {}
    },
  };

  // Pure. A (state, event) pair not listed leaves the state unchanged, which
  // is also what drops a late async result that no longer applies.
  function transition(s, e) {
    switch (s.status + ' ' + e.type) {
      case 'idle open':
        return BUNDLE.sources ? { status: 'loading' } : { status: 'unavailable', reason: 'no-sources' };
      case 'loading loaded-clear':
        return { status: 'ready', bySlice: e.bySlice, lock: null };
      case 'loading loaded-envelope':
        return e.cached
          ? { status: 'unlocking', envelope: e.envelope, via: 'cache' }
          : { status: 'locked', envelope: e.envelope, notice: null };
      case 'loading load-failed':
        return { status: 'unavailable', reason: e.reason };
      case 'locked submit':
        return { status: 'unlocking', envelope: s.envelope, via: 'password' };
      case 'unlocking decrypted':
        return { status: 'ready', bySlice: e.bySlice, lock: { envelope: s.envelope, expiresAt: e.expiresAt } };
      case 'unlocking decrypt-failed':
        return { status: 'locked', envelope: s.envelope, notice: s.via === 'cache' ? 'forgotten-key' : 'wrong-password' };
      case 'ready lock':
        return s.lock ? { status: 'locked', envelope: s.lock.envelope, notice: null } : s;
      default:
        return s;
    }
  }

  function dispatch(e) {
    var next = transition(SOURCES, e);
    if (next === SOURCES) return;
    SOURCES = next;
    startEffect(next, e);
    var body = document.getElementById('sources-body');
    if (body) paintSources(body);
  }

  function startEffect(s, e) {
    if (s.status === 'loading') {
      var kind = BUNDLE.sources.kind;
      var globalName = SOURCE_GLOBAL[kind];
      window[globalName] = undefined;
      loadScript(sourcesScriptUrl(BUNDLE.sources.file)).then(function () {
        var loaded = window[globalName];
        window[globalName] = undefined;
        if (kind === 'clear') {
          if (loaded && typeof loaded === 'object') dispatch({ type: 'loaded-clear', bySlice: loaded });
          else dispatch({ type: 'load-failed', reason: 'load-failed' });
          return;
        }
        var envelope = parseEnvelope(loaded);
        if (!envelope) { dispatch({ type: 'load-failed', reason: 'bad-envelope' }); return; }
        dispatch({ type: 'loaded-envelope', envelope: envelope, cached: KeyCache.get(envelope.salt, Date.now()) });
      }, function () {
        dispatch({ type: 'load-failed', reason: 'load-failed' });
      });
      return;
    }
    if (s.status === 'unlocking') {
      var envelope = s.envelope;
      var fromCache = s.via === 'cache';
      var keyReady = fromCache ? Promise.resolve(e.cached.key) : deriveKey(envelope, e.password);
      keyReady.then(function (rawKey) {
        return decryptSources(envelope, rawKey).then(function (bySlice) { return { rawKey: rawKey, bySlice: bySlice }; });
      }).then(function (opened) {
        var expiresAt = fromCache ? e.cached.expiresAt : KeyCache.put(envelope.salt, opened.rawKey, Date.now());
        dispatch({ type: 'decrypted', bySlice: opened.bySlice, expiresAt: expiresAt });
      }, function () {
        if (fromCache) KeyCache.forget(envelope.salt);
        dispatch({ type: 'decrypt-failed' });
      });
    }
  }

  var UNAVAILABLE_TEXT = {
    'no-sources': 'No source data is bundled with this Workspace.',
    'load-failed': 'The sources file could not be loaded.',
    'bad-envelope': 'The encrypted sources file is not in a format this page can read.',
  };
  var LOCKED_NOTICE_TEXT = {
    'wrong-password': 'Incorrect password',
    'forgotten-key': 'The key remembered on this browser no longer opens this file. Enter the current password.',
  };

  function renderSources() {
    var html = safe`
      <section class="sources">
        <h2>Explore Sources</h2>
        ${raw(issuesHtml())}
        <div id="sources-body"></div>
      </section>`;
    var fragment = fromHTML(html);
    if (SOURCES.status === 'idle') dispatch({ type: 'open' });
    paintSources(fragment.querySelector('#sources-body'));
    return fragment;
  }

  function passwordFormHtml(notice, busy) {
    var noticeBlock = notice ? safe`<p><span class="badge severity-high">${LOCKED_NOTICE_TEXT[notice]}</span></p>` : '';
    return safe`
      ${raw(noticeBlock)}
      <p class="muted">These source questions are encrypted. Enter this Workspace's password to unlock them.</p>
      <label class="field-label" for="sources-password">Password</label>
      <input type="password" id="sources-password" autocomplete="off" spellcheck="false"${raw(busy ? ' disabled' : '')}>
      <p><button type="button" id="sources-unlock"${raw(busy ? ' disabled' : '')}>${busy ? 'Unlocking…' : 'Unlock sources'}</button></p>`;
  }

  function paintSources(body) {
    var s = SOURCES;
    if (s.status === 'idle' || s.status === 'loading') {
      body.innerHTML = '<p class="muted">Loading sources&hellip;</p>';
    } else if (s.status === 'unavailable') {
      body.innerHTML = safe`<p class="empty">${UNAVAILABLE_TEXT[s.reason]}</p>`;
    } else if (s.status === 'unlocking') {
      body.innerHTML = s.via === 'cache' ? '<p class="muted">Unlocking sources&hellip;</p>' : passwordFormHtml(null, true);
    } else if (s.status === 'locked') {
      body.innerHTML = passwordFormHtml(s.notice, false);
      var input = body.querySelector('#sources-password');
      var submit = function () {
        if (input.value) dispatch({ type: 'submit', password: input.value });
      };
      body.querySelector('#sources-unlock').addEventListener('click', submit);
      input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });
      if (s.notice === 'wrong-password') input.focus();
    } else if (s.status === 'ready') {
      renderSourcesTable(body);
      if (s.lock) {
        body.insertAdjacentHTML('afterbegin', lockBarHtml(s.lock));
        body.querySelector('#sources-lock').addEventListener('click', function () {
          KeyCache.forget(s.lock.envelope.salt);
          dispatch({ type: 'lock' });
        });
      }
    }
  }

  function lockBarHtml(lock) {
    var remembered = lock.expiresAt === null
      ? 'Not remembered (storage unavailable)'
      : 'Remembered on this browser until '
        + new Date(lock.expiresAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    return safe`<p class="sources-lock"><span class="muted" id="sources-remembered">${remembered}</span><button type="button" class="secondary" id="sources-lock">Lock</button></p>`;
  }

  function renderSourcesTable(body) {
    var questions = SOURCES.bySlice[CURRENT.contentSet.id] || [];
    body.innerHTML = safe`
      <div class="search-field">
        <label class="field-label" for="sources-search">Search questions</label>
        <input type="search" id="sources-search" placeholder="Stem, choices, or explanation">
        <p class="muted" id="sources-count" aria-live="polite"></p>
      </div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Source questions">
        <table class="sources-table">
          <thead><tr><th scope="col">ID</th><th scope="col">Status</th><th scope="col">Stem</th><th scope="col">Correct</th><th scope="col">Mark</th></tr></thead>
          <tbody id="sources-tbody"></tbody>
        </table>
      </div>`;
    var input = body.querySelector('#sources-search');
    input.value = sourcesSearchTerm;

    function renderRows() {
      var filtered = questions.filter(function (q) { return questionMatches(q, sourcesSearchTerm); });
      body.querySelector('#sources-count').textContent = filtered.length + ' / ' + questions.length + ' questions';
      var tbody = body.querySelector('#sources-tbody');
      tbody.innerHTML = filtered.length
        ? filtered.map(sourceRowHtml).join('')
        : safe`<tr><td colspan="5" class="empty-cell">No questions match "${sourcesSearchTerm}".</td></tr>`;
      tbody.querySelectorAll('.source-row').forEach(function (row) {
        row.addEventListener('click', function (event) {
          if (event.target.closest('.mark-control')) return;
          var id = row.getAttribute('data-id');
          expandedSourceId = expandedSourceId === id ? null : id;
          renderRows();
          var toggle = tbody.querySelector('.source-row[data-id="' + CSS.escape(id) + '"] .row-toggle');
          if (toggle) toggle.focus({ preventScroll: true });
        });
      });
    }

    input.addEventListener('input', function () {
      sourcesSearchTerm = input.value;
      renderRows();
    });
    renderRows();
  }

  // ---------- slice selection ----------
  var DEFAULT_SLICE_ID = null;

  function populateSliceSelect(manifest) {
    DEFAULT_SLICE_ID = manifest.length ? manifest[0].id : null;
    var select = document.getElementById('slice-select');
    select.innerHTML = manifest.map(function (s) {
      return safe`<option value="${s.id}">${s.facet.key}: ${s.facet.value} (${s.questionCount} q)</option>`;
    }).join('');
    document.getElementById('slice-controls').classList.toggle('hidden', manifest.length <= 1);
    select.addEventListener('change', function () {
      location.hash = '#' + encodeURIComponent(select.value) + '/' + parseHash().mode;
    });
  }

  function activateSlice(sliceId) {
    return loadSlice(sliceId).then(function (slice) {
      CURRENT = slice;
      STORAGE_KEY = 'ekd:' + slice.contentSet.id + ':' + slice.contentSet.schemaVersion;
      STATE = loadState();
      practiceIndex = 0;
      sourcesSearchTerm = '';
      expandedSourceId = null;
      var cs = CURRENT.contentSet;
      document.getElementById('app-title').innerHTML = safe`<span class="title-exam">${cs.exam}</span><span class="title-sep" aria-hidden="true">/</span><span class="title-facet"><span class="visually-hidden">${cs.facet.key}: </span>${cs.facet.value}</span>`;
      document.title = cs.facet.value + ' · ' + cs.exam;
      var select = document.getElementById('slice-select');
      if (select.value !== slice.contentSet.id) select.value = slice.contentSet.id;
      renderStorageWarning();
    });
  }

  // ---------- routing: "#<sliceId>/<mode>", falling back to the active (or
  // first) slice when the hash omits one -- e.g. on first load. ----------
  var ROUTES = { learn: renderLearn, compare: renderCompare, practice: renderPractice, diagnose: renderDiagnose, sources: renderSources };
  var DEFAULT_MODE = 'learn';

  function sliceHref(mode) {
    return '#' + encodeURIComponent(CURRENT.contentSet.id) + '/' + mode;
  }

  function parseHash() {
    var rawHash = (location.hash || '').slice(1);
    var slashIndex = rawHash.indexOf('/');
    var fallbackSliceId = CURRENT ? CURRENT.contentSet.id : DEFAULT_SLICE_ID;
    if (slashIndex === -1) {
      return { sliceId: fallbackSliceId, mode: ROUTES.hasOwnProperty(rawHash) ? rawHash : DEFAULT_MODE };
    }
    var sliceId = decodeURIComponent(rawHash.slice(0, slashIndex)) || fallbackSliceId;
    var mode = rawHash.slice(slashIndex + 1);
    return { sliceId: sliceId, mode: ROUTES.hasOwnProperty(mode) ? mode : DEFAULT_MODE };
  }

  function navigate() {
    var target = parseHash();
    var proceed = (!CURRENT || CURRENT.contentSet.id !== target.sliceId)
      ? activateSlice(target.sliceId)
      : Promise.resolve();
    return proceed.then(function () {
      document.querySelectorAll('#nav a').forEach(function (a) {
        var mode = a.getAttribute('data-route');
        a.setAttribute('href', sliceHref(mode));
        a.classList.toggle('active', mode === target.mode);
        if (mode === target.mode) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(ROUTES[target.mode]());
    });
  }

  // ---------- init ----------
  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('export-revision-btn').addEventListener('click', exportRevisionNotes);
  document.getElementById('import-input').addEventListener('change', importProgress);
  document.getElementById('app').addEventListener('click', handleMarkClick);
  window.addEventListener('hashchange', navigate);
  KeyCache.sweep(Date.now());
  getManifest().then(function (manifest) {
    populateSliceSelect(manifest);
    return navigate();
  });
})();
</script>
</body>
</html>
