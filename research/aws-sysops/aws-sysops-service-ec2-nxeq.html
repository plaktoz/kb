urce_question_ids": ["awssysops-p3-1-q869"], "statement": "An IAM instance profile is attached to an already-running EC2 instance so that instance can call other AWS APIs; it is unrelated to the permissions needed by the caller invoking ec2:RunInstances to launch the instance in the first place.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-18510ed3f3c8", "source_question_ids": ["awssysops-p3-1-q869"], "statement": "An EC2 key pair is only needed to log into an instance after it launches, not for the launch operation itself to succeed.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-098b70bc6fe7", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "A network ACL is stateless and is evaluated independently in each traffic direction, so a misconfigured network ACL rule on a subnet can block traffic like RDP even when the security group is correctly configured.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-976f9b740606", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "A route table missing a route to the internet gateway for a subnet prevents internet-bound reply traffic from leaving that subnet, which can block connections like RDP over the internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-251aa21452cb", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "Every EC2 instance in an IPv4 or dual-stack subnet is automatically assigned a primary private IPv4 address at launch, so a missing private IP is not a realistic cause of an RDP failure; only instances in IPv6-only subnets have none.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d90a889728ab", "source_question_ids": ["awssysops-p3-1-q880"], "statement": "Port 22 is used by SSH, not RDP, so a missing inbound rule on port 22 is irrelevant to diagnosing a failed RDP connection to a Windows bastion.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb4e193748c3", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "An EC2 instance's Availability Zone is fixed for the instance's lifetime and cannot be changed, even while the instance is stopped.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-db2f07a45a5d", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "To relocate an EC2 workload to a different Availability Zone, create an Amazon Machine Image (AMI) from the instance, launch a new instance from that AMI in the target Availability Zone, and terminate the original instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-089cbaf7eaed", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "There is no 'copy an instance' operation in EC2; only AMIs and snapshots can be copied.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f2c47d465995", "source_question_ids": ["awssysops-p3-1-q896"], "statement": "There is no AWS CLI command that relocates a running EC2 instance's Availability Zone directly.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-329557271989", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "A cluster placement group packs instances physically close together within a single Availability Zone specifically to minimize inter-instance network latency.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cf4c058d03bb", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "Enhanced networking provides higher packet-per-second performance and lower network jitter/latency at the instance level.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-80cf23c5ba1d", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "Launching instances in different VPCs connected by a VPN tunnel or VPC peering adds network hops between them, working against a lowest-possible-latency goal.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9cf762a8eccc", "source_question_ids": ["awssysops-p3-1-q898"], "statement": "A spread placement group deliberately places instances on distinct underlying hardware to reduce simultaneous failure risk, the opposite of the physical proximity needed for minimizing latency.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3c220afd2a93", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "SSH operates over TCP port 22, so a missing inbound security group rule for port 22 is a common and direct cause of a failed SSH connection to a Linux instance.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-88d73eb16e2d", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 443 (HTTPS) has no bearing on SSH connectivity.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ee10805b491b", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 80 (HTTP) is unrelated to SSH connectivity.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-93f4305c1f0a", "source_question_ids": ["awssysops-p3-1-q920"], "statement": "Port 3389 is the Windows remote-desktop (RDP) port and is not applicable to a Linux instance being accessed via SSH.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-ec2--m-1", "title": "EC2 lifecycle transitions: what each one keeps, moves, or destroys", "purpose": "Predict what happens to an instance's host, storage, IP addresses, AZ, and bill when it is rebooted, stopped and started, or terminated. Many EC2 troubleshooting, durability, and billing questions come down to this one model.", "mechanism": "An EC2 instance is a lease on one physical host, with two kinds of attached block storage: instance store, which lives on that host's own disks, and EBS, which is network-attached and lives independently of the host. The three lifecycle operations differ in how much of that lease they give up. A reboot is an OS restart that never leaves the Running state. The instance stays on the same host, so instance-store data, EBS volumes, private IP, public IP, and Elastic IP all survive, and no new billing period starts. That also means a reboot cannot fix a host-level fault. A stop/start releases the host and re-acquires one later, usually a different one. Anything tied to the old host is lost: instance-store data and an auto-assigned public IPv4 address. Anything tied to the VPC or to EBS is kept: the EBS volumes, the private IP, the Elastic IP, and the AZ. Because the instance moves to healthy hardware, a stop/start is the standard fix for an impaired system status check or a scheduled host retirement. Re-entering Running starts a new billing period (60-second minimum under per-second billing). It can also fail with InsufficientInstanceCapacity, because a host has to be found again in the same AZ. Instance-store-backed instances cannot be stopped at all, since they have no persistent root to come back to. Terminate releases everything permanently. The instance cannot be restarted. Instance store is gone, and EBS volumes with DeleteOnTermination=true are deleted (the root volume has this set by default). Elastic IPs and separately-attached ENIs are released from the instance but not destroyed. Changing an instance's AZ, Region, or tenancy is not a lifecycle transition: those are fixed at launch and need a new instance launched from an AMI.", "predict_prompt": "An EBS-backed instance with an Elastic IP, an auto-assigned public IP, and an extra instance-store volume fails its system status check. You stop and start it. Before reading on, predict which of these survive: host, instance-store data, EBS data, private IP, auto-assigned public IP, Elastic IP, AZ. Will the bill restart?", "invariants": ["A reboot never leaves the Running state or the current host. Instance-store data, all IPs, and billing continuity are preserved.", "Instance-store data survives only a reboot. Stop, hibernate, terminate, and disk failure all destroy it, whatever the root volume type.", "EBS volumes and the private IP survive a stop/start. In a VPC, the Elastic IP stays associated through stop/start.", "Only an action that releases the host (stop/start) can move an instance off failing hardware.", "AZ, Region, and tenancy are fixed at launch. Moving any of them means creating an AMI and launching a new instance."], "limits": ["Instances launched from an instance-store-backed AMI cannot be stopped, only rebooted or terminated. For them the stop/start fix does not exist.", "Older questions written for EC2-Classic assume that a stop/start drops the Elastic IP and changes the private IP. Today's VPC behavior keeps both.", "The billing details vary. SLES and On-Demand Dedicated Instances still bill by the hour, and pre-2017 questions assume a full hour for every start."], "cues": ["'System status check impaired' or 'scheduled retirement' on an EBS-backed instance: stop/start, not reboot.", "'Data must persist' combined with instance store: the data is lost on stop or terminate.", "'Restart several times in an hour, how many billing periods?': reboots add none, and each stop/start adds one.", "'Move instance to another AZ, Region, or dedicated tenancy': create an AMI, then launch a new instance from it."], "claim_ids": ["cl-15262084d4bb", "cl-2cce1c0f81c2", "cl-42e08f5754a4", "cl-a639966b7056", "cl-70c53fe7cd89", "cl-5ef84568856a", "cl-d0a70964a54b", "cl-feb4e5db72dd", "cl-428311650158", "cl-c1ce14f4584f", "cl-e0120dd2e5c9", "cl-1e8056681969", "cl-243ce7da701e", "cl-d74f92425118", "cl-189d2329cfe3", "cl-98b08026f4e7", "cl-b5976affb6d1", "cl-07f653f62e9e", "cl-1b532f23648f", "cl-76604b7f37b0", "cl-0952f10c9935", "cl-0931c60a9379", "cl-390fc04406eb", "cl-c243306cee99", "cl-1aaca88c29bb", "cl-61243774fd8b", "cl-0396b1143ba5", "cl-331058959ce8", "cl-cfaf2be26905", "cl-57201b8b797b", "cl-90f02929ff95", "cl-c392fcfe9ace", "cl-e54ce4b5f6d1", "cl-bb4e193748c3", "cl-4a1c2875f7c8", "cl-db2f07a45a5d", "cl-8fabd468b5d0", "cl-154d1ff0eef4"]}, "contrastSet": {"id": "aws-sysops-service-ec2--cs-1", "subjects": ["Reboot", "Stop/Start (EBS-backed)", "Terminate"], "dimensions": ["Underlying host", "Instance-store data", "EBS volumes", "IP addresses", "Billing", "Fixes host-level fault (impaired system check / retirement)"], "shared_traits": ["None of them changes the instance's AZ, Region, or tenancy. Those are fixed at launch.", "Elastic IP allocations stay in the account in every case. Terminate disassociates the EIP but does not release it."], "matrix": {"Underlying host": {"Reboot": "Same host", "Stop/Start (EBS-backed)": "Usually a new, healthy host", "Terminate": "Host released permanently"}, "Instance-store data": {"Reboot": "Preserved", "Stop/Start (EBS-backed)": "Lost", "Terminate": "Lost"}, "EBS volumes": {"Reboot": "Untouched", "Stop/Start (EBS-backed)": "Preserved", "Terminate": "Deleted if DeleteOnTermination=true (root default)"}, "IP addresses": {"Reboot": "Private, public, and EIP all kept", "Stop/Start (EBS-backed)": "Private IP and EIP kept (VPC); auto-assigned public IPv4 changes", "Terminate": "All released; EIP disassociated but stays allocated"}, "Billing": {"Reboot": "No new billing period", "Stop/Start (EBS-backed)": "New period on each start (60 s minimum)", "Terminate": "Instance charges end (EIP/EBS may still bill)"}, "Fixes host-level fault (impaired system check / retirement)": {"Reboot": "No, same impaired host", "Stop/Start (EBS-backed)": "Yes, the standard fix", "Terminate": "Too drastic; risks data loss"}}, "decision_rule": "Ask whether the operation releases the physical host. Reboot keeps the host, so host-local state (instance store, billing continuity) survives but host faults persist. Stop/start releases the host, so host faults are fixed but host-local state is lost and a new billing period starts.", "boundary_flip": "An EBS-backed instance shows an impaired system status check, and the answer is stop/start. Change one condition: the instance was launched from an instance-store-backed AMI. It can no longer be stopped, so stop/start is unavailable. The choice flips to keeping a reboot-only workflow, or to re-creating the instance from an AMI and accepting the data loss. Separately, if the symptom were an unreachable instance status check (a guest-OS problem) rather than an impaired system check, a reboot becomes a valid first step.", "strongest_distractor_failure": "Reboot is the tempting answer to a failed system status check because it feels like the lighter version of 'restart'. But a reboot keeps the instance on the same impaired host, so the hardware fault remains. Only a stop/start re-places the instance on healthy hardware.", "exceptions": ["Instance-store-backed instances cannot be stopped, and setting InstanceInitiatedShutdownBehavior=Stop is disallowed for them.", "EC2-Classic (retired in 2023) dropped the Elastic IP and changed the private IP on stop/start. Older exam answers may assume that behavior.", "A stop/start can fail with InsufficientInstanceCapacity if the AZ no longer has capacity for that instance type.", "An EBS-backed root does not protect instance-store data, which is still lost on stop."], "claim_ids": ["cl-15262084d4bb", "cl-1e8056681969", "cl-243ce7da701e", "cl-428311650158", "cl-c1ce14f4584f", "cl-e0120dd2e5c9", "cl-d426353870ae", "cl-d74f92425118", "cl-70c53fe7cd89", "cl-5ef84568856a", "cl-04fadda31c2a", "cl-76604b7f37b0", "cl-a639966b7056", "cl-c243306cee99", "cl-5387764317c1", "cl-2cce1c0f81c2", "cl-42e08f5754a4", "cl-189d2329cfe3", "cl-98b08026f4e7", "cl-b5976affb6d1", "cl-61243774fd8b", "cl-0396b1143ba5", "cl-6444791008fc", "cl-cfaf2be26905", "cl-90f02929ff95", "cl-390fc04406eb", "cl-e54ce4b5f6d1", "cl-c392fcfe9ace", "cl-bb4e193748c3"]}, "scenarioFamily": {"id": "aws-sysops-service-ec2--sf-1", "canonical": {"prompt": "An EBS-backed EC2 instance behind an ELB starts failing its system status check, reported as 'impaired' in the console. Its instance status check (which reflects guest-OS/network reachability) is passing fine. As the SysOps engineer on call, what should you do to resolve the impaired system status check, and why does it work?", "expected_answer": ["Stop the instance and then start it again. This releases the current (faulty) underlying host and AWS relaunches the instance on a different, healthy physical host, which clears the host-level hardware problem that the system status check is reporting."], "reasoning": "An 'impaired' system status check points to an underlying hardware/host problem, distinct from the 'unreachable' instance status check that reflects the guest OS or network path -- so the fix must change which host the instance runs on, not touch the guest OS. A stop/start of an EBS-backed instance (unlike a simple reboot) relaunches it on different underlying hardware, which is exactly the action documented for resolving system-check failures and scheduled host maintenance/retirement caused by the current host.", "distractor_analysis": "Rebooting feels like the lighter, lower-risk 'restart' option, but a reboot keeps the instance on the exact same host throughout -- it never leaves the Running state -- so the underlying hardware fault survives the reboot untouched.", "claim_ids": ["cl-d74f92425118", "cl-c1ce14f4584f", "cl-243ce7da701e", "cl-e0120dd2e5c9", "cl-1e8056681969", "cl-428311650158"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The instance was launched from an instance-store-backed (S3-based) AMI instead of an EBS-backed one, so it has no persistent EBS root volume to come back to.", "prompt": "Same symptom -- the system status check reports 'impaired' while the instance status check is fine -- but this instance was launched from an instance-store-backed (S3-based) AMI. What should the SysOps engineer do now?", "expected_answer": ["Stop/start is not an option for this instance (instance-store-backed instances cannot be stopped). The engineer must terminate the instance and launch a brand-new instance from the AMI on a fresh host, accepting that any data held only on the ephemeral instance-store root volume is permanently lost."], "reasoning": "Because the root volume is ephemeral instance store rather than EBS, there is no persistent root to preserve across a stop, so AWS disallows stopping this instance at all -- only reboot or terminate are available. Reboot keeps the same impaired host, so it cannot fix a host-level fault, which leaves terminate-and-relaunch as the only path to a new host; that relaunch also means the ephemeral root volume's data cannot be recovered.", "distractor_analysis": "It's tempting to assume the same stop/start fix from the canonical scenario still applies, but the AMI type changes which lifecycle operations exist for this instance -- stop/start is simply not offered for an instance-store-backed instance, which is why the expected action changes here.", "claim_ids": ["cl-e54ce4b5f6d1", "cl-0952f10c9935", "cl-07f653f62e9e", "cl-390fc04406eb", "cl-d74f92425118"], "difficulty": "hard", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The instance additionally has an Elastic IP address associated and several cost-allocation tags (e.g. a Finance cost-center tag) applied to it.", "prompt": "Same impaired system status check as the canonical scenario. This particular instance also has an Elastic IP address associated with it and is tagged with a Finance cost-center tag for billing reports. Does either of those details change what the engineer should do to resolve the impaired check?", "expected_answer": ["No. The engineer should still stop the instance and start it again so it relaunches on a different, healthy host; the Elastic IP and the cost-allocation tags don't change that remediation."], "reasoning": "The Elastic IP stays associated with the instance through a stop/start cycle in a VPC, so the engineer doesn't need to re-associate it afterward, and resource tags are just metadata used for cost reporting -- neither has any bearing on diagnosing or fixing a host-level 'impaired' system status check, so the stop/start remediation from the canonical scenario is unchanged.", "claim_ids": ["cl-189d2329cfe3", "cl-c1ce14f4584f", "cl-d74f92425118"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate pushes back, arguing the instance should just be rebooted instead, since a reboot is faster and carries less perceived risk than a stop/start.", "prompt": "Same impaired system status check as the canonical scenario. A teammate on the call argues: 'Let's just reboot it -- it's quicker and feels safer than stopping it.' Should the engineer follow that advice? Why or why not?", "expected_answer": ["No. The engineer should still stop the instance and start it again to move it to a different, healthy host; a reboot would not resolve the problem."], "reasoning": "The teammate's suggestion is a strong distractor because reboot really is lower-risk for most problems, but it does not address this specific symptom: a reboot never leaves the Running state and keeps the instance on the exact same host, so the underlying hardware fault behind an 'impaired' system status check is left untouched. Only an operation that releases the host -- stop/start -- can move the instance onto healthy hardware.", "distractor_analysis": "Rebooting is the single most tempting wrong answer here precisely because it is the normal 'try the lighter fix first' instinct, and it is correct for guest-OS-level problems (an 'unreachable' instance status check) -- but a system status check failure is a host-level hardware problem that a same-host restart cannot touch.", "claim_ids": ["cl-243ce7da701e", "cl-1e8056681969", "cl-d74f92425118", "cl-c1ce14f4584f"], "difficulty": "medium", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "Instead of a failed system status check, AWS Personal Health Dashboard sends a scheduled-retirement notice for the instance's underlying host, warning that the host will be retired on a future date.", "prompt": "The same EBS-backed instance has not failed any status check, but AWS Personal Health Dashboard has sent a scheduled-retirement notice saying its underlying host will be retired in two weeks. What should the engineer do before that date, and why does the same fix apply here?", "expected_answer": ["Stop the instance and then start it again before the retirement date. This relaunches the instance on a different, healthy host, proactively moving it off the host that's scheduled for retirement -- the same underlying action used to resolve an impaired system status check."], "reasoning": "Scheduled host retirement and a failed system status check are two different triggers for the same underlying host-level condition: something is wrong with (or planned to go away from) the current physical host. The same remedy applies in both cases -- stop/start releases the current host and re-acquires a new one -- because a reboot, which keeps the instance on its existing host, would not move it off a host that's going away.", "claim_ids": ["cl-e0120dd2e5c9", "cl-428311650158", "cl-1e8056681969"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "The boundary_flip says that when an instance launched from an instance-store-backed AMI has an impaired system status check, 'the choice flips to keeping a reboot-only workflow'. The same synthesis says a reboot keeps the instance on the same impaired host and cannot fix a host-level fault (invariant 4, strongest_distractor_failure, and the 'Fixes host-level fault' row). So the flipped answer leaves the fault in place. No claim backs any remediation for this case. The flip also suggests 're-creating the instance from an AMI', but bundling an instance-store AMI from an instance on failing hardware (cl-7c7660b461ad) is not supported by any claim either.", "related_entity_ids": ["aws-sysops-service-ec2--cs-1", "aws-sysops-service-ec2--m-1", "cl-243ce7da701e", "cl-1e8056681969", "cl-5ef84568856a", "cl-e54ce4b5f6d1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model's invariant ('AZ, Region, and tenancy are fixed at launch. Moving any of them means creating an AMI and launching a new instance') and its cue ('Move instance to another AZ, Region, or dedicated tenancy: create an AMI, then launch a new instance from it') leave out a required step for a Region move. AMIs are Region-scoped, so the AMI has to be copied to the target Region before an instance can be launched there (cl-64b99dc6dbe9, cl-57facaa305c7, cl-bdfd0e7a36b4). None of those claims is in the synthesis claim_ids, and the generated recipe is wrong for the Region case.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "cl-64b99dc6dbe9", "cl-57facaa305c7", "cl-bdfd0e7a36b4", "cl-db2f07a45a5d"]}, {"type": "unsupported-generation", "severity": "low", "description": "The mental model and the contrast set's shared_traits both say tenancy is 'fixed at launch'. The only supporting claim (cl-8fabd468b5d0) covers just default vs. dedicated. EC2 does let a stopped instance's tenancy switch between dedicated and host, so the blanket statement over-generalizes the source.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1", "cl-8fabd468b5d0", "cl-154d1ff0eef4"]}, {"type": "unsupported-generation", "severity": "low", "description": "The boundary_flip says a reboot 'becomes a valid first step' for a failed instance status check (unreachable, a guest-OS problem). No claim in the slice supports that remediation. cl-d74f92425118 only separates the two check types.", "related_entity_ids": ["aws-sysops-service-ec2--cs-1", "cl-d74f92425118"]}, {"type": "ambiguity", "severity": "low", "description": "The predict_prompt describes one EBS-backed instance with both 'an Elastic IP, an auto-assigned public IP'. Associating an Elastic IP with the primary private address releases the auto-assigned public IPv4 address, so the setup only makes sense if the EIP is on a secondary address or ENI, and the prompt doesn't say so. The learner can't tell which public address the question expects to change on stop/start.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "cl-98b08026f4e7", "cl-189d2329cfe3"]}, {"type": "ambiguity", "severity": "low", "description": "The contrast-set matrix cell IP addresses / Terminate reads 'All released; EIP disassociated but stays allocated', and shared_traits says terminate 'does not release' the EIP. 'Released' is AWS's term for giving an Elastic IP back, so the cell contradicts itself in AWS vocabulary.", "related_entity_ids": ["aws-sysops-service-ec2--cs-1", "cl-61243774fd8b"]}, {"type": "contradiction", "severity": "medium", "description": "The synthesis states 'instance-store data survives only a reboot' as an invariant and cites cl-04fadda31c2a. That claim, with its siblings cl-75338cc34534 and cl-28a131d35a45 from awssysops-p2-q389, is marked conflicted, while the same fact from awssysops-p1-q242 (cl-70c53fe7cd89, cl-5ef84568856a) is marked supported. The source questions disagree on this point, and the synthesis presents it as settled without surfacing the dispute.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1", "cl-04fadda31c2a", "cl-75338cc34534", "cl-28a131d35a45", "cl-70c53fe7cd89"]}, {"type": "contradiction", "severity": "medium", "description": "Claims that an instance's AZ cannot be changed are marked conflicted when they come from awssysops-p1-q136 and awssysops-p1-q181 (cl-4a1c2875f7c8, cl-25d5389e1358, cl-d66a7d7fbbf5). The same content from awssysops-p3-1-q896 (cl-bb4e193748c3, cl-db2f07a45a5d) is marked supported. The source questions disagree, and the mental model cites cl-4a1c2875f7c8 as backing for a stated invariant without noting the conflict.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "cl-4a1c2875f7c8", "cl-25d5389e1358", "cl-d66a7d7fbbf5", "cl-bb4e193748c3"]}, {"type": "stale-risk", "severity": "medium", "description": "The billing material in the synthesis depends on conflicted, time-sensitive claims. These are the '60 s minimum on each start' cells and the limit saying 'SLES and On-Demand Dedicated Instances still bill by the hour'. The limit's backing claims (cl-ecd813ac97dd, cl-bd6ba3a60970, cl-b5e38056f2ef) are all conflicted and none is in the synthesis claim_ids. They also disagree with the older source answers (awssysops-p2-q351, awssysops-p2-q383) about which OS or tenancy bills hourly. cl-90f02929ff95, which the synthesis does cite, is conflicted too.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1", "cl-90f02929ff95", "cl-ecd813ac97dd", "cl-bd6ba3a60970", "cl-b5e38056f2ef", "cl-b70dd5d4feb0"]}, {"type": "stale-risk", "severity": "low", "description": "The synthesis cites EC2-Classic-era claims (cl-98b08026f4e7, cl-b5976affb6d1) from awssysops-p1-q168 that are marked conflicted. The source answer assumes EC2-Classic behavior: a stop/start drops the EIP and changes the private IP. The modern statement assumes VPC behavior. The mental model's limits section notes this, but the cited claims are still unresolved conflicts.", "related_entity_ids": ["aws-sysops-service-ec2--m-1", "aws-sysops-service-ec2--cs-1", "cl-98b08026f4e7", "cl-b5976affb6d1", "cl-189d2329cfe3"]}, {"type": "contradiction", "severity": "medium", "description": "Two claims disagree on cost. cl-f03278a6db54 says capacity needed 'on most days but not every day' should be On-Demand because it doesn't justify a Reserved Instance. cl-d6855c612c30 puts RI breakeven at roughly 2,200-2,500 hours a year, and cl-05dc8f528170 says steady usage favors RIs. Capacity used most days of the year at most hours of the day would exceed that breakeven, which makes the RI cheaper. Both claims come from awssysops-p1-q029 and awssysops-p1-q141, and the slice does not reconcile them.", "related_entity_ids": ["cl-f03278a6db54", "cl-d6855c612c30", "cl-50ae14b19ea6", "cl-ea62d5f72ed0", "cl-1339448b7da5"]}, {"type": "ambiguity", "severity": "low", "description": "Two claims about default networking can be read as contradicting each other. cl-feb2d6091c7e (awssysops-p1-q060) says an instance in a default subnet automatically gets a private IP, a public IP, and internet reachability. cl-50aa3dc9bd8a (awssysops-p1-q073) says an instance launched into a subnet 'with only default settings' is guaranteed only a private IP. The difference between 'default subnet' and 'subnet with default settings' is not stated, and only cl-395a5bd32c89 resolves it implicitly.", "related_entity_ids": ["cl-feb2d6091c7e", "cl-50aa3dc9bd8a", "cl-395a5bd32c89"]}, {"type": "contradiction", "severity": "medium", "description": "The CloudWatch alarm-state question (awssysops-p1-q140) is unresolved. cl-a2e5ecbc6606 records the community split roughly 50/50 between OK and ALARM, with a minority for INSUFFICIENT_DATA, after an instance was stopped partway through the evaluation window. The slice has no single correct answer for this question.", "related_entity_ids": ["cl-a2e5ecbc6606", "cl-e0b93267c34f"]}, {"type": "contradiction", "severity": "medium", "description": "The Elastic IP quota is contested. cl-d083b203db1a says the community is split on whether the 5-EIP default was one cap shared across EC2-Classic and VPC or a separate cap per platform (awssysops-p1-q196). cl-d7a96012e1fe asserts separate quotas, and cl-f6a8194311cd (awssysops-p2-q401) gives a single 5-per-Region limit per account.", "related_entity_ids": ["cl-d083b203db1a", "cl-d7a96012e1fe", "cl-f6a8194311cd"]}, {"type": "contradiction", "severity": "medium", "description": "The CPU-credit exhaustion remediation (awssysops-p2-q535) is disputed. The boxed answer and the recorded community vote disagree on the correct option (cl-671e607cdd2d), so the related claims (cl-1b2c7c44636a, cl-4dbf7312cbb9, cl-e7d69a12d5cc) are all conflicted.", "related_entity_ids": ["cl-671e607cdd2d", "cl-1b2c7c44636a", "cl-4dbf7312cbb9", "cl-e7d69a12d5cc"]}, {"type": "contradiction", "severity": "medium", "description": "For the interruption-tolerant nightly batch question (awssysops-p2-q561), the boxed answer is On-Demand instances in an Auto Scaling group. Community commentary and a self-reversed vote favor Spot (cl-211ea4e83154). cl-7c8a85dc181a and cl-9036bea4eb99 support Spot and are conflicted.", "related_entity_ids": ["cl-211ea4e83154", "cl-7c8a85dc181a", "cl-9036bea4eb99"]}, {"type": "contradiction", "severity": "high", "description": "For awssysops-p2-q565, the boxed answer describes AssumeRole-style role switching for a policy that grants ec2:* plus iam:PassRole. A unanimous community vote picks a different answer (cl-deab9a53d3fe). The slice's own PassRole claims (cl-259136ebf6fe, cl-0094447aef70) contradict the boxed answer.", "related_entity_ids": ["cl-deab9a53d3fe", "cl-259136ebf6fe", "cl-c23f2e24f3fe", "cl-0094447aef70"]}, {"type": "contradiction", "severity": "medium", "description": "For the real-time tagging-enforcement question (awssysops-p2-q599), the boxed answer is a reactive Tag Editor search. The community vote splits between two proactive options without reaching 60% (cl-0b0666c8c445), and the related claims are conflicted.", "related_entity_ids": ["cl-0b0666c8c445", "cl-050e70975e51", "cl-cbf98df57a0a", "cl-d6761c17cb10"]}, {"type": "contradiction", "severity": "high", "description": "For the partially failed CloudFormation launch (awssysops-p3-1-q621), the boxed answer is 'AMI not available in this region'. cl-06e628e5f8aa argues that a partial success proves the AMI exists, and heavily upvoted commentary attributes the failure to a service limit (cl-eec26ea7fcab, cl-cc94ee414cba). The source answer and its own commentary are in direct conflict.", "related_entity_ids": ["cl-eec26ea7fcab", "cl-06e628e5f8aa", "cl-cc94ee414cba"]}, {"type": "contradiction", "severity": "high", "description": "For the four-additional-Regions question (awssysops-p3-1-q843), the boxed answer is to run the us-east-1 template unmodified. The community vote is unanimous for copying the AMI and updating the mappings first (cl-324d98d976ef). The slice's region-scoped AMI claims (cl-98b564957b6c, cl-c8c4c783f9d1, cl-bdfd0e7a36b4) contradict the boxed answer.", "related_entity_ids": ["cl-324d98d976ef", "cl-98b564957b6c", "cl-c8c4c783f9d1", "cl-bdfd0e7a36b4"]}, {"type": "contradiction", "severity": "low", "description": "The community disputes whether legacy instance types such as m2 can still be bought as Reserved Instances for the stable-workload cost question (awssysops-p3-1-q627, cl-702b0192ea18).", "related_entity_ids": ["cl-702b0192ea18", "cl-05dc8f528170"]}, {"type": "stale-risk", "severity": "medium", "description": "For data residency (awssysops-p2-q320), the source favors a third-party geolocation redirect (cl-fdd38145e5f8, conflicted, low confidence). Route 53 Geolocation routing now provides this natively (cl-85f91e8f66bf), but that claim is still needs-review. The question's intended answer is probably outdated.", "related_entity_ids": ["cl-fdd38145e5f8", "cl-85f91e8f66bf", "cl-4607759c0a3f"]}, {"type": "stale-risk", "severity": "low", "description": "The non-interruptible job question (awssysops-p2-q563) assumes Spot blocks (cl-0d4b5c37c295), which have been withdrawn (cl-a14ac8c042bc). The suggested modern replacement, On-Demand (cl-ccf8d7523a75), is still needs-review.", "related_entity_ids": ["cl-0d4b5c37c295", "cl-a14ac8c042bc", "cl-ccf8d7523a75"]}, {"type": "stale-risk", "severity": "low", "description": "Several claims rest on retired or changed AWS offerings and are marked conflicted: utilization-based RI tiers (cl-ea62d5f72ed0, cl-d6855c612c30, cl-5f25a200b624), hi1.4xlarge (cl-060d8095cd1a), pre-2019 cross-region CloudWatch aggregation (cl-2045f2601c1e), and public IPv4 billing since February 2024 (cl-2a406dbcf00e). cl-428e07582517 matches the RI discount by size and AZ only, ignoring regional RIs. Answers keyed to the original exam era may not match current AWS behavior.", "related_entity_ids": ["cl-ea62d5f72ed0", "cl-d6855c612c30", "cl-5f25a200b624", "cl-060d8095cd1a", "cl-2045f2601c1e", "cl-2a406dbcf00e", "cl-428e07582517"]}, {"type": "unsupported-generation", "severity": "low", "description": "cl-7dc3563e9f36 says a 1-year zonal Reserved Instance gives 'up to 70%+' off On-Demand. Discounts that large come with 3-year terms, and 1-year RIs save much less, so the 1-year framing overstates the discount. The claim is also conflicted, as is its pair cl-d88500215389, which says Capacity Reservations carry no discount.", "related_entity_ids": ["cl-7dc3563e9f36", "cl-d88500215389"]}], "sourceQuestionCount": 151}], "sources": {"kind": "locked", "file": "aws-sysops-service-ec2-nxeq.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------

      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }

    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">

          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">

  // ---------- Compare ----------

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">

          <div class="panel summary">
            <p class="summary-label">Queue complete</p>

    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });

  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {

    var historyHtml = history.length
      ? safe`<ul class="diagnosis-history">${raw(history.map(function (a) {
          var cat = DIAGNOSIS_CATEGORIES.find(function (c) { return c.key === a.diagnosis; });

    var html = safe`
      <section class="diagnose">

      </section>`;
    var node = fromHTML(html);
    node.querySelectorAll('.pending-attempt').forEach(function (el) {
      var error = el.querySelector('.field-error');
      el.addEventListener('change', function () { error.classList.add('hidden'); });
      el.querySelector('.submit-diagnosis').addEventListener('click', function () {
        var checked = el.querySelector('input[type="radio"]:checked');
        if (!checked) { error.classList.remove('hidden'); return; }
        var attemptId = el.getAttribute('data-attempt-id');
        var attempt = STATE.attempts.find(function (a) { return a.id === attemptId; });
        if (attempt) {
          attempt.diagnosis = checked.value;
          saveState();
          navigate();
        }
      });
    });
    return node;
  }

  // ---------- Explore Sources ----------
  var sourcesSearchTerm = '';
  var expandedSourceId = null;
  // Page-level: the sibling file covers every slice, so this is NOT reset in
  // activateSlice the way the two per-slice vars above are. One value, the
  // status discriminating which fields exist:
  //   {status:'idle'} | {status:'loading'}
  //   {status:'locked', envelope, notice: null | 'wrong-password' | 'forgotten-key'}
  //   {status:'unlocking', envelope, via: 'cache' | 'password'}
  //   {status:'ready', bySlice, lock: null | {envelope, expiresAt: number | null}}   lock is null on a clear page
  //   {status:'unavailable', reason: 'no-sources' | 'load-failed' | 'bad-envelope'}
  var SOURCES = { status: 'idle' };

  function questionMatches(q, term) {
    if (!term) return true;
    var choiceText = (q.choices || []).map(function (c) { return c.text; }).join(' ');
    var haystack = [q.id, q.stem, q.explanation, choiceText].join(' ').toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function citingClaims(questionId) {
    return (CURRENT.claims || []).filter(function (c) { return (c.source_question_ids || []).indexOf(questionId) !== -1; });
  }

  function issuesHtml() {
    var issues = CURRENT.issues || [];
    if (!issues.length) return safe`<p class="muted">No open issues.</p>`;
    return safe`
      <details class="issues-panel">
        <summary>Issues <span class="tally">${issues.length}</span></summary>
