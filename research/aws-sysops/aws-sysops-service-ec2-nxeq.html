<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-ec2", "exam": "aws-sysops", "facet": {"key": "service", "value": "ec2"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-74d0b20479f9", "source_question_ids": ["awssysops-p1-q003"], "statement": "An Auto Scaling group only launches instances into the Availability Zones (subnets) it is configured to use.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4454d72198a1", "source_question_ids": ["awssysops-p1-q003"], "statement": "Attaching an ELB to an Auto Scaling group does not change which Availability Zones the group launches instances into.", "status": "supported"}, {"claim_type": "rule", "conditions": ["ELB shows healthy instances concentrated in one AZ and none in another, with zero unhealthy instances"], "confidence": "high", "id": "cl-89c29e54fd36", "source_question_ids": ["awssysops-p1-q003"], "statement": "To balance Auto Scaling instances across Availability Zones when one AZ has zero instances and none are unhealthy, configure the Auto Scaling group with subnets in both AZs.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9a38986587f3", "source_question_ids": ["awssysops-p1-q003"], "statement": "Raising an Auto Scaling group's maximum size does not force new instance launches into an underused Availability Zone.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application needs very high message throughput to/from SQS"], "confidence": "high", "id": "cl-c719bdb2fd5e", "source_question_ids": ["awssysops-p1-q004"], "statement": "Scaling the consumer/producer EC2 fleet (via an Auto Scaling group with triggers watching queue depth, e.g. ApproximateNumberOfMessagesVisible) is the most scalable way to raise aggregate throughput between EC2 and SQS.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ddb93ea39149", "source_question_ids": ["awssysops-p1-q004"], "statement": "An Elastic Load Balancer does not improve throughput between EC2 instances and SQS, because there is no inbound traffic to SQS for an ELB to distribute.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-18e92d1fc8a0", "source_question_ids": ["awssysops-p1-q004"], "statement": "EBS-optimized instances improve EBS disk I/O, not throughput to the SQS API endpoint.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-692ae06ed096", "source_question_ids": ["awssysops-p1-q004"], "statement": "Enabling a public IP address on an instance affects internet reachability, not throughput to the SQS API endpoint.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ced77ff6d28d", "source_question_ids": ["awssysops-p1-q005"], "statement": "EC2 network throughput is capped by the instance type/size, not by storage or connectivity add-ons.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-87455b3c0f5f", "source_question_ids": ["awssysops-p1-q005"], "statement": "Changing to a larger, current-generation EC2 instance type unlocks Enhanced Networking (ENA) and materially more network bandwidth than an older small instance type like m1.small.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1f3920c79423", "source_question_ids": ["awssysops-p1-q005"], "statement": "Adding an additional Elastic Network Interface (ENI) to an EC2 instance does not add aggregate network bandwidth.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2ba2c7a3481e", "source_question_ids": ["awssysops-p1-q005"], "statement": "AWS Direct Connect is for connecting on-premises networks to AWS, not for improving traffic that stays entirely within AWS (e.g. EC2 to S3 in the same region).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-577abc2ad334", "source_question_ids": ["awssysops-p1-q005"], "statement": "EBS Provisioned IOPS (PIOPS) improves EBS disk I/O, which is a different bottleneck than network throughput to S3.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances need to call the CloudWatch PutMetricData API"], "confidence": "medium", "id": "cl-3c391f50cc4e", "source_question_ids": ["awssysops-p1-q012"], "statement": "Specifying an IAM role (through an instance profile) in the Auto Scaling group's launch template (formerly a launch configuration, now deprecated) is the AWS-recommended way to let instances authenticate CloudWatch PutMetricData calls, using auto-rotated credentials from the instance metadata service.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6c0e7c9cf67b", "source_question_ids": ["awssysops-p1-q012"], "statement": "Creating an IAM user and injecting its credentials into instance User Data or a private repository means distributing and rotating static long-lived secrets by hand, which is not the recommended authentication approach for instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-81c2f9cee3ef", "source_question_ids": ["awssysops-p1-q012"], "statement": "CloudWatch has no metric-level resource policy that can grant PutMetricData permission to instances from an Auto Scaling group.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is backed by an instance-store (S3-based) AMI, not EBS"], "confidence": "high", "id": "cl-0952f10c9935", "source_question_ids": ["awssysops-p1-q013"], "statement": "When an EC2 instance backed by an S3-based (instance-store) AMI is terminated, the data on its ephemeral root volume is automatically deleted.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-5a6c8755de30", "source_question_ids": ["awssysops-p1-q013"], "statement": "AWS recommends EBS-backed AMIs over instance-store AMIs for persistent, faster-launching root volumes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["resources are deployed across multiple AWS regions", "cross-account/cross-region CloudWatch dashboards are not being used"], "confidence": "medium", "id": "cl-2045f2601c1e", "source_question_ids": ["awssysops-p1-q017"], "statement": "Before cross-region CloudWatch dashboards (2019), combining a metric across regions into one graph required pulling it per region via the CLI/API, aggregating it, and publishing it back as a custom metric; today one dashboard graph can show metrics from multiple regions directly.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c6fc73e9fbc3", "source_question_ids": ["awssysops-p1-q017"], "statement": "Resource tags are not CloudWatch metric dimensions, and a CloudWatch agent or SNMP trap cannot be attached to a managed service such as a DynamoDB table, so neither approach produces cross-region graphs covering both EC2 and DynamoDB.", "status": "supported"}, {"claim_type": "fact", "conditions": ["using a CloudWatch feature set from 2019 or later"], "confidence": "medium", "id": "cl-22e91be279af", "source_question_ids": ["awssysops-p1-q017"], "statement": "AWS cross-account/cross-region CloudWatch dashboards, launched in 2019, can natively combine the same metric from multiple regions into one view, offering a newer alternative to manual aggregation.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d74f92425118", "source_question_ids": ["awssysops-p1-q019"], "statement": "An EC2 'impaired' system status check indicates an underlying hardware/host problem, distinct from an 'unreachable' instance status check, and cannot be fixed by the guest OS or network configuration.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instance is EBS-backed", "system status check shows impaired"], "confidence": "high", "id": "cl-c1ce14f4584f", "source_question_ids": ["awssysops-p1-q019"], "statement": "Stopping and starting an EBS-backed EC2 instance forces AWS to redeploy it onto a different, healthy physical host, which is the standard fix for a failed system status check.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-243ce7da701e", "source_question_ids": ["awssysops-p1-q019"], "statement": "Rebooting an instance restarts the OS on the same, still-impaired host, so it often does not resolve a failed system status check.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-807e88bbb526", "source_question_ids": ["awssysops-p1-q019"], "statement": "Adding a second private IP address, adding a second ENI, or re-mapping the Elastic IP only changes network paths on a host, and does not fix a host-level hardware problem causing an impaired system status check.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0798c4ac804d", "source_question_ids": ["awssysops-p1-q020"], "statement": "A placement group is an EC2 feature that controls how instances are placed on underlying hardware, enabling high-bandwidth, low-latency connections between instances (e.g. a cluster placement group), useful for tightly-coupled workloads like HPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1c17d110cea0", "source_question_ids": ["awssysops-p1-q020"], "statement": "A placement group is unrelated to Auto Scaling groups, Elastic Load Balancers, or CloudFront edge locations.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-d8e6f085345c", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the network ACLs on both subnets must permit the traffic.", "status": "supported"}, {"claim_type": "rule", "conditions": ["instances are in different subnets of the same VPC"], "confidence": "high", "id": "cl-3febcf7bf852", "source_question_ids": ["awssysops-p1-q022"], "statement": "For two EC2 instances in different subnets of the same VPC to communicate, the security groups on both instances must allow the traffic on the right port/protocol.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-f8cde0449f7b", "source_question_ids": ["awssysops-p1-q022"], "statement": "Route tables route between subnets in the same VPC by default with no NAT instance or Internet Gateway involved, since that traffic never leaves the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ab1633b33ef1", "source_question_ids": ["awssysops-p1-q022"], "statement": "Matching instance class or using the same key pair between two EC2 instances has no bearing on network reachability between them.", "status": "supported"}, {"claim_type": "rule", "conditions": ["web tier is stateless and CPU/memory-bound", "data tier is already well-provisioned and consistently fast"], "confidence": "high", "id": "cl-1e0ca1f2007d", "source_question_ids": ["awssysops-p1-q024"], "statement": "When a stateless, CPU/memory-bound web tier is the bottleneck and the data tier is already well-provisioned and fast, the fix is to horizontally scale the web tier (add instances behind an ELB) rather than changing the data tier.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b410fab982c", "source_question_ids": ["awssysops-p1-q024"], "statement": "DynamoDB is a managed, multi-AZ service, so there is no single Availability Zone to co-locate an EC2 instance with for latency benefits.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-73c60b053b9e", "source_question_ids": ["awssysops-p1-q024"], "statement": "Caching database responses or migrating the database engine does not address a compute-bound application bottleneck when the data tier is already fast.", "status": "supported"}, {"claim_type": "rule", "conditions": ["application has IP addresses hard-coded, with no DNS resolution or load-balancer indirection"], "confidence": "medium", "id": "cl-dcb519a1add8", "source_question_ids": ["awssysops-p1-q025"], "statement": "For a legacy application with IP addresses hard-coded into its own configuration, failover must preserve the exact IP address the application already expects, rather than relying on DNS or load-balancer indirection.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["application requires preservation of a specific hard-coded IP address on failover"], "confidence": "medium", "id": "cl-d335c794c4a4", "source_question_ids": ["awssysops-p1-q025"], "statement": "Attaching a secondary ENI to a failover instance, or moving a secondary private IP address on the primary ENI to a failover instance, lets the new instance take on the exact same IP address with no application-side reconfiguration.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["application has IP addresses hard-coded with no reconfiguration allowed"], "confidence": "medium", "id": "cl-e5c91914f4c9", "source_question_ids": ["awssysops-p1-q025"], "statement": "An ELB or Route 53 health-check failover sends clients to a different IP address or DNS name, so it does not help an application that connects to hard-coded IP addresses without reconfiguration.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["bastion host must be highly available without human intervention"], "confidence": "high", "id": "cl-9051dabb6b29", "source_question_ids": ["awssysops-p1-q026"], "statement": "An Auto Scaling group with min-size=1 and max-size=1 spanning multiple Availability Zones gives a bastion host self-healing high availability with zero human intervention, because the ASG's health checks detect failure and automatically launch a replacement in a healthy AZ.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3777323949f7", "source_question_ids": ["awssysops-p1-q026"], "statement": "A standby AMI needs a human to launch it, and two static bastion instances are never automatically replaced when one fails; only an Auto Scaling group (min = max = 1, spanning multiple AZs) self-heals the bastion without human intervention.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-59f08028b5d8", "source_question_ids": ["awssysops-p1-q026"], "statement": "An ELB load-balances traffic across healthy targets but does not itself replace a failed bastion instance.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-5bc987e7159b", "source_question_ids": ["awssysops-p1-q028"], "statement": "CPU utilization, disk I/O, data transfer, and status checks are default EC2 metrics that CloudWatch collects automatically at the hypervisor level with no agent required.", "status": "supported"}, {"claim_type": "exception", "conditions": ["monitoring memory utilization of an EC2 instance"], "confidence": "high", "id": "cl-911fc23dc4c8", "source_question_ids": ["awssysops-p1-q028"], "statement": "EC2 memory utilization is not a default CloudWatch metric because the hypervisor cannot see it; it must be published from inside the guest OS as a custom metric, typically with the CloudWatch agent.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed continuously, every day"], "confidence": "medium", "id": "cl-ea62d5f72ed0", "source_question_ids": ["awssysops-p1-q029"], "statement": "Baseline capacity needed every day of the year is most cost-effectively covered by Reserved Instances or Savings Plans; the 'heavy utilization' RI type was retired in 2014 in favor of No/Partial/All Upfront payment options.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["capacity is needed frequently but not every single day"], "confidence": "high", "id": "cl-f03278a6db54", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed on most days but not every day is reasonably covered by On-Demand Instances, since it is used too often to leave unreserved but not continuously enough to justify another year-long Reserved Instance commitment.", "status": "supported"}, {"claim_type": "rule", "conditions": ["capacity is needed only a few days per year", "the workload requires full availability"], "confidence": "medium", "id": "cl-1339448b7da5", "source_question_ids": ["awssysops-p1-q029"], "statement": "Capacity needed only a few days per year should not be reserved; when it must be available, cover it with On-Demand Instances, because Spot capacity can be reclaimed with a two-minute notice and is not guaranteed.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c8a1f8029bbf", "source_question_ids": ["awssysops-p1-q029"], "statement": "Using Spot Instances to cover capacity that is needed on most days risks interruption for capacity the application actually needs regularly, which undermines availability.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-07f653f62e9e", "source_question_ids": ["awssysops-p1-q034"], "statement": "Instance store (ephemeral) storage loses all its data when the EC2 instance is stopped or terminated, making it unsuitable when durable persistence of the data must be maintained.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-70be56bdb992", "source_question_ids": ["awssysops-p1-q034"], "statement": "An EBS-optimized EC2 instance provides a dedicated, non-shared throughput channel between the instance and its EBS volumes, so other instance network traffic doesn't contend with disk I/O.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d7bcc27f0212", "source_question_ids": ["awssysops-p1-q034"], "statement": "Provisioned IOPS (PIOPS) EBS volumes deliver a guaranteed, consistent number of IOPS, suited to I/O-intensive workloads such as databases showing high disk wait time.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-391b931f4f8a", "source_question_ids": ["awssysops-p1-q034"], "statement": "Moving to a generic 'SSD-backed instance' does not by itself fix EBS disk I/O wait while keeping data persistent; the fix is an EBS-optimized instance with Provisioned IOPS EBS volumes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["need to detect failure of the monitoring instance itself, simply"], "confidence": "high", "id": "cl-6a1043eae393", "source_question_ids": ["awssysops-p1-q035"], "statement": "The simplest way to monitor the health of a monitoring instance itself ('who watches the watcher') is a CloudWatch alarm on its EC2 system/instance status checks, which catches hardware-level failures with no extra moving parts and can notify operations the same way an existing alarm does.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2ee540b97370", "source_question_ids": ["awssysops-p1-q035"], "statement": "Using a second monitoring instance to watch the first monitoring instance just recreates the same 'who watches the watcher' problem one level up.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0e2d933c8ed9", "source_question_ids": ["awssysops-p1-q035"], "statement": "A CPU-utilization alarm combined with having the monitoring application deliberately enter a CPU-bound loop on problem detection, or an active SQS-based failover/handoff scheme between instances, are both far more complex than needed to detect whether a monitoring instance itself is healthy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a660fa7e4da0", "source_question_ids": ["awssysops-p1-q036"], "statement": "The instance type an Auto Scaling group launches is normally defined in its launch template (legacy: launch configuration), but a group with a mixed instances policy can override it with instance types set in the group itself.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fe181272f7b8", "source_question_ids": ["awssysops-p1-q036"], "statement": "Scaling policies control when to scale and tags are only metadata, so neither defines instance type; a basic Auto Scaling group takes its instance type from its launch template or configuration, and only a mixed instances policy sets types in the group itself.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["need to change the instance type used by an Auto Scaling group"], "confidence": "medium", "id": "cl-b6c7adb54d6c", "source_question_ids": ["awssysops-p1-q036"], "statement": "To change the instance type an Auto Scaling group launches, create a new launch template version with the new type and update the group to use it (with a deprecated, immutable launch configuration you create a new one and point the group at it); existing instances change only when replaced, for example by an instance refresh.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-39ae6e55149a", "source_question_ids": ["awssysops-p1-q044"], "statement": "Under the AWS shared responsibility model, AWS is responsible for protecting against IP spoofing and packet sniffing, via its host-based firewall (which prevents instances from sending traffic with a spoofed source IP/MAC) and its virtualized network (which prevents one tenant's instance from sniffing another tenant's traffic).", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-7c66774178ab", "source_question_ids": ["awssysops-p1-q044"], "statement": "Under the AWS shared responsibility model, enforcing least-privilege access on EC2 instances, encrypting traffic between EC2 and ELB, and patching the guest OS and application stack on EC2 instances are all the customer's responsibility.", "status": "supported"}, {"claim_type": "exception", "conditions": ["using Relational Database Service (RDS) rather than self-managed EC2 database instances"], "confidence": "medium", "id": "cl-ad1b666ed384", "source_question_ids": ["awssysops-p1-q044"], "statement": "RDS database engine patching is AWS-managed under the shared responsibility model, distinct from EC2 guest-OS patching which is the customer's responsibility.", "status": "supported"}, {"claim_type": "fact", "conditions": ["at question authoring time (2012-era instance types)"], "confidence": "medium", "id": "cl-060d8095cd1a", "source_question_ids": ["awssysops-p1-q047"], "statement": "When this question was written, the hi1.4xlarge 'High I/O' instance type offered local SSD instance storage delivering up to roughly 120,000 random read IOPS at 4KB; it is now a retired previous-generation type, replaced by storage-optimized I-family instances such as i4i.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["at question authoring time"], "confidence": "medium", "id": "cl-b6bdd683c240", "source_question_ids": ["awssysops-p1-q047"], "statement": "At the time this question was written, EC2 instances relying on network-attached EBS (including Provisioned IOPS EBS) had throughput far below what instance-local SSD storage could deliver.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5fc9705643fe", "source_question_ids": ["awssysops-p1-q047"], "statement": "The cc2.8xlarge is compute-optimized, not I/O-optimized, so it is not the best fit for very high random read IOPS; the hi1.4xlarge with local SSD instance storage is.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-ea3f1bff7d59", "source_question_ids": ["awssysops-p1-q047"], "statement": "Using ephemeral instance storage for a database's data introduces a data-loss risk if the instance is stopped or terminated, even when that storage type wins on raw IOPS performance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b532f23648f", "source_question_ids": ["awssysops-p1-q048"], "statement": "Data on an EC2 instance's ephemeral/instance-store volumes is always lost when the instance stops, terminates, or the underlying disk fails.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-76604b7f37b0", "source_question_ids": ["awssysops-p1-q048"], "statement": "Whether the root volume is EBS-backed does not affect instance-store data, which is lost when the instance stops either way, so 'an EBS-backed root preserves ephemeral data' is wrong.", "status": "supported"}, {"claim_type": "rule", "conditions": ["launching an EC2 instance and wanting a predetermined private IP address"], "confidence": "high", "id": "cl-d189624fb381", "source_question_ids": ["awssysops-p1-q052"], "statement": "Only within a VPC can a user define a subnet's CIDR range and assign a specific, predetermined private IP address to an EC2 instance at launch.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-50e63e1ea566", "source_question_ids": ["awssysops-p1-q052"], "statement": "An Elastic IP address is a public IP address, not a private one, so assigning Elastic IPs does not satisfy a requirement for a predetermined private IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-481fbf9ca5c9", "source_question_ids": ["awssysops-p1-q052"], "statement": "A Placement Group affects instance placement and network performance between instances, not IP address assignment.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-07ea3e784810", "source_question_ids": ["awssysops-p1-q052"], "statement": "An instance's private DNS hostname just names whatever private IP address the instance happened to be assigned; it does not let a user predetermine that IP address.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f65d41befcac", "source_question_ids": ["awssysops-p1-q052"], "statement": "Launching an instance from a private AMI controls the image/OS content, not networking or IP address assignment.", "status": "supported"}, {"claim_type": "default", "conditions": ["instance is launched into the default subnet in EC2-VPC"], "confidence": "high", "id": "cl-feb2d6091c7e", "source_question_ids": ["awssysops-p1-q060"], "statement": "An instance launched into a default VPC subnet automatically gets a private IP address, an auto-assigned public IP address, and reachability to/from the internet through the VPC's internet gateway, all provisioned automatically at launch.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-a7a90931cff9", "source_question_ids": ["awssysops-p1-q060", "awssysops-p1-q073"], "statement": "An Elastic IP is never attached to an EC2 instance automatically; it must be explicitly allocated to the account and then associated with the instance as a separate manual step.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-75ad36ae1f72", "source_question_ids": ["awssysops-p1-q070"], "statement": "An Auto Scaling launch configuration is only a template/blueprint; AWS never charges for the launch configuration object itself.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-68102fad0835", "source_question_ids": ["awssysops-p1-q070"], "statement": "Deleting or keeping an Auto Scaling launch configuration around after its instances are terminated has no effect on the AWS bill.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-56db4374f2f1", "source_question_ids": ["awssysops-p1-q070"], "statement": "Unattached or unused EBS volumes continue to be billed, so deleting them once no longer needed reduces cost.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2a406dbcf00e", "source_question_ids": ["awssysops-p1-q070"], "statement": "Since February 2024 every public IPv4 address is billed hourly, including an Elastic IP attached to a running instance, so releasing an Elastic IP you no longer need reduces cost.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ea1886242af2", "source_question_ids": ["awssysops-p1-q070"], "statement": "An idle Elastic Load Balancer with no instances behind it is still billed, so deleting it reduces cost.", "status": "supported"}, {"claim_type": "default", "conditions": ["instance launched into a VPC subnet with only default settings"], "confidence": "high", "id": "cl-50aa3dc9bd8a", "source_question_ids": ["awssysops-p1-q073"], "statement": "An EC2 instance launched into a VPC subnet with only default settings is assigned a private IP address immediately and automatically, with nothing else guaranteed ready to use without an extra step.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-395a5bd32c89", "source_question_ids": ["awssysops-p1-q073"], "statement": "An EC2 instance gets a public IPv4 address at launch if its subnet's auto-assign public IP attribute is enabled (on in default subnets, off in user-created subnets) or if one is explicitly requested on the primary network interface at launch, which overrides the subnet setting.", "status": "supported"}, {"claim_type": "fact", "conditions": ["user-created (non-default) VPC"], "confidence": "high", "id": "cl-1a16efff622f", "source_question_ids": ["awssysops-p1-q073"], "statement": "In a user-created (non-default) VPC, an internet gateway must be created, attached to the VPC, and added to the subnet's route table before instances get internet connectivity; a default VPC comes with these already configured.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-19b4553d03c7", "source_question_ids": ["awssysops-p1-q100"], "statement": "Deleting an ELB only deregisters its target instances and has no effect on the instances themselves; they keep running (and continue to incur their own EC2 charges) until separately stopped or terminated.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8c5c683aea9b", "source_question_ids": ["awssysops-p1-q100"], "statement": "Deleting a load balancer does not block on, prompt about, or terminate the instances registered with it.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-5676c74e67ca", "source_question_ids": ["awssysops-p1-q106"], "statement": "Most EC2 instances are billed per second with a 60-second minimum each time the instance enters the Running state; a reboot does not start a new billing period.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0396b1143ba5", "source_question_ids": ["awssysops-p1-q106"], "statement": "Rebooting a running EC2 instance never leaves the Running state, so a reboot adds no additional billed instance-hour.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-90f02929ff95", "source_question_ids": ["awssysops-p1-q106"], "statement": "Each time a stopped instance returns to Running, a new 60-second minimum charge applies under per-second billing; a full new billed hour applies only to hourly-billed instances (and applied to all instances before October 2017).", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6444791008fc", "source_question_ids": ["awssysops-p1-q106"], "statement": "A reboot keeps the instance in the Running state, so it is not a separate chargeable event and does not start a new billing period; counting it as one is wrong.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-64b99dc6dbe9", "source_question_ids": ["awssysops-p1-q109"], "statement": "Amazon Machine Images (AMIs) are region-scoped, so launching an instance in a new region first requires an AMI to exist in that region.", "status": "supported"}, {"claim_type": "rule", "conditions": ["need to achieve disaster recovery for an EC2 instance in a different AWS region"], "confidence": "high", "id": "cl-57facaa305c7", "source_question_ids": ["awssysops-p1-q109"], "statement": "The standard path for disaster recovery into a new region is to create an AMI from the running instance in the source region, copy that AMI to the target region, then launch a new instance from the copied AMI.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-b3d6d01f84f9", "source_question_ids": ["awssysops-p1-q109"], "statement": "EC2 does not offer an operation to directly copy a running instance across regions; only AMIs (or snapshots) can be copied between regions, not a live running instance.", "status": "supported"}, {"claim_type": "default", "conditions": ["initial launch of EC2 instances"], "confidence": "high", "id": "cl-e257631bcd76", "source_question_ids": ["awssysops-p1-q116"], "statement": "AWS recommends accepting the default Availability Zone when first launching EC2 instances, letting AWS pick the AZ with the best current system health and available capacity.", "status": "supported"}, {"claim_type": "exception", "conditions": ["launching additional instances relative to existing ones"], "confidence": "medium", "id": "cl-56cbebb2c088", "source_question_ids": ["awssysops-p1-q116"], "statement": "Users should specify an Availability Zone explicitly only when launching additional instances that need to be placed near or apart from already-running instances; pinning initial launches to one specific AZ undermines the redundancy AZ diversity provides.", "status": "supported"}, {"claim_type": "fact", "conditions": ["VPC has only a private, VPN-connected subnet with no public subnet or IGW"], "confidence": "medium", "id": "cl-bd3493bfbcd5", "source_question_ids": ["awssysops-p1-q117"], "statement": "In a VPN-only private subnet with no IGW, the VPN tunnel is the network path for SSH from the user's own network, though EC2 Instance Connect Endpoint or Session Manager (through VPC endpoints) can also reach the instances without a VPN.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["VPC has only a private, VPN-connected subnet with no public subnet or IGW"], "confidence": "high", "id": "cl-f1e88d1f493d", "source_question_ids": ["awssysops-p1-q117"], "statement": "For SSH access to an instance reachable only via a VPN-only private subnet, the security group should simply allow inbound traffic on port 22 from the user's own network range, since the VPN tunnel itself handles routing that traffic into the VPC.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8cf8357edbad", "source_question_ids": ["awssysops-p1-q117"], "statement": "A bastion-host-via-Elastic-IP pattern for reaching private instances is a real pattern over the public internet, but it is unnecessary when a VPN tunnel already provides the network path to a private subnet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7ab48df8f965", "source_question_ids": ["awssysops-p1-q117"], "statement": "A NAT instance provides outbound internet access from private instances, not inbound SSH access to them.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e090e92f96d3", "source_question_ids": ["awssysops-p1-q127"], "statement": "SSH authentication to an EC2 instance uses the private key from the EC2 key pair used to launch the instance, not an IAM access key, so an incorrect IAM access key is never a real cause of an SSH connection timeout.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-c18f8741ffd7", "source_question_ids": ["awssysops-p1-q127"], "statement": "Security group, route table, network ACL, or local firewall misconfiguration, or a heavily loaded instance CPU, can cause an SSH connection timeout; a wrong private key instead produces an authentication error such as 'Permission denied (publickey)'.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-03546445e03f", "source_question_ids": ["awssysops-p1-q127"], "statement": "A heavily loaded instance CPU is a documented possible cause of an SSH connection timeout in AWS's troubleshooting guide, whereas an IAM access key plays no role in SSH authentication.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0e30a2d6d69e", "source_question_ids": ["awssysops-p1-q129"], "statement": "The disk-related EC2 CloudWatch metrics (DiskReadOps, DiskWriteOps, DiskReadBytes, DiskWriteBytes) only report non-zero values when the instance has ephemeral (instance store) storage attached, since they measure I/O against that ephemeral device specifically.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance has no ephemeral/instance-store device attached"], "confidence": "high", "id": "cl-bf744509cd39", "source_question_ids": ["awssysops-p1-q129"], "statement": "An EBS-backed EC2 instance with no additional ephemeral device attached will always report 0 for DiskReadBytes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c9fe7ff717c8", "source_question_ids": ["awssysops-p1-q129"], "statement": "The CloudWatch metrics NetworkIn, NetworkOut, and CPUUtilization are populated regardless of storage type, since they measure network traffic and processor usage rather than ephemeral-disk I/O.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-331058959ce8", "source_question_ids": ["awssysops-p1-q130"], "statement": "Rebooting (restarting) an EC2 instance keeps it in the running state throughout and does not start a new billing period.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-cfaf2be26905", "source_question_ids": ["awssysops-p1-q130"], "statement": "Stopping and starting an EC2 instance ends one billing period and begins a new one on start, even if the stop/start cycle happens more than once within the same clock hour.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-57201b8b797b", "source_question_ids": ["awssysops-p1-q130"], "statement": "AWS has since moved to per-second billing (with a one-minute minimum) for a stop-to-start transition rather than charging a full hour, though the underlying restart-vs-stop/start billing distinction still holds.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-4a1c2875f7c8", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "An EC2 instance's Availability Zone is fixed at launch and cannot be changed in place -- there is no stop/start toggle, CLI command, or console action that moves a running instance to a different AZ.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-25d5389e1358", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "The standard way to move an EC2 instance to another Availability Zone is to create an AMI from it and launch a new instance from that AMI in the target AZ; the instance's own AZ cannot be changed in place.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d66a7d7fbbf5", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "Stopping an EC2 instance and then 'changing the availability zone' directly on it is not a real capability -- an instance always restarts in the same AZ it was launched in.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-25c337bb3f19", "source_question_ids": ["awssysops-p1-q136", "awssysops-p1-q181"], "statement": "There is no AWS CLI-only restriction for changing an instance's AZ, and there is no console 'Actions -> Change zones' action -- neither capability exists.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "high", "id": "cl-6ab1f6c8020f", "source_question_ids": ["awssysops-p1-q138"], "statement": "Under AWS consolidated billing, the hourly cost benefit of a Reserved Instance purchased by one linked account is shared across all accounts on the consolidated bill, not locked to the purchasing account.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "medium", "id": "cl-428e07582517", "source_question_ids": ["awssysops-p1-q138"], "statement": "A shared Reserved Instance discount under consolidated billing applies automatically to whichever single running instance in the account group matches the RI's instance size and Availability Zone, regardless of which specific linked account that instance is running in.", "status": "supported"}, {"claim_type": "fact", "conditions": ["only a single matching RI has been purchased"], "confidence": "medium", "id": "cl-d9b6d386059f", "source_question_ids": ["awssysops-p1-q138"], "statement": "If only one Reserved Instance was purchased for a given size/AZ, only one matching running instance across the consolidated-billing account group gets the discounted rate at any given time; the rest are billed at the standard on-demand/blended rate.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e0b93267c34f", "source_question_ids": ["awssysops-p1-q140"], "statement": "A CloudWatch alarm configured for 5 evaluation periods of 5 minutes each has a 25-minute total evaluation window.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance was stopped for part of the alarm's evaluation window, then restarted"], "confidence": "low", "id": "cl-a2e5ecbc6606", "source_question_ids": ["awssysops-p1-q140"], "statement": "Whether a CloudWatch alarm reports OK, Alarm, or Insufficient Data after an instance was briefly stopped mid-evaluation-window (leaving a gap in reported data points shorter than the full window) depends on CloudWatch's specific handling of missing data points, and community consensus on this exact scenario is split roughly 50/50 between OK and Alarm, with a substantial minority arguing for Insufficient Data.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["legacy utilization-based RI tiers"], "confidence": "medium", "id": "cl-d6855c612c30", "source_question_ids": ["awssysops-p1-q141"], "statement": "Under the legacy utilization-based RI tiers (retired in 2014), even the cheapest Light Utilization tier broke even against On-Demand only at roughly 2,200-2,500 hours of usage per year.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["instance runs only ~3 hours/day"], "confidence": "high", "id": "cl-50ae14b19ea6", "source_question_ids": ["awssysops-p1-q141"], "statement": "Running an instance for about 3 hours per day (roughly 1,100 hours per year) falls well short of the Reserved Instance breakeven point, so on-demand pricing remains cheaper than any RI tier for that usage pattern.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-5f25a200b624", "source_question_ids": ["awssysops-p1-q141"], "statement": "AWS retired the Heavy/Medium/Light Utilization RI tiers (replaced by Standard and Convertible RIs, and later Savings Plans); Scheduled Reserved Instances once targeted recurring daily windows but are no longer available for purchase.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-7c7660b461ad", "source_question_ids": ["awssysops-p1-q147"], "statement": "Creating an instance-store-backed AMI from a running instance consists of three steps: bundling the root volume, uploading the bundled volume to S3, and registering the AMI.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-41d508b06c5d", "source_question_ids": ["awssysops-p1-q147"], "statement": "Defining AMI launch permissions is a separate, optional step that can be performed any time after the AMI already exists -- it is not part of the AMI creation process itself.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-933839c700bd", "source_question_ids": ["awssysops-p1-q150"], "statement": "The maximum length of an AWS resource tag key is 128 Unicode characters.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bc3b7d48156a", "source_question_ids": ["awssysops-p1-q150"], "statement": "The maximum length of an AWS resource tag value is 256 Unicode characters.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0c1d77245793", "source_question_ids": ["awssysops-p1-q150"], "statement": "A claimed maximum tag key length of 64 Unicode characters is incorrect.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b6d6902fd77d", "source_question_ids": ["awssysops-p1-q150"], "statement": "AWS tags are key-value pairs that can be applied to many resource types, including S3 buckets.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2226f841e577", "source_question_ids": ["awssysops-p1-q150"], "statement": "AWS tags are the mechanism behind cost allocation reporting / cost distribution of resources.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-15262084d4bb", "source_question_ids": ["awssysops-p1-q153", "awssysops-p1-q242"], "statement": "Rebooting an EC2 instance keeps it on the exact same underlying host hardware throughout the reboot.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2cce1c0f81c2", "source_question_ids": ["awssysops-p1-q153"], "statement": "Rebooting an EBS-backed EC2 instance preserves its private and public IP addresses.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-42e08f5754a4", "source_question_ids": ["awssysops-p1-q153"], "statement": "Rebooting an EC2 instance keeps its Elastic IP associated with the instance.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a639966b7056", "source_question_ids": ["awssysops-p1-q153"], "statement": "Rebooting an EBS-backed EC2 instance preserves its EBS volume(s) untouched.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-d0a70964a54b", "source_question_ids": ["awssysops-p1-q153", "awssysops-p1-q168"], "statement": "Moving to a new underlying host computer can happen on an EC2 stop/start cycle, not on a simple reboot.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f2f08cf34a26", "source_question_ids": ["awssysops-p1-q162"], "statement": "Creating an instance-store-backed AMI via command-line/API tools requires exactly three credentials: AWS account ID, access key and secret access key, and an X.509 certificate with private key.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4aa6dcbc2c49", "source_question_ids": ["awssysops-p1-q162"], "statement": "An AWS console login ID is not required to create an instance-store-backed AMI, since the bundling workflow is performed via command-line tools rather than the console.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is EC2-Classic (not VPC)"], "confidence": "medium", "id": "cl-b5976affb6d1", "source_question_ids": ["awssysops-p1-q168"], "statement": "On EC2-Classic, retired in August 2023, an Elastic IP was dissociated when the instance stopped; in a VPC, the only platform today, an Elastic IP stays associated through stop/start.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["instance is in a VPC"], "confidence": "high", "id": "cl-189d2329cfe3", "source_question_ids": ["awssysops-p1-q168"], "statement": "On EC2-VPC, an Elastic IP stays associated with the instance through a stop/start cycle, unlike the EC2-Classi ": "There is no Elastic-IP-matching mechanism for ELB registration -- an instance getting the same Elastic IP back after a reboot is not what causes it to be registered with ELB.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4d74a9f9469f", "source_question_ids": ["awssysops-p1-q184"], "statement": "An SSH 'Host key not found' error is typically caused by connecting with the wrong OS username for the AMI in use (or the wrong private key file), not by CPU load, security group misconfiguration, or an incorrect AWS access key.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b5a4f371399", "source_question_ids": ["awssysops-p1-q184"], "statement": "SSH authenticates to an EC2 instance using the instance's key pair (.pem private key file), not the AWS API access key and secret access key.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-770187e17919", "source_question_ids": ["awssysops-p1-q184"], "statement": "A security-group misconfiguration would typically manifest as a connection timeout rather than a 'Host key not found' SSH error.", "status": "supported"}, {"claim_type": "fact", "conditions": ["policy contains exactly these three Allow statements with no elasticloadbalancing action"], "confidence": "high", "id": "cl-0f0d7c0cf397", "source_question_ids": ["awssysops-p1-q190"], "statement": "An IAM policy granting only ec2:Describe*, a set of CloudWatch read actions (ListMetrics, GetMetricStatistics, Describe*), and autoscaling:Describe* grants read-only access across EC2, CloudWatch, and Auto Scaling, but grants no access to Elastic Load Balancing since no elasticloadbalancing action appears in the policy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8f2a11ab7c45", "source_question_ids": ["awssysops-p1-q190"], "statement": "EBS volumes are covered by the
