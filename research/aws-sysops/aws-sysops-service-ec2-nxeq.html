e": "high", "id": "cl-af1dbebd5b31", "source_question_ids": ["awssysops-p1-q273"], "statement": "An 'InsufficientInstanceCapacity' error when starting or restarting an EC2 instance means AWS does not currently have enough available capacity of the requested instance type in the targeted Availability Zone.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c392fcfe9ace", "source_question_ids": ["awssysops-p1-q273"], "statement": "A stopped EBS-backed EC2 instance can fail to restart with InsufficientInstanceCapacity if its Availability Zone has since become capacity-constrained for that instance type, even after a long idle period such as 20 days.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-eac8dd4f1bb3", "source_question_ids": ["awssysops-p1-q273"], "statement": "InsufficientInstanceCapacity is distinct from, and not caused by, AWS zone-mapping changes, host-level hardware issues, or reaching an account's maximum EC2 instance limit -- each of those produces a different error.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-3907b0069218", "source_question_ids": ["awssysops-p1-q290"], "statement": "A CloudWatch alarm that monitors CPU utilization and triggers a terminate action once utilization drops below a low threshold (e.g. 5%) can detect job completion and automatically terminate an EC2 instance running a variable-duration batch job, without hardcoding a fixed runtime.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d14686b021a8", "source_question_ids": ["awssysops-p1-q290"], "statement": "CloudWatch alarms can trigger automatic EC2 instance termination as an alarm action.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-839dedb29630", "source_question_ids": ["awssysops-p1-q290"], "statement": "Hardcoding a fixed-duration termination job (e.g. terminate all instances after 600 minutes) risks prematurely killing batch jobs whose runtime legitimately varies and can exceed that fixed cutoff.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0c9765cc3bd2", "source_question_ids": ["awssysops-p1-q293"], "statement": "Converting an instance store-backed AMI to an EBS-backed AMI, by attaching an EBS volume and unbundling the AMI data into it, is a supported procedure for Linux instances.", "status": "supported"}, {"claim_type": "exception", "conditions": ["instance is Windows-based"], "confidence": "high", "id": "cl-b7203e9cbabc", "source_question_ids": ["awssysops-p1-q293"], "statement": "AWS does not support converting a Windows instance store-backed AMI to an EBS-backed AMI, even though the equivalent conversion is supported for Linux instances.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-072396881622", "source_question_ids": ["awssysops-p1-q296"], "statement": "Setting the DisableApiTermination attribute on an EC2 instance blocks instance termination via the console, CLI, and API alike, protecting against accidental termination.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c38cb5d25098", "source_question_ids": ["awssysops-p1-q296"], "statement": "The InstanceInitiatedShutdownBehavior attribute controls what happens when an OS-level shutdown command is issued from within an instance (stop vs. terminate); it does not protect against an explicit terminate action initiated from outside the instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8e226331aca4", "source_question_ids": ["awssysops-p1-q296"], "statement": "There is no EC2 attribute called a 'Deletion termination flag'.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-64a7f15e9725", "source_question_ids": ["awssysops-p1-q299"], "statement": "When creating an instance store-backed AMI from a running instance that has an additional instance store volume attached, the resulting AMI's block device mapping includes that additional volume, not just the root volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-21a836d9dd3a", "source_question_ids": ["awssysops-p1-q299"], "statement": "Instances launched from an instance store-backed AMI whose block device mapping includes an additional volume automatically inherit that same block device mapping.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-c17882120a9e", "source_question_ids": ["awssysops-p2-q301"], "statement": "EC2 termination protection only blocks termination requests made via the console, CLI, or API; it does not override an instance's own InstanceInitiatedShutdownBehavior setting.", "status": "supported"}, {"claim_type": "fact", "conditions": ["InstanceInitiatedShutdownBehavior set to terminate", "termination protection enabled"], "confidence": "high", "id": "cl-d93769deff2a", "source_question_ids": ["awssysops-p2-q301"], "statement": "If InstanceInitiatedShutdownBehavior is set to 'terminate' and the user shuts down the OS from within an instance that also has termination protection enabled, the instance still terminates.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-c41364b32c0d", "source_question_ids": ["awssysops-p2-q301"], "statement": "EC2 termination protection and the InstanceInitiatedShutdownBehavior setting are independent settings that can coexist in any combination; OS-level shutdown always remains possible regardless of whether termination protection is enabled.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3ddda627a681", "source_question_ids": ["awssysops-p2-q302"], "statement": "'EBS-optimized' is the actual EC2 launch configuration/feature name that provisions a dedicated, guaranteed-throughput connection between an instance and its attached EBS volumes, separate from the instance's general network traffic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-95310604963a", "source_question_ids": ["awssysops-p2-q302"], "statement": "'EBS dedicated' and 'EBS enhanced' are not real EC2 launch options; the feature that provides dedicated EC2-to-EBS throughput is EBS-optimized, so options using those terms are wrong.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is Windows-based"], "confidence": "high", "id": "cl-46b07fc131f5", "source_question_ids": ["awssysops-p2-q303"], "statement": "For a Windows EC2 instance, the Instance console output feature in the AWS console displays the last three system event log errors, not the full boot log.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is Linux-based"], "confidence": "medium", "id": "cl-e5bd8a360b3e", "source_question_ids": ["awssysops-p2-q303"], "statement": "For Linux instances, EC2 console output shows the instance's serial console output (boot and kernel messages, the most recent 64 KB), a broader scope than the last three system event log errors shown for Windows instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0931c60a9379", "source_question_ids": ["awssysops-p2-q306"], "statement": "An instance store-backed (S3-based) AMI's root volume is ephemeral instance store, not EBS; when the instance terminates, the root volume's data is permanently lost with no automatic snapshot or preservation.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-390fc04406eb", "source_question_ids": ["awssysops-p2-q306"], "statement": "A terminated EC2 instance cannot be restarted (restart applies to the stop/start operation, which is distinct from terminate), so data on an instance-store root volume cannot become available again after termination.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1a19bdc05e18", "source_question_ids": ["awssysops-p2-q308"], "statement": "Cluster placement groups pack EC2 instances close together within a single Availability Zone to minimize inter-node latency and maximize throughput; spread and partition placement groups instead separate instances onto distinct hardware for fault isolation.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d879bd7287c7", "source_question_ids": ["awssysops-p2-q308"], "statement": "Spreading EC2 instances across multiple Availability Zones increases inter-node latency rather than reducing it, the opposite of what a low-latency compute cluster requires.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-24f4063e93a4", "source_question_ids": ["awssysops-p2-q308"], "statement": "AWS Direct Connect addresses on-premises-to-AWS connectivity and does not address inter-instance latency within a compute cluster.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b1e4dbacabbd", "source_question_ids": ["awssysops-p2-q319"], "statement": "The EC2 instance metadata service, queried via HTTP from inside the instance (e.g. the public-ipv4 and local-ipv4 paths), is the AWS-native way for software running on an instance to discover its own public and private IP addresses.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-089675e0a600", "source_question_ids": ["awssysops-p2-q319"], "statement": "EC2 instance userdata is static, user-supplied bootstrap script/config passed at launch time, and is not a source of dynamic networking information such as the instance's current IP addresses.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-cf4cd37aaa98", "source_question_ids": ["awssysops-p2-q319"], "statement": "Running ipconfig or ifconfig from within an instance's own OS can reveal only the private IP as seen by that OS-level network interface, not the public IP, which is handled via NAT/mapping outside the instance's OS.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-4607759c0a3f", "source_question_ids": ["awssysops-p2-q320"], "statement": "Route 53 Latency Based Routing optimizes for the lowest-latency region and can route a user to a region outside their jurisdiction whenever that region happens to be faster, which can violate a strict data-residency requirement that data must not leave a specific jurisdiction such as the EU or the US.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-fdd38145e5f8", "source_question_ids": ["awssysops-p2-q320"], "statement": "A third-party geolocation-based redirection mechanism that determines a user's actual jurisdiction and routes them to the matching AWS region is a more deterministic way to satisfy a strict 'data must not leave the jurisdiction' compliance requirement than latency-based routing.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e70c7ddeeb5a", "source_question_ids": ["awssysops-p2-q320"], "statement": "Running EC2 instances only within multiple Availability Zones of a single AWS Region cannot satisfy a requirement to keep EU customer data in the EU and US customer data in the US, because a single Region cannot provide separate EU and US jurisdictions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-85f91e8f66bf", "source_question_ids": ["awssysops-p2-q320"], "statement": "AWS Route 53 Geolocation Routing Policy, distinct from Latency Based Routing, is the AWS-native mechanism for routing users to a region based on their geographic/jurisdictional location.", "status": "needs-review"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2bbd19b17318", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, patch management of the guest operating system on an EC2 instance is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-265b902de8ca", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, choosing whether to encrypt EBS volumes is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6cd4c4a80e86", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, lifecycle management of IAM credentials is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d9a4d865fe90", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, configuring Security Group and Network ACL settings is the customer's responsibility.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-a2b3d8260ae9", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, controlling physical access to compute resources and underlying hardware is AWS's responsibility, not the customer's.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-d8bb0a066c77", "source_question_ids": ["awssysops-p2-q322"], "statement": "Under the AWS Shared Responsibility Model, decommissioning retired physical storage devices is AWS's responsibility, not the customer's, since customers never have physical or hardware-level access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8fabd468b5d0", "source_question_ids": ["awssysops-p2-q323"], "statement": "An EC2 instance's tenancy attribute (default vs. dedicated) cannot be changed in place on a running instance after launch.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-154d1ff0eef4", "source_question_ids": ["awssysops-p2-q323"], "statement": "To move a single existing EC2 instance to dedicated-tenancy hardware with minimal impact on the rest of an application, the supported process is: stop the instance, create an AMI from it, launch a new instance from that AMI with tenancy=dedicated, then terminate the original instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-220bd1e9a082", "source_question_ids": ["awssysops-p2-q323"], "statement": "Migrating an entire VPC to a new VPC configured with tenancy=dedicated affects every instance in that VPC, which is unnecessary disruption when only a single instance needs to move to dedicated tenancy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-adb28f5abee4", "source_question_ids": ["awssysops-p2-q330"], "statement": "An egress-only internet gateway is attached to the VPC, and the ::/0 route to it is added to the route table associated with the subnet; each subnet is associated with exactly one route table, which may be shared with other subnets or be the VPC's main route table.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-bcb278d87bce", "source_question_ids": ["awssysops-p2-q330"], "statement": "IPv6 addresses in a VPC are globally unique (public), but they are reachable from the internet only when the subnet's route table sends ::/0 to an internet gateway; routing ::/0 to an egress-only internet gateway allows outbound-only IPv6.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-11b818ed654b", "source_question_ids": ["awssysops-p2-q330"], "statement": "A security group that blocks inbound IPv6 traffic directly prevents unsolicited inbound access to an instance with a public IPv6 address, independent of subnet placement or egress-only gateway configuration.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9d5a90bbda45", "source_question_ids": ["awssysops-p2-q330"], "statement": "Each subnet must be associated with exactly one route table (explicitly, or implicitly with the VPC's main route table), and one route table can be associated with multiple subnets.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-d0967fc4bf8e", "source_question_ids": ["awssysops-p2-q331"], "statement": "AWS CloudTrail logs showing API calls and Amazon EC2 instance system logs are both generated by and fully within a customer's own control and visibility, making them evidence the customer -- not AWS -- would provide to a compliance auditor.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-13e3d519465d", "source_question_ids": ["awssysops-p2-q331"], "statement": "AWS is responsible for decommissioning and destroying physical storage media, and customers never have physical access to that media, so storage device destruction records are AWS's responsibility to provide to an auditor, not the customer's.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-be7847a337bb", "source_question_ids": ["awssysops-p2-q331"], "statement": "Physical data center access logs and Xen Hypervisor system logs are AWS's responsibility under the Shared Responsibility Model, since customers have no access to the physical facility or the underlying hypervisor.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-61564b0e94ae", "source_question_ids": ["awssysops-p2-q334"], "statement": "EC2 instance operating system updates are the customer's responsibility under the AWS Shared Responsibility Model, since the customer controls the guest OS.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-723c4219b128", "source_question_ids": ["awssysops-p2-q334"], "statement": "IAM user password policy configuration is the customer's responsibility under the AWS Shared Responsibility Model, since the customer controls their own IAM configuration.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-57118cc168c6", "source_question_ids": ["awssysops-p2-q334"], "statement": "AWS API endpoint SSL certificates are AWS's own responsibility to manage and rotate, not the customer's.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-69d423daef1c", "source_question_ids": ["awssysops-p2-q334"], "statement": "EBS encryption-at-rest algorithms and the underlying AWS Hypervisor software are implemented and maintained by AWS itself, even though the customer chooses whether to enable EBS encryption.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-884ea710d2d9", "source_question_ids": ["awssysops-p2-q335"], "statement": "Simplified automatic recovery (on by default) does not support instances with instance store volumes attached at launch; CloudWatch alarm-based recovery supports instance store on selected instance types, but instance store data is lost on recovery.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-a132896519e9", "source_question_ids": ["awssysops-p2-q335"], "statement": "EC2 auto-recovery supports an instance running with either default (shared) tenancy or dedicated tenancy -- the two tenancy states are each individually sufficient, and are mutually exclusive for any single instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c2cd14a10758", "source_question_ids": ["awssysops-p2-q335"], "statement": "EC2 auto-recovery works across a broad range of supported instance types and is not narrowly limited to the d2, i2, or i3 instance families.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9ff7aca5524b", "source_question_ids": ["awssysops-p2-q344"], "statement": "Amazon EC2 supports exactly two types of block devices: instance store volumes and EBS volumes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4053d59de53f", "source_question_ids": ["awssysops-p2-q344"], "statement": "Instance store volumes are storage physically attached to the host, whereas EBS volumes are network-attached remote storage.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4be19c2b06c3", "source_question_ids": ["awssysops-p2-q344"], "statement": "The list of EBS volume types (General Purpose SSD, Provisioned IOPS SSD, Throughput Optimized HDD, Cold HDD, Magnetic) is a sub-classification within the single 'EBS volumes' block device type, not itself a count of EC2's block device types.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b8eb29bc97d1", "source_question_ids": ["awssysops-p2-q351"], "statement": "Since the October 2017 EC2 billing change, most instances running Linux are billed per-second, with a one-minute minimum.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-bd6ba3a60970", "source_question_ids": ["awssysops-p2-q351"], "statement": "On-Demand Linux, Windows (including Windows with SQL Server), RHEL, and Ubuntu Pro instances are now billed per second with a 60-second minimum, while SUSE Linux Enterprise Server instances are still billed as a full hour.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-ecd813ac97dd", "source_question_ids": ["awssysops-p2-q351"], "statement": "Whether an EC2 instance is billed per second or per hour depends mainly on its operating system (Linux, Windows, RHEL, and Ubuntu Pro bill per second; SLES bills as a full hour), plus tenancy, since On-Demand Dedicated Instances are billed per instance-hour.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7211531286bd", "source_question_ids": ["awssysops-p2-q351"], "statement": "Billing by the day with hours billed in proportion is not a real EC2 billing model; before October 2017 EC2 billed per instance-hour with partial hours rounded up, and today most instances bill per second with a 60-second minimum.", "status": "supported"}, {"claim_type": "default", "conditions": ["applies to the instance's root EBS volume specifically"], "confidence": "high", "id": "cl-c243306cee99", "source_question_ids": ["awssysops-p2-q352"], "statement": "The 'Delete on Termination' flag is set by default, so unless it is explicitly unset, the volume is deleted along with the instance on termination.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5387764317c1", "source_question_ids": ["awssysops-p2-q352"], "statement": "The DeleteOnTermination attribute is checked per attached EBS volume at instance-termination time to determine whether that volume is preserved or deleted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2d0f4a19f7d5", "source_question_ids": ["awssysops-p2-q352"], "statement": "InstanceInitiatedShutdownBehavior controls whether an OS-level shutdown command stops or terminates the instance; it does not control EBS volume deletion.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c1b73b1bf279", "source_question_ids": ["awssysops-p2-q352"], "statement": "DisableApiTermination is a termination-protection guard that prevents accidental instance termination via the API; it is unrelated to EBS volume deletion handling.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a0585d5e15f6", "source_question_ids": ["awssysops-p2-q356"], "statement": "The AWS Management Console is a web-based graphical user interface for accessing and managing EC2 instances and other AWS services.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3270dc006f60", "source_question_ids": ["awssysops-p2-q360"], "statement": "A security group is a virtual firewall that controls inbound and outbound traffic for one or more EC2 instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-fea576b8b73e", "source_question_ids": ["awssysops-p2-q360"], "statement": "An EC2 instance can have one or more security groups attached, and AWS evaluates the union of all attached groups' rules when deciding whether to permit traffic.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3a8a56fc4b78", "source_question_ids": ["awssysops-p2-q364"], "statement": "Amazon Linux (now Amazon Linux 2023 and Amazon Linux 2) is a supported, regularly updated Linux image from AWS preconfigured for AWS integration such as the AWS CLI; the original Amazon Linux AMI reached end of support on December 31, 2023.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-07e4a52ce41f", "source_question_ids": ["awssysops-p2-q371"], "statement": "Spot Instances let users take advantage of unused/excess EC2 capacity at prices below standard on-demand rates.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-dacf82662b38", "source_question_ids": ["awssysops-p2-q371"], "statement": "Spot Instances are best suited to time-flexible, interruption-tolerant, short-duration jobs rather than long-duration, highly transactional applications.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7089199ade53", "source_question_ids": ["awssysops-p2-q375"], "statement": "Before/while launching an EC2 instance, a user should plan the region, the instance type, and the AMI's OS.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fa8029d30141", "source_question_ids": ["awssysops-p2-q379"], "statement": "AMI stands for Amazon Machine Image, a template bundling OS, application server, and application configuration used to launch EC2 instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5a9c25766617", "source_question_ids": ["awssysops-p2-q379"], "statement": "\"Advanced Machine Instance\", \"Amazon Micro Instance\", and \"Advanced Machine Image\" are not valid expansions of the AMI acronym.", "status": "supported"}, {"claim_type": "rule", "conditions": ["at the EC2 API level; tag-based tooling can select targets by tag and supply the IDs for you"], "confidence": "medium", "id": "cl-cfe49f4df612", "source_question_ids": ["awssysops-p2-q380"], "statement": "You cannot stop, terminate, or delete an EC2 resource by selecting it solely by tag; the underlying API call still requires the actual resource identifier (e.g., an instance or snapshot ID).", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-b77eb316fb90", "source_question_ids": ["awssysops-p2-q380"] ccounts.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-272c63737176", "source_question_ids": ["awssysops-p2-q396"], "statement": "AMIs are not restricted to being created only by Amazon, and are not restricted to being created only for Linux instances.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-f6a8194311cd", "source_question_ids": ["awssysops-p2-q401"], "statement": "The default (soft) limit on Elastic IP addresses is 5 per region per EC2 account.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-1d3fb226dabf", "source_question_ids": ["awssysops-p2-q401"], "statement": "The default Elastic IP address limit can be raised via an AWS Support limit-increase request.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-3aadda5a2e15", "source_question_ids": ["awssysops-p2-q451", "awssysops-p2-q457"], "statement": "A placement group controls how EC2 instances are placed on underlying hardware; the cluster strategy targets low network latency and high network throughput, while the spread and partition strategies target reducing correlated hardware failures.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["placement group strategy is Cluster"], "confidence": "medium", "id": "cl-fb7fbc507a5c", "source_question_ids": ["awssysops-p2-q451"], "statement": "A Cluster placement group groups instances within a single Availability Zone.", "status": "supported"}, {"claim_type": "exception", "conditions": ["placement group strategy is Spread"], "confidence": "medium", "id": "cl-4aa56b0ac133", "source_question_ids": ["awssysops-p2-q451"], "statement": "A Spread placement group can span multiple Availability Zones, unlike a Cluster placement group.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-3b75 stained high CPU utilization, so triggering a restart from EC2 health checks does not address a CPU-utilization threshold condition.", "status": "supported"}, {"claim_type": "fact", "conditions": ["instance is a T-series/burstable instance type"], "confidence": "medium", "id": "cl-1b2c7c44636a", "source_question_ids": ["awssysops-p2-q535"], "statement": "In standard credit mode, a burstable (T-series) instance whose CPU credit balance reaches zero is throttled to its baseline CPU performance; in unlimited mode (the default for T3, T3a, and T4g), it keeps bursting using surplus credits that incur extra charges.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["instance is a T-series/burstable instance type"], "confidence": "medium", "id": "cl-4dbf7312cbb9", "source_question_ids": ["awssysops-p2-q535"], "statement": "Increasing the size of a burstable (T-series) instance raises its baseline CPU performance and credit-earn rate, helping address repeated CPU credit exhaustion.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-e7d69a12d5cc", "source_question_ids": ["awssysops-p2-q535"], "statement": "Configuring a CloudWatch alarm on the CPU credit balance metric can give early warning before credits are depleted, but does not by itself increase performance or resolve credit exhaustion.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-671e607cdd2d", "source_question_ids": ["awssysops-p2-q535"], "statement": "For a scenario where CPU credits have already dropped to zero repeatedly, the correct remediation (switch to a new instance family vs. resize vs. buy credits vs. alarm) is genuinely disputed in community commentary, with the question's boxed answer and the recorded community vote distribution disagreeing on one letter.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-36d5b6924a97", "source_question_ids": ["awssysops-p2-q536"], "statement": "A security group inbound rule scoped to a security group ID (rather than a CIDR) allows any instance that is itself a member of that referenced security group to connect, regardless of that instance's own source IP address.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-c0919852dba1", "source_question_ids": ["awssysops-p2-q536"], "statement": "Multiple inbound security group rules on the same port are additive: traffic is permitted if it matches any one of the rules, even if a different rule on the same port is more restrictive.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-aa1713222db9", "source_question_ids": ["awssysops-p2-q536"], "statement": "A security group rule opening a specific port (e.g., 389) to 0.0.0.0/0 does not grant access on a different port (e.g., 22); each rule only applies to its own specified port.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "high", "id": "cl-31615cfa6e51", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the AWS shared responsibility model, the customer is responsible for patching the guest OS on Amazon EC2 instances.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "medium", "id": "cl-f338ea79ab7e", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the shared responsibility model, the customer is responsible for choosing and configuring S3 encryption settings (such as SSE-KMS keys and bucket policies); since January 2023, S3 applies SSE-S3 to all new objects by default.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model"], "confidence": "medium", "id": "cl-2cc3b8bbc80b", "source_question_ids": ["awssysops-p2-q538"], "statement": "Under the AWS shared responsibility model, patching the underlying OS and database engine on Amazon RDS instances is typically framed as AWS/platform-managed, not the customer's responsibility.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS shared responsibility model", "AWS Elastic Beanstalk managed platform"], "confidence": "medium", "id": "cl-16c7c514ca27", "source_question_ids": ["awssysops-p2-q538"], "statement": "In AWS Elastic Beanstalk, AWS releases platform updates (OS and runtimes such as PHP), but the customer is responsible for applying them, either manually or by enabling managed platform updates.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-da3e68cfb49b", "source_question_ids": ["awssysops-p2-q542"], "statement": "The CloudWatch agent can be installed on both EC2 instances and on-premises servers to publish a consistent custom metric (e.g., MemoryUtilization) into the same CloudWatch namespace, giving a unified monitoring and alarming view regardless of where the server runs.", "status": "supported"}, {"claim_type": "default", "conditions": [], "confidence": "medium", "id": "cl-dcf0fba3cc52", "source_question_ids": ["awssysops-p2-q542"], "statement": "EC2's default (non-agent) CloudWatch metrics do not include memory utilization; collecting memory metrics requires installing the CloudWatch agent (or equivalent tooling).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-773e08d6e33b", "source_question_ids": ["awssysops-p2-q543"], "statement": "Amazon Inspector scans EC2 instances, Amazon ECR container images, and Lambda functions for vulnerabilities; it does not scan managed Amazon RDS databases.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-adecea7d7067", "source_question_ids": ["awssysops-p2-q543"], "statement": "Amazon CloudWatch metrics let an administrator directly compare resource usage, such as CPUUtilization, across application components like EC2 and RDS, to isolate which component is causing a performance bottleneck.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e2c0b1710a20", "source_question_ids": ["awssysops-p2-q543"], "statement": "AWS CloudTrail records API activity rather than resource usage, so it cannot be used to find which component is causing a high-CPU performance bottleneck.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-39e1fef53b1c", "source_question_ids": ["awssysops-p2-q543"], "statement": "Amazon EventBridge (formerly CloudWatch Events) routes state-change events rather than reporting ongoing resource usage trends, so it is not suited to diagnosing an ongoing CPU performance bottleneck.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-ecd138648e72", "source_question_ids": ["awssysops-p2-q558"], "statement": "Resource tagging lets automation (e.g., a Lambda function that stops EC2 instances nightly) identify and exclude specific instances from an action by filtering on the tag.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9ca0fd33a41d", "source_question_ids": ["awssysops-p2-q558"], "statement": "Amazon CloudWatch provides metrics and monitoring but offers no mechanism for a Lambda function to decide which specific EC2 instances to exclude from an automated action.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e5ff853f85f3", "source_question_ids": ["awssysops-p2-q558"], "statement": "AWS Config tracks resource configuration history rather than acting as a live selection filter for automation decisions.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7c8a85dc181a", "source_question_ids": ["awssysops-p2-q561", "awssysops-p3-1-q818"], "statement": "Spot Instances offer the deepest discount off On-Demand EC2 pricing among EC2 pricing models, making them well suited to workloads that can tolerate interruption.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9036bea4eb99", "source_question_ids": ["awssysops-p2-q561"], "statement": "An asynchronous nightly batch process whose output is only needed for later (e.g., weekly/monthly) reporting can tolerate interruption, since an interrupted run can simply be resubmitted within the reporting window.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-211ea4e83154", "source_question_ids": ["awssysops-p2-q561"], "statement": "For an interruption-tolerant, flexible-timing nightly batch workload, the question's boxed cost-optimization answer (On-Demand instances in an Auto Scaling group) conflicts with community commentary and a self-reversed vote favoring Spot Instances as more cost-effective.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-0d4b5c37c295", "source_question_ids": ["awssysops-p2-q563"], "statement": "Spot Instances with a specified duration (\"Spot blocks\") could run for a fixed period of up to 6 hours without early interruption, at a flat discounted hourly rate.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-1b82f17f2117", "source_question_ids": ["awssysops-p2-q563"], "statement": "AWS Lambda functions have a maximum execution time of 15 minutes per invocation.", "status": "supported"}, {"claim_type": "rule", "confidence": "high", "id": "cl-d3a9a2257212", "source_question_ids": ["awssysops-p2-q563"], "statement": "Reserved Instances are the cost-effective choice for an always-on application tier that runs continuously, as distinct from instances launched on demand only for the duration of a job.", "status": "supported"}, {"claim_type": "exception", "confidence": "medium", "id": "cl-a14ac8c042bc", "source_question_ids": ["awssysops-p2-q563"], "statement": "Spot Instances with a specified duration (\"Spot blocks\") were deprecated for new customers starting July 2021, with support for existing users continuing through December 2022.", "status": "supported"}, {"claim_type": "default", "confidence": "medium", "id": "cl-ccf8d7523a75", "source_question_ids": ["awssysops-p2-q563"], "statement": "In a present-day environment where Spot blocks are no longer available, On-Demand Instances are the safe non-interruptible choice for a job that cannot be interrupted.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bdfd0e7a36b4", "source_question_ids": ["awssysops-p2-q564"], "statement": "Amazon Machine Image (AMI) IDs are scoped to a single AWS Region; the same AMI ID string can refer to a different image, or no image at all, in another Region.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6ecda7d891a9", "source_question_ids": ["awssysops-p2-q564"], "statement": "Running an identical CloudFormation template with a hardcoded AMI ID in a different Region than the one it was authored for can fail with an \"image id does not exist\" error, because that AMI ID does not resolve in the new Region.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-259136ebf6fe", "source_question_ids": ["awssysops-p2-q565"], "statement": "The iam:PassRole permission allows a user to attach a specified IAM role to a resource they create (such as an EC2 instance), letting that resource run with the role's permissions; it does not let the user themselves assume or switch into that role.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-c23f2e24f3fe", "source_question_ids": ["awssysops-p2-q565"], "statement": "AssumeRole is a distinct IAM mechanism from PassRole: AssumeRole lets a principal temporarily switch to and operate as a role, which is a different capability than what an iam:PassRole permission grants.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0094447aef70", "source_question_ids": ["awssysops-p2-q565"], "statement": "An IAM policy combining ec2:* (full EC2 access) with iam:PassRole scoped to a role-name prefix (e.g., arn:aws:iam::ACCOUNT:role/InfraTeam*) lets a user launch an EC2 instance and attach any role matching that prefix to it.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-deab9a53d3fe", "source_question_ids": ["awssysops-p2-q565"], "statement": "For a policy granting ec2:* plus iam:PassRole scoped to a role-name prefix, the question's boxed answer (describing restricted role-switching, i.e., AssumeRole semantics) conflicts with a unanimous community vote favoring a different answer, reflecting a documented PassRole/AssumeRole confusion in the source discussion.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d7adda1d01d4", "source_question_ids": ["awssysops-p2-q576"], "statement": "An InsufficientInstanceCapacity error means AWS does not currently have enough On-Demand capacity for the requested EC2 instance type in the target Availability Zone.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-588003c152e7", "source_question_ids": ["awssysops-p2-q576"], "statement": "The fix for an InsufficientInstanceCapacity error is to retry the request, use a different instance type, or try a different Availability Zone or Region -- not to file an EC2 service-limit increase request or resize the instance.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5bc6c2e7f27e", "source_question_ids": ["awssysops-p2-q576", "awssysops-p2-q586"], "statement": "InsufficientInstanceCapacity is unrelated to an account's own concurrent-running-instance service limit, so requesting a service-limit increase does not resolve it.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-0833edeb7239", "source_question_ids": ["awssysops-p2-q576", "awssysops-p2-q586"], "statement": "InstanceLimitExceeded (an account-side service limit) and InsufficientInstanceCapacity (an AWS-side capacity shortage) are distinct error conditions with different causes and different fixes.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-617ac6560911", "source_question_ids": ["awssysops-p2-q577"], "statement": "An EC2 instance's subnet requires both an Internet Gateway attached to the VPC and a route table entry sending internet-bound traffic (0.0.0.0/0) to that gateway before the instance can reach the public internet.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6bcfffc8b541", "source_question_ids": ["awssysops-p2-q577"], "statement": "A virtual private gateway provides VPN/Direct Connect connectivity, not general internet access, so attaching one to a VPC does not give an EC2 instance's subnet internet access.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-57efff381817", "source_question_ids": ["awssysops-p2-q577"], "statement": "A VPC peering connection only connects two VPCs to each other; it does not by itself grant internet access to the peered VPC, even if the other VPC has its own Internet Gateway.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ccfb5ae67451", "source_question_ids": ["awssysops-p2-q577"], "statement": "Assigning a public IP address to a database instance does not affect the outbound internet connectivity of a separate web/application tier that cannot reach external services.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-091bd32207c8", "source_question_ids": ["awssysops-p2-q586"], "statement": "An InstanceLimitExceeded error means the account has reached its per-region concurrent running-instance (or vCPU) service limit.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-5f885602396b", "source_question_ids": ["awssysops-p2-q586"], "statement": "The fix for an InstanceLimitExceeded error is to request a limit increase from AWS Support or launch the instances in a different region, not to request them in smaller batches or specify a maximum instance count during provisioning.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6f83a181ed83", "source_question_ids": ["awssysops-p2-q597"], "statement": "AMIs can be shared with specific AWS account IDs via the console (Modify Image Permissions) or the CLI (modify-image-attribute --launch-permission), keeping the AMI private to only the intended accounts.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e63db3f47393", "source_question_ids": ["awssysops-p2-q597"], "statement": "Making an AMI 'publicly accessible' exposes it to every AWS customer, not just a specific set of intended accounts, so it is not an appropriate way to share an AMI only within one's own company's accounts.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-fc740f20688b", "source_question_ids": ["awssysops-p2-q597"], "statement": "Neither contacting AWS Support nor modifying an IAM role's permissions is a mechanism for sharing an AMI with other AWS accounts.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-050e70975e51", "source_question_ids": ["awssysops-p2-q599"], "statement": "Tag Editor, the GetResources API, and AWS Config rules in detective mode find untagged resources only after creation and do not block untagged launches; some Config rules (such as required-tags) can now also run in proactive mode before provisioning.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-cbf98df57a0a", "source_question_ids": ["awssysops-p2-q599"], "statement": "Proactive tagging controls act at creation time: CloudFormation and Service Catalog (TagOptions) apply tags as resources are provisioned, while IAM policy conditions (aws:RequestTag, aws:TagKeys) deny creation requests that lack the required tags.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["resources are provisioned through AWS Service Catalog products"], "confidence": "medium", "id": "cl-d6761c17cb10", "source_question_ids": ["awssysops-p2-q599"], "statement": "AWS Service Catalog's TagOptions Library can enforce a tagging taxonomy proactively when EC2 instances and EBS volumes are launched.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-0b0666c8c445", "source_question_ids": ["awssysops-p2-q599"], "statement": "For the real-time tagging-enforcement exam question, this dataset's boxed answer (manually searching for untagged resources with Tag Editor) is a reactive, manual process that no cited commenter endorses; the source's own embedded community vote splits only between two other proactive options and does not reach the 60% threshold, so the question is flagged disputed.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-467d8ab59f05", "source_question_ids": ["awssysops-p3-1-q610"], "statement": "CPUCreditBalance is a metric that tracks a burstable (T-family) instance's CPU credit balance, not its raw CPU utilization percentage, so an alarm intended to catch high raw CPU usage should be based on the CPUUtilization metric instead.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-07b8895979fb", "source_question_ids": ["awssysops-p3-1-q610"], "statement": "A CloudWatch alarm action set to 'terminate' destroys the instance rather than rebooting it, so it does not satisfy a requirement to automatically reboot an instance when a CPU threshold is breached.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-06e628e5f8aa", "source_question_ids": ["awssysops-p3-1-q621"], "statement": "If a CloudFormation stack successfully launches some instances of a given instance type and AMI before failing partway through, that proves the AMI was available in the target region, ruling out 'AMI not available in this region' as the cause of the partial launch failure.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-cc94ee414cba", "source_question_ids": ["awssysops-p3-1-q621"], "statement": "EC2 On-Demand quotas are vCPU-based limits per instance-family group, set per account per Region, so a lower vCPU quota in one Region can make a stack fail partway through and roll back there even though it succeeded in another Region.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9ed5545e6024", "source_question_ids": ["awssysops-p3-1-q621"], "statement": "An AWS Budgets threshold breach sends alerts/notifications but does not block API calls by default, so it would not by itself cause a CloudFormation stack launch to fail partway through.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-eec26ea7fcab", "source_question_ids": ["awssysops-p3-1-q621"], "statement": "For a CloudFormation stack that partially launches instances before failing, the question's boxed answer (AMI not available in the target region) conflicts with heavily-upvoted community commentary attributing the failure instead to a reached per-instance-type service limit in that region.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["traffic and utilization are constant and predictable"], "confidence": "high", "id": "cl-05dc8f528170", "source_question_ids": ["awssysops-p3-1-q627"], "statement": "Converting existing on-demand EC2 usage to Reserved Instances is a standard cost-optimization strategy for a workload with constant, predictable traffic and utilization over an extended period.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "low", "id": "cl-702b0192ea18", "source_question_ids": ["awssysops-p3-1-q627"], "statement": "Whether legacy instance types (e.g., m2) remain purchasable as Reserved Instances, versus requiring migration to a current-generation type first, is disputed in community commentary on cost-optimizing a long-running, stable EC2 workload.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-48e253d2580a", "source_question_ids": ["awssysops-p3-1-q695"], "statement": "Enabling termination protection on an EC2 instance is a built-in per-instance setting that blocks the TerminateInstances API call (including accidental console/CLI termination) until protection is explicitly disabled.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-b897ff462815", "source_question_ids": ["awssysops-p3-1-q695"], "statement": "AWS Systems Manager, AWS Config, and Amazon CloudWatch Events are not designed to intercept or block an EC2 instance termination action.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-08f95c5247aa", "source_question_ids": ["awssysops-p3-1-q697"], "statement": "EC2 On-Demand instance quotas are vCPU-based per instance-family group; raising one requires a quota-increase request through the Service Quotas console or
