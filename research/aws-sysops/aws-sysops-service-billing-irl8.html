<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

rs (e.g. 750*3 micro-instance hours).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fa6b824e302f", "source_question_ids": ["awssysops-p1-q135"], "statement": "Consolidated billing does not extend the AWS free usage tier's duration (e.g. to 3 years) for linked accounts.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "high", "id": "cl-6ab1f6c8020f", "source_question_ids": ["awssysops-p1-q138"], "statement": "Under AWS consolidated billing, the hourly cost benefit of a Reserved Instance purchased by one linked account is shared across all accounts on the consolidated bill, not locked to the purchasing account.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "high", "id": "cl-428e07582517", "source_question_ids": ["awssysops-p1-q138"], "statement": "A shared Reserved Instance discount under consolidated billing applies automatically to whichever single running instance in the account group matches the RI's instance size and Availability Zone, regardless of which specific linked account that instance is running in.", "status": "supported"}, {"claim_type": "fact", "conditions": ["only a single matching RI has been purchased"], "confidence": "high", "id": "cl-d9b6d386059f", "source_question_ids": ["awssysops-p1-q138"], "statement": "If only one Reserved Instance was purchased for a given size/AZ, only one matching running instance across the consolidated-billing account group gets the discounted rate at any given time; the rest are billed at the standard on-demand/blended rate.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6baee04a4093", "source_question_ids": ["awssysops-p1-q139"], "statement": "AWS Consolidated Billing lets multiple separate AWS accounts be billed together from one paying account while ment system.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-105d0e5625f9", "source_question_ids": ["awssysops-p1-q171"], "statement": "Cost allocation tags let a user label resources such as EC2 instances with categories (e.g. Production vs. Development), and AWS billing reports can then be broken out by those tags to separate costs within the same region.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-86cba4759f94", "source_question_ids": ["awssysops-p1-q171"], "statement": "There is no AWS feature called \"Cost Distribution Metadata\".", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7171d8e01efb", "source_question_ids": ["awssysops-p1-q171"], "statement": "A per-instance EC2 activity report does not provide cost data.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bae529ce18b3", "source_question_ids": ["awssysops-p1-q179"], "statement": "Joining AWS consolidated billing is payee-initiated: the payer (master) account sends the join request to the account that wants to be linked, not the other way around.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a89841719dfb", "source_question_ids": ["awssysops-p1-q179"], "statement": "Once a linked account accepts a consolidated billing invitation, the payer account becomes responsible for that linked account's charges.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4812c005fcfa", "source_question_ids": ["awssysops-p1-q179"], "statement": "Joining consolidated billing does not require contacting AWS support -- it is a direct account-to-account invitation flow.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-2b59bd136c3a", "source_question_ids" line items to departments in an external database is a higher-overhead alternative to using native cost allocation tags and Budgets.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6cf285927dfa", "source_question_ids": ["awssysops-p3-1-q720"], "statement": "The AWS Cost and Usage Report gives line-item-level detail on how Reserved Instance discounts are applied and allocated across the accounts in a consolidated bill.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6af55a0935d0", "source_question_ids": ["awssysops-p3-1-q720"], "statement": "AWS Organizations enables consolidated billing and Reserved Instance sharing across member accounts, but is not itself a reporting tool that shows RI discount allocation detail.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7373d18ab3fc", "source_question_ids": ["awssysops-p3-1-q720"], "statement": "AWS Budgets is for setting spending thresholds and alerts, not for detailed Reserved Instance allocation reporting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-97707593025e", "source_question_ids": ["awssysops-p3-1-q746"], "statement": "AWS Budgets lets teams set custom cost/usage thresholds and receive alerts via email, SNS, or Lambda as spending approaches or exceeds those preset limits.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b6cc10808254", "source_question_ids": ["awssysops-p3-1-q746"], "statement": "AWS Trusted Advisor checks for cost-optimization opportunities and service-limit/quota issues, but has no feature for configuring custom spending-threshold alerts.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["account is managed via AWS Organizations"], "confidence": "medium", "id": "cl-a88d8999b79d", "source_question_ids": ["awssysops-p3-1-q778"], "statement": "Only the master/payer account in an AWS Organization has access to the Cost Allocation Tags manager.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-b3b922a55d0b", "source_question_ids": ["awssysops-p3-1-q778"], "statement": "There is unresolved community disagreement over whether cost allocation tags must first be created via the AWS Tag Editor in the account where the resources actually live, or whether the Cost Allocation Tags manager in the payer account can create brand-new user-defined tags directly.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS Organizations with Consolidated Billing enabled"], "confidence": "high", "id": "cl-18025364a83a", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "For consolidated billing under AWS Organizations, billing alerts need to be enabled only once, in the payer (master) account's Billing and Cost Management console.", "status": "supported"}, {"claim_type": "rule", "conditions": ["AWS Organizations with Consolidated Billing enabled"], "confidence": "high", "id": "cl-1fd4103ad1ec", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "The actual billing alarm for consolidated billing must be created in Amazon CloudWatch, not inside the Billing and Cost Management console, and configured to publish to an SNS topic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-162e1a375f0b", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "Setting up billing alerts and alarms separately per member account is unnecessary under consolidated billing and defeats its purpose.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-be0792570b27", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "The Billing and Cost Management console does not have its own built-in alarm-creation mechanism separate from CloudWatch.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-fa51549cf92d", "source_question_ids": ["awssysops-p3-1-q823"], "statement": "Getting a per-project cost breakdown in AWS Cost Explorer requires first tagging the actual resources with a project identifier, then activating that tag as a cost allocation tag.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-876cf648469d", "source_question_ids": ["awssysops-p3-1-q823"], "statement": "AWS Budgets is a threshold-alerting tool for tracking spend against a budget; it does not itself produce a per-project cost breakdown inside Cost Explorer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-c46f8bc617cb", "source_question_ids": ["awssysops-p3-1-q823"], "statement": "AWS Organizations and AWS Trusted Advisor are unrelated to enabling a tag-based cost breakdown within a single account's Cost Explorer view.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e6ae3240b8f6", "source_question_ids": ["awssysops-p3-1-q828"], "statement": "Cost allocation tags are a labeling mechanism that feeds data into Cost Explorer and billing reports, rather than being a cost-analysis tool in their own right.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-85f234218dee", "source_question_ids": ["awssysops-p3-1-q828"], "statement": "AWS Cost Explorer is the tool for visualizing and drilling into cost and usage trends over time -- including breaking costs down by service, account, and time period -- to diagnose what is driving a rising AWS bill.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-6a6dc7baf991", "source_question_ids": ["awssysops-p3-1-q828"], "statement": "AWS resource groups are an organizational construct with no cost-analysis capability of their own.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-64e1d094c2f4", "source_question_ids": ["awssysops-p3-1-q838"], "statement": "The automatically-generated createdBy cost allocation tag attributes a resource's cost to the IAM identity that created it, and analyzing that tag dimension in Cost Explorer is the documented way to break down AWS spend by individual developer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c070ffefaf4b", "source_question_ids": ["awssysops-p3-1-q838"], "statement": "AWS Trusted Advisor surfaces high-level cost-optimization best-practice checks (idle or underutilized resources), not per-user cost attribution.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e17214ff25ff", "source_question_ids": ["awssysops-p3-1-q838"], "statement": "An AWS Budgets alert notifies when spend crosses a threshold, optionally filtered by tag, service, or linked account, but it does not itself produce a per-developer cost breakdown.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-aec4e46d8460", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "AWS Cost Explorer's built-in rightsizing recommendations report identifies specific underutilized EC2 instances and calculates the estimated cost savings for each one in a single ready-made report.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-29e53a827de9", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "Raw Amazon CloudWatch metrics supply utilization numbers (such as CPU) but have no built-in feature to calculate or surface an estimated cost-savings figure.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-7a993b4e324e", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "AWS Budgets has no per-instance EC2 rightsizing analysis feature.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-963f8cc19d49", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "A custom AWS Systems Manager script to check EC2 memory utilization would need to be written and maintained from scratch, the opposite of a minimal-effort approach.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-badb8840de3c", "source_question_ids": ["awssysops-p3-1-q856"], "statement": "Within a shared AWS account, cost reports can attribute spend to departments only if resources carry a department tag that is activated as a cost allocation tag.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e652e4bb327a", "source_question_ids": ["awssysops-p3-1-q856"], "statement": "AWS Budgets is built for threshold alerting, not for recurring usage reporting by department.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-20b18df216fb", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "A resource tag must be explicitly activated as a cost allocation tag in the AWS Billing and Cost Management console before Cost Explorer will offer it as a filter or group-by dimension -- simply tagging the resources is not sufficient.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f85eb3e982b6", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "AWS tag key names support dashes (-).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-50b9f28b7c85", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "EC2 tags persist through an instance reboot; they are not tied to the instance's running state.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-8f31fd8a223a", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "A permissions gap that would block Cost Explorer access typically blocks all billing data access, not just visibility of one specific tag.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-billing-cost-management--m-1", "title": "The AWS billing pipeline: label, aggregate, then report, analyze, or alert", "purpose": "Lets you route any billing question to the one AWS feature whose job it is, instead of picking a plausible-sounding service that only touches cost data indirectly.", "mechanism": "AWS cost data flows through four stages. (1) Attribution: costs are attributed to an account automatically, and to anything finer (project, department, environment, developer) only through resource tags that are explicitly activated as cost allocation tags in the Billing and Cost Management console. Tagging a resource is not enough; until the tag is activated, Cost Explorer and the reports cannot group by it. Tag keys must be unique (max 128 chars), values may repeat across keys (max 256 chars). (2) Aggregation: consolidated billing (via AWS Organizations) rolls every linked account into one payer bill. The payer sees each linked account's itemized charges, but no resources. Usage is pooled before tiered pricing applies, and a Reserved Instance discount floats to any matching instance in any linked account. It does not multiply free-tier hours or extend the free tier. (3) Consumption: the same data is surfaced three ways. The Cost and Usage Report is a raw line-item export (CSV to S3, refreshed up to daily) for custom billing systems, spreadsheets, and RI-allocation detail. Cost Explorer is the free interactive view: graphs, filter/group by service, account, or activated tag, forecasts, RI coverage/utilization, rightsizing savings. AWS Budgets and CloudWatch billing alarms are threshold alerts that only notify when spend crosses a limit. (4) Everything else (Trusted Advisor, CloudTrail, Health Dashboard, raw CloudWatch metrics, IAM cross-account roles) sits outside the pipeline: best-practice checks, API logs, service health, or access delegation, never cost attribution or reporting.", "predict_prompt": "A team tags every EC2 instance with Project=Alpha, but the next day Cost Explorer has no Project group-by option. Before reading on: what step was skipped, and in which account does it have to happen if the team is a member of an AWS Organization?", "invariants": ["Finer-than-account cost attribution always means activated cost allocation tags; no tag activation, no breakdown.", "Consolidated billing pools usage and RI benefits across accounts but grants the payer billing visibility only, never resource access.", "Alerting tools (Budgets, CloudWatch billing alarms) notify on thresholds; they never produce a breakdown or report.", "Under consolidated billing, billing alerts are enabled once in the payer account, and the alarm itself is created in CloudWatch on EstimatedCharges, publishing to SNS."], "limits": ["Several claims describe legacy mechanisms (Programmatic Billing Access, the Monthly Cost Allocation Report, high/medium/low-utilization RIs, ELB in the free tier) that have since been replaced by Cost and Usage Reports/Data Exports, Cost Explorer, and Savings Plans/Standard/Convertible RIs. Answer the question as written, but expect the modern name in newer items.", "Whether the payer account can create brand-new user-defined tags directly in the Cost Allocation Tags manager, or only activate tags already applied via Tag Editor, is disputed in the source discussion.", "Reserved Instances only pay off above the breakeven (roughly 2,200-2,500 hours/year for the cheapest legacy tier); a ~3 hours/day workload stays cheaper on demand."], "cues": ["\"per project/department/developer within one account\" -> activate cost allocation tags (createdBy for per-developer)", "\"visualize, trend, forecast, drill down, rightsizing savings\" -> Cost Explorer", "\"daily, CSV, spreadsheet, custom billing system, S3, RI allocation line items\" -> Cost and Usage Report", "\"alert when spend approaches/exceeds a limit\" -> AWS Budgets or CloudWatch billing alarm (tiered thresholds for advance warning)", "\"multiple accounts, one bill, volume discounts, shared RIs\" -> consolidated billing", "Made-up names (\"AWS Cost Manager\", \"Cost Distribution Metadata\") are always wrong"], "claim_ids": ["cl-20b18df216fb", "cl-fa51549cf92d", "cl-badb8840de3c", "cl-105d0e5625f9", "cl-a033b2466aa7", "cl-2226f841e577", "cl-e6ae3240b8f6", "cl-5f1993421836", "cl-114948eb5418", "cl-933839c700bd", "cl-bc3b7d48156a", "cl-64e1d094c2f4", "cl-2b59bd136c3a", "cl-a88d8999b79d", "cl-b3b922a55d0b", "cl-c290b246af6a", "cl-ce83ab1ea990", "cl-6baee04a4093", "cl-9b8a7d70c38f", "cl-6ab1f6c8020f", "cl-428e07582517", "cl-d9b6d386059f", "cl-e88686792175", "cl-fa6b824e302f", "cl-bae529ce18b3", "cl-a89841719dfb", "cl-8c7b5cf41243", "cl-bd4324c6febe", "cl-cbc4069883ad", "cl-6cf285927dfa", "cl-2024d8b6a822", "cl-6dbfdcc50059", "cl-1072c3607dba", "cl-2501b45f46b3", "cl-66f1698a33bf", "cl-85f234218dee", "cl-aec4e46d8460", "cl-97707593025e", "cl-69c5ba0eae92", "cl-18025364a83a", "cl-1fd4103ad1ec", "cl-be0792570b27", "cl-ae1c96579b9d", "cl-7b4b48e03eb3", "cl-bc0f1c92a00a", "cl-f4bc36e8ede4", "cl-748996b4d97c", "cl-f1cc8ab7637a", "cl-50ae14b19ea6", "cl-6b9124405cc4", "cl-2e8c8fb99dd0", "cl-86cba4759f94"]}, "contrastSet": {"id": "aws-sysops-service-billing-cost-management--cs-1", "subjects": ["AWS Cost Explorer", "AWS Cost and Usage Report", "AWS Budgets / CloudWatch billing alarm", "AWS Trusted Advisor"], "dimensions": ["Output it produces", "Interactive analysis and forecasting", "Threshold alerting", "Breakdown by activated tag / account", "Typical stem cue"], "shared_traits": ["All appear in cost-related questions and can be filtered or scoped by account or tag in some way", "None of them can attribute cost to a project or department until the relevant tag is activated as a cost allocation tag (Trusted Advisor never does)"], "matrix": {"Output it produces": {"AWS Cost Explorer": "Interactive graphs and ready-made reports in the console", "AWS Cost and Usage Report": "Raw line-item CSV export delivered to S3", "AWS Budgets / CloudWatch billing alarm": "Email/SNS notification when a threshold is crossed", "AWS Trusted Advisor": "Best-practice check results (idle resources, service limits)"}, "Interactive analysis and forecasting": {"AWS Cost Explorer": "Yes: trends, drill-down, forecasts, RI coverage, rightsizing savings", "AWS Cost and Usage Report": "No: historical data you parse or open yourself", "AWS Budgets / CloudWatch billing alarm": "No", "AWS Trusted Advisor": "No"}, "Threshold alerting": {"AWS Cost Explorer": "No", "AWS Cost and Usage Report": "No", "AWS Budgets / CloudWatch billing alarm": "Yes: its whole purpose", "AWS Trusted Advisor": "No custom spend thresholds"}, "Breakdown by activated tag / account": {"AWS Cost Explorer": "Yes: filter/group by service, account, tag", "AWS Cost and Usage Report": "Yes: line-item detail, including RI allocation per account", "AWS Budgets / CloudWatch billing alarm": "Scope filter only; no breakdown report", "AWS Trusted Advisor": "No per-user or per-department attribution"}, "Typical stem cue": {"AWS Cost Explorer": "\"visualize\", \"forecast\", \"what is driving the bill\"", "AWS Cost and Usage Report": "\"daily\", \"spreadsheet\", \"custom billing system\", \"S3\"", "AWS Budgets / CloudWatch billing alarm": "\"notify when spend exceeds\"", "AWS Trusted Advisor": "\"best-practice\", \"underutilized\" with no tool needed"}}, "decision_rule": "Decide on the deliverable the stem asks for. If it wants to look at and explore spend (graphs, trends, forecasts, per-tag breakdown, rightsizing savings), pick Cost Explorer. If it wants a raw data file to feed into something else (daily CSV in S3, spreadsheet, custom billing system, RI line items), pick the Cost and Usage Report. If it wants to be told when spend crosses a limit, pick Budgets or a CloudWatch billing alarm. Trusted Advisor is only right when the stem asks for best-practice checks, never a cost breakdown, forecast, or custom alert.", "boundary_flip": "Take \"the finance team needs a per-department breakdown of costs they can explore and forecast\" (Cost Explorer, after activating a department cost allocation tag). Change it to \"the finance team needs an email the moment a department's spend reaches 80% of its limit\" and the answer becomes AWS Budgets scoped to that tag. Change it again to \"the finance team needs a daily CSV of every charge to load into their own spreadsheet\" and it becomes the Cost and Usage Report delivered to S3.", "strongest_distractor_failure": "AWS Budgets looks right for per-department or per-developer questions because it can be filtered by tag, service, or linked account. But it only fires threshold notifications and never produces the breakdown itself. Learners who see \"tag\" and \"cost\" together pick Budgets when the stem asks for a report or analysis, which is a Cost Explorer or Cost and Usage Report job.", "exceptions": ["When the stem asks for both a per-department breakdown and threshold alerts within a single account, the answer combines activated cost allocation tags with an AWS Budget scoped to those tags.", "When each project already has its own AWS account, per-account billing alarms give per-project granularity without any tagging (source discussion is split).", "A CloudWatch billing alarm is still created in CloudWatch (on EstimatedCharges, to SNS), even though billing alerts are switched on in the payer account's Billing console."], "claim_ids": ["cl-1072c3607dba", "cl-2501b45f46b3", "cl-66f1698a33bf", "cl-85f234218dee", "cl-aec4e46d8460", "cl-64f819ff54d9", "cl-8c7b5cf41243", "cl-bd4324c6febe", "cl-cbc4069883ad", "cl-6cf285927dfa", "cl-2024d8b6a822", "cl-97707593025e", "cl-7373d18ab3fc", "cl-876cf648469d", "cl-e17214ff25ff", "cl-e652e4bb327a", "cl-6dae862d9ca5", "cl-7a993b4e324e", "cl-96e8aaee8201", "cl-ae1c96579b9d", "cl-7b4b48e03eb3", "cl-b6cc10808254", "cl-c070ffefaf4b", "cl-dc44dbf2f127", "cl-fceca31e873d", "cl-0ef04755ba70", "cl-1fd4103ad1ec", "cl-18025364a83a", "cl-0483fd6f292c", "cl-c6fb40e4a56c"]}, "scenarioFamily": {"id": "aws-sysops-service-billing-cost-management--sf-1", "canonical": {"prompt": "A finance team on a single AWS account has already tagged every resource with a Department tag. They want to explore spending trends by department and forecast future costs, drilling down over time. What should they do, and which console view will they use to see the breakdown?", "expected_answer": ["Activate the tag as a cost allocation tag in the AWS Billing and Cost Management console", "View the per-tag cost breakdown, trends, and forecast in AWS Cost Explorer"], "reasoning": "Tagging alone isn't enough -- a resource tag must be explicitly activated as a cost allocation tag before Cost Explorer can offer it as a filter or group-by dimension (cl-20b18df216fb). Once activated, cost allocation tagging lets costs be broken down by dimensions like department without restructuring accounts (cl-a033b2466aa7). AWS Cost Explorer is the free interactive tool for visualizing spend, filterable/groupable by activated tag (cl-1072c3607dba), with a built-in forecasting feature (cl-2501b45f46b3) for drilling into trends over time (cl-85f234218dee).", "distractor_analysis": "AWS Budgets can also be scoped by tag, but it only sends threshold notifications -- it never produces an interactive breakdown or forecast (cl-876cf648469d).", "claim_ids": ["cl-20b18df216fb", "cl-a033b2466aa7", "cl-1072c3607dba", "cl-2501b45f46b3", "cl-85f234218dee", "cl-876cf648469d"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The requirement flips from exploring/forecasting spend to receiving an alert the moment department spend crosses a threshold (80% of the limit), rather than viewing a breakdown.", "prompt": "Same finance team, same activated Department cost allocation tag -- but now they want an email the moment a department's spend reaches 80% of its monthly limit, not a dashboard to explore. What should they set up?", "expected_answer": ["Create an AWS Budget scoped to the activated Department cost allocation tag, with a notification threshold at 80% of the limit"], "reasoning": "This flips the deliverable from exploration/forecast to threshold alerting, which is the one job AWS Budgets (or a CloudWatch billing alarm) does (cl-97707593025e). Combining the already-activated tag with a Budget scoped to that tag satisfies a per-department alert inside a single account (cl-fceca31e873d). Setting the threshold below 100% (e.g. 80%) gives advance warning before the limit is actually hit (cl-69c5ba0eae92).", "claim_ids": ["cl-97707593025e", "cl-fceca31e873d", "cl-69c5ba0eae92"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "Added that the company also runs AWS CloudTrail for API-activity auditing; this detail does not change which tool handles the cost breakdown.", "prompt": "Same finance team and activated Department tag. The company also runs AWS CloudTrail to audit API calls across its environment. They still want to explore spending trends by department and forecast future costs. What should they do, and where will they view the breakdown?", "expected_answer": ["Activate the tag as a cost allocation tag in the AWS Billing and Cost Management console", "View the per-tag cost breakdown, trends, and forecast in AWS Cost Explorer"], "reasoning": "CloudTrail logs API activity, not cost or usage data (cl-bc0f1c92a00a), so it plays no role in this decision -- the answer is unchanged from the canonical case: activate the tag, then use Cost Explorer to view trends and forecasts (cl-20b18df216fb, cl-1072c3607dba, cl-2501b45f46b3).", "claim_ids": ["cl-bc0f1c92a00a", "cl-20b18df216fb", "cl-1072c3607dba", "cl-2501b45f46b3"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A colleague proposes using AWS Budgets, filtered by the Department tag, to generate the per-department breakdown report instead of Cost Explorer.", "prompt": "Same finance team and activated Department tag. A colleague suggests just creating an AWS Budget filtered by the Department tag to produce the breakdown report they need to explore and forecast. Is that the right tool, and if not, what should they do instead?", "expected_answer": ["Activate the tag as a cost allocation tag in the AWS Billing and Cost Management console", "View the per-tag cost breakdown, trends, and forecast in AWS Cost Explorer"], "reasoning": "AWS Budgets can be filtered by tag, service, or linked account, but it only produces threshold alerts -- it does not itself produce a breakdown or report (cl-e17214ff25ff, cl-876cf648469d, cl-7373d18ab3fc). Exploring and forecasting spend is Cost Explorer's job (cl-1072c3607dba, cl-2501b45f46b3), once the tag is activated (cl-20b18df216fb).", "distractor_analysis": "AWS Budgets is the strongest distractor here because it can be scoped by the same activated tag the learner just set up, but its entire purpose is threshold notification, never an explorable or forecastable breakdown -- a learner who pattern-matches on 'tag' + 'cost' picks it anyway.", "claim_ids": ["cl-e17214ff25ff", "cl-876cf648469d", "cl-7373d18ab3fc", "cl-1072c3607dba", "cl-2501b45f46b3", "cl-20b18df216fb"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The attribution dimension changes from a manually-applied Department tag to the automatically-generated createdBy tag, breaking down spend by individual developer instead of by department.", "prompt": "A different team on the same single AWS account wants to break down spend by individual developer instead of department, using the automatically-generated createdBy tag that attributes each resource's cost to the IAM identity that created it. They want to explore and forecast this breakdown the same way. What should they do?", "expected_answer": ["Activate the tag as a cost allocation tag in the AWS Billing and Cost Management console", "View the per-tag cost breakdown, trends, and forecast in AWS Cost Explorer"], "reasoning": "The same mental model transfers to a new attribution dimension: the createdBy tag is auto-generated per resource but still must be explicitly activated as a cost allocation tag before Cost Explorer can group by it (cl-64e1d094c2f4, cl-20b18df216fb), and Cost Explorer remains the tool for exploring and forecasting that breakdown regardless of which tag is being analyzed (cl-1072c3607dba, cl-2501b45f46b3).", "claim_ids": ["cl-64e1d094c2f4", "cl-20b18df216fb", "cl-1072c3607dba", "cl-2501b45f46b3"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "cl-4985342712b5 (from q031) says consolidating billing across accounts works against per-project budget tracking. cl-6baee04a4093 (from q139) and cl-c290b246af6a (from q063) say consolidated billing still gives an itemized per-account cost report and lets you separate costs by account. When each project has its own account, these source questions disagree on whether consolidated billing helps or hurts per-project cost tracking. Nothing resolves the conflict, and both claims are marked supported.", "related_entity_ids": ["cl-4985342712b5", "cl-6baee04a4093", "cl-c290b246af6a", "cl-0ef04755ba70"]}, {"type": "contradiction", "severity": "medium", "description": "cl-bae529ce18b3 contradicts itself. It calls joining consolidated billing 'payee-initiated', then says the payer (master) account sends the join request, which makes it payer-initiated. A learner could memorize the wrong direction from the label.", "related_entity_ids": ["cl-bae529ce18b3"]}, {"type": "contradiction", "severity": "medium", "description": "The mental model limits say a ~3 hours/day workload 'stays cheaper on demand', which follows cl-50ae14b19ea6 ('on-demand pricing remains cheaper than any RI tier'). But cl-748996b4d97c, also listed in the model's claim_ids, says Scheduled Reserved Instances were introduced specifically for short, predictable daily usage windows. That undercuts 'any RI tier'. Scheduled RIs are also no longer offered, so cl-748996b4d97c is a stale-risk statement in its own right.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--m-1", "cl-50ae14b19ea6", "cl-748996b4d97c", "cl-f1cc8ab7637a"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model limits list 'ELB in the free tier' as a legacy mechanism that has since been replaced. That settles a conflicted claim: cl-6b9124405cc4 is marked conflicted, and the only counter-evidence is one commenter's argument. The dispute should be flagged rather than resolved in favour of the commenter.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--m-1", "cl-6b9124405cc4"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The mental model predict_prompt asks which account must activate the tag inside an AWS Organization, implying the answer is the payer account. That rests on cl-a88d8999b79d, which is still needs-review, and on the adjacent cl-b3b922a55d0b, which records unresolved community disagreement. The prompt presents an unverified answer as settled.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--m-1", "cl-a88d8999b79d", "cl-b3b922a55d0b"]}, {"type": "unsupported-generation", "severity": "medium", "description": "Several claims marked conflicted appear in the mental model mechanism/cues and the contrast-set matrix as settled facts, with no caveat. They are: Cost Explorer rightsizing savings (cl-aec4e46d8460), Cost Explorer as the bill-trend drill-down tool (cl-85f234218dee), Budgets alerts via email/SNS/Lambda (cl-97707593025e), Trusted Advisor having no custom spend thresholds (cl-b6cc10808254), and tiered thresholds for advance warning (cl-69c5ba0eae92). Also: the tag-activation requirements behind the invariant 'no tag activation, no breakdown' (cl-fa51549cf92d, cl-badb8840de3c), and createdBy as the documented per-developer method (cl-64e1d094c2f4). The source disagreement is erased instead of surfaced.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--m-1", "aws-sysops-service-billing-cost-management--cs-1", "cl-aec4e46d8460", "cl-85f234218dee", "cl-97707593025e", "cl-b6cc10808254", "cl-69c5ba0eae92", "cl-fa51549cf92d", "cl-badb8840de3c", "cl-64e1d094c2f4"]}, {"type": "unsupported-generation", "severity": "low", "description": "The first contrast-set exception states 'tags plus a tag-scoped Budget' as the answer for a combined breakdown-plus-alert stem. Its only source, cl-fceca31e873d, is still needs-review, and the related OU objection (cl-97f2b8ada31e) is also needs-review. The exception should carry the unverified status.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--cs-1", "cl-fceca31e873d", "cl-97f2b8ada31e"]}, {"type": "ambiguity", "severity": "medium", "description": "The contrast set's 'Typical stem cue' for Trusted Advisor includes 'underutilized'. cl-aec4e46d8460 (q844) routes 'identify underutilized EC2 instances and estimated savings' to Cost Explorer rightsizing, and the Cost Explorer row and decision rule also claim rightsizing. So the 'underutilized' cue points to two different subjects. The qualifier 'with no tool needed' is unclear and does not settle which one to pick.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--cs-1", "cl-aec4e46d8460", "cl-c070ffefaf4b", "cl-7b4b48e03eb3"]}, {"type": "unsupported-generation", "severity": "low", "description": "The contrast set merges AWS Budgets and CloudWatch billing alarms into one subject, and its shared_traits say every subject 'can be filtered or scoped by account or tag in some way'. No claim supports tag-scoping for CloudWatch billing alarms or Trusted Advisor. Tag/service/linked-account filtering is only claimed for Budgets (cl-e17214ff25ff). So the 'Scope filter only' cell and that shared trait overstate what CloudWatch billing alarms and Trusted Advisor can do.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--cs-1", "cl-e17214ff25ff", "cl-ae1c96579b9d"]}, {"type": "quality", "severity": "low", "description": "The mental model mechanism says the Cost and Usage Report is 'refreshed up to daily', meaning at most daily. The source claim cl-8c7b5cf41243 says it publishes 'at least once per day'. The paraphrase reverses the frequency bound.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--m-1", "cl-8c7b5cf41243"]}], "sourceQuestionCount": 32}], "sources": {"kind": "locked", "file": "aws-sysops-service-billing-irl8.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });

      var correctCount = attempted.filter(function (a) { return a.correct; }).length;

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
        <h3>Expected answer</h3>
        ${raw(expectedAnswerHtml)}
      </div>
      ${raw(reasoning)}
      ${raw(distractors)}
      ${raw(citationsHtml(item.claim_ids))}
      <div id="self-report" class="self-report ${raw(isMulti ? 'hidden' : '')}">
        <p>Compare your answer with the expected answer, then mark it.</p>
        <div class="actions">
          <button type="button" class="secondary" id="self-correct">I got it right</button>
          <button type="button" class="secondary" id="self-incorrect">I got it wrong</button>
        </div>
      </div>
      <p id="practice-result" class="result hidden" role="status"></p>
      <div class="actions"><button id="practice-next-btn" type="button" disabled>${isLast ? 'Finish queue' : 'Next item'}</button></div>`;

    if (isMulti) {
      section.querySelectorAll('.choices label').forEach(function (label) {
        var value = label.querySelector('input').value;
        if (expected.indexOf(value) !== -1) label.classList.add('is-expected');
        else if (predicted.indexOf(value) !== -1) label.classList.add('is-wrong');
      });
    }

    function showResult(isCorrect) {
      var el = revealBox.querySelector('#practice-result');
      var lead = isMulti ? (isCorrect ? 'Correct.' : 'Not quite.') : (isCorrect ? 'Marked correct.' : 'Marked wrong.');
      el.innerHTML = isCorrect
        ? safe`${lead}`
        : safe`${lead} Logged for <a href="${sliceHref('diagnose')}">Diagnose</a>.`;
      el.classList.remove('hidden');
      el.classList.add(isCorrect ? 'result-ok' : 'result-bad');
    }

    function finalizeAttempt(isCorrect) {
      attempt.correct = isCorrect;
      attempt.diagnosis = isCorrect ? null : 'pending';
      STATE.attempts.push(attempt);
      saveState();
      showResult(isCorrect);
      var nextBtn = revealBox.querySelector('#practice-next-btn');
      nextBtn.removeAttribute('disabled');
      if (!isMulti) nextBtn.focus({ preventScroll: true });
    }

    if (isMulti) {
      finalizeAttempt(correct);
    } else {
      revealBox.querySelector('#self-correct').addEventListener('click', function () {
        finalizeAttempt(true);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
      revealBox.querySelector('#self-incorrect').addEventListener('click', function () {
        finalizeAttempt(false);
        revealBox.querySelector('#self-report').classList.add('hidden');
      });
    }

    revealBox.querySelector('#practice-next-btn').addEventListener('click', function () {
      practiceIndex += 1;
      navigate();
    });
  }

  // ---------- Diagnose ----------

  function renderDiagnose() {
    var pending = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; });
    var history = STATE.attempts.filter(function (a) { return a.diagnosis && a.diagnosis !== 'pending'; });

    var pendingHtml = pending.length
      ? pending.map(function (a) {

    var historyHtml = history.length
      ? safe`<ul class="diagnosis-history">${raw(history.map(function (a) {
          var cat = DIAGNOSIS_CATEGORIES.find(function (c) { return c.key === a.diagnosis; });

    var html = safe`
