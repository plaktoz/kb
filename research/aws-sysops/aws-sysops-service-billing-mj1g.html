<script type="application/json" id="ekd-data">{"bundleSchemaVersion": 2, "exam": "aws-sysops", "facetKeys": ["service"], "slices": [{"contentSet": {"id": "aws-sysops-service-billing-cost-management", "exam": "aws-sysops", "facet": {"key": "service", "value": "Billing & cost management", "grouped": true, "group_index": 1, "group_count": 1, "grouped_values": ["Billing", "Cost Explorer", "Cost and Usage Reports", "Cost Allocation Tags", "Budgets", "Cost Management"], "group": "billing"}, "schemaVersion": 1}, "sourceQuestions": [], "claims": [{"claim_type": "fact", "conditions": ["each project has its own dedicated AWS account"], "confidence": "medium", "id": "cl-0ef04755ba70", "source_question_ids": ["awssysops-p1-q031"], "statement": "When each project already has its own dedicated AWS account, per-account CloudWatch billing alerts already provide per-project cost granularity without needing resource tagging.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-69c5ba0eae92", "source_question_ids": ["awssysops-p1-q031"], "statement": "Tiered billing alert thresholds (e.g., notifications at 50%, 80%, and 90% of budgeted spend) give advance warning before a budget is exceeded, unlike a single alert threshold set exactly at the budget amount, which only fires once the limit has already been reached.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9f1983113df2", "source_question_ids": ["awssysops-p1-q031"], "statement": "Consolidating accounts into a single bill does not alert on or prevent overspending against per-project budgets (the bill still breaks costs down by linked account), so on its own it cannot ensure budgets are not exceeded.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2e8ac056c0f6", "source_question_ids": ["awssysops-p1-q031"], "statement": "Auto Scaling CloudWatch alarms based on running instance count do not map reliably to actual cost.", "status": "supported"}, {"claim_type": "fact", "conditions": ["at question authoring time"], "confidence": "high", "id": "cl-c4930e48322c", "source_question_ids": ["awssysops-p1-q056"], "statement": "At the time this question was written, the AWS Free Tier included 750 hours per month of a micro EC2 instance.", "status": "supported"}, {"claim_type": "fact", "conditions": ["at question authoring time"], "confidence": "medium", "id": "cl-6b9124405cc4", "source_question_ids": ["awssysops-p1-q056"], "statement": "At the time this question was written, the AWS Free Tier included 750 hours per month of Elastic Load Balancer usage, though a commenter argues ELB is no longer free-tier-eligible under current AWS terms.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["at question authoring time"], "confidence": "high", "id": "cl-30875c43704b", "source_question_ids": ["awssysops-p1-q056"], "statement": "At the time this question was written, the AWS Free Tier included several GB of S3 storage.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-60cfc466348a", "source_question_ids": ["awssysops-p1-q056"], "statement": "Provisioned IOPS (PIOPS) EBS volumes were never included in the AWS Free Tier at any size, so they incur charges as soon as they are created.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c290b246af6a", "source_question_ids": ["awssysops-p1-q063"], "statement": "In AWS consolidated billing, the payer (master) account can view the AWS billing details of each linked account, not just the combined total.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ce83ab1ea990", "source_question_ids": ["awssysops-p1-q063"], "statement": "In AWS consolidated billing, the payer account's visibility is limited to billing data only -- it does not grant access to the linked accounts' resources.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-75afc7e2883a", "source_question_ids": ["awssysops-p1-q063"], "statement": "Linked accounts in a consolidated billing arrangement do not need to create any special AWS billing policy to participate.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-6dbfdcc50059", "source_question_ids": ["awssysops-p1-q074"], "statement": "Legacy programmatic billing access was set up by enabling the monthly billing report, naming an S3 bucket to hold it, and enabling programmatic access; today the equivalent is an AWS Cost and Usage Report (Data Exports) delivered to an S3 bucket.", "status": "conflicted"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-c0564490716a", "source_question_ids": ["awssysops-p1-q074"], "statement": "AWS billing alerts are a separate CloudWatch feature (threshold-based cost alarms) and are not part of the programmatic billing access setup flow.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1072c3607dba", "source_question_ids": ["awssysops-p1-q099"], "statement": "AWS Cost Explorer visualizes historical and forecasted AWS spending as interactive graphs, filterable by service or resource tag, and is included free in the Billing and Cost Management console.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2e8c8fb99dd0", "source_question_ids": ["awssysops-p1-q099"], "statement": "\"AWS Cost Manager\" is not a real AWS service name.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ae1c96579b9d", "source_question_ids": ["awssysops-p1-q099", "awssysops-p3-1-q838"], "statement": "Amazon CloudWatch primarily monitors operational and performance metrics; it exposes an EstimatedCharges billing metric for billing alarms but is not a spend-visualization tool like Cost Explorer.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-aebad13892cf", "source_question_ids": ["awssysops-p1-q099"], "statement": "AWS Consolidated Billing aggregates billing across multiple linked accounts into a single invoice, but it is not itself a spend-visualization tool the way Cost Explorer is.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-5f1993421836", "source_question_ids": ["awssysops-p1-q114"], "statement": "AWS cost allocation tags require a unique key per tag, but the value may repeat across different keys without causing a conflict.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-114948eb5418", "source_question_ids": ["awssysops-p1-q114"], "statement": "Because InstanceName and CostCenter are distinct tag keys, each is reported as its own cost allocation dimension with the value HR, so both tags apply and appear correctly in cost allocation reports even though they share a value.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-8e91646eff3e", "source_question_ids": ["awssysops-p1-q114"], "statement": "InstanceName is not a reserved or disallowed AWS tag key.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9b8a7d70c38f", "source_question_ids": ["awssysops-p1-q135"], "statement": "Consolidated billing aggregates usage across all linked accounts before applying AWS's volume/tiered pricing (e.g. for S3 storage), letting the combined usage reach lower-priced tiers sooner than if each account were billed separately.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e88686792175", "source_question_ids": ["awssysops-p1-q135"], "statement": "Consolidated billing does not grant each linked account a separate fixed multiple of the EC2 free-tier instance hours (e.g. 750*3 micro-instance hours).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fa6b824e302f", "source_question_ids": ["awssysops-p1-q135"], "statement": "Consolidated billing does not extend the AWS free usage tier's duration (e.g. to 3 years) for linked accounts.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "high", "id": "cl-6ab1f6c8020f", "source_question_ids": ["awssysops-p1-q138"], "statement": "Under AWS consolidated billing, the hourly cost benefit of a Reserved Instance purchased by one linked account is shared across all accounts on the consolidated bill, not locked to the purchasing account.", "status": "supported"}, {"claim_type": "rule", "conditions": ["accounts are joined via consolidated billing"], "confidence": "medium", "id": "cl-428e07582517", "source_question_ids": ["awssysops-p1-q138"], "statement": "A shared Reserved Instance discount under consolidated billing applies automatically to whichever single running instance in the account group matches the RI's instance size and Availability Zone, regardless of which specific linked account that instance is running in.", "status": "supported"}, {"claim_type": "fact", "conditions": ["only a single matching RI has been purchased"], "confidence": "medium", "id": "cl-d9b6d386059f", "source_question_ids": ["awssysops-p1-q138"], "statement": "If only one Reserved Instance was purchased for a given size/AZ, only one matching running instance across the consolidated-billing account group gets the discounted rate at any given time; the rest are billed at the standard on-demand/blended rate.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6baee04a4093", "source_question_ids": ["awssysops-p1-q139"], "statement": "AWS Consolidated Billing lets multiple separate AWS accounts be billed together from one paying account while still producing a detailed, itemized cost report for each individual account, enabling cost separation by account.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f4bc36e8ede4", "source_question_ids": ["awssysops-p1-q139"], "statement": "IAM cross-account roles are a mechanism for delegating access between AWS accounts, not a billing or cost-separation mechanism.", "status": "supported"}, {"claim_type": "fact", "conditions": ["legacy utilization-based RI tiers"], "confidence": "medium", "id": "cl-d6855c612c30", "source_question_ids": ["awssysops-p1-q141"], "statement": "Under the legacy utilization-based RI tiers (retired in 2014), even the cheapest Light Utilization tier broke even against On-Demand only at roughly 2,200-2,500 hours of usage per year.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["instance runs only ~3 hours/day"], "confidence": "high", "id": "cl-50ae14b19ea6", "source_question_ids": ["awssysops-p1-q141"], "statement": "Running an instance for about 3 hours per day (roughly 1,100 hours per year) falls well short of the Reserved Instance breakeven point, so on-demand pricing remains cheaper than any RI tier for that usage pattern.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-5f25a200b624", "source_question_ids": ["awssysops-p1-q141"], "statement": "AWS retired the Heavy/Medium/Light Utilization RI tiers (replaced by Standard and Convertible RIs, and later Savings Plans); Scheduled Reserved Instances once targeted recurring daily windows but are no longer available for purchase.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-933839c700bd", "source_question_ids": ["awssysops-p1-q150"], "statement": "The maximum length of an AWS resource tag key is 128 Unicode characters.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bc3b7d48156a", "source_question_ids": ["awssysops-p1-q150"], "statement": "The maximum length of an AWS resource tag value is 256 Unicode characters.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-0c1d77245793", "source_question_ids": ["awssysops-p1-q150"], "statement": "A claimed maximum tag key length of 64 Unicode characters is incorrect.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b6d6902fd77d", "source_question_ids": ["awssysops-p1-q150"], "statement": "AWS tags are key-value pairs that can be applied to many resource types, including S3 buckets.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2226f841e577", "source_question_ids": ["awssysops-p1-q150"], "statement": "AWS tags are the mechanism behind cost allocation reporting / cost distribution of resources.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-2024d8b6a822", "source_question_ids": ["awssysops-p1-q158"], "statement": "To build a custom billing system, deliver AWS Cost and Usage Reports (Data Exports) to an S3 bucket and parse them, or query the Cost Explorer API; Programmatic Billing Access with S3-delivered CSV billing files was the legacy mechanism.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c0db2de3f53e", "source_question_ids": ["awssysops-p1-q158"], "statement": "Downloading per-service usage reports from the billing console through a billing API was not the legacy programmatic billing mechanism, which delivered CSV reports to S3; today the Cost Explorer API does return per-service cost and usage data programmatically.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5acbf105e0b3", "source_question_ids": ["awssysops-p1-q158"], "statement": "AWS CloudWatch alarm data is unrelated to building a custom AWS billing management system.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-105d0e5625f9", "source_question_ids": ["awssysops-p1-q171"], "statement": "Cost allocation tags let a user label resources such as EC2 instances with categories (e.g. Production vs. Development), and AWS billing reports can then be broken out by those tags to separate costs within the same region.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-86cba4759f94", "source_question_ids": ["awssysops-p1-q171"], "statement": "There is no AWS feature called \"Cost Distribution Metadata\".", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7171d8e01efb", "source_question_ids": ["awssysops-p1-q171"], "statement": "A per-instance EC2 activity report does not provide cost data.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bae529ce18b3", "source_question_ids": ["awssysops-p1-q179"], "statement": "Joining AWS consolidated billing is payee-initiated: the payer (master) account sends the join request to the account that wants to be linked, not the other way around.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-a89841719dfb", "source_question_ids": ["awssysops-p1-q179"], "statement": "Once a linked account accepts a consolidated billing invitation, the payer account becomes responsible for that linked account's charges.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4812c005fcfa", "source_question_ids": ["awssysops-p1-q179"], "statement": "Joining consolidated billing does not require contacting AWS support -- it is a direct account-to-account invitation flow.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-2b59bd136c3a", "source_question_ids": ["awssysops-p2-q336"], "statement": "A tag-based cost report requires activating the user-defined tags on the Cost allocation tags page of the Billing and Cost Management console (formerly 'Manage report tags' on Billing Preferences); the legacy Monthly Cost Allocation Report is superseded by Cost and Usage Reports and Cost Explorer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7c02ef66cfe5", "source_question_ids": ["awssysops-p2-q336"], "statement": "Generating a Monthly Cost Allocation Report does not require a custom AWS Lambda function paired with a DynamoDB table to read and store resource tag metadata.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6dae862d9ca5", "source_question_ids": ["awssysops-p2-q336"], "statement": "The AWS Budgets \"Include costs related to Tags\" feature is for budget threshold alerts, not for generating a cost allocation report.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-eef98f8014ff", "source_question_ids": ["awssysops-p2-q336"], "statement": "Using AWS CloudTrail to export events for specified resources is unrelated to generating a cost allocation tag report.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a5adf66adce7", "source_question_ids": ["awssysops-p2-q503"], "statement": "IAM-based access control for AWS Billing and Cost Management can restrict access to invoices, detailed information about charges and account activity, budgets, payment methods, and credits — a broader set of controllable items than payment methods alone, invoices alone, or charge/activity information alone.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a033b2466aa7", "source_question_ids": ["awssysops-p2-q534"], "statement": "Implementing cost allocation tagging in the Billing and Cost Management console lets costs be broken down by arbitrary dimensions like project and environment without restructuring AWS accounts, creating new AWS Organizations units, or changing how resources are deployed and run.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8c7b5cf41243", "source_question_ids": ["awssysops-p3-1-q623"], "statement": "AWS Cost and Usage Reports can be configured to publish detailed billing data to an S3 bucket at least once per day, far more frequently than the account's default monthly invoice.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bd4324c6febe", "source_question_ids": ["awssysops-p3-1-q623"], "statement": "AWS Cost and Usage Reports can be delivered in CSV format, which opens directly in standard spreadsheet applications.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-2501b45f46b3", "source_question_ids": ["awssysops-p3-1-q633"], "statement": "AWS Cost Explorer includes a built-in forecasting feature that projects expenses for the current and future billing periods based on historical spend.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7b4b48e03eb3", "source_question_ids": ["awssysops-p3-1-q633", "awssysops-p3-1-q720", "awssysops-p3-1-q746", "awssysops-p3-1-q828", "awssysops-p3-1-q844"], "statement": "AWS Trusted Advisor focuses on best-practice checks (such as cost-optimization recommendations and service-limit issues), not on interactive cost visualization or billing forecasting.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c6fb40e4a56c", "source_question_ids": ["awssysops-p3-1-q633"], "statement": "Amazon QuickSight is a general-purpose BI tool that could visualize cost data but is not AWS's built-in billing forecasting tool.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-64f819ff54d9", "source_question_ids": ["awssysops-p3-1-q633"], "statement": "The AWS Cost and Usage Report is a raw historical data export, not an interactive forecasting view.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-66f1698a33bf", "source_question_ids": ["awssysops-p3-1-q644"], "statement": "AWS Cost Explorer can filter and group EC2 usage data by department via cost allocation tags, and includes dedicated Reserved Instance coverage and utilization reports.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4032737df70b", "source_question_ids": ["awssysops-p3-1-q644"], "statement": "The AWS Health Dashboard (formerly the Personal Health Dashboard) reports on AWS service health events, not resource usage or cost.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-2e53346922cf", "source_question_ids": ["awssysops-p3-1-q644"], "statement": "AWS Service Catalog manages approved product catalogs, not usage or cost reporting.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f41b77f6702e", "source_question_ids": ["awssysops-p3-1-q644"], "statement": "AWS Application Discovery Service is for planning on-premises-to-cloud migrations, not usage or cost reporting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cbc4069883ad", "source_question_ids": ["awssysops-p3-1-q656"], "statement": "A daily AWS Cost and Usage Report can be downloaded from Amazon S3 to produce a granular, shareable daily view of spending.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0483fd6f292c", "source_question_ids": ["awssysops-p3-1-q656"], "statement": "The monthly AWS bill does not provide daily cost granularity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bc0f1c92a00a", "source_question_ids": ["awssysops-p3-1-q656"], "statement": "AWS CloudTrail logs API activity, not cost or usage data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-96e8aaee8201", "source_question_ids": ["awssysops-p3-1-q656"], "statement": "Amazon CloudWatch billing alerts only fire threshold-based notifications; they do not produce a detailed daily spending report.", "status": "supported"}, {"claim_type": "rule", "conditions": ["single AWS account (not multi-account AWS Organizations)"], "confidence": "medium", "id": "cl-fceca31e873d", "source_question_ids": ["awssysops-p3-1-q675"], "statement": "Applying cost allocation tags per department combined with an AWS Budget scoped to those tags (with notification thresholds) can satisfy both a per-department cost breakdown and a spending threshold-alert requirement within a single AWS account.", "status": "needs-review"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-97f2b8ada31e", "source_question_ids": ["awssysops-p3-1-q675"], "statement": "AWS Organizations Organizational Units are a multi-account construct, which some practitioners argue makes them inapplicable for structuring departments within a single AWS account.", "status": "needs-review"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-dc44dbf2f127", "source_question_ids": ["awssysops-p3-1-q675"], "statement": "AWS Trusted Advisor's Cost Optimization pillar report does not itself provide a per-department cost breakdown or threshold-based alert notifications.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-e6b387333c94", "source_question_ids": ["awssysops-p3-1-q675"], "statement": "Downloading a detailed billing report and manually matching line items to departments in an external database is a higher-overhead alternative to using native cost allocation tags and Budgets.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6cf285927dfa", "source_question_ids": ["awssysops-p3-1-q720"], "statement": "The AWS Cost and Usage Report gives line-item-level detail on how Reserved Instance discounts are applied and allocated across the accounts in a consolidated bill.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-6af55a0935d0", "source_question_ids": ["awssysops-p3-1-q720"], "statement": "AWS Organizations enables consolidated billing and Reserved Instance sharing across member accounts, but is not itself a reporting tool that shows RI discount allocation detail.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7373d18ab3fc", "source_question_ids": ["awssysops-p3-1-q720"], "statement": "AWS Budgets is for setting spending thresholds and alerts, not for detailed Reserved Instance allocation reporting.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-97707593025e", "source_question_ids": ["awssysops-p3-1-q746"], "statement": "AWS Budgets lets teams set custom cost/usage thresholds and receive alerts via email, SNS, or Lambda as spending approaches or exceeds those preset limits.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b6cc10808254", "source_question_ids": ["awssysops-p3-1-q746"], "statement": "AWS Trusted Advisor checks for cost-optimization opportunities and service-limit/quota issues, but has no feature for configuring custom spending-threshold alerts.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["account is managed via AWS Organizations"], "confidence": "medium", "id": "cl-a88d8999b79d", "source_question_ids": ["awssysops-p3-1-q778"], "statement": "Only the master/payer account in an AWS Organization has access to the Cost Allocation Tags manager.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "low", "id": "cl-b3b922a55d0b", "source_question_ids": ["awssysops-p3-1-q778"], "statement": "There is unresolved community disagreement over whether cost allocation tags must first be created via the AWS Tag Editor in the account where the resources actually live, or whether the Cost Allocation Tags manager in the payer account can create brand-new user-defined tags directly.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS Organizations with Consolidated Billing enabled"], "confidence": "medium", "id": "cl-18025364a83a", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "For consolidated billing under AWS Organizations, billing alerts need to be enabled only once, in the payer (master) account's Billing and Cost Management console.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["AWS Organizations with Consolidated Billing enabled"], "confidence": "medium", "id": "cl-56ddf081abd7", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "A CloudWatch billing alarm on the EstimatedCharges metric (us-east-1, management account) can publish to an SNS topic when consolidated charges exceed a threshold; AWS Budgets is the Billing-console alternative.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-162e1a375f0b", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "Setting up billing alerts and alarms separately per member account is unnecessary under consolidated billing and defeats its purpose.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-b67bc515a0f4", "source_question_ids": ["awssysops-p3-1-q782"], "statement": "CloudWatch billing alarms are created in CloudWatch, but the Billing and Cost Management console has its own alerting through AWS Budgets (and Cost Anomaly Detection), which can notify via email or SNS.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-fa51549cf92d", "source_question_ids": ["awssysops-p3-1-q823"], "statement": "Getting a per-project cost breakdown in AWS Cost Explorer requires first tagging the actual resources with a project identifier, then activating that tag as a cost allocation tag.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-876cf648469d", "source_question_ids": ["awssysops-p3-1-q823"], "statement": "AWS Budgets is a threshold-alerting tool for tracking spend against a budget; it does not itself produce a per-project cost breakdown inside Cost Explorer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-c46f8bc617cb", "source_question_ids": ["awssysops-p3-1-q823"], "statement": "AWS Organizations and AWS Trusted Advisor are unrelated to enabling a tag-based cost breakdown within a single account's Cost Explorer view.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-e6ae3240b8f6", "source_question_ids": ["awssysops-p3-1-q828"], "statement": "Cost allocation tags are a labeling mechanism that feeds data into Cost Explorer and billing reports, rather than being a cost-analysis tool in their own right.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-85f234218dee", "source_question_ids": ["awssysops-p3-1-q828"], "statement": "AWS Cost Explorer is the tool for visualizing and drilling into cost and usage trends over time -- including breaking costs down by service, account, and time period -- to diagnose what is driving a rising AWS bill.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-6a6dc7baf991", "source_question_ids": ["awssysops-p3-1-q828"], "statement": "AWS resource groups are an organizational construct with no cost-analysis capability of their own.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-64e1d094c2f4", "source_question_ids": ["awssysops-p3-1-q838"], "statement": "The automatically-generated createdBy cost allocation tag attributes a resource's cost to the IAM identity that created it, and analyzing that tag dimension in Cost Explorer is the documented way to break down AWS spend by individual developer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c070ffefaf4b", "source_question_ids": ["awssysops-p3-1-q838"], "statement": "AWS Trusted Advisor surfaces high-level cost-optimization best-practice checks (idle or underutilized resources), not per-user cost attribution.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e17214ff25ff", "source_question_ids": ["awssysops-p3-1-q838"], "statement": "An AWS Budgets alert notifies when spend crosses a threshold, optionally filtered by tag, service, or linked account, but it does not itself produce a per-developer cost breakdown.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-aec4e46d8460", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "AWS Cost Explorer's built-in rightsizing recommendations report identifies specific underutilized EC2 instances and calculates the estimated cost savings for each one in a single ready-made report.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-29e53a827de9", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "Raw Amazon CloudWatch metrics supply utilization numbers (such as CPU) but have no built-in feature to calculate or surface an estimated cost-savings figure.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-7a993b4e324e", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "AWS Budgets has no per-instance EC2 rightsizing analysis feature.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-963f8cc19d49", "source_question_ids": ["awssysops-p3-1-q844"], "statement": "A custom AWS Systems Manager script to check EC2 memory utilization would need to be written and maintained from scratch, the opposite of a minimal-effort approach.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-badb8840de3c", "source_question_ids": ["awssysops-p3-1-q856"], "statement": "Within a shared AWS account, cost reports can attribute spend to departments only if resources carry a department tag that is activated as a cost allocation tag.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e652e4bb327a", "source_question_ids": ["awssysops-p3-1-q856"], "statement": "AWS Budgets is built for threshold alerting, not for recurring usage reporting by department.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-20b18df216fb", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "A resource tag must be explicitly activated as a cost allocation tag in the AWS Billing and Cost Management console before Cost Explorer will offer it as a filter or group-by dimension -- simply tagging the resources is not sufficient.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f85eb3e982b6", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "AWS tag key names support dashes (-).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-50b9f28b7c85", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "EC2 tags persist through an instance reboot; they are not tied to the instance's running state.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-8f31fd8a223a", "source_question_ids": ["awssysops-p3-1-q928"], "statement": "A permissions gap that would block Cost Explorer access typically blocks all billing data access, not just visibility of one specific tag.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-billing-cost-management--m-1", "title": "The AWS cost pipeline: label, aggregate, then pick the tool for the output you need", "purpose": "Answer billing questions by locating where the requirement sits in one pipeline: how cost is attributed (tags or accounts), how accounts are combined (consolidated billing), and which tool turns that data into the required output (analysis, alert, raw export, or recommendation).", "mechanism": "Every AWS charge is a line item tagged with an account and, optionally, user-defined or AWS-generated tags. Attribution happens one of two ways. If each project has its own account, the account is the cost dimension. Inside a shared account, you need tags on the actual resources, and each tag must be activated as a cost allocation tag in the Billing console (the payer account does this under Organizations) before reports or Cost Explorer can group by it. Tags are just key-value labels: keys must be unique, values can repeat, keys can be up to 128 characters and values up to 256. Consolidated billing then rolls linked accounts up into one payer. The payer sees an itemized bill for each account but cannot reach their resources. Combined usage hits volume pricing tiers sooner, and a Reserved Instance discount applies to one matching running instance anywhere in the group. It does not multiply the free tier or stop overspending. That data feeds four separate outputs. Cost Explorer covers interactive analysis: graphs, group-by tag or service, forecasts, RI coverage, and rightsizing savings. AWS Budgets and CloudWatch EstimatedCharges alarms cover alerts when spend crosses a threshold, and you set them up once in the payer account. Cost and Usage Reports deliver raw line-item CSV files to S3 at least daily, for custom billing systems or spreadsheets. Trusted Advisor gives best-practice checks.", "predict_prompt": "A company runs Production and Development EC2 instances in one account, and finance wants a monthly breakdown by environment plus an email when Development spend passes 80% of its budget. Before reading on, predict which steps and tools are needed and in what order.", "invariants": ["A tag shows up in Cost Explorer or cost reports only after it has been activated as a cost allocation tag. Tagging the resources alone is not enough.", "Consolidated billing combines and itemizes charges. It never stops overspending, extends the free tier, or gives access to linked accounts' resources.", "A Reserved Instance discount covers one matching running instance at a time, in whichever linked account that instance happens to run.", "Alerting tools (Budgets, CloudWatch billing alarms) only notify when a threshold is crossed. They do not produce breakdowns or reports.", "Analysis tools (Cost Explorer) and raw exports (Cost and Usage Reports) do not alert on thresholds."], "limits": ["Many questions describe legacy mechanisms (Programmatic Billing Access, the Monthly Cost Allocation Report, Light/Medium/Heavy RI tiers). Their modern equivalents are Cost and Usage Reports, the cost allocation tags page, and Standard/Convertible RIs or Savings Plans.", "Free Tier details depend on when a question was written. Provisioned IOPS EBS volumes were never free-tier eligible.", "Some sources still dispute whether a new user-defined tag has to be created on the resources before the payer can activate it."], "cues": ["'visualize', 'forecast', 'drill into what's driving the bill', 'rightsizing savings', 'RI coverage' -> Cost Explorer", "'notify when spend approaches or exceeds', 'threshold', 'SNS/email alert' -> AWS Budgets or a CloudWatch EstimatedCharges alarm in the payer account", "'daily', 'line-item', 'CSV in S3', 'build a custom billing system', 'how RI discounts were allocated' -> Cost and Usage Report", "'break down by project, department, or environment in one account' -> tag the resources and activate them as cost allocation tags", "'separate bills per account, one payer, volume discounts, shared RIs' -> consolidated billing", "'best-practice checks, idle resources, service limits' -> Trusted Advisor (not threshold alerts or per-user attribution)"], "claim_ids": ["cl-20b18df216fb", "cl-fa51549cf92d", "cl-badb8840de3c", "cl-105d0e5625f9", "cl-a033b2466aa7", "cl-2226f841e577", "cl-e6ae3240b8f6", "cl-5f1993421836", "cl-933839c700bd", "cl-bc3b7d48156a", "cl-a88d8999b79d", "cl-0ef04755ba70", "cl-c290b246af6a", "cl-ce83ab1ea990", "cl-6baee04a4093", "cl-9b8a7d70c38f", "cl-6ab1f6c8020f", "cl-428e07582517", "cl-d9b6d386059f", "cl-e88686792175", "cl-fa6b824e302f", "cl-9f1983113df2", "cl-1072c3607dba", "cl-2501b45f46b3", "cl-66f1698a33bf", "cl-aec4e46d8460", "cl-85f234218dee", "cl-97707593025e", "cl-56ddf081abd7", "cl-18025364a83a", "cl-8c7b5cf41243", "cl-bd4324c6febe", "cl-2024d8b6a822", "cl-6cf285927dfa", "cl-7b4b48e03eb3", "cl-6dbfdcc50059", "cl-2b59bd136c3a", "cl-5f25a200b624", "cl-60cfc466348a", "cl-b3b922a55d0b"]}, "contrastSet": {"id": "aws-sysops-service-billing-cost-management--cs-1", "subjects": ["AWS Cost Explorer", "AWS Budgets / CloudWatch billing alarm", "Cost and Usage Report", "AWS Trusted Advisor"], "dimensions": ["Output produced", "Breaks costs down by tag/account", "Fires threshold alerts", "Typical trigger phrase"], "shared_traits": ["All read the same billing data, and any tag-based slicing depends on activated cost allocation tags", "All are native, low-effort options compared with custom scripts or external databases"], "matrix": {"Output produced": {"AWS Cost Explorer": "Interactive graphs, forecasts, RI coverage, rightsizing savings", "AWS Budgets / CloudWatch billing alarm": "Email/SNS notification when spend crosses a threshold", "Cost and Usage Report": "Raw line-item CSV files delivered to S3 (at least daily)", "AWS Trusted Advisor": "Best-practice checks (idle resources, service limits)"}, "Breaks costs down by tag/account": {"AWS Cost Explorer": "Yes, filter and group by service, account, or tag", "AWS Budgets / CloudWatch billing alarm": "No, can scope by tag but produces no breakdown", "Cost and Usage Report": "Yes, at line-item level (you parse it)", "AWS Trusted Advisor": "No"}, "Fires threshold alerts": {"AWS Cost Explorer": "No", "AWS Budgets / CloudWatch billing alarm": "Yes, tiered thresholds such as 50/80/90%", "Cost and Usage Report": "No", "AWS Trusted Advisor": "No custom spend-threshold alerts"}, "Typical trigger phrase": {"AWS Cost Explorer": "'visualize', 'forecast', 'what is driving the bill'", "AWS Budgets / CloudWatch billing alarm": "'notify before/when budget is exceeded'", "Cost and Usage Report": "'daily detail', 'spreadsheet', 'custom billing system'", "AWS Trusted Advisor": "'best-practice recommendations'"}}, "decision_rule": "Choose based on the output the requirement asks for. A threshold-crossing notification calls for Budgets or a CloudWatch billing alarm. Interactive analysis, a forecast, or a breakdown calls for Cost Explorer. A raw line-item file for your own processing calls for the Cost and Usage Report. Generic best-practice recommendations call for Trusted Advisor.", "boundary_flip": "Say the requirement is 'show finance a per-department breakdown of last quarter's spend'. The answer is Cost Explorer, grouped by an activated department tag. Change it to 'email finance when a department's spend reaches 80% of its budget' and the answer becomes an AWS Budget scoped to that tag, with a notification threshold.", "strongest_distractor_failure": "AWS Budgets is the most tempting wrong answer for breakdown questions because it can be filtered by tag. But it only alerts on thresholds and produces no per-project, per-department, or per-developer breakdown. Trusted Advisor is tempting for 'cost' questions, but it has no custom spend alerts and no per-user attribution.", "exceptions": ["When one requirement asks for both a breakdown and an alert, the answer combines cost allocation tags with a Budget scoped to those tags.", "Line-item detail on how RI discounts were allocated across consolidated accounts comes from the Cost and Usage Report, not from Organizations or Budgets.", "Cost Explorer is the ready-made way to get rightsizing savings. Raw CloudWatch metrics show utilization but do not calculate savings."], "claim_ids": ["cl-1072c3607dba", "cl-2501b45f46b3", "cl-66f1698a33bf", "cl-85f234218dee", "cl-aec4e46d8460", "cl-97707593025e", "cl-56ddf081abd7", "cl-69c5ba0eae92", "cl-96e8aaee8201", "cl-8c7b5cf41243", "cl-bd4324c6febe", "cl-cbc4069883ad", "cl-64f819ff54d9", "cl-6cf285927dfa", "cl-7b4b48e03eb3", "cl-b6cc10808254", "cl-dc44dbf2f127", "cl-c070ffefaf4b", "cl-876cf648469d", "cl-e17214ff25ff", "cl-e652e4bb327a", "cl-7373d18ab3fc", "cl-6dae862d9ca5", "cl-7a993b4e324e", "cl-fceca31e873d", "cl-29e53a827de9", "cl-ae1c96579b9d", "cl-20b18df216fb"]}, "scenarioFamily": {"id": "aws-sysops-service-billing-cost-management--sf-1", "canonical": {"prompt": "A company runs its Production and Development EC2 instances in a single shared AWS account. Finance wants two things: (1) a monthly cost breakdown by department, and (2) an email notification when Development's spend reaches 80% of its allocated budget. What should the sysops admin do?", "expected_answer": ["Apply a department cost allocation tag to the resources (e.g., Department=Development, Department=Production)", "Activate that tag as a cost allocation tag in the AWS Billing and Cost Management console", "Create an AWS Budget scoped to the Department tag with a notification threshold at 80% of the Development budget"], "reasoning": "Within one shared account, cost reports can only attribute spend to departments if the resources carry a department tag that has been activated as a cost allocation tag (cl-badb8840de3c, cl-105d0e5625f9). Activation is a separate console step from simply tagging the resources (cl-20b18df216fb). Combining that activated tag with an AWS Budget scoped to the tag satisfies both the breakdown requirement and the threshold-alert requirement in a single account (cl-fceca31e873d), and a tiered/percentage threshold like 80% gives advance warning before the budget is exceeded (cl-69c5ba0eae92). More broadly, cost allocation tagging is the native mechanism for breaking costs down by arbitrary dimensions like department without restructuring accounts (cl-a033b2466aa7).", "distractor_analysis": "A tempting incomplete answer is to create the AWS Budget scoped to the Department tag and stop there, assuming it will also surface a breakdown -- but Budgets only alerts on thresholds and does not itself produce a per-department or per-project cost breakdown (cl-876cf648469d, cl-e17214ff25ff). Another tempting but incomplete answer is tagging the EC2 instances and treating that as sufficient, which leaves Cost Explorer and billing reports unable to use the tag until it is activated (cl-20b18df216fb).", "claim_ids": ["cl-fceca31e873d", "cl-105d0e5625f9", "cl-20b18df216fb", "cl-69c5ba0eae92", "cl-badb8840de3c", "cl-a033b2466aa7", "cl-876cf648469d", "cl-e17214ff25ff"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "Production and Development now run in their own dedicated AWS accounts (one account per department) joined under consolidated billing with one payer account, instead of sharing a single account.", "prompt": "Same finance request -- a monthly breakdown by department and an email at 80% of budget -- but now Production and Development each run in their own dedicated AWS account, joined together under consolidated billing with one payer account. What should the sysops admin do?", "expected_answer": ["Skip department cost allocation tags for this purpose -- the dedicated-account structure already gives per-department billing granularity", "Use the payer account's view of each linked account's itemized charges in the consolidated bill instead of relying on tags", "Set a CloudWatch EstimatedCharges billing alarm (or an AWS Budget) scoped to the Development account for the 80% notification threshold"], "reasoning": "When each project or department already has its own dedicated AWS account, per-account billing data already provides per-department granularity without needing resource tagging (cl-0ef04755ba70). Under consolidated billing, the payer account can view the itemized billing detail of each linked account, not just the combined total (cl-c290b246af6a), so the breakdown requirement is already met structurally. A tiered or percentage threshold such as 80% is still needed to give advance warning before the Development account's budget is exceeded (cl-69c5ba0eae92), so the alerting step still has to be set up.", "distractor_analysis": "It's tempting to still reach for department cost allocation tags as in the single-account case, but when each department already has its own dedicated account, the account itself is the cost dimension and tagging adds unnecessary overhead (cl-0ef04755ba70).", "claim_ids": ["cl-0ef04755ba70", "cl-c290b246af6a", "cl-69c5ba0eae92"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "irrelevant-detail", "changed_condition": "The account also has an active AWS Trusted Advisor Business-support subscription with weekly cost-optimization reviews -- an unrelated detail that does not change the required steps.", "prompt": "Same single-account setup: Production and Development EC2 instances need a monthly cost breakdown by department and an email when Development spend hits 80% of budget. The team also has an active AWS Trusted Advisor Business-support subscription and reviews its weekly cost-optimization checks. What should the sysops admin do to meet finance's two requirements?", "expected_answer": ["Apply a department cost allocation tag to the resources (e.g., Department=Development, Department=Production)", "Activate that tag as a cost allocation tag in the AWS Billing and Cost Management console", "Create an AWS Budget scoped to the Department tag with a notification threshold at 80% of the Development budget"], "reasoning": "Trusted Advisor focuses on best-practice checks such as cost-optimization recommendations and service-limit issues, not on breakdown reporting or custom spend-threshold alerting (cl-7b4b48e03eb3). Its presence changes nothing about the tag-activate-Budget steps needed to satisfy finance's two requirements.", "distractor_analysis": "A test-taker might assume the Trusted Advisor subscription is relevant, or even that its weekly checks already satisfy the alerting requirement, but Trusted Advisor has no feature for configuring custom spending-threshold alerts (cl-7b4b48e03eb3) -- the tag-activation-plus-Budget steps are still required in full.", "claim_ids": ["cl-fceca31e873d", "cl-105d0e5625f9", "cl-20b18df216fb", "cl-69c5ba0eae92", "cl-7b4b48e03eb3"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "The admin has already applied the Department tag directly to the EC2 instances and assumes that alone is sufficient for Cost Explorer to group by it, skipping the Cost Allocation Tags console activation step.", "prompt": "Same single-account setup. The admin has already applied a Department=Development tag (and Department=Production) directly to the EC2 instances, and argues that's sufficient -- Cost Explorer should already be able to group costs by Department, so the only remaining step is creating the 80%-threshold Budget. Is the admin right, and what should actually be done?", "expected_answer": ["Apply a department cost allocation tag to the resources (e.g., Department=Development, Department=Production)", "Activate that tag as a cost allocation tag in the AWS Billing and Cost Management console", "Create an AWS Budget scoped to the Department tag with a notification threshold at 80% of the Development budget"], "reasoning": "The admin is wrong: a resource tag must be explicitly activated as a cost allocation tag in the AWS Billing and Cost Management console before Cost Explorer will offer it as a filter or group-by dimension -- simply tagging the resources is not sufficient (cl-20b18df216fb). Getting a per-project or per-department breakdown in Cost Explorer specifically requires first tagging the resources and then activating that tag as a cost allocation tag (cl-fa51549cf92d), and the Budget step is still needed on top of that to satisfy the alert requirement (cl-fceca31e873d).", "distractor_analysis": "The adversarial claim that tagging alone is enough is the strongest distractor here, because it sounds complete -- the resources are correctly labeled -- but AWS requires a separate activation step before any report or Cost Explorer view can use that tag as a dimension (cl-20b18df216fb, cl-fa51549cf92d), and a tiered threshold is still needed for timely warning before the budget is exceeded (cl-69c5ba0eae92).", "claim_ids": ["cl-20b18df216fb", "cl-fa51549cf92d", "cl-fceca31e873d", "cl-69c5ba0eae92"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The cost driver being tracked is S3 storage buckets instead of EC2 instances, within the same single-account setup, but the two requirements (department breakdown, 80% budget alert) are unchanged.", "prompt": "Finance comes back with the same two requirements -- a monthly breakdown and an 80%-of-budget email alert -- but this time for S3 storage costs split by department, in the same single AWS account, rather than for the EC2 instances. What should the sysops admin do?", "expected_answer": ["Apply a department cost allocation tag to the resources (e.g., Department=Development, Department=Production)", "Activate that tag as a cost allocation tag in the AWS Billing and Cost Management console", "Create an AWS Budget scoped to the Department tag with a notification threshold at 80% of the Development budget"], "reasoning": "The tag-activate-Budget pipeline is a mechanism for cost allocation, not something tied to a particular resource type: AWS tags are key-value pairs that can be applied to many resource types, including S3 buckets (cl-b6d6902fd77d), and tags remain the underlying mechanism behind cost allocation reporting regardless of what they're attached to (cl-2226f841e577). Cost allocation tagging lets costs be broken down by arbitrary dimensions like department without restructuring accounts or changing how resources are deployed (cl-a033b2466aa7), and within a single shared account the same tag-plus-Budget combination still satisfies both the breakdown and the threshold-alert requirement (cl-fceca31e873d).", "distractor_analysis": "One might assume S3 cost tracking needs an entirely different tool, but nothing in the claims suggests the mechanism changes by resource type -- tags apply to S3 buckets just as they do to EC2 instances (cl-b6d6902fd77d), and the same activation step is still required (cl-20b18df216fb) before the tag can drive a breakdown or an 80%-threshold Budget.", "claim_ids": ["cl-b6d6902fd77d", "cl-2226f841e577", "cl-a033b2466aa7", "cl-fceca31e873d", "cl-105d0e5625f9", "cl-20b18df216fb", "cl-69c5ba0eae92"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "medium", "description": "Claim cl-bae529ce18b3 contradicts itself. It calls joining consolidated billing 'payee-initiated', then says the payer (master) account sends the join request to the account being linked. That flow is payer-initiated. A learner reading the label alone would get the direction of the invitation backwards.", "related_entity_ids": ["cl-bae529ce18b3"]}, {"type": "contradiction", "severity": "medium", "description": "The source questions disagree about where billing alerts live and what they provide. q031 (cl-0ef04755ba70, conflicted) treats per-account CloudWatch billing alerts as already giving per-project cost granularity. q782 (cl-18025364a83a, conflicted; cl-162e1a375f0b) says alerts are set up only once in the payer account and that per-member-account alerts are unnecessary. The mental model asserts both without reconciling them ('the account is the cost dimension' and 'you set them up once in the payer account'). Its own invariant also says alerting tools 'do not produce breakdowns', which cl-0ef04755ba70 directly contradicts.", "related_entity_ids": ["cl-0ef04755ba70", "cl-18025364a83a", "cl-162e1a375f0b", "aws-sysops-service-billing-cost-management--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "There is an unresolved dispute over whether tags must exist on the resources before they can be activated. cl-fa51549cf92d (q823, conflicted) says resources must be tagged first, then the tag activated. cl-b3b922a55d0b (q778, conflicted) records community disagreement over whether the payer's Cost Allocation Tags manager can create new user-defined tags directly. The mental model states the first position as settled fact ('you need tags on the actual resources') and only mentions the dispute in its limits. That leaves the mechanism and the limits inconsistent with each other.", "related_entity_ids": ["cl-fa51549cf92d", "cl-b3b922a55d0b", "aws-sysops-service-billing-cost-management--m-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The synthesis presents needs-review claims as settled rules. The mental model states without qualification that the payer account activates cost allocation tags under Organizations, which rests on cl-a88d8999b79d (needs-review). The contrast-set exception 'breakdown plus alert = cost allocation tags + a Budget scoped to those tags' rests on cl-fceca31e873d (needs-review). That exception also drops the claim's 'single AWS account' condition, and it ignores the related needs-review OU dispute in cl-97f2b8ada31e.", "related_entity_ids": ["cl-a88d8999b79d", "cl-fceca31e873d", "cl-97f2b8ada31e", "aws-sysops-service-billing-cost-management--m-1", "aws-sysops-service-billing-cost-management--cs-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "Many claims marked 'conflicted' (their source questions show disagreement) are folded into the mental model and contrast set as unqualified facts, with no caveat. These include Cost Explorer as the tool for driving-cost analysis (cl-85f234218dee), rightsizing savings (cl-aec4e46d8460), Budgets alerting via email/SNS/Lambda (cl-97707593025e), Trusted Advisor having no custom threshold alerts (cl-b6cc10808254), CUR as the source of RI-allocation detail (cl-6cf285927dfa), tiered 50/80/90% thresholds (cl-69c5ba0eae92), tags being only a labeling mechanism (cl-e6ae3240b8f6), and raw CloudWatch metrics having no savings calculation (cl-29e53a827de9). The disagreement should be surfaced, not silently resolved.", "related_entity_ids": ["cl-85f234218dee", "cl-aec4e46d8460", "cl-97707593025e", "cl-b6cc10808254", "cl-6cf285927dfa", "cl-69c5ba0eae92", "cl-e6ae3240b8f6", "cl-29e53a827de9", "aws-sysops-service-billing-cost-management--m-1", "aws-sysops-service-billing-cost-management--cs-1"]}, {"type": "ambiguity", "severity": "low", "description": "The contrast set merges 'AWS Budgets / CloudWatch billing alarm' into one subject. It then gives that subject capabilities the claims attribute only to AWS Budgets: scoping by tag (cl-e17214ff25ff, cl-6dae862d9ca5) and multiple tiered notification thresholds. A CloudWatch EstimatedCharges alarm cannot be scoped by a cost allocation tag. The merged row could teach learners that a CloudWatch billing alarm can do tag-scoped budget alerts.", "related_entity_ids": ["aws-sysops-service-billing-cost-management--cs-1", "cl-e17214ff25ff", "cl-6dae862d9ca5", "cl-56ddf081abd7"]}, {"type": "stale-risk", "severity": "medium", "description": "Claim cl-c0db2de3f53e undercuts itself as a distractor. It says per-service usage reports via a billing API were not the legacy mechanism, but also that today the Cost Explorer API does return per-service cost data programmatically. Under current AWS, the option labelled as the distractor may effectively be correct, so the question's keyed answer depends on when it was written.", "related_entity_ids": ["cl-c0db2de3f53e", "cl-2024d8b6a822"]}, {"type": "stale-risk", "severity": "low", "description": "The RI-sharing claims and the mental model invariant say a single RI discount applies to one running instance matching its exact size and Availability Zone. That holds for zonal RIs. Regional RIs apply across AZs and, on Linux, with instance-size flexibility (normalized units), so one RI can partly cover several smaller instances. RI sharing can also be turned off for an account. The invariant presents the zonal behaviour as universal.", "related_entity_ids": ["cl-428e07582517", "cl-d9b6d386059f", "aws-sysops-service-billing-cost-management--m-1"]}, {"type": "stale-risk", "severity": "low", "description": "Claim cl-6b9124405cc4 (conflicted) records that the question's source says ELB was free-tier eligible, while a commenter says it no longer is. The keyed answer for q056 depends on when it was written, and the source and community disagree about it.", "related_entity_ids": ["cl-6b9124405cc4"]}], "sourceQuestionCount": 32}], "sources": {"kind": "locked", "file": "aws-sysops-service-billing-mj1g.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;

      var diagnoseLink = pendingCount

        <section class="practice">
