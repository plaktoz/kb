<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

-the-box automated backup rotation option.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-bb168dcb42b2", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Internet Gateway (IGW) is inherently redundant/highly available at the VPC level, so adding a second IGW does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-364df7c366b0", "source_question_ids": ["awssysops-p1-q010"], "statement": "An Elastic Load Balancer automatically spans multiple Availability Zones, so adding a second ELB does not remove a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5b3aa5da8e2c", "source_question_ids": ["awssysops-p1-q010"], "statement": "A multi-AZ RDS instance already fails over automatically to a standby in a second Availability Zone, so it is not itself a single point of failure.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1360dcf4efc7", "source_question_ids": ["awssysops-p1-q010"], "statement": "In an architecture that already uses an IGW, an ELB spanning multiple AZs, and a multi-AZ RDS instance, there is no remaining single point of failure that needs to be fixed.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-aa9aa216e4a2", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon CloudFront caches content (static assets, images, software patches, articles) at globally distributed edge locations, so repeat requests are served from the cache instead of hitting the origin, reducing origin load and lowering latency for end users during traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-80be965cb35f", "source_question_ids": ["awssysops-p1-q014"], "statement": "Adding Amazon RDS read replicas offloads read-only query traffic from the primary database instance, helping the database tier handle read-heavy traffic spikes.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-e3d33f110338", "source_question_ids": ["awssysops-p1-q014"], "statement": "Amazon ElastiCache caches the most frequently accessed data in front of a relational database, reducing the number of queries that reach the database and thus its load.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-c27b6dee478e", "source_question_ids": ["awssysops-p1-q014"], "statement": "SQS-based request queuing is designed for asynchronous write/processing workloads, not for synchronous, read-heavy page-view traffic such as serving article content.", "status": "supported"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-0996a48d74fb", "source_question_ids": ["awssysops-p1-q014"], "statement": "Using Route 53 health checks to fail over to a static S3 error page addresses availability optics but does not solve the underlying capacity/scaling pressure on the infrastructure.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1fa7a765b651", "source_question_ids": ["awssysops-p1-q016"], "statement": "Subnets cannot span multiple Availability Zones; achieving coverage across N Availability Zones for a resource requires provisioning one subnet per AZ.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-33fbf0096616", "source_question_ids": ["awssysops-p1-q016"], "statement": "An ELB that must be distributed across multiple Availability Zones needs a subnet registered in each of those AZs, so an ELB distributed over 2 AZs requires two public subnets (one per AZ).", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6de4b10a3185", "source_question_ids": ["awssysops-p1-q016"], "statement": "RDS database instances should _ids": ["awssysops-p1-q039"], "statement": "Whether scripting daily EBS snapshot creation with monthly rotation is still the best 'needs a script' admin task is disputed, since AWS Data Lifecycle Manager may have removed the need for scripting that specific task after the question was originally written.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-42831a96fc0d", "source_question_ids": ["awssysops-p1-q042"], "statement": "RDS automated backups enable point-in-time recovery by continuously backing up transaction logs in addition to the daily snapshot, allowing restoration to nearly any point within the retention window, often as recent as about 5 minutes before a mistake occurred.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-ae1b8ae9fb7e", "source_question_ids": ["awssysops-p1-q042"], "statement": "A manual RDS snapshot only captures the database state at the moment the snapshot was taken, not necessarily a point closer to a later mistake.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-7adea0f8aff0", "source_question_ids": ["awssysops-p1-q042"], "statement": "Multi-AZ RDS protects against infrastructure failure, not application-level mistakes like a dropped table, because the synchronous standby replica also receives and contains the mistake.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4f88c255be37", "source_question_ids": ["awssysops-p1-q042"], "statement": "RDS read replicas mirror the primary database, including any accidental data-modifying mistakes made on the primary.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-958bcecd774d", "source_question_ids": ["awssysops-p1-q081", "awssysops-p1-q142"], "statement": "RDS event notifications are delivered through Amazon SNS: RDS publishes to an SNS topic when a supported event occurs, and users subscribe endpoints such as email, SMS, HTTP, or an SQS queue to that topic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-6764aa9c27d9", "source_question_ids": ["awssysops-p1-q081"], "statement": "Amazon CloudWatch monitors metrics and logs and can alarm on thresholds, but it is not RDS's native event-notification transport mechanism.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d1e3f1c5aee9", "source_question_ids": ["awssysops-p1-q081"], "statement": "AWS CloudTrail records API calls and management events rather than RDS operational events, so it is not used for RDS event notifications.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-557ec82bd0f0", "source_question_ids": ["awssysops-p1-q081"], "statement": "AWS SES only sends email and is not RDS's event notification transport.", "status": "supported"}, {"claim_type": "fact", "conditions": ["event notification source type = db-snapshot"], "confidence": "high", "id": "cl-7f557708948c", "source_question_ids": ["awssysops-p1-q101"], "statement": "RDS event notifications for the db-snapshot source type cover the Creation, Deletion, and Restoration event categories.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-6cd9279f0f36", "source_question_ids": ["awssysops-p1-q101"], "statement": "'Backup' is an RDS event category that belongs to the db-instance source type, not the db-snapshot source type.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cbb0150c4e7f", "source_question_ids": ["awssysops-p1-q104"], "statement": "Multi-AZ RDS failover works by updating the DB instance's DNS record to point at the standby replica in another Availability Zone, while the application keeps using the same endpoint hostname throughout.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-99b86df2d309", "source_question_ids": ["awssysops-p1-q104"], "statement": "After a Multi-AZ RDS failover, the application requires no reconfiguration beyond re-establishing any already-open database connections.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e9e48b4ca231", "source_question_ids": ["awssysops-p1-q104"], "statement": "Multi-AZ RDS failover has no special internal-IP redirect mechanism; the switch to the standby is DNS-based, not IP-based.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-3314781a1a60", "source_question_ids": ["awssysops-p1-q104"], "statement": "Multi-AZ RDS failover is automatic and does not require the user to manually trigger the switch to the standby.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-be3e4343aa0d", "source_question_ids": ["awssysops-p1-q113"], "statement": "In a Multi-AZ RDS deployment, AWS runs a single actively-serving primary DB instance and copies data synchronously to a standby replica that cannot itself serve read traffic.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-67b2c94ab257", "source_question_ids": ["awssysops-p1-q113"], "statement": "Describing Multi-AZ RDS as running 'two DBs in parallel' with synchronous copying is a looser characterization that some read as implying both instances are equally active, though in practice only the primary serves the workload.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-055d0e002bd1", "source_question_ids": ["awssysops-p1-q113"], "statement": "Amazon RDS for SQL Server (MS SQL) does support the Multi-AZ feature.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "c ype": "fact", "conditions": [], "confidence": "medium", "id": "cl-422bbae16846", "source_question_ids": ["awssysops-p1-q156"], "statement": "Synchronous replication to the standby in a Multi-AZ RDS deployment can be an underlying cause of elevated latency.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-cd89953a9ada", "source_question_ids": ["awssysops-p1-q156"], "statement": "Using Provisioned IOPS (PIOPS) can help mitigate latency issues in a Multi-AZ RDS deployment by providing consistent, low-latency I/O under synchronous replication.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9072ab971620", "source_question_ids": ["awssysops-p1-q156"], "statement": "Using a larger DB instance class can help mitigate latency issues in a Multi-AZ RDS deployment.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-92cab3cccf50", "source_question_ids": ["awssysops-p1-q156"], "statement": "Scheduling automated backups outside peak/non-working hours can help mitigate latency in a Multi-AZ RDS deployment, since backups on a Multi-AZ instance are taken from the standby and can otherwise coincide with other load.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-765c5e6f5f51", "source_question_ids": ["awssysops-p1-q156"], "statement": "Whether taking a snapshot from the standby replica helps with Multi-AZ write-latency issues is disputed: the source's boxed answer treats it as not helping since it is a read-only operation against the replica rather than a write-path change, but the community vote was split three ways with no majority.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["user has not explicitly configured a maintenance window"], "confidence": "high", "id": "cl-eeaea36526dc", "source_question_ids": ["awssysops-p1-q169"], "statement": "Every RDS instance always has a maintenance window; if the user never explicitly sets one, AWS randomly assigns a 30-minute window from an 8-hour regional block on a random day of the week.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c5e716df1e42", "source_question_ids": ["awssysops-p1-q169"], "statement": "An unset/default RDS maintenance window does not block or prevent a requested DB instance-class change.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-d7bc41964095", "source_question_ids": ["awssysops-p1-q169"], "statement": "AWS does not prompt the user to specify a maintenance window at update time; it simply uses whatever window (default or custom) is already in effect.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-c0bd9d7fa8ed", "source_question_ids": ["awssysops-p1-q175"], "statement": "RDS Multi-AZ provides automatic failover for an Availability Zone outage, a primary DB instance failure, a DB instance server-type/class change, software patching, and a manual reboot-with-failover.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-3138383b806a", "source_question_ids": ["awssysops-p1-q175"], "statement": "The Multi-AZ standby is provisioned in a different Availability Zone within the same region, not in a different region, so Multi-AZ RDS provides no protection against a region-wide outage.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-91709d8d0c5e", "source_question_ids": ["awssysops-p1-q199"], "statement": "A CloudWatch alarm enters the 'Insufficient Data' state when its underlying metric stops reporting data altogether.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-37d3230901f8", "source_question_ids": ["awssysops-p1-q199"], "statement": "Alerting nt.", "status": "supported"}, {"claim_type": "rule", "conditions": ["sharing an automated RDS snapshot with another AWS account"], "confidence": "high", "id": "cl-62493b61b7a9", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "An automated RDS snapshot must first be converted into a manual snapshot, using the create-db-snapshot command, before it can be shared with another account and copied there.", "status": "supported"}, {"claim_type": "exception", "conditions": ["the source snapshot is still an automated snapshot that has not been converted to a manual snapshot"], "confidence": "medium", "id": "cl-feb81ca4dc23", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "The copy-db-snapshot command's cross-account copy capability applies to manual (or already-shared) snapshots, not to automated snapshots directly.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4a984252a3e5", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "Creating a cross-account RDS read replica with automated backups enabled requires running and paying for an additional continuously-on database instance, making it less cost-effective than a periodic snapshot copy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5518f22ec54e", "source_question_ids": ["awssysops-p3-1-q781"], "statement": "Using AWS DMS to replicate data to a second live RDS instance in another account requires running and paying for an additional continuously-on database instance, making it less cost-effective than a periodic snapshot copy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a11479b3b188", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "A storage failure on the primary Amazon RDS database instance is a documented trigger for automatic Multi-AZ failover.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-7942b4e12654", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "A change to the DB instance's server or instance type is a documented trigger for automatic Multi-AZ failover, per the AWS RDS FAQ.", "status": "conflicted"}, {"claim_type": "exception", "conditions": ["long-running queries", "deadlocks", "database corruption errors"], "confidence": "medium", "id": "cl-5fbfc8f16102", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "AWS RDS Multi-AZ deployments do not fail over automatically in response to database operations such as long-running queries, deadlocks, or database corruption errors, per the AWS RDS FAQ.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-528b288839e7", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "Read contention on a database is a performance/locking condition, not a documented Multi-AZ automatic-failover trigger.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1a5ca635ddbd", "source_question_ids": ["awssysops-p3-1-q816"], "statement": "Write contention on a database is a performance/locking condition, not a documented Multi-AZ automatic-failover trigger.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-036c4f066762", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "Amazon SQS is reached over its public API endpoint, so a Lambda function running in a VPC with no internet access needs an SQS VPC interface endpoint to reach a queue at all.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-eabfc6c47e91", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "An RDS instance's security group must explicitly allow inbound connections from the Lambda function's security group or elastic network interface, or writes from Lambda to RDS will silently fail.", "status": "conflicted"}, {"claim_type": "fact", "confidence": "high", "id": "cl-59ac86f401fe", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When a Lambda function and an RDS instance are located in the same VPC, no VPC endpoint is needed for the RDS traffic between them.", "status": "supported"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-f34aafa5d9c0", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A NAT gateway's presence or absence has no bearing on intra-VPC connectivity between a Lambda function and an RDS instance in the same VPC.", "status": "conflicted"}, {"claim_type": "distractor", "confidence": "medium", "id": "cl-b273a9a19c4b", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A missing internet gateway on a Lambda function's subnet has no bearing on data reaching RDS when the Lambda-to-RDS workflow occurs entirely within the VPC and requires no outbound internet access.", "status": "conflicted"}, {"claim_type": "rule", "confidence": "high", "id": "cl-0c850204c75d", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When a question's community vote credibly and substantially contradicts or splits from the given boxed answer, the question is flagged as disputed for triage while the boxed answer is nonetheless retained per the ingestion policy.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-6431bf9553cd", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "Amazon RDS abstracts away direct volume management, so there is no user-facing operation to copy the data volumes of an RDS instance the way one would copy raw EBS volumes.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9f7e281823fd", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "An existing unencrypted Amazon RDS instance cannot be encrypted in place.", "status": "supported"}, {"claim_type": "rule", "conditions": ["encrypting an existing unencrypted RDS instance"], "confidence": "medium", "id": "cl-25bcd09edee2", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "The documented method to encrypt an existing unencrypted RDS instance is to take a snapshot of it, create an encrypted copy of that snapshot using a KMS key, and restore a new instance from the encrypted snapshot copy.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-60619375fc51", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "An RDS read replica inherits the encryption status of its source instance and cannot itself be selectively encrypted.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-12900d9c0cb0", "source_question_ids": ["awssysops-p3-1-q903"], "statement": "The modify-db-instance command cannot add encryption to an already-existing, unencrypted RDS instance, because encryption can only be set at creation or restore time, not toggled on afterward.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-rds--m-1", "title": "RDS keeps three kinds of copies of your data, and each one fixes a different problem", "purpose": "Most RDS questions come down to one choice: which RDS feature makes the right copy of the data for the problem in front of you? The options are surviving an outage, handling more reads, or undoing a mistake. Getting this mapping right answers most of the high-availability, scaling, and recovery questions in this slice.", "mechanism": "RDS is a managed service. You get a database endpoint, not a server: there is no SSH, no OS access, and no EBS volume you can attach or snapshot. AWS patches the engine during the instance's maintenance window. Because you can't touch the host, everything you do to protect or scale the database goes through one of three copy mechanisms that RDS builds for you.\n\n(1) Multi-AZ keeps a synchronous standby in a second AZ in the same region. The standby already exists and is running before anything goes wrong, and it serves no traffic. If the primary or its AZ fails (instance failure, storage failure, AZ outage, patching, instance-class change, or reboot-with-failover), RDS repoints the endpoint's DNS CNAME to the standby. This happens automatically. The app keeps the same hostname and only has to reconnect. Because the copy is synchronous, it can add write latency, and it copies every mistake immediately.\n\n(2) A read replica is a separate database that copies the primary asynchronously and serves read-only queries. It takes reads off the primary, such as reporting or analytics jobs and read-heavy traffic spikes. It does not fail over automatically, and it also copies every mistake.\n\n(3) Automated backups take a daily snapshot and also back up transaction logs continuously. That lets you do point-in-time recovery to almost any moment inside the retention window (1 day by default, up to 35 days), often to within about 5 minutes of the mistake. Manual snapshots only capture the moment they were taken.\n\nSo: live copies (Multi-AZ, replicas) carry every change forward, including a dropped table or corruption. Only a copy fixed at an earlier point in time (point-in-time recovery or a snapshot) can undo a logical mistake.", "predict_prompt": "Someone drops a production table by accident. The RDS instance is Multi-AZ, has two read replicas, and keeps automated backups for 7 days. Which copy lets you get the table back, and why are the other two useless here?", "invariants": ["A Multi-AZ standby never serves reads. For read scaling, use read replicas or a cache.", "Multi-AZ failover is automatic and works through DNS. The endpoint hostname stays the same, and no IP address is moved.", "Synchronous and asynchronous copies both carry logical mistakes and corruption forward. Only point-in-time recovery or a snapshot taken before the mistake can recover from them.", "The Multi-AZ standby is in the same region, so it gives no protection against a region-wide outage.", "You get no OS, SSH, or EBS-volume access to RDS. Backup, encryption, and patching all go through RDS features."], "limits": ["RDS for MySQL can't scale writes horizontally. Read replicas only help with reads. A CPU-bound or write-heavy instance needs a larger instance class.", "You can't turn on encryption at rest for an existing instance. Take a snapshot, make an encrypted copy of it, and restore from that copy. Replicas and standbys inherit the source's encryption setting.", "You can't share automated snapshots across accounts. Copy one to a manual snapshot first. For an encrypted snapshot, the target account also needs access in the KMS key policy.", "Multi-AZ does not fail over for database-level problems such as long-running queries, deadlocks, or read/write contention."], "cues": ["'automatic failover', 'AZ outage', or 'primary unresponsive' points to Multi-AZ.", "'offload reporting or analytics', 'read-heavy', or 'reads hurting the primary' points to a read replica (or ElastiCache for repeat reads).", "'dropped table', 'corruption found days later', or 'restore to 5 minutes before' points to automated backups with point-in-time recovery.", "'DNS record' or 'CNAME' in a failover question points to how Multi-AZ fails over. IP-reassignment answers are distractors."], "claim_ids": ["cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-99b86df2d309", "cl-a3ed621071d0", "cl-b68b0709215a", "cl-b25f6d83421f", "cl-c0bd9d7fa8ed", "cl-a11479b3b188", "cl-3138383b806a", "cl-422bbae16846", "cl-79f4620f1978", "cl-234453d5bad4", "cl-14abe5b82c2f", "cl-1b6f76a42065", "cl-6280ce70cdbf", "cl-dc0236c1db20", "cl-f78cd916c0de", "cl-42831a96fc0d", "cl-ae1b8ae9fb7e", "cl-d62160b685b9", "cl-d03357538127", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-e8c14270e271", "cl-5d9b80b44cc4", "cl-539dbad1d1cc", "cl-8cdcf9f2e8e0", "cl-9f7e281823fd", "cl-c905f9112db5", "cl-60619375fc51", "cl-ce9dd33f363b", "cl-62493b61b7a9", "cl-3c515463e7fe", "cl-f7083d3c8ad1", "cl-549335f435b5", "cl-570fee310120", "cl-4d612d8478c3", "cl-528b288839e7", "cl-1a5ca635ddbd"]}, "contrastSet": {"id": "aws-sysops-service-rds--cs-1", "subjects": ["Multi-AZ", "Read replica", "Automated backups (point-in-time recovery)"], "dimensions": ["Problem it solves", "Replication timing", "Serves read traffic", "Failover", "Protects against logical mistakes or corruption"], "shared_traits": ["All three are built-in RDS features. None needs OS access or scripts.", "Each one keeps a copy of the primary's data somewhere other than the primary instance."], "matrix": {"Problem it solves": {"Multi-AZ": "Infrastructure or AZ failure (availability)", "Read replica": "Read load on the primary (read scaling)", "Automated backups (point-in-time recovery)": "Data loss or logical mistakes (recovery)"}, "Replication timing": {"Multi-AZ": "Synchronous, to a standby in another AZ", "Read replica": "Asynchronous", "Automated backups (point-in-time recovery)": "Daily snapshot plus continuous transaction-log backup, kept up to 35 days"}, "Serves read traffic": {"Multi-AZ": "No. The standby is idle", "Read replica": "Yes, read-only queries", "Automated backups (point-in-time recovery)": "No. Backups run no queries"}, "Failover": {"Multi-AZ": "Automatic DNS CNAME flip, same endpoint", "Read replica": "No automatic failover", "Automated backups (point-in-time recovery)": "None. Restoring a new instance is manual and means downtime"}, "Protects against logical mistakes or corruption": {"Multi-AZ": "No. The mistake is copied to the standby right away", "Read replica": "No. The mistake is copied to the replica", "Automated backups (point-in-time recovery)": "Yes. Restore to a point before the mistake"}}, "decision_rule": "Ask what the problem is. If the primary or its AZ is failing, pick Multi-AZ. If read load on a healthy primary is the issue, pick a read replica. If the data itself is wrong because of a mistake or corruption, pick point-in-time recovery from automated backups. The problem type decides the answer. Wording like 'second copy' or 'replica' doesn't.", "boundary_flip": "Take a scenario where 'the primary must keep running with no manual steps if its AZ fails.' The answer is Multi-AZ. Change it to 'a developer dropped a table 20 minutes ago.' Now the answer is point-in-time recovery, because the Multi-AZ standby already holds the drop. Change it again to 'a nightly reporting job slows the primary.' Now the answer is a read replica, because the Multi-AZ standby can't serve reads.", "strongest_distractor_failure": "Multi-AZ is the strongest distractor in read-scaling and recovery questions because it sounds like 'an extra copy of the database.' But its standby serves no reads and copies every mistake synchronously, so it can't take load off the primary or undo a dropped table. In the other direction, read replicas look like a failover target, but they are asynchronous and don't fail over automatically.", "exceptions": ["If the instance's CPU is at 100% from a write-heavy or general workload, neither a read replica nor Multi-AZ helps. Scale up to a larger instance class.", "Multi-AZ doesn't protect against a region-wide outage, because the standby is in the same region.", "For Aurora, Aurora Replicas behind the Reader Endpoint offload and load-balance reads, and Aurora has multi-AZ durability built in."], "claim_ids": ["cl-5b3aa5da8e2c", "cl-cbb0150c4e7f", "cl-a3ed621071d0", "cl-b25f6d83421f", "cl-c0bd9d7fa8ed", "cl-3138383b806a", "cl-79f4620f1978", "cl-234453d5bad4", "cl-86c20012b2da", "cl-14abe5b82c2f", "cl-1b6f76a42065", "cl-6280ce70cdbf", "cl-dc0236c1db20", "cl-f78cd916c0de", "cl-fb4fecbfe056", "cl-42831a96fc0d", "cl-d03357538127", "cl-0e30b32d12fa", "cl-00e6aac8c274", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-e8c14270e271", "cl-a9a4687a7bc9", "cl-8cdcf9f2e8e0", "cl-539dbad1d1cc", "cl-ba4ce90dde61", "cl-30a7bc0355b9", "cl-b8998638a207"]}, "scenarioFamily": {"id": "aws-sysops-service-rds--sf-1", "canonical": {"prompt": "An e-commerce company runs its orders database on Amazon RDS for MySQL. The instance is Multi-AZ and has two read replicas for reporting. Automated backups are enabled with a 7-day retention period. At 2:15pm a developer accidentally runs `DROP TABLE orders` against the primary instance. It is now 2:35pm, 20 minutes later. How do you recover the orders table, and why don't the Multi-AZ standby or the read replicas already give you a way back?", "expected_answer": ["Restore the database to a point-in-time just before 2:15pm using RDS automated backups' point-in-time recovery (which replays the continuously backed-up transaction logs), then recover the orders table data from that restored instance."], "reasoning": "RDS keeps three kinds of copies, each solving a different problem. The Multi-AZ standby is a synchronous replica built for infrastructure failure: it received and applied the DROP TABLE statement at essentially the same instant as the primary, so it now has the exact same missing table. The two read replicas are asynchronous copies built for read scaling, but they too mirror every data-modifying statement from the primary, including the drop. Neither live copy can be rolled back to before the mistake. Automated backups are the one mechanism built for exactly this: they back up transaction logs continuously in addition to the daily snapshot, so you can restore to a point in time within the retention window, often within about 5 minutes of the mistake. Since the retention is 7 days and the mistake happened 20 minutes ago, restoring to 2:14pm recovers the table as it existed right before the drop.", "distractor_analysis": "Multi-AZ is the strongest-looking distractor because it sounds like an 'extra copy of the database you could fail over to,' but failing over just swaps in a standby that already executed the same DROP TABLE synchronously. Read replicas look similarly promising since they are a separate database, but their asynchronous replication still carries the mistake forward within moments, so they're no better than the primary itself for this kind of logical error.", "claim_ids": ["cl-42831a96fc0d", "cl-7adea0f8aff0", "cl-4f88c255be37"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The retention period was never explicitly customized (so it defaults to 1 day), and the DROP TABLE is only discovered 3 days later instead of 20 minutes later.", "prompt": "Same company, same RDS MySQL instance with Multi-AZ and two read replicas, but automated backup retention was never explicitly configured. A developer runs `DROP TABLE orders` on the primary. The team doesn't notice until 3 days later. Can you still recover the table using RDS automated backups' point-in-time recovery, and why or why not?", "expected_answer": ["No. With retention left at its default of 1 day, the transaction-log backups needed to restore to a point before the drop have already aged out by the time the mistake is discovered 3 days later, so point-in-time recovery can no longer reach back to before the DROP TABLE."], "reasoning": "This flips the canonical answer because the boundary condition itself changed: automated backups and point-in-time recovery only work within the configured retention window, and here that window defaults to just 1 day. A mistake discovered after 3 days falls outside any retention window up to 1 day, so the continuously backed-up transaction logs covering the moment of the drop no longer exist. The underlying mechanism (PITR via automated backups) is unchanged, but the specific retention boundary it depends on has been crossed, so the previously-correct answer is no longer available.", "distractor_analysis": "It's tempting to answer 'restore to just before the drop' exactly as in the canonical scenario, since nothing about Multi-AZ or the read replicas changed. The boundary that actually matters here is the retention window, not the recovery mechanism itself.", "claim_ids": ["cl-d62160b685b9", "cl-42831a96fc0d"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "CloudWatch alarms on CPU utilization are configured on the primary instance, and the on-call team is notified of the incident via an SNS topic subscribed to email and SMS endpoints — neither of which affects how the table is actually recovered.", "prompt": "Same scenario as the canonical case: RDS MySQL, Multi-AZ, two read replicas, 7-day automated backup retention, and a `DROP TABLE orders` at 2:15pm discovered at 2:35pm. The instance also has CloudWatch alarms on CPUUtilization, and the on-call team gets paged through an SNS topic with email and SMS subscribers as soon as the alarm fires. How do you recover the orders table?", "expected_answer": ["Restore the database to a point-in-time just before 2:15pm using RDS automated backups' point-in-time recovery (which replays the continuously backed-up transaction logs), then recover the orders table data from that restored instance."], "reasoning": "The CloudWatch alarm and SNS paging only affect how the team learns about the problem, not how the data is recovered. Nothing about the CPU-utilization monitoring or the notification transport changes which copy of the data can roll back the mistake. The same three-copy reasoning applies: Multi-AZ and the read replicas already mirrored the drop, so only point-in-time recovery from automated backups can restore the table to its state just before 2:15pm.", "distractor_analysis": "The CloudWatch/SNS detail can tempt a learner into reasoning about alarms or notification routing as part of the fix, but monitoring and alerting are orthogonal to the actual recovery mechanism.", "claim_ids": ["cl-42831a96fc0d", "cl-7adea0f8aff0", "cl-4f88c255be37"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "An engineer on the call proposes manually triggering a Multi-AZ failover to the standby, believing the standby still holds the orders table because it is a 'separate copy of the database.'", "prompt": "Same scenario as the canonical case: RDS MySQL, Multi-AZ, two read replicas, 7-day automated backup retention, `DROP TABLE orders` at 2:15pm, discovered at 2:35pm. An engineer suggests manually triggering a Multi-AZ failover to the standby instance, arguing that since it's a separate copy of the database, it should still have the orders table. Is this a valid way to recover the table? What should be done instead?", "expected_answer": ["Restore the database to a point-in-time just before 2:15pm using RDS automated backups' point-in-time recovery (which replays the continuously backed-up transaction logs), then recover the orders table data from that restored instance."], "reasoning": "Triggering a Multi-AZ failover is not a valid fix here: the standby replicates synchronously, so it received and applied the exact same DROP TABLE statement as the primary at essentially the same moment. Failing over just makes the already-dropped-table standby the new primary — it does nothing to bring the table back. The engineer's instinct that 'it's a separate copy' is true for infrastructure failures but false for logical mistakes, because Multi-AZ protects against hardware/AZ failure, not application-level errors; the standby also receives the mistake. The correct recovery path is still point-in-time recovery from automated backups.", "distractor_analysis": "The 'just fail over to the standby' suggestion is the canonical adversarial trap: it sounds reasonable because Multi-AZ genuinely does give you another running copy of the database, but that copy is kept in lockstep with every write, including destructive ones, so it offers no protection against a dropped table.", "claim_ids": ["cl-7adea0f8aff0", "cl-5b3aa5da8e2c", "cl-42831a96fc0d"], "difficulty": "medium", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The engine is RDS for PostgreSQL instead of RDS for MySQL, and the mistake is a bad UPDATE statement that overwrote prices across the orders table (not a DROP TABLE), discovered 20 minutes later.", "prompt": "A different team runs their orders database on Amazon RDS for PostgreSQL instead of MySQL, also Multi-AZ with read replicas and 7-day automated backup retention. Instead of a dropped table, a bad `UPDATE orders SET price = 0` statement overwrites prices across the whole table at 2:15pm, and it's caught at 2:35pm. Does the same recovery approach apply, and why?", "expected_answer": ["Restore the database to a point-in-time just before 2:15pm using RDS automated backups' point-in-time recovery (which replays the continuously backed-up transaction logs), then recover the orders table data from that restored instance."], "reasoning": "The same mental model transfers directly: RDS Multi-AZ for Oracle, PostgreSQL, and MySQL instances all use the same AWS synchronous-replica technology, so the mechanism and its blind spot for application-level mistakes is identical regardless of engine. A bad UPDATE is still a logical, application-level mistake rather than an infrastructure failure, so the Multi-AZ standby and any read replicas still mirror it immediately and can't help. Only point-in-time recovery from automated backups, which is engine-agnostic within RDS, can roll the data back to before 2:15pm. The specific SQL statement (DROP TABLE vs. UPDATE) and the engine (MySQL vs. PostgreSQL) don't change which RDS feature is the right tool.", "distractor_analysis": "A learner might assume PostgreSQL's Multi-AZ setup behaves differently or that an UPDATE (versus a DROP) is somehow recoverable from a live replica because 'the data still exists, just wrong' — but a live, continuously-replicating copy reflects whatever the primary's data is, right or wrong, so it offers no rollback either way.", "claim_ids": ["cl-33ff22a46b4b", "cl-7adea0f8aff0", "cl-4f88c255be37", "cl-42831a9
