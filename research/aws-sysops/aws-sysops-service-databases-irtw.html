<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

}, {"claim_type": "rule", "conditions": ["resources are deployed across multiple AWS regions", "cross-account/cross-region CloudWatch dashboards are not being used"], "confidence": "high", "id": "cl-d82ea34b0f15", "source_question_ids": ["awssysops-p1-q017"], "statement": "To combine the same CloudWatch metric across multiple AWS regions into a single graph, you must pull the raw metric data per region via the CloudWatch CLI/API, aggregate it yourself, and push the combined series back into CloudWatch for graphing.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-0bbb1a9d7cb5", "source_question_ids": ["awssysops-p1-q017"], "statement": "CloudWatch's console tag-dimension view and per-resource monitoring agents only surface metrics within the region/account they run in, and do not natively merge metrics across regions.", "status": "supported"}, {"claim_type": "exception", "conditions": ["using a CloudWatch feature set from 2019 or later"], "confidence": "low", "id": "cl-24e52688e038", "source_question_ids": ["awssysops-p1-q017"], "statement": "AWS cross-account/cross-region CloudWatch dashboards, launched in 2019, can natively combine the same metric from multiple regions into one view, offering a newer alternative to manual aggregation.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9075d6ea71d3", "source_question_ids": ["awssysops-p1-q023"], "statement": "Amazon Elastic MapReduce (EMR) provisions EC2 instances that remain fully accessible to the customer, including SSH/root access to the underlying instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-cf03412056a5", "source_question_ids": ["awssysops-p1-q023"], "statement": "AWS Elastic Beanstalk provisions EC2 instances that remain fully accessible to the customer, including SSH/administrator access to the underlying instances.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-0617477fec9c", "source_question_ids": ["awssysops-p1-q023"], "statement": "Elastic Load Balancing, Amazon ElastiCache, and standard Amazon RDS do not expose an underlying instance the customer can log into; Amazon RDS Custom is the exception, giving OS-level access to the database host.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["web tier is stateless and CPU/memory-bound", "data tier is already well-provisioned and consistently fast"], "confidence": "high", "id": "cl-1e0ca1f2007d", "source_question_ids": ["awssysops-p1-q024"], "statement": "When a stateless, CPU/memory-bound web tier is the bottleneck and the data tier is already well-provisioned and fast, the fix is to horizontally scale the web tier (add instances behind an ELB) rather than changing the data tier.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5b410fab982c", "source_question_ids": ["awssysops-p1-q024"], "statement": "DynamoDB is a managed, multi-AZ service, so there is no single Availability Zone to co-locate an EC2 instance with for latency benefits.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-73c60b053b9e", "source_question_ids": ["awssysops-p1-q024"], "statement": "Caching database responses or migrating the database engine does not address a compute-bound application bottleneck when the data tier is already fast.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Memcached engine", "Evictions metric high", "GetMisses metric high"], "confidence": "high", "id": "cl-8fcc3ad7e019", "source_question_ids": ["awssysops-p1-q033"], "statement": "When an Amazon ElastiCache for Memcached cluster shows both high Evictions and high GetMisses at the same time, the cache lacks sufficient total memory capacity to hold its working data set.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Memcached engine"], "confidence": "high", "id": "cl-0160c79a10bf", "source_question_ids": ["awssysops-p1-q033"], "statement": "To resolve high Evictions and GetMisses caused by insufficient Memcached cache capacity, either add more nodes to the cluster (scale out) or use larger nodes with more memory (scale up).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-69afc654f258", "source_question_ids": ["awssysops-p1-q033"], "statement": "Shrinking the number of nodes in an ElastiCache Memcached cluster worsens high Evictions and GetMisses rather than fixing them.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e05e69348e62", "source_question_ids": ["awssysops-p1-q033"], "statement": "Tweaking the max_item_size parameter on an ElastiCache Memcached cluster only changes the maximum size of a single cached item and does not relieve the overall cache capacity pressure that causes evictions.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bf8c5a59c953", "source_question_ids": ["awssysops-p1-q232"], "statement": "Best practice for a mobile application that calls AWS services directly is to avoid embedding any long-lived IAM user or root account credentials in the app, and instead use an IAM role with web identity federation, authenticating end users through an external identity provider (e.g., Google, Amazon, Facebook) to obtain short-lived temporary security credentials.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-84fd71d859c1", "source_question_ids": ["awssysops-p1-q232"], "statement": "Embedding an AWS root account's access key and secret access key directly inside a mobile application is a security anti-pattern.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-4255e3ab33bd", "source_question_ids": ["awssysops-p1-q254"], "statement": "For an application running on an EC2 instance that needs to call another AWS service (e.g. DynamoDB), AWS best practice is to attach an IAM role with the needed permissions to the EC2 instance rather than embedding IAM user credentials in the application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f75bacb9b7a3", "source_question_ids": ["awssysops-p1-q254"], "statement": "An EC2 instance with an attached IAM role automatically receives temporary security credentials for that role, removing the need to embed static credentials in application code.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-37bdb307fb47", "source_question_ids": ["awssysops-p1-q254"], "statement": "Creating an IAM user and distributing its credentials within an application for AWS service access is a less secure practice than attaching an instance IAM role.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-827554316d65", "source_question_ids": ["awssysops-p1-q254"], "statement": "Attaching an IAM role that grants only EC2 access to an instance does not provide the DynamoDB permissions an application needs to call the DynamoDB API; a role's permissions must match the service actually being called.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-090b846933dc", "source_question_ids": ["awssysops-p1-q276"], "statement": "Amazon DynamoDB has no concept of a separate per-user 'database'; it only has tables.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f263c32d9b98", "source_question_ids": ["awssysops-p1-q276"], "statement": "A single IAM group-level policy can grant each member user access to a differently-named DynamoDB table by naming each table after the corresponding IAM username and using the ${aws:username} policy variable in the Resource ARN (e.g., arn:aws:dynamodb:*:*:table/${aws:username}), scoping the one shared policy per-user automatically at request time.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-798336de128b", "source_question_ids": ["awssysops-p2-q305"], "statement": "AWS Elastic Beanstalk provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-49a2a4f2a510", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon EMR provisions underlying EC2 instances that the customer can still directly administer, including SSH access, installing software, and root access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-21cd90768c4c", "source_question_ids": ["awssysops-p2-q305"], "statement": "Amazon ElastiCache, Amazon RDS, and Elastic Load Balancing are fully managed services that give customers no direct access to the underlying compute instances.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "low", "id": "cl-68490be234e9", "source_question_ids": ["awssysops-p2-q305"], "statement": "A claim that RDS lets customers 'retain administrative privileges' on its underlying EC2 instances is technically unsupported, since RDS is fully managed and customers get only a database endpoint rather than OS-level or root access to the host; this claim appeared in a dissenting minority vote.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-1b6f76a42065", "source_question_ids": ["awssysops-p2-q314"], "statement": "Directing analytics/reporting queries to an RDS Read Replica isolates that workload from the primary instance so heavy analytical queries no longer contend with transactional queries hitting the primary.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-86c20012b2da", "source_question_ids": ["awssysops-p2-q314"], "statement": "Enabling Multi-AZ on an RDS instance addresses failover/availability rather than workload separation, since the standby is not query-accessible for offloading read traffic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-5b89b007dc29", "source_question_ids": ["awssysops-p2-q314"], "statement": "Using ElastiCache is suited for caching frequently-read data, not for large ad-hoc analytics jobs that need to scan and aggregate across the full dataset.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-1d6e1158823f", "source_question_ids": ["awssysops-p2-q314"], "statement": "Running an RDS instance at the largest possible size only delays a workload-contention problem rather than solving it structurally, and does not scale as data volume and job durations grow.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-d1342b0d0603", "source_question_ids": ["awssysops-p2-q365"], "statement": "Amazon Kinesis is a fully managed service for real-time processing of streaming data at massive scale, able to collect and process hundreds of terabytes per hour from hundreds of thousands of sources.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5fb4ce33b883", "source_question_ids": ["awssysops-p2-q372"], "statement": "EMR stands for Elastic MapReduce.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-54317a210df0", "source_question_ids": ["awssysops-p2-q372"], "statement": "Amazon EMR is a managed cluster platform that simplifies running big-data frameworks such as Apache Hadoop and Apache Spark, plus related projects like Hive and Pig, to process and analyze large datasets.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-7f84c21b1fb8", "source_question_ids": ["awssysops-p2-q373"], "statement": "The main use of Amazon EMR is data-intensive processing tasks (e.g., web indexing, data mining, log analysis, machine learning, financial analysis, scientific simulation, bioinformatics) without the customer having to manage or tune the underlying Hadoop cluster.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-86a32b1cb6b1", "source_question_ids": ["awssysops-p2-q454"], "statement": "The CloudWatch Kinesis metric PutRecord.Latency measures the time taken per individual PutRecord operation, measured over the specified time period.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-500a11317b5b", "source_question_ids": ["awssysops-p2-q454"], "statement": "PutRecord.Latency is a latency metric, not a count of successful records produced by a PutRecords operation.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-435803c72d34", "source_question_ids": ["awssysops-p2-q454"], "statement": "PutRecord.Latency is a latency metric, not a count of successful PutRecord operations per stream.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-526673e4cd12", "source_question_ids": ["awssysops-p2-q470"], "statement": "IAM can be used to grant access to Amazon DynamoDB resources and API actions by writing an IAM policy listing the permissions and attaching it to a user or role.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-fce8686e6bff", "source_question_ids": ["awssysops-p2-q493"], "statement": "Best practice for an EC2-hosted application calling AWS APIs (e.g., DynamoDB) is to attach an IAM role to the EC2 instance rather than embedding IAM user credentials in the application.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-8d2d25adfa8d", "source_question_ids": ["awssysops-p2-q493"], "statement": "An IAM role attached to an EC2 instance supplies temporary security credentials automatically, avoiding the credential storage and rotation risk of long-lived IAM user credentials.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9872f15e0a08", "source_question_ids": ["awssysops-p2-q516"], "statement": "AWS does not encrypt every packet in the AWS network with IPsec by default, even though AWS supports IPsec VPN connections.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8591c9fa9ed4", "source_question_ids": ["awssysops-p2-q516"], "statement": "Amazon S3 provides authentication mechanisms to secure stored data against unauthorized access.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-954c0b5b852d", "source_question_ids": ["awssysops-p2-q516"], "statement": "Customers may encrypt their input data client-side before uploading it to Amazon S3.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3f9152ea4f7b", "source_question_ids": ["awssysops-p2-q516"], "statement": "Amazon EMR customers can choose to send data to Amazon S3 using HTTPS for secure transmission.", "status": "supported"}, {"claim_type": "fact", "conditions": ["read-heavy workload"], "confidence": "high", "id": "cl-14abe5b82c2f", "source_question_ids": ["awssysops-p2-q529"], "statement": "Creating a read replica of an RDS instance horizontally scales read capacity by offloading read traffic from the primary instance.", "status": "supported"}, {"claim_type": "fact", "conditions": ["read-heavy workload"], "confidence": "high", "id": "cl-79ce82099389", "source_question_ids": ["awssysops-p2-q529"], "statement": "Using Amazon ElastiCache to cache read queries removes repeat read load from an RDS instance for cacheable queries.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-79f4620f1978", "source_question_ids": ["awssysops-p2-q529"], "statement": "RDS Multi-AZ is a high-availability and failover feature with a synchronously-replicated standby, and the standby is not used to serve read traffic.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-68fa0b18ec39", "source_question_ids": ["awssysops-p2-q529"], "statement": "Scaling an RDS instance up to a larger instance size does not scale read throughput beyond a single instance's ceiling, unlike adding read replicas or a cache.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-55e0b82eda70", "source_question_ids": ["awssysops-p2-q549"], "statement": "AWS CloudTrail logs every API call made against an account, including which IAM identity invoked AllocateAddress to create an Elastic IP address, so an administrator can query those logs (e.g., via Amazon Athena) to retroactively attribute EIP-creation events to their creator.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5ec2be5f8422", "source_question_ids": ["awssysops-p2-q549"], "statement": "The question's marked correct answer is that a cost-allocation tag attached at creation time identifies who creates Elastic IP addresses, but a cost-allocation tag only works prospectively and cannot retroactively identify who created already-existing, untagged Elastic IP addresses -- the question's recorded community vote is unanimous for a CloudTrail/Athena-based answer instead, directly contradicting the marked answer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5c5c6bba2e4a", "source_question_ids": ["awssysops-p2-q549"], "statement": "CloudWatch has no EIPCreated metric, and Amazon Inspector assesses vulnerabilities rather than reporting who created an Elastic IP address, so neither identifies the creator of an EIP.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["Amazon Aurora"], "confidence": "high", "id": "cl-ba4ce90dde61", "source_question_ids": ["awssysops-p2-q571"], "statement": "Aurora Replicas offload read traffic from the primary Aurora instance.", "status": "supported"}, {"claim_type": "fact", "conditions": ["Amazon Aurora"], "confidence": "high", "id": "cl-30a7bc0355b9", "source_question_ids": ["awssysops-p2-q571"], "statement": "The Aurora Reader Endpoint automatically load-balances read queries across all available Aurora Replicas.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d7b1f440df4b", "source_question_ids": ["awssysops-p2-q571"], "statement": "Amazon Redshift is a data-warehouse migration target, not a scaling fix for an OLTP table experiencing high read CPU utilization.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-63d70daaf4a6", "source_question_ids": ["awssysops-p2-q571"], "statement": "Amazon CloudFront caches static HTTP content rather than database query results, so it cannot relieve database CPU load from read queries.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["Amazon Aurora"], "confidence": "medium", "id": "cl-5907b7a95499", "source_question_ids": ["awssysops-p2-q571"], "statement": "Amazon Aurora does not have a CPU-utilization-triggered Auto Scaling mechanism for automatically adding extra Aurora database nodes.", "status": "supported"}, {"claim_type": "fact", "conditions": ["Amazon Aurora"], "confidence": "medium", "id": "cl-233cb38a34af", "source_question_ids": ["awssysops-p2-q594"], "statement": "Under the AWS Shared Responsibility Model for Amazon Aurora, AWS itself performs the actual execution of maintenance, patches, and updates, since Aurora is a fully managed database engine.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["Amazon Aurora"], "confidence": "medium", "id": "cl-6ed83c1ad963", "source_question_ids": ["awssysops-p2-q594"], "statement": "The question's marked correct answer holds that 'executing maintenance, patches, and other updates' on Amazon Aurora is the customer's shared-responsibility role, but the explanation and the question's unanimous community vote instead hold that the customer's role is only choosing when maintenance happens (deferring, applying immediately, or scheduling it) while AWS executes it -- a direct contradiction with the marked answer.", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["Amazon Aurora replica"], "confidence": "high", "id": "cl-b60a05eca2aa", "source_question_ids": ["awssysops-p2-q595"], "statement": "High AuroraReplicaLagMaximum on a specific Aurora reader indicates that replica's data is stale relative to the primary.", "status": "supported"}, {"claim_type": "fact", "conditions": ["Amazon Aurora reader endpoint", "a replica has high replica lag"], "confidence": "high", "id": "cl-1ffd92068bca", "source_question_ids": ["awssysops-p2-q595"], "statement": "Because an Aurora reader endpoint load-balances reads across all replicas, users will intermittently see outdated data when routed to a lagging replica rather than experiencing a complete loss of functionality.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-4cac9a54afa4", "source_question_ids": ["awssysops-p2-q595"], "statement": "Elevated Aurora replica lag does not block adding or removing items via the application, nor does it cause the whole application to fail over to an error page, since writes still go to the primary and reads against other replicas still succeed.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Redis engine", "cluster mode enabled"], "confidence": "high", "id": "cl-da683bb93059", "source_question_ids": ["awssysops-p3-1-q632"], "statement": "When an ElastiCache for Redis cluster already has cluster mode enabled (sharded), the way to scale out read and write capacity ahead of an anticipated traffic spike is to add more shards to the existing cluster via online resharding, which requires no downtime.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-7bfe9c7d3021", "source_question_ids": ["awssysops-p3-1-q632"], "statement": "An Amazon RDS Multi-AZ DB instance deployment provides only a non-readable standby for failover and adds no read capacity; Multi-AZ DB cluster deployments do have readable standbys, but neither scales the ElastiCache tier that serves the cached reads.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-9b4897611029", "source_question_ids": ["awssysops-p3-1-q632"], "statement": "Offloading static assets to Amazon S3 does not address read-performance issues driven by dynamic, cached data served through ElastiCache for Redis.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-94a1bdfcdb50", "source_question_ids": ["awssysops-p3-1-q632"], "statement": "Launching a second, separate Multi-AZ Redis cluster fragments the cache rather than scaling the existing sharded cluster, since ElastiCache scaling is not designed to work by running parallel independent clusters.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Amazon Aurora", "CPUUtilization is high"], "confidence": "medium", "id": "cl-cf4db95cdb1b", "source_question_ids": ["awssysops-p3-1-q652"], "statement": "On an Amazon Aurora instance showing high CPUUtilization, a rising DatabaseConnections count combined with rising InsertLatency together point to write-query load or connection-handling overhead as a driver of the CPU pressure.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3682664f9cb2", "source_question_ids": ["awssysops-p3-1-q652"], "statement": "FreeableMemory on an Amazon Aurora instance reflects available RAM, not what is consuming CPU cycles, so it has no direct diagnostic value for investigating a CPUUtilization spike.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-650412e0dbd0", "source_question_ids": ["awssysops-p3-1-q652"], "statement": "EngineUptime on an Amazon Aurora instance is simply how long the instance has been running and has no diagnostic value for investigating a CPUUtilization spike.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-fe38b2fe5180", "source_question_ids": ["awssysops-p3-1-q652"], "statement": "AuroraReplicaLag measures replication delay between a replica and the primary, not the primary instance's own compute load, so it does not explain a CPUUtilization spike on the primary.", "status": "supported"}, {"claim_type": "rule", "conditions": ["Memcached engine"], "confidence": "medium", "id": "cl-542bdc3333ca", "source_question_ids": ["awssysops-p3-1-q689", "awssysops-p3-1-q865"], "statement": "Amazon ElastiCache for Memcached node-based clusters on engine 1.5 or later with Auto Discovery now support in-place vertical scaling to a different node type; before this, scaling up meant creating a new cluster with the desired CacheNodeType and repointing the application.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["Memcached engine"], "confidence": "medium", "id": "cl-4989a1540489", "source_question_ids": ["awssysops-p3-1-q689"], "statement": "Moving an existing Amazon ElastiCache for Memcached cluster (engine 1.5 or later) to a larger node type is now done in place with ModifyCacheCluster and a new CacheNodeType; CreateCacheCluster with the new CacheNodeType was the documented path before in-place vertical scaling existed.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-566de54c6222", "source_question_ids": ["awssysops-p3-1-q689"], "statement": "ModifyCacheCluster can now change the node type of an Amazon ElastiCache for Memcached node-based cluster on engine 1.5 or later with Auto Discovery, although older ElastiCache documentation did not allow in-place Memcached node-type changes.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f4bc44a662b6", "source_question_ids": ["awssysops-p3-1-q689"], "statement": "The ModifyCacheParameterGroup API changes engine configuration parameters, not an ElastiCache cluster's node type or size.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-10c18acbf560", "source_question_ids": ["awssysops-p3-1-q689"], "statement": "The RebootCacheCluster API only restarts an ElastiCache cluster's nodes and applies no configuration or sizing change.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-4d612d8478c3", "source_question_ids": ["awssysops-p3-1-q735"], "statement": "Amazon RDS instances expose a configurable maintenance window during which AWS performs patching and upkeep on the customer's behalf.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-86318ec3562a", "source_question_ids": ["awssysops-p3-1-q735"], "statement": "Amazon ElastiCache clusters expose a configurable maintenance window during which AWS performs patching and upkeep on the customer's behalf.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-0b07bb7e9c22", "source_question_ids": ["awssysops-p3-1-q735"], "statement": "\"Maintenance window\" is not an AWS-configurable property of a plain EC2 instance.", "status": "supported"}, {"claim_type": "rule", "conditions": ["patching the operating system on an EC2 instance"], "confidence": "high", "id": "cl-8b38aa356b2d", "source_question_ids": ["awssysops-p3-1-q735"], "statement": "OS-level patching on EC2 instances is scheduled through AWS Systems Manager Patch Manager's maintenance window construct rather than through the EC2 instance resource itself.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-82b7d2cdf98c", "source_question_ids": ["awssysops-p3-1-q735"], "statement": "An Elastic Load Balancer is an AWS-managed construct with no OS to patch and no maintenance-window setting of its own.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-a5ff5efe29ac", "source_question_ids": ["awssysops-p3-1-q735"], "statement": "An EC2 Auto Scaling group is an AWS-managed construct with no OS to patch and no maintenance-window setting of its own.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-92cfac6c1cf1", "source_question_ids": ["awssysops-p3-1-q735"], "statement": "Because an EC2 instance's underlying OS still requires patching, some argue a maintenance window should be scheduled for the EC2 instance rather than for the ElastiCache cluster, even though EC2 has no such configurable maintenance-window resource property.", "status": "conflicted"}, {"claim_type": "rule", "conditions": ["Memcached engine", "high CPU utilization"], "confidence": "medium", "id": "cl-023dcad22a31", "source_question_ids": ["awssysops-p3-1-q761"], "statement": "For an Amazon ElastiCache for Memcached cluster experiencing high CPU utilization, the documented remediation is to scale up (move to a larger, more powerful node type) or scale out (add more cache nodes).", "status": "conflicted"}, {"claim_type": "distractor" , "statement": "Amazon RDS for Microsoft SQL Server does not support the Aurora engine.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7b7666db7e34", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "Self-managing multi-AZ replication inside a single EC2 instance is not a real supported configuration.", "status": "supported"}, {"claim_type": "distractor", "conditions": ["backups are copied on a fixed interval such as every 30 minutes"], "confidence": "high", "id": "cl-3055bfca6b54", "source_question_ids": ["awssysops-p3-1-q776"], "statement": "A manual cron-based backup-and-copy scheme between EC2 instances can lose up to 30 minutes of data and requires manual failover steps, providing neither true high availability nor durability.", "status": "supported"}, {"claim_type": "rule", "conditions": ["high eviction count", "Memcached engine, or Redis with cluster mode enabled (adding shards)"], "confidence": "medium", "id": "cl-76b77cda167a", "source_question_ids": ["awssysops-p3-1-q788", "awssysops-p3-1-q839"], "statement": "A high eviction count on an ElastiCache cluster means the cluster's total cache memory is too small to hold the working data set, so the fix is to scale the cluster's memory capacity by adding additional nodes (scale out) or moving to a larger node type (scale up).", "status": "conflicted"}, {"claim_type": "fact", "conditions": ["Memcached engine"], "confidence": "high", "id": "cl-d77162208eb0", "source_question_ids": ["awssysops-p3-1-q788", "awssysops-p3-1-q865", "awssysops-p3-1-q874"], "statement": "Amazon ElastiCache for Memcached has no concept of read replicas; read replicas are an Amazon ElastiCache for Redis feature.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-5ad9fc470ba8", "source_question_ids": ["awssysops-p3-1-q788"], "statement": "Increasing CPU capacity on an ElastiCache cluster does not address a memory-capacity eviction problem, since CPU and cache memory are separate resource dimensions.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d348363ae34f", "source_question_ids": ["awssysops-p3-1-q788"], "statement": "Scaling the web/application layer by adding EC2 instances does not touch the ElastiCache cache tier and so does not address evictions caused by insufficient cache memory.", "status": "supported"}, {"claim_type": "fact", "conditions": ["Amazon Elasticsearch Service"], "confidence": "medium", "id": "cl-a4b57593ec61", "source_question_ids": ["awssysops-p3-1-q820"], "statement": "Under the AWS Shared Responsibility Model, AWS manages the underlying Amazon Elasticsearch Service (Amazon ES) infrastructure (deployment, patching, availability), while the customer is responsible for configuring the domain's own access control/access policy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-ea284a49fd45", "source_question_ids": ["awssysops-p3-1-q820"], "statement": "'AWS Premium Support' is a paid support tier, not a party with operational responsibility for fixing a customer's own Amazon ES domain access policy.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f76d50c550d4", "source_question_ids": ["awssysops-p3-1-q820"], "statement": "The question's marked correct answer attributes responsibility for correcting an overly-open Amazon ES domain access policy to AWS Premium Support, but the explanation's shared-responsibility reasoning and the question's unanimous community vote instead place that responsibility on the customer's own SysOps Administrator -- a direct contradiction with the marked answer.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["Memcached engine"], "confidence": "high", "id": "cl-8f596c68d539", "source_question_ids": ["awssysops-p3-1-q839"], "statement": "Increasing the ElastiCache time-to-live (TTL) setting does not reduce evictions, because eviction pressure in Memcached is driven by available memory, not by how long entries are configured to live.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-e87429f7bb23", "source_question_ids": ["awssysops-p3-1-q839"], "statement": "There is no construct for putting an Elastic Load Balancer in front of an Amazon ElastiCache cluster.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-f9d948fd2e36", "source_question_ids": ["awssysops-p3-1-q839"], "statement": "Decoupling with Amazon SQS is a messaging pattern unrelated to ElastiCache's cache memory capacity and does not reduce cache evictions.", "status": "supported"}, {"claim_type": "rule", "conditions": ["EC2 and Aurora are in different subnets/security groups"], "confidence": "high", "id": "cl-9d43a1145f6d", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "To let EC2 instances connect to an Aurora database over MySQL (port 3306), the inbound rule must be added on the Aurora security group, allowing TCP 3306 from the EC2 instances' security group as the traffic source.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-fa5771e20413", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Security groups are stateful, so only the resource being connected to needs an inbound allow rule for the relevant port; the connecting resource's outbound side and the target's own outbound side need no changes for the connection to succeed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9e68c39f9680", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Adding a new outbound security group rule has no effect on connectivity when an outbound rule for all protocols, all ports, to 0.0.0.0/0 already exists, since that traffic was already fully permitted.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-3983ee9074b2", "source_question_ids": ["awssysops-p3-1-q851"], "statement": "Adding an inbound TCP rule for the MySQL port on the EC2 instances' own security group does not fix EC2-to-Aurora connectivity, because the actual block is on the Aurora side's inbound rules.", "status": "conflicted"}, {"claim_type": "default", "conditions": ["Redis engine", "cluster mode enabled"], "confidence": "high", "id": "cl-668d97a6a242", "source_question_ids": ["awssysops-p3-1-q862", "awssysops-p3-1-q874"], "statement": "Amazon ElastiCache for Redis with cluster mode enabled provides Multi-AZ with automatic failover by default, automatically promoting a replica in another Availability Zone to primary if the primary node fails.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-9376a4278ac0", "source_question_ids": ["awssysops-p3-1-q862"], "statement": "Redis is a single-threaded engine, while Memcached is the multi-threaded engine of the two ElastiCache engine choices.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-6009cc20cc1e", "source_question_ids": ["awssysops-p3-1-q862"], "statement": "The question's marked correct answer cites 'multi-threaded processing' as a reason to prefer Redis over Memcached, but this is factually backwards: multi-threading is a Memcached characteristic, not a Redis one, making it an incorrect justification for choosing Redis.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": ["Redis engine", "cluster mode enabled"], "confidence": "low", "id": "cl-def5beafbd66", "source_question_ids": ["awssysops-p3-1-q862"], "statement": "Data partitioning and online resharding are both genuine capabilities of ElastiCache for Redis with cluster mode enabled, and in this question's sourced discussion the choice between citing one or the other as 'the' second reason for preferring Redis over Memcached was an unresolved, exactly 50/50 split.", "status": "needs-review"}, {"claim_type": "fact", "conditions": ["Memcached engine"], "confidence": "medium", "id": "cl-fc6db499db1f", "source_question_ids": ["awssysops-p3-1-q865"], "statement": "Amazon ElastiCache for Memcached has no built-in Application Load Balancer integration for distributing cache traffic across nodes; client-side or consistent-hashing-based distribution is how Memcached traffic is normally spread.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-5f708cbdd163", "source_question_ids": ["awssysops-p3-1-q874"], "statement": "Amazon ElastiCache clusters are not managed through an EC2 Auto Scaling group; placing replicas across Availability Zones for high availability is handled natively by the ElastiCache Redis engine, not by an Auto Scaling group construct.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-135d0a8b1810", "source_question_ids": ["awssysops-p3-1-q874"], "statement": "With cluster mode disabled, an ElastiCache for Redis cluster has exactly one shard, so 'disable cluster mode and increase shards' is not possible, and adding shards (cluster mode enabled) addresses partitioning and scale rather than availability or automatic failover.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-83daec9b9b4e", "source_question_ids": ["awssysops-p3-1-q874"], "statement": "Switching an ElastiCache deployment from Redis to Memcached removes replication and automatic failover entirely, since Memcached has no equivalent high-availability mechanism.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-databases-analytics--m-1", "title": "Find the saturated resource, then scale that tier with its own native mechanism", "purpose": "Most database and cache questions in this slice describe a symptom (high read CPU, slow reports, evictions, traffic spike) and offer fixes aimed at the wrong tier or the wrong resource. Answering reliably means first naming which tier and which resource (read capacity, write/connection load, cache memory, cache CPU, availability) is the bottleneck, then picking the mechanism that tier natively uses to add exactly that resource.", "mechanism": "Each tier adds capacity in its own way. (1) Relational read load: send reads somewhere other than the primary. An RDS read replica, or Aurora Replicas behind the Aurora Reader Endpoint (which spreads reads across all replicas), takes on read and reporting queries. ElastiCache in front of the database answers repeated cacheable reads before they reach it. Scaling the instance up only raises a single-instance ceiling and puts the problem off. (2) Availability is a separate concern. A Multi-AZ standby is replicated synchronously for failover and serves no reads, so it adds no read capacity. (3) Cache tier: ElastiCache scales through its own node operations, never through an ELB or Auto Scaling group. High Evictions together with high GetMisses means total cache memory is too small for the working set. The fix is to add nodes (scale out) or move to larger node types (scale up). TTL, max_item_size, more CPU, or more web servers do not add cache memory. Memcached is multi-threaded and has no read replicas or failover. Redis has replicas and Multi-AZ automatic failover, and with cluster mode enabled it scales through online resharding (adding shards). (4) If the web tier is CPU- or memory-bound and the data tier is already fast, scale the web tier horizontally behind an ELB. Touching the database or adding a cache does nothing. (5) Diagnose with the metric that measures the saturated resource. For Aurora CPU, look at DatabaseConnections and InsertLatency, not FreeableMemory, EngineUptime, or AuroraReplicaLag. AuroraReplicaLag means that replica serves stale reads, not that the application fails.", "predict_prompt": "An RDS MySQL primary shows high CPU because analysts run long reporting queries during business hours, and Multi-AZ is already enabled. Before reading the options, which single change takes the reporting load off the primary, and why does the existing Multi-AZ standby not already do this?", "invariants": ["A Multi-AZ standby never serves reads. It exists for failover, not read scaling.", "Read replicas (RDS, Aurora) and ElastiCache are the two ways to scale reads out. Scaling up an instance only raises one instance's ceiling.", "ElastiCache evictions point to a memory shortage. Only more nodes or bigger nodes add memory.", "ElastiCache scales through its own node and shard operations, never through an ELB or an EC2 Auto Scaling group.", "Memcached has no replicas and no automatic failover. Redis has both."], "limits": ["This model covers capacity and availability choices. It does not cover access control. For IAM roles on EC2, ${aws:username} table scoping, and security-group inbound rules, the question is who may connect, not which tier is saturated.", "ElastiCache in front of a database only helps cacheable, repeated reads. It does not help large ad-hoc analytics scans that aggregate across the whole dataset. Those belong on a read replica.", "Memcached in-place vertical scaling (ModifyCacheCluster with a new CacheNodeType) exists only on engine 1.5 or later with Auto Discovery. Older material says to create a new cluster with the larger node type."], "cues": ["'read-heavy', 'reporting', or 'analytics queries slow the primary' points to a read replica or Aurora Reader Endpoint (ElastiCache if the reads repeat).", "'failover', 'AZ outage', or 'high availability' points to Multi-AZ, or to Redis with replicas and automatic failover.", "'Evictions' plus 'GetMisses' high points to adding nodes or using larger nodes.", "'Redis cluster mode enabled' plus 'scale before a spike' points to online resharding (adding shards).", "'web tier CPU-bound, database consistently fast' points to adding web instances behind an ELB."], "claim_ids": ["cl-80be965cb35f", "cl-e3d33f110338", "cl-1b6f76a42065", "cl-86c20012b2da", "cl-5b89b007dc29", "cl-1d6e1158823f", "cl-14abe5b82c2f", "cl-79ce82099389", "cl-79f4620f1978", "cl-68fa0b18ec39", "cl-ba4ce90dde61", "cl-30a7bc0355b9", "cl-b60a05eca2aa", "cl-1ffd92068bca", "cl-1e0ca1f2007d", "cl-73c60b053b9e", "cl-8fcc3ad7e019", "cl-0160c79a10bf", "cl-69afc654f258", "cl-e05e69348e62", "cl-76b77cda167a", "cl-5ad9fc470ba8", "cl-d348363ae34f", "cl-8f596c68d539", "cl-e87429f7bb23", "cl-c85093722dcf", "cl-d77162208eb0", "cl-da683bb93059", "cl-668d97a6a242", "cl-9376a4278ac0", "cl-83daec9b9b4e", "cl-cf4db95cdb1b", "cl-3682664f9cb2", "cl-650412e0dbd0", "cl-fe38b2fe5180", "cl-542bdc3333ca"]}, "contrastSet": {"id": "aws-sysops-service-databases-analytics--cs-1", "subjects": ["RDS/Aurora read replica", "RDS Multi-AZ standby", "ElastiCache in front of the DB", "Scale up the DB instance"], "dimensions": ["Primary purpose", "Serves read traffic?", "Good for heavy ad-hoc analytics scans?", "Scales past one instance's ceiling?"], "shared_traits": ["All four are managed AWS options offered as answers to 'the database is under load'.", "None of them fixes a bottleneck in a stateless web tier when the data tier is already fast."], "matrix": {"Primary purpose": {"RDS/Aurora read replica": "Offload reads from the primary", "RDS Multi-AZ standby": "Failover / high availability", "ElastiCache in front of the DB": "Serve repeated reads from memory", "Scale up the DB instance": "More CPU/RAM on one box"}, "Serves read traffic?": {"RDS/Aurora read replica": "Yes (Aurora: via Reader Endpoint)", "RDS Multi-AZ standby": "No, standby is not queryable", "ElastiCache in front of the DB": "Yes, for cacheable queries", "Scale up the DB instance": "Only on the same primary"}, "Good for heavy ad-hoc analytics scans?": {"RDS/Aurora read replica": "Yes, isolates the reporting load", "RDS Multi-AZ standby": "No", "ElastiCache in front of the DB": "No, those scans can't be cached", "Scale up the DB instance": "Only postpones the contention"}, "Scales past one instance's ceiling?": {"RDS/Aurora read replica": "Yes, add more replicas", "RDS Multi-AZ standby": "No", "ElastiCache in front of the DB": "Yes, add cache nodes", "Scale up the DB instance": "No, capped at the largest size"}}, "decision_rule": "The one question that decides the answer is whether the extra copy of the database must serve read traffic. If the need is more read capacity or isolating reads, pick a read replica (or ElastiCache when the reads are repeated and cacheable). If the need is surviving an instance or AZ failure, pick Multi-AZ, because its standby serves no reads.", "boundary_flip": "Say the requirement is 'nightly reporting queries are slowing the transactional primary'. The answer is a read replica. Change it to 'the database must keep running with automatic failover if its Availability Zone fails', with no read-load problem, and the answer becomes Multi-AZ.", "strongest_distractor_failure": "Multi-AZ is the most tempting wrong choice because it also creates a second, continuously replicated copy of the database, so it looks like it should share the load. Its standby is synchronous and cannot be queried, so read and reporting traffic still hits the primary.", "exceptions": ["RDS Multi-AZ DB cluster deployments (as opposed to Multi-AZ DB instance deployments) do have readable standbys. This newer exception conflicts with the classic exam answer.", "In Aurora, the replicas serve reads through the Reader Endpoint and also act as failover targets, so one feature covers both needs. A lagging replica serves stale reads but does not cause the application to fail."], "claim_ids": ["cl-80be965cb35f", "cl-1b6f76a42065", "cl-86c20012b2da", "cl-5b89b007dc29", "cl-1d6e1158823f", "cl-14abe5b82c2f", "cl-79ce82099389", "cl-79f4620f1978", "cl-68fa0b18ec39", "cl-e3d33f110338", "cl-7bfe9c7d3021", "cl-ba4ce90dde61", "cl-30a7bc0355b9", "cl-1ffd92068bca", "cl-73c60b053b9e"]}, "scenarioFamily": {"id": "aws-sysops-service-databases-analytics--sf-1", "canonical": {"prompt": "A company runs transactional workloads on an Amazon RDS MySQL primary instance that already has Multi-AZ enabled for high availability. Each night, the finance team runs heavy reporting queries directly against the primary, and these reports have started slowing down normal transactional traffic during business hours. What should a SysOps administrator do to isolate the reporting queries from the primary's transactional workload, and why doesn't the existing Multi-AZ standby already solve this?", "expected_answer": ["Create a read replica and direct the reporting/analytics queries to it instead of the primary"], "reasoning": "Directing analytics/reporting queries to an RDS Read Replica isolates that workload from the primary so heavy analytical queries no longer contend with transactional queries hitting the primary (cl-1b6f76a42065). The Multi-AZ standby looks like it should help because it is a second, continuously replicated copy of the database, but it is a synchronous failover target that is not query-accessible, so it addresses availability, not workload separation (cl-86c20012b2da, cl-79f4620f1978).", "distractor_analysis": "Enabling or relying on Multi-AZ addresses failover/availability rather than workload separation, since the standby cannot be queried for offloading read traffic (cl-86c20012b2da, cl-79f4620f1978). Running the instance at the largest possible size only delays the contention problem rather than solving it structurally (cl-1d6e1158823f). ElastiCache is suited to caching frequently-read data, not large ad-hoc analytics jobs that scan and aggregate across the full dataset like reporting queries do (cl-5b89b007dc29).", "claim_ids": ["cl-1b6f76a42065", "cl-86c20012b2da", "cl-79f4620f1978", "cl-1d6e1158823f", "cl-5b89b007dc29"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The reporting-query workload is removed entirely. There is no analytics/read-offload need at all; the only stated requirement is that the database must automatically fail over to a standby in another Availability Zone if the primary AZ becomes unavailable.", "prompt": "A company runs transactional workloads on an Amazon RDS MySQL instance. There are no reporting or analytics queries run against this database, and no need to offload any read traffic. The sole requirement is that the database must automatically fail over to a standby in another Availability Zone if the primary AZ becomes unavailable. What should the SysOps administrator configure to satisfy this requirement?", "expected_answer": ["Enable Multi-AZ so a synchronously-replicated standby in another AZ can automatically take over on primary/AZ failure"], "reasoning": "RDS Multi-AZ is a high-availability and failover feature with a synchronously-replicated standby, and the standby is not used to serve read traffic (cl-79f4620f1978). With no read-offload or reporting-isolation need stated, there is nothing for a read replica or ElastiCache to solve here -- the only requirement is automatic failover, which is exactly what Multi-AZ is built for.", "distractor_analysis": "A read replica is built to offload read traffic (cl-1b6f76a42065), but with no read-heavy workload mentioned, adding one solves a problem that doesn't exist and does not, by itself, provide automatic failover the way Multi-AZ does.", "claim_ids": ["cl-79f4620f1978", "cl-86c20012b2da", "cl-1b6f76a42065"], "difficulty": "easy", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "Added irrelevant operational details -- the RDS instance is encrypted at rest with a customer-managed KMS key and sits across three subnets in three Availability Zones -- while the reporting-query contention and existing Multi-AZ setup are unchanged.", "prompt": "A company runs transactional workloads on an Amazon RDS MySQL primary instance that already has Multi-AZ enabled for high availability. The instance is encrypted at rest with a customer-managed KMS key and is deployed across three subnets spanning three Availability Zones. Each night, the finance team runs heavy reporting queries directly against the primary, and these reports have started slowing down normal transactional traffic during business hours. What should a SysOps administrator do to isolate the reporting queries from the primary's transactional workload, and why doesn't the existing Multi-AZ standby already solve this?", "expected_answer": ["Create a read replica and direct the reporting/analytics queries to it instead of the primary"], "reasoning": "The encryption-at-rest and subnet/AZ layout details are about data protection and network placement, not about which tier is saturated or how reads are offloaded; they don't change which resource is bottlenecked. The same reasoning as the canonical scenario applies: a read replica isolates the reporting workload (cl-1b6f76a42065), while the Multi-AZ standby remains a non-queryable, synchronous failover target that doesn't help here (cl-86c20012b2da, cl-79f4620f1978).", "distractor_analysis": "As in the canonical scenario, relying on the existing Multi-AZ standby addresses availability, not workload separation (cl-86c20012b2da, cl-79f4620f1978), and scaling the instance up only delays the contention rather than solving it (cl-1d6e1158823f). None of this is changed by the encryption or subnet details.", "claim_ids": ["cl-1b6f76a42065", "cl-86c20012b2da", "cl-79f4620f1978", "cl-1d6e1158823f"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "The pull toward the wrong answer is strengthened: a colleague explicitly argues that because the Multi-AZ standby holds a continuously, synchronously replicated full copy of the data, it can simply be pointed at directly to serve the nightly reporting queries.", "prompt": "A company runs transactional workloads on an Amazon RDS MySQL primary instance that already has Multi-AZ enabled for high availability. Each night, the finance team runs heavy reporting queries directly against the primary, slowing transactional traffic. A colleague proposes pointing the reporting queries at the Multi-AZ standby instead, reasoning that since the standby holds a full, continuously replicated copy of the same data, it should be able to serve the reports without any extra setup. What should the SysOps administrator do instead, and why is the colleague's proposal not viable?", "expected_answer": ["Create a read replica and direct the reporting/analytics queries to it instead of the primary"], "reasoning": "The colleague's reasoning sounds plausible because the Multi-AZ standby does hold a full, continuously replicated copy of the data -- but that replication is synchronous and exists purely for failover; the standby is not query-accessible at all, so it cannot be pointed at for reads (cl-86c20012b2da, cl-79f4620f1978). The actual fix is still to isolate the reporting workload with a read replica, which is built to be queried (cl-1b6f76a42065).", "distractor_analysis": "The Multi-AZ standby is the most tempting wrong choice precisely because it is a second, fully synchronized copy of the database, making it look interchangeable with a read replica -- but it is synchronous and not query-accessible, so it addresses failover, not read offload (cl-86c20012b2da, cl-79f4620f1978).", "claim_ids": ["cl-86c20012b2da", "cl-79f4620f1978", "cl-1b6f76a42065"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The database engine changes from RDS MySQL to Amazon Aurora (MySQL-compatible), where the mechanism for offloading reads is Aurora Replicas accessed through the Aurora Reader Endpoint rather than a generic RDS read replica, but the same reporting-vs-transactional contention problem exists.", "prompt": "A company runs transactional workloads on an Amazon Aurora MySQL-compatible primary instance. Finance analysts run heavy reporting queries directly against the primary, and these reports have started slowing down normal transactional traffic. What should be configured so the reporting/analytics queries no longer contend with transactional queries on the primary?", "expected_answer": ["Create a read replica and direct the reporting/analytics queries to it instead of the primary"], "reasoning": "The same mental model applies across RDS and Aurora: isolate the reporting workload by adding a replica that can be queried for reads. For Aurora specifically, Aurora Replicas offload read traffic from the primary (cl-ba4ce90dde61), and the Aurora Reader Endpoint automatically load-balances read queries across all available replicas (cl-30a7bc0355b9), giving the same effect as pointing reporting queries at an RDS read replica (cl-1b6f76a42065).", "distractor_analysis": "As with RDS, relying on a Multi-AZ-style synchronously replicated standby would not help here, since that kind of standby is not query-accessible and addresses failover, not workload separation (cl-86c20012b2da, cl-79f4620f1978).", "claim_ids": ["cl-ba4ce90dde61", "cl-30a7bc0355b9", "cl-1b6f76a42065", "cl-86c20012b2da", "cl-79f4620f1978"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "q549: the marked correct answer (a cost-allocation tag identifies who creates Elastic IPs) is contradicted by the explanation and a unanimous community vote for a CloudTrail/Athena-based answer. A tag cannot retroactively attribute already-created, untagged EIPs. The source question disagrees with itself and must be resolved before any of these claims is used.", "related_entity_ids": ["cl-55e0b82eda70", "cl-5ec2be5f8422", "cl-5c5c6bba2e4a"]}, {"type": "contradiction", "severity": "hi
