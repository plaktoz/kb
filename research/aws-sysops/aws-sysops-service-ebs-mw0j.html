<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

ed"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-805ca19ff617", "source_question_ids": ["awssysops-p2-q548"], "statement": "Encryption at rest for Amazon EFS file systems can only be enabled at file-system-creation time and cannot be turned on in place on an already-existing file system.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "high", "id": "cl-817f30509d29", "source_question_ids": ["awssysops-p2-q548"], "statement": "Amazon S3 default bucket encryption can be enabled immediately for new objects without creating a new bucket, and existing S3 objects can be re-encrypted in place with zero downtime via an S3 Batch Operations copy job.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-d5c0d736f964", "source_question_ids": ["awssysops-p2-q548"], "statement": "Among EBS, RDS, EFS, and S3, S3 is the exception where existing data can gain at-rest encryption without creating a new resource and without downtime; a source's boxed answer instead named EBS, which conflicts with this documented behavior and the source's own unanimous community vote favoring S3.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e5a31ddabe11", "source_question_ids": ["awssysops-p2-q585"], "statement": "Increasing an EBS volume's storage capacity has no practical effect on usable storage until the volume's file system is separately extended (e.g., with growpart/resize2fs, or xfs_growfs for XFS).", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-a0f9838f646f", "source_question_ids": ["awssysops-p2-q585"], "statement": "Restarting the EC2 instance does not cause the file system to reflect an EBS volume's increased storage capacity.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3d43facfbfa2", "source_question_ids": ["awssysops-p2-q598"], "statement": "EBS snapshots are stored on S3 infrastructure owned and managed by AWS itself, not inside any bucket in the customer's own account, so a customer-configured S3 lifecycle policy cannot be attached to them.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-29db4fb4b51d", "source_question_ids": ["awssysops-p2-q598", "awssysops-p3-1-q888"], "statement": "A scheduled process (such as an AWS Lambda function triggered by CloudWatch Events/EventBridge, or Amazon Data Lifecycle Manager) that runs on a schedule to delete EBS snapshots older than a retention threshold is a valid pattern for enforcing an EBS snapshot data-retention policy.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-ee25dab09965", "source_question_ids": ["awssysops-p2-q598"], "statement": "For the EBS snapshot retention-policy exam question, this dataset's boxed answer (an S3 lifecycle policy) is contradicted by unanimous community vote, since EBS snapshots are not accessible within any customer-owned S3 bucket.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-bccbdd36f629", "source_question_ids": ["awssysops-p2-q599"], "statement": "Reactive tagging tools (e.g., AWS Tag Editor, the resource-tagging GetResources API, AWS Config rules) can only find already-untagged resources after the fact; they do not enforce tagging in real time when a resource is created.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-7b988c689f0e", "source_question_ids": ["awssysops-p2-q599"], "statement": "Proactive tagging tools (e.g., AWS CloudFormation, AWS Service Catalog, IAM) apply tags automatically at the moment a resource is created, satisfying a real-time tagging-enforcement requirement.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl urce_question_ids": ["awssysops-p3-1-q727"], "statement": "Cold HDD (sc1) is AWS's lowest-cost-per-GB EBS volume type, purpose-built for large, sequential, infrequently-accessed ('cold') data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-fa82bad12928", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Throughput Optimized HDD (st1) is tuned for frequently-accessed sequential big-data workloads (e.g., EMR, data warehouses) and offers a higher baseline throughput than Cold HDD (sc1).", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b7e6f3cead47", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Throughput Optimized HDD (st1) costs more per GB than Cold HDD (sc1), making sc1 the more cost-effective choice for infrequently-accessed sequential data.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-e39286dd0da4", "source_question_ids": ["awssysops-p3-1-q727"], "statement": "Provisioned IOPS SSD and General Purpose SSD are priced for random-access, latency-sensitive workloads, making them more expensive than HDD-based EBS volume types for infrequent, sequential access patterns.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-2527d8469949", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "A snapshot is not directly attachable to an instance or browsable for individual files; it must first be used to create a new EBS volume before any file can be recovered from it.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-871aab4c76d9", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "To restore a deleted file from an EBS snapshot, create a new volume from the snapshot, attach that volume to a running EC2 instance, and copy the file out of it.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-e2c383b2d322", "source_question_ids": ["awssysops-p3-1-q830"], "statement": "There is no EC2 console feature that restores an individual file directly from a snapshot without first creating a volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-8ba7aaa97daf", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Amazon Data Lifecycle Manager (DLM) is a purpose-built, fully managed policy engine for EBS snapshots that natively handles scheduled creation, a defined retention count/period, and automatic deletion of aged-out snapshots within a single policy.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-bdab4209e81c", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "An EventBridge/CloudWatch Events scheduled rule can trigger EBS snapshot creation on a schedule, but on its own provides no built-in retention or deletion mechanism, requiring separate custom logic to enforce a retention window.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-4b3c9adc44f2", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "Copying data to Amazon S3 Glacier via a Lambda function is an archival pattern, not a snapshot-based backup, and does not match how EBS backups are normally retained.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-12e3d9c4451b", "source_question_ids": ["awssysops-p3-1-q888"], "statement": "For the backup-retention exam question, this dataset's boxed answer (an EventBridge scheduled rule) is contradicted by unanimous community vote favoring Amazon Data Lifecycle Manager, since the EventBridge rule alone has no built-in retention/deletion mechanism.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-0d5e4f274541", "source_question_ids": ["awssysops-p3-1-q892"], "statement": "An existing EBS volume cannot be encrypted in place; encrypting it requires snapshotting the volume, creating a new volume from that snapshot with encryption enabled, and swapping the new encrypted volume in for the original.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-31782f4fd862", "source_question_ids": ["awssysops-p3-1-q892"], "statement": "There is no 'Encrypted' EC2 instance property that can be modified directly to encrypt an attached EBS volume.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-74c74d8f5fc4", "source_question_ids": ["awssysops-p3-1-q892"], "statement": "AWS CloudHSM manages cryptographic keys; it is not itself a mechanism for encrypting an existing EBS volume.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-33bc92ee33a9", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "A volume restored from an EBS snapshot lazily loads its data from Amazon S3 in the background, so the first access to any given block incurs extra latency until that block is pulled down.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-f86ea2d8c939", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "Enabling fast snapshot restore fully initializes a volume at creation time, eliminating the lazy-loading first-touch latency that would otherwise occur on a snapshot-restored volume.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-76d26e905213", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "Pre-warming a snapshot-restored volume by reading all of its blocks up front manually achieves the same initialization effect as fast snapshot restore, avoiding sporadic first-touch I/O latency.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f14038746d42", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "Cold HDD (sc1) does not support Provisioned IOPS at all, so restoring a workload that requires Provisioned IOPS onto an sc1 volume changes it away from the volume type the workload needs rather than fixing performance consistency.", "status": "supported"}, {"claim_type": "exception", "conditions": [], "confidence": "medium", "id": "cl-80c0943506db", "source_question_ids": ["awssysops-p3-1-q913"], "statement": "For the I/O-consistency exam question, this dataset's boxed answer (fast snapshot restore plus cold HDD) is contradicted by unanimous community vote favoring fast snapshot restore plus manual pre-warming instead, since cold HDD (sc1) is incompatible with the stem's Provisioned IOPS requirement.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-3e7376b39a67", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon Data Lifecycle Manager (Amazon DLM) selects which EBS volumes to snapshot based on tags applied to those volumes.", "status": "supported"}, {"claim_type": "rule", "conditions": ["policy targets volumes by tag, e.g. Production and Compliance tags"], "confidence": "high", "id": "cl-17f7cd2b9aaf", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Tagging the target EBS volumes is a prerequisite for an Amazon DLM snapshot lifecycle policy to target them.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-e1a69db3b663", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Amazon DLM requires an IAM role that grants it permission to create and manage snapshots on the users' behalf.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-6277be53c755", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "The IAM role used by Amazon DLM must be separate from the IAM role(s)/permissions held by the users who own the EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-68455bad40a5", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum storage requirement of 5 GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-2a4eddab46dc", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "A minimum baseline performance of 3 IOPS/GB is not a prerequisite for enabling Amazon DLM snapshot lifecycle management on EBS volumes.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-7be424124afd", "source_question_ids": ["awssysops-p3-1-q921"], "statement": "Encryption of the EBS volumes is an optional volume property that is unrelated to whether Amazon DLM can manage the volume's snapshot lifecycle.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-ebs--m-1", "title": "EBS: a persistent, AZ-locked network disk whose only portable form is the snapshot", "purpose": "Lets you predict what an EBS volume can and cannot do (move, share, encrypt, back up, grow, perform) by reasoning from two objects: the zone-locked volume and its regional, incremental snapshot.", "mechanism": "An EBS volume is network-attached block storage that lives in one Availability Zone, is replicated only within that AZ, and persists independently of the instance (unless DeleteOnTermination removes it, which is the default for the root volume). Because it is zone-locked and some properties are fixed at creation (notably encryption), anything the volume itself cannot change is done by going through a snapshot: a point-in-time, asynchronous, incremental copy stored in AWS-managed S3 at region scope. From a snapshot you create a NEW volume, which can be in another AZ, larger, encrypted, or in another account (by sharing the snapshot). The volume stays fully readable and writable while the snapshot uploads in the background; only writes made before the snapshot's start point are guaranteed to be captured, so pause I/O or stop the instance when you need a fully consistent snapshot. A volume restored from a snapshot loads blocks lazily from S3, so the first read of each block is slow until it is initialized (reading every block with dd, or enabling fast snapshot restore). Performance is separate from all of this: the volume type sets the IOPS model (gp2 IOPS grow with size up to a cap; io1/io2 IOPS are provisioned within a ratio to size; st1/sc1 are for sequential throughput). The instance path can still cap it: without EBS-optimization, or when the instance runs short of network bandwidth, realized IOPS stay below what the volume can deliver.", "predict_prompt": "A team must move a production EBS volume to another AZ and encrypt it, while the application keeps running. Before reading on: which object do you operate on, what happens to the original volume during the operation, and what must they do afterwards to avoid slow first reads?", "invariants": ["A volume attaches only to an instance in its own AZ; detach/reattach never crosses AZs.", "Cross-AZ moves, cross-account sharing and adding encryption all go snapshot -> new volume; the original is never changed in place.", "A snapshot of an encrypted volume is always encrypted; a snapshot of an unencrypted volume is not encrypted automatically.", "Snapshots are incremental, asynchronous and never block the source volume's reads or writes.", "EBS data persists across instance stop; instance-store data does not, no matter how the root volume is backed.", "Unattached volumes keep being billed until they are deleted."], "limits": ["Exam-era figures (30:1 PIOPS ratio, 4,000 IOPS max, pre-warming blank volumes, no DLM before 2018) differ from today's platform (50:1 or higher, 64,000 IOPS, blank volumes at full performance immediately, DLM for snapshot rotation).", "Several boxed answers in this slice conflict with community votes and documentation; trust the mechanism over the boxed letter.", "Elastic Volumes grows a volume live, but the file system must still be extended separately before the space can be used."], "cues": ["'different AZ' / 'another account' / 'encrypt existing volume' -> snapshot, then create a new volume", "'retention' / 'rotate snapshots' -> Data Lifecycle Manager targeting tagged volumes (not an S3 lifecycle policy)", "'first-access latency after restore' -> initialize with dd read to /dev/null, or fast snapshot restore", "'high disk wait on a database' -> Provisioned IOPS plus an EBS-optimized instance", "'data must survive stop/terminate' -> EBS, not instance store"], "claim_ids": ["cl-14ebdf09d120", "cl-407d4d064f78", "cl-17388d98de77", "cl-c243306cee99", "cl-5387764317c1", "cl-0aad584f5f21", "cl-e62ca15455de", "cl-569ab53f702a", "cl-3fc9619416cd", "cl-22596c74643d", "cl-aafa5e1fecae", "cl-0d5e4f274541", "cl-a52c8e591c6a", "cl-a094965a3163", "cl-4e5256db5a0b", "cl-ab10a276a79b", "cl-c01d3e34ed22", "cl-a1d85789e691", "cl-b315390c5e0e", "cl-135cd8555499", "cl-7ca10a103c58", "cl-ecd5bad184d9", "cl-1f94416d3cdb", "cl-33bc92ee33a9", "cl-f86ea2d8c939", "cl-669c8a90a3d6", "cl-87fbd07f4759", "cl-2e3857b9f755", "cl-522cc7dc584c", "cl-6666a7665d67", "cl-623e3ac3711a", "cl-007d46e5de2b", "cl-0afecde6a39f", "cl-70be56bdb992", "cl-1c11deaa2436", "cl-e5a31ddabe11", "cl-8ba7aaa97daf", "cl-3e7376b39a67", "cl-3d43facfbfa2", "cl-2527d8469949", "cl-56db4374f2f1", "cl-3d535e681972", "cl-7bb5a42e761f"]}, "contrastSet": {"id": "aws-sysops-service-ebs--cs-1", "subjects": ["EBS volume", "Instance store (ephemeral)"], "dimensions": ["Data survives instance stop/terminate", "Physical attachment", "Raw random-read IOPS", "Backup and portability", "Typical exam answer for"], "shared_traits": ["Both are EC2 block devices; EC2 has exactly these two types.", "Both appear to the OS as a raw block device that you format and mount."], "matrix": {"Data survives instance stop/terminate": {"EBS volume": "Yes on stop; on terminate unless DeleteOnTermination is set", "Instance store (ephemeral)": "No: lost on stop, terminate or disk failure"}, "Physical attachment": {"EBS volume": "Network-attached, replicated within one AZ", "Instance store (ephemeral)": "Disks physically on the host"}, "Raw random-read IOPS": {"EBS volume": "Provisioned or size-based; capped by EBS-optimization and network bandwidth", "Instance store (ephemeral)": "Highest local SSD IOPS (e.g. hi1.4xlarge ~120k)"}, "Backup and portability": {"EBS volume": "Snapshots; restore in any AZ, share across accounts", "Instance store (ephemeral)": "No native snapshots; data is tied to the host"}, "Typical exam answer for": {"EBS volume": "Databases and any data that must persist", "Instance store (ephemeral)": "Scratch, cache or replicated data that needs maximum IOPS"}}, "decision_rule": "Ask whether the data must survive an instance stop or terminate. If it must, the answer is EBS (scale performance with Provisioned IOPS plus EBS-optimized). Pick instance store only when losing the data is acceptable and raw local IOPS is what matters.", "boundary_flip": "A database needs ~100k random-read IOPS. If it is the only copy of the data, the answer is EBS Provisioned IOPS on an EBS-optimized instance. If the requirement changes to 'the data is a rebuildable cache, replicated elsewhere, loss on stop is acceptable', the answer flips to a High I/O instance-store instance such as hi1.4xlarge.", "strongest_distractor_failure": "Believing that an EBS-backed root volume makes the instance's ephemeral data survive a stop. Root-volume backing only decides whether the instance can be stopped. Instance-store volumes are still wiped, so 'EBS-backed AMI' never rescues data on instance store.", "exceptions": ["The root EBS volume is deleted on terminate by default (DeleteOnTermination=true), so 'EBS persists' needs that flag cleared to hold on terminate.", "Exam-era framing: network-attached EBS, even with PIOPS, was far below local SSD throughput. Modern io2 narrows the gap, but the durability rule still decides."], "claim_ids": ["cl-9ff7aca5524b", "cl-4053d59de53f", "cl-5b0b3ecd3af3", "cl-07f653f62e9e", "cl-1b532f23648f", "cl-7a6f09bf4e08", "cl-ea3f1bff7d59", "cl-0c981a2af156", "cl-b6bdd683c240", "cl-c6c27b0357fa", "cl-d7bcc27f0212", "cl-70be56bdb992", "cl-d05511987549", "cl-17388d98de77", "cl-c243306cee99", "cl-e62ca15455de", "cl-22596c74643d"]}, "scenarioFamily": {"id": "aws-sysops-service-ebs--sf-1", "canonical": {"prompt": "Your production database's EBS volume (unencrypted) lives in Availability Zone us-east-1a. Compliance now requires the data to live in us-east-1b and be encrypted at rest, with the database staying up throughout the migration, and no slow first reads afterward. Design the migration.", "expected_answer": ["Take a snapshot of the current volume while the database keeps running (the volume stays fully attached, readable and writable during the snapshot upload; only pause writes or stop the instance first if you need the very latest writes guaranteed to be captured)", "Create a new EBS volume from that snapshot directly in us-east-1b, enabling encryption at creation time -- the unencrypted snapshot does not become encrypted on its own, so encryption must be requested when creating this new volume", "Attach the new encrypted volume to an instance in us-east-1b and switch the database over to it", "Enable fast snapshot restore on the new volume (or manually pre-warm it by reading every block) so the first access to each block isn't slowed by lazy loading from S3"], "reasoning": "An EBS volume can never be modified or moved to a different AZ in place -- it only ever attaches to an instance in its own AZ. The only portable, mutable unit is a snapshot: a point-in-time, asynchronous, incremental copy stored in S3 at region scope. From that snapshot you can create a brand-new volume anywhere in the region, with whatever properties (AZ, encryption) the original lacked, since an unencrypted snapshot never becomes encrypted on its own -- encryption has to be chosen when the new volume is created. Because the snapshot upload runs in the background, the source volume keeps serving reads and writes the whole time. The new volume, however, lazily pulls its blocks from S3 on first touch, so without fast snapshot restore (or an equivalent manual pre-warm pass) the first reads after cutover would see extra latency.", "distractor_analysis": "A tempting shortcut is to try to encrypt the existing volume 'in place' or mirror it live into the other AZ at the OS level -- neither works: an existing volume's encryption cannot be toggled after creation, and OS-level mirroring cannot substitute for the fact that a volume simply cannot attach outside its own AZ, so there is nothing in us-east-1b to mirror into until a volume is created there via a snapshot. Detaching and reattaching the original volume also never moves it across AZs.", "claim_ids": ["cl-407d4d064f78", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-0d5e4f274541", "cl-ab10a276a79b", "cl-7ca10a103c58", "cl-ecd5bad184d9", "cl-33bc92ee33a9", "cl-f86ea2d8c939", "cl-76d26e905213", "cl-a6e7dfd40a03", "cl-d21e0d7768b7"], "difficulty": "hard", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "The source volume in us-east-1a is already encrypted (instead of unencrypted).", "prompt": "Same migration, but the production volume in us-east-1a is already encrypted. You still need the data in us-east-1b, the database to stay up throughout, and no slow first reads afterward. What changes about the plan?", "expected_answer": ["Take a snapshot of the already-encrypted volume while the database keeps running -- the snapshot inherits encryption automatically, so there is no separate 'enable encryption' step needed when creating the new volume", "Create the new volume from that snapshot directly in us-east-1b -- it comes out encrypted with no extra flag required", "Attach the new volume in us-east-1b and switch the database over", "Still enable fast snapshot restore (or manually pre-warm) on the new volume to avoid first-access latency"], "reasoning": "Because a snapshot of an encrypted source volume is always encrypted, the step that required explicit action in the canonical case -- choosing encryption at new-volume-creation time, since an unencrypted snapshot never becomes encrypted on its own -- disappears here: encryption now just comes along for free. The AZ-move mechanism (snapshot, then new volume elsewhere) and the lazy-loading/fast-snapshot-restore step are unaffected by the source's encryption state.", "distractor_analysis": "It would be wrong to assume you still need to 'turn on encryption' when creating the new volume -- that step is now redundant since the snapshot is already encrypted. It would also be wrong to think the already-encrypted source needs re-encrypting before snapshotting, since encryption state only ever flows from volume to snapshot, never the reverse.", "claim_ids": ["cl-a094965a3163", "cl-ab10a276a79b", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-7ca10a103c58", "cl-ecd5bad184d9", "cl-f86ea2d8c939", "cl-76d26e905213", "cl-407d4d064f78"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The EC2 instance in us-east-1a is additionally described as EBS-optimized, giving it a dedicated, non-shared throughput channel to its EBS volumes.", "prompt": "Same migration as the canonical scenario (unencrypted volume in us-east-1a, must land encrypted in us-east-1b, database stays up, no slow first reads afterward) -- except you're also told the current instance is EBS-optimized, so its network traffic never contends with its disk I/O. Does this change the migration plan?", "expected_answer": ["Take a snapshot of the current volume while the database keeps running (the volume stays fully attached, readable and writable during the snapshot upload; only pause writes or stop the instance first if you need the very latest writes guaranteed to be captured)", "Create a new EBS volume from that snapshot directly in us-east-1b, enabling encryption at creation time -- the unencrypted snapshot does not become encrypted on its own, so encryption must be requested when creating this new volume", "Attach the new encrypted volume to an instance in us-east-1b and switch the database over to it", "Enable fast snapshot restore on the new volume (or manually pre-warm it by reading every block) so the first access to each block isn't slowed by lazy loading from S3"], "reasoning": "EBS-optimization only affects how much of an instance's network capacity is reserved for talking to its own attached EBS volumes -- it has nothing to do with whether a volume can move AZs, whether a snapshot inherits encryption, or whether a snapshot-restored volume needs warming. The migration plan is identical to the canonical case: snapshot the unencrypted volume, create a new encrypted volume from it in us-east-1b, attach it, and enable fast snapshot restore (or pre-warm) to avoid lazy-load latency.", "distractor_analysis": "It's tempting to think EBS-optimization somehow lets you skip the snapshot step, as if the dedicated throughput channel could 'stream' the volume directly into the other AZ. It can't: EBS-optimization is purely about throughput between an instance and its own attached volumes, not a cross-AZ transport mechanism, and it doesn't change the encryption-inheritance or lazy-loading rules either.", "claim_ids": ["cl-407d4d064f78", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-0d5e4f274541", "cl-ab10a276a79b", "cl-7ca10a103c58", "cl-ecd5bad184d9", "cl-33bc92ee33a9", "cl-f86ea2d8c939", "cl-76d26e905213", "cl-70be56bdb992"], "difficulty": "easy", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A teammate proposes skipping the snapshot step and instead using OS-level disk mirroring to replicate the live volume directly into a second volume in us-east-1b.", "prompt": "Same migration as the canonical scenario, but a teammate suggests: 'Let's skip the snapshot -- just set up OS-level disk mirroring between the us-east-1a volume and a new volume we create in us-east-1b, so the data stays in sync live.' Is this a valid way to do the migration, and what should you do instead?", "expected_answer": ["Reject the OS-level mirroring idea: an EBS volume can only ever attach to an instance in its own Availability Zone, so there is no cross-AZ volume to mirror into without first creating one via a snapshot, and mirroring does nothing to add encryption", "Take a snapshot of the current unencrypted volume while the database keeps running", "Create a new volume from that snapshot directly in us-east-1b with encryption enabled, since the unencrypted snapshot will not become encrypted on its own", "Attach the new volume in us-east-1b, switch the database over, and enable fast snapshot restore (or pre-warm) to avoid first-access latency"], "reasoning": "OS-level mirroring cannot substitute for the snapshot-based migration: the destination volume still has to exist in us-east-1b before anything can be mirrored to it, and the only way to produce a new volume there from the existing data is a snapshot-based create. Mirroring also would not satisfy the encryption requirement, since mirroring copies the data as-is and does not layer on volume-level encryption as it transfers.", "distractor_analysis": "This mirrors a documented wrong answer in this dataset: the claim that OS-level disk mirroring can mirror an EBS volume in one AZ with a second volume in a different AZ is a distractor precisely because a volume cannot attach outside its own AZ in the first place -- there is nothing on the us-east-1b side to mirror into until a volume exists there, and only a snapshot-based create gets you that volume.", "claim_ids": ["cl-407d4d064f78", "cl-3fc9619416cd", "cl-569ab53f702a", "cl-0d5e4f274541", "cl-ab10a276a79b", "cl-7ca10a103c58", "cl-ecd5bad184d9", "cl-f86ea2d8c939", "cl-76d26e905213", "cl-a6e7dfd40a03"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "Instead of moving the data to another Availability Zone within the same account, a separate team needs this volume's data shared with a different AWS account; no AZ move is required.", "prompt": "Apply the same reasoning to a different request: a partner team in a separate AWS account needs a copy of this unencrypted EBS volume's data. They do not need it in a different AZ -- just accessible in their own account. What is the correct way to give them the data, and what should you avoid doing?", "expected_answer": ["Never try to share the volume or its raw data directly with another account -- that is not a supported operation, especially once the volume is encrypted", "Create a snapshot of the volume and share that snapshot (encrypted, if the source volume is encrypted) with the destination account", "Have the destination account create its own new volume from the shared snapshot -- that new volume belongs to them and can be attached to their own instances", "Do not copy the data onto a new unencrypted volume as a way to 'share' it -- that is a documented wrong answer in this dataset, since it is not a supported sharing mechanism and defeats the purpose when the goal is to keep the data protected"], "reasoning": "The same core move applies here as in the AZ migration: a volume itself is never the thing you hand off -- you always go through a snapshot. For cross-account access specifically, the supported path is sharing the snapshot (not the volume) with the destination account; that account then creates its own volume from the shared snapshot. This is stricter for encrypted data: an encrypted volume's raw data literally cannot be shared directly, only an encrypted snapshot can be shared, and copying its data onto a new unencrypted volume to work around that is not a supported way to share it either.", "distractor_analysis": "The two tempting wrong moves mirror the canonical scenario's: trying to directly expose or share the volume itself (not possible for an encrypted volume, and not how EBS data is normally shared across accounts), and copying the data onto a fresh unencrypted volume and sharing that instead -- a documented wrong answer in this dataset, since it is not a supported sharing mechanism.", "claim_ids": ["cl-aafa5e1fecae", "cl-22596c74643d", "cl-6b4898f85621", "cl-569ab53f702a"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "cl-2bb7e1468769 (from q260) says an EBS volume's size does not determine or cap its IOPS ceiling. Other claims in the same slice say the opposite: gp2 IOPS scale with size (cl-2e3857b9f755), PIOPS is capped by an IOPS-to-size ratio so 100 GB allows at most 3,000 IOPS (cl-b94fa31b4de7, cl-3d535e681972, cl-7bb5a42e761f), and reaching the PIOPS ceiling needs a minimum size (cl-49ef21d8516a, cl-7b83c1da3699). The mental model's mechanism also says io1/io2 IOPS are 'provisioned within a ratio to size'. The q260 claim is not reconciled with any of these.", "related_entity_ids": ["cl-2bb7e1468769", "cl-2e3857b9f755", "cl-b94fa31b4de7", "cl-3d535e681972", "cl-7bb5a42e761f", "cl-49ef21d8516a", "cl-7b83c1da3699", "aws-sysops-service-ebs--m-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "The contrast set's boundary_flip says a database needing about 100k random-read IOPS, when it is the only copy of the data, should use 'EBS Provisioned IOPS on an EBS-optimized instance'. No claim supports one PIOPS volume reaching that level. The exam-era ceiling was 4,000 IOPS (cl-49ef21d8516a), the 'current' ceiling in the claims is 64,000 (cl-7b83c1da3699), and cl-b6bdd683c240 says EBS PIOPS was far below local SSD. Source q047 itself picks hi1.4xlarge instance store for this kind of high-IOPS database workload. The flip needs a supported mechanism, such as RAID 0 striping (cl-754284496ea6), or it should be reframed.", "related_entity_ids": ["aws-sysops-service-ebs--cs-1", "cl-49ef21d8516a", "cl-7b83c1da3699", "cl-b6bdd683c240", "cl-0c981a2af156", "cl-754284496ea6"]}, {"type": "contradiction", "severity": "medium", "description": "Source q159 disagrees with itself. The boxed answer (an encrypted source volume produces an encrypted snapshot automatically) conflicts with a 100% recorded community vote for 'select encryption when creating the snapshot' (cl-2e2fe001578e, status needs-review). The mental model invariant 'A snapshot of an encrypted volume is always encrypted' and claim cl-a094965a3163 adopt the boxed side without flagging that q159 is disputed. q471 (cl-4e5256db5a0b) agrees with the boxed side, but that agreement does not settle q159's own dispute.", "related_entity_ids": ["cl-2e2fe001578e", "cl-a094965a3163", "cl-4e5256db5a0b", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source q471's boxed answer ('encrypt the existing volume so the snapshot will be encrypted') assumes an existing volume can be encrypted in place. That contradicts cl-0d5e4f274541 (q892) and cl-a52c8e591c6a (q548), which say encryption can only be set at creation or added by going snapshot -> new volume. The claim is flagged needs-review (cl-b407f577b545) but is not resolved.", "related_entity_ids": ["cl-b407f577b545", "cl-0d5e4f274541", "cl-a52c8e591c6a"]}, {"type": "contradiction", "severity": "medium", "description": "Source q112 disagrees with itself. The boxed answer (copy the data to an unencrypted volume to share it across accounts) conflicts with a unanimous community vote and AWS documentation favoring sharing an encrypted snapshot (cl-1bec0c8dd3b3, needs-review). The mental model and contrast set adopt the community side (cl-22596c74643d) as an invariant. The question still needs manual correct_answer_override review.", "related_entity_ids": ["cl-1bec0c8dd3b3", "cl-22596c74643d", "cl-6b4898f85621", "aws-sysops-service-ebs--m-1", "aws-sysops-service-ebs--cs-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source q307 disagrees with itself. The boxed answer (an IAM access-control policy secures data at rest) conflicts with the unanimous community vote and documentation favoring encrypting the volume (cl-8362d9d4f4f2). Claims cl-dacfc17c13bc and cl-384a03d1832e present the community side as supported.", "related_entity_ids": ["cl-8362d9d4f4f2", "cl-dacfc17c13bc", "cl-384a03d1832e"]}, {"type": "contradiction", "severity": "medium", "description": "Source q545 disagrees with itself. The boxed answer (resize gp2 and enable Max I/O) conflicts with the unanimous vote for RAID 0 and/or migrating to PIOPS (cl-f4163fbf8caf). The mental model relies on the community side (cl-522cc7dc584c, cl-2e3857b9f755) without noting the dispute.", "related_entity_ids": ["cl-f4163fbf8caf", "cl-754284496ea6", "cl-522cc7dc584c", "cl-b43ba810a642", "cl-2e3857b9f755", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source q548 disagrees with itself. The boxed answer names EBS as the resource where existing data can gain encryption without a new resource or downtime. The source's own unanimous vote and the documented behavior favor S3 (cl-d5c0d736f964). The mental model cites cl-a52c8e591c6a, which contradicts q548's boxed answer.", "related_entity_ids": ["cl-d5c0d736f964", "cl-a52c8e591c6a", "cl-817f30509d29", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source q598 disagrees with itself. The boxed answer (an S3 lifecycle policy for snapshot retention) conflicts with the unanimous community vote (cl-ee25dab09965). The mental model cue '(not an S3 lifecycle policy)' takes the community side without marking the question as disputed.", "related_entity_ids": ["cl-ee25dab09965", "cl-3d43facfbfa2", "cl-29db4fb4b51d", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source q888 disagrees with itself. The boxed answer (an EventBridge scheduled rule) conflicts with the unanimous vote for Data Lifecycle Manager (cl-12e3d9c4451b). The mental model cue 'retention -> Data Lifecycle Manager' takes the community side. cl-29db4fb4b51d, which draws on both q598 and q888, also calls an EventBridge-triggered schedule 'a valid pattern', which is in tension with cl-bdab4209e81c.", "related_entity_ids": ["cl-12e3d9c4451b", "cl-8ba7aaa97daf", "cl-bdab4209e81c", "cl-29db4fb4b51d", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source q913 disagrees with itself. The boxed answer (fast snapshot restore plus Cold HDD) conflicts with the unanimous vote for fast snapshot restore plus manual pre-warming (cl-80c0943506db). The mental model presents the community side as settled (cl-f86ea2d8c939).", "related_entity_ids": ["cl-80c0943506db", "cl-f86ea2d8c939", "cl-76d26e905213", "cl-f14038746d42", "aws-sysops-service-ebs--m-1"]}, {"type": "contradiction", "severity": "medium", "description": "Source q599 is disputed. The boxed answer (searching manually with Tag Editor) has no support from any commenter, and the community vote splits between two proactive options below the 60% threshold (cl-0b0666c8c445). The correct answer is unresolved.", "related_entity_ids": ["cl-0b0666c8c445", "cl-bccbdd36f629", "cl-7b988c689f0e", "cl-9ea5af9b4057"]}, {"type": "stale-risk", "severity": "medium", "description": "Source q165 is flagged because both the community vote and the platform have changed. EBS encryption was unsupported on micro instances at authoring time (cl-ce8c121f1bad) but is now broadly supported (cl-32755082527e). The 'Encrypt this volume' checkbox mechanic is low-confidence (cl-7116c9161ec1). The correct answer is unresolved (cl-d0dae1dda71e).", "related_entity_ids": ["cl-ce8c121f1bad", "cl-32755082527e", "cl-d0dae1dda71e", "cl-7116c9161ec1"]}, {"type": "stale-risk", "severity": "medium", "description": "Pre-warming blank volumes is marked 'supported' with no time condition: cl-44864b4fc82c (dd from /dev/zero on a blank volume) and cl-19277c6e76f3 (the dd-direction rule, sourced from q249 and q292). Sources q298 and q300 report current AWS documentation saying new or empty volumes need no initialization (cl-87fbd07f4759, cl-e9f3249080be, cl-0e502b45e56c). Their own exam-era claims (cl-ef04f867bc02, cl-d531a323b903) are marked conflicted, so the q249 claims should be treated the same way.", "related_entity_ids": ["cl-44864b4fc82c", "cl-19277c6e76f3", "cl-0e502b45e56c", "cl-87fbd07f4759", "cl-e9f3249080be", "cl-ef04f867bc02", "cl-d531a323b903"]}, {"type": "stale-risk", "severity": "low", "description": "The PIOPS ratio and ceiling changed after authoring: 30:1 vs 50:1 and 4,000 IOPS vs higher (cl-3d535e681972/cl-7bb5a42e761f, cl-49ef21d8516a/cl-7b83c1da3699). q262's boxed answer and vote agree on the outcome but give different reasons (cl-3a15c924eb67). The 'current' figures (64,000 IOPS, io2 at 500:1) are probably stale too, since io2 Block Express raised both the maximum IOPS and the ratio. The mental model's limits repeat 64,000 as today's figure.", "related_entity_ids": ["cl-3d535e681972", "cl-7bb5a42e761f", "cl-49ef21d8516a", "cl-7b83c1da3699", "cl-3a15c924eb67", "aws-sysops-service-ebs--m-1"]}, {"type": "stale-risk", "severity": "low", "description": "Source q056: the claim that ELB was in the Free Tier (cl-6b9124405cc4) is disputed by a commenter as no longer true. Source q039: whether daily snapshot rotation is still a 'needs a script' task is disputed now that DLM exists (cl-a67d8153019a).", "related_entity_ids": ["cl-6b9124405cc4", "cl-a67d8153019a", "cl-f5149488c779", "cl-e36c863e72e9"]}, {"type": "stale-risk", "severity": "medium", "description": "cl-cce8613c6b8f (and, in part, cl-749e99be7c8e) says a CloudWatch alarm cannot stay in OK or ALARM without data points. CloudWatch's 'treat missing data' setting (notBreaching / breaching / ignore) lets an alarm stay in or move to OK or ALARM when data is missing. The claim is stated as an unconditional rule with no authoring-time condition.", "related_entity_ids": ["cl-cce8613c6b8f", "cl-749e99be7c8e"]}, {"type": "stale-risk", "severity": "low", "description": "cl-d40c06dc8414 says no built-in AWS mechanism can detect and stop idle EC2 instances without custom scripting. CloudWatch alarm EC2 stop actions on low-utilization metrics do this natively. The claim has no authoring-time condition.", "related_entity_ids": ["cl-d40c06dc8414"]}, {"type": "ambiguity", "severity": "medium", "description": "cl-ecd5bad184d9 says writes made after a snapshot starts are not guaranteed to be included 'unless the application pauses writes or the volume is unmounted first'. This is muddled. A snapshot is point-in-time (cl-8447306f89ac, cl-b315390c5e0e), so writes after the start are never included. Pausing or unmounting matters for writes that were still buffered and not flushed before the start. The mental model cites this claim but states the point-in-time version.", "related_entity_ids": ["cl-ecd5bad184d9", "cl-8447306f89ac", "cl-b315390c5e0e", "aws-sysops-service-ebs--m-1"]}, {"type": "ambiguity", "severity": "medium", "description": "cl-7311c93a8b1c says a volume created from a snapshot has 'no size restriction', and cl-8373bdeda3bc says restores are 'not limited to volumes of the same size or smaller'. Both suggest a restored volume can be smaller than the snapshot's source volume, which EBS does not allow (a new volume must be at least the snapshot's size).", "related_entity_ids": ["cl-7311c93a8b1c", "cl-8373bdeda3bc", "cl-46e9a0f536b9"]}, {"type": "quality", "severity": "medium", "description": "Distractor claims use inconsistent polarity. Some state the false belief: cl-3a61cdef855a, cl-ba739ad5bc15, cl-7a6f09bf4e08, cl-6d59b05bb36c, cl-081d4c5cf9cd, cl-a6e7dfd40a03, cl-5ba52764abdf, cl-92440ac92a95, cl-a94cb0b70bb0. Others state the corrected truth: cl-8373bdeda3bc, cl-adcbe36ca060, cl-9e3f8f663a3d, cl-cb017c95f885, cl-affa0f02d771, cl-46e9a0f536b9, cl-2a30ae8e7707, cl-a0f9838f646f, cl-2d0f4a19f7d5, cl-68455bad40a5. With claim_type 'distractor' and status 'supported' on both kinds, a reader cannot tell whether a given statement is true or is the trap.", "related_entity_ids": ["cl-3a61cdef855a", "cl-7a6f09bf4e08", "cl-8373bdeda3bc", "cl-adcbe36ca060", "cl-9e3f8f663a3d", "cl-cb017c95f885", "cl-affa0f02d771", "cl-2a30ae8e7707"]}, {"type": "ambiguity", "severity": "low", "description": "cl-a380803e5070 says PIOPS volumes send 1-minute metrics 'with detailed monitoring enabled'. EBS has no detailed-monitoring toggle: io1/io2 volumes send 1-minute metrics automatically. The condition is misleading.", "related_entity_ids": ["cl-a380803e5070"]}], "sourceQuestionCount": 51}], "sources": {"kind": "locked", "file": "aws-sysops-service-ebs-mw0j.sources.enc.js"}}</script>
