<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- script-src allows any https: origin because a sources sibling file can be hosted remotely, at an origin chosen at view-time via ?sourcesBaseUrl and unknown when this file is generated. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https:; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>EKD Workspace</title>
<style>
  /* Theme follows prefers-color-scheme. One accent (--accent); ok/bad/warn
     carry state only. Shape rule: --radius on every control and panel,
     full pill on badges and tallies. z-index: header 10, nothing else. */
  :root {
    color-scheme: light dark;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --measure: 68ch;

    --bg: #f6f7f9;
    --surface: #fdfdfe;
    --sunk: #eceff3;
    --ink: #15181c;
    --ink-2: #39414b;
    --muted: #5a6370;
    --line: #dce0e6;
    --line-strong: #c3c9d1;
    --accent: #2a5caa;
    --accent-hover: #1f4a8c;
    --accent-ink: #fdfdfe;
    --accent-soft: #e7edf7;
    --ok: #1b7348;
    --ok-soft: #e3f2ea;
    --bad: #ae3328;
    --bad-soft: #fbe9e7;
    --warn: #845400;
    --warn-soft: #fbf0db;
    --shadow: 0 1px 2px rgb(21 24 28 / 0.05), 0 4px 16px rgb(21 24 28 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --surface: #181b1f;
      --sunk: #20242a;
      --ink: #e6e9ed;
      --ink-2: #c1c7cf;
      --muted: #939ba6;
      --line: #282d33;
      --line-strong: #3a4047;
      --accent: #8db0ea;
      --accent-hover: #a9c4f0;
      --accent-ink: #0d1829;
      --accent-soft: #1a2639;
      --ok: #6ccb96;
      --ok-soft: #13271c;
      --bad: #ef8a7e;
      --bad-soft: #301817;
      --warn: #e2b25a;
      --warn-soft: #2b2212;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 4px 16px rgb(0 0 0 / 0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0.85rem 1.25rem 0;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
  }
  header h1 {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    min-width: 0;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .title-exam { color: var(--muted); font-weight: 500; }
  .title-sep { color: var(--line-strong); }
  .header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
  }
  #slice-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    color: var(--muted);
  }
  nav#nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.55rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav#nav::-webkit-scrollbar { display: none; }
  nav#nav a {
    flex: none;
    padding: 0.55rem 0.75rem;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 transparent;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  nav#nav a:hover { color: var(--ink); background: var(--sunk); }
  nav#nav a:focus-visible { outline-offset: -2px; }
  nav#nav a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  #storage-warning {
    margin: 0.6rem 0 0.75rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    border-radius: var(--radius);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 0.88rem;
  }

  /* ---------- controls ---------- */
  button, .button-link, .file-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 0.94rem;
    font-weight: 550;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:active:not(:disabled), .button-link:active, .file-label:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary, .button-link, .file-label {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled), .button-link:hover, .file-label:hover {
    border-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink);
    text-decoration: none;
  }
  .header-actions button, .header-actions .file-label { padding: 0.4rem 0.75rem; font-size: 0.84rem; }
  .file-label { position: relative; }
  .file-label input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }
  .field-label {
    display: block;
    margin: 0 0 0.4rem;
    color: var(--ink);
    font-size: 0.94rem;
    font-weight: 600;
  }
  textarea, input[type="search"], input[type="password"], select {
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea, input[type="search"], input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  select { padding: 0.35rem 0.6rem; font-size: 0.84rem; }
  textarea:focus, input[type="search"]:focus, input[type="password"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  textarea:disabled { background: var(--sunk); color: var(--ink-2); cursor: not-allowed; }
  ::placeholder { color: var(--muted); opacity: 1; }
  fieldset { min-width: 0; margin: 1.5rem 0 0; padding: 0; border: 0; }
  legend { margin-bottom: 0.5rem; padding: 0; font-size: 0.94rem; font-weight: 600; }
  input[type="checkbox"], input[type="radio"] {
    flex: none;
    width: 1rem;
    height: 1rem;
    margin: 0.3rem 0 0;
    accent-color: var(--accent);
  }
  .field-error { margin: 0.75rem 0 0; color: var(--bad); font-size: 0.9rem; font-weight: 500; }

  /* ---------- page + type ---------- */
  main#app {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 5rem;
  }
  h2 {
    margin: 0 0 0.85rem;
    font-size: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  h3 {
    margin: 2.25rem 0 0.6rem;
    font-size: 1.06rem;
    font-weight: 620;
    line-height: 1.35;
  }
  p, li { max-width: var(--measure); text-wrap: pretty; }
  p { margin: 0 0 1rem; }
  ul { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin: 0.45rem 0; padding-left: 0.2rem; }
  li::marker { color: var(--muted); }
  .muted { color: var(--muted); }
  .lead { color: var(--ink-2); font-size: 1.125rem; }
  .empty {
    max-width: none;
    padding: 1.5rem;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .panel {
    padding: 1.25rem 1.35rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel > :last-child { margin-bottom: 0; }
  .panel textarea { background: var(--bg); }
  .panel h3:first-child { margin-top: 0; }
  .callout {
    margin: 2rem 0 0;
    padding: 1rem 1.2rem;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .callout h3 { margin: 0 0 0.3rem; color: var(--accent); font-size: 0.98rem; }
  .callout p:last-child { margin-bottom: 0; }
  .step { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally {
    display: inline-flex;
    justify-content: center;
    min-width: 1.6rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.1em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.28rem 0.55rem;
    border-radius: 999px;
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.74rem;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    vertical-align: 0.1em;
  }
  .badge.tone-accent { background: var(--accent-soft); color: var(--accent); }
  .badge.tone-ok, .badge.status-supported { background: var(--ok-soft); color: var(--ok); }
  .badge.tone-bad, .badge.status-conflicted,
  .badge.severity-high, .badge.severity-critical { background: var(--bad-soft); color: var(--bad); }
  .badge.tone-warn, .badge.status-needs-review, .badge.severity-medium { background: var(--warn-soft); color: var(--warn); }
  .next-link { margin-top: 2.5rem; font-weight: 550; }
  .back-link { margin: -0.25rem 0 1.25rem; font-size: 0.92rem; }

  /* ---------- supporting claims ---------- */
  details.claims, details.issues-panel {
    margin: 2rem 0 0;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  details > summary {
    width: fit-content;
    color: var(--ink-2);
    font-size: 0.96rem;
    font-weight: 600;
    cursor: pointer;
  }
  details > summary::marker { color: var(--muted); }
  details > summary:hover { color: var(--ink); }
  ul.citations, ul.issues {
    display: grid;
    gap: 0.85rem;
    margin: 1rem 0 0;
    padding: 0;
    list-style: none;
  }
  ul.citations li {
    display: grid;
    grid-template-columns: 6.75rem 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0;
    font-size: 0.94rem;
  }
  ul.citations .badge { justify-self: start; }

  /* ---------- confidence marks ---------- */
  .mark-control { display: inline-flex; gap: 0.3rem; vertical-align: middle; }
  .mark-dot {
    width: 0.8rem;
    height: 0.8rem;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .mark-dot:hover:not(:disabled) { opacity: 0.85; }
  .mark-dot:active:not(:disabled) { transform: none; }
  .mark-dot.mark-low { background: var(--ok); border-color: var(--ok); }
  .mark-dot.mark-medium { background: var(--warn); border-color: var(--warn); }
  .mark-dot.mark-high { background: var(--bad); border-color: var(--bad); }
  .mark-dot.is-active { opacity: 1; border-color: var(--ink); }
  .cell-mark { white-space: nowrap; }

  /* ---------- tables ---------- */
  .table-wrap {
    margin: 1.25rem 0 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  th, td {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  thead th {
    border-bottom-color: var(--line-strong);
    background: var(--sunk);
    color: var(--ink-2);
    font-size: 0.84rem;
    font-weight: 600;
  }
  tbody tr:last-child > * { border-bottom: 0; }
  .contrast-table { min-width: 44rem; }
  .contrast-table th + td, .contrast-table td + td,
  .contrast-table thead th + th { border-left: 1px solid var(--line); }
  .contrast-table tbody th { width: 11rem; font-weight: 600; }
  .sources-table { min-width: 38rem; }
  tr.source-row { cursor: pointer; transition: background-color 0.15s; }
  tr.source-row:hover { background: var(--sunk); }
  tr.source-row.is-open { background: var(--accent-soft); }
  tr.source-row.is-open > td { border-bottom-color: transparent; }
  tr.detail-row > td { background: var(--accent-soft); }
  .cell-id { white-space: nowrap; }
  .cell-answer { font-family: var(--font-mono); font-size: 0.86rem; }
  .row-toggle {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.84rem;
    font-weight: 500;
    text-align: left;
  }
  .row-toggle:hover:not(:disabled) { background: none; color: var(--accent-hover); text-decoration: underline; }
  .row-toggle:active:not(:disabled) { transform: none; }
  .empty-cell { padding: 1.5rem; color: var(--muted); text-align: center; }
  .source-detail { max-width: var(--measure); padding: 0.25rem 0 0.5rem; }
  .source-detail ul { list-style: none; padding: 0; }
  .source-detail h4 { margin: 1.25rem 0 0.4rem; font-size: 0.94rem; }
  .source-meta { font-size: 0.86rem; }
  .choice-letter { font-weight: 600; font-variant-numeric: tabular-nums; }
  .correct-choice { color: var(--ok); font-weight: 550; }

  /* ---------- learn ---------- */
  .predict-block { margin: 1.75rem 0 0; }
  .predict-block .prompt { margin: 0 0 0.9rem; color: var(--ink-2); }
  .mechanism { margin-top: 2.25rem; }
  .mechanism > h3:first-child { margin-top: 0; }

  /* ---------- practice ---------- */
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.5rem; }
  .practice > .prompt { margin-top: 1.5rem; font-size: 1.0625rem; }
  .practice > .callout + .prompt { margin-top: 1.5rem; }
  .answer-field { margin-top: 1.5rem; }
  .choices label, .diagnosis-option {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin: 0 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .choices label:hover, .diagnosis-option:hover { border-color: var(--line-strong); }
  .choices label:has(input:checked), .diagnosis-option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choices label.is-expected { border-color: var(--ok); background: var(--ok-soft); }
  .choices label.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .segmented {
    display: inline-flex;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .segmented label {
    position: relative;
    padding: 0.45rem 1rem;
    border-left: 1px solid var(--line-strong);
    font-size: 0.92rem;
    text-transform: capitalize;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .segmented label:first-child { border-left: 0; }
  .segmented label:hover { background: var(--sunk); }
  .segmented input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .segmented label:has(input:disabled) { cursor: not-allowed; }
  .reveal { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
  .answer p:last-child { margin-bottom: 0; }
  .self-report {
    margin-top: 2rem;
    padding: 1rem 1.2rem;
    border-radius: var(--radius);
    background: var(--sunk);
  }
  .self-report p { margin: 0; color: var(--ink-2); }
  .self-report .actions { margin-top: 0.75rem; }
  .result { margin: 2rem 0 0; font-weight: 550; }
  .result.result-ok { color: var(--ok); }
  .result.result-bad { color: var(--bad); }
  .result a { color: inherit; }
  .summary-label { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.94rem; font-weight: 600; }
  .score { margin: 0; color: var(--ink-2); font-size: 1.06rem; }
  .score strong {
    margin-right: 0.15rem;
    color: var(--ink);
    font-size: 2.25rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* ---------- diagnose ---------- */
  .pending-attempt { margin: 0 0 1.25rem; }
  .pending-attempt .prompt { color: var(--ink); }
  .your-answer { color: var(--ink-2); }
  .your-answer .field-label { margin-bottom: 0.15rem; color: var(--muted); font-size: 0.84rem; }
  .diagnosis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
    gap: 0.5rem;
  }
  .diagnosis-option { margin: 0; }
  .diagnosis-option .hint {
    display: block;
    margin-top: 0.15rem;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.45;
  }
  .panel .diagnosis-option { background: var(--bg); }
  ul.diagnosis-history { margin: 0; padding: 0; list-style: none; }
  ul.diagnosis-history li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: baseline;
    max-width: none;
    margin: 0;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.94rem;
  }
  ul.diagnosis-history li:last-child { border-bottom: 0; }
  ul.diagnosis-history time { font-size: 0.84rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- sources ---------- */
  .issue-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.25rem; }
  ul.issues li { max-width: none; margin: 0; padding: 0; font-size: 0.94rem; }
  ul.issues li > p:last-child { margin-bottom: 0; }
  .search-field { margin-top: 2rem; }
  #sources-count { margin: 0.5rem 0 0; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .sources-lock { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1rem 0 0; font-size: 0.88rem; }
  .sources-lock button { padding: 0.3rem 0.7rem; font-size: 0.84rem; }

  /* ---------- motion: state transitions only ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .mechanism:not(.hidden), .reveal:not(.hidden) { animation: rise 0.35s var(--ease) both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    body { font-size: 1rem; }
    header { position: static; }
    .header-inner { padding: 0.75rem 1rem 0; }
    main#app { padding: 1.5rem 1rem 4rem; }
    .panel { padding: 1rem; }
    .lead { font-size: 1.06rem; }

urce_question_ids": ["awssysops-p2-q590", "awssysops-p3-1-q850"], "statement": "Provisioning a dedicated EC2 instance solely to run a cron job that invokes a Lambda function introduces ongoing compute cost and operational overhead just to trigger the function on a timer.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-235ab8c5a57b", "source_question_ids": ["awssysops-p3-1-q693"], "statement": "Amazon Machine Image (AMI) IDs are unique per AWS region; an AMI ID valid in one region has no meaning, or does not exist, in another region.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-f2deb7a7471c", "source_question_ids": ["awssysops-p3-1-q693"], "statement": "A Lambda function can call AWS APIs targeting any AWS region by specifying that region on its SDK client; it is not restricted to acting only in the region where it is deployed.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-1ae5d9c16c2e", "source_question_ids": ["awssysops-p3-1-q693"], "statement": "It is a plausible but incorrect belief that a Lambda function can only launch EC2 instances in the same region where the function itself is deployed.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-ebaa709b1528", "source_question_ids": ["awssysops-p3-1-q693"], "statement": "The t2.nano instance type is broadly available across AWS regions, making unavailability an unlikely cause of an EC2 launch failure.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "medium", "id": "cl-a27d7f90ef7b", "source_question_ids": ["awssysops-p3-1-q714"], "statement": "A Lambda function triggered every 15 minutes by a CloudWatch Events rule can directly inspect each EC2 instance's launch time and terminate any instance older than a fixed age threshold (e.g., 24 hours), giving precise, low-latency age  and explicitly reserving 0 throttles every invocation.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-08cdc15a2f00", "source_question_ids": ["awssysops-p3-1-q723"], "statement": "Increasing a Lambda function's timeout controls how long a single invocation is allowed to run once it starts, but has no effect on whether an invocation can start at all when the account-level concurrency pool is exhausted.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-21a9d260481b", "source_question_ids": ["awssysops-p3-1-q723"], "statement": "Increasing a Lambda function's memory may shorten its run time but does not reserve concurrency, so it does not guarantee the function can run when other functions exhaust the account's concurrency pool.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "low", "id": "cl-0c850204c75d", "source_question_ids": ["awssysops-p3-1-q723", "awssysops-p3-1-q786", "awssysops-p3-1-q840", "awssysops-p3-1-q879", "awssysops-p3-1-q889"], "statement": "When a question's community vote credibly and substantially contradicts or splits from the given boxed answer, the question is flagged as disputed for triage while the boxed answer is nonetheless retained per the ingestion policy.", "status": "needs-review"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5352fd07f5d9", "source_question_ids": ["awssysops-p3-1-q786"], "statement": "Lambda scales automatically by launching new concurrent execution environments per incoming invocation, up to the account's or function's concurrency limit.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-1f150b3b52a4", "source_question_ids": ["awssysops-p3-1-q786"], "statement": "Ensuring a Lambda function's concurrency limit is set higher than the expected number of simultaneous invocations is the documented way to guarantee the function can scale to handle increased traffic.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-afbe40400b2b", "source_question_ids": ["awssysops-p3-1-q786"], "statement": "Attaching elastic network interfaces to a Lambda function relates to networking capacity for VPC-attached functions, not to invocation concurrency, and ENI count is an automatically-managed, capped VPC resource rather than something manually attached per function.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c1ddee6d299c", "source_question_ids": ["awssysops-p3-1-q786"], "statement": "On-demand Lambda scaling is bounded by the account and function concurrency limits, not by an Application Auto Scaling policy; Application Auto Scaling applies to Lambda only for adjusting provisioned concurrency.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-b5c552ea2e9b", "source_question_ids": ["awssysops-p3-1-q786"], "statement": "Increasing a Lambda function's memory affects a single invocation's performance and cost, not how many invocations can run in parallel.", "status": "supported"}, {"claim_type": "fact", "conditions": ["function code calls the SQS API directly (not via an SQS event source mapping)", "VPC has no internet or NAT path"], "confidence": "medium", "id": "cl-1b859849db5b", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When Lambda function code in a VPC with no internet access calls the SQS API itself, it needs an SQS interface VPC endpoint to reach the queue; an SQS event source mapping does not, because the Lambda service polls the queue outside the function's VPC.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-eabfc6c47e91", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "An RDS instance's security group must explicitly allow inbound connections from the Lambda function's security group or elastic network interface, or writes from Lambda to RDS will silently fail.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-59ac86f401fe", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "When a Lambda function and an RDS instance are located in the same VPC, no VPC endpoint is needed for the RDS traffic between them.", "status": "supported"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-f34aafa5d9c0", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A NAT gateway's presence or absence has no bearing on intra-VPC connectivity between a Lambda function and an RDS instance in the same VPC.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-b273a9a19c4b", "source_question_ids": ["awssysops-p3-1-q840"], "statement": "A missing internet gateway on a Lambda function's subnet has no bearing on data reaching RDS when the Lambda-to-RDS workflow occurs entirely within the VPC and requires no outbound internet access.", "status": "conflicted"}, {"claim_type": "rule", "confidence": "high", "id": "cl-9b5104b62a56", "source_question_ids": ["awssysops-p3-1-q849"], "statement": "Setting reserved concurrency for a Lambda function carves out a dedicated pool of concurrent executions usable only by that function, guaranteeing capacity for a target number of simultaneous jobs regardless of how much concurrency other functions in the account consume.", "status": "supported"}, {"claim_type": "fact", "confidence": "high", "id": "cl-b80907d8a1eb", "source_question_ids": ["awssysops-p3-1-q849"], "statement": "A dead-letter queue only captures failed or throttled invocations after the fact; it does not reserve capacity to prevent throttling in the first place.", "status": "supported"}, {"claim_type": "fact", "confidence": "medium", "id": "cl-8466a5a80301", "source_question_ids": ["awssysops-p3-1-q849"], "statement": "Moving Lambda execution logic into AWS Step Functions does not change Lambda's account-wide concurrency-sharing behavior.", "status": "supported"}, {"claim_type": "distractor", "confidence": "high", "id": "cl-f916139eacca", "source_question_ids": ["awssysops-p3-1-q849"], "statement": "Modifying a Lambda function's memory settings controls per-invocation compute allocation, not the number of concurrent executions available to the function.", "status": "supported"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-ce77bed09b9c", "source_question_ids": ["awssysops-p3-1-q850"], "statement": "An EventBridge (CloudWatch Events) scheduled rule invokes a Lambda function on a cron-style schedule with zero standing infrastructure and no additional cost beyond the rule itself.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-5e69be053fb2", "source_question_ids": ["awssysops-p3-1-q850"], "statement": "A CloudWatch metrics alarm is designed to fire on threshold breaches, not on a fixed nightly (or other calendar-based) schedule.", "status": "supported"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-9d4be6bbe225", "source_question_ids": ["awssysops-p3-1-q850"], "statement": "Invoking a Lambda function on a timer needs only an EventBridge scheduled rule or EventBridge Scheduler; an OpsWorks stack with a Chef recipe adds needless overhead, and OpsWorks Stacks reached end of life in May 2024.", "status": "conflicted"}, {"claim_type": "default", "conditions": [], "confidence": "high", "id": "cl-895363ee0665", "source_question_ids": ["awssysops-p3-1-q879"], "statement": "An asynchronously invoked Lambda function automatically retries a failed invocation twice by default, meaning one initial attempt plus two retries equals three total attempts.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-c8c2528f10f1", "source_question_ids": ["awssysops-p3-1-q879"], "statement": "Only after an asynchronous Lambda function's default retries are exhausted does the failed event get sent to the function's configured dead-letter queue.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-c9a9d45d9f66", "source_question_ids": ["awssysops-p3-1-q879"], "statement": "A CloudWatch alarm on Lambda errors fires on any individual error occurrence rather than specifically once a multi-attempt retry budget has been exhausted for a given invocation.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "medium", "id": "cl-737d09334135", "source_question_ids": ["awssysops-p3-1-q879"], "statement": "The AWS Health Dashboard (formerly the Personal Health Dashboard) reports AWS service and account health events, not application-level Lambda invocation failures.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "high", "id": "cl-c20695bbf972", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Moving a database from a private subnet back to a public subnet to restore Lambda connectivity reintroduces the exact security exposure that the original re-architecture (moving the database off a public endpoint) was meant to eliminate.", "status": "conflicted"}, {"claim_type": "rule", "conditions": [], "confidence": "high", "id": "cl-156eaaffce2e", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Attaching a Lambda function to the same VPC as a private-subnet database, then connecting via the database's private endpoint, is the standard documented pattern for a VPC-attached Lambda function to reach VPC-internal resources.", "status": "conflicted"}, {"claim_type": "distractor", "conditions": [], "confidence": "medium", "id": "cl-d4831f197b79", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "A Lambda interface VPC endpoint (PrivateLink) only lets clients in a VPC call the Lambda API privately; it does not give the function network access into the VPC, so it cannot reach a private-subnet database. The function must be attached to the VPC.", "status": "conflicted"}, {"claim_type": "fact", "conditions": [], "confidence": "high", "id": "cl-35740b3ad868", "source_question_ids": ["awssysops-p3-1-q889"], "statement": "Attaching an IAM role to a Lambda function only grants permissions to call AWS APIs; it has no bearing on network-level connectivity to a database.", "status": "supported"}], "mentalModel": {"id": "aws-sysops-service-lambda--m-1", "title": "Lambda invocations are slots drawn from a shared concurrency pool, started by an external trigger", "purpose": "Lets you predict whether a Lambda function will start, how many copies run at once, what runs it on a schedule, and what it can reach, so you can tell the one knob that fixes a problem from the knobs that only look related.", "mechanism": "Lambda never runs on its own. Something outside it starts each invocation: an EventBridge (formerly CloudWatch Events) scheduled rule, an S3 event, an async caller, and so on. Each invocation that runs at the same time as others takes its own execution environment, and every environment takes one slot from the account's shared concurrency pool. When the pool runs out, new invocations are throttled before they start. Reserved concurrency sets aside a fixed number of slots for one function, which guarantees that capacity and also caps the function at it. Memory and timeout only shape a single invocation once it has started: memory sets its compute, and timeout sets how long it can run, up to 15 minutes. Neither changes how many invocations can start. After an async invocation fails, Lambda retries it twice (three attempts in total), and only then sends the event to the dead-letter queue. The DLQ records failures after the fact and does not prevent them. For networking, the function's SDK calls can target any region. Only attaching the function to a VPC lets it reach private resources there, and inside that VPC security groups still decide which traffic is allowed.", "predict_prompt": "Many S3 uploads arrive at once and a second, unrelated Lambda function starts throttling. If you double the second function's memory and timeout, will it stop throttling? What single change guarantees it can run?", "invariants": ["Every concurrent invocation uses one slot from the account pool. Throttling means no slot was available, not that the function was too slow.", "Reserved concurrency both guarantees and caps a function's slots. Reserving 0 throttles every invocation.", "Memory, timeout, and the DLQ act on one invocation (its speed, its duration, or what happens after it fails). None of them adds parallel capacity.", "A schedule comes from outside the function (an EventBridge rule or EventBridge Scheduler). The function cannot schedule itself."], "limits": ["One invocation can run for at most 15 minutes, so a job that runs for hours belongs on EC2 (On-Demand, or Reserved for an always-on tier), not in Lambda.", "Application Auto Scaling only adjusts provisioned concurrency. It is not what bounds on-demand scaling.", "IAM roles grant API permissions only. Network reach comes from VPC attachment, security groups, and VPC endpoints for the AWS APIs the function code calls itself."], "cues": ["'other functions throttle' or 'guarantee N simultaneous jobs' points to reserved concurrency", "'run nightly' or 'every 15 minutes' points to an EventBridge scheduled rule, not an EC2 cron host, OpsWorks, or a CloudWatch alarm", "'after retries are exhausted' points to the async default of 2 retries, then the DLQ", "'database in a private subnet' points to attaching the Lambda function to that VPC and allowing its security group in the database's security group"], "claim_ids": ["cl-5352fd07f5d9", "cl-4566d49f416a", "cl-88bed643c41f", "cl-9b5104b62a56", "cl-08cdc15a2f00", "cl-b5c552ea2e9b", "cl-1b82f17f2117", "cl-664d7e9ea9dc", "cl-866b07ab4945", "cl-ce77bed09b9c", "cl-895363ee0665", "cl-c8c2528f10f1", "cl-b80907d8a1eb", "cl-c1ddee6d299c", "cl-f2deb7a7471c", "cl-156eaaffce2e", "cl-d4831f197b79", "cl-35740b3ad868", "cl-eabfc6c47e91", "cl-1b859849db5b"]}, "contrastSet": {"id": "aws-sysops-service-lambda--cs-1", "subjects": ["Reserved concurrency", "Increase memory", "Increase timeout", "Dead-letter queue"], "dimensions": ["What it changes", "Prevents throttling when the pool is exhausted?", "Effect on parallel invocations", "When it acts"], "shared_traits": ["Each is a per-function Lambda configuration setting", "Each shows up as an answer choice when a function is throttled or its jobs fail under load"], "matrix": {"What it changes": {"Reserved concurrency": "Slots set aside for the function in the account pool", "Increase memory": "Compute (CPU and RAM) for each invocation", "Increase timeout": "Maximum run time for each invocation (up to 15 min)", "Dead-letter queue": "Where failed async events are sent"}, "Prevents throttling when the pool is exhausted?": {"Reserved concurrency": "Yes, its slots are guaranteed", "Increase memory": "No", "Increase timeout": "No", "Dead-letter queue": "No, it only records failures"}, "Effect on parallel invocations": {"Reserved concurrency": "Guarantees N and caps the function at N", "Increase memory": "None", "Increase timeout": "None (longer runs can even hold slots longer)", "Dead-letter queue": "None"}, "When it acts": {"Reserved concurrency": "Before the invocation starts", "Increase memory": "While the invocation runs", "Increase timeout": "While the invocation runs", "Dead-letter queue": "After the retries are exhausted"}}, "decision_rule": "Ask whether the problem is an invocation that cannot start (not enough concurrent slots) or one that starts and then runs badly. Only reserved concurrency changes whether an invocation can start. Memory and timeout only change an invocation that is already running, and the DLQ only acts after it has failed.", "boundary_flip": "If the symptom changes from 'Task timed out after N seconds' on an invocation that did start to 'other functions throttle when S3 uploads spike', the correct answer flips from increasing the timeout (or memory) to setting reserved concurrency.", "strongest_distractor_failure": "Increasing memory is attractive because it shortens run time, but it reserves no slots. When an S3 burst uses up the shared pool, the function with more memory is throttled just like before.", "exceptions": ["Reserved concurrency is also a cap. Reserving 0, or reserving fewer slots than the expected simultaneous invocations, causes throttling instead of preventing it.", "Moving the logic into Step Functions does not change Lambda's account-wide concurrency sharing."], "claim_ids": ["cl-4566d49f416a", "cl-88bed643c41f", "cl-9b5104b62a56", "cl-1f150b3b52a4", "cl-08cdc15a2f00", "cl-21a9d260481b", "cl-b5c552ea2e9b", "cl-f916139eacca", "cl-b80907d8a1eb", "cl-8466a5a80301", "cl-c8c2528f10f1", "cl-1b82f17f2117"]}, "scenarioFamily": {"id": "aws-sysops-service-lambda--sf-1", "canonical": {"prompt": "A company runs many Lambda functions in one AWS account under default (unreserved) concurrency settings. A nightly batch job uploads several thousand files to an S3 bucket within a few minutes, and each upload triggers an S3 event that invokes an ingestion Lambda function once per file. Shortly after the upload burst begins, an unrelated order-processing Lambda function — which nobody has changed — starts failing invocations with 'Rate Exceeded' (throttling) errors. What should you configure on the order-processing function to guarantee it keeps running during the upload burst, regardless of how much concurrency the ingestion function consumes?", "expected_answer": ["Set reserved concurrency on the order-processing Lambda function"], "reasoning": "The S3-triggered ingestion function invoking once per uploaded file burst-consumes the account's shared concurrency pool, starving other functions of execution slots and causing them to throttle. Reserved concurrency carves out a dedicated pool of slots usable only by the order-processing function, guaranteeing it capacity regardless of how much concurrency other functions in the account consume.", "distractor_analysis": "Increasing memory only affects a single invocation's performance and cost, not how many invocations can run in parallel, so it would not stop the throttling. Increasing timeout controls how long an already-started invocation may run, but has no effect on whether an invocation can start at all when the account-level pool is exhausted.", "claim_ids": ["cl-4566d49f416a", "cl-88bed643c41f", "cl-21a9d260481b", "cl-b5c552ea2e9b", "cl-08cdc15a2f00"], "difficulty": "medium", "importance": "high"}, "variants": [{"variant_type": "boundary", "changed_condition": "Instead of other, unrelated functions throttling, the order-processing function itself keeps starting normally but now fails partway through a single invocation with 'Task timed out after 30 seconds' while processing one large order — no other functions are affected.", "prompt": "The same order-processing Lambda function now runs without any throttling errors, but individual invocations are failing with 'Task timed out after 30 seconds' while processing a single large order. No other functions in the account are affected. The order typically needs about 45 seconds to finish and the function is far from Lambda's hard execution ceiling. What should you adjust so this invocation can complete?", "expected_answer": ["Increase the function's configured timeout (up to the 15-minute maximum)"], "reasoning": "The symptom has moved from 'cannot start' (pool exhaustion) to 'started but ran out of allotted time,' which is exactly the invariant that flips the fix: timeout governs how long an already-running invocation may execute, up to a 15-minute ceiling, and has no bearing on concurrency-pool admission. Since the invocation is starting fine, reserved concurrency would not help here; raising the timeout lets the single invocation run long enough to finish.", "distractor_analysis": "Reserved concurrency only changes whether an invocation can start when the shared pool is exhausted; it does nothing for an invocation that already started and ran out of time. The dead-letter queue only records the invocation after it fails, which does not let it finish.", "claim_ids": ["cl-08cdc15a2f00", "cl-1b82f17f2117"], "difficulty": "medium", "importance": "high"}, {"variant_type": "irrelevant-detail", "changed_condition": "The order-processing function is additionally described as written in Python 3.12, already configured with 512 MB of memory, and set to retain its CloudWatch Logs for 30 days — none of which bears on the throttling question.", "prompt": "The order-processing Lambda function is written in Python 3.12, already configured with 512 MB of memory, and has its CloudWatch Logs retention set to 30 days. During the same nightly S3 upload burst described above, it starts failing invocations with 'Rate Exceeded' throttling errors even though nobody changed it. What should you configure on the order-processing function to guarantee it keeps running during the upload burst, regardless of how much concurrency the ingestion function consumes?", "expected_answer": ["Set reserved concurrency on the order-processing Lambda function"], "reasoning": "The runtime language, existing memory setting, and log retention period do not interact with the account's shared concurrency pool at all — the pool is exhausted purely by the number of concurrent S3-triggered invocations from the ingestion function. The fix is unchanged: reserved concurrency carves out dedicated slots for the order-processing function regardless of these cosmetic configuration details.", "distractor_analysis": "A test-taker might assume the already-set 512 MB of memory is relevant to whether the function can keep up, but memory affects only a single invocation's compute, not how many invocations can run in parallel, so it is irrelevant to the throttling symptom.", "claim_ids": ["cl-4566d49f416a", "cl-88bed643c41f", "cl-b5c552ea2e9b"], "difficulty": "medium", "importance": "medium"}, {"variant_type": "adversarial-distractor", "changed_condition": "A colleague proposes a specific, plausible-sounding fix instead of asking an open question: raising the order-processing function's memory from 128 MB to 1024 MB, reasoning that a faster-running function will free up its slot sooner and therefore clear the backlog caused by the S3 upload burst.", "prompt": "During the same nightly S3 upload burst, a colleague proposes raising the order-processing Lambda function's memory from 128 MB to 1024 MB, arguing that a faster invocation will free up its execution slot sooner and reduce the throttling. Is this the right fix, and if not, what should be configured instead to guarantee the function keeps running during the burst?", "expected_answer": ["Set reserved concurrency on the order-processing Lambda function"], "reasoning": "Increasing memory may shorten a single invocation's run time, but it does not reserve any concurrency; it only changes compute allocated to invocations that have already been granted a slot. The function is still competing for slots from the same shared account pool that the S3 burst is consuming, so it is throttled just as before. Only reserved concurrency guarantees it a dedicated pool of slots that other functions cannot take.", "distractor_analysis": "The colleague's reasoning sounds plausible because faster invocations do hold their slot for less time, but this does not add parallel capacity or guarantee admission when the pool is already exhausted at the moment new invocations try to start — the function can still be throttled before it ever gets the chance to run faster.", "claim_ids": ["cl-21a9d260481b", "cl-b5c552ea2e9b", "cl-88bed643c41f", "cl-4566d49f416a"], "difficulty": "hard", "importance": "high"}, {"variant_type": "transfer", "changed_condition": "The trigger causing the concurrency-pool exhaustion changes from an S3 upload burst invoking an ingestion function to a flash-sale traffic spike through API Gateway invoking a payment-processing function synchronously, and the throttled victim changes from an order-processing function to a reporting function.", "prompt": "A different system has an API Gateway endpoint that invokes a payment-processing Lambda function synchronously. During a flash sale, thousands of checkout requests arrive within a minute, driving many concurrent payment-processing invocations. Shortly after, an unrelated reporting Lambda function in the same account — which nobody has changed — starts failing with 'Rate Exceeded' throttling errors. What should you configure on the reporting function to guarantee it keeps running during the flash sale, regardless of how much concurrency the payment-processing function consumes?", "expected_answer": ["Set reserved concurrency on the reporting Lambda function"], "reasoning": "Lambda functions all draw concurrent execution slots from the same account-wide shared pool no matter what triggers them — an S3 event, an API Gateway request, or anything else. A burst of concurrent invocations from any high-volume trigger can exhaust that shared pool and throttle unrelated functions. Reserved concurrency is what carves out guaranteed slots for a specific function, independent of which trigger is consuming the rest of the pool.", "distractor_analysis": "Increasing the reporting function's memory or timeout would still only affect a single invocation once it starts; neither reserves slots in the shared pool, so neither would stop the reporting function from being throttled while the payment-processing function's burst is active.", "claim_ids": ["cl-88bed643c41f", "cl-08cdc15a2f00", "cl-21a9d260481b", "cl-b5c552ea2e9b"], "difficulty": "medium", "importance": "medium"}]}, "issues": [{"type": "contradiction", "severity": "high", "description": "The mental model and contrast set treat several claims marked 'conflicted' as settled fact, and some of them carry high confidence. Examples: reserved concurrency guarantees and caps (cl-88bed643c41f), timeout has no effect on starting (cl-08cdc15a2f00), async default of 2 retries then DLQ (cl-895363ee0665, cl-c8c2528f10f1), Application Auto Scaling only for provisioned concurrency (cl-c1ddee6d299c), VPC attachment for private DBs (cl-156eaaffce2e, cl-d4831f197b79), the RDS security-group rule (cl-eabfc6c47e91), the SQS endpoint rule (cl-1b859849db5b), and concurrency limit above expected invocations (cl-1f150b3b52a4). They appear as invariants, cues, matrix cells, and the decision rule, and nothing tells the learner that their source questions are disputed. The conflicts need to be resolved or surfaced, not silently absorbed.", "related_entity_ids": ["aws-sysops-service-lambda--m-1", "aws-sysops-service-lambda--cs-1", "cl-88bed643c41f", "cl-08cdc15a2f00", "cl-895363ee0665", "cl-c8c2528f10f1", "cl-c1ddee6d299c", "cl-156eaaffce2e", "cl-d4831f197b79", "cl-eabfc6c47e91", "cl-1b859849db5b", "cl-1f150b3b52a4"]}, {"type": "quality", "severity": "medium", "description": "cl-0c850204c75d is not exam knowledge. It is a meta-statement about the ingestion policy: disputed questions keep their boxed answer. It still records that source questions q723, q786, q840, q879 and q889 have community votes that contradict or split from the boxed answer. Every domain claim derived from those questions therefore rests on an answer the source itself disputes. This should be an issue flag, not a claim.", "related_entity_ids": ["cl-0c850204c75d"]}, {"type": "ambiguity", "severity": "medium", "description": "Claims from q558 (cl-ecd138648e72, cl-9ca0fd33a41d) and from q714 (cl-a27d7f90ef7b, cl-dcdfc7875035) are marked 'conflicted'. Neither question is in the disputed list of cl-0c850204c75d, and no reason for the conflict is recorded. Each of these questions has only one source, so it is unclear what the claims conflict with. Sibling claims from the same questions are marked 'supported' (cl-e5ff853f85f3, cl-9e66c3e8d511, cl-bc4931b47574), which makes it unclear which answer choice is actually disputed.", "related_entity_ids": ["cl-ecd138648e72", "cl-9ca0fd33a41d", "cl-a27d7f90ef7b", "cl-dcdfc7875035"]}, {"type": "contradiction", "severity": "medium", "description": "The q840 claims disagree on the root cause of the Lambda-to-RDS failure. cl-eabfc6c47e91 puts it on a missing RDS security-group rule. cl-1b859849db5b says function code in a no-internet VPC needs an SQS interface endpoint. cl-f34aafa5d9c0 and cl-b273a9a19c4b say NAT and IGW absence do not matter only under the hedge that the workflow is entirely intra-VPC, which is false if the function calls SQS itself. All are marked conflicted and q840 is disputed. Even so, the mental model's cue ('database in a private subnet' points to allowing its security group) and its limits line present the security-group answer as settled without flagging the dispute.", "related_entity_ids": ["cl-eabfc6c47e91", "cl-1b859849db5b", "cl-f34aafa5d9c0", "cl-b273a9a19c4b", "aws-sysops-service-lambda--m-1"]}, {"type": "unsupported-generation", "severity": "medium", "description": "cl-eabfc6c47e91 says Lambda writes to RDS 'will silently fail' without a security-group rule. Blocked traffic makes connections time out or error, which is visible in the function's errors and logs, so it is not a silent failure. The claim is marked high confidence despite being conflicted, and the mental model relies on it.", "related_entity_ids": ["cl-eabfc6c47e91", "aws-sysops-service-lambda--m-1"]}, {"type": "stale-risk", "severity": "medium", "description": "q563's claims depend on Spot blocks. cl-0d4b5c37c295 is marked 'supported' with high confidence, yet cl-a14ac8c042bc records that the feature was deprecated in 2021-2022. The replacement guidance in cl-ccf8d7523a75 (On-Demand for non-interruptible jobs) is still needs-review. The source question's correct answer is likely obsolete, and the limits line in the mental model ('belongs on EC2 (On-Demand, or Reserved...)') leans on that unreviewed replacement.", "related_entity_ids": ["cl-0d4b5c37c295", "cl-a14ac8c042bc", "cl-ccf8d7523a75", "aws-sysops-service-lambda--m-1"]}, {"type": "unsupported-generation", "severity": "low", "description": "Some statements in m-1 rest on claims missing from its claim_ids. The limit that hour-long jobs belong on 'EC2 (On-Demand, or Reserved for an always-on tier)' rests on cl-ccf8d7523a75 and cl-d3a9a2257212. The cue rejecting 'an EC2 cron host, OpsWorks, or a CloudWatch alarm' rests on cl-971df35b7513, cl-9d4be6bbe225 (conflicted) and cl-5e69be053fb2. The model also offers EC2 as the only home for long jobs; the claims support that only for the specific q563 scenario.", "related_entity_ids": ["aws-sysops-service-lambda--m-1", "cl-ccf8d7523a75", "cl-d3a9a2257212", "cl-971df35b7513", "cl-9d4be6bbe225", "cl-5e69be053fb2"]}, {"type": "quality", "severity": "low", "description": "The cs-1 matrix marks memory and timeout as having 'None' effect on parallel invocations, but its own timeout cell notes that longer runs hold slots longer. The concurrency a function uses is roughly its request rate times its average duration. A memory increase that shortens run time therefore lowers the slots in use, and a longer-running function holds more. The accurate distinction is 'does not reserve or guarantee slots' (cl-21a9d260481b), not 'no effect'.", "related_entity_ids": ["aws-sysops-service-lambda--cs-1", "cl-21a9d260481b", "cl-b5c552ea2e9b", "cl-f916139eacca"]}, {"type": "quality", "severity": "low", "description": "cl-c9a9d45d9f66 says a CloudWatch alarm on Lambda errors 'fires on any individual error occurrence'. CloudWatch alarms evaluate a metric statistic over periods against a configured threshold, so they do not fire on each error. The statement misdescribes alarm semantics, and the claim is conflicted.", "related_entity_ids": ["cl-c9a9d45d9f66"]}, {"type": "stale-risk", "severity": "low", "description": "cl-ebaa709b1528 says t2.nano is 'broadly available across AWS regions'. t2 is a previous-generation family that is not offered in several newer regions, so ruling out instance-type unavailability as a cause of launch failure may not hold everywhere.", "related_entity_ids": ["cl-ebaa709b1528"]}], "sourceQuestionCount": 12}], "sources": {"kind": "locked", "file": "aws-sysops-service-lambda-5yps.sources.enc.js"}}</script>
<script>
(function () {
  'use strict';

  const BUNDLE = JSON.parse(document.getElementById('ekd-data').textContent);
  var CURRENT = null;
  var STORAGE_KEY = null;

  // ---------- data-source seam. The slice bodies (mental model, claims,
  // etc.) ride inline in BUNDLE; only sourceQuestions live in sibling files,
  // loaded on demand via injected <script> tags (fetch/XHR can't read a
  // sibling under file:// -- each file:// resource is its own origin). ----------
  function getManifest() {
    return Promise.resolve(BUNDLE.slices.map(function (s) {
      return { id: s.contentSet.id, facet: s.contentSet.facet, questionCount: s.sourceQuestionCount || 0 };
    }));
  }
  function loadSlice(sliceId) {
    var found = BUNDLE.slices.filter(function (s) { return s.contentSet.id === sliceId; })[0];
    return found ? Promise.resolve(found) : Promise.reject(new Error('unknown slice: ' + sliceId));
  }

  const DIAGNOSIS_CATEGORIES = [
    { key: 'recall_gap', label: 'Recall gap', hint: 'Could not retrieve the relevant fact or rule.' },
    { key: 'model_gap', label: 'Model gap', hint: 'Did not understand the underlying mechanism.' },
    { key: 'boundary_confusion', label: 'Boundary confusion', hint: 'Knew both alternatives but chose on the wrong dimension.' },
    { key: 'exception_default_confusion', label: 'Exception/default confusion', hint: 'Applied a general rule where an exception controlled.' },
    { key: 'cue_miss', label: 'Cue miss', hint: 'Overlooked a decisive phrase or condition.' },
    { key: 'distractor_attraction', label: 'Distractor attraction', hint: 'Used an appealing but irrelevant or false rule.' },
    { key: 'question_interpretation', label: 'Question interpretation', hint: 'Misread the task, qualifier, or number of required answers.' },
    { key: 'careless_execution', label: 'Careless execution', hint: 'Knew the answer but selected or recorded it incorrectly.' },
    { key: 'source_content_issue', label: 'Source/content issue', hint: 'The item appears ambiguous, contradictory, or unsupported.' },
  ];

  // ---------- safe HTML templating: `safe` escapes every interpolated
  // value by default; wrap an already-built HTML string in raw(...) to
  // splice it in verbatim. Never interpolate untrusted text without this. ----------
  function escapeHtml(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function raw(html) { return { __raw: String(html === undefined || html === null ? '' : html) }; }
  function safe(strings) {
    var values = Array.prototype.slice.call(arguments, 1);
    return strings.reduce(function (acc, str, i) {
      var v = values[i];
      var piece = i < values.length ? (v && typeof v === 'object' && '__raw' in v ? v.__raw : escapeHtml(v)) : '';
      return acc + str + piece;
    }, '');
  }
  function fromHTML(htmlString) {
    var tpl = document.createElement('template');
    tpl.innerHTML = htmlString;
    return tpl.content;
  }
  function listBlock(title, items) {
    if (!items || !items.length) return '';
    return safe`<h3>${title}</h3><ul>${raw(items.map(function (i) { return safe`<li>${i}</li>`; }).join(''))}</ul>`;
  }
  function claimListItemHtml(c) {
    var status = c.status || 'status unknown';
    return safe`<li><span class="badge status-${status.replace(/\s+/g, '-')}">${status.replace(/-/g, ' ')}</span><span>${c.statement}</span>${raw(markControlHtml('claim:' + c.id))}</li>`;
  }
  function citationsHtml(claimIds) {
    var claims = (claimIds || []).map(function (id) {
      return (CURRENT.claims || []).find(function (c) { return c.id === id; });
    }).filter(Boolean);
    if (!claims.length) return safe`<p class="muted">No supporting claims linked.</p>`;
    return safe`
      <details class="claims">
        <summary>Supporting claims <span class="tally">${claims.length}</span></summary>
        <ul class="citations">${raw(claims.map(claimListItemHtml).join(''))}</ul>
      </details>`;
  }
  function truncate(text, max) {
    text = text || '';
    return text.length > max ? text.slice(0, max).trimEnd() + '…' : text;
  }

  // ---------- learner-state persistence ----------
  var storageAvailable = true;

  function emptyState() {
    return { schemaVersion: 1, attempts: [], learnProgress: {}, marks: {}, updatedAt: null };
  }

  function loadState() {
    try {
      var rawText = localStorage.getItem(STORAGE_KEY);
      if (!rawText) return emptyState();
      var parsed = JSON.parse(rawText);
      return {
        schemaVersion: 1,
        attempts: Array.isArray(parsed.attempts) ? parsed.attempts : [],
        learnProgress: parsed.learnProgress && typeof parsed.learnProgress === 'object' ? parsed.learnProgress : {},
        marks: parsed.marks && typeof parsed.marks === 'object' ? parsed.marks : {},
        updatedAt: parsed.updatedAt || null,
      };
    } catch (err) {
      storageAvailable = false;
      return emptyState();
    }
  }

  var STATE = emptyState();

  // ---------- confidence marks: the learner's own "flag this for review"
  // priority on a claim or source question -- distinct from a claim's
  // generated `confidence` field and Practice's self-reported `confidence`
  // radio, so this one is named `marks` to avoid colliding with either. ----------
  var MARK_LEVELS = ['low', 'medium', 'high'];

  function markControlHtml(key) {
    var active = STATE.marks[key];
    return safe`<span class="mark-control" data-mark-key="${key}">${raw(MARK_LEVELS.map(function (level) {
      var isActive = active === level;
      return safe`<button type="button" class="mark-dot mark-${level}${raw(isActive ? ' is-active' : '')}" data-mark-value="${level}" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="Mark ${level} priority"></button>`;
    }).join(''))}</span>`;
  }

  function handleMarkClick(event) {
    var dot = event.target.closest('.mark-dot');
    if (!dot) return;
    var key = dot.closest('.mark-control').getAttribute('data-mark-key');
    var value = dot.getAttribute('data-mark-value');
    if (STATE.marks[key] === value) delete STATE.marks[key];
    else STATE.marks[key] = value;
    saveState();
    navigate();
  }

  function saveState() {
    STATE.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
    }
    renderStorageWarning();
  }

  function renderStorageWarning() {
    var el = document.getElementById('storage-warning');
    if (storageAvailable) {
      el.classList.add('hidden');
      el.textContent = '';
    } else {
      el.classList.remove('hidden');
      el.textContent = 'Local storage is unavailable in this browser session (private or incognito mode?). '
        + 'Progress will not be saved after this tab closes, so export it before leaving.';
    }
  }

  // ---------- export / import ----------
  function exportProgress() {
    var payload = {
      format: 'ekd-learner-state',
      contentSetId: CURRENT.contentSet.id,
      schemaVersion: CURRENT.contentSet.schemaVersion,
      exportedAt: new Date().toISOString(),
      integrity: { attemptCount: STATE.attempts.length },
      learnerState: STATE,
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-progress-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- one-way revision export: groups everything currently marked
  // by level (low, then medium, then high) into a Markdown file. Never
  // re-imported, unlike exportProgress's JSON. ----------
  function exportRevisionNotes() {
    var questions = (SOURCES.status === 'ready' ? SOURCES.bySlice : {})[CURRENT.contentSet.id] || [];
    var claimsById = {};
    (CURRENT.claims || []).forEach(function (c) { claimsById[c.id] = c; });

    var byLevel = { low: [], medium: [], high: [] };
    Object.keys(STATE.marks).forEach(function (key) {
      var level = STATE.marks[key];
      if (byLevel[level]) byLevel[level].push(key);
    });

    var lines = ['# Revision notes: ' + CURRENT.contentSet.facet.value, ''];
    MARK_LEVELS.forEach(function (level) {
      var keys = byLevel[level];
      if (!keys.length) return;
      lines.push('## ' + level.charAt(0).toUpperCase() + level.slice(1) + ' priority', '');
      keys.forEach(function (key) {
        var sepIndex = key.indexOf(':');
        var kind = key.slice(0, sepIndex);
        var id = key.slice(sepIndex + 1);
        if (kind === 'claim') {
          var claim = claimsById[id];
          lines.push('- ' + (claim ? claim.statement : '(claim ' + id + ' no longer available)'), '');
        } else if (kind === 'question') {
          var q = questions.find(function (item) { return item.id === id; });
          if (!q) {
            lines.push('### ' + id, '', '(question details unavailable -- open Explore Sources to load question data)', '');
            return;
          }
          lines.push('### ' + q.id, '', q.stem || '', '');
          (q.choices || []).forEach(function (c) {
            var isCorrect = (q.correct_answer || []).indexOf(c.letter) !== -1;
            lines.push('- ' + c.letter + '. ' + c.text + (isCorrect ? ' (correct)' : ''));
          });
          lines.push('', '**Correct answer:** ' + (q.correct_answer || []).join(', '), '', '**Explanation:** ' + (q.explanation || ''), '');
        }
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = CURRENT.contentSet.id + '-revision-' + Date.now() + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function validateImportPayload(payload) {
    var errors = [];
    if (!isPlainObject(payload)) { errors.push('not a JSON object'); return { ok: false, errors: errors }; }
    if (payload.format !== 'ekd-learner-state') errors.push('unrecognized export format');
    if (payload.contentSetId !== CURRENT.contentSet.id) errors.push('content set mismatch (file is for ' + payload.contentSetId + ')');
    if (payload.schemaVersion !== CURRENT.contentSet.schemaVersion) errors.push('incompatible schema version');
    if (!isPlainObject(payload.learnerState)) {
      errors.push('missing learnerState');
    } else {
      if (!Array.isArray(payload.learnerState.attempts)) {
        errors.push('learnerState.attempts is not an array');
      } else {
        for (var i = 0; i < payload.learnerState.attempts.length; i++) {
          var a = payload.learnerState.attempts[i];
          if (!isPlainObject(a) || typeof a.id !== 'string' || typeof a.itemId !== 'string') {
            errors.push('malformed attempt record');
            break;
          }
        }
      }
      if (payload.learnerState.learnProgress !== undefined && !isPlainObject(payload.learnerState.learnProgress)) {
        errors.push('learnerState.learnProgress is not an object');
      }
      if (payload.learnerState.marks !== undefined && !isPlainObject(payload.learnerState.marks)) {
        errors.push('learnerState.marks is not an object');
      }
    }
    return { ok: errors.length === 0, errors: errors };
  }

  function sanitizeLearnerState(rawState) {
    var attempts = Array.isArray(rawState.attempts)
      ? rawState.attempts.filter(function (a) { return isPlainObject(a) && typeof a.id === 'string' && typeof a.itemId === 'string'; })
      : [];
    var learnProgress = {};
    if (isPlainObject(rawState.learnProgress)) {
      Object.keys(rawState.learnProgress).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.learnProgress[key];
        if (isPlainObject(v)) {
          learnProgress[key] = {
            predicted: !!v.predicted,
            revealed: !!v.revealed,
            predictedAnswer: typeof v.predictedAnswer === 'string' ? v.predictedAnswer : '',
          };
        }
      });
    }
    var marks = {};
    if (isPlainObject(rawState.marks)) {
      Object.keys(rawState.marks).forEach(function (key) {
        if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
        var v = rawState.marks[key];
        if (MARK_LEVELS.indexOf(v) !== -1) marks[key] = v;
      });
    }
    return {
      schemaVersion: 1,
      attempts: attempts,
      learnProgress: learnProgress,
      marks: marks,
      updatedAt: typeof rawState.updatedAt === 'string' ? rawState.updatedAt : null,
    };
  }

  function importProgress(event) {
    var file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        window.alert('Import failed: the file is not valid JSON.');
        return;
      }
      var validation = validateImportPayload(parsed);
      if (!validation.ok) {
        window.alert('Import rejected:\n' + validation.errors.join('\n'));
        return;
      }
      var incoming = sanitizeLearnerState(parsed.learnerState);
      var hasExisting = STATE.attempts.length > 0 || Object.keys(STATE.learnProgress).length > 0;
      var mode = 'replace';
      if (hasExisting) {
        mode = window.confirm(
          'You have existing local progress (' + STATE.attempts.length + ' attempts).\n\n'
          + 'Click OK to MERGE with the imported file, or Cancel to REPLACE local progress with the imported file.'
        ) ? 'merge' : 'replace';
      }
      if (mode === 'merge') {
        var seen = {};
        STATE.attempts.forEach(function (a) { seen[a.id] = true; });
        incoming.attempts.forEach(function (a) { if (!seen[a.id]) { STATE.attempts.push(a); seen[a.id] = true; } });
        Object.keys(incoming.learnProgress).forEach(function (key) { STATE.learnProgress[key] = incoming.learnProgress[key]; });
        Object.keys(incoming.marks).forEach(function (key) { STATE.marks[key] = incoming.marks[key]; });
      } else {
        STATE = incoming;
      }
      saveState();
      navigate();
      window.alert('Import complete (' + mode + '). ' + incoming.attempts.length + ' attempts read from file.');
    };
    reader.readAsText(file);
  }

  // ---------- Learn ----------
  function renderLearn() {
    var model = CURRENT.mentalModel;
    if (!model) {
      return fromHTML(safe`<section><h2>Learn</h2><p class="empty">No mental model was generated for this slice yet.</p></section>`);
    }
    var progress = STATE.learnProgress[model.id] || {};
    var predictPrompt = model.predict_prompt || ('Before reading on: in one sentence, what problem does "' + model.title + '" solve?');
    var html = safe`
      <section class="learn">
        <h2>${model.title}</h2>
        <p class="purpose lead">${model.purpose || ''}</p>
        <div class="predict-block panel">
          <label class="field-label" for="predict-input">${progress.revealed ? 'Your prediction' : 'Predict first'}</label>
          <p class="prompt" id="predict-prompt">${predictPrompt}</p>
          <textarea id="predict-input" rows="3" aria-describedby="predict-prompt" ${raw(progress.revealed ? 'disabled' : '')}>${progress.predictedAnswer || ''}</textarea>
          ${raw(progress.revealed ? '' : '<div class="actions"><button id="reveal-model-btn" type="button">Reveal mechanism</button></div>')}
        </div>
        <div class="mechanism ${raw(progress.revealed ? '' : 'hidden')}">
          <h3>Mechanism</h3>
          <p>${model.mechanism || ''}</p>
          ${raw(listBlock('Invariants', model.invariants))}
          ${raw(listBlock('Limits and failure modes', model.limits))}
          ${raw(listBlock('Observable cues', model.cues))}
          ${raw(citationsHtml(model.claim_ids))}
        </div>
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this model &rarr;</a></p>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var revealBtn = section.querySelector('#reveal-model-btn');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        var val = section.querySelector('#predict-input').value;
        STATE.learnProgress[model.id] = { predicted: true, revealed: true, predictedAnswer: val };
        saveState();
        navigate();
      });
    }
    return node;
  }

  // ---------- Compare ----------
  function renderCompare() {
    var cs = CURRENT.contrastSet;
    if (!cs) {
      return fromHTML(safe`<section><h2>Compare</h2><p class="empty">No contrast set was generated for this slice yet.</p></section>`);
    }
    var subjects = cs.subjects || [];
    var dims = cs.dimensions || [];
    var matrix = cs.matrix || {};
    var rows = dims.map(function (d) {
      var cells = subjects.map(function (s) { return safe`<td>${(matrix[d] || {})[s] || ''}</td>`; }).join('');
      return safe`<tr><th scope="row">${d}</th>${raw(cells)}</tr>`;
    }).join('');
    var headCells = subjects.map(function (s) { return safe`<th scope="col">${s}</th>`; }).join('');
    var html = safe`
      <section class="compare">
        <h2>Compare: ${subjects.join(' vs. ')}</h2>
        ${raw(listBlock('Shared traits', cs.shared_traits))}
        <div class="table-wrap" tabindex="0" role="region" aria-label="Comparison table">
          <table class="contrast-table">
            <thead><tr><th scope="col">Dimension</th>${raw(headCells)}</tr></thead>
            <tbody>${raw(rows)}</tbody>
          </table>
        </div>
        <div class="callout">
          <h3>Decision rule</h3>
          <p>${cs.decision_rule || ''}</p>
        </div>
        <h3>Boundary flip</h3>
        <p>${cs.boundary_flip || ''}</p>
        <h3>Why the strongest distractor fails</h3>
        <p>${cs.strongest_distractor_failure || ''}</p>
        ${raw(listBlock('Exceptions', cs.exceptions))}
        ${raw(citationsHtml(cs.claim_ids))}
        <p class="next-link"><a href="${sliceHref('practice')}">Practice this contrast &rarr;</a></p>
      </section>`;
    return fromHTML(html);
  }

  // ---------- Practice ----------
  function practiceItems() {
    var fam = CURRENT.scenarioFamily;
    if (!fam) return [];
    var items = [];
    if (fam.canonical) items.push(Object.assign({}, fam.canonical, { variant_type: fam.canonical.variant_type || 'canonical' }));
    (fam.variants || []).forEach(function (v) { items.push(v); });
    return items.map(function (item, i) {
      return Object.assign({}, item, { id: item.id || (fam.id + '-item-' + i) });
    });
  }

  var practiceIndex = 0;

  function renderPractice() {
    var items = practiceItems();
    if (!items.length) {
      return fromHTML(safe`<section><h2>Practice</h2><p class="empty">No scenario family was generated for this slice yet.</p></section>`);
    }
    if (practiceIndex >= items.length) {
      var itemIds = items.map(function (it) { return it.id; });
      var attempted = STATE.attempts.filter(function (a) { return itemIds.indexOf(a.itemId) !== -1; });
      var correctCount = attempted.filter(function (a) { return a.correct; }).length;
      var pendingCount = STATE.attempts.filter(function (a) { return a.diagnosis === 'pending'; }).length;
      var diagnoseLink = pendingCount
        ? safe`<a class="button-link" href="${sliceHref('diagnose')}">Diagnose ${pendingCount} ${pendingCount === 1 ? 'miss' : 'misses'}</a>`
        : '';
      var html = safe`
        <section class="practice">
          <h2>Practice</h2>
          <div class="panel summary">
            <p class="summary-label">Queue complete</p>
            <p class="score"><strong>${correctCount}</strong> of ${attempted.length} attempts correct</p>
            <div class="actions">
              <button id="practice-restart" type="button">Restart queue</button>
              ${raw(diagnoseLink)}
            </div>
          </div>
        </section>`;
      var node = fromHTML(html);
      var section = node.firstElementChild;
      section.querySelector('#practice-restart').addEventListener('click', function () { practiceIndex = 0; navigate(); });
      return node;
    }
    var item = items[practiceIndex];
    var isMulti = Array.isArray(item.choices) && item.choices.length > 0;
    var choicesHtml = isMulti
      ? safe`<fieldset class="choices"><legend>Your answer</legend>${raw(item.choices.map(function (c) {
          return safe`<label><input type="checkbox" name="predict-choice" value="${c.letter}"><span><span class="choice-letter">${c.letter}.</span> ${c.text}</span></label>`;
        }).join(''))}</fieldset>`
      : safe`<div class="answer-field"><label class="field-label" for="predict-freeform">Your answer</label><textarea id="predict-freeform" rows="4" placeholder="The setting or action you would choose, and why"></textarea></div>`;
    var metaBadges = [safe`<span class="badge tone-accent">${String(item.variant_type || 'item').replace(/-/g, ' ')}</span>`];
    if (item.difficulty) metaBadges.push(safe`<span class="badge">Difficulty ${item.difficulty}</span>`);
    if (item.importance) metaBadges.push(safe`<span class="badge">Importance ${item.importance}</span>`);
    var changedCondition = item.changed_condition
      ? safe`<div class="callout changed-condition"><h3>Changed condition</h3><p>${item.changed_condition}</p></div>`
      : '';
    var html = safe`
      <section class="practice">
        <h2>Practice <span class="step">${practiceIndex + 1} of ${items.length}</span></h2>
        <div class="item-meta">${raw(metaBadges.join(''))}</div>
        ${raw(changedCondition)}
        <p class="prompt">${item.prompt || item.stem || ''}</p>
        ${raw(choicesHtml)}
        <fieldset class="confidence">
          <legend>Confidence <span class="muted">(optional)</span></legend>
          <div class="segmented">${raw(['low', 'medium', 'high'].map(function (c) { return safe`<label><input type="radio" name="confidence" value="${c}"><span>${c}</span></label>`; }).join(''))}</div>
        </fieldset>
        <div class="actions"><button id="reveal-practice-btn" type="button">Reveal answer</button></div>
        <div class="reveal hidden" id="practice-reveal"></div>
      </section>`;
    var node = fromHTML(html);
    var section = node.firstElementChild;
    var isLast = practiceIndex + 1 === items.length;
    section.querySelector('#reveal-practice-btn').addEventListener('click', function () {
      onPracticeReveal(section, item, isMulti, isLast);
    });
    return node;
  }

  function onPracticeReveal(section, item, isMulti, isLast) {
    var confidenceInput = section.querySelector('input[name="confidence"]:checked');
    var confidence = confidenceInput ? confidenceInput.value : null;
    var predicted, correct;
    var expected = Array.isArray(item.expected_answer)
      ? item.expected_answer.slice().sort()
      : [item.expected_answer].filter(Boolean).sort();

    if (isMulti) {
      var picked = Array.prototype.slice.call(section.querySelectorAll('input[name="predict-choice"]:checked')).map(function (i) { return i.value; }).sort();
      predicted = picked;
      correct = JSON.stringify(picked) === JSON.stringify(expected);
    } else {
      predicted = section.querySelector('#predict-freeform').value;
      correct = null; // resolved via self-report below
    }

    var attempt = {
      id: item.id + '-' + STATE.attempts.length + '-' + Date.now(),
      itemId: item.id,
      itemType: 'practiceItem',
      variantType: item.variant_type || null,
      timestamp: new Date().toISOString(),
      predicted: predicted,
      confidence: confidence,
      correct: correct,
      diagnosis: null,
    };

    section.querySelector('#reveal-practice-btn').setAttribute('disabled', 'disabled');
    section.querySelectorAll('textarea, input').forEach(function (el) { el.disabled = true; });
    var revealBox = section.querySelector('#practice-reveal');
    revealBox.classList.remove('hidden');
    var expectedList = Array.isArray(item.expected_answer) ? item.expected_answer : [item.expected_answer].filter(Boolean);
    var expectedAnswerHtml = expectedList.length > 1
      ? safe`<ul>${raw(expectedList.map(function (e) { return safe`<li>${e}</li>`; }).join(''))}</ul>`
      : safe`<p>${expectedList[0] || ''}</p>`;
    var reasoning = item.reasoning ? safe`<h3>Reasoning</h3><p>${item.reasoning}</p>` : '';
    var distractors = item.distractor_analysis
      ? safe`<h3>Why other options fail</h3><p class="distractors">${item.distractor_analysis}</p>`
      : '';

    revealBox.innerHTML = safe`
      <div class="panel answer">
